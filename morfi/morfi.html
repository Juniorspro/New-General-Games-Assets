<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#c99a5f">
<meta name="description" content="Morfi, de JXSTUDIOS: cortá el hilo y que el caramelo caiga en la boca de Morfi, la caja de cartón con hambre.">
<title>Morfi</title>
<style>
/* El juego se dibuja en el lienzo; los menús son HTML encima. De papel, como
   el juego: botones que son etiquetas de papel de colores con una costura
   de puntos, un poco torcidas y con sombra suave (pegadas arriba del
   cartón), sin bordes negros ni brillos de vidrio. */
:root {
  --tinta: #3b2a1a;
  --blanco: #ffffff;
  --crema: #fbf8f1;
  --kraft: #c99a5f; --kraft-osc: #9d7243;
  --rojo: #e8423a; --rojo-osc: #b8322b;
  --azul: #3f7fd1; --azul-osc: #2f62a6;
  --verde: #58b368; --verde-osc: #3f8a4d;
  --amarillo: #f5c542; --amarillo-osc: #c99a1c;
  --rosa: #ff6f9a; --oro: #ffd84a;
  --sombra: 0 3px 0 rgba(59, 42, 26, 0.35), 0 8px 14px rgba(59, 42, 26, 0.28);
  color-scheme: light;
}
html, body { margin: 0; height: 100%; background: #c99a5f; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--tinta); }
#juego { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#sonda { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
.pantalla {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.6vh, 14px);
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box;
  pointer-events: auto; text-align: center;
}
/* en el menú, lo que no es botón deja pasar el dedo al lienzo (ahí se corta el caramelo del menú) */
.pantalla.pasante { pointer-events: none; }
.pantalla.pasante button, .pantalla.pasante .bolsa { pointer-events: auto; }
.pantalla.oculto, .oculto { display: none !important; }
.velo { background: rgba(59, 42, 26, 0.42); }
h2 { margin: 0; font-size: clamp(24px, 4.4vh, 34px); font-weight: 900; color: var(--blanco); letter-spacing: 0.02em; text-shadow: 0 3px 0 var(--tinta); }
h2.grande { font-size: clamp(30px, 6vh, 46px); }
/* un título en una tira de papel con cinta */
h2.tira {
  color: var(--tinta); text-shadow: none; background: var(--crema); padding: 8px 26px 10px; transform: rotate(-1.5deg); box-shadow: var(--sombra); position: relative;
}
h2.tira::before { content: ""; position: absolute; top: -9px; left: 50%; width: 64px; height: 18px; margin-left: -32px; background: rgba(250, 240, 200, 0.8); transform: rotate(3deg); }

.boton {
  all: unset; cursor: pointer; box-sizing: border-box; border-radius: 10px; font-weight: 900; letter-spacing: 0.03em; text-align: center;
  color: #fff; text-shadow: 0 2px 0 rgba(59, 42, 26, 0.45); position: relative;
  outline: 2px dashed rgba(255, 255, 255, 0.55); outline-offset: -7px;
  background-image: linear-gradient(170deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 45%, rgba(0, 0, 0, 0.06));
  box-shadow: var(--sombra); transform: rotate(-1deg);
  transition: transform 0.06s ease, box-shadow 0.06s ease; -webkit-tap-highlight-color: transparent; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
}
.boton:nth-child(even) { transform: rotate(1deg); }
.boton:active { transform: translateY(3px) rotate(-1deg); box-shadow: 0 1px 0 rgba(59, 42, 26, 0.35), 0 3px 6px rgba(59, 42, 26, 0.25); }
.boton:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.boton.principal { min-width: min(72vw, 290px); padding: 13px 28px 14px; font-size: clamp(22px, 3.8vh, 30px); background-color: var(--rojo); }
.boton.principal small { font-size: 0.48em; font-weight: 800; opacity: 0.95; letter-spacing: 0.04em; margin-top: 2px; }
.boton.chico { min-width: min(34vw, 138px); padding: 11px 14px; font-size: clamp(14px, 2.3vh, 18px); background-color: var(--kraft-osc); }
.boton.azul { background-color: var(--azul); }
.boton.verde { background-color: var(--verde); }
.boton.amarillo { background-color: var(--amarillo); color: var(--tinta); text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); outline-color: rgba(59, 42, 26, 0.3); }
.boton.kraft { background-color: var(--kraft-osc); }
.boton.apagado { filter: grayscale(0.7) brightness(0.92); }
.fila { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

.titulo-idioma { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 6px; }
.titulo-idioma small { font-size: clamp(13px, 2vh, 16px); font-weight: 800; color: var(--blanco); opacity: 0.92; text-shadow: 0 2px 0 var(--tinta); letter-spacing: 0.01em; }

/* el menú y la elección de idioma: el cartel y Morfi los dibuja el lienzo arriba; los botones van abajo */
#menu, #idiomas { justify-content: flex-end; padding-bottom: max(40px, env(safe-area-inset-bottom)); }
.botonera { display: flex; flex-direction: column; align-items: center; gap: clamp(9px, 1.5vh, 14px); }
.bolsa {
  position: absolute; top: max(12px, env(safe-area-inset-top)); right: 14px; display: flex; align-items: center; gap: 6px;
  background: var(--crema); border-radius: 8px; padding: 5px 12px 5px 7px; font-weight: 900; font-size: 18px; box-shadow: var(--sombra); transform: rotate(2deg);
}
.bolsa.izq { right: auto; left: 14px; transform: rotate(-2deg); }
.estrellita { color: var(--amarillo); font-size: 20px; line-height: 1; text-shadow: 0 1px 0 var(--amarillo-osc); }
.moneda { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #ffe98a 0 40%, #f5c542 42% 100%); box-shadow: inset 0 -3px 0 #c99a1c; display: inline-block; }
.dato { margin: 0; font-weight: 900; color: var(--tinta); font-size: clamp(15px, 2.4vh, 19px); }
.dato:empty { display: none; }
.dato.oro { color: #b07a0a; }
.dato.nuevo { color: var(--verde-osc); }
.firma { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); margin: 0; font-size: 12px; letter-spacing: 0.2em; color: var(--crema); font-weight: 900; text-shadow: 0 2px 0 rgba(59, 42, 26, 0.5); }

/* las tres cajas */
.lista-cajas { display: flex; flex-direction: column; gap: 14px; width: min(88vw, 380px); }
.caja {
  all: unset; cursor: pointer; box-sizing: border-box; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; text-align: left;
  color: #fff; box-shadow: var(--sombra); outline: 2px dashed rgba(255, 255, 255, 0.55); outline-offset: -8px; position: relative;
  background-image: linear-gradient(170deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.08));
}
.caja:nth-child(1) { transform: rotate(-1.2deg); } .caja:nth-child(2) { transform: rotate(1deg); } .caja:nth-child(3) { transform: rotate(-0.6deg); }
.caja:active { transform: translateY(3px); }
.caja-carton { background-color: #b7864f; }
.caja-cuaderno { background-color: #5f96cf; }
.caja-regalo { background-color: #d95f7a; }
.caja.cerrada { filter: grayscale(0.55) brightness(0.85); cursor: default; }
.nombre-caja { font-size: clamp(20px, 3.2vh, 26px); font-weight: 900; text-shadow: 0 2px 0 rgba(59, 42, 26, 0.45); }
.dato-caja { font-size: 15px; font-weight: 800; opacity: 0.95; }

/* los diez niveles de una caja: papelitos cuadrados */
.grilla { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; width: min(92vw, 420px); padding: 6px; box-sizing: border-box; }
.nivelB {
  all: unset; cursor: pointer; aspect-ratio: 1; border-radius: 6px; background: var(--crema); box-shadow: var(--sombra); position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--tinta);
}
.nivelB:nth-child(odd) { transform: rotate(-2deg); } .nivelB:nth-child(even) { transform: rotate(1.5deg); }
.nivelB::before { content: ""; position: absolute; top: -6px; left: 50%; width: 26px; height: 11px; margin-left: -13px; background: rgba(250, 240, 200, 0.85); transform: rotate(-4deg); }
.nivelB .num { font-weight: 900; font-size: clamp(18px, 3vh, 24px); }
.nivelB .est { font-size: 12px; letter-spacing: 1px; color: #d49a0c; min-height: 14px; }
.nivelB.cerrado { background: #e8dcc4; color: #a08f78; cursor: default; }
.nivelB:active { transform: translateY(2px); }
.nivelB:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.grilla.caja-cuaderno .nivelB:not(.cerrado) { background: repeating-linear-gradient(#fbf8f1 0 14px, #d7e6f5 14px 15px); }
.grilla.caja-regalo .nivelB:not(.cerrado) { background: #ffe3ec; }

/* la tienda */
#tienda { justify-content: space-between; padding-top: max(62px, env(safe-area-inset-top)); }
.pestanas { display: flex; gap: 6px; background: var(--crema); border-radius: 10px; padding: 5px; box-shadow: var(--sombra); transform: rotate(-1deg); }
.pestana { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 7px; font-weight: 900; font-size: clamp(14px, 2.2vh, 17px); color: var(--tinta); }
.pestana.elegida { background: var(--azul); color: #fff; text-shadow: 0 2px 0 rgba(59, 42, 26, 0.35); }
.flechas { display: flex; align-items: center; justify-content: space-between; width: min(96vw, 520px); flex: 1; }
.flechas .hueco { flex: 1; }
.flecha {
  all: unset; cursor: pointer; width: 56px; height: 56px; border-radius: 50%; font-size: 40px; line-height: 50px; text-align: center; font-weight: 900; color: #fff;
  background: var(--azul); box-shadow: var(--sombra); box-sizing: border-box; outline: 2px dashed rgba(255, 255, 255, 0.5); outline-offset: -6px;
}
.flecha:active { transform: translateY(3px); }
.nombre { margin: 0; font-size: clamp(22px, 3.6vh, 28px); font-weight: 900; color: var(--blanco); text-shadow: 0 3px 0 var(--tinta); }
.aviso { margin: 0; min-height: 1.2em; font-weight: 800; color: var(--blanco); text-shadow: 0 2px 0 var(--tinta); }

.lista { display: grid; gap: 8px; width: min(92vw, 440px); background: var(--crema); box-shadow: var(--sombra); padding: 14px; border-radius: 6px; box-sizing: border-box; transform: rotate(0.6deg); }
.lista .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; }
.lista .ops { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.opcion { all: unset; cursor: pointer; padding: 6px 11px; border-radius: 7px; font-weight: 900; font-size: 13px; color: var(--tinta); }
.opcion.elegida { background: var(--azul); color: #fff; }
.opcion.peligro { color: var(--rojo); }

/* la tarjeta de la pausa y del final: papel blanco con cinta */
.tarjeta {
  display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.5vh, 13px); background: var(--crema); padding: 26px 22px 22px; border-radius: 4px;
  box-shadow: 0 4px 0 rgba(59, 42, 26, 0.3), 0 16px 30px rgba(59, 42, 26, 0.35); transform: rotate(-1.2deg); position: relative; width: min(86vw, 360px); box-sizing: border-box;
  animation: cae 0.35s cubic-bezier(0.2, 1.4, 0.4, 1);
}
.tarjeta::before { content: ""; position: absolute; top: -12px; left: 50%; width: 90px; height: 24px; margin-left: -45px; background: rgba(250, 240, 200, 0.85); transform: rotate(-3deg); }
.tarjeta h2 { color: var(--rojo); text-shadow: 0 3px 0 rgba(59, 42, 26, 0.25); }
/* adentro de la tarjeta (que ya está torcida) los botones van derechos: torcidos dos veces se pisaban */
.tarjeta .boton, .tarjeta .boton:nth-child(even) { transform: none; }
.tarjeta .boton:active { transform: translateY(3px); }
@keyframes cae { from { transform: translateY(-40px) rotate(-6deg); opacity: 0; } }
.estrellas-gano { display: flex; gap: 6px; font-size: clamp(48px, 9vh, 64px); line-height: 1; }
.estrellas-gano span { color: rgba(59, 42, 26, 0.16); display: inline-block; }
.estrellas-gano span:nth-child(2) { transform: translateY(-10px); }
.estrellas-gano span.llena { color: var(--amarillo); text-shadow: 0 3px 0 var(--amarillo-osc), 0 6px 10px rgba(59, 42, 26, 0.25); }
.estrellas-gano span.pega { animation: pega 0.45s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
.estrellas-gano span.pega:nth-child(1) { animation-delay: 0.35s; }
.estrellas-gano span.pega:nth-child(2) { animation-delay: 0.65s; }
.estrellas-gano span.pega:nth-child(3) { animation-delay: 0.95s; }
@keyframes pega { from { transform: scale(2.4) rotate(-40deg); opacity: 0; } }
.estrellas-gano span.pega:nth-child(2) { animation-name: pega2; }
@keyframes pega2 { from { transform: translateY(-10px) scale(2.4) rotate(40deg); opacity: 0; } to { transform: translateY(-10px); } }

/* pausa y reiniciar, arriba a la izquierda mientras se juega: botones redondos de papel */
.redondo {
  all: unset; position: absolute; top: max(10px, env(safe-area-inset-top)); width: 44px; height: 44px; border-radius: 50%; pointer-events: auto; cursor: pointer;
  background: var(--crema); box-shadow: var(--sombra); display: flex; align-items: center; justify-content: center; box-sizing: border-box; color: var(--tinta);
}
.arriba-izq { left: 12px; }
.arriba-izq2 { left: 64px; }
.redondo .barras { display: flex; gap: 5px; }
.redondo .barras span { width: 6px; height: 16px; background: var(--tinta); border-radius: 2px; }
.redondo .vuelta { font-size: 26px; font-weight: 900; line-height: 1; }
.redondo:active { transform: translateY(2px); }

/* más ancha que alta (el teléfono acostado, la compu): los botones abajo a la
   derecha; arriba de ellos cuelga el cartel y a la izquierda está Morfi (los
   dibuja el lienzo). Es la misma cuenta que main.js › acostado (W > H × 1,2). */
@media (min-aspect-ratio: 6/5) {
  #menu, #idiomas { align-items: flex-end; justify-content: flex-end; padding-right: max(24px, env(safe-area-inset-right)); padding-bottom: max(26px, env(safe-area-inset-bottom)); }
  .botonera { width: min(44vw, 520px); }
  #idiomas .boton.principal { min-width: 0; width: 100%; }
  .firma { right: max(24px, env(safe-area-inset-right)); width: min(44vw, 520px); }
}
/* acostado y bajo: todo más apretado */
@media (orientation: landscape) and (max-height: 560px) {
  .boton.principal { min-width: min(40vw, 280px); padding: 9px 20px; }
  .grilla { grid-template-columns: repeat(10, 1fr); width: min(86vw, 720px); gap: 8px; }
  .lista-cajas { flex-direction: row; width: min(94vw, 760px); }
  .caja { flex: 1; }
  #tienda { padding-top: max(12px, env(safe-area-inset-top)); gap: 6px; }
  .flechas { width: min(70vw, 520px); }
  .boton.chico { padding: 7px 12px; }
  .tarjeta { padding: 16px 20px; gap: 6px; }
  .estrellas-gano { font-size: 44px; }
}
@media (max-width: 360px) { .boton.chico { min-width: 40vw; padding: 10px 8px; } }
@media (prefers-reduced-motion: reduce) { .boton, .tarjeta, .estrellas-gano span.pega { transition: none; animation: none; } }

</style>
</head>
<body>
<canvas id="juego" aria-label="Morfi"></canvas>
<!-- la sonda mide la muesca del teléfono (main.js › medirTodo) -->
<div id="sonda" aria-hidden="true"></div>
<div id="ui">
  <!-- la primera vez, después del logo: el idioma (el título va en los tres) -->
  <section id="idiomas" class="pantalla pasante oculto">
    <div id="idiomasBotones" class="botonera">
      <h2 class="titulo-idioma">Elegí tu idioma<small lang="en">Choose your language</small><small lang="pt">Escolha seu idioma</small></h2>
      <button id="bIdioma_es" class="boton principal" lang="es">Español</button>
      <button id="bIdioma_en" class="boton principal azul" lang="en">English</button>
      <button id="bIdioma_pt" class="boton principal verde" lang="pt">Português</button>
    </div>
  </section>

  <section id="menu" class="pantalla pasante oculto">
    <div class="bolsa"><span class="moneda" aria-hidden="true"></span><span id="tMonedas">0</span></div>
    <div class="bolsa izq"><span class="estrellita" aria-hidden="true">★</span><span id="tEstrellasMenu">0</span></div>
    <div id="botonera" class="botonera">
      <button id="bJugar" class="boton principal"><span id="tJugar"></span><small id="tNivelJugar"></small></button>
      <div class="fila">
        <button id="bCajas" class="boton chico azul"></button>
        <button id="bTienda" class="boton chico amarillo"></button>
      </div>
      <button id="bAjustes" class="boton chico kraft"></button>
    </div>
    <p id="tFirma" class="firma"></p>
  </section>

  <section id="cajas" class="pantalla oculto">
    <div class="bolsa"><span class="moneda" aria-hidden="true"></span><span id="tMonedasCajas">0</span></div>
    <h2 id="tCajas" class="tira"></h2>
    <div id="listaCajas" class="lista-cajas"></div>
    <button id="bVolverCajas" class="boton chico kraft"></button>
  </section>

  <section id="niveles" class="pantalla oculto">
    <h2 id="tNiveles" class="tira"></h2>
    <div id="grillaNiveles" class="grilla"></div>
    <button id="bVolverNiveles" class="boton chico kraft"></button>
  </section>

  <section id="tienda" class="pantalla oculto">
    <div class="bolsa"><span class="moneda" aria-hidden="true"></span><span id="tMonedasTienda">0</span></div>
    <div class="pestanas" role="tablist">
      <button id="bPestMorfis" class="pestana" role="tab"></button>
      <button id="bPestDulces" class="pestana" role="tab"></button>
    </div>
    <div class="flechas">
      <button id="bAnterior" class="flecha" aria-label="anterior">‹</button>
      <div class="hueco"></div>
      <button id="bSiguiente" class="flecha" aria-label="siguiente">›</button>
    </div>
    <p id="tNombre" class="nombre"></p>
    <p id="tAviso" class="aviso"></p>
    <button id="bComprar" class="boton principal"></button>
    <button id="bVolverTienda" class="boton chico kraft"></button>
  </section>

  <section id="ajustes" class="pantalla oculto">
    <h2 id="tAjustes" class="tira"></h2>
    <div id="listaAjustes" class="lista"></div>
    <button id="bCerrarAjustes" class="boton principal"></button>
  </section>

  <button id="bPausa" class="redondo arriba-izq oculto" aria-label="pausa"><span class="barras"><span></span><span></span></span></button>
  <button id="bReiniciar" class="redondo arriba-izq2 oculto" aria-label="reiniciar"><span class="vuelta">↻</span></button>

  <section id="pausa" class="pantalla velo oculto">
    <div class="tarjeta">
      <h2 id="tPausa"></h2>
      <button id="bSeguir" class="boton principal"></button>
      <button id="bOtraVezPausa" class="boton chico azul"></button>
      <button id="bSalirPausa" class="boton chico kraft"></button>
    </div>
  </section>

  <section id="gano" class="pantalla velo oculto">
    <div class="tarjeta">
      <h2 id="tGano" class="grande"></h2>
      <div id="ganoEstrellas" class="estrellas-gano" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
      <p id="tGanoMonedas" class="dato oro"></p>
      <p id="tGanoAviso" class="dato nuevo"></p>
      <p id="tGanoFalta" class="dato"></p>
      <button id="bSiguienteNivel" class="boton principal"></button>
      <div class="fila">
        <button id="bOtraVez" class="boton chico azul"></button>
        <button id="bMenuGano" class="boton chico kraft"></button>
      </div>
    </div>
  </section>
</div>
<script>
/* ── cuerdas ── */
const M_cuerdas = (() => {
// La física de Morfi: hilos hechos de partículas (Verlet) y un caramelo que
// cuelga de ellos.
//
// Cada partícula guarda dónde está y dónde estaba un paso antes: la
// velocidad es la diferencia (así el hilo no se "explota" como con
// velocidades explícitas). Un hilo es una fila de partículas unidas de a dos
// por un largo fijo; en cada paso se corrigen esos largos varias vueltas. La
// punta de un hilo es un alfiler (masa infinita: no se mueve, o lo mueve el
// nivel) y la otra, el caramelo, que pesa más que un pedazo de hilo.
//
// El paso es fijo (1/120 s): con el mismo corte en el mismo paso, el
// caramelo cae siempre igual, y las soluciones de los niveles se pueden
// guardar y comprobar.
const PASO = 1 / 120;
const GRAVEDAD = 1150;
const VUELTAS = 20;          // vueltas de corrección de largos por paso
const TRAMO = 11;            // largo de cada pedacito de hilo
const AIRE_HILO = 0.992;     // cuánto frena el aire (por paso)
// un pedacito de hilo pesa 1/IM_HILO; el caramelo, 6 (partida.js): el hilo
// es de algodón, liviano, y un globo levanta al caramelo con hilo y todo
const IM_HILO = 12;

  // los pedazos sueltos se borran ya (al pasar por un sobre, el caramelo
  // aparece en otro lado y los pedazos lo tiraban para atrás).

      if (!h.vivo || h.p[h.p.length - 1] !== b) continue;
      if (h.suelto) { this.matar(h); continue; }
      const c = this.cortarEn(h, h.p.length - 2);

        // vueltas solas dejaban que el hilo se estirara como un elástico.

  // del alfiler, colgando, y el del caramelo, que se borra en un segundo.
  cortarEn(h, k) {

// ¿Se cruzan los tramos AB y CD? Cada tramo cuenta con su punta del final y
// sin la del principio: un tajo que termina justo arriba del hilo (con el

// mulberry32: el azar de los niveles va con semilla, así el nivel 7 es
// siempre el mismo nivel 7 (y una prueba se puede repetir igual).

    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

// de cuánto]. Con pasos fijos y una pantalla de 90 o 120 Hz, algunos cuadros
// quedan sin moverse y se ve a tirones (pasó en Víbora).

    for (let k = 0; k < n; k++) { const a = (k / n) * Math.PI * 2; this.q.push({ tipo: 'brillo', x, y, vx: Math.cos(a) * 110, vy: Math.sin(a) * 110, t: 0, vida: 0.45, tam: 4, color }); }
  }
  aire(x, y, ang) {
    const r = this.r;
    for (let k = 0; k < 7; k++) {
      const a = ang + (r() - 0.5) * 0.7, v = 260 + r() * 160;
      this.q.push({ tipo: 'aire', x: x + Math.cos(ang) * 14, y: y + Math.sin(ang) * 14, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, vida: 0.4 + r() * 0.2, a: a, tam: 8 + r() * 6 });
    }
  }
  pasar(dt) {
    for (const q of this.q) {
      q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.tipo === 'papel') { q.vx *= 1 - dt * 1.5; q.vy += 420 * dt; q.a += q.giro * dt; }
      else { q.vx *= 1 - dt * 4; q.vy *= 1 - dt * 4; }
    }
    this.q = this.q.filter((q) => q.t < q.vida);
  }
  dibujar(g, cam, e) {
    for (const q of this.q) {
      const [x, y] = aP(cam, q.x, q.y), k = 1 - q.t / q.vida;

        g.restore();
      } else if (q.tipo === 'brillo') {
        g.globalAlpha = k; g.fillStyle = q.color; estrellaDe(g, x, y, q.tam * e * (0.5 + k * 0.6), 4, 0.35);

        g.globalAlpha = k * 0.7; g.strokeStyle = '#fdf6e6'; g.lineWidth = 2.2 * e; g.lineCap = 'round';

      }
    }
    g.globalAlpha = 1;
  }

/* ── entrada ── */
const M_entrada = (() => {
// El dedo corta: cada dedo apoyado deja un tramo (de dónde estaba a dónde
// está) y main.js corta los hilos que ese tramo cruce. Andan varios dedos a
// la vez (con dos se cortan dos hilos juntos). Apoyar el dedo también es un
// toque: revienta el globo o hace soplar el abanico que esté abajo.
//  - Mouse: arrastrar con el botón apretado.
// Todo en píxeles de CSS; main.js lo pasa al tablero.
const VIDA_RASTRO = 0.22;      // cuánto dura el rastro blanco del dedo, en segundos

function crearEntrada(lienzo) {
  const e = { activo: false, dedos: new Map(), cortes: [], toques: [], rastros: new Map(), usos: 0 };
  const ahora = () => performance.now() / 1000;

  lienzo.addEventListener('pointerdown', (ev) => {
    if (!e.activo) return;
    ev.preventDefault();
    lienzo.setPointerCapture?.(ev.pointerId);
    e.usos++;
    e.dedos.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    e.toques.push([ev.clientX, ev.clientY]);
    e.rastros.set(ev.pointerId, [{ x: ev.clientX, y: ev.clientY, t: ahora() }]);
  }, { passive: false });
  lienzo.addEventListener('pointermove', (ev) => {
    const d = e.dedos.get(ev.pointerId);
    if (!e.activo || !d) return;
    // los movimientos juntados por el navegador entre cuadro y cuadro: un
    // tajo rápido no se come un hilo por pasar entre dos cuadros
    const lista = ev.getCoalescedEvents?.() || [];
    const rastro = e.rastros.get(ev.pointerId) || [];
    for (const p of lista.length ? lista : [ev]) {
      if (p.clientX === d.x && p.clientY === d.y) continue;
      e.cortes.push([d.x, d.y, p.clientX, p.clientY]);
      d.x = p.clientX; d.y = p.clientY;
      rastro.push({ x: d.x, y: d.y, t: ahora() });
    }
    e.rastros.set(ev.pointerId, rastro);
  });
  const soltar = (ev) => { e.dedos.delete(ev.pointerId); };
  lienzo.addEventListener('pointerup', soltar);
  lienzo.addEventListener('pointercancel', soltar);
  lienzo.addEventListener('lostpointercapture', soltar);
  lienzo.addEventListener('contextmenu', (ev) => ev.preventDefault());
  for (const t of ['touchstart', 'touchmove', 'touchend']) lienzo.addEventListener(t, (ev) => { if (e.activo) ev.preventDefault(); }, { passive: false });
  window.addEventListener('blur', () => e.dedos.clear());

  // los tramos y los toques desde la última vez (y se vacían)
  e.sacarCortes = () => { const r = e.cortes; e.cortes = []; return r; };
  e.sacarToques = () => { const r = e.toques; e.toques = []; return r; };
  // los rastros vivos, para dibujarlos: listas de puntos con su edad (0 a 1)
  e.rastrosVivos = () => {
    const t = ahora(), out = [];
    for (const [id, r] of e.rastros) {
      const vivos = r.filter((p) => t - p.t < VIDA_RASTRO);
      if (vivos.length) { e.rastros.set(id, vivos); out.push(vivos.map((p) => ({ x: p.x, y: p.y, edad: (t - p.t) / VIDA_RASTRO }))); }
      else e.rastros.delete(id);
    }
    return out;
  };
  e.soltarTodo = () => { e.dedos.clear(); e.cortes = []; e.toques = []; e.rastros.clear(); };
  return e;
}
return { crearEntrada };
})();

/* ── pieles ── */
const M_pieles = (() => {
// Lo que se compra en la tienda: cómo se ve Morfi (morfi.js › PIELES_MORFI)
// y el caramelo (dibujo.js › CARAMELOS), con su precio en monedas. Pasar las
// tres cajas con todas las estrellas da 900: alcanza para casi todo, y lo
// que falta se junta jugando de nuevo (cada nivel ganado otra vez da 2).
const MORFIS = [
  { id: 'kraft', precio: 0 }, { id: 'regalo', precio: 50 }, { id: 'zapatos', precio: 70 }, { id: 'pizza', precio: 90 },
  { id: 'mudanza', precio: 110 }, { id: 'menta', precio: 140 }, { id: 'noche', precio: 170 }, { id: 'jx', precio: 240 },
];
const DULCES = [
  { id: 'rojo', precio: 0 }, { id: 'frutilla', precio: 25 }, { id: 'menta', precio: 35 }, { id: 'uva', precio: 45 },
  { id: 'limon', precio: 60 }, { id: 'dulce', precio: 75 }, { id: 'arcoiris', precio: 120 },
];
// las monedas de un nivel ganado: la primera vez 10 y 5 por estrella; después, 5 por cada estrella nueva y 2 por ganar
function premio(antes, estrellas) {
  if (antes < 0) return 10 + 5 * estrellas;
  return 2 + 5 * Math.max(0, estrellas - antes);
}
const BONO_CAJA = 50;          // todas las estrellas de una caja
return { MORFIS, DULCES, premio, BONO_CAJA };
})();

/* ── guardado ── */
const M_guardado = (() => {
// Lo que se guarda en el teléfono (en try: sin localStorage, el juego anda
// igual sin guardar). Lo leído se valida campo por campo.
const { MORFIS, DULCES } = M_pieles;
const { NIVELES, CAJAS } = M_niveles;
const CLAVE = 'morfi-1';

function base() {
  return {
    mejor: NIVELES.map(() => -1),   // las estrellas de cada nivel (-1: todavía no se ganó)
    monedas: 0, morfi: 'kraft', dulce: 'rojo',
    morfis: ['kraft'], dulces: ['rojo'],
    ayudas: [],                     // las ayudas ya vistas
    bonos: [],                      // las cajas que ya dieron el premio de todas las estrellas
    partidas: 0,
    ajustes: { musica: true, sonido: true, vibrar: true, calidad: 'auto', idioma: null },
  };
}

const num = (v, a, b, d) => (Number.isFinite(v) ? Math.max(a, Math.min(b, Math.floor(v))) : d);
const lista = (v, validos, siempre) => [...new Set([...(siempre ? [siempre] : []), ...(Array.isArray(v) ? v.filter((x) => validos.includes(x)) : [])])];

function validar(d) {
  const b = base();
  if (!d || typeof d !== 'object') return b;
  if (Array.isArray(d.mejor)) b.mejor = NIVELES.map((_, i) => num(d.mejor[i], -1, 3, -1));
  b.monedas = num(d.monedas, 0, 1e9, 0);
  b.morfis = lista(d.morfis, MORFIS.map((p) => p.id), 'kraft');
  b.dulces = lista(d.dulces, DULCES.map((p) => p.id), 'rojo');
  if (b.morfis.includes(d.morfi)) b.morfi = d.morfi;
  if (b.dulces.includes(d.dulce)) b.dulce = d.dulce;
  b.ayudas = lista(d.ayudas, NIVELES.map((n) => n.ayuda).filter(Boolean));
  b.bonos = lista(d.bonos, CAJAS.map((c) => c.id));
  b.partidas = num(d.partidas, 0, 1e9, 0);
  const a = d.ajustes || {};
  for (const k of ['musica', 'sonido', 'vibrar']) if (typeof a[k] === 'boolean') b.ajustes[k] = a[k];
  if (['auto', 'alta', 'baja'].includes(a.calidad)) b.ajustes.calidad = a.calidad;
  if (['es', 'en', 'pt'].includes(a.idioma)) b.ajustes.idioma = a.idioma;
  return b;
}

// cuántas estrellas hay en total y en una caja
const estrellasTotal = (d) => d.mejor.reduce((a, e) => a + Math.max(0, e), 0);
const estrellasCaja = (d, c) => d.mejor.slice(c * 10, c * 10 + 10).reduce((a, e) => a + Math.max(0, e), 0);
// ¿se puede jugar? La caja se abre con estrellas; adentro, de a uno
const cajaAbierta = (d, c) => estrellasTotal(d) >= CAJAS[c].estrellas;
const nivelAbierto = (d, i) => cajaAbierta(d, Math.floor(i / 10)) && (i % 10 === 0 || d.mejor[i - 1] >= 0);

function cargar() { try { return validar(JSON.parse(localStorage.getItem(CLAVE))); } catch { return base(); } }
function guardar(d) { try { localStorage.setItem(CLAVE, JSON.stringify(d)); return true; } catch { return false; } }
return { base, validar, estrellasTotal, estrellasCaja, cajaAbierta, nivelAbierto, cargar, guardar };
})();

/* ── hud ── */
const M_hud = (() => {
// Lo que se dibuja arriba del tablero mientras se juega: la etiqueta del
// nivel en una tira de papel roto, las tres estrellas (las que faltan son un
// hueco; la que se junta salta a su lugar), la nota de ayuda de los niveles
// que enseñan algo, el rastro blanco del dedo y el cartelito de "¡se cayó!".
const { papelRoto, cinta, estrellaDe, pegar } = M_papel;
const { estrella, estrellaVacia } = M_dibujo;

    d.appendChild(ops); listaA.appendChild(d);
  };
  const siNo = [[true, tr('si')], [false, tr('no')]];
  fila(tr('musica'), siNo, a.musica, (v) => (a.musica = v));
  fila(tr('sonido'), siNo, a.sonido, (v) => (a.sonido = v));
  fila(tr('vibrar'), siNo, a.vibrar, (v) => { a.vibrar = v; if (v) vibrar(30); });
  fila(tr('calidad'), [['auto', tr('auto')], ['alta', tr('alta')], ['baja', tr('baja')]], a.calidad, (v) => { a.calidad = v; medir(); });
  fila(tr('idioma'), IDIOMAS.map((l) => [l, l.toUpperCase()]), tr.actual(), (v) => { a.idioma = v; tr.poner(v); });
  // borrar el progreso pide dos toques (los ajustes y el idioma quedan)
  fila('', [['borrar', borrarArmado ? tr('borrarSeguro') : tr('borrar'), 'peligro']], null, () => {
    if (!borrarArmado) { borrarArmado = true; return; }
    borrarArmado = false;
    const nuevo = base(); nuevo.ajustes = datos.ajustes; datos = nuevo;
  });
}

for (const l of IDIOMAS) boton('bIdioma_' + l, () => { datos.ajustes.idioma = l; tr.poner(l); guardarTodo(); aMenu(); });
boton('bJugar', () => jugar(proximoNivel()));
boton('bCajas', () => { armarCajas(); estado = 'cajas'; entrada.activo = false; mostrar('cajas'); });
boton('bTienda', () => abrirTienda());
boton('bAjustes', () => { borrarArmado = false; armarAjustes(); estado = 'ajustes'; entrada.activo = false; mostrar('ajustes'); });
boton('bVolverCajas', aMenu);
boton('bVolverNiveles', () => { armarCajas(); estado = 'cajas'; mostrar('cajas'); });
boton('bVolverTienda', aMenu);
boton('bCerrarAjustes', aMenu);
boton('bPestMorfis', () => abrirTienda('morfis'));
boton('bPestDulces', () => abrirTienda('dulces'));
boton('bAnterior', () => moverTienda(-1));
boton('bSiguiente', () => moverTienda(1));
$('bComprar').addEventListener('click', comprarOUsar);
boton('bPausa', pausar);
boton('bReiniciar', reiniciar);
boton('bSeguir', seguir);
boton('bOtraVezPausa', reiniciar);
boton('bSalirPausa', aMenu);
boton('bOtraVez', reiniciar);
boton('bMenuGano', aMenu);
boton('bSiguienteNivel', () => jugar(nivelI + 1));
// el primer toque en cualquier lado despierta el audio (tiene que ser dentro del evento)
addEventListener('pointerdown', () => sonido.despertar(), { capture: true });
addEventListener('keydown', (ev) => {
  sonido.despertar();
  if (estado === 'intro') intro?.saltear();
  else if (estado === 'tienda' && ev.code === 'ArrowLeft') moverTienda(-1);
  else if (estado === 'tienda' && ev.code === 'ArrowRight') moverTienda(1);
  else if (estado === 'juego' && ev.code === 'KeyR' && !ev.repeat) reiniciar();
  // la pausa se maneja acá: si no, la misma tecla que la saca la vuelve a poner
  else if ((ev.code === 'Escape' || ev.code === 'KeyP') && !ev.repeat) {
    if (estado === 'juego') pausar();
    else if (estado === 'pausa') seguir();
    else if (['cajas', 'tienda', 'ajustes'].includes(estado) && ev.code === 'Escape') aMenu();
    else if (estado === 'niveles' && ev.code === 'Escape') { armarCajas(); estado = 'cajas'; mostrar('cajas'); }
  }
}, { capture: true });
lienzo.addEventListener('pointerdown', () => { if (estado === 'intro') intro?.saltear(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pausar(); sonido.lava(0); } else sonido.lava(0.9); });

// ── los eventos de la partida: sonido, papelitos y la cara de Morfi ────────
const COLORES_PAPEL = ['#e8423a', '#f5c542', '#3f7fd1', '#58b368', '#ff93b3'];
function evento(ev, fx, m, p) {
  const col = CARAMELOS[datos.dulce] || CARAMELOS.rojo;
  switch (ev.tipo) {
    case 'corte': sonido.tocar('corte'); fx.papelitos(ev.x, ev.y, 6, ['#e2c48f', '#fff4dc', '#b68e55'], { vel: 90, arriba: 20, tam: 2 }); vibrar(6); break;
    case 'estrella': sonido.tocar('estrella', { n: ev.n }); fx.brillos(ev.x, ev.y, 10); fx.papelitos(ev.x, ev.y, 8, ['#ffd84a', '#f0b21c'], { vel: 120, tam: 2.4 }); if (p === partida) hud.tomadas[ev.n - 1] = t; vibrar(10); break;
    case 'clip': sonido.tocar('clip'); break;
    case 'globo': sonido.tocar('globo'); break;
    case 'pop': sonido.tocar('pop'); fx.papelitos(ev.x, ev.y, 14, ['#9ad0f5', '#7dbbea', '#b8def8'], { vel: 170, tam: 3.2 }); vibrar(14); break;
    case 'soplo': sonido.tocar('soplo'); fx.aire(ev.x, ev.y, ev.ang); break;
    case 'sobre': sonido.tocar('sobre'); fx.papelitos(ev.x2, ev.y2, 6, ['#f7f1e3', '#cfc3a8'], { vel: 80, tam: 2.5 }); break;
    case 'boing': sonido.tocar('boing', { fuerza: ev.fuerza }); break;
    case 'comido': sonido.tocar('comer'); m.comer(); fx.papelitos(ev.x, ev.y - 10, 22, COLORES_PAPEL, { vel: 220, arriba: 120 }); vibrar([18, 30, 18]); break;
    case 'roto': sonido.tocar('roto'); m.llorar(); fx.papelitos(ev.x, ev.y, 18, [col.a, col.b, col.papel], { vel: 190, tam: 3 }); vibrar([30, 20, 50]); if (p === partida) aviso = { texto: tr('roto'), t: 0 }; break;
    case 'perdido': sonido.tocar('perdido'); m.llorar(); if (p === partida) aviso = { texto: tr('perdido'), t: 0 }; break;
  }
}
function eventoMenu(ev) {
  if (ev.tipo === 'corte') { sonido.tocar('corte'); vibrar(6); }
  else if (ev.tipo === 'comido') { sonido.tocar('comer'); vibrar(15); }
}

// ── el paso ────────────────────────────────────────────────────────────────
let camJuego = null;
const aTablero = (cam, x, y) => [(x * dpr - cam.ox) / cam.esc, (y * dpr - cam.oy) / cam.esc];
function paso(dt) {
  t += dt;
  if (estado === 'espera') return;
  if (estado === 'intro') { intro.pasar(dt, W, H); return; }
  if (estado === 'menu' || estado === 'idiomas') {
    // el dedo en el menú: el tajo corta el hilo del caramelo del menú y empuja el cartel
    entrada.sacarToques();
    for (const [x1, y1, x2, y2] of entrada.sacarCortes()) { fondoMenu.cortar(x1 * dpr, y1 * dpr, x2 * dpr, y2 * dpr); fondoMenu.mover(x2 - x1); }
  }
  if (!['juego', 'pausa', 'gano'].includes(estado)) fondoMenu.pasar(dt);
  if (estado === 'tienda') tienda.muestra.pasar(dt, { blanco: tienda.tipo === 'dulces' ? [0, -170] : [Math.sin(t * 0.8) * 60, -80], ganas: tienda.tipo === 'dulces' ? 0.55 : 0 });
  if (!partida || estado === 'pausa') return;
  const p = partida;
  if (estado === 'juego' && p.estado === 'juego' && camJuego) {
    for (const [x, y] of entrada.sacarToques()) p.tocar(...aTablero(camJuego, x, y));
    for (const [x1, y1, x2, y2] of entrada.sacarCortes()) p.cortar(...aTablero(camJuego, x1, y1), ...aTablero(camJuego, x2, y2));
  } else { entrada.sacarToques(); entrada.sacarCortes(); }
  alfa = p.avanzar(dt);
  for (const ev of p.sacarEventos()) evento(ev, efectos, morfi, p);
  morfi.pasar(dt, { blanco: p.estado === 'juego' ? [p.x - p.morfi.x, p.y - p.morfi.y] : null, ganas: p.apetito() });
  efectos.pasar(dt);
  if (aviso) aviso.t += dt;
  if (ayuda) {
    ayuda.t += dt;
    if (entrada.usos > 0 && ayuda.hasta > ayuda.t + 2.5) ayuda.hasta = ayuda.t + 2.5;
  }
  if (estado === 'juego' && p.estado === 'comido' && p.tFin > 1.35) ganar();
  // se cayó o se rompió: como en los juegos del género, vuelve a empezar solo
  if (estado === 'juego' && (p.estado === 'roto' || p.estado === 'perdido') && p.tFin > 1.25) jugar(nivelI);
}

// ── el dibujo ──────────────────────────────────────────────────────────────
function dibujar() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  if (estado === 'espera') { g.fillStyle = '#b7864f'; g.fillRect(0, 0, W, H); return; }
  if (estado === 'intro') { intro.dibujar(g, W, H); return; }
  if (partida && ['juego', 'pausa', 'gano'].includes(estado)) {
    const arriba = arribaCss() * dpr;
    camJuego = camaraTablero(W, H, { margenArriba: arriba + 50 * dpr });
    const c = Math.floor(nivelI / 10);
    dibujarNivel(g, W, H, partida, camJuego, { t, alfa, morfi, pielCaramelo: datos.dulce, efectos, mundo: CAJAS[c].id, dpr });
    if (estado !== 'gano') {
      const ay = ayuda && ayuda.t < ayuda.hasta ? { texto: ayuda.texto, alfa: clamp(ayuda.t / 0.3, 0, 1) * clamp((ayuda.hasta - ayuda.t) / 0.4, 0, 1) } : null;
      dibujarHud(g, W, H, { p: partida, u: dpr, t, hud, arriba, ayuda: ay, aviso, nombreCaja: nombreCaja(c) });
      dibujarRastros(g, entrada.rastrosVivos().map((r) => r.map((q2) => ({ x: q2.x * dpr, y: q2.y * dpr, edad: q2.edad }))), dpr);
    }
    return;
  }
  const acostado = W > H * 1.2;
  if (estado === 'tienda') {
    g.drawImage(fondo('carton', W, H, dpr), 0, 0);
    const cx = W / 2, piso = acostado ? H * 0.72 : H * 0.62, s = Math.min(W, H) / 250;
    if (tienda.tipo === 'dulces') {
      // el caramelo elegido colgado de un hilo y Morfi abajo, con ganas
      const p = lista()[tienda.i], cy = piso - 150 * s, bal = Math.sin(t * 1.5) * 0.12;
      const hx = cx + Math.sin(bal) * 70 * s, hy = cy - 70 * s + Math.cos(bal) * 70 * s;
      g.strokeStyle = '#e2c48f'; g.lineWidth = 3.2 * s; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx, cy - 70 * s); g.lineTo(hx, hy); g.stroke();
      pegar(g, spriteCaramelo(s * 1.6, p.id), hx, hy + 6 * s, { ang: bal * 0.6, alto: 5 * s });
      tienda.muestra.dibujar(g, cx, piso, s * 0.9);
    } else tienda.muestra.dibujar(g, cx, piso, s * 1.3);
    pintarGrano(g, W, H, 0.35);
    return;
  }
  // los menús: parado, el cartel arriba, Morfi con su caramelo en el medio (si
  // hay lugar) y los botones abajo; acostado (o en la compu), Morfi grande a
  // la izquierda y el cartel arriba de los botones, a la derecha
  const arriba = arribaCss() * dpr;
  let zona, escena = null;
  if (acostado) {
    const r = $(estado === 'idiomas' ? 'idiomasBotones' : 'botonera').getBoundingClientRect();
    const cx = r.width ? ((r.left + r.right) / 2) * dpr : W * 0.74, techo = r.height ? r.top * dpr : H * 0.55;
    // el cartel ocupa de los alfileres a la tira del subtítulo unos 0,86 de su ancho
    const ancho = Math.max(120 * dpr, Math.min(W * 0.38, H * 0.6, (techo - arriba - 48 * dpr) / 0.86));
    zona = { cx, y: arriba + 40 * dpr + ancho * 0.3, ancho };
    if (estado === 'menu' || estado === 'idiomas') escena = { x: W * 0.03, y: arriba, w: W * 0.46, h: H - arriba - 10 * dpr };
  } else {
    const ancho = Math.min(W * 0.86, 460 * dpr);
    // el cartel cuelga debajo de las bolsas de monedas y estrellas (si no, tapaban los alfileres)
    zona = { cx: W / 2, y: arriba + 50 * dpr + ancho * 0.3, ancho };
    if (estado === 'menu' || estado === 'idiomas') {
      const abajoCartel = zona.y + ancho * 0.62, tope = (estado === 'menu' ? topeBotones : $('idiomasBotones').getBoundingClientRect().top || Infinity) * dpr;
      if (tope - abajoCartel > 110 * dpr) escena = { x: W * 0.08, y: abajoCartel, w: W * 0.84, h: Math.min(tope - abajoCartel - 6 * dpr, (W * 0.84 * ESCENA.h) / ESCENA.w) };
    }
  }
  // en las cajas, los niveles y los ajustes el cartel no va: se pisaba con el título
  const conCartel = estado === 'menu' || estado === 'idiomas';
  fondoMenu.dibujar(g, W, H, dpr, { zona: conCartel ? zona : null, escena, pielMorfi: datos.morfi, pielDulce: datos.dulce, subtitulo: tr('subtitulo') });
  if (estado === 'menu' || estado === 'idiomas') dibujarRastros(g, entrada.rastrosVivos().map((r) => r.map((q2) => ({ x: q2.x * dpr, y: q2.y * dpr, edad: q2.edad }))), dpr);
  if (['cajas', 'niveles', 'ajustes'].includes(estado)) { g.fillStyle = 'rgba(40,24,8,0.28)'; g.fillRect(0, 0, W, H); }
}

// ── el bucle, con calidad que se ajusta sola ──────────────────────────────
let ultimo = performance.now(), lento = 0;
const manual = q.has('pausa');
function cuadro(ahora) {
  requestAnimationFrame(cuadro);
  const dtReal = Math.min(0.1, (ahora - ultimo) / 1000);
  ultimo = ahora;
  // si los cuadros tardan mucho seguido, se baja la resolución (un cuarto de punto por vez)
  if (datos.ajustes.calidad === 'auto' && estado === 'juego') {
    lento = dtReal > 0.026 ? lento + 1 : Math.max(0, lento - 1);
    if (lento > 45 && dprTope > 1) { dprTope = Math.max(1, dprTope - 0.25); lento = 0; medir(); }
  }
  if (!manual) {
    const [n, d] = trozos(dtReal, PASO);
    for (let k = 0; k < n; k++) paso(d);
  }
  dibujar();
}

textos();
const conIntro = q.has('intro') || !(q.has('directo') || q.has('pausa') || q.has('sinintro'));
// La intro arranca apenas abre, sin tocar nada. Si el navegador deja sonar
// sin un toque, el audio nace andando y la música va en fase; si no (lo
// normal), la intro va muda y el primer toque la saltea y prende el sonido.
if (conIntro) { mostrar(null); entrar(); }
else {
  aMenu();
  const d = q.get('directo') || '';
  if (d.startsWith('nivel:')) { const i = NIVELES.findIndex((n) => n.id === d.slice(6)); jugar(i >= 0 ? i : 0); }
}
requestAnimationFrame(cuadro);

// Las sondas para las pruebas (pruebas/juego.mjs).
window.__G = {
  get estado() { return estado; }, get partida() { return partida; }, get datos() { return datos; }, get intro() { return intro; },
  get tienda() { return tienda; }, get fondo() { return fondoMenu; }, get morfi() { return morfi; }, get hud() { return hud; }, get camJuego() { return camJuego; },
  get nivelI() { return nivelI; }, get ayuda() { return ayuda; },
  pasos(n, dib = false) { for (let k = 0; k < n; k++) paso(PASO); if (dib) dibujar(); },
  dibujar, entrar, jugar, aMenu, pausar, seguir, reiniciar, elegirIdioma, abrirTienda, moverTienda, comprarOUsar, armarCajas, armarNiveles, entrada, sonido, tr,
  get W() { return W; }, get H() { return H; }, get dpr() { return dpr; },
};
window.listo = true;

})();

</script>
