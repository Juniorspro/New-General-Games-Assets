<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07060a">
<meta name="mobile-web-app-capable" content="yes">
<title>Shumio's Depths</title>
<!--
  SHUMIO'S DEPTHS — un roguelike de salas con lágrimas, en pixel art dibujado a mano por código.
  Un solo archivo, sin red. Siempre en horizontal (con el teléfono parado, se dibuja de costado); pensado para un TCL 20 SE: 1600×720.
  El código vive en shumio/src/*.js; este archivo lo arma `node construir.mjs`.
-->
<style>
  html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script>

// ══════════ 00-base.js ══════════
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// SHUMIO'S DEPTHS · la base: cuentas, azar con semilla, constantes de la sala.
// ─────────────────────────────────────────────────────────────────────────────

const lim = (x, a, b) => (x < a ? a : x > b ? b : x);
const sig = (x) => (x < 0 ? -1 : x > 0 ? 1 : 0);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/** Un rng chico y rápido (mulberry32). */
function mulberry(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashTexto(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}

// Dos azares: el del MUNDO (con semilla: la misma semilla, la misma partida) y el VISUAL
// (partículas, temblores: Math.random, así no corre la secuencia del mundo). Guía 2D § 9.
let rnd = mulberry(1);
const A = {
  f: () => rnd(),
  ent: (a, b) => a + Math.floor(rnd() * (b - a + 1)),
  uno: (arr) => arr[Math.floor(rnd() * arr.length)],
  si: (p) => rnd() < p,
  pesos(tabla) {   // [[valor, peso], …]
    let s = 0; for (const [, p] of tabla) s += p;
    let r = rnd() * s;
    for (const [v, p] of tabla) { if ((r -= p) < 0) return v; }
    return tabla[tabla.length - 1][0];
  },
  mezclar(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
};
const V = { f: Math.random, ent: (a, b) => a + Math.floor(Math.random() * (b - a + 1)), uno: (arr) => arr[Math.floor(Math.random() * arr.length)] };

// ── la sala: 13×7 baldosas de 24 px, con muros (el de arriba más alto: la perspectiva) ──
const T = 24, COLS = 13, FILAS = 7;
const MURO_L = 28, MURO_A = 32, MURO_B = 24;
const SALA_W = MURO_L * 2 + COLS * T;      // 368
const SALA_H = MURO_A + MURO_B + FILAS * T; // 224
const IX0 = MURO_L, IY0 = MURO_A, IX1 = MURO_L + COLS * T, IY1 = MURO_A + FILAS * T;
/** El centro de la baldosa (c, f) en coordenadas de la sala. */
const cx = (c) => IX0 + c * T + T / 2;
const cy = (f) => IY0 + f * T + T / 2;
const celdaX = (x) => Math.floor((x - IX0) / T);
const celdaY = (y) => Math.floor((y - IY0) / T);

// las puertas: arriba, derecha, abajo, izquierda (en el centro de cada muro)
const ARRIBA = 0, DERECHA = 1, ABAJO = 2, IZQUIERDA = 3;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const PUERTA = [
  { x: SALA_W / 2, y: MURO_A - 6 },
  { x: SALA_W - MURO_L + 6, y: IY0 + FILAS * T / 2 },
  { x: SALA_W / 2, y: SALA_H - MURO_B + 6 },
  { x: MURO_L - 6, y: IY0 + FILAS * T / 2 },
];
const opuesta = (d) => (d + 2) % 4;

const CUADRO = 1000 / 60;

// ══════════ 01-pantalla.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LA PANTALLA: el mundo se dibuja chico (en píxeles de juego) y se agranda con una
// escala ENTERA (×2, ×3…), nunca ×2,7: si no, los píxeles salen de distinto tamaño y
// todo tiembla (guía 2D § 2). En un TCL 20 SE acostado (1600×720 píxeles de pantalla)
// da ×3 y un mundo de 534×240: entra la sala entera (368×224) y sobran los costados
// para los pulgares.
// ─────────────────────────────────────────────────────────────────────────────

const lienzo = document.getElementById("lienzo");
const cxP = lienzo.getContext("2d", { alpha: false });
const cvM = document.createElement("canvas");
const cxM = cvM.getContext("2d", { alpha: false });
const PANT = { W: 444, H: 200, PX: 3.6, k: 3, dw: 1600, dh: 720, ox: 0, oy: 0, vertical: false, salaX: 0, salaY: 0, girado: false, cssW: 0 };
// Medido en el video: en el original entran enteros los dos muros (arriba y abajo, con sus puertas)
// y el piso ocupa ~74 % del alto; la barra del jefe va sobre el muro de abajo (~95 % del alto).
// La sala mide 224 de alto: con 228 entra toda, con un filito de margen.
const VISTA_H = SALA_H + 4;
const ANCHO_MIN = SALA_W + 8;  // y de ancho, como mínimo: nunca se corta la sala por los costados
const cvK = document.createElement("canvas"), cxK = cvK.getContext("2d", { alpha: false });

function medir() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const vw = innerWidth, vh = innerHeight;
  // el juego es SIEMPRE horizontal: con el teléfono parado, el lienzo se gira 90° (se juega de costado
  // aunque el navegador no deje trabar la orientación)
  const girar = vh > vw * 1.05;
  if (girar !== PANT.girado || PANT.cssW !== (girar ? vh : vw)) {
    PANT.girado = girar;
    const st = lienzo.style;
    if (girar) { st.width = vh + "px"; st.height = vw + "px"; st.transformOrigin = "0 0"; st.transform = `translateX(${vw}px) rotate(90deg)`; }
    else { st.width = "100%"; st.height = "100%"; st.transform = ""; }
  }
  const cw = girar ? vh : vw, ch = girar ? vw : vh;
  PANT.cssW = cw;
  const dw = Math.round(cw * dpr), dh = Math.round(ch * dpr);
  PANT.vertical = false;
  // la cámara, como en el original: la sala entera llena el alto de la pantalla y el HUD va encima
  // de la pared y del margen de los costados
  let PX = dh / VISTA_H;
  if (dw / PX < ANCHO_MIN) PX = dw / ANCHO_MIN;
  if (dw === PANT.dw && dh === PANT.dh && Math.abs(PX - PANT.PX) < 1e-6 && lienzo.width === dw) return;
  PANT.dw = dw; PANT.dh = dh; PANT.PX = PX;
  lienzo.width = dw; lienzo.height = dh;
  PANT.W = Math.ceil(dw / PX); PANT.H = Math.ceil(dh / PX);
  PANT.ox = Math.floor((dw - PANT.W * PX) / 2); PANT.oy = Math.floor((dh - PANT.H * PX) / 2);
  cvM.width = PANT.W; cvM.height = PANT.H;
  // el agrandado en dos pasos: primero por un entero (píxeles duros), después el resto suavizado
  PANT.k = Math.max(1, Math.floor(PX));
  cvK.width = PANT.W * PANT.k; cvK.height = PANT.H * PANT.k;
  cxM.imageSmoothingEnabled = false; cxK.imageSmoothingEnabled = false;
  PANT.salaX = Math.floor((PANT.W - SALA_W) / 2);
  PANT.salaY = Math.floor((PANT.H - SALA_H) / 2);
  if (typeof alMedir === "function") alMedir();
}
new ResizeObserver(() => medir()).observe(document.documentElement);
addEventListener("resize", () => medir());
addEventListener("orientationchange", () => setTimeout(medir, 200));

/** Del punto de la pantalla (CSS) al mundo (píxeles de juego), también con el lienzo girado. */
function aMundo(clientX, clientY) {
  let u = clientX, v = clientY;
  if (PANT.girado) { u = clientY; v = innerWidth - clientX; }
  const dpr = PANT.dw / PANT.cssW;
  return { x: (u * dpr - PANT.ox) / PANT.PX, y: (v * dpr - PANT.oy) / PANT.PX };
}

// ── pantalla completa (y, si el navegador deja, la orientación trabada en horizontal) ──
function enPantallaCompleta() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
// El navegador sólo deja poner pantalla completa (y hacer sonar el audio) DENTRO de un gesto del
// usuario, y con el dedo el gesto cuenta recién al LEVANTARLO (pointerup/touchend), no al apoyarlo.
// Si se pide fuera de un gesto (el menú corre en el bucle del juego), queda pendiente y se cumple
// en el próximo gesto (02-entrada).
let _completaPendiente = null;
function gestoActivo() { const u = navigator.userActivation; return !u || u.isActive; }
function pantallaCompleta(activar = true) {
  if (!gestoActivo()) { _completaPendiente = activar; return; }
  _completaPendiente = null;
  try {
    if (activar && !enPantallaCompleta()) {
      const el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
      const p = f && f.call(el, { navigationUI: "hide" });
      const trabar = () => { try { screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(() => {}); } catch (e) { /* no se puede */ } };
      if (p && p.then) p.then(trabar).catch(() => {}); else trabar();
    } else if (!activar && enPantallaCompleta()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } catch (e) { /* el navegador no deja */ }
}
document.addEventListener("fullscreenchange", () => setTimeout(medir, 100));

function presentar() {
  if (PANT.k === PANT.PX) { cxP.imageSmoothingEnabled = false; cxP.drawImage(cvM, 0, 0, PANT.W, PANT.H, PANT.ox, PANT.oy, PANT.W * PANT.PX, PANT.H * PANT.PX); return; }
  cxK.drawImage(cvM, 0, 0, PANT.W, PANT.H, 0, 0, cvK.width, cvK.height);
  cxP.imageSmoothingEnabled = true; cxP.imageSmoothingQuality = "medium";
  cxP.drawImage(cvK, 0, 0, cvK.width, cvK.height, PANT.ox, PANT.oy, Math.round(PANT.W * PANT.PX), Math.round(PANT.H * PANT.PX));
}

// ══════════ 02-entrada.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LA ENTRADA: dos joysticks que aparecen donde apoyás el pulgar (izquierda = moverse,
// derecha = llorar en 4 direcciones, como el original), botones de bomba, objeto activo,
// cápsula y pausa, y el teclado (WASD + flechas, E bomba, Espacio activo, Q cápsula).
// Cada dedo se sigue por su pointerId: moverse y disparar a la vez no se pisan.
// Los "flancos" (apretó recién) se consumen AL FINAL del cuadro (guía 2D § 1).
// ─────────────────────────────────────────────────────────────────────────────

const IN = { mx: 0, my: 0, dx: 0, dy: 0, teclas: new Set(), usaTactil: false };
const FLANCO = {};                         // bomba, activo, capsula, pausa, aceptar, toque:{x,y}
const STICKS = { mover: null, tirar: null };  // {id, x0, y0, x, y}
const RADIO_STICK = 26;
let BOTONES = [];                          // {id, x, y, r} en píxeles del mundo (los pone el HUD)
const dedos = new Map();

function recien(k) { return !!FLANCO[k]; }
function finEntrada() { for (const k in FLANCO) delete FLANCO[k]; }

const TECLAS = {
  KeyW: "arriba", KeyS: "abajo", KeyA: "izq", KeyD: "der",
  ArrowUp: "tArriba", ArrowDown: "tAbajo", ArrowLeft: "tIzq", ArrowRight: "tDer",
  KeyI: "tArriba", KeyK: "tAbajo", KeyJ: "tIzq", KeyL: "tDer",
};
addEventListener("keydown", (e) => {
  if (e.repeat) return;
  IN.usaTactil = false;
  FLANCO["k" + e.code] = true;          // cualquier tecla, para los menús
  const k = TECLAS[e.code];
  if (k) { IN.teclas.add(k); e.preventDefault(); }
  if (e.code === "KeyE" || e.code === "ShiftLeft") FLANCO.bomba = true;
  if (e.code === "Space") { FLANCO.activo = true; e.preventDefault(); }
  if (e.code === "KeyQ") FLANCO.capsula = true;
  if (e.code === "Escape" || e.code === "KeyP") FLANCO.pausa = true;
  if (e.code === "Enter" || e.code === "Space") FLANCO.aceptar = true;
  if (e.code === "KeyM") FLANCO.mapa = true;
  if (e.code === "KeyF") pantallaCompleta(!enPantallaCompleta());
  alGesto(null);
});
addEventListener("keyup", (e) => { const k = TECLAS[e.code]; if (k) IN.teclas.delete(k); });
addEventListener("blur", () => { IN.teclas.clear(); STICKS.mover = STICKS.tirar = null; dedos.clear(); });

function botonEn(x, y) {
  for (const b of BOTONES) if (Math.hypot(x - b.x, y - b.y) <= b.r + 4) return b;
  return null;
}
let _primerToque = true;
/** Lo que necesita un gesto de verdad (sonido, pantalla completa): se hace al levantar el dedo o
 *  al hacer clic, que es cuando el navegador lo cuenta como gesto (en Android el pointerdown no). */
function alGesto(e) {
  audioDespertar();
  if (_completaPendiente != null) pantallaCompleta(_completaPendiente);
  else if (e && e.pointerType && e.pointerType !== "mouse" && _primerToque && !enPantallaCompleta()) pantallaCompleta(true);
  if (e && e.pointerType && e.pointerType !== "mouse" && enPantallaCompleta()) _primerToque = false;
}
for (const ev of ["pointerup", "touchend", "click"]) addEventListener(ev, alGesto, { passive: true });
lienzo.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  // con el mouse el pointerdown sí cuenta como gesto; con el dedo, el audio se arma al levantarlo
  if (e.pointerType === "mouse") audioDespertar(); else IN.usaTactil = true;
  const p = aMundo(e.clientX, e.clientY);
  const d = { id: e.pointerId, x0: p.x, y0: p.y, x: p.x, y: p.y, t0: performance.now(), que: null };
  const b = enJuego() ? botonEn(p.x, p.y) : null;
  if (b) { d.que = "boton"; FLANCO[b.id] = true; b.apretado = 8; }
  else if (enJuego() && e.pointerType !== "mouse") {   // con mouse (PC) no hay joysticks: se juega con el teclado
    if (p.x < PANT.W / 2 && !STICKS.mover) { d.que = "mover"; STICKS.mover = d; }
    else if (p.x >= PANT.W / 2 && !STICKS.tirar) { d.que = "tirar"; STICKS.tirar = d; }
  }
  dedos.set(e.pointerId, d);
  try { lienzo.setPointerCapture(e.pointerId); } catch (err) { /* ya se fue */ }
}, { passive: false });
lienzo.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { const q = aMundo(e.clientX, e.clientY); IN.px = q.x; IN.py = q.y; IN.movio = true; }
  const d = dedos.get(e.pointerId);
  if (!d) return;
  const p = aMundo(e.clientX, e.clientY);
  d.x = p.x; d.y = p.y;
  // el joystick flota: si el dedo se va más allá del radio, la base lo sigue
  if (d.que === "mover" || d.que === "tirar") {
    const vx = d.x - d.x0, vy = d.y - d.y0, l = Math.hypot(vx, vy), max = RADIO_STICK * 1.25;
    if (l > max) { d.x0 = d.x - vx / l * max; d.y0 = d.y - vy / l * max; }
  }
}, { passive: false });
function soltarDedo(e) {
  const d = dedos.get(e.pointerId);
  if (!d) return;
  dedos.delete(e.pointerId);
  if (STICKS.mover === d) STICKS.mover = null;
  if (STICKS.tirar === d) STICKS.tirar = null;
  // un toque corto (menús)
  if (performance.now() - d.t0 < 450 && Math.hypot(d.x - d.x0, d.y - d.y0) < 14) FLANCO.toque = { x: d.x, y: d.y };
}
lienzo.addEventListener("pointerup", soltarDedo);
lienzo.addEventListener("pointercancel", soltarDedo);
lienzo.addEventListener("contextmenu", (e) => e.preventDefault());

/** Cada cuadro: los joysticks y las teclas → mover (analógico) y llorar (4 direcciones). */
function leerEntrada() {
  let mx = 0, my = 0, dx = 0, dy = 0;
  const t = IN.teclas;
  if (t.has("izq")) mx -= 1; if (t.has("der")) mx += 1; if (t.has("arriba")) my -= 1; if (t.has("abajo")) my += 1;
  if (mx && my) { mx *= Math.SQRT1_2; my *= Math.SQRT1_2; }
  const m = STICKS.mover;
  if (m) {
    let vx = (m.x - m.x0) / RADIO_STICK, vy = (m.y - m.y0) / RADIO_STICK, l = Math.hypot(vx, vy);
    if (l < 0.18) vx = vy = 0; else if (l > 1) { vx /= l; vy /= l; }
    mx = vx; my = vy;
  }
  // llorar: la última flecha apretada manda (como en el original: una sola dirección)
  if (t.has("tIzq")) dx = -1; else if (t.has("tDer")) dx = 1; else if (t.has("tArriba")) dy = -1; else if (t.has("tAbajo")) dy = 1;
  const s = STICKS.tirar;
  if (s) {
    const vx = s.x - s.x0, vy = s.y - s.y0;
    if (Math.hypot(vx, vy) > RADIO_STICK * 0.3) { if (Math.abs(vx) > Math.abs(vy)) { dx = sig(vx); dy = 0; } else { dx = 0; dy = sig(vy); } }
  }
  // (sonda de pruebas: un tiro forzado durante n cuadros)
  if (IN.forzarTiro) { [dx, dy] = IN.forzarTiro; if (--IN.forzarTiro[2] <= 0) IN.forzarTiro = null; }
  IN.mx = mx; IN.my = my; IN.dx = dx; IN.dy = dy;
}

// ══════════ 03-audio.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL SONIDO, sintetizado (sin archivos), pero TOCADO, no de consola vieja. La referencia es la
// descripción oficial del disco del original (Steam): "dos músicos tocan todo; muchas guitarras
// mutiladas, baterías castigadas y voces raspadas; un toro analógico en la cristalería del
// chiptune", y la wiki: cada pista de piso tiene una CAPA MÁS PESADA (guitarra, batería) que
// entra cuando hay muchos enemigos. Así que acá hay:
//   · cuerdas pulsadas de verdad (Karplus-Strong: un ruido que se filtra y resuena como cuerda),
//     limpias para los arpegios y distorsionadas (saturación + caja de amplificador) para lo pesado;
//   · batería (bombo con golpe de parche, caja con bordonera, platillos de ruido);
//   · voces con formantes (la boca como filtros: "a", "o", "u") para el coro y los quejidos;
//   · piano (parciales con su poquito de desafinación y martillo), órgano y colchones;
//   · todo por una sala con reverberación (respuesta de sala generada) y una saturación de cinta.
// El AudioContext nace con el primer toque (los navegadores no dejan sonar antes).
// ─────────────────────────────────────────────────────────────────────────────

let MEDIDOR = null, SALIDA_EL = null, SALIDA_DEST = null;
// La salida: "directa" (a los parlantes) o "reproductor" (por un elemento <audio>, el mismo camino que
// usa un video; en algunos teléfonos es lo único que suena). Se elige en el menú y se recuerda.
let modoSalida = "directa";
try { modoSalida = localStorage.getItem("shumio-salida") || "directa"; } catch (e) { /* sin guardar */ }
let AC = null, SAL = null, MUS = null, EFX = null, RUIDO = null, ECO = null, ECO_LARGO = null;
let volMusica = 0.55, volEfectos = 0.8;
try { const g = JSON.parse(localStorage.getItem("shumio-audio") || "{}"); if (g.m != null) volMusica = g.m; if (g.e != null) volEfectos = g.e; } catch (e) { /* sin guardar */ }

/** Una respuesta de sala: ruido estéreo que se apaga y se oscurece (las paredes comen agudos). */
function salaImpulso(seg, caida, oscuro) {
  const sr = AC.sampleRate, n = Math.floor(sr * seg), b = AC.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c); let lp = 0;
    for (let i = 0; i < n; i++) {
      const u = i / n, k = oscuro + (1 - oscuro) * (1 - u);   // cada vez más opaco
      lp += ((Math.random() * 2 - 1) - lp) * k;
      d[i] = lp * Math.pow(1 - u, caida) * (i < sr * 0.012 ? i / (sr * 0.012) : 1);
    }
  }
  return b;
}
/** Una curva de saturación (tanh): la "cinta" del máster y la distorsión de la guitarra. */
const _curvas = {};
function curvaSat(k) {
  if (_curvas[k]) return _curvas[k];
  const n = 2048, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = Math.tanh(x * k) / Math.tanh(k); }
  return (_curvas[k] = c);
}

// Lo que pasó con el audio, para mostrarlo en el menú (si en un teléfono no suena, que se vea por qué).
const AUDIO = { error: null, gestos: 0, desde: 0 };
function audioDespertar() {
  AUDIO.gestos++;
  if (AC) {
    if (AC.state !== "running" && AC.state !== "closed") AC.resume().catch((e) => { AUDIO.error = "resume: " + (e && e.message || e); });
    desbloquearElemento();
    return;
  }
  try {

    _tono({ f: midiF(r - 12), dur: b * 4, tipo: "sawtooth", vol: 0.07, filtro: 300, q: 2, salida: c.calma, cuando: t });
    if (n % 2 === 0) [0, 3, 7].forEach((s) => _voz({ f: midiF(r + 24 + s), dur: b * 1.6, vol: 0.05, vocal: "a", cuando: t, salida: c.calma, ataque: 0.05, ecoLargo: 0.5, eco: 0, raspa: 0.3 }));
  } },
  // después del jefe: la calma (colchón y un piano que se aleja)
  calma: { bpm: 50, raiz: 43, esc: "dorico", prog: [0, 3, 0, 4], compas(t, n, c) {
    const g = this.prog[n % 4], ac = acorde(this.raiz, this.esc, g), b = 60 / this.bpm;

  // el pacto: un órgano grave y un coro de voces raspadas, casi quieto
  pacto: { bpm: 46, raiz: 38, esc: "frigio", prog: [0, 1, 0, 6], compas(t, n, c) {
    const g = this.prog[n % 4], ac = acorde(this.raiz, this.esc, g), b = 60 / this.bpm;
    _colchon({ notas: [ac[0] - 12, ac[0], ac[1] + 12], cuando: t, dur: b * 4.2, vol: 0.04, salida: c.calma, filtro: 450, ataque: 1.5 });
    [0, 1, 2].forEach((k) => _voz({ f: midiF(ac[k] + 12), dur: b * 4, vol: 0.045, vocal: "o", cuando: t, salida: c.calma, ataque: 1.5, ecoLargo: 0.7, eco: 0, raspa: 0.35, cola: 1.5 }));
    if (n % 2 === 0) _metal({ f: midiF(ac[0] + 24), dur: 4, vol: 0.04, cuando: t, salida: c.calma, ecoLargo: 0.5, parciales: [1, 2.4, 3.9, 5.6] });

    [0, 2, 1, 2, 0, 1, 2, 1].forEach((k, i) => _metal({ f: midiF(ac[k] + 12) * (1 + (Math.random() - 0.5) * 0.004), dur: 0.9, vol: 0.05, cuando: t + i * b / 2, salida: c.calma, eco: 0.3, parciales: [1, 3.01, 5.2] }));

  secreta: { bpm: 40, raiz: 47, esc: "menor", prog: [0, 5], compas(t, n, c) {

  } },
  // la muerte: una frase de piano y silencio (como "Acceptance" del original: un tema propio)
  muerte: { bpm: 52, raiz: 45, esc: "menor", unaVez: 2, compas(t, n, c) {
    const b = 60 / this.bpm, frase = n === 0 ? [[7, 0], [5, 1], [3, 2], [2, 3]] : [[0, 0], [-1, 1.5], [0, 2.5]];

const Musica = {
  tema: "silencio", deseado: "menu", n: 0, prox: 0, capas: null, intensidad: 0,
  poner(n) { this.deseado = n; },
  /** Cuánta "pesadez" pide el juego (0 a 1): la capa pesada sube o baja despacio. */
  pesar(x) { this.intensidad = x; if (this.capas) this.capas.pesada.gain.setTargetAtTime(0.0001 + x, AC.currentTime, x > 0.5 ? 0.6 : 1.4); },
  arrancar() { this.prox = AC.currentTime + 0.1; setInterval(() => this.tic(), 70); },
  tic() {
    if (!AC) return;
    if (this.deseado !== this.tema) this.cambiar();
    const t = TEMAS[this.tema];
    if (!t || !this.capas) return;
    // antes de sonar, la pista se hornea (hasta 8 s de espera; lo que falte, se hornea sonando)
    if (this.juntadas && performance.now() - this.desdeCambio < 8000 && [...this.juntadas].some((e) => e.pendiente)) { this.prox = AC.currentTime + 0.1; return; }
    const largo = 4 * 60 / t.bpm;
    while (this.prox < AC.currentTime + 0.4) {
      if (t.unaVez && this.n >= t.unaVez) return;
      const c = this.capas;
      c.pesadaActiva = this.intensidad > 0.02 || c.pesada.gain.value > 0.02;
      t.compas(this.prox - AC.currentTime, this.n++, c);
      this.prox += largo;
    }
  },
  /** Junta (sin tocar) todas las notas que usa una pista en sus primeros compases, y las manda a hornear. */
  juntar(nombre, urgente) {
    const t = TEMAS[nombre];
    if (!t || !AC) return new Set();
    const set = new Set(), antes = _soloJuntar, desde = COLA_YA.length;
    _soloJuntar = set;
    const c = { calma: MUS, pesada: MUS, pesadaActiva: true };
    try { for (let n = 0; n < (t.unaVez || 8); n++) t.compas(0, n, c); } finally { _soloJuntar = antes; }
    if (!urgente) for (const tr of COLA_YA.splice(desde)) COLA.push(tr);   // lo de esta pista, al fondo
    return set;
  },
  cambiar() {
    // la pista vieja se apaga en un segundo (sus notas ya programadas se van con su capa)
    if (this.capas) { const v = this.capas; v.calma.gain.setTargetAtTime(0.0001, AC.currentTime, 0.35); v.pesada.gain.setTargetAtTime(0.0001, AC.currentTime, 0.35); setTimeout(() => { v.calma.disconnect(); v.pesada.disconnect(); }, 3000); }
    this.tema = this.deseado; this.n = 0; this.prox = AC.currentTime + 0.08;
    this.juntadas = this.juntar(this.tema, true); this.desdeCambio = performance.now();

    if (this.tema === "sotano" || this.tema === "raices") { this.juntar("jefe", false); this.juntar("calma", false); }
    const calma = AC.createGain(), pesada = AC.createGain();
    calma.gain.value = 1; pesada.gain.value = 0.0001 + this.intensidad;

    this.capas = { calma, pesada, pesadaActiva: false };

};

// EL PINTOR: todo el arte sale de acá, dibujado por código a escala 1 (un píxel = un píxel).
// Volúmenes sombreados con rampas cortas de una paleta limitada (luz de arriba a la izquierda,
// borde oscuro, tramado Bayer en los cambios de tono), contorno oscuro de 1 px, y los detalles
// (ojos, bocas, manchas, grietas) puestos a mano con sellos de texto. Nada de antialias.
// Cada sprite se hornea UNA vez en un canvas chico y se cachea.
// ─────────────────────────────────────────────────────────────────────────────

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => v / 16 - 0.47);

const AUTO = "auto";

// La paleta: pocos colores, apagados, que conversan entre sí (lo que da unidad).
const PAL = {
  tinta: "#120a0e",          // el contorno de todo (no negro puro)
  piel: ["#4a302f", "#7d5752", "#b8908a", "#dfbfb2", "#f6e4da"],
  hongo: ["#2c0b10", "#5e161b", "#962824", "#c9442f", "#e9735a"],
  crema: ["#6e6150", "#a89a82", "#d9ccb2", "#f1e8d6"],
  musgo: ["#141c12", "#243320", "#3a5130", "#58734a", "#83a068"],
  espora: ["#133034", "#2e6a6a", "#5ea8a0", "#a8e2d4", "#effff9"],
  piedra: ["#15181a", "#262c2c", "#3a4240", "#566058", "#7b8577", "#a2ab9a"],
  tierra: ["#170f0b", "#2c1d14", "#48301f", "#6b4a31", "#8f6a48", "#b58f67"],
  sangre: ["#2a0508", "#5c0c12", "#98161c", "#cf2b2b", "#f25a4a"],
  baba: ["#1b1d0a", "#3f4414", "#6b7020", "#9ea235", "#d0d06a"],
  oro: ["#3a2408", "#6e4a10", "#b07e1c", "#e0b43a", "#fbe58a"],
  hueso: ["#3b342c", "#6f6456", "#a99a86", "#d8cdb9", "#f5efe3"],
  violeta: ["#1d0f2c", "#3a1f56", "#5e3589", "#8c5cc0", "#c19ae8"],
  hielo: ["#0f2436", "#1f4d6e", "#3f82a8", "#7fbfdc", "#d2f1ff"],
  fuego: ["#3a0c04", "#8a2206", "#d65410", "#f59a26", "#ffe07a"],
  hierro: ["#0e1012", "#23272b", "#3d444a", "#5f686e", "#8d979b"],
  azul: ["#0d1530", "#1c2e62", "#2f4f9c", "#5480d4", "#9cc0f4"],

function lienzoNuevo(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }

class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  dentro(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  p(x, y, c) { x = Math.floor(x); y = Math.floor(y); if (c && this.dentro(x, y)) this.d[y * this.w + x] = c; return this; }
  g(x, y) { x = Math.floor(x); y = Math.floor(y); return this.dentro(x, y) ? this.d[y * this.w + x] : null; }
  borrar(x, y) { if (this.dentro(x, y)) this.d[y * this.w + x] = null; }
  /** Un volumen elíptico sombreado. rampa: de oscuro a claro. filtro(x, y) → false para no pintar ese píxel. */
  bola(cx, cy, rx, ry, rampa, o = {}) {
    const L = o.luz || [-0.52, -0.62, 0.58], n = rampa.length, bajar = o.bajar ?? 0.18, trama = SIN_TRAMA * (o.trama ?? 0.9);
    for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
      const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry, r2 = nx * nx + ny * ny;
      if (r2 > 1 || (o.filtro && !o.filtro(x, y))) continue;
      const nz = Math.sqrt(1 - r2);
      let l = -nx * L[0] - ny * L[1] + nz * L[2];          // lambert
      l = l * 0.5 + 0.5 - bajar * r2 * r2;                  // el borde, más oscuro (como el original)
      // degradé continuo entre los tonos de la rampa (se ve pintado, no escalonado); o.plano: a tonos
      if (o.plano) { const i = Math.floor(l * n + bayer(x, y) * trama); this.p(x, y, rampa[lim(i + (o.corrimiento || 0), 0, n - 1)]); continue; }
      const f = lim(l * n - 0.5 + (o.corrimiento || 0), 0, n - 1), i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1);
      this.p(x, y, i0 === i1 ? rampa[i0] : mezclarCache(rampa[i0], rampa[i1], Math.round((f - i0) * 6) / 6));
    }

  }
  /** Un rectángulo sombreado de arriba (claro) a abajo (oscuro). */
  caja(x0, y0, w, h, rampa, o = {}) {

    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
      const t = 1 - (y - y0 + 0.5) / h, u = 1 - (x - x0 + 0.5) / w;
      const l = (o.vertical ?? 0.75) * t + (1 - (o.vertical ?? 0.75)) * u;
      if (o.plano) { this.p(x, y, rampa[lim(Math.floor(l * n), 0, n - 1)]); continue; }
      const f = lim(l * n - 0.5, 0, n - 1), i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1);

  linea(x0, y0, x1, y1, c) {

    for (let i = 0; i <= n; i++) this.p(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), c);

  }
  /** Un sello de texto: cada letra es un color de la paleta (espacio o '.' = nada). */
  sello(x0, y0, filas, pal) {

  }
  /** Contorno por fuera de lo pintado (4 vecinos; con esquinas = 8). */

    for (let y = 0; y < this.h; y++) for (let x = 0; x < w; x++) {
      if (lleno[y * w + x]) continue;
      const v = (dx, dy) => { const X = x + dx, Y = y + dy; return X >= 0 && Y >= 0 && X < w && Y < this.h && lleno[Y * w + X]; };
      const toca = v(1, 0) || v(-1, 0) || v(0, 1) || v(0, -1) || (esquinas && (v(1, 1) || v(-1, 1) || v(1, -1) || v(-1, -1)));
      if (!toca) continue;
      if (c !== AUTO) { this.d[y * w + x] = c; continue; }
      // AUTO: el promedio de los vecinos pintados, llevado casi a negro (con su tinte)
      let r = 0, g = 0, b = 0, n = 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (v(dx, dy)) { const q = rgba(orig[(y + dy) * w + x + dx]); r += q[0]; g += q[1]; b += q[2]; n++; }
      if (!n) { r = 40; g = 30; b = 34; n = 1; }
      this.d[y * w + x] = hex(r / n * 0.3 + 10, g / n * 0.26 + 6, b / n * 0.28 + 8);
    }
    return this;
  }
  /** Oscurece los píxeles del borde de lo pintado (un "contorno interior" de color). */
  bordeInterior(mapa) {
    const lleno = this.d.map((v) => v !== null), w = this.w, cambios = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < w; x++) {
      if (!lleno[y * w + x]) continue;
      const v = (dx, dy) => { const X = x + dx, Y = y + dy; return X >= 0 && Y >= 0 && X < w && Y < this.h && lleno[Y * w + X]; };
      if (!v(1, 0) || !v(-1, 0) || !v(0, 1) || !v(0, -1)) { const c = this.d[y * w + x], n = mapa[c]; if (n) cambios.push([x, y, n]); }
    }
    for (const [x, y, c] of cambios) this.p(x, y, c);
    return this;
  }
  espejo() { const q = new Pix(this.w, this.h); for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) q.d[y * this.w + (this.w - 1 - x)] = this.d[y * this.w + x]; return q; }
  copiar() { const q = new Pix(this.w, this.h); q.d = this.d.slice(); return q; }
  pegar(o, dx, dy) { for (let y = 0; y < o.h; y++) for (let x = 0; x < o.w; x++) { const c = o.d[y * o.w + x]; if (c) this.p(x + dx, y + dy, c); } return this; }
  /** Tiñe todo (para el blanco del golpe, o un campeón). */
  tenido(fn) { const q = this.copiar(); q.d = q.d.map((c) => (c ? fn(c) : c)); return q; }
  canvas() {
    const c = lienzoNuevo(this.w, this.h), g = c.getContext("2d"), im = g.createImageData(this.w, this.h);
    for (let i = 0; i < this.d.length; i++) {
      const col = this.d[i];
      if (!col) continue;
      const [r, gg, b, a] = rgba(col);
      im.data[i * 4] = r; im.data[i * 4 + 1] = gg; im.data[i * 4 + 2] = b; im.data[i * 4 + 3] = a;
    }
    g.putImageData(im, 0, 0);
    return c;
  }
}

const _rgba = new Map();
function rgba(col) {
  let v = _rgba.get(col);
  if (v) return v;
  if (col[0] === "#") {
    const n = parseInt(col.slice(1, 7), 16);
    v = [(n >> 16) & 255, (n >> 8) & 255, n & 255, col.length > 7 ? parseInt(col.slice(7, 9), 16) : 255];
  } else { const m = col.match(/[\d.]+/g).map(Number); v = [m[0], m[1], m[2], Math.round((m[3] ?? 1) * 255)]; }
  _rgba.set(col, v);
  return v;
}
function hex(r, g, b) { return "#" + [r, g, b].map((x) => lim(Math.round(x), 0, 255).toString(16).padStart(2, "0")).join(""); }
const _mezclas = new Map();
function mezclarCache(a, b, t) { const k = a + b + t; let v = _mezclas.get(k); if (!v) { v = mezclar(a, b, t); _mezclas.set(k, v); } return v; }
function mezclar(a, b, t) { const A = rgba(a), B = rgba(b); return hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); }
/** Una rampa nueva desde un color base (para campeones y ítems). */
function rampaDe(base, n = 5) { const out = []; for (let i = 0; i < n; i++) { const t = i / (n - 1); out.push(t < 0.5 ? mezclar("#0b0709", base, 0.25 + t * 1.5) : mezclar(base, "#fff6ea", (t - 0.5) * 0.9)); } return out; }

// ── la caché de sprites ──
const SPR = {};
function hornear(clave, fn) { if (!SPR[clave]) SPR[clave] = fn(); return SPR[clave]; }
/** El mismo sprite todo blanco (el destello de cuando le pegan). */
const _blancos = new WeakMap();
function blanco(c) {
  let b = _blancos.get(c);

  b = lienzoNuevo(c.width, c.height);
  const g = b.getContext("2d"); g.drawImage(c, 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = "#fff4f0"; g.fillRect(0, 0, b.width, b.height);
  _blancos.set(c, b);
  return b;
}
const _rojos = new WeakMap();
function rojizo(c) {
  let b = _rojos.get(c);
  if (b) return b;
  b = lienzoNuevo(c.width, c.height);
  const g = b.getContext("2d"); g.drawImage(c, 0, 0); g.globalCompositeOperation = "source-atop"; g.fillStyle = "rgba(220,30,30,0.55)"; g.fillRect(0, 0, b.width, b.height);
  _rojos.set(c, b);
  return b;
}

/** La sombra en el piso: una elipse de píxeles duros, semitransparente. */
function sombra(rx, ry) {
  return hornear(`sombra${rx}x${ry}`, () => {
    const p = new Pix(rx * 2 + 1, ry * 2 + 1);
    for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) {
      const nx = (x + 0.5 - p.w / 2) / (rx + 0.5), ny = (y + 0.5 - p.h / 2) / (ry + 0.5), r = nx * nx + ny * ny;
      if (r <= 1) p.p(x, y, r < 0.45 ? "rgba(4,2,6,0.46)" : "rgba(4,2,6,0.30)");
    }
    return p.canvas();
  });
}

// ══════════ 05-arte-shumio.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// SHUMIO: un chico-hongo. Cabeza grande y pálida (como los personajes de este género: la cabeza
// es la que llora y apunta), un sombrero de hongo rojo con manchas crema, ojos grandes y
// húmedos, túnica de musgo. La cabeza y el cuerpo van separados: la cabeza mira hacia donde
// llorás, el cuerpo hacia donde caminás.
// ─────────────────────────────────────────────────────────────────────────────

const CAB_W = 22, CAB_H = 22, CUE_W = 14, CUE_H = 12;
const TINTA = PAL.tinta;

/** vista: "frente" | "espalda" | "lado" (mirando a la derecha). gesto: 0 normal, 1 llorando (tira), 2 parpadeo, 3 dolor. */
function pintarCabeza(vista, gesto, pielR = PAL.piel, gorroR = PAL.hongo) {
  const p = new Pix(CAB_W, CAB_H);
  // Todo simétrico alrededor del centro de la cabeza: x = 10.5 en píxeles (la bola va de 1 a 20).
  const CX = 11;
  p.bola(CX, 13.7, vista === "lado" ? 9.0 : 9.4, 8.1, pielR, { luz: [-0.4, -0.55, 0.73], bajar: 0.22, trama: 0.55 });
  // El sombrero: el casquete de un hongo, centrado sobre la cabeza (de costado también: el ala
  // sobresale lo mismo adelante y atrás). El ala es una curva limpia, apenas caída en las puntas.
  const gy = vista === "espalda" ? 8.1 : 7.2, gry = vista === "espalda" ? 7.2 : 6.4;
  const alaY = (x) => Math.round(gy + 2.2 + 1.4 * Math.pow((x + 0.5 - CX) / 10, 2));
  p.bola(CX, gy, 10.2, gry, gorroR, { filtro: (x, y) => y <= alaY(x), luz: [-0.5, -0.7, 0.5], bajar: 0.1, trama: 0.7 });
  for (let x = 0; x < CAB_W; x++) {
    const y = alaY(x);
    if (!p.g(x, y)) continue;
    p.p(x, y, gorroR[1]);                                        // el canto del ala
    if (vista !== "espalda" && p.g(x, y + 1) && x > 2 && x < CAB_W - 3) p.p(x, y + 1, pielR[1]);   // la sombra en la frente
  }
  // las manchas: cada una con su luz arriba a la izquierda y su sombra abajo a la derecha
  const manchas = vista === "espalda" ? [[4, 6, 3], [10, 3, 3], [15, 6, 2], [8, 9, 2], [16, 10, 1]]
    : vista === "lado" ? [[3, 6, 2], [9, 3, 3], [15, 5, 2], [12, 8, 1], [6, 9, 1]]
    : [[4, 5, 2], [9, 2, 3], [15, 4, 2], [12, 7, 1], [6, 8, 1]];
  for (const [x, y, t] of manchas) {
    if (!p.g(x, y) || y >= alaY(x)) continue;
    const m = t === 3 ? [".cc.", "cCCd", ".dd."] : t === 2 ? ["cc", "Cd"] : ["c"];
    p.sello(x, y, m, { c: PAL.crema[3], C: PAL.crema[2], d: PAL.crema[1] });
  }
  const K = TINTA, pal = { e: K, W: "#ffffff", h: "#4f6c7a", t: PAL.espora[3] };
  if (vista === "frente") {
    // los ojos: la MISMA forma los dos (simétricos), y el brillo arriba a la izquierda en los dos (la luz)
    const ojo = gesto === 1 || gesto === 2 ? ["....", "eeee", ".tt."]
      : gesto === 3 ? ["e..e", ".ee.", "e..e"]
      : gesto === 4 ? ["....", ".ee.", "e..e"]                       // contento: los ojos cerrados en arco
      : gesto === 5 ? ["....", "eeee", "eWee", "eeee", ".ee."]        // triste: los párpados caídos
      : [".ee.", "eWee", "eeee", "eeeh", ".ee."];
    p.sello(5, 13, ojo, pal); p.sello(13, 13, ojo, pal);        // 5..8 y 13..16: centro 10.5
    p.p(4, 18, "#d99a90"); p.p(17, 18, "#d99a90");               // los cachetes (4 y 17)
    // la boca, de 2 px (10 y 11), centrada
    if (gesto === 1) p.sello(9, 18, [".kk.", "kmmk", ".kk."], { k: K, m: "#6a2c30" });
    else if (gesto === 3) p.sello(9, 18, [".kk.", "kmmk"], { k: K, m: "#6a2c30" });
    else if (gesto === 4) p.sello(8, 18, ["k....k", ".kmmk.", "..kk.."], { k: K, m: "#b04a50" });
    else if (gesto === 5) p.sello(9, 19, [".kk.", "k..k"], { k: K });
    else p.sello(10, 19, ["kk"], { k: "#5a3034" });
    // las esporas que le caen de los ojos (6 y 15: debajo del segundo píxel de cada ojo, espejados)
    if (gesto !== 3) { p.p(6, 18, PAL.espora[3]); p.p(15, 18, PAL.espora[3]); if (gesto === 1) { p.p(6, 19, PAL.espora[2]); p.p(15, 19, PAL.espora[2]); } }
  } else if (vista === "lado") {
    const ojo = gesto === 1 || gesto === 2 ? ["...", "eee", ".t."] : gesto === 3 ? ["e.e", ".e.", "e.e"] : [".e.", "eWe", "eee", "eeh", ".e."];
    p.sello(15, 13, ojo, pal);
    // (de costado sin cachete: pegado al contorno se lee como una mancha en la mandíbula)
    if (gesto === 1) p.sello(17, 18, ["k", "m", "k"], { k: K, m: "#6a2c30" }); else p.p(17, 19, "#5a3034");
    if (gesto !== 3) { p.p(16, 18, PAL.espora[3]); if (gesto === 1) p.p(16, 19, PAL.espora[2]); }
  } else {
    // de espaldas: la nuca con un poco más de sombra abajo
    for (let x = 4; x < 18; x++) if (p.g(x, 20) && p.g(x, 21)) p.p(x, 20, pielR[1]);
  }
  p.contorno(K);
  return p;
}

/** El cuerpo: túnica de musgo, bracitos y piernas. vista frente/espalda/lado; paso 0..3. */
function pintarCuerpo(vista, paso, tunicaR = PAL.musgo, pielR = PAL.piel) {
  const p = new Pix(CUE_W, CUE_H);
  const pierna = [0, 1, 0, -1][paso];
  if (vista === "lado") {
    // piernas: una adelante y otra atrás según el paso
    const a = [2, 0, -2, 0][paso];
    p.caja(6 + a, 7, 2, 4, [pielR[1], pielR[2], pielR[3]]); p.p(6 + a, 10, pielR[0]); p.p(7 + a, 10, pielR[0]); p.p(8 + a, 10, TINTA);
    p.caja(6 - a, 7, 2, 4, [pielR[0], pielR[1], pielR[2]]); p.p(6 - a, 10, pielR[0]); p.p(7 - a, 10, TINTA);
    p.bola(7, 5, 3.9, 3.8, tunicaR, { bajar: 0.1 });
    // el brazo que se balancea
    const b = [-1, 0, 1, 0][paso];
    p.caja(7 + b, 4, 2, 3, [pielR[2], pielR[3]]);
    // el cinturón de raíz
    for (let x = 3; x < 11; x++) if (p.g(x, 6)) p.p(x, 6, PAL.tierra[2]);
  } else {
    const l = pierna, r = -pierna;
    p.caja(4, 7 + Math.max(0, l), 2, 4 - Math.max(0, l), [pielR[1], pielR[2], pielR[3]]);
    p.caja(8, 7 + Math.max(0, r), 2, 4 - Math.max(0, r), [pielR[1], pielR[2], pielR[3]]);
    p.p(4, 10, pielR[0]); p.p(5, 10, pielR[0]); p.p(8, 10, pielR[0]); p.p(9, 10, pielR[0]);
    p.bola(7, 4.6, 4.7, 4.0, tunicaR, { bajar: 0.12 });
    // los bracitos a los costados, que se mueven al caminar
    p.caja(1, 3 + Math.max(0, r), 2, 3, [pielR[1], pielR[2], pielR[3]]);
    p.caja(11, 3 + Math.max(0, l), 2, 3, [pielR[1], pielR[2], pielR[3]]);
    for (let x = 3; x < 12; x++) if (p.g(x, 6) && p.g(x, 6) !== pielR[1]) p.p(x, 6, PAL.tierra[2]);
    if (vista === "frente") { p.p(7, 3, tunicaR[4]); p.p(6, 2, tunicaR[3]); p.p(7, 6, PAL.oro[3]); }   // la hebilla
    else { for (let y = 1; y < 6; y++) if (p.g(7, y)) p.p(7, y, tunicaR[1]); }                          // la costura de atrás
  }
  p.contorno(AUTO);
  return p;
}

/** La pose de levantar un objeto (medida en el original: de frente, los dos brazos estirados
 *  arriba, a los costados de la cabeza, y el objeto sobre las manos): el cuerpo sin los bracitos
 *  y los brazos aparte, que se dibujan encima de la cabeza. */
function pintarCuerpoLevanta(tunicaR = PAL.musgo, pielR = PAL.piel) {
  const p = new Pix(CUE_W, CUE_H);
  p.caja(4, 7, 2, 4, [pielR[1], pielR[2], pielR[3]]); p.caja(8, 7, 2, 4, [pielR[1], pielR[2], pielR[3]]);
  p.p(4, 10, pielR[0]); p.p(5, 10, pielR[0]); p.p(8, 10, pielR[0]); p.p(9, 10, pielR[0]);
  p.bola(7, 4.6, 4.7, 4.0, tunicaR, { bajar: 0.12 });
  for (let x = 3; x < 12; x++) if (p.g(x, 6)) p.p(x, 6, PAL.tierra[2]);
  p.p(7, 3, tunicaR[4]); p.p(6, 2, tunicaR[3]); p.p(7, 6, PAL.oro[3]);
  p.contorno(AUTO);
  return p;
}
function pintarBrazosArriba(pielR = PAL.piel) {
  // 30 × 26: bracitos gorditos que salen del hombro (y 23), abren el codo hacia afuera y terminan
  // con la mano redonda arriba, sobre el ala del sombrero (y 4)
  const p = new Pix(30, 26), R = [pielR[1], pielR[2], pielR[3], pielR[4]];
  for (const lado of [-1, 1]) {
    const x0 = 15 + lado * 6, y0 = 23, xc = 15 + lado * 14, yc = 15, x1 = 15 + lado * 11, y1 = 5;
    for (let t = 0; t <= 1; t += 0.04) {
      const x = (1 - t) * (1 - t) * x0 + 2 * t * (1 - t) * xc + t * t * x1, y = (1 - t) * (1 - t) * y0 + 2 * t * (1 - t) * yc + t * t * y1;
      p.bola(x, y, 1.7, 1.7, R, { luz: [-0.5 * lado, -0.6, 0.6] });
    }
    p.bola(x1, y1 - 1, 2.6, 2.4, R, {});   // la mano
  }
  p.contorno(AUTO);
  return p;
}
/** Los sprites de Shumio, horneados: cabezas por vista y gesto, cuerpos por vista y paso. */
function spritesShumio(pielR = PAL.piel, gorroR = PAL.hongo, tunicaR = PAL.musgo, clave = "shumio") {
  return hornear(clave, () => {
    const s = { cab: {}, cue: {} };
    for (const v of ["frente", "espalda", "lado"]) {
      s.cab[v] = [0, 1, 2, 3, 4, 5].map((g) => pintarCabeza(v, v === "frente" || g < 4 ? g : 0, pielR, gorroR).canvas());
      s.cab[v + "I"] = [0, 1, 2, 3, 4, 5].map((g) => pintarCabeza(v, v === "frente" || g < 4 ? g : 0, pielR, gorroR).espejo().canvas());
      s.cue[v] = [0, 1, 2, 3].map((k) => pintarCuerpo(v, k, tunicaR, pielR).canvas());
      if (v === "frente") { s.levanta = pintarCuerpoLevanta(tunicaR, pielR).canvas(); s.brazos = pintarBrazosArriba(pielR).canvas(); }
      s.cue[v + "I"] = [0, 1, 2, 3].map((k) => pintarCuerpo(v, k, tunicaR, pielR).espejo().canvas());
    }
    return s;
  });
}

// ── las lágrimas (esporas) ──
const COLOR_LAGRIMA = {
  espora: PAL.espora, sangre: PAL.sangre, veneno: ["#0f200c", "#255a1c", "#44922c", "#86d04a", "#d8ff9a"],
  violeta: PAL.violeta, hielo: PAL.hielo, fuego: PAL.fuego, oro: PAL.oro, hueso: PAL.hueso, enemigo: ["#1a0306", "#4a0a10", "#8e1a1e", "#d0392f", "#ff8b6a"],
  moho: PAL.baba, tinta: ["#050305", "#1a1320", "#2f2638", "#4d4260", "#7a6c90"],
  // los colores de las lágrimas de los objetos, tomados de las imágenes de la wiki (sus "tears")
  ouija: ["#1a2228", "#4a5a62", "#7a9aa4", "#a8c4cc", "#e0f0f4"], sagrado: ["#1a2a2e", "#8ab8bc", "#b8dcdc", "#d8ecec", "#ffffff"],
  carbon: ["#050508", "#141820", "#1e2430", "#2e3644", "#5a6270"], hemo: ["#2a0204", "#9a0a10", "#e01a1a", "#ff4a3a", "#ffffff"],
  choco: ["#120806", "#3a1c12", "#5a2e1e", "#7a4630", "#a8704e"], rosa: ["#200408", "#6a1022", "#a01e3c", "#c83a58", "#f08aa0"],
  perfume: ["#2a2a06", "#8a8a2a", "#c8d468", "#e0ec90", "#fffff0"], oscura: ["#000000", "#0a0a0e", "#141418", "#26262c", "#4a4a54"],
  llama: ["#3a0c04", "#c04010", "#f07a2a", "#ffb060", "#ffffff"], resfrio: ["#0a2018", "#2a6a4a", "#4a9a70", "#7ac8a0", "#c8f0dc"],
  liquido: ["#0a2a0a", "#2a8a2a", "#5ad05a", "#a0ff90", "#ffffff"], gris: ["#0a0a0a", "#3a3a3a", "#5a5a5a", "#8a8a8a", "#d0d0d0"],
  parasito: ["#200c04", "#6a3010", "#a0582a", "#c0784a", "#f0b080"], blanco: ["#101010", "#4a4a4a", "#9a9a9a", "#d8d8d8", "#ffffff"],
  urano: ["#0a1a30", "#4a70b8", "#8ab0f0", "#c0d8ff", "#ffffff"], piscis: ["#0a1a3a", "#1a4a8a", "#3a7ad0", "#7ab0f0", "#e0f0ff"],
  soja: ["#40403a", "#a8a8a0", "#d8d8d0", "#f0f0e8", "#ffffff"], almendra: ["#3a2a1a", "#a88a6a", "#d8c0a0", "#f0e0c8", "#fffaf0"],
  electrica: ["#062a3a", "#1a7ab0", "#5ac8f0", "#b0f0ff", "#ffffff"], cupido: ["#0a0a14", "#5a7ad0", "#9ab8f8", "#c8dcff", "#ffffff"],
};
/** Una lágrima con forma (la flecha de Cupido, el carámbano de Urano), mirando a la derecha: se rota al dibujar. */
function lagrimaFormaSpr(forma, r, color) {
  r = lim(Math.round(r), 2, 10);
  return hornear(`lagForma${forma}${color}${r}`, () => {
    const R = COLOR_LAGRIMA[color] || PAL.espora, L = forma === "carambano" ? r * 4 + 2 : r * 3 + 2, H = r * 2 + 3, p = new Pix(L, H), c = H / 2;
    for (let x = 0; x < L; x++) for (let y = 0; y < H; y++) {
      const u = x / (L - 1);
      // carámbano: gordo atrás y en punta adelante; flecha: cuerpo redondo con la punta triangular
      const ancho = forma === "carambano" ? r * (1 - u) * 1.1 + 0.3 : u < 0.6 ? r * Math.sqrt(1 - Math.pow((u - 0.3) / 0.32, 2)) : r * 1.1 * (1 - (u - 0.6) / 0.4);
      const d = Math.abs(y + 0.5 - c);
      if (!(ancho > 0) || d > ancho) continue;
      const l = 1 - (y + 0.5 - (c - ancho)) / (2 * ancho + 0.01);
      p.p(x, y, R[lim(Math.round(1 + l * 2.6), 1, 4)]);
    }
    p.p(Math.round(L * 0.35), Math.round(c - r * 0.45), R[4]);
    p.contorno(R[0]);
    return p.canvas();
  });
}
/** Una lágrima de radio r (2..9) y color. Con un brillo arriba a la izquierda y el contorno oscuro. */
function lagrimaSpr(r, color = "espora") {
  r = lim(Math.round(r), 2, 10);
  return hornear(`lag${color}${r}`, () => {
    const rampa = COLOR_LAGRIMA[color] || PAL.espora, s = r * 2 + 3, p = new Pix(s, s), c = s / 2;
    p.bola(c, c, r + 0.3, r + 0.3, rampa.slice(1), { luz: [-0.55, -0.6, 0.58], bajar: 0.05, trama: 0.6 });
    if (r >= 3) { p.p(Math.floor(c - r * 0.45), Math.floor(c - r * 0.5), rampa[4]); if (r >= 5) p.p(Math.floor(c - r * 0.45) + 1, Math.floor(c - r * 0.5), rampa[4]); }
    p.contorno(rampa[0]);
    return p.canvas();
  });
}
/** El chapoteo de una lágrima que se rompe: 5 cuadros. */
function chapoteoSpr(color = "espora", k) {
  return hornear(`chap${color}${k}`, () => {
    const rampa = COLOR_LAGRIMA[color] || PAL.espora, p = new Pix(17, 17), c = 8;
    const r = 2 + k * 1.3;
    for (let i = 0; i < 8; i++) {
      const a = i * TAU / 8 + k * 0.2, d = r + (i % 2) * 1.2;
      const x = c + Math.cos(a) * d, y = c + Math.sin(a) * d * 0.8;
      if (k < 4) p.p(x, y, rampa[k < 2 ? 3 : 2]);
      if (k < 2) p.p(x + Math.cos(a), y + Math.sin(a) * 0.8, rampa[2]);
    }
    if (k < 3) p.bola(c, c, 3 - k, 2.4 - k * 0.7, rampa.slice(1), { trama: 0.3 });
    return p.canvas();
  });
}

// ══════════ 06-arte-sala.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL ARTE DE LA SALA: el piso, los muros, las puertas y los obstáculos, por capítulo.
// El fondo de cada sala se hornea UNA vez (con su semilla: la misma sala se ve igual al volver)
// y encima se dibujan las manchas que van quedando (sangre, baba, quemaduras de bomba).
// ─────────────────────────────────────────────────────────────────────────────

const CAPITULOS = {
  sotano: {
    nombre: "SÓTANO HÚMEDO", piso: ["#1a1f1b", "#232a25", "#2c342d", "#363f36", "#434c41", "#525b4e"],
    junta: "#101411", ladrillo: ["#141815", "#1e2420", "#2a322b", "#39433a", "#4b564a", "#5e6a5c"], mortero: "#0c0f0d",
    musgo: PAL.musgo, mancha: "#161b17", oscuro: "#050706", tinte: [12, 18, 12],
  },
  raices: {
    nombre: "LAS RAÍCES", piso: ["#1d140e", "#281c13", "#34251a", "#413021", "#503c2a", "#614a35"],
    junta: "#130c08", ladrillo: ["#170f0a", "#231710", "#321f15", "#44291b", "#583624", "#6d4630"], mortero: "#0d0806",
    musgo: ["#1a1409", "#2e2410", "#4a3a18", "#6b5626", "#8d7536"], mancha: "#1a120c", oscuro: "#070403", tinte: [22, 12, 6],
  },
};

/** Una línea continua (Bresenham): sin huecos ni saltos, como la trazaría un pixelador. */
function trazo(x0, y0, x1, y1, fn) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) { fn(x0, y0); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
/** Una grieta: 2 a 4 tramos que cambian de rumbo de a poco, con el borde de abajo iluminado (la profundidad). */
function grieta(r, x, y, largo, pintar, iluminar) {
  let a = r() * TAU;
  const tramos = 2 + Math.floor(r() * 3);
  for (let k = 0; k < tramos; k++) {
    const l = largo / tramos * (0.7 + r() * 0.6), nx = x + Math.cos(a) * l, ny = y + Math.sin(a) * l;
    trazo(x, y, nx, ny, (X, Y) => { pintar(X, Y); if (iluminar) iluminar(X + 1, Y + 1); });
    x = nx; y = ny; a += (r() - 0.5) * 1.3;
  }
}

/** El fondo entero de una sala (muros + piso), horneado con su semilla. */
function hornearFondoPixel(capituloId, semilla) {
  const C = CAPITULOS[capituloId], r = mulberry(semilla), W = SALA_W, H = SALA_H;
  const cv = lienzoNuevo(W, H), g = cv.getContext("2d"), im = g.createImageData(W, H), d = im.data;
  const px = (x, y, col) => { if (x < 0 || y < 0 || x >= W || y >= H) return; const [R, G, B] = rgba(col), i = (y * W + x) * 4; d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = 255; };
  const tono = (rampa, i) => rampa[lim(Math.round(i), 0, rampa.length - 1)];
  const oscurecer = (x, y, t) => { if (x < 0 || y < 0 || x >= W || y >= H) return; const i = (y * W + x) * 4; d[i] *= t; d[i + 1] *= t; d[i + 2] *= t; };
  // ── el piso: losas de 24 con bisel, motas, grietas, musgo junto a los muros ──
  for (let f = 0; f < FILAS; f++) for (let c = 0; c < COLS; c++) {
    const x0 = IX0 + c * T, y0 = IY0 + f * T, base = 2.6 + (r() - 0.5) * 1.1;
    // algunas losas partidas en dos
    const partida = r() < 0.18 ? (r() < 0.5 ? "h" : "v") : null;
    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
      let i = base + bayer(x + c, y + f) * 0.9;
      if (x === 0 || y === 0) i += 0.9;                 // el borde de arriba/izquierda, iluminado
      if (x === T - 1 || y === T - 1) i = 0;            // la junta
      if (x === T - 2 || y === T - 2) i -= 0.7;
      if (partida === "h" && y === 11 && x > 1) i = 0.4;
      if (partida === "v" && x === 11 && y > 1) i = 0.4;
      const m = r();
      if (m < 0.05) i -= 1; else if (m > 0.97) i += 1;  // las motas
      px(x0 + x, y0 + y, i <= 0.05 ? C.junta : tono(C.piso, i));
    }
  }

// EL FONDO PINTADO (como en el original, que se ve dibujado y no "retro"): nada de tramado ni de
// motas sueltas. El piso son losas grandes y desparejas que no siguen la grilla de choques, cada
// una con su degradé suave y juntas oscuras blandas; los muros, ladrillos grandes con volumen y la
// profundidad que se oscurece hacia afuera; y encima, la luz: un centro más claro, sombra suave

/** Ruido de valor suave (interpolado), en [0,1]: manchas grandes sin granito. */
function ruidoValor(semilla, celda) {
  const r = mulberry(semilla), gw = Math.ceil(SALA_W / celda) + 2, gh = Math.ceil(SALA_H / celda) + 2, v = new Float32Array(gw * gh);
  for (let i = 0; i < v.length; i++) v[i] = r();

    const fx = x / celda, fy = y / celda, x0 = Math.floor(fx), y0 = Math.floor(fy), tx = s(fx - x0), ty = s(fy - y0);
    const a = v[y0 * gw + x0], b = v[y0 * gw + x0 + 1], c = v[(y0 + 1) * gw + x0], d = v[(y0 + 1) * gw + x0 + 1];
    return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
  };
}

}

  for (let i = 0; i < 6; i++) { const lado = r() < 0.5; const x = lado ? (r() < 0.5 ? IX0 + 4 : IX1 - 4) : IX0 + r() * (IX1 - IX0), y = lado ? IY0 + r() * (IY1 - IY0) : (r() < 0.5 ? IY0 + 3 : IY1 - 3); borron(x, y, 10 + r() * 14, 6 + r() * 6, C.musgo[2], 0.45); }

function gastar(filas, ch) {

/** El subtítulo, tal cual se escribe (con minúsculas). */
function subtituloSpr(str) {
  str = String(str);

    const arriba = 2, H = 9, esp = 1;
    const glifoDe = (ch) => SUBT[ch] || SUBT[TILDE_SUB[ch]] || SUBT[ch.toLowerCase()] || SUBT["?"];
    let W = 0; for (const ch of str) W += glifoDe(ch)[0].length + esp;
    const p = new Pix(W + 3, H + arriba + 3);
    let x = 1;
    for (const ch of str) {
      const f = glifoDe(ch), w = f[0].length;
      // los signos y las mayúsculas se apoyan en la línea de base (fila 6)
      const y0 = /[a-zñáéíóúü]/.test(ch) ? 0 : 0;
      f.forEach((fila, y) => { for (let i = 0; i < w; i++) if (fila[i] === "#") p.p(x + i, arriba + 1 + y0 + y, y >= 5 && y <= 6 ? "#e6e2dc" : "#ffffff"); });
      if (TILDE_SUB[ch]) { const cx0 = x + Math.floor(w / 2); if (ch === "Ñ") { p.p(cx0 - 2, arriba - 1, "#fff"); p.p(cx0 - 1, arriba - 2, "#fff"); p.p(cx0, arriba - 1, "#fff"); p.p(cx0 + 1, arriba - 2, "#fff"); } else { p.p(cx0, arriba - 1, "#fff"); p.p(cx0 + 1, arriba - 1, "#fff"); p.p(cx0 + 1, arriba - 2, "#fff"); } }

    const c = p.canvas(), s2 = lienzoNuevo(c.width + 1, c.height + 1), g = s2.getContext("2d");

/** "DAÑO ARRIBA" → "Daño arriba" (el subtítulo del original va así). */
function comoFrase(s) {
  s = String(s).toLowerCase();
  const i = s.search(/[a-zñáéíóúü]/);

// ── la letra a mano chica (para la etiqueta de la maldición, "Curse of the Blind!") ──
// En el video las mayúsculas miden 10 px y las demás 7, mezcladas. Las chicas salen de MANO
// quedándose con 7 de sus 10 filas y sacando una columna del medio (así el trazo sigue de 2).
const _manoChica = {};
function glifoManoChico(ch) {
  if (_manoChica[ch]) return _manoChica[ch];
  const m = MARCAS[ch], base = m ? m[0] : ch, f = MANO[base] || MANO["?"];
  const PROPIAS = { G: [".####.", "##....", "##....", "##.###", "##..##", "##..##", ".####."], S: [".####.", "##....", "###...", ".####.", "...###", "....##", "#####."] };
  let filas = PROPIAS[base] || [0, 2, 4, 5, 6, 8, 9].map((i) => f[i]);
  const w = filas[0].length;
  if (w >= 6 && !PROPIAS[base]) { const c = (w >> 1) - 1; filas = filas.map((r) => r.slice(0, c) + r.slice(c + 1)); }
  return (_manoChica[ch] = { filas, marca: m ? m[1] : null });
}
/** La letra de la etiqueta de la maldición: versalitas en bloque, como en el video (mayúsculas de
 *  8 px y las demás de 6, trazo de 2). Las chicas son las mismas de BLOQUE sin las filas 2 y 5. */
function glifoEtiqueta(ch, grande) {
  const base = MARCAS[ch] ? MARCAS[ch][0] : ch, f = BLOQUE[base] || BLOQUE["?"];
  return grande || f.length !== 8 ? f : [0, 1, 3, 4, 6, 7].map((i) => f[i]);
}
/** El texto de la etiqueta: la primera de cada palabra (y los signos) de 8, las demás de 6. */
function etiquetaSpr(str, tinta = "#0c0604") {
  str = String(str).toUpperCase();
  return hornear(`etiqueta2|${str}|${tinta}`, () => {
    const letras = [];

    for (const ch of str) {
      if (ch === " ") { letras.push(null); inicio = true; continue; }
      const grande = inicio || !/[A-ZÁÉÍÓÚÑÜ0-9]/.test(ch);
      inicio = false;
      const filas = glifoEtiqueta(ch, grande);
      letras.push({ filas, alto: filas.length, marca: MARCAS[ch] ? MARCAS[ch][1] : null });
    }
    let W = 0; letras.forEach((l) => { W += l ? l.filas[0].length + 1 : 4; });
    const arriba = 3, p = new Pix(W + 2, 8 + arriba + 1);

      if (l.marca === "´") { const c = x + Math.floor(l.filas[0].length / 2); p.p(c, y0 - 2, tinta); p.p(c + 1, y0 - 2, tinta); p.p(c + 1, y0 - 3, tinta); p.p(c + 2, y0 - 3, tinta); }
      if (l.marca === "~") { const c = x + Math.floor(l.filas[0].length / 2) - 2; for (const [dx, dy] of [[0, -2], [1, -3], [2, -3], [3, -2], [4, -2], [5, -3]]) p.p(c + dx, y0 + dy, tinta); }

// EL PAPEL Y LA TINTA: las hojas rasgadas de los menús (con chinches y sombra), la pared de
// papel gris con garabatos desvaídos (dibujos "de chico" sacados de los mismos sprites), la
// franja de tinta de los rótulos, y el logo: letras de bloque enormes con degradé tramado,
// relieve oscuro y las pintitas del sombrero de Shumio, que gotean esporas.
// ─────────────────────────────────────────────────────────────────────────────

/** Un ruido suave de una dimensión (suma de senos con fase por semilla): para los bordes rasgados. */
function ruido1(r) {
  const f = [0.07 + r() * 0.05, 0.19 + r() * 0.1, 0.43 + r() * 0.2], a = [1.3, 0.8, 0.45], ph = f.map(() => r() * TAU);
  return (x) => f.reduce((s, fr, i) => s + Math.sin(x * fr + ph[i]) * a[i], 0);
}

const TONOS_PAPEL = {
  blanco: ["#f4f0ea", "#e9e4dc", "#dcd6cc", "#c9c2b6", "#8f877c"],
  crema: ["#f3e7d2", "#e8d8bd", "#d9c5a4", "#c4ad89", "#8a7457"],
  gris: ["#dcd8d2", "#cfcac2", "#c0bab1", "#aca59b", "#77716a"],
};
/** Una hoja rasgada de w×h (más la sombra). tono: blanco, crema, gris. */
function papelSpr(w, h, semilla = 1, tono = "blanco") {
  return hornear(`papel${w}x${h}|${semilla}|${tono}`, () => {
    const r = mulberry(semilla * 977 + w * 13 + h), R = TONOS_PAPEL[tono];
    const arr = ruido1(r), aba = ruido1(r), izq = ruido1(r), der = ruido1(r);
    const p = new Pix(w + 8, h + 8), o = 3;
    const dentro = (x, y) => {
      const t = arr(x) * 1.1, b = aba(x) * 1.2, l = izq(y) * 1.1, d = der(y) * 1.2;
      return y >= o + 1 + t && y <= o + h - 2 + b && x >= o + 1 + l && x <= o + w - 2 + d;
    };
    // un par de muescas (el papel arrancado de un cuaderno)
    const muescas = [];
    for (let i = 0; i < 2; i++) muescas.push([o + 4 + r() * (w - 8), r() < 0.5 ? o + 1 : o + h - 2, 2 + r() * 2.5]);
    const enMuesca = (x, y) => muescas.some(([mx, my, mr]) => Math.hypot(x - mx, (y - my) * 1.4) < mr);
    for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) {
      if (!dentro(x, y) || enMuesca(x, y)) continue;
      // luz de arriba a la izquierda, tramada, y alguna fibra del papel
      const l = 1 - (y - o) / h * 0.55 - (x - o) / w * 0.25 + bayer(x, y) * 0.25;
      let c = R[l > 0.72 ? 0 : l > 0.45 ? 1 : 2];
      if (r() < 0.012) c = R[2];
      p.p(x, y, c);
    }
    // rayones de lápiz, suaves (como la hoja del menú original)
    for (let i = 0; i < 3; i++) {
      const x0 = o + 4 + r() * (w - 14), y0 = o + 4 + r() * (h - 12), L = 4 + r() * 8, an = -0.7 + r() * 0.3;
      trazo(x0, y0, x0 + Math.cos(an) * L, y0 + Math.sin(an) * L, (x, y) => { if (p.g(x, y)) p.p(x, y, R[2]); });
    }
    p.bordeInterior({ [R[0]]: R[3], [R[1]]: R[3], [R[2]]: R[3] });
    p.contorno(R[4]);
    const c = p.canvas(), s = lienzoNuevo(c.width + 3, c.height + 3), g = s.getContext("2d");
    g.globalAlpha = 0.3; g.drawImage(tinte(c, "#0a0608"), 3, 3); g.globalAlpha = 1; g.drawImage(c, 0, 0);
    return s;
  });
}
/** La chinche que sostiene la hoja. */
function chincheSpr() {
  return hornear("chinche", () => {
    const p = new Pix(9, 9);
    p.bola(4.5, 4.5, 3.6, 3.4, ["#3a3c40", "#6a6e74", "#9ca0a6", "#d2d6da"], { luz: [-0.6, -0.7, 0.4], trama: 0.5 });
    p.p(3, 3, "#ffffff");
    p.contorno(PAL.tinta, true);
    return p.canvas();
  });
}

/** Un garabato hecho "a mano" desde un sprite: su contorno y sus partes oscuras, en tinta. */
function garabato(c, tinta = "#2b2326", escala = 2, relleno = null) {
  return hornear(`garabato|${tinta}|${escala}|${relleno}|` + (c.__id ||= Math.random().toString(36).slice(2)), () => {
    let d = _lecturas.get(c); if (!d) { d = c.getContext("2d").getImageData(0, 0, c.width, c.height).data; _lecturas.set(c, d); }
    const W = c.width, H = c.height;
    const a = (x, y) => x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] > 100;
    const lum0 = (x, y) => { const i = (y * W + x) * 4; return (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11) / 255; };
    // la luz promediada en 3×3 (así el tramado no cuenta como borde: sólo los cambios de verdad)
    const L = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (a(x + dx, y + dy)) { s += lum0(x + dx, y + dy); n++; }
      L[y * W + x] = n ? s / n : 0;
    }
    const lum = (x, y) => L[y * W + x];
    const p = new Pix(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!a(x, y)) continue;
      const borde = !a(x + 1, y) || !a(x - 1, y) || !a(x, y + 1) || !a(x, y - 1);
      // además del contorno, los bordes de adentro (donde el color cambia mucho): como un dibujo para colorear
      const salto = (a(x + 1, y) && Math.abs(lum(x, y) - lum(x + 1, y)) > 0.17) || (a(x, y + 1) && Math.abs(lum(x, y) - lum(x, y + 1)) > 0.17);
      if (borde || lum0(x, y) < 0.12 || salto) p.p(x, y, tinta);
      else if (relleno) p.p(x, y, relleno);
    }
    const q = p.canvas(), out = lienzoNuevo(W * escala, H * escala), go = out.getContext("2d");
    go.imageSmoothingEnabled = false; go.drawImage(q, 0, 0, W * escala, H * escala);
    return out;
  });
}

/** La pared de papel gris con dibujos desvaídos (el fondo de todos los menús). */
function fondoMenuSpr(W, H) {
  return hornear(`fondoMenu${W}x${H}`, () => {
    const c = lienzoNuevo(W, H), g = c.getContext("2d"), r = mulberry(31337);
    const p = new Pix(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const nx = (x - W * 0.55) / (W * 0.62), ny = (y - H * 0.42) / (H * 0.8), e = nx * nx + ny * ny;
      const k = e + bayer(x, y) * 0.22;
      p.p(x, y, k < 0.35 ? "#c9c4bc" : k < 0.62 ? "#bdb7ae" : k < 0.95 ? "#aca69c" : "#958f86");
    }
    g.drawImage(p.canvas(), 0, 0);
    // los dibujos del chico en la pared: Shumio, hongos, un mosquín, un cofre, un corazón, una gota
    const tinta = "rgba(92,84,80,0.22)";
    const dibujos = [spritesShumio().cab.frente[0], matasSpr(3), mosquinSpr(0), cofreSpr(false, false), corazonSpr("rojo"), lagrimaSpr(6), hongonSpr(0), iconoSpr("brujula"), bombaSpr(1), aranaSpr(0)];
    const lugares = [[0.08, 0.12], [0.86, 0.1], [0.06, 0.62], [0.9, 0.66], [0.2, 0.86], [0.74, 0.88], [0.93, 0.36], [0.03, 0.36], [0.62, 0.05], [0.36, 0.93]];
    dibujos.forEach((s, i) => {
      const gb = garabato(s, tinta, 2), [u, v] = lugares[i];
      g.save(); g.translate(Math.round(u * W), Math.round(v * H)); g.rotate((r() - 0.5) * 0.5);
      g.drawImage(gb, -gb.width / 2, -gb.height / 2); g.restore();
    });
    // rayas, estrellitas y círculos sueltos
    g.fillStyle = tinta;
    for (let i = 0; i < 16; i++) {
      const x = r() * W, y = r() * H, t = r();
      if (t < 0.4) { const L = 4 + r() * 8, an = r() * TAU; trazo(x, y, x + Math.cos(an) * L, y + Math.sin(an) * L, (a, b) => g.fillRect(a, b, 2, 2)); }
      else if (t < 0.7) { g.fillRect(x - 3, y, 7, 2); g.fillRect(x, y - 3, 2, 7); }
      else { const rr = 3 + r() * 5; for (let k = 0; k < 24; k++) { const an = k / 24 * TAU; g.fillRect(Math.round(x + Math.cos(an) * rr), Math.round(y + Math.sin(an) * rr * 0.8), 1, 1); } }
    }
    return c;
  });
}

/** La franja de los rótulos, calcada de la silueta del video: una pincelada casi negra con tinte
 *  rojo (#0a0000) de 23 px de cuerpo en el original (acá 21); arranca a la izquierda como una cola
 *  fina con manchas sueltas, engorda hacia el medio y termina más cortada a la derecha. */
function bandaSpr(w, h = 21) {
  return hornear(`banda8|${w}x${h}`, () => {
    const m = 8, p = new Pix(w + m * 2, h + m * 2), r = mulberry(w * 13 + h), arr = ruido1(r), aba = ruido1(r);
    const C = "rgba(10,0,0,0.94)", disco = (cx0, cy0, rr) => { for (let y = Math.floor(cy0 - rr); y <= cy0 + rr; y++) for (let x = Math.floor(cx0 - rr); x <= cx0 + rr; x++) if (Math.hypot(x + 0.5 - cx0, y + 0.5 - cy0) <= rr) p.p(x, y, C); };
    const suave = (u) => u * u * (3 - 2 * u);
    for (let x = 0; x < w; x++) {
      const u = x / (w - 1);
      // el grosor: cola a la izquierda (el primer 14 %), lleno en el medio, corte a la derecha
      const g = u < 0.14 ? 0.15 + 0.85 * suave(u / 0.14) : u > 0.95 ? 1 - 0.35 * ((u - 0.95) / 0.05) : 1;
      const med = m + h / 2 + (u < 0.14 ? (1 - u / 0.14) * 3 : 0), mitad = (h / 2) * g;
      const t = med - mitad + arr(x * 0.22) * 1.3, b = med + mitad + aba(x * 0.18) * 1.5;
      for (let y = Math.floor(t); y < Math.ceil(b); y++) p.p(x + m, y, C);
    }
    // bultos pegados a los bordes (la pintura que se corrió) y manchas sueltas alrededor
    for (let i = 0; i < w / 7; i++) { const x = m + r() * w, arriba = r() < 0.5; disco(x, arriba ? m + 1.5 + r() : m + h - 1.5 - r(), 1.2 + r() * 2.2); }
    for (let i = 0; i < 16; i++) { const x = m + r() * w * 0.2, y = m + h / 2 + (r() - 0.35) * h * 1.4; disco(x, y, 0.8 + r() * 2.2); }
    for (let i = 0; i < 16; i++) { const x = m + r() * w, arriba = r() < 0.5, y = arriba ? m - 1 - r() * 6 : m + h + 1 + r() * 6; disco(x, y, 0.6 + r() * 1.5); }
    for (let i = 0; i < 5; i++) disco(m + w * (0.95 + r() * 0.06), m + r() * h, 0.8 + r() * 1.8);
    // el borde, un rojo apenas más claro (como la sangre que se seca)
    const lleno = (x, y) => { const c = p.g(x, y); return !!c; };
    for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) if (lleno(x, y) && !lleno(x, y - 1)) p.p(x, y, "rgba(40,4,6,0.94)");
    return p.canvas();
  });
}
/** La etiqueta de la maldición, dibujada sobre la del video: una cinta de papel apenas inclinada
 *  (la punta derecha 5 px más arriba) que ondula en escalones de un píxel; las dos puntas rotas en
 *  dos lóbulos con una grieta en el medio; papel #D2BEAA con borrones grises arriba y la panza más
 *  oscura; contorno #0C0604 y una sombra de dos píxeles abajo. */
function pergaminoSpr(texto) {
  return hornear(`pergamino8|${texto}`, () => {
    const txt = etiquetaSpr(texto, "#0c0604"), w = Math.max(70, txt.width + 30), H = 34;
    const p = new Pix(w + 8, H), r = mulberry(hashTexto(texto)), base = H / 2;
    const PAPEL = "#d2beaa", LUZ = "#ddcbb8", PANZA = "#c1ab95", MANCHA = "#bcac98", T = "#0c0604";
    const arriba = [], abajo = [];
    for (let x = 0; x < w; x++) {
      const u = x / (w - 1);
      // la parte del medio (donde va el texto) queda pareja; lo irregular está hacia las puntas,
      // que se levantan o bajan un poco (así las letras no parecen torcidas)
      const e = Math.pow(Math.abs(u - 0.5) * 2, 3);
      const c = base + (u < 0.5 ? 1 : -1) * e * 2 + (r() < 0.04 ? 0 : 0);
      const hh = 7.8 + 1.2 * e;
      arriba.push(Math.round(c - hh)); abajo.push(Math.round(c + hh));
    }
    // los bordes desparejos: escalones de un píxel en tramos largos, cada borde por su lado (como en
    // el original); mueven el papel, no el texto
    for (const borde of [arriba, abajo]) {
      let x = 0, d = 0;
      while (x < w) { const L = 14 + Math.floor(r() * 26); d = lim(d + (r() < 0.5 ? -1 : 1), -1, 1); for (let k = x; k < Math.min(w, x + L); k++) borde[k] += d; x += L; }
    }
    // las puntas rotas: la silueta (cuánto se mete desde el borde) según la altura, t = 0 arriba … 1 abajo
    const tramo = (pts, t) => { for (let i = 1; i < pts.length; i++) if (t <= pts[i][1]) { const [x0, t0] = pts[i - 1], [x1, t1] = pts[i]; return Math.round(x0 + (x1 - x0) * (t - t0) / (t1 - t0)); } return pts[pts.length - 1][0]; };
    const IZQ = [[5, 0], [1, 0.22], [0, 0.4], [2, 0.52], [4, 0.56], [3, 0.62], [2, 0.8], [5, 1]];
    const DER = [[2, 0], [0, 0.25], [1, 0.46], [3, 0.52], [1, 0.58], [0, 0.75], [2, 1]];
    const x0 = 3;
    for (let x = 0; x < w; x++) for (let y = arriba[x]; y <= abajo[x]; y++) {
      const t = (y - arriba[x]) / (abajo[x] - arriba[x]);
      if (x < tramo(IZQ, t) || w - 1 - x < tramo(DER, t)) continue;
      p.p(x + x0, y, y === arriba[x] ? LUZ : y >= abajo[x] - 1 ? PANZA : PAPEL);
    }
    // las grietas: rayitas negras que entran desde cada punta
    const tg = 0.54;
    { const x = 0, y = Math.round(arriba[x] + (abajo[x] - arriba[x]) * tg); for (let k = 2; k < 8; k++) p.p(x0 + k, y + (k > 5 ? 1 : 0), T); }
    { const x = w - 1, y = Math.round(arriba[x] + (abajo[x] - arriba[x]) * tg); for (let k = 2; k < 7; k++) p.p(x0 + x - k, y, T); }
    // borrones grises suaves cerca del borde de arriba (como papel manchado)
    for (let i = 0; i < 3; i++) {
      const cx0 = w * (0.22 + r() * 0.56), cy0 = arriba[Math.round(cx0)] + 3 + r() * 2, rx = 5 + r() * 9, ry = 1.4 + r();
      for (let y = Math.floor(cy0 - ry); y <= cy0 + ry; y++) for (let x = Math.floor(cx0 - rx); x <= cx0 + rx; x++) {
        const d = ((x - cx0) / rx) ** 2 + ((y - cy0) / ry) ** 2;
        if (d <= 1 && p.g(x + x0, y) === PAPEL) p.p(x + x0, y, MANCHA);
      }
    }
    p.contorno(T);
    const q = p.canvas(), out = lienzoNuevo(q.width, q.height + 2), g = out.getContext("2d");
    // la sombra de abajo: dos píxeles (el borde de abajo queda más grueso, como en el original)
    g.globalAlpha = 0.55; g.drawImage(tinte(q, "#2a1410"), 0, 2); g.globalAlpha = 0.85; g.drawImage(tinte(q, "#1a0a08"), 0, 1); g.globalAlpha = 1; g.drawImage(q, 0, 0);
    // el texto, siguiendo la inclinación de la cinta (se apoya en el medio)
    const mid = Math.round((arriba[Math.round(w / 2)] + abajo[Math.round(w / 2)]) / 2);
    g.drawImage(txt, Math.round(out.width / 2 - txt.width / 2), mid - Math.round(txt.height / 2) + 1);
    return out;
  });
}

/** El logo, con la construcción del original: "SHUMIO'S" enorme en bloque (×3), con bandas de rojo
 *  en damero, el filo de arriba con luz y un relieve hondo abajo a la derecha; "DEPTHS" en rojo claro,
 *  abajo a la derecha (como el subtítulo); una salpicadura que chorrea, y las pintitas del sombrero. */
function logoSpr() {
  return hornear("logo4", () => {
    const grande = "SHUMIO'S", chico = "DEPTHS", E1 = 4, E2 = 3, HONDO = 6;
    const ancho = (s) => _medir(s, (ch) => glifoBloque(ch).w, 1);
    const w1 = ancho(grande) * E1, w2 = ancho(chico) * E2, h1 = ALTO_BLOQUE * E1, h2 = ALTO_BLOQUE * E2;
    const W = w1 + 40, H = h1 + h2 + 46;
    const p = new Pix(W, H), x1 = 26, y1 = 6, x2 = x1 + w1 - w2 + 4, y2 = y1 + h1 + HONDO - 1;
    const masc = new Uint8Array(W * H), capa = new Uint8Array(W * H);
    const poner = (s, x0, y0, E, id) => {
      let x = x0;
      for (const ch of s) {
        const gl = glifoBloque(ch);
        gl.filas.forEach((f, y) => { for (let i = 0; i < f.length; i++) if (f[i] !== ".") for (let a = 0; a < E; a++) for (let b = 0; b < E; b++) { const X = x + i * E + a, Y = y0 + y * E + b; if (X < W && Y < H) { masc[Y * W + X] = 1; capa[Y * W + X] = id; } } });
        x += (gl.w + 1) * E;
      }
    };
    poner(grande, x1, y1, E1, 1); poner(chico, x2, y2, E2, 2);
    const lleno = (x, y) => x >= 0 && y >= 0 && x < W && y < H && masc[y * W + x];
    const r = mulberry(4040);
    // 0) la salpicadura, detrás de la primera letra: una mancha con gotas y chorros
    const sx = x1 - 6, sy = y1 + h1 + 4, SANG = ["#4a0508", "#7e0c10", "#b3161a", "#d8261f"];
    const disco = (cx0, cy0, rr, c) => { for (let y = Math.floor(cy0 - rr); y <= cy0 + rr; y++) for (let x = Math.floor(cx0 - rr); x <= cx0 + rr; x++) if (Math.hypot(x + 0.5 - cx0, (y + 0.5 - cy0) * 1.15) <= rr) p.p(x, y, c); };
    disco(sx, sy, 9, SANG[2]); disco(sx - 6, sy + 3, 6, SANG[2]); disco(sx + 4, sy - 5, 5, SANG[3]);
    for (let i = 0; i < 16; i++) {   // gotas que saltaron, más chicas cuanto más lejos
      const a = Math.PI * (0.35 + r() * 1.25), d = 12 + r() * 16, rr = Math.max(0.7, 2.6 - d / 12);
      disco(sx + Math.cos(a) * d, sy + Math.sin(a) * d * 0.8, rr, SANG[2]);
    }
    for (let i = 0; i < 4; i++) {    // chorros que caen
      const x = sx - 10 + i * 5 + Math.floor(r() * 3), L = 8 + Math.floor(r() * 16), y0 = sy + 5;
      for (let y = 0; y < L; y++) { p.p(x, y0 + y, SANG[2]); p.p(x + 1, y0 + y, SANG[1]); }
      disco(x + 1, y0 + L, 1.6, SANG[2]);
    }
    // 1) el relieve hondo (dos tonos)
    for (let k = HONDO; k >= 1; k--) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (lleno(x - k, y - k) && !lleno(x, y)) {
      const id = capa[(y - k) * W + x - k];
      p.p(x, y, id === 1 ? (k > 2 ? "#300709" : "#560d10") : (k > 1 ? "#3a0a0c" : "#5c1216"));
    }
    // 2) la cara: bandas de rojo con transición en damero; el filo de arriba y el de la izquierda con luz
    const ROJO = ["#ff8a70", "#ec4a38", "#c8281f", "#9a1a16"], CLARO = ["#ffc2ae", "#ff8a70", "#f06a52", "#c8402f"];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!lleno(x, y)) continue;
      const id = capa[y * W + x], y0 = id === 1 ? y1 : y2, hh = id === 1 ? h1 : h2, R = id === 1 ? ROJO : CLARO;
      const t = (y - y0) / hh, dam = (x + y) & 1;
      let k = t < 0.28 ? 1 : t < 0.36 ? (dam ? 1 : 2) : t < 0.62 ? 2 : t < 0.7 ? (dam ? 2 : 3) : 3;
      if (!lleno(x, y - 1) || !lleno(x, y - 2)) k = 0;               // el filo de arriba (2 px con luz)
      else if (!lleno(x - 1, y) && k > 1) k--;
      p.p(x, y, R[k]);
    }
    // 3) las pintitas del sombrero de Shumio, en la banda de arriba de las letras grandes
    for (let i = 0; i < 40; i++) {
      const x = x1 + Math.floor(r() * w1), y = y1 + 4 + Math.floor(r() * (h1 * 0.4));
      const ok = [[-1, -1], [0, -1], [1, -1], [2, -1], [3, -1], [-1, 0], [3, 0], [-1, 1], [3, 1], [-1, 2], [0, 2], [1, 2], [2, 2], [3, 2]].every(([dx, dy]) => lleno(x + dx, y + dy) && capa[(y + dy) * W + x + dx] === 1);
      if (!ok) continue;
      p.sello(x, y, [".cc", "ccC"], { c: "#fff2dc", C: "#e2c8a6" });
    }
    // 4) el contorno grueso, en dos pasadas
    p.contorno(PAL.tinta, true); p.contorno(PAL.tinta, false);
    return p.canvas();
  });
}

/** Shumio dibujado a mano para la hoja del título: trazos limpios de marcador (se pinta a 1 px y se
 *  agranda ×2, así cada línea queda de 2). llora: las lágrimas de esporas cayendo. */
function dibujoShumio(llora = 0) {
  return hornear(`dibujoShumio${llora}`, () => {
    const p = new Pix(36, 40), T = TINTA_MANO;
    const aro = (cx0, cy0, rx, ry, desde, hasta) => {   // un arco de elipse, continuo (ángulos en radianes)
      let ant = null;
      for (let i = 0; i <= 90; i++) {
        const a = desde + (hasta - desde) * i / 90, x = Math.round(cx0 + Math.cos(a) * rx), y = Math.round(cy0 + Math.sin(a) * ry);
        if (ant) trazo(ant[0], ant[1], x, y, (X, Y) => p.p(X, Y, T)); ant = [x, y];
      }
    };
    const lin = (a, b, c, d) => trazo(a, b, c, d, (X, Y) => p.p(X, Y, T));
    // el sombrero: media elipse y el ala, apenas curvada
    aro(18, 14, 15, 11, Math.PI, TAU);
    for (let x = 3; x <= 33; x++) p.p(x, Math.round(14 + Math.pow((x - 18) / 15, 2) * 1.6), T);
    // las pintitas del sombrero
    for (const [x, y, r] of [[11, 8, 2.2], [20, 5.5, 2.4], [26.5, 10, 1.9]]) aro(x, y, r, r, 0, TAU);
    // la cara: los costados y la barbilla redonda
    lin(6, 15, 6, 20); lin(30, 15, 30, 20);
    aro(18, 20, 12, 7, 0, Math.PI);
    // los ojos, grandes y rellenos, con el brillo
    for (const ex of [13, 23]) { for (let y = 16; y <= 21; y++) for (let x = ex - 2; x <= ex + 1; x++) if (Math.hypot(x + 0.5 - ex, (y + 0.5 - 18.5) * 0.8) <= 2.1) p.p(x, y, T); p.borrar(ex - 1, 17); }
    lin(17, 24, 18, 24);                                    // la boquita
    // el cuerpo, los bracitos y los pies
    lin(13, 27, 12, 34); lin(23, 27, 24, 34); lin(12, 34, 24, 34);
    lin(12, 29, 8, 32); lin(24, 29, 28, 32);
    aro(15, 36, 2, 1.4, 0, Math.PI); aro(21, 36, 2, 1.4, 0, Math.PI);
    // las lágrimas: gotitas que caen de los ojos
    if (llora) for (const ex of [11, 25]) { lin(ex, 23, ex, 25); p.p(ex - 1, 26, T); p.p(ex + 1, 26, T); p.p(ex, 27, T); }
    const c = p.canvas(), out = lienzoNuevo(72, 80), g = out.getContext("2d");
    g.imageSmoothingEnabled = false; g.drawImage(c, 0, 0, 72, 80);
    return out;
  });
}
