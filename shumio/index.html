// ══════════ 11-piso.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL PISO: el mapa de salas, generado como en el original. Una grilla de 9×8; desde la sala
// de inicio (4,3) se expande a lo ancho: cada vecino se agrega salvo que ya esté lleno, que ya
// tenga 2 vecinos llenos (así no se forman bloques y quedan pasillos y puntas), que se haya
// llegado a la cuota, o que salga cara en una moneda (50 %). Salas = azar(0..1) + 5 + piso × 2,6.
// El jefe va en la punta más lejana; el tesoro y la tienda en otras puntas; la secreta en un
// hueco rodeado por 3 salas o más (que se abre con una bomba). Si no alcanzan las puntas, se
// vuelve a tirar.
// ─────────────────────────────────────────────────────────────────────────────

const MAPA_W = 9, MAPA_H = 8, MAPA_INICIO = [4, 3];
const PISOS = [
  null,
  { cap: "sotano", nombre: "SÓTANO HÚMEDO I", musica: "sotano" },
  { cap: "sotano", nombre: "SÓTANO HÚMEDO II", musica: "sotano" },
  { cap: "raices", nombre: "LAS RAÍCES I", musica: "raices" },
  { cap: "raices", nombre: "LAS RAÍCES II", musica: "raices" },
];
const ULTIMO_PISO = 4;

function generarPiso(n) {
  for (let i = 0; i < 400; i++) { const p = intentarPiso(n); if (p) return p; }
  throw new Error("no se pudo generar el piso " + n);
}

function intentarPiso(n) {
  const meta = Math.min(19, A.ent(0, 1) + 5 + Math.floor(n * 2.6));
  const K = (c, f) => c + f * MAPA_W, dentro = (c, f) => c >= 0 && f >= 0 && c < MAPA_W && f < MAPA_H;
  const lleno = new Uint8Array(MAPA_W * MAPA_H);
  const vecinos = (c, f) => { let s = 0; for (const [dx, dy] of DIRS) if (dentro(c + dx, f + dy) && lleno[K(c + dx, f + dy)]) s++; return s; };
  const [c0, f0] = MAPA_INICIO;
  lleno[K(c0, f0)] = 1;
  let cuenta = 1;
  const cola = [[c0, f0]], orden = [[c0, f0]];
  while (cola.length) {
    const [c, f] = cola.shift();
    for (const [dx, dy] of DIRS) {
      const C = c + dx, F = f + dy;
      if (!dentro(C, F) || lleno[K(C, F)] || vecinos(C, F) > 1 || cuenta >= meta || A.si(0.5)) continue;
      lleno[K(C, F)] = 1; cuenta++; cola.push([C, F]); orden.push([C, F]);
    }
  }
  if (cuenta < meta) return null;

  // distancias desde el inicio (en salas)
  const dist = new Int16Array(MAPA_W * MAPA_H).fill(-1), q = [[c0, f0]];
  dist[K(c0, f0)] = 0;
  while (q.length) { const [c, f] = q.shift(); for (const [dx, dy] of DIRS) { const C = c + dx, F = f + dy; if (dentro(C, F) && lleno[K(C, F)] && dist[K(C, F)] < 0) { dist[K(C, F)] = dist[K(c, f)] + 1; q.push([C, F]); } } }

  const puntas = orden.filter(([c, f]) => !(c === c0 && f === f0) && vecinos(c, f) === 1);
  if (puntas.length < 3) return null;
  puntas.sort((a, b) => dist[K(b[0], b[1])] - dist[K(a[0], a[1])]);
  const jefe = puntas[0];
  if (dist[K(jefe[0], jefe[1])] < 3) return null;
  const resto = A.mezclar(puntas.slice(1));
  const tesoro = resto[0], tienda = resto[1];

  // la secreta: el hueco con más salas alrededor (3 o más; si no hay, 2), lejos del jefe
  let secreta = null, mejor = 0;
  for (let f = 0; f < MAPA_H; f++) for (let c = 0; c < MAPA_W; c++) {
    if (lleno[K(c, f)]) continue;
    const v = vecinos(c, f);
    if (v < 2) continue;
    if (Math.abs(c - jefe[0]) + Math.abs(f - jefe[1]) === 1) continue;
    const nota = v * 10 + A.f();
    if (nota > mejor) { mejor = nota; secreta = [c, f]; }
  }

  const piso = { n, cap: PISOS[n].cap, nombre: PISOS[n].nombre, salas: new Map(), inicio: null, jefe: null };
  const nueva = (c, f, tipo) => {
    const sala = { c, f, tipo, clave: K(c, f), semilla: A.ent(1, 2e9), espejo: A.ent(0, 3), visitada: false, vista: false,
      limpia: tipo !== "normal" && tipo !== "jefe", cosas: [], decal: null, celdas: null, huecos: [], puertas: [null, null, null, null] };

    else if (tipo === "tienda") d = DISENO_TIENDA;
    else if (tipo === "secreta") d = DISENO_SECRETA;
    else if (tipo === "pacto") d = DISENO_PACTO;
    if (tipo !== "normal") sala.espejo = 0;

  };

    let tipo = "normal";
    if (c === c0 && f === f0) tipo = "inicio";
    else if (c === jefe[0] && f === jefe[1]) tipo = "jefe";
    else if (c === tesoro[0] && f === tesoro[1]) tipo = "tesoro";
    else if (c === tienda[0] && f === tienda[1]) tipo = "tienda";
    nueva(c, f, tipo);
  }
  if (secreta) nueva(secreta[0], secreta[1], "secreta");

  piso.jefe = piso.salas.get(K(jefe[0], jefe[1]));

  // las puertas (de los dos lados)
  for (const s of piso.salas.values()) for (let d = 0; d < 4; d++) {
    const C = s.c + DIRS[d][0], F = s.f + DIRS[d][1];
    if (!dentro(C, F)) continue;
    const o = piso.salas.get(K(C, F));
    if (!o) continue;
    const esp = (x) => x.tipo === "secreta";
    s.puertas[d] = {
      destino: o,
      tipo: tipoPuerta(s, o),
      llave: n >= 2 && (o.tipo === "tesoro" || o.tipo === "tienda" || s.tipo === "tesoro" || s.tipo === "tienda") && !esp(s) && !esp(o),
      secreta: esp(s) || esp(o),
      revelada: false,
    };
  }
  // la puerta con llave es UNA (se abre de un lado y queda abierta de los dos)
  for (const s of piso.salas.values()) for (let d = 0; d < 4; d++) { const p = s.puertas[d]; if (p && !p.par) { const o = p.destino.puertas[opuesta(d)]; p.par = o; o.par = p; } }
  llenarSalasEspeciales(piso);
  return piso;
}

function tipoPuerta(a, b) {
  for (const t of ["secreta", "jefe", "pacto", "tesoro", "tienda"]) if (a.tipo === t || b.tipo === t) return t === "secreta" ? "secreta" : t;
  return "normal";
}

/** Lo que hay en el tesoro, la tienda y la secreta (lo demás aparece al limpiar). */
function llenarSalasEspeciales(piso) {
  for (const s of piso.salas.values()) {
    if (s.tipo === "tesoro") s.cosas.push(pedestal(cx(6), cy(3), sacarObjeto("tesoro")));
    if (s.tipo === "tienda") {
      const ofertas = [
        { t: "objeto", id: sacarObjeto("tienda"), precio: 15 },
        { t: "corazon", sub: "rojo", precio: 3 },
        A.si(0.5) ? { t: "bomba", precio: 5 } : { t: "capsula", sub: A.ent(0, COLORES_CAPSULA.length - 1), precio: 4 },
        { t: "llave", precio: 5 },
        A.si(0.45) ? { t: "corazon", sub: "espora", precio: 5 } : { t: "objeto", id: sacarObjeto("tienda"), precio: 15 },
      ];
      ofertas.forEach((o, i) => {
        const x = cx(2 + i * 2), y = cy(3);
        if (o.t === "objeto") s.cosas.push(Object.assign(pedestal(x, y, o.id), { precio: o.precio }));
        else s.cosas.push(Object.assign(recogible(o.t, x, y, o.sub), { precio: o.precio, quieto: true }));
      });
      s.tendero = true;
    }
    if (s.tipo === "secreta") {
      if (A.si(0.3)) s.cosas.push(pedestal(cx(6), cy(3), sacarObjeto("secreta")));
      else {
        const n = A.ent(3, 5);
        for (let i = 0; i < n; i++) s.cosas.push(recogible(A.pesos([["moneda", 5], ["bomba", 2], ["llave", 1], ["corazon", 2]]), cx(4 + (i % 5)), cy(2 + ((i / 5) | 0) * 2 + (i % 2)), "espora"));
      }
    }
  }
}

/** La sala del pacto (no está en el mapa: se abre desde la del jefe si hubo suerte). */
function crearSalaPacto(piso, desde, dir) {
  const s = { c: -1, f: -1, tipo: "pacto", clave: -1, semilla: A.ent(1, 2e9), espejo: 0, visitada: false, vista: false, limpia: true, cosas: [], decal: null, celdas: null, huecos: [], puertas: [null, null, null, null] };
  s.huecos = armarGrilla(s, DISENO_PACTO);
  const ofertas = A.si(0.5) ? 2 : 1;
  for (let i = 0; i < ofertas; i++) {
    const id = sacarObjeto("pacto");
    s.cosas.push(Object.assign(pedestal(ofertas === 1 ? cx(6) : cx(4 + i * 4), cy(3), id), { pacto: OBJETOS[id] && OBJETOS[id].calidad >= 3 ? 2 : 1 }));
  }
  const p = { destino: desde, tipo: "pacto", llave: false, secreta: false, revelada: true };
  s.puertas[opuesta(dir)] = p;
  const q = { destino: s, tipo: "pacto", llave: false, secreta: false, revelada: true, par: p };
  p.par = q;
  desde.puertas[dir] = q;
  return s;
}

/** ¿La puerta se ve? (las secretas, sólo después de volarlas) */
function puertaVisible(p) { return p && (!p.secreta || p.revelada); }

// ══════════ 12-jugador.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// SHUMIO: moverse con inercia corta, llorar esporas en 4 direcciones y las cuentas del
// original. Retardo entre lágrimas = 16 − 6·√(1,3·L + 1) (en cuadros de 30 Hz), daño =
// 3,5·√(1 + 1,2·D) + plano, alcance 6,5 baldosas, velocidad 1 (tope 2). La cabeza mira hacia
// donde llora y cierra los ojos al soltar la lágrima; el cuerpo, hacia donde camina.
// ─────────────────────────────────────────────────────────────────────────────

function nuevoJugador() {
  return {
    x: cx(6), y: cy(3), r: 5, vx: 0, vy: 0, z: 0,
    cont: 6, vida: 6, esporas: 0,               // en medios corazones
    monedas: 0, bombas: 1, llaves: 0,
    danoUps: 0, danoPlano: 0, danoMult: 1, lagUps: 0, alcance: 6.5, velLag: 1, vel: 1, suerte: 0, tamLag: 1,
    triple: false, veneno: false, hielo: false, rebote: false, espectral: false, atraviesa: false, buscadora: false, fuego: false,
    vuela: false, iman: false, bombaGorda: false, colorLag: "espora",
    objetos: [], activo: null, capsula: null,
    inv: 0, enfriar: 0, mirar: ABAJO, mirarCue: ABAJO, gesto: 0, tGesto: 0, paso: 0, ojo: 0, tParpadeo: 120,
    danoSala: 0, sostiene: null, tSostiene: 0, muerto: false, tMuerte: 0, golpesPiso: 0, golpesJefe: 0,
  };
}

// ── las cuentas (las del original, pasadas a 60 Hz) ──
function danoDe(j) { return (3.5 * Math.sqrt(1 + 1.2 * Math.max(0, j.danoUps)) + j.danoPlano + j.danoSala) * j.danoMult; }
function retardoDe(j) {
  const L = j.lagUps;
  let d = L >= 0 ? 16 - 6 * Math.sqrt(L * 1.3 + 1) : L >= -0.77 ? 16 - 6 * Math.sqrt(L * 1.3 + 1) : 16 - 6 * L;
  d = Math.max(5, d);
  if (j.triple) d = d * 2.1 + 3;
  return d;
}
const cuadrosEntreLagrimas = (j) => (retardoDe(j) + 1) * 2;
const lagrimasPorSeg = (j) => 30 / (retardoDe(j) + 1);
const velDe = (j) => lim(j.vel, 0.4, 2);
const alcancePx = (j) => Math.max(2, j.alcance) * T;
const radioLagrima = (j) => lim(Math.round((2 + Math.sqrt(danoDe(j)) * 1.1) * j.tamLag), 2, 9);

function vidaTotal(j) { return j.vida + j.esporas; }
function curar(j, medios) { const antes = j.vida; j.vida = Math.min(j.cont, j.vida + medios); return j.vida > antes; }
function darEsporas(j, medios) { const tope = 24 - j.cont; if (j.esporas >= tope) return false; j.esporas = Math.min(tope, j.esporas + medios); return true; }
function sumarContenedor(j, n) { j.cont = lim(j.cont + n * 2, 0, 24); j.esporas = Math.min(j.esporas, 24 - j.cont); j.vida = Math.min(j.vida, j.cont); }

function herirJugador(j, medios, causa, dibujo) {
  if (j.inv > 0 || j.muerto || J.estado !== "juego") return false;
  if (J.sala.tipo === "jefe") j.golpesJefe++;
  j.golpesPiso++;
  let resto = medios;
  if (j.esporas > 0) { const q = Math.min(j.esporas, resto); j.esporas -= q; resto -= q; }
  if (resto > 0) j.vida = Math.max(0, j.vida - resto);
  j.inv = 60; j.gesto = 3; j.tGesto = 22;
  temblar(6);
  SFX.dolor();
  sangrar(j.x, j.y - 8, 6, PAL.sangre);
  if (vidaTotal(j) <= 0) { j.muerto = true; j.tMuerte = 0; J.causa = causa || "?"; J.causaSpr = dibujo || null; SFX.muere(); Musica.poner("silencio"); }
  return true;
}

function actualizarJugador(j) {
  if (j.muerto) { j.tMuerte++; return; }
  if (j.inv > 0) j.inv--;
  if (j.tGesto > 0 && --j.tGesto === 0) j.gesto = 0;
  if (j.tSostiene > 0) j.tSostiene--;
  // parpadeo de vez en cuando (el ojo cerrado dos cuadros de dibujo)
  if (--j.tParpadeo <= 0) { if (!j.gesto) { j.gesto = 2; j.tGesto = 7; } j.tParpadeo = V.ent(140, 320); }

  // moverse: inercia corta (se siente pesado y rápido a la vez, como el original)
  const vmax = 2.2 * velDe(j);
  const quieto = J.congelado > 0;
  const ax = quieto ? 0 : IN.mx * vmax, ay = quieto ? 0 : IN.my * vmax;
  const k = ax || ay ? 0.24 : 0.2;
  j.vx += (ax - j.vx) * k; j.vy += (ay - j.vy) * k;
  if (Math.abs(j.vx) < 0.02) j.vx = 0; if (Math.abs(j.vy) < 0.02) j.vy = 0;
  moverEnSala(J.sala, j, j.vx, j.vy, j.vuela, bordesJugador());
  const v = Math.hypot(j.vx, j.vy);
  j.paso += v;
  if (v > 0.3) j.mirarCue = Math.abs(j.vx) > Math.abs(j.vy) * 1.1 ? (j.vx > 0 ? DERECHA : IZQUIERDA) : (j.vy > 0 ? ABAJO : ARRIBA);

  // llorar
  if (j.enfriar > 0) j.enfriar--;
  const dx = quieto ? 0 : IN.dx, dy = quieto ? 0 : IN.dy;
  if (dx || dy) {
    j.mirar = dx > 0 ? DERECHA : dx < 0 ? IZQUIERDA : dy > 0 ? ABAJO : ARRIBA;
    if (j.enfriar <= 0) { dispararJugador(j, dx, dy); j.enfriar = cuadrosEntreLagrimas(j); }
  } else if (v > 0.3) j.mirar = j.mirarCue;
  else if (j.enfriar <= 0) j.mirar = j.mirarCue;

  // pinchos, brasas, baba
  if (!j.vuela) {
    const o = celda(J.sala, celdaX(j.x), celdaY(j.y));
    if (o && o.t === "pinchos") herirJugador(j, J.piso.n >= 3 ? 2 : 1, "UNOS PINCHOS", pinchosSpr(true));
    for (const b of J.babas) if (b.danina && dist(b.x, b.y, j.x, j.y) < b.r) { herirJugador(j, 1, "LA BABA", manchaSpr("baba", 0)); break; }
  }
  for (const o of alrededor(J.sala, j.x, j.y)) if (o.t === "brasero" && o.prendido && dist(o.px, o.py, j.x, j.y) < 14) herirJugador(j, J.piso.n >= 3 ? 2 : 1, "EL FUEGO", braseroSpr(0, true));
}

/** Las celdas que tocan un punto (para mirar braseros cerca). */
function alrededor(sala, x, y) {
  const out = [], c0 = celdaX(x), f0 = celdaY(y);
  for (let f = f0 - 1; f <= f0 + 1; f++) for (let c = c0 - 1; c <= c0 + 1; c++) { const o = celda(sala, c, f); if (o) { o.px = cx(c); o.py = cy(f); out.push(o); } }
  return out;
}

/** Los bordes por donde puede andar: el piso, y el hueco de una puerta abierta. */
function bordesJugador() {
  const b = { x0: IX0, y0: IY0, x1: IX1, y1: IY1 }, j = J.jug;
  if (!J.puertasAbiertas) return b;
  const P = J.sala.puertas, mitadX = SALA_W / 2, mitadY = IY0 + FILAS * T / 2;
  if (puertaPasable(P[ARRIBA]) && Math.abs(j.x - mitadX) < 8) b.y0 = IY0 - 18;
  if (puertaPasable(P[ABAJO]) && Math.abs(j.x - mitadX) < 8) b.y1 = IY1 + 18;
  if (puertaPasable(P[IZQUIERDA]) && Math.abs(j.y - mitadY) < 8) b.x0 = IX0 - 18;
  if (puertaPasable(P[DERECHA]) && Math.abs(j.y - mitadY) < 8) b.x1 = IX1 + 18;
  return b;
}
function puertaPasable(p) { return p && puertaVisible(p) && !p.llave; }

function dispararJugador(j, dx, dy) {
  const d = danoDe(j), r = radioLagrima(j), vel = 3.3 * j.velLag;
  const lado = (j.ojo = 1 - j.ojo) ? 1 : -1;
  const n = j.triple ? 3 : 1;
  for (let i = 0; i < n; i++) {
    const abre = n === 1 ? 0 : (i - 1) * 0.16;
    const ang = Math.atan2(dy, dx) + abre;
    let vx = Math.cos(ang) * vel, vy = Math.sin(ang) * vel;
    // hereda un poco del paso (sólo de costado: así las lágrimas "se tuercen" como en el original)
    if (dx) vy += j.vy * 0.45; else vx += j.vx * 0.45;
    if (dx) vx += j.vx * 0.25; else vy += j.vy * 0.25;
    const ox = dy ? lado * 3 : dx * 5, oy = dx ? lado * 1 : dy * 3;
    const vida = alcancePx(j) / vel;
    J.lagrimas.push({
      x: j.x + ox, y: j.y + oy + (dy < 0 ? -2 : 0), z: 14, vx, vy, vida, vidaMax: vida, r, dano: d,
      color: j.colorLag, atraviesa: j.atraviesa, espectral: j.espectral, rebote: j.rebote, buscadora: j.buscadora,
      veneno: j.veneno && A.si(0.25 + j.suerte * 0.06), hielo: j.hielo && A.si(0.3 + j.suerte * 0.06), fuego: j.fuego && A.si(0.2 + j.suerte * 0.05),
      tocados: null,
    });
  }
  if (!j.gesto || j.gesto === 1) { j.gesto = 1; j.tGesto = 6; }
  SFX.lagrima();
}

function tirarBomba(j) {
  if (j.bombas <= 0 || j.muerto) return;
  j.bombas--;
  J.bombas.push({ x: j.x, y: j.y + 2, t: 90, gorda: j.bombaGorda, vx: j.vx * 0.3, vy: j.vy * 0.3, r: 5 });
  SFX.mecha();
}

// ── el dibujo ──
const VISTA_CAB = ["espalda", "lado", "frente", "ladoI"];
function dibujarJugador(g, j) {
  const s = spritesShumio();
  const X = Math.round(j.x), Y = Math.round(j.y);
  if (j.muerto) {
    // cae de costado y se deshace en esporas
    const t = Math.min(j.tMuerte, 30);
    g.drawImage(sombra(7, 3), X - 7, Y + 2);
    g.save(); g.translate(X, Y + 2); g.rotate(-Math.PI / 2 * Math.min(1, t / 14));
    g.drawImage(s.cue.frente[0], -7, -10); g.drawImage(s.cab.frente[3], -11, -26);
    g.restore();
    return;
  }
  if (j.inv > 0 && ((j.inv >> 2) & 1)) return;   // parpadea mientras es invencible
  const z = Math.round(j.vuela ? 5 + Math.sin(J.t * 0.08) * 1.5 : 0);
  g.drawImage(sombra(7, 3), X - 7, Y + 2);
  const mov = Math.hypot(j.vx, j.vy) > 0.3;
  const kPaso = mov ? Math.floor(j.paso / 7) % 4 : 0;
  const vc = j.mirarCue === ARRIBA ? "espalda" : j.mirarCue === ABAJO ? "frente" : j.mirarCue === DERECHA ? "lado" : "ladoI";
  const cue = s.cue[vc][kPaso];
  // la cabeza baja un píxel al soltar la lágrima (el "puchero")
  const cab = s.cab[VISTA_CAB[j.mirar]][j.gesto], baja = j.gesto === 1 ? 1 : 0;
  const bob = mov && (kPaso === 1 || kPaso === 3) ? 1 : 0;
  g.drawImage(cue, X - 7, Y - 8 - z);
  g.drawImage(cab, X - 11, Y - 24 - z + baja + bob);
  if (j.tSostiene > 0 && j.sostiene) g.drawImage(j.sostiene, X - 9, Y - 44 - z);
}

// ══════════ 13-efectos.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LO QUE VUELA Y LO QUE QUEDA: las lágrimas de Shumio (con su caída al final del alcance),
// las balas de los enemigos, las bombas y sus explosiones (rompen rocas, abren secretas),
// las partículas (tripas, esporas, cascotes), las manchas que quedan en el piso y la baba.
// ─────────────────────────────────────────────────────────────────────────────

function temblar(n) { J.temblor = Math.max(J.temblor, n); }

/** Un sprite tintado (veneno, hielo, fuego, campeones), cacheado por canvas y color. */
const _tintes = new Map();
function tinte(c, color) {
  let m = _tintes.get(color);
  if (!m) { m = new WeakMap(); _tintes.set(color, m); }
  let t = m.get(c);
  if (t) return t;
  t = lienzoNuevo(c.width, c.height);
  const g = t.getContext("2d"); g.drawImage(c, 0, 0); g.globalCompositeOperation = "source-atop"; g.fillStyle = color; g.fillRect(0, 0, t.width, t.height);
  m.set(c, t);
  return t;
}
const _espejos = new WeakMap();
function espejado(c) {
  let e = _espejos.get(c);
  if (e) return e;
  e = lienzoNuevo(c.width, c.height);
  const g = e.getContext("2d"); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0);
  _espejos.set(c, e);
  return e;
}

// ── las lágrimas de Shumio ──
function actualizarLagrimas() {
  const L = J.lagrimas;
  for (let i = L.length - 1; i >= 0; i--) {
    const l = L[i];
    if (l.buscadora) {
      let obj = null, md = 90;
      for (const e of J.enemigos) { if (!blanco_(e)) continue; const d = dist(e.x, e.y, l.x, l.y); if (d < md) { md = d; obj = e; } }
      if (obj) {
        const v = Math.hypot(l.vx, l.vy), a0 = Math.atan2(l.vy, l.vx), a1 = Math.atan2(obj.y - l.y, obj.x - l.x);
        let da = a1 - a0; while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
        const a = a0 + lim(da, -0.09, 0.09); l.vx = Math.cos(a) * v; l.vy = Math.sin(a) * v;
      }
    }
    l.x += l.vx; l.y += l.vy; l.vida--;
    // al final del alcance, la lágrima cae (el arco del original)
    const caida = l.vidaMax * 0.28;
    if (l.vida < caida) l.z = Math.max(0, 14 * (l.vida / caida));
    let rompe = l.vida <= 0 || l.z <= 0;
    // muros
    if (l.x < IX0 + 2 || l.x > IX1 - 2 || l.y < IY0 + 1 || l.y > IY1 - 2) {
      if (l.rebote && !l.reboto) { if (l.x < IX0 + 2 || l.x > IX1 - 2) l.vx = -l.vx; else l.vy = -l.vy; l.reboto = true; l.x = lim(l.x, IX0 + 2, IX1 - 2); l.y = lim(l.y, IY0 + 1, IY1 - 2); }
      else rompe = true;
    }
    // obstáculos
    if (!rompe && !l.espectral) {
      const c = celdaX(l.x), f = celdaY(l.y), o = celda(J.sala, c, f);
      if (frenaLagrima(o)) {
        golpearObstaculo(o, c, f, l.dano);
        if (l.rebote && !l.reboto) { l.vx = -l.vx; l.vy = -l.vy; l.reboto = true; l.x += l.vx * 2; l.y += l.vy * 2; }
        else rompe = true;
      }
    }
    // enemigos
    if (!rompe) for (const e of J.enemigos) {
      if (!blanco_(e) || (l.tocados && l.tocados.has(e))) continue;
      if (e.segmentos ? !tocaSegmento(e, l.x, l.y, l.r + 1) : dist(e.x, e.y - (e.alturaGolpe || 0), l.x, l.y) > e.r + l.r) continue;
      danarEnemigo(e, l.dano, l.vx * 0.35, l.vy * 0.35, l);
      if (l.atraviesa) { (l.tocados ||= new Set()).add(e); } else { rompe = true; break; }
    }
    if (rompe) { chapoteo(l.x, l.y - l.z, l.color, l.r); L.splice(i, 1); }
  }
}
function blanco_(e) { return !e.muerto && !e.oculto && !e.intangible; }

/** Una lágrima que pega en una roca, una mata, un brasero o un barril. */
function golpearObstaculo(o, c, f, dano) {
  if (o.t === "matas" && o.vida > 0) {
    o.vida--; SFX.moho();
    particulas(cx(c), cy(f), 4, ["#7a5636", "#a8835a", "#4d3421"], 1.2);
    if (o.vida <= 0) { if (A.si(o.dorada ? 1 : 0.18)) soltarPremio(cx(c), cy(f), o.dorada ? "moneda" : null); J.cambioGrilla = true; }
  } else if (o.t === "brasero" && o.prendido) {
    o.vida--; particulas(cx(c), cy(f) - 10, 3, PAL.fuego.slice(2), 1);
    if (o.vida <= 0) { o.prendido = false; SFX.moho(); humo(cx(c), cy(f) - 6); if (A.si(0.2)) soltarPremio(cx(c), cy(f)); J.cambioGrilla = true; }
  } else if (o.t === "barril") {
    o.vida -= dano >= 6 ? 2 : 1;
    if (o.vida <= 0) { J.sala.celdas[f * COLS + c] = null; explotar(cx(c), cy(f), false); J.cambioGrilla = true; }
  }
}

function chapoteo(x, y, color, r) {
  const col = COLOR_LAGRIMA[color] ? color : "espora";
  J.fx.push({ anim: [0, 1, 2, 3, 4].map((k) => chapoteoSpr(col, k)), x, y, t: 0, cada: 3, centro: true, escala: r > 5 ? 1 : 1 });
  if (V.f() < 0.5) SFX.chapoteo();
}

// ── las balas de los enemigos ──
function bala(x, y, ang, vel, o = {}) {
  J.balas.push({ x, y, z: o.z ?? 8, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, r: o.r || 3, vida: o.vida || 240, color: o.color || "enemigo", curva: o.curva || 0, acel: o.acel || 0, espectral: !!o.espectral, de: J.quien ? J.quien.def.nombre : null, deSpr: J.quien ? J.quien.def.spr(J.quien) : null });
}
function anilloBalas(x, y, n, vel, desfase = 0, o) { for (let i = 0; i < n; i++) bala(x, y, desfase + i * TAU / n, vel, o); }
function actualizarBalas() {
  const B = J.balas, j = J.jug;
  for (let i = B.length - 1; i >= 0; i--) {
    const b = B[i];
    if (b.curva) { const a = Math.atan2(b.vy, b.vx) + b.curva, v = Math.hypot(b.vx, b.vy); b.vx = Math.cos(a) * v; b.vy = Math.sin(a) * v; }
    if (b.acel) { b.vx *= 1 + b.acel; b.vy *= 1 + b.acel; }
    b.x += b.vx; b.y += b.vy; b.vida--;
    if (b.vida < 20) b.z = Math.max(0, b.z - 0.5);
    let rompe = b.vida <= 0 || b.x < IX0 || b.x > IX1 || b.y < IY0 - 2 || b.y > IY1;
    if (!rompe && !b.espectral) { const o = celda(J.sala, celdaX(b.x), celdaY(b.y)); if (frenaLagrima(o)) rompe = true; }
    if (!rompe) for (const m of J.familiares) if (m.bloquea && dist(m.x, m.y, b.x, b.y) < 7) { rompe = true; break; }
    if (!rompe && !j.muerto && dist(j.x, j.y - 5, b.x, b.y) < b.r + 4) { herirJugador(j, J.piso.n >= 3 ? 2 : 1, b.de || "UNA LÁGRIMA MALA", b.deSpr || lagrimaSpr(5, "enemigo")); rompe = true; }
    if (rompe) { chapoteo(b.x, b.y - b.z, b.color, b.r); B.splice(i, 1); }
  }
}

// ── las bombas ──
function actualizarBombas() {
  for (let i = J.bombas.length - 1; i >= 0; i--) {
    const b = J.bombas[i];
    b.t--;
    b.vx *= 0.85; b.vy *= 0.85;
    moverEnSala(J.sala, b, b.vx, b.vy, false);
    // Shumio las empuja al caminar contra ellas
    const j = J.jug, d = dist(j.x, j.y, b.x, b.y);
    if (d < 9 && d > 0.01 && b.t < 80) { b.vx += (b.x - j.x) / d * 0.5; b.vy += (b.y - j.y) / d * 0.5; }
    if (b.t <= 0) { J.bombas.splice(i, 1); explotar(b.x, b.y, true, b.gorda); }
  }
}

/** La explosión: daña (a Shumio también), rompe obstáculos y abre las puertas secretas. */
function explotar(x, y, dePlayer, gorda = false) {
  const R = gorda ? 52 : 42, dano = gorda ? 75 : 60;
  SFX.explosion(); temblar(gorda ? 14 : 10);
  J.fx.push({ anim: [0, 1, 2, 3, 4, 5].map(explosionSpr), x, y: y + 6, t: 0, cada: 4, centro: false });
  J.destello = 3;
  mancha("quemado", x, y, 1.4);
  particulas(x, y, 14, ["#3a2c28", "#5a4640", "#f59a26", "#ffe07a"], 3);
  for (const e of J.enemigos) if (!e.muerto && !e.oculto && dist(e.x, e.y, x, y) < R + e.r) { const d = dist(e.x, e.y, x, y) || 1; danarEnemigo(e, dano, (e.x - x) / d * 5, (e.y - y) / d * 5); }
  const j = J.jug;
  if (dist(j.x, j.y, x, y) < R + 2) { herirJugador(j, 2, "UNA BOMBA", bombaSpr(1)); const d = dist(j.x, j.y, x, y) || 1; j.vx += (j.x - x) / d * 5; j.vy += (j.y - y) / d * 5; }
  for (const b of J.bombas) { const d = dist(b.x, b.y, x, y) || 1; if (d < R) { b.vx += (b.x - x) / d * 4; b.vy += (b.y - y) / d * 4; } }
  for (const c of J.sala.cosas) if (!c.quieto && c.t !== "objeto" && c.t !== "trampilla") { const d = dist(c.x, c.y, x, y) || 1; if (d < R) { c.vx += (c.x - x) / d * 4; c.vy += (c.y - y) / d * 4; c.vz = 2; } }
  // los obstáculos
  for (let f = 0; f < FILAS; f++) for (let c = 0; c < COLS; c++) {
    const o = celda(J.sala, c, f);
    if (!o || dist(cx(c), cy(f), x, y) > R + 10) continue;
    if (o.t === "roca") {
      J.sala.celdas[f * COLS + c] = null; SFX.roca();
      particulas(cx(c), cy(f), 8, PAL.piedra.slice(2), 2.4);
      mancha("quemado", cx(c), cy(f), 0.8);
      if (o.marcada) { SFX.secreto(); soltarPremio(cx(c), cy(f), A.pesos([["espora", 5], ["bomba", 3], ["llave", 2]])); }
      else if (A.si(0.04)) soltarPremio(cx(c), cy(f));
      J.cambioGrilla = true;
    } else if (o.t === "matas" && o.vida > 0) { o.vida = 0; J.cambioGrilla = true; particulas(cx(c), cy(f), 6, ["#7a5636", "#a8835a"], 2); }
    else if (o.t === "brasero") { J.sala.celdas[f * COLS + c] = null; J.cambioGrilla = true; humo(cx(c), cy(f)); }
    else if (o.t === "barril") { J.sala.celdas[f * COLS + c] = null; J.cambioGrilla = true; J.pendientes.push(() => explotar(cx(c), cy(f), false)); }
  }
  // las puertas secretas
  for (let d = 0; d < 4; d++) {
    const p = J.sala.puertas[d];
    if (!p || !p.secreta || p.revelada) continue;
    const q = PUERTA[d];
    if (dist(q.x, q.y, x, y) < R + 16) { p.revelada = true; if (p.par) p.par.revelada = true; SFX.secreto(); particulas(q.x, q.y, 10, PAL.piedra.slice(2), 2.5); }
  }
  // las puertas con llave no se vuelan (como en el original), pero tiemblan
}

// ── partículas: pedacitos con altura (z) que caen y rebotan en el piso ──
function particulas(x, y, n, colores, fuerza = 2, z = 6) {
  for (let i = 0; i < n; i++) {
    const a = V.f() * TAU, v = (0.4 + V.f()) * fuerza * 0.6;
    J.part.push({ x, y, z, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.7, vz: 1 + V.f() * fuerza, c: V.uno(colores), t: 60 + V.ent(0, 60), s: V.f() < 0.3 ? 2 : 1 });
  }
}
function sangrar(x, y, n, rampa) { particulas(x, y, n, [rampa[1], rampa[2], rampa[3]], 2, 8); }
function actualizarParticulas() {
  const P = J.part;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.x += p.vx; p.y += p.vy; p.z += p.vz; p.vz -= 0.22;
    if (p.z <= 0) { p.z = 0; p.vz *= -0.35; p.vx *= 0.6; p.vy *= 0.6; if (Math.abs(p.vz) < 0.3) p.vz = 0; }
    if (--p.t <= 0) P.splice(i, 1);
  }
  if (P.length > 260) P.splice(0, P.length - 260);
}
function humo(x, y) { J.fx.push({ anim: [0, 1, 2, 3].map(humoSpr), x, y, t: 0, cada: 5, centro: true }); }

// ── las manchas: se pintan UNA vez en el piso de la sala y se quedan ──
function mancha(tipo, x, y, escala = 1) {
  const s = J.sala;
  if (!s.decal) s.decal = lienzoNuevo(SALA_W, SALA_H);
  const g = s.decal.getContext("2d"), m = manchaSpr(tipo, V.ent(0, 5));
  g.save(); g.globalAlpha = tipo === "quemado" ? 0.8 : 0.72; g.beginPath(); g.rect(IX0, IY0, COLS * T, FILAS * T); g.clip();
  const w = Math.round(m.width * escala), h = Math.round(m.height * escala);
  g.imageSmoothingEnabled = false;
  g.drawImage(m, Math.round(x - w / 2), Math.round(y - h / 2), w, h);
  g.restore();
}

// ── la baba (el rastro de las babosas, y el de algunos jefes): daña si la pisás ──
function dejarBaba(x, y, r = 9, dura = 240, danina = true) {
  if (J.babas.length > 90) J.babas.shift();
  J.babas.push({ x, y, r, t: dura, max: dura, danina, v: V.ent(0, 5) });
}
function actualizarBabas() { for (let i = J.babas.length - 1; i >= 0; i--) if (--J.babas[i].t <= 0) J.babas.splice(i, 1); }
function dibujarBabas(g) {
  for (const b of J.babas) {
    const s = manchaSpr("baba", b.v), k = b.r / 9;
    g.globalAlpha = Math.min(1, b.t / 40) * 0.8;
    g.drawImage(s, Math.round(b.x - s.width * k / 2), Math.round(b.y - s.height * k / 2), Math.round(s.width * k), Math.round(s.height * k));
  }
  g.globalAlpha = 1;
}

// ── dibujar lo que vuela ──
function dibujarLagrima(g, l) {
  const s = lagrimaSpr(l.r, l.veneno ? "veneno" : l.hielo ? "hielo" : l.fuego ? "fuego" : l.color);
  const x = Math.round(l.x - s.width / 2), y = Math.round(l.y - l.z - s.height / 2);
  const sh = sombra(Math.max(2, l.r - 1), Math.max(1, Math.round(l.r / 2)));
  g.drawImage(sh, Math.round(l.x - sh.width / 2), Math.round(l.y - sh.height / 2 + 2));
  g.drawImage(s, x, y);
}
function dibujarBala(g, b) {
  const s = lagrimaSpr(b.r + 1, b.color);
  g.drawImage(sombra(b.r, 1), Math.round(b.x - b.r), Math.round(b.y + 1));
  g.drawImage(s, Math.round(b.x - s.width / 2), Math.round(b.y - b.z - s.height / 2));
}
function dibujarBomba(g, b) {
  const s = bombaSpr(b.gorda ? 1.25 : 1, true, (J.t >> 2) & 1);
  const late = b.t < 30 ? ((b.t >> 1) & 1) : ((b.t >> 3) & 1);
  const e = b.t < 30 ? 1 + (1 - b.t / 30) * 0.2 : 1;
  g.drawImage(sombra(6, 2), Math.round(b.x - 6), Math.round(b.y + 1));
  const w = Math.round(s.width * e), h = Math.round(s.height * e);
  g.drawImage(late && b.t < 60 ? tinte(s, "rgba(255,70,40,0.55)") : s, Math.round(b.x - w / 2), Math.round(b.y + 4 - h), w, h);
}
function dibujarParticulas(g) {
  for (const p of J.part) {
    g.fillStyle = p.c;
    g.fillRect(Math.round(p.x), Math.round(p.y - p.z), p.s, p.s);
  }
}
function actualizarFx() { for (let i = J.fx.length - 1; i >= 0; i--) { const f = J.fx[i]; if (++f.t >= f.anim.length * f.cada) J.fx.splice(i, 1); } }
function dibujarFx(g) {
  for (const f of J.fx) {
    const s = f.anim[Math.min(f.anim.length - 1, Math.floor(f.t / f.cada))];
    g.drawImage(s, Math.round(f.x - s.width / 2), Math.round(f.centro ? f.y - s.height / 2 : f.y - s.height));
  }
}

// ══════════ 14-enemigos.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LOS ENEMIGOS: cada uno con su cabeza (una máquina de estados chica) y sus números, en la
// escala del original (una mosca aguanta 5, un "gaper" 10, un "clotty" 25, contra lágrimas de
// 3,5). Los que caminan rodean las rocas con un campo de distancias; los que vuelan, no.
// Los campeones (desde el piso 2) salen rojizos, con el doble de vida y un premio seguro.
// ─────────────────────────────────────────────────────────────────────────────

const ENEMIGOS = {
  mosquin: {
    nombre: "UN MOSQUÍN", vida: 5, r: 4, vuela: true, oy: -7, rastro: "sangre", peso: 0.6,
    crear(e) { e.a = V.f() * TAU; },
    pensar(e) {
      const j = J.jug, a = Math.atan2(j.y - e.y, j.x - e.x);
      e.a += difAng(a, e.a) * 0.025 + (V.f() - 0.5) * 0.6;
      const v = 0.5 * e.lento;
      e.vx = Math.cos(e.a) * v; e.vy = Math.sin(e.a) * v;
      if (V.f() < 0.004) SFX.zumbido();
    },
    spr: (e) => mosquinSpr((e.t >> 2) & 1),
  },
  mosquinRojo: {
    nombre: "UN MOSQUÍN ROJO", vida: 5, r: 4, vuela: true, oy: -7, rastro: "sangre", peso: 0.6,
    crear(e) { e.a = V.f() * TAU; },
    pensar(e) {
      const j = J.jug, a = Math.atan2(j.y - e.y, j.x - e.x);
      e.a += difAng(a, e.a) * 0.09 + Math.sin(e.t * 0.2) * 0.08;
      const v = 1.15 * e.lento;
      e.vx = Math.cos(e.a) * v; e.vy = Math.sin(e.a) * v;
      if (V.f() < 0.006) SFX.zumbido();
    },
    spr: (e) => mosquinSpr((e.t >> 1) & 1, true),
  },
  hongon: {
    nombre: "UN HONGÓN", vida: 10, r: 7, oy: 5, rastro: "sangre", voltea: true,
    pensar(e) {
      if (!e.sinGorro && e.vida <= e.max / 2) { e.sinGorro = true; particulas(e.x, e.y - 18, 8, ["#86643f", "#5e442c", "#a88558"], 2, 16); SFX.moho(); }
      const v = (e.sinGorro ? 1.05 : 0.72) * e.lento;
      const [dx, dy] = pasoCampo(J.sala, J.campo, e, J.jug.x, J.jug.y);
      e.vx += (dx * v - e.vx) * 0.2; e.vy += (dy * v - e.vy) * 0.2;
      if (Math.abs(e.vx) > 0.1) e.mira = sig(e.vx);
    },
    spr: (e) => hongonSpr(Math.floor(e.t / 8) % 4, e.sinGorro),
  },
  babosa: {
    nombre: "UNA BABOSA", vida: 14, r: 8, oy: 5, rastro: "baba", voltea: true,
    crear(e) { e.dir = V.ent(0, 3); e.tE = V.ent(60, 140); },
    pensar(e) {
      if (--e.tE <= 0 || e.choco) {
        const j = J.jug;
        e.dir = V.f() < 0.5 ? (Math.abs(j.x - e.x) > Math.abs(j.y - e.y) ? (j.x > e.x ? DERECHA : IZQUIERDA) : (j.y > e.y ? ABAJO : ARRIBA)) : V.ent(0, 3);
        e.tE = V.ent(70, 150);
      }
      const v = 0.36 * e.lento;
      e.vx = DIRS[e.dir][0] * v; e.vy = DIRS[e.dir][1] * v;
      if (e.vx) e.mira = sig(e.vx);
      if (e.t % 9 === 0) dejarBaba(e.x, e.y + 2, 8, 300);
    },
    spr: (e) => babosaSpr((e.t >> 4) & 1),
  },
  escupidor: {
    nombre: "UN ESCUPIDOR", vida: 10, r: 7, oy: 6, rastro: "sangre", peso: 3,
    crear(e) { e.tE = V.ent(60, 130); e.k = 0; },
    pensar(e) {
      e.vx *= 0.8; e.vy *= 0.8;
      e.tE--;
      e.k = e.tE < 26 ? 1 : 0;
      if (e.tE <= 0) {
        const j = J.jug, a = Math.atan2(j.y - e.y, j.x - e.x);
        if (J.piso.n >= 3) for (const d of [-0.22, 0, 0.22]) bala(e.x, e.y - 6, a + d, 2.1); else bala(e.x, e.y - 6, a, 2.2);
        SFX.escupe(); e.tE = V.ent(100, 140); e.tEsc = 10;
      }
      if (e.tEsc > 0) { e.tEsc--; e.k = 2; }
    },
    spr: (e) => escupidorSpr(e.k),
  },
  saltarin: {
    nombre: "UN SALTARÍN", vida: 10, r: 6, oy: 4, rastro: "sangre",
    crear(e) { e.est = "suelo"; e.tE = V.ent(30, 70); },
    pensar(e) {
      if (e.est === "suelo") {
        e.vx *= 0.7; e.vy *= 0.7;
        if (--e.tE <= 0) {
          const j = J.jug, lugar = lugarLibreCerca(j.x + V.ent(-40, 40), j.y + V.ent(-30, 30));
          e.est = "aire"; e.tE = 34; e.x0 = e.x; e.y0 = e.y; e.x1 = lugar[0]; e.y1 = lugar[1]; SFX.salto();
        }
      } else {
        const u = 1 - e.tE / 34;
        e.vx = e.vy = 0;
        e.x = lerp(e.x0, e.x1, u); e.y = lerp(e.y0, e.y1, u); e.z = Math.sin(u * Math.PI) * 18; e.alturaGolpe = e.z;
        if (--e.tE <= 0) { e.est = "suelo"; e.z = 0; e.alturaGolpe = 0; e.tE = V.ent(24, 50); particulas(e.x, e.y, 3, ["#634537", "#3c2a22"], 1, 1); }
      }
      e.vueloPropio = e.est === "aire";
    },
    spr: (e) => saltarinSpr(e.est === "aire" ? 1 : 0),
  },
  gusano: {
    nombre: "UN GUSANO", vida: 14, r: 7, oy: 6, rastro: "sangre", peso: 9,
    crear(e) { e.est = "bajo"; e.tE = V.ent(20, 60); e.oculto = true; },
    pensar(e) {
      e.vx = e.vy = 0;
      if (--e.tE > 0) {
        if (e.est === "bajo" && e.tE < 22 && e.tE % 4 === 0) particulas(e.x, e.y, 2, PAL.tierra.slice(2, 5), 1, 1);
        if (e.est === "afuera" && e.tE === 34) {
          const j = J.jug, a = Math.atan2(j.y - e.y, j.x - e.x);
          for (const d of [-0.3, 0, 0.3]) bala(e.x, e.y - 10, a + d, 2.2);
          SFX.escupe();
        }
        return;
      }
      if (e.est === "bajo") { e.est = "sube"; e.tE = 16; e.oculto = false; }
      else if (e.est === "sube") { e.est = "afuera"; e.tE = 56; }
      else if (e.est === "afuera") { e.est = "baja"; e.tE = 16; }
      else {
        e.est = "bajo"; e.tE = V.ent(50, 90); e.oculto = true;
        // sale en otro lado, no pegado a Shumio
        for (let i = 0; i < 30; i++) {
          const c = V.ent(0, COLS - 1), f = V.ent(0, FILAS - 1);
          if (celda(J.sala, c, f) || dist(cx(c), cy(f), J.jug.x, J.jug.y) < 56) continue;
          e.x = cx(c); e.y = cy(f); break;
        }
      }
    },
    spr(e) {
      const u = e.tE / 16;
      const k = e.est === "sube" ? lim(Math.floor((1 - u) * 4), 0, 3) : e.est === "baja" ? lim(Math.floor(u * 4), 0, 3) : 3;
      return gusanoSpr(k);
    },
  },
  bulbo: {
    nombre: "UN BULBO", vida: 18, r: 7, vuela: true, oy: -5, rastro: "espora", peso: 0.8,
    crear(e) { e.dx = V.f() < 0.5 ? -1 : 1; e.dy = V.f() < 0.5 ? -1 : 1; },
    pensar(e) { const v = 0.75 * e.lento; e.vx = e.dx * v; e.vy = e.dy * v; e.rebotaSolo = true; },
    morir(e) { anilloBalas(e.x, e.y - 6, 8, 2, 0, { color: "moho" }); SFX.escupe(); },
    spr: (e) => bulboSpr((e.t >> 3) & 1),
  },
  arana: {
    nombre: "UNA ARAÑITA", vida: 6, r: 5, oy: 3, rastro: "sangre", voltea: true,
    crear(e) { e.est = "quieta"; e.tE = V.ent(15, 50); },
    pensar(e) {
      if (e.est === "quieta") { e.vx *= 0.6; e.vy *= 0.6; if (--e.tE <= 0) { const j = J.jug, a = Math.atan2(j.y + V.ent(-24, 24) - e.y, j.x + V.ent(-24, 24) - e.x); e.est = "corre"; e.tE = V.ent(16, 26); e.vx = Math.cos(a) * 2.4 * e.lento; e.vy = Math.sin(a) * 2.4 * e.lento; } }
      else if (--e.tE <= 0) { e.est = "quieta"; e.tE = V.ent(20, 55); }
      if (Math.abs(e.vx) > 0.1) e.mira = sig(e.vx);
    },
    spr: (e) => aranaSpr(e.est === "corre" ? (e.t >> 1) & 1 : 0),
  },
  grumo: {
    nombre: "UN GRUMO", vida: 22, r: 7, oy: 5, rastro: "sangre",
    crear(e) { e.tE = V.ent(30, 60); e.tTiro = V.ent(60, 110); e.salto = 0; },
    pensar(e) {
      if (e.salto > 0) { e.salto--; } else { e.vx *= 0.75; e.vy *= 0.75; }
      if (--e.tE <= 0) { const a = V.f() * TAU; e.vx = Math.cos(a) * 1.3 * e.lento; e.vy = Math.sin(a) * 1.3 * e.lento; e.salto = 14; e.tE = V.ent(40, 70); }
      if (--e.tTiro <= 0) {
        const cruz = (e.tiros = (e.tiros || 0) + 1) % 2;
        for (let i = 0; i < 4; i++) bala(e.x, e.y - 6, i * TAU / 4 + (cruz ? 0 : TAU / 8), 1.9);
        SFX.escupe(); e.tTiro = V.ent(90, 130);
      }
      dejarBaba(e.x, e.y + 2, 6, 120, false);
    },
    spr: (e) => grumoSpr(e.salto > 0 ? 1 : 0),
  },
};

// quién sale en cada capítulo (e = común, E = fuerte)
const TANDAS = {
  sotano: { e: [["mosquin", 3], ["mosquinRojo", 2], ["hongon", 4], ["escupidor", 2], ["saltarin", 2], ["arana", 1]], E: [["grumo", 3], ["bulbo", 2], ["babosa", 2], ["gusano", 1]] },
  raices: { e: [["mosquinRojo", 3], ["hongon", 3], ["escupidor", 2], ["saltarin", 2], ["arana", 3], ["gusano", 2], ["babosa", 1]], E: [["grumo", 3], ["bulbo", 3], ["babosa", 2], ["gusano", 3]] },
};

function difAng(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function lugarLibreCerca(x, y) {
  let c = lim(celdaX(x), 0, COLS - 1), f = lim(celdaY(y), 0, FILAS - 1);
  if (!esSolida(celda(J.sala, c, f))) return [lim(x, IX0 + 8, IX1 - 8), lim(y, IY0 + 8, IY1 - 8)];
  for (let r = 1; r < 6; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const C = c + dx, F = f + dy;
    if (C >= 0 && F >= 0 && C < COLS && F < FILAS && !esSolida(celda(J.sala, C, F))) return [cx(C), cy(F)];
  }
  return [x, y];
}

function crearEnemigo(tipo, x, y, o = {}) {
  const d = ENEMIGOS[tipo];
  const escala = 1 + (J.piso.n - 1) * 0.2;
  const e = {
    tipo, def: d, x, y, r: d.r, vx: 0, vy: 0, z: 0, t: V.ent(0, 60), vuela: !!d.vuela, oy: d.oy ?? 4,
    vida: d.vida * escala, max: d.vida * escala, golpe: 0, kx: 0, ky: 0, mira: 1, lento: 1, frio: 0, veneno: null, quema: null,
    dormido: o.dormido ?? 34, jefe: !!d.jefe, campeon: false,
  };
  if (!e.jefe && J.piso.n >= 2 && !o.sinCampeon && A.si(0.06)) { e.campeon = true; e.vida = e.max = e.max * 2; }
  if (d.crear) d.crear(e);
  J.enemigos.push(e);
  return e;
}

function danarEnemigo(e, d, kx = 0, ky = 0, lag = null) {
  if (e.muerto || e.oculto || e.intangible) return;
  if (e.cabeza) e = e.cabeza;           // los anillos del gusano jefe comparten la vida
  e.vida -= d; e.golpe = 5;
  if (!e.jefe) { const p = e.def.peso ?? 1; e.kx += kx / p; e.ky += ky / p; }
  if (lag) {
    if (lag.veneno) e.veneno = { t: 80, dano: 2 };
    if (lag.hielo) e.frio = 100;
    if (lag.fuego) e.quema = { t: 60, dano: 1.5 };
  }
  if (e.vida <= 0) matarEnemigo(e);
}

function matarEnemigo(e) {
  if (e.muerto) return;
  e.muerto = true;
  const d = e.def;
  if (d.morir) d.morir(e);
  const r = d.rastro === "baba" ? PAL.baba : d.rastro === "espora" ? PAL.espora : PAL.sangre;
  sangrar(e.x, e.y - 6, e.jefe ? 30 : 9, r);
  mancha(d.rastro === "baba" ? "baba" : d.rastro === "espora" ? "espora" : "sangre", e.x, e.y, e.jefe ? 2 : e.r > 6 ? 1 : 0.7);
  SFX.muere();
  J.muertes++;
  if (e.campeon) soltarPremio(e.x, e.y);
  if (e.segmentos) for (const s of e.segmentos) { sangrar(s.x, s.y - 6, 6, PAL.sangre); mancha("sangre", s.x, s.y, 1); }
  if (e.jefe && d.alMorir) d.alMorir(e);
}

function actualizarEnemigos() {
  const j = J.jug;
  // el campo hacia Shumio, cada tanto
  if (!J.campo || J.t % 12 === 0 || J.cambioGrilla) { J.campo = campoHacia(J.sala, j.x, j.y); J.cambioGrilla = false; }
  for (const e of J.enemigos) {
    if (e.muerto) continue;
    e.t++;
    if (e.golpe > 0) e.golpe--;
    if (e.dormido > 0) { e.dormido--; continue; }
    e.lento = e.frio > 0 ? 0.5 : 1;
    if (e.frio > 0) e.frio--;
    for (const k of ["veneno", "quema"]) {
      const s = e[k];
      if (!s) continue;
      if (--s.t <= 0) e[k] = null; else if (s.t % 20 === 0) { e.vida -= s.dano; e.golpe = 2; if (e.vida <= 0) matarEnemigo(e); }
    }
    if (e.muerto) continue;
    J.quien = e;
    e.def.pensar(e);
    J.quien = null;
    if (e.muerto) continue;
    const vuela = e.vuela || e.vueloPropio;
    if (e.rebotaSolo) {
      moverEnSala(J.sala, e, e.vx + e.kx, 0, vuela); if (e.choco) e.dx = -e.dx;
      moverEnSala(J.sala, e, 0, e.vy + e.ky, vuela); if (e.choco) e.dy = -e.dy;
    } else if (!e.fijo) moverEnSala(J.sala, e, e.vx + e.kx, e.vy + e.ky, vuela);
    e.kx *= 0.78; e.ky *= 0.78;
    // el golpe a Shumio al tocarlo
    if (!e.oculto && !e.intangible && !j.muerto && (e.z || 0) < 10) {
      const toca = e.segmentos ? tocaSegmento(e, j.x, j.y, 4) : dist(e.x, e.y, j.x, j.y) < e.r + 4;
      if (toca) herirJugador(j, e.jefe || J.piso.n >= 3 ? 2 : 1, e.def.nombre, e.def.spr(e));
    }
  }
  // que no se amontonen (los que caminan se empujan entre sí)
  const E = J.enemigos;
  for (let a = 0; a < E.length; a++) for (let b = a + 1; b < E.length; b++) {
    const p = E[a], q = E[b];
    if (p.muerto || q.muerto || p.oculto || q.oculto || p.jefe || q.jefe) continue;
    const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy), m = p.r + q.r - 2;
    if (d < m && d > 0.01) { const f = (m - d) / d * 0.25; p.x -= dx * f; p.y -= dy * f; q.x += dx * f; q.y += dy * f; }
  }
  for (let i = E.length - 1; i >= 0; i--) if (E[i].muerto) E.splice(i, 1);
}

function tocaSegmento(e, x, y, r) {
  if (dist(e.x, e.y, x, y) < e.r + r) return true;
  for (const s of e.segmentos) if (dist(s.x, s.y, x, y) < s.r + r) return true;
  return false;
}

function dibujarEnemigo(g, e) {
  if (e.oculto) return;
  const d = e.def;
  let s = d.spr(e);
  if (e.mira < 0 && d.voltea) s = espejado(s);
  if (e.campeon) s = tinte(s, "rgba(230,40,30,0.38)");
  if (e.veneno) s = tinte(s, "rgba(90,220,60,0.4)");
  else if (e.frio > 0) s = tinte(s, "rgba(120,200,255,0.45)");
  else if (e.quema) s = tinte(s, "rgba(255,140,40,0.4)");
  if (e.golpe > 0 && (e.golpe & 2)) s = blanco(s);
  const rx = Math.max(3, Math.round(e.r * (e.jefe ? 1.05 : 0.95))), ry = Math.max(2, Math.round(rx * 0.38));
  const X = Math.round(e.x), Y = Math.round(e.y);
  if (!(e.est === "bajo")) g.drawImage(sombra(rx, ry), X - rx, Y - ry + 2);
  const z = Math.round(e.z || 0) + (d.vuela ? Math.round(Math.sin(e.t * 0.15) * 1.2) : 0);
  if (e.dormido > 0 && (e.dormido & 2)) g.globalAlpha = 0.6;
  g.drawImage(s, X - Math.floor(s.width / 2), Y + e.oy - s.height - z);
  g.globalAlpha = 1;
}

/** Los enemigos de una sala al entrar (según su diseño y el capítulo). */
function poblarSala(sala) {
  const tanda = TANDAS[J.piso.cap];
  for (const h of sala.huecos) {
    const x = cx(h.c), y = cy(h.f);
    if (h.tipo === "e") crearEnemigo(A.pesos(tanda.e), x, y);
    else if (h.tipo === "E") crearEnemigo(A.pesos(tanda.E), x, y);
    else if (h.tipo === "v") crearEnemigo(J.piso.n >= 2 ? "mosquinRojo" : "mosquin", x, y);
    else if (h.tipo === "j") crearJefe(sala, x, y);
    J.fx.push({ anim: [0, 1, 2, 3, 4].map(aparicionSpr), x, y: y - 4, t: 0, cada: 4, centro: true });
  }
}

// ══════════ 15-jefes.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LOS JEFES: la Madre Babosa (saltitos, el salto grande que cae con un anillo de baba, el
// escupitajo en abanico), el Rey Mosquín (se infla y revienta en lágrimas, llama a su corte),
// el Gusano Anillado (una serpiente de anillos que comparten la vida) y Micelia, la Madre
// Hongo del fondo, con tres fases. Al morir: un objeto, corazones y la trampilla (o el cofre).

const NOMBRE_JEFE = { madreBabosa: "MADRE BABOSA", reyMosquin: "REY MOSQUÍN", gusanoAnillado: "GUSANO ANILLADO", micelia: "MICELIA" };

/** Qué jefe le toca a cada piso (sin repetir hasta el tercero). */
function elegirJefe(n, yaVistos) {
  if (n === ULTIMO_PISO) return "micelia";
  const todos = ["madreBabosa", "reyMosquin", "gusanoAnillado"];
  const pool = n === 1 ? ["madreBabosa", "reyMosquin"] : todos.filter((t) => !yaVistos.includes(t));
  return A.uno(pool.length ? pool : todos);
}

function crearJefe(sala, x, y) {
  const tipo = J.jefeTipo, e = crearEnemigo(tipo, x, y, { dormido: 20, sinCampeon: true });
  const escala = 1 + (J.piso.n - 1) * 0.25;
  e.vida = e.max = ENEMIGOS[tipo].vida * (tipo === "micelia" ? 1 : escala);
  J.jefes.push(e);
  return e;
}

function alMorirJefe(e) {
  temblar(16); SFX.explosion();
  for (let i = 0; i < 5; i++) J.pendientes.push(() => { particulas(e.x + V.ent(-16, 16), e.y - 10 + V.ent(-12, 12), 10, [PAL.sangre[2], PAL.sangre[3], PAL.hueso[3]], 3, 10); });
  J.jefeMuerto = true;
}

const DEF_JEFE = { jefe: true, peso: 99, alMorir: alMorirJefe };

ENEMIGOS.madreBabosa = Object.assign({}, DEF_JEFE, {

  pensar(e) {
    const j = J.jug;
    e.vx = e.vy = 0;
    switch (e.est) {
      case "espera": e.k = 0; if (--e.tE <= 0) {
        const q = A.pesos([["saltitos", 4], ["grande", 3], ["escupir", 3]]);
        if (q === "saltitos") { e.saltos = A.ent(2, 3); e.est = "agacha"; e.tE = 12; e.sig = "salto"; }
        else if (q === "grande") { e.est = "agacha"; e.tE = 18; e.sig = "subir"; }
        else { e.est = "escupir"; e.tE = 34; }
      } break;
      case "agacha": e.k = 1; if (--e.tE <= 0) {
        if (e.sig === "salto") { e.est = "salto"; e.tE = 30; e.x0 = e.x; e.y0 = e.y; const a = Math.atan2(j.y - e.y, j.x - e.x), d = Math.min(60, dist(j.x, j.y, e.x, e.y)); e.x1 = lim(e.x + Math.cos(a) * d, IX0 + 26, IX1 - 26); e.y1 = lim(e.y + Math.sin(a) * d, IY0 + 26, IY1 - 20); SFX.salto(); }

      case "sombra": { e.k = 2; const d = dist(j.x, j.y, e.x, e.y) || 1, v = Math.min(d, 2.2); e.x = lim(e.x + (j.x - e.x) / d * v, IX0 + 26, IX1 - 26); e.y = lim(e.y + (j.y - e.y) / d * v, IY0 + 26, IY1 - 20);

      case "escupir": e.k = 3; if (e.tE === 16) {

ENEMIGOS.reyMosquin = Object.assign({}, DEF_JEFE, {

ENEMIGOS.gusanoAnillado = Object.assign({}, DEF_JEFE, {
  nombre: "EL GUSANO ANILLADO", vida: 300, r: 10, oy: 6, rastro: "sangre",
  crear(e) {
    e.dir = ABAJO; e.tGiro = 50; e.tTiro = 120; e.hist = [];
    e.segmentos = [];
    for (let i = 0; i < 8; i++) e.segmentos.push({ x: e.x, y: e.y, r: i === 7 ? 6 : 8, dir: ABAJO, cabeza: e });
    for (let i = 0; i < 120; i++) e.hist.push([e.x, e.y]);
  },
  pensar(e) {
    const j = J.jug, v = (e.vida < e.max / 2 ? 1.5 : 1.15) * e.lento;
    if (--e.tGiro <= 0 || e.choco) {
      // gira hacia Shumio si puede (nunca se da vuelta en el lugar)
      const quiere = Math.abs(j.x - e.x) > Math.abs(j.y - e.y) ? (j.x > e.x ? DERECHA : IZQUIERDA) : (j.y > e.y ? ABAJO : ARRIBA);
      const opciones = [0, 1, 2, 3].filter((d) => d !== opuesta(e.dir) && (!e.choco || d !== e.dir));
      e.dir = opciones.includes(quiere) && A.si(0.7) ? quiere : A.uno(opciones);
      e.tGiro = V.ent(36, 80);
    }
    e.vx = DIRS[e.dir][0] * v; e.vy = DIRS[e.dir][1] * v;
    e.hist.unshift([e.x, e.y]);
    if (e.hist.length > 160) e.hist.length = 160;
    const paso = Math.round(12 / v);
    e.segmentos.forEach((s, i) => {
      const h = e.hist[Math.min(e.hist.length - 1, (i + 1) * paso)], h2 = e.hist[Math.min(e.hist.length - 1, (i + 1) * paso - 2)];
      s.x = h[0]; s.y = h[1];
      const dx = h2[0] - h[0], dy = h2[1] - h[1];
      if (Math.abs(dx) + Math.abs(dy) > 0.1) s.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DERECHA : IZQUIERDA) : (dy > 0 ? ABAJO : ARRIBA);
    });
    e.k = e.tTiro < 16 ? 1 : 0;
    if (--e.tTiro <= 0) {
      const a = Math.atan2(j.y - e.y, j.x - e.x);

      g.drawImage(sp, Math.round(s.x - 13), Math.round(s.y + 4 - 26));

    g.drawImage(c, Math.round(e.x - 13), Math.round(e.y + 5 - 26));
  },
});

      if (--e.tA <= 0) { anilloBalas(bx, by, 16, 1.5, A.f() * TAU, { color: "sangre", r: 4, z: 20 }); SFX.escupe(); temblar(4); e.tA = 150; }
      if (--e.tB <= 0) { if (J.enemigos.length < 5) for (let i = 0; i < 2; i++) crearEnemigo("saltarin", cx(i ? 10 : 2), cy(5), { dormido: 20, sinCampeon: true }); e.tB = 300; }

function armarTandas() {
  J.tandas = {};
  for (const [id, o] of Object.entries(OBJETOS)) for (const p of o.pools) (J.tandas[p] ||= []).push(id);
  J.tandas.secreta = Object.keys(OBJETOS).filter((id) => !OBJETOS[id].pools.includes("pacto") || id === "hongoGigante");
  J.tomados = new Set();
}
function sacarObjeto(pool) {
  const lista = (J.tandas[pool] || []).filter((id) => !J.tomados.has(id) && !J.enPedestal.has(id));
  let id = lista.length ? A.uno(lista) : null;
  if (!id) { const resto = Object.keys(OBJETOS).filter((x) => !J.tomados.has(x) && !J.enPedestal.has(x)); id = resto.length ? A.uno(resto) : "caparazon"; }
  J.enPedestal.add(id);
  return id;
}
function revelarMapa() { if (!J.piso) return; for (const s of J.piso.salas.values()) if (s.tipo !== "secreta") s.vista = true; }

// ── los recogibles ──
function recogible(t, x, y, sub) {
  if (t === "corazon" && !sub) sub = A.pesos([["rojo", 6], ["medio", 3], ["espora", 1]]);
  if (t === "moneda" && !sub) sub = A.si(0.1) ? 5 : 1;
  if (t === "capsula" && sub == null) sub = A.ent(0, COLORES_CAPSULA.length - 1);
  if (t === "cofre" && !sub) sub = A.si(J.piso && J.piso.n >= 2 ? 0.3 : 0.18) ? "dorado" : "normal";
  return { t, sub, x, y, vx: 0, vy: 0, z: 0, vz: 0, r: 5, k: V.ent(0, 40) };
}
function pedestal(x, y, id) { return { t: "objeto", id, x, y, vx: 0, vy: 0, z: 0, vz: 0, r: 8, quieto: true, k: V.ent(0, 90) }; }

/** Tira algo al piso con un saltito. tipo: null (al azar), "espora" (corazón de espora), o un tipo. */
function soltarPremio(x, y, tipo) {
  let sub;
  if (tipo === "espora") { tipo = "corazon"; sub = "espora"; }
  if (!tipo) tipo = A.pesos([["moneda", 45], ["corazon", 25], ["bomba", 12], ["llave", 12], ["capsula", 6]]);
  const c = recogible(tipo, x, y, sub);
  const a = V.f() * TAU; c.vx = Math.cos(a) * 1.4; c.vy = Math.sin(a) * 1.1; c.vz = 2.4; c.z = 2;
  J.sala.cosas.push(c);
  return c;
}

/** El premio de limpiar una sala (como en el original: la suerte ayuda). */
function premioSala() {
  const j = J.jug, n = A.f() + j.suerte * 0.03;
  if (n < 0.36) return;
  const tipo = A.pesos([["moneda", 30], ["corazon", 18], ["llave", 14], ["bomba", 14], ["cofre", 8], ["capsula", 8]]);
  const [x, y] = lugarLibreCerca(cx(6), cy(3));
  const c = recogible(tipo, x, y);
  c.vz = 2; J.sala.cosas.push(c);
  if (tipo === "moneda" && A.si(0.25)) soltarPremio(x, y, "moneda");
}

function actualizarCosas() {
  const j = J.jug, C = J.sala.cosas;
  for (let i = C.length - 1; i >= 0; i--) {
    const c = C[i];
    c.k++;
    if (!c.quieto) {
      c.z += c.vz; c.vz -= 0.25;
      if (c.z <= 0) { c.z = 0; c.vz = Math.abs(c.vz) > 0.8 ? -c.vz * 0.35 : 0; }
      if (j.iman && !c.precio && ["moneda", "corazon", "bomba", "llave"].includes(c.t)) { const d = dist(j.x, j.y, c.x, c.y) || 1; if (d < 90) { c.vx += (j.x - c.x) / d * 0.18; c.vy += (j.y - c.y) / d * 0.18; } }
      c.vx *= 0.9; c.vy *= 0.9;
      moverEnSala(J.sala, c, c.vx, c.vy, false);
    }
    if (c.t === "trampilla") { if (!c.abierta && dist(j.x, j.y, c.x, c.y) > 20) c.abierta = true; if (c.abierta && dist(j.x, j.y, c.x, c.y) < 8 && !j.muerto && J.estado === "juego") bajarPiso(); continue; }
    if (j.muerto || c.z > 6) continue;
    const alcance = c.t === "objeto" ? 12 : c.t === "cofre" || c.t === "cofreFinal" ? 12 : 9;
    if (dist(j.x, j.y, c.x, c.y) > alcance) { c.tocando = false; continue; }
    if (tomar(c)) C.splice(i, 1);
  }
}

/** Shumio toca algo: ¿se lo lleva? (devuelve true si desaparece del piso) */
function tomar(c) {
  const j = J.jug;
  if (c.precio && c.t !== "objeto") {
    if (j.monedas < c.precio || !puedeUsar(c)) return false;
    j.monedas -= c.precio; SFX.moneda();
  }
  switch (c.t) {
    case "corazon": {
      if (c.sub === "espora" || c.sub === "esporaMedio") { if (!darEsporas(j, c.sub === "espora" ? 2 : 1)) return false; }
      else if (!curar(j, c.sub === "rojo" ? 2 : 1)) return false;
      SFX.corazon(); return true;
    }
    case "moneda": j.monedas = Math.min(99, j.monedas + (c.sub | 0)); SFX.moneda(); return true;
    case "bomba": j.bombas = Math.min(99, j.bombas + 1); SFX.recoger(); return true;
    case "llave": j.llaves = Math.min(99, j.llaves + 1); SFX.llave(); return true;
    case "capsula": {
      if (j.capsula != null) { const v = recogible("capsula", j.x, j.y + 10, j.capsula); v.vz = 2; v.vy = 1; J.sala.cosas.push(v); }
      j.capsula = c.sub; SFX.recoger(); rotulo(nombreCapsula(c.sub), ""); return true;
    }
    case "cofre": {
      if (c.abierto) return false;
      if (c.sub === "dorado") { if (j.llaves <= 0) return false; j.llaves--; }
      c.abierto = true; c.quieto = true; SFX.llave();
      if (c.sub === "dorado" && A.si(0.14)) { J.sala.cosas.push(pedestal(c.x, c.y - 18, sacarObjeto("tesoro"))); }
      else { const n = A.ent(2, c.sub === "dorado" ? 4 : 3); for (let i = 0; i < n; i++) soltarPremio(c.x, c.y); }
      return false;
    }
    case "cofreFinal": if (!c.abierto) { c.abierto = true; ganar(); } return false;
    case "objeto": return tomarObjeto(c);
  }
  return false;
}
function puedeUsar(c) {
  const j = J.jug;
  if (c.t === "corazon") return c.sub.startsWith("espora") ? j.esporas < 24 - j.cont : j.vida < j.cont;
  return true;
}

function tomarObjeto(c) {
  const j = J.jug;
  if (!c.id || c.tocando) return false;
  c.tocando = true;
  const def = OBJETOS[c.id];
  if (c.pacto) {
    const costo = c.pacto * 2;
    if (j.cont >= costo && vidaTotal(j) - costo > 0) sumarContenedor(j, -c.pacto);
    else if (j.cont === 0 && j.esporas > 6) j.esporas -= 6;
    else return false;
    SFX.pacto();
  } else if (c.precio) {
    if (j.monedas < c.precio) return false;
    j.monedas -= c.precio; SFX.moneda();
  }
  const id = c.id;
  J.tomados.add(id);
  if (def.activo) {
    if (j.activo) { c.id = j.activo.id; c.tocando = true; c.precio = 0; c.pacto = 0; } else c.id = null;
    j.activo = { id, carga: def.activo, max: def.activo };
  } else {
    c.id = null;
    const antes = fotoCuentas(j);
    def.aplicar(j);
    anotarCambios(antes);
    j.objetos.push(id);
    if (id === "moscaAmiga" || id === "hermanito") armarFamiliares();
  }
  rotulo(def.nombre, def.lema);
  SFX.objeto();
  j.sostiene = iconoSpr(id); j.tSostiene = 50;
  // en la tienda y en el pacto, lo comprado se va con pedestal y todo
  return (c.precio || c.pacto) && !c.id ? true : false;
}

function rehacerPedestales() {
  let alguno = false;
  for (const c of J.sala.cosas) if (c.t === "objeto" && c.id) {
    J.enPedestal.delete(c.id);
    c.id = sacarObjeto(J.sala.tipo === "tienda" ? "tienda" : J.sala.tipo === "pacto" ? "pacto" : J.sala.tipo === "jefe" ? "jefe" : "tesoro");
    humo(c.x, c.y - 16); alguno = true;
  }
  SFX[alguno ? "secreto" : "malo"]();
}

// ── las cápsulas: el color de cada efecto se sortea por partida ──
const EFECTOS_CAPSULA = [
  { n: "¡LÁGRIMAS ARRIBA!", f: (j) => { j.lagUps += 0.35; }, bueno: true }, { n: "LÁGRIMAS ABAJO", f: (j) => { j.lagUps -= 0.28; } },
  { n: "¡VELOCIDAD ARRIBA!", f: (j) => { j.vel += 0.15; }, bueno: true }, { n: "VELOCIDAD ABAJO", f: (j) => { j.vel -= 0.1; } },
  { n: "¡ALCANCE ARRIBA!", f: (j) => { j.alcance += 0.75; }, bueno: true }, { n: "ALCANCE ABAJO", f: (j) => { j.alcance -= 0.5; } },
  { n: "¡SALUD TOTAL!", f: (j) => { j.vida = j.cont; }, bueno: true },
  { n: "MAL VIAJE", f: (j) => { if (vidaTotal(j) <= 2) { j.vida = j.cont; J.capsulaBien = true; } else { j.inv = 0; herirJugador(j, 1, "UNA CÁPSULA"); } } },
  { n: "¡SUERTE ARRIBA!", f: (j) => { j.suerte += 1; }, bueno: true }, { n: "SUERTE ABAJO", f: (j) => { j.suerte -= 1; } },
  { n: "BOMBAS POR LLAVES", f: (j) => { [j.bombas, j.llaves] = [j.llaves, j.bombas]; }, bueno: true },

  { n: "¡DAÑO ARRIBA!", f: (j) => { j.danoPlano += 0.4; }, bueno: true },
];
function sortearCapsulas() { J.capsulas = A.mezclar(EFECTOS_CAPSULA.slice()).slice(0, COLORES_CAPSULA.length); J.capsulasVistas = new Set(); }
function nombreCapsula(i) { return J.capsulasVistas.has(i) ? J.capsulas[i].n : "UNA CÁPSULA"; }
function tomarCapsula(j) {
  if (j.capsula == null) return;
  const i = j.capsula, e = J.capsulas[i];
  j.capsula = null; J.capsulasVistas.add(i); J.capsulaBien = false;
  const antes = fotoCuentas(j);
  e.f(j);
  anotarCambios(antes);
  rotulo(J.capsulaBien ? "¡SALUD TOTAL!" : e.n, "");
  SFX[e.bueno || J.capsulaBien ? "capsula" : "malo"]();
}

// lo que cambió en las cuentas (el HUD lo muestra en verde o rojo al lado, como el original)
function fotoCuentas(j) { return { vel: velDe(j), lag: lagrimasPorSeg(j), dano: danoDe(j), alc: j.alcance, tiro: j.velLag, suerte: j.suerte }; }
function anotarCambios(antes) {
  const d = fotoCuentas(J.jug);
  J.cambios ||= {};
  for (const k in d) if (Math.abs(d[k] - antes[k]) > 0.005) J.cambios[k] = { d: d[k] - antes[k], t: 200 };
}

function usarActivo(j) {
  const a = j.activo;
  if (!a || j.muerto) return;
  if (a.carga < a.max) { SFX.clic(); return; }
  a.carga = 0;
  OBJETOS[a.id].usar(j);
  SFX.activo();
}
function cargarActivo(n = 1) {
  const a = J.jug.activo;
  if (!a || a.carga >= a.max) return;
  a.carga = Math.min(a.max, a.carga + n);
  if (a.carga >= a.max) SFX.cargado();
}

// ── los familiares ──
function armarFamiliares() {
  const j = J.jug, viejos = J.familiares.filter((f) => f.tipo === "moscaAzul");
  J.familiares = viejos;
  if (j.objetos.includes("moscaAmiga")) J.familiares.push({ tipo: "mosca", x: j.x, y: j.y, a: 0, bloquea: true, t: 0 });
  if (j.objetos.includes("hermanito")) J.familiares.push({ tipo: "hermanito", x: j.x, y: j.y + 10, enfriar: 0, mirar: ABAJO, t: 0 });
}
function actualizarFamiliares() {
  const j = J.jug;
  for (let i = J.familiares.length - 1; i >= 0; i--) {
    const f = J.familiares[i];
    f.t++;
    if (f.tipo === "mosca") {
      f.a += 0.055; f.x = j.x + Math.cos(f.a) * 20; f.y = j.y - 4 + Math.sin(f.a) * 15;
      if (f.t % 8 === 0) for (const e of J.enemigos) if (blanco_(e) && dist(e.x, e.y, f.x, f.y) < e.r + 5) danarEnemigo(e, 2.5);
    } else if (f.tipo === "hermanito") {
      const tx = j.x - DIRS[j.mirar][0] * 18, ty = j.y - DIRS[j.mirar][1] * 16 + 2;
      f.x += (tx - f.x) * 0.08; f.y += (ty - f.y) * 0.08;
      if (f.enfriar > 0) f.enfriar--;
      if ((IN.dx || IN.dy) && f.enfriar <= 0 && J.congelado <= 0) {
        f.mirar = j.mirar; f.enfriar = 34;
        J.lagrimas.push({ x: f.x, y: f.y, z: 12, vx: IN.dx * 3.1, vy: IN.dy * 3.1, vida: 48, vidaMax: 48, r: 3, dano: 3.5, color: "violeta", tocados: null });
      } else if (!(IN.dx || IN.dy)) f.mirar = ABAJO;
    } else if (f.tipo === "moscaAzul") {
      let obj = null, md = 1e9;
      for (const e of J.enemigos) { if (!blanco_(e)) continue; const d = dist(e.x, e.y, f.x, f.y); if (d < md) { md = d; obj = e; } }

  j.danoSala = 0;

  for (const p of sala.puertas) if (p && puertaVisible(p) && p.destino.tipo !== "secreta") p.destino.vista = true;
  if (!sala.fondo) sala.fondo = hornearFondo(J.piso.cap, sala.semilla);
  if (desde == null) { j.x = cx(6); j.y = cy(3) + 6; }
  else {
    const d = opuesta(desde), mY = IY0 + FILAS * T / 2;
    [j.x, j.y] = [[SALA_W / 2, IY0 + 9], [IX1 - 9, mY], [SALA_W / 2, IY1 - 7], [IX0 + 9, mY]][d];
    j.vx *= 0.3; j.vy *= 0.3;
  }
  armarFamiliares();
  for (const f of J.familiares) { f.x = j.x; f.y = j.y; }
  if (!sala.limpia) {
    poblarSala(sala);
    J.puertasAbiertas = false; SFX.puertaCierra();
    if (sala.tipo === "jefe") { J.vsPendiente = true; Musica.poner("jefe"); }
  } else J.puertasAbiertas = true;
  J.cierre = J.puertasAbiertas ? 0 : 1;
  if (sala.tipo === "pacto") Musica.poner("pacto");
  else if (sala.tipo !== "jefe" || sala.limpia) Musica.poner(PISOS[J.piso.n].musica);
}

// ── el paso de la lógica (60 veces por segundo) ──
function pasoJuego() {
  J.t++;
  if (J.fundido > 0) J.fundido--;
  if (J.temblor > 0) J.temblor *= 0.86, J.temblor < 0.4 && (J.temblor = 0);
  if (J.destello > 0) J.destello--;
  if (J.estado === "transicion") { if (++J.trans.t >= J.trans.dur) { J.trans = null; J.estado = "juego"; if (J.vsPendiente) empezarVs(); } return; }
  if (J.estado === "vs") { J.vs.t++; if (J.vs.t > 150 || (J.vs.t > 30 && (recien("toque") || recien("aceptar")))) J.estado = "juego"; return; }
  if (J.estado === "cayendo") { if (++J.tEstado > 60) { J.jug.x = cx(6); J.jug.y = cy(3); iniciarPiso(J.piso.n + 1); } return; }
  if (J.estado === "ganando") { if (++J.tEstado > 90) { J.estado = "victoria"; J.tEstado = 0; abrirMenu("victoria"); } return; }
  if (J.estado !== "juego") return;
  J.tiempo++;
  const j = J.jug;
  if (recien("pausa")) { abrirMenu("pausa"); return; }
  if (J.congelado > 0) J.congelado--;
  if (!j.muerto) {
    if (recien("bomba")) tirarBomba(j);
    if (recien("activo")) usarActivo(j);
    if (recien("capsula")) tomarCapsula(j);
  }
  actualizarJugador(j);
  actualizarFamiliares();
  actualizarEnemigos();
  actualizarLagrimas();
  actualizarBalas();
  actualizarBombas();
  actualizarCosas();
  actualizarBabas();
  actualizarParticulas();
  actualizarFx();
  const pend = J.pendientes; J.pendientes = [];
  for (const f of pend) f();
  // las puertas: animación y llaves
  const meta = J.puertasAbiertas ? 0 : 4;
  J.cierre += lim(meta - J.cierre, -0.34, 0.34);
  for (let d = 0; d < 4; d++) {
    const p = J.sala.puertas[d];
    if (p && p.llave && puertaVisible(p) && dist(j.x, j.y, PUERTA[d].x, PUERTA[d].y) < 20 && j.llaves > 0 && J.puertasAbiertas) {
      j.llaves--; p.llave = false; if (p.par) p.par.llave = false; SFX.llave(); SFX.puertaAbre();
    }
  }
  // ¿limpió la sala?
  if (!J.sala.limpia && J.enemigos.length === 0) salaLimpia();
  if (J.jefeMuerto && J.jefes.every((e) => e.muerto) && !J.sala.premiada) jefeDerrotado();
  // ¿sale por una puerta?
  if (!j.muerto) {
    let d = -1;
    if (j.y < IY0 - 5) d = ARRIBA; else if (j.y > IY1 + 5) d = ABAJO; else if (j.x < IX0 - 5) d = IZQUIERDA; else if (j.x > IX1 + 5) d = DERECHA;
    if (d >= 0) pasarPuerta(d);
  }
  if (j.muerto && j.tMuerte > 80 && J.estado === "juego") { J.estado = "muerte"; J.tEstado = 0; registro.muertes++; guardarRegistro(); abrirMenu("muerte"); }
}

function salaLimpia() {
  const s = J.sala;
  s.limpia = true;
  J.puertasAbiertas = true; SFX.puertaAbre();
  cargarActivo(1);
  if (s.tipo === "normal") premioSala();
}

function jefeDerrotado() {
  const s = J.sala, n = J.piso.n;
  s.premiada = true;
  J.sala.limpia = true; J.puertasAbiertas = true;
  registro.jefes = (registro.jefes || 0) + 1; guardarRegistro();
  cargarActivo(1);
  Musica.poner("silencio");
  if (n === ULTIMO_PISO) {
    const c = recogible("cofreFinal", cx(6), cy(4)); c.quieto = true; s.cosas.push(c);
    rotulo("¡MICELIA CAYÓ!", "ABRÍ EL COFRE", "oro");
    return;
  }
  s.cosas.push(pedestal(cx(6), cy(4) + 4, sacarObjeto("jefe")));
  for (let i = 0; i < A.ent(1, 2); i++) soltarPremio(cx(6) + V.ent(-20, 20), cy(3), "corazon");
  const tr = recogible("trampilla", cx(6), cy(1)); tr.quieto = true; s.cosas.push(tr);
  // la puerta del pacto: más probable si no te tocaron en la pelea
  if (n >= 2 && A.si(J.jug.golpesJefe === 0 ? 0.7 : 0.33)) {
    const libres = [0, 1, 2, 3].filter((d) => !s.puertas[d]);
    if (libres.length) { crearSalaPacto(J.piso, s, A.uno(libres)); J.pendientes.push(() => SFX.pacto()); }
  }
  J.jug.golpesJefe = 0;
}

function pasarPuerta(d) {
  const p = J.sala.puertas[d];
  if (!p) return;
  // una foto de la sala que se va (para el deslizamiento)
  gViejo.drawImage(cvSala, 0, 0);
  J.trans = { dir: d, t: 0, dur: 20 };
  J.estado = "transicion";
  const j = J.jug;
  entrarSala(p.destino, d);
  j.inv = Math.max(j.inv, 0);
  J.congelado = 8;
}

function empezarVs() { J.vsPendiente = false; J.estado = "vs"; J.vs = { t: 0, tipo: J.jefeTipo }; SFX.jefe(); }

function bajarPiso() {
  if (J.piso.n >= ULTIMO_PISO) return;
  J.estado = "cayendo"; J.tEstado = 0; SFX.pozo();
  registro.mejorPiso = Math.max(registro.mejorPiso || 1, J.piso.n + 1); guardarRegistro();
}
function ganar() {
  J.estado = "ganando"; J.tEstado = 0; SFX.objeto(); SFX.secreto();
  registro.victorias++; guardarRegistro();
}

// ── el dibujo ──
const _orden = [];
function dibujarSala(g) {
  const s = J.sala;
  g.drawImage(s.fondo, 0, 0);
  if (s.decal) g.drawImage(s.decal, 0, 0);
  // lo que está a ras del piso
  for (let f = 0; f < FILAS; f++) for (let c = 0; c < COLS; c++) {
    const o = s.celdas[f * COLS + c];
    if (!o) continue;
    const x = IX0 + c * T, y = IY0 + f * T;
    if (o.t === "pozo") { const es = (C, F) => { const q = celda(s, C, F); return !!q && q.t === "pozo"; }; g.drawImage(pozoSpr(es(c, f - 1), es(c - 1, f), es(c + 1, f), es(c, f + 1)), x, y); }
    else if (o.t === "pinchos") g.drawImage(pinchosSpr(true), x, y);
  }
  dibujarBabas(g);
  for (const c of s.cosas) if (c.t === "trampilla") dibujarCosa(g, c);
  // las puertas
  for (let d = 0; d < 4; d++) {
    const p = s.puertas[d];
    if (!p || !puertaVisible(p)) continue;
    const tipo = p.secreta ? "secreta" : p.tipo, est = p.llave ? 5 : Math.round(J.cierre);
    const [x, y] = lugarPuerta(d);
    g.drawImage(puertaRotada(tipo, tipo === "secreta" ? 0 : est, d), Math.round(x), Math.round(y));
  }
  // todo lo que está parado, ordenado por su pie
  _orden.length = 0;
  for (let f = 0; f < FILAS; f++) for (let c = 0; c < COLS; c++) {
    const o = s.celdas[f * COLS + c];
    if (o && o.t !== "pozo" && o.t !== "pinchos" && !(o.t === "matas" && o.vida <= 0)) _orden.push([cy(f) + T / 2 - 2, 0, o, c, f]);
  }
  for (const c of s.cosas) if (c.t !== "trampilla") _orden.push([c.y, 1, c]);
  for (const e of J.enemigos) _orden.push([e.y + (e.jefe && e.z > 40 ? 999 : 0), 2, e]);
  for (const f of J.familiares) _orden.push([f.y, 3, f]);
  for (const b of J.bombas) _orden.push([b.y, 4, b]);
  _orden.push([J.jug.y, 5, J.jug]);
  for (const l of J.lagrimas) _orden.push([l.y, 6, l]);
  for (const b of J.balas) _orden.push([b.y, 7, b]);
  _orden.sort((a, b) => a[0] - b[0]);
  for (const it of _orden) {
    const o = it[2];
    switch (it[1]) {
      case 0: dibujarObstaculo(g, o, it[3], it[4]); break;
      case 1: dibujarCosa(g, o); break;
      case 2: if (o.def.dibujar) o.def.dibujar(g, o); else dibujarEnemigo(g, o); break;
      case 3: dibujarFamiliar(g, o); break;
      case 4: dibujarBomba(g, o); break;
      case 5: if (J.estado !== "cayendo") dibujarJugador(g, o); break;
      case 6: dibujarLagrima(g, o); break;
      case 7: dibujarBala(g, o); break;
    }
  }
  dibujarFx(g);
  dibujarParticulas(g);
  if (J.estado === "cayendo") {
    const u = Math.min(1, J.tEstado / 30), sp = spritesShumio(), j = J.jug;
    const e = 1 - u;
    if (e > 0.05) { g.save(); g.translate(Math.round(j.x), Math.round(j.y)); g.scale(e, e); g.drawImage(sp.cue.frente[0], -7, -8); g.drawImage(sp.cab.frente[3], -11, -24); g.restore(); }
  }
  g.drawImage(vineta(), -20, -20);
}
function dibujarObstaculo(g, o, c, f) {
  const x = cx(c), yb = cy(f) + T / 2 + 1;
  let s;
  switch (o.t) {
    case "roca": s = rocaSpr(o.v, o.marcada); break;
    case "matas": s = matasSpr(o.vida, o.dorada ? 1 : 0); break;
    case "brasero": s = braseroSpr((J.t >> 3) & 3, o.prendido); break;
    case "barril": s = barrilSpr(); break;
    case "bloque": s = bloqueSpr(); break;
    default: return;
  }
  g.drawImage(s, Math.round(x - s.width / 2), yb - s.height);
}

function dibujarJuego(g) {
  const W = PANT.W, H = PANT.H;
  g.fillStyle = "#07060a"; g.fillRect(0, 0, W, H);
  dibujarSala(gSala);
  let ox = PANT.salaX, oy = PANT.salaY;
  if (J.temblor > 0) { ox += Math.round((V.f() - 0.5) * J.temblor); oy += Math.round((V.f() - 0.5) * J.temblor); }
  if (J.trans) {
    const u = J.trans.t / J.trans.dur, e = u * u * (3 - 2 * u), [dx, dy] = DIRS[J.trans.dir];
    const sx = Math.round(-dx * SALA_W * e), sy = Math.round(-dy * SALA_H * e);
    g.drawImage(cvViejo, ox + sx, oy + sy);
    g.drawImage(cvSala, ox + sx + dx * SALA_W, oy + sy + dy * SALA_H);
  } else g.drawImage(cvSala, ox, oy);
  if (J.destello > 0) { g.fillStyle = `rgba(255,248,235,${J.destello * 0.08})`; g.fillRect(0, 0, W, H); }
  if (J.estado !== "vs") dibujarHud(g);
  if (J.estado === "vs") dibujarVs(g);
  if (J.fundido > 0) { g.fillStyle = `rgba(0,0,0,${J.fundido / 45})`; g.fillRect(0, 0, W, H); }
  if (J.estado === "cayendo" && J.tEstado > 30) { g.fillStyle = `rgba(0,0,0,${Math.min(1, (J.tEstado - 30) / 25)})`; g.fillRect(0, 0, W, H); }
  if (J.estado === "ganando") { g.fillStyle = `rgba(255,250,240,${Math.min(1, J.tEstado / 80)})`; g.fillRect(0, 0, W, H); }
}

// ── el bucle: paso fijo de 60 Hz, dibujo cuando hubo paso ──
let _acum = 0, _ultimo = 0;
const PERF = { cuadros: 0, pasos: 0, msDibujo: 0 };
function cuadro(ahora) {
  requestAnimationFrame(cuadro);
  if (!_ultimo) _ultimo = ahora;
  _acum += Math.min(100, ahora - _ultimo); _ultimo = ahora;
  let n = 0;
  while (_acum >= CUADRO && n < 4) { paso(); _acum -= CUADRO; n++; }
  if (n >= 4) _acum = 0;
  if (n > 0) { const t0 = performance.now(); dibujar(); PERF.msDibujo = PERF.msDibujo * 0.95 + (performance.now() - t0) * 0.05; PERF.cuadros++; }
}

  ubicarBotones();
  if (PANT.vertical) { if (enJuego()) abrirMenu("pausa"); finEntrada(); return; }
  if (MENU.activo) pasoMenu();

}
function dibujar() {

}

// con chinches sobre una pared de papel gris llena de garabatos desvaídos, todo escrito a mano

const MENU = { activo: null };
let registro = { partidas: 0, victorias: 0, muertes: 0, mejorPiso: 1, jefes: 0 };
try { Object.assign(registro, JSON.parse(localStorage.getItem("shumio-registro") || "{}")); } catch (e) { /* sin guardar */ }
function guardarRegistro() { try { localStorage.setItem("shumio-registro", JSON.stringify(registro)); } catch (e) { /* nada */ } }

const pct = (v) => Math.round(v * 100) + "%";
function reloj(cuadros) { const s = Math.floor(cuadros / 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
const TINTA_MANO = "#2b2326";

function abrirMenu(tipo) {
  const m = { tipo, sel: 0, t: 0, sobreJuego: tipo === "pausa" || tipo === "muerte", items: [], rects: [] };
  const vol = () => [
    { texto: () => "MÚSICA " + pct(volMusica), cambiar: (d) => { volMusica = lim(Math.round((volMusica + d * 0.1) * 10) / 10, 0, 1); guardarVolumen(); } },
    { texto: () => "EFECTOS " + pct(volEfectos), cambiar: (d) => { volEfectos = lim(Math.round((volEfectos + d * 0.1) * 10) / 10, 0, 1); guardarVolumen(); SFX.moneda(); } },
  ];
  if (tipo === "titulo") { m.items = [{ texto: () => IN.usaTactil ? "TOCÁ PARA EMPEZAR" : "ENTER O CLIC", hacer: () => abrirMenu("principal") }]; Musica.poner("menu"); }
  if (tipo === "principal") Musica.poner("menu");
  if (tipo === "principal") m.items = [{ texto: () => "NUEVA PARTIDA", hacer: () => { MENU.activo = null; nuevaPartida(); } }, ...vol(), { texto: () => "CÓMO SE JUEGA", hacer: () => abrirMenu("ayuda") }];
  if (tipo === "ayuda") m.items = [{ texto: () => "VOLVER", hacer: () => abrirMenu("principal") }];
  if (tipo === "pausa") m.items = [{ texto: () => "SEGUIR", hacer: () => { MENU.activo = null; } }, ...vol(), { texto: () => "SALIR", hacer: () => { J = null; abrirMenu("principal"); } }];
  if (tipo === "muerte" || tipo === "victoria") m.items = [{ texto: () => "OTRA VEZ", hacer: () => { MENU.activo = null; nuevaPartida(); } }, { texto: () => "AL MENÚ", hacer: () => { J = null; abrirMenu("principal"); } }];
  if (tipo === "victoria") Musica.poner("menu");
  MENU.activo = m;
}

function pasoMenu() {
  const m = MENU.activo;
  m.t++;
  const n = m.items.length, it = () => m.items[m.sel];
  if (m.t < 12) return;   // que un toque de antes no active nada
  if (recien("kArrowUp") || recien("kKeyW")) { m.sel = (m.sel + n - 1) % n; SFX.clic(); }
  if (recien("kArrowDown") || recien("kKeyS")) { m.sel = (m.sel + 1) % n; SFX.clic(); }
  if ((recien("kArrowLeft") || recien("kKeyA")) && it().cambiar) it().cambiar(-1);
  if ((recien("kArrowRight") || recien("kKeyD")) && it().cambiar) it().cambiar(1);
  if (recien("aceptar")) activar(it());
  if (m.tipo === "pausa" && recien("pausa")) { MENU.activo = null; return; }
  if (m.tipo === "ayuda" && recien("pausa")) { abrirMenu("principal"); return; }
  // PC: el mouse elige lo que tiene abajo
  if (IN.movio) { IN.movio = false; m.rects.forEach((r, i) => { if (IN.px >= r.x - 12 && IN.px <= r.x + r.w + 6 && IN.py >= r.y - 2 && IN.py <= r.y + r.h + 2 && m.sel !== i) { m.sel = i; SFX.clic(); } }); }
  const tq = FLANCO.toque;
  if (tq) {
    if (m.tipo === "titulo") { activar(m.items[0]); return; }
    m.rects.forEach((r, i) => { if (tq.x >= r.x - 6 && tq.x <= r.x + r.w + 6 && tq.y >= r.y - 3 && tq.y <= r.y + r.h + 3) { m.sel = i; activar(m.items[i], true); } });
  }
}
function activar(it, tactil) {

// ── piezas de papel ──
/** Una hoja clavada: el papel (que se mece apenas) y sus dos chinches. Devuelve dónde quedó. */
function hoja(g, x, y, w, h, semilla, tono = "blanco", mece = 0, chinches = 2) {
  const p = papelSpr(w, h, semilla, tono), dy = Math.round(Math.sin(mece) * 0.8);
  g.drawImage(p, Math.round(x - 3), Math.round(y - 3 + dy));
  const ch = chincheSpr();
  if (chinches >= 1) g.drawImage(ch, Math.round(x + w * 0.2 - 4), Math.round(y - 2 + dy));
  if (chinches >= 2) g.drawImage(ch, Math.round(x + w * 0.78 - 4), Math.round(y - 3 + dy));
  return dy;
}
/** Escribe a mano; alinear: "izq" | "centro". Devuelve el rectángulo (para tocarlo). */
function escribir(g, str, x, y, alinear = "izq", tinta = TINTA_MANO) {
  const s = manoSpr(str, { tinta });
  const X = alinear === "centro" ? Math.round(x - s.width / 2) : Math.round(x);
  g.drawImage(s, X, Math.round(y));
  return { x: X, y: Math.round(y), w: s.width, h: s.height };
}
/** El triangulito de tinta que marca la opción elegida. */
function flechita(g, x, y, t) {
  g.fillStyle = TINTA_MANO;
  const b = (t >> 4) & 1;
  for (let i = 0; i < 4; i++) g.fillRect(x + b, y + i, 1 + i * 1.4 | 0, 1), g.fillRect(x + b, y + 7 - i, 1 + i * 1.4 | 0, 1);
  g.fillRect(x + b, y + 4, 6, 1);
}
/** La lista de opciones sobre una hoja, con la flechita en la elegida. */
function opciones(g, m, x, y, paso = 17) {
  m.rects = m.items.map((it, i) => {
    const r = escribir(g, it.texto(), x + 10, y + i * paso);
    if (i === m.sel) flechita(g, x, y + i * paso + 5, m.t);
    return r;
  });
}
