}
function humo(x, y) { J.fx.push({ anim: [0, 1, 2, 3].map(humoSpr), x, y, t: 0, cada: 5, centro: true }); }

// ── las manchas: se pintan UNA vez en el piso de la sala y se quedan ──
function mancha(tipo, x, y, escala = 1) {
  const s = J.sala;
  if (!s.decal) s.decal = lienzoNuevo(SALA_W, SALA_H);
  const g = s.decal.getContext("2d"), m = manchaSpr(tipo, V.ent(0, 5));
  g.save(); g.globalAlpha = tipo === "quemado" ? 0.8 : 0.72; g.beginPath(); g.rect(IX0, IY0, COLS * T, FILAS * T); g.clip();
  const w = Math.round(m.width * escala), h = Math.round(m.height * escala);
  g.imageSmoothingEnabled = false;
  g.drawImage(m, Math.round(x - w / 2), Math.round(y - h / 2), w, h);
  g.restore();
}

// ── la baba (el rastro de las babosas, y el de algunos jefes): daña si la pisás ──
function dejarBaba(x, y, r = 9, dura = 240, danina = true, tipo = "baba") {
  if (J.babas.length > 90) J.babas.shift();
  J.babas.push({ x, y, r, t: dura, max: dura, danina, tipo, v: V.ent(0, 5) });
}
/** La baba amiga (la de Bob, el líquido misterioso): 20 de daño por segundo a lo que la pisa. */
function actualizarBabas() {
  for (let i = J.babas.length - 1; i >= 0; i--) {
    const b = J.babas[i];
    if (b.tipo === "amiga" && J.t % 3 === 0) for (const e of J.enemigos) if (blanco_(e) && !e.vuela && dist(e.x, e.y, b.x, b.y) < b.r + e.r * 0.5) danarEnemigo(e, 1);
    if (--b.t <= 0) J.babas.splice(i, 1);
  }
}
function dibujarBabas(g) {
  for (const b of J.babas) {
    const s = b.tipo === "amiga" ? tinte(manchaSpr("baba", b.v), "rgba(70,200,40,0.55)") : manchaSpr("baba", b.v), k = b.r / 9;
    g.globalAlpha = Math.min(1, b.t / 40) * 0.8;
    g.drawImage(s, Math.round(b.x - s.width * k / 2), Math.round(b.y - s.height * k / 2), Math.round(s.width * k), Math.round(s.height * k));
  }
  g.globalAlpha = 1;
}

// ── dibujar lo que vuela ──
function dibujarLagrima(g, l) {
  const sh = sombra(Math.max(2, l.r - 1), Math.max(1, Math.round(l.r / 2)));
  g.drawImage(sh, Math.round(l.x - sh.width / 2), Math.round(l.y - sh.height / 2 + 2));
  const X = l.x, Y = l.y - l.z, ang = Math.atan2(l.vy, l.vx), lk = l.look || { color: l.color, alfa: 1 };
  if (l.tipo === "cuchillo" || l.tipo === "aguja" || l.tipo === "hueso" || l.tipo === "diente") {
    const s = l.tipo === "cuchillo" ? cuchilloSpr() : proyectilSpr(l.tipo);
    g.save(); g.translate(Math.round(X), Math.round(Y)); g.rotate(ang + (l.tipo === "hueso" ? l.t * 0.3 : 0)); g.drawImage(s, -s.width / 2, -s.height / 2); g.restore();
    return;
  }
  if (l.tipo === "moneda") { const s = monedaSpr(Math.floor(l.t / 4) % 4); g.drawImage(s, Math.round(X - s.width / 2), Math.round(Y - s.height / 2)); return; }
  const v = Math.hypot(l.vx, l.vy) || 1, ux = -l.vx / v, uy = -l.vy / v;
  // la estela: llama (mente de fuego) o humo oscuro (materia oscura), detrás de la lágrima
  if (lk.estela) for (let k = 4; k >= 1; k--) {
    const d = k * l.r * 0.9, rr = l.r * (1 - k * 0.17);
    g.globalAlpha = (lk.estela === "fuego" ? 0.55 : 0.4) * (1 - k / 5);
    g.fillStyle = lk.estela === "fuego" ? (k > 2 ? "#e0501a" : "#ffa040") : "#0c0c10";
    g.beginPath(); g.arc(X + ux * d, Y + uy * d, Math.max(1, rr), 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  // el aura (cabeza divina: un halo dorado grande; líquido: brillo verde; chispas; luz santa)
  if (lk.aura) {

// Los campeones (desde el piso 2) salen rojizos, con el doble de vida y un premio seguro.

      const v = (e.sinGorro ? 1.05 : 0.72) * e.lento;

      } else {

        if (--e.tE <= 0) { e.est = "suelo"; e.z = 0; e.alturaGolpe = 0; e.tE = V.ent(24, 50); particulas(e.x, e.y, 3, ["#634537", "#3c2a22"], 1, 1); }

  gusano: {

        if (e.est === "afuera" && e.tE === 34) {
          const j = J.jug, a = Math.atan2(j.y - e.y, j.x - e.x);
          for (const d of [-0.3, 0, 0.3]) bala(e.x, e.y - 10, a + d, 2.2);

      else if (e.est === "sube") { e.est = "afuera"; e.tE = 56; }

  bulbo: {

    pensar(e) {
      if (e.est === "quieta") { e.vx *= 0.6; e.vy *= 0.6; if (--e.tE <= 0) { const j = J.jug, a = Math.atan2(j.y + V.ent(-24, 24) - e.y, j.x + V.ent(-24, 24) - e.x); e.est = "corre"; e.tE = V.ent(16, 26); e.vx = Math.cos(a) * 2.4 * e.lento; e.vy = Math.sin(a) * 2.4 * e.lento; } }

// quién sale en cada capítulo (e = común, E = fuerte)
const TANDAS = {
  sotano: { e: [["mosquin", 3], ["mosquinRojo", 2], ["hongon", 4], ["escupidor", 2], ["saltarin", 2], ["arana", 1]], E: [["grumo", 3], ["bulbo", 2], ["babosa", 2], ["gusano", 1]] },
  raices: { e: [["mosquinRojo", 3], ["hongon", 3], ["escupidor", 2], ["saltarin", 2], ["arana", 3], ["gusano", 2], ["babosa", 1]], E: [["grumo", 3], ["bulbo", 3], ["babosa", 2], ["gusano", 3]] },
};

function difAng(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; }
function lugarLibreCerca(x, y) {
  let c = lim(celdaX(x), 0, COLS - 1), f = lim(celdaY(y), 0, FILAS - 1);
  if (!esSolida(celda(J.sala, c, f))) return [lim(x, IX0 + 8, IX1 - 8), lim(y, IY0 + 8, IY1 - 8)];
  for (let r = 1; r < 6; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const C = c + dx, F = f + dy;
    if (C >= 0 && F >= 0 && C < COLS && F < FILAS && !esSolida(celda(J.sala, C, F))) return [cx(C), cy(F)];
  }
  return [x, y];
}

function crearEnemigo(tipo, x, y, o = {}) {
  const d = ENEMIGOS[tipo];
  const escala = 1 + (J.piso.n - 1) * 0.2;
  const e = {
    tipo, def: d, x, y, r: d.r, vx: 0, vy: 0, z: 0, t: V.ent(0, 60), vuela: !!d.vuela, oy: d.oy ?? 4,
    vida: d.vida * escala, max: d.vida * escala, golpe: 0, kx: 0, ky: 0, mira: 1, lento: 1, frio: 0, veneno: null, quema: null,
    dormido: o.dormido ?? 34, jefe: !!d.jefe, campeon: false,
  };
  if (!e.jefe && J.piso.n >= 2 && !o.sinCampeon && A.si(0.06)) { e.campeon = true; e.vida = e.max = e.max * 2; }
  if (d.crear) d.crear(e);
  J.enemigos.push(e);
  return e;
}

function danarEnemigo(e, d, kx = 0, ky = 0, lag = null) {
  if (e.muerto || e.oculto || e.intangible) return;
  if (e.cabeza) e = e.cabeza;           // los anillos del gusano jefe comparten la vida
  e.vida -= d; e.golpe = 5;
  if (!e.jefe) { const p = e.def.peso ?? 1; e.kx += kx / p; e.ky += ky / p; }
  if (lag) {
    // veneno y quemadura: como en el original, dos a cuatro golpes del daño de Shumio
    const dj = J.jug ? Math.min(danoDe(J.jug), 40) : 3.5;
    if (lag.veneno) e.veneno = { t: 80, dano: Math.max(2, dj * 0.5) };
    if (lag.hielo) e.frio = 100;
    if (lag.fuego) e.quema = { t: 80, dano: Math.max(1.5, dj * 0.4) };
    if (lag.miedo) e.miedo = e.jefe ? 60 : 150;
    if (lag.piedra) e.piedra = e.jefe ? 40 : 100;
  }
  if (e.vida <= 0) matarEnemigo(e);
}

function matarEnemigo(e) {
  if (e.muerto) return;
  e.muerto = true;
  const d = e.def;
  if (d.morir) d.morir(e);
  const r = d.rastro === "baba" ? PAL.baba : d.rastro === "espora" ? PAL.espora : PAL.sangre;
  sangrar(e.x, e.y - 6, e.jefe ? 30 : 9, r);
  mancha(d.rastro === "baba" ? "baba" : d.rastro === "espora" ? "espora" : "sangre", e.x, e.y, e.jefe ? 2 : e.r > 6 ? 1 : 0.7);
  SFX.muere();
  J.muertes++;
  if (e.campeon) soltarPremio(e.x, e.y);
  if (e.segmentos) for (const s of e.segmentos) { sangrar(s.x, s.y - 6, 6, PAL.sangre); mancha("sangre", s.x, s.y, 1); }
  if (e.jefe && d.alMorir) d.alMorir(e);
}

function actualizarEnemigos() {
  const j = J.jug;
  // el campo hacia Shumio, cada tanto
  if (!J.campo || J.t % 12 === 0 || J.cambioGrilla) { J.campo = campoHacia(J.sala, j.x, j.y); J.cambioGrilla = false; }
  for (const e of J.enemigos) {
    if (e.muerto) continue;
    e.t++;
    if (e.golpe > 0) e.golpe--;
    if (e.dormido > 0) { e.dormido--; continue; }
    e.lento = e.frio > 0 ? 0.5 : 1;
    if (e.frio > 0) e.frio--;
    for (const k of ["veneno", "quema"]) {
      const s = e[k];
      if (!s) continue;
      if (--s.t <= 0) e[k] = null; else if (s.t % 20 === 0) { e.vida -= s.dano; e.golpe = 2; if (e.vida <= 0) matarEnemigo(e); }
    }
    if (e.muerto) continue;
    // petrificado: no piensa ni se mueve (sólo lo empujan los golpes)
    if (e.piedra > 0) { e.piedra--; e.vx = e.vy = 0; moverEnSala(J.sala, e, e.kx, e.ky, e.vuela); e.kx *= 0.78; e.ky *= 0.78; continue; }
    J.quien = e;
    e.def.pensar(e);
    J.quien = null;
    // con miedo: hace lo suyo pero para el otro lado (se aleja de Shumio)
    if (e.miedo > 0) { e.miedo--; const v = Math.hypot(e.vx, e.vy) || 0.6, d = dist(e.x, e.y, j.x, j.y) || 1; e.vx = (e.x - j.x) / d * v; e.vy = (e.y - j.y) / d * v; }
    if (e.muerto) continue;
    const vuela = e.vuela || e.vueloPropio;
    if (e.rebotaSolo) {
      moverEnSala(J.sala, e, e.vx + e.kx, 0, vuela); if (e.choco) e.dx = -e.dx;
      moverEnSala(J.sala, e, 0, e.vy + e.ky, vuela); if (e.choco) e.dy = -e.dy;
    } else if (!e.fijo) moverEnSala(J.sala, e, e.vx + e.kx, e.vy + e.ky, vuela);
    e.kx *= 0.78; e.ky *= 0.78;
    // el golpe a Shumio al tocarlo
    if (!e.oculto && !e.intangible && !j.muerto && (e.z || 0) < 10) {
      const toca = e.segmentos ? tocaSegmento(e, j.x, j.y, 4) : dist(e.x, e.y, j.x, j.y) < e.r + 4;
      if (toca) herirJugador(j, e.jefe || J.piso.n >= 3 ? 2 : 1, e.def.nombre, e.def.spr(e));
    }
  }
  // que no se amontonen (los que caminan se empujan entre sí)
  const E = J.enemigos;
  for (let a = 0; a < E.length; a++) for (let b = a + 1; b < E.length; b++) {
    const p = E[a], q = E[b];
    if (p.muerto || q.muerto || p.oculto || q.oculto || p.jefe || q.jefe) continue;
    const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy), m = p.r + q.r - 2;
    if (d < m && d > 0.01) { const f = (m - d) / d * 0.25; p.x -= dx * f; p.y -= dy * f; q.x += dx * f; q.y += dy * f; }
  }
  for (let i = E.length - 1; i >= 0; i--) if (E[i].muerto) E.splice(i, 1);
}

function tocaSegmento(e, x, y, r) {
  if (dist(e.x, e.y, x, y) < e.r + r) return true;
  for (const s of e.segmentos) if (dist(s.x, s.y, x, y) < s.r + r) return true;
  return false;
}

function dibujarEnemigo(g, e) {
  if (e.oculto) return;
  const d = e.def;
  let s = d.spr(e);
  if (e.mira < 0 && d.voltea) s = espejado(s);
  if (e.campeon) s = tinte(s, "rgba(230,40,30,0.38)");
  if (e.piedra > 0) s = tinte(s, "rgba(120,116,110,0.7)");
  else if (e.miedo > 0 && (e.t >> 3) & 1) s = tinte(s, "rgba(60,20,90,0.45)");
  else if (e.veneno) s = tinte(s, "rgba(90,220,60,0.4)");
  else if (e.frio > 0) s = tinte(s, "rgba(120,200,255,0.45)");
  else if (e.quema) s = tinte(s, "rgba(255,140,40,0.4)");
  if (e.golpe > 0 && (e.golpe & 2)) s = blanco(s);
  const rx = Math.max(3, Math.round(e.r * (e.jefe ? 1.05 : 0.95))), ry = Math.max(2, Math.round(rx * 0.38));
  const X = Math.round(e.x), Y = Math.round(e.y);
  if (!(e.est === "bajo")) g.drawImage(sombra(rx, ry), X - rx, Y - ry + 2);
  const z = Math.round(e.z || 0) + (d.vuela ? Math.round(Math.sin(e.t * 0.15) * 1.2) : 0);
  if (e.dormido > 0 && (e.dormido & 2)) g.globalAlpha = 0.6;
  g.drawImage(s, X - Math.floor(s.width / 2), Y + e.oy - s.height - z);
  g.globalAlpha = 1;
}

/** Los enemigos de una sala al entrar (según su diseño y el capítulo). */
function poblarSala(sala) {
  const tanda = TANDAS[J.piso.cap];
  for (const h of sala.huecos) {
    const x = cx(h.c), y = cy(h.f);
    if (h.tipo === "e") crearEnemigo(A.pesos(tanda.e), x, y);
    else if (h.tipo === "E") crearEnemigo(A.pesos(tanda.E), x, y);
    else if (h.tipo === "v") { if (J.jug.f.belcebu) J.familiares.push(moscaAzul(x, y)); else crearEnemigo(J.piso.n >= 2 ? "mosquinRojo" : "mosquin", x, y); }
    else if (h.tipo === "j") crearJefe(sala, x, y);
    J.fx.push({ anim: [0, 1, 2, 3, 4].map(aparicionSpr), x, y: y - 4, t: 0, cada: 4, centro: true });
  }
}

// ══════════ 15-jefes.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LOS JEFES: la Madre Babosa (saltitos, el salto grande que cae con un anillo de baba, el
// escupitajo en abanico), el Rey Mosquín (se infla y revienta en lágrimas, llama a su corte),
// el Gusano Anillado (una serpiente de anillos que comparten la vida) y Micelia, la Madre
// Hongo del fondo, con tres fases. Al morir: un objeto, corazones y la trampilla (o el cofre).
// ─────────────────────────────────────────────────────────────────────────────

const NOMBRE_JEFE = { madreBabosa: "MADRE BABOSA", reyMosquin: "REY MOSQUÍN", gusanoAnillado: "GUSANO ANILLADO", micelia: "MICELIA" };

/** Qué jefe le toca a cada piso (sin repetir hasta el tercero). */
function elegirJefe(n, yaVistos) {
  if (n === ULTIMO_PISO) return "micelia";
  const todos = ["madreBabosa", "reyMosquin", "gusanoAnillado"];
  const pool = n === 1 ? ["madreBabosa", "reyMosquin"] : todos.filter((t) => !yaVistos.includes(t));
  return A.uno(pool.length ? pool : todos);
}

function crearJefe(sala, x, y) {
  const tipo = J.jefeTipo, e = crearEnemigo(tipo, x, y, { dormido: 20, sinCampeon: true });
  const escala = 1 + (J.piso.n - 1) * 0.25;
  e.vida = e.max = ENEMIGOS[tipo].vida * (tipo === "micelia" ? 1 : escala);
  J.jefes.push(e);
  return e;
}

function alMorirJefe(e) {
  temblar(16); SFX.explosion();
  for (let i = 0; i < 5; i++) J.pendientes.push(() => { particulas(e.x + V.ent(-16, 16), e.y - 10 + V.ent(-12, 12), 10, [PAL.sangre[2], PAL.sangre[3], PAL.hueso[3]], 3, 10); });
  J.jefeMuerto = true;
}

const DEF_JEFE = { jefe: true, peso: 99, alMorir: alMorirJefe };

ENEMIGOS.madreBabosa = Object.assign({}, DEF_JEFE, {
  nombre: "LA MADRE BABOSA", vida: 250, r: 20, oy: 8, rastro: "baba",
  crear(e) { e.est = "espera"; e.tE = 50; e.k = 0; },
  pensar(e) {
    const j = J.jug;
    e.vx = e.vy = 0;
    switch (e.est) {
      case "espera": e.k = 0; if (--e.tE <= 0) {
        const q = A.pesos([["saltitos", 4], ["grande", 3], ["escupir", 3]]);
        if (q === "saltitos") { e.saltos = A.ent(2, 3); e.est = "agacha"; e.tE = 12; e.sig = "salto"; }
        else if (q === "grande") { e.est = "agacha"; e.tE = 18; e.sig = "subir"; }
        else { e.est = "escupir"; e.tE = 34; }
      } break;
      case "agacha": e.k = 1; if (--e.tE <= 0) {
        if (e.sig === "salto") { e.est = "salto"; e.tE = 30; e.x0 = e.x; e.y0 = e.y; const a = Math.atan2(j.y - e.y, j.x - e.x), d = Math.min(60, dist(j.x, j.y, e.x, e.y)); e.x1 = lim(e.x + Math.cos(a) * d, IX0 + 26, IX1 - 26); e.y1 = lim(e.y + Math.sin(a) * d, IY0 + 26, IY1 - 20); SFX.salto(); }
        else { e.est = "subir"; e.tE = 34; e.intangible = true; SFX.salto(); }
      } break;
      case "salto": { e.k = 2; const u = 1 - e.tE / 30; e.x = lerp(e.x0, e.x1, u); e.y = lerp(e.y0, e.y1, u); e.z = Math.sin(u * Math.PI) * 22; e.alturaGolpe = e.z * 0.5;
        if (--e.tE <= 0) { e.z = 0; aterrizaMadre(e, false); e.saltos--; if (e.saltos > 0) { e.est = "agacha"; e.tE = 10; e.sig = "salto"; } else { e.est = "espera"; e.tE = V.ent(40, 70); } } } break;
      case "subir": e.k = 2; e.z += 9; if (--e.tE <= 0) { e.est = "sombra"; e.tE = 60; } break;
      case "sombra": { e.k = 2; const d = dist(j.x, j.y, e.x, e.y) || 1, v = Math.min(d, 2.2); e.x = lim(e.x + (j.x - e.x) / d * v, IX0 + 26, IX1 - 26); e.y = lim(e.y + (j.y - e.y) / d * v, IY0 + 26, IY1 - 20);
        if (--e.tE <= 0) { e.est = "cae"; e.tE = 30; } } break;
      case "cae": e.k = 2; e.z = Math.max(0, e.z - 14); if (e.z <= 0) { e.intangible = false; aterrizaMadre(e, true); e.est = "espera"; e.tE = V.ent(50, 80); } break;
      case "escupir": e.k = 3; if (e.tE === 16) {
        const a = Math.atan2(j.y - e.y, j.x - e.x), n = J.piso.n >= 2 ? 14 : 11;
        for (let i = 0; i < n; i++) bala(e.x, e.y - 18, a + (A.f() - 0.5) * 0.9, 1.3 + A.f() * 1.7, { r: A.ent(2, 4), color: "moho", z: 16 + A.ent(0, 10) });
        SFX.escupe(); temblar(3);
      } if (--e.tE <= 0) { e.est = "espera"; e.tE = V.ent(40, 70); } break;
    }
    e.intangible = e.est === "subir" || e.est === "sombra" || (e.est === "cae" && e.z > 30);
  },
  spr: (e) => madreBabosaSpr(e.k),
});
function aterrizaMadre(e, grande) {
  temblar(grande ? 10 : 4); SFX.cae();
  dejarBaba(e.x, e.y, grande ? 20 : 12, 360);
  if (grande) anilloBalas(e.x, e.y - 6, J.piso.n >= 2 ? 14 : 10, 1.8, A.f() * TAU, { color: "moho", r: 3 });
  particulas(e.x, e.y, grande ? 12 : 5, PAL.baba.slice(1, 4), 2, 2);

ENEMIGOS.reyMosquin = Object.assign({}, DEF_JEFE, {
  nombre: "EL REY MOSQUÍN", vida: 220, r: 17, vuela: true, oy: -2, rastro: "sangre",

    e.vx = (tx - e.x) / d * Math.min(v, d); e.vy = (ty - e.y) / d * Math.min(v, d);

      }
    } else if (--e.tInf <= 0) { e.est = "inflar"; e.tE = 38; e.tInf = V.ent(130, 170); }
    if (--e.tInv <= 0) {

function moscasVivas() { return J.enemigos.filter((x) => !x.muerto && (x.tipo === "mosquin" || x.tipo === "mosquinRojo")).length; }

ENEMIGOS.gusanoAnillado = Object.assign({}, DEF_JEFE, {
  nombre: "EL GUSANO ANILLADO", vida: 300, r: 10, oy: 6, rastro: "sangre",
  crear(e) {
    e.dir = ABAJO; e.tGiro = 50; e.tTiro = 120; e.hist = [];
    e.segmentos = [];
    for (let i = 0; i < 8; i++) e.segmentos.push({ x: e.x, y: e.y, r: i === 7 ? 6 : 8, dir: ABAJO, cabeza: e });
    for (let i = 0; i < 120; i++) e.hist.push([e.x, e.y]);
  },
  pensar(e) {
    const j = J.jug, v = (e.vida < e.max / 2 ? 1.5 : 1.15) * e.lento;
    if (--e.tGiro <= 0 || e.choco) {
      // gira hacia Shumio si puede (nunca se da vuelta en el lugar)
      const quiere = Math.abs(j.x - e.x) > Math.abs(j.y - e.y) ? (j.x > e.x ? DERECHA : IZQUIERDA) : (j.y > e.y ? ABAJO : ARRIBA);
      const opciones = [0, 1, 2, 3].filter((d) => d !== opuesta(e.dir) && (!e.choco || d !== e.dir));
      e.dir = opciones.includes(quiere) && A.si(0.7) ? quiere : A.uno(opciones);
      e.tGiro = V.ent(36, 80);
    }
    e.vx = DIRS[e.dir][0] * v; e.vy = DIRS[e.dir][1] * v;
    e.hist.unshift([e.x, e.y]);
    if (e.hist.length > 160) e.hist.length = 160;
    const paso = Math.round(12 / v);
    e.segmentos.forEach((s, i) => {
      const h = e.hist[Math.min(e.hist.length - 1, (i + 1) * paso)], h2 = e.hist[Math.min(e.hist.length - 1, (i + 1) * paso - 2)];
      s.x = h[0]; s.y = h[1];
      const dx = h2[0] - h[0], dy = h2[1] - h[1];
      if (Math.abs(dx) + Math.abs(dy) > 0.1) s.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DERECHA : IZQUIERDA) : (dy > 0 ? ABAJO : ARRIBA);
    });
    e.k = e.tTiro < 16 ? 1 : 0;
    if (--e.tTiro <= 0) {
      const a = Math.atan2(j.y - e.y, j.x - e.x);
      for (const d of [-0.28, 0, 0.28]) bala(e.x, e.y - 8, a + d, 2.2);
      SFX.escupe(); e.tTiro = V.ent(90, 130);
    }
  },
  spr: (e) => gusanoAnilladoSpr("cabeza", (e.dir + 2) % 4, e.k),
  dibujar(g, e) {
    const flash = (s) => (e.golpe > 0 && (e.golpe & 2) ? blanco(s) : s);
    for (let i = e.segmentos.length - 1; i >= 0; i--) {
      const s = e.segmentos[i], sp = flash(gusanoAnilladoSpr(i === e.segmentos.length - 1 ? "cola" : "cuerpo", (s.dir + 2) % 4, 0));
      g.drawImage(sombra(s.r, 3), Math.round(s.x - s.r), Math.round(s.y) - 1);
      g.drawImage(sp, Math.round(s.x - 13), Math.round(s.y + 4 - 26));
    }
    const c = flash(gusanoAnilladoSpr("cabeza", (e.dir + 2) % 4, e.k));
    g.drawImage(sombra(10, 3), Math.round(e.x - 10), Math.round(e.y) - 1);
    g.drawImage(c, Math.round(e.x - 13), Math.round(e.y + 5 - 26));
  },
});

ENEMIGOS.micelia = Object.assign({}, DEF_JEFE, {
  nombre: "MICELIA", vida: 760, r: 26, oy: 12, rastro: "espora", fijo: true,
  crear(e) { e.x0 = e.x; e.y = e.y0 = cy(2) + 4; e.fase = 1; e.tA = 70; e.tB = 200; e.tS = 0; e.ang = 0; e.k = 0; e.grito = 0; },
  pensar(e) {
    const j = J.jug, f = e.vida > e.max * 0.66 ? 1 : e.vida > e.max * 0.33 ? 2 : 3;
    e.x = e.x0 + Math.sin(e.t * 0.011) * (f === 3 ? 70 : 46);
    e.y = e.y0 + Math.sin(e.t * 0.023) * 6;
    if (f !== e.fase) {   // el grito del cambio de fase: limpia las balas y llama a su prole
      e.fase = f; e.grito = 50; SFX.jefe(); temblar(12);
      J.balas.length = 0;
      for (let i = 0; i < 2; i++) crearEnemigo(f === 2 ? "hongon" : "arana", cx(i ? 10 : 2), cy(5), { dormido: 20, sinCampeon: true });
    }
    e.k = f === 3 ? 3 : e.golpe > 3 ? 2 : 0;
    if (e.grito > 0) { e.grito--; e.k = 1; return; }
    const boca = (n) => { e.tBoca = n; };
    if (e.tBoca > 0) { e.tBoca--; if (f < 3) e.k = 1; }
    const bx = e.x, by = e.y - 30;
    if (f === 1) {
      if (--e.tA <= 0) { anilloBalas(bx, by, 12, 1.7, (e.alterna = !e.alterna) ? 0 : TAU / 24, { color: "violeta", r: 3, z: 20 }); SFX.escupe(); boca(20); e.tA = 80; }
      if (--e.tB <= 0) { if (J.enemigos.length < 5) for (let i = 0; i < 2; i++) crearEnemigo("hongon", cx(i ? 10 : 2), cy(5), { dormido: 20, sinCampeon: true }); e.tB = 280; }
    } else if (f === 2) {
      e.tS++;

      else if (e.tS % 170 === 130) { const a = Math.atan2(j.y - by, j.x - bx); for (let i = -2; i <= 2; i++) bala(bx, by, a + i * 0.2, 2.3, { color: "violeta", r: 3, z: 20 }); SFX.escupe(); boca(20); }
      if (--e.tB <= 0) { if (J.enemigos.length < 5) for (let i = 0; i < 2; i++) crearEnemigo("mosquinRojo", bx + (i ? 30 : -30), by, { dormido: 12, sinCampeon: true }); e.tB = 320; }
    } else {

      if (--e.tA <= 0) { anilloBalas(bx, by, 16, 1.5, A.f() * TAU, { color: "sangre", r: 4, z: 20 }); SFX.escupe(); temblar(4); e.tA = 150; }
      if (--e.tB <= 0) { if (J.enemigos.length < 5) for (let i = 0; i < 2; i++) crearEnemigo("saltarin", cx(i ? 10 : 2), cy(5), { dormido: 20, sinCampeon: true }); e.tB = 300; }
    }
  },
  spr: (e) => miceliaSpr(e.k),
});

// ── las tandas: sin repetirse en la partida; la calidad alta sale menos ──
const PESO_CALIDAD = [1, 1, 1, 0.65, 0.3];
function armarTandas() {
  J.tandas = {};
  for (const [id, o] of Object.entries(OBJETOS)) for (const p of o.pools) (J.tandas[p] ||= []).push(id);
  J.tandas.cofre = [...new Set([...(J.tandas.cofre || []), ...J.tandas.tesoro.filter((id) => OBJETOS[id].calidad <= 2)])];
  J.tandas.rojo = [...new Set([...(J.tandas.rojo || []), ...J.tandas.pacto])];
  J.tandas.secreta = [...new Set([...(J.tandas.secreta || []), ...Object.keys(OBJETOS).filter((id) => OBJETOS[id].calidad >= 2 && !OBJETOS[id].pools.includes("pacto"))])];
  J.tomados = new Set();
}
function sacarObjeto(pool) {
  const libre = (id) => !J.tomados.has(id) && !J.enPedestal.has(id);
  let lista = (J.tandas[pool] || []).filter(libre);
  if (!lista.length) lista = Object.keys(OBJETOS).filter(libre);
  const id = lista.length ? A.pesos(lista.map((x) => [x, PESO_CALIDAD[OBJETOS[x].calidad] ?? 1])) : "caparazon";
  J.enPedestal.add(id);
  return id;
}
function sacarBaratija() {
  const ids = Object.keys(BARATIJAS).filter((id) => id !== (J.jug && J.jug.baratija) && !(J.baratijasVistas || new Set()).has(id));
  const id = ids.length ? A.uno(ids) : A.uno(Object.keys(BARATIJAS));
  (J.baratijasVistas ||= new Set()).add(id);
  return id;
}
function revelarMapa() { if (!J.piso) return; for (const s of J.piso.salas.values()) if (s.tipo !== "secreta") s.vista = true; }

function tomarObjeto(c) {
  const j = J.jug;
  if (!c.id || c.tocando) return false;
  c.tocando = true;
  const def = OBJETOS[c.id];
  if (c.pacto) {
    // el pacto: 1 o 2 contenedores; si no tenés, 3 corazones de espora (como en el original)
    const costo = c.pacto * 2;
    if (j.cont >= costo && vidaTotal(j) - costo > 0) sumarContenedor(j, -c.pacto);
    else if (j.cont === 0 && j.esporas > 6) j.esporas -= 6;
    else return false;
    SFX.pacto();
  } else if (c.precio) {
    if (j.monedas < c.precio) return false;
    j.monedas -= c.precio; SFX.moneda();
  }
  const id = c.id;
  J.tomados.add(id);
  const antes = fotoCuentas(j);
  if (def.activo) {
    if (j.activo) { c.id = j.activo.id; c.tocando = true; c.precio = 0; c.pacto = 0; } else c.id = null;
    j.activo = { id, carga: def.activo, max: def.activo };
  } else {
    c.id = null;
    j.objetos.push(id);
    if (def.alTomar) def.alTomar(j);
  }
  j.vistos.add(id);
  recalcular(j);
  revisarTransformaciones(j);
  recalcular(j);
  anotarCambios(antes);
  if (def.fam || j.f.cuchilloAtras || j.f.aranaFam) armarFamiliares();
  rotulo(def.nombre, def.lema);
  SFX.objeto();
  levantar(j, iconoSpr(id));
  // en la tienda y en el pacto, lo comprado se va con pedestal y todo
  return (c.precio || c.pacto) && !c.id ? true : false;
}

function rehacerPedestales() {
  let alguno = false;
  for (const c of J.sala.cosas) if (c.t === "objeto" && c.id) {
    J.enPedestal.delete(c.id);
    c.id = sacarObjeto(J.sala.tipo === "tienda" ? "tienda" : J.sala.tipo === "pacto" ? "pacto" : J.sala.tipo === "jefe" ? "jefe" : "tesoro");

}

// lo que cambió en las cuentas (el HUD lo muestra en verde o rojo al lado, como el original)
function fotoCuentas(j) { return { vel: velDe(j), lag: lagrimasPorSeg(j), dano: danoDe(j), alc: j.alcance, tiro: j.velLag, suerte: j.suerte }; }

function usarActivo(j) {

// ══════════ 16b-recoger.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LO QUE SE RECOGE: corazones rojos y de espora, monedas de 1 y de 5, bombas, llaves, cápsulas
// (el efecto de cada color se sortea por partida), baratijas, los pedestales y los cofres del
// original con sus tablas (wiki, Repentance): el común (78 % premios, 10 % baratija, 10 %
// cápsula…), el dorado (con llave, 20 % objeto), el de piedra (se abre con una explosión y da lo
// del dorado), el de pinchos (lastima medio corazón al abrirlo) y el rojo (del pacto: un objeto
// del diablo, arañas, bombas trampa, moscas azules, corazones de espora o cápsulas).
// ─────────────────────────────────────────────────────────────────────────────

// ── los recogibles ──
function recogible(t, x, y, sub) {
  // la tabla de la wiki (Repentance): rojo 40 %, medio 40 %, espora 6,7 %, negro 0,5 %
  if (t === "corazon" && !sub) sub = A.pesos([["rojo", 40], ["medio", 40], ["espora", 6.73], ["negro", 0.5]]);
  if (t === "moneda" && !sub) sub = A.si(0.1) ? 5 : 1;
  if (t === "capsula" && sub == null) sub = A.ent(0, COLORES_CAPSULA.length - 1);
  if (t === "cofre" && !sub) { const n = J.piso ? J.piso.n : 1; sub = A.pesos([["normal", 62], ["dorado", n >= 2 ? 22 : 14], ["piedra", 7], ["pinchos", 7], ["rojo", n >= 2 ? 5 : 2]]); }
  if (t === "baratija" && !sub) sub = sacarBaratija();
  return { t, sub, x, y, vx: 0, vy: 0, z: 0, vz: 0, r: 5, k: V.ent(0, 40) };
}
function pedestal(x, y, id) { return { t: "objeto", id, x, y, vx: 0, vy: 0, z: 0, vz: 0, r: 8, quieto: true, k: V.ent(0, 90) }; }

/** Tira algo al piso con un saltito. tipo: null (al azar), "espora" (corazón de espora), o un tipo. */
function soltarPremio(x, y, tipo) {
  let sub;
  if (tipo === "espora") { tipo = "corazon"; sub = "espora"; }
  if (!tipo) tipo = A.pesos([["moneda", 45], ["corazon", 25], ["bomba", 12], ["llave", 12], ["capsula", 6], ["baratija", 1]]);
  const c = recogible(tipo, x, y, sub);
  const a = V.f() * TAU; c.vx = Math.cos(a) * 1.4; c.vy = Math.sin(a) * 1.1; c.vz = 2.4; c.z = 2;
  J.sala.cosas.push(c);
  return c;
}

/** El premio de limpiar una sala (como en el original: la suerte ayuda). */
function premioSala() {
  const j = J.jug, n = A.f() + j.suerte * 0.03 + (j.f.dedoSuerte ? 0.1 : 0);
  if (j.f.tenedor && A.si(0.1 + j.suerte * 0.02)) { curar(j, 1); SFX.corazon(); }
  if (J.familiares.some((m) => m.tipo === "bolsa") && (J.salasLimpias = (J.salasLimpias || 0) + 1) % 2 === 0) { const m = J.familiares.find((q) => q.tipo === "bolsa"); soltarPremio(m.x, m.y, "moneda"); }
  if (n < 0.36) return;
  const tipo = A.pesos([["moneda", 30], ["corazon", 18], ["llave", 14], ["bomba", 14], ["cofre", j.f.colaGato ? 16 : 8], ["capsula", 8], ["baratija", 2]]);
  const [x, y] = lugarLibreCerca(cx(6), cy(3));
  const c = recogible(tipo, x, y);
  c.vz = 2; J.sala.cosas.push(c);
  if (tipo === "moneda" && A.si(0.25)) soltarPremio(x, y, "moneda");
}

function actualizarCosas() {
  const j = J.jug, C = J.sala.cosas;
  for (let i = C.length - 1; i >= 0; i--) {
    const c = C[i];
    c.k++;
    if (!c.quieto) {
      c.z += c.vz; c.vz -= 0.25;
      if (c.z <= 0) { c.z = 0; c.vz = Math.abs(c.vz) > 0.8 ? -c.vz * 0.35 : 0; }
      if (j.iman && !c.precio && ["moneda", "corazon", "bomba", "llave"].includes(c.t)) { const d = dist(j.x, j.y, c.x, c.y) || 1; if (d < 90) { c.vx += (j.x - c.x) / d * 0.18; c.vy += (j.y - c.y) / d * 0.18; } }
      c.vx *= 0.9; c.vy *= 0.9;
      moverEnSala(J.sala, c, c.vx, c.vy, false);
    }
    if (c.t === "trampilla") { if (!c.abierta && dist(j.x, j.y, c.x, c.y) > 20) c.abierta = true; if (c.abierta && dist(j.x, j.y, c.x, c.y) < 8 && !j.muerto && J.estado === "juego") bajarPiso(); continue; }
    if (j.muerto || c.z > 6) continue;
    const alcance = RADIO_SOLIDO[c.t] ? RADIO_SOLIDO[c.t] + j.r + 1.5 : 9;
    if (c.espera > 0) { c.espera--; continue; }       // lo que recién saltó de un cofre no se agarra al toque
    if (dist(j.x, j.y, c.x, c.y) > alcance) { c.tocando = false; c.avisado = false; continue; }
    if (tomar(c)) { brilloRecoger(c); C.splice(i, 1); }
    else if (EMPUJABLES.has(c.t) && !c.precio) empujarCosa(c, j);
  }
}
/** Lo que no se puede agarrar (corazón con la vida llena, llave o moneda al tope…) no se atraviesa:
 *  Shumio lo empuja al caminar contra eso, como en el original. */
const EMPUJABLES = new Set(["corazon", "moneda", "bomba", "llave", "capsula", "baratija"]);
function empujarCosa(c, j) {
  const dx = c.x - j.x, dy = c.y - j.y, d = Math.hypot(dx, dy) || 0.01, m = j.r + 5;
  if (d >= m) return;
  const nx = dx / d, ny = dy / d, falta = m - d;
  // se lleva casi toda la velocidad de Shumio en esa dirección, y rueda un poco
  const v = Math.max(0.6, (j.vx * nx + j.vy * ny) * 1.1);
  c.vx = nx * v; c.vy = ny * v;
  const antes = [c.x, c.y];
  moverEnSala(J.sala, c, nx * falta, ny * falta, false);
  const movido = Math.hypot(c.x - antes[0], c.y - antes[1]), resto = Math.max(0, falta - movido);
  j.x -= nx * resto; j.y -= ny * resto;   // contra la pared ya no se corre: frena a Shumio
}
/** El brillito de lo que se agarra (monedas, llaves, corazones, bombas). */
function brilloRecoger(c) {
  if (c.t === "objeto" || c.t === "trampilla") return;
  const col = c.t === "moneda" ? PAL.oro[4] : c.t === "corazon" ? (c.sub === "negro" ? "#cecece" : c.sub && c.sub.startsWith("espora") ? PAL.azul[4] : PAL.sangre[4]) : c.t === "llave" ? PAL.hueso[4] : "#ffffff";
  J.fx.push({ anim: [0, 1, 2, 3, 4].map((k) => brilloSpr(k, col)), x: c.x, y: c.y - 6 - c.z, t: 0, cada: 3, centro: true });
}
function brilloSpr(k, col) {
  return hornear(`brillo${k}${col}`, () => {
    const p = new Pix(15, 15), r = 2 + k * 1.4;
    for (let a = 0; a < 4; a++) { const an = a * Math.PI / 2 + k * 0.2; for (let d = r - 2; d <= r; d++) p.p(7 + Math.cos(an) * d, 7 + Math.sin(an) * d, k < 3 ? col : mezclar(col, "#000000", 0.4)); }
    if (k < 2) p.bola(7, 7, 1.6 - k * 0.5, 1.6 - k * 0.5, [col, "#ffffff"], {});
    return p.canvas();
  });
}

/** Shumio toca algo: ¿se lo lleva? (devuelve true si desaparece del piso) */
function tomar(c) {
  const j = J.jug;
  if (c.precio && c.t !== "objeto") {
    if (j.monedas < c.precio || !puedeUsar(c)) return false;
    j.monedas -= c.precio; SFX.moneda();
  }
  switch (c.t) {
    case "corazon": {
      if (c.sub === "negro") { if (!darNegras(j, 2)) return false; }
      else if (c.sub === "espora" || c.sub === "esporaMedio") { if (!darEsporas(j, c.sub === "espora" ? 2 : 1)) return false; }
      else if (!curar(j, c.sub === "rojo" ? 2 : 1)) return false;
      SFX.corazon(); return true;
    }
    // al tope (99) ya no se agarran: se empujan
    case "moneda": if (j.monedas >= 99) return false; j.monedas = Math.min(99, j.monedas + (c.sub | 0)); SFX.moneda(); return true;
    case "bomba": if (j.bombas >= 99) return false; j.bombas++; SFX.recoger(); return true;
    case "llave": if (j.llaves >= 99) return false; j.llaves++; SFX.llave(); return true;
    case "capsula": {
      if (j.capsula != null) { const v = recogible("capsula", j.x, j.y + 10, j.capsula); v.vz = 2; v.vy = 1; J.sala.cosas.push(v); }
      j.capsula = c.sub; SFX.recoger(); return true;   // el nombre queda abajo a la derecha, como la píldora del original
    }
    case "cofre": {
      if (c.abierto) return false;
      if (c.sub === "piedra") { if (!c.avisado) { SFX.roca(); c.sacudida = 6; c.avisado = true; } return false; }   // sólo con una explosión
      if (c.sub === "dorado" && j.llaves <= 0 && !j.f.clip) {   // trabado: suena el candado y tiembla (una vez por toque)

// LOS FAMILIARES, como en el original: los que orbitan (tapan balas y pegan al tocar), los que
// siguen en fila detrás de Shumio y lloran hacia donde llora él (el íncubo copia su arma), los
// que se lanzan (el gordito, el cerebro), los que cazan (la sanguijuela, el pájaro, la araña) y
// las moscas y arañitas azules que se tiran solas contra el enemigo más cercano.
// Números de la wiki (Repentance): hermanito 1,88 lágr./s de 3,5; hermanita 1,36/s de 6; bebé
// demonio 3/s de 3,5; ángel guardián 7 por golpe; admiradora 5; gordito 3,5 por golpe.

/** Una mosca (o arañita) azul: busca al enemigo más cercano, le pega y se muere. */

const ORBITALES = { mosca: { r: 20, v: 0.055, dano: 2.5, cada: 8 }, admiradora: { r: 30, v: 0.04, dano: 5, cada: 4 }, angel: { r: 22, v: 0.09, dano: 7, cada: 8 }, corona: { r: 16, v: 0.07, dano: 0, cada: 99 }, pelos: { r: 25, v: 0.05, dano: 5, cada: 8 } };

function armarFamiliares() {
  const j = J.jug, viejos = J.familiares.filter((f) => f.tipo === "moscaAzul" || f.tipo === "pajaro");
  J.familiares = viejos;
  const lista = [];
  for (const id of j.objetos) { const d = OBJETOS[id]; if (d && d.fam) lista.push(d.fam); }
  if (j.f.cuchilloAtras) lista.push("cuchilloAtras");
  if (j.f.aranaFam) lista.push("aranaFam");
  let orb = 0, fila = 0;
  for (const tipo of lista) {
    const f = { tipo, x: j.x, y: j.y, t: 0, enfriar: 0, mirar: ABAJO };
    if (ORBITALES[tipo]) { f.orbital = true; f.k = orb++; f.bloquea = true; if (tipo === "corona") { J.familiares.push(f); f.k = orb++; J.familiares.push({ ...f, k: orb - 1 }); continue; } }
    else f.fila = fila++;
    J.familiares.push(f);
  }
  const n = J.familiares.filter((f) => f.orbital).length;
  for (const f of J.familiares) if (f.orbital) f.n = n;

/** El rastro de Shumio: los que lo siguen van en fila por donde él pasó. */
function rastroEn(k) { const R = J.rastro || []; return R[Math.min(R.length - 1, k)] || [J.jug.x, J.jug.y]; }

function actualizarFamiliares() {
  const j = J.jug, tira = !!(IN.dx || IN.dy) && J.congelado <= 0 && !j.muerto;
  J.rastro ||= [];

      if (o.dano && f.t % o.cada === 0) for (const e of J.enemigos) if (blanco_(e) && dist(e.x, e.y - 4, f.x, f.y) < e.r + 5) danarEnemigo(e, o.dano);
      continue;

        const [tx, ty] = rastroEn(10); f.x += (tx - f.x) * 0.3; f.y += (ty - 6 - f.y) * 0.3;
        if (f.t % 3 === 0) for (const e of J.enemigos) if (blanco_(e) && dist(e.x, e.y - 4, f.x, f.y) < e.r + 5) danarEnemigo(e, danoDe(j) * 2);

      }
      case "pajaro": {

const dos = (n) => String(Math.max(0, Math.min(99, n | 0))).padStart(2, "0");

/** Un aro de píxeles (la base de los joysticks y los botones). */
function aro(r, relleno, borde) {
  return hornear(`aro${r}${relleno}${borde}`, () => {
    const s = r * 2 + 3, p = new Pix(s, s), c = s / 2;
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
      const d = Math.hypot(x + 0.5 - c, y + 0.5 - c);
      if (d <= r + 0.5 && d > r - 1) p.p(x, y, borde); else if (d <= r - 1 && relleno) p.p(x, y, relleno);
    }
    return p.canvas();
  });
}

  if (c1 < 0) return;
  const w = (c1 - c0 + 1) * cw + 1, h = (f1 - f0 + 1) * ch + 1, x0 = W - w - 6, y0 = 24;
  g.drawImage(marcoMapaSpr(w + 8, h + 8), x0 - 4, y0 - 4);

    const x = x0 + (s.c - c0) * cw, y = y0 + (s.f - f0) * ch, actual = s === J.sala || (J.sala.tipo === "pacto" && s === J.piso.jefe);
    g.drawImage(celdaMapaSpr(actual ? 2 : s.visitada ? 1 : 0), x, y);

    if (ic && (s.visitada || s.tipo !== "secreta")) g.drawImage(iconoHud(ic), x, y - 1);

}

// ── los rótulos: el nombre del objeto (y su lema) o del piso, que entra, se queda y se va ──
function rotulo(titulo, sub, maldicion = null) {
  J.rotulos = J.rotulos.filter((r) => r.titulo !== titulo);
  J.rotulos.push({ titulo, sub, maldicion, t: 0 });
  if (J.rotulos.length > 2) J.rotulos.shift();

// Los tiempos del rótulo, medidos en el video (a 30 fps; acá, al doble): la franja crece desde la
// izquierda en 6 cuadros; el texto entra volando, se pasa 11 px y vuelve en otros 6; queda quieto
// 1,76 s; toma envión 19 px a la izquierda en 8 cuadros y sale disparado a la derecha en 3; la
// franja se encoge hacia la derecha.
const ROT = { crece: 6, llega: 8, asienta: 14, quieto: 120, envion: 128, fuga: 131, fin: 140 };
function posRotulo(t, W) {
  const ease = (u) => 1 - Math.pow(1 - lim(u, 0, 1), 3);
  if (t < 3) return -W;
  if (t < ROT.llega) return lerp(-W * 0.55, 11, ease((t - 3) / (ROT.llega - 3)));
  if (t < ROT.asienta) return lerp(11, 0, ease((t - ROT.llega) / (ROT.asienta - ROT.llega)));
  if (t < ROT.quieto) return 0;
  if (t < ROT.envion) { const u = (t - ROT.quieto) / (ROT.envion - ROT.quieto); return -19 * (u * u * (3 - 2 * u)); }
  if (t < ROT.fuga) return lerp(-19, W, Math.pow((t - ROT.envion) / (ROT.fuga - ROT.envion), 2));
  return W;
}
function dibujarRotulos(g) {
  const W = PANT.W;

  const r = J.rotulos[J.rotulos.length - 1];
  if (!r) return;

  const bw = Math.round(Math.min(W - 100, Math.max(s1.width + 120, 330))), banda = bandaSpr(bw), m = 8;   // 83 % en el original
  const y = PANT.salaY + 22, bx = Math.round(W / 2 - bw / 2);
  // la franja: crece desde la izquierda y, al irse, se come desde la izquierda hacia la derecha
  const u0 = t >= ROT.envion + 2 ? lim((t - ROT.envion - 2) / (ROT.fin - ROT.envion - 2), 0, 1) : 0;
  const u1 = lim(t / ROT.crece, 0, 1);
  const x0 = Math.round(banda.width * u0 * u0), x1 = Math.round(banda.width * (1 - Math.pow(1 - u1, 2)));
  if (x1 > x0) g.drawImage(banda, x0, 0, x1 - x0, banda.height, bx - m + x0, y - m, x1 - x0, banda.height);
  const dx = Math.round(posRotulo(t, W));
  // el texto va en la parte de abajo de la franja (medido: 15 px arriba, 6 abajo)
  // medido: el título casi centrado en la mancha (8 px arriba, 5–7 abajo; acá 7 y 4), el subtítulo
  // 7 px más abajo que el título (acá 6–7) y la etiqueta de la maldición 11 px más abajo (acá 10)
  g.drawImage(s1, Math.round(W / 2 - s1.width / 2) + dx, y + 2);
  if (s2) g.drawImage(s2, Math.round(W / 2 - s2.width / 2) + dx, y + 21);
  if (per) g.drawImage(per, Math.round(W / 2 - per.width / 2) + dx, y + 24);
}

    if (s) { g.globalAlpha = b.id === "bomba" && !j.bombas ? 0.35 : b.id === "activo" && j.activo.carga < j.activo.max ? 0.55 : 0.95; g.drawImage(s, Math.round(b.x - s.width / 2), Math.round(b.y - s.height / 2) + (ap ? 1 : 0)); g.globalAlpha = 1; }
    if (n != null) g.drawImage(cifrasSpr(dos(n)), b.x + 3, b.y + 5);

  for (const [st, col] of [[STICKS.mover, "rgba(220,210,190,0.35)"], [STICKS.tirar, "rgba(160,230,215,0.4)"]]) {

    g.drawImage(aro(RADIO_STICK, "rgba(8,6,10,0.25)", col), Math.round(st.x0 - RADIO_STICK - 1), Math.round(st.y0 - RADIO_STICK - 1));

  };

function iniciarPiso(n) {
  J.jefeTipo = elegirJefe(n, J.jefesVistos); J.jefesVistos.push(J.jefeTipo);
  J.piso = generarPiso(n);

function entrarSala(sala, desde) {
  const j = J.jug;
  J.sala = sala;
  for (const k of ["lagrimas", "balas", "bombas", "fx", "part", "babas", "enemigos", "jefes", "laseres", "anillos", "misiles", "chispas", "luces", "pegadas"]) J[k].length = 0;
  J.campo = null; J.cambioGrilla = true; J.jefeMuerto = false; J.ludo = null; J.cuchillo = null; J.mira = null; J.rastro = [];
  j.danoSala = 0; j.salaF.length = 0; j.cargando = false; j.carga = 0; recalcular(j);
  J.familiares = J.familiares.filter((f) => f.tipo !== "pajaro");   // el pájaro muerto dura una sala
  sala.visitada = sala.vista = true;
  for (const p of sala.puertas) if (p && puertaVisible(p) && p.destino.tipo !== "secreta") p.destino.vista = true;
  if (!sala.fondo) sala.fondo = hornearFondo(J.piso.cap, sala.semilla);
  if (desde == null) { j.x = cx(6); j.y = cy(3) + 6; }
  else {
    const d = opuesta(desde), mY = IY0 + FILAS * T / 2;
    [j.x, j.y] = [[SALA_W / 2, IY0 + 9], [IX1 - 9, mY], [SALA_W / 2, IY1 - 7], [IX0 + 9, mY]][d];
    j.vx *= 0.3; j.vy *= 0.3;
  }
  armarFamiliares();
  for (const f of J.familiares) { f.x = j.x; f.y = j.y; }
  if (!sala.limpia) {
    poblarSala(sala);
    if (j.f.garrapata) for (const e of J.enemigos) if (e.jefe) { e.vida *= 0.85; e.max *= 0.85; }   // la garrapata: −15 % a los jefes
    J.puertasAbiertas = false; SFX.puertaCierra();
    if (sala.tipo === "jefe") { J.vsPendiente = true; Musica.poner("jefe"); }
  } else J.puertasAbiertas = true;
  J.cierre = J.puertasAbiertas ? 0 : 1;
  if (sala.tipo === "pacto") Musica.poner("pacto");
  else if (sala.tipo === "tienda" || sala.tipo === "secreta") Musica.poner(sala.tipo);
  else if (sala.tipo === "jefe" && sala.limpia) Musica.poner("calma");
  else if (sala.tipo !== "jefe" || sala.limpia) Musica.poner(PISOS[J.piso.n].musica);
}

// ── el paso de la lógica (60 veces por segundo) ──
function pasoJuego() {
  J.t++;
  if (J.fundido > 0) J.fundido--;
  if (J.temblor > 0) J.temblor *= 0.86, J.temblor < 0.4 && (J.temblor = 0);
  if (J.destello > 0) J.destello--;
  if (J.estado === "transicion") { if (++J.trans.t >= J.trans.dur) { J.trans = null; J.estado = "juego"; if (J.vsPendiente) empezarVs(); } return; }
  if (J.estado === "vs") { J.vs.t++; if (J.vs.t > 150 || (J.vs.t > 30 && (recien("toque") || recien("aceptar")))) J.estado = "juego"; return; }
  if (J.estado === "cayendo") { if (++J.tEstado > CAIDA.sale + CAIDA.negro) { J.jug.x = cx(6); J.jug.y = cy(3); iniciarPiso(J.piso.n + 1); J.armando = CAIDA.entra; for (const r of J.rotulos) r.t = -CAIDA.entra + 4; /* el nombre sale cuando la imagen ya se armó */ } return; }
  if (J.estado === "ganando") { if (++J.tEstado > 90) { J.estado = "victoria"; J.tEstado = 0; abrirMenu("victoria"); } return; }
  if (J.estado !== "juego") return;
  J.tiempo++;
  const j = J.jug;
  if (recien("pausa")) { abrirMenu("pausa"); return; }
  if (J.congelado > 0) J.congelado--;
  if (!j.muerto) {
    if (recien("bomba")) tirarBomba(j);
    if (recien("activo")) usarActivo(j);
    if (recien("capsula")) tomarCapsula(j);
  }
  actualizarJugador(j);
  actualizarFamiliares();
  actualizarEnemigos();
  actualizarLagrimas();
  actualizarLaseres();
  actualizarAnillos();
  actualizarMisiles();
  actualizarPegadas();
  actualizarBalas();
  actualizarBombas();
  actualizarCosas();
  actualizarBabas();
  actualizarParticulas();
  actualizarFx();
  const pend = J.pendientes; J.pendientes = [];
  for (const f of pend) f();
  // las puertas: animación y llaves
  const meta = J.puertasAbiertas ? 0 : 4;
  J.cierre += lim(meta - J.cierre, -0.34, 0.34);
  for (let d = 0; d < 4; d++) {
    const p = J.sala.puertas[d];
    if (p && p.llave && puertaVisible(p) && dist(j.x, j.y, PUERTA[d].x, PUERTA[d].y) < 20 && j.llaves > 0 && J.puertasAbiertas) {
      j.llaves--; p.llave = false; if (p.par) p.par.llave = false; SFX.llave(); SFX.puertaAbre();
    }
  }
  // ¿limpió la sala?
  if (!J.sala.limpia && J.enemigos.length === 0) salaLimpia();
  // la capa pesada de la música: con muchos enemigos (o un jefe) en la sala, como en el original
  if (J.t % 20 === 0) { const vivos = J.enemigos.filter((e) => !e.muerto && !e.oculto).length, fuerte = vivos >= 4 || J.enemigos.some((e) => e.jefe && !e.muerto) ? 1 : 0; if (fuerte !== Musica.intensidad) Musica.pesar(fuerte); }
  if (J.jefeMuerto && J.jefes.every((e) => e.muerto) && !J.sala.premiada) jefeDerrotado();
  // ¿sale por una puerta?
  if (!j.muerto) {
    let d = -1;
    if (j.y < IY0 - 5) d = ARRIBA; else if (j.y > IY1 + 5) d = ABAJO; else if (j.x < IX0 - 5) d = IZQUIERDA; else if (j.x > IX1 + 5) d = DERECHA;
    if (d >= 0) pasarPuerta(d);
  }
  if (j.muerto && j.tMuerte > 80 && J.estado === "juego") { J.estado = "muerte"; J.tEstado = 0; registro.muertes++; guardarRegistro(); abrirMenu("muerte"); }
}

function salaLimpia() {
  const s = J.sala;
  s.limpia = true;
  J.puertasAbiertas = true; SFX.puertaAbre();
  cargarActivo(1);
  if (s.tipo === "normal") premioSala();
}

function jefeDerrotado() {
  const s = J.sala, n = J.piso.n;
  s.premiada = true;
  J.sala.limpia = true; J.puertasAbiertas = true;
  registro.jefes = (registro.jefes || 0) + 1; guardarRegistro();
  cargarActivo(1);

    const c = recogible("cofreFinal", cx(6), cy(4)); c.quieto = true; s.cosas.push(c);
    rotulo("¡MICELIA CAYÓ!", "Abrí el cofre");
    return;
  }
  s.cosas.push(pedestal(cx(6), cy(4) + 4, sacarObjeto("jefe")));
  for (let i = 0; i < A.ent(1, 2); i++) soltarPremio(cx(6) + V.ent(-20, 20), cy(3), "corazon");
  const tr = recogible("trampilla", cx(6), cy(1)); tr.quieto = true; s.cosas.push(tr);
  // la puerta del pacto: más probable si no te tocaron en la pelea
  if (A.si(probPacto())) {
    const libres = [0, 1, 2, 3].filter((d) => !s.puertas[d]);
    if (libres.length) { crearSalaPacto(J.piso, s, A.uno(libres)); J.pendientes.push(() => SFX.pacto()); }
  }

}

function pasarPuerta(d) {
  const p = J.sala.puertas[d];
  if (!p) return;
  // una foto de la sala que se va (para el deslizamiento)
  gViejo.drawImage(cvSala, 0, 0);
  J.trans = { dir: d, t: 0, dur: 8 };   // medido en el video: ~4 cuadros a 30 fps
  J.estado = "transicion";
  const j = J.jug;
  entrarSala(p.destino, d);
  j.inv = Math.max(j.inv, 0);
  J.congelado = 8;
}

function empezarVs() { J.vsPendiente = false; J.estado = "vs"; J.vs = { t: 0, tipo: J.jefeTipo }; SFX.jefe(); }

function bajarPiso() {
  if (J.piso.n >= ULTIMO_PISO) return;
  J.estado = "cayendo"; J.tEstado = 0; SFX.pozo();
  registro.mejorPiso = Math.max(registro.mejorPiso || 1, J.piso.n + 1); guardarRegistro();
}
function ganar() {
  J.estado = "ganando"; J.tEstado = 0; SFX.objeto(); SFX.secreto();
  registro.victorias++; guardarRegistro();
}

// ── el dibujo ──
const _orden = [];
function dibujarSala(g) {
  const s = J.sala;
  g.drawImage(s.fondo, 0, 0);
  if (s.decal) g.drawImage(s.decal, 0, 0);
  dibujarTutorial(g);
  // lo que está a ras del piso
  for (let f = 0; f < FILAS; f++) for (let c = 0; c < COLS; c++) {
    const o = s.celdas[f * COLS + c];
    if (!o) continue;
    const x = IX0 + c * T, y = IY0 + f * T;
    if (o.t === "pozo") { const es = (C, F) => { const q = celda(s, C, F); return !!q && q.t === "pozo"; }; g.drawImage(pozoSpr(es(c, f - 1), es(c - 1, f), es(c + 1, f), es(c, f + 1)), x, y); }
    else if (o.t === "pinchos") g.drawImage(pinchosSpr(true), x, y);
  }
  dibujarBabas(g);
  for (const c of s.cosas) if (c.t === "trampilla") dibujarCosa(g, c);
  // las puertas
  for (let d = 0; d < 4; d++) {
    const p = s.puertas[d];
    if (!p || !puertaVisible(p)) continue;
    const tipo = p.secreta ? "secreta" : p.tipo, est = p.llave ? 5 : Math.round(J.cierre);
    const [x, y] = lugarPuerta(d);
    g.drawImage(puertaRotada(tipo, tipo === "secreta" ? 0 : est, d), Math.round(x), Math.round(y));
  }
  // todo lo que está parado, ordenado por su pie
  _orden.length = 0;
  for (let f = 0; f < FILAS; f++) for (let c = 0; c < COLS; c++) {
    const o = s.celdas[f * COLS + c];
    if (o && o.t !== "pozo" && o.t !== "pinchos" && !(o.t === "matas" && o.vida <= 0)) _orden.push([cy(f) + T / 2 - 2, 0, o, c, f]);
  }
  for (const c of s.cosas) if (c.t !== "trampilla") _orden.push([c.y, 1, c]);
  for (const e of J.enemigos) _orden.push([e.y + (e.jefe && e.z > 40 ? 999 : 0), 2, e]);
  for (const f of J.familiares) _orden.push([f.y, 3, f]);
  for (const b of J.bombas) _orden.push([b.y, 4, b]);
  _orden.push([J.jug.y, 5, J.jug]);
  if (J.cuchillo) _orden.push([J.cuchillo.y + 6, 8, J.cuchillo]);
  for (const l of J.lagrimas) _orden.push([l.y, 6, l]);
  for (const b of J.balas) _orden.push([b.y, 7, b]);
  _orden.sort((a, b) => a[0] - b[0]);
  for (const it of _orden) {
    const o = it[2];
    switch (it[1]) {
      case 0: dibujarObstaculo(g, o, it[3], it[4]); break;
      case 1: dibujarCosa(g, o); break;
      case 2: if (o.def.dibujar) o.def.dibujar(g, o); else dibujarEnemigo(g, o); break;
      case 3: dibujarFamiliar(g, o); break;
      case 4: dibujarBomba(g, o); break;
      case 5: if (J.estado !== "cayendo") dibujarJugador(g, o); break;
      case 6: dibujarLagrima(g, o); break;
      case 7: dibujarBala(g, o); break;
      case 8: dibujarCuchillo(g); break;
    }
  }
  dibujarArmas(g);
  dibujarCarga(g, J.jug);
  dibujarFx(g);
  dibujarParticulas(g);
  if (J.estado === "cayendo") {
    const u = Math.min(1, J.tEstado / 30), sp = spritesShumio(), j = J.jug;
    const e = 1 - u;
    if (e > 0.05) { g.save(); g.translate(Math.round(j.x), Math.round(j.y)); g.scale(e, e); g.drawImage(sp.cue.frente[0], -7, -8); g.drawImage(sp.cab.frente[3], -11, -24); g.restore(); }

  }
  g.drawImage(vineta(), -20, -20);
  if (J.maldicion === "oscuridad") { const o = oscuridadSpr(); g.drawImage(o, Math.round(J.jug.x - o.width / 2), Math.round(J.jug.y - 8 - o.height / 2)); }
}
function dibujarObstaculo(g, o, c, f) {
  const x = cx(c), yb = cy(f) + T / 2 + 1;
  let s;
  switch (o.t) {
    case "roca": s = rocaSpr(o.v, o.marcada); break;
    case "matas": s = matasSpr(o.vida, o.dorada ? 1 : 0); break;
    case "brasero": s = braseroSpr((J.t >> 3) & 3, o.prendido); break;
    case "barril": s = barrilSpr(); break;
    case "bloque": s = bloquePiedraSpr(); break;
    default: return;
  }
  g.drawImage(s, Math.round(x - s.width / 2), yb - s.height);
}

function dibujarJuego(g) {
  const W = PANT.W, H = PANT.H;
  g.fillStyle = "#07060a"; g.fillRect(0, 0, W, H);
  dibujarSala(gSala);
  let ox = PANT.salaX, oy = PANT.salaY;
  if (J.temblor > 0) { ox += Math.round((V.f() - 0.5) * J.temblor); oy += Math.round((V.f() - 0.5) * J.temblor); }
  if (J.trans) {
    const u = J.trans.t / J.trans.dur, e = u * u * (3 - 2 * u), [dx, dy] = DIRS[J.trans.dir];
    const sx = Math.round(-dx * SALA_W * e), sy = Math.round(-dy * SALA_H * e);
    g.drawImage(cvViejo, ox + sx, oy + sy);
    g.drawImage(cvSala, ox + sx + dx * SALA_W, oy + sy + dy * SALA_H);
    // en el medio del deslizamiento, todo se oscurece un poco (como en el original)
    g.fillStyle = `rgba(0,0,0,${(Math.sin(u * Math.PI) * 0.38).toFixed(3)})`; g.fillRect(0, 0, W, H);
  } else g.drawImage(cvSala, ox, oy);
  if (J.destello > 0) { g.fillStyle = `rgba(255,248,235,${J.destello * 0.08})`; g.fillRect(0, 0, W, H); }
  if (J.estado !== "vs") dibujarHud(g);
  if (J.estado === "vs") dibujarVs(g);
  if (J.fundido > 0) { g.fillStyle = `rgba(0,0,0,${J.fundido / 45})`; g.fillRect(0, 0, W, H); }
  // el mosaico del cambio de piso: cuadrados cada vez más grandes mientras se apaga, y al revés
  if (J.estado === "cayendo") mosaico(g, Math.min(1, J.tEstado / CAIDA.sale));
  else if (J.armando > 0) { mosaico(g, J.armando / CAIDA.entra); J.armando--; }
  if (J.estado === "ganando") { g.fillStyle = `rgba(255,250,240,${Math.min(1, J.tEstado / 80)})`; g.fillRect(0, 0, W, H); }
}

// ── el bucle: paso fijo de 60 Hz, dibujo cuando hubo paso ──
let _acum = 0, _ultimo = 0;
const PERF = { cuadros: 0, pasos: 0, msDibujo: 0 };
function cuadro(ahora) {
  requestAnimationFrame(cuadro);
  if (!_ultimo) _ultimo = ahora;
  _acum += Math.min(100, ahora - _ultimo); _ultimo = ahora;
  let n = 0;
  while (_acum >= CUADRO && n < 4) { paso(); _acum -= CUADRO; n++; }
  if (n >= 4) _acum = 0;
  if (n > 0) { const t0 = performance.now(); dibujar(); PERF.msDibujo = PERF.msDibujo * 0.95 + (performance.now() - t0) * 0.05; PERF.cuadros++; }
}
function paso() {
  PERF.pasos++;
  leerEntrada();
  ubicarBotones();
  if (MENU.activo) pasoMenu();
  else if (J) pasoJuego();
  finEntrada();
}
function dibujar() {
  const g = cxM;
  g.imageSmoothingEnabled = false;
  if (J && (!MENU.activo || MENU.activo.sobreJuego)) dibujarJuego(g);
  if (MENU.activo) dibujarMenu(g);
  presentar();
}
function alMedir() { if (typeof ubicarBotones === "function") ubicarBotones(); }
function arrancar() { medir(); abrirMenu("titulo"); requestAnimationFrame(cuadro); }

/** La chance de que se abra el pacto al matar al jefe de este piso (se muestra en el HUD). */
function probPacto() {
  if (!J || !J.piso || J.piso.n < 2 || J.piso.n >= ULTIMO_PISO) return 0;
  // el pentagrama suma un 10 % (15 % con dos o más, como en la wiki)
  const penta = J.jug.f.pentagrama ? (J.jug.f.pentagrama >= 2 ? 0.15 : 0.1) : 0;
  return Math.min(1, (J.jug.golpesJefe === 0 ? 0.7 : 0.33) + penta);
}

const CAIDA = { sale: 96, negro: 18, entra: 72 };
const cvMosaico = lienzoNuevo(8, 8), gMosaico = cvMosaico.getContext("2d");
/** El mundo en cuadrados de b píxeles (el color de cada uno, promediado) y oscurecido. u: 0 → 1. */
function mosaico(g, u) {
  const W = PANT.W, H = PANT.H, b = Math.max(1, Math.round(1 + Math.pow(u, 1.4) * 27));
  if (b > 1) {
    const w = Math.ceil(W / b), h = Math.ceil(H / b);
    if (cvMosaico.width !== w || cvMosaico.height !== h) { cvMosaico.width = w; cvMosaico.height = h; }
    gMosaico.imageSmoothingEnabled = true; gMosaico.imageSmoothingQuality = "low";
    gMosaico.drawImage(g.canvas, 0, 0, W, H, 0, 0, w, h);
    g.imageSmoothingEnabled = false;
    g.drawImage(cvMosaico, 0, 0, w, h, 0, 0, w * b, h * b);
  }
  g.fillStyle = `rgba(0,0,0,${Math.min(1, Math.pow(u, 1.2)).toFixed(3)})`; g.fillRect(0, 0, W, H);
}

// ── la maldición de la oscuridad: sólo se ve alrededor de Shumio (una luz tramada) ──
function oscuridadSpr() {
  return hornear("oscuridad", () => {
    const W = SALA_W * 2, H = SALA_H * 2, p = new Pix(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = Math.hypot(x - W / 2, (y - H / 2) * 1.15) / 78 + bayer(x, y) * 0.18;
      if (d > 1.15) p.p(x, y, "rgba(0,0,0,0.9)"); else if (d > 0.9) p.p(x, y, "rgba(0,0,0,0.62)"); else if (d > 0.7) p.p(x, y, "rgba(0,0,0,0.3)");
    }
    return p.canvas();
  });
}

// ── los controles dibujados en el piso de la primera sala (como el MOVE / ATTACK / BOMB / ITEM) ──
function dibujarTutorial(g) {
  if (!(J.piso.n === 1 && J.sala === J.piso.inicio)) return;
  const tinta = "#050403", cols = [0.13, 0.38, 0.63, 0.88].map((u) => Math.round(IX0 + COLS * T * u)), yT = IY0 + 10;
  g.save(); g.globalAlpha = 0.62;
  const tactil = IN.usaTactil;
  const titulos = ["MOVERSE", "LLORAR", "BOMBA", "OBJETO"];
  titulos.forEach((t, i) => { const s = etiquetaSpr(t, tinta); g.drawImage(s, cols[i] - Math.round(s.width / 2), yT); });
  // los dibujitos: Shumio (a un píxel de trazo) con lo que hace
  // el trazo, engrosado un píxel a la derecha (como marcador), en la misma tinta que las letras
  const fig = tinte(dibujoShumioChico(), tinta);
  cols.forEach((x) => { g.drawImage(fig, x - 18, yT + 18); g.drawImage(fig, x - 17, yT + 18); });
  const P = (x, y, w, h) => { g.fillStyle = tinta; g.fillRect(x, y, w, h); };
  const flecha = (x, y, d) => { for (let k = 0; k < 4; k++) { if (d === 0) P(x - k, y + k, 2 * k + 1, 1); if (d === 2) P(x - k, y - k, 2 * k + 1, 1); if (d === 1) P(x - k, y - k, 1, 2 * k + 1); if (d === 3) P(x + k, y - k, 1, 2 * k + 1); } };
  const x0 = cols[0], yc = yT + 38;
  flecha(x0, yc - 26, 0); flecha(x0, yc + 26, 2); flecha(x0 - 26, yc, 3); flecha(x0 + 26, yc, 1);
  // llorar: lágrimas en las cuatro direcciones, con la línea de puntos
  const x1 = cols[1];
  for (const [dx, dy] of DIRS) { for (let k = 12; k < 22; k += 3) P(x1 + dx * k, yc + dy * k, 1, 1); const cxl = x1 + dx * 26, cyl = yc + dy * 26; for (let a = 0; a < 12; a++) P(Math.round(cxl + Math.cos(a / 12 * TAU) * 3), Math.round(cyl + Math.sin(a / 12 * TAU) * 3), 1, 1); }
  // bomba: la bomba al lado, con chispas
  const x2 = cols[2] + 16;
  for (let a = 0; a < 20; a++) P(Math.round(x2 + Math.cos(a / 20 * TAU) * 5), Math.round(yc + 8 + Math.sin(a / 20 * TAU) * 5), 1, 1);
  P(x2 + 2, yc + 1, 1, 3); for (const [a, b] of [[4, -1], [6, 0], [5, -3]]) P(x2 + a, yc + b, 1, 1);
  // objeto: algo levantado sobre la cabeza
  const x3 = cols[3];
  for (let a = 0; a < 16; a++) P(Math.round(x3 + Math.cos(a / 16 * TAU) * 4), Math.round(yT + 12 + Math.sin(a / 16 * TAU) * 4), 1, 1);
  for (const [a, b] of [[-9, 10], [-8, 14], [8, 10], [7, 14]]) P(x3 + a, yT + b, 3, 1);
  // las teclas (PC) o los controles del teléfono
  const yK = yc + 34;
  const tecla = (x, y, t, w = 11) => { g.strokeStyle = tinta; g.lineWidth = 1; g.strokeRect(x + 0.5, y + 0.5, w, 11); const s = etiquetaSpr(t, tinta); g.drawImage(s, Math.round(x + w / 2 - s.width / 2 + 1), y - 2); };
  if (!tactil) {
    ["W", "A", "S", "D"].forEach((k, i) => tecla(x0 - 26 + i * 13, yK, k));
    ["↑", "←", "↓", "→"].forEach((k, i) => { const x = x1 - 26 + i * 13; g.strokeStyle = tinta; g.strokeRect(x + 0.5, yK + 0.5, 11, 11); flecha(x + 6, yK + 6, [0, 3, 2, 1][i]); });
    tecla(cols[2] - 6, yK, "E");
    tecla(x3 - 20, yK, "ESPACIO", 40);
  } else {
    const aroT = (x, y, r) => { for (let a = 0; a < 28; a++) P(Math.round(x + Math.cos(a / 28 * TAU) * r), Math.round(y + Math.sin(a / 28 * TAU) * r), 1, 1); };
    aroT(x0, yK + 6, 8); aroT(x0 + 3, yK + 4, 3);
    aroT(x1, yK + 6, 8); aroT(x1 - 3, yK + 6, 3);
    aroT(cols[2], yK + 6, 7); aroT(x3, yK + 6, 6);
    const s = etiquetaSpr("IZQUIERDA", tinta), s2 = etiquetaSpr("DERECHA", tinta);
    g.drawImage(s, x0 - Math.round(s.width / 2), yK + 16); g.drawImage(s2, x1 - Math.round(s2.width / 2), yK + 16);
  }
  g.restore();
}

// LOS MENÚS, EN PAPEL (la estética del original, con dibujo propio): hojas rasgadas clavadas
// con chinches sobre una pared de papel gris llena de garabatos desvaídos, todo escrito a mano
// con marcador. El título (el logo y una hoja con Shumio dibujado), el menú, cómo se juega, la
// pausa (opciones y la hoja de cuentas), "mi última voluntad" al morir y la carta del final.
// Se manejan con el dedo o con el teclado. También el aviso de "girá el teléfono".
// ─────────────────────────────────────────────────────────────────────────────

const MENU = { activo: null };
let registro = { partidas: 0, victorias: 0, muertes: 0, mejorPiso: 1, jefes: 0 };
try { Object.assign(registro, JSON.parse(localStorage.getItem("shumio-registro") || "{}")); } catch (e) { /* sin guardar */ }
function guardarRegistro() { try { localStorage.setItem("shumio-registro", JSON.stringify(registro)); } catch (e) { /* nada */ } }

const pct = (v) => Math.round(v * 100) + "%";
function reloj(cuadros) { const s = Math.floor(cuadros / 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
const TINTA_MANO = "#2b2326";

function abrirMenu(tipo) {
  const m = { tipo, sel: 0, t: 0, sobreJuego: tipo === "pausa" || tipo === "muerte", items: [], rects: [] };
  const completa = { texto: () => enPantallaCompleta() ? "SALIR DE PANTALLA COMPLETA" : "PANTALLA COMPLETA", hacer: () => pantallaCompleta(!enPantallaCompleta()) };
  const vol = () => [
    { texto: () => "MÚSICA " + pct(volMusica), cambiar: (d) => { volMusica = lim(Math.round((volMusica + d * 0.1) * 10) / 10, 0, 1); guardarVolumen(); } },
    { texto: () => "EFECTOS " + pct(volEfectos), cambiar: (d) => { volEfectos = lim(Math.round((volEfectos + d * 0.1) * 10) / 10, 0, 1); guardarVolumen(); SFX.moneda(); } },
    // el diagnóstico del sonido: dice cómo está y, al tocarlo, suena una prueba
    { texto: () => "SONIDO: " + estadoAudio(), hacer: () => probarSonido() },
    { texto: () => "SALIDA: " + (modoSalida === "directa" ? "DIRECTA" : "POR REPRODUCTOR"), hacer: () => cambiarSalida() },
  ];
  if (tipo === "titulo") { m.items = [{ texto: () => IN.usaTactil ? "TOCÁ PARA EMPEZAR" : "ENTER O CLIC", hacer: () => abrirMenu("principal") }]; Musica.poner("menu"); }
  if (tipo === "principal") Musica.poner("menu");
  if (tipo === "principal") m.items = [{ texto: () => "NUEVA PARTIDA", hacer: () => { MENU.activo = null; nuevaPartida(); } }, ...vol(), completa, { texto: () => "CÓMO SE JUEGA", hacer: () => abrirMenu("ayuda") }];
  if (tipo === "ayuda") m.items = [{ texto: () => "VOLVER", hacer: () => abrirMenu("principal") }];
  if (tipo === "pausa") m.items = [{ texto: () => "SEGUIR", hacer: () => { MENU.activo = null; } }, ...vol(), completa, { texto: () => "SALIR", hacer: () => { J = null; abrirMenu("principal"); } }];
  if (tipo === "muerte" || tipo === "victoria") m.items = [{ texto: () => "OTRA VEZ", hacer: () => { MENU.activo = null; nuevaPartida(); } }, { texto: () => "AL MENÚ", hacer: () => { J = null; abrirMenu("principal"); } }];
  if (tipo === "victoria") Musica.poner("menu");
  MENU.activo = m;
}

function pasoMenu() {
  const m = MENU.activo;
  m.t++;
  const n = m.items.length, it = () => m.items[m.sel];
  if (m.t < 12) return;   // que un toque de antes no active nada
  if (recien("kArrowUp") || recien("kKeyW")) { m.sel = (m.sel + n - 1) % n; SFX.clic(); }
  if (recien("kArrowDown") || recien("kKeyS")) { m.sel = (m.sel + 1) % n; SFX.clic(); }
  if ((recien("kArrowLeft") || recien("kKeyA")) && it().cambiar) it().cambiar(-1);
  if ((recien("kArrowRight") || recien("kKeyD")) && it().cambiar) it().cambiar(1);
  if (recien("aceptar")) activar(it());
  if (m.tipo === "pausa" && recien("pausa")) { MENU.activo = null; return; }
  if (m.tipo === "ayuda" && recien("pausa")) { abrirMenu("principal"); return; }
  // PC: el mouse elige lo que tiene abajo
  if (IN.movio) { IN.movio = false; m.rects.forEach((r, i) => { if (IN.px >= r.x - 12 && IN.px <= r.x + r.w + 6 && IN.py >= r.y - 2 && IN.py <= r.y + r.h + 2 && m.sel !== i) { m.sel = i; SFX.clic(); } }); }
  const tq = FLANCO.toque;
  if (tq) {
    if (m.tipo === "titulo") { activar(m.items[0]); return; }
    m.rects.forEach((r, i) => { if (tq.x >= r.x - 6 && tq.x <= r.x + r.w + 6 && tq.y >= r.y - 3 && tq.y <= r.y + r.h + 3) { m.sel = i; activar(m.items[i], true); } });
  }
}
function activar(it, tactil) {
  SFX.clic();
  if (it.hacer) it.hacer();
  else if (it.cambiar) it.cambiar(tactil ? (it.texto().includes("100%") ? -10 : 2) : 1);
}

/** La hoja tiene que entrar la opción más larga (con la flechita y el margen). */
function anchoOpciones(m, minimo) { return Math.max(minimo, ...m.items.map((it) => manoSpr(it.texto()).width + 34)); }
// ── piezas de papel ──
/** Una hoja clavada: el papel (que se mece apenas) y sus dos chinches. Devuelve dónde quedó. */
function hoja(g, x, y, w, h, semilla, tono = "blanco", mece = 0, chinches = 2) {
  const p = papelSpr(w, h, semilla, tono), dy = Math.round(Math.sin(mece) * 0.8);
  g.drawImage(p, Math.round(x - 3), Math.round(y - 3 + dy));
  const ch = chincheSpr();
  if (chinches >= 1) g.drawImage(ch, Math.round(x + w * 0.2 - 4), Math.round(y - 2 + dy));
  if (chinches >= 2) g.drawImage(ch, Math.round(x + w * 0.78 - 4), Math.round(y - 3 + dy));
  return dy;
}
/** Escribe a mano; alinear: "izq" | "centro". Devuelve el rectángulo (para tocarlo). */
function escribir(g, str, x, y, alinear = "izq", tinta = TINTA_MANO) {
  const s = manoSpr(str, { tinta });
  const X = alinear === "centro" ? Math.round(x - s.width / 2) : Math.round(x);
  g.drawImage(s, X, Math.round(y));
  return { x: X, y: Math.round(y), w: s.width, h: s.height };
}
/** El triangulito de tinta que marca la opción elegida. */
function flechita(g, x, y, t) {
  g.fillStyle = TINTA_MANO;
  const b = (t >> 4) & 1;
  for (let i = 0; i < 4; i++) g.fillRect(x + b, y + i, 1 + i * 1.4 | 0, 1), g.fillRect(x + b, y + 7 - i, 1 + i * 1.4 | 0, 1);
  g.fillRect(x + b, y + 4, 6, 1);
}
/** La lista de opciones sobre una hoja, con la flechita en la elegida. */
function opciones(g, m, x, y, paso = 17) {
  m.rects = m.items.map((it, i) => {
    const r = escribir(g, it.texto(), x + 10, y + i * paso);
    if (i === m.sel) flechita(g, x, y + i * paso + 5, m.t);
    return r;
  });
}

function dibujarMenu(g) {
  const m = MENU.activo, W = PANT.W, H = PANT.H;
  const fondoPared = () => g.drawImage(fondoMenuSpr(W, H), 0, 0);
  const mece = m.t * 0.05;
  if (m.tipo === "titulo") {
    fondoPared();
    // la hoja con Shumio dibujado cuelga debajo del logo, que la pisa (como en el original)
    const logo = logoSpr(), lx = Math.round(W / 2 - logo.width / 2), ly = 2;
    const hw = 156, hx = Math.round(W / 2 - hw / 2 + 6), hy = ly + logo.height - 44, hh = Math.min(H - hy - 6, 136);
    const dy = hoja(g, hx, hy, hw, hh, 7, "blanco", mece, 0);
    const llora = m.t % 80 < 10;
    const cx0 = Math.round(W / 2 + 6), base = hy + hh - 34 + dy, dib = dibujoShumio(llora ? 1 : 0);
    g.drawImage(dib, cx0 - 36, base - 78);
    // el piso y el charquito de lágrimas, trazados a mano
    g.fillStyle = TINTA_MANO;
    for (let x = -58; x <= 58; x++) { const y = Math.round(Math.sin(x * 0.11) * 0.8); if (Math.abs(x) > 26) g.fillRect(cx0 + x, base + 1 + y, 1, 2); }
    for (let k = 0; k < 40; k++) { const an = k / 40 * TAU, x = Math.round(cx0 + Math.cos(an) * 30), y = Math.round(base + 1 + Math.sin(an) * 4); if (Math.sin(an) > -0.35) g.fillRect(x, y, 2, 1); }
    for (let i = 0; i < 2; i++) { const k = (m.t + i * 40) % 80, ty = base - 30 + k * 0.5; if (k < 50) g.drawImage(gotitaDibujo(), cx0 + (i ? 5 : -15), Math.round(ty)); }
    escribir(g, m.items[0].texto(), cx0, base + 8, "centro");
    g.drawImage(logo, lx, ly);
    notaRegistro(g, W, H, mece);
    // cómo está el sonido, siempre a la vista en la portada (así una captura ya dice qué pasa)
    { const s = etiquetaSpr("SONIDO: " + estadoAudio(), "#e8dcc0"); g.globalAlpha = 0.8; g.drawImage(s, 4, H - s.height - 3); g.globalAlpha = 1; }
    return;
  }
  if (m.tipo === "principal") {
    fondoPared();
    const logo = logoSpr(), lw = Math.round(logo.width * 0.5);
    g.drawImage(logo, 8, 6, lw, Math.round(logo.height * 0.5));
    const hw = anchoOpciones(m, 168), hh = m.items.length * 18 + 24, hx = Math.round(W / 2 - hw / 2 - 20), hy = Math.round(H / 2 - hh / 2) + 8;
    const dy = hoja(g, hx, hy, hw, hh, 3, "blanco", mece);
    opciones(g, m, hx + 16, hy + 14 + dy);
    notaRegistro(g, W, H, mece);
    return;
  }
  if (m.tipo === "ayuda") {
    fondoPared();
    const hw = Math.min(W - 40, 330), hh = H - 36, hx = Math.round(W / 2 - hw / 2), hy = 16;
    const dy = hoja(g, hx, hy, hw, hh, 11, "crema", mece);
    const lineas = IN.usaTactil
      ? ["PULGAR IZQUIERDO: CAMINAR", "PULGAR DERECHO: LLORAR (4 LADOS)", "BOTÓN GRANDE: BOMBA", "ARRIBA: OBJETO ACTIVO", "AL LADO: CÁPSULA"]
      : ["WASD: CAMINAR", "FLECHAS: LLORAR", "E: BOMBA   Q: CÁPSULA", "ESPACIO: OBJETO ACTIVO", "ESC: PAUSA"];
    lineas.forEach((l, i) => escribir(g, l, hx + 16, hy + 12 + i * 18 + dy));
    escribir(g, "LIMPIÁ LAS SALAS, BAJÁ 4 PISOS Y", hx + 16, hy + 12 + 5 * 18 + 6 + dy, "izq", "#6a1c1c");
    escribir(g, "HACÉ QUE MICELIA DEJE DE LLORAR.", hx + 16, hy + 12 + 6 * 18 + 6 + dy, "izq", "#6a1c1c");
    opciones(g, m, hx + hw - 90, hy + hh - 24 + dy);
    return;
  }
  if (m.tipo === "pausa") {
    g.fillStyle = "rgba(4,2,6,0.62)"; g.fillRect(0, 0, W, H);
    const j = J.jug;
    // la hoja de las opciones
    const hw = anchoOpciones(m, 150), hh = m.items.length * 18 + 40, hx = Math.round(Math.max(8, W * 0.5 - hw - 10)), hy = Math.round(H / 2 - hh / 2);
    let dy = hoja(g, hx, hy, hw, hh, 5, "blanco", mece);
    escribir(g, "PAUSA", hx + hw / 2, hy + 6 + dy, "centro", "#6a1c1c");
    opciones(g, m, hx + 14, hy + 26 + dy);
    // la hoja de las cuentas, con los objetos abajo
    const cw = 160, ch = Math.min(H - 20, 186), cx0 = Math.round(W * 0.5 + 6), cy0 = Math.round(H / 2 - ch / 2);
    dy = hoja(g, cx0, cy0, cw, ch, 9, "crema", mece + 1, 1);
    escribir(g, J.piso.nombre, cx0 + cw / 2, cy0 + 6 + dy, "centro");
    const cuentas = [["vel", velDe(j)], ["lag", lagrimasPorSeg(j)], ["dano", danoDe(j)], ["alc", j.alcance], ["tiro", j.velLag], ["suerte", j.suerte]];
    cuentas.forEach(([ic, v], i) => {
      const x = cx0 + 12 + (i % 2) * 74, y = cy0 + 26 + Math.floor(i / 2) * 17 + dy;
      g.drawImage(iconoHud(ic), x, y + 3); escribir(g, v.toFixed(2), x + 11, y);
    });
    escribir(g, "TIEMPO " + reloj(J.tiempo), cx0 + 12, cy0 + 80 + dy);
    const cols = 7;
    [...j.objetos, ...(j.activo ? [j.activo.id] : [])].slice(0, 21).forEach((id, i) => g.drawImage(iconoSpr(id), cx0 + 10 + (i % cols) * 20, cy0 + 100 + Math.floor(i / cols) * 20 + dy));
    return;
  }
  if (m.tipo === "muerte") {
    g.fillStyle = `rgba(20,2,4,${Math.min(0.82, m.t / 40)})`; g.fillRect(0, 0, W, H);
    ultimaVoluntad(g, m, mece);
    return;
  }
  if (m.tipo === "victoria") { fondoPared(); cartaFinal(g, m, mece); }
}

function notaRegistro(g, W, H, mece) {
  const r = registro, nw = 104, nh = 50, nx = W - nw - 10, ny = H - nh - 12;
  const dy = hoja(g, nx, ny, nw, nh, 13, "crema", mece + 2, 1);
  escribir(g, "PARTIDAS " + r.partidas, nx + 8, ny + 6 + dy);
  escribir(g, "GANADAS " + r.victorias, nx + 8, ny + 20 + dy);
  escribir(g, "PISO " + r.mejorPiso, nx + 8, ny + 34 + dy);
}

/** "Mi última voluntad": quién te mató (dibujado), dónde, y a quién le dejás tus cosas. */
function ultimaVoluntad(g, m, mece) {
  const W = PANT.W, H = PANT.H, j = J.jug;
  const hw = Math.min(W - 30, 300), hh = H - 22, hx = Math.round(W / 2 - hw / 2), hy = 10;
  const baja = Math.round(Math.max(0, 1 - m.t / 24) * -H);   // la hoja cae desde arriba
  const dy = hoja(g, hx, hy + baja, hw, hh, 17, "crema", mece) + baja;
  escribir(g, "MI ÚLTIMA VOLUNTAD", hx + hw / 2, hy + 6 + dy, "centro", "#6a1c1c");
  escribir(g, "ME MORÍ EN " + J.piso.nombre, hx + 14, hy + 26 + dy);
  escribir(g, "POR CULPA DE:", hx + 14, hy + 44 + dy);
  const quien = J.causaSpr ? garabato(J.causaSpr, TINTA_MANO, J.causaSpr.width > 40 ? 1 : J.causaSpr.width > 18 ? 2 : 3) : null;
  if (quien) g.drawImage(quien, Math.round(hx + hw * 0.72 - quien.width / 2), Math.round(hy + 60 - quien.height / 2 + dy));
  escribir(g, J.causa || "LA HUMEDAD", hx + 22, hy + 60 + dy);
  escribir(g, "Y LE DEJO MIS COSAS A MI HONGO:", hx + 14, hy + 82 + dy);
  const objs = [...j.objetos, ...(j.activo ? [j.activo.id] : [])];
  objs.slice(0, 12).forEach((id, i) => g.drawImage(garabato(iconoSpr(id), TINTA_MANO, 1, "#ecdfc8"), hx + 16 + i * 20, hy + 100 + dy));
  if (!objs.length) escribir(g, "(NO TENÍA NADA)", hx + 22, hy + 100 + dy, "izq", "#6e625a");
  escribir(g, reloj(J.tiempo) + "  ·  " + J.muertes + " BICHOS", hx + 14, hy + 124 + dy, "izq", "#6e625a");
  opciones(g, m, hx + 14, hy + hh - 40 + dy, 17);
}

function cartaFinal(g, m, mece) {
  const W = PANT.W, H = PANT.H, j = J.jug;
  const hw = Math.min(W - 30, 300), hh = H - 22, hx = Math.round(W / 2 - hw / 2), hy = 10;
  const dy = hoja(g, hx, hy, hw, hh, 19, "blanco", mece);
  escribir(g, "¡LO LOGRASTE!", hx + hw / 2, hy + 6 + dy, "centro", "#6a1c1c");
  escribir(g, "MICELIA YA NO LLORA.", hx + 14, hy + 26 + dy);
  escribir(g, "SHUMIO TAMPOCO.", hx + 14, hy + 42 + dy);
  const sp = spritesShumio(), cab = garabato(sp.cab.frente[0], TINTA_MANO, 2);
  g.drawImage(cab, Math.round(hx + hw - 64), hy + 22 + dy);
  escribir(g, reloj(J.tiempo) + "  ·  " + J.muertes + " BICHOS", hx + 14, hy + 64 + dy, "izq", "#6e625a");
  const objs = [...j.objetos, ...(j.activo ? [j.activo.id] : [])];
  objs.slice(0, 12).forEach((id, i) => g.drawImage(garabato(iconoSpr(id), TINTA_MANO, 1, "#f0ebe2"), hx + 16 + i * 20, hy + 86 + dy));
  opciones(g, m, hx + 14, hy + hh - 40 + dy, 17);
}

/** La presentación del jefe: Shumio y el jefe, con sus nombres escritos en tiras de papel. */
function dibujarVs(g) {
  const W = PANT.W, H = PANT.H, t = J.vs.t, u = Math.min(1, t / 14), e = 1 - Math.pow(1 - u, 3);
  const C = CAPITULOS[J.piso.cap];
  g.fillStyle = C.oscuro; g.fillRect(0, 0, W, H);
  // un foco de luz sucia detrás de cada uno, tramado
  const cy0 = Math.round(H / 2);
  g.fillStyle = C.piso[2];
  for (let y = 0; y < H; y += 2) for (let x = (y >> 1) & 1; x < W; x += 2) { const d = Math.min(Math.hypot(x - W * 0.25, y - cy0), Math.hypot(x - W * 0.73, y - cy0)); if (d < 70 + bayer(x, y) * 20) g.fillRect(x, y, 2, 2); }
  const sp = spritesShumio(), cab = sp.cab.frente[t % 40 < 6 ? 1 : 0];
  const ex = Math.round(lerp(-80, W * 0.25, e));
  g.drawImage(sombra(24, 6), ex - 24, cy0 + 28);
  g.drawImage(cab, ex - 33, cy0 - 40, 66, 66);
  const jefe = ENEMIGOS[J.vs.tipo].spr(J.jefes[0] || { k: 0, t: 0, dir: ABAJO });
  const esc = jefe.width > 70 ? 1 : 2, jx = Math.round(lerp(W + 80, W * 0.73, e));
  g.drawImage(sombra(30, 7), jx - 30, cy0 + 26);
  g.drawImage(jefe, Math.round(jx - jefe.width * esc / 2), cy0 + 32 - jefe.height * esc, jefe.width * esc, jefe.height * esc);
  const vs = bloqueSpr("VS", { grad: "rojo" });
  g.drawImage(vs, Math.round(W / 2 - vs.width), cy0 - 18, vs.width * 2, vs.height * 2);
  if (t > 12) {
    for (const [nombre, x, s] of [["SHUMIO", W * 0.25, 21], [NOMBRE_JEFE[J.vs.tipo], W * 0.73, 23]]) {
      const txt = manoSpr(nombre), pw = txt.width + 16;
      hoja(g, Math.round(x - pw / 2), H - 44, pw, 24, s, "blanco", t * 0.05, 0);
      g.drawImage(txt, Math.round(x - txt.width / 2), H - 40);
    }
  }
}

function dibujarGirar(g) {
  const W = PANT.W, H = PANT.H;
  g.drawImage(fondoMenuSpr(W, H), 0, 0);
  const t = performance.now() / 1000, a = (Math.sin(t * 2) * 0.5 + 0.5) * Math.PI / 2;
  const hw = Math.min(W - 16, 170), hx = Math.round(W / 2 - hw / 2), hy = Math.round(H / 2 - 44);
  hoja(g, hx, hy, hw, 88, 29, "blanco", t);
  g.save(); g.translate(Math.round(W / 2), hy + 34); g.rotate(a);
  g.fillStyle = TINTA_MANO; g.fillRect(-10, -16, 20, 32); g.fillStyle = "#e9e4dc"; g.fillRect(-8, -13, 16, 24);
  g.restore();
  escribir(g, "GIRÁ EL TELÉFONO", W / 2, hy + 62, "centro");
}

// ══════════ 99-arranque.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL ARRANQUE y las sondas para las pruebas (window.__SH).
// ─────────────────────────────────────────────────────────────────────────────
window.__SH = {
  SPR, PAL, Pix,
  /** Dibuja una lista de sprites (canvas) en una hoja, agrandados ×z, para mirarlos. */
  hoja(lista, z = 6, fondo = "#2b2a2e") {
    const pad = 4, cols = 8, cw = Math.max(...lista.map((c) => c.width)), ch = Math.max(...lista.map((c) => c.height));
    const W = cols * (cw + pad) * z, H = Math.ceil(lista.length / cols) * (ch + pad) * z;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d"); g.imageSmoothingEnabled = false; g.fillStyle = fondo; g.fillRect(0, 0, W, H);
    lista.forEach((s, i) => g.drawImage(s, (i % cols) * (cw + pad) * z, Math.floor(i / cols) * (ch + pad) * z, s.width * z, s.height * z));
    return c.toDataURL();
  },
  listo: true,
};
if (typeof arrancar === "function") arrancar();
window.__SH.hojaDe = (grupo) => {
  if (grupo === "shumio") {
    const s = spritesShumio(), l = [];
    for (const v of ["frente", "lado", "espalda"]) l.push(...s.cab[v]);
    for (const v of ["frente", "lado", "espalda"]) l.push(...s.cue[v]);
    l.push(...[2, 3, 4, 5, 7, 9].map((r) => lagrimaSpr(r)), ...[0, 1, 2, 3, 4].map((k) => chapoteoSpr("espora", k)));
    return window.__SH.hoja(l, 8);
  }
  if (grupo === "enemigos") {
    const l = [];
    for (let k = 0; k < 2; k++) l.push(mosquinSpr(k), mosquinSpr(k, true));
    for (let k = 0; k < 4; k++) l.push(hongonSpr(k));
    l.push(babosaSpr(0), babosaSpr(1), escupidorSpr(0), escupidorSpr(1), escupidorSpr(2), saltarinSpr(0), saltarinSpr(1));
    for (let k = 0; k < 4; k++) l.push(gusanoSpr(k));
