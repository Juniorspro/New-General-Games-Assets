// ══════════ 08-arte-enemigos.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL ARTE DE LOS ENEMIGOS Y LOS JEFES. Criaturas del subsuelo, cada una con su silueta: la
// forma se lee antes que el color. Simétricas donde miran de frente (se dibujan con el eje en
// x.5 y los detalles espejados), y con el brillo siempre arriba a la izquierda.
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Centrar a pixel exacto. c es el centro CONTINUO del cuerpo (la bola de centro 10.5 cubre los píxeles
 * 0..20: su píxel del medio es el 10). Un sello de ancho w queda centrado si empieza en c - w/2, y eso
 * tiene que ser entero: con centro x.5 van sellos de ancho impar, con centro entero, de ancho par.
 * Si no da exacto, avisa (así no queda nada "corrido medio píxel").
 */
function selloC(p, c, y, filas, pal) {
  const w = filas[0].length, x0 = c - w / 2;
  if (x0 !== Math.floor(x0)) console.warn("sello corrido medio píxel:", filas[0], "centro", c);
  p.sello(Math.floor(x0), y, filas, pal);
}
/**
 * Un par de ojos simétricos: la forma del derecho es el espejo del izquierdo, pero el BRILLO (W) queda
 * en el mismo lugar en los dos (la luz viene de arriba a la izquierda para los dos ojos).
 * gap: del centro al borde de adentro de cada ojo.
 */
function parDeOjos(p, c, gap, y, filas, pal) {
  const w = filas[0].length, xi = c - gap - w, xd = c + gap;
  if (xi !== Math.floor(xi)) console.warn("ojos corridos medio píxel:", filas[0], "centro", c, "gap", gap);
  const base = pal.e ? "e" : Object.keys(pal).find((k) => k !== "W");
  filas.forEach((f, dy) => {
    for (let i = 0; i < w; i++) {
      const ch = f[i];
      if (ch === "." || !pal[ch]) continue;
      p.p(xi + i, y + dy, pal[ch]);                                   // el izquierdo, tal cual
      p.p(xd + (w - 1 - i), y + dy, pal[ch === "W" ? base : ch]);    // el derecho, espejado (sin el brillo)
    }
    for (let i = 0; i < w; i++) if (f[i] === "W") p.p(xd + i, y + dy, pal.W);   // el brillo, en el mismo lugar
  });
}
const OJO_PAL = { e: PAL.tinta, W: "#ffffff", r: "#e8312a", R: "#ff8a6a", y: "#f2d64a", k: PAL.tinta, b: "#2b0a0e", t: PAL.hueso[4], m: "#4a0d14" };

// ── Mosquín: una mosca gorda del sótano. 2 cuadros de alas. rabioso = rojo, te persigue ──
function mosquinSpr(k, rabioso = false) {
  return hornear(`mosquin${k}${rabioso}`, () => {
    const p = new Pix(15, 14), cuerpo = rabioso ? ["#1c0506", "#3f0b0d", "#6e1a18", "#9c3326"] : ["#0d100c", "#1e241b", "#343c2e", "#4f5944"];
    // las alas (atrás del cuerpo): arriba o abajo según el cuadro
    const ala = k === 0 ? ["..aa.", ".aAAa", "aAAa.", ".aa.."] : ["....", ".aa.", "aAAa", ".aAa"];
    // las alas: la derecha es el espejo exacto de la izquierda (alrededor del píxel 7)
    const alaI = k === 0 ? ["..aa.", ".aAAa", "aAAa.", ".aa.."] : ["....", ".aa.", "aAAa", ".aAa"];
    p.sello(1, k === 0 ? 1 : 3, alaI, { a: "#8a9693", A: "#c9d2cf" });
    p.sello(14 - alaI[0].length, k === 0 ? 1 : 3, alaI.map((f) => [...f].reverse().join("")), { a: "#8a9693", A: "#c9d2cf" });
    p.bola(7.5, 8.5, 4, 3.6, cuerpo, { luz: [-0.4, -0.7, 0.5] });
    // las rayas del abdomen (espejadas: 6 y 8) y los ojos
    p.p(6, 10, cuerpo[0]); p.p(8, 10, cuerpo[0]);
    parDeOjos(p, 7.5, 0.5, 6, ["We", "ee"], { e: rabioso ? "#ff4a3a" : "#c9392f", W: rabioso ? "#ffd0a0" : "#ff9a86" });
    p.contorno(AUTO);
    return p.canvas();
  });
}

// ── Hongón: un muerto con cabeza de hongo que camina hacia vos, boca abierta, ojos vacíos ──
function hongonSpr(k, sinGorro = false) {
  return hornear(`hongon${k}${sinGorro}`, () => {
    const p = new Pix(21, 26), piel = ["#3b3130", "#6a5a55", "#9a8a80", "#c2b3a4", "#ddd0c0"], capR = ["#1c130d", "#3b2a1c", "#5e442c", "#86643f", "#a88558"];
    // las piernas (4 cuadros)
    const a = [1, 0, -1, 0][k];
    p.caja(6, 19 + Math.max(0, a), 3, 6 - Math.max(0, a), piel.slice(0, 3)); p.caja(12, 19 + Math.max(0, -a), 3, 6 - Math.max(0, -a), piel.slice(0, 3));
    // el cuerpo flaco, con los brazos caídos adelante
    p.bola(10.5, 16.5, 5.4, 4.8, ["#171513", "#2c2723", "#453c35", "#5f544a"], { bajar: 0.1 });
    p.caja(3, 14 + (a > 0 ? 1 : 0), 2, 6, piel.slice(0, 4)); p.caja(16, 14 + (a < 0 ? 1 : 0), 2, 6, piel.slice(0, 4));
    // la cabeza
    p.bola(10.5, 9.5, 6.6, 5.8, piel, { luz: [-0.4, -0.5, 0.7], trama: 0.5 });
    if (!sinGorro) {
      const ala = (x) => Math.round(6.6 + 1.2 * Math.pow((x + 0.5 - 10.5) / 9, 2));
      p.bola(10.5, 5, 9.4, 5.2, capR, { filtro: (x, y) => y <= ala(x), luz: [-0.5, -0.7, 0.5], trama: 0.7 });
      for (let x = 0; x < 21; x++) { const y = ala(x); if (p.g(x, y)) p.p(x, y, capR[1]); }
      // las laminillas del hongo, que se ven por abajo del ala
      for (let x = 4; x <= 17; x += 2) if (p.g(x, ala(x) + 1)) p.p(x, ala(x) + 1, capR[0]);
    }
    // los ojos vacíos y la boca abierta que gotea
    parDeOjos(p, 10.5, 1.5, 9, ["ee.", "eee"], { e: PAL.tinta });
    selloC(p, 10.5, 12, [".kkk.", "kmmmk", "kmmmk", ".kkk."], { k: PAL.tinta, m: "#4a0d14" });
    p.p(10, 16, PAL.baba[3]); if (k % 2) p.p(10, 17, PAL.baba[2]);
    p.contorno(AUTO);
    return p.canvas();
  });
}

// ── Babosa: larga, brillante, con dos antenas con ojo. 2 cuadros (estirada / encogida) ──
function babosaSpr(k) {
  return hornear(`babosa${k}`, () => {
    const p = new Pix(24, 15), R = ["#1f200b", "#454a16", "#737a24", "#a3aa3a", "#cfd37a"], est = k ? 1.12 : 0.92;
    p.bola(12, 10, 9.5 * est, 4.2 / est, R, { luz: [-0.3, -0.9, 0.35], bajar: 0.1 });
    // el borde del pie, más oscuro, y las manchitas
    for (let x = 2; x < 23; x++) if (p.g(x, 13)) p.p(x, 13, R[1]);
    for (const [x, y] of [[8, 8], [12, 7], [15, 9], [10, 10]]) if (p.g(x, y)) p.p(x, y, R[1]);
    // las antenas con sus ojos (del lado de adelante: la derecha; se espeja al girar)
    const ax = Math.round(12 + 7 * est);
    p.linea(ax - 2, 7, ax - 3, 2, R[2]); p.linea(ax, 7, ax + 1, 2, R[2]);
    p.sello(ax - 4, 0, ["ee", "eW"], { e: PAL.tinta, W: "#ffffff" }); p.sello(ax, 0, ["ee", "eW"], { e: PAL.tinta, W: "#ffffff" });
    p.p(ax + 1, 10, PAL.tinta); p.p(ax, 11, PAL.tinta);
    // el brillo mojado
    p.p(9, 7, R[4]); p.p(10, 7, R[4]); p.p(14, 7, R[4]);
    p.contorno(AUTO);
    return p.canvas();
  });
}

// ── Escupidor: un bejín (hongo pedo de lobo) plantado, que escupe esporas por la boca ──
function escupidorSpr(k /* 0 cerrado, 1 inflado, 2 escupiendo */) {
  return hornear(`escupidor${k}`, () => {
    const p = new Pix(22, 22), R = ["#2c231b", "#5a4a3a", "#8c7a62", "#b9a88a", "#e0d4b8"], inf = [1, 1.1, 0.94][k];
    p.bola(11, 12.5, 8.4 * inf, 7.6 * inf, R, { luz: [-0.5, -0.6, 0.6], trama: 0.8 });
    // los poros
    for (const [x, y] of [[6, 9], [9, 7], [14, 8], [16, 12], [7, 14], [12, 16], [15, 16]]) if (p.g(x, y)) { p.p(x, y, R[1]); p.p(x + 1, y + 1, R[3]); }
    // la boca de arriba (la que escupe)
    if (k === 2) selloC(p, 11, 3, ["..kk..", ".kmmk.", "kmmmmk"], { k: PAL.tinta, m: "#140a08" });

}

// ── Saltarín: un sapo de barro, con la boca grande. 0 agachado, 1 en el aire ──
function saltarinSpr(k) {

    const p = new Pix(20, 17), R = ["#1b1310", "#3c2a22", "#634537", "#8c664f", "#b28a6a"];
    const alto = k ? 6 : 4.6, ancho = k ? 6.4 : 7.8;
    p.bola(10, 16 - alto - 1, ancho, alto, R, { luz: [-0.4, -0.7, 0.55] });
    // las patas
    if (k) { p.caja(4, 12, 3, 4, R.slice(0, 3)); p.caja(13, 12, 3, 4, R.slice(0, 3)); }
    else { p.caja(1, 13, 5, 2, R.slice(0, 3)); p.caja(14, 13, 5, 2, R.slice(0, 3)); }
    const oy = 16 - alto * 2;
    // ojos saltones amarillos con la pupila negra (la pupila, igual en los dos: miran para el mismo lado)
    parDeOjos(p, 10, 2, Math.round(oy), [".ee.", "eeWe", ".ee."], { e: "#f2d64a", W: PAL.tinta });
    selloC(p, 10, Math.round(oy + 4), ["kkkkkk"], { k: PAL.tinta });
    p.contorno(AUTO);
    return p.canvas();
  });
}

// ── Gusano: sale del piso, anillado, con una corona de dientes. 0..2 = saliendo, 3 = afuera ──

    const p = new Pix(16, 24), R = ["#2e1016", "#5e2430", "#8f3d4a", "#bf6670", "#e09aa0"];
    const alto = [5, 10, 15, 18][k];
    for (let i = 0; i < alto; i += 3) {
      const y = 21 - i, rx = 4.6 - i * 0.06;
      p.bola(8, y, rx, 2.2, R, { luz: [-0.5, -0.5, 0.6], trama: 0.4 });
      for (let x = 4; x < 12; x++) if (p.g(x, y + 1)) p.p(x, y + 1, R[1]);
    }
    // la boca con dientes, arriba
    const yb = 21 - alto + 2;
    p.bola(8, yb, 4.2, 2.6, R.slice(1), {});
    selloC(p, 8, yb - 1, ["ttkktt", "kmmmmk"], { t: PAL.hueso[4], k: PAL.tinta, m: "#1a0406" });
    // el pozo de tierra
    p.sello(1, 21, ["..dddddddddddd", ".dDDDDDDDDDDDDd", "dDDDDDDDDDDDDDd"].map((f) => f.slice(0, 15)), { d: PAL.tierra[1], D: PAL.tierra[0] });
    p.contorno(AUTO);
    return p.canvas();
  });
}

// ── La Madre Babosa: una montaña de baba con una boca enorme. 0 quieta, 1 agachada, 2 estirada (salta), 3 boca abierta ──
function madreBabosaSpr(k) {
  return hornear(`madreBabosa${k}`, () => {
    const p = new Pix(64, 56), R = ["#1a1c08", "#3b3f12", "#62681e", "#8f962e", "#bcc25a", "#dfe29a"];
    const ax = [1, 1.14, 0.84, 1.04][k], ay = [1, 0.84, 1.18, 1.02][k];
    p.bola(32, 54 - 21 * ay, 25 * ax, 21 * ay, R, { luz: [-0.45, -0.6, 0.62], bajar: 0.2 });
    // gotas que le chorrean por los costados
    for (const [x, y] of [[12, 40], [52, 42], [18, 48], [46, 49]]) { const X = 32 + (x - 32) * ax, Y = 54 - (54 - y) * ay; if (p.g(X, Y)) { p.p(X, Y + 1, R[2]); p.p(X, Y + 2, R[1]); } }
    // la cara
    const cy0 = 54 - 26 * ay;
    parDeOjos(p, 32, 4, Math.round(cy0 - 10 * ay), ["..eeee..", ".eWWeee.", "eWeeeeee", "eeeeeeee", ".eeeeee.", "..eeee.."], { e: PAL.tinta, W: "#fff8d0" });
    const bocaAlto = k === 3 ? 12 : k === 1 ? 4 : 6;
    for (let y = 0; y < bocaAlto; y++) for (let x = -11; x <= 10; x++) {   // de 21 a 42: centrada en 32
      const X = x + 0.5, e = (X * X) / (121) + ((y - bocaAlto / 2) * (y - bocaAlto / 2)) / ((bocaAlto / 2 + 0.5) * (bocaAlto / 2 + 0.5));
      if (e <= 1) p.p(32 + x, Math.round(cy0 + 2 + y), y > bocaAlto - 3 && Math.abs(X) < 7 ? "#8e2a3a" : "#2a0810");
    }
    // los dientes, de a pares espejados alrededor del centro (el píxel p y el 63 − p)
    if (k === 3) for (const x of [22, 25, 28, 31]) for (const X of [x, 63 - x]) { p.p(X, Math.round(cy0 + 2), PAL.hueso[4]); p.p(X, Math.round(cy0 + 3), PAL.hueso[3]); }
    // brillos mojados
    for (const [x, y] of [[20, 20], [21, 20], [23, 18], [40, 16]]) { const X = 32 + (x - 32) * ax, Y = 54 - (54 - y) * ay; if (p.g(X, Y)) p.p(X, Y, R[5]); }
    p.contorno(AUTO);
    return p.canvas();
  });
}

// ── El Rey Mosquín: una mosca enorme e hinchada, con corona de pelos y muchos ojos ──
function reyMosquinSpr(k /* 0 normal, 1 inflado */) {
  return hornear(`reyMosquin${k}`, () => {
    const p = new Pix(56, 50), R = ["#0c0e0a", "#1c2218", "#2f382a", "#48543f", "#66735a", "#8a977a"], s = k ? 1.08 : 1;
    // las alas, grandes y translúcidas
    for (const sx of [-1, 1]) {
      const q = new Pix(56, 50);
      q.bola(28 + sx * 18, 12, 11, 7, ["#5d6966", "#8a9693", "#b8c2bf", "#dce3e0"], { luz: [-0.2, -0.9, 0.3], trama: 0.3 });
      for (let x = 0; x < 56; x += 3) for (let y = 0; y < 50; y++) if (q.g(x, y) && (x + y) % 5 === 0) q.p(x, y, "#6f7b78");
      p.pegar(q, 0, k ? -2 : 0);
    }
    p.bola(28, 29, 20 * s, 17 * s, R, { luz: [-0.4, -0.6, 0.65], bajar: 0.22 });
    // las verrugas
    for (const [x, y] of [[15, 24], [40, 22], [19, 37], [37, 38], [28, 42]]) { p.p(x, y, R[4]); p.p(x + 1, y, R[3]); p.p(x, y + 1, R[1]); }
    // la fila de ojos rojos
    for (const [x, y, r] of [[21, 24, 3], [35, 24, 3], [16, 28, 2], [40, 28, 2], [28, 21, 2]]) {
      p.bola(x, y, r, r * 0.85, ["#3a0406", "#8e1016", "#d6302a", "#ff7a5a"], { trama: 0.3 });
      p.p(x - 1, y - 1, "#ffd0b0");
    }
    // la boca con la trompa
    selloC(p, 28, 32, [".kkkkkkkk.", "kmmmmmmmmk", "kmmtmmtmmk", ".kmmmmmmk.", "..kkkkkk.."], { k: PAL.tinta, m: "#3a0a10", t: PAL.hueso[3] });
    // la corona de pelos duros
    for (let i = 0; i < 9; i++) { const x = 16 + i * 3; p.linea(x, 12 + Math.abs(4 - i), x + (i - 4) * 0.4, 7 + Math.abs(4 - i), R[0]); }
    p.contorno(AUTO);
    return p.canvas();
  });
}

// ── El Gusano Anillado: cabeza con mandíbulas, anillos y cola ──
function gusanoAnilladoSpr(parte /* cabeza, cuerpo, cola */, dir = 0, k = 0) {
  return hornear(`anillado${parte}${dir}${k}`, () => {
    const p = new Pix(26, 26), R = ["#2a0f14", "#56202b", "#86363f", "#b55a5c", "#d98a86", "#f2c0b0"];
    if (parte === "cuerpo") {
      p.bola(13, 14, 10, 9, R, { luz: [-0.4, -0.6, 0.6] });
      for (let x = 4; x < 23; x++) { if (p.g(x, 9)) p.p(x, 9, R[1]); if (p.g(x, 18)) p.p(x, 18, R[1]); }
      p.p(9, 10, R[5]); p.p(10, 10, R[5]);
    } else if (parte === "cola") {
      p.bola(13, 14, 7, 6.5, R, { luz: [-0.4, -0.6, 0.6] });
      p.p(13, 20, R[0]);
    } else {
      p.bola(13, 13, 11, 10, R, { luz: [-0.4, -0.6, 0.6] });
      // las mandíbulas se abren y cierran
      const ab = k ? 2 : 0;
      p.sello(6 - ab, 16, ["hh..", ".hHh", "..hH"], { h: PAL.hueso[3], H: PAL.hueso[1] });
      p.sello(16 + ab, 16, ["..hh", "hHh.", "Hh.."], { h: PAL.hueso[3], H: PAL.hueso[1] });
      parDeOjos(p, 13, 2, 9, ["Wee", "eee", ".e."], { e: PAL.tinta, W: "#ffe0d0" });
      selloC(p, 13, 17, ["kkkkkk", "kmmmmk"], { k: PAL.tinta, m: "#2a0408" });
    }
    p.contorno(AUTO);
    let c = p.canvas();
    if (dir) {   // girar hacia donde va (0 abajo, 1 izquierda, 2 arriba, 3 derecha)
      const r = lienzoNuevo(26, 26), g = r.getContext("2d"); g.translate(13, 13); g.rotate(dir * Math.PI / 2); g.drawImage(c, -13, -13); c = r;
    }
    return c;
  });
}

// ── Micelia, la Madre Hongo: la reina del fondo. Un hongo enorme con cara en el tallo, que llora esporas ──
function miceliaSpr(k /* 0 quieta, 1 boca abierta, 2 herida, 3 furiosa (fase 3) */) {
  return hornear(`micelia${k}`, () => {
    const W = 96, H = 84, p = new Pix(W, H);
    const cap = k === 3 ? ["#1e0610", "#48101f", "#7a1a30", "#b0304a", "#d8586a", "#f08a90"] : ["#1e0a18", "#3e1432", "#65205a", "#8e3a80", "#b862a4", "#dc98c8"];
    const tallo = ["#3a3028", "#6e6052", "#a39481", "#cbbca6", "#e8dcc6"];
    // las raíces que se clavan en el piso
    for (const [x0, x1] of [[30, 12], [38, 24], [58, 72], [66, 86], [48, 48]]) trazo(48 + (x0 - 48) * 0.3, 70, x1, 82, (x, y) => { p.p(x, y, PAL.tierra[2]); p.p(x + 1, y, PAL.tierra[1]); });
    // el tallo, grueso, con la cara
    p.bola(48, 60, 17, 20, tallo, { luz: [-0.4, -0.5, 0.75], bajar: 0.25, trama: 0.6 });
    // la falda (el anillo del hongo)
    p.bola(48, 44, 22, 5, tallo.slice(1), { luz: [-0.3, -0.9, 0.3] });
    for (let x = 27; x < 70; x += 3) if (p.g(x, 48)) { p.p(x, 48, tallo[1]); p.p(x, 49, tallo[1]); }
    // el sombrero enorme, con las laminillas abajo
    const ala = (x) => Math.round(36 + 4 * Math.pow((x + 0.5 - 48) / 46, 2));
    p.bola(48, 26, 46, 22, cap, { filtro: (x, y) => y <= ala(x), luz: [-0.5, -0.65, 0.55], bajar: 0.12 });
    for (let x = 4; x < 92; x++) { const y = ala(x); if (p.g(x, y)) { p.p(x, y, cap[1]); if (x % 3 === 0) { p.p(x, y + 1, cap[0]); p.p(x, y + 2, cap[0]); } } }
    // las manchas del sombrero
    for (const [x, y, r] of [[26, 16, 4], [46, 9, 5], [66, 15, 4], [36, 26, 3], [60, 27, 3], [80, 24, 2], [15, 26, 2]]) {
      p.bola(x, y, r, r * 0.7, ["#8a7a6a", "#c9b9a2", "#eee2cc"], { trama: 0.3 });
    }
    // la cara, en el tallo: ojos tristes que lloran esporas (o furiosos)
    // ojos tristes (caídos hacia afuera), una X de dolor, o rojos de furia
    const ojos = k === 2 ? ["e...e", ".e.e.", "..e..", ".e.e.", "e...e"] : k === 3 ? ["rr...", ".rrr.", ".rrrr", "..rr."] : ["...ee", ".eeWe", "eeeee", ".eee."];
    parDeOjos(p, 48, 4, 54, ojos, { e: PAL.tinta, W: "#ffffff", r: "#ff3b2f" });
    // las esporas que le caen, una por ojo, en el mismo lugar espejado (el píxel p y el 95 − p)
    if (k !== 2) for (const x of [41, 95 - 41]) for (let y = 59; y < 68; y += 2) p.p(x, y, PAL.espora[(y / 2) % 2 ? 3 : 2]);
    const bocaAb = k === 1 || k === 3 ? 6 : 2;

    p.contorno(AUTO);
    return p.canvas();
  });
}

function explosionSpr(k) {

    if (k < 6) {

      // bordes deshilachados
      for (let a = 0; a < 18; a++) { const an = a / 18 * TAU, d = r + (a % 3) * 2; p.p(32 + Math.cos(an) * d, 30 + Math.sin(an) * d * 0.86, k < 4 ? PAL.fuego[2] : "#3a2c28"); }

}
function humoSpr(k) {

}
/** Una mancha para el piso (sangre, baba, esporas): una forma irregular sólida con salpicaduras. */
function manchaSpr(tipo, v) {
  return hornear(`mancha${tipo}${v}`, () => {
    const R = tipo === "baba" ? PAL.baba : tipo === "espora" ? PAL.espora : tipo === "quemado" ? ["#050404", "#0e0b0a", "#1a1512", "#241e1a"] : PAL.sangre;
    const p = new Pix(26, 20), r = mulberry(v * 31 + tipo.length), f1 = r() * TAU;
    for (let y = 0; y < 20; y++) for (let x = 0; x < 26; x++) {
      const dx = (x - 13) / 1.35, dy = y - 10, an = Math.atan2(dy, dx), rr = 6.5 * (1 + 0.25 * Math.sin(an * 3 + f1) + 0.15 * Math.sin(an * 5 + f1 * 2));
      const d0 = Math.hypot(dx, dy);
      if (d0 < rr) p.p(x, y, d0 < rr * 0.55 ? R[1] : R[tipo === "quemado" ? 2 : 2]);
    }
    for (let i = 0; i < 6; i++) { const an = r() * TAU, d = 9 + r() * 3; p.p(13 + Math.cos(an) * d * 1.35, 10 + Math.sin(an) * d, R[2]); }

  });

}

const R_ = {

/** Pie de cosas chicas que se repiten: caritas, frascos, libros, leches, gusanos. */
const DIB = {
  carita(p, x, y, r, piel, o = {}) {
    p.bola(x, y, r, r * 0.95, piel, {});
    const e = o.ojos || PAL.tinta;
    p.p(x - r * 0.4, y - 0.5, e); p.p(x + r * 0.35, y - 0.5, e);
    if (o.boca) p.p(x, y + r * 0.45, o.boca);
    if (o.cuernos) { p.p(x - r * 0.7, y - r - 0.5, o.cuernos); p.p(x + r * 0.6, y - r - 0.5, o.cuernos); p.p(x - r * 0.8, y - r + 0.5, o.cuernos); p.p(x + r * 0.7, y - r + 0.5, o.cuernos); }
  },
  frasco(p, liquido, o = {}) {
    p.bola(9, 11, 5.5, 5.5, ["#3a4a52", "#6e8894", "#a8c4d0", "#e0f0f6"], {});
    p.bola(9, 12, 4.6, 4, liquido, { filtro: (x, y) => y >= 10 });
    p.caja(7, 3, 4, 4, PAL.hierro.slice(1));
    p.rect(6, 2, 6, 1, PAL.tierra[3]);
    p.p(7, 9, "#ffffff");
    if (o.cruz) { p.rect(8, 11, 3, 1, o.cruz); p.rect(9, 10, 1, 3, o.cruz); }
  },
  libro(p, tapa, simbolo) {
    p.caja(3, 3, 12, 13, tapa, { vertical: 0.5 });
    p.rect(3, 3, 2, 13, tapa[0]);
    p.rect(14, 4, 1, 11, "#e8dcc0"); p.rect(4, 15, 10, 1, "#e8dcc0");
    if (simbolo) simbolo(p);
  },
  leche(p, liquido, tapa, marca) {
    p.caja(5, 5, 8, 11, ["#9a968e", "#d6d2ca", "#f4f1ea", "#ffffff"], { vertical: 0.2 });
    p.sello(5, 2, ["..xxxx..", ".xxxxxx.", "xxxxxxxx"], { x: tapa });
    p.rect(6, 9, 6, 4, liquido[2]); p.rect(6, 9, 6, 1, liquido[3]);
    if (marca) p.p(8.5, 11, marca);
  },
  gusano(p, rampa, forma) {
    const pts = forma;
    pts.forEach(([x, y], i) => p.bola(x, y, 2.1 - i * 0.08, 2.1 - i * 0.08, rampa, {}));
    const [hx, hy] = pts[0]; p.p(hx - 1, hy - 1, PAL.tinta); p.p(hx + 1, hy - 1, PAL.tinta);
  },
  ojo(p, iris, o = {}) {
    p.bola(9, 9, o.rx || 7, o.ry || 5.5, R_.blanco, {});

    if (o.venas) for (const [x0, y0, x1, y1] of [[3, 8, 5, 9], [14, 10, 12, 9], [5, 12, 6, 11]]) p.linea(x0, y0, x1, y1, "#c02a2a");
  },
  moscaRoja(p, x, y) { p.bola(x, y, 3, 2.6, PAL.sangre, {}); p.bola(x - 2, y - 3, 2, 1.5, ["#8a9aa8", "#c8d6e0", "#f0f6fa"], {}); p.bola(x + 2, y - 3, 2, 1.5, ["#8a9aa8", "#c8d6e0", "#f0f6fa"], {}); p.p(x - 1, y, PAL.tinta); p.p(x + 1, y, PAL.tinta); },
};

  cebolla(p) { p.bola(9, 11, 6, 5.5, ["#5a3a1a", "#9a6a2a", "#d6a24a", "#f0d08a", "#fff0c8"], {}); p.linea(9, 5, 9, 2, "#6a8a3a"); p.linea(10, 5, 12, 1, "#86a84a"); p.p(6, 11, "#3a78c0"); p.p(6, 12, "#5a98e0"); p.p(11, 11, "#3a78c0"); p.p(11, 12, "#5a98e0"); p.p(8, 14, PAL.tinta); p.p(9, 14, PAL.tinta); },

  bolaVeloz(p) { p.bola(10, 9, 5.5, 5.5, ["#1a3a6a", "#2a5aa8", "#4a86e0", "#8ab8ff", "#e0eeff"], {}); for (const y of [6, 9, 12]) p.linea(1, y, 4, y, "#8ab8ff"); p.linea(7, 5, 13, 13, "#e0eeff"); },
  cabezaGrillo(p) { p.bola(9, 9, 6.5, 6, ["#3a0a0a", "#6a1a14", "#9a2a1e", "#c84a2e", "#f07a4a"], {}); p.linea(6, 3, 3, 0, "#3a0a0a"); p.linea(12, 3, 15, 0, "#3a0a0a"); p.bola(6.5, 9, 1.6, 2, ["#ffe07a", "#fff8c8"], {}); p.bola(11.5, 9, 1.6, 2, ["#ffe07a", "#fff8c8"], {}); p.linea(7, 13, 11, 13, PAL.tinta); },
  pentagrama(p) { const pts = [0, 1, 2, 3, 4].map((k) => [9 + Math.cos(-Math.PI / 2 + k * TAU / 5) * 7, 9.5 + Math.sin(-Math.PI / 2 + k * TAU / 5) * 7]); for (let k = 0; k < 5; k++) { const a = pts[k], b = pts[(k + 2) % 5]; p.linea(a[0], a[1], b[0], b[1], "#d0201c"); } for (let a = 0; a < 24; a++) p.p(9 + Math.cos(a / 24 * TAU) * 8, 9.5 + Math.sin(a / 24 * TAU) * 8, "#7a0a10"); },
  marca(p) { p.bola(9, 9, 7, 7, ["#3a0408", "#7a0a10", "#a8141a"], {}); p.sello(5, 4, ["..#..#..", "..#..#..", "########", "..#..#..", "..#..#..", "########", "..#..#..", "..#..#.."], { "#": "#ff6a5a" }); },
  elPacto(p) { p.caja(3, 2, 12, 15, ["#8a7a60", "#c8b89a", "#ecdfc8", "#f8f0e0"], { vertical: 0.3 }); for (let y = 4; y < 12; y += 2) p.linea(5, y, 12, y, "#8a7a60"); p.linea(5, 14, 10, 13, "#a8141a"); p.bola(12, 13, 1.8, 1.8, PAL.sangre.slice(1), {}); },
  sangreMartir(p) { p.bola(9, 11, 5.5, 5, PAL.sangre, {}); for (let i = 0; i < 5; i++) p.p(9, 3 + i, PAL.sangre[3 - (i > 2 ? 1 : 0)]); p.bola(9, 5, 5, 1.5, PAL.oro.slice(2), { filtro: (x, y) => Math.abs(y - 5) >= 1 }); p.p(7, 9, "#ffd0c0"); },
  aureola(p) { for (let a = 0; a < 40; a++) { const an = a / 40 * TAU, x = 9 + Math.cos(an) * 7, y = 9 + Math.sin(an) * 3.2; p.p(x, y, an < Math.PI ? PAL.oro[3] : PAL.oro[4]); p.p(x, y + 1, PAL.oro[2]); } },
  rosario(p) { for (let a = 0; a < 14; a++) { const an = a / 14 * TAU; p.bola(9 + Math.cos(an) * 5.5, 7 + Math.sin(an) * 5, 1.2, 1.2, ["#5a3a1a", "#9a6a3a", "#d6a26a"], {}); } p.rect(8, 12, 2, 6, PAL.oro[3]); p.rect(6, 14, 6, 2, PAL.oro[3]); },
  corazonSagrado(p) { ICONOS._copiar(p, corazonSpr("rojo"), 4, 5); p.bola(9, 3, 3, 1.2, PAL.oro.slice(2), {}); for (const [x, y] of [[2, 5], [16, 5], [1, 10], [17, 10]]) p.p(x, y, PAL.oro[4]); },
  // ── armas ──
  rayo(p) { p.bola(9, 6, 6, 5, ["#2a0406", "#5a0a0e", "#8a1418", "#b82a2a", "#e05a4a"], {}); p.p(6, 6, "#fff0e0"); p.p(11, 6, "#fff0e0"); p.rect(7, 10, 4, 7, "#c8141a"); p.rect(8, 10, 2, 7, "#ff8a6a"); p.p(4, 1, "#3a0408"); p.p(13, 1, "#3a0408"); p.p(5, 2, "#3a0408"); p.p(12, 2, "#3a0408"); },

  feto(p) { p.bola(9, 9, 7, 7, ["#3a4a52", "#6e8894", "#a8c4d0", "#e0f0f6"], {}); p.bola(9, 10, 4.5, 4, PAL.piel, {}); p.bola(11, 8, 2.5, 2.5, PAL.piel, {}); p.p(12, 8, PAL.tinta); ICONOS._copiar(p, bombaSpr(0.5), 2, 7); p.p(6, 5, "#ffffff"); },

  ludovico(p) { p.bola(9, 9, 6.5, 6.5, PAL.espora, {}); for (let a = 0; a < 28; a++) { const an = a / 28 * TAU; p.p(9 + Math.cos(an) * 8, 9 + Math.sin(an) * 8, (a & 1) ? PAL.espora[3] : null); } p.p(7, 6, "#ffffff"); p.p(6, 7, "#ffffff"); },

  cuadruple(p) { p.bola(9, 9, 4, 3.5, R_.negro.slice(1), {}); for (const s of [-1, 1]) for (const k of [0, 1, 2, 3]) { const y = 6 + k * 2; p.linea(9 + s * 3, y, 9 + s * 7, y - 2 + k, R_.negro[2]); } for (const [x, y] of [[7, 8], [11, 8], [8, 10], [10, 10]]) p.p(x, y, "#ff3a2a"); },
  veinte(p) { for (const x of [5, 13]) { p.bola(x, 9, 3.6, 3.6, ["#9fd6ee", "#cfefff", "#ffffff"], {}); for (let a = 0; a < 20; a++) p.p(x + Math.cos(a / 20 * TAU) * 4, 9 + Math.sin(a / 20 * TAU) * 4, PAL.tierra[2]); } p.linea(8, 8, 10, 8, PAL.tierra[2]); p.linea(1, 8, 0, 6, PAL.tierra[2]); p.linea(17, 8, 18, 6, PAL.tierra[2]); p.rect(3, 9, 5, 1, "#5a8aa8"); p.rect(11, 9, 5, 1, "#5a8aa8"); },

  ojoMuerto(p) { DIB.ojo(p, ["#3a3a3a", "#6a6a6a", "#9a9a9a"], { rx: 7, ry: 5.5, ri: 3 }); p.linea(3, 3, 15, 15, PAL.sangre[3]); p.linea(15, 3, 3, 15, PAL.sangre[3]); },

  antigrav(p) { for (const [x, y] of [[5, 5], [12, 4], [8, 10], [14, 11]]) p.bola(x, y, 2.4, 2.4, PAL.espora.slice(1), {}); for (const x of [3, 8, 13]) p.linea(x, 14, x, 17, "#8ab4f0"); p.linea(2, 15, 3, 14, "#8ab4f0"); p.linea(4, 15, 3, 14, "#8ab4f0"); },
  grillo(p) { p.bola(9, 11, 5, 4.5, ["#3a0a0a", "#6a1a14", "#9a2a1e", "#c84a2e"], {}); p.bola(9, 5.5, 3, 2.6, ["#3a0a0a", "#6a1a14", "#9a2a1e", "#c84a2e"], {}); for (const s of [-1, 1]) { p.linea(9 + s * 4, 11, 9 + s * 8, 7, "#3a0a0a"); p.linea(9 + s * 3, 14, 9 + s * 7, 17, "#3a0a0a"); } },
  parasito(p) { DIB.gusano(p, R_.rosa.slice(1), [[5, 5], [7, 7], [9, 9], [11, 11], [13, 13]]); p.bola(13, 5, 2, 2, PAL.espora.slice(2), {}); p.bola(5, 13, 2, 2, PAL.espora.slice(2), {}); },

  pegajosa(p) { p.bola(9, 10, 6, 5.5, R_.verde.slice(1), {}); ICONOS._copiar(p, bombaSpr(0.55), 3, 1); for (const [x, y] of [[4, 15], [13, 15]]) p.linea(x, y - 1, x, y + 1, R_.verde[3]); },
  raizElectrica(p) { p.linea(9, 1, 6, 7, "#ffe07a"); p.linea(6, 7, 11, 9, "#ffe07a"); p.linea(11, 9, 7, 16, "#ffe07a"); p.linea(10, 1, 7, 7, "#fff8c8"); p.linea(7, 7, 12, 9, "#fff8c8"); for (const [x, y] of [[3, 12], [14, 4], [15, 12]]) p.p(x, y, "#c8e8ff"); },

  amorDuro(p) { p.sello(4, 2, [".######.", "########", "########", "########", "#######.", "##..###.", "##...##.", ".#....#.", ".#....#."], { "#": "x" }); for (let y = 0; y < 18; y++) for (let x = 0; x < 18; x++) if (p.g(x, y)) p.p(x, y, x < 7 && y < 6 ? "#ffffff" : y > 7 ? "#c8bca8" : "#ece4d4"); },
  eutanasia(p) { p.linea(2, 16, 12, 6, PAL.hierro[4]); p.caja(10, 3, 5, 5, ["#6e8894", "#a8c4d0", "#e0f0f6"]); p.rect(11, 4, 3, 3, "#9a2a2a"); p.linea(14, 2, 16, 0, PAL.hierro[3]); p.p(1, 17, "#ffffff"); },

  materiaOscura(p) { p.bola(9, 9, 7, 7, R_.negro, {}); for (let a = 0; a < 12; a++) { const an = a / 12 * TAU + 0.3; p.p(9 + Math.cos(an) * (3 + a % 3), 9 + Math.sin(an) * (3 + a % 3), a % 2 ? "#5a3a8a" : "#8a5cc0"); } p.p(9, 9, "#c19ae8"); },
  lentesAbuela(p) { for (const x of [5, 13]) { p.bola(x, 9, 3.5, 3, ["#8ad0c0", "#c8f0e8", "#f0fffa"], {}); for (let a = 0; a < 20; a++) p.p(x + Math.cos(a / 20 * TAU) * 4, 9 + Math.sin(a / 20 * TAU) * 3.5, "#d86a8e"); } p.linea(8, 8, 10, 8, "#d86a8e"); },
  perfumeAbuela(p) { p.bola(9, 12, 5, 4.5, R_.rosa, {}); p.caja(8, 5, 2, 3, PAL.oro.slice(2)); p.bola(9, 3.5, 2, 1.6, PAL.oro.slice(2), {}); p.bola(14, 3, 2, 1.6, R_.rosa.slice(2), {}); p.linea(11, 4, 13, 3, "#8a4a5a"); p.p(7, 10, "#fff"); },
  labialAbuela(p) { p.caja(6, 9, 6, 8, PAL.oro.slice(1)); p.caja(7, 4, 4, 5, PAL.sangre.slice(1)); p.sello(7, 2, ["..##", ".###", "####"], { "#": PAL.sangre[3] }); p.p(8, 5, PAL.sangre[4]); },
  tacosAbuela(p) { p.sello(1, 5, ["......####", ".....#####", "....######", "###.######", "##########", "#########.", "#.......#.", "#.......#."], { "#": "x" }); for (let y = 0; y < 18; y++) for (let x = 0; x < 18; x++) if (p.g(x, y)) p.p(x, y, y < 9 ? "#d0201c" : y < 11 ? "#8a0a10" : "#3a0408"); },

  cabezaTendero(p) { DIB.carita(p, 9, 10, 6.5, ["#3a3a3a", "#6a6a6a", "#9a9a9a", "#c8c8c8"], { ojos: "#fff", boca: "#1a1a1a" }); ICONOS._copiar(p, monedaSpr(0), 4, 0); p.linea(5, 14, 13, 14, PAL.tinta); for (const x of [6, 8, 10, 12]) p.p(x, 15, PAL.tinta); },
  atractor(p) { p.bola(9, 9, 6, 6, ["#1a1a3a", "#2a2a6a", "#4a4aa8"], {}); for (let a = 0; a < 3; a++) for (let r = 2; r < 8; r += 0.5) p.p(9 + Math.cos(a * TAU / 3 + r * 0.6) * r, 9 + Math.sin(a * TAU / 3 + r * 0.6) * r, "#c8c8ff"); },

// ── los sprites de las armas ──
function cuchilloSpr() {
  return hornear("cuchilloArma", () => {
    const p = new Pix(22, 7);
    p.caja(0, 2, 7, 3, PAL.tierra.slice(2), { vertical: 0.7 });
    p.rect(7, 1, 2, 5, PAL.hierro[2]);
    for (let x = 9; x < 22; x++) { const h = x > 18 ? 22 - x : 2; for (let y = 0; y < h; y++) p.p(x, 3 - (y ? 1 : 0) + (y > 1 ? -1 : 0) + 0, y ? "#dfe4e8" : "#9aa2aa"); p.p(x, 4, "#6a7278"); if (x < 20) p.p(x, 2, "#f6f8fa"); }
    p.contorno(AUTO);
    return p.canvas();
  });
}
function misilSpr() {
  return hornear("misil", () => {
    const p = new Pix(10, 20);
    p.caja(3, 2, 4, 13, PAL.hierro.slice(1), { vertical: 0.2 });
    p.bola(5, 15, 2, 3, R_.rojoV, {});

}
function proyectilSpr(tipo) {
  return hornear(`proy${tipo}`, () => {
    const p = new Pix(10, 7);
    if (tipo === "aguja") { p.linea(0, 3, 7, 3, PAL.hierro[4]); p.rect(6, 2, 3, 3, "#a8c4d0"); p.p(7, 3, "#9a2a2a"); }
    else if (tipo === "hueso") { p.rect(2, 2, 6, 2, R_.blanco[3]); p.bola(2, 2, 1.5, 1.5, R_.blanco.slice(2), {}); p.bola(2, 4, 1.5, 1.5, R_.blanco.slice(2), {}); p.bola(8, 2, 1.5, 1.5, R_.blanco.slice(2), {}); p.bola(8, 4, 1.5, 1.5, R_.blanco.slice(2), {}); }
    else { p.sello(2, 0, [".####.", "######", "######", "##.###", "#...##", "#....#"], { "#": "#ece4d4" }); p.p(3, 1, "#ffffff"); }
    p.contorno(AUTO);
    return p.canvas();
  });
}
function baratijaSpr(id) {
  return hornear(`baratija${id}`, () => {
    const s = iconoSpr(id), c = lienzoNuevo(14, 14), g = c.getContext("2d");
    g.imageSmoothingEnabled = true; g.drawImage(s, 0, 0, 14, 14);
    return c;
  });
}
/** Los familiares sin cara de bebé (ángel, pelos, gordito, cerebro, sanguijuela, bolsa, araña). */
function familiarSpr(tipo, k) {
  const id = { angel: "angelGuardian", pelos: "bolaPelos", gordito: "gordito", cerebro: "cerebroPodrido", sanguijuela: "sanguijuela", bolsa: "bolsaCentavos", aranaFam: "bebeArana" }[tipo];
  if (!id) return null;
  return hornear(`fam${tipo}${k}`, () => {
    const s = iconoSpr(id), c = lienzoNuevo(15, 15 + k), g = c.getContext("2d");
    g.imageSmoothingEnabled = true; g.drawImage(s, 0, k, 15, 15);
    return c;
  });
}

  ["oo.........oo", "o...........o", "....e...e....", ".............", "....e...e....", "o...........o", "oo.........oo"],
  [".............", "...H.....H...", "..HHe...eHH..", ".............", "..HHe...eHH..", "...H.....H...", "............."],
  [".............", ".....b.b.....", "..e.......e..", ".............", "..e.......e..", ".....b.b.....", "............."],
  ["..xx.....xx..", "..x...e...x..", ".............", ".....vvv.....", ".............", "..x...e...x..", "..xx.....xx.."],

  [".............", ".ooooo.ooooo.", ".o.e.....e.o.", ".............", ".o.e.....e.o.", ".ooooo.ooooo.", "............."],
  ["R............", ".....rrr.....", "..e..r.r..e..", ".............", "..e.......e..", ".....rrr.....", "............R"],
  [".............", ".e...m.m...e.", "....m...m....", "......E......", "....m...m....", ".e...m.m...e.", "............."],
  [".............", "..rrr...rrr..", "..r.e...e.r..", ".............", "..r.e...e.r..", "..rrr...rrr..", "............."],
  ["b.....r.....b", "..e.......e..", ".............", "..r.......r..", ".............", "..e.......e..", "b.....r.....b"],
  [".............", ".mmmm...mmmm.", ".............", "...e..e..e...", ".............", ".mmmm...mmmm.", "............."],
  ["..o.......o..", "..o..e.e..o..", "..o.......o..", ".............", "..o.......o..", "..o..e.e..o..", "..o.......o.."],
  [".............", ".............", "...e.rrr.e...", "....r...r....", "...e.rrr.e...", ".............", "............."],
];
const DISENO_JEFE = [".............", ".r.........r.", ".............", "......j......", ".............", ".r.........r.", "............."];
const DISENO_JEFE_FINAL = [".............", ".............", ".............", "......j......", ".............", "b...........b", "............."];
const DISENO_INICIO = [".............", ".............", ".............", ".............", ".............", ".............", "............."];
const DISENO_TESORO = [".............", ".............", ".....r.r.....", ".............", ".....r.r.....", ".............", "............."];
const DISENO_TIENDA = [".............", ".............", ".............", ".............", ".............", ".............", "............."];
const DISENO_SECRETA = [".............", ".r.........r.", ".............", ".............", ".............", ".r.........r.", "............."];
const DISENO_PACTO = ["b...........b", ".............", ".............", ".............", ".............", ".............", "b...........b"];

const PUERTA_CELDA = [[6, 0], [12, 3], [6, 6], [0, 3]];
const SOLIDOS = new Set(["roca", "bloque", "barril", "brasero", "matas"]);

/** ¿Desde cualquier puerta se llega a las demás, y a cada enemigo que camina? (BFS por la grilla) */
function disenoValido(d) {
  const libre = (c, f) => c >= 0 && f >= 0 && c < COLS && f < FILAS && ".xevEj".includes(d[f][c]);
  for (const [c, f] of PUERTA_CELDA) if (!libre(c, f)) return false;
  const vis = new Set(["6,0"]), cola = [[6, 0]];
  while (cola.length) { const [c, f] = cola.shift(); for (const [dx, dy] of DIRS) { const k = `${c + dx},${f + dy}`; if (!vis.has(k) && libre(c + dx, f + dy)) { vis.add(k); cola.push([c + dx, f + dy]); } } }
  for (const [c, f] of PUERTA_CELDA) if (!vis.has(`${c},${f}`)) return false;
  return true;
}
const DISENOS_OK = DISENOS.filter((d) => d.length === FILAS && d.every((f) => f.length === COLS) && disenoValido(d));

/** Arma la grilla de obstáculos de una sala desde su diseño; devuelve los lugares de enemigos. */
function armarGrilla(sala, diseno) {
  sala.celdas = new Array(COLS * FILAS).fill(null);
  const huecos = [];
  const espejarX = sala.espejo & 1, espejarY = sala.espejo & 2;
  for (let f = 0; f < FILAS; f++) for (let c = 0; c < COLS; c++) {
    const ch = diseno[espejarY ? FILAS - 1 - f : f][espejarX ? COLS - 1 - c : c];
    let o = null;
    if (ch === "r") o = { t: "roca", v: A.ent(0, 2) };
    else if (ch === "R") o = { t: "roca", v: 1, marcada: true };
    else if (ch === "m") o = { t: "matas", vida: 4, dorada: A.si(0.04) };
    else if (ch === "b") o = { t: "brasero", vida: 4, prendido: true };
    else if (ch === "o") o = { t: "pozo" };
    else if (ch === "x") o = { t: "pinchos" };
    else if (ch === "B") o = { t: "barril", vida: 3 };
    else if (ch === "H") o = { t: "bloque" };
    else if ("eEvj".includes(ch)) huecos.push({ c, f, tipo: ch });
    sala.celdas[f * COLS + c] = o;
  }
  // a veces, una roca normal viene marcada
  for (const o of sala.celdas) if (o && o.t === "roca" && !o.marcada && A.si(0.012)) o.marcada = true;
  return huecos;
}
function celda(sala, c, f) { return c >= 0 && f >= 0 && c < COLS && f < FILAS ? sala.celdas[f * COLS + c] : null; }
function esSolida(o, vuela) {
  if (!o) return false;
  if (o.t === "pozo") return !vuela;
  if (o.t === "matas") return o.vida > 0 && !vuela;
  if (o.t === "brasero") return o.prendido && !vuela;   // apagado queda la ceniza, que se pisa
  return SOLIDOS.has(o.t) && !vuela;
}
/** ¿Frena una lágrima? (los pozos no; las rocas sí, salvo las espectrales) */
function frenaLagrima(o) { return !!o && o.t !== "pozo" && o.t !== "pinchos" && !(o.t === "matas" && o.vida <= 0) && !(o.t === "brasero" && !o.prendido); }

/** Mueve un círculo por la sala chocando con la grilla y los muros. lim: {x0,y0,x1,y1} (los bordes que se pueden pasar). */
function moverEnSala(sala, e, dx, dy, vuela, bordes) {
  const r = e.r;
  const chocar = (eje) => {
    const c0 = celdaX(e.x - r), c1 = celdaX(e.x + r), f0 = celdaY(e.y - r), f1 = celdaY(e.y + r);
    for (let f = f0; f <= f1; f++) for (let c = c0; c <= c1; c++) {
      if (!esSolida(celda(sala, c, f), vuela)) continue;
      const bx0 = IX0 + c * T + 1, by0 = IY0 + f * T + 1, bx1 = bx0 + T - 2, by1 = by0 + T - 2;
      const px = lim(e.x, bx0, bx1), py = lim(e.y, by0, by1), ddx = e.x - px, ddy = e.y - py, d2 = ddx * ddx + ddy * ddy;
      if (d2 >= r * r) continue;
      if (eje === 0) { e.x = dx > 0 ? bx0 - r : dx < 0 ? bx1 + r : e.x; if (dx === 0) { const d = Math.sqrt(d2) || 1; e.x = px + ddx / d * r; } }
      else { e.y = dy > 0 ? by0 - r : dy < 0 ? by1 + r : e.y; if (dy === 0) { const d = Math.sqrt(d2) || 1; e.y = py + ddy / d * r; } }
      e.choco = true;
    }
  };
  e.choco = false;
  e.x += dx; chocar(0);
  e.y += dy; chocar(1);
  const b = bordes || { x0: IX0, y0: IY0, x1: IX1, y1: IY1 };
  if (e.x < b.x0 + r) { e.x = b.x0 + r; e.choco = true; } if (e.x > b.x1 - r) { e.x = b.x1 - r; e.choco = true; }
  if (e.y < b.y0 + r) { e.y = b.y0 + r; e.choco = true; } if (e.y > b.y1 - r) { e.y = b.y1 - r; e.choco = true; }
}

/** El mapa de distancias hasta un punto (para que los que caminan rodeen las rocas). */
function campoHacia(sala, x, y, vuela = false) {
  const dist = new Int16Array(COLS * FILAS).fill(-1), c0 = lim(celdaX(x), 0, COLS - 1), f0 = lim(celdaY(y), 0, FILAS - 1), cola = [c0 + f0 * COLS];
  dist[cola[0]] = 0;
  for (let i = 0; i < cola.length; i++) {
    const k = cola[i], c = k % COLS, f = (k / COLS) | 0;
    for (const [dx, dy] of DIRS) {
      const C = c + dx, F = f + dy;
      if (C < 0 || F < 0 || C >= COLS || F >= FILAS) continue;
      const K = F * COLS + C;
      if (dist[K] >= 0 || esSolida(sala.celdas[K], vuela)) continue;
      dist[K] = dist[k] + 1; cola.push(K);
    }
  }
  return dist;
}
/** Hacia dónde ir desde (x, y) bajando por el campo (o directo si está en la misma celda o sin camino). */
function pasoCampo(sala, dist, e, objX, objY) {
  const c = celdaX(e.x), f = celdaY(e.y), k = f * COLS + c;
  if (c < 0 || f < 0 || c >= COLS || f >= FILAS || dist[k] <= 1) { const d = Math.hypot(objX - e.x, objY - e.y) || 1; return [(objX - e.x) / d, (objY - e.y) / d]; }
  let mejor = null, md = dist[k];
  for (const [dx, dy] of DIRS) { const C = c + dx, F = f + dy; if (C < 0 || F < 0 || C >= COLS || F >= FILAS) continue; const v = dist[F * COLS + C]; if (v >= 0 && v < md) { md = v; mejor = [C, F]; } }
  if (!mejor) { const d = Math.hypot(objX - e.x, objY - e.y) || 1; return [(objX - e.x) / d, (objY - e.y) / d]; }
  const tx = cx(mejor[0]), ty = cy(mejor[1]), d = Math.hypot(tx - e.x, ty - e.y) || 1;
  return [(tx - e.x) / d, (ty - e.y) / d];
}

// ══════════ 11-piso.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL PISO: el mapa de salas, generado como en el original. Una grilla de 9×8; desde la sala
// de inicio (4,3) se expande a lo ancho: cada vecino se agrega salvo que ya esté lleno, que ya
// tenga 2 vecinos llenos (así no se forman bloques y quedan pasillos y puntas), que se haya
// llegado a la cuota, o que salga cara en una moneda (50 %). Salas = azar(0..1) + 5 + piso × 2,6.
// El jefe va en la punta más lejana; el tesoro y la tienda en otras puntas; la secreta en un
// hueco rodeado por 3 salas o más (que se abre con una bomba). Si no alcanzan las puntas, se
// vuelve a tirar.
// ─────────────────────────────────────────────────────────────────────────────

const MAPA_W = 9, MAPA_H = 8, MAPA_INICIO = [4, 3];
const PISOS = [
  null,
  { cap: "sotano", nombre: "SÓTANO HÚMEDO I", musica: "sotano" },
  { cap: "sotano", nombre: "SÓTANO HÚMEDO II", musica: "sotano" },
  { cap: "raices", nombre: "LAS RAÍCES I", musica: "raices" },
  { cap: "raices", nombre: "LAS RAÍCES II", musica: "raices" },
];
const ULTIMO_PISO = 4;

function generarPiso(n) {
  for (let i = 0; i < 400; i++) { const p = intentarPiso(n); if (p) return p; }
  throw new Error("no se pudo generar el piso " + n);
}

function intentarPiso(n) {
  const meta = Math.min(19, A.ent(0, 1) + 5 + Math.floor(n * 2.6));
  const K = (c, f) => c + f * MAPA_W, dentro = (c, f) => c >= 0 && f >= 0 && c < MAPA_W && f < MAPA_H;
  const lleno = new Uint8Array(MAPA_W * MAPA_H);
  const vecinos = (c, f) => { let s = 0; for (const [dx, dy] of DIRS) if (dentro(c + dx, f + dy) && lleno[K(c + dx, f + dy)]) s++; return s; };
  const [c0, f0] = MAPA_INICIO;
  lleno[K(c0, f0)] = 1;
  let cuenta = 1;
  const cola = [[c0, f0]], orden = [[c0, f0]];
  while (cola.length) {
    const [c, f] = cola.shift();
    for (const [dx, dy] of DIRS) {
      const C = c + dx, F = f + dy;
      if (!dentro(C, F) || lleno[K(C, F)] || vecinos(C, F) > 1 || cuenta >= meta || A.si(0.5)) continue;
      lleno[K(C, F)] = 1; cuenta++; cola.push([C, F]); orden.push([C, F]);
    }
  }
  if (cuenta < meta) return null;

  // distancias desde el inicio (en salas)
  const dist = new Int16Array(MAPA_W * MAPA_H).fill(-1), q = [[c0, f0]];
  dist[K(c0, f0)] = 0;
  while (q.length) { const [c, f] = q.shift(); for (const [dx, dy] of DIRS) { const C = c + dx, F = f + dy; if (dentro(C, F) && lleno[K(C, F)] && dist[K(C, F)] < 0) { dist[K(C, F)] = dist[K(c, f)] + 1; q.push([C, F]); } } }

  const puntas = orden.filter(([c, f]) => !(c === c0 && f === f0) && vecinos(c, f) === 1);
  if (puntas.length < 3) return null;
  puntas.sort((a, b) => dist[K(b[0], b[1])] - dist[K(a[0], a[1])]);
  const jefe = puntas[0];
  if (dist[K(jefe[0], jefe[1])] < 3) return null;
  const resto = A.mezclar(puntas.slice(1));
  const tesoro = resto[0], tienda = resto[1];

  // la secreta: el hueco con más salas alrededor (3 o más; si no hay, 2), lejos del jefe
  let secreta = null, mejor = 0;
  for (let f = 0; f < MAPA_H; f++) for (let c = 0; c < MAPA_W; c++) {
    if (lleno[K(c, f)]) continue;
    const v = vecinos(c, f);
    if (v < 2) continue;
    if (Math.abs(c - jefe[0]) + Math.abs(f - jefe[1]) === 1) continue;
    const nota = v * 10 + A.f();
    if (nota > mejor) { mejor = nota; secreta = [c, f]; }
  }

  const piso = { n, cap: PISOS[n].cap, nombre: PISOS[n].nombre, salas: new Map(), inicio: null, jefe: null };
  const nueva = (c, f, tipo) => {
    const sala = { c, f, tipo, clave: K(c, f), semilla: A.ent(1, 2e9), espejo: A.ent(0, 3), visitada: false, vista: false,
      limpia: tipo !== "normal" && tipo !== "jefe", cosas: [], decal: null, celdas: null, huecos: [], puertas: [null, null, null, null] };
    let d = DISENO_INICIO;
    if (tipo === "normal") d = A.uno(DISENOS_OK);
    else if (tipo === "jefe") d = n === ULTIMO_PISO ? DISENO_JEFE_FINAL : DISENO_JEFE;
    else if (tipo === "tesoro") d = DISENO_TESORO;
    else if (tipo === "tienda") d = DISENO_TIENDA;
    else if (tipo === "secreta") d = DISENO_SECRETA;
    else if (tipo === "pacto") d = DISENO_PACTO;
    if (tipo !== "normal") sala.espejo = 0;
    sala.huecos = armarGrilla(sala, d);
    piso.salas.set(sala.clave, sala);
    return sala;
  };
  for (const [c, f] of orden) {
    let tipo = "normal";
    if (c === c0 && f === f0) tipo = "inicio";
    else if (c === jefe[0] && f === jefe[1]) tipo = "jefe";
    else if (c === tesoro[0] && f === tesoro[1]) tipo = "tesoro";
    else if (c === tienda[0] && f === tienda[1]) tipo = "tienda";
    nueva(c, f, tipo);
  }
  if (secreta) nueva(secreta[0], secreta[1], "secreta");
  piso.inicio = piso.salas.get(K(c0, f0));
  piso.jefe = piso.salas.get(K(jefe[0], jefe[1]));

  // las puertas (de los dos lados)
  for (const s of piso.salas.values()) for (let d = 0; d < 4; d++) {
    const C = s.c + DIRS[d][0], F = s.f + DIRS[d][1];
    if (!dentro(C, F)) continue;
    const o = piso.salas.get(K(C, F));
    if (!o) continue;
    const esp = (x) => x.tipo === "secreta";
    s.puertas[d] = {
      destino: o,
      tipo: tipoPuerta(s, o),
      llave: n >= 2 && (o.tipo === "tesoro" || o.tipo === "tienda" || s.tipo === "tesoro" || s.tipo === "tienda") && !esp(s) && !esp(o),
      secreta: esp(s) || esp(o),
      revelada: false,
    };
  }
  // la puerta con llave es UNA (se abre de un lado y queda abierta de los dos)
  for (const s of piso.salas.values()) for (let d = 0; d < 4; d++) { const p = s.puertas[d]; if (p && !p.par) { const o = p.destino.puertas[opuesta(d)]; p.par = o; o.par = p; } }
  llenarSalasEspeciales(piso);
  return piso;
}

function tipoPuerta(a, b) {
  for (const t of ["secreta", "jefe", "pacto", "tesoro", "tienda"]) if (a.tipo === t || b.tipo === t) return t === "secreta" ? "secreta" : t;
  return "normal";
}

/** Lo que hay en el tesoro, la tienda y la secreta (lo demás aparece al limpiar). */
function llenarSalasEspeciales(piso) {
  for (const s of piso.salas.values()) {
    if (s.tipo === "tesoro") s.cosas.push(pedestal(cx(6), cy(3), sacarObjeto("tesoro")));
    if (s.tipo === "tienda") {
      const ofertas = [
        { t: "objeto", id: sacarObjeto("tienda"), precio: 15 },
        { t: "corazon", sub: "rojo", precio: 3 },
        A.si(0.5) ? { t: "bomba", precio: 5 } : { t: "capsula", sub: A.ent(0, COLORES_CAPSULA.length - 1), precio: 4 },
        { t: "llave", precio: 5 },
        A.si(0.45) ? { t: "corazon", sub: "espora", precio: 5 } : { t: "objeto", id: sacarObjeto("tienda"), precio: 15 },
      ];
      ofertas.forEach((o, i) => {
        const x = cx(2 + i * 2), y = cy(3);
        if (o.t === "objeto") s.cosas.push(Object.assign(pedestal(x, y, o.id), { precio: o.precio }));
        else s.cosas.push(Object.assign(recogible(o.t, x, y, o.sub), { precio: o.precio, quieto: true }));
      });
      s.tendero = true;
    }
    if (s.tipo === "secreta") {
      if (A.si(0.3)) s.cosas.push(pedestal(cx(6), cy(3), sacarObjeto("secreta")));
      else {
        const n = A.ent(3, 5);
        for (let i = 0; i < n; i++) s.cosas.push(recogible(A.pesos([["moneda", 5], ["bomba", 2], ["llave", 1], ["corazon", 2]]), cx(4 + (i % 5)), cy(2 + ((i / 5) | 0) * 2 + (i % 2)), "espora"));
      }
    }
  }
}

/** La sala del pacto (no está en el mapa: se abre desde la del jefe si hubo suerte). */
function crearSalaPacto(piso, desde, dir) {
  const s = { c: -1, f: -1, tipo: "pacto", clave: -1, semilla: A.ent(1, 2e9), espejo: 0, visitada: false, vista: false, limpia: true, cosas: [], decal: null, celdas: null, huecos: [], puertas: [null, null, null, null] };
  s.huecos = armarGrilla(s, DISENO_PACTO);
  const ofertas = A.si(0.5) ? 2 : 1;
  for (let i = 0; i < ofertas; i++) {
    const id = sacarObjeto("pacto");
    s.cosas.push(Object.assign(pedestal(ofertas === 1 ? cx(6) : cx(4 + i * 4), cy(3), id), { pacto: OBJETOS[id] && OBJETOS[id].calidad >= 3 ? 2 : 1 }));
  }
  const p = { destino: desde, tipo: "pacto", llave: false, secreta: false, revelada: true };
  s.puertas[opuesta(dir)] = p;
  const q = { destino: s, tipo: "pacto", llave: false, secreta: false, revelada: true, par: p };
  p.par = q;
  desde.puertas[dir] = q;
  return s;
}

/** ¿La puerta se ve? (las secretas, sólo después de volarlas) */
function puertaVisible(p) { return p && (!p.secreta || p.revelada); }

// ── las maldiciones: el piso puede venir maldito (se anuncia en la etiqueta de pergamino) ──
const MALDICIONES = {
  ciego: { texto: "¡Maldición del ciego!" },            // los objetos se ven como un ? rojo hasta tomarlos
  oscuridad: { texto: "¡Maldición de la oscuridad!" },   // sólo se ve alrededor de Shumio
  extraviado: { texto: "¡Maldición del extraviado!" },   // no hay minimapa
  desconocido: { texto: "¡Maldición de lo desconocido!" }, // no se ve cuánta vida queda
};
/** Una por piso como mucho; en el primero, rara (la probabilidad es de balance propio). */
function sortearMaldicion(n) {
  if (!A.si(n === 1 ? 0.12 : 0.28)) return null;
  return A.uno(Object.keys(MALDICIONES));
}

// ══════════ 12-jugador.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// SHUMIO: moverse con inercia corta, llorar esporas en 4 direcciones y las cuentas del
// original. Retardo entre lágrimas = 16 − 6·√(1,3·L + 1) (en cuadros de 30 Hz), daño =
// 3,5·√(1 + 1,2·D) + plano, alcance 6,5 baldosas, velocidad 1 (tope 2). La cabeza mira hacia
// donde llora y cierra los ojos al soltar la lágrima; el cuerpo, hacia donde camina.
// ─────────────────────────────────────────────────────────────────────────────

function nuevoJugador() {
  const j = {
    x: cx(6), y: cy(3), r: 5, vx: 0, vy: 0, z: 0,
    cont: 6, vida: 6,                            // en medios corazones
    almas: [],                                   // los de espora y los negros, de a medio: "e" o "n" (van al final de la barra)
    monedas: 0, bombas: 1, llaves: 0,
    // lo que suman las cápsulas y los pactos (lo de los objetos se recalcula siempre desde la lista)
    extra: { dano: 0, plano: 0, lag: 0, fr: 0, vel: 0, alc: 0, velLag: 0, suerte: 0 },

// ── las cuentas (las del original, pasadas a 60 Hz). No se tocan a mano: cada objeto DECLARA lo
//    que suma (st), lo que multiplica y qué banderas trae (f), y recalcular() rearma todo desde la
//    lista. Así los objetos se combinan solos, como en el original, y sacar uno (el dado) no deja

const MULTIPLICA = new Set(["mult", "frMult", "alcMult", "velLagMult", "tam"]);

function actualizarJugador(j) {

    if (J.t % 5 === 0) danarEnemigo(e, j.f.tacos ? 12 : 0.5);

/** Cuánto dura levantar un objeto: 0,8 s (medido en el video, 12 cuadros a 15 por segundo). */
const LEVANTA = 48;

/** Los pedestales son un bloque firme (caja) y los cofres se empujan (como en el original): Shumio
 *  choca contra ellos y, al tocarlos, los usa. */
const RADIO_SOLIDO = { objeto: 10, cofre: 8, cofreFinal: 14 };
function chocarConCosas(e) {
  for (const c of J.sala.cosas) {
    if (c.t === "objeto") {
      // la caja del pedestal: 20×12, apoyada en su base
      const x0 = c.x - 10, x1 = c.x + 10, y0 = c.y - 8, y1 = c.y + 4;
      const px = lim(e.x, x0, x1), py = lim(e.y, y0, y1), dx = e.x - px, dy = e.y - py, d = Math.hypot(dx, dy);

      if (d >= m) continue;

      if (c.t === "cofre") {            // se empuja: el cofre se corre y choca con las paredes
        const antes = [c.x, c.y];
        c.r = R; moverEnSala(J.sala, c, nx * falta * 0.8, ny * falta * 0.8, false);
        const movido = Math.hypot(c.x - antes[0], c.y - antes[1]);
        const resto = Math.max(0, falta - movido);
        e.x -= nx * resto; e.y -= ny * resto;
      } else { e.x -= nx * falta; e.y -= ny * falta; }

    }

}

function alitaSpr(k) {

    const p = new Pix(12, 12);
    p.bola(6, k ? 6 : 5, 5, k ? 4 : 5, ["#3a3226", "#6e6048", "#a8966e", "#d6c69a"], { luz: [-0.2, -0.8, 0.5] });
    p.bola(5, 5, 1.4, 1.4, ["#1a1410", "#3a3226"], {});
    for (let y = 0; y < 12; y++) for (let x = 9; x < 12; x++) p.borrar(x, y);
    p.contorno(AUTO);
    return p.canvas();
  });
}

// ══════════ 12b-armas.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LAS ARMAS: como en el original, hay UNA arma principal (la de más prioridad: feto del cielo >
// cuchillo > feto > aro > lágrima mansa > rayo > láser > lágrima) y todo lo demás la modifica.
// El tercer ojo multiplica cualquier arma, el jarabe hace explotar lo que toque, la leche
// chocolatada deja cargar lo que sea, el pulmón lo vuelve ráfaga… Las sinergias famosas que no
// salen solas de esa regla están escritas a mano abajo (rayo+láser, rayo+jarabe, feto+rayo…).
// Números medidos en la wiki: el rayo pega 9 veces en 40 cuadros, el aro 15 veces por segundo,
// el feto hace ×10 (o ×5+30), el misil ×20, el cuchillo ×2 en la mano y ×6 tirado.
// ─────────────────────────────────────────────────────────────────────────────

/** ¿Esta arma se carga manteniendo el disparo? */
function armaCarga(j) {
  const a = j.arma, f = j.f;
  if (a === "rayo") return !(f.soja || f.almendra || j.fr >= 15);   // con leche o cadencia altísima, el rayo sale continuo
  if (a === "anillo" || a === "cuchillo") return true;
  if (a === "lagrima" || a === "laser" || a === "feto") return !!(f.choco || f.pulmon);
  return false;
}
/** Cuadros que tarda la carga completa (fórmulas de la wiki pasadas a 60 Hz). */
function cuadrosCarga(j) {
  const a = j.arma, f = j.f;
  if (a === "anillo" || a === "cuchillo") return 180 / j.fr;      // ≈ 3 / cadencia
  if (f.choco && a !== "rayo") return 150 / j.fr;                 // la chocolatada: ≈ 2,5 / cadencia
  return 60 / j.fr;                                               // rayo, pulmón: ≈ 1 / cadencia
}
const dirDe = (dx, dy) => (dx > 0 ? DERECHA : dx < 0 ? IZQUIERDA : dy > 0 ? ABAJO : ARRIBA);

function actualizarArma(j, quieto) {
  if (j.enfriar > 0) j.enfriar--;
  const dx = quieto ? 0 : IN.dx, dy = quieto ? 0 : IN.dy, tira = !!(dx || dy), v = Math.hypot(j.vx, j.vy);
  if (tira) { j.mirar = dirDe(dx, dy); j.dirTiro = [dx, dy]; }
  else if (v > 0.3 || j.enfriar <= 0) j.mirar = j.mirarCue;
  const a = j.arma;
  const manso = a === "ludovico" || (a === "anillo" && j.f.ludovico);   // aro + lágrima mansa: un aro que se maneja
  if (!manso) J.ludo = null;
  if (a !== "cuchillo") J.cuchillo = null;
  if (a !== "epico") J.mira = null;
  if (manso) return ludovico(j, dx, dy);
  if (a === "cuchillo") return cuchillo(j, dx, dy, tira);
  if (a === "epico") return feteEpico(j, dx, dy, tira);
  if (a === "rayo" && !armaCarga(j)) return rayoContinuo(j, dx, dy, tira);
  if (armaCarga(j)) {
    if (tira && j.enfriar <= 0) {
      j.cargando = true; j.carga = Math.min(1, j.carga + 1 / cuadrosCarga(j));
      if (j.carga >= 1 && !j.avisoCarga) { j.avisoCarga = true; SFX.cargado(); }
      // con la leche, el aro y el pulmón salen solos al llenarse (como en el original con Almendra)
      return;
    }
    if (!tira && j.cargando) {
      const c = j.carga, [ddx, ddy] = j.dirTiro || [0, 1];
      j.cargando = false; j.carga = 0; j.avisoCarga = false;
      // el rayo y el pulmón sólo salen con la carga llena (salvo con la chocolatada)
      if ((a === "rayo" || (j.f.pulmon && !j.f.choco)) && c < 1) return;
      disparar(j, ddx, ddy, { carga: c, rafaga: !!j.f.pulmon && a !== "anillo" });
      j.enfriar = 6;
    }
    return;
  }
  if (tira && j.enfriar <= 0) { disparar(j, dx, dy, {}); j.enfriar = cuadrosEntreLagrimas(j); }
}

/** Un disparo del arma que toque, con todas sus copias (tercer ojo, siamés, ratón de biblioteca…). */
function disparar(j, dx, dy, o, desde) {
  const f = j.f, base = Math.atan2(dy, dx), n = j.n;
  const angulos = [];
  if (o.rafaga) {
    // el pulmón: 14 lágrimas (2,4 más por cada una extra del multidisparo), abiertas al azar
    const cuantas = Math.min(50, Math.round(14 + 2.4 * (n - 1)));
    for (let i = 0; i < cuantas; i++) angulos.push([base + (A.f() - 0.5) * 0.7, 0, 0.7 + A.f() * 0.5, 0.9 + A.f() * 0.43]);
  } else if (n === 2) angulos.push([base, -4, 1, 1], [base, 4, 1, 1]);     // los lentes: dos paralelas, una por ojo
  else for (let i = 0; i < n; i++) angulos.push([base + (i - (n - 1) / 2) * (n > 3 ? 0.13 : 0.16), 0, 1, 1]);
  if (f.siames) angulos.push([base - Math.PI / 4, 0, 1, 1], [base + Math.PI / 4, 0, 1, 1]);
  if (f.ratonLibro && A.si(0.25)) for (const q of angulos.slice()) q[1] -= 3, angulos.push([q[0], q[1] + 6, q[2], q[3]]);
  const escala = o.carga != null && f.choco && j.arma !== "rayo" && j.arma !== "anillo" ? 0.1 + 3.9 * o.carga : 1;
  const org = desde || j;
  const lado = (j.ojo = 1 - j.ojo) ? 1 : -1;
  const ox = dy ? lado * 3 : dx * 5, oy = (dx ? lado : dy * 3) + (dy < 0 ? -2 : 0);
  const X = org.x + ox, Y = org.y + oy;
  const fam = desde ? desde.escala ?? 1 : 1;
  switch (j.arma) {
    case "rayo": {
      const esc = o.carga != null && f.choco ? 0.25 + 2.25 * o.carga : 1;
      const rayos = f.pulmon ? A.ent(4, 6) : 0;
      for (const [a, desv] of angulos.slice(0, rayos ? 0 : 16)) rayo(j, org, a, desv, esc * fam, 40);
      for (let i = 0; i < rayos; i++) rayo(j, org, base + (A.f() - 0.5) * 0.8, 0, esc * fam, 40);
      SFX.rayo(); break;
    }
    case "anillo": {
      const c = o.carga ?? 1;
      for (const [a] of angulos.slice(0, 8)) anilloLuz(j, X, Y, a, c, fam);
      SFX.laser(); break;
    }
    case "laser":
      if (f.hemo) { for (const [a, desv, kv] of angulos) lagrima(j, X + Math.cos(a + 1.57) * desv, Y + Math.sin(a + 1.57) * desv, a, kv, { escala: escala * fam, burstLaser: true }); SFX.lagrima(); break; }
      for (const [a, desv] of angulos.slice(0, o.rafaga ? 7 : 16)) laser(j, X + Math.cos(a + 1.57) * desv, Y - 8 + Math.sin(a + 1.57) * desv, a, { dano: danoDe(j) * escala * fam });
      SFX.laser(); break;
    case "feto":
      for (const [a, desv, kv] of angulos.slice(0, o.rafaga ? 8 : 16)) {
        const v = 5.5 * j.velLag * kv;
        let d = danoDe(j) * 10 * escala * fam; if (d > 60) d = danoDe(j) * 5 * escala * fam + 30;
        J.bombas.push(nuevaBomba(j, X + Math.cos(a + 1.57) * desv, Y + 2, Math.cos(a) * v + j.vx * 0.4, Math.sin(a) * v + j.vy * 0.4, 60, { dano: d, feto: true, contacto: !!f.ipecac, danoJug: d >= 85 ? 2 : 1, rayos: f.rayo ? 4 : 0, lasers: f.laser ? 8 : 0, segunda: !!f.polifemo }));
      }
      SFX.escupe(); break;
    default:
      for (const [a, desv, kv, kt] of angulos) lagrima(j, X + Math.cos(a + 1.57) * desv, Y + Math.sin(a + 1.57) * desv, a, kv, { escala: escala * fam, tam: kt * (desde ? 0.7 : 1) });
      SFX.lagrima();
  }
  if (!desde && (!j.gesto || j.gesto === 1)) { j.gesto = 1; j.tGesto = 6; }
}

// ── el rayo (el llanto de azufre): 9 golpes en 40 cuadros, sale de la cara y la sigue ──
const TICKS_RAYO = new Set([0, 11, 15, 19, 23, 27, 31, 35, 39]);
function rayo(j, org, ang, desv, esc, dur) {
  const coil = !!j.f.laser;                          // rayo + láser: el láser se enrosca y el daño ×1,5
  J.laseres.push({ tipo: "rayo", org, ang, desv, t: 0, dur, dano: danoDe(j) * esc * (coil ? 1.5 : 1), ancho: lim(9 + Math.sqrt(danoDe(j)) * 1.5 * Math.sqrt(esc), 8, 22), coil, ipecac: !!j.f.ipecac, tocados: null, x0: org.x, y0: org.y - 10 });
}
/** Hasta dónde llega una línea desde (x, y) con ángulo a: hasta la pared (pasa por encima de todo lo demás). */
function finDeRayo(x, y, a) {
  const c = Math.cos(a), s = Math.sin(a);
  let t = 999;
  if (c > 0.001) t = Math.min(t, (IX1 - 1 - x) / c); else if (c < -0.001) t = Math.min(t, (IX0 + 1 - x) / c);
  if (s > 0.001) t = Math.min(t, (IY1 - 1 - y) / s); else if (s < -0.001) t = Math.min(t, (IY0 - 6 - y) / s);
  t = Math.max(0, t);
  return [x + c * t, y + s * t, t];
}
function distSegmento(px, py, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0, L = dx * dx + dy * dy || 1;
  const u = lim(((px - x0) * dx + (py - y0) * dy) / L, 0, 1);
  return Math.hypot(px - (x0 + dx * u), py - (y0 + dy * u));
}
/** A todos los que toca la línea, un golpe (con los efectos de lágrima de Shumio). */
function golpearLinea(x0, y0, x1, y1, ancho, dano, efectos) {
  let alguno = false;
  for (const e of J.enemigos) {
    if (!blanco_(e)) continue;
    const d = e.segmentos ? Math.min(distSegmento(e.x, e.y, x0, y0, x1, y1), ...e.segmentos.map((s) => distSegmento(s.x, s.y, x0, y0, x1, y1))) : distSegmento(e.x, e.y - (e.alturaGolpe || 4), x0, y0, x1, y1);
    if (d > e.r + ancho / 2) continue;
    const a = Math.atan2(y1 - y0, x1 - x0);
    danarEnemigo(e, dano, Math.cos(a) * 0.6, Math.sin(a) * 0.6, efectos ? efectosDeGolpe(J.jug) : null);
    alguno = true;
  }
  // también rompe matas y apaga braseros (como el rayo del original)
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 12);
  for (let i = 0; i <= n; i++) {
    const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n, c = celdaX(x), f = celdaY(y), o = celda(J.sala, c, f);
    if (o && (o.t === "matas" || o.t === "brasero" || o.t === "barril")) golpearObstaculo(o, c, f, dano);
  }
  return alguno;
}
/** Los efectos al azar (veneno, lentitud, miedo…) para un golpe que no es una lágrima. */
function efectosDeGolpe(j) {
  const f = j.f, L = j.suerte;
  return { veneno: f.veneno && A.si(chance.veneno(L)), hielo: f.lento && A.si(chance.lento(L)), fuego: !!f.fuego, miedo: f.miedo && A.si(chance.miedo(L)), piedra: f.piedra && A.si(chance.piedra(L)) };
}

// ── el láser (el ojo mecánico): instantáneo, atraviesa todo y llega a la pared ──
function laser(j, x, y, ang, o = {}) {
  const [x1, y1] = finDeRayo(x, y, ang);
  golpearLinea(x, y, x1, y1, 5, o.dano ?? danoDe(j), true);
  J.laseres.push({ tipo: "laser", x0: x, y0: y, x1, y1, t: 0, dur: 9, ancho: o.ancho || 3, color: o.color });
}

// ── el aro de luz: se carga, sale girando y quema a lo que queda en su borde ──
function anilloLuz(j, x, y, ang, carga, esc = 1) {
  const v = 3.2 * j.velLag, R = 7 + 21 * carga, rayoAro = !!j.f.rayo;
  J.anillos.push({ x, y: y - 6, vx: Math.cos(ang) * v + j.vx * 0.5, vy: Math.sin(ang) * v + j.vy * 0.5, R, vida: alcancePx(j) * 1.3 / v, t: 0, dano: danoDe(j) * (0.25 + 0.75 * carga) * esc * (rayoAro ? 1.5 : 1), rojo: rayoAro, pared: 0 });
}
function actualizarAnillos() {
  for (let i = J.anillos.length - 1; i >= 0; i--) {
    const a = J.anillos[i];
    a.t++;
    if (a.control) { a.x = J.ludo ? J.ludo.x : a.x; a.y = J.ludo ? J.ludo.y : a.y; }
    else if (a.pared > 0) { if (--a.pared <= 0) { J.anillos.splice(i, 1); continue; } }
    else {
      a.x += a.vx; a.y += a.vy;
      if (a.x < IX0 || a.x > IX1 || a.y < IY0 - 4 || a.y > IY1 || --a.vida <= 0) { a.pared = 12; a.x = lim(a.x, IX0, IX1); a.y = lim(a.y, IY0 - 4, IY1); }   // se queda un ratito en la pared
    }
    if (a.t % 4 === 0) for (const e of J.enemigos) {
      if (!blanco_(e)) continue;
      const d = dist(e.x, e.y - 4, a.x, a.y);
      if (Math.abs(d - a.R) < e.r + (a.rojo ? 5 : 3)) danarEnemigo(e, a.dano, 0, 0, efectosDeGolpe(J.jug));
    }
  }
}

// ── el rayo continuo (rayo + leche, o cadencia ≥ 15): dura mientras se mantiene el disparo ──
function rayoContinuo(j, dx, dy, tira) {
  let r = J.laseres.find((l) => l.continuo);
  if (!tira) { if (r) r.dur = Math.min(r.dur, r.t + 6); return; }
  const ang = Math.atan2(dy, dx);
  if (!r) {
    rayo(j, j, ang, 0, 1, 99999); r = J.laseres[J.laseres.length - 1]; r.continuo = true; r.ancho *= 0.7;
    SFX.rayo();
  }
  r.ang = ang; r.dur = r.t + 30;
}

function actualizarLaseres() {
  const j = J.jug;
  for (let i = J.laseres.length - 1; i >= 0; i--) {
    const l = J.laseres[i];
    if (l.tipo === "rayo") {
      // sale de la cara de quien lo tira y lo sigue mientras camina
      l.x0 = l.org.x + Math.cos(l.ang + 1.57) * l.desv; l.y0 = l.org.y - 10 + Math.sin(l.ang + 1.57) * l.desv;
      [l.x1, l.y1] = finDeRayo(l.x0, l.y0, l.ang);
      const golpea = l.continuo ? l.t % 4 === 0 : TICKS_RAYO.has(l.t);
      if (golpea) {
        golpearLinea(l.x0, l.y0, l.x1, l.y1, l.ancho, l.dano, true);
        if (l.t % 8 === 0) temblar(2);
        // rayo + jarabe: explota a lo largo del rayo (una vez por disparo)
        if (l.ipecac && l.t === 0) { const L = Math.hypot(l.x1 - l.x0, l.y1 - l.y0); for (let d = 36; d < L; d += 44) { const x = l.x0 + Math.cos(l.ang) * d, y = l.y0 + Math.sin(l.ang) * d + 10; J.pendientes.push(() => explotar(x, y, true, false, { dano: l.dano, radio: 30, danoJug: 1, veneno: true })); } }
      }
    }
    if (++l.t >= l.dur) J.laseres.splice(i, 1);
  }
}

// ── la lágrima mansa (ludovico): una sola lágrima grande que se maneja con el disparo ──
function ludovico(j, dx, dy) {
  let L = J.ludo;
  if (!L) L = J.ludo = { x: j.x, y: j.y - 16, vx: 0, vy: 0, t: 0 };
  L.t++;
  const v = 2.4 * j.velLag;
  if (dx || dy) { L.vx += (dx * v - L.vx) * 0.12; L.vy += (dy * v - L.vy) * 0.12; }
  else { L.vx *= 0.92; L.vy *= 0.92; }
  L.x = lim(L.x + L.vx, IX0 + 4, IX1 - 4); L.y = lim(L.y + L.vy, IY0 + 2, IY1 - 4);
  L.r = lim(radioLagrima(j) * 1.5, 5, 14);
  const f = j.f;
  L.aro = f.rayo ? "rojo" : f.laser || f.anillo ? "laser" : null;
  const cada = L.aro ? 4 : Math.max(2, Math.round(60 / Math.min(30, j.fr)));
  if (L.t % cada === 0) for (const e of J.enemigos) {
    if (!blanco_(e)) continue;
    const d = dist(e.x, e.y - 4, L.x, L.y);
    const toca = L.aro ? Math.abs(d - 18) < e.r + (L.aro === "rojo" ? 6 : 3) : d < e.r + L.r;
    if (toca) { danarEnemigo(e, danoDe(j) * (L.aro === "rojo" ? 1.2 : 1), L.vx * 0.3, L.vy * 0.3, efectosDeGolpe(j)); if (f.jacob) chispa(e, danoDe(j) * 0.5); }
  }
}

// ── el cuchillo de la abuela: pega en la mano, se carga y se tira; vuelve solo ──
function cuchillo(j, dx, dy, tira) {
  let K = J.cuchillo;
  if (!K) K = J.cuchillo = { est: "mano", d: 10, ang: Math.PI / 2, carga: 0, t: 0, golpes: new Map() };
  K.t++;
  if (K.est === "mano") {
    if (tira) {
      K.ang = Math.atan2(dy, dx);
      j.cargando = true; K.carga = j.carga = Math.min(1, K.carga + 1 / cuadrosCarga(j));
      if (j.carga >= 1 && !j.avisoCarga) { j.avisoCarga = true; SFX.cargado(); }
    } else if (K.carga > 0.05) {
      // se tira: más carga, más lejos y más daño (×6 desde un tercio de carga)
      K.est = "vuela"; K.dmax = 26 + K.carga * Math.max(90, alcancePx(j) * 1.1); K.danoVuelo = 2 + 4 * Math.min(1, K.carga * 3);
      const extra = (j.n - 1) + (j.f.rayo ? 2 + Math.floor(K.carga * 6) : 0);
      for (let i = 0; i < extra; i++) {
        const a = K.ang + (i % 2 ? 1 : -1) * (0.16 + Math.floor(i / 2) * 0.14);
        lagrima(j, j.x, j.y - 6, a, 1.8, { tipo: "cuchillo", atraviesa: true, espectral: true, danoFijo: danoDe(j) * 2 });
      }
      j.cargando = false; j.carga = 0; j.avisoCarga = false; K.carga = 0; SFX.escupe();
    } else { K.carga = 0; j.cargando = false; j.carga = 0; }
    K.d = 10 - K.carga * 4;
  } else if (K.est === "vuela") { K.d += 7; if (K.d >= K.dmax) K.est = "vuelve"; }
  else { K.d -= 6; if (K.d <= 10) { K.est = "mano"; K.d = 10; } }
  K.x = j.x + Math.cos(K.ang) * K.d; K.y = j.y - 6 + Math.sin(K.ang) * K.d;
  // el filo: pega 20 veces por segundo (cada 3 cuadros) a lo que toca
  const mult = K.est === "vuela" ? K.danoVuelo : 2;
  for (const e of J.enemigos) {
    if (!blanco_(e)) continue;
    if (dist(e.x, e.y - 4, K.x, K.y) > e.r + 6) continue;
    const u = K.golpes.get(e) || 0;
    if (K.t - u < 3) continue;
    K.golpes.set(e, K.t);
    danarEnemigo(e, danoDe(j) * mult, Math.cos(K.ang) * 1.2, Math.sin(K.ang) * 1.2, efectosDeGolpe(j));
  }
}

// ── el feto del cielo: una mira que se mueve y, 1,5 s después, cae un misil (×20) ──
function feteEpico(j, dx, dy, tira) {
  let M = J.mira;
  if (!M && tira && j.enfriar <= 0) M = J.mira = { x: lim(j.x + dx * 30, IX0 + 8, IX1 - 8), y: lim(j.y + dy * 30, IY0 + 8, IY1 - 8), t: 0 };
  if (!M) return;
  M.t++;
  if (tira) { M.x = lim(M.x + dx * 3.2, IX0 + 6, IX1 - 6); M.y = lim(M.y + dy * 3.2, IY0 + 6, IY1 - 6); }
  if (M.t >= 90) {
    const n = Math.min(16, j.n + (j.f.siames ? 2 : 0));
    for (let i = 0; i < n; i++) J.misiles.push({ x: M.x + (i ? (A.f() - 0.5) * 26 : 0), y: M.y + (i ? (A.f() - 0.5) * 20 : 0), t: -i * 6, dur: 24, dano: danoDe(j) * 20 });
    J.mira = null; j.enfriar = cuadrosEntreLagrimas(j);
  }
}
function actualizarMisiles() {
  const j = J.jug;
  for (let i = J.misiles.length - 1; i >= 0; i--) {
    const m = J.misiles[i];
    if (++m.t < m.dur) continue;
    J.misiles.splice(i, 1);
    explotar(m.x, m.y, true, true, { dano: m.dano, radio: 50, danoJug: m.dano >= 85 ? 2 : 1, rayos: j.f.rayo ? A.ent(4, 6) : 0, lasers: j.f.laser ? 8 : 0, veneno: !!j.f.bombaPodrida });
  }
}

/** Una chispa eléctrica (la raíz eléctrica): salta al enemigo más cerca y encadena hasta 4. */
function chispa(e0, dano) {
  let de = e0; const vistos = new Set([e0]);

      const c = celdaX(l.x), f = celdaY(l.y), o = celda(J.sala, c, f);
      if (frenaLagrima(o)) {
        golpearObstaculo(o, c, f, l.dano);
        if (l.rebote) { l.vx = -l.vx; l.vy = -l.vy; l.cx += l.vx * 2; l.cy += l.vy * 2; }
        else { rompe = true; pego = "obstaculo"; }
      }
    }
    // enemigos
    if (!rompe) for (const e of J.enemigos) {
      if (!blanco_(e) || (l.tocados && l.tocados.has(e))) continue;
      if (e.segmentos ? !tocaSegmento(e, l.x, l.y - (l.arco ? 0 : 0), l.r + 1) : dist(e.x, e.y - (e.alturaGolpe || 0), l.x, l.y) > e.r + l.r) continue;
      if (golpeLagrima(l, e)) { rompe = true; pego = e; break; }
    }
    if (rompe) { romperLagrima(l, pego); L.splice(i, 1); }
  }
}

/** La lágrima le pega a un enemigo. Devuelve true si la lágrima se rompe. */
function golpeLagrima(l, e) {
  const j = J.jug, vida0 = e.vida;
  l.golpeo = true;
  if (j.f.ojoMuerto) j.ojoMuerto = Math.min(4, j.ojoMuerto + 1), j.fallos = 0;
  if (l.ipecac) return true;                               // el jarabe explota al tocar (en romperLagrima)
  if (l.pegajosa) { J.pegadas.push({ e, t: 90, dano: 60 + l.dano, dx: l.x - e.x, dy: l.y - e.y }); }
  danarEnemigo(e, l.dano, l.vx * 0.35 * l.empuje, l.vy * 0.35 * l.empuje, l);
  if (l.tipo === "santa") { J.luces.push({ x: e.x, y: e.y, t: 20 }); for (const q of J.enemigos) if (blanco_(q) && dist(q.x, q.y, e.x, e.y) < q.r + 14) danarEnemigo(q, l.dano * 3); SFX.santa(); }
  if (l.jacob) chispa(e, l.dano * 0.5);
  if (l.tipo === "moneda" && A.si(0.05)) soltarPremio(e.x, e.y, "moneda");
  if (j.f.guppy && A.si(0.66) && J.familiares.filter((m) => m.tipo === "moscaAzul").length < 16) J.familiares.push(moscaAzul(e.x, e.y));
  if (l.urano && e.muerto) congelado(e);
  if (l.liquido) dejarBaba(l.x, l.y, 8, 90, false, "amiga");
  // el ojo de Belial: después del primero que atraviesa, pega el doble y busca
  if (l.belial && !l.tocados) { l.dano *= 2; l.buscadora = true; l.r = Math.round(l.r * 1.3); l.color = "sangre"; }
  // el cíclope: si lo mató, sigue con el daño que le sobró
  if (j.f.polifemo && e.muerto && l.dano > vida0) { l.dano -= Math.max(0, vida0); (l.tocados ||= new Set()).add(e); return false; }
  if (l.rebote && !l.atraviesa) { const d = dist(e.x, e.y, l.x, l.y) || 1; const v = Math.hypot(l.vx, l.vy); l.vx = (l.x - e.x) / d * v; l.vy = (l.y - e.y) / d * v; (l.tocados ||= new Set()).add(e); return false; }
  if (l.atraviesa) { (l.tocados ||= new Set()).add(e); return false; }
  return true;
}

/** La lágrima se rompe: acá salen las explosiones, las ráfagas y las divisiones. */
function romperLagrima(l, pego) {
  const j = J.jug;
  chapoteo(l.x, l.y - l.z, l.color, l.r);
  if (!l.golpeo && j.f.ojoMuerto && j.ojoMuerto > 0) { j.fallos++; if (A.si([0.2, 0.33, 0.5][Math.min(2, j.fallos - 1)])) j.ojoMuerto = 0; }
  if (l.ipecac) explotar(l.x, l.y, true, false, { dano: l.dano, radio: 30, danoJug: l.dano >= 85 ? 2 : 1, veneno: true });
  if (l.hemo) {                                            // el coágulo: revienta en 6–11 lágrimas (50–83 % del daño)
    if (l.burstLaser) for (let k = 0; k < 8; k++) laser(j, l.x, l.y - 4, k * TAU / 8, { dano: l.dano * 0.66 });
    else { const n = A.ent(6, 11); for (let k = 0; k < n; k++) hija(l, A.f() * TAU, 0.5 + A.f() * 0.33, 0, { kv: 0.6 + A.f() * 0.5 }).vida = 20 + A.ent(0, 18); }
  }
  if (l.grillo) for (let k = 0; k < 4; k++) hija(l, Math.atan2(l.vy, l.vx) + Math.PI / 4 + k * Math.PI / 2, 0.5, 0.4);
  if (l.parasito && pego && l.dano > 1) { const a = Math.atan2(l.vy, l.vx); for (const s of [-1, 1]) hija(l, a + Math.PI + s * 0.9, 0.5, 0.5, { parasito: true }); }
  if (l.fractura && pego) { const n = A.ent(1, 3), a = Math.atan2(l.vy, l.vx); for (let k = 0; k < n; k++) hija(l, a + Math.PI + (A.f() - 0.5) * 2.4, 0.5, 0.35, { tipo: "hueso", tam: 0.5 }); }
  if (l.liquido && !pego) dejarBaba(l.x, l.y, 8, 90, false, "amiga");
  if (l.jacob && pego === "obstaculo") { const a = V.f() * TAU; J.chispas.push({ x0: l.x, y0: l.y, x1: l.x + Math.cos(a) * 24, y1: l.y + Math.sin(a) * 24, t: 8 }); }
  if (j.f.estalla && pego && pego !== "obstaculo" && A.si(chance.estalla(j.suerte))) J.pendientes.push(() => explotar(l.x, l.y, true, false, { dano: l.dano, radio: 22, danoJug: 1, fuego: true }));
}

/** Urano: el que muere helado queda como estatua y revienta en 8 carámbanos. */
function congelado(e) {
  const j = J.jug;
  particulas(e.x, e.y, 10, PAL.hielo.slice(2), 2);
  for (let k = 0; k < 8; k++) {
    const a = k * TAU / 8, l = lagrima(j, e.x, e.y - 4, a, 0.9, { danoFijo: danoDe(j), hija: true, color: "hielo", tam: 0.7, vida: 40 });
    l.urano = false;
  }
}

/** Las lágrimas pegajosas: quedan en el enemigo y explotan a los 1,5 s (60 + el daño). */
function actualizarPegadas() {
  for (let i = J.pegadas.length - 1; i >= 0; i--) {
    const p = J.pegadas[i];
    if (--p.t > 0 && !p.e.muerto) continue;
    J.pegadas.splice(i, 1);
    explotar(p.e.x + p.dx, p.e.y + p.dy, true, false, { dano: p.dano, radio: 34, danoJug: 1 });
  }
}
function blanco_(e) { return !e.muerto && !e.oculto && !e.intangible; }

/** Una lágrima que pega en una roca, una mata, un brasero o un barril. */
function golpearObstaculo(o, c, f, dano) {
  if (o.t === "matas" && o.vida > 0) {
    o.vida--; SFX.moho();
    particulas(cx(c), cy(f), 4, ["#7a5636", "#a8835a", "#4d3421"], 1.2);
    if (o.vida <= 0) { if (A.si(o.dorada ? 1 : 0.18)) soltarPremio(cx(c), cy(f), o.dorada ? "moneda" : null); J.cambioGrilla = true; }
  } else if (o.t === "brasero" && o.prendido) {
    o.vida--; particulas(cx(c), cy(f) - 10, 3, PAL.fuego.slice(2), 1);
    if (o.vida <= 0) { o.prendido = false; SFX.moho(); humo(cx(c), cy(f) - 6); if (A.si(0.2)) soltarPremio(cx(c), cy(f)); J.cambioGrilla = true; }
  } else if (o.t === "barril") {
    o.vida -= dano >= 6 ? 2 : 1;
    if (o.vida <= 0) { J.sala.celdas[f * COLS + c] = null; explotar(cx(c), cy(f), false); J.cambioGrilla = true; }
  }
}

function chapoteo(x, y, color, r) {
  const col = COLOR_LAGRIMA[color] ? color : "espora";
  J.fx.push({ anim: [0, 1, 2, 3, 4].map((k) => chapoteoSpr(col, k)), x, y, t: 0, cada: 3, centro: true, escala: r > 5 ? 1 : 1 });
  if (V.f() < 0.5) SFX.chapoteo();
}

// ── las balas de los enemigos ──
function bala(x, y, ang, vel, o = {}) {
  J.balas.push({ x, y, z: o.z ?? 8, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, r: o.r || 3, vida: o.vida || 240, color: o.color || "enemigo", curva: o.curva || 0, acel: o.acel || 0, espectral: !!o.espectral, de: J.quien ? J.quien.def.nombre : null, deSpr: J.quien ? J.quien.def.spr(J.quien) : null });
}
function anilloBalas(x, y, n, vel, desfase = 0, o) { for (let i = 0; i < n; i++) bala(x, y, desfase + i * TAU / n, vel, o); }
function actualizarBalas() {
  const B = J.balas, j = J.jug;
  for (let i = B.length - 1; i >= 0; i--) {
    const b = B[i];
    if (b.curva) { const a = Math.atan2(b.vy, b.vx) + b.curva, v = Math.hypot(b.vx, b.vy); b.vx = Math.cos(a) * v; b.vy = Math.sin(a) * v; }
    if (b.acel) { b.vx *= 1 + b.acel; b.vy *= 1 + b.acel; }
    b.x += b.vx; b.y += b.vy; b.vida--;
    if (b.vida < 20) b.z = Math.max(0, b.z - 0.5);
    let rompe = b.vida <= 0 || b.x < IX0 || b.x > IX1 || b.y < IY0 - 2 || b.y > IY1;
    if (!rompe && !b.espectral) { const o = celda(J.sala, celdaX(b.x), celdaY(b.y)); if (frenaLagrima(o)) rompe = true; }
    if (!rompe) for (const m of J.familiares) if (m.bloquea && dist(m.x, m.y, b.x, b.y) < 7) { rompe = true; break; }
    if (!rompe && !j.muerto && dist(j.x, j.y - 5, b.x, b.y) < b.r + 4) { herirJugador(j, J.piso.n >= 3 ? 2 : 1, b.de || "UNA LÁGRIMA MALA", b.deSpr || lagrimaSpr(5, "enemigo")); rompe = true; }
    if (rompe) { chapoteo(b.x, b.y - b.z, b.color, b.r); B.splice(i, 1); }
  }
}

// ── las bombas (las de Shumio y las del feto) ──
function actualizarBombas() {
  for (let i = J.bombas.length - 1; i >= 0; i--) {
    const b = J.bombas[i];
    b.t--;
    const roce = b.feto ? 0.93 : 0.85;
    b.vx *= roce; b.vy *= roce;
    moverEnSala(J.sala, b, b.vx, b.vy, false);
    // Shumio las empuja al caminar contra ellas
    const j = J.jug, d = dist(j.x, j.y, b.x, b.y);
    if (!b.feto && d < 9 && d > 0.01 && b.t < 80) { b.vx += (b.x - j.x) / d * 0.5; b.vy += (b.y - j.y) / d * 0.5; }
    // feto + jarabe: explotan al tocar
    if (b.contacto && J.enemigos.some((e) => blanco_(e) && dist(e.x, e.y, b.x, b.y) < e.r + 5)) b.t = 0;
    if (b.t <= 0) {
      J.bombas.splice(i, 1);
      explotar(b.x, b.y, true, b.gorda, { dano: b.dano, danoJug: b.danoJug, veneno: b.veneno, rayos: b.rayos, lasers: b.lasers });
      // feto + cíclope: aparece otra bomba donde explotó, con la mitad del daño
      if (b.segunda && b.dano) J.bombas.push({ ...b, t: 40, vx: 0, vy: 0, dano: b.dano / 2, segunda: false });
    }
  }
}

/** La explosión: daña (a Shumio también), rompe obstáculos y abre las puertas secretas.
 *  o: { dano, radio, danoJug, veneno, rayos (rayos que salen), lasers, fuego } */
function explotar(x, y, dePlayer, gorda = false, o = {}) {
  const j = J.jug;
  const R = o.radio ?? (gorda ? 52 : 42), dano = (o.dano ?? 60) * (gorda && o.dano ? 1.85 : 1) + (gorda && !o.dano ? 15 : 0);
  SFX.explosion(); temblar(gorda || R > 44 ? 14 : R < 32 ? 5 : 10);
  const escala = R / 42;
  J.fx.push({ anim: [0, 1, 2, 3, 4, 5].map(explosionSpr), x, y: y + 6 * escala, t: 0, cada: 4, centro: false, escala });
  J.destello = Math.max(J.destello, R > 32 ? 3 : 1);
  mancha("quemado", x, y, 1.4 * escala);
  particulas(x, y, Math.round(14 * escala), o.veneno ? ["#255a1c", "#44922c", "#86d04a"] : ["#3a2c28", "#5a4640", "#f59a26", "#ffe07a"], 3 * escala);
  for (const e of J.enemigos) if (!e.muerto && !e.oculto && dist(e.x, e.y, x, y) < R + e.r) {
    const d = dist(e.x, e.y, x, y) || 1;
    danarEnemigo(e, dano, (e.x - x) / d * 5, (e.y - y) / d * 5, o.veneno || o.fuego ? { veneno: o.veneno, fuego: o.fuego } : null);
  }
  if (dist(j.x, j.y, x, y) < R + 2 && !j.f.inmuneExplosion) { herirJugador(j, o.danoJug ?? 2, "TU PROPIA EXPLOSIÓN", bombaSpr(1)); const d = dist(j.x, j.y, x, y) || 1; j.vx += (j.x - x) / d * 5; j.vy += (j.y - y) / d * 5; }
  for (const b of J.bombas) { const d = dist(b.x, b.y, x, y) || 1; if (d < R) { b.vx += (b.x - x) / d * 4; b.vy += (b.y - y) / d * 4; } }
  for (const c of J.sala.cosas) {
    if (c.t === "cofre" && c.sub === "piedra" && !c.abierto && dist(c.x, c.y, x, y) < R + 8) abrirCofre(c);
    if (!c.quieto && c.t !== "objeto" && c.t !== "trampilla") { const d = dist(c.x, c.y, x, y) || 1; if (d < R) { c.vx += (c.x - x) / d * 4; c.vy += (c.y - y) / d * 4; c.vz = 2; } }
  }
  // feto + rayo / feto + láser: la explosión suelta rayos o láseres
  if (o.rayos) for (let k = 0; k < o.rayos; k++) { const a = o.rayos === 4 ? k * Math.PI / 2 : A.f() * TAU; rayo(j, { x, y: y + 10 }, a, 0, 1, 40); }
  if (o.lasers) for (let k = 0; k < o.lasers; k++) laser(j, x, y - 4, k * TAU / o.lasers + 0.2);
  // los obstáculos
  for (let f = 0; f < FILAS; f++) for (let c = 0; c < COLS; c++) {
    const q = celda(J.sala, c, f);
    if (!q || dist(cx(c), cy(f), x, y) > R + 10) continue;
    if (q.t === "roca") {
      J.sala.celdas[f * COLS + c] = null; SFX.roca();
      particulas(cx(c), cy(f), 8, PAL.piedra.slice(2), 2.4);
      mancha("quemado", cx(c), cy(f), 0.8);
      if (q.marcada) { SFX.secreto(); soltarPremio(cx(c), cy(f), A.pesos([["espora", 5], ["bomba", 3], ["llave", 2]])); }
      else if (A.si(0.04)) soltarPremio(cx(c), cy(f));
      J.cambioGrilla = true;
    } else if (q.t === "matas" && q.vida > 0) { q.vida = 0; J.cambioGrilla = true; particulas(cx(c), cy(f), 6, ["#7a5636", "#a8835a"], 2); }
    else if (q.t === "brasero") { J.sala.celdas[f * COLS + c] = null; J.cambioGrilla = true; humo(cx(c), cy(f)); }
    else if (q.t === "barril") { J.sala.celdas[f * COLS + c] = null; J.cambioGrilla = true; J.pendientes.push(() => explotar(cx(c), cy(f), false)); }
  }
  // las puertas secretas
  for (let d = 0; d < 4; d++) {
    const p = J.sala.puertas[d];
    if (!p || !p.secreta || p.revelada) continue;
    const q = PUERTA[d];
    if (dist(q.x, q.y, x, y) < R + 16) { p.revelada = true; if (p.par) p.par.revelada = true; SFX.secreto(); particulas(q.x, q.y, 10, PAL.piedra.slice(2), 2.5); }
  }
  // las puertas con llave no se vuelan (como en el original)
}

// ── partículas: pedacitos con altura (z) que caen y rebotan en el piso ──
function particulas(x, y, n, colores, fuerza = 2, z = 6) {
  for (let i = 0; i < n; i++) {
    const a = V.f() * TAU, v = (0.4 + V.f()) * fuerza * 0.6;
    J.part.push({ x, y, z, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.7, vz: 1 + V.f() * fuerza, c: V.uno(colores), t: 60 + V.ent(0, 60), s: V.f() < 0.3 ? 2 : 1 });
  }
}
function sangrar(x, y, n, rampa) { particulas(x, y, n, [rampa[1], rampa[2], rampa[3]], 2, 8); }
function actualizarParticulas() {
  const P = J.part;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.x += p.vx; p.y += p.vy; p.z += p.vz; p.vz -= 0.22;
    if (p.z <= 0) { p.z = 0; p.vz *= -0.35; p.vx *= 0.6; p.vy *= 0.6; if (Math.abs(p.vz) < 0.3) p.vz = 0; }
    if (--p.t <= 0) P.splice(i, 1);
