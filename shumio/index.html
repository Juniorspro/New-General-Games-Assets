<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07060a">
<meta name="mobile-web-app-capable" content="yes">
<title>Shumio's Depths</title>
<!--
  SHUMIO'S DEPTHS — un roguelike de salas con lágrimas, en pixel art dibujado a mano por código.
  Un solo archivo, sin red. Se juega con el teléfono acostado (pensado para un TCL 20 SE: 1600×720).
  El código vive en shumio/src/*.js; este archivo lo arma `node construir.mjs`.
-->
<style>
  html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<script>

// ══════════ 00-base.js ══════════
'use strict';
// ─────────────────────────────────────────────────────────────────────────────
// SHUMIO'S DEPTHS · la base: cuentas, azar con semilla, constantes de la sala.
// ─────────────────────────────────────────────────────────────────────────────

const lim = (x, a, b) => (x < a ? a : x > b ? b : x);
const sig = (x) => (x < 0 ? -1 : x > 0 ? 1 : 0);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

/** Un rng chico y rápido (mulberry32). */
function mulberry(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashTexto(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}

// Dos azares: el del MUNDO (con semilla: la misma semilla, la misma partida) y el VISUAL
// (partículas, temblores: Math.random, así no corre la secuencia del mundo). Guía 2D § 9.
let rnd = mulberry(1);
const A = {
  f: () => rnd(),
  ent: (a, b) => a + Math.floor(rnd() * (b - a + 1)),
  uno: (arr) => arr[Math.floor(rnd() * arr.length)],
  si: (p) => rnd() < p,
  pesos(tabla) {   // [[valor, peso], …]
    let s = 0; for (const [, p] of tabla) s += p;
    let r = rnd() * s;
    for (const [v, p] of tabla) { if ((r -= p) < 0) return v; }
    return tabla[tabla.length - 1][0];
  },
  mezclar(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
};
const V = { f: Math.random, ent: (a, b) => a + Math.floor(Math.random() * (b - a + 1)), uno: (arr) => arr[Math.floor(Math.random() * arr.length)] };

// ── la sala: 13×7 baldosas de 24 px, con muros (el de arriba más alto: la perspectiva) ──
const T = 24, COLS = 13, FILAS = 7;
const MURO_L = 28, MURO_A = 32, MURO_B = 24;
const SALA_W = MURO_L * 2 + COLS * T;      // 368
const SALA_H = MURO_A + MURO_B + FILAS * T; // 224
const IX0 = MURO_L, IY0 = MURO_A, IX1 = MURO_L + COLS * T, IY1 = MURO_A + FILAS * T;
/** El centro de la baldosa (c, f) en coordenadas de la sala. */
const cx = (c) => IX0 + c * T + T / 2;
const cy = (f) => IY0 + f * T + T / 2;
const celdaX = (x) => Math.floor((x - IX0) / T);
const celdaY = (y) => Math.floor((y - IY0) / T);

// las puertas: arriba, derecha, abajo, izquierda (en el centro de cada muro)
const ARRIBA = 0, DERECHA = 1, ABAJO = 2, IZQUIERDA = 3;
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const PUERTA = [
  { x: SALA_W / 2, y: MURO_A - 6 },
  { x: SALA_W - MURO_L + 6, y: IY0 + FILAS * T / 2 },
  { x: SALA_W / 2, y: SALA_H - MURO_B + 6 },
  { x: MURO_L - 6, y: IY0 + FILAS * T / 2 },
];
const opuesta = (d) => (d + 2) % 4;

const CUADRO = 1000 / 60;

// ══════════ 01-pantalla.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LA PANTALLA: el mundo se dibuja chico (en píxeles de juego) y se agranda con una
// escala ENTERA (×2, ×3…), nunca ×2,7: si no, los píxeles salen de distinto tamaño y
// todo tiembla (guía 2D § 2). En un TCL 20 SE acostado (1600×720 píxeles de pantalla)
// da ×3 y un mundo de 534×240: entra la sala entera (368×224) y sobran los costados
// para los pulgares.
// ─────────────────────────────────────────────────────────────────────────────

const lienzo = document.getElementById("lienzo");
const cxP = lienzo.getContext("2d", { alpha: false });
const cvM = document.createElement("canvas");
const cxM = cvM.getContext("2d", { alpha: false });
const PANT = { W: 534, H: 240, PX: 3, dw: 1600, dh: 720, ox: 0, oy: 0, vertical: false, salaX: 0, salaY: 0 };
const ALTO_MIN = 236;   // la sala (224) y un margen

function medir() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cw = lienzo.clientWidth || innerWidth, ch = lienzo.clientHeight || innerHeight;
  const dw = Math.round(cw * dpr), dh = Math.round(ch * dpr);
  PANT.vertical = ch > cw * 1.05;
  // el lado que manda es el alto (acostado); parado, el ancho (para mostrar "girá el teléfono")
  const PX = Math.max(1, Math.floor((PANT.vertical ? dw * 0.62 : dh) / ALTO_MIN));
  if (dw === PANT.dw && dh === PANT.dh && PX === PANT.PX && lienzo.width === dw) return;
  PANT.dw = dw; PANT.dh = dh; PANT.PX = PX;
  lienzo.width = dw; lienzo.height = dh;
  PANT.W = Math.ceil(dw / PX); PANT.H = Math.ceil(dh / PX);
  PANT.ox = Math.floor((dw - PANT.W * PX) / 2); PANT.oy = Math.floor((dh - PANT.H * PX) / 2);
  cvM.width = PANT.W; cvM.height = PANT.H;
  cxM.imageSmoothingEnabled = false; cxP.imageSmoothingEnabled = false;
  PANT.salaX = Math.floor((PANT.W - SALA_W) / 2);
  PANT.salaY = Math.floor((PANT.H - SALA_H) / 2);
  if (typeof alMedir === "function") alMedir();
}
new ResizeObserver(() => medir()).observe(lienzo);
addEventListener("orientationchange", () => setTimeout(medir, 200));

/** Del punto de la pantalla (CSS) al mundo (píxeles de juego). */
function aMundo(clientX, clientY) {
  const dpr = PANT.dw / (lienzo.clientWidth || innerWidth);
  return { x: (clientX * dpr - PANT.ox) / PANT.PX, y: (clientY * dpr - PANT.oy) / PANT.PX };
}

function presentar() {
  cxP.drawImage(cvM, 0, 0, PANT.W, PANT.H, PANT.ox, PANT.oy, PANT.W * PANT.PX, PANT.H * PANT.PX);
}

// ══════════ 02-entrada.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LA ENTRADA: dos joysticks que aparecen donde apoyás el pulgar (izquierda = moverse,
// derecha = llorar en 4 direcciones, como el original), botones de bomba, objeto activo,
// cápsula y pausa, y el teclado (WASD + flechas, E bomba, Espacio activo, Q cápsula).
// Cada dedo se sigue por su pointerId: moverse y disparar a la vez no se pisan.
// Los "flancos" (apretó recién) se consumen AL FINAL del cuadro (guía 2D § 1).
// ─────────────────────────────────────────────────────────────────────────────

const IN = { mx: 0, my: 0, dx: 0, dy: 0, teclas: new Set(), usaTactil: false };
const FLANCO = {};                         // bomba, activo, capsula, pausa, aceptar, toque:{x,y}
const STICKS = { mover: null, tirar: null };  // {id, x0, y0, x, y}
const RADIO_STICK = 26;
let BOTONES = [];                          // {id, x, y, r} en píxeles del mundo (los pone el HUD)
const dedos = new Map();

function recien(k) { return !!FLANCO[k]; }
function finEntrada() { for (const k in FLANCO) delete FLANCO[k]; }

const TECLAS = {
  KeyW: "arriba", KeyS: "abajo", KeyA: "izq", KeyD: "der",
  ArrowUp: "tArriba", ArrowDown: "tAbajo", ArrowLeft: "tIzq", ArrowRight: "tDer",
  KeyI: "tArriba", KeyK: "tAbajo", KeyJ: "tIzq", KeyL: "tDer",
};
addEventListener("keydown", (e) => {
  if (e.repeat) return;
  IN.usaTactil = false;
  FLANCO["k" + e.code] = true;          // cualquier tecla, para los menús
  const k = TECLAS[e.code];
  if (k) { IN.teclas.add(k); e.preventDefault(); }
  if (e.code === "KeyE" || e.code === "ShiftLeft") FLANCO.bomba = true;
  if (e.code === "Space") { FLANCO.activo = true; e.preventDefault(); }
  if (e.code === "KeyQ") FLANCO.capsula = true;
  if (e.code === "Escape" || e.code === "KeyP") FLANCO.pausa = true;
  if (e.code === "Enter" || e.code === "Space") FLANCO.aceptar = true;
  if (e.code === "KeyM") FLANCO.mapa = true;
  audioDespertar();
});
addEventListener("keyup", (e) => { const k = TECLAS[e.code]; if (k) IN.teclas.delete(k); });
addEventListener("blur", () => { IN.teclas.clear(); STICKS.mover = STICKS.tirar = null; dedos.clear(); });

function botonEn(x, y) {
  for (const b of BOTONES) if (Math.hypot(x - b.x, y - b.y) <= b.r + 4) return b;
  return null;
}
lienzo.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  audioDespertar();
  if (e.pointerType !== "mouse") IN.usaTactil = true;
  const p = aMundo(e.clientX, e.clientY);
  const d = { id: e.pointerId, x0: p.x, y0: p.y, x: p.x, y: p.y, t0: performance.now(), que: null };
  const b = enJuego() ? botonEn(p.x, p.y) : null;
  if (b) { d.que = "boton"; FLANCO[b.id] = true; b.apretado = 8; }
  else if (enJuego() && e.pointerType !== "mouse") {   // con mouse (PC) no hay joysticks: se juega con el teclado
    if (p.x < PANT.W / 2 && !STICKS.mover) { d.que = "mover"; STICKS.mover = d; }
    else if (p.x >= PANT.W / 2 && !STICKS.tirar) { d.que = "tirar"; STICKS.tirar = d; }
  }
  dedos.set(e.pointerId, d);
  try { lienzo.setPointerCapture(e.pointerId); } catch (err) { /* ya se fue */ }
}, { passive: false });
lienzo.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { const q = aMundo(e.clientX, e.clientY); IN.px = q.x; IN.py = q.y; IN.movio = true; }
  const d = dedos.get(e.pointerId);
  if (!d) return;
  const p = aMundo(e.clientX, e.clientY);
  d.x = p.x; d.y = p.y;
  // el joystick flota: si el dedo se va más allá del radio, la base lo sigue
  if (d.que === "mover" || d.que === "tirar") {
    const vx = d.x - d.x0, vy = d.y - d.y0, l = Math.hypot(vx, vy), max = RADIO_STICK * 1.25;
    if (l > max) { d.x0 = d.x - vx / l * max; d.y0 = d.y - vy / l * max; }
  }
}, { passive: false });
function soltarDedo(e) {
  const d = dedos.get(e.pointerId);
  if (!d) return;
  dedos.delete(e.pointerId);
  if (STICKS.mover === d) STICKS.mover = null;
  if (STICKS.tirar === d) STICKS.tirar = null;
  // un toque corto (menús)
  if (performance.now() - d.t0 < 450 && Math.hypot(d.x - d.x0, d.y - d.y0) < 14) FLANCO.toque = { x: d.x, y: d.y };
}
lienzo.addEventListener("pointerup", soltarDedo);
lienzo.addEventListener("pointercancel", soltarDedo);
lienzo.addEventListener("contextmenu", (e) => e.preventDefault());

/** Cada cuadro: los joysticks y las teclas → mover (analógico) y llorar (4 direcciones). */
function leerEntrada() {
  let mx = 0, my = 0, dx = 0, dy = 0;
  const t = IN.teclas;
  if (t.has("izq")) mx -= 1; if (t.has("der")) mx += 1; if (t.has("arriba")) my -= 1; if (t.has("abajo")) my += 1;
  if (mx && my) { mx *= Math.SQRT1_2; my *= Math.SQRT1_2; }
  const m = STICKS.mover;
  if (m) {
    let vx = (m.x - m.x0) / RADIO_STICK, vy = (m.y - m.y0) / RADIO_STICK, l = Math.hypot(vx, vy);
    if (l < 0.18) vx = vy = 0; else if (l > 1) { vx /= l; vy /= l; }
    mx = vx; my = vy;
  }
  // llorar: la última flecha apretada manda (como en el original: una sola dirección)
  if (t.has("tIzq")) dx = -1; else if (t.has("tDer")) dx = 1; else if (t.has("tArriba")) dy = -1; else if (t.has("tAbajo")) dy = 1;
  const s = STICKS.tirar;
  if (s) {
    const vx = s.x - s.x0, vy = s.y - s.y0;
    if (Math.hypot(vx, vy) > RADIO_STICK * 0.3) { if (Math.abs(vx) > Math.abs(vy)) { dx = sig(vx); dy = 0; } else { dx = 0; dy = sig(vy); } }
  }
  IN.mx = mx; IN.my = my; IN.dx = dx; IN.dy = dy;
}

// ══════════ 03-audio.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL SONIDO, sintetizado (sin archivos): efectos con osciladores y un búfer de ruido, y una
// música oscura por pasos (un bordón grave, un arpegio de caja de música en menor, un coro
// de ruido filtrado; en el jefe, bajo y percusión). El AudioContext nace con el primer toque.
// ─────────────────────────────────────────────────────────────────────────────

let AC = null, SAL = null, MUS = null, EFX = null, RUIDO = null, ECO = null;
let volMusica = 0.55, volEfectos = 0.8;
try { const g = JSON.parse(localStorage.getItem("shumio-audio") || "{}"); if (g.m != null) volMusica = g.m; if (g.e != null) volEfectos = g.e; } catch (e) { /* sin guardar */ }

function audioDespertar() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    SAL = AC.createDynamicsCompressor(); SAL.threshold.value = -14; SAL.ratio.value = 4; SAL.connect(AC.destination);
    MUS = AC.createGain(); MUS.gain.value = volMusica; MUS.connect(SAL);
    EFX = AC.createGain(); EFX.gain.value = volEfectos; EFX.connect(SAL);
    // un eco de sótano (reverberación corta, ruido que se apaga)
    ECO = AC.createConvolver();
    const n = AC.sampleRate * 1.8, b = AC.createBuffer(2, n, AC.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2); }
    ECO.buffer = b;
    const eg = AC.createGain(); eg.gain.value = 0.28; ECO.connect(eg); eg.connect(SAL);
    RUIDO = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const r = RUIDO.getChannelData(0); for (let i = 0; i < r.length; i++) r[i] = Math.random() * 2 - 1;
    Musica.arrancar();
  } catch (e) { AC = null; }
}

function _tono({ f = 440, f2 = null, dur = 0.12, tipo = "square", vol = 0.2, ataque = 0.004, salida = EFX, eco = 0, cuando = 0, filtro = 0, q = 1 }) {
  if (!AC) return;
  const t = AC.currentTime + cuando, o = AC.createOscillator(), g = AC.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + ataque); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let n = o;
  if (filtro) { const fl = AC.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = filtro; fl.Q.value = q; o.connect(fl); n = fl; }
  n.connect(g); g.connect(salida);
  if (eco) { const ge = AC.createGain(); ge.gain.value = eco; g.connect(ge); ge.connect(ECO); }
  o.start(t); o.stop(t + dur + 0.05);
}
function _ruido({ dur = 0.15, vol = 0.25, f = 1200, f2 = null, tipo = "lowpass", q = 1, salida = EFX, eco = 0, cuando = 0 }) {
  if (!AC) return;
  const t = AC.currentTime + cuando, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = RUIDO; s.playbackRate.value = 0.6 + Math.random() * 0.8;
  fl.type = tipo; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur); fl.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(salida);
  if (eco) { const ge = AC.createGain(); ge.gain.value = eco; g.connect(ge); ge.connect(ECO); }
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
const va = (x, p = 0.1) => x * (1 - p + Math.random() * p * 2);   // variar ±10 % lo que se repite

const SFX = {
  lagrima: () => { _tono({ f: va(520), f2: 260, dur: 0.07, tipo: "sine", vol: 0.12 }); _ruido({ dur: 0.04, vol: 0.05, f: 2600 }); },
  chapoteo: () => { _ruido({ dur: 0.09, vol: 0.09, f: va(1800), f2: 500, tipo: "bandpass", q: 2 }); _tono({ f: va(300), f2: 120, dur: 0.06, tipo: "sine", vol: 0.06 }); },
  golpe: () => { _ruido({ dur: 0.08, vol: 0.18, f: va(900), f2: 200 }); _tono({ f: va(180), f2: 70, dur: 0.08, tipo: "square", vol: 0.07, filtro: 900 }); },
  dolor: () => { _tono({ f: 330, f2: 150, dur: 0.28, tipo: "sawtooth", vol: 0.16, filtro: 1400, q: 6, eco: 0.3 }); _tono({ f: 340, f2: 155, dur: 0.28, tipo: "sawtooth", vol: 0.1, filtro: 1200 }); _ruido({ dur: 0.12, vol: 0.12, f: 700 }); },
  muere: () => { _ruido({ dur: 0.25, vol: 0.22, f: va(1400), f2: 180, eco: 0.25 }); _tono({ f: va(140), f2: 45, dur: 0.22, tipo: "square", vol: 0.08, filtro: 600 }); },
  puertaAbre: () => { _ruido({ dur: 0.35, vol: 0.2, f: 400, f2: 120, q: 3, eco: 0.4 }); _tono({ f: 70, f2: 50, dur: 0.3, tipo: "sine", vol: 0.25 }); },
  puertaCierra: () => { _tono({ f: 90, f2: 40, dur: 0.25, tipo: "sine", vol: 0.35, eco: 0.4 }); _ruido({ dur: 0.18, vol: 0.25, f: 500, f2: 90 }); },
  objeto: () => { [0, 4, 7, 12, 16].forEach((s, i) => _tono({ f: 392 * Math.pow(2, s / 12), dur: 0.35, tipo: "triangle", vol: 0.13, cuando: i * 0.07, eco: 0.45 })); },
  malo: () => { [0, -3, -7].forEach((s, i) => _tono({ f: 262 * Math.pow(2, s / 12), dur: 0.3, tipo: "sawtooth", vol: 0.08, filtro: 1100, cuando: i * 0.11, eco: 0.4 })); },
  moneda: () => { _tono({ f: 1318, dur: 0.07, tipo: "square", vol: 0.07 }); _tono({ f: 1760, dur: 0.18, tipo: "square", vol: 0.06, cuando: 0.06 }); },
  corazon: () => { _tono({ f: 523, f2: 784, dur: 0.16, tipo: "sine", vol: 0.16 }); _tono({ f: 784, dur: 0.2, tipo: "sine", vol: 0.1, cuando: 0.1 }); },
  llave: () => { _tono({ f: 2093, dur: 0.05, tipo: "triangle", vol: 0.1 }); _tono({ f: 2637, dur: 0.12, tipo: "triangle", vol: 0.08, cuando: 0.05 }); },
  recoger: () => { _tono({ f: 660, f2: 990, dur: 0.1, tipo: "triangle", vol: 0.12 }); },
  mecha: () => { _ruido({ dur: 0.9, vol: 0.05, f: 5000, tipo: "highpass" }); },
  explosion: () => { _ruido({ dur: 0.9, vol: 0.5, f: 1600, f2: 60, eco: 0.5 }); _tono({ f: 90, f2: 25, dur: 0.6, tipo: "sine", vol: 0.5 }); },
  roca: () => { _ruido({ dur: 0.22, vol: 0.25, f: 1100, f2: 200, q: 2 }); },
  moho: () => { _ruido({ dur: 0.12, vol: 0.14, f: va(700), f2: 250, q: 1.5 }); },
  jefe: () => { _tono({ f: 55, f2: 40, dur: 1.4, tipo: "sawtooth", vol: 0.25, filtro: 300, q: 8, eco: 0.6 }); _ruido({ dur: 1.2, vol: 0.18, f: 300, f2: 80, eco: 0.5 }); },
  secreto: () => { [0, 7, 12, 19].forEach((s, i) => _tono({ f: 523 * Math.pow(2, s / 12), dur: 0.5, tipo: "sine", vol: 0.1, cuando: i * 0.1, eco: 0.6 })); },
  clic: () => _tono({ f: 900, dur: 0.04, tipo: "square", vol: 0.06 }),
  escupe: () => { _ruido({ dur: 0.1, vol: 0.12, f: va(900), f2: 400, tipo: "bandpass", q: 3 }); },
  salto: () => _tono({ f: 180, f2: 90, dur: 0.18, tipo: "sine", vol: 0.14 }),
  cae: () => { _tono({ f: 80, f2: 30, dur: 0.3, tipo: "sine", vol: 0.4 }); _ruido({ dur: 0.25, vol: 0.25, f: 400, f2: 80 }); },

// EL PINTOR: todo el arte sale de acá, dibujado por código a escala 1 (un píxel = un píxel).

  piel: ["#4a302f", "#7d5752", "#b8908a", "#dfbfb2", "#f6e4da"],
  hongo: ["#2c0b10", "#5e161b", "#962824", "#c9442f", "#e9735a"],

  espora: ["#133034", "#2e6a6a", "#5ea8a0", "#a8e2d4", "#effff9"],
  piedra: ["#15181a", "#262c2c", "#3a4240", "#566058", "#7b8577", "#a2ab9a"],
  tierra: ["#170f0b", "#2c1d14", "#48301f", "#6b4a31", "#8f6a48", "#b58f67"],
  sangre: ["#2a0508", "#5c0c12", "#98161c", "#cf2b2b", "#f25a4a"],
  baba: ["#1b1d0a", "#3f4414", "#6b7020", "#9ea235", "#d0d06a"],

  hueso: ["#3b342c", "#6f6456", "#a99a86", "#d8cdb9", "#f5efe3"],
  violeta: ["#1d0f2c", "#3a1f56", "#5e3589", "#8c5cc0", "#c19ae8"],
  hielo: ["#0f2436", "#1f4d6e", "#3f82a8", "#7fbfdc", "#d2f1ff"],

function lienzoNuevo(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }

class Pix {

  g(x, y) { x = Math.floor(x); y = Math.floor(y); return this.dentro(x, y) ? this.d[y * this.w + x] : null; }
  borrar(x, y) { if (this.dentro(x, y)) this.d[y * this.w + x] = null; }

      l = l * 0.5 + 0.5 - bajar * r2 * r2;                  // el borde, más oscuro (como el original)

      if (v(1, 0) || v(-1, 0) || v(0, 1) || v(0, -1) || (esquinas && (v(1, 1) || v(-1, 1) || v(1, -1) || v(-1, -1)))) this.d[y * w + x] = c;

      const v = (dx, dy) => { const X = x + dx, Y = y + dy; return X >= 0 && Y >= 0 && X < w && Y < this.h && lleno[Y * w + X]; };
      if (!v(1, 0) || !v(-1, 0) || !v(0, 1) || !v(0, -1)) { const c = this.d[y * w + x], n = mapa[c]; if (n) cambios.push([x, y, n]); }

  copiar() { const q = new Pix(this.w, this.h); q.d = this.d.slice(); return q; }
  pegar(o, dx, dy) { for (let y = 0; y < o.h; y++) for (let x = 0; x < o.w; x++) { const c = o.d[y * o.w + x]; if (c) this.p(x + dx, y + dy, c); } return this; }

    const c = lienzoNuevo(this.w, this.h), g = c.getContext("2d"), im = g.createImageData(this.w, this.h);

const _rgba = new Map();
function rgba(col) {
  let v = _rgba.get(col);

    const n = parseInt(col.slice(1, 7), 16);
    v = [(n >> 16) & 255, (n >> 8) & 255, n & 255, col.length > 7 ? parseInt(col.slice(7, 9), 16) : 255];
  } else { const m = col.match(/[\d.]+/g).map(Number); v = [m[0], m[1], m[2], Math.round((m[3] ?? 1) * 255)]; }

}
function hex(r, g, b) { return "#" + [r, g, b].map((x) => lim(Math.round(x), 0, 255).toString(16).padStart(2, "0")).join(""); }

/** Una rampa nueva desde un color base (para campeones y ítems). */
function rampaDe(base, n = 5) { const out = []; for (let i = 0; i < n; i++) { const t = i / (n - 1); out.push(t < 0.5 ? mezclar("#0b0709", base, 0.25 + t * 1.5) : mezclar(base, "#fff6ea", (t - 0.5) * 0.9)); } return out; }

// ── la caché de sprites ──
const SPR = {};
function hornear(clave, fn) { if (!SPR[clave]) SPR[clave] = fn(); return SPR[clave]; }

const _blancos = new WeakMap();
function blanco(c) {
  let b = _blancos.get(c);
  if (b) return b;
  b = lienzoNuevo(c.width, c.height);
  const g = b.getContext("2d"); g.drawImage(c, 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = "#fff4f0"; g.fillRect(0, 0, b.width, b.height);

}

function rojizo(c) {
  let b = _rojos.get(c);
  if (b) return b;
  b = lienzoNuevo(c.width, c.height);
  const g = b.getContext("2d"); g.drawImage(c, 0, 0); g.globalCompositeOperation = "source-atop"; g.fillStyle = "rgba(220,30,30,0.55)"; g.fillRect(0, 0, b.width, b.height);

/** La sombra en el piso: una elipse de píxeles duros, semitransparente. */
function sombra(rx, ry) {
  return hornear(`sombra${rx}x${ry}`, () => {
    const p = new Pix(rx * 2 + 1, ry * 2 + 1);
    for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) {
      const nx = (x + 0.5 - p.w / 2) / (rx + 0.5), ny = (y + 0.5 - p.h / 2) / (ry + 0.5), r = nx * nx + ny * ny;
      if (r <= 1) p.p(x, y, r < 0.45 ? "rgba(4,2,6,0.46)" : "rgba(4,2,6,0.30)");

// ══════════ 05-arte-shumio.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// SHUMIO: un chico-hongo. Cabeza grande y pálida (como los personajes de este género: la cabeza
// es la que llora y apunta), un sombrero de hongo rojo con manchas crema, ojos grandes y
// húmedos, túnica de musgo. La cabeza y el cuerpo van separados: la cabeza mira hacia donde
// llorás, el cuerpo hacia donde caminás.
// ─────────────────────────────────────────────────────────────────────────────

const CAB_W = 22, CAB_H = 22, CUE_W = 14, CUE_H = 12;
const TINTA = PAL.tinta;

/** vista: "frente" | "espalda" | "lado" (mirando a la derecha). gesto: 0 normal, 1 llorando (tira), 2 parpadeo, 3 dolor. */
function pintarCabeza(vista, gesto, pielR = PAL.piel, gorroR = PAL.hongo) {
  const p = new Pix(CAB_W, CAB_H);
  // Todo simétrico alrededor del centro de la cabeza: x = 10.5 en píxeles (la bola va de 1 a 20).
  const CX = 11;
  p.bola(CX, 13.7, vista === "lado" ? 9.0 : 9.4, 8.1, pielR, { luz: [-0.4, -0.55, 0.73], bajar: 0.22, trama: 0.55 });
  // El sombrero: el casquete de un hongo, centrado sobre la cabeza (de costado también: el ala
  // sobresale lo mismo adelante y atrás). El ala es una curva limpia, apenas caída en las puntas.
  const gy = vista === "espalda" ? 8.1 : 7.2, gry = vista === "espalda" ? 7.2 : 6.4;
  const alaY = (x) => Math.round(gy + 2.2 + 1.4 * Math.pow((x + 0.5 - CX) / 10, 2));
  p.bola(CX, gy, 10.2, gry, gorroR, { filtro: (x, y) => y <= alaY(x), luz: [-0.5, -0.7, 0.5], bajar: 0.1, trama: 0.7 });
  for (let x = 0; x < CAB_W; x++) {
    const y = alaY(x);
    if (!p.g(x, y)) continue;
    p.p(x, y, gorroR[1]);                                        // el canto del ala
    if (vista !== "espalda" && p.g(x, y + 1) && x > 2 && x < CAB_W - 3) p.p(x, y + 1, pielR[1]);   // la sombra en la frente
  }
  // las manchas: cada una con su luz arriba a la izquierda y su sombra abajo a la derecha
  const manchas = vista === "espalda" ? [[4, 6, 3], [10, 3, 3], [15, 6, 2], [8, 9, 2], [16, 10, 1]]
    : vista === "lado" ? [[3, 6, 2], [9, 3, 3], [15, 5, 2], [12, 8, 1], [6, 9, 1]]
    : [[4, 5, 2], [9, 2, 3], [15, 4, 2], [12, 7, 1], [6, 8, 1]];
  for (const [x, y, t] of manchas) {
    if (!p.g(x, y) || y >= alaY(x)) continue;
    const m = t === 3 ? [".cc.", "cCCd", ".dd."] : t === 2 ? ["cc", "Cd"] : ["c"];
    p.sello(x, y, m, { c: PAL.crema[3], C: PAL.crema[2], d: PAL.crema[1] });
  }
  const K = TINTA, pal = { e: K, W: "#ffffff", h: "#4f6c7a", t: PAL.espora[3] };
  if (vista === "frente") {
    // los ojos: la MISMA forma los dos (simétricos), y el brillo arriba a la izquierda en los dos (la luz)
    const ojo = gesto === 1 || gesto === 2 ? ["....", "eeee", ".tt."]
      : gesto === 3 ? ["e..e", ".ee.", "e..e"]
      : [".ee.", "eWee", "eeee", "eeeh", ".ee."];
    p.sello(5, 13, ojo, pal); p.sello(13, 13, ojo, pal);        // 5..8 y 13..16: centro 10.5
    p.p(4, 18, "#d99a90"); p.p(17, 18, "#d99a90");               // los cachetes (4 y 17)
    // la boca, de 2 px (10 y 11), centrada
    if (gesto === 1) p.sello(9, 18, [".kk.", "kmmk", ".kk."], { k: K, m: "#6a2c30" });
    else if (gesto === 3) p.sello(9, 18, [".kk.", "kmmk"], { k: K, m: "#6a2c30" });
    else p.sello(10, 19, ["kk"], { k: "#5a3034" });
    // las esporas que le caen de los ojos (6 y 15: debajo del segundo píxel de cada ojo, espejados)
    if (gesto !== 3) { p.p(6, 18, PAL.espora[3]); p.p(15, 18, PAL.espora[3]); if (gesto === 1) { p.p(6, 19, PAL.espora[2]); p.p(15, 19, PAL.espora[2]); } }
  } else if (vista === "lado") {
    const ojo = gesto === 1 || gesto === 2 ? ["...", "eee", ".t."] : gesto === 3 ? ["e.e", ".e.", "e.e"] : [".e.", "eWe", "eee", "eeh", ".e."];
    p.sello(15, 13, ojo, pal);
    // (de costado sin cachete: pegado al contorno se lee como una mancha en la mandíbula)
    if (gesto === 1) p.sello(17, 18, ["k", "m", "k"], { k: K, m: "#6a2c30" }); else p.p(17, 19, "#5a3034");
    if (gesto !== 3) { p.p(16, 18, PAL.espora[3]); if (gesto === 1) p.p(16, 19, PAL.espora[2]); }
  } else {
    // de espaldas: la nuca con un poco más de sombra abajo
    for (let x = 4; x < 18; x++) if (p.g(x, 20) && p.g(x, 21)) p.p(x, 20, pielR[1]);
  }
  p.contorno(K);
  return p;
}

/** El cuerpo: túnica de musgo, bracitos y piernas. vista frente/espalda/lado; paso 0..3. */
function pintarCuerpo(vista, paso, tunicaR = PAL.musgo, pielR = PAL.piel) {
  const p = new Pix(CUE_W, CUE_H);
  const pierna = [0, 1, 0, -1][paso];
  if (vista === "lado") {
    // piernas: una adelante y otra atrás según el paso
    const a = [2, 0, -2, 0][paso];
    p.caja(6 + a, 7, 2, 4, [pielR[1], pielR[2], pielR[3]]); p.p(6 + a, 10, pielR[0]); p.p(7 + a, 10, pielR[0]); p.p(8 + a, 10, TINTA);
    p.caja(6 - a, 7, 2, 4, [pielR[0], pielR[1], pielR[2]]); p.p(6 - a, 10, pielR[0]); p.p(7 - a, 10, TINTA);
    p.bola(7, 5, 3.9, 3.8, tunicaR, { bajar: 0.1 });
    // el brazo que se balancea
    const b = [-1, 0, 1, 0][paso];
    p.caja(7 + b, 4, 2, 3, [pielR[2], pielR[3]]);
    // el cinturón de raíz
    for (let x = 3; x < 11; x++) if (p.g(x, 6)) p.p(x, 6, PAL.tierra[2]);
  } else {
    const l = pierna, r = -pierna;
    p.caja(4, 7 + Math.max(0, l), 2, 4 - Math.max(0, l), [pielR[1], pielR[2], pielR[3]]);
    p.caja(8, 7 + Math.max(0, r), 2, 4 - Math.max(0, r), [pielR[1], pielR[2], pielR[3]]);
    p.p(4, 10, pielR[0]); p.p(5, 10, pielR[0]); p.p(8, 10, pielR[0]); p.p(9, 10, pielR[0]);
    p.bola(7, 4.6, 4.7, 4.0, tunicaR, { bajar: 0.12 });
    // los bracitos a los costados, que se mueven al caminar
    p.caja(1, 3 + Math.max(0, r), 2, 3, [pielR[1], pielR[2], pielR[3]]);
    p.caja(11, 3 + Math.max(0, l), 2, 3, [pielR[1], pielR[2], pielR[3]]);
    for (let x = 3; x < 12; x++) if (p.g(x, 6) && p.g(x, 6) !== pielR[1]) p.p(x, 6, PAL.tierra[2]);
    if (vista === "frente") { p.p(7, 3, tunicaR[4]); p.p(6, 2, tunicaR[3]); p.p(7, 6, PAL.oro[3]); }   // la hebilla
    else { for (let y = 1; y < 6; y++) if (p.g(7, y)) p.p(7, y, tunicaR[1]); }                          // la costura de atrás
  }
  p.contorno(TINTA);
  return p;
}

/** Los sprites de Shumio, horneados: cabezas por vista y gesto, cuerpos por vista y paso. */
function spritesShumio(pielR = PAL.piel, gorroR = PAL.hongo, tunicaR = PAL.musgo, clave = "shumio") {
  return hornear(clave, () => {
    const s = { cab: {}, cue: {} };
    for (const v of ["frente", "espalda", "lado"]) {
      s.cab[v] = [0, 1, 2, 3].map((g) => pintarCabeza(v, g, pielR, gorroR).canvas());
      s.cab[v + "I"] = [0, 1, 2, 3].map((g) => pintarCabeza(v, g, pielR, gorroR).espejo().canvas());
      s.cue[v] = [0, 1, 2, 3].map((k) => pintarCuerpo(v, k, tunicaR, pielR).canvas());
      s.cue[v + "I"] = [0, 1, 2, 3].map((k) => pintarCuerpo(v, k, tunicaR, pielR).espejo().canvas());
    }
    return s;
  });
}

// ── las lágrimas (esporas) ──
const COLOR_LAGRIMA = {
  espora: PAL.espora, sangre: PAL.sangre, veneno: ["#0f200c", "#255a1c", "#44922c", "#86d04a", "#d8ff9a"],
  violeta: PAL.violeta, hielo: PAL.hielo, fuego: PAL.fuego, oro: PAL.oro, hueso: PAL.hueso, enemigo: ["#1a0306", "#4a0a10", "#8e1a1e", "#d0392f", "#ff8b6a"],
  moho: PAL.baba, tinta: ["#050305", "#1a1320", "#2f2638", "#4d4260", "#7a6c90"],
};
/** Una lágrima de radio r (2..9) y color. Con un brillo arriba a la izquierda y el contorno oscuro. */
function lagrimaSpr(r, color = "espora") {
  r = lim(Math.round(r), 2, 10);
  return hornear(`lag${color}${r}`, () => {
    const rampa = COLOR_LAGRIMA[color] || PAL.espora, s = r * 2 + 3, p = new Pix(s, s), c = s / 2;
    p.bola(c, c, r + 0.3, r + 0.3, rampa.slice(1), { luz: [-0.55, -0.6, 0.58], bajar: 0.05, trama: 0.6 });
    if (r >= 3) { p.p(Math.floor(c - r * 0.45), Math.floor(c - r * 0.5), rampa[4]); if (r >= 5) p.p(Math.floor(c - r * 0.45) + 1, Math.floor(c - r * 0.5), rampa[4]); }
    p.contorno(rampa[0]);
    return p.canvas();
  });
}
/** El chapoteo de una lágrima que se rompe: 5 cuadros. */
function chapoteoSpr(color = "espora", k) {
  return hornear(`chap${color}${k}`, () => {
    const rampa = COLOR_LAGRIMA[color] || PAL.espora, p = new Pix(17, 17), c = 8;
    const r = 2 + k * 1.3;
    for (let i = 0; i < 8; i++) {
      const a = i * TAU / 8 + k * 0.2, d = r + (i % 2) * 1.2;
      const x = c + Math.cos(a) * d, y = c + Math.sin(a) * d * 0.8;
      if (k < 4) p.p(x, y, rampa[k < 2 ? 3 : 2]);
      if (k < 2) p.p(x + Math.cos(a), y + Math.sin(a) * 0.8, rampa[2]);
    }
    if (k < 3) p.bola(c, c, 3 - k, 2.4 - k * 0.7, rampa.slice(1), { trama: 0.3 });
    return p.canvas();
  });
}

// ══════════ 06-arte-sala.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL ARTE DE LA SALA: el piso, los muros, las puertas y los obstáculos, por capítulo.
// El fondo de cada sala se hornea UNA vez (con su semilla: la misma sala se ve igual al volver)
// y encima se dibujan las manchas que van quedando (sangre, baba, quemaduras de bomba).
// ─────────────────────────────────────────────────────────────────────────────

const CAPITULOS = {
  sotano: {
    nombre: "SÓTANO HÚMEDO", piso: ["#1a1f1b", "#232a25", "#2c342d", "#363f36", "#434c41", "#525b4e"],
    junta: "#101411", ladrillo: ["#141815", "#1e2420", "#2a322b", "#39433a", "#4b564a", "#5e6a5c"], mortero: "#0c0f0d",
    musgo: PAL.musgo, mancha: "#161b17", oscuro: "#050706", tinte: [12, 18, 12],
  },
  raices: {
    nombre: "LAS RAÍCES", piso: ["#1d140e", "#281c13", "#34251a", "#413021", "#503c2a", "#614a35"],
    junta: "#130c08", ladrillo: ["#170f0a", "#231710", "#321f15", "#44291b", "#583624", "#6d4630"], mortero: "#0d0806",
    musgo: ["#1a1409", "#2e2410", "#4a3a18", "#6b5626", "#8d7536"], mancha: "#1a120c", oscuro: "#070403", tinte: [22, 12, 6],
  },
};

/** Una línea continua (Bresenham): sin huecos ni saltos, como la trazaría un pixelador. */
function trazo(x0, y0, x1, y1, fn) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) { fn(x0, y0); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
/** Una grieta: 2 a 4 tramos que cambian de rumbo de a poco, con el borde de abajo iluminado (la profundidad). */
function grieta(r, x, y, largo, pintar, iluminar) {
  let a = r() * TAU;
  const tramos = 2 + Math.floor(r() * 3);
  for (let k = 0; k < tramos; k++) {
    const l = largo / tramos * (0.7 + r() * 0.6), nx = x + Math.cos(a) * l, ny = y + Math.sin(a) * l;
    trazo(x, y, nx, ny, (X, Y) => { pintar(X, Y); if (iluminar) iluminar(X + 1, Y + 1); });
    x = nx; y = ny; a += (r() - 0.5) * 1.3;
  }
}

/** El fondo entero de una sala (muros + piso), horneado con su semilla. */
function hornearFondo(capituloId, semilla) {
  const C = CAPITULOS[capituloId], r = mulberry(semilla), W = SALA_W, H = SALA_H;
  const cv = lienzoNuevo(W, H), g = cv.getContext("2d"), im = g.createImageData(W, H), d = im.data;
  const px = (x, y, col) => { if (x < 0 || y < 0 || x >= W || y >= H) return; const [R, G, B] = rgba(col), i = (y * W + x) * 4; d[i] = R; d[i + 1] = G; d[i + 2] = B; d[i + 3] = 255; };
  const tono = (rampa, i) => rampa[lim(Math.round(i), 0, rampa.length - 1)];
  const oscurecer = (x, y, t) => { if (x < 0 || y < 0 || x >= W || y >= H) return; const i = (y * W + x) * 4; d[i] *= t; d[i + 1] *= t; d[i + 2] *= t; };
  // ── el piso: losas de 24 con bisel, motas, grietas, musgo junto a los muros ──
  for (let f = 0; f < FILAS; f++) for (let c = 0; c < COLS; c++) {
    const x0 = IX0 + c * T, y0 = IY0 + f * T, base = 2.6 + (r() - 0.5) * 1.1;
    // algunas losas partidas en dos
    const partida = r() < 0.18 ? (r() < 0.5 ? "h" : "v") : null;
    for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) {
      let i = base + bayer(x + c, y + f) * 0.9;
      if (x === 0 || y === 0) i += 0.9;                 // el borde de arriba/izquierda, iluminado
      if (x === T - 1 || y === T - 1) i = 0;            // la junta
      if (x === T - 2 || y === T - 2) i -= 0.7;
      if (partida === "h" && y === 11 && x > 1) i = 0.4;
      if (partida === "v" && x === 11 && y > 1) i = 0.4;
      const m = r();
      if (m < 0.05) i -= 1; else if (m > 0.97) i += 1;  // las motas
      px(x0 + x, y0 + y, i <= 0.05 ? C.junta : tono(C.piso, i));
    }
  }
  // las grietas (sobre las losas ya pintadas: el borde iluminado lee el tono de al lado)
  for (let k = 0; k < 16; k++) {
    const x = IX0 + 4 + r() * (COLS * T - 8), y = IY0 + 4 + r() * (FILAS * T - 8);
    grieta(r, x, y, 6 + r() * 10, (X, Y) => px(X, Y, C.junta), (X, Y) => { if (X > IX0 && Y > IY0 && X < IX1 && Y < IY1) { const i = (Y * W + X) * 4; if (d[i] > 30) px(X, Y, C.piso[4]); } });
  }
  // manchas de humedad: una mancha sólida de borde irregular, que oscurece lo que tiene abajo (no un color encima)
  for (let k = 0; k < 7; k++) {
    const mx = IX0 + 10 + r() * (COLS * T - 20), my = IY0 + 10 + r() * (FILAS * T - 20), rr = 6 + r() * 9, f1 = r() * TAU, f2 = r() * TAU;
    for (let y = -rr - 3; y <= rr + 3; y++) for (let x = -rr * 1.4 - 3; x <= rr * 1.4 + 3; x++) {
      const an = Math.atan2(y, x), borde = rr * (1 + 0.22 * Math.sin(an * 3 + f1) + 0.14 * Math.sin(an * 5 + f2));
      const dd = Math.hypot(x / 1.4, y) - borde, X = Math.round(mx + x), Y = Math.round(my + y);
      if (dd < -1.5) oscurecer(X, Y, 0.78); else if (dd < 0.5 && bayer(X, Y) < 0) oscurecer(X, Y, 0.86);
    }
  }
  // musgo: manchones al pie de los muros, con el centro más claro y el borde tramado
  for (let k = 0; k < 14; k++) {
    const lado = Math.floor(r() * 4);
    const mx = lado === 3 ? IX0 + 2 : lado === 1 ? IX1 - 3 : IX0 + 8 + r() * (COLS * T - 16);
    const my = lado === 0 ? IY0 + 2 : lado === 2 ? IY1 - 3 : IY0 + 8 + r() * (FILAS * T - 16);
    const rx = lado % 2 ? 3 + r() * 3 : 6 + r() * 9, ry = lado % 2 ? 6 + r() * 9 : 3 + r() * 3;
    for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) {
      const e = (x * x) / (rx * rx) + (y * y) / (ry * ry), X = Math.round(mx + x), Y = Math.round(my + y);
      if (X < IX0 || Y < IY0 || X >= IX1 || Y >= IY1) continue;
      if (e < 0.35) px(X, Y, C.musgo[3]); else if (e < 0.7) px(X, Y, C.musgo[2]); else if (e < 1 && bayer(X, Y) < 0.1) px(X, Y, C.musgo[1]);
    }
  }
  // ── los muros: hileras de ladrillos (el de arriba más alto) ──
  const ladrillos = (x0, y0, w, h, alto, anchoL, desde) => {
    for (let y = y0; y < y0 + h; y++) {
      const hilera = Math.floor((y - y0) / alto), dentroY = (y - y0) % alto, corr = (hilera % 2) * Math.floor(anchoL / 2);
      for (let x = x0; x < x0 + w; x++) {
        const dentroX = (x - x0 + corr) % anchoL, id = hilera * 97 + Math.floor((x - x0 + corr) / anchoL);
        if (dentroY === alto - 1 || dentroX === anchoL - 1) { px(x, y, C.mortero); continue; }
        const semi = ((id * 2654435761) >>> 0) / 4294967296;
        let i = desde + (semi - 0.5) * 1.2 + (dentroY === 0 ? 0.9 : 0) - (dentroY === alto - 2 ? 0.6 : 0) + bayer(x, y) * 0.7;
        if (semi > 0.93 && dentroX > 2 && dentroX < anchoL - 3 && dentroY > 1) i -= 1.6;   // un ladrillo roto
        px(x, y, tono(C.ladrillo, i));
      }
    }
  };
  ladrillos(0, 0, W, MURO_A, 8, 16, 3.2);                     // arriba
  ladrillos(0, H - MURO_B, W, MURO_B, 8, 16, 2.4);             // abajo
  ladrillos(0, MURO_A, MURO_L, H - MURO_A - MURO_B, 8, 12, 2.7);   // izquierda
  ladrillos(W - MURO_L, MURO_A, MURO_L, H - MURO_A - MURO_B, 8, 12, 2.7);
  // la sombra de los muros sobre el piso (más larga abajo del muro de arriba) y el zócalo
  for (let x = IX0; x < IX1; x++) for (let k = 0; k < 9; k++) oscurecer(x, IY0 + k, 0.45 + k * 0.06);
  for (let y = IY0; y < IY1; y++) { for (let k = 0; k < 5; k++) { oscurecer(IX0 + k, y, 0.55 + k * 0.09); oscurecer(IX1 - 1 - k, y, 0.55 + k * 0.09); } }
  for (let x = IX0; x < IX1; x++) for (let k = 0; k < 3; k++) oscurecer(x, IY1 - 1 - k, 0.7 + k * 0.1);
  // el borde de arriba de cada muro (el canto), iluminado, y los rincones más oscuros
  for (let x = IX0 - 2; x < IX1 + 2; x++) { px(x, IY0 - 1, C.ladrillo[5]); px(x, IY1, C.ladrillo[1]); }
  for (let y = IY0 - 1; y < IY1 + 1; y++) { px(IX0 - 1, y, C.ladrillo[4]); px(IX1, y, C.ladrillo[4]); }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    // la luz: el centro de la sala más claro, los muros y los rincones se van a oscuro
    const nx = (x - W / 2) / (W / 2), ny = (y - (H / 2 + 6)) / (H / 2), e = nx * nx * 0.75 + ny * ny;
    oscurecer(x, y, lim(1.12 - e * 0.55, 0.28, 1.12));
  }
  // el techo que no se ve: negro con el borde de los muros comido
  for (let x = 0; x < W; x++) for (let y = 0; y < 3; y++) oscurecer(x, y, 0.2 + y * 0.25);
  g.putImageData(im, 0, 0);
  // detalles del capítulo, a mano: raíces colgando, telarañas, huesitos
  const q = new Pix(W, H);
  if (capituloId === "raices") {
    for (let k = 0; k < 9; k++) {
      let x = 10 + r() * (W - 20), y = 0; const n = 10 + r() * 22;
      for (let i = 0; i < n; i++) { q.p(x, y, PAL.tierra[i % 3 === 0 ? 1 : 2]); q.p(x + 1, y, PAL.tierra[1]); y += 1; x += (r() - 0.5) * 1.2; if (y > MURO_A + 4) break; }
    }
    // vigas de madera en los muros de costado
    for (const bx of [4, W - 10]) for (let y = MURO_A + 10; y < H - MURO_B - 6; y += 46) q.caja(bx, y, 6, 20, PAL.tierra.slice(1), { vertical: 0.2 });
  } else {
    for (let k = 0; k < 6; k++) { const x = 6 + r() * (W - 12); for (let y = 0; y < 5 + r() * 16; y++) q.p(x, y, C.musgo[2 + (y % 2)]); }
  }
  // telarañas en los rincones de arriba: tres hilos desde el rincón y dos vueltas que los unen
  for (const [x0, s] of [[IX0, 1], [IX1 - 1, -1]]) {
    const hilo = "#5d625a", vuelta = "#474b45", L = 13;
    const ang = [0.12, 0.62, 1.2];
    for (const a of ang) trazo(x0, IY0, x0 + s * Math.cos(a) * L, IY0 + Math.sin(a) * L, (X, Y) => q.p(X, Y, hilo));
    for (const rad of [5, 9]) {
      let ant = null;
      for (let t = 0; t <= 12; t++) {
        const a = ang[0] + (ang[2] - ang[0]) * t / 12, cae = Math.sin(t / 12 * Math.PI * 2 % Math.PI) * 0.8;
        const P = [x0 + s * Math.cos(a) * rad, IY0 + Math.sin(a) * rad + cae];
        if (ant) trazo(ant[0], ant[1], P[0], P[1], (X, Y) => q.p(X, Y, vuelta));
        ant = P;
      }
    }
  }
  g.drawImage(q.canvas(), 0, 0);
  return cv;
}

/** La viñeta de la sala: oscuridad tramada (Bayer) que se come los bordes, como luz de vela. */
function vineta() {
  return hornear("vineta", () => {
    const W = SALA_W + 40, H = SALA_H + 40, p = new Pix(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const nx = (x - W / 2) / (W / 2), ny = (y - H / 2) / (H / 2), e = Math.pow(nx * nx * 0.8 + ny * ny * 0.95, 1.4);
      const k = e * 1.25 - 0.35 + bayer(x, y) * 0.35;
      if (k > 0.66) p.p(x, y, "rgba(3,2,5,0.72)"); else if (k > 0.42) p.p(x, y, "rgba(3,2,5,0.45)"); else if (k > 0.2) p.p(x, y, "rgba(3,2,5,0.22)");
    }
    return p.canvas();
  });
}

// ── las puertas: el marco y las hojas, por tipo de sala ──
// El sprite es de la puerta de ARRIBA (32×30); las otras se dibujan rotadas.
const TIPO_PUERTA = {
  normal: { marco: PAL.piedra, brillo: null },
  tesoro: { marco: PAL.oro, brillo: "#ffd96a" },
  jefe: { marco: PAL.sangre, brillo: "#ff3b2f" },
  tienda: { marco: PAL.piedra, brillo: null },
  secreta: { marco: null },
  pacto: { marco: ["#0a0406", "#220a0e", "#3d0f15", "#651a20", "#8e2a2a"], brillo: "#ff2a2a" },
};
function puertaSpr(tipo, estado, prof = MURO_A) {
  return hornear(`puerta${tipo}${estado}${prof}`, () => {
    // todo se dibuja con el piso abajo (y = prof es el borde del piso): en un muro más finito, lo
    // que se pierde es lo de arriba (lo más lejano), no la boca de la puerta
    const H = prof, o = H - 32, p = new Pix(34, H), t = TIPO_PUERTA[tipo];
    const P = (x, y, c) => p.p(x, y + o, c);
    if (tipo === "secreta") {
      for (let y = 6; y < 32; y++) for (let x = 5; x < 29; x++) {
        const nx = (x - 17) / 11, ny = (y - 22) / 14;

const GRADIENTES = {

/** Hornea un texto: relleno con degradé por fila, contorno y sombra. o: {grad, contorno, sombra, escala} */
function textoSpr(str, o = {}) {
  str = String(str).toUpperCase();
  const clave = `tx|${str}|${o.grad || "blanco"}|${o.contorno ?? 1}|${o.sombra ?? 1}`;
  return hornear(clave, () => {
    const esp = 1, alto = 7, arriba = 3;
    let w = 0;
    for (const ch of str) { const base = MARCAS[ch] ? MARCAS[ch][0] : ch; w += glifo(base).w + esp; }
    w = Math.max(1, w - esp);
    const p = new Pix(w + 4, alto + arriba + 4), grad = GRADIENTES[o.grad || "blanco"];
    let x = 2;
    for (const ch of str) {
      const m = MARCAS[ch], base = m ? m[0] : ch, gl = glifo(base);
      gl.filas.forEach((f, y) => { for (let i = 0; i < f.length; i++) if (f[i] === "#") p.p(x + i, arriba + 2 + y, grad[y]); });
      if (m) {
        const cx0 = x + Math.floor(gl.w / 2);
        if (m[1] === "´") { p.p(cx0, arriba, grad[0]); p.p(cx0 + 1, arriba - 1, grad[0]); }
        if (m[1] === "~") { p.p(cx0 - 2, arriba, grad[0]); p.p(cx0 - 1, arriba - 1, grad[0]); p.p(cx0, arriba, grad[0]); p.p(cx0 + 1, arriba - 1, grad[0]); }
        if (m[1] === "¨") { p.p(cx0 - 1, arriba, grad[0]); p.p(cx0 + 1, arriba, grad[0]); }
      }
      x += gl.w + esp;
    }
    if (o.contorno ?? 1) p.contorno(PAL.tinta, true);
    let c = p.canvas();
    if (o.sombra ?? 1) {
      const s = lienzoNuevo(c.width + 1, c.height + 1), g = s.getContext("2d");
      g.globalAlpha = 0.55; g.drawImage(blanco(c), 1, 1); g.globalCompositeOperation = "source-in"; g.fillStyle = "#000"; g.fillRect(0, 0, s.width, s.height);
      g.globalCompositeOperation = "source-over"; g.globalAlpha = 1; g.drawImage(c, 0, 0);
      c = s;
    }
    return c;
  });
}

const ALTO_BLOQUE = 8;

/** ¿Dónde se gasta cada letra? Un par de mordiscos por glifo, siempre los mismos (semilla por letra). */
function gastar(filas, ch) {
  const r = mulberry(hashTexto("gasta" + ch)), m = filas.map((f) => [...f]);
  const h = m.length, w = m[0].length, lleno = (x, y) => x >= 0 && y >= 0 && x < w && y < h && m[y][x] === "#";
  const esquinas = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!lleno(x, y)) continue;
    // esquina de afuera: vacío arriba o abajo, y vacío a un costado, pero con el trazo sano al lado
    const vert = !lleno(x, y - 1) || !lleno(x, y + 1), hor = !lleno(x - 1, y) || !lleno(x + 1, y);
    if (vert && hor && (lleno(x + 1, y) || lleno(x - 1, y)) && (lleno(x, y + 1) || lleno(x, y - 1))) esquinas.push([x, y]);
  }
  const n = w > 3 ? (r() < 0.55 ? 1 : 0) + (r() < 0.2 ? 1 : 0) : 0;
  for (let i = 0; i < n && esquinas.length; i++) { const [x, y] = esquinas.splice(Math.floor(r() * esquinas.length), 1)[0]; m[y][x] = "g"; }   // "g" = gastado (gris, no hueco)
  return m.map((f) => f.join(""));
}
const _glifosB = {};
function glifoBloque(ch) {
  if (_glifosB[ch]) return _glifosB[ch];
  const base = BLOQUE[ch] || BLOQUE["?"];
  return (_glifosB[ch] = { w: base[0].length, filas: gastar(base, ch) });
}

// ── dibujar texto en las tres letras ──
function _medir(str, ancho, esp) { let w = 0; for (const ch of str) w += ancho(ch) + esp; return Math.max(1, w - esp); }

/** Letra de bloque: blanca (o con degradé), gastada, contorno negro y sombra. o: {grad, sombra, escala} */
function bloqueSpr(str, o = {}) {
  str = String(str).toUpperCase();
  const clave = `blq|${str}|${o.grad || "hueso"}|${o.sombra ?? 1}`;
  return hornear(clave, () => {
    const esp = 1, arriba = 3, W = _medir(str, (ch) => glifoBloque(MARCAS[ch] ? MARCAS[ch][0] : ch).w, esp);
    const p = new Pix(W + 4, ALTO_BLOQUE + arriba + 4);
    const R = o.grad === "rojo" ? ["#ffd6c8", "#ff8f74", "#f0553d", "#c8302a", "#8e1a19"] : o.grad === "oro" ? ["#fff4c4", "#ffe08a", "#f5c24a", "#d8962a", "#9c6014"] : o.grad === "espora" ? ["#f2fffb", "#c9f5e8", "#8fe0cc", "#56b3a3", "#2c716a"] : ["#ffffff", "#f6f2ea", "#ece6da", "#d6cfc1", "#b3aa99"];
    let x = 2;
    for (const ch of str) {
      const m = MARCAS[ch], gl = glifoBloque(m ? m[0] : ch);
      gl.filas.forEach((f, y) => {
        for (let i = 0; i < f.length; i++) {
          if (f[i] === ".") continue;
          // degradé por fila, y lo gastado un tono más apagado
          const t = y / (ALTO_BLOQUE - 1), k = f[i] === "g" ? 4 : lim(Math.floor(t * 3.2 + bayer(x + i, y) * 0.8), 0, 3);
          p.p(x + i, arriba + 2 + y, R[k]);
        }
      });
      if (m) {
        const c0 = x + Math.floor(gl.w / 2) - 1, y0 = arriba;
        if (m[1] === "´") { p.p(c0 + 1, y0, R[0]); p.p(c0 + 2, y0, R[0]); p.p(c0 + 2, y0 - 1, R[0]); p.p(c0 + 3, y0 - 1, R[0]); }
        if (m[1] === "~") for (const [dx, dy] of [[-1, 0], [0, -1], [1, -1], [2, 0], [3, 0], [4, -1]]) p.p(c0 + dx, y0 + dy, R[0]);
        if (m[1] === "¨") { p.p(c0, y0, R[0]); p.p(c0 - 1, y0, R[0]); p.p(c0 + 3, y0, R[0]); p.p(c0 + 4, y0, R[0]); }
      }
      x += gl.w + esp;
    }
    p.contorno(PAL.tinta, true);
    let c = p.canvas();
    if (o.sombra ?? 1) {   // la sombra dura, un píxel abajo a la derecha (como el original)
      const s = lienzoNuevo(c.width + 1, c.height + 1), g = s.getContext("2d");
      g.drawImage(tinte(c, PAL.tinta), 1, 1); g.drawImage(c, 0, 0);
      c = s;
    }
    return c;
  });
}

      const f = CIFRAS[ch] || CIFRAS[0];
      f.forEach((fila, y) => { for (let i = 0; i < fila.length; i++) if (fila[i] === "#") p.p(x + i, 1 + y, R[y < 4 ? 0 : y < 6 ? 1 : 2]); });

  });

// las mayúsculas con tilde: la marca encima (una fila de aire)
const TILDE_SUB = { "Á": "A", "É": "E", "Í": "I", "Ó": "O", "Ú": "U", "Ñ": "N" };
/** El subtítulo, tal cual se escribe (con minúsculas). */
function subtituloSpr(str) {
  str = String(str);
  return hornear(`sub|${str}`, () => {
    const arriba = 2, H = 9, esp = 1;
    const glifoDe = (ch) => SUBT[ch] || SUBT[TILDE_SUB[ch]] || SUBT[ch.toLowerCase()] || SUBT["?"];
    let W = 0; for (const ch of str) W += glifoDe(ch)[0].length + esp;
    const p = new Pix(W + 3, H + arriba + 3);
    let x = 1;
    for (const ch of str) {
      const f = glifoDe(ch), w = f[0].length;
      // los signos y las mayúsculas se apoyan en la línea de base (fila 6)
      const y0 = /[a-zñáéíóúü]/.test(ch) ? 0 : 0;
      f.forEach((fila, y) => { for (let i = 0; i < w; i++) if (fila[i] === "#") p.p(x + i, arriba + 1 + y0 + y, y >= 5 && y <= 6 ? "#e6e2dc" : "#ffffff"); });
      if (TILDE_SUB[ch]) { const cx0 = x + Math.floor(w / 2); if (ch === "Ñ") { p.p(cx0 - 2, arriba - 1, "#fff"); p.p(cx0 - 1, arriba - 2, "#fff"); p.p(cx0, arriba - 1, "#fff"); p.p(cx0 + 1, arriba - 2, "#fff"); } else { p.p(cx0, arriba - 1, "#fff"); p.p(cx0 + 1, arriba - 1, "#fff"); p.p(cx0 + 1, arriba - 2, "#fff"); } }
      x += w + esp;
    }
    p.contorno(PAL.tinta, true);
    const c = p.canvas(), s2 = lienzoNuevo(c.width + 1, c.height + 1), g = s2.getContext("2d");
    g.drawImage(tinte(c, "#000000"), 1, 1); g.drawImage(c, 0, 0);
    return s2;
  });
}
/** "DAÑO ARRIBA" → "Daño arriba" (el subtítulo del original va así). */
function comoFrase(s) {
  s = String(s).toLowerCase();
  const i = s.search(/[a-zñáéíóúü]/);
  return i < 0 ? s : s.slice(0, i) + s[i].toUpperCase() + s.slice(i + 1);
}

// ══════════ 07c-papel.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL PAPEL Y LA TINTA: las hojas rasgadas de los menús (con chinches y sombra), la pared de
// papel gris con garabatos desvaídos (dibujos "de chico" sacados de los mismos sprites), la
// franja de tinta de los rótulos, y el logo: letras de bloque enormes con degradé tramado,
// relieve oscuro y las pintitas del sombrero de Shumio, que gotean esporas.
// ─────────────────────────────────────────────────────────────────────────────

/** Un ruido suave de una dimensión (suma de senos con fase por semilla): para los bordes rasgados. */
function ruido1(r) {
  const f = [0.07 + r() * 0.05, 0.19 + r() * 0.1, 0.43 + r() * 0.2], a = [1.3, 0.8, 0.45], ph = f.map(() => r() * TAU);
  return (x) => f.reduce((s, fr, i) => s + Math.sin(x * fr + ph[i]) * a[i], 0);
}

const TONOS_PAPEL = {
  blanco: ["#f4f0ea", "#e9e4dc", "#dcd6cc", "#c9c2b6", "#8f877c"],
  crema: ["#f3e7d2", "#e8d8bd", "#d9c5a4", "#c4ad89", "#8a7457"],
  gris: ["#dcd8d2", "#cfcac2", "#c0bab1", "#aca59b", "#77716a"],
};
/** Una hoja rasgada de w×h (más la sombra). tono: blanco, crema, gris. */
function papelSpr(w, h, semilla = 1, tono = "blanco") {
  return hornear(`papel${w}x${h}|${semilla}|${tono}`, () => {
    const r = mulberry(semilla * 977 + w * 13 + h), R = TONOS_PAPEL[tono];
    const arr = ruido1(r), aba = ruido1(r), izq = ruido1(r), der = ruido1(r);
    const p = new Pix(w + 8, h + 8), o = 3;
    const dentro = (x, y) => {
      const t = arr(x) * 1.1, b = aba(x) * 1.2, l = izq(y) * 1.1, d = der(y) * 1.2;
      return y >= o + 1 + t && y <= o + h - 2 + b && x >= o + 1 + l && x <= o + w - 2 + d;
    };
    // un par de muescas (el papel arrancado de un cuaderno)
    const muescas = [];
    for (let i = 0; i < 2; i++) muescas.push([o + 4 + r() * (w - 8), r() < 0.5 ? o + 1 : o + h - 2, 2 + r() * 2.5]);
    const enMuesca = (x, y) => muescas.some(([mx, my, mr]) => Math.hypot(x - mx, (y - my) * 1.4) < mr);
    for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) {
      if (!dentro(x, y) || enMuesca(x, y)) continue;
      // luz de arriba a la izquierda, tramada, y alguna fibra del papel
      const l = 1 - (y - o) / h * 0.55 - (x - o) / w * 0.25 + bayer(x, y) * 0.25;
      let c = R[l > 0.72 ? 0 : l > 0.45 ? 1 : 2];
      if (r() < 0.012) c = R[2];
      p.p(x, y, c);
    }
    // rayones de lápiz, suaves (como la hoja del menú original)
    for (let i = 0; i < 3; i++) {
      const x0 = o + 4 + r() * (w - 14), y0 = o + 4 + r() * (h - 12), L = 4 + r() * 8, an = -0.7 + r() * 0.3;
      trazo(x0, y0, x0 + Math.cos(an) * L, y0 + Math.sin(an) * L, (x, y) => { if (p.g(x, y)) p.p(x, y, R[2]); });
    }
    p.bordeInterior({ [R[0]]: R[3], [R[1]]: R[3], [R[2]]: R[3] });
    p.contorno(R[4]);
    const c = p.canvas(), s = lienzoNuevo(c.width + 3, c.height + 3), g = s.getContext("2d");
    g.globalAlpha = 0.3; g.drawImage(tinte(c, "#0a0608"), 3, 3); g.globalAlpha = 1; g.drawImage(c, 0, 0);
    return s;
  });
}
/** La chinche que sostiene la hoja. */
function chincheSpr() {
  return hornear("chinche", () => {
    const p = new Pix(9, 9);
    p.bola(4.5, 4.5, 3.6, 3.4, ["#3a3c40", "#6a6e74", "#9ca0a6", "#d2d6da"], { luz: [-0.6, -0.7, 0.4], trama: 0.5 });
    p.p(3, 3, "#ffffff");
    p.contorno(PAL.tinta, true);
    return p.canvas();
  });
}

/** Un garabato hecho "a mano" desde un sprite: su contorno y sus partes oscuras, en tinta. */
function garabato(c, tinta = "#2b2326", escala = 2, relleno = null) {
  return hornear(`garabato|${tinta}|${escala}|${relleno}|` + (c.__id ||= Math.random().toString(36).slice(2)), () => {
    const g = c.getContext("2d"), d = g.getImageData(0, 0, c.width, c.height).data, W = c.width, H = c.height;
    const a = (x, y) => x >= 0 && y >= 0 && x < W && y < H && d[(y * W + x) * 4 + 3] > 100;
    const lum0 = (x, y) => { const i = (y * W + x) * 4; return (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11) / 255; };
    // la luz promediada en 3×3 (así el tramado no cuenta como borde: sólo los cambios de verdad)
    const L = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (a(x + dx, y + dy)) { s += lum0(x + dx, y + dy); n++; }
      L[y * W + x] = n ? s / n : 0;
    }
    const lum = (x, y) => L[y * W + x];
    const p = new Pix(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!a(x, y)) continue;
      const borde = !a(x + 1, y) || !a(x - 1, y) || !a(x, y + 1) || !a(x, y - 1);
      // además del contorno, los bordes de adentro (donde el color cambia mucho): como un dibujo para colorear
      const salto = (a(x + 1, y) && Math.abs(lum(x, y) - lum(x + 1, y)) > 0.17) || (a(x, y + 1) && Math.abs(lum(x, y) - lum(x, y + 1)) > 0.17);
      if (borde || lum0(x, y) < 0.12 || salto) p.p(x, y, tinta);
      else if (relleno) p.p(x, y, relleno);
    }
    const q = p.canvas(), out = lienzoNuevo(W * escala, H * escala), go = out.getContext("2d");
    go.imageSmoothingEnabled = false; go.drawImage(q, 0, 0, W * escala, H * escala);
    return out;
  });
}

/** La pared de papel gris con dibujos desvaídos (el fondo de todos los menús). */
function fondoMenuSpr(W, H) {
  return hornear(`fondoMenu${W}x${H}`, () => {
    const c = lienzoNuevo(W, H), g = c.getContext("2d"), r = mulberry(31337);
    const p = new Pix(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const nx = (x - W * 0.55) / (W * 0.62), ny = (y - H * 0.42) / (H * 0.8), e = nx * nx + ny * ny;
      const k = e + bayer(x, y) * 0.22;
      p.p(x, y, k < 0.35 ? "#c9c4bc" : k < 0.62 ? "#bdb7ae" : k < 0.95 ? "#aca69c" : "#958f86");
    }
    g.drawImage(p.canvas(), 0, 0);
    // los dibujos del chico en la pared: Shumio, hongos, un mosquín, un cofre, un corazón, una gota
    const tinta = "rgba(92,84,80,0.22)";
    const dibujos = [spritesShumio().cab.frente[0], matasSpr(3), mosquinSpr(0), cofreSpr(false, false), corazonSpr("rojo"), lagrimaSpr(6), hongonSpr(0), iconoSpr("brujula"), bombaSpr(1), aranaSpr(0)];
    const lugares = [[0.08, 0.12], [0.86, 0.1], [0.06, 0.62], [0.9, 0.66], [0.2, 0.86], [0.74, 0.88], [0.93, 0.36], [0.03, 0.36], [0.62, 0.05], [0.36, 0.93]];
    dibujos.forEach((s, i) => {
      const gb = garabato(s, tinta, 2), [u, v] = lugares[i];
      g.save(); g.translate(Math.round(u * W), Math.round(v * H)); g.rotate((r() - 0.5) * 0.5);
      g.drawImage(gb, -gb.width / 2, -gb.height / 2); g.restore();
    });
    // rayas, estrellitas y círculos sueltos
    g.fillStyle = tinta;
    for (let i = 0; i < 16; i++) {
      const x = r() * W, y = r() * H, t = r();
      if (t < 0.4) { const L = 4 + r() * 8, an = r() * TAU; trazo(x, y, x + Math.cos(an) * L, y + Math.sin(an) * L, (a, b) => g.fillRect(a, b, 2, 2)); }
      else if (t < 0.7) { g.fillRect(x - 3, y, 7, 2); g.fillRect(x, y - 3, 2, 7); }
      else { const rr = 3 + r() * 5; for (let k = 0; k < 24; k++) { const an = k / 24 * TAU; g.fillRect(Math.round(x + Math.cos(an) * rr), Math.round(y + Math.sin(an) * rr * 0.8), 1, 1); } }
    }
    return c;
  });
}

/** La franja de los rótulos, como la del original: negra, casi opaca, con los bordes rasgados en
 *  bultos (como papel negro arrancado), más angosta y deshilachada hacia las puntas. Sin color. */
function bandaSpr(w, h = 21) {
  return hornear(`banda4|${w}x${h}`, () => {
    const p = new Pix(w, h + 6), r = mulberry(w * 7 + h), arr = ruido1(r), aba = ruido1(r);
    // bultos: un ruido lento más "mordidas" redondas en los bordes
    const bultos = [];
    for (let i = 0; i < w / 9; i++) bultos.push([r() * w, r() < 0.5 ? 0 : 1, 1.5 + r() * 2.5, r() < 0.5 ? -1 : 1]);
    for (let x = 0; x < w; x++) {
      const u = x / (w - 1), punta = Math.min(u, 1 - u) * 2, f = 1 - Math.min(1, punta * 5);   // las puntas se afinan en el último décimo, en bultos
      let t = 3 + arr(x * 0.35) * 1.3 + f * f * 8 + f * 2 * r(), b = h + aba(x * 0.35) * 1.3 - f * f * 8 - f * 2 * r();
      for (const [bx, lado, br, sg] of bultos) { const d = Math.abs(x - bx); if (d < br) { const e = Math.sqrt(br * br - d * d) * 0.8 * sg; if (lado === 0) t -= e; else b += e; } }
      for (let y = Math.max(0, Math.floor(t)); y < Math.min(h + 6, Math.ceil(b)); y++) p.p(x, y, "rgba(8,3,3,0.9)");
    }
    // islitas sueltas cerca de los bordes (los pedacitos que quedan al rasgar)
    for (let i = 0; i < w / 14; i++) { const x = Math.floor(r() * w), y = r() < 0.5 ? 1 + Math.floor(r() * 2) : h + 2 + Math.floor(r() * 2); p.p(x, y, "rgba(8,3,3,0.9)"); if (r() < 0.5) p.p(x + 1, y, "rgba(8,3,3,0.9)"); }
    return p.canvas();
  });
}

/** El logo, con la construcción del original: "SHUMIO'S" enorme en bloque (×3), con bandas de rojo
 *  en damero, el filo de arriba con luz y un relieve hondo abajo a la derecha; "DEPTHS" en rojo claro,
 *  abajo a la derecha (como el subtítulo); una salpicadura que chorrea, y las pintitas del sombrero. */
function logoSpr() {
  return hornear("logo4", () => {
    const grande = "SHUMIO'S", chico = "DEPTHS", E1 = 4, E2 = 3, HONDO = 6;
    const ancho = (s) => _medir(s, (ch) => glifoBloque(ch).w, 1);
    const w1 = ancho(grande) * E1, w2 = ancho(chico) * E2, h1 = ALTO_BLOQUE * E1, h2 = ALTO_BLOQUE * E2;
    const W = w1 + 40, H = h1 + h2 + 46;
    const p = new Pix(W, H), x1 = 26, y1 = 6, x2 = x1 + w1 - w2 + 4, y2 = y1 + h1 + HONDO - 1;
    const masc = new Uint8Array(W * H), capa = new Uint8Array(W * H);
    const poner = (s, x0, y0, E, id) => {
      let x = x0;
      for (const ch of s) {
        const gl = glifoBloque(ch);
        gl.filas.forEach((f, y) => { for (let i = 0; i < f.length; i++) if (f[i] !== ".") for (let a = 0; a < E; a++) for (let b = 0; b < E; b++) { const X = x + i * E + a, Y = y0 + y * E + b; if (X < W && Y < H) { masc[Y * W + X] = 1; capa[Y * W + X] = id; } } });
        x += (gl.w + 1) * E;
      }
    };
    poner(grande, x1, y1, E1, 1); poner(chico, x2, y2, E2, 2);
    const lleno = (x, y) => x >= 0 && y >= 0 && x < W && y < H && masc[y * W + x];
    const r = mulberry(4040);
    // 0) la salpicadura, detrás de la primera letra: una mancha con gotas y chorros
    const sx = x1 - 6, sy = y1 + h1 + 4, SANG = ["#4a0508", "#7e0c10", "#b3161a", "#d8261f"];
    const disco = (cx0, cy0, rr, c) => { for (let y = Math.floor(cy0 - rr); y <= cy0 + rr; y++) for (let x = Math.floor(cx0 - rr); x <= cx0 + rr; x++) if (Math.hypot(x + 0.5 - cx0, (y + 0.5 - cy0) * 1.15) <= rr) p.p(x, y, c); };
    disco(sx, sy, 9, SANG[2]); disco(sx - 6, sy + 3, 6, SANG[2]); disco(sx + 4, sy - 5, 5, SANG[3]);
    for (let i = 0; i < 16; i++) {   // gotas que saltaron, más chicas cuanto más lejos
      const a = Math.PI * (0.35 + r() * 1.25), d = 12 + r() * 16, rr = Math.max(0.7, 2.6 - d / 12);
      disco(sx + Math.cos(a) * d, sy + Math.sin(a) * d * 0.8, rr, SANG[2]);
    }
    for (let i = 0; i < 4; i++) {    // chorros que caen
      const x = sx - 10 + i * 5 + Math.floor(r() * 3), L = 8 + Math.floor(r() * 16), y0 = sy + 5;
      for (let y = 0; y < L; y++) { p.p(x, y0 + y, SANG[2]); p.p(x + 1, y0 + y, SANG[1]); }
      disco(x + 1, y0 + L, 1.6, SANG[2]);
    }
    // 1) el relieve hondo (dos tonos)
    for (let k = HONDO; k >= 1; k--) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (lleno(x - k, y - k) && !lleno(x, y)) {
      const id = capa[(y - k) * W + x - k];
      p.p(x, y, id === 1 ? (k > 2 ? "#300709" : "#560d10") : (k > 1 ? "#3a0a0c" : "#5c1216"));
    }
    // 2) la cara: bandas de rojo con transición en damero; el filo de arriba y el de la izquierda con luz
    const ROJO = ["#ff8a70", "#ec4a38", "#c8281f", "#9a1a16"], CLARO = ["#ffc2ae", "#ff8a70", "#f06a52", "#c8402f"];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!lleno(x, y)) continue;
      const id = capa[y * W + x], y0 = id === 1 ? y1 : y2, hh = id === 1 ? h1 : h2, R = id === 1 ? ROJO : CLARO;
      const t = (y - y0) / hh, dam = (x + y) & 1;
      let k = t < 0.28 ? 1 : t < 0.36 ? (dam ? 1 : 2) : t < 0.62 ? 2 : t < 0.7 ? (dam ? 2 : 3) : 3;
      if (!lleno(x, y - 1) || !lleno(x, y - 2)) k = 0;               // el filo de arriba (2 px con luz)
      else if (!lleno(x - 1, y) && k > 1) k--;
      p.p(x, y, R[k]);
    }
    // 3) las pintitas del sombrero de Shumio, en la banda de arriba de las letras grandes
    for (let i = 0; i < 40; i++) {
      const x = x1 + Math.floor(r() * w1), y = y1 + 4 + Math.floor(r() * (h1 * 0.4));
      const ok = [[-1, -1], [0, -1], [1, -1], [2, -1], [3, -1], [-1, 0], [3, 0], [-1, 1], [3, 1], [-1, 2], [0, 2], [1, 2], [2, 2], [3, 2]].every(([dx, dy]) => lleno(x + dx, y + dy) && capa[(y + dy) * W + x + dx] === 1);
      if (!ok) continue;
      p.sello(x, y, [".cc", "ccC"], { c: "#fff2dc", C: "#e2c8a6" });
    }
    // 4) el contorno grueso, en dos pasadas
    p.contorno(PAL.tinta, true); p.contorno(PAL.tinta, false);
    return p.canvas();
  });
}

/** Shumio dibujado a mano para la hoja del título: trazos limpios de marcador (se pinta a 1 px y se
 *  agranda ×2, así cada línea queda de 2). llora: las lágrimas de esporas cayendo. */
function dibujoShumio(llora = 0) {
  return hornear(`dibujoShumio${llora}`, () => {
    const p = new Pix(36, 40), T = TINTA_MANO;
    const aro = (cx0, cy0, rx, ry, desde, hasta) => {   // un arco de elipse, continuo (ángulos en radianes)
      let ant = null;
      for (let i = 0; i <= 90; i++) {
        const a = desde + (hasta - desde) * i / 90, x = Math.round(cx0 + Math.cos(a) * rx), y = Math.round(cy0 + Math.sin(a) * ry);
        if (ant) trazo(ant[0], ant[1], x, y, (X, Y) => p.p(X, Y, T)); ant = [x, y];
      }
    };
    const lin = (a, b, c, d) => trazo(a, b, c, d, (X, Y) => p.p(X, Y, T));
    // el sombrero: media elipse y el ala, apenas curvada
    aro(18, 14, 15, 11, Math.PI, TAU);
    for (let x = 3; x <= 33; x++) p.p(x, Math.round(14 + Math.pow((x - 18) / 15, 2) * 1.6), T);
    // las pintitas del sombrero
    for (const [x, y, r] of [[11, 8, 2.2], [20, 5.5, 2.4], [26.5, 10, 1.9]]) aro(x, y, r, r, 0, TAU);
    // la cara: los costados y la barbilla redonda
    lin(6, 15, 6, 20); lin(30, 15, 30, 20);
    aro(18, 20, 12, 7, 0, Math.PI);
    // los ojos, grandes y rellenos, con el brillo
    for (const ex of [13, 23]) { for (let y = 16; y <= 21; y++) for (let x = ex - 2; x <= ex + 1; x++) if (Math.hypot(x + 0.5 - ex, (y + 0.5 - 18.5) * 0.8) <= 2.1) p.p(x, y, T); p.borrar(ex - 1, 17); }
    lin(17, 24, 18, 24);                                    // la boquita
    // el cuerpo, los bracitos y los pies
    lin(13, 27, 12, 34); lin(23, 27, 24, 34); lin(12, 34, 24, 34);
    lin(12, 29, 8, 32); lin(24, 29, 28, 32);
    aro(15, 36, 2, 1.4, 0, Math.PI); aro(21, 36, 2, 1.4, 0, Math.PI);
    // las lágrimas: gotitas que caen de los ojos
    if (llora) for (const ex of [11, 25]) { lin(ex, 23, ex, 25); p.p(ex - 1, 26, T); p.p(ex + 1, 26, T); p.p(ex, 27, T); }
    const c = p.canvas(), out = lienzoNuevo(72, 80), g = out.getContext("2d");
    g.imageSmoothingEnabled = false; g.drawImage(c, 0, 0, 72, 80);
    return out;
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// EL ARTE DE LOS ENEMIGOS Y LOS JEFES. Criaturas del subsuelo, cada una con su silueta: la
// forma se lee antes que el color. Simétricas donde miran de frente (se dibujan con el eje en
// x.5 y los detalles espejados), y con el brillo siempre arriba a la izquierda.
// ─────────────────────────────────────────────────────────────────────────────

/**
 * Centrar a pixel exacto. c es el centro CONTINUO del cuerpo (la bola de centro 10.5 cubre los píxeles
 * 0..20: su píxel del medio es el 10). Un sello de ancho w queda centrado si empieza en c - w/2, y eso
 * tiene que ser entero: con centro x.5 van sellos de ancho impar, con centro entero, de ancho par.
 * Si no da exacto, avisa (así no queda nada "corrido medio píxel").
 */
function selloC(p, c, y, filas, pal) {
  const w = filas[0].length, x0 = c - w / 2;
  if (x0 !== Math.floor(x0)) console.warn("sello corrido medio píxel:", filas[0], "centro", c);
  p.sello(Math.floor(x0), y, filas, pal);
}
/**
 * Un par de ojos simétricos: la forma del derecho es el espejo del izquierdo, pero el BRILLO (W) queda
 * en el mismo lugar en los dos (la luz viene de arriba a la izquierda para los dos ojos).
 * gap: del centro al borde de adentro de cada ojo.
 */
function parDeOjos(p, c, gap, y, filas, pal) {
  const w = filas[0].length, xi = c - gap - w, xd = c + gap;
  if (xi !== Math.floor(xi)) console.warn("ojos corridos medio píxel:", filas[0], "centro", c, "gap", gap);
  const base = pal.e ? "e" : Object.keys(pal).find((k) => k !== "W");
  filas.forEach((f, dy) => {
    for (let i = 0; i < w; i++) {
      const ch = f[i];
      if (ch === "." || !pal[ch]) continue;
      p.p(xi + i, y + dy, pal[ch]);                                   // el izquierdo, tal cual
      p.p(xd + (w - 1 - i), y + dy, pal[ch === "W" ? base : ch]);    // el derecho, espejado (sin el brillo)
    }
    for (let i = 0; i < w; i++) if (f[i] === "W") p.p(xd + i, y + dy, pal.W);   // el brillo, en el mismo lugar
  });
}
const OJO_PAL = { e: PAL.tinta, W: "#ffffff", r: "#e8312a", R: "#ff8a6a", y: "#f2d64a", k: PAL.tinta, b: "#2b0a0e", t: PAL.hueso[4], m: "#4a0d14" };

    // las alas (atrás del cuerpo): arriba o abajo según el cuadro
    const ala = k === 0 ? ["..aa.", ".aAAa", "aAAa.", ".aa.."] : ["....", ".aa.", "aAAa", ".aAa"];
    // las alas: la derecha es el espejo exacto de la izquierda (alrededor del píxel 7)
    const alaI = k === 0 ? ["..aa.", ".aAAa", "aAAa.", ".aa.."] : ["....", ".aa.", "aAAa", ".aAa"];

// ── Hongón: un muerto con cabeza de hongo que camina hacia vos, boca abierta, ojos vacíos ──

    const p = new Pix(21, 26), piel = ["#3b3130", "#6a5a55", "#9a8a80", "#c2b3a4", "#ddd0c0"], capR = ["#1c130d", "#3b2a1c", "#5e442c", "#86643f", "#a88558"];
    // las piernas (4 cuadros)
    const a = [1, 0, -1, 0][k];
    p.caja(6, 19 + Math.max(0, a), 3, 6 - Math.max(0, a), piel.slice(0, 3)); p.caja(12, 19 + Math.max(0, -a), 3, 6 - Math.max(0, -a), piel.slice(0, 3));
    // el cuerpo flaco, con los brazos caídos adelante
    p.bola(10.5, 16.5, 5.4, 4.8, ["#171513", "#2c2723", "#453c35", "#5f544a"], { bajar: 0.1 });
    p.caja(3, 14 + (a > 0 ? 1 : 0), 2, 6, piel.slice(0, 4)); p.caja(16, 14 + (a < 0 ? 1 : 0), 2, 6, piel.slice(0, 4));
    // la cabeza
    p.bola(10.5, 9.5, 6.6, 5.8, piel, { luz: [-0.4, -0.5, 0.7], trama: 0.5 });
    if (!sinGorro) {
      const ala = (x) => Math.round(6.6 + 1.2 * Math.pow((x + 0.5 - 10.5) / 9, 2));
      p.bola(10.5, 5, 9.4, 5.2, capR, { filtro: (x, y) => y <= ala(x), luz: [-0.5, -0.7, 0.5], trama: 0.7 });
      for (let x = 0; x < 21; x++) { const y = ala(x); if (p.g(x, y)) p.p(x, y, capR[1]); }
      // las laminillas del hongo, que se ven por abajo del ala
      for (let x = 4; x <= 17; x += 2) if (p.g(x, ala(x) + 1)) p.p(x, ala(x) + 1, capR[0]);

    // los ojos vacíos y la boca abierta que gotea
    parDeOjos(p, 10.5, 1.5, 9, ["ee.", "eee"], { e: PAL.tinta });
    selloC(p, 10.5, 12, [".kkk.", "kmmmk", "kmmmk", ".kkk."], { k: PAL.tinta, m: "#4a0d14" });
    p.p(10, 16, PAL.baba[3]); if (k % 2) p.p(10, 17, PAL.baba[2]);

    return p.canvas();
  });
}

// ── El Gusano Anillado: cabeza con mandíbulas, anillos y cola ──
function gusanoAnilladoSpr(parte /* cabeza, cuerpo, cola */, dir = 0, k = 0) {
  return hornear(`anillado${parte}${dir}${k}`, () => {
    const p = new Pix(26, 26), R = ["#2a0f14", "#56202b", "#86363f", "#b55a5c", "#d98a86", "#f2c0b0"];
    if (parte === "cuerpo") {
      p.bola(13, 14, 10, 9, R, { luz: [-0.4, -0.6, 0.6] });
      for (let x = 4; x < 23; x++) { if (p.g(x, 9)) p.p(x, 9, R[1]); if (p.g(x, 18)) p.p(x, 18, R[1]); }
      p.p(9, 10, R[5]); p.p(10, 10, R[5]);
    } else if (parte === "cola") {
      p.bola(13, 14, 7, 6.5, R, { luz: [-0.4, -0.6, 0.6] });
      p.p(13, 20, R[0]);
    } else {
      p.bola(13, 13, 11, 10, R, { luz: [-0.4, -0.6, 0.6] });
      // las mandíbulas se abren y cierran
      const ab = k ? 2 : 0;
      p.sello(6 - ab, 16, ["hh..", ".hHh", "..hH"], { h: PAL.hueso[3], H: PAL.hueso[1] });
      p.sello(16 + ab, 16, ["..hh", "hHh.", "Hh.."], { h: PAL.hueso[3], H: PAL.hueso[1] });
      parDeOjos(p, 13, 2, 9, ["Wee", "eee", ".e."], { e: PAL.tinta, W: "#ffe0d0" });
      selloC(p, 13, 17, ["kkkkkk", "kmmmmk"], { k: PAL.tinta, m: "#2a0408" });
    }
    p.contorno(PAL.tinta);
    let c = p.canvas();
    if (dir) {   // girar hacia donde va (0 abajo, 1 izquierda, 2 arriba, 3 derecha)
      const r = lienzoNuevo(26, 26), g = r.getContext("2d"); g.translate(13, 13); g.rotate(dir * Math.PI / 2); g.drawImage(c, -13, -13); c = r;
    }
    return c;

}

// ── Micelia, la Madre Hongo: la reina del fondo. Un hongo enorme con cara en el tallo, que llora esporas ──
function miceliaSpr(k /* 0 quieta, 1 boca abierta, 2 herida, 3 furiosa (fase 3) */) {
  return hornear(`micelia${k}`, () => {
    const W = 96, H = 84, p = new Pix(W, H);
    const cap = k === 3 ? ["#1e0610", "#48101f", "#7a1a30", "#b0304a", "#d8586a", "#f08a90"] : ["#1e0a18", "#3e1432", "#65205a", "#8e3a80", "#b862a4", "#dc98c8"];
    const tallo = ["#3a3028", "#6e6052", "#a39481", "#cbbca6", "#e8dcc6"];
    // las raíces que se clavan en el piso
    for (const [x0, x1] of [[30, 12], [38, 24], [58, 72], [66, 86], [48, 48]]) trazo(48 + (x0 - 48) * 0.3, 70, x1, 82, (x, y) => { p.p(x, y, PAL.tierra[2]); p.p(x + 1, y, PAL.tierra[1]); });
    // el tallo, grueso, con la cara
    p.bola(48, 60, 17, 20, tallo, { luz: [-0.4, -0.5, 0.75], bajar: 0.25, trama: 0.6 });
    // la falda (el anillo del hongo)
    p.bola(48, 44, 22, 5, tallo.slice(1), { luz: [-0.3, -0.9, 0.3] });
    for (let x = 27; x < 70; x += 3) if (p.g(x, 48)) { p.p(x, 48, tallo[1]); p.p(x, 49, tallo[1]); }
    // el sombrero enorme, con las laminillas abajo
    const ala = (x) => Math.round(36 + 4 * Math.pow((x + 0.5 - 48) / 46, 2));
    p.bola(48, 26, 46, 22, cap, { filtro: (x, y) => y <= ala(x), luz: [-0.5, -0.65, 0.55], bajar: 0.12 });
    for (let x = 4; x < 92; x++) { const y = ala(x); if (p.g(x, y)) { p.p(x, y, cap[1]); if (x % 3 === 0) { p.p(x, y + 1, cap[0]); p.p(x, y + 2, cap[0]); } } }
    // las manchas del sombrero
    for (const [x, y, r] of [[26, 16, 4], [46, 9, 5], [66, 15, 4], [36, 26, 3], [60, 27, 3], [80, 24, 2], [15, 26, 2]]) {
      p.bola(x, y, r, r * 0.7, ["#8a7a6a", "#c9b9a2", "#eee2cc"], { trama: 0.3 });
    }
    // la cara, en el tallo: ojos tristes que lloran esporas (o furiosos)
    // ojos tristes (caídos hacia afuera), una X de dolor, o rojos de furia
    const ojos = k === 2 ? ["e...e", ".e.e.", "..e..", ".e.e.", "e...e"] : k === 3 ? ["rr...", ".rrr.", ".rrrr", "..rr."] : ["...ee", ".eeWe", "eeeee", ".eee."];
    parDeOjos(p, 48, 4, 54, ojos, { e: PAL.tinta, W: "#ffffff", r: "#ff3b2f" });
    // las esporas que le caen, una por ojo, en el mismo lugar espejado (el píxel p y el 95 − p)
    if (k !== 2) for (const x of [41, 95 - 41]) for (let y = 59; y < 68; y += 2) p.p(x, y, PAL.espora[(y / 2) % 2 ? 3 : 2]);
    const bocaAb = k === 1 || k === 3 ? 6 : 2;
    for (let y = 0; y < bocaAb; y++) { const a = 5 + (y > 0 && y < bocaAb - 1 ? 1 : 0); for (let x = 48 - a; x < 48 + a; x++) p.p(x, 66 + y, y === 0 || y === bocaAb - 1 ? PAL.tinta : "#2a0814"); }
    p.contorno(PAL.tinta);
    return p.canvas();
  });
}

// ── efectos ──
function explosionSpr(k) {

      // bordes deshilachados

}
function humoSpr(k) {

    for (let i = 0; i < 5; i++) { const an = i / 5 * TAU + k; p.bola(12 + Math.cos(an) * r * 0.7, 12 + Math.sin(an) * r * 0.6, 3.4 - k * 0.5, 3 - k * 0.45, ["#4a4650", "#6e6a74", "#9a96a0", "#c6c2cc"], { trama: 0.6 }); }

/** Una mancha para el piso (sangre, baba, esporas): una forma irregular sólida con salpicaduras. */
function manchaSpr(tipo, v) {
  return hornear(`mancha${tipo}${v}`, () => {
    const R = tipo === "baba" ? PAL.baba : tipo === "espora" ? PAL.espora : tipo === "quemado" ? ["#050404", "#0e0b0a", "#1a1512", "#241e1a"] : PAL.sangre;
    const p = new Pix(26, 20), r = mulberry(v * 31 + tipo.length), f1 = r() * TAU;
    for (let y = 0; y < 20; y++) for (let x = 0; x < 26; x++) {
      const dx = (x - 13) / 1.35, dy = y - 10, an = Math.atan2(dy, dx), rr = 6.5 * (1 + 0.25 * Math.sin(an * 3 + f1) + 0.15 * Math.sin(an * 5 + f1 * 2));
      const d0 = Math.hypot(dx, dy);
      if (d0 < rr) p.p(x, y, d0 < rr * 0.55 ? R[1] : R[tipo === "quemado" ? 2 : 2]);
    }
    for (let i = 0; i < 6; i++) { const an = r() * TAU, d = 9 + r() * 3; p.p(13 + Math.cos(an) * d * 1.35, 10 + Math.sin(an) * d, R[2]); }
    return p.canvas();
  });
}
/** El "puf" de cuando aparece un enemigo. */
function aparicionSpr(k) {
  return hornear(`aparicion${k}`, () => {
    const p = new Pix(24, 24);
    for (let i = 0; i < 8; i++) { const an = i / 8 * TAU, d = 3 + k * 2.4; p.bola(12 + Math.cos(an) * d, 12 + Math.sin(an) * d * 0.7, 2.6 - k * 0.5, 2.2 - k * 0.4, ["#2a2630", "#4c4652", "#6e6878"], { trama: 0.5 }); }
    return p.canvas();
  });
}

/** Arma la grilla de obstáculos de una sala desde su diseño; devuelve los lugares de enemigos. */

    const ch = diseno[espejarY ? FILAS - 1 - f : f][espejarX ? COLS - 1 - c : c];
    let o = null;
    if (ch === "r") o = { t: "roca", v: A.ent(0, 2) };
    else if (ch === "R") o = { t: "roca", v: 1, marcada: true };
    else if (ch === "m") o = { t: "matas", vida: 4, dorada: A.si(0.04) };
    else if (ch === "b") o = { t: "brasero", vida: 4, prendido: true };
    else if (ch === "o") o = { t: "pozo" };
    else if (ch === "x") o = { t: "pinchos" };
    else if (ch === "B") o = { t: "barril", vida: 3 };
    else if (ch === "H") o = { t: "bloque" };

function celda(sala, c, f) { return c >= 0 && f >= 0 && c < COLS && f < FILAS ? sala.celdas[f * COLS + c] : null; }

  if (!o) return false;

/** Mueve un círculo por la sala chocando con la grilla y los muros. lim: {x0,y0,x1,y1} (los bordes que se pueden pasar). */
function moverEnSala(sala, e, dx, dy, vuela, bordes) {

  if (e.y < b.y0 + r) { e.y = b.y0 + r; e.choco = true; } if (e.y > b.y1 - r) { e.y = b.y1 - r; e.choco = true; }

/** El mapa de distancias hasta un punto (para que los que caminan rodeen las rocas). */
function campoHacia(sala, x, y, vuela = false) {
  const dist = new Int16Array(COLS * FILAS).fill(-1), c0 = lim(celdaX(x), 0, COLS - 1), f0 = lim(celdaY(y), 0, FILAS - 1), cola = [c0 + f0 * COLS];

    const k = cola[i], c = k % COLS, f = (k / COLS) | 0;
    for (const [dx, dy] of DIRS) {
      const C = c + dx, F = f + dy;
      if (C < 0 || F < 0 || C >= COLS || F >= FILAS) continue;
      const K = F * COLS + C;
      if (dist[K] >= 0 || esSolida(sala.celdas[K], vuela)) continue;
      dist[K] = dist[k] + 1; cola.push(K);

function pasoCampo(sala, dist, e, objX, objY) {
  const c = celdaX(e.x), f = celdaY(e.y), k = f * COLS + c;
  if (c < 0 || f < 0 || c >= COLS || f >= FILAS || dist[k] <= 1) { const d = Math.hypot(objX - e.x, objY - e.y) || 1; return [(objX - e.x) / d, (objY - e.y) / d]; }
