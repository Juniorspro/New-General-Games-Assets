/* AEROPLAZA para Android: el juego (el mismo aeroplaza.html) en una WebView, con ARCore para la
   cabeza en 6 ejes y MediaPipe de Android para las manos. Lo arma herramientas/apk.mjs (pone el
   juego y MediaPipe en src/main/assets, que no se guarda en el repo) */
plugins { id 'com.android.application' }
android {
  namespace 'ar.aeroplaza'
  compileSdk 36
  defaultConfig {
    applicationId 'ar.aeroplaza'
    minSdk 26
    targetSdk 36
    versionCode 1
    versionName '1.0'
    /* (solo los celus de 64 bits: MediaPipe trae sus librerías para cada arquitectura y la APK se iba
       a más del doble) */
    ndk { abiFilters 'arm64-v8a' }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  /* (el modelo de las manos va tal cual: comprimido, MediaPipe no lo puede leer de la APK) */
  androidResources { noCompress += ['task', 'wasm'] }
  /* (las librerías de MediaPipe y ARCore comprimidas: se sacan al instalar; la APK pesa 5 MB menos) */
  packaging { jniLibs { useLegacyPackaging = true } }
  buildTypes { release { minifyEnabled false } }
}
dependencies {
  implementation 'androidx.webkit:webkit:1.14.0'
  implementation 'com.google.ar:core:1.56.0'
  implementation 'com.google.mediapipe:tasks-vision:0.10.35'
}
