<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAJO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f3f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: Georgia; }
    canvas { display: block; background: #f5f3f0; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="../motor2d/intro-jxs.js"></script>
  <script src="js/base.js"></script>
  <script src="js/frutas.js"></script>
  <script src="js/fisica.js"></script>
  <script src="js/sonido.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/juego.js"></script>
  <script>
    const canvas = document.getElementById('game');
    const ww = window.innerWidth, hh = window.innerHeight;
    const escala = Math.min(ww / (W * S), hh / (H * S));
    canvas.width = W * S * escala;
    canvas.height = H * S * escala;
    const ctx = canvas.getContext('2d');
    ctx.scale(escala, escala);

    const intro = introduccion(ESTILO_SUMI, 'TAJO', '', 3);
    function dibujarIntro(g) {
      return intro(g);
    }
  </script>
</body>
</html>
