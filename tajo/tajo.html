/* ==== motor2d/fuente.js ==== */
/* ============================================================================
   motor2d/fuente.js — la fuente de píxeles 5x7 de EL TIPO, con tildes, Ñ, Ü,
   ¡¿ y las letras del portugués, más los signos que piden los diálogos. Las minúsculas se dibujan como

const FUENTE_PX = {
  A: [".###.", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"], B: ["####.", "#...#", "#...#", "####.", "#...#", "#...#", "####."],

  G: [".###.", "#...#", "#....", "#.###", "#...#", "#...#", ".####"], H: ["#...#", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"],
  I: [".###.", "..#..", "..#..", "..#..", "..#..", "..#..", ".###."], J: ["..###", "...#.", "...#.", "...#.", "#..#.", "#..#.", ".##.."],
  K: ["#...#", "#..#.", "#.#..", "##...", "#.#..", "#..#.", "#...#"], L: ["#....", "#....", "#....", "#....", "#....", "#....", "#####"],
  M: ["#...#", "##.##", "#.#.#", "#.#.#", "#...#", "#...#", "#...#"], N: ["#...#", "#...#", "##..#", "#.#.#", "#..##", "#...#", "#...#"],

  ' ': ["...", "...", "...", "...", "...", "...", "..."], '!': ["#", "#", "#", "#", "#", ".", "#"], '¡': ["#", ".", "#", "#", "#", "#", "#"],
  '?': [".###.", "#...#", "....#", "...#.", "..#..", ".....", "..#.."], '¿': ["..#..", ".....", "..#..", ".#...", "#....", "#...#", ".###."],

  ';': ["..", ".#", "..", "..", "..", ".#", "#."], '-': ["....", "....", "....", "####", "....", "....", "...."],
  "'": ["#", "#", ".", ".", ".", ".", "."], '"': ["#.#", "#.#", "...", "...", "...", "...", "..."],
  '/': ["....#", "...#.", "...#.", "..#..", ".#...", ".#...", "#...."], '+': [".....", "..#..", "..#..", "#####", "..#..", "..#..", "....."],
  '×': [".....", "#...#", ".#.#.", "..#..", ".#.#.", "#...#", "....."], '·': [".", ".", ".", "#", ".", ".", "."],
  '%': ["##..#", "##.#.", "...#.", "..#..", ".#...", ".#.##", "#..##"], '>': ["#....", ".#...", "..#..", "...#.", "..#..", ".#...", "#...."],
  '<': ["....#", "...#.", "..#..", ".#...", "..#..", "...#.", "....#"], '=': ["....", "....", "####", "....", "####", "....", "...."],
  '(': ["..#", ".#.", "#..", "#..", "#..", ".#.", "..#"], ')': ["#..", ".#.", "..#", "..#", "..#", ".#.", "#.."],

};
/* las letras con marca: la base más la marca. Con las del portugués (Â Ã À Ç Ê Ô Õ)
   alcanza para los tres idiomas de los juegos */
const ACENTOS_PX = {
  'Á': ['A', 'a'], 'É': ['E', 'a'], 'Í': ['I', 'a'], 'Ó': ['O', 'a'], 'Ú': ['U', 'a'], 'Ñ': ['N', 't'], 'Ü': ['U', 'd'],
  'Â': ['A', 'c'], 'Ã': ['A', 't'], 'À': ['A', 'g'], 'Ê': ['E', 'c'], 'Ô': ['O', 'c'], 'Õ': ['O', 't'], 'Ç': ['C', 'z'],
};
const MARCAS_PX = {
  a: [[3, -3], [2, -2]], t: [[0, -2], [1, -3], [2, -3], [3, -2], [4, -3]], d: [[1, -2], [3, -2]],
  c: [[1, -2], [2, -3], [3, -2]], g: [[1, -3], [2, -2]], z: [[2, 7], [3, 8], [2, 8]],
};

function glifoPx(ch) {
  const c = ch.toUpperCase();
  if (FUENTE_PX[c]) return { f: FUENTE_PX[c], m: null };
  const a = ACENTOS_PX[c];
  if (a) return { f: FUENTE_PX[a[0]], m: MARCAS_PX[a[1]] };
  return { f: FUENTE_PX['?'], m: null };
}
/* puntos encendidos de un texto: [x, y, fila], con y = 0 en la línea de las mayúsculas */
function puntosTexto(str) {
  const pts = [];
  let x = 0;
  for (const ch of str) {
    const g = glifoPx(ch), w = g.f[0].length;
    for (let r = 0; r < 7; r++) for (let k = 0; k < w; k++) if (g.f[r][k] === '#') pts.push([x + k, r, r]);
    if (g.m) for (const [mx, my] of g.m) pts.push([x + mx, my, my > 6 ? 6 : 0]);
    x += w + 1;
  }
  return { pts, w: Math.max(1, x - 1) };
}
function anchoTexto(str) {
  let x = 0;
  for (const ch of str) x += glifoPx(ch).f[0].length + 1;
  return Math.max(0, x - 1);
}

const GRAD = {

/* texto a un lienzo de 1 px por píxel de fuente: sombra, contorno y degradé
   por fila. Arriba deja 3 filas de aire para las tildes */
const cacheTxt = new Map();
function lienzoTexto(str, o) {
  o = o || {};
  const clave = str + '|' + (o.grad ? o.grad[0] + o.grad[6] : o.col) + '|' + (o.borde || '') + '|' + (o.sinSombra ? 1 : 0);
  let c = cacheTxt.get(clave);
  if (c) return c;
  const { pts, w } = puntosTexto(str);
  const arriba = 3;
  c = document.createElement('canvas');
  c.width = w + 3; c.height = arriba + 7 + 3;
  const g = c.getContext('2d'), ox = 1, oy = arriba + 1, borde = o.borde || '#141018';
  if (!o.sinSombra) {
    g.fillStyle = 'rgba(10,6,16,0.75)';
    for (const [x, y] of pts) g.fillRect(ox + x - 1, oy + y, 3, 3);
  }
  if (o.borde !== 'no') {
    g.fillStyle = borde;
    for (const [x, y] of pts) g.fillRect(ox + x - 1, oy + y - 1, 3, 3);
  }
  for (const [x, y, r] of pts) { g.fillStyle = o.grad ? o.grad[r] : (o.col || '#fff'); g.fillRect(ox + x, oy + y, 1, 1); }
  if (cacheTxt.size > 500) cacheTxt.clear();
  cacheTxt.set(clave, c);
  return c;
}

/* dibuja texto en el lienzo del mundo. y = la línea de arriba de las mayúsculas.
   o.alin: 'izq' | 'centro' | 'der'; o.escala: entero, para títulos */
function textoPx(g, str, x, y, o) {
  o = o || {};
  const c = lienzoTexto(str, o), e = o.escala || 1;
  let dx = x - e;
  if (o.alin === 'centro') dx = x - Math.floor((c.width - 3) * e / 2) - e;
  else if (o.alin === 'der') dx = x - (c.width - 3) * e - e;
  g.drawImage(c, Math.round(dx), Math.round(y - 4 * e), c.width * e, c.height * e);
}
/* letra por letra: para escribir de a poco y para las palabras que tiemblan */
function textoLetras(g, str, x, y, o, cuantas, desplazar) {
  o = o || {};
  let cx = x, i = 0;
  for (const ch of str) {
    if (cuantas != null && i >= cuantas) break;
    const w = glifoPx(ch).f[0].length;
    if (ch !== ' ') {
      const c = lienzoTexto(ch, o), d = desplazar ? desplazar(i) : null;
      g.drawImage(c, Math.round(cx - 1 + (d ? d[0] : 0)), Math.round(y - 4 + (d ? d[1] : 0)));
    }
    cx += w + 1; i++;
  }
}
/* partir un texto en renglones que entren en "ancho" píxeles */
function envolver(str, ancho) {
  const renglones = [];
  for (const parrafo of str.split('\n')) {
    let linea = '';
    for (const pal of parrafo.split(' ')) {
      const prueba = linea ? linea + ' ' + pal : pal;
      if (anchoTexto(prueba) > ancho && linea) { renglones.push(linea); linea = pal; }
      else linea = prueba;
    }
    renglones.push(linea);
  }
  return renglones;
}

/* pone un texto del DOM en pixel art sin perder el texto original */
function pixelar(el, S, o) {
  if (!el) return;
  const txt = el.textContent.trim() !== '' ? el.textContent.trim() : (el.dataset.px || '');
  if (!txt) return;
  const clave = txt + '|' + S + '|' + (o && o.grad ? o.grad[0] : '');
  if (el.dataset.pxk === clave && el.querySelector('canvas.px')) return;
  el.dataset.px = txt; el.dataset.pxk = clave; el.textContent = '';
  const src = lienzoTexto(txt, o), c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  c.className = 'px';
  c.style.width = (c.width * S) + 'px'; c.style.height = (c.height * S) + 'px';
  c.setAttribute('aria-label', txt);
  el.appendChild(c);
}

const ICONOS_PX = {

};
function iconoPx(nombre, col, S) {
  const f = ICONOS_PX[nombre], c = document.createElement('canvas');
  c.width = 10; c.height = 10;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(10,6,16,0.75)';
  for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) if (f[y][x] === '#') g.fillRect(x + 1, y + 2, 3, 3);
  g.fillStyle = '#141018';
  for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) if (f[y][x] === '#') g.fillRect(x, y, 3, 3);
  for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) if (f[y][x] === '#') { g.fillStyle = y < 2 ? '#ffffff' : col; g.fillRect(x + 1, y + 1, 1, 1); }
  if (S) { c.className = 'px'; c.style.width = (10 * S) + 'px'; c.style.height = (10 * S) + 'px'; }
  return c;
}

/* ==== motor2d/intro-jxs.js ==== */
/* ============================================================================
   motor2d/intro-jxs.js — LA intro de JXSTUDIOS para todos los juegos ("así las
   quiero a las intro", 07/10, mostrando la de La Cripta). Sacada tal cual de
   cripta/cripta.html (M_logojxs + M_intro + sonido › jingleJXS), sin depender
   de nada de ese juego salvo la fuente de píxeles (motor2d/fuente.js).

   En pixel art y rápida (2,1 s): una raya de luz abre la fibra de carbono, el
   monograma JXS se escribe en metal con chispas en las puntas, golpe (destello,
   sacudida, chispazo), una franja de brillo lo cruza, "JXSTUDIOS" se tipea y
   abajo "presenta". Después, el iris (círculo que se cierra y se abre).

   Uso:
     const intro = crearIntroJXS({ W, H, presenta: 'PRESENTA', vibrar });
     cada cuadro: intro.pasar(dt); intro.dibujar(g);   // g en píxeles del juego
     un toque: intro.saltar();  ¿terminó?: intro.listo
     con el audio andando (después de un toque no se puede antes): jingleJXS(ctx, destino)
     transiciones: irisJXS(g, W, H, cx, cy, r)

   Cada juego la viste a su estilo ("con su intro respectiva a su estilo", 07/10) con `estilo`:
   la misma coreografía, otro material. Todo es opcional (sin estilo = La Cripta):
     metal: [8 colores de arriba a abajo], filo, bisel, borde: '#rrggbb'
     sombra: { dx, dy, col }                  el monograma proyecta una sombra plana (filete)
     fondo(W, H, cx, cy) → lienzo             el fondo (por defecto la fibra de carbono)
     puntas: [colores], golpe: [colores], destello: 'rgba(...)'
     palabra: { col, borde }, presenta: color, negro: color del fondo
     antes(g, t, I) / despues(g, t, I)        dibujar algo más (I.cx, I.cy, I.ancho, I.yPalabra)
     jingle(ctx, bus, t0, tg, h)              otra música; h = { tono, soplo, f, T }
   Para juegos que no son de píxeles (lienzo liso, con escala propia):
     anchoLogo(W, H) → ancho del monograma; logo(g, i) lo dibuja a mano (i = { avance, t, x0, y0, esc,
     ancho, golpe, tGolpe, TRAZOS, camino2d, largo, muestrear }); letras(g, parte, I, t, y) y presentaTxt(g, txt, I, t, y)
     escriben con otra letra; chispa: px de las chispas (por defecto 1)
   ========================================================================== */

const IntroJXS_ = (() => {
  const CAJA = { w: 350, h: 172 };
  const GROSOR = 14.5;
  // el monograma: cuatro trazos de metal (A va abajo en el cruce: se dibuja primero)
  const TRAZOS = [
    { id: 'A', capa: 0, d: [['M', 40, 19], ['L', 114, 19], ['L', 176, 101], ['C', 194, 128, 222, 168, 268, 169], ['C', 310, 170, 342, 152, 342, 122]] },
    { id: 'J', capa: 0, d: [['M', 40, 43], ['L', 98, 43], ['L', 98, 116], ['C', 98, 148, 44, 158, 36, 124]] },
    { id: 'S', capa: 0, d: [['M', 312, 66], ['C', 306, 46, 288, 36, 266, 36], ['C', 242, 36, 226, 48, 226, 63], ['C', 226, 80, 248, 86, 272, 92], ['C', 302, 99, 320, 108, 320, 126], ['C', 320, 142, 300, 148, 272, 148], ['C', 246, 148, 226, 138, 216, 118]] },
    { id: 'B', capa: 1, d: [['M', 10, 130], ['C', 18, 158, 50, 168, 86, 166], ['C', 108, 165, 122, 158, 134, 142], ['L', 200, 46], ['C', 216, 24, 244, 12, 272, 12], ['C', 310, 12, 340, 30, 340, 62]] },
  ];
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const salida = (t) => 1 - Math.pow(1 - t, 3);
  const salidaAtras = (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);

  function camino2d(t, esc, ox, oy) {
    const p = new Path2D();
    for (const [op, ...n] of t.d) {
      const q = n.map((v, i) => (i % 2 ? oy + v * esc : ox + v * esc));
      if (op === 'M') p.moveTo(q[0], q[1]);
      else if (op === 'L') p.lineTo(q[0], q[1]);
      else p.bezierCurveTo(q[0], q[1], q[2], q[3], q[4], q[5]);
    }
    return p;
  }
  function muestrear(t, cada) {
    const pts = [];
    let x = 0, y = 0;
    for (const [op, ...n] of t.d) {
      if (op === 'M') { x = n[0]; y = n[1]; pts.push([x, y]); continue; }
      if (op === 'L') {
        const [x1, y1] = n, largo = Math.hypot(x1 - x, y1 - y), k = Math.max(1, Math.ceil(largo / cada));
        for (let i = 1; i <= k; i++) pts.push([x + ((x1 - x) * i) / k, y + ((y1 - y) * i) / k]);
        x = x1; y = y1; continue;
      }
      const [c1x, c1y, c2x, c2y, x1, y1] = n;
      const aprox = Math.hypot(c1x - x, c1y - y) + Math.hypot(c2x - c1x, c2y - c1y) + Math.hypot(x1 - c2x, y1 - c2y);
      const k = Math.max(2, Math.ceil(aprox / cada));
      for (let i = 1; i <= k; i++) {
        const s = i / k, r = 1 - s;
        pts.push([r * r * r * x + 3 * r * r * s * c1x + 3 * r * s * s * c2x + s * s * s * x1, r * r * r * y + 3 * r * r * s * c1y + 3 * r * s * s * c2y + s * s * s * y1]);
      }
      x = x1; y = y1;
    }
    return pts;
  }
  const largos = new Map();
  function largo(t) {
    if (largos.has(t.id)) return largos.get(t.id);
    const p = muestrear(t, 2);
    let l = 0;
    for (let i = 1; i < p.length; i++) l += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    largos.set(t.id, l);

/* la letra: una serif gruesa "entintada" (una pasada corrida y más clara, como el

const SERIF = 'Georgia, "Times New Roman", "Noto Serif", serif';
const TINTA = '#16110d', PAPEL = '#efe5cf', BERMELLON = '#c8321e';
function texto(g, str, x, y, o) {
  o = o || {};

  g.textAlign = o.alin || 'center'; g.textBaseline = 'middle';

function medir(g, str, tam, peso) { g.font = (peso || 'bold') + ' ' + tam + 'px ' + SERIF; return g.measureText(str).width; }

function tamQueEntra(g, str, tam, ancho, peso) { while (tam > 8 && medir(g, str, tam, peso) > ancho) tam -= 1; return tam; }
function partir(s, n) { const out = []; let l = ''; for (const p of s.split(' ')) { if ((l + ' ' + p).trim().length > n && l) { out.push(l); l = p; } else l = (l + ' ' + p).trim(); } if (l) out.push(l); return out; }

/* ============================================================================
   Las frutas a pincel (sumi-e): aguada despareja con el borde que se corre en
   el papel, contorno de pincel seco que se corta en dos o tres lugares y los
   detalles (hojas, semillas, poros) de a pinceladas. Cada fruta tiene dos
   dibujos en caché: la piel (entera) y el corte (la pulpa, que es lo que se ve
   en las mitades). Las formas son polígonos, así el contorno puede variar el
   grosor como un pincel de verdad.
   ========================================================================== */

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mezclar(a, b, t) { const x = hexRgb(a), y = hexRgb(b); return 'rgb(' + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(',') + ')'; }
function conAlfa(h, a) { const [r, g2, b] = hexRgb(h); return 'rgba(' + r + ',' + g2 + ',' + b + ',' + a + ')'; }

const N_PTS = 60;
const FORMAS = {
  // r = radio de choque; cada forma devuelve puntos [x, y] alrededor del centro
  circulo: (r, ax = 1, ay = 1) => { const p = []; for (let i = 0; i < N_PTS; i++) { const a = (i / N_PTS) * Math.PI * 2; p.push([Math.cos(a) * r * ax, Math.sin(a) * r * ay]); } return p; },
  manzana: (r, hondo = 0.2) => {
    const p = [];
    for (let i = 0; i < N_PTS; i++) {
      const a = (i / N_PTS) * Math.PI * 2 - Math.PI, d = Math.atan2(Math.sin(a + Math.PI / 2), Math.cos(a + Math.PI / 2));
      const rr = r * (1 + 0.05 * Math.cos(2 * a)) - r * hondo * Math.exp(-(d * d) / 0.07) - (Math.sin(a) > 0 ? r * 0.06 * Math.sin(a) : 0);
      p.push([Math.cos(a) * rr * 1.04, Math.sin(a) * rr * 0.96]);
    }
    return p;
  },
  limon: (r) => { const p = []; for (let i = 0; i < N_PTS; i++) { const a = (i / N_PTS) * Math.PI * 2, c = Math.cos(a); p.push([c * r * 1.12 * (1 + 0.16 * Math.pow(Math.abs(c), 14)), Math.sin(a) * r * 0.84]); } return p; },
  gota: (r, abajo) => {   // frutilla (punta abajo) e higo (punta arriba)
    const p = [];
    for (let i = 0; i < N_PTS; i++) {
      const a = (i / N_PTS) * Math.PI * 2, s = Math.sin(a) * (abajo ? 1 : -1);
      const x = Math.cos(a) * r * (1 - 0.3 * Math.max(0, s)), y = Math.sin(a) * r * (s > 0 ? 1.12 : 0.88);
      p.push([x, y + (abajo ? -0.06 : 0.06) * r]);
    }
    return p;
  },
  platano: (r) => {
    const arriba = [], abajo = [], n = N_PTS / 2;
    for (let i = 0; i <= n; i++) {
      const s = (i / n) * 2 - 1, cx = s * r * 1.22, cy = -r * 0.25 + s * s * r * 0.6;
      const nx = -2 * s * r * 0.6 / (r * 1.22), l = Math.hypot(nx, 1), w = r * (0.34 * (1 - Math.pow(Math.abs(s), 3.2)) + 0.05);
      arriba.push([cx + (nx / l) * -w, cy - (1 / l) * w]);
      abajo.push([cx + (nx / l) * w, cy + (1 / l) * w]);
    }
    return arriba.concat(abajo.reverse()).map(([x, y]) => [x, y + r * 0.02]);
  },
};

const FRUTAS = {

  naranja:  { r: 22, pts: 1, forma: (r) => FORMAS.circulo(r), piel: '#e8892a', piel2: '#b85a14', carne: '#f6a33a', carne2: '#e07a14', anillo: '#f8e7c6', jugo: '#ee8a1e' },

  limon:    { r: 19, pts: 1, forma: (r) => FORMAS.limon(r), piel: '#e8c935', piel2: '#b8961a', carne: '#f6ea84', carne2: '#e2cf4a', anillo: '#fbf4cf', jugo: '#e2cc3a' },

};
// en el celu parado, más grandes se cortan mejor y se lucen más (el dibujo escala con r)
for (const k in FRUTAS) FRUTAS[k].r = Math.round(FRUTAS[k].r * 1.25);
const TIPOS_FRUTA = Object.keys(FRUTAS).filter((k) => !FRUTAS[k].bomba);
const PODERES = { hielo: '#4f97c9', frenesi: BERMELLON, doble: '#c99a22' };

function caminoPts(pts, k = 1, dx = 0, dy = 0) {
  const p = new Path2D(), n = pts.length, m = (i) => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2 * k + dx, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2 * k + dy];
  const a = m(0); p.moveTo(a[0], a[1]);
  for (let i = 1; i <= n; i++) { const q = m(i); p.quadraticCurveTo(pts[i % n][0] * k + dx, pts[i % n][1] * k + dy, q[0], q[1]); }
  p.closePath();
  return p;
}
/* contorno de pincel seco: el grosor sube y baja con la presión y se corta en dos lugares */
function contorno(g, pts, base, rnd, col, alfa) {
  const n = pts.length, fase = rnd() * 6, corte1 = Math.floor(rnd() * n), corte2 = (corte1 + Math.floor(n * (0.4 + rnd() * 0.2))) % n;
  g.strokeStyle = col || TINTA; g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const d1 = (i - corte1 + n) % n, d2 = (i - corte2 + n) % n;
    if (d1 < 2 || d2 < 1) continue;
    const pr = 0.55 + 0.45 * Math.sin(i * 0.31 + fase) * Math.sin(i * 0.13 + fase * 2) + 0.25 * (d1 < 6 ? (d1 - 2) / 4 - 1 : 0);
    g.globalAlpha = (alfa || 0.88) * (0.75 + 0.25 * rnd());
    g.lineWidth = Math.max(0.5, base * (0.45 + pr));
    const a = pts[i], b = pts[(i + 1) % n];
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  g.globalAlpha = 1;
}
/* la aguada: el borde corrido, el lavado con luz arriba a la izquierda y manchas parejas de pigmento */
function lavado(g, pts, r, col, col2, rnd, k) {
  k = k || 1;
  const p = caminoPts(pts, k);
  g.fillStyle = conAlfa(col, 0.16); g.fill(caminoPts(pts, k * 1.07, r * 0.03, r * 0.04));
  const gr = g.createRadialGradient(-r * 0.38 * k, -r * 0.42 * k, r * 0.05, 0, 0, r * 1.2 * k);
  gr.addColorStop(0, mezclar(col, PAPEL, 0.5)); gr.addColorStop(0.5, col); gr.addColorStop(1, col2);
  g.fillStyle = gr; g.fill(p);
  g.save(); g.clip(p);
  for (let i = 0; i < 7; i++) {
    const x = (rnd() - 0.5) * r * 1.6 * k, y = (rnd() - 0.5) * r * 1.6 * k, rr = r * (0.3 + rnd() * 0.5) * k;
    const m = g.createRadialGradient(x, y, 0, x, y, rr);
    m.addColorStop(0, rnd() < 0.5 ? conAlfa(col2, 0.22) : 'rgba(239,229,207,0.16)'); m.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = m; g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  // el toque de pincel seco que deja ver el papel
  g.strokeStyle = 'rgba(244,236,218,0.42)'; g.lineCap = 'round';
  for (let i = 0; i < 3; i++) { g.lineWidth = r * (0.05 + i * 0.025) * k; g.beginPath(); g.arc(0, 0, r * (0.62 - i * 0.07) * k, Math.PI * 1.08 + i * 0.05, Math.PI * 1.42 + i * 0.03); g.stroke(); }
  g.restore();
}
function hoja(g, x, y, largo, ang, col) {
  g.save(); g.translate(x, y); g.rotate(ang);
  const p = new Path2D(); p.moveTo(0, 0); p.quadraticCurveTo(largo * 0.5, -largo * 0.42, largo, 0); p.quadraticCurveTo(largo * 0.5, largo * 0.3, 0, 0);
  g.fillStyle = col; g.fill(p);
  g.fillStyle = 'rgba(239,229,207,0.25)'; g.beginPath(); g.ellipse(largo * 0.45, -largo * 0.08, largo * 0.3, largo * 0.06, 0, 0, Math.PI * 2); g.fill();

function puntitos(g, pts, r, n, col, tam, rnd, clipP) {

  for (let i = 0; i < n; i++) { const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * r; g.beginPath(); g.arc(Math.cos(a) * d, Math.sin(a) * d, tam * (0.6 + rnd() * 0.6), 0, Math.PI * 2); g.fill(); }
  g.restore();
}

/* ------------------------------------------------------------ la piel */
const DETALLES = {
  sandia(g, f, r, pts, rnd) {
    const p = caminoPts(pts); g.save(); g.clip(p);
    for (let k = -3; k <= 3; k++) {
      const x0 = k * r * 0.34, l = [];
      for (let y = -r; y <= r; y += r * 0.18) l.push([x0 + Math.sin(y * 0.3 + k) * r * 0.08 + (rnd() - 0.5) * 3, y]);
      trazo(g, l, r * 0.13, f.piel2, 0.55);
    }
    g.restore();
  },
  naranja(g, f, r, pts, rnd) { puntitos(g, pts, r, 70, conAlfa(f.piel2, 0.35), 0.7, rnd, caminoPts(pts)); g.fillStyle = '#4c5a1c'; g.beginPath(); g.arc(r * 0.05, -r * 0.92, r * 0.09, 0, Math.PI * 2); g.fill(); hoja(g, r * 0.05, -r * 0.92, r * 0.7, -0.5, '#4f7a2a'); },
  manzana(g, f, r) { trazo(g, [[0, -r * 0.72], [r * 0.06, -r * 1.05], [r * 0.16, -r * 1.25]], r * 0.1, '#4a2e16'); hoja(g, r * 0.12, -r * 1.05, r * 0.66, -0.35, '#4f7a2a'); },
  limon(g, f, r, pts, rnd) { puntitos(g, pts, r * 1.1, 50, conAlfa(f.piel2, 0.3), 0.6, rnd, caminoPts(pts)); },
  kiwi(g, f, r, pts, rnd) {
    const p = caminoPts(pts); g.save(); g.clip(p); g.strokeStyle = 'rgba(40,24,8,0.4)'; g.lineWidth = 0.7;
    for (let i = 0; i < 110; i++) { const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * r * 1.1, x = Math.cos(a) * d, y = Math.sin(a) * d; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 3, y + rnd() * 3); g.stroke(); }
    g.restore();
  },
  durazno(g, f, r) {
    const m = g.createRadialGradient(r * 0.35, r * 0.1, 0, r * 0.35, r * 0.1, r * 0.8); m.addColorStop(0, 'rgba(200,60,50,0.45)'); m.addColorStop(1, 'rgba(200,60,50,0)');

    trazo(g, [[-r * 0.05, -r * 0.8], [-r * 0.22, -r * 0.2], [-r * 0.12, r * 0.5], [r * 0.08, r * 0.85]], r * 0.07, '#8e3a26', 0.55);

  },
  frutilla(g, f, r, pts, rnd) {
    g.fillStyle = '#f2d878';
    for (let i = 0; i < 26; i++) { const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * r * 0.85, x = Math.cos(a) * d * 0.9, y = Math.sin(a) * d + r * 0.05; g.beginPath(); g.ellipse(x, y, 0.9, 1.5, 0, 0, Math.PI * 2); g.fill(); }
    for (const a of [Math.PI * 0.95, Math.PI * 0.72, -Math.PI / 2, Math.PI * 0.28, Math.PI * 0.05]) hoja(g, 0, -r * 0.8, r * 0.58, a, '#3f7a2a');
    trazo(g, [[0, -r * 0.85], [r * 0.05, -r * 1.2]], r * 0.1, '#3f6a22');
  },
  cereza(g, f, r) { trazo(g, [[0, -r * 0.75], [r * 0.15, -r * 1.2], [r * 0.45, -r * 1.42]], r * 0.11, '#4a3216'); hoja(g, r * 0.4, -r * 1.38, r * 0.8, 0.25, '#4f7a2a'); },
  higo(g, f, r, pts) {
    const p = caminoPts(pts); g.save(); g.clip(p);

  platano(g, f, r) {

/* ----------------------------------------------------------- el corte */
const PULPA = {

  },
  limon(g, f, r) { PULPA.naranja(g, f, r * 0.95); },

    g.fillStyle = c; g.beginPath(); g.ellipse(0, 0, r * 0.5, r * 0.4, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(240,248,210,0.35)'; g.lineWidth = 0.8;

    g.fillStyle = '#7e3a22'; g.beginPath(); g.ellipse(0, 0, r * 0.3, r * 0.4, 0.2, 0, Math.PI * 2); g.fill();

const cacheFruta = new Map();
function spriteFruta(tipo, corte) {
  const clave = tipo + (corte ? '·c' : '') + '|' + S;
  let c = cacheFruta.get(clave);
  if (c) return c;
  const f = FRUTAS[tipo], r = f.r, R = r * 1.55;
  let g;
  [c, g] = lienzoHD(R * 2, R * 2);
  g.translate(R, R);
  const rnd = rngSemilla(tipo.length * 977 + r * 13 + (corte ? 5 : 0)), pts = f.forma(r);
  if (!corte) {
    lavado(g, pts, r, f.piel, f.piel2, rnd);
    DETALLES[tipo](g, f, r, pts, rnd);
    contorno(g, pts, Math.max(1.2, r * 0.085), rnd);
  } else {
    // la cáscara, el blanco (si tiene) y la pulpa, cada capa un poco más adentro
    g.fillStyle = f.piel; g.fill(caminoPts(pts));
    if (f.anillo) { g.fillStyle = f.anillo; g.fill(caminoPts(pts, 0.91)); }
    lavado(g, pts, r, f.carne, f.carne2, rnd, f.anillo ? 0.83 : 0.9);
    g.save(); g.clip(caminoPts(pts, 0.9)); PULPA[tipo](g, f, r, pts, rnd); g.restore();
    contorno(g, pts, Math.max(1, r * 0.06), rnd, mezclar(f.piel2, '#000000', 0.3), 0.8);
  }
  c.R = R;
  cacheFruta.set(clave, c);
  return c;
}

/* la fruta entera, girada (los poderes llevan un aura de su color y su signo) */
function dibujarFruta(g, tipo, x, y, ang, esc, poder, t) {
  const sp = spriteFruta(tipo, false), R = sp.R * (esc || 1);
  if (poder) {
    const col = PODERES[poder], pul = 1 + Math.sin((t || 0) * 8) * 0.08;
    const a = g.createRadialGradient(x, y, R * 0.3, x, y, R * 1.25 * pul); a.addColorStop(0, conAlfa(col, 0.55)); a.addColorStop(1, conAlfa(col, 0));
    g.fillStyle = a; g.fillRect(x - R * 1.4, y - R * 1.4, R * 2.8, R * 2.8);
    g.strokeStyle = col; g.lineWidth = 2.2; g.globalAlpha = 0.85; g.beginPath(); g.arc(x, y, R * 0.95 * pul, (t || 0) * 2, (t || 0) * 2 + Math.PI * 1.7); g.stroke(); g.globalAlpha = 1;
  }
  g.save(); g.translate(x, y); g.rotate(ang); g.drawImage(sp, -R, -R, R * 2, R * 2); g.restore();
  if (poder) iconoPoder(g, poder, x, y + FRUTAS[tipo].r * 0.1, FRUTAS[tipo].r * 0.55);
}
function iconoPoder(g, poder, x, y, s) {
  g.save(); g.translate(x, y);
  g.fillStyle = 'rgba(239,229,207,0.85)'; g.beginPath(); g.arc(0, 0, s, 0, Math.PI * 2); g.fill();
  g.strokeStyle = PODERES[poder]; g.fillStyle = PODERES[poder]; g.lineWidth = s * 0.22; g.lineCap = 'round';
  if (poder === 'hielo') { for (let k = 0; k < 3; k++) { const a = (k / 3) * Math.PI; g.beginPath(); g.moveTo(Math.cos(a) * s * 0.7, Math.sin(a) * s * 0.7); g.lineTo(-Math.cos(a) * s * 0.7, -Math.sin(a) * s * 0.7); g.stroke(); } }
  else if (poder === 'frenesi') { g.beginPath(); g.moveTo(s * 0.15, -s * 0.75); g.lineTo(-s * 0.35, s * 0.08); g.lineTo(s * 0.12, s * 0.05); g.lineTo(-s * 0.15, s * 0.75); g.stroke(); }
  else { g.font = 'bold ' + Math.round(s * 1.1) + 'px ' + SERIF; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('×2', 0, s * 0.06); }
  g.restore();
}
/* media fruta: el corte (la pulpa) recortado por la línea del tajo */
function dibujarMitad(g, m) {
  const sp = spriteFruta(m.tipo, true), R = sp.R * (m.esc || 1);
  g.save(); g.translate(m.x, m.y); g.rotate(m.ang);
  g.beginPath(); if (m.lado) g.rect(-R, 0.6, R * 2, R); else g.rect(-R, -R, R * 2, R - 0.6); g.clip();
  g.rotate(m.off); g.drawImage(sp, -R, -R, R * 2, R * 2);

}
function nuevaFruta(tipo, x, y, vx, vy, poder) {
  const f = FRUTAS[tipo];
  return { tipo, x, y, vx, vy, r: f.r, ang: Math.random() * 6.28, giro: azar(-3, 3), bomba: !!f.bomba, poder: poder || null, subio: false, vivo: true, t: 0 };
}

/* ==== tajo/js/fisica.js ==== */
/* ============================================================================
   El vuelo y el filo. Las frutas salen de abajo con la velocidad justa para
   llegar a la altura que se pide (v = √(2·g·h)), así ninguna se va por arriba
   ni queda baja. El filo es el rastro del dedo: un trazo de pincel que se
   afina hacia la cola y corta solo cuando el dedo va rápido (la sensibilidad
   mueve ese umbral).
   ========================================================================== */

const GRAV = 900;

// velocidad para salir de (x0, y0), tocar el techo en yTope y caer cerca de xFin
function lanzamiento(x0, y0, yTope, xFin) {
  const subida = Math.max(40, y0 - yTope), vy = -Math.sqrt(2 * GRAV * subida);
  const tVuelo = (-vy / GRAV) * 2;
  return { vx: (xFin - x0) / tVuelo, vy };
}
function distSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

/* los filos: el color de la tinta, la veta de pincel seco y cuántas frutas cortadas
   (en total, entre todas las partidas) hacen falta para usarlo */
const FILOS = [
  { col: '#16110d', veta: 'rgba(239,229,207,0.38)', pide: 0 },
  { col: BERMELLON, veta: 'rgba(255,214,190,0.45)', pide: 150 },
  { col: '#2c7a58', veta: 'rgba(214,244,226,0.45)', pide: 400 },
  { col: '#2b3f8c', veta: 'rgba(210,222,255,0.45)', pide: 900 },
  { col: '#c4951c', veta: 'rgba(255,246,200,0.75)', pide: 1600, oro: true },
];
const filoActual = () => FILOS[clamp(DATOS.filo | 0, 0, FILOS.length - 1)];

/* el rastro del dedo: puntos con su hora; vive `vida` segundos */
function nuevoRastro() { return { pts: [], vivo: false }; }
function rastroSumar(ra, x, y, t) {
  const u = ra.pts[ra.pts.length - 1];
  if (u && Math.hypot(u.x - x, u.y - y) < 1.5) { u.t = t; return; }
  ra.pts.push({ x, y, t });
  if (ra.pts.length > 40) ra.pts.shift();
}
function rastroPodar(ra, t, vida) { while (ra.pts.length && t - ra.pts[0].t > vida) ra.pts.shift(); }

/* el trazo: polígono que engorda hacia la punta (el dedo) con dos vetas claras adentro */
function dibujarRastro(g, ra, filo, grosor, t, vida) {
  const p = ra.pts, n = p.length;
  if (n < 2) return;
  const izq = [], der = [], centro = [];
  for (let i = 0; i < n; i++) {
    const a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
    let nx = -(b.y - a.y), ny = b.x - a.x; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    const edad = clamp((t - p[i].t) / vida, 0, 1), w = grosor * 0.5 * Math.pow(i / (n - 1), 0.7) * (1 - edad * 0.6);
    izq.push([p[i].x + nx * w, p[i].y + ny * w]); der.push([p[i].x - nx * w, p[i].y - ny * w]); centro.push([p[i].x, p[i].y, nx, ny, w]);
  }
  g.beginPath(); g.moveTo(izq[0][0], izq[0][1]);
  for (let i = 1; i < n; i++) g.lineTo(izq[i][0], izq[i][1]);
  const u = centro[n - 1];
  g.arc(u[0], u[1], Math.max(0.5, u[4]), Math.atan2(u[3], u[2]), Math.atan2(u[3], u[2]) + Math.PI, true);   // la punta redonda hacia adelante
  for (let i = n - 1; i >= 0; i--) g.lineTo(der[i][0], der[i][1]);
  g.closePath();
  if (filo.oro) { const gr = g.createLinearGradient(p[0].x, p[0].y, u[0], u[1]); gr.addColorStop(0, '#8a6410'); gr.addColorStop(1, '#f0c850'); g.fillStyle = gr; }
  else g.fillStyle = filo.col;
  g.fill();
  // la veta de pincel seco (el papel que se ve entre los pelos del pincel)
  g.strokeStyle = filo.veta; g.lineCap = 'round';
  for (const k of [0.32, -0.18]) {
    g.lineWidth = Math.max(0.6, grosor * 0.07); g.beginPath();
    for (let i = Math.floor(n * 0.25); i < n; i++) { const c = centro[i], x = c[0] + c[2] * c[4] * k, y = c[1] + c[3] * c[4] * k; if (i === Math.floor(n * 0.25)) g.moveTo(x, y); else g.lineTo(x, y); }
    g.stroke();
  }
}

/* ==== tajo/js/sonido.js ==== */
/* ============================================================================
   El sonido, todo sintetizado: koto (cuerda pulsada: sierra que se apaga con
   un filtro que se cierra rápido), shakuhachi (seno con soplido y vibrato que
   entra tarde) y taiko (seno que cae de 150 a 48 Hz con golpe de ruido). La
   escala es la "in" japonesa (re, mi♭, sol, la, si♭). Cada corte toca una nota
   de la escala que sube con el combo: cortar es tocar el koto.
   La música se agenda con el reloj del audio un cuarto de segundo adelante.
   ========================================================================== */

const ESCALA_IN = [0, 1, 5, 7, 8];

const Sonido = {
  ctx: null, total: null, efectos: null, musicaG: null, eco: null, ruidoBuf: null,
  musicaSi: Guardado.leer('musica', true), efectosSi: Guardado.leer('efectos', true),
  tema: null, paso: 0, prox: 0, ultZas: 0,
  iniciar() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }

    if (!AC) return;
    const c = this.ctx = new AC();
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    this.total = c.createGain(); this.total.gain.value = 0.9;
    this.efectos = c.createGain(); this.efectos.gain.value = this.efectosSi ? 0.75 : 0;
    this.musicaG = c.createGain(); this.musicaG.gain.value = this.musicaSi ? 0.34 : 0;

    d.delayTime.value = 0.23; fb.gain.value = 0.32; fl.type = 'lowpass'; fl.frequency.value = 2200;

    const n = c.sampleRate;

  ponerEfectos(si) { this.efectosSi = si; Guardado.escribir('efectos', si); if (this.efectos) this.efectos.gain.setTargetAtTime(si ? 0.75 : 0, this.ctx.currentTime, 0.05); },

  koto(f, t, vol, dur, dst) {
    const c = this.ctx, fl = c.createBiquadFilter(), gn = c.createGain();
    fl.type = 'lowpass'; fl.Q.value = 3; fl.frequency.setValueAtTime(Math.min(9000, f * 9), t); fl.frequency.exponentialRampToValueAtTime(Math.max(200, f * 1.4), t + 0.35);
    fl.connect(gn); gn.connect(dst || this.efectos);
    this.osc('sawtooth', f, t, dur, fl); this.osc('triangle', f * 2.004, t, dur * 0.6, fl);
    this.env(gn, t, vol, 0.003, dur);
    this.ruido(0.025, vol * 0.5, 2600, 'highpass', t, dst);
  },
  shaku(f, t, dur, vol, dst) {
    const c = this.ctx, gn = c.createGain(), lfo = c.createOscillator(), prof = c.createGain();
    gn.connect(dst || this.efectos);
    const o = this.osc('sine', f * 0.97, t, dur, gn), o2 = this.osc('triangle', f, t, dur, gn);
    o.frequency.linearRampToValueAtTime(f, t + 0.12);
    lfo.frequency.value = 5.2; prof.gain.setValueAtTime(0, t); prof.gain.linearRampToValueAtTime(f * 0.014, t + Math.min(0.5, dur * 0.6));
    lfo.connect(prof); prof.connect(o.frequency); prof.connect(o2.frequency); lfo.start(t); lfo.stop(t + dur + 0.05);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(vol, t + 0.14); gn.gain.setValueAtTime(vol, t + Math.max(0.15, dur - 0.25)); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    this.ruido(Math.min(dur, 0.6), vol * 0.55, f * 2, 'bandpass', t, dst, f * 2.5, 4);
  },
  taiko(t, vol, dst, grave) {
    this.tono(grave ? 110 : 150, grave ? 0.7 : 0.42, 'sine', vol, grave ? 36 : 48, t, dst, 0.003);
    this.ruido(0.12, vol * 0.45, 420, 'lowpass', t, dst);
  },
  ka(t, vol, dst) { this.ruido(0.04, vol, 3200, 'highpass', t, dst); this.tono(1100, 0.03, 'square', vol * 0.12, 700, t, dst); },

  /* ------------------------------------------------------------ efectos */
  sfx(n, x) {
    if (!this.ctx || !this.efectosSi || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    switch (n) {
      case 'zas': if (t - this.ultZas < 0.1) return; this.ultZas = t; this.ruido(0.16, 0.05 + 0.1 * (x || 0.5), 700, 'bandpass', t, null, 2600, 1.4); break;
      case 'corte': {
        const k = x || 0;
        this.ruido(0.14, 0.28, 1300, 'bandpass', t, null, 600, 1.2);
        this.tono(440, 0.1, 'sine', 0.14, 130, t);
        this.koto(this.hz(this.grado(7 + Math.min(k, 8))), t + 0.01, 0.12, 0.9);
        break;
      }
      case 'combo': for (let i = 0; i < Math.min(8, x); i++) this.koto(this.hz(this.grado(8 + i)), t + i * 0.055, 0.1, 0.8); this.ka(t, 0.25); this.taiko(t + 0.02, 0.4); break;
      case 'mecha': for (let i = 0; i < 5; i++) this.ruido(0.03, 0.06, 5000, 'highpass', t + i * 0.05 + Math.random() * 0.02); break;
      case 'boom': this.taiko(t, 0.9, null, true); this.ruido(1.4, 0.55, 900, 'lowpass', t, null, 80); this.tono(70, 1.2, 'sine', 0.5, 28, t); break;
      case 'menos': this.taiko(t, 0.6, null, true); this.ruido(0.5, 0.3, 700, 'lowpass', t, null, 120); this.koto(this.hz(50), t + 0.05, 0.12, 0.8); break;
      case 'falla': this.koto(this.hz(this.grado(-2)), t, 0.16, 1.1); this.tono(this.hz(this.grado(-2)), 0.5, 'triangle', 0.08, this.hz(this.grado(-3)), t + 0.05); this.ka(t, 0.2); break;
      case 'poder': for (const [f, v, d] of [[1320, 0.08, 1.2], [1980, 0.05, 0.9], [2640, 0.035, 0.7], [3520, 0.02, 0.5]]) this.tono(f, d, 'sine', v, null, t); this.shaku(this.hz(this.grado(12)), t + 0.05, 0.6, 0.06); break;
      case 'hielo': for (let i = 0; i < 6; i++) this.tono(2600 - i * 260, 0.4, 'sine', 0.04, null, t + i * 0.04); break;
      case 'gong': for (const [f, v, d] of [[98, 0.22, 3], [135, 0.12, 2.6], [212, 0.08, 2.2], [287, 0.05, 1.8], [401, 0.03, 1.4]]) this.tono(f, d, 'sine', v, f * 0.985, t, null, 0.01); this.ruido(0.3, 0.12, 300, 'lowpass', t); break;
      case 'sello': this.taiko(t, 0.45); this.ruido(0.08, 0.2, 1800, 'bandpass', t); break;
      case 'boton': this.tono(880, 0.06, 'sine', 0.12, 560, t); this.ruido(0.02, 0.08, 3000, 'highpass', t); break;
      case 'lanzar': this.ruido(0.25, 0.05, 260, 'lowpass', t, null, 900); break;
      case 'tic': this.ka(t, 0.18); break;
      case 'fin': for (const [i, m] of [[0, 9], [1, 8], [2, 7], [3, 5], [4, 3]]) this.koto(this.hz(this.grado(m)), t + i * 0.16, 0.12, 1.4); this.shaku(this.hz(this.grado(5)), t + 0.85, 1.6, 0.08); break;
    }
  },

  /* ------------------------------------------------------------- música */
  musica(tema) {
    if (this.tema && tema && this.tema.id === tema.id) return;
    this.tema = tema; this.paso = 0;
    if (this.ctx) this.prox = this.ctx.currentTime + 0.12;
  },
  pasar() {
    const c = this.ctx; if (!c || !this.tema || c.state !== 'running' || !this.musicaSi) return;
    const T = this.tema, dp = 60 / T.bpm / 2;
    if (this.prox < c.currentTime - 0.2) this.prox = c.currentTime + 0.05;
    while (this.prox < c.currentTime + 0.25) { this.tocarPaso(this.paso, this.prox, dp); this.paso++; this.prox += dp; }
  },
  tocarPaso(i, t, dp) {
    const T = this.tema, k = i % 16, ac = T.acordes[Math.floor(i / 16) % T.acordes.length], M = this.musicaG;
    const m = T.koto[k]; if (m != null) this.koto(this.hz(this.grado(m + ac)), t, T.vk * (k % 4 === 0 ? 1 : 0.7), 1.3, M);
    const b = T.bajo[k]; if (b != null) this.koto(this.hz(this.grado(b + ac) - 12), t, T.vb, 1.9, M);
    const d = T.tambor[k];
    if (d === 'D') this.taiko(t, T.vt, M); else if (d === 'd') this.taiko(t, T.vt * 0.55, M); else if (d === 'k') this.ka(t, T.vt * 0.5, M);
    for (const [st, gr, du] of T.flauta) if (st === i % 64) this.shaku(this.hz(this.grado(gr + ac)), t, du * dp, T.vf, M);
  },
};

/* ==== tajo/js/intro.js ==== */
/* ============================================================================
   La intro de JXSTUDIOS a pincel: misma coreografía que la de La Cripta, otro
   material. La pantalla negra se abre con un tajo de luz y aparece el papel de
   arroz; el monograma JXS se pinta con tinta (aguada corrida + trazo seco),
   en el golpe cae el sello rojo con salpicón de tinta, y JXSTUDIOS se escribe
   en serif entintada. La música: un glissando de koto, el taiko en el golpe y
   una nota larga de shakuhachi.
   ========================================================================== */

/* el papel de arroz: tono cálido, fibras, motas y una aguada de montañas en la niebla */
function papelWashi(Wl, Hl, semilla, montes) {
  const [c, g] = lienzoHD(Wl, Hl), r = rngSemilla(semilla || 7);
  const gr = g.createLinearGradient(0, 0, 0, Hl); gr.addColorStop(0, '#f3ead6'); gr.addColorStop(1, '#e8dcc0');
  g.fillStyle = gr; g.fillRect(0, 0, Wl, Hl);
  for (let i = 0; i < 260; i++) {
    const x = r() * Wl, y = r() * Hl, l = 6 + r() * 26, a = r() * Math.PI;
    g.strokeStyle = r() < 0.5 ? 'rgba(120,96,60,0.08)' : 'rgba(255,255,255,0.22)'; g.lineWidth = 0.4 + r() * 0.6;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + (r() - 0.5) * 6, y + Math.sin(a) * l * 0.5 + (r() - 0.5) * 6, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let i = 0; i < 180; i++) { g.fillStyle = 'rgba(90,70,40,' + (0.04 + r() * 0.08) + ')'; g.fillRect(r() * Wl, r() * Hl, 0.8, 0.8); }
  if (montes) {
    // tres capas de montes, cada una más clara y más alta (perspectiva de niebla)
    for (let k = 0; k < 3; k++) {
      const base = Hl * (0.98 - k * 0.07), alto = Hl * (0.16 + k * 0.05), tono = 0.16 - k * 0.045;
      g.beginPath(); g.moveTo(0, Hl);
      for (let x = 0; x <= Wl + 6; x += 6) g.lineTo(x, base - alto * (0.45 + 0.35 * Math.sin(x * 0.011 + k * 2.1 + semilla) + 0.2 * Math.sin(x * 0.037 + k)) );
      g.lineTo(Wl, Hl); g.closePath();
      const m = g.createLinearGradient(0, base - alto, 0, base + 30); m.addColorStop(0, 'rgba(30,24,20,' + tono + ')'); m.addColorStop(1, 'rgba(30,24,20,0)');
      g.fillStyle = m; g.fill();
    }
  }
  // un viñeteado tibio en los bordes, como papel viejo
  const v = g.createRadialGradient(Wl / 2, Hl / 2, Math.min(Wl, Hl) * 0.4, Wl / 2, Hl / 2, Math.max(Wl, Hl) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(110,80,40,0.22)');
  g.fillStyle = v; g.fillRect(0, 0, Wl, Hl);
  return c;
}

/* el sello rojo (hanko): cuadrado de bordes comidos con las letras en blanco */
function hanko(g, x, y, tam, txt, ang, alfa) {
  g.save(); g.translate(x, y); g.rotate(ang || 0); g.globalAlpha = alfa == null ? 1 : alfa;
  const r = rngSemilla(31), s = tam / 2;
  g.fillStyle = BERMELLON; g.beginPath();
  const pts = [];
  for (let i = 0; i < 4; i++) for (let k = 0; k < 6; k++) {
    const e = k / 6, d = (r() - 0.5) * tam * 0.06;
    const [ax, ay, bx, by] = [[-s, -s, s, -s], [s, -s, s, s], [s, s, -s, s], [-s, s, -s, -s]][i];
    pts.push([ax + (bx - ax) * e + (i % 2 ? d : 0), ay + (by - ay) * e + (i % 2 ? 0 : d)]);
  }
  g.moveTo(pts[0][0], pts[0][1]); for (const p of pts) g.lineTo(p[0], p[1]); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(244,234,214,0.9)'; g.lineWidth = tam * 0.05; g.strokeRect(-s * 0.8, -s * 0.8, s * 1.6, s * 1.6);
  g.font = 'bold ' + Math.round(tam * (txt.length > 2 ? 0.34 : 0.5)) + 'px ' + SERIF; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#f6eedc'; g.fillText(txt, 0, tam * 0.04);
  // la tinta que no agarró: motas claras
  g.fillStyle = 'rgba(244,234,214,0.55)'; for (let i = 0; i < 14; i++) g.fillRect((r() - 0.5) * tam * 0.9, (r() - 0.5) * tam * 0.9, 1 + r() * 1.5, 1 + r());
  g.restore();
}

/* un salpicón de tinta (gota grande + gotitas en una dirección) */
function salpicon(g, x, y, tam, col, rnd, ang, alfa) {
  g.fillStyle = col; g.globalAlpha = alfa == null ? 1 : alfa;
  g.beginPath();
  for (let i = 0; i < 18; i++) { const a = (i / 18) * Math.PI * 2, rr = tam * (0.75 + rnd() * 0.45); i ? g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
  for (let i = 0; i < 9; i++) {
    const a = (ang == null ? rnd() * Math.PI * 2 : ang + (rnd() - 0.5) * 1.6), d = tam * (1.2 + rnd() * 2.2), rr = tam * (0.08 + rnd() * 0.22);
    g.beginPath(); g.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rr, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
}

const ESTILO_SUMI = {
  negro: '#120e0b',
  chispa: 2,
  anchoLogo: (Wl) => Math.round(Wl * 0.62),
  puntas: ['#16110d', '#2a221c', '#4a4038'],
  golpe: ['#16110d', '#16110d', '#2a221c', BERMELLON],
  destello: 'rgba(200,50,30,0.28)',
  fondo: (Wl, Hl) => papelWashi(Wl, Hl, 3, true),
  logo(g, i) {
    const G = 14.5 * i.esc;
    for (const capa of [0, 1]) for (const tz of i.TRAZOS) {
      if (tz.capa !== capa) continue;
      const p = i.camino2d(tz, i.esc, i.x0, i.y0), l = i.largo(tz) * i.esc;
      g.save();
      if (i.avance < 1) g.setLineDash([Math.max(0.01, l * i.avance), l + 20]);
      g.lineCap = 'round'; g.lineJoin = 'round';
      // la tinta que se corre en el papel, el trazo y el pincel seco por encima
      g.strokeStyle = 'rgba(22,17,13,0.13)'; g.lineWidth = G * 1.55; g.stroke(p);
      g.strokeStyle = 'rgba(22,17,13,0.92)'; g.lineWidth = G; g.stroke(p);
      g.strokeStyle = 'rgba(239,229,207,0.3)'; g.lineWidth = G * 0.12;
      g.save(); g.translate(G * 0.2, -G * 0.12); g.stroke(p); g.restore();
      g.save(); g.translate(-G * 0.18, G * 0.22); g.lineWidth = G * 0.07; g.stroke(p); g.restore();
      g.restore();
    }
    if (i.golpe) {
      // el sello cae grande y se asienta con un rebote
      const k = clamp(i.tGolpe / 0.18, 0, 1), esc = 1 + (1 - salida(k)) * 0.9, tam = 34 * esc;
      const x = i.x0 + i.ancho * 0.96, y = i.y0 + i.ancho * 0.44;
      if (i.tGolpe < 0.5) { const r = rngSemilla(5); salpicon(g, x - 6, y + 4, 9, TINTA, r, Math.PI * 0.9, 0.85 * clamp(i.tGolpe * 8, 0, 1)); }
      hanko(g, x, y, tam, 'JX', -0.08, clamp(k * 1.4, 0, 1));
    }
  },
  letras(g, parte, I, t, y) {
    const tam = 25, total = medir(g, 'JXSTUDIOS', tam), x = I.cx - total / 2;
    texto(g, parte, x, y + 14, { tam, alin: 'left', col: TINTA });
  },
  presentaTxt(g, txt, I, t, y) { texto(g, txt.toUpperCase(), I.cx, y + 42, { tam: 12, col: BERMELLON, peso: '700' }); },
  jingle(ctx, bus, t0, tg, h) {
    const { tono, soplo, f, T } = h;
    soplo(0.18, 0.18, 'bandpass', 900, 6000, t0);                                   // el tajo de luz
    // el glissando de koto en la escala "in" (mi y si bemoles)
    [['D4', 1], ['E4', 0.944], ['G4', 1], ['A4', 1], ['B4', 0.944], ['D5', 1], ['E5', 0.944], ['G5', 1]]
      .forEach(([n, b], k) => tono('triangle', f(n) * b, 0, 0.55, 0.07, t0 + 0.32 + k * 0.06, 0.003));
    tono('sine', 150, 40, 0.8, 0.7, tg, 0.003); soplo(0.3, 0.3, 'lowpass', 600, 120, tg);  // el taiko con el sello
    tono('sine', f('D3'), 0, 1.6, 0.12, tg + 0.02);
    tono('sine', f('A4'), 0, 1.3, 0.07, t0 + T.T_LETRAS + 0.1, 0.15);              // el shakuhachi
    soplo(1.0, 0.04, 'bandpass', 880, 1000, t0 + T.T_LETRAS + 0.1);
    for (let k = 0; k < 9; k++) tono('sine', 1800 + (k % 3) * 120, 0, 0.03, 0.025, t0 + T.T_LETRAS + k * 0.04);
  },
};

/* ==== tajo/js/juego.js ==== */
/* ============================================================================
   TAJO: escenas (intro, idioma, menú, partida, pausa, fin, dojo, controles),
   el filo y los cortes, las olas de fruta, los cuatro modos, los poderes y el
   bucle. Todo en unidades de 360 de ancho; S lo pasa a píxeles.
   ========================================================================== */

const lienzoP = document.getElementById('lienzo');
const g = lienzoP.getContext('2d');
let escena = 'intro', tEsc = 0, trans = null, fondo = null, G = null, ahora = 0, dtCuadro = 1 / 60;

const CTRL_BASE = { grosor: 1, sensib: 1, alcance: 1, tamPausa: 1, zurdo: false, vibrar: true };
const CTRL = Object.assign({}, CTRL_BASE, Guardado.leer('controles', {}));
const guardarCtrl = () => Guardado.escribir('controles', CTRL);
// el umbral es la velocidad del dedo (unidades por segundo) a partir de la que el filo corta
const GROSORES = [10, 15, 21], UMBRALES = [950, 600, 340], ALCANCES = [0, 7, 14], TAM_PAUSA = [30, 38, 48];
function vibrar(ms) { if (CTRL.vibrar && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) { /* */ } }
const GRIS = '#6a5a48';

/* --------------------------------------------------------------- pantalla */
function ajustar() {
  const dpr = Math.min(3, window.devicePixelRatio || 1), cw = innerWidth, ch = innerHeight;
  let cssW = cw / ch > 0.6 ? ch * 0.5625 : cw;
  H = clamp(Math.round(W * ch / cssW), 600, 800);
  let cssH = cssW * H / W;
  if (cssH > ch) { cssW *= ch / cssH; cssH = ch; }
  lienzoP.width = Math.round(cssW * dpr); lienzoP.height = Math.round(cssH * dpr);
  S = lienzoP.width / W;
  Object.assign(lienzoP.style, { width: cssW + 'px', height: cssH + 'px', left: Math.round((cw - cssW) / 2) + 'px', top: Math.round((ch - cssH) / 2) + 'px' });
  cacheFruta.clear(); cacheTrazos.clear();
  fondo = pintarFondo();
}
addEventListener('resize', ajustar);

/* el fondo: papel de arroz con montes en la niebla, el sol rojo y bambú a la izquierda */
function pintarFondo() {
  const c = papelWashi(W, H, 11, true), f = c.getContext('2d');
  const sx = W * 0.77, sy = H * 0.2, sr = 38;
  const sol = f.createRadialGradient(sx - 6, sy - 6, sr * 0.1, sx, sy, sr * 1.12);
  sol.addColorStop(0, 'rgba(214,70,40,0.8)'); sol.addColorStop(0.85, 'rgba(200,50,30,0.72)'); sol.addColorStop(1, 'rgba(200,50,30,0)');
  f.fillStyle = sol; f.beginPath(); f.arc(sx, sy, sr * 1.12, 0, Math.PI * 2); f.fill();
  const r = rngSemilla(19);
  for (const [bx, inc, ancho] of [[14, 0.035, 8], [38, -0.02, 5.5]]) {
    let y = H + 10;
    while (y > -30) {
      const l = 46 + r() * 32, x0 = bx + (H - y) * inc, x1 = bx + (H - y + l) * inc;
      f.globalAlpha = 0.26; f.strokeStyle = '#26301e'; f.lineWidth = ancho; f.lineCap = 'butt';
      f.beginPath(); f.moveTo(x0, y - 2); f.lineTo(x1, y - l + 2); f.stroke();
      f.strokeStyle = TINTA; f.lineWidth = 1.6; f.beginPath(); f.moveTo(x1 - ancho * 0.7, y - l); f.lineTo(x1 + ancho * 0.7, y - l + 1); f.stroke();
      f.globalAlpha = 1;
      if (r() < 0.3) for (let k = 0; k < 3; k++) { f.globalAlpha = 0.2; hoja(f, x1, y - l, 24 + r() * 16, 0.15 + k * 0.5 + r() * 0.2, '#26301e'); }
      f.globalAlpha = 1;
      y -= l;
    }
  }
  return c;
}

/* ---------------------------------------------------------------- entrada */
const E = { punteros: new Map(), clic: null, toque: null, teclas: new Set(), recien: new Set() };
// el filo sigue al primer dedo que toca; las muestras llegan con su hora para medir la velocidad
const FILO = { ra: nuevoRastro(), id: null, muestras: [], ult: null, activo: 0 };
function aLogico(cx, cy) { const r = lienzoP.getBoundingClientRect(); return { x: (cx - r.left) / r.width * W, y: (cy - r.top) / r.height * H }; }
lienzoP.addEventListener('pointerdown', (ev) => {
  ev.preventDefault(); Sonido.iniciar();
  try { lienzoP.setPointerCapture(ev.pointerId); } catch (x) { /* */ }
  const p = aLogico(ev.clientX, ev.clientY);
  E.punteros.set(ev.pointerId, { x: p.x, y: p.y, x0: p.x, y0: p.y, mov: 0 });
  E.toque = { x: p.x, y: p.y };
  if (FILO.id == null) { FILO.id = ev.pointerId; FILO.ra.pts = []; FILO.ult = { x: p.x, y: p.y, t: ev.timeStamp / 1000 }; rastroSumar(FILO.ra, p.x, p.y, FILO.ult.t); }
});
lienzoP.addEventListener('pointermove', (ev) => {
  const pt = E.punteros.get(ev.pointerId); if (!pt) return;
  const lista = ev.getCoalescedEvents ? ev.getCoalescedEvents() : null;
  for (const e of (lista && lista.length ? lista : [ev])) {
    const p = aLogico(e.clientX, e.clientY);
    pt.mov = Math.max(pt.mov, Math.hypot(p.x - pt.x0, p.y - pt.y0)); pt.x = p.x; pt.y = p.y;
    if (ev.pointerId === FILO.id) FILO.muestras.push({ x: p.x, y: p.y, t: e.timeStamp / 1000 });
  }
});
const finPuntero = (ev) => {
  const pt = E.punteros.get(ev.pointerId); if (!pt) return;
  E.punteros.delete(ev.pointerId);
  if (pt.mov < 14) E.clic = { x: pt.x, y: pt.y, x0: pt.x0, y0: pt.y0 };

    if (a > 0) {

      const s = 1 + (1 - salida(a)) * 0.7, txt = tr('nuevoRecord'), w = medir(g, txt, 22) + 40;
      g.save(); g.globalAlpha = a; g.translate(W / 2, y - 8); g.rotate(-0.05); g.scale(s, s);
      g.drawImage(pincelada(Math.round(w), 38, BERMELLON, 3), -w / 2 - 8, -25, w + 16, 50); texto(g, txt, 0, -1, { tam: 22, col: '#f5ecd8', tinta: false });
      g.restore();
    }
  } else texto(g, tr('record') + ' ' + modoRecord(P.modo), W / 2, y - 8, { tam: 15, col: BERMELLON });
  y += 40;
  const est = tr('cortadas') + '  ' + P.cortadas + '   ·   ' + tr('mejorCombo') + '  ' + P.comboMax;
  texto(g, est, W / 2, y, { tam: tamQueEntra(g, est, 13, W - 30), col: TINTA, tinta: false });
  if (P.nuevoFilo >= 0 && tEsc > 1.3) {
    const nom = tr('nombresFilo')[P.nuevoFilo];
    texto(g, tr('nuevoFilo', nom), W / 2, y + 34, { tam: 14, col: FILOS[P.nuevoFilo].col });
    muestraFilo(P.nuevoFilo, W / 2 - 70, y + 62, 140, true);
  }
  const bw = 200, x = (W - bw) / 2;
  if (boton(x, H - 132, bw, 44, tr('otra')) || apretada('Enter', 'Space')) { const m = P.modo; irA('juego', () => empezar(m)); }
  if (boton(x, H - 74, bw, 40, tr('menu'), { col: BERMELLON, tam: 15 }) || apretada('Escape')) irA('menu');
}

/* ------------------------------------------------- práctica: dojo y controles */
let PR = null;
function prepararPractica() { PR = Object.assign(nuevoMundo(), { obj: null, espera: 0, n: (Math.random() * 10) | 0 }); nuevaPractica(); }
function nuevaPractica() { const tipo = TIPOS_FRUTA[PR.n++ % TIPOS_FRUTA.length]; PR.obj = { tipo, x: -99, y: -99, r: FRUTAS[tipo].r, vivo: true, ang: 0, vx: 0, vy: 0 }; }
function practica(x, y, w, h, t) {
  g.fillStyle = 'rgba(255,250,238,0.45)'; g.fillRect(x, y, w, h);
  g.strokeStyle = 'rgba(22,17,13,0.35)'; g.lineWidth = 1.2; g.setLineDash([6, 5]); g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1); g.setLineDash([]);
  texto(g, tr('proba'), x + 10, y + 13, { tam: 11, alin: 'left', col: GRIS, tinta: false });
  const o = PR.obj;
  if (o.vivo) { o.x = x + w / 2 + Math.sin(t * 1.3) * w * 0.28; o.y = y + h / 2 + 6 + Math.sin(t * 2.1) * h * 0.14; o.ang = t * 0.8; }
  pasoMundo(PR, dtCuadro);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  dibujarManchas(PR);
  if (o.vivo) dibujarFruta(g, o.tipo, o.x, o.y, o.ang, 1);
  dibujarMundo(PR);
  g.restore();
  filoPaso(o.vivo ? [o] : null, (ob, a) => { ob.vivo = false; partirFruta(PR, ob, a); Sonido.sfx('corte', PR.n % 6); vibrar(12); PR.espera = 0.7; });
  if (!o.vivo) { PR.espera -= dtCuadro; if (PR.espera <= 0) nuevaPractica(); }
}
function escenaDojo(t) {
  g.drawImage(fondo, 0, 0, W, H);
  texto(g, tr('dojo'), W / 2, 46, { tam: 40 });
  texto(g, tr('filos') + ' · ' + tr('cortadas') + ' ' + DATOS.cortadas, W / 2, 78, { tam: 12, col: GRIS, tinta: false });
  const y0 = 98, alto = 58, nombres = tr('nombresFilo');
  FILOS.forEach((f, i) => {
    const y = y0 + i * alto, libre = DATOS.cortadas >= f.pide, sel = (DATOS.filo | 0) === i;
    if (sel) { g.fillStyle = 'rgba(200,50,30,0.09)'; g.fillRect(14, y, W - 28, alto - 8); }
    muestraFilo(i, 26, y + (alto - 8) / 2, 112, libre);
    texto(g, nombres[i], 156, y + 17, { tam: tamQueEntra(g, nombres[i], 16, W - 176), alin: 'left', col: libre ? TINTA : '#8c8072' });
    const est = sel ? tr('enUso') : libre ? tr('usar') : tr('faltan', f.pide - DATOS.cortadas);
    texto(g, est, 156, y + 37, { tam: 11, alin: 'left', col: sel ? BERMELLON : GRIS, tinta: false });
    if (sel) hanko(g, W - 34, y + (alto - 8) / 2, 22, 'JX', 0.08);
    if (libre && !sel && clicEn(14, y, W - 28, alto - 8)) { DATOS.filo = i; guardarDatos(); Sonido.sfx('boton'); vibrar(10); }
  });
  const py = y0 + FILOS.length * alto + 6;
  practica(20, py, W - 40, H - py - 78, t);
  if (boton(W / 2 - 85, H - 62, 170, 40, tr('volver')) || apretada('Escape')) irA('menu');
  dibujarFilo();
}
function escenaControles(t) {
  g.drawImage(fondo, 0, 0, W, H);
  texto(g, tr('controles'), W / 2, 42, { tam: 32 });
  const filas = [
    ['grosor', 'grosor', ['fino', 'medio', 'grueso']], ['sensib', 'sensib', ['baja', 'media', 'alta']],
    ['alcance', 'alcance', ['baja', 'media', 'alta']], ['tamPausa', 'tamPausa', ['chico', 'medio', 'grande']],
    ['zurdo', 'zurdo', ['no', 'si']], ['vibrar', 'vibrar', ['no', 'si']], ['musica', null, ['no', 'si']], ['sonido', null, ['no', 'si']],
  ];
  let y = 72;
  for (const [etq, clave, ops] of filas) {
    const bw = 56, x0 = W - 14 - ops.length * (bw + 6) + 6;
    texto(g, tr(etq), 16, y + 13, { tam: tamQueEntra(g, tr(etq), 12.5, x0 - 26), alin: 'left', tinta: false });
    const val = etq === 'musica' ? +Sonido.musicaSi : etq === 'sonido' ? +Sonido.efectosSi : typeof CTRL[clave] === 'boolean' ? +CTRL[clave] : CTRL[clave];
    ops.forEach((op, k) => {
      if (!opcion(x0 + k * (bw + 6), y, bw, 26, tr(op), val === k)) return;
      if (etq === 'musica') Sonido.ponerMusica(!!k); else if (etq === 'sonido') Sonido.ponerEfectos(!!k);
      else { CTRL[clave] = typeof CTRL_BASE[clave] === 'boolean' ? !!k : k; guardarCtrl(); if (clave === 'vibrar' && k) vibrar(40); }
    });
    y += 37;
  }
  const py = y + 4, ph = H - py - 80;
  practica(16, py, W - 32, ph, t);
  // cómo queda el botón de pausa (tamaño y lado)
  const tam = TAM_PAUSA[CTRL.tamPausa], bx = CTRL.zurdo ? 24 : W - 24 - tam, by = py + 8;
  g.fillStyle = 'rgba(22,17,13,0.6)'; g.beginPath(); g.arc(bx + tam / 2, by + tam / 2, tam / 2, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#f2e8d2'; g.fillRect(bx + tam * 0.33, by + tam * 0.3, tam * 0.11, tam * 0.4); g.fillRect(bx + tam * 0.56, by + tam * 0.3, tam * 0.11, tam * 0.4);
  if (boton(16, H - 62, (W - 44) / 2, 40, tr('restablecer'), { tam: 14, col: BERMELLON })) { Object.assign(CTRL, CTRL_BASE); guardarCtrl(); }
  if (boton(28 + (W - 44) / 2, H - 62, (W - 44) / 2, 40, tr('listo')) || apretada('Escape')) irA('menu');
  dibujarFilo();
}

const AL_ENTRAR = { menu: prepararMenu, dojo: prepararPractica, controles: prepararPractica };

/* ------------------------------------------------------------------ bucle */
let ultimo = 0;
function temaDe() {
  if (escena === 'juego' || escena === 'pausa') return G.modo === 'zen' ? TEMAS.zen : G.modo === 'tormenta' ? TEMAS.tormenta : TEMAS.juego;
  return TEMAS.menu;
}
function cuadro(ts) {
  requestAnimationFrame(cuadro);
  const dt = Math.min(0.05, ultimo ? (ts - ultimo) / 1000 : 1 / 60); ultimo = ts; dtCuadro = dt;
  const t = ts / 1000; ahora = t;
  tEsc += dt;
  if (trans) { trans.t += dt; if (!trans.hecho && trans.t >= trans.dur) { trans.hecho = true; trans.alMedio(); } if (trans.t >= trans.dur * 2) trans = null; }
  g.setTransform(S, 0, 0, S, 0, 0);
  try {
    if (escena !== 'intro') Sonido.musica(temaDe());
    switch (escena) {
      case 'intro': escenaIntro(dt); break;
      case 'idioma': escenaIdioma(t); break;
      case 'menu': escenaMenu(t); break;
      case 'juego': if (!trans) actualizarPartida(dt); else filoPaso(null); if (escena === 'juego') dibujarPartida(t); else escenaPausa(t); break;
      case 'pausa': escenaPausa(t); break;
      case 'fin': escenaFin(t); break;
      case 'dojo': escenaDojo(t); break;
      case 'controles': escenaControles(t); break;
    }
  } catch (e) { console.error(e); }
  if (trans) dibujarTrans(trans);
  Sonido.pasar();
  E.clic = null; E.toque = null; E.recien.clear(); FILO.muestras.length = 0;
}
function arrancar() {
  ajustar();
  intro = crearIntroJXS({ W, H, presenta: TXT[IDIOMA].presenta, vibrar, estilo: ESTILO_SUMI });
  Sonido.iniciar();
  if (Sonido.ctx && Sonido.ctx.state === 'running') musicaIntro = jingleJXS(Sonido.ctx, Sonido.total, ESTILO_SUMI);
  prepararMenu(); prepararPractica();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (escena === 'juego' && G && !G.fin) irPausa(); Sonido.pausar(true); } else Sonido.pausar(false); });
  requestAnimationFrame(cuadro);
  window.__tajo = {
    get G() { return G; }, get escena() { return escena; }, empezar, irA, terminar, DATOS, CTRL,
    cortarTodo() { for (const f of G.frutas) if (f.vivo && !f.bomba) cortarEnPartida(f, Math.random() * 6); G.frutas = G.frutas.filter((f) => f.vivo); },
  };
}
arrancar();

})();
