<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No está · IBLO Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;800&display=swap">
<style>
  :root{--tinta:#08070c;--humo:#1a1622;--linea:#2b2436;--papel:#f4f1f6;--tenue:#a79fb5;--ac:#ff1e8e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;
       background:radial-gradient(120% 90% at 50% 0%,#241a33 0%,var(--tinta) 62%);
       color:var(--papel);font:400 16px/1.6 Barlow,system-ui,sans-serif}
  .caja{width:min(560px,100%);text-align:center}
  .cuatro{font:400 clamp(72px,22vw,152px)/0.86 Anton,Impact,sans-serif;letter-spacing:.02em;
          margin:0 0 6px;color:transparent;-webkit-text-stroke:2px var(--ac);text-stroke:2px var(--ac)}
  h1{font:400 clamp(22px,5vw,32px)/1.15 Anton,Impact,sans-serif;letter-spacing:.04em;
     text-transform:uppercase;margin:0 0 10px}
  p{color:var(--tenue);margin:0 auto 26px;max-width:40ch}
  .menu{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  a{display:inline-block;padding:11px 18px;border:1px solid var(--linea);border-radius:999px;
    background:var(--humo);color:var(--papel);text-decoration:none;font-weight:600;font-size:15px;
    transition:border-color .18s,transform .18s}
  a:hover{border-color:var(--ac);transform:translateY(-2px)}
  a.fuerte{background:var(--ac);border-color:var(--ac);color:#12060c}
</style>
<div class="caja">
  <div class="cuatro">404</div>
  <h1>Esta noche no existe</h1>
  <p>El link se rompió o la página cambió de nombre. Te dejamos por dónde seguir.</p>
  <div class="menu">
    <a class="fuerte" href="/">Inicio</a>
    <a href="/iblo-publicaciones">Publicaciones</a>
    <a href="/iblo-archivo">Archivo</a>
    <a href="/iblo-reels">Reels</a>
    <a href="/iblo-esteticas">Estéticas</a>
    <a href="/iblo-servicios">Servicios</a>
  </div>
</div>
