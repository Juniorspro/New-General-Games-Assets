<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Reventá las burbujas — para Leonelita</title>
<meta name="description" content="Cada burbuja tiene una palabra. Reventalas en orden y se arma el poema.">
<style>
/* ESTILO: vidrio y neón. Fondo violeta, burbujas traslúcidas con brillo. */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:none;user-select:none;
  background:radial-gradient(ellipse at 30% 10%,#43226b,#1a0d2e 55%,#0d0618 100%);
  font-family:system-ui,-apple-system,sans-serif;color:#f2e9ff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#tit{position:fixed;top:4.5%;left:0;right:0;text-align:center;z-index:2;pointer-events:none;
  font:700 11px/1.6 system-ui;letter-spacing:.24em;text-transform:uppercase;color:#b48ce0}
#poema{position:fixed;left:50%;top:9%;transform:translateX(-50%);z-index:2;
  width:min(460px,90vw);text-align:center;pointer-events:none;padding:16px 12px;
  background:radial-gradient(ellipse at 50% 50%,rgba(13,6,24,.86) 0 52%,rgba(13,6,24,0) 80%);
  font-size:clamp(17px,4.8vw,25px);line-height:1.5;font-weight:300;
  color:#ffe9a8;text-shadow:0 0 26px rgba(255,205,120,.5)}
#poema b{font-weight:700;color:#fff6d8}
#poema:empty{background:none;padding:0}
#pie{position:fixed;bottom:4.5%;left:0;right:0;text-align:center;z-index:2;pointer-events:none;
  font:700 11px/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:#8f6fc0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tit">Día de las flores amarillas</div>
<div id="poema"></div>
<div id="pie">reventá la burbuja que brilla</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MECANICA: reventar EN ORDEN. La burbuja que sigue es la que brilla.
   ═══════════════════════════════════════════════════════════════════════════
   Reventando cualquiera, el poema se armaría desordenado y no diría nada. Con
   una sola marcada no hay que explicar el orden: se ve. */
const c = document.getElementById("c"), x = c.getContext("2d");
const elPoema = document.getElementById("poema");

/* El poema, en pedazos y no palabra por palabra: quince burbujas en una
   pantalla de teléfono es un enjambre, y cada toque decía media idea. */
const POEMA = ["Leonelita,", "si todo", "lo que siento", "fuera aire,",
               "no habría", "burbujas", "suficientes.", "Te amo,", "bubush."];

let AN = 0, AL = 0, dpr = 1;
function medir() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  AN = innerWidth; AL = innerHeight;
  c.width = Math.round(AN * dpr); c.height = Math.round(AL * dpr);
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", medir); medir();

const burbujas = [];
const trozos = [];
let siguiente = 0, dichas = 0;

const FUENTE = (r) => `${Math.round(Math.min(17, r * .40))}px system-ui,sans-serif`;

/* EL TAMAÑO SALE DEL TEXTO, no al revés: con un radio al azar, "suficientes."
   se salía de su propia burbuja. */
function radioPara(txt) {
  x.font = "600 15px system-ui,sans-serif";
  return Math.max(32, x.measureText(txt).width / 2 + 15);
}

/* TODAS ARRANCAN EN PANTALLA Y EN ORDEN, de arriba para abajo.
   Antes salían todas por debajo del borde (y = alto + azar) y subían a 40 px
   por segundo: medido, los primeros dos segundos eran una pantalla violeta
   vacía, y la burbuja marcada —la única que se puede tocar— estaba abajo del
   borde de la pantalla. Se tocaba a ciegas.
   En orden de arriba para abajo, además, el poema se lee como se juega. */
function repartir() {
  burbujas.length = 0;
  const n = POEMA.length;
  for (let i = 0; i < n; i++) {
    const r = radioPara(POEMA[i]);
    // en zigzag: una a la izquierda, la que sigue a la derecha, así no se tapan
    const lado = i % 2 ? 0.66 : 0.34;
    burbujas.push({
      i, r,
      x: Math.min(AN - r - 8, Math.max(r + 8, AN * lado + (Math.random() - .5) * AN * .12)),
      y: AL * 0.34 + i * (AL * 0.70 / Math.max(1, n - 1)),
      vy: 0.30 + Math.random() * 0.30,
      fase: Math.random() * 6.28, amp: 12 + Math.random() * 20,
      tono: 255 + Math.random() * 45,
    });
  }
}
repartir();

function revienta(b) {
  for (let k = 0; k < 18; k++) {
    const a = (k / 18) * 6.28;
    trozos.push({ x: b.x + Math.cos(a) * b.r, y: b.y + Math.sin(a) * b.r,
                  vx: Math.cos(a) * (1.4 + Math.random()), vy: Math.sin(a) * (1.4 + Math.random()),
                  vida: 34 + Math.random() * 16, tono: b.tono });
  }
  siguiente++;
  dichas++;
  const hasta = POEMA.slice(0, dichas);
  elPoema.innerHTML = hasta.map((p, k) => k === hasta.length - 1 ? `<b>${p}</b>` : p).join(" ");
  if (dichas >= POEMA.length)
    setTimeout(() => { elPoema.innerHTML += "<br><b>🌼</b>";
      // ya no queda ninguna: el pie dejaría una instrucción imposible
      document.getElementById("pie").textContent = "21 de septiembre · para Leonelita";
    }, 900);
}

function dibujaBurbuja(b, esLaQueSigue, ahora) {
  const g = x.createRadialGradient(b.x - b.r * .35, b.y - b.r * .38, b.r * .1, b.x, b.y, b.r);
  const luz = esLaQueSigue ? .34 : .12;
  g.addColorStop(0, `hsla(${b.tono},80%,86%,${luz + .2})`);
  g.addColorStop(.7, `hsla(${b.tono},70%,66%,${luz})`);
  g.addColorStop(1, `hsla(${b.tono},70%,60%,${luz * .35})`);
  if (esLaQueSigue) { x.shadowColor = "rgba(255,220,140,.75)"; x.shadowBlur = 26; }
  x.fillStyle = g;
  x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.fill();
  x.shadowBlur = 0;

  x.strokeStyle = esLaQueSigue ? "rgba(255,232,170,.9)" : "rgba(220,200,255,.30)";
  x.lineWidth = esLaQueSigue ? 2.2 : 1.2;
  x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.stroke();

  // el brillito de arriba a la izquierda: sin eso no se lee como vidrio
  x.fillStyle = "rgba(255,255,255,.45)";
  x.beginPath(); x.ellipse(b.x - b.r * .34, b.y - b.r * .38, b.r * .17, b.r * .1, -.7, 0, 7); x.fill();

  x.fillStyle = esLaQueSigue ? "#fff6d8" : "rgba(226,214,250,.55)";
  x.font = `${esLaQueSigue ? 700 : 400} ${FUENTE(b.r)}`;
  x.textAlign = "center"; x.textBaseline = "middle";
  x.fillText(POEMA[b.i], b.x, b.y);

  if (esLaQueSigue) {
    const p = 1 + Math.sin(ahora / 300) * .08;
    x.strokeStyle = `rgba(255,226,150,${.45 - .25 * Math.sin(ahora / 300)})`;
    x.lineWidth = 1.5;
    x.beginPath(); x.arc(b.x, b.y, b.r * p + 9, 0, 7); x.stroke();
  }
}

let t = 0;
function cuadro(ahora) {
  requestAnimationFrame(cuadro);
  t++;
  x.clearRect(0, 0, AN, AL);

  for (const b of burbujas) {
    if (b.i < siguiente) continue;                 // ya reventada
    b.y -= b.vy;
    b.x += Math.sin(t / 60 + b.fase) * (b.amp / 90);
    b.x = Math.min(AN - b.r - 6, Math.max(b.r + 6, b.x));
    // AL LLEGAR ARRIBA VUELVE POR ABAJO. Si se fuera, la palabra que sigue
    // podría no estar nunca en pantalla y el poema se trabaría.
    if (b.y < -b.r - 10) { b.y = AL + b.r + 20; }
    /* LA QUE HAY QUE TOCAR NUNCA SE VA DE LA PANTALLA. Si quedó abajo del
       borde o se metió atrás del poema, vuelve sola a la franja donde se lee.
       No alcanza con acomodarlas al empezar: girando la pantalla, o volviendo
       después de un rato, la marcada puede haber subido de más. */
    if (b.i === siguiente) {
      const arriba = AL * 0.26, abajo = AL * 0.84;
      if (b.y > abajo) b.y -= Math.min(6, b.y - abajo);
      else if (b.y < arriba) b.y += Math.min(6, arriba - b.y);
    }
    dibujaBurbuja(b, b.i === siguiente, ahora);
  }

  for (let i = trozos.length - 1; i >= 0; i--) {
    const s = trozos[i];
    s.x += s.vx; s.y += s.vy; s.vy += .06; s.vida--;
    if (s.vida <= 0) { trozos.splice(i, 1); continue; }
    x.fillStyle = `hsla(${s.tono},85%,80%,${s.vida / 50})`;
    x.beginPath(); x.arc(s.x, s.y, 2.2, 0, 7); x.fill();
  }
}
requestAnimationFrame(cuadro);

function tocar(px, py) {
  const b = burbujas.find((q) => q.i === siguiente);
  if (!b) return;
  // EL BLANCO ES MAS GRANDE QUE LA BURBUJA: 14 px de más. Una burbuja que se
  // mueve y hay que tocar justo es una pelea, no un regalo.
  if (Math.hypot(px - b.x, py - b.y) <= b.r + 14) revienta(b);
}
const punto = (e) => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
c.addEventListener("pointerdown", (e) => { const p = punto(e); tocar(p.x, p.y); e.preventDefault(); });

window.__flores = { dichas: () => dichas, total: POEMA.length,
  /** Dónde está la que hay que tocar, para poder probar que se ve. */
  sigue: () => { const b = burbujas.find((q) => q.i === siguiente);
                 return b ? { x: b.x, y: b.y, r: b.r } : null; },
  pantalla: () => ({ AN, AL }),
  reventarTodo() { while (siguiente < POEMA.length) {
    const b = burbujas.find((q) => q.i === siguiente); if (!b) break; revienta(b); } return dichas; } };
</script>
</body>
</html>
