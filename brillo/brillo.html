<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f8fe8">
<title>BRILLO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#2f8fe8;touch-action:none;overscroll-behavior:none}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden;background:linear-gradient(#1b66d8,#86c4fb 60%,#f2fbff)}
#c{position:absolute;display:block;image-rendering:pixelated}
#ui{position:absolute;inset:0;pointer-events:none}

</style>
</head>
<body>
<div id="app"><canvas id="c"></canvas><div id="ui"></div></div>
<script>
(() => {
  // brillo/js/pixel.js
  function rgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  function hex([r, g, b]) {
    return "#" + (1 << 24 | Math.round(r) << 16 | Math.round(g) << 8 | Math.round(b)).toString(16).slice(1);
  }
  function mezclar(a, b, t) {
    const A = rgb(a), B2 = rgb(b);
    return hex([A[0] + (B2[0] - A[0]) * t, A[1] + (B2[1] - A[1]) * t, A[2] + (B2[2] - A[2]) * t]);
  }
  var empaquetar = (h, a = 255) => {
    const [r, g, b] = rgb(h);
    return (a << 24 | b << 16 | g << 8 | r) >>> 0;
  };
  var RAMPA = {
    azul: ["#0a2566", "#113f9e", "#1a5fd0", "#2f82ee", "#55a5fb", "#8cc8ff", "#c9e7ff", "#f2fbff"],
    verde: ["#0c4a1c", "#156e22", "#1f9a2c", "#3bbd33", "#6fd845", "#a6ee6a", "#d6fba6", "#f6fff0"],
    naranja: ["#6a2a06", "#a2440a", "#d86410", "#f58a1c", "#ffae3c", "#ffcf78", "#ffe9bf", "#fff9ef"],
    rosa: ["#6e0f3e", "#a31a5e", "#d6307f", "#f2549e", "#fb82ba", "#ffb2d6", "#ffdcec", "#fff5fa"],
    amarillo: ["#6b4c00", "#a07400", "#d6a300", "#f5c400", "#ffdb2e", "#ffea73", "#fff5b8", "#fffdf0"],
    violeta: ["#2c1266", "#46209e", "#6534cf", "#8452ee", "#a67bfb", "#c7a8ff", "#e4d5ff", "#f8f4ff"],
    cian: ["#003f5c", "#006b8f", "#0097bf", "#1bbde0", "#4fd8f2", "#8ceafa", "#c8f6fd", "#f0fdff"],
    gris: ["#3a3f47", "#565c66", "#737a85", "#9098a3", "#adb4bd", "#c9ced5", "#e2e5e9", "#f6f7f8"],
    blanco: ["#7d93ad", "#9db1c8", "#bccde0", "#d5e2ef", "#e6eff7", "#f1f6fb", "#f8fbfe", "#ffffff"],
    tierra: ["#3b2413", "#5a371b", "#7a4d27", "#9a6636", "#b98249", "#d3a468", "#e8c894", "#f7ebd2"],
    arena: ["#7a5a2a", "#9c7838", "#bd984e", "#d6b46a", "#e8cc8a", "#f3e0ad", "#faefd0", "#fffaee"]
  };
  var LUZ = (() => {
    const l = [-0.55, -0.7, 0.55], n = Math.hypot(...l);
    return l.map((v) => v / n);
  })();
  var pintura = {
    plana: (c) => () => c,
    /* esfera en bandas: difusa + un poco de luz de abajo, cuantizada en la rampa */
    esfera(rampa, o = {}) {
      const n = rampa.length, bajo = o.bajo ?? 1, alto = o.alto ?? n - 2;
      return (u, v) => {
        const r2 = u * u + v * v;
        if (r2 > 1) return null;
        const z = Math.sqrt(1 - r2);
        let d = -(u * LUZ[0] + v * LUZ[1]) + z * LUZ[2];
        d = d * 0.75 + 0.25 + Math.max(0, v - 0.55) * 0.35;
        const i = Math.max(bajo, Math.min(alto, Math.round(bajo + (alto - bajo) * Math.max(0, Math.min(1, d)))));
        return rampa[i];
      };
    },
    /* el vidrio del Aero: esfera + la gorra clara arriba con corte nítido + el punto de luz */
    aero(rampa, o = {}) {
      const base = pintura.esfera(rampa, o), n = rampa.length, corte = o.corte ?? -0.05, gorra = o.gorra ?? 0.55;
      return (u, v) => {
        const c = base(u, v);
        if (!c) return null;
        const du = u + 0.42, dv = v + 0.56;
        if (du * du * 1.4 + dv * dv * 2.8 < (o.punto ?? 0.05)) return rampa[n - 1];
        if (v < corte && (u / 0.8) ** 2 + ((v + 0.4) / 0.52) ** 2 < 1) return mezclar(c, rampa[n - 1], gorra);
        if (o.rebote !== false && v > 0.5 && (u / 0.62) ** 2 + ((v - 0.78) / 0.24) ** 2 < 1) return mezclar(c, rampa[n - 2], 0.4);
        return c;
      };
    },
    /* una forma de huevo: más ancha arriba (el cuerpo) — se usa con Lienzo.huevo */
    /* degradé vertical en bandas (para cuerpos, piernas, cosas que no son esferas) */
    vertical(rampa, desde, hasta) {
      return (u, v) => rampa[Math.round(desde + (hasta - desde) * (v * 0.5 + 0.5))];
    }
  };
  var Lienzo = class {
    constructor(w, h) {
      this.w = w;
      this.h = h;
      this.p = new Uint32Array(w * h);
      this.hex = new Array(w * h).fill(null);
      this.rampa = new Array(w * h).fill(null);
    }
    punto(x, y, c, rampa, a) {
      x |= 0;
      y |= 0;
      if (x < 0 || y < 0 || x >= this.w || y >= this.h || !c) return;
      const i = y * this.w + x;
      this.p[i] = empaquetar(c, a ?? 255);
      this.hex[i] = c;
      this.rampa[i] = rampa || null;
    }
    borrar(x, y) {
      x |= 0;
      y |= 0;
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      const i = y * this.w + x;
      this.p[i] = 0;
      this.hex[i] = null;
      this.rampa[i] = null;
    }
    hay(x, y) {
      return x >= 0 && y >= 0 && x < this.w && y < this.h && this.p[y * this.w + x] !== 0;
    }
    /* una elipse: pinta es un color o una función (u, v) */
    elipse(cx, cy, rx, ry, pinta, rampa) {
      const f = typeof pinta === "function" ? pinta : () => pinta;
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const u = (x + 0.5 - cx) / rx, v = (y + 0.5 - cy) / ry;
        if (u * u + v * v > 1) continue;
        this.punto(x, y, f(u, v, x, y), rampa);
      }
    }
    /* un huevo: una elipse más ancha arriba (ancho = rx * (1 - k * v)) */
    huevo(cx, cy, rx, ry, k, pinta, rampa) {
      const f = typeof pinta === "function" ? pinta : () => pinta;
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
        const v = (y + 0.5 - cy) / ry;
        if (v * v > 1) continue;
        const r = rx * (1 - k * v);
        for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++) {
          const u = (x + 0.5 - cx) / r;
          if (u * u + v * v > 1) continue;
          this.punto(x, y, f(u, v, x, y), rampa);
        }
      }
    }
    /* rectángulo con esquinas redondeadas (r en píxeles); u, v van de -1 a 1 en la caja */
    caja(x0, y0, x1, y1, r, pinta, rampa) {
      const f = typeof pinta === "function" ? pinta : () => pinta;
      for (let y = Math.floor(y0); y < Math.ceil(y1); y++) for (let x = Math.floor(x0); x < Math.ceil(x1); x++) {
        const px2 = x + 0.5, py = y + 0.5;
        const qx = Math.max(x0 + r - px2, 0, px2 - (x1 - r)), qy = Math.max(y0 + r - py, 0, py - (y1 - r));
        if (qx * qx + qy * qy > r * r) continue;
        this.punto(x, y, f((px2 - x0) / (x1 - x0) * 2 - 1, (py - y0) / (y1 - y0) * 2 - 1, x, y), rampa);
      }
    }
    /* un trazo grueso con puntas redondas (piernas, brazos, tallos) */
    capsula(x0, y0, x1, y1, r, pinta, rampa) {
      const f = typeof pinta === "function" ? pinta : () => pinta;
      const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy || 1e-6;
      for (let y = Math.floor(Math.min(y0, y1) - r); y <= Math.ceil(Math.max(y0, y1) + r); y++) for (let x = Math.floor(Math.min(x0, x1) - r); x <= Math.ceil(Math.max(x0, x1) + r); x++) {
        const px2 = x + 0.5, py = y + 0.5;
        const t = Math.max(0, Math.min(1, ((px2 - x0) * dx + (py - y0) * dy) / L2));
        const ex = px2 - (x0 + dx * t), ey = py - (y0 + dy * t);
        if (ex * ex + ey * ey > r * r) continue;
        const lado = (ex * -dy + ey * dx) / Math.sqrt(L2) / r;
        this.punto(x, y, f(lado, t * 2 - 1, x, y), rampa);
      }
    }
    /* polígono (lista de [x, y]); u, v en la caja que lo contiene */
    poligono(pts, pinta, rampa) {
      const f = typeof pinta === "function" ? pinta : () => pinta;
      const xs = pts.map((q2) => q2[0]), ys = pts.map((q2) => q2[1]);
      const X0 = Math.min(...xs), X1 = Math.max(...xs), Y0 = Math.min(...ys), Y1 = Math.max(...ys);
      for (let y = Math.floor(Y0); y <= Math.ceil(Y1); y++) for (let x = Math.floor(X0); x <= Math.ceil(X1); x++) {
        const px2 = x + 0.5, py = y + 0.5;
        let dentro = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const [xi, yi] = pts[i], [xj, yj] = pts[j];
          if (yi > py !== yj > py && px2 < (xj - xi) * (py - yi) / (yj - yi) + xi) dentro = !dentro;
        }
        if (dentro) this.punto(x, y, f((px2 - X0) / (X1 - X0 || 1) * 2 - 1, (py - Y0) / (Y1 - Y0 || 1) * 2 - 1, x, y), rampa);
      }
    }
    linea(x0, y0, x1, y1, c, rampa) {
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
      for (let i = 0; i <= n; i++) this.punto(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), c, rampa);
    }
    /* el contorno de color: los píxeles vacíos que tocan la figura toman el tono más oscuro de su rampa */
    contorno(o = {}) {
      const { w, h } = this, nuevos = [];
      for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
        if (this.hay(x, y)) continue;
        let vecino = -1;
        for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
          const X = x + dx, Y = y + dy;
          if (this.hay(X, Y)) {
            vecino = Y * w + X;
            break;
          }
        }
        if (vecino < 0 || x < 0 || y < 0 || x >= w || y >= h) continue;
        const R = this.rampa[vecino];
        nuevos.push([x, y, o.color || (R ? R[o.tono ?? 0] : mezclar(this.hex[vecino], "#000000", 0.6)), R]);
      }
      for (const [x, y, c, R] of nuevos) this.punto(x, y, c, R);
      return this;
    }
    /* los bordes de adentro entre dos rampas distintas (la cabeza sobre el cuerpo): una línea oscura */
    separar(rampaDe, o = {}) {
      const { w, h } = this, marcar = [];
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (!this.p[i] || this.rampa[i] !== rampaDe) continue;
        const abajo = (y + 1) * w + x;
        if (y + 1 < h && this.p[abajo] && this.rampa[abajo] && this.rampa[abajo] !== rampaDe) marcar.push([x, y + 1, this.rampa[abajo]]);
      }
      for (const [x, y, R] of marcar) this.punto(x, y, R[o.tono ?? 1], R);
      return this;
    }
    /* al canvas (para dibujar con drawImage); espejo = de cara a la izquierda */
    aCanvas(espejo) {
      const c = document.createElement("canvas");
      c.width = this.w;
      c.height = this.h;
      const g = c.getContext("2d"), img = g.createImageData(this.w, this.h);
      const d = new Uint32Array(img.data.buffer);
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) d[y * this.w + (espejo ? this.w - 1 - x : x)] = this.p[y * this.w + x];
      g.putImageData(img, 0, 0);
      return c;
    }
  };
  function lienzo2d(w, h) {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    return [c, g];
  }
  function azar(semilla) {
    let s = semilla >>> 0 || 1;
    return () => {
      s ^= s << 13;
      s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5;
      s >>>= 0;
      return s / 4294967296;
    };
  }

  // brillo/js/personajes.js
  var CUADRO = { w: 30, h: 36 };
  var CX = 15;
  var PISO = 35;
  function poseBase() {
    return {
      cabeza: { x: CX, y: 10, r: 8 },
      cuerpo: { x: CX, y: 24.4, rx: 6.5, ry: 6.5 },
      /* las piernas: cadera → pie (el pie es la zapatilla) */
      piernas: [{ cx: CX - 2.3, cy: 28.6, px: CX - 2.6, py: PISO - 1.7 }, { cx: CX + 2.3, cy: 28.6, px: CX + 2.6, py: PISO - 1.7 }],
      /* los brazitos: hombro → mano */
      brazos: [{ hx: CX - 5.1, hy: 21.6, mx: CX - 6.7, my: 25.2 }, { hx: CX + 5.1, hy: 21.6, mx: CX + 6.7, my: 25.2 }],
      ojos: "abiertos",
      boca: null,
      mira: 1,
      dy: 0
    };
  }
  var ANIM = {
    quieto: { n: 6, fn(p, f) {
      const b = Math.sin(f / 6 * Math.PI * 2);
      p.dy = b * 0.5;
      p.cabeza.y += b * 0.35;
      p.brazos.forEach((a) => {
        a.my += b * 0.5;
      });
      return p;
    } },
    parpadea: { n: 1, fn(p) {
      p.ojos = "cerrados";
      return p;
    } },
    corre: { n: 8, fn(p, f) {
      const a = f / 8 * Math.PI * 2;
      p.dy = -Math.abs(Math.sin(a)) * 1.3;
      p.cabeza.x += 1.2;
      p.cabeza.y += Math.abs(Math.sin(a)) * 0.4;
      p.cuerpo.x += 0.6;
      p.piernas.forEach((l, i) => {
        const q2 = a + i * Math.PI;
        l.px = l.cx + Math.sin(q2) * 3.2;
        l.py = PISO - 1.7 - Math.max(0, Math.cos(q2)) * 2.2;
      });
      p.brazos.forEach((b, i) => {
        const q2 = a + (1 - i) * Math.PI;
        b.mx = b.hx + Math.sin(q2) * 2.6 + (i ? 0.8 : -0.8);
        b.my = b.hy + 3.6 - Math.abs(Math.cos(q2)) * 1;
      });
      return p;
    } },
    salta: { n: 2, fn(p, f) {
      p.piernas[0].px -= 1.2;
      p.piernas[0].py -= 2.6;
      p.piernas[1].px += 1.5;
      p.piernas[1].py -= 1;
      p.brazos.forEach((b, i) => {
        b.mx = b.hx + (i ? 3 : -3);
        b.my = b.hy - 3 - f;
      });
      return p;
    } },
    cae: { n: 2, fn(p, f) {
      p.piernas.forEach((l, i) => {
        l.px = l.cx + (i ? 1.8 : -1.8);
        l.py -= 1.2;
      });
      p.brazos.forEach((b, i) => {
        b.mx = b.hx + (i ? 3.5 : -3.5);
        b.my = b.hy - 4.5 + f;
      });
      p.ojos = "grandes";
      return p;
    } },
    aterriza: { n: 1, fn(p) {
      p.aplaste = 0.82;
      p.piernas.forEach((l, i) => {
        l.px = l.cx + (i ? 2.6 : -2.6);
      });
      return p;
    } },
    /* el zumbido: tiembla entero con los brazitos abiertos */
    zumbido: { n: 4, fn(p, f) {
      const s = [1, -1, 1, -1][f] * 0.9;
      p.cabeza.x += s;
      p.cuerpo.x += s * 0.6;
      p.brazos.forEach((b, i) => {
        b.mx = b.hx + (i ? 4.5 : -4.5);
        b.my = b.hy - 1 + f % 2;
      });
      p.ojos = "fuertes";
      p.boca = "o";
      return p;
    } },
    /* flotando con la burbuja: piernitas colgando, brazos arriba */
    flota: { n: 4, fn(p, f) {
      const b = Math.sin(f / 4 * Math.PI * 2);
      p.piernas.forEach((l, i) => {
        l.px = l.cx + (i ? 1 : -1) + b * (i ? 0.8 : -0.8);
        l.py -= 0.8;
      });
      p.brazos.forEach((b2, i) => {
        b2.mx = b2.hx + (i ? 2 : -2);
        b2.my = b2.hy - 6;
      });
      p.boca = "feliz";
      return p;
    } },
    /* nadando: brazada y patada */
    nada: { n: 6, fn(p, f) {
      const a = f / 6 * Math.PI * 2;
      p.cabeza.x += 1.2;
      p.cuerpo.x += 0.3;
      p.brazos.forEach((b, i) => {
        const q2 = a + i * Math.PI;
        b.mx = b.hx + Math.cos(q2) * 4.5;
        b.my = b.hy + Math.sin(q2) * 3.5;
      });
      p.piernas.forEach((l, i) => {
        const q2 = a + i * Math.PI;
        l.px = l.cx - 2 + Math.sin(q2) * 1.6;
        l.py = PISO - 2.4 + Math.cos(q2) * 1.2;
      });
      return p;
    } },
    habla: { n: 4, fn(p, f) {
      p.boca = f % 2 ? "o" : "chica";
      p.brazos[1].mx += f === 1 ? 1.5 : 0;
      p.brazos[1].my -= f === 1 ? 2 : 0;
      return p;
    } },
    saluda: { n: 4, fn(p, f) {
      const b = p.brazos[1];
      b.mx = b.hx + 3 + f % 2 * 2;
      b.my = b.hy - 7;
      p.boca = "feliz";
      return p;
    } },
    feliz: { n: 4, fn(p, f) {
      p.dy = -[0, 2, 3, 1][f];
      p.brazos.forEach((b, i) => {
        b.mx = b.hx + (i ? 3 : -3);
        b.my = b.hy - 6;
      });
      p.ojos = "felices";
      p.boca = "feliz";
      return p;
    } },
    triste: { n: 2, fn(p, f) {
      p.cabeza.y += 1;
      p.ojos = "tristes";
      p.brazos.forEach((b) => {
        b.my += 1;
      });
      p.dy = f * 0.3;
      return p;
    } },
    abraza: { n: 2, fn(p, f) {
      p.brazos.forEach((b, i) => {
        b.mx = b.hx + (i ? 6 : 2);
        b.my = b.hy + 0.5 - f;
      });
      p.ojos = "felices";
      p.boca = "feliz";
      return p;
    } }
  };
  var ANIMS = Object.keys(ANIM);
  var cuadrosDe = (anim) => (ANIM[anim] || ANIM.quieto).n;
  function ojos(L, p, R, plano) {
    const hx = p.cabeza.x + p.mira * 1.4, hy = p.cabeza.y + 0.4;
    const oscuro = plano ? R[1] : "#0b1a3c", brillo = "#ffffff";
    for (const dx of [-2.6, 2.6]) {
      const x = Math.round(hx + dx - 0.5), y = Math.round(hy - 1);
      switch (p.ojos) {
        case "cerrados":
          L.punto(x, y + 1, oscuro);
          L.punto(x + 1, y + 1, oscuro);
          break;
        case "felices":
          L.punto(x, y + 1, oscuro);
          L.punto(x + 1, y, oscuro);
          L.punto(x + 2, y + 1, oscuro);
          break;
        case "tristes":
          L.punto(x, y, oscuro);
          L.punto(x + 1, y + 1, oscuro);
          L.punto(x + 1, y + 2, oscuro);
          break;
        case "fuertes":
          for (let i = 0; i < 2; i++) {
            L.punto(x, y + i, oscuro);
            L.punto(x + 1, y + i, oscuro);
          }
          L.punto(x + (dx < 0 ? 1 : 0), y - 1, oscuro);
          break;
        default: {
          const alto = p.ojos === "grandes" ? 4 : 3;
          for (let i = 0; i < alto; i++) {
            L.punto(x, y + i - (alto > 3 ? 1 : 0), oscuro);
            L.punto(x + 1, y + i - (alto > 3 ? 1 : 0), oscuro);
          }
          if (!plano) L.punto(x + 1, y - (alto > 3 ? 1 : 0), brillo);
        }

          this.fx.soltar(e.x, e.y, 12, { v: 70, col: "#ffffff" });
          break;
        case "gota":
          this.fx.soltar(e.x, e.y, 5, { v: 35, col: "#c8f6fd", tam: 1 });
          this.letreros.push({ x: e.x, y: e.y - 6, t: 0, txt: "+1" });
          break;
        case "guino":
          this.fx.soltar(e.x, e.y, 18, { v: 80, col: "#fff5b8" });
          this.ondas.push({ x: e.x, y: e.y, t: 0, dorada: true });
          break;
        case "sesion":
          this.fx.soltar(e.x, e.y - 14, 14, { v: 60, col: "#a6ee6a" });
          break;
        case "hongo":
          this.hongoAplaste.set(Math.floor(e.x / T2), 12);
          break;
        case "aterriza":
          this.tAterriza = 0.1;
          break;
        case "muere":
          this.sacudon = 0.3;
          break;
        case "revive":
          this.fx.soltar(e.x, e.y - 14, 16, { v: 60, col: "#8cc8ff" });
          break;
        case "agua":
        case "saleAgua":
          this.fx.soltar(e.x, Math.floor(e.y / T2) * T2, 10, { v: 55, col: "#c8f6fd", sube: 40, tam: 1 });
          break;
        case "burbuja":
        case "entra":
        case "sale":
          this.fx.soltar(e.x, e.y, 6, { v: 30, col: "#ffffff", tam: 1 });
          break;
      }
      if (this.alEvento) this.alEvento(e, this);
    }
    /* un bloque plano se rompe: los pedazos grises saltan y se vuelven burbujas de colores */
    romper(tx, ty) {
      for (let i = 0; i < 6; i++) this.trozos.push({ x: tx * T2 + 4 + i % 3 * 4, y: ty * T2 + 4 + Math.floor(i / 3) * 6, vx: (Math.random() - 0.5) * 120, vy: -60 - Math.random() * 80, t: 0, col: ["#ff82ba", "#6fd845", "#55a5fb", "#ffdb2e", "#a67bfb", "#4fd8f2"][i] });
    }
    /* ---------------- la cámara ---------------- */
    camara(dt, ya) {
      const p = this.m.p, m = this.m;
      const w = this.w || 640, h = this.h || 360;
      this.mira += ((Math.abs(p.vx) > 0.6 ? p.dir * 46 : this.mira * 0.9 / 46 * 46) - this.mira) * (ya ? 1 : suave(0.965, dt));
      let tx = p.x - w / 2 + this.mira, ty = p.y - h * 0.6;
      if (this.encuadre) {
        tx = this.encuadre.x - w / 2;
        ty = this.encuadre.y - h / 2;
      }
      tx = Math.max(0, Math.min(m.W * T2 - w, tx));
      ty = Math.max(0, Math.min(m.H * T2 - h, ty));
      if (m.H * T2 < h) ty = (m.H * T2 - h) / 2;
      const k = ya ? 1 : suave(this.encuadre ? 0.95 : 0.88, dt);
      this.cam.x += (tx - this.cam.x) * k;
      this.cam.y += (ty - this.cam.y) * (ya ? 1 : suave(0.92, dt));
    }
    /* ---------------- lo que se anima con el tiempo real ---------------- */
    cuadro(dt) {
      this.t += dt;
      this.camara(dt);
      this.fx.pasar(dt);
      for (const o of this.ondas) o.t += dt;
      this.ondas = this.ondas.filter((o) => o.t < 0.5);
      for (const q2 of this.trozos) {
        q2.t += dt;
        q2.x += q2.vx * dt;
        q2.y += q2.vy * dt;
        q2.vy += 300 * dt;
      }
      this.trozos = this.trozos.filter((q2) => q2.t < 1.1);
      for (const q2 of this.letreros) q2.t += dt;
      this.letreros = this.letreros.filter((q2) => q2.t < 0.8);
      for (const q2 of this.pops) q2.t += dt;
      this.pops = this.pops.filter((q2) => q2.t < 1.4);
      this.sacudon = Math.max(0, this.sacudon - dt);
      this.tAterriza -= dt;
      for (const [k, v] of this.hongoAplaste) {
        if (v <= 0) this.hongoAplaste.delete(k);
        else this.hongoAplaste.set(k, v - 1);
      }
      this.tParpado -= dt;
      if (this.tParpado < 0) {
        this.parpado = 0.12;
        this.tParpado = 2 + Math.random() * 3;
      }
      if (this.parpado > 0) this.parpado -= dt;
      const p = this.m.p;
      this.fase += Math.abs(p.vx) * dt * 60;
    }
    /* qué dibujo le toca a Nick */
    poseNick() {
      const p = this.m.p, t = this.t;
      if (p.muerto) return ["gris", "triste", Math.floor(t * 4)];
      if (p.enBurbuja || p.flotando) return ["nick", "flota", Math.floor(t * 6)];
      if (p.zumbido > 0) return ["nick", "zumbido", Math.floor(t * 30)];
      if (p.enAgua) return ["nick", "nada", Math.floor(t * 8)];
      if (!p.enSuelo) return ["nick", p.vy < 0 ? "salta" : "cae", Math.floor(t * 8)];
      if (this.tAterriza > 0) return ["nick", "aterriza", 0];
      if (Math.abs(p.vx) > 0.4) return ["nick", "corre", Math.floor(this.fase / 7)];
      if (this.parpado > 0) return ["nick", "parpadea", 0];
      return ["nick", this.gestoNick || "quieto", Math.floor(t * 6)];
    }
    /* ---------------- dibujar ---------------- */
    dibujar(g, w, h) {
      this.w = w;
      this.h = h;
      const m = this.m, t = this.t;
      const sac = this.sacudon > 0 ? Math.round((Math.random() - 0.5) * this.sacudon * 16) : 0;
      const cam = { x: Math.round(this.cam.x) + sac, y: Math.round(this.cam.y) };
      this.fondo.atras(g, cam, t, w, h, m.H * T2 - h);
      this.burbujas.dibujar(g, cam, t, w, h, "atras");
      this.capa.dibujar(g, cam, w, h);
      const X = (x) => Math.round(x - cam.x), Y = (y) => Math.round(y - cam.y);
      const f = Math.floor(t * 8);
      for (const q2 of this.encima) {
        const x = q2.x * T2 - cam.x, y = q2.y * T2 - cam.y;
        if (x < -20 || x > w + 20 || y < -20 || y > h + 20) continue;
        if (q2.b === B.TABLON) {
          const izq = baldosa(m, q2.x - 1, q2.y) !== B.TABLON, der = baldosa(m, q2.x + 1, q2.y) !== B.TABLON;
          g.drawImage(tablon(izq, der), Math.round(x), Math.round(y));
        } else if (q2.b === B.PLANO) {
          if (!m.rotos.has(q2.i)) g.drawImage(bloquePlano(), Math.round(x), Math.round(y));
        } else if (q2.b === B.ESTATICA) estatica(g, Math.round(x), Math.round(y), f);
        else if (q2.b === B.HONGO) {
          const a = this.hongoAplaste.get(q2.x) || 0;
          g.drawImage(hongo(a > 8 ? 1 : a > 4 ? 2 : a > 0 ? 3 : 0), Math.round(x - 2), Math.round(y - 2));
        }
      }
      for (const q2 of m.plataformas) {
        const a = plataformaEn(q2, m.t);
        g.drawImage(plataforma(q2.w), X(a.x), Y(a.y));
      }
      for (const q2 of m.burbujeros) {
        g.fillStyle = "#e6eff7";
        g.fillRect(X(q2.x - 8), Y(q2.y + 4), 16, 6);
        for (const b of burbujasDe(q2, m.t)) {
          const img = burbuja(b.r);
          g.globalAlpha = 0.9;
          g.drawImage(img, X(b.x - img.width / 2), Y(b.y - img.height / 2));
          g.globalAlpha = 1;
        }
      }
      for (const q2 of m.gotas) if (!q2.tomada) g.drawImage(gota(f + (q2.x >> 4)), X(q2.x - 5), Y(q2.y - 7 + Math.sin(t * 3 + q2.x * 0.1) * 1.5));
      for (const q2 of m.guinos) if (!q2.tomado) {
        const img = guino(Math.floor(t * 1.5) % 3 === 0 ? 1 : 0);
        g.drawImage(img, X(q2.x - 10), Y(q2.y - 10 + Math.sin(t * 2.2) * 2));
      }
      for (const s of m.sesiones) g.drawImage(sesion(m.p.checkpoint.id === s.id, f), X(s.x - 12), Y(s.y - 28));
      if (m.salida) {
        const img = orbe(this.N.mundo, Math.floor(t * 6));
        g.drawImage(img, X(m.salida.x - 18), Y(m.salida.y - 44 + Math.sin(t * 1.6) * 3));
      }
      for (const q2 of m.planitos) {
        if (m.restaurados.has(q2.id)) continue;
        const e = planitoEn(q2, m.t);
        g.drawImage(planito(Math.floor(m.t / 12), e.dir), X(e.x - 8), Y(e.y - 16));
      }
      for (const v of this.npcs) if (v.visible) g.drawImage(cuadro(v.id, v.anim, Math.floor(t * (v.anim === "habla" ? 8 : 6)), v.mira < 0), X(v.x - 15), Y(v.y - 35));
      const p = m.p;
      const [quien, anim, fr] = this.poseNick();
      const muerto = p.muerto;
      if (!muerto || p.tMuerto < 40) {
        g.globalAlpha = muerto ? Math.max(0, 1 - p.tMuerto / 40) : 1;
        g.drawImage(cuadro(quien, anim, fr, p.dir < 0), X(p.x - 15), Y(p.y - 35 + (muerto ? -p.tMuerto * 0.3 : 0)));
        g.globalAlpha = 1;
      }
      if (p.flotando || p.enBurbuja) {
        const img = burbuja(p.enBurbuja ? 22 : 19);
        g.globalAlpha = 0.85;
        g.drawImage(img, X(p.x - img.width / 2), Y(p.y - p.h / 2 - img.height / 2 - 2));
        g.globalAlpha = 1;
      }
      for (const o of this.ondas) {
        const r = 6 + o.t * (o.dorada ? 90 : 140), a = 1 - o.t / 0.5;
        g.globalAlpha = a * 0.9;
        g.strokeStyle = o.dorada ? "#fff5b8" : "#c9e7ff";
        g.lineWidth = 2;
        g.beginPath();
        g.arc(X(o.x), Y(o.y), r, 0, Math.PI * 2);
        g.stroke();
        g.globalAlpha = a * 0.5;
        g.beginPath();
        g.arc(X(o.x), Y(o.y), r * 0.7, 0, Math.PI * 2);
        g.stroke();
        g.globalAlpha = 1;
      }
      for (const q2 of this.trozos) {
        const k = Math.min(1, q2.t / 0.5);
        if (k < 1) {
          g.fillStyle = "#9aa0a8";
          g.fillRect(X(q2.x), Y(q2.y), 4, 4);
        }
        const img = burbuja(3 + k * 2);
        g.globalAlpha = k * (1 - Math.max(0, q2.t - 0.8) / 0.3);
        g.drawImage(img, X(q2.x - img.width / 2), Y(q2.y - img.height / 2));
        g.globalAlpha = 1;
        if (k >= 1) {
          g.fillStyle = q2.col;
          g.globalAlpha = 0.5;
          g.fillRect(X(q2.x) - 1, Y(q2.y) - 1, 2, 2);
          g.globalAlpha = 1;
        }
      }
      for (const q2 of this.pops) {
        for (let i = 0; i < 7; i++) {
          const a = i / 7 * Math.PI * 2, r = 4 + q2.t * 30;
          const img = burbuja(2 + i % 3);
          g.globalAlpha = Math.max(0, 1 - q2.t / 1.4);
          g.drawImage(img, X(q2.x + Math.cos(a) * r - img.width / 2), Y(q2.y + Math.sin(a) * r * 0.6 - q2.t * 40 - img.height / 2));
        }
        g.globalAlpha = 1;
      }
      this.fx.dibujar(g, cam);
      g.font = "bold 8px sans-serif";
      g.textAlign = "center";
      for (const q2 of this.letreros) {
        g.globalAlpha = 1 - q2.t / 0.8;
        g.fillStyle = "#ffffff";
        g.fillText(q2.txt, X(q2.x), Y(q2.y - q2.t * 20));
      }
      g.globalAlpha = 1;
      for (const a of this.agua) {
        const x0 = X(a.x0 * T2), x1 = X(a.x1 * T2), y0 = Y(a.y * T2);
        if (x1 < 0 || x0 > w || y0 > h || y0 < -T2) continue;
        g.fillStyle = a.sup ? "rgba(60,190,240,0.38)" : "rgba(30,150,220,0.45)";
        g.fillRect(x0, y0, x1 - x0, T2);
        if (a.sup) {
          for (let x = x0; x < x1; x++) {
            const o = Math.round(Math.sin((x + cam.x) * 0.18 + t * 3) * 1.2 + Math.sin((x + cam.x) * 0.07 - t * 1.7));
            g.fillStyle = "rgba(230,250,255,0.85)";
            g.fillRect(x, y0 + o, 1, 1);
            g.fillStyle = "rgba(160,230,255,0.5)";
            g.fillRect(x, y0 + o + 1, 1, 2);
          }
        } else {
          for (let x = x0; x < x1; x += 2) for (let y = y0; y < y0 + T2; y += 2) {
            const c = Math.sin((x + cam.x) * 0.23 + t * 1.3) + Math.sin((y + cam.y) * 0.31 - t * 1.1) + Math.sin((x + y + cam.x) * 0.11 + t);
            if (c > 2.2) {
              g.fillStyle = "rgba(210,250,255,0.35)";
              g.fillRect(x, y, 2, 1);
            }
          }
        }
      }
      const per = this.pasto.width, ox = -(cam.x * 1.25 % per + per) % per;
      const yp = h - this.pasto.height + 30 + Math.round((m.H * T2 - h - cam.y) * 1.25);
      if (yp < h) for (let x = Math.round(ox); x < w; x += per) g.drawImage(this.pasto, x, yp);
      this.burbujas.dibujar(g, cam, t, w, h, "frente");
      this.camVista = cam;
    }
    /* dónde está algo del mundo en la pantalla del juego */
    aPantalla(x, y) {
      const c = this.camVista || this.cam;
      return { x: x - c.x, y: y - c.y };
    }
  };

  // brillo/js/prueba-nivel.js
  function probarNivel() {
    const q2 = new URLSearchParams(location.search);
    Pantalla.iniciar();
    const post = new Post(document.getElementById("c"));
    const habil = {};
    for (const h of (q2.get("habil") || "").split(",")) if (h) habil[h] = true;
    const N = new Nivel(q2.get("nivel") || "colina", { habil, en: q2.has("x") ? { x: +q2.get("x"), y: +q2.get("y") } : null });
    let [base, g] = lienzo2d(Pantalla.w, Pantalla.h);
    const teclas = {}, antes = {};
    addEventListener("keydown", (e) => {
      teclas[e.code] = true;
      if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
    });
    addEventListener("keyup", (e) => {
      teclas[e.code] = false;
    });
    const leer = () => {
      const s = !!(teclas.KeyZ || teclas.Space), a = !!teclas.KeyX;
      const r = { x: (teclas.ArrowRight ? 1 : 0) - (teclas.ArrowLeft ? 1 : 0), y: (teclas.ArrowUp ? 1 : 0) - (teclas.ArrowDown ? 1 : 0), salto: s, saltoE: s && !antes.s, accion: a, accionE: a && !antes.a };
      antes.s = s;
      antes.a = a;
      return r;
    };
    let acum = 0, ult = 0;
    window.__N = N;
    window.__paso = (inp, n = 1) => {
      for (let i = 0; i < n; i++) N.paso(inp);
    };
    const cuadroN = (ts) => {
      requestAnimationFrame(cuadroN);
      const dt = ult ? Math.min(0.1, (ts - ult) / 1e3) : DT;
      ult = ts;
      const w = Pantalla.w, h = Pantalla.h;
      if (base.width !== w || base.height !== h) {
        [base, g] = lienzo2d(w, h);
        post.tamano(w, h, Pantalla.escala, Pantalla.lienzo);
      }
      if (!window.__congelado) {
        acum += dt;
        let n = 0;
        while (acum >= DT && n < 5) {
          N.paso(leer());
          acum -= DT;
          n++;
        }
      }
      N.cuadro(dt);
      N.dibujar(g, w, h);
      const F = N.fondo;
      post.mostrar(base, { ...F.post, sol: F.sol, grado: F.grado, t: N.t });
    };
    post.tamano(Pantalla.w, Pantalla.h, Pantalla.escala, Pantalla.lienzo);
    requestAnimationFrame(cuadroN);
    window.__listo = true;
  }

  // brillo/js/main.js
  var q = new URLSearchParams(location.search);
  if (q.get("prueba") === "sprites") probarSprites();
  else if (q.get("prueba") === "fondo") probarFondo();
  else if (q.get("prueba") === "nivel") probarNivel();
})();

</script>
