<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f8fe8">
<title>BRILLO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#2f8fe8;touch-action:none;overscroll-behavior:none}
:root{--vw:1vw;--vh:1vh;--u:calc(var(--lh,100vh) / 100);
  --letra:'Segoe UI','Frutiger','Frutiger Linotype','Myriad Pro','Trebuchet MS','Helvetica Neue',Arial,sans-serif;
  --tinta:#0b2a55;--aqua1:#c6f4ff;--aqua2:#5fd0ff;--aqua3:#1a9fe6;--aqua4:#56d8ff;
  --verde1:#e8ffd2;--verde2:#86e24f;--verde3:#3cae1d;--verde4:#8fec5e}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden;background:linear-gradient(#1b66d8,#86c4fb 60%,#f2fbff)}
#c{position:absolute;display:block;image-rendering:pixelated}
#ui{position:absolute;inset:0;pointer-events:none;font-family:var(--letra);color:var(--tinta)}
:where(#ui) :where(button){font:inherit;color:inherit;border:0;background:none;cursor:pointer;outline:none}
.capa{position:absolute;left:var(--lx);top:var(--ly);width:var(--lw);height:var(--lh);pointer-events:none;z-index:40}
.capa>*{pointer-events:auto}
.capa.oscuro{background:radial-gradient(ellipse at 50% 40%,rgba(0,40,110,.15),rgba(0,30,80,.45));pointer-events:auto}

/* ================= el vidrio: la base de todo ================= */
.vidrio,.ventana,.menu,.chat,.aviso,.hud>span,.cartelMundo{
  background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.28) 46%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.2) 100%),rgba(160,215,255,.22);
  -webkit-backdrop-filter:blur(10px) saturate(170%);backdrop-filter:blur(10px) saturate(170%);
  border:1px solid rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(20,90,170,.35),0 calc(1.4*var(--u)) calc(4*var(--u)) rgba(0,40,110,.35),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.4)}

/* ================= las píldoras (botones) ================= */
.pildora{position:relative;display:block;min-width:calc(38*var(--u));padding:calc(1.6*var(--u)) calc(5*var(--u));border-radius:999px;font-weight:600;font-size:clamp(13px,calc(3.3*var(--u)),26px);color:#fff;letter-spacing:.02em;text-shadow:0 1px 1px rgba(0,50,110,.7),0 0 6px rgba(0,80,160,.4);
  background:linear-gradient(180deg,var(--aqua1) 0%,var(--aqua2) 49%,var(--aqua3) 51%,var(--aqua4) 100%);
  box-shadow:0 0 0 1px #0a6fb5,inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 4px rgba(0,60,140,.25),0 calc(.8*var(--u)) calc(1.6*var(--u)) rgba(0,40,110,.35);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,filter .2s;animation:aparecePildora .5s var(--d,0s) both cubic-bezier(.3,1.5,.5,1)}
.pildora::after{content:'';position:absolute;left:8%;right:8%;top:6%;height:40%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.1));pointer-events:none}
.pildora.verde{background:linear-gradient(180deg,var(--verde1) 0%,var(--verde2) 49%,var(--verde3) 51%,var(--verde4) 100%);box-shadow:0 0 0 1px #2a8a14,inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 4px rgba(20,90,0,.25),0 calc(.8*var(--u)) calc(1.6*var(--u)) rgba(0,60,20,.3);text-shadow:0 1px 1px rgba(20,70,0,.75)}
.pildora.foco{transform:scale(1.06);filter:brightness(1.08);box-shadow:0 0 0 1px #0a6fb5,0 0 0 calc(.6*var(--u)) rgba(255,255,255,.7),0 0 calc(3*var(--u)) rgba(120,230,255,.95),inset 0 1px 0 #fff}
.pildora.verde.foco{box-shadow:0 0 0 1px #2a8a14,0 0 0 calc(.6*var(--u)) rgba(255,255,255,.7),0 0 calc(3*var(--u)) rgba(170,255,120,.95),inset 0 1px 0 #fff}
.pildora:active{transform:scale(.97);filter:brightness(.95)}
.pildora.chica{min-width:0;margin:calc(1.5*var(--u)) auto 0;padding:calc(1*var(--u)) calc(4*var(--u));font-size:clamp(12px,calc(2.8*var(--u)),22px)}
@keyframes aparecePildora{from{opacity:0;transform:translateY(calc(3*var(--u))) scale(.9)}}
.no{animation:no .35s}
@keyframes no{25%{translate:-6px 0}50%{translate:5px 0}75%{translate:-3px 0}}

/* ================= las ventanas (Aero) ================= */
.ventana{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(calc(120*var(--u)),92%);max-height:92%;display:flex;flex-direction:column;border-radius:calc(2.2*var(--u));overflow:hidden;animation:abreVentana .38s both cubic-bezier(.3,1.5,.5,1)}
@keyframes abreVentana{from{opacity:0;transform:scale(.86) translateY(calc(2*var(--u)))}}
.ventana.sale{animation:cierraVentana .3s forwards ease-in}
@keyframes cierraVentana{to{opacity:0;transform:scale(.92)}}
.ventana>.barra{display:flex;align-items:center;justify-content:space-between;padding:calc(1.2*var(--u)) calc(2*var(--u));background:linear-gradient(180deg,rgba(90,170,240,.55),rgba(40,120,210,.45) 50%,rgba(20,90,190,.5) 51%,rgba(70,150,230,.5));border-bottom:1px solid rgba(255,255,255,.6);color:#fff;font-weight:600;font-size:clamp(12px,calc(2.8*var(--u)),22px);text-shadow:0 0 6px rgba(255,255,255,.8),0 1px 1px rgba(0,40,100,.8)}
.ventana>.barra .x{width:calc(6.5*var(--u));height:calc(3.6*var(--u));border-radius:calc(.8*var(--u));background:linear-gradient(#f7b6a8,#e2553a 50%,#c2280f 51%,#e97c5c);box-shadow:0 0 0 1px #7a1a08,inset 0 1px 0 rgba(255,255,255,.8);position:relative;pointer-events:auto}
.ventana>.barra .x::before,.ventana>.barra .x::after{content:'';position:absolute;left:50%;top:50%;width:48%;height:2px;background:#fff;box-shadow:0 0 2px rgba(0,0,0,.4);transform:translate(-50%,-50%) rotate(45deg)}
.ventana>.barra .x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.ventana>.cuerpo{padding:calc(2.6*var(--u)) calc(3.4*var(--u));display:flex;flex-direction:column;align-items:stretch;gap:calc(1.4*var(--u));overflow-y:auto;touch-action:pan-y;background:linear-gradient(rgba(255,255,255,.55),rgba(236,248,255,.72))}

/* el inicio de sesión: los dos muñequitos girando */
.ventana.inicio{width:min(calc(76*var(--u)),80%)}
.inicio .cuerpo{align-items:center;padding-top:calc(4*var(--u))}
.giran{position:relative;width:calc(26*var(--u));height:calc(22*var(--u))}
.giran img{position:absolute;left:50%;top:50%;width:calc(10*var(--u));image-rendering:pixelated;animation:gira 1.4s linear infinite}
.giran img:last-child{animation-delay:-.7s}
@keyframes gira{0%{transform:translate(-50%,-50%) translateX(calc(-6*var(--u))) scale(1);z-index:2}25%{transform:translate(-50%,-50%) translateY(calc(-1*var(--u))) scale(.85);z-index:1}50%{transform:translate(-50%,-50%) translateX(calc(6*var(--u))) scale(.72);z-index:1}75%{transform:translate(-50%,-50%) translateY(calc(1*var(--u))) scale(.85);z-index:2}100%{transform:translate(-50%,-50%) translateX(calc(-6*var(--u))) scale(1);z-index:2}}
.inicio .est{font-size:clamp(14px,calc(3.6*var(--u)),28px);font-weight:600;color:#1560b8}
.inicio .sub{font-size:clamp(11px,calc(2.4*var(--u)),18px);opacity:.75}
.barrita{width:70%;height:calc(1.8*var(--u));border-radius:999px;overflow:hidden;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px rgba(20,90,170,.4)}
.barrita i{display:block;height:100%;width:30%;border-radius:999px;background:linear-gradient(#b8ffa0,#4bc92a 50%,#2f9e14 51%,#7fe35a);animation:carga 1.2s ease-in-out infinite}
@keyframes carga{0%{margin-left:-30%}100%{margin-left:100%}}

/* ================= el idioma: tres burbujas ================= */
.idioma{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(4*var(--u))}
.idioma .elegi{padding:calc(1*var(--u)) calc(3*var(--u));border-radius:999px;font-size:clamp(13px,calc(3*var(--u)),22px);font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,50,120,.7);background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6);animation:aparece .8s both}
.idioma .elegi span{opacity:.6;margin:0 .3em}
.burbujas{display:flex;gap:calc(6*var(--u));align-items:center}
.burbujaIdioma{position:relative;width:calc(30*var(--u));height:calc(30*var(--u));border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 2px rgba(0,40,100,.8),0 0 8px rgba(0,60,140,.5);
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.2) 16%,transparent 30%),radial-gradient(circle at 50% 50%,rgba(170,225,255,.12) 55%,hsla(var(--h),90%,75%,.55) 68%,rgba(255,255,255,.85) 72%,rgba(120,200,255,.3) 74%,transparent 75%);
  animation:flota 4s var(--f) ease-in-out infinite,apareceB .9s both cubic-bezier(.3,1.6,.5,1);transition:transform .25s}
.burbujaIdioma::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,120,200,.35),rgba(255,230,120,.3),rgba(120,255,180,.3),rgba(120,200,255,.35),rgba(200,140,255,.3),rgba(255,120,200,.35));-webkit-mask:radial-gradient(circle,transparent 66%,#000 69%,#000 72%,transparent 74%);mask:radial-gradient(circle,transparent 66%,#000 69%,#000 72%,transparent 74%);animation:tornasol 6s linear infinite}
.burbujaIdioma b{font-size:clamp(16px,calc(5*var(--u)),38px);font-weight:700}
.burbujaIdioma i{font-style:normal;font-size:clamp(12px,calc(2.8*var(--u)),22px);opacity:.95}
.burbujaIdioma.foco{transform:scale(1.12)}
.burbujaIdioma.revienta{animation:revienta .55s forwards cubic-bezier(.3,1.4,.6,1)}
.burbujaIdioma.se-va{animation:seVa .6s forwards ease-in}
@keyframes flota{0%,100%{translate:0 calc(-1.5*var(--u))}50%{translate:0 calc(1.5*var(--u))}}
@keyframes apareceB{from{opacity:0;scale:.3}}
@keyframes tornasol{to{transform:rotate(360deg)}}
@keyframes revienta{40%{transform:scale(1.25);opacity:1}100%{transform:scale(1.7);opacity:0;filter:blur(2px)}}
@keyframes seVa{to{translate:0 calc(-60*var(--u));opacity:0}}
@keyframes aparece{from{opacity:0}}

/* ================= el título ================= */
.titulo{position:absolute;inset:0;pointer-events:none}
.titulo>*{pointer-events:auto}
.logo{position:absolute;left:50%;top:13%;translate:-50% 0;display:flex;font-family:var(--letra);font-weight:800;font-size:clamp(46px,calc(19*var(--u)),150px);letter-spacing:.02em;line-height:1}
.logo span{display:block;background:linear-gradient(180deg,#ffffff 0%,#dff6ff 30%,#7fd6ff 50%,#1e9be8 52%,#6fe0ff 88%,#c9f6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(10,90,170,.55);filter:drop-shadow(0 calc(.6*var(--u)) calc(1*var(--u)) rgba(0,50,130,.45)) drop-shadow(0 0 calc(2*var(--u)) rgba(160,235,255,.8));animation:letra .8s calc(var(--i)*.08s) both cubic-bezier(.3,1.7,.5,1)}
@keyframes letra{from{opacity:0;transform:translateY(calc(-8*var(--u))) scale(.6)}}
.logo em{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.95) 48%,transparent 60%);-webkit-background-clip:text;background-clip:text;color:transparent;mix-blend-mode:screen;animation:barre 3.6s 1.4s ease-in-out infinite;pointer-events:none}
.logo::after{content:'BRILLO';position:absolute;left:0;top:92%;width:100%;transform:scaleY(-.45);transform-origin:top;background:linear-gradient(180deg,rgba(120,210,255,.5),transparent 70%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.8;pointer-events:none}
@keyframes barre{0%{background-position:-160% 0}60%,100%{background-position:260% 0}}
.logo em{background-size:200% 100%}
.lema{position:absolute;left:50%;top:calc(13% + clamp(46px,calc(19*var(--u)),150px) * 1.5);translate:-50% 0;font-size:clamp(12px,calc(3*var(--u)),22px);font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,50,120,.8);white-space:nowrap;animation:aparece 1s .9s both}
.menu{position:absolute;left:50%;bottom:9%;translate:-50% 0;display:flex;flex-direction:column;gap:calc(1.4*var(--u));padding:calc(2.4*var(--u)) calc(3.4*var(--u));border-radius:calc(2.6*var(--u));animation:aparece .6s .3s both}
.menu .pildora{min-width:calc(44*var(--u))}

/* ================= mundos y guiños ================= */
.iconos{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(1.6*var(--u))}
.icono{display:flex;flex-direction:column;align-items:center;gap:calc(.4*var(--u));padding:calc(1.4*var(--u));border-radius:calc(1.4*var(--u));transition:background .2s,transform .2s}
.icono img{width:calc(12*var(--u));image-rendering:pixelated;filter:drop-shadow(0 calc(.5*var(--u)) calc(.8*var(--u)) rgba(0,40,110,.35))}
.icono b{font-size:clamp(11px,calc(2.3*var(--u)),18px)}
.icono i{font-style:normal;font-size:clamp(10px,calc(2*var(--u)),16px);opacity:.8;text-align:center}
.icono.foco{background:linear-gradient(rgba(190,235,255,.9),rgba(120,200,255,.6));box-shadow:inset 0 0 0 1px rgba(40,140,220,.7);transform:scale(1.05)}
.icono.cerrada img{filter:grayscale(1) brightness(1.1) opacity(.6)}
.icono.hecho::after{content:'✔';position:absolute;margin:calc(-1*var(--u)) 0 0 calc(8*var(--u));color:#3cae1d;font-weight:800}
.emoticones{display:grid;grid-template-columns:repeat(6,1fr);gap:calc(1*var(--u))}
.emo{display:flex;flex-direction:column;align-items:center;padding:calc(.8*var(--u));border-radius:calc(1*var(--u))}
.emo img{width:calc(8*var(--u));image-rendering:pixelated}
.emo i{font-style:normal;font-size:clamp(9px,calc(1.8*var(--u)),14px);opacity:.85;text-align:center}
.emo.falta img{filter:grayscale(1) opacity(.35)}
.emo.foco{background:rgba(160,220,255,.7)}
img.emo{width:1.2em;height:1.2em;vertical-align:-.2em;image-rendering:pixelated}

/* ================= opciones y pausa ================= */
.fila{display:flex;justify-content:space-between;align-items:center;padding:calc(1.2*var(--u)) calc(2.2*var(--u));border-radius:calc(1.2*var(--u));font-size:clamp(12px,calc(2.8*var(--u)),20px);background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(90,160,220,.35);transition:background .2s}
.fila .v{display:flex;align-items:center;gap:calc(1*var(--u));font-weight:700;color:#1560b8}
.fila .v em{font-style:normal;opacity:.6}
.fila .v b{min-width:6em;text-align:center;color:var(--tinta)}
.fila.foco{background:linear-gradient(rgba(215,242,255,.95),rgba(160,220,255,.85));box-shadow:inset 0 0 0 1px rgba(40,140,220,.8),0 0 calc(2*var(--u)) rgba(120,220,255,.7)}
.barra-v{display:inline-flex;gap:2px;vertical-align:middle}
.barra-v i{width:calc(1.2*var(--u));height:calc(2.4*var(--u));border-radius:2px;background:rgba(120,170,220,.35)}
.barra-v i.on{background:linear-gradient(#b8ffa0,#3cae1d)}
.teclas{font-size:clamp(10px,calc(2.1*var(--u)),15px);text-align:center;opacity:.75}
.pausa .cuerpo{align-items:center}
.pausa .pildora{min-width:calc(46*var(--u))}
.donde{display:flex;flex-direction:column;align-items:center;margin-bottom:calc(.6*var(--u))}
.donde b{font-size:clamp(14px,calc(3.6*var(--u)),26px);color:#1560b8}
.donde span{font-size:clamp(11px,calc(2.3*var(--u)),17px);opacity:.8}

/* ================= la charla (ventana de conversación) ================= */
.chat{position:absolute;left:calc(var(--lx) + var(--lw) * .5);bottom:calc(100% - var(--ly) - var(--lh) + 2.5 * var(--u));translate:-50% 0;width:min(calc(118*var(--u)),calc(var(--lw) * .92));border-radius:calc(2*var(--u));overflow:hidden;z-index:30;pointer-events:none;opacity:0;transform:translateY(calc(6*var(--u))) scale(.96);transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1)}
.chat.ve{opacity:1;transform:none}
.chat.sale{opacity:0;transform:translateY(calc(4*var(--u)));transition:opacity .3s,transform .3s}
.chat .barra{display:flex;align-items:center;gap:calc(1.4*var(--u));padding:calc(.8*var(--u)) calc(1.6*var(--u));background:linear-gradient(180deg,rgba(120,195,250,.7),rgba(50,135,220,.6) 50%,rgba(30,105,200,.62) 51%,rgba(90,170,240,.6));color:#fff;text-shadow:0 1px 1px rgba(0,40,100,.8)}
.chat .barra img{width:calc(6.5*var(--u));image-rendering:pixelated;border-radius:calc(1*var(--u));background:linear-gradient(#fff,#d7f0ff);box-shadow:0 0 0 1px rgba(255,255,255,.9),0 0 0 2px rgba(20,90,170,.5)}
.chat .barra span{display:flex;flex-direction:column;flex:1;line-height:1.15}
.chat .barra b{font-size:clamp(12px,calc(2.7*var(--u)),20px)}
.chat .barra small{font-size:clamp(9px,calc(1.9*var(--u)),14px);opacity:.9}
.chat .barra .x{width:calc(4.6*var(--u));height:calc(2.8*var(--u));border-radius:calc(.6*var(--u));background:linear-gradient(#f7b6a8,#e2553a 50%,#c2280f 51%,#e97c5c);box-shadow:0 0 0 1px #7a1a08}
.chat .lineas{display:flex;flex-direction:column;gap:calc(1*var(--u));padding:calc(1.6*var(--u)) calc(2*var(--u)) calc(.6*var(--u));background:linear-gradient(rgba(255,255,255,.8),rgba(240,250,255,.86))}
.linea{display:flex;gap:calc(1.2*var(--u));align-items:flex-start;animation:entraLinea .3s both cubic-bezier(.3,1.5,.5,1)}
@keyframes entraLinea{from{opacity:0;transform:translateY(calc(1.5*var(--u)))}}
.linea img{width:calc(5*var(--u));image-rendering:pixelated;flex:none}
.linea b{display:block;font-size:clamp(10px,calc(2.1*var(--u)),15px);color:#6a7c94;font-weight:600}
.linea p{font-size:clamp(13px,calc(3*var(--u)),22px);line-height:1.3;color:var(--tinta);min-height:1.3em}
.linea.mia b{color:#1a79d6}
.linea.plana p{font-family:'Courier New',monospace;letter-spacing:.06em;color:#4b5058}
.linea.plana img{filter:grayscale(1)}
.linea:not(:last-child){opacity:.55}
.chat .escribe{min-height:calc(2.6*var(--u));padding:0 calc(2*var(--u)) calc(.6*var(--u));font-size:clamp(10px,calc(2*var(--u)),15px);font-style:italic;color:#6a7c94;background:rgba(240,250,255,.86)}
.chat .toca{position:absolute;right:calc(2*var(--u));bottom:calc(.6*var(--u));font-size:clamp(9px,calc(1.8*var(--u)),14px);color:#1a79d6;opacity:.8;animation:late 1.2s ease-in-out infinite}
@keyframes late{50%{opacity:.35}}

/* ================= los avisos (abajo a la derecha) ================= */
.avisos{position:absolute;right:calc(100% - var(--lx) - var(--lw) + 2.5*var(--u));bottom:calc(100% - var(--ly) - var(--lh) + 2.5*var(--u));display:flex;flex-direction:column;gap:calc(1*var(--u));align-items:flex-end;z-index:35}
#ui.conDedos .avisos{bottom:calc(100% - var(--ly) - var(--lh)*.64)}
.aviso{display:flex;align-items:center;gap:calc(1.4*var(--u));padding:calc(1.2*var(--u)) calc(2.4*var(--u)) calc(1.2*var(--u)) calc(1.4*var(--u));border-radius:calc(1.6*var(--u));font-size:clamp(11px,calc(2.5*var(--u)),18px);transform:translateY(calc(8*var(--u)));opacity:0;transition:transform .45s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.aviso.ve{transform:none;opacity:1}
.aviso.sale{opacity:0;transform:translateX(calc(10*var(--u)))}
.aviso img{width:calc(6*var(--u));image-rendering:pixelated}
.aviso b{display:block;font-size:.8em;color:#1a79d6}
.aviso.verde{box-shadow:0 0 0 1px rgba(40,150,30,.5),0 0 calc(3*var(--u)) rgba(150,255,110,.6),inset 0 1px 0 #fff}
.aviso.dorado{box-shadow:0 0 0 1px rgba(200,150,0,.5),0 0 calc(3*var(--u)) rgba(255,230,120,.8),inset 0 1px 0 #fff}

/* ================= el HUD ================= */
.hud{position:absolute;left:calc(var(--lx) + 2.5*var(--u));top:calc(var(--ly) + 2.5*var(--u));display:flex;gap:calc(1.2*var(--u));z-index:20;opacity:0;transform:translateY(calc(-3*var(--u)));transition:opacity .4s,transform .4s}

.hud img{height:calc(4.4*var(--u));image-rendering:pixelated}
.hud .late{animation:latido .4s}
@keyframes latido{40%{transform:scale(1.18)}}

/* ================= el cartel del mundo ================= */
.cartelMundo{position:absolute;left:calc(var(--lx) + var(--lw)/2);top:calc(var(--ly) + 9*var(--u));translate:-50% 0;padding:calc(1.6*var(--u)) calc(7*var(--u)) calc(2*var(--u));border-radius:calc(2.6*var(--u));text-align:center;z-index:25;animation:bajaCartel .7s both cubic-bezier(.3,1.5,.5,1)}
.cartelMundo small{display:block;font-size:clamp(11px,calc(2.4*var(--u)),18px);color:#1a79d6;font-weight:600}
.cartelMundo b{display:block;font-size:clamp(20px,calc(6*var(--u)),46px);font-weight:800;background:linear-gradient(#ffffff,#c4f1ff 44%,#1d8be0 52%,#0f63c2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(4,50,125,.85);filter:drop-shadow(0 0 3px rgba(255,255,255,.9)) drop-shadow(0 1px 2px rgba(0,40,110,.6))}
.cartelMundo.sale{animation:subeCartel .6s forwards ease-in}
@keyframes bajaCartel{from{transform:translateY(calc(-20*var(--u)));opacity:0}}
@keyframes subeCartel{to{transform:translateY(calc(-20*var(--u)));opacity:0}}

/* ================= la narración, el mensaje sin conexión y los créditos ================= */
.narra,.creditos{position:absolute;left:var(--lx);top:var(--ly);width:var(--lw);height:var(--lh);display:flex;align-items:center;justify-content:center;z-index:32;pointer-events:auto;background:radial-gradient(ellipse,rgba(0,40,110,.12),rgba(0,30,90,.5));opacity:0;transition:opacity .5s}
.narra.ve,.creditos.ve{opacity:1}
.narra.sale,.creditos.sale{opacity:0}
.narra .hoja{width:min(calc(120*var(--u)),88%);padding:calc(4*var(--u)) calc(6*var(--u));border-radius:calc(3*var(--u));display:flex;flex-direction:column;gap:calc(1.6*var(--u))}
.narra p{font-size:clamp(14px,calc(3.6*var(--u)),26px);line-height:1.45;color:var(--tinta);opacity:0;transform:translateY(calc(1.5*var(--u)));transition:opacity .6s,transform .6s}
.narra p.ve{opacity:1;transform:none}
.narra small{align-self:flex-end;font-size:clamp(10px,calc(2.1*var(--u)),15px);color:#1a79d6;opacity:0;transition:opacity .5s}
.narra small.ve{opacity:.85}
.mensaje{position:absolute;left:calc(var(--lx) + var(--lw)/2);top:calc(var(--ly) + var(--lh)*.3);translate:-50% 0;width:min(calc(100*var(--u)),86%);border-radius:calc(2*var(--u));overflow:hidden;z-index:31;opacity:0;transform:scale(.9);transition:opacity .4s,transform .5s cubic-bezier(.3,1.5,.5,1)}
.mensaje.ve{opacity:1;transform:none}
.mensaje .barra{display:flex;align-items:center;gap:calc(1.2*var(--u));padding:calc(.8*var(--u)) calc(1.6*var(--u));background:linear-gradient(180deg,rgba(150,230,140,.75),rgba(70,180,60,.6) 50%,rgba(40,150,30,.62) 51%,rgba(110,210,90,.6));color:#fff;font-size:clamp(11px,calc(2.4*var(--u)),18px);text-shadow:0 1px 1px rgba(10,60,0,.8)}
.mensaje .barra img{width:calc(5*var(--u));image-rendering:pixelated;filter:grayscale(.8)}
.mensaje p{padding:calc(2*var(--u)) calc(3*var(--u));font-size:clamp(13px,calc(3*var(--u)),22px);line-height:1.4;font-style:italic;background:rgba(245,255,240,.85)}
.creditos .rollo{padding:calc(4*var(--u)) calc(8*var(--u));border-radius:calc(3*var(--u));text-align:center;display:flex;flex-direction:column;gap:calc(1.4*var(--u))}

.creditos .todos img:nth-child(2n){animation-delay:-1.2s}

/* ================= la ola de burbujas (transición) ================= */
.ola{position:absolute;left:var(--lx);top:var(--ly);width:var(--lw);height:var(--lh);overflow:hidden;pointer-events:none;z-index:45}
.ola i{position:absolute;left:var(--x);bottom:-40%;width:calc(var(--t)*var(--u));aspect-ratio:1;border-radius:50%;translate:-50% 0;background:radial-gradient(circle at 32% 28%,#fff 0 8%,rgba(255,255,255,.3) 18%,transparent 30%),radial-gradient(circle,rgba(190,235,255,.85) 55%,rgba(255,255,255,.95) 70%,rgba(120,200,255,.6) 73%,transparent 74%);opacity:0}
.ola.tapa i{animation:olaSube .7s var(--d) forwards cubic-bezier(.4,0,.6,1)}
.ola.tapa{background:transparent}
.ola.tapa::after{content:'';position:absolute;inset:0;background:linear-gradient(#bfe8ff,#eaf8ff);opacity:0;animation:olaVelo .7s .25s forwards}
.ola.destapa i{animation:olaSigue .7s var(--d) forwards ease-in}
.ola.destapa::after{content:'';position:absolute;inset:0;background:linear-gradient(#bfe8ff,#eaf8ff);opacity:1;animation:olaVeloSale .6s forwards}
@keyframes olaSube{0%{bottom:-40%;opacity:1;scale:.6}100%{bottom:35%;opacity:1;scale:3.2}}
@keyframes olaSigue{0%{bottom:35%;opacity:1;scale:3.2}100%{bottom:140%;opacity:0;scale:3.6}}
@keyframes olaVelo{to{opacity:1}}
@keyframes olaVeloSale{to{opacity:0}}

.tactil.ve>*{pointer-events:auto}
.tactil>.oculto{display:none}
.tactil.editando>.oculto{display:block}
.tactil>.zonaPal,.tactil>.bSalto,.tactil>.bZumbido,.tactil>.bPausa{opacity:var(--alfa,.85);transition:opacity .15s}
.tactil>.on{opacity:max(var(--alfa,.85),.95)}
.zonaPal{position:absolute;left:0;top:0}
.zonaPal .aro{position:absolute;left:0;top:0;border-radius:50%;opacity:.85;
  background:radial-gradient(circle,rgba(20,70,140,.35) 0 48%,transparent 49%),radial-gradient(circle,rgba(255,255,255,.1) 0 70%,rgba(255,255,255,.6) 88%,rgba(140,210,255,.5) 100%);
  box-shadow:0 0 0 2px rgba(255,255,255,.85),inset 0 0 0 1px rgba(20,90,170,.4),0 4px 10px rgba(0,40,110,.3);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.zonaPal.on .aro{opacity:1}
.zonaPal .bola{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff 0 12%,rgba(255,255,255,.6) 22%,transparent 40%),linear-gradient(180deg,var(--aqua1),var(--aqua2) 49%,var(--aqua3) 51%,var(--aqua4));box-shadow:0 0 0 1px #0a6fb5,0 3px 8px rgba(0,40,110,.4);transition:scale .12s}
.zonaPal.on .bola{scale:1.08}
.aro .fl{position:absolute;width:11%;height:11%;background:rgba(255,255,255,.85);transition:background .1s,scale .1s}
.aro .fl.i{left:5%;top:44.5%;clip-path:polygon(100% 0,100% 100%,0 50%)}
.aro .fl.d{right:5%;top:44.5%;clip-path:polygon(0 0,0 100%,100% 50%)}
.aro .fl.a{top:5%;left:44.5%;clip-path:polygon(0 100%,100% 100%,50% 0)}
.aro .fl.b{bottom:5%;left:44.5%;clip-path:polygon(0 0,100% 0,50% 100%)}
.aro .brazo{display:none}

.aro .brazo.v{left:33%;right:33%;top:0;bottom:0}
.aro .brazo.h{top:33%;bottom:33%;left:0;right:0}

.tactil.cruz .aro .fl{width:17%;height:17%;background:#fff}

.tactil.cruz .aro .fl.a,.tactil.cruz .aro .fl.b{left:41.5%}

.bSalto,.bZumbido,.bPausa{position:absolute;left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.95) 0 10%,rgba(255,255,255,.3) 20%,transparent 34%),radial-gradient(circle,rgba(190,235,255,.35) 55%,rgba(255,255,255,.85) 70%,rgba(120,200,255,.45) 74%,rgba(80,170,240,.2) 100%);
  box-shadow:0 0 0 2px rgba(255,255,255,.85),0 4px 10px rgba(0,40,110,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.bZumbido{background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.95) 0 10%,rgba(255,255,255,.3) 20%,transparent 34%),linear-gradient(180deg,var(--verde1),var(--verde2) 49%,var(--verde3) 51%,var(--verde4));box-shadow:0 0 0 1px #2a8a14,0 4px 10px rgba(0,60,20,.3)}
.bSalto svg,.bZumbido svg{width:56%;height:56%}
.bSalto.on,.bZumbido.on{scale:.9;filter:brightness(1.15)}
.bPausa{background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(190,225,255,.65) 50%,rgba(140,195,245,.65) 51%,rgba(200,235,255,.7));gap:13%}
.bPausa i{width:13%;height:39%;background:#1560b8;border-radius:2px}
.tactil.editando{z-index:42;pointer-events:auto;opacity:1}
.tactil.editando>.zonaPal,.tactil.editando>[data-control]{opacity:max(var(--alfa,.85),.5)}
.tactil.editando .zonaPal{outline:2px dashed rgba(255,255,255,.45);outline-offset:-3px;background:rgba(255,255,255,.06)}
.tactil.editando .aro{opacity:1}
.tactil.editando .bola{pointer-events:none}
.tactil.editando [data-control]{z-index:2;cursor:grab;outline:2px dashed rgba(255,255,255,.9);outline-offset:6px}
.tactil.editando [data-control].elegido{outline:3px solid #8fec5e;outline-offset:7px;filter:drop-shadow(0 0 10px rgba(150,255,110,.8))}
.tactil.editando [data-control]::after{content:attr(data-nombre);position:absolute;left:50%;top:100%;translate:-50% 12px;padding:2px 10px;font:600 11px/1.4 var(--letra);color:var(--tinta);border-radius:999px;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(20,90,170,.4);white-space:nowrap;pointer-events:none}

.acomoda{position:absolute;left:50%;top:calc(3*var(--u));translate:-50% 0;width:min(calc(150*var(--u)),calc(100% - 30*var(--u)));padding:calc(1.4*var(--u)) calc(2.4*var(--u));display:flex;flex-direction:column;align-items:center;gap:calc(1*var(--u));border-radius:calc(2*var(--u));z-index:1;animation:abreVentana .38s both cubic-bezier(.3,1.5,.5,1);transition:opacity .2s}

 para ir m\xE1s alto)"],nadar:["En el agua, salt\xE1 para nadar para arriba","En el agua, toc\xE1 saltar para nadar para arriba"],zumbido:["X o E para mandar un Zumbido","Toc\xE1 el Zumbido para sacudir lo gris"],burbuja:["En el aire, salt\xE1 otra vez: sopl\xE1s una burbuja (manten\xE9 para flotar)","En el aire, toc\xE1 saltar otra vez y manten\xE9 para flotar"],bajar:["Abajo + salto para bajar del vidrio","Joystick abajo + saltar para bajar del vidrio"],planito:["Saltales encima o mandales un Zumbido","Saltales encima o mandales un Zumbido"],hongo:["Los hongos te tiran para arriba","Los hongos te tiran para arriba"],corriente:["El aire sube en las columnas: dejate llevar","El aire sube en las columnas: dejate llevar"],burbujota:["Metete en una burbuja grande para subir; salt\xE1 para salir","Metete en una burbuja grande para subir; toc\xE1 saltar para salir"]},narra:{colina:["En la Red todo brillaba: el pasto, el agua, hasta las ventanas.","Nick y Mora viv\xEDan en la Colina Serena, y siempre estaban conectados.","Hasta la ma\xF1ana de la Actualizaci\xF3n."],arrecife:["Debajo de la Colina, el agua de la Red baja hasta el Arrecife de Cristal.","Ah\xED nadan los peces que cuidan los fondos de pantalla."],ciudad:["M\xE1s all\xE1 del agua se levanta Ciudad Vidrio: torres transparentes, techos con pasto y trenes que no hacen ruido.","Pero sus ventanas se est\xE1n volviendo opacas, una por una."],cielo:["Arriba de la ciudad el cielo est\xE1 lleno de nubes, y de burbujas del tama\xF1o de una casa.","Dicen que desde ah\xED se ve el borde de la Red."],aurora:["Al final del cielo empieza la noche, y en la noche vive la Aurora: la luz que conecta a todos.","Est\xE1 casi apagada."],plano:["El Plano no tiene cielo ni piso: tiene gris.","Cada paso de Nick deja un poco de color."]},charlas:{inicio:[["mora","\xA1Nick! \xBFViste el cielo hoy? Est\xE1 m\xE1s brillante que nunca :)"],["nick","Como siempre. \xBFSalimos a juntar gotitas?"],["mora","Dale. El que junte m\xE1s elige la m\xFAsica ;)"]],actualizacion:[["plano","INSTALANDO ACTUALIZACI\xD3N."],["plano","Eliminando brillo. Eliminando sombras. Eliminando burbujas."],["mora","\xA1Nick! \xA1No me puedo mover!"],["plano","USUARIA MORA: SIMPLIFICADA. VIENE CONMIGO AL PLANO."],["nick","\xA1Mora! \xA1MORAAA!"]],solo:[["nick","Se la llev\xF3... Tengo que ir a buscarla."]],tito:[["tito","\xA1Nick! Vi todo desde la huerta. Ese cuadrado gris se llev\xF3 a Mora."],["nick","Voy a buscarla. \xBFAd\xF3nde se la llev\xF3?"],["tito","Al Plano: el lugar donde nada brilla. Para llegar vas a necesitar los cinco Orbes de Aero."],["tito","Uno est\xE1 en la cima de esta colina. Y te ense\xF1o algo: el Zumbido."],["tito","Si algo se puso gris y chato, sacudilo bien fuerte. \xA1Vas a ver c\xF3mo vuelve el color!"]],tito2:[["tito","Los planitos no son malos, eh. Est\xE1n tristes porque les sacaron el color."]],planito:[["nick","Eso es un planito... Si le salto encima, o le mando un Zumbido, capaz que le vuelve el brillo."]],mora1:[["mora","Nick, si le\xE9s esto... me guard\xE9 un poquito de brillo adentro. No lo dejes apagar."],["nick","Aguant\xE1, Mora. Voy a buscarte."]],dorado:[["dorado","\xA1Blub! Un mu\xF1equito seco, qu\xE9 raro. \xBFVen\xEDs por el Orbe de la Perla?"],["nick","S\xED. Y por mi amiga: se la llev\xF3 el Plano."],["dorado","El Plano apag\xF3 la mitad del arrecife. Las burbujas son lo \xFAnico que todav\xEDa brilla del todo."],["dorado","Tom\xE1 una de las m\xEDas. Soplala en el aire y vas a flotar un ratito: \xA1es la Burbuja!"]],dorado2:[["dorado","Las burbujas grandes suben solas. Metete adentro y dejate llevar. \xA1Blub!"]],mora2:[["mora","Ac\xE1 hace fr\xEDo, Nick. Todo es gris y derecho. Me acuerdo del agua del arrecife y se me pasa un poco."]],lila:[["lila","\xA1Nick! Soy Lila, la de Radio Vidrio. El Plano me borr\xF3 todas las canciones... ahora solo suena un pitido."],["nick","Le voy a devolver el brillo a todo. Te lo prometo."],["lila","Entonces sub\xED por los ascensores de vidrio. El Orbe del Prisma est\xE1 arriba de la torre m\xE1s alta."]],lila2:[["lila","Cuando vuelva la m\xFAsica, la primera canci\xF3n es para ustedes dos ;)"]],mora3:[["mora","\xBFTe acord\xE1s cuando nos pas\xE1bamos canciones toda la noche? Ac\xE1 no hay canciones. Tarareo la nuestra para no olvidarla."]],sol:[["sol","\xA1Buenas! Sol, piloto de burbujas. En las columnas el viento sopla para arriba: dejate llevar."],["nick","\xBFY el Orbe del Arco\xEDris?"],["sol","En la nube m\xE1s alta. El Plano ya le sac\xF3 la mitad de los colores al arco\xEDris... apurate."]],sol2:[["sol","Si te ca\xE9s, no pasa nada: las nubes te reconectan. Bueno, casi siempre."]],mora4:[["mora","Hoy el Plano me pregunt\xF3 para qu\xE9 sirve el brillo. No supe qu\xE9 contestarle. \xBFVos sab\xE9s?"]],vio:[["vio","Shh... mir\xE1 para arriba. La Aurora se mueve con la m\xFAsica, y cuando brilla se puede caminar sobre ella."],["nick","\xBFCaminar sobre la luz?"],["vio","Esta noche s\xED. Con los cinco orbes, la Aurora te va a abrir el camino al Plano."]],vio2:[["vio","Cada estrella de ac\xE1 es alguien que se desconect\xF3. Van a volver, ya vas a ver."]],mora5:[["mora","Nick... te escucho. \xA1Te escucho cerca!"],["nick","\xA1Ya voy, Mora!"]],plano:[["plano","USUARIO NICK. \xBFPOR QU\xC9 INSIST\xCDS CON EL BRILLO?"],["nick","Porque sin brillo no se ve qui\xE9n est\xE1 triste y qui\xE9n est\xE1 contento."],["plano","EL BRILLO ES INNECESARIO. OCUPA ESPACIO. DISTRAE."],["nick","Puede ser. Pero a Mora le gusta. Y a m\xED tambi\xE9n."],["nick","\xA1ZUMBIDO!"]],final:[["plano","...Esto se siente... \xBFtibio?"],["mora","\xA1Nick!"],["mora","Sab\xEDa que ibas a venir :)"],["nick","Siempre."],["plano","Tal vez... se puede ser simple y brillar un poquito."]]},fin:["La Red volvi\xF3 a brillar. Un poco m\xE1s simple, pero brillando.","Y en la lista de contactos, al lado de cada nombre, volvi\xF3 la lucecita verde."],creditos:["BRILLO","Una aventura Frutiger Aero","Idea, dibujo, m\xFAsica y c\xF3digo: hechos a mano, p\xEDxel por p\xEDxel","Nick, Mora, Tito, Dorado, Lila, Sol, Vio y el Plano","Gracias por jugar"],emoticones:{sonrisa:"Sonrisa",guino:"Gui\xF1o",risa:"Risa",corazon:"Coraz\xF3n",nota:"Nota musical",estrella:"Estrella",sol:"Sol",luna:"Luna",flor:"Flor",arcoiris:"Arco\xEDris",burbuja:"Burbuja",pez:"Pez",nube:"Nube",regalo:"Regalo",cafe:"Caf\xE9",gato:"Gato",perro:"Perro",abrazo:"Abrazo"}},en:{ui:{elegi:"Choose your language",saludo:"Hello!",lema:"A Frutiger Aero adventure",iniciando:"Signing in\u2026",conectando:"Connecting to the Net\u2026",empezar:"Sign in",seguir:"Continue",nuevo:"New game",nuevoSeguro:"Start over? Tap again",mundos:"Worlds",guinos:"Winks",opciones:"Options",creditos:"Credits",volver:"Back",cerrar:"Close",pausa:"Paused",continuar:"Continue",reintentar:"Back to the save point",salir:"Sign out",idioma:"Language",musica:"Music",efectos:"Sound effects",calidad:"Quality",alta:"High",baja:"Low",pantalla:"Fullscreen",giro:"Phone rotation",auto:"Automatic",normal:"Normal",reves:"Flipped",si:"On",no:"Off",tactiles:"Touch controls",acomodar:"Arrange",acomodaTit:"Arrange your controls",acomodaAyuda:"Drag each one \xB7 tap it to change its size \xB7 or pinch it",tamano:"Size",opacidad:"Opacity",palanca:"Joystick",flotante:"Floating",fija:"Fixed",cruz:"D-pad",vibrar:"Vibration",espejar:"Mirror (left-handed)",restablecer:"Reset",listo:"Done",cCaminar:"Walk",cSaltar:"Jump",cZumbido:"Nudge",cPausa:"Pause",dice:"{0} says:",escribiendo:"{0} is typing\u2026",tocar:"Tap to continue",saltear:"Skip",sesion:"Game saved",guino:"You found a wink!",guinosDe:"{0} of {1} winks",gotas:"Drops",aprendio:"You learned: {0}",hZumbido:"Nudge",hBurbuja:"Bubble",entra:"{0} has signed in",sale:"{0} has gone offline",mensaje:"Offline message",orbe:"The {0} Orb!",mundo:"World {0}",cerrado:"Not connected yet",falta:"This wink is still lost somewhere",fin:"The end",gracias:"Thank you for playing",controles:"Arrows: walk \xB7 Space: jump \xB7 X: nudge \xB7 Esc: pause",estado:"\u266A Li big as houses.","They say you can see the edge of the Net from up there."],aurora:["Where the sky ends, night begins, and in the night lives the Aurora: the light that connects everyone.","It has almost gone out."],plano:["The Flatland has no sky and no ground: it has gray.","Every step Nick takes leaves a little color behind."]},charlas:{inicio:[["mora","Nick! Did you see the sky today? It is shinier than ever :)"],["nick","As always. Shall we go collect drops?"],["mora","Sure. Whoever gets more picks the music ;)"]],actualizacion:[["plano","INSTALLING UPDATE."],["plano","Removing shine. Removing shadows. Removing bubbles."],["mora","Nick! I can't move!"],["plano","USER MORA: SIMPLIFIED. SHE COMES WITH ME TO THE FLATLAND."],["nick","Mora! MORAAA!"]],solo:[["nick","It took her... I have to go and find her."]],tito:[["tito","Nick! I saw everything from the garden. That gray square took Mora."],["nick","I'm going after her. Where did it take her?"],["tito","To the Flatland: the place where nothing shines. To get there you will need the five Aero Orbs."],["tito","One of them is at the top of this hill. And let me teach you something: the Nudge."],["tito","If something has gone gray and flat, give it a good shake. You will see the color come back!"]],tito2:[["tito","The flatties aren't bad, you know. They're sad because someone took their color."]],planito:[["nick","That's a flatty... If I jump on it, or send it a Nudge, maybe its shine comes back."]],mora1:[["mora","Nick, if you're reading this... I kept a little shine inside me. Don't let it go out."],["nick","Hold on, Mora. I'm coming for you."]],dorado:[["dorado","Blub! A dry little buddy, how odd. Are you here for the Pearl Orb?"],["nick","Yes. And for my friend: the Flatland took her."],["dorado","The Flatland dimmed half the reef. Bubbles are the only thing that still shines all the way."],["dorado","Have one of mine. Blow it in the air and you'll float for a while: it's the Bubble!"]],dorado2:[["dorado","Big bubbles rise on their own. Get inside and let them carry you. Blub!"]],mora2:[["mora","It's cold here, Nick. Everything is gray and straight. I remember the reef water and it helps a little."]],lila:[["lila","Nick! I'm Lila, from Glass Radio. The Flatland erased all my songs... now there's only a beep."],["nick","I'll bring the shine back to everything. I promise."],["lila","Then ride the glass elevators up. The Prism Orb is on top of the tallest tower."]],lila2:[["lila","When the music comes back, the first song is for you two ;)"]],mora3:[["mora","Remember when we sent each other songs all night? There are no songs here. I hum ours so I don't forget it."]],sol:[["sol","Hi there! Sol, bubble pilot. In the columns the wind blows upward: let it carry you."],["nick","And the Rainbow Orb?"],["sol","On the highest cloud. The Flatland already took half the rainbow's colors... hurry."]],sol2:[["sol","If you fall, no worries: the clouds reconnect you. Well, almost always."]],mora4:[["mora","Today the Flatland asked me what shine is for. I didn't know what to say. Do you?"]],vio:[["vio","Shh... look up. The Aurora moves with the music, and when it glows you can walk on it."],["nick","Walk on light?"],["vio","Tonight you can. With the five orbs, the Aurora will open the way to the Flatland."]],vio2:[["vio","Every star here is someone who went offline. They'll come back, you'll see."]],mora5:[["mora","Nick... I can hear you. I can hear you close!"],["nick","I'm coming, Mora!"]],plano:[["plano","USER NICK. WHY DO YOU INSIST ON SHINE?"],["nick","Because without shine you can't tell who's sad and who's happy."],["plano","SHINE IS UNNECESSARY. IT TAKES UP SPACE. IT DISTRACTS."],["nick","Maybe. But Mora likes it. And so do I."],["nick","NUDGE!"]],final:[["plano","...This feels... warm?"],["mora","Nick!"],["mora","I knew you would come :)"],["nick","Always."],["plano","Maybe... one can be simple and shine a little."]]},fin:["The Net shone again. A little simpler, but shining.","And in the contact list, next to every name, the little green light came back."],creditos:["BRILLO","A Frutiger Aero adventure","Idea, art, music and code: made by hand, pixel by pixel","Nick, Mora, Tito, Goldie, Lila, Sol, Vio and Flat","Thank you for playing"],emoticones:{sonrisa:"Smile",guino:"Wink",risa:"Laugh",corazon:"Heart",nota:"Music note",estrella:"Star",sol:"Sun",luna:"Moon",flor:"Flower",arcoiris:"Rainbow",burbuja:"Bubble",pez:"Fish",nube:"Cloud",regalo:"Gift",cafe:"Coffee",gato:"Cat",perro:"Dog",abrazo:"Hug"}},pt:{ui:{elegi:"Escolha seu idioma",saludo:"Ol\xE1!",lema:"Uma aventura Frutiger Aero",iniciando:"Entrando\u2026",conectando:"Conectando \xE0 Rede\u2026",empezar:"Entrar",seguir:"Continuar",nuevo:"Novo jogo",nuevoSeguro:"Come\xE7ar do zero? Toque de novo",mundos:"Mundos",guinos:"Piscadas",opciones:"Op\xE7\xF5es",creditos:"Cr\xE9ditos",volver:"Voltar",cerrar:"Fechar",pausa:"Pausado",continuar:"Continuar",reintentar:"Voltar ao ponto salvo",salir:"Sair",idioma:"Idioma",musica:"M\xFAsica",efectos:"Efeitos",calidad:"Qualidade",alta:"Alta",baja:"Baixa",pantalla:"Tela cheia",giro:"Giro do celular",auto:"Autom\xE1tico",normal:"Normal",reves:"Invertido",si:"Sim",no:"N\xE3o",tactiles:"Controles de toque",acomodar:"Ajustar",acomodaTit:"Ajuste seus controles",acomodaAyuda:"Arraste cada um \xB7 toque para mudar o tamanho \xB7 ou fa\xE7a pin\xE7a",tamano:"Tamanho",opacidad:"Opacidade",palanca:"Joystick",flotante:"Flutuante",fija:"Fixo",cruz:"Cruz",vibrar:"Vibrar",espejar:"Espelhar (canhoto)",restablecer:"Restaurar",listo:"Pronto",cCaminar:"Andar",cSaltar:"Pular",cZumbido:"Chamar aten\xE7\xE3o",cPausa:"Pausa",dice:"{0} diz:",escribiendo:"{0} est\xE1 digitando\u2026",tocar:"Toque para continuar",saltear:"Pular",sesion:"Jogo salvo",guino:"Voc\xEA achou uma piscada!",guinosDe:"{0} de {1} piscadas",gotas:"Gotinhas",aprendio:"Voc\xEA aprendeu: {0}",hZumbido:"Chamar aten\xE7\xE3o",hBurbuja:"Bolha",entra:"{0} entrou",sale:"{0} ficou offline",mensaje:"Mensagem offline",orbe:"O Orbe {0}!",mundo:"Mundo {0}",cerrado:"Ainda sem conex\xE3o",falta:"Esta piscada ainda est\xE1 perdida",fin:"Fim",gracias:"Obrigado por jogar",controles:"Setas: andar \xB7 Espa\xE7o: pular \xB7 X: chamar aten\xE7\xE3o \xB7 Esc: pausa",estado:"\u266A Ouvindo: {0}"},mundos:{colina:"A Colina Serena",arrecife:"O Recife de Cristal",ciudad:"Cidade de Vidro",cielo:"O C\xE9u de Bolhas",aurora:"A Noite Aurora",plano:"O Plano"},orbes:{colina:"da Folha",arrecife:"da P\xE9rola",ciudad:"do Prisma",cielo:"do Arco-\xEDris",aurora:"da Estrela"},nombres:{nick:"Nick",mora:"Mora",tito:"Tito",dorado:"Dourado",lila:"Lila",sol:"Sol",vio:"Vio",plano:"PLANO"},nicks:{nick:"Nick \u266A sempre online",mora:"~*Mora*~ (offline)",tito:"Tito [na horta]",dorado:"Dourado >\xB0))))<",lila:"Lila \u266B R\xE1dio Vidro",sol:"Sol \u2708 piloto",vio:"Vio \u263E olhando o c\xE9u",plano:"PLANO"},ayudas:{mover:["Setas ou A e D para andar","Mova com o joystick"],saltar:["Espa\xE7o ou Z para pular (segure para ir mais alto)","Toque na bolha para pular (segure para ir mais alto)"],nadar:["Na \xE1gua, pule para nadar para cima","Na \xE1gua, toque em pular para nadar para cima"],zumbido:["X ou E para chamar aten\xE7\xE3o","Toque em Chamar aten\xE7\xE3o para sacudir o cinza"],burbuja:["No ar, pule de novo: voc\xEA sopra uma bolha (segure para flutuar)","No ar, toque em pular de novo e segure para flutuar"],bajar:["Baixo + pular para descer do vidro","Joystick para baixo + pular para descer do vidro"],planito:["Pule em cima deles ou chame a aten\xE7\xE3o deles","Pule em cima deles ou chame a aten\xE7\xE3o deles"],hongo:["Os cogumelos jogam voc\xEA para cima","Os cogumelos jogam voc\xEA para cima"],corriente:["O ar sobe nas colunas: deixe-se levar","O ar sobe nas colunas: deixe-se levar"],burbujota:["Entre numa bolha grande para subir; pule para sair","Entre numa bolha grande para subir; toque em pular para sair"]},narra:{colina:["Na Rede tudo brilhava: a grama, a \xE1gua, at\xE9 as janelas.","Nick e Mora moravam na Colina Serena, e estavam sempre online.","At\xE9 a manh\xE3 da Atualiza\xE7\xE3o."],arrecife:["Debaixo da Colina, a \xE1gua da Rede desce at\xE9 o Recife de Cristal.","Ali nadam os peixes que cuidam dos pap\xE9is de parede."],ciudad:["Depois da \xE1gua se ergue a Cidade de Vidro: torres transparentes, telhados com grama e trens silenciosos.","Mas suas janelas est\xE3o ficando opacas, uma por uma."],cielo:["Acima da cidade o c\xE9u est\xE1 cheio de nuvens, e de bolhas do tamanho de uma casa.","Dizem que l\xE1 de cima d\xE1 para ver a borda da Rede."],aurora:["Onde o c\xE9u termina come\xE7a a noite, e na noite vive a Aurora: a luz que conecta todos.","Ela est\xE1 quase apagada."],plano:["O Plano n\xE3o tem c\xE9u nem ch\xE3o: tem cinza.","Cada passo de Nick deixa um pouco de cor."]},charlas:{inicio:[["mora","Nick! Viu o c\xE9u hoje? Est\xE1 mais brilhante do que nunca :)"],["nick","Como sempre. Vamos juntar gotinhas?"],["mora","Bora. Quem juntar mais escolhe a m\xFAsica ;)"]],actualizacion:[["plano","INSTALANDO ATUALIZA\xC7\xC3O."],["plano","Removendo brilho. Removendo sombras. Removendo bolhas."],["mora","Nick! N\xE3o consigo me mexer!"],["plano","USU\xC1RIA MORA: SIMPLIFICADA. VEM COMIGO PARA O PLANO."],["nick","Mora! MORAAA!"]],solo:[["nick","Ele a levou... Tenho que ir busc\xE1-la."]],tito:[["tito","Nick! Eu vi tudo da horta. Aquele quadrado cinza levou a Mora."],["nick","Vou busc\xE1-la. Para onde ele a levou?"],["tito","Para o Plano: o lugar onde nada brilha. Para chegar l\xE1 voc\xEA vai precisar dos cinco Orbes de Aero."],["tito","Um deles est\xE1 no alto desta colina. E vou te ensinar uma coisa: Chamar aten\xE7\xE3o."],["tito","Se algo ficou cinza e achatado, sacuda bem forte. Voc\xEA vai ver a cor voltar!"]],tito2:[["tito","Os achatadinhos n\xE3o s\xE3o maus, viu? Est\xE3o tristes porque tiraram a cor deles."]],planito:[["nick","Aquilo \xE9 um achatadinho... Se eu pular em cima dele, ou chamar a aten\xE7\xE3o dele, talvez o brilho volte."]],mora1:[["mora","Nick, se voc\xEA estiver lendo isto... guardei um pouquinho de brilho aqui dentro. N\xE3o deixe ele apagar."],["nick","Aguenta, Mora. Estou indo te buscar."]],dorado:[["dorado","Blub! Um bonequinho seco, que estranho. Veio pelo Orbe da P\xE9rola?"],["nick","Sim. E pela minha amiga: o Plano a levou."],["dorado","O Plano apagou metade do recife. As bolhas s\xE3o a \xFAnica coisa que ainda brilha por inteiro."],["dorado","Leve uma das minhas. Sopre no ar e voc\xEA vai flutuar um pouquinho: \xE9 a Bolha!"]],dorado2:[["dorado","As bolhas grandes sobem sozinhas. Entre nelas e deixe-se levar. Blub!"]],mora2:[["mora","Aqui est\xE1 frio, Nick. Tudo \xE9 cinza e reto. Lembro da \xE1gua do recife e passa um pouco."]],lila:[["lila","Nick! Sou a Lila, da R\xE1dio Vidro. O Plano apagou todas as minhas m\xFAsicas... agora s\xF3 toca um bipe."],["nick","Vou devolver o brilho a tudo. Prometo."],["lila","Ent\xE3o suba pelos elevadores de vidro. O Orbe do Prisma est\xE1 no alto da torre mais alta."]],lila2:[["lila","Quando a m\xFAsica voltar, a primeira \xE9 para voc\xEAs dois ;)"]],mora3:[["mora","Lembra quando a gente trocava m\xFAsicas a noite toda? Aqui n\xE3o tem m\xFAsica. Cantarolo a nossa para n\xE3o esquecer."]],sol:[["sol","Oi! Sol, piloto de bolhas. Nas colunas o vento sopra para cima: deixe-se levar."],["nick","E o Orbe do Arco-\xEDris?"],["sol","Na nuvem mais alta. O Plano j\xE1 tirou metade das cores do arco-\xEDris... corre."]],sol2:[["sol","Se voc\xEA cair, tudo bem: as nuvens te reconectam. Bom, quase sempre."]],mora4:[["mora","Hoje o Plano me perguntou para que serve o brilho. N\xE3o soube o que responder. Voc\xEA sabe?"]],vio:[["vio","Shh... olhe para cima. A Aurora se mexe com a m\xFAsica, e quando brilha d\xE1 para andar sobre ela."],["nick","Andar sobre a luz?"],["vio","Esta noite, sim. Com os cinco orbes, a Aurora vai abrir o caminho para o Plano."]],vio2:[["vio","Cada estrela daqui \xE9 algu\xE9m que ficou offline. V\xE3o voltar, voc\xEA vai ver."]],mora5:[["mora","Nick... estou te ouvindo. Estou te ouvindo perto!"],["nick","Estou chegando, Mora!"]],plano:[["plano","USU\xC1RIO NICK. POR QUE VOC\xCA INSISTE NO BRILHO?"],["nick","Porque sem brilho n\xE3o d\xE1 para ver quem est\xE1 triste e quem est\xE1 feliz."],["plano","O BRILHO \xC9 DESNECESS\xC1RIO. OCUPA ESPA\xC7O. DISTRAI."],["nick","Pode ser. Mas a Mora gosta. E eu tamb\xE9m."],["nick","CHAMAR ATEN\xC7\xC3O!"]],final:[["plano","...Isto parece... morno?"],["mora","Nick!"],["mora","Eu sabia que voc\xEA viria :)"],["nick","Sempre."],["plano","Talvez... d\xEA para ser simples e brilhar um pouquinho."]]},fin:["A Rede voltou a brilhar. Um pouco mais simples, mas brilhando.","E na lista de contatos, ao lado de cada nome, voltou a luzinha verde."],creditos:["BRILLO","Uma aventura Frutiger Aero","Ideia, desenho, m\xFAsica e c\xF3digo: feitos \xE0 m\xE3o, pixel por pixel","Nick, Mora, Tito, Dourado, Lila, Sol, Vio e o Plano","Obrigado por jogar"],emoticones:{sonrisa:"Sorriso",guino:"Piscada",risa:"Risada",corazon:"Cora\xE7\xE3o",nota:"Nota musical",estrella:"Estrela",sol:"Sol",luna:"Lua",flor:"Flor",arcoiris:"Arco-\xEDris",burbuja:"Bolha",pez:"Peixe",nube:"Nuvem",regalo:"Presente",cafe:"Caf\xE9",gato:"Gato",perro:"Cachorro",abrazo:"Abra\xE7o"}}},ba=[["es","Espa\xF1ol"],["en","English"],["pt","Portugu\xEAs"]],Mt="es",Ta={get actual(){return Mt},poner(s){if(ma[s]){Mt=s,document.documentElement.lang=s;try{localStorage.setItem("brillo:idioma",s)}catch{}}},guardado(){try{return localStorage.getItem("brillo:idioma")}catch{return null}},delNavegador(){let s=(navigator.language||"es").slice(0,2);return ma[s]?s:"es"}},F=()=>ma[Mt]||ma.es;function T(s,...a){let t=(F().ui[s]!=null?F().ui[s]:ma.es.ui[s])||s;return a.length?t.replace(/\{(\d)\}/g,(o,e)=>a[+e]):t}var k=(s,a,t,o)=>{let e=document.createElement(s);return a&&(e.className=a),o!=null&&(e.innerHTML=o),t&&t.appendChild(e),e},Ea=s=>new Promise(a=>setTimeout(a,s)),I=s=>String(s).replace(/[&<>"]/g,a=>({"&":"&amp;","<":"&lt;",">":"&g
