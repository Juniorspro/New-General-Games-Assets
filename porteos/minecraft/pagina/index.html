<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Minecraft 1.2</title>
<!-- porteo: Minecraft PE 1.2 en el navegador. El juego original es código nativo (libminecraftpe.so):
     acá el motor es nuestro (juego/*.js, WebGL) y usa lo del APK: las texturas, la interfaz, los textos,
     los sonidos, los modelos de los bichos y sus shaders; y, como opción, los shaders de Tito Crack 6000
     (del APK de Craftsman PTGI). Ver empaquetar.py. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<canvas id="hud"></canvas>
<script src="porteo-web.js"></script>
<script src="porteo-intro.js"></script>
<script>
  // siempre acostado: con el teléfono parado el juego se gira 90° (para el lado al que se gire el
  // teléfono) y los toques se traducen; atrás pausa (dos seguidos salen), pantalla completa y
  // horizontal al primer toque, y la pantalla no se apaga jugando
  Porteo.web({ orientacion: 'landscape', offline: false });
  // la intro de JXStudios tapa el principio de la carga (un toque la saltea)
  Porteo.intro({ aviso: {
    es: 'Port no oficial, para uso personal, de Minecraft PE 1.2, con los shaders de Tito Crack 6000 (de Craftsman PTGI) como opción. El juego, sus imágenes, sonidos y shaders son de sus autores.',
    pt: 'Port não oficial, para uso pessoal, do Minecraft PE 1.2, com os shaders de Tito Crack 6000 (do Craftsman PTGI) como opção. O jogo, suas imagens, sons e shaders pertencem aos seus autores.',
    en: 'Unofficial personal-use port of Minecraft PE 1.2, with Tito Crack 6000\'s shaders (from Craftsman PTGI) as an option. The game, its images, sounds and shaders belong to their authors.'
  } });
</script>
<script src="juego.js"></script>
</body>
</html>
