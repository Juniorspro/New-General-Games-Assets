<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tom: cuarto</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #info { position: fixed; left: 8px; top: 8px; background: #fffc; padding: 4px 8px; border-radius: 6px; }
  #ui { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  #ui .u { pointer-events: none; }
  .u { position: absolute; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="ui"></div>
<script type="module">
import { Juego } from './juego.js';

// cuarto.html?tam=s|m|l&cuarto=living|kitchen|bathroom|bedroom&mic=0&ui=0&medidores=a,b,c,d&clip=…&t=…
const q = new URLSearchParams(location.search);
const op = {
  datos: q.get('datos') || 'datos/', tam: q.get('tam') || 's', cuarto: q.get('cuarto') || 'living',
  mic: q.get('mic') !== '0', ui: q.get('ui') !== '0', fur: q.get('fur'), cloth: q.get('cloth'),
  medidores: q.has('medidores') ? q.get('medidores').split(',').map(Number) : null,
  clip: q.get('clip'), t: q.has('t') ? parseFloat(q.get('t')) : undefined,
};
const j = await new Juego(document.getElementById('lienzo'), document.getElementById('ui'), op).cargar();
// para las pruebas
window.juego = j;
window.estado = {
  get escena() { return j.escena; }, get cam() { return j.cam; }, get cuarto() { return j.cuartoActual; },
  tom: j.tom, u: j.u, get ui() { return j.ui; }, get pant() { return j.pant; }, get hud() { return j.hud; },
  zonas: j.zonas, sonido: j.sonido, ctl: j.ctl, anim: j.anim, toques: j.toques, escucha: j.escucha, necesidades: j.necesidades,
};
window.listo = true;
</script>
</body>
</html>
