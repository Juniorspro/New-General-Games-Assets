<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tom: visor</title>
<style>
  html, body { margin: 0; height: 100%; background: #6d8fb3; overflow: hidden; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #panel { position: fixed; left: 8px; top: 8px; background: #fffd; padding: 6px 8px; border-radius: 6px; display: grid; gap: 4px; }
  #panel select { max-width: 220px; }
  #info { position: fixed; right: 8px; top: 8px; background: #fffd; padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="panel">
  <label>Tom <select id="tam"><option value="s">bebé</option><option value="m">adolescente</option><option value="l">adulto</option></select></label>
  <label>Clip <select id="clip"></select></label>
  <label>Piel <select id="piel"></select></label>
  <label>Ojos <select id="ojos"></select></label>
</div>
<div id="info"></div>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { Animaciones, Reproductor } from './anim.js';
import { cargarTom, ponerPiel, Retarget } from './tom.js';

const q = new URLSearchParams(location.search);
const BASE = q.get('datos') || 'datos/tom/';
const lienzo = document.getElementById('lienzo');
const ren = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true });
ren.outputColorSpace = THREE.LinearSRGBColorSpace;   // Unity en gamma: sin conversiones
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
const escena = new THREE.Scene();
escena.background = new THREE.Color(0x6d8fb3);
const cam = new THREE.PerspectiveCamera(30, 1, 1, 2000);

const [indice, bin, pieles, retarget] = await Promise.all([
  fetch(BASE + 'anim.json').then((r) => r.json()),
  fetch(BASE + 'anim.bin').then((r) => r.arrayBuffer()),
  fetch(BASE + 'pieles.json').then((r) => r.json()),
  fetch(BASE + 'retarget.json').then((r) => r.json()),
]);
const anims = new Animaciones(indice, bin);
const selTam = document.getElementById('tam'), selClip = document.getElementById('clip');
const selPiel = document.getElementById('piel'), selOjos = document.getElementById('ojos');
for (const n of anims.nombres().sort()) selClip.add(new Option(n, n));
for (const [k, v] of Object.entries(pieles)) (v.tipo === 'ojos' ? selOjos : selPiel).add(new Option(k, k));
selTam.value = q.get('tam') || 's';
selClip.value = q.get('clip') || 'breathingS';
selPiel.value = q.get('piel') || 'tom_body_default';
selOjos.value = q.get('ojos') || 'tom_eyes_default';

let tom = null, rep = null;
const fijo = q.has('t') ? parseFloat(q.get('t')) : null;   // para capturas: el cuadro en ese tiempo

async function cambiarTom() {
  if (tom) escena.remove(tom.raiz);
  tom = await cargarTom(BASE, selTam.value);
  escena.add(tom.raiz);
  ponerPiel(tom, BASE + 'pieles/', pieles, selPiel.value, selOjos.value, q.get('kw') ? q.get('kw').split(',') : null);
  rep = new Reproductor(anims, tom.raiz);
  const rt = new Retarget(tom.raiz, retarget[selTam.value]);
  rep.despues = (clip, tn, dt) => rt.aplicar(clip, tn, dt);
  window.estado = { tom, rep, escena, ren, cam };
  tocar();
  encuadrar();
}
function tocar() {
  rep.play(selClip.value, { bucle: true });
  if (fijo !== null) { rep.update(fijo); rep.update(0); }
}
function encuadrar() {
  const caja = new THREE.Box3().setFromObject(tom.raiz);
  const c = caja.getCenter(new THREE.Vector3()), t = caja.getSize(new THREE.Vector3());
  const lado = q.get('lado') ? parseFloat(q.get('lado')) : 0;
  const d = Math.max(t.y, t.x) * 2.1;
  cam.position.set(c.x + Math.sin(lado) * d, c.y + t.y * 0.05, c.z + Math.cos(lado) * d);
  cam.lookAt(c);
}
selTam.onchange = cambiarTom;
selClip.onchange = tocar;
selPiel.onchange = selOjos.onchange = () => ponerPiel(tom, BASE + 'pieles/', pieles, selPiel.value, selOjos.value);

function medir() {
  const w = innerWidth, h = innerHeight;
  ren.setSize(w, h, false);
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
}
addEventListener('resize', medir);
medir();
await cambiarTom();

const reloj = new THREE.Clock();
const info = document.getElementById('info');
function cuadro() {
  const dt = Math.min(reloj.getDelta(), 0.1);
  if (fijo === null) rep.update(dt);
  ren.render(escena, cam);
  const a = rep.actual;
  info.textContent = a ? `${a.clip.nombre} ${(a.t % (a.clip.dur || 1)).toFixed(2)}/${a.clip.dur.toFixed(2)} s` : '';
  requestAnimationFrame(cuadro);
}
cuadro();
window.listo = true;
</script>
</body>
</html>
