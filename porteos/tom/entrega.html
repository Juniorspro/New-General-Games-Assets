<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>My Talking Tom</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  #ui .u { pointer-events: none; }
  .u { position: absolute; }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="ui"></div>
<script>
// Arranque del .html único: los módulos ES vienen como datos (fetch, que un-archivo.py atiende) y
// se cargan como blob: con sus import ya apuntando a los blob: de los otros; las imágenes de la
// interfaz (CSS background-image) también pasan a blob:.
(async () => {
  const IMAGENES = /*IMAGENES*/[];
  const cache = new Map();
  const norm = (p) => { const o = []; for (const s of p.split('/')) { if (s === '..') o.pop(); else if (s && s !== '.') o.push(s); } return o.join('/'); };
  const modulo = (ruta) => {
    if (!cache.has(ruta)) cache.set(ruta, (async () => {
      let src = await (await fetch(ruta)).text();
      const dir = ruta.slice(0, ruta.lastIndexOf('/') + 1);
      // sólo las sentencias al principio de una línea (no los ejemplos de los comentarios)
      const re = /^[ \t]*(?:import|export)\b[^'"]*?from\s*(['"])(\.\.?\/[^'"]+)\1|^[ \t]*import\s*(['"])(\.\.?\/[^'"]+)\3/gm;
      for (const m of [...src.matchAll(re)]) {
        const esp = m[2] || m[4], destino = norm(dir + esp);
        if (destino === ruta) continue;
        src = src.split(m[0]).join(m[0].replace(esp, await modulo(destino)));
      }
      return URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    })());
    return cache.get(ruta);
  };
  const mapa = {};
  await Promise.all(IMAGENES.map(async (u) => {
    const b = URL.createObjectURL(await (await fetch(u)).blob());
    mapa[u] = b;
    const i = u.lastIndexOf('/');
    mapa[u.slice(0, i + 1) + encodeURIComponent(u.slice(i + 1))] = b;
  }));
  const { UI } = await import(await modulo('ui.js'));
  for (const k of ['url', 'urlTextura']) {
    const o = UI.prototype[k];
    if (o) UI.prototype[k] = function (...a) { const u = o.apply(this, a); return mapa[u] || mapa[decodeURIComponent(u)] || u; };
  }
  const { Juego } = await import(await modulo('juego.js'));
  // partida nueva: los medidores en 80 (la cocina y el baño todavía no se pueden usar)
  let nueva = true;
  try { nueva = localStorage.getItem('tom.GameState.FunMeter') === null; } catch (e) { }
  const q = new URLSearchParams(location.search);
  const j = await new Juego(document.getElementById('lienzo'), document.getElementById('ui'), {
    datos: 'datos/', tam: q.get('tam') || 's', cuarto: q.get('cuarto') || 'living',
    medidores: nueva ? [80, 80, 80, 80] : null,
  }).cargar();
  window.juego = j;
  window.listo = true;
})().catch((e) => { document.body.insertAdjacentHTML('beforeend', '<pre style="color:#fff;position:fixed;top:0">' + e + '</pre>'); });
</script>
</body>
</html>
