<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Half-Life</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
  /* la carga: la barra después de la intro y el cartel al bajar un nivel */
  #hl-carga { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0, 0, 0, .8); color: #ffa53c; font: 700 4.6vh system-ui, sans-serif; letter-spacing: .02em; pointer-events: none; }
  #hl-carga.si { display: flex; }
  #hl-carga .barra { width: min(60vw, 520px); height: 1.6vh; min-height: 8px; margin-top: 2.4vh; border: 1px solid rgba(255, 165, 60, .6);
    border-radius: 99px; overflow: hidden; }
  #hl-carga .barra div { height: 100%; width: 0; background: #ffa53c; transition: width .2s; }
  #hl-carga small { margin-top: 1.6vh; font-weight: 500; font-size: 2.8vh; color: rgba(255, 255, 255, .75); }
  #hl-carga button { display: none; margin-top: 3vh; min-height: 44px; padding: 0 22px; border: 0; border-radius: 99px;
    background: #ffa53c; color: #000; font: 700 15px system-ui, sans-serif; pointer-events: auto; }
  #hl-carga.falla button { display: inline-block; }
  #hl-carga .botones { display: flex; gap: 12px; }
  /* lo que se baja de fondo mientras se mira el menú o se juega */
  #hl-fondo { position: fixed; right: calc(8px + env(safe-area-inset-right)); bottom: 6px; z-index: 35; display: none;
    font: 600 12px system-ui, sans-serif; color: rgba(255, 200, 140, .85); text-shadow: 0 1px 2px #000; pointer-events: none; }
  #hl-fondo.si { display: block; }
  #hl-error { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; padding: 6vw;
    background: #000; color: #fff; font: 600 20px system-ui, sans-serif; text-align: center; white-space: pre-wrap; }
  #hl-error.si { display: flex; }
  /* los avisos del motor: en vez del cartel del navegador, que frena todo, uno propio */
  #hl-aviso { position: fixed; inset: 0; z-index: 49; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .55); font: 500 15px system-ui, sans-serif; }
  #hl-aviso.si { display: flex; }
  #hl-aviso > div { max-width: min(86vw, 520px); padding: 18px 22px; border-radius: 14px; background: #15171c;
    border: 1px solid rgba(255, 165, 60, .5); color: #fff; text-align: center; }
  #hl-aviso b { display: block; margin-bottom: 8px; color: #ffa53c; font-size: 17px; }
  #hl-aviso p { margin: 0 0 16px; color: rgba(255, 255, 255, .8); white-space: pre-wrap; overflow-wrap: anywhere; }
  #hl-aviso button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 99px; background: #ffa53c; color: #000;
    font: 700 15px system-ui, sans-serif; }
  /* si el teléfono todavía no dejó sonar al juego: un botón para destrabar el sonido con un toque */
  #hl-sonido { position: fixed; left: calc(10px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); z-index: 45;
    display: none; padding: 9px 14px; border-radius: 99px; border: 1px solid rgba(255, 165, 60, .7); background: rgba(0, 0, 0, .72);
    color: #ffa53c; font: 600 15px system-ui, sans-serif; min-height: 44px; }
  #hl-sonido.si { display: block; }
  /* el idioma, en el menú principal */
  #hl-idioma { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top)); z-index: 44;
    display: none; min-height: 44px; padding: 0 16px; border-radius: 99px; border: 1px solid rgba(255, 165, 60, .6);
    background: rgba(0, 0, 0, .6); color: rgba(255, 255, 255, .6); font: 600 15px system-ui, sans-serif; }
  #hl-idioma b { color: #ffa53c; }
  #hl-idioma.si { display: block; }
  /* el idioma, al empezar: antes de la intro, así el juego ya carga por detrás en el elegido */
  #hl-elegir { position: fixed; inset: 0; z-index: 46; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.4vh; padding: 4vh 4vw; background: radial-gradient(ellipse at 50% 45%, #141414 0%, #000 62%); color: #fff;
    font-family: system-ui, sans-serif; text-align: center; }
  #hl-elegir.si { display: flex; animation: hl-aparecer .35s ease; }
  @keyframes hl-aparecer { from { opacity: 0; } }
  #hl-elegir h1 { margin: 0; color: #ffa53c; font: 700 clamp(26px, 9vh, 64px)/1 system-ui, sans-serif; letter-spacing: .3em; text-indent: .3em; }
  #hl-elegir p { margin: 0 0 1.6vh; color: rgba(255, 255, 255, .7); font: 500 clamp(14px, 3.6vh, 20px) system-ui, sans-serif; }
  #hl-elegir .opciones { display: flex; gap: 3vw; }
  #hl-elegir button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8vh;
    width: min(38vw, 300px); min-height: max(64px, 20vh); padding: 1.6vh 2vw; border-radius: 18px;
    border: 2px solid rgba(255, 165, 60, .45); background: rgba(255, 255, 255, .04); color: #fff; cursor: pointer;
    font: 700 clamp(19px, 6vh, 30px)/1.1 system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  #hl-elegir button small { color: rgba(255, 255, 255, .62); font: 500 clamp(12px, 3vh, 16px)/1.2 system-ui, sans-serif; }
  /* la de la vez pasada */
  #hl-elegir button.antes { border-color: #ffa53c; background: rgba(255, 165, 60, .14); }
  #hl-elegir button:active { transform: scale(.97); }
  #hl-elegir button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  /* el teclado del teléfono: un campo de verdad, invisible (16px: si no, iOS hace zoom al enfocarlo) */
  #hl-teclado { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0;
    font-size: 16px; pointer-events: none; -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="hl-carga"><div id="hl-carga-texto"></div><div class="barra"><div id="hl-carga-barra"></div></div><small id="hl-carga-detalle"></small>
  <div class="botones"><button id="hl-reintentar" type="button"></button><button id="hl-volver" type="button"></button></div></div>
<div id="hl-fondo"></div>
<div id="hl-error"></div>
<div id="hl-aviso"><div><b></b><p></p><button type="button"></button></div></div>
<button id="hl-sonido" type="button"></button>
<button id="hl-idioma" type="button"></button>
<div id="hl-elegir" role="dialog" aria-modal="true" aria-labelledby="hl-elegir-titulo">
  <h1 id="hl-elegir-titulo">HALF-LIFE</h1>
  <p>Elige el idioma · Choose your language</p>
  <div class="opciones">
    <button type="button" data-idioma="es" lang="es">Español<small>latino · voces dobladas</small></button>
    <button type="button" data-idioma="en" lang="en">English<small>original voices</small></button>
  </div>
</div>
<input id="hl-teclado" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-hidden="true" tabindex="-1">
<script src="porteo-web.js"></script>
<script src="porteo-intro.js"></script>
<script src="controles.js"></script>
<script src="motor/xash.js"></script>
<script>
'use strict';
// Half-Life en el navegador: el motor es Xash3D FWGS (una reimplementación abierta de GoldSrc)
// compilado a WebAssembly, con hlsdk-portable (la lógica del juego), y los datos de las copias del
// dueño: en inglés o en español latino, a elección (se elige al empezar). Este archivo pregunta el
// idioma, muestra la intro de JXStudios, carga, y conecta el motor con la página (controles
// táctiles, niveles que se bajan cuando hacen falta, partidas guardadas en el teléfono).
(function () {
  const $ = (id) => document.getElementById(id);

  // ── el idioma: se elige al empezar (y se puede cambiar en el menú principal) ─────────
  // Hasta que se elige vale el de la vez pasada (o el del teléfono): es el que sale marcado, y lo
  // suyo se empieza a bajar mientras se elige.
  let idioma = '';
  try { idioma = localStorage.getItem('hl-idioma') || ''; } catch (_) {}
  if (idioma !== 'es' && idioma !== 'en') idioma = /^es\b/i.test(navigator.language || '') ? 'es' : 'en';
  document.documentElement.lang = idioma;
  const TEXTOS = {
    es: {
      cargando: 'Cargando…', actualizando: 'Actualizando el juego…', nivel: 'Cargando el nivel…', de: 'de',
      noCargo: 'No se pudo cargar el juego.', revisa: 'Revisa la conexión y vuelve a abrirlo.',
      noBajo: 'No se pudo bajar el nivel', reintentar: 'Reintentar', volver: 'Volver al juego',
      errorTitulo: 'El juego tuvo un error', fatalTitulo: 'El juego se cerró por un error', seguir: 'Seguir', reabrir: 'Volver a abrir',
      sonido: '🔇 Toca para activar el sonido', preparando: 'Preparando la partida…', voces: 'Bajando las voces…',
      guardado: 'Partida guardada', salir: 'Atrás otra vez para salir', girar: 'Gira el teléfono',
      finDemo: 'Esta versión de un solo archivo llega hasta acá: el juego completo está en la versión web.',
      idioma: '<b>Español</b> · English',
    },
    en: {
      cargando: 'Loading…', actualizando: 'Updating the game…', nivel: 'Loading level…', de: 'of',
      noCargo: 'The game could not be loaded.', revisa: 'Check your connection and open it again.',
      noBajo: 'The level could not be downloaded', reintentar: 'Retry', volver: 'Back to the game',
      errorTitulo: 'The game had an error', fatalTitulo: 'The game closed because of an error', seguir: 'Continue', reabrir: 'Open again',
      sonido: '🔇 Tap to turn the sound on', preparando: 'Getting the game ready…', voces: 'Downloading voices…',
      guardado: 'Game saved', salir: 'Back again to exit', girar: 'Turn your phone',
      finDemo: 'This single-file version ends here: the full game is in the web version.',
      idioma: 'Español · <b>English</b>',
    },
  };
  let T = TEXTOS[idioma];

  // El motor dibuja a la resolución física de la pantalla (SDL con "high DPI"): en un teléfono, el
  // triple del ancho. Se limita a 2 por píxel (más liviano, y en el juego se ve igual de nítido) y a
  // 2560 de ancho (con más, el HUD pediría los íconos de 2560, que no viajan).
  (() => {
    const d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') || Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
    if (!d || !d.get) return;
    try {
      Object.defineProperty(window, 'devicePixelRatio', { configurable: true,
        get: () => Math.min(d.get.call(window) || 1, 2, 2560 / Math.max(1, innerWidth)) });
    } catch (_) {}
  })();

  const estado = window.__hl = { log: [], fase: 'cargando', bajado: {}, montado: {}, errores: [], idioma };
  const anotar = (t) => { estado.log.push(t); if (estado.log.length > 600) estado.log.splice(0, 150); };
  const mb = (n) => (n / 1048576).toFixed(1).replace('.', idioma === 'es' ? ',' : '.') + ' MB';

  const error = (e) => {
    console.error(e);
    estado.errores.push(String(e && e.message || e));
    const c = $('hl-error');
    c.textContent = T.noCargo + '\n\n' + (e && e.message || e) + '\n\n' + T.revisa;
    c.className = 'si';
  };
  addEventListener('error', (e) => estado.errores.push(String(e.message)));
  addEventListener('unhandledrejection', (e) => estado.errores.push(String(e.reason && e.reason.message || e.reason)));

  // Los avisos del motor (un Host Error, por ejemplo) llegan como alert(): en el teléfono es un
  // cartel del navegador que frena todo. Van a uno propio y el juego sigue detrás; después de un
  // error fatal (Xash Error) el motor queda parado y el botón vuelve a abrir el juego.
  function mostrarAviso(titulo, detalle, fatal) {
    const a = $('hl-aviso'), b = a.querySelector('button');
    a.querySelector('b').textContent = titulo;
    a.querySelector('p').textContent = detalle;
    b.textContent = fatal ? T.reabrir : T.seguir;
    b.onclick = (e) => {
      e.stopPropagation();
      if (fatal) { location.reload(); return; }
      a.className = '';
      $('canvas').focus();
    };
    a.className = 'si';
  }
  window.alert = (txt) => {
    const [titulo, ...resto] = String(txt == null ? '' : txt).split('\n\n');
    const detalle = resto.join('\n\n') || titulo;
    console.error(`${titulo}: ${detalle}`);
    estado.errores.push(`${titulo}: ${detalle}`);
    const fatal = /^Xash Error/.test(titulo);
    mostrarAviso(fatal ? T.fatalTitulo : T.errorTitulo, detalle, fatal);
  };

  Porteo.web({ orientacion: 'landscape', offline: window.__porteoUnArchivo ? false : undefined, textoSalir: () => T.salir, textoGirar: () => T.girar });
  // La página puede haber salido de lo guardado en el teléfono: si hay una versión nueva publicada,
  // se baja lo que cambió y se recarga antes de cargar nada (los paquetes de dos versiones no se mezclan).
  const actualizacion = Porteo.actualizar({ tope: 4000, alAvanzar: (h, t) => {
    estado.fase = 'actualizando';
    mostrarCarga(T.actualizando, t ? `${mb(h)} ${T.de} ${mb(t)}` : '');
    progresoCarga(t ? h / t : 0);
  } });
  // después de actualizar (o de cambiar el idioma) no se repite la intro; después de cambiar el
  // idioma (o de elegirlo, si la actualización llegó después) tampoco se vuelve a preguntar
  let sinIntro = false, yaElegido = false;
  try {
    sinIntro = sessionStorage.getItem('hl-sin-intro') === '1'; sessionStorage.removeItem('hl-sin-intro');
    yaElegido = sessionStorage.getItem('hl-idioma-ya') === '1'; sessionStorage.removeItem('hl-idioma-ya');
  } catch (_) {}
  let introLista = false, eligio = false;
  const avisoIntro = {
    es: 'Port no oficial de «Half-Life» (Valve) para jugar en el navegador. Motor: Xash3D FWGS + hlsdk-portable.',
    en: 'Unofficial browser port of «Half-Life» (Valve). Engine: Xash3D FWGS + hlsdk-portable.',
  };
  // Primero el idioma; después la intro, en ese idioma, con el juego cargando por detrás.
  const eleccion = (yaElegido ? Promise.resolve(idioma) : elegirIdioma()).then((L) => { aplicarIdioma(L); eligio = true; return L; });
  eleccion.then(() => (sinIntro ? null : Porteo.intro({ aviso: avisoIntro[idioma], idioma })))
    .then(() => { introLista = true; if (estado.fase === 'cargando') mostrarCarga(T.cargando); });

  // La pantalla del idioma: las dos opciones, con la de la vez pasada marcada. Con teclado, Enter
  // elige la marcada y las flechas pasan de una a otra.
  function elegirIdioma() {
    return new Promise((listo) => {
      const el = $('hl-elegir'), botones = [...el.querySelectorAll('button')];
      const marcado = () => botones.find((b) => b.dataset.idioma === idioma);
      const elegir = (b) => {
        if (el.className !== 'si') return;
        el.className = '';
        removeEventListener('keydown', teclas, true);
        listo(b.dataset.idioma);
      };
      const teclas = (e) => {
        e.stopPropagation();
        const i = botones.indexOf(document.activeElement);
        if (/^Arrow/.test(e.key)) { e.preventDefault(); botones[(i + 1) % botones.length].focus(); }
        else if (e.key === 'Enter' && i < 0) { e.preventDefault(); elegir(marcado()); }
      };
      botones.forEach((b) => {
        b.classList.toggle('antes', b === marcado());
        b.addEventListener('click', (e) => { e.stopPropagation(); elegir(b); });
      });
      addEventListener('keydown', teclas, true);
      el.className = 'si';
    });
  }
  // los textos de la página, en el idioma elegido (que queda guardado para la próxima)
  function aplicarIdioma(L) {
    idioma = estado.idioma = L;
    T = TEXTOS[L];
    document.documentElement.lang = L;
    try { localStorage.setItem('hl-idioma', L); } catch (_) {}
    $('hl-sonido').textContent = T.sonido;
    $('hl-reintentar').textContent = T.reintentar;
    $('hl-volver').textContent = T.volver;
    $('hl-idioma').innerHTML = T.idioma;
  }

  // ── carga con progreso ───────────────────────────────────────────────────────────────
  let cargaDe = null;     // qué está mostrando el cartel
  function mostrarCarga(texto, detalle) {
    cargaDe = texto;
    $('hl-carga-texto').textContent = texto;
    $('hl-carga-detalle').textContent = detalle || '';
    $('hl-carga').className = 'si';
  }
  function progresoCarga(f, detalle) {
    $('hl-carga-barra').style.width = Math.round(Math.min(1, f) * 100) + '%';
    if (detalle !== undefined) $('hl-carga-detalle').textContent = detalle;
  }
  function ocultarCarga() { cargaDe = null; $('hl-carga').className = ''; }

  // Un archivo con gzip: se baja contando los bytes y se abre con DecompressionStream.
  async function traerGz(ruta, total, alAvanzar) {
    const r = await fetch(ruta);
    if (!r.ok) throw new Error(`${ruta} (${r.status})`);
    let flujo = r.body;
    if (flujo && alAvanzar) {
      let n = 0;
      flujo = flujo.pipeThrough(new TransformStream({ transform(trozo, ctl) { n += trozo.length; alAvanzar(n, total); ctl.enqueue(trozo); } }));
    } else if (!flujo) {
      flujo = new Blob([await r.arrayBuffer()]).stream();
    }
    const abierto = flujo.pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(abierto).arrayBuffer());
  }

  // ── los paquetes ─────────────────────────────────────────────────────────────────────
  let M = null, indice = null;
  const bajados = new Map();      // paquete → Promise (bajado y escrito en el disco del motor)
  const montados = new Set();     // paquetes que el motor ya ve (fs_rescan)
  const progreso = new Map();     // paquete → bytes bajados
  // los de español van a la carpeta escribible: Xash busca ahí la del idioma (valve_spanish)
  const carpetaDe = (c) => c === 'valve_spanish' ? '/rwdir/valve_spanish' : '/rodir/' + c;
  const rutaDe = (n) => `${carpetaDe(indice.paquetes[n].carpeta)}/porteo-${n.replace(/\//g, '-')}.pk3`;

  // Bajar (a memoria) y escribir en el disco del motor van por separado: el menú se baja mientras
  // el motor compila, y se escribe cuando el motor existe. Lo urgente (lo que hace falta para
  // entrar a un nivel) sale enseguida; lo de fondo, de a dos, para no quitarle red a lo urgente.
  const enMemoria = new Map();    // paquete → Promise<Uint8Array>
  const colaFondo = [];
  let deFondoEnCurso = 0;
  function traerPaquete(n) {
    const p = indice.paquetes[n];
    const pr = traerGz('datos/' + p.archivo, p.gz, (b) => { progreso.set(n, b); });
    enMemoria.set(n, pr);
    pr.catch(() => { enMemoria.delete(n); progreso.delete(n); });
    return pr;
  }
  function bajar(n, urgente) {
    if (enMemoria.has(n)) return enMemoria.get(n);
    if (urgente) {
      const i = colaFondo.findIndex((x) => x.n === n);
      if (i >= 0) { const [x] = colaFondo.splice(i, 1); traerPaquete(n).then(x.ok, x.mal); return enMemoria.get(n); }
      return traerPaquete(n);
    }
    const x = colaFondo.find((x) => x.n === n);
    if (x) return x.pr;
    const nuevo = { n };
    nuevo.pr = new Promise((ok, mal) => { nuevo.ok = ok; nuevo.mal = mal; });
    colaFondo.push(nuevo);
    siguienteDeFondo();
    return nuevo.pr;
  }
  function siguienteDeFondo() {
    while (deFondoEnCurso < 2 && colaFondo.length) {
      const x = colaFondo.shift();
      deFondoEnCurso++;
      traerPaquete(x.n).then(x.ok, x.mal).finally(() => { deFondoEnCurso--; siguienteDeFondo(); });
    }
  }
  function paquete(n, urgente) {
    if (!bajados.has(n)) {
      const p = indice.paquetes[n];
      bajados.set(n, bajar(n, urgente).then((datos) => {
        const ruta = rutaDe(n);
        M.FS.writeFile(ruta, datos);
        // la misma fecha en todos: el motor descarta maps/<mapa>.ent si es "más viejo" que el .bsp
        M.FS.utime(ruta, 946684800000, 946684800000);
        enMemoria.delete(n);
        progreso.set(n, p.gz);
        estado.bajado[n] = true;
      }));
      bajados.get(n).catch(() => bajados.delete(n));     // si falló, el próximo pedido lo reintenta
    } else if (urgente && enMemoria.has(n) === false && !estado.bajado[n]) {
      bajar(n, true);
    }
    return bajados.get(n);
  }
  const bytesDe = (ns) => ns.reduce((a, n) => a + indice.paquetes[n].gz, 0);
  const hechoDe = (ns) => ns.reduce((a, n) => a + (progreso.get(n) || 0), 0);

  const comando = (c) => M && M.ccall('Porteo_Comando', null, ['string'], [c]);
  const hl = {
    comando,
    mover: (a, c) => M && M._Porteo_Mover(a, c),
    mirar: (g, p) => M && M._Porteo_Mirar(g, p),
    estado: () => { try { return JSON.parse(M.ccall('Porteo_Estado', 'string', [], [])); } catch (_) { return null; } },
  };
  window.HL = hl;

  // Lo bajado se monta junto (un fs_rescan). Antes, si hay mucho en memoria, se sueltan los
  // niveles lejanos (los del capítulo siguen: los comparten los niveles que vienen).
  const jugados = [];             // los niveles en el orden en que se jugaron
  function liberar(quedan) {
    if (!jugados.length || montados.size < 30) return;
    const cerca = new Set(jugados.slice(-6));
    for (const m of [...cerca]) (indice.mapas[m] ? indice.mapas[m].vecinos : []).forEach((v) => cerca.add(v));
    const usan = new Set([...quedan, ...[...cerca].flatMap((m) => indice.mapas[m] ? necesarios(m) : [])]);
    for (const n of [...montados]) {
      if (!/^(mapas|musica)\//.test(n) || usan.has(n)) continue;
      try { M.FS.unlink(rutaDe(n)); } catch (_) {}
      montados.delete(n); bajados.delete(n); progreso.delete(n);
      delete estado.bajado[n]; delete estado.montado[n];
    }
  }
  // quedan: lo que no se puede soltar (lo del nivel al que se está entrando)
  function montar(ns, quedan) {
    const nuevos = ns.filter((n) => estado.bajado[n] && !montados.has(n));
    if (!nuevos.length) return;
    liberar(quedan || ns);
    nuevos.forEach((n) => { montados.add(n); estado.montado[n] = true; });
    comando('fs_rescan');
  }

  // lo que hace falta para entrar a un nivel: lo de todas las partidas, lo del capítulo, lo del
  // nivel, sus frases con guion y (fuera del primer capítulo) la charla de los personajes
  function necesarios(m) {
    const info = indice.mapas[m];
    return [...indice.partida, ...info.paquetes, ...(info.voces[idioma] || []), ...(info.charla ? indice.idiomas[idioma].voces : [])];
  }
  // de fondo: lo de los niveles a los que lleva éste, y la charla
  function deFondo(ns) {
    const faltan = [...new Set(ns)].filter((n) => !montados.has(n));
    if (!faltan.length) return Promise.resolve();
    return Promise.all(faltan.map((n) => paquete(n, false))).then(() => montar(faltan));
  }

  // Antes de cargar un nivel (partida nueva, entrenamiento, partida guardada, el paso al siguiente
  // o "map" en la consola) el motor pregunta si están sus datos (Porteo_Necesita). Si no, se bajan
  // con un cartel (el juego queda en pausa) y se vuelve a mandar el mismo comando.
  let pedido = null;
  function necesita(mapa, cmd) {
    const m = String(mapa).toLowerCase();
    const info = indice.mapas[m];
    if (!info) {
      if (window.__porteoUnArchivo && /^changelevel/.test(cmd)) mostrarAviso('Half-Life', T.finDemo, false);
      return 1;                                    // no es de este juego: que el motor diga que no está
    }
    const hacen = [...new Set(necesarios(m))];
    const faltan = hacen.filter((n) => !montados.has(n));
    if (!faltan.length) return 1;
    if (pedido) return 0;                          // ya se está trayendo un nivel
    pedido = { m, cmd };
    const total = bytesDe(faltan);
    // si ya está todo bajado (de fondo), sólo falta montarlo: sin cartel
    const t0 = setTimeout(() => { if (pedido) mostrarCarga(T.nivel, mb(total)); }, faltan.every((n) => estado.bajado[n]) ? 1500 : 0);
    const reloj = setInterval(() => { if (cargaDe) progresoCarga(hechoDe(faltan) / total, `${mb(hechoDe(faltan))} ${T.de} ${mb(total)}`); }, 150);
    Promise.all(faltan.map((n) => paquete(n, true))).then(() => {
      clearTimeout(t0); clearInterval(reloj);
      montar(faltan, hacen);
      if (cargaDe) ocultarCarga();
      pedido = null;
      comando(cmd);
    }).catch((e) => {
      clearTimeout(t0); clearInterval(reloj);
      mostrarCarga(T.noBajo, String(e.message || e));
      $('hl-carga').className = 'si falla';
      $('hl-reintentar').onclick = () => { ocultarCarga(); pedido = null; if (necesita(m, cmd)) comando(cmd); };
      // (si esperaba para pasar al nivel siguiente, el juego sale de la pausa)
      $('hl-volver').onclick = () => { ocultarCarga(); pedido = null; M._Porteo_Seguir(); $('canvas').focus(); };
    });
    return 0;
  }

  // Con mouse, SDL bloquea el puntero para mirar (como en la PC). Con el dedo no hace falta, y con
  // el puntero bloqueado Chrome da los toques en (0, 0): sólo se bloquea si el último toque fue de
  // un mouse, y un toque con el dedo lo libera.
  let ultimoPuntero = 'mouse';
  addEventListener('pointerdown', (e) => {
    ultimoPuntero = e.pointerType;
    if (e.pointerType !== 'mouse' && document.pointerLockElement) document.exitPointerLock();
  }, true);
  const bloquear = HTMLCanvasElement.prototype.requestPointerLock;
  HTMLCanvasElement.prototype.requestPointerLock = function () {
    return ultimoPuntero === 'mouse' ? bloquear.apply(this, arguments) : undefined;
  };

  // ── el teclado del teléfono ──────────────────────────────────────────────────────────
  // Cuando el juego pide texto (el nombre de una partida guardada, la consola) el motor avisa con
  // porteoTexto y, si se juega con el dedo, se enfoca un <input> de verdad para que salga el
  // teclado del sistema. Lo escrito se compara con lo anterior y va al motor como letras y
  // borrados: así anda también el autocompletado, que reemplaza palabras enteras. El relleno del
  // principio hace que "borrar" llegue aunque en el campo no haya nada escrito todavía.
  const teclado = $('hl-teclado');
  const RELLENO = ' '.repeat(8);
  let previo = RELLENO, pideTexto = false;
  const tecla = (k) => { M._Porteo_Tecla(k, 1); M._Porteo_Tecla(k, 0); };
  function vaciarTeclado() {
    teclado.value = previo = RELLENO;
    try { teclado.setSelectionRange(RELLENO.length, RELLENO.length); } catch (_) {}
  }
  function abrirTeclado() {
    if (!pideTexto || ultimoPuntero === 'mouse' || document.activeElement === teclado) return;
    vaciarTeclado();
    teclado.focus({ preventScroll: true });
  }
  function porteoTexto(si, destino) {
    pideTexto = !!si && (destino === 2 || destino === 3);   // menú o chat; en la consola de la carga, no
    if (pideTexto) abrirTeclado();
    else if (document.activeElement === teclado) teclado.blur();
  }
  teclado.addEventListener('input', () => {
    const v = teclado.value;
    let i = 0;
    while (i < v.length && i < previo.length && v[i] === previo[i]) i++;
    for (let k = i; k < previo.length; k++) tecla(127);                       // K_BACKSPACE
    if (i < v.length) M.ccall('Porteo_Texto', null, ['string'], [v.slice(i)]);
    previo = v;
    if (v.length < RELLENO.length) vaciarTeclado();
  });
  ['keydown', 'keypress', 'keyup'].forEach((t) => teclado.addEventListener(t, (e) => {
    e.stopPropagation();                         // que SDL no cuente la tecla otra vez
    if (t !== 'keydown') return;
    if (e.key === 'Enter') { e.preventDefault(); tecla(13); teclado.blur(); }    // "listo": se esconde
    else if (e.key === 'Escape') { e.preventDefault(); tecla(27); }
  }));
  // tocar de nuevo mientras el juego espera texto vuelve a abrir el teclado (si se cerró, o si el
  // navegador no lo dejó abrir fuera de un toque)
  addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') abrirTeclado(); }, true);

  // El audio de SDL arranca suspendido: se despierta con el primer toque o tecla, y se calla
  // con la página oculta.
  const audio = () => M && M.SDL2 && M.SDL2.audioContext;
  // (con el dedo, Chrome da permiso de sonar recién en pointerup/touchend/click, no en pointerdown)
  const despertar = () => { const a = audio(); if (a && a.state !== 'running' && !document.hidden) a.resume().catch(() => {}); };
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach((ev) => addEventListener(ev, despertar, true));
  // Si igual sigue callado (el teléfono no lo dejó), un botón a la vista: un toque directo sobre él
  // siempre cuenta como permiso.
  const botonSonido = $('hl-sonido');
  botonSonido.addEventListener('click', (e) => { e.stopPropagation(); despertar(); });
  document.addEventListener('visibilitychange', () => {
    const a = audio();
    if (a) { if (document.hidden) a.suspend().catch(() => {}); else a.resume().catch(() => {}); }
    if (document.hidden) guardar();
  });

  // Las partidas guardadas y lo que el juego escribe (config.cfg, controles, video) viven en IndexedDB.
  let guardando = false;
  function guardar() {
    if (!M || guardando) return;
    guardando = true;
    M.FS.syncfs(false, () => { guardando = false; });
  }

  // El idioma también se cambia en el menú principal (fuera de una partida): recarga la página con
  // el otro, sin la intro ni la pantalla de elegir.
  const botonIdioma = $('hl-idioma');
  botonIdioma.addEventListener('click', (e) => {
    e.stopPropagation();
    try {
      localStorage.setItem('hl-idioma', idioma === 'es' ? 'en' : 'es');
      sessionStorage.setItem('hl-sin-intro', '1');
      sessionStorage.setItem('hl-idioma-ya', '1');
    } catch (_) {}
    guardar();
    setTimeout(() => location.reload(), 300);
  });

  async function arrancar() {
    if (await actualizacion) {
      try {
        if (introLista) sessionStorage.setItem('hl-sin-intro', '1');
        if (eligio) sessionStorage.setItem('hl-idioma-ya', '1');
      } catch (_) {}
      location.reload();
      return;
    }
    if (estado.fase === 'actualizando') {                // no se pudo (sin red, o se trabó): se sigue con lo que hay
      estado.fase = 'cargando';
      progresoCarga(0, '');
      if (introLista) mostrarCarga(T.cargando); else ocultarCarga();
    }
    indice = await (await fetch('datos/indice.json')).json();
    // Mientras se elige el idioma ya se baja lo que no depende de él (el menú, los .wad del sistema,
    // el motor y sus módulos) y lo del idioma marcado, que casi siempre se vuelve a elegir; si se
    // elige el otro, lo suyo (1 o 2 MB) se baja al tocarlo.
    const traerBinario = (ruta) => fetch(ruta).then((r) => { if (!r.ok) throw new Error(`${ruta} (${r.status})`); return r.arrayBuffer(); });
    const extras = {}, deWads = new Map(), wadsEnCurso = new Map();
    const traerExtras = (L) => extras[L] || (extras[L] = traerBinario(`motor/extras-${L}.pk3`));
    // los .wad del sistema (calcomanías, gráficos, fuentes): sueltos, el motor los monta al iniciar
    const traerWad = (w) => {
      if (!wadsEnCurso.has(w.ruta)) wadsEnCurso.set(w.ruta, traerGz('datos/' + w.archivo, w.gz, (b) => deWads.set(w.ruta, b)));
      return wadsEnCurso.get(w.ruta);
    };
    const wadsDe = (L) => (indice.wads || []).filter((w) => (w.idioma || '') === L);
    const anticipar = (L) => {
      indice.idiomas[L].inicio.forEach((n) => bajar(n, true));
      wadsDe(L).forEach((w) => traerWad(w).catch(() => {}));
      traerExtras(L).catch(() => {});
    };
    indice.inicio.forEach((n) => bajar(n, true));
    wadsDe('').forEach((w) => traerWad(w).catch(() => {}));
    anticipar(idioma);
    const motorListo = XashMotor({
      canvas: $('canvas'),
      locateFile: (p) => 'motor/' + p,
      print: anotar,
      printErr: anotar,
      // el entorno se lee una sola vez al arrancar el motor: va antes
      preRun: [(m) => { m.ENV.XASH3D_BASEDIR = '/rwdir'; m.ENV.XASH3D_RODIR = '/rodir'; }],
    });
    // mientras compila el motor ya se bajan el menú y los módulos
    // (los módulos viajan como .wasm, que el hosting comprime; adentro del motor son los .so de siempre)
    const modulos = ['filesystem_stdio.wasm', 'libref_gles3compat.wasm', 'client.wasm', 'menu.wasm', 'server.wasm'].map((n) => traerBinario('motor/' + n));

    await eleccion;
    anticipar(idioma);                                    // (si se eligió el otro)
    const inicio = [...indice.inicio, ...indice.idiomas[idioma].inicio];
    const wads = [...wadsDe(''), ...wadsDe(idioma)];
    const totalInicio = bytesDe(inicio) + wads.reduce((a, w) => a + w.gz, 0);
    const hechoInicio = () => hechoDe(inicio) + wads.reduce((a, w) => a + (deWads.get(w.ruta) || 0), 0);
    M = await motorListo;
    window.M = M;
    const FS = M.FS;
    for (const d of ['/rodir', '/rodir/valve', '/rodir/valve/cl_dlls', '/rodir/valve/dlls', '/rwdir', '/rwdir/valve', '/rwdir/valve_spanish']) FS.mkdir(d);
    // lo que escribe el juego (partidas, config.cfg, controles) queda en IndexedDB; el resto es memoria
    FS.mount(M.IDBFS, {}, '/rwdir/valve');
    await new Promise((ok) => FS.syncfs(true, () => ok()));

    const intervalo = setInterval(() => progresoCarga(hechoInicio() / totalInicio, ''), 150);
    await Promise.all(inicio.map((n) => paquete(n, true)));
    inicio.forEach((n) => { montados.add(n); estado.montado[n] = true; });
    (await Promise.all(wads.map(traerWad))).forEach((datos, i) => FS.writeFile(carpetaDe(wads[i].ruta.split('/')[0]) + '/' + wads[i].ruta.split('/').slice(1).join('/'), datos));
    clearInterval(intervalo);
    progresoCarga(1);

    // los módulos del motor: se precompilan acá porque en el hilo principal no se puede
    // compilar un .wasm grande en el momento del dlopen
    const [fsLib, ref, cliente, menu, servidor, extrasDelIdioma] = await Promise.all([...modulos, traerExtras(idioma)]);
    const precompilar = (dir, nombre, datos) => new Promise((ok, mal) =>
      FS.createPreloadedFile(dir, nombre, new Uint8Array(datos), true, false, ok, () => mal(new Error(nombre))));
    await Promise.all([
      precompilar('/rwdir', 'filesystem_stdio.so', fsLib),          // el motor los busca en su carpeta raíz
      precompilar('/rwdir', 'libref_gles3compat.so', ref),
      precompilar('/rodir/valve/cl_dlls', 'client_emscripten_wasm32.so', cliente),
      precompilar('/rodir/valve/cl_dlls', 'menu_emscripten_wasm32.so', menu),
      precompilar('/rodir/valve/dlls', 'hl_emscripten_wasm32.so', servidor),
    ]);
    FS.writeFile('/rodir/valve/extras.pk3', new Uint8Array(extrasDelIdioma));
    // liblist.gam suelto: el motor reconoce la carpeta del juego por él antes de montar los pk3
    for (const [ruta, texto] of Object.entries(indice.sueltos || {})) FS.writeFile('/rodir/' + ruta, texto);

    M.porteoNecesita = necesita;
    M.porteoMapa = (cmd, m) => necesita(m, `${cmd} ${m}`);
    M.porteoMapaExiste = (m) => !!indice.mapas[String(m).toLowerCase()];
    M.porteoTexto = porteoTexto;
    FS.chdir('/rwdir');
    estado.fase = 'motor';
    // (con ?consola en la dirección, la consola del motor queda habilitada: para las pruebas)
    M.callMain(['-ref', 'gles3compat', '+exec', 'porteo.cfg', ...(idioma === 'es' ? ['-language', 'spanish'] : []),
      ...(/[?&]consola\b/.test(location.search) ? ['-console'] : [])]);
    estado.fase = 'jugando';
    ocultarCarga();
    $('canvas').focus();

    Porteo.controlesHL(hl, {
      idioma,
      aviso: () => { Porteo.aviso(T.guardado); setTimeout(guardar, 1500); },
      pausa: () => {
        for (const t of ['keydown', 'keyup']) {
          const e = new KeyboardEvent(t, { key: 'Escape', code: 'Escape', keyCode: 27, which: 27, bubbles: true });
          Object.defineProperty(e, 'keyCode', { get: () => 27 });
          Object.defineProperty(e, 'which', { get: () => 27 });
          $('canvas').dispatchEvent(e);
        }
      },
    });
    setInterval(guardar, 20000);

    // Cada segundo: el botón del sonido, el del idioma (en el menú principal, fuera de una
    // partida) y, al entrar a un nivel nuevo, lo de los niveles a los que lleva (de fondo).
    let ultimoMapa = '';
    setInterval(() => {
      const e = hl.estado() || {};
      const a = audio();
      const tapado = $('porteo-intro') || cargaDe;
      botonSonido.className = a && a.state !== 'running' && !document.hidden && !tapado ? 'si' : '';
      botonIdioma.className = e.estado !== 4 && e.destino === 2 && !tapado ? 'si' : '';
      if (e.estado === 4 && e.mapa && e.mapa !== ultimoMapa) {
        ultimoMapa = e.mapa;
        const m = e.mapa.toLowerCase();
        if (jugados[jugados.length - 1] !== m) jugados.push(m);
        if (indice.mapas[m]) {
          deFondo(indice.idiomas[idioma].voces);
          indice.mapas[m].vecinos.forEach((v) => deFondo(necesarios(v)));
        }
        // después de entrar a un nivel, el guardado automático del juego queda en el teléfono
        setTimeout(guardar, 4000);
      }
    }, 1000);

    // De fondo mientras se mira el menú: lo de todas las partidas y el primer nivel (para que
    // "Partida nueva" arranque enseguida), y después la charla de los personajes.
    const primero = indice.mapas.c0a0 ? 'c0a0' : Object.keys(indice.mapas)[0];
    const fondo = primero ? necesarios(primero) : [...indice.partida];
    const total = bytesDe(fondo);
    const cartel = setInterval(() => {
      const h = hechoDe(fondo);
      $('hl-fondo').textContent = h < total ? `${T.preparando} ${Math.round(h / total * 100)}%` : '';
      $('hl-fondo').className = h < total && !cargaDe ? 'si' : '';
      if (h >= total) clearInterval(cartel);
    }, 500);
    await deFondo(fondo).catch(() => {});
    deFondo(indice.idiomas[idioma].voces).catch(() => {});
  }

  arrancar().catch(error);
})();
</script>
</body>
</html>
