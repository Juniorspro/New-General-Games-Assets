<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1022">
<title>KUNTUR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#140c18;touch-action:none;overscroll-behavior:none}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden}
#c{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;pointer-events:none;font-family:Georgia,'Times New Roman',serif;color:#3a2a22}
:where(#ui) :where(button){font:inherit;color:inherit;border:0;background:none;cursor:pointer;outline:none}
:root{--vw:1vw;--vh:1vh;--papel:#f4ead6;--crema:#efe2c4;--tinta:#3a2a22;--borde:#f7f3ea;--mano:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive;--gorda:'Arial Black','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
.capa{position:fixed;inset:0;pointer-events:none;z-index:41}
.capa>*{pointer-events:auto}
.capa.oscuro{background:radial-gradient(ellipse at 50% 40%,rgba(20,10,24,.25),rgba(20,10,24,.72));pointer-events:auto}

/* ================= EL TELÓN: un aguayo que se frunce ================= */
.telon{position:fixed;inset:0;z-index:40;pointer-events:none}
.telon .ala{position:absolute;top:0;bottom:0;width:51%;transition:transform 1.25s cubic-bezier(.66,0,.22,1),filter 1.25s;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.26) 0,rgba(0,0,0,.05) 2.2%,rgba(255,255,255,.1) 4%,rgba(0,0,0,.05) 5.8%,rgba(0,0,0,.26) 8%),
    conic-gradient(from 45deg,#f2b632 25%,#c0282e 0 50%,#f2b632 0 75%,#c0282e 0) 0 118px/26px 26px repeat-x,
    conic-gradient(from 45deg,#1f8f6c 25%,#f7f3ea 0 50%,#1f8f6c 0 75%,#f7f3ea 0) 0 340px/20px 20px repeat-x,
    repeating-linear-gradient(180deg,#b8242a 0 44px,#1f8f6c 44px 50px,#f2b632 50px 56px,#6a2f9a 56px 100px,#e8702a 100px 106px,#b8242a 106px 118px,transparent 118px 144px,#2a5aa8 144px 176px,#f7f3ea 176px 180px,#e84a7a 180px 214px,#1f8f6c 214px 220px,#f2b632 220px 226px,#b8242a 226px 262px,#6a2f9a 262px 300px,#f2b632 300px 306px,#b8242a 306px 340px,transparent 340px 360px,#e8702a 360px 400px);
  box-shadow:inset 0 -30px 50px rgba(40,10,20,.35)}
.telon .ala::before{content:'';position:absolute;inset:0;background:var(--grano);mix-blend-mode:multiply;opacity:.5}
.telon .ala::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:26px;background:repeating-linear-gradient(90deg,#f2b632 0 3px,transparent 3px 5px,#c0282e 5px 8px,transparent 8px 11px);-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000 40%,transparent)}
.telon .izq{left:0;transform-origin:0 50%;transform:scaleX(.13) skewY(1.5deg);border-right:3px solid rgba(60,20,20,.35)}
.telon .der{right:0;transform-origin:100% 50%;transform:scaleX(.13) skewY(-1.5deg);border-left:3px solid rgba(60,20,20,.35)}
.telon.cerrado .izq,.telon.cerrado .der{transform:none}
.telon .cenefa{position:absolute;left:0;right:0;top:0;height:max(56px,calc(9 * var(--vh)));
  background:
    conic-gradient(from 45deg,#f7f3ea 25%,#6a2f9a 0 50%,#f7f3ea 0 75%,#6a2f9a 0) 0 18px/22px 22px repeat-x,
    linear-gradient(#8a1c24 0 18px,#f2b632 18px 20px,transparent 20px 40px,#f2b632 40px 42px,#8a1c24 42px);
  -webkit-mask:radial-gradient(circle at 50% 0,#000 62%,transparent 64%) 0 100%/48px 26px repeat-x,linear-gradient(#000,#000) 0 0/100% calc(100% - 16px) no-repeat;
  mask:radial-gradient(circle at 50% 0,#000 62%,transparent 64%) 0 100%/48px 26px repeat-x,linear-gradient(#000,#000) 0 0/100% calc(100% - 16px) no-repeat;
  filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));z-index:2}

/* la hoja que pasa cuando Killa se apaga */
.pasahoja{position:fixed;inset:calc(-4 * var(--vh)) calc(-10 * var(--vw));z-index:35;pointer-events:none;transform:translateX(120%) rotate(4deg);background:var(--grano),var(--papel);background-blend-mode:multiply;box-shadow:-40px 0 60px rgba(60,30,20,.4),inset 60px 0 60px rgba(120,90,60,.25)}
.pasahoja.pasa{animation:pasahoja .95s cubic-bezier(.5,0,.4,1) forwards}
@keyframes pasahoja{0%{transform:translateX(120%) rotate(4deg)}45%,55%{transform:translateX(0) rotate(0)}100%{transform:translateX(-125%) rotate(-5deg)}}

/* ================= EL IDIOMA: cartelitos colgados ================= */
.idioma{position:fixed;inset:0;z-index:41;display:flex;flex-direction:column;align-items:center;pointer-events:auto}
.idioma .cinta{margin-top:max(64px,calc(10 * var(--vh)));font-family:var(--gorda);font-size:clamp(22px,calc(4.2 * var(--vw)),40px);letter-spacing:.35em;padding:.3em .6em .3em .95em;color:#fff4dc;background:linear-gradient(#1f8f6c,#16704f);box-shadow:0 0 0 4px var(--borde),0 8px 14px rgba(0,0,0,.4);transform:rotate(-1.5deg);animation:caeCinta .9s .2s both cubic-bezier(.3,1.6,.5,1)}
.idioma .elegi{margin-top:18px;color:#fff4dc;font-style:italic;font-size:clamp(13px,calc(1.9 * var(--vw)),18px);text-align:center;padding:6px 14px;background:rgba(40,12,20,.55);border-radius:4px;text-shadow:0 1px 0 #000;animation:aparece 1s .6s both}
.idioma .elegi span{opacity:.6;margin:0 .3em}
.idioma .tags{flex:1;display:flex;gap:clamp(8px,calc(3 * var(--vw)),56px);align-items:flex-start;justify-content:center;margin-top:calc(1 * var(--vh))}
.tag{position:relative;margin-top:var(--hilo);width:clamp(92px,calc(27 * var(--vw)),190px);padding:26px 12px 18px;background:var(--grano),var(--crema);background-blend-mode:multiply;border-radius:6px 6px 14px 14px;box-shadow:0 0 0 5px var(--borde),6px 10px 0 rgba(40,20,20,.35);transform-origin:50% calc(-1 * var(--hilo));animation:hamaca 3.6s var(--fase) ease-in-out infinite,caeTag 1s both cubic-bezier(.3,1.5,.5,1);transition:scale .25s,filter .25s;display:flex;flex-direction:column;align-items:center;gap:4px}
.tag::before{content:'';position:absolute;left:50%;bottom:calc(100% - 14px);width:2px;height:calc(var(--hilo) + calc(14 * var(--vh)));background:linear-gradient(#e8e0d0,#c8b898);transform:translateX(-50%)}
.tag .ojal{position:absolute;top:9px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#5a3a2a;box-shadow:0 0 0 3px var(--col)}
.tag b{font-family:var(--gorda);font-size:clamp(17px,calc(2.8 * var(--vw)),30px);color:var(--col)}
.tag i{font-size:clamp(14px,calc(1.8 * var(--vw)),18px);letter-spacing:.06em}
.tag.foco{scale:1.1;animation:hamacaFuerte 1.4s var(--fase) ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(255,220,140,.7))}
.tag.elegido{animation:tironea .7s forwards cubic-bezier(.5,0,.8,.4)}
.tag.sube{animation:subeTag .6s forwards ease-in}
@keyframes hamaca{0%,100%{rotate:-3deg}50%{rotate:3deg}}
@keyframes hamacaFuerte{0%,100%{rotate:-7deg}50%{rotate:7deg}}
@keyframes caeTag{from{translate:0 calc(-70 * var(--vh))}to{translate:0 0}}
@keyframes tironea{0%{translate:0 0;rotate:0deg}25%{translate:0 calc(-3 * var(--vh));rotate:-4deg}100%{translate:0 calc(120 * var(--vh));rotate:28deg}}
@keyframes subeTag{to{translate:0 calc(-110 * var(--vh))}}
@keyframes caeCinta{from{translate:0 calc(-30 * var(--vh));rotate:-12deg}}
@keyframes aparece{from{opacity:0}}

/* ================= EL TÍTULO ================= */
.titulo{position:fixed;inset:0;pointer-events:none}
.logo{position:absolute;left:calc(11 * var(--vw));top:max(64px,calc(11 * var(--vh)));display:flex;gap:.04em;font-family:var(--gorda);font-size:clamp(44px,min(calc(9 * var(--vw)),calc(16 * var(--vh))),140px);line-height:1;perspective:600px}
.logo span{display:block;color:var(--col);-webkit-text-stroke:.09em var(--borde);paint-order:stroke fill;filter:drop-shadow(.03em .06em 0 rgba(60,25,20,.45));transform-origin:50% 100%;rotate:var(--g);animation:despliega .8s var(--d) both cubic-bezier(.3,1.7,.55,1)}
@keyframes despliega{from{transform:rotateX(-90deg)}to{transform:rotateX(0)}}
.lema{position:absolute;left:calc(11.4 * var(--vw));top:calc(max(64px,calc(11 * var(--vh))) + clamp(50px,min(calc(10 * var(--vw)),calc(18 * var(--vh))),160px));max-width:min(560px,calc(86 * var(--vw)));font-style:italic;font-size:clamp(14px,calc(1.7 * var(--vw)),19px);padding:.45em .9em;background:var(--grano),var(--papel);background-blend-mode:multiply;box-shadow:0 0 0 4px var(--borde),4px 6px 0 rgba(40,20,20,.3);rotate:-.8deg;animation:aparece 1s 1s both}
.boletos{position:absolute;right:calc(11 * var(--vw));bottom:max(20px,calc(6 * var(--vh)));display:flex;flex-direction:column;gap:min(12px,calc(1.6 * var(--vh)));width:min(320px,calc(76 * var(--vw)));pointer-events:auto}
.boleto{position:relative;isolation:isolate;display:flex;align-items:center;gap:12px;min-height:min(54px,calc(8.4 * var(--vh)));padding:min(10px,calc(1.4 * var(--vh))) 16px min(10px,calc(1.4 * var(--vh))) 30px;text-align:left;
  rotate:var(--g,0deg);transition:transform .22s cubic-bezier(.3,1.6,.5,1),rotate .22s;animation:entraBoleto .6s var(--d,0s) both cubic-bezier(.3,1.4,.5,1)}
.boleto>.papel,.boleto>.sombra{position:absolute;inset:0;z-index:-1;pointer-events:none;
  -webkit-mask:radial-gradient(circle at 0 7px,transparent 5px,#000 5.5px) 0 0/100% 14px repeat-y;mask:radial-gradient(circle at 0 7px,transparent 5px,#000 5.5px) 0 0/100% 14px repeat-y}
.boleto>.papel{background:var(--grano),var(--crema);background-blend-mode:multiply;box-shadow:inset 8px 0 0 var(--col),inset 0 0 0 2px rgba(90,60,40,.18);transition:background-color .2s}
.boleto>.sombra{z-index:-2;background:rgba(40,20,20,.38);transform:translate(4px,6px);transition:transform .22s}
.boleto.foco>.papel{background-color:#fff8e6}
.boleto.foco>.sombra{transform:translate(9px,10px)}
.boleto::after{content:'';position:absolute;left:26px;right:10px;top:6px;bottom:6px;border:1.5px dashed rgba(90,60,40,.35);border-radius:3px;pointer-events:none}
.boleto .num{font-family:'Courier New',monospace;font-size:11px;color:#b8242a;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.08em;opacity:.8}
.boleto .txt{flex:1;font-size:clamp(15px,calc(1.7 * var(--vw)),19px);letter-spacing:.04em;text-transform:uppercase;font-weight:bold}
.boleto .sello{position:absolute;right:14px;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:2.5px solid rgba(184,36,42,.8);color:rgba(184,36,42,.85);font:bold 8px/42px 'Courier New',monospace;text-align:center;letter-spacing:.05em;opacity:0;scale:1.7;rotate:-18deg;transition:opacity .15s,scale .2s cubic-bezier(.3,1.8,.5,1)}
.boleto.foco{transform:translateX(-16px);rotate:0deg}
.boleto.foco .sello{opacity:.9;scale:1}
.boleto.sellado{animation:sellar .5s}
.boleto.chico{min-height:44px;width:auto;padding:8px 18px 8px 28px;animation:none}
.boleto.chico .txt{text-align:center}
@keyframes entraBoleto{from{transform:translateX(120%);rotate:8deg}}
@keyframes sellar{30%{transform:translateX(-16px) scale(.95)}60%{transform:translateX(-16px) scale(1.04)}}
.no{animation:no .35s}
@keyframes no{25%{translate:-8px 0}50%{translate:7px 0}75%{translate:-4px 0}}

/* ================= los paneles: mapa, cuaderno, tablero ================= */
.panel{position:fixed;left:50%;top:50%;width:min(900px,calc(92 * var(--vw)));max-height:calc(88 * var(--vh));translate:-50% -50%;padding:clamp(18px,calc(3 * var(--vw)),34px);background:var(--grano),var(--papel);background-blend-mode:multiply;box-shadow:0 0 0 6px var(--borde),10px 14px 0 rgba(30,15,20,.45);animation:despliegaPanel .6s both cubic-bezier(.3,1.4,.5,1);display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:auto}
@keyframes despliegaPanel{from{transform:perspective(900px) rotateX(-80deg);opacity:0}}
.panel h2{font-family:var(--gorda);font-size:clamp(22px,calc(3.4 * var(--vw)),36px);color:#b8242a;letter-spacing:.04em;text-align:center}
.panel h2 small{display:block;font-family:Georgia,serif;font-size:.45em;color:var(--tinta);letter-spacing:0;font-style:italic}
.mapa{background:linear-gradient(90deg,transparent 49.6%,rgba(90,60,40,.12) 50%,transparent 50.4%),linear-gradient(transparent 49.4%,rgba(90,60,40,.1) 50%,transparent 50.6%),var(--grano),#efdcb4;background-blend-mode:normal,normal,multiply,normal}
.plano{position:relative;width:100%;height:clamp(200px,calc(34 * var(--vh)),330px)}
.plano svg{position:absolute;inset:0;width:100%;height:100%}
.plano path{fill:none;stroke:#8a4a2a;stroke-width:.7;stroke-dasharray:1.6 1.4;vector-effect:non-scaling-stroke;stroke-width:3}
.parada{position:absolute;translate:-50% -50%;width:clamp(46px,calc(6.5 * var(--vw)),66px);aspect-ratio:1;border-radius:50%;background:var(--grano),var(--col);background-blend-mode:multiply;box-shadow:0 0 0 5px var(--borde),4px 6px 0 rgba(40,20,20,.35);color:#fff;font-family:var(--gorda);font-size:clamp(18px,calc(2.4 * var(--vw)),26px);transition:scale .2s cubic-bezier(.3,1.8,.5,1)}
.parada.cerrada{background:#a89a88;color:#e8e0d0;filter:grayscale(1)}
.parada.cerrada span{opacity:.6}
.parada.foco{scale:1.25;z-index:2;box-shadow:0 0 0 5px var(--borde),0 0 0 11px rgba(255,210,120,.6),4px 6px 0 rgba(40,20,20,.35)}
.lugar{min-height:3.4em;text-align:center}
.lugar small{display:block;font-style:italic;font-size:14px;opacity:.75}
.lugar b{font-size:clamp(18px,calc(2.4 * var(--vw)),26px)}
.cuaderno{background:var(--grano),#e8d6b0;background-blend-mode:multiply}
.hojas{display:flex;width:100%;gap:0;perspective:1400px}
.pagina{flex:1;min-height:clamp(210px,calc(38 * var(--vh)),340px);padding:24px 26px 20px 44px;font-family:var(--mano);font-size:clamp(14px,calc(1.7 * var(--vw)),19px);line-height:1.9;background:linear-gradient(90deg,transparent 30px,rgba(200,60,60,.45) 30px 32px,transparent 32px),repeating-linear-gradient(transparent 0 calc(1.9em - 1px),rgba(60,90,160,.28) calc(1.9em - 1px) 1.9em),#fbf6ea;box-shadow:inset 0 0 30px rgba(120,90,60,.18)}
.pagina:first-child{box-shadow:inset -18px 0 24px -12px rgba(90,60,40,.35)}
.pagina:last-child{box-shadow:inset 18px 0 24px -12px rgba(90,60,40,.35)}
.pagina em{display:block;font-style:normal;font-family:var(--gorda);color:#b8242a;font-size:.9em;margin-bottom:.2em}
.pagina .falta{color:#a89a88;text-align:center}
.pagina .falta.chica{font-size:.8em}
.hojas.dobla .pagina:last-child,.hojas.doblaAtras .pagina:first-child{animation:doblar .5s both}
@keyframes doblar{from{transform:rotateY(-70deg);opacity:.3}}
.nav{display:flex;gap:12px}
.tablero{background:var(--grano),#e4d4b4;background-blend-mode:multiply;width:min(560px,calc(92 * var(--vw)));overflow-y:auto;touch-action:pan-y}
.fila{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 18px;background:rgba(255,250,236,.7);box-shadow:0 0 0 3px var(--borde);font-size:clamp(15px,calc(1.8 * var(--vw)),18px);transition:transform .2s}
.fila .v{font-weight:bold;color:#b8242a}
.fila .v b{display:inline-block;min-width:5.5em;text-align:center;color:var(--tinta)}
.fila.foco{transform:scale(1.03);background:#fff8e4;box-shadow:0 0 0 3px var(--borde),0 0 0 7px rgba(242,182,50,.6)}
.teclas{font-size:13px;font-style:italic;opacity:.75;text-align:center}
.barra{display:inline-flex;gap:3px;vertical-align:middle}
.barra i{width:9px;height:14px;background:#d8c8a8}
.barra i.on{background:#c0282e}
.barra i.on:nth-child(3n+2){background:#f2b632}.barra i.on:nth-child(3n){background:#1f8f6c}

/* ================= pausa y cartel ================= */
.pausa{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
.pausa .boletos{position:static;width:min(340px,calc(86 * var(--vw)))}
.cartel{position:fixed;left:50%;top:max(64px,calc(11 * var(--vh)));z-index:30;min-width:min(440px,calc(86 * var(--vw)));padding:18px 34px 20px;text-align:center;background:var(--grano),var(--papel);background-blend-mode:multiply;box-shadow:0 0 0 6px var(--borde),inset 0 -6px 0 var(--col),8px 12px 0 rgba(30,15,20,.4);translate:-50% 0;transform-origin:50% calc(-30 * var(--vh));animation:bajaCartel 1.1s both cubic-bezier(.3,1.5,.5,1),hamacaCartel 3s 1.1s ease-in-out infinite;pointer-events:none}
.cartel::before,.cartel::after{content:'';position:absolute;bottom:100%;width:2px;height:calc(40 * var(--vh));background:#d8ccb4}
.cartel::before{left:18%}.cartel::after{right:18%}
.cartel small{display:block;font-style:italic;font-size:clamp(13px,calc(1.6 * var(--vw)),17px);opacity:.8}
.cartel b{display:block;font-family:var(--gorda);font-size:clamp(24px,calc(4.2 * var(--vw)),46px);color:var(--col);line-height:1.1;margin-top:4px}
.cartel em{display:block;margin-top:6px;font-size:14px}
.cartel.quieto{position:relative;left:auto;top:auto;animation:bajaCartel .7s both cubic-bezier(.3,1.5,.5,1)}
.cartel.sube{animation:subeCartel .7s forwards ease-in}
@keyframes bajaCartel{from{transform:translateY(calc(-60 * var(--vh))) rotate(-6deg)}}
@keyframes subeCartel{to{transform:translateY(calc(-70 * var(--vh)))}}
@keyframes hamacaCartel{0%,100%{rotate:-1deg}50%{rotate:1deg}}

/* ================= la narración ================= */
.narra{position:fixed;inset:0;z-index:32;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,rgba(20,10,20,.35),rgba(20,10,20,.8));pointer-events:auto;animation:aparece .6s both}
.narra.fuera{animation:desaparece .6s forwards}
.narra .hoja{position:relative;width:min(640px,calc(88 * var(--vw)));padding:clamp(24px,calc(4 * var(--vw)),44px) clamp(24px,calc(5 * var(--vw)),56px);background:var(--grano),#f1e4c8;background-blend-mode:multiply;box-shadow:0 0 0 6px var(--borde),12px 16px 0 rgba(0,0,0,.35);rotate:-.6deg;animation:despliegaPanel .7s both cubic-bezier(.3,1.3,.5,1)}
.narra p{font-size:clamp(16px,calc(2.1 * var(--vw)),22px);line-height:1.6;font-style:italic;margin:.2em 0;opacity:0;transform:translateY(8px);transition:opacity .9s,transform .9s}
.narra p.ve{opacity:1;transform:none}
.narra .seguir{margin-top:18px;text-align:right;font-size:13px;opacity:0;transition:opacity .6s}
.narra .seguir.ve{opacity:.65;animation:late 1.4s infinite}
.narra.final .hoja{background:var(--grano),#fdf3dc}
@keyframes desaparece{to{opacity:0}}
@keyframes late{50%{opacity:.25}}

/* ================= los globitos ================= */
.globo{position:fixed;left:0;top:0;z-index:25;max-width:min(380px,calc(78 * var(--vw)));padding:18px 18px 14px;background:var(--grano),#fffaf0;background-blend-mode:multiply;border-radius:22px 24px 20px 26px;box-shadow:0 0 0 4px var(--borde),0 0 0 6px rgba(90,60,40,.18),5px 8px 0 rgba(30,15,20,.35);opacity:0;scale:.6;transform-origin:var(--cola,30px) 100%;transition:opacity .18s,scale .3s cubic-bezier(.3,1.8,.5,1);pointer-events:none}
.globo.ve{opacity:1;scale:1}
.globo.fuera{opacity:0;scale:.8}
.globo::after{content:'';position:absolute;top:100%;left:var(--cola,30px);width:22px;height:20px;margin-left:-11px;background:#fffaf0;clip-path:polygon(0 0,100% 0,30% 100%);filter:drop-shadow(0 3px 0 rgba(90,60,40,.2))}
.globo .nombre{position:absolute;left:14px;top:-13px;padding:3px 10px;font-size:13px;font-weight:bold;letter-spacing:.05em;color:#fff;background:var(--col);box-shadow:0 0 0 3px var(--borde);rotate:-2deg}
.globo p{font-size:clamp(15px,calc(1.8 * var(--vw)),18px);line-height:1.45;min-height:1.4em}
.globo .mas{position:absolute;right:12px;bottom:4px;font-size:11px;font-style:normal;color:var(--col);opacity:0}
.globo.listo .mas{opacity:1;animation:mas .8s infinite}
.globo.grito{border-radius:8px;padding:14px 16px 10px;rotate:-1deg}
.globo.grito p{font-weight:bold}
@keyframes mas{50%{translate:0 3px}}

/* ================= ayudas y avisos ================= */
.nota{position:fixed;left:50%;bottom:max(20px,calc(5 * var(--vh)));z-index:22;max-width:min(520px,calc(86 * var(--vw)));padding:14px 22px 12px 26px;font-family:var(--mano);font-size:clamp(14px,calc(1.7 * var(--vw)),18px);background:#fff3a8;box-shadow:3px 5px 0 rgba(30,15,20,.3);translate:-50% 160%;rotate:-1.2deg;transition:translate .5s cubic-bezier(.3,1.4,.5,1)}
.nota.ve{translate:-50% 0}
.nota i{position:absolute;left:50%;top:-8px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a8a,#b8242a);box-shadow:1px 2px 0 rgba(0,0,0,.3)}
.aviso{position:fixed;left:50%;top:max(20px,calc(4 * var(--vh)));z-index:22;padding:8px 20px;font-style:italic;color:#fff4dc;background:#1f8f6c;box-shadow:0 0 0 3px var(--borde),3px 5px 0 rgba(30,15,20,.3);translate:-50% -200%;transition:translate .45s cubic-bezier(.3,1.5,.5,1)}
.aviso.ve{translate:-50% 0}
.coplaCard{position:fixed;left:50%;top:max(70px,calc(12 * var(--vh)));z-index:23;width:min(360px,calc(84 * var(--vw)));padding:18px 24px 14px;font-family:var(--mano);text-align:center;background:var(--grano),#fffaf0;background-blend-mode:multiply;box-shadow:0 0 0 5px var(--borde),inset 0 5px 0 #f2b632,6px 9px 0 rgba(30,15,20,.35);translate:-50% 0;transform-origin:50% 0;transform:perspective(700px) rotateX(-95deg);opacity:0;transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.coplaCard.ve{transform:none;opacity:1}
.coplaCard small{display:block;font-family:Georgia,serif;font-style:italic;color:#b8242a;margin-bottom:6px}
.coplaCard p{font-size:clamp(15px,calc(1.8 * var(--vw)),18px);line-height:1.55}
.coplaCard em{display:block;margin-top:8px;font-family:Georgia,serif;font-size:12px;opacity:.7}
.contador{position:fixed;left:max(14px,calc(2 * var(--vw)));top:max(14px,calc(2 * var(--vh)));z-index:22;display:flex;align-items:baseline;gap:4px;padding:6px 14px 6px 10px;background:var(--grano),var(--papel);background-blend-mode:multiply;box-shadow:0 0 0 3px var(--borde),3px 4px 0 rgba(30,15,20,.3);translate:0 -160%;transition:translate .4s cubic-bezier(.3,1.5,.5,1)}
.contador.ve{translate:0 0}
.contador i{width:18px;height:18px;align-self:center;background:conic-gradient(from 45deg,#f2b632 25%,#c0282e 0 50%,#f2b632 0 75%,#c0282e 0) 0 0/9px 9px;border-radius:3px}
.contador b{font-family:var(--gorda);font-size:20px;color:#b8242a}
.etiqueta{position:fixed;left:0;top:0;z-index:21;padding:3px 10px;font-size:13px;font-weight:bold;white-space:nowrap;background:#fffaf0;box-shadow:0 0 0 2.5px var(--borde),2px 3px 0 rgba(30,15,20,.3);border-radius:4px;opacity:0;transition:opacity .2s}
.etiqueta.ve{opacity:1}
.etiqueta kbd{font:bold 12px 'Courier New',monospace;padding:0 5px;margin-right:5px;background:#3a2a22;color:#fff4dc;border-radius:3px}

/* ================= los créditos ================= */
.creditos{position:fixed;inset:0;z-index:33;display:flex;align-items:center;justify-content:center;background:rgba(20,10,20,.55);opacity:0;transition:opacity .8s;pointer-events:auto}
.creditos.ve{opacity:1}
.creditos.fuera{opacity:0}
.rollo{width:min(560px,calc(88 * var(--vw)));padding:34px 40px;text-align:center;background:var(--grano),#f4e6c6;background-blend-mode:multiply;box-shadow:0 0 0 6px var(--borde),inset 0 18px 16px -10px rgba(90,60,40,.4),inset 0 -18px 16px -10px rgba(90,60,40,.4),10px 14px 0 rgba(0,0,0,.35);animation:desenrolla 1.4s both cubic-bezier(.3,1.2,.5,1)}
.rollo p{margin:.7em 0;font-size:clamp(14px,calc(1.8 * var(--vw)),18px);font-style:italic;opacity:0;animation:aparece 1s both}
.rollo p:nth-child(1){animation-delay:.8s}.rollo p:nth-child(2){animation-delay:3s}.rollo p:nth-child(3){animation-delay:5.5s}.rollo p:nth-child(4){animation-delay:8s}.rollo p:nth-child(5){animation-delay:10.5s}.rollo p:nth-child(6){animation-delay:13s}.rollo p:nth-child(7){animation-delay:15.5s}
.rollo p{animation-fill-mode:both}
.rollo p.grande{font-family:var(--gorda);font-style:normal;font-size:clamp(34px,calc(6 * var(--vw)),60px);color:#b8242a;-webkit-text-stroke:.06em var(--borde);paint-order:stroke fill}
.rollo p.fin{font-family:var(--gorda);font-style:normal;color:#1f8f6c}
@keyframes desenrolla{from{clip-path:inset(48% 0 48% 0)}to{clip-path:inset(0 0 0 0)}}

/* ================= los controles de dedo ================= */
.tactil{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .4s}
.tactil.ve{opacity:1}
.tactil.ve>*{pointer-events:auto}
/* cada control lo pone ui.acomodar (left, top y tamaño); acá solo el dibujo */
.tactil>.zonaPal,.tactil>.bSalto,.tactil>.bAccion,.tactil>.bPausa{opacity:var(--alfa,.85);transition:opacity .15s}
.tactil>.on{opacity:max(var(--alfa,.85),.92)}
.zonaPal{position:absolute;left:0;top:0}
.zonaPal .aro{position:absolute;left:0;top:0;width:88px;height:88px;border-radius:50%;background:conic-gradient(from 45deg,rgba(242,182,50,.35) 25%,rgba(192,40,46,.35) 0 50%,rgba(242,182,50,.35) 0 75%,rgba(192,40,46,.35) 0) 0 0/16px 16px;box-shadow:0 0 0 4px rgba(247,243,234,.7);transition:opacity .2s;opacity:.55}
.zonaPal .bola{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:#f7f3ea;box-shadow:0 0 0 3px #c0282e,2px 4px 0 rgba(0,0,0,.3)}
.zonaPal.on .aro{opacity:.9}
.aro .fl{display:none}
/* la cruz: dos tiras tejidas cruzadas, con una flecha en cada brazo que se prende al apretarlo */
.aro .brazo{display:none}
.tactil.cruz .aro{border-radius:0;box-shadow:none;background:none;opacity:.85}
.tactil.cruz .aro .brazo{display:block;position:absolute;background:conic-gradient(from 45deg,#f2b632 25%,#c0282e 0 50%,#f2b632 0 75%,#c0282e 0) 0 0/12px 12px;box-shadow:0 0 0 3px rgba(247,243,234,.8),inset 0 0 0 40px rgba(58,42,34,.28);border-radius:6px}
.aro .brazo.v{left:33%;right:33%;top:0;bottom:0}
.aro .brazo.h{top:33%;bottom:33%;left:0;right:0}
.tactil.cruz .bola{display:none}
.tactil.cruz .aro .fl{display:block;position:absolute;width:17%;height:17%;background:#f7f3ea;transition:background .1s,scale .1s}
.aro .fl.i{left:5%;top:41.5%;clip-path:polygon(100% 0,100% 100%,0 50%)}
.aro .fl.d{right:5%;top:41.5%;clip-path:polygon(0 0,0 100%,100% 50%)}
.aro .fl.a{top:5%;left:41.5%;clip-path:polygon(0 100%,100% 100%,50% 0)}
.aro .fl.b{bottom:5%;left:41.5%;clip-path:polygon(0 0,100% 0,50% 100%)}
.zonaPal.p-izq .fl.i,.zonaPal.p-der .fl.d,.zonaPal.p-arr .fl.a,.zonaPal.p-aba .fl.b{background:#f2b632;scale:1.35}
.bSalto,.bAccion{position:absolute;left:0;top:0;width:76px;height:76px;border-radius:50%;background:rgba(247,243,234,.82);box-shadow:0 0 0 4px rgba(192,40,46,.6),3px 5px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.bAccion{width:64px;height:64px;box-shadow:0 0 0 4px rgba(31,143,108,.6),3px 5px 0 rgba(0,0,0,.25)}
.bSalto svg,.bAccion svg{width:58%;height:58%;fill:#3a2a22}
.bSalto svg .c{fill:none;stroke:#f7f3ea;stroke-width:1.6}
.bSalto.on,.bAccion.on{scale:.9;background:#fff}
.bPausa{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;background:rgba(247,243,234,.8);box-shadow:0 0 0 3px rgba(106,47,154,.55);display:flex;gap:13%;align-items:center;justify-content:center}
.bPausa i{width:13%;height:39%;background:#3a2a22;border-radius:2px}

/* acomodar los controles: cada uno con su línea de "cortar acá" y su etiqueta */
.tactil.editando{z-index:42;pointer-events:auto;opacity:1}
.tactil.editando>.zonaPal,.tactil.editando>[data-control]{opacity:max(var(--alfa,.85),.5)}
.tactil.editando .zonaPal{outline:2px dashed rgba(247,243,234,.3);outline-offset:-3px;background:rgba(247,243,234,.05)}
.tactil.editando .aro{opacity:.95}
.tactil.editando .bola{pointer-events:none}
.tactil.editando [data-control]{cursor:grab;outline:2px dashed rgba(247,243,234,.85);outline-offset:6px}
.tactil.editando [data-control].elegido{outline:3px solid #f2b632;outline-offset:7px;filter:drop-shadow(0 0 10px rgba(242,182,50,.75))}
.tactil.editando [data-control]::after{content:attr(data-nombre);position:absolute;left:50%;top:100%;translate:-50% 12px;padding:1px 8px;font:bold 11px/1.4 Georgia,serif;color:var(--tinta);background:#fffaf0;box-shadow:0 0 0 2px var(--borde),2px 3px 0 rgba(30,15,20,.3);border-radius:3px;white-space:nowrap;pointer-events:none}
.tactil.editando .bPausa::after{top:auto;bottom:100%;translate:-50% -12px}
.acomoda{position:absolute;left:50%;top:calc(max(56px,calc(9 * var(--vh))) + 6px);translate:-50% 0;rotate:-.6deg;width:min(640px,calc(100% - 13.4 * var(--vw) - 130px));padding:10px 14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--grano),var(--papel);background-blend-mode:multiply;box-shadow:0 0 0 4px var(--borde),inset 0 5px 0 #1f8f6c,6px 9px 0 rgba(30,15,20,.4);transform-origin:50% 0;animation:despliegaPanel .5s both cubic-bezier(.3,1.4,.5,1);transition:opacity .2s}
.acomoda.lejos{opacity:.15;pointer-events:none}
.acomoda .tit{font-family:var(--gorda);font-size:18px;color:#b8242a;letter-spacing:.03em}
.acomoda small{font-style:italic;font-size:12px;opacity:.8;text-align:center}
.acomoda .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 11px;min-height:34px;font-size:13px;background:#fffaf0;box-shadow:0 0 0 2.5px var(--borde),2px 3px 0 rgba(30,15,20,.3);border-radius:4px;transition:scale .15s}
.chip i{font-style:normal;opacity:.7}
.chip em{font-style:normal;font-weight:bold;color:#b8242a}
.chip.par{padding:0;gap:0}
.chip.par span{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:2px 2px;min-width:7.5em}
.chip.par span i{font-size:10px}
.chip.par button{width:34px;height:34px;font:bold 20px var(--gorda);color:var(--tinta);border-radius:4px}
.chip.listo{background:#1f8f6c;color:#fff4dc;font-weight:bold;padding:4px 16px}
.acomoda .foco{scale:1.06;box-shadow:0 0 0 2.5px var(--borde),0 0 0 5px rgba(242,182,50,.85)}
.chip.par button.foco{background:#fff3c4}

/* pantallas angostas: el menú abajo, el logo más chico */
/* pantallas angostas (una ventana parada; el teléfono se gira y no entra acá) */
html.angosta .logo{left:50%;translate:-50% 0}
html.angosta .lema{left:50%;translate:-50% 0;text-align:center}
html.angosta .boletos{right:50%;translate:50% 0}
html.angosta .hojas{flex-direction:column}

/* pantallas bajitas (el teléfono acostado): todo un poco más apretado */
html.bajita{--corto:.35}
html.bajita .idioma .cinta{margin-top:max(40px,calc(9 * var(--vh)));font-size:20px;padding:.2em .5em .2em .8em}
html.bajita .idioma .elegi{margin-top:8px;font-size:12px;padding:4px 10px}
html.bajita .tag{padding:18px 10px 10px;width:clamp(92px,calc(17 * var(--vw)),150px)}
html.bajita .tag b{font-size:18px}
html.bajita .tag i{font-size:13px}
html.bajita .logo{top:max(52px,calc(10 * var(--vh)));font-size:clamp(36px,min(calc(7 * var(--vw)),calc(13 * var(--vh))),90px)}
html.bajita .lema{top:calc(max(52px,calc(10 * var(--vh))) + clamp(40px,min(calc(7 * var(--vw)),calc(14 * var(--vh))),96px));max-width:min(360px,calc(40 * var(--vw)));font-size:13px}
html.bajita .boletos{width:min(250px,calc(34 * var(--vw)));gap:5px;bottom:12px}
html.bajita .boleto{min-height:34px;padding:4px 12px 4px 26px}
html.bajita .boleto .txt{font-size:13px}
html.bajita .boleto .num{font-size:9px}
html.bajita .boleto .sello{width:34px;height:34px;margin-top:-17px;line-height:30px;font-size:6px}
html.bajita .cartel{padding:10px 22px 12px;top:max(48px,calc(9 * var(--vh)))}
html.bajita .cartel b{font-size:clamp(20px,calc(3.4 * var(--vw)),30px)}
html.bajita .panel{padding:12px 18px;gap:8px;max-height:calc(94 * var(--vh))}
html.bajita .fila{padding:6px 14px;font-size:14px}
html.bajita .plano{height:calc(46 * var(--vh))}
html.bajita .pagina{min-height:calc(48 * var(--vh));padding:12px 18px 10px 40px;font-size:14px;line-height:1.7}
html.bajita .narra .hoja{padding:18px 30px}
html.bajita .narra p{font-size:15px}
html.bajita .globo{max-width:min(320px,calc(48 * var(--vw)));padding:14px 14px 10px}
html.bajita .globo p{font-size:14px}
html.bajita .acomoda{padding:6px 12px 8px;gap:4px}
html.bajita .acomoda .tit{font-size:15px}
html.bajita .acomoda small{font-size:11px}
html.bajita .chip{min-height:30px;font-size:12px;padding:3px 9px}
html.bajita .chip.par button{width:30px;height:30px}
html.bajita .nota{font-size:13px;padding:8px 16px 8px 20px;bottom:10px}

</style>

s:"Tom\xE1s",coquena:"Coquena",apu:"Apu"},charlas:{inicio:[["abuela","Killa... \xBFescuch\xE1s? Algo llora afuera, en el corral."],["killa","Voy a ver, abuela."]],afuera:[["killa","\xA1Qu\xE9 granizo! Parecen piedras."]],corral:[["killa","El llanto viene de m\xE1s all\xE1 del corral."]],pichon:[["killa","\xA1Un pich\xF3n! Est\xE1s helado..."],["killa","Ven\xED, te llevo adentro."]],casa:[["abuela","Es un pich\xF3n de c\xF3ndor. La tormenta lo tir\xF3 del nido."],["killa","\xBFDe qu\xE9 nido?"],["abuela","De all\xE1 arriba, del Nevado de Cha\xF1i. Los c\xF3ndores anidan donde nadie llega."],["abuela","Un c\xF3ndor que no vuelve a su monta\xF1a no aprende a volar, m'hija."],["killa","Entonces lo llevo yo."],["abuela","Es muy lejos, Killa..."],["abuela","...Pero tu mam\xE1 hubiera hecho lo mismo."],["killa","Se va a llamar Apu."]],rosa:[["rosa","\xBFA d\xF3nde vas tan temprano, Killa?"],["killa","A llevar a Apu a su casa, en el Nevado."],["rosa","\xA1Uy, qu\xE9 lejos! Segu\xED las apachetas, changuita. En cada una dej\xE1 una piedra: la Pachamama te cuida el camino."],["rosa","Y si ves una copla colgada por ah\xED, guardala. Tu abuela las sabe todas."]],rosa2:[["rosa","\xA1And\xE1, and\xE1! Y saludame a los c\xF3ndores."]],piedra:[["killa","Esa pared es muy alta... Si empujo la piedra, capaz llego."]],mirador:[["killa","Mir\xE1, Apu. Siete colores. La abuela dice que el sol los pinta de a uno, despacito."],["apu","\xA1P\xEDo!"]],cuesta:[["killa","All\xE1 arriba el mundo se pone blanco. Vamos, Apu."]],ceferino:[["ceferino","\xA1Epa! \xBFSola por las Salinas?"],["killa","Con Apu."],["ceferino","Ah, bien acompa\xF1ada entonces."],["ceferino","Escuch\xE1: cuando sopla fuerte, agachate o ponete atr\xE1s de un bloque de sal. Si no, el viento te tira a la salmuera."],["ceferino","Y hacia el oeste pasa el tren. Ese sube hasta las nubes."]],ceferino2:[["ceferino","Agachate con el viento, gurisa. Como los juncos."]],aleteo:[["killa","Es muy ancho para saltar..."],["apu","\xA1P\xEDo, p\xEDo!"],["killa","\xA1Apu! \xA1Aleteaste! \xA1Me levantaste!"]],estacion:[["killa","\xA1El tren! \xA1Corr\xE9, Apu!"]],arranca:[["killa","\xA1Arranc\xF3! Tengo que llegar adelante, a la locomotora."]],viaducto:[["killa","Estamos arriba de las nubes, Apu... No mires para abajo."]],tunel:[["killa","\xA1Un t\xFAnel! Agachate o metete en el vag\xF3n."]],tomas:[["tomas","\xA1Nena! \xBFQu\xE9 hac\xE9s arriba del tren?"],["killa","Voy al Nevado de Cha\xF1i. Tengo que llevar a Apu."],["tomas","\xBFY ese? \xBFEs un c\xF3ndor?"],["killa","Todav\xEDa no. Pero va a ser."],["tomas","Mir\xE1 vos... Yo tambi\xE9n quer\xEDa ir lejos cuando ten\xEDa tu edad."],["tomas","Tom\xE1 este farol. De noche, en la Puna, hace falta."],["tomas","El tren para en la \xFAltima estaci\xF3n. De ah\xED, segu\xED la monta\xF1a."]],tomas2:[["tomas","\xA1Buen viaje, nena! Y agarrate fuerte."]],planeo:[["killa","No hay por d\xF3nde bajar..."],["apu","\xA1Kii\xE1!"],["killa","\xA1Apu, me llev\xE1s! \xA1Est\xE1s enorme!"]],llamar:[["killa","Una tranquera cerrada... La traba est\xE1 all\xE1 arriba."],["killa","Apu, \xA1and\xE1!"]],puma:[["killa","\xA1Un puma! \xA1Corr\xE9, Apu!"]],coquena:[["coquena","Nadie caza en mi Puna."],["killa","\xBFQui\xE9n sos?"],["coquena","Soy Coquena. Cuido a las vicu\xF1as... y a los que caminan de noche."],["coquena","Tu pich\xF3n ya casi vuela, Killa. Ma\xF1ana, en la cumbre, vas a tener que soltarlo."],["killa","\xBFY si no quiere irse?"],["coquena","Los que queremos no se van. Suben."]],coquena2:[["coquena","Segu\xED para arriba. El Viento Blanco no espera a nadie."]],tormenta:[["killa","\xA1Viene el Viento Blanco! \xA1Corr\xE9!"]],escapa:[["killa","Pas\xF3... \xBFApu? \xBFEst\xE1s?"],["apu","\xA1Kiii\xE1!"]],cumbre:[["killa","Llegamos, Apu. Esta es tu casa."],["killa","Tom\xE1. Era de mam\xE1."],["killa","Dicen que ustedes llevan los mensajes de la tierra al cielo."],["killa","Decile que estamos bien. Que la abuela todav\xEDa canta sus coplas."],["killa","\xA1Vol\xE1, Apu!"]],epilogo:[["abuela","\xBFY? \xBFLleg\xF3?"],["killa","Lleg\xF3, abuela."],["abuela","Mir\xE1 para arriba, m'hija."],["killa","...Gracias, Apu."]],final:["Dicen que el c\xF3ndor lleva los mensajes de la tierra al cielo.","Yo s\xE9 que es verdad."]},coplas:[["Siete colores tiene el cerro,","siete penas tengo yo;","cada vez que el sol lo pinta","se me pinta el coraz\xF3n."],["Pachamama, madre tierra,","te dejo mi piedrecita;","cuidame bien el camino,","que llevo un alma chiquita."],["El card\xF3n de la quebrada","tiene espinas y da flor;","as\xED es la gente del cerro:","dura afuera y puro amor."],["Blanca la sal de la puna,","blanca la luna tambi\xE9n;","si me pierdo en tanto blanco,","que me encuentre tu querer."],["El viento de las salinas","me quiso llevar volando;","yo me agach\xE9 como el junco","y lo dej\xE9 pasar cantando."],["Salinero, salinero,","\xBFqu\xE9 cort\xE1s con tu pala?","\u2014Corto pedazos de un mar","que se durmi\xF3 en la llanada."],["Tren que sub\xEDs a las nubes","con tu humo de algod\xF3n,","llevame hasta la monta\xF1a","y traeme de vuelta al sol."],["Por el viaducto del cielo","pasa el tren y pasa el tiempo;","el que mira para abajo","se marea con el viento."],["Foguista de la locomotora,","\xBFqu\xE9 sue\xF1o ech\xE1s al carb\xF3n?","\u2014Echo el de llegar m\xE1s lejos,","y lo quema el coraz\xF3n."],["De noche la Puna es cielo,","las estrellas llegan al pie;","si una se me cae al suelo,","la guardo para despu\xE9s."],["Coquena cuida las vicu\xF1as","con su poncho de vell\xF3n;","al que caza sin permiso","le esconde el camino y el sol."],["Farolito de la noche,","no te apagues, por favor,","que el puma anda por la loma","y yo le tengo temor."],["El Viento Blanco no avisa,","baja del cerro a buscar;","abraz\xE1 fuerte a los tuyos,","que ya va a escampar."],["En la cumbre del Nevado","el sol se asoma primero;","por eso nacen los c\xF3ndores","donde se toca el cielo."],["C\xF3ndor, c\xF3ndor que te vas","volando para el Nevado,","llevale este mensajito","a quien est\xE1 del otro lado."]],creditos:["KUNTUR","Un juego de papel, hecho a mano","Historia, dibujos, m\xFAsica y c\xF3digo: Claude, para el Nuevo General de Juegos","Inspirado en Purmamarca, las Salinas Grandes, el Tren a las Nubes, la Puna y el Nevado de Cha\xF1i (Jujuy y Salta, Argentina)","Las coplas son inventadas, a la manera de las de la Quebrada","Gracias por jugar"]},en:{ui:{elegi:"Choose your language",lema:"A girl, a condor chick and the mountain waiting for it.",empezar:"Start the journey",seguir:"Continue the journey",nuevo:"New journey",nuevoSeguro:"Start over? Tap again",capitulos:"Chapters",coplas:"Coplas",opciones:"Options",creditos:"Credits",volver:"Back",pausa:"Paused",continuar:"Continue",salir:"Back to the theater",reintentar:"Back to the apacheta",idioma:"Language",musica:"Music",efectos:"Sound effects",calidad:"Quality",temblor:"Camera shake",si:"On",no:"Off",alta:"High",media:"Medium",baja:"Low",capitulo:"Chapter {0}",prologo:"Prologue",epilogo:"Epilogue",cerrado:"You have not got here yet",coplasDe:"{0} of {1} coplas",copla:"You found a copla!",apacheta:"You left a stone on the apacheta",tocar:"Tap to continue",saltear:"Skip",fin:"The end",gracias:"Thank you for playing",hablar:"talk",agarrar:"grab",abrir:"open",llamarApu:"Go, Apu!",falta:"This copla is still lost somewhere",armando:"Setting up the paper theater\u2026",saludo:"Hello!",pantalla:"Fullscreen",controles:"Arrows: walk \xB7 Space: jump \xB7 X: talk and grab \xB7 Esc: pause",terminado:"Journey complete",reiniciar:"Restart the chapter",tactiles:"Touch controls",acomodar:"Arrange",acomodaTit:"Arrange your controls",acomodaAyuda:"Drag each one \xB7 tap it to change its size \xB7 or pinch it",tamano:"Size",opacidad:"Opacity",palanca:"Stick",flotante:"Floating",fija:"Fixed",cruz:"D-pad",vibrar:"Vibration",espejar:"Mirror (left-handed)",restablecer:"Reset",listo:"Done",cCaminar:"Walk",cSaltar:"Jump",cMano:"Hand",cPausa:"Pause"},ayudas:{mover:["Arrow keys or A and D to walk","Move with the stick"],saltar:["Space or Z to jump","Tap the feather to jump"],borde:["Jump against a ledge to grab it and climb","Jump against a ledge to grab it and climb"],agachar:["Down to crouch and crawl under things","Stick down to crouch"],empujar:["X or E to grab the stone: push or pull","Hold the hand to grab the stone: push or pull"],escalera:["Up to climb the ladder","Stick up to climb"],hablar:["X or E to talk","Tap the hand to talk"],aleteo:["Apu flaps: jump again in the air","Apu flaps: tap the feather again in the air"],viento:["When it blows hard, crouch or hide behind a block","When it blows hard, crouch or hide behind a block"],agua:["Watch out for the brine!","Watch out for the brine!"],planeo:["Hold jump in the air to glide","Hold the feather in the air to glide"],llamar:["X or E near a latch: Apu flies to open it","Tap the hand near a latch: Apu flies to open it"],termica:["Glide over the warm air to rise","Glide over the warm air to rise"],tunel:["Crouch when a beam goes by!","Crouch when a beam goes by!"]},capitulos:{prologo:"The hailstorm",colores:"The Seven Colours",salinas:"The Great Salt Flats",tren:"The Train to the Clouds",puna:"The Puna",nevado:"The Snowy Peak",epilogo:"Coming home"},narra:{prologo:["My grandmother says condors carry messages from the earth to the sky.","That when someone leaves us, a condor goes with them all the way up.","That night came the biggest hailstorm Purmamarca had ever seen."],colores:["We left in the morning. Apu weighed nothing, but he would not stop chirping.","The Hill of Seven Colours looked painted by hand."],salinas:["At the top of the pass, the world turned white.","The Great Salt Flats: a sea that dried up long ago and left its salt behind."],tren:["The Train to the Clouds climbs so high that the clouds pass underneath.","Apu no longer fit in the bundle."],puna:["At night, the Puna is a sky that reaches down to the ground.","Apu was big now. And heavy."],nevado:["The White Wind gives no warning. It finds you.","At the very top was the nest."],epilogo:["I came back to Purmamarca on a windy afternoon."]},nombres:{killa:"Killa",abuela:"Grandma",rosa:"Do\xF1a Rosa",ceferino:"Don Ceferino",tomas:"Tom\xE1s",coquena:"Coquena",apu:"Apu"},charlas:{inicio:[["abuela","Killa... do you hear that? Something is crying outside, in the corral."],["killa","I'll go and see, Grandma."]],afuera:[["killa","Look at this hail! It's like stones."]],corral:[["killa","The crying comes from past the corral."]],pichon:[["killa","A chick! You're freezing..."],["killa","Come on, I'll take you inside."]],casa:[["abuela","It's a condor chick. The storm threw it out of the nest."],["killa","What nest?"],["abuela","Way up there, on the Nevado de Cha\xF1i. Condors nest where nobody can reach."],["abuela","A condor that never returns to its mountain never learns to fly, my girl."],["killa","Then I'll take him."],["abuela","It's very far, Killa..."],["abuela","...But your mother would have done the same."],["killa","His name will be Apu."]],rosa:[["rosa","Where are you off to so early, Killa?"],["killa","I'm taking Apu home, to the Nevado."],["rosa","Oh, that's far! Follow the apachetas, little one. Leave a stone on each one: Pachamama will keep your path safe."],["rosa","And if you see a copla hanging somewhere, keep it. Your grandma knows them all."]],rosa2:[["rosa","Go on, go on! And say hello to the condors for me."]],piedra:[["killa","That wall is too high... If I push the stone, maybe I can reach."]],mirador:[["killa","Look, Apu. Seven colours. Grandma says the sun paints them one by one, very slowly."],["apu","Peep!"]],cuesta:[["killa","Up there the world turns white. Let's go, Apu."]],ceferino:[["ceferino","Hey there! Alone on the salt flats?"],["killa","With Apu."],["ceferino","Ah, in good company then."],["ceferino","Listen: when the wind blows hard, crouch or get behind a block of salt. Otherwise it'll push you into the brine."],["ceferino","And out west the train goes by. That one climbs all the way to the clouds."]],ceferino2:[["ceferino","Crouch with the wind, girl. Like the reeds do."]],aleteo:[["killa","It's too wide to jump..."],["apu","Peep, peep!"],["killa","Apu! You flapped! You lifted me!"]],estacion:[["killa","The train! Run, Apu!"]],arranca:[["killa","It's moving! I have to get to the front, to the engine."]],viaducto:[["killa","We're above the clouds, Apu... Don't look down."]],tunel:[["killa","A tunnel! Crouch, or get inside the carriage."]],tomas:[["tomas","Girl! What are you doing on top of the train?"],["killa","I'm going to the Nevado de Cha\xF1i. I have to take Apu."],["tomas","And him? Is that a condor?"],["killa","Not yet. But he will be."],["tomas","Well, look at that... I wanted to go far away too, when I was your age."],["tomas","Take this lantern. At night, on the Puna, you'll need it."],["tomas","The train stops at the last station. From there, follow the mountain."]],tomas2:[["tomas","Safe travels, girl! And hold on tight."]],planeo:[["killa","There's no way down..."],["apu","Kee-ah!"],["killa","Apu, you're carrying me! You're huge!"]],llamar:[["killa","A closed gate... The latch is way up there."],["killa","Go, Apu!"]],puma:[["killa","A puma! Run, Apu!"]],coquena:[["coquena","Nobody hunts in my Puna."],["killa","Who are you?"],["coquena","I am Coquena. I look after the vicu\xF1as... and those who walk at night."],["coquena","Your chick can almost fly, Killa. Tomorrow, at the summit, you will have to let him go."],["killa","What if he doesn't want to leave?"],["coquena","The ones we love don't leave. They rise."]],coquena2:[["coquena","Keep climbing. The White Wind waits for no one."]],tormenta:[["killa","The White Wind is coming! Run!"]],escapa:[["killa","It passed... Apu? Are you there?"],["apu","Kee-ah!"]],cumbre:[["killa","We made it, Apu. This is your home."],["killa","Here. It was Mum's."],["killa","They say you carry messages from the earth to the sky."],["killa","Tell her we're fine. That Grandma still sings her coplas."],["killa","Fly, Apu!"]],epilogo:[["abuela","Well? Did he make it?"],["killa","He made it, Grandma."],["abuela","Look up, my girl."],["killa","...Thank you, Apu."]],final:["They say the condor carries messages from the earth to the sky.","I know it's true."]},coplas:[["The hill has seven colours,","and seven sorrows have I;","each time the sun paints the hill","it paints my heart as well."],["Pachamama, mother earth,","I leave my little stone for you;","keep my path safe, I beg you,","I carry a small soul too."],["The card\xF3n in the ravine","has thorns and yet it flowers;","so are the people of the hills:","tough outside, love inside."],["White is the salt of the Puna,","and white the moon above;","if I get lost in so much white,","may I be found by your love."],["The wind of the salt flats","tried to carry me away;","I bent down like the reeds do","and let it pass, singing."],["Salt cutter, salt cutter,","what do you cut with your spade?","\u2014I cut pieces of a sea","that fell asleep on the plain."],["Train that climbs up to the clouds","with your smoke as soft as cotton,","take me all the way to the mountain","and bring me back to the sun."],["Across the viaduct of the sky","the train goes by, and time goes by;","whoever looks down below","gets dizzy in the wind."],["Stoker of the engine,","what dream do you feed the coal?","\u2014The dream of going further,","and my heart burns it whole."],["At night the Puna is sky,","the stars come down to your feet;","if one of them falls to the ground,","I'll keep it for later."],["Coquena guards the vicu\xF1as","in his poncho of fleece;","whoever hunts without leave","loses the road and the sun."],["Little lantern of the night,","please don't go out on me,","for the puma prowls the hillside","and I am afraid."],["The White Wind gives no warning,","it comes down the hill to find you;","hold your loved ones tight,","the storm will clear soon."],["On the summit of the Nevado","the sun rises first of all;","that is why the condors are born","where you can touch the sky."],["Condor, condor, flying off","toward the Nevado so high,","carry this little message","to the one on the other side."]],creditos:["KUNTUR","A handmade paper game","Story, art, music and code: Claude, for Nuevo General de Juegos","Inspired by Purmamarca, the Great Salt Flats, the Train to the Clouds, the Puna and the Nevado de Cha\xF1i (Jujuy and Salta, Argentina)","The coplas are made up, in the style of those from the Quebrada","Thank you for playing"]},pt:{ui:{elegi:"Escolha seu idioma",lema:"Uma menina, um filhote de condor e a montanha que o espera.",empezar:"Come\xE7ar a viagem",seguir:"Continuar a viagem",nuevo:"Nova viagem",nuevoSeguro:"Come\xE7ar do zero? Toque de novo",capitulos:"Cap\xEDtulos",coplas:"Coplas",opciones:"Op\xE7\xF5es",creditos:"Cr\xE9ditos",volver:"Voltar",pausa:"Pausa",continuar:"Continuar",salir:"Voltar ao teatro",reintentar:"Voltar \xE0 apacheta",idioma:"Idioma",musica:"M\xFAsica",efectos:"Efeitos",calidad:"Qualidade",temblor:"Tremor da c\xE2mera",si:"Sim",no:"N\xE3o",alta:"Alta",media:"M\xE9dia",baja:"Baixa",capitulo:"Cap\xEDtulo {0}",prologo:"Pr\xF3logo",epilogo:"Ep\xEDlogo",cerrado:"Voc\xEA ainda n\xE3o chegou aqui",coplasDe:"{0} de {1} coplas",copla:"Voc\xEA achou uma copla!",apacheta:"Voc\xEA deixou uma pedra na apacheta",tocar:"Toque para continuar",saltear:"Pular",fin:"Fim",gracias:"Obrigado por jogar",hablar:"falar",agarrar:"segurar",abrir:"abrir",llamarApu:"Vai, Apu!",falta:"Esta copla ainda anda perdida",armando:"Montando o teatrinho\u2026",saludo:"Ol\xE1!",pantalla:"Tela cheia",controles:"Setas: andar \xB7 Espa\xE7o: pular \xB7 X: falar e segurar \xB7 Esc: pausa",terminado:"Viagem conclu\xEDda",reiniciar:"Recome\xE7ar o cap\xEDtulo",tactiles:"Controles de toque",acomodar:"Ajustar",acomodaTit:"Ajuste seus controles",acomodaAyuda:"Arraste cada um \xB7 toque para mudar o tamanho \xB7 ou fa\xE7a pin\xE7a",tamano:"Tamanho",opacidad:"Opacidade",palanca:"Direcional",flotante:"Flutuante",fija:"Fixo",cruz:"Cruz",vibrar:"Vibrar",espejar:"Espelhar (canhoto)",restablecer:"Restaurar",listo:"Pronto",cCaminar:"Andar",cSaltar:"Pular",cMano:"M\xE3o",cPausa:"Pausa"},ayudas:{mover:["Setas ou A e D para andar","Mova com o direcional"],saltar:["Espa\xE7o ou Z para pular","Toque na pena para pular"],borde:["Pule contra uma borda para se agarrar e subir","Pule contra uma borda para se agarrar e subir"],agachar:["Para baixo para se agachar e passar por baixo","Alavanca para baixo para se agachar"],empujar:["X ou E para segurar a pedra: empurre ou puxe","Segure a m\xE3o para pegar a pedra: empurre ou puxe"],escalera:["Para cima para subir a escada","Alavanca para cima para subir"],hablar:["X ou E para falar","Toque na m\xE3o para falar"],aleteo:["Apu bate as asas: pule de novo no ar","Apu bate as asas: toque na pena de novo no ar"],viento:["Quando venta forte, agache-se ou esconda-se atr\xE1s de um bloco","Quando venta forte, agache-se ou esconda-se atr\xE1s de um bloco"],agua:["Cuidado com a salmoura!","Cuidado com a salmoura!"],planeo:["Segure o pulo no ar para planar","Segure a pena no ar para planar"],llamar:["X ou E perto de uma trava: Apu voa para abri-la","Toque na m\xE3o perto de uma trava: Apu voa para abri-la"],termica:["Plane sobre o ar quente para subir","Plane sobre o ar quente para subir"],tunel:["Agache-se quando passar uma viga!","Agache-se quando passar uma viga!"]},capitulos:{prologo:"A chuva de granizo",colores:"As Sete Cores",salinas:"As Grandes Salinas",tren:"O Trem das Nuvens",puna:"A Puna",nevado:"O Nevado",epilogo:"A volta"},narra:{prologo:["Minha av\xF3 diz que os condores levam as mensagens da terra para o c\xE9u.","Que quando algu\xE9m parte, um condor o acompanha at\xE9 l\xE1 em cima.","Naquela noite caiu a maior chuva de granizo que Purmamarca j\xE1 viu."],colores:["De manh\xE3 n\xF3s sa\xEDmos. Apu n\xE3o pesava nada, mas n\xE3o parava de piar.","O Morro das Sete Cores parecia pintado \xE0 m\xE3o."],salinas:["No alto da serra, o mundo ficou branco.","As Grandes Salinas: um mar que secou h\xE1 muito tempo e deixou o sal."],tren:["O Trem das Nuvens sobe t\xE3o alto que as nuvens passam por baixo.","Apu j\xE1 n\xE3o cabia na trouxa."],puna:["\xC0 noite, a Puna \xE9 um c\xE9u que chega at\xE9 o ch\xE3o.","Apu j\xE1 era grande. E pesado."],nevado:["O Vento Branco n\xE3o avisa. Ele te encontra.","L\xE1 no alto estava o ninho."],epilogo:["Voltei a Purmamarca numa tarde de vento."]},nombres:{killa:"Killa",abuela:"A av\xF3",rosa:"Dona Rosa",ceferino:"Seu Ceferino",tomas:"Tom\xE1s",coquena:"Coquena",apu:"Apu"},charlas:{inicio:[["abuela","Killa... est\xE1 ouvindo? Alguma coisa est\xE1 chorando l\xE1 fora, no curral."],["killa","Vou ver, v\xF3."]],afuera:[["killa","Que granizo! Parecem pedras."]],corral:[["killa","O choro vem de depois do curral."]],pichon:[["killa","Um filhote! Voc\xEA est\xE1 gelado..."],["killa","Vem, eu te levo para dentro."]],casa:[["abuela","\xC9 um filhote de condor. A tempestade o derrubou do ninho."],["killa","De que ninho?"],["abuela","L\xE1 de cima, do Nevado de Cha\xF1i. Os condores fazem ninho onde ningu\xE9m chega."],["abuela","Um condor que n\xE3o volta para a sua montanha n\xE3o aprende a voar, minha filha."],["killa","Ent\xE3o eu levo ele."],["abuela","\xC9 muito longe, Killa..."],["abuela","...Mas a sua m\xE3e teria feito o mesmo."],["killa","O nome dele vai ser Apu."]],rosa:[["rosa","Aonde voc\xEA vai t\xE3o cedo, Killa?"],["killa","Levar o Apu para casa, no Nevado."],["rosa","Nossa, que longe! Siga as apachetas, menina. Em cada uma deixe uma pedra: a Pachamama cuida do seu caminho."],["rosa","E se voc\xEA vir uma copla pendurada por a\xED, guarde. Sua av\xF3 sabe todas."]],rosa2:[["rosa","Vai, vai! E manda um abra\xE7o para os condores."]],piedra:[["killa","Essa parede \xE9 muito alta... Se eu empurrar a pedra, talvez eu alcance."]],mirador:[["killa","Olha, Apu. Sete cores. A v\xF3 diz que o sol pinta uma de cada vez, bem devagar."],["apu","Piu!"]],cuesta:[["killa","L\xE1 em cima o mundo fica branco. Vamos, Apu."]],ceferino:[["ceferino","Opa! Sozinha pelas Salinas?"],["killa","Com o Apu."],["ceferino","Ah, ent\xE3o est\xE1 bem acompanhada."],["ceferino","Escuta: quando ventar forte, agache-se ou fique atr\xE1s de um bloco de sal. Sen\xE3o o vento te joga na salmoura."],["ceferino","E para o oeste passa o trem. Esse sobe at\xE9 as nuvens."]],ceferino2:[["ceferino","Agache-se com o vento, menina. Como os juncos."]],aleteo:[["killa","\xC9 largo demais para pular..."],["apu","Piu, piu!"],["killa","Apu! Voc\xEA bateu as asas! Voc\xEA me levantou!"]],estacion:[["killa","O trem! Corre, Apu!"]],arranca:[["killa","Partiu! Tenho que chegar l\xE1 na frente, na locomotiva."]],viaducto:[["killa","Estamos acima das nuvens, Apu... N\xE3o olhe para baixo."]],tunel:[["killa","Um t\xFAnel! Agache-se ou entre no vag\xE3o."]],tomas:[["tomas","Menina! O que voc\xEA est\xE1 fazendo em cima do trem?"],["killa","Vou para o Nevado de Cha\xF1i. Tenho que levar o Apu."],["tomas","E esse a\xED? \xC9 um condor?"],["killa","Ainda n\xE3o. Mas vai ser."],["tomas","Olha s\xF3... Eu tamb\xE9m queria ir longe quando tinha a sua idade."],["tomas","Pegue esta lanterna. \xC0 noite, na Puna, faz falta."],["tomas","O trem para na \xFAltima esta\xE7\xE3o. De l\xE1, siga a montanha."]],tomas2:[["tomas","Boa viagem, menina! E segure firme."]],planeo:[["killa","N\xE3o tem por onde descer..."],["apu","Kii\xE1!"],["killa","Apu, voc\xEA est\xE1 me levando! Voc\xEA est\xE1 enorme!"]],llamar:[["killa","Uma porteira fechada... A trava est\xE1 l\xE1 em cima."],["killa","Vai, Apu!"]],puma:[["killa","Um puma! Corre, Apu!"]],coquena:[["coquena","Ningu\xE9m ca\xE7a na minha Puna."],["killa","Quem \xE9 voc\xEA?"],["coquena","Sou o Coquena. Cuido das vicunhas... e de quem anda \xE0 noite."],["coquena","Seu filhote j\xE1 quase voa, Killa. Amanh\xE3, no cume, voc\xEA vai ter que solt\xE1-lo."],["killa","E se ele n\xE3o quiser ir?"],["coquena","Quem a gente ama n\xE3o vai embora. Sobe."]],coquena2:[["coquena","Continue subindo. O Vento Branco n\xE3o espera ningu\xE9m."]],tormenta:[["killa","A\xED vem o Vento Branco! Corre!"]],escapa:[["killa","Passou... Apu? Voc\xEA est\xE1 a\xED?"],["apu","Kiii\xE1!"]],cumbre:[["killa","Chegamos, Apu. Esta \xE9 a sua casa."],["killa","Tome. Era da mam\xE3e."],["killa","Dizem que voc\xEAs levam as mensagens da terra para o c\xE9u."],["killa","Diga a ela que estamos bem. Que a v\xF3 ainda canta as coplas dela."],["killa","Voa, Apu!"]],epilogo:[["abuela","E a\xED? Ele chegou?"],["killa","Chegou, v\xF3."],["abuela","Olhe para cima, minha filha."],["killa","...Obrigada, Apu."]],final:["Dizem que o condor leva as mensagens da terra para o c\xE9u.","Eu sei que \xE9 verdade."]},coplas:[["Sete cores tem o morro,","sete penas tenho eu;","cada vez que o sol o pinta,","pinta tamb\xE9m o peito meu."],["Pachamama, m\xE3e terra,","deixo aqui minha pedrinha;","cuide bem do meu caminho,","que levo uma alma pequenininha."],["O card\xE3o l\xE1 da quebrada","tem espinhos e d\xE1 flor;","assim \xE9 a gente do morro:","dura por fora e puro amor."],["Branco o sal da Puna,","branca a lua tamb\xE9m;","se eu me perder em tanto branco,","que me ache o seu bem-querer."],["O vento das salinas","quis me levar voando;","eu me agachei como o junco","e deixei passar cantando."],["Salineiro, salineiro,","o que voc\xEA corta com a p\xE1?","\u2014Corto peda\xE7os de um mar","que dormiu na plan\xEDcie de l\xE1."],["Trem que sobe at\xE9 as nuvens","com fuma\xE7a de algod\xE3o,","me leva at\xE9 a montanha","e me traz de volta ao sol."],["Pelo viaduto do c\xE9u","passa o trem e passa o tempo;","quem olha l\xE1 para baixo","fica tonto com o vento."],["Foguista da locomotiva,","que sonho voc\xEA joga no carv\xE3o?","\u2014O de chegar mais longe,","e quem o queima \xE9 o cora\xE7\xE3o."],["\xC0 noite a Puna \xE9 c\xE9u,","as estrelas chegam ao p\xE9;","se uma cair no ch\xE3o,","eu guardo para depois."],["Coquena cuida das vicunhas","com
