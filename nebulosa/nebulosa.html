/* ==== motor2d/fuente.js ==== */
/* ============================================================================
   motor2d/fuente.js — la fuente de píxeles 5x7 de EL TIPO, con tildes, Ñ, Ü,
   ¡¿ y las letras del portugués, más los signos que piden los diálogos. Las minúsculas se dibujan como
   mayúsculas: en un juego alcanza y se lee mejor a este tamaño.
   ========================================================================== */

const FUENTE_PX = {
  A: [".###.", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"], B: ["####.", "#...#", "#...#", "####.", "#...#", "#...#", "####."],
  C: [".###.", "#...#", "#....", "#....", "#....", "#...#", ".###."], D: ["####.", "#...#", "#...#", "#...#", "#...#", "#...#", "####."],
  E: ["#####", "#....", "#....", "####.", "#....", "#....", "#####"], F: ["#####", "#....", "#....", "####.", "#....", "#....", "#...."],
  G: [".###.", "#...#", "#....", "#.###", "#...#", "#...#", ".####"], H: ["#...#", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"],
  I: [".###.", "..#..", "..#..", "..#..", "..#..", "..#..", ".###."], J: ["..###", "...#.", "...#.", "...#.", "#..#.", "#..#.", ".##.."],
  K: ["#...#", "#..#.", "#.#..", "##...", "#.#..", "#..#.", "#...#"], L: ["#....", "#....", "#....", "#....", "#....", "#....", "#####"],
  M: ["#...#", "##.##", "#.#.#", "#.#.#", "#...#", "#...#", "#...#"], N: ["#...#", "#...#", "##..#", "#.#.#", "#..##", "#...#", "#...#"],

  S: [".####", "#....", "#....", ".###.", "....#", "....#", "####."], T: ["#####", "..#..", "..#..", "..#..", "..#..", "..#..", "..#.."],

  ' ': ["...", "...", "...", "...", "...", "...", "..."], '!': ["#", "#", "#", "#", "#", ".", "#"], '¡': ["#", ".", "#", "#", "#", "#", "#"],
  '?': [".###.", "#...#", "....#", "...#.", "..#..", ".....", "..#.."], '¿': ["..#..", ".....", "..#..", ".#...", "#....", "#...#", ".###."],
  '.': [".", ".", ".", ".", ".", ".", "#"], ',': ["..", "..", "..", "..", "..", ".#", "#."], ':': [".", "#", ".", ".", ".", "#", "."],
  ';': ["..", ".#", "..", "..", "..", ".#", "#."], '-': ["....", "....", "....", "####", "....", "....", "...."],
  "'": ["#", "#", ".", ".", ".", ".", "."], '"': ["#.#", "#.#", "...", "...", "...", "...", "..."],
  '/': ["....#", "...#.", "...#.", "..#..", ".#...", ".#...", "#...."], '+': [".....", "..#..", "..#..", "#####", "..#..", "..#..", "....."],
  '×': [".....", "#...#", ".#.#.", "..#..", ".#.#.", "#...#", "....."], '·': [".", ".", ".", "#", ".", ".", "."],
  '%': ["##..#", "##.#.", "...#.", "..#..", ".#...", ".#.##", "#..##"], '>': ["#....", ".#...", "..#..", "...#.", "..#..", ".#...", "#...."],
  '<': ["....#", "...#.", "..#..", ".#...", "..#..", "...#.", "....#"], '=': ["....", "....", "####", "....", "####", "....", "...."],
  '(': ["..#", ".#.", "#..", "#..", "#..", ".#.", "..#"], ')': ["#..", ".#.", "..#", "..#", "..#", ".#.", "#.."],
  '…': [".....", ".....", ".....", ".....", ".....", ".....", "#.#.#"], '*': [".....", "#.#.#", ".###.", "#####", ".###.", "#.#.#", "....."],

};
/* las letras con marca: la base más la marca. Con las del portugués (Â Ã À Ç Ê Ô Õ)
   alcanza para los tres idiomas de los juegos */
const ACENTOS_PX = {
  'Á': ['A', 'a'], 'É': ['E', 'a'], 'Í': ['I', 'a'], 'Ó': ['O', 'a'], 'Ú': ['U', 'a'], 'Ñ': ['N', 't'], 'Ü': ['U', 'd'],
  'Â': ['A', 'c'], 'Ã': ['A', 't'], 'À': ['A', 'g'], 'Ê': ['E', 'c'], 'Ô': ['O', 'c'], 'Õ': ['O', 't'], 'Ç': ['C', 'z'],
};
const MARCAS_PX = {
  a: [[3, -3], [2, -2]], t: [[0, -2], [1, -3], [2, -3], [3, -2], [4, -3]], d: [[1, -2], [3, -2]],
  c: [[1, -2], [2, -3], [3, -2]], g: [[1, -3], [2, -2]], z: [[2, 7], [3, 8], [2, 8]],
};

function glifoPx(ch) {
  const c = ch.toUpperCase();
  if (FUENTE_PX[c]) return { f: FUENTE_PX[c], m: null };
  const a = ACENTOS_PX[c];
  if (a) return { f: FUENTE_PX[a[0]], m: MARCAS_PX[a[1]] };
  return { f: FUENTE_PX['?'], m: null };
}
/* puntos encendidos de un texto: [x, y, fila], con y = 0 en la línea de las mayúsculas */
function puntosTexto(str) {
  const pts = [];
  let x = 0;
  for (const ch of str) {
    const g = glifoPx(ch), w = g.f[0].length;
    for (let r = 0; r < 7; r++) for (let k = 0; k < w; k++) if (g.f[r][k] === '#') pts.push([x + k, r, r]);
    if (g.m) for (const [mx, my] of g.m) pts.push([x + mx, my, my > 6 ? 6 : 0]);
    x += w + 1;
  }
  return { pts, w: Math.max(1, x - 1) };
}
function anchoTexto(str) {
  let x = 0;
  for (const ch of str) x += glifoPx(ch).f[0].length + 1;
  return Math.max(0, x - 1);
}

const GRAD = {

};

/* texto a un lienzo de 1 px por píxel de fuente: sombra, contorno y degradé
   por fila. Arriba deja 3 filas de aire para las tildes */
const cacheTxt = new Map();
function lienzoTexto(str, o) {
  o = o || {};
  const clave = str + '|' + (o.grad ? o.grad[0] + o.grad[6] : o.col) + '|' + (o.borde || '') + '|' + (o.sinSombra ? 1 : 0);
  let c = cacheTxt.get(clave);
  if (c) return c;
  const { pts, w } = puntosTexto(str);
  const arriba = 3;
  c = document.createElement('canvas');
  c.width = w + 3; c.height = arriba + 7 + 3;
  const g = c.getContext('2d'), ox = 1, oy = arriba + 1, borde = o.borde || '#141018';
  if (!o.sinSombra) {
    g.fillStyle = 'rgba(10,6,16,0.75)';
    for (const [x, y] of pts) g.fillRect(ox + x - 1, oy + y, 3, 3);
  }
  if (o.borde !== 'no') {
    g.fillStyle = borde;
    for (const [x, y] of pts) g.fillRect(ox + x - 1, oy + y - 1, 3, 3);
  }
  for (const [x, y, r] of pts) { g.fillStyle = o.grad ? o.grad[r] : (o.col || '#fff'); g.fillRect(ox + x, oy + y, 1, 1); }
  if (cacheTxt.size > 500) cacheTxt.clear();
  cacheTxt.set(clave, c);
  return c;
}

/* dibuja texto en el lienzo del mundo. y = la línea de arriba de las mayúsculas.
   o.alin: 'izq' | 'centro' | 'der'; o.escala: entero, para títulos */
function textoPx(g, str, x, y, o) {
  o = o || {};
  const c = lienzoTexto(str, o), e = o.escala || 1;
  let dx = x - e;
  if (o.alin === 'centro') dx = x - Math.floor((c.width - 3) * e / 2) - e;
  else if (o.alin === 'der') dx = x - (c.width - 3) * e - e;
  g.drawImage(c, Math.round(dx), Math.round(y - 4 * e), c.width * e, c.height * e);
}
/* letra por letra: para escribir de a poco y para las palabras que tiemblan */
function textoLetras(g, str, x, y, o, cuantas, desplazar) {
  o = o || {};
  let cx = x, i = 0;
  for (const ch of str) {
    if (cuantas != null && i >= cuantas) break;
    const w = glifoPx(ch).f[0].length;
    if (ch !== ' ') {
      const c = lienzoTexto(ch, o), d = desplazar ? desplazar(i) : null;
      g.drawImage(c, Math.round(cx - 1 + (d ? d[0] : 0)), Math.round(y - 4 + (d ? d[1] : 0)));
    }
    cx += w + 1; i++;
  }
}
/* partir un texto en renglones que entren en "ancho" píxeles */
function envolver(str, ancho) {
  const renglones = [];
  for (const parrafo of str.split('\n')) {
    let linea = '';
    for (const pal of parrafo.split(' ')) {
      const prueba = linea ? linea + ' ' + pal : pal;
      if (anchoTexto(prueba) > ancho && linea) { renglones.push(linea); linea = pal; }
      else linea = prueba;
    }
    renglones.push(linea);
  }
  return renglones;
}

/* pone un texto del DOM en pixel art sin perder el texto original */
function pixelar(el, S, o) {
  if (!el) return;
  const txt = el.textContent.trim() !== '' ? el.textContent.trim() : (el.dataset.px || '');
  if (!txt) return;
  const clave = txt + '|' + S + '|' + (o && o.grad ? o.grad[0] : '');
  if (el.dataset.pxk === clave && el.querySelector('canvas.px')) return;
  el.dataset.px = txt; el.dataset.pxk = clave; el.textContent = '';
  const src = lienzoTexto(txt, o), c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  c.className = 'px';
  c.style.width = (c.width * S) + 'px'; c.style.height = (c.height * S) + 'px';
  c.setAttribute('aria-label', txt);
  el.appendChild(c);
}

const ICONOS_PX = {

  mano: [".#.#.#.", ".#.#.#.", ".#####.", "#######", "#######", ".#####.", "..###.."],

  luz: ["...#...", ".#.#.#.", "..###..", "###.###", "..###..", ".#.#.#.", "...#..."],
};
function iconoPx(nombre, col, S) {
  const f = ICONOS_PX[nombre], c = document.createElement('canvas');
  c.width = 10; c.height = 10;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(10,6,16,0.75)';
  for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) if (f[y][x] === '#') g.fillRect(x + 1, y + 2, 3, 3);
  g.fillStyle = '#141018';
  for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) if (f[y][x] === '#') g.fillRect(x, y, 3, 3);
  for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) if (f[y][x] === '#') { g.fillStyle = y < 2 ? '#ffffff' : col; g.fillRect(x + 1, y + 1, 1, 1); }
  if (S) { c.className = 'px'; c.style.width = (10 * S) + 'px'; c.style.height = (10 * S) + 'px'; }
  return c;
}

/* ==== motor2d/intro-jxs.js ==== */
/* ============================================================================
   motor2d/intro-jxs.js — LA intro de JXSTUDIOS para todos los juegos ("así las
   quiero a las intro", 07/10, mostrando la de La Cripta). Sacada tal cual de
   cripta/cripta.html (M_logojxs + M_intro + sonido › jingleJXS), sin depender
   de nada de ese juego salvo la fuente de píxeles (motor2d/fuente.js).

   En pixel art y rápida (2,1 s): una raya de luz abre la fibra de carbono, el
   monograma JXS se escribe en metal con chispas en las puntas, golpe (destello,
   sacudida, chispazo), una franja de brillo lo cruza, "JXSTUDIOS" se tipea y
   abajo "presenta". Después, el iris (círculo que se cierra y se abre).

   Uso:
     const intro = crearIntroJXS({ W, H, presenta: 'PRESENTA', vibrar });
     cada cuadro: intro.pasar(dt); intro.dibujar(g);   // g en píxeles del juego
     un toque: intro.saltar();  ¿terminó?: intro.listo
     con el audio andando (después de un toque no se puede antes): jingleJXS(ctx, destino)
     transiciones: irisJXS(g, W, H, cx, cy, r)

   Cada juego la viste a su estilo ("con su intro respectiva a su estilo", 07/10) con `estilo`:
   la misma coreografía, otro material. Todo es opcional (sin estilo = La Cripta):
     metal: [8 colores de arriba a abajo], filo, bisel, borde: '#rrggbb'
     sombra: { dx, dy, col }                  el monograma proyecta una sombra plana (filete)
     fondo(W, H, cx, cy) → lienzo             el fondo (por defecto la fibra de carbono)
     puntas: [colores], golpe: [colores], destello: 'rgba(...)'
     palabra: { col, borde }, presenta: color, negro: color del fondo
     antes(g, t, I) / despues(g, t, I)        dibujar algo más (I.cx, I.cy, I.ancho, I.yPalabra)
     jingle(ctx, bus, t0, tg, h)              otra música; h = { tono, soplo, f, T }
   Para juegos que no son de píxeles (lienzo liso, con escala propia):
     anchoLogo(W, H) → ancho del monograma; logo(g, i) lo dibuja a mano (i = { avance, t, x0, y0, esc,
     ancho, golpe, tGolpe, TRAZOS, camino2d, largo, muestrear }); letras(g, parte, I, t, y) y presentaTxt(g, txt, I, t, y)
     escriben con otra letra; chispa: px de las chispas (por defecto 1)
   ========================================================================== */

const IntroJXS_ = (() => {
  const CAJA = { w: 350, h: 172 };
  const GROSOR = 14.5;
  // el monograma: cuatro trazos de metal (A va abajo en el cruce: se dibuja primero)
  const TRAZOS = [
    { id: 'A', capa: 0, d: [['M', 40, 19], ['L', 114, 19], ['L', 176, 101], ['C', 194, 128, 222, 168, 268, 169], ['C', 310, 170, 342, 152, 342, 122]] },
    { id: 'J', capa: 0, d: [['M', 40, 43], ['L', 98, 43], ['L', 98, 116], ['C', 98, 148, 44, 158, 36, 124]] },
    { id: 'S', capa: 0, d: [['M', 312, 66], ['C', 306, 46, 288, 36, 266, 36], ['C', 242, 36, 226, 48, 226, 63], ['C', 226, 80, 248, 86, 272, 92], ['C', 302, 99, 320, 108, 320, 126], ['C', 320, 142, 300, 148, 272, 148], ['C', 246, 148, 226, 138, 216, 118]] },
    { id: 'B', capa: 1, d: [['M', 10, 130], ['C', 18, 158, 50, 168, 86, 166], ['C', 108, 165, 122, 158, 134, 142], ['L', 200, 46], ['C', 216, 24, 244, 12, 272, 12], ['C', 310, 12, 340, 30, 340, 62]] },
  ];
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const salida = (t) => 1 - Math.pow(1 - t, 3);
  const salidaAtras = (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);

  function camino2d(t, esc, ox, oy) {
    const p = new Path2D();
    for (const [op, ...n] of t.d) {
      const q = n.map((v, i) => (i % 2 ? oy + v * esc : ox + v * esc));
      if (op === 'M') p.moveTo(q[0], q[1]);
      else if (op === 'L') p.lineTo(q[0], q[1]);
      else p.bezierCurveTo(q[0], q[1], q[2], q[3], q[4], q[5]);
    }
    return p;
  }
  function muestrear(t, cada) {
    const pts = [];
    let x = 0, y = 0;
    for (const [op, ...n] of t.d) {
      if (op === 'M') { x = n[0]; y = n[1]; pts.push([x, y]); continue; }
      if (op === 'L') {
        const [x1, y1] = n, largo = Math.hypot(x1 - x, y1 - y), k = Math.max(1, Math.ceil(largo / cada));
        for (let i = 1; i <= k; i++) pts.push([x + ((x1 - x) * i) / k, y + ((y1 - y) * i) / k]);
        x = x1; y = y1; continue;
      }
      const [c1x, c1y, c2x, c2y, x1, y1] = n;
      const aprox = Math.hypot(c1x - x, c1y - y) + Math.hypot(c2x - c1x, c2y - c1y) + Math.hypot(x1 - c2x, y1 - c2y);
      const k = Math.max(2, Math.ceil(aprox / cada));
      for (let i = 1; i <= k; i++) {
        const s = i / k, r = 1 - s;
        pts.push([r * r * r * x + 3 * r * r * s * c1x + 3 * r * s * s * c2x + s * s * s * x1, r * r * r * y + 3 * r * r * s * c1y + 3 * r * s * s * c2y + s * s * s * y1]);
      }
      x = x1; y = y1;
    }
    return pts;
  }
  const largos = new Map();
  function largo(t) {
    if (largos.has(t.id)) return largos.get(t.id);
    const p = muestrear(t, 2);
    let l = 0;
    for (let i = 1; i < p.length; i++) l += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    largos.set(t.id, l);

/* el brillo de neón: un degradé radial, en caché por color y tamaño */
const CACHE_BRILLO = new Map();
function brillo(col, r) {

/* un cuerpo en la escena; b = { tipo, x, y, r, ang, vx, vy, nace } */

  g.lineWidth = r * 0.07; g.strokeStyle = 'rgba(255,240,200,0.9)'; g.beginPath(); g.ellipse(0, 0, r * 1.55, r * 0.36, 0, atras ? Math.PI : 0, atras ? Math.PI * 2 : Math.PI); g.stroke();

/* ==== nebulosa/js/fisica.js ==== */
/* ============================================================================
   La física del frasco: círculos con gravedad, tres subpasos por cuadro y
   varias pasadas de separación por subpaso (así las pilas quedan quietas y no
   tiemblan), choque con un poquito de rebote y rozamiento con el piso. Dos
   iguales que se tocan se fusionan en el que sigue; dos agujeros negros hacen
   una supernova.
   ========================================================================== */

const GRAV = 1500, SUBPASOS = 3, PASADAS = 3, REBOTE = 0.12;
let idCuerpo = 1;
function nuevoCuerpo(tipo, x, y) {
  const r = CUERPOS[tipo].r;
  return { id: idCuerpo++, tipo, x, y, vx: 0, vy: 0, r, rT: r, ang: Math.random() * 6.28, edad: 0, muerto: false };
}
/* un paso de física; devuelve las fusiones que pasaron: [{ a, b, x, y, tipo }] */
function pasoFisica(cuerpos, dt) {
  const fus = [], h = dt / SUBPASOS;
  for (let s = 0; s < SUBPASOS; s++) {
    for (const b of cuerpos) {
      if (b.muerto) continue;
      b.edad += h;
      if (b.r < b.rT) b.r = Math.min(b.rT, b.r + b.rT * h * 6);
      b.vy += GRAV * h;
      b.vx *= 0.9995; b.vy *= 0.9995;
      b.x += b.vx * h; b.y += b.vy * h;
      b.ang += (b.vx / b.r) * h;
    }
    for (let it = 0; it < PASADAS; it++) {
      for (let i = 0; i < cuerpos.length; i++) {
        const a = cuerpos[i]; if (a.muerto) continue;
        for (let j = i + 1; j < cuerpos.length; j++) {
          const b = cuerpos[j]; if (b.muerto) continue;
          const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr) continue;
          const d = Math.sqrt(d2) || 0.01, nx = dx / d, ny = dy / d;
          // dos iguales: se fusionan
          if (a.tipo === b.tipo && a.edad > 0.03 && b.edad > 0.03 && !a.fusion && !b.fusion) {
            a.muerto = b.muerto = true; a.fusion = b.fusion = true;
            const ma = a.r * a.r, mb = b.r * b.r;
            fus.push({ a, b, x: (a.x * ma + b.x * mb) / (ma + mb), y: (a.y * ma + b.y * mb) / (ma + mb), vx: (a.vx + b.vx) * 0.25, vy: (a.vy + b.vy) * 0.25, tipo: a.tipo });
            continue;
          }
          const pen = rr - d, ma = a.r * a.r, mb = b.r * b.r, ia = 1 / ma, ib = 1 / mb, k = pen / (ia + ib);
          a.x -= nx * k * ia; a.y -= ny * k * ia; b.x += nx * k * ib; b.y += ny * k * ib;
          if (it === 0) {
            const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
            if (vn < 0) {
              const jn = -(1 + REBOTE) * vn / (ia + ib);
              a.vx -= jn * nx * ia; a.vy -= jn * ny * ia; b.vx += jn * nx * ib; b.vy += jn * ny * ib;
              // rozamiento en la tangente
              const tx = -ny, ty = nx, vt = rvx * tx + rvy * ty, jt = -vt * 0.08 / (ia + ib);
              a.vx -= jt * tx * ia; a.vy -= jt * ty * ia; b.vx += jt * tx * ib; b.vy += jt * ty * ib;
              if (-vn > 160) a.golpe = b.golpe = Math.max(a.golpe || 0, -vn);
            }
          }
        }
      }
      // el frasco
      for (const b of cuerpos) {
        if (b.muerto) continue;
        if (b.x - b.r < JL) { b.x = JL + b.r; if (b.vx < 0) b.vx *= -0.2; }
        if (b.x + b.r > JR) { b.x = JR - b.r; if (b.vx > 0) b.vx *= -0.2; }
        if (b.y + b.r > JF) { b.y = JF - b.r; if (b.vy > 0) { if (b.vy > 200) b.golpe = Math.max(b.golpe || 0, b.vy); b.vy *= -REBOTE; } b.vx *= 0.985; }
      }
    }
  }
  return fus;
}

/* ==== nebulosa/js/sonido.js ==== */
/* ============================================================================
   El sonido: synthwave sintetizado. Bombo y palmas, platillos en corcheas,
   bajo de serrucho en semicorcheas (Lam – Fa – Do – Sol), colchón de acordes
   y un arpegio con eco. La "tensión" (lo lleno que está el frasco) abre el
   filtro y suma platillos. Los efectos: caída, choque según el tamaño,
   fusión que sube de tono con el cuerpo, supernova, rayo, sacudón y alarma.
   ========================================================================== */

const Sonido = {
  ctx: null, total: null, efectos: null, musicaG: null, filtro: null, eco: null, ruidoBuf: null,
  musicaSi: Guardado.leer('musica', true), efectosSi: Guardado.leer('efectos', true),

  const k = ORDEN_TUBOS.indexOf(id), umbral = 0.12 + k * 0.2;

}

function apretando(x, y, w, h) { for (const p of E.punteros.values()) if (!p.rol && p.x >= x && p.x < x + w && p.y >= y && p.y < y + h) return true; return false; }

/* ---------------------------------------------------------------- botones */
function rrect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function boton(x, y, w, h, txt, o) {

  g.shadowColor = col; g.shadowBlur = apr ? 18 : 10; g.strokeStyle = o.apagado ? '#5a4a70' : col; g.lineWidth = 2; g.stroke(); g.shadowBlur = 0;

  const si = !o.apagado && clicEn(x, y, w, h);

function irA(nueva, alMedio) {

/* la transición: una barrida de línea de neón que tapa y destapa */

  g.fillStyle = 'rgba(255,62,200,0.9)'; g.fillRect(0, y - 2, W, 2);

/* ---------------------------------------------------------------- partida */
const PESOS = [32, 28, 20, 12, 8];
function sortear(rnd) { let x = rnd() * 100; for (let i = 0; i < PESOS.length; i++) { x -= PESOS[i]; if (x <= 0) return i; } return 0; }
function empezar(modo) {
  irA('juego', () => {
    const rnd = modo === 'diario' ? rngSemilla(hoy() * 3 + 1) : Math.random;
    G = { modo, rnd, cuerpos: [], actual: sortear(rnd), siguiente: sortear(rnd), aimX: W / 2, carga: 0, puntos: 0, vis: 0, cadena: 0, ultFusion: -9,
      maxTipo: 0, peligroT: 0, alarmaT: 0, fin: false, finT: 0, tiempo: modo === 'relampago' ? 120 : 0, poderes: { sacudon: 1, rayo: 1 }, proxPoder: 800,
      rayoActivo: false, part: [], textos: [], ondas: [], sacudir: 0, lenta: 0, destello: 0, banner: null, t: 0, tiradas: 0, apunta: null, rotura: [] };
    const guardada = modo === 'clasico' ? Guardado.leer('partida', null) : null;
    if (guardada) {
      G.cuerpos = guardada.cuerpos.map(([tipo, x, y]) => { const b = nuevoCuerpo(tipo, x, y); b.edad = 2; return b; });
      Object.assign(G, { actual: guardada.actual, siguiente: guardada.siguiente, puntos: guardada.puntos, vis: guardada.puntos, poderes: guardada.poderes, proxPoder: guardada.proxPoder, maxTipo: guardada.maxTipo || 0 });
    }
    DATOS.partidas++; guardarDatos();
  });
}
function guardarPartida() {
  if (!G || G.modo !== 'clasico') return;
  if (G.fin) { Guardado.borrar('partida'); return; }
  Guardado.escribir('partida', { cuerpos: G.cuerpos.filter((b) => !b.muerto).map((b) => [b.tipo, Math.round(b.x), Math.round(b.y)]), actual: G.actual, siguiente: G.siguiente, puntos: G.puntos, poderes: G.poderes, proxPoder: G.proxPoder, maxTipo: G.maxTipo });
}
const radioBoton = () => 25 * CTRL.tamBot;
function posPoder(i) { const izq = CTRL.zurdo ? i === 0 : i === 1; return { x: izq ? 40 : W - 40, y: H - 46 }; }
function posTirar() { return { x: W / 2, y: H - 50 }; }
const yLanzador = () => JT - 36;

function actualizarPartida(dt) {
  const P = G;
  P.t += dt;
  // tocar los poderes, la pausa o el botón de tirar
  if (E.toque && !P.fin) {
    const p = E.toque, pt = E.punteros.get(p.id);
    const enPoder = [0, 1].find((i) => { const q = posPoder(i); return Math.hypot(p.x - q.x, p.y - q.y) < radioBoton() + 6; });
    if (Math.hypot(p.x - 30, p.y - 36) < 24) { if (pt) pt.rol = 'boton'; Sonido.sfx('boton'); escena = 'pausa'; tEsc = 0; return; }
    if (enPoder !== undefined) { if (pt) pt.rol = 'boton'; usarPoder(enPoder === 0 ? 'sacudon' : 'rayo'); }
    else if (P.rayoActivo) {
      if (pt) pt.rol = 'boton';
      const b = P.cuerpos.find((c) => !c.muerto && Math.hypot(c.x - p.x, c.y - p.y) < c.r + 6);
      if (b) borrarConRayo(b); else P.rayoActivo = false;
    } else if (CTRL.soltar === 'boton' && Math.hypot(p.x - posTirar().x, p.y - posTirar().y) < radioBoton() + 8) { if (pt) pt.rol = 'boton'; tirar(); }
    else if (p.y > JT - 70 && p.y < H - 80) { if (pt) pt.rol = 'apunta'; P.apunta = { id: p.id, x0: p.x, aim0: P.aimX }; if (CTRL.apuntar === 'dedo') P.aimX = p.x; }
  }
  if (P.apunta) {
    const pt = E.punteros.get(P.apunta.id);
    if (pt) P.aimX = CTRL.apuntar === 'dedo' ? pt.x : P.apunta.aim0 + (pt.x - P.apunta.x0) * CTRL.sensib;
    else { if (CTRL.soltar === 'levantar') tirar(); P.apunta = null; }
  }
  if (E.teclas.has('ArrowLeft') || E.teclas.has('KeyA')) P.aimX -= 220 * dt;
  if (E.teclas.has('ArrowRight') || E.teclas.has('KeyD')) P.aimX += 220 * dt;
  if (apretada('Space', 'ArrowDown', 'KeyS')) tirar();
  if (apretada('KeyQ')) usarPoder('sacudon');
  if (apretada('KeyE')) usarPoder('rayo');
  if (apretada('Escape', 'KeyP')) { escena = 'pausa'; tEsc = 0; return; }
  const ra = CUERPOS[P.actual].r;
  P.aimX = clamp(P.aimX, JL + ra, JR - ra);
  P.carga = Math.max(0, P.carga - dt);
  // la física (en cámara lenta si hace falta)
  const esc = P.lenta > 0 ? 0.3 : 1;
  P.lenta -= dt;
  const fus = pasoFisica(P.cuerpos, Math.min(1 / 30, dt) * esc);
  for (const f of fus) fusionar(f);
  for (const b of P.cuerpos) if (b.golpe) { if (b.golpe > 260) Sonido.sfx('choque', b.tipo); b.golpe = 0; }
  P.cuerpos = P.cuerpos.filter((b) => !b.muerto);
  // el peligro
  if (!P.fin) {
    const arriba = P.cuerpos.some((b) => b.edad > 1.2 && b.y - b.r < LINEA);
    P.peligroT = arriba ? P.peligroT + dt : Math.max(0, P.peligroT - dt * 2);
    Sonido.tension = clamp(Math.max(P.peligroT / 3, (JF - Math.min(JF, ...P.cuerpos.map((b) => b.y - b.r), JF)) / (JF - JT) - 0.3), 0, 1);
    if (P.peligroT > 0.4) { P.alarmaT -= dt; if (P.alarmaT <= 0) { Sonido.sfx('alarma'); P.alarmaT = 0.45; vibrar(10); } }
    if (P.peligroT > 3) terminar(false);
    if (P.modo === 'relampago') { const antes = Math.ceil(P.tiempo); P.tiempo -= dt; if (P.tiempo <= 10 && Math.ceil(P.tiempo) !== antes) Sonido.sfx('tic'); if (P.tiempo <= 0) { P.tiempo = 0; terminar(true); } }
  } else {
    P.finT += dt;
    // al terminar, los cuerpos revientan de arriba para abajo
    if (P.rotura.length && P.finT > 0.5) { const n = Math.min(P.rotura.length, Math.ceil(dt / 0.05)); for (let i = 0; i < n; i++) { const b = P.rotura.shift(); b.muerto = true; chispazo(b.x, b.y, CUERPOS[b.tipo].glow, 14, 160); } }
    if (P.finT > 1.2 + 0.05 * (P.nRotura || 0) && escena === 'juego') { escena = 'fin'; tEsc = 0; }
  }
  // efectos
  for (let i = P.part.length - 1; i >= 0; i--) { const q = P.part[i]; q.t -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= Math.pow(0.2, dt); q.vy = q.vy * Math.pow(0.2, dt) + 80 * dt; if (q.t <= 0) P.part.splice(i, 1); }
  for (let i = P.textos.length - 1; i >= 0; i--) { const q = P.textos[i]; q.t += dt; q.y -= 30 * dt; if (q.t > 1) P.textos.splice(i, 1); }
  for (let i = P.ondas.length - 1; i >= 0; i--) { const o = P.ondas[i]; o.t += dt; if (o.t > o.dur) P.ondas.splice(i, 1); }
  if (P.banner) { P.banner.t += dt; if (P.banner.t > 2) P.banner = null; }
  P.sacudir = Math.max(0, P.sacudir - dt * 20); P.destello = Math.max(0, P.destello - dt * 2);
  P.vis = P.vis < P.puntos ? Math.min(P.puntos, P.vis + Math.max(1, (P.puntos - P.vis) * dt * 7)) : P.puntos;
}
function tirar() {
  const P = G;
  if (P.carga > 0 || P.fin) return;
  const b = nuevoCuerpo(P.actual, P.aimX, yLanzador() + 10);
  b.vy = 60; P.cuerpos.push(b);
  P.actual = P.siguiente; P.siguiente = sortear(P.rnd); P.carga = 0.5; P.tiradas++;
  Sonido.sfx('tirar'); vibrar(6);
  if (!DATOS.ayuda) { DATOS.ayuda = true; guardarDatos(); }
  guardarPartida();
}
function fusionar(f) {
  const P = G;
  if (P.t - P.ultFusion < 0.9) P.cadena++; else P.cadena = 1;
  P.ultFusion = P.t;
  const mult = 1 + (P.cadena - 1) * 0.25;
  if (f.tipo === MAX) {
    // supernova
    const pts = Math.round(500 * mult); P.puntos += pts;
    P.textos.push({ txt: '+' + pts, x: f.x, y: f.y, t: 0, col: '#ffffff', tam: 30 });
    P.banner = { txt: tr('supernova'), t: 0, col: '#ffd84a' };
    for (const b of P.cuerpos) if (!b.muerto) { const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy) || 1, k = 90000 / (d + 60); b.vx += dx / d * k * 0.02; b.vy += dy / d * k * 0.02 - 300; }
    chispazo(f.x, f.y, '#ffd84a', 80, 420); chispazo(f.x, f.y, '#b46aff', 60, 300);
    P.ondas.push({ x: f.x, y: f.y, t: 0, dur: 0.9, r: 260, col: '#ffd84a' });
    P.sacudir = 14; P.lenta = 1.2; P.destello = 1;
    DATOS.supernovas++; guardarDatos();
    Sonido.sfx('supernova'); vibrar([60, 40, 120]);
  } else {
    const k = f.tipo + 1, nb = nuevoCuerpo(k, f.x, f.y);
    nb.r = CUERPOS[f.tipo].r * 1.05; nb.vx = f.vx; nb.vy = f.vy; nb.edad = 0;
    P.cuerpos.push(nb);
    for (const b of P.cuerpos) if (!b.muerto && b !== nb) { const dx = b.x - f.x, dy = b.y - f.y, d = Math.hypot(dx, dy) || 1; if (d < nb.rT + b.r + 18) { b.vx += dx / d * 140; b.vy += dy / d * 140 - 40; } }
    const pts = Math.round(CUERPOS[k].puntos * 2 * mult); P.puntos += pts;
    P.textos.push({ txt: '+' + pts + (P.cadena > 1 ? '  ' + tr('combo') + ' ×' + P.cadena : ''), x: f.x, y: f.y - nb.rT, t: 0, col: CUERPOS[k].glow, tam: 14 + Math.min(10, k) });
    chispazo(f.x, f.y, CUERPOS[k].glow, 10 + k * 3, 120 + k * 20);
    P.ondas.push({ x: f.x, y: f.y, t: 0, dur: 0.4, r: nb.rT * 2, col: CUERPOS[k].glow });
    P.sacudir = Math.max(P.sacudir, k * 0.6); P.destello = Math.max(P.destello, k >= 7 ? 0.35 : 0);
    Sonido.sfx('fusion', k); vibrar(8 + k * 3);
    if (k > P.maxTipo) P.maxTipo = k;
    if (k > DATOS.visto) { DATOS.visto = k; guardarDatos(); P.banner = { txt: tr('descubriste', tr('nombres')[k]), t: 0, col: CUERPOS[k].glow, tipo: k }; P.lenta = 0.6; Sonido.sfx('descubrir'); }
  }
  // poderes que se ganan con puntos
  while (P.puntos >= P.proxPoder) { const cual = (P.proxPoder / 800) % 2 ? 'sacudon' : 'rayo'; P.poderes[cual]++; P.proxPoder += 800; P.textos.push({ txt: '+1 ' + tr(cual), x: posPoder(cual === 'sacudon' ? 0 : 1).x, y: H - 90, t: 0, col: '#ffd84a', tam: 12 }); }
  guardarPartida();
}
function usarPoder(cual) {
  const P = G;
  if (P.fin || P.poderes[cual] <= 0) return;
  if (cual === 'rayo') { P.rayoActivo = !P.rayoActivo; Sonido.sfx('boton'); return; }
  P.poderes.sacudon--;
  for (const b of P.cuerpos) { b.vy -= azar(350, 650); b.vx += azar(-180, 180); }
  P.sacudir = 10; Sonido.sfx('sacudon'); vibrar([30, 30, 60]);
  guardarPartida();
}
function borrarConRayo(b) {
  const P = G;
  P.poderes.rayo--; P.rayoActivo = false;
  b.muerto = true;
  chispazo(b.x, b.y, '#bff8ff', 30, 220);
  P.ondas.push({ x: b.x, y: b.y, t: 0, dur: 0.35, r: b.r * 2, col: '#3ef0ff' });
  P.rayoVisual = { x: b.x, y: b.y, t: 0.25 };
  Sonido.sfx('rayo'); vibrar(30);
  guardarPartida();
}
function terminar(porTiempo) {
  const P = G;
  P.fin = true; P.finT = 0; P.porTiempo = porTiempo;
  P.rotura = P.cuerpos.slice().sort((a, b) => a.y - b.y); P.nRotura = P.rotura.length;
  if (P.modo === 'relampago') { P.nuevo = P.puntos > DATOS.recordRayo; if (P.nuevo) DATOS.recordRayo = P.puntos; }
  else { P.nuevo = P.puntos > DATOS.record && P.modo === 'clasico'; if (P.nuevo) DATOS.record = P.puntos; }
  if (P.modo === 'diario') { if (DATOS.diaFecha !== hoy()) { DATOS.diaFecha = hoy(); DATOS.diaRecord = 0; } DATOS.diaRecord = Math.max(DATOS.diaRecord, P.puntos); }
  guardarDatos(); guardarPartida();

}
function chispazo(x, y, col, n, v) { const P = G; for (let i = 0; i < n && P.part.length < 500; i++) { const a = Math.random() * Math.PI * 2, s = azar(0.3, 1) * v; P.part.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, col: Math.random() < 0.3 ? '#ffffff' : col, t: azar(0.3, 0.8), vida: 0.8, tam: azar(1, 2.6) }); } }

function partir(s, n) { const out = []; let l = ''; for (const p of s.split(' ')) { if ((l + ' ' + p).trim().length > n && l) { out.push(l); l = p; } else l = (l + ' ' + p).trim(); } if (l) out.push(l); return out; }

let prueba = { x: W / 2, apunta: null, tiro: 0 };
