const L = {
  V: [[[8, 8], [50, 112], [92, 8]]],
  I: [[[18, 8], [18, 112]]],
  Í: [[[22, 8], [22, 112]], [[18, -22], [38, -40]]],
  B: [[[16, 112], [16, 8], [52, 8], ['c', 86, 8, 86, 58, 52, 58], [16, 58]], [[52, 58], ['c', 94, 58, 94, 112, 54, 112], [16, 112]]],
  O: 'O',
  R: [[[16, 112], [16, 8], [52, 8], ['c', 88, 8, 88, 62, 52, 62], [16, 62]], [[50, 62], [88, 112]]],
  A: [[[8, 112], [50, 8], [92, 112]], [[26, 74], [74, 74]]],
  '.': '.',
};
const ANCHO = { V: 100, I: 36, Í: 44, B: 92, O: 104, R: 94, A: 100, '.': 36 };

function caminoLetra(ch, x, y, k) {
  const p = new Path2D(), def = L[ch];
  if (def === 'O') { p.ellipse(x + 52 * k, y + 60 * k, 42 * k, 52 * k, 0, 0, Math.PI * 2); return p; }
  if (def === '.') return p;
  for (const tramo of def) tramo.forEach((q, i) => {
    if (q[0] === 'c') p.bezierCurveTo(x + q[1] * k, y + q[2] * k, x + q[3] * k, y + q[4] * k, x + q[5] * k, y + q[6] * k);
    else if (i === 0) p.moveTo(x + q[0] * k, y + q[1] * k);
    else p.lineTo(x + q[0] * k, y + q[1] * k);
  });
  return p;
}

let lienzoFranjas = null;
function franjas() {
  if (lienzoFranjas) return lienzoFranjas;
  const c = document.createElement('canvas'); c.width = 24; c.height = 24;
  const f = c.getContext('2d');
  f.fillStyle = '#8cff3a'; f.fillRect(0, 0, 24, 24); f.fillStyle = '#58c91c'; f.fillRect(0, 0, 12, 24);
  return (lienzoFranjas = c);
}

// Dibuja "VÍBORA.IO" centrado en (cx, cy) con alto de letra `alto`.
// `t` mueve las franjas y hace latir el punto (una comida que brilla).
function dibujarLogo(g, cx, cy, alto, t = 0) {
  const texto = ['V', 'Í', 'B', 'O', 'R', 'A', '.', 'I', 'O'];
  const k = alto / 120, gro = 27 * k;
  const total = texto.reduce((s, c) => s + ANCHO[c] * k, 0) + (texto.length - 1) * 6 * k;
  let x = cx - total / 2;
  const y = cy - alto / 2;
  const caminos = [];
  for (const ch of texto) { caminos.push([ch, caminoLetra(ch, x, y, k), x]); x += (ANCHO[ch] + 6) * k; }
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round';
  const pasada = (ancho, estilo, dy = 0) => {
    for (const [ch, p] of caminos) { if (ch === '.') continue; g.save(); g.translate(0, dy); g.lineWidth = ancho; g.strokeStyle = estilo; g.stroke(p); g.restore(); }
  };
  pasada(gro + 12 * k, 'rgba(0,0,0,0.45)', 7 * k);   // sombra
  pasada(gro + 9 * k, '#0b2410');                     // borde
  // el cuerpo con franjas que corren (el patrón se mueve con t); el lienzo
  // de las franjas se hace una vez, no en cada cuadro del menú
  const patron = g.createPattern(franjas(), 'repeat');
  patron.setTransform(new DOMMatrix([k * 1.6, k * 1.6, -k * 1.6, k * 1.6, t * 30 * k, 0]));
  pasada(gro, patron);
  pasada(gro * 0.32, 'rgba(255,255,255,0.55)', -gro * 0.22);     // brillo
  // el ojito en la primera O
  const [, , ox] = caminos[3];
  g.fillStyle = '#ffffff'; g.beginPath(); g.arc(ox + 70 * k, y + 32 * k, 11 * k, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#101018'; g.beginPath(); g.arc(ox + 73 * k, y + 33 * k, 6 * k, 0, Math.PI * 2); g.fill();
  // el punto: una comida que late
  const [, , px] = caminos[6], late = 1 + Math.sin(t * 5) * 0.15;
  const rad = 14 * k * late, gr = g.createRadialGradient(px + 18 * k, y + 104 * k, 0, px + 18 * k, y + 104 * k, rad * 2.2);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, '#ffe35e'); gr.addColorStop(1, 'rgba(255,200,40,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(px + 18 * k, y + 104 * k, rad * 2.2, 0, Math.PI * 2); g.fill();
  g.restore();
  return total;
}
return { dibujarLogo };
})();

/* ── vibora ── */
const M_vibora = (() => {
// Una víbora: la cabeza se mueve y el cuerpo es el camino que dejó, guardado
// como puntos a PASO unidades uno del otro en un anillo (el punto nuevo entra
// por un lado y el de la cola se cae por el otro, sin mover la lista). Crecer
// es dejar de cortar la cola: el cuerpo se estira solo mientras avanza.
const { clamp, difAng } = M_util;
const { colorDe } = M_pieles;
const PASO = 4;
const CAP = 1600;                 // puntos: alcanza para el largo máximo (~5600 unidades)
const MASA_INICIAL = 10;
const MASA_TURBO = 12;     // con menos no hay turbo

class Vibora {
  constructor({ id, nombre, piel, x, y, ang = 0, masa = MASA_INICIAL, bot = false }) {
    Object.assign(this, { id, nombre, piel, x, y, ang, masa, bot });
    this.angObj = ang;
    this.turbo = false;
    this.viva = true;
    this.bajas = 0;
    this.t = 0;
    this.goteo = 0;               // masa gastada en turbo que todavía no cayó como comida
    this.px = new Float32Array(CAP);
    this.py = new Float32Array(CAP);
    this.cab = 0; this.n = 0;
    // el cuerpo nace estirado detrás de la cabeza
    const n = Math.ceil(this.largo() / PASO);
    for (let k = n; k >= 1; k--) this.empujar(x - Math.cos(ang) * PASO * k, y - Math.sin(ang) * PASO * k);
  }

  // Cuanto más come, más gruesa, más larga y más lenta para doblar (así una
  // chiquita siempre puede escaparse de una grande).
  radio() { return 11 + Math.min(33, Math.sqrt(this.masa) * 0.8); }
  largo() { return 60 + 3.3 * Math.pow(this.masa, 0.85); }
  velocidad() { return this.turbo ? 470 : 200; }
  giro() { return 4.6 / (1 + (this.radio() - 13) / 26); }

  // El punto k del cuerpo (0 = el más nuevo, al lado de la cabeza).
  i(k) { return (this.cab + k) % CAP; }
  empujar(x, y) {
    this.cab = (this.cab - 1 + CAP) % CAP;
    this.px[this.cab] = x; this.py[this.cab] = y;
    if (this.n < CAP) this.n++;
  }

  // `soltar(x, y, valor, color)` deja comida (la del turbo cae por la cola).
  pasar(dt, soltar) {
    this.t += dt;
    const d = difAng(this.ang, this.angObj), max = this.giro() * dt;
    this.ang += clamp(d, -max, max);
    // el ángulo queda entre -π y π (dando vueltas no crece sin fin)
    if (this.ang > Math.PI) this.ang -= Math.PI * 2; else if (this.ang < -Math.PI) this.ang += Math.PI * 2;
    if (this.turbo && this.masa <= MASA_TURBO) this.turbo = false;
    if (this.turbo) { const gasto = 4 * dt; this.masa -= gasto; this.goteo += gasto; }
    const v = this.velocidad();
    this.x += Math.cos(this.ang) * v * dt;
    this.y += Math.sin(this.ang) * v * dt;
    // puntos nuevos cada PASO, sobre la recta desde el último
    let lx = this.px[this.cab], ly = this.py[this.cab];
    let dx = this.x - lx, dy = this.y - ly, dist = Math.hypot(dx, dy);
    while (dist >= PASO) {
      lx += (dx / dist) * PASO; ly += (dy / dist) * PASO;
      this.empujar(lx, ly);
      dx = this.x - lx; dy = this.y - ly; dist = Math.hypot(dx, dy);
    }
    // la cola se acorta de a poco, 240 puntos por segundo (si no, al gastar
    // turbo pega un salto); por segundo y no por paso: los pasos varían
    const quiero = Math.min(CAP, Math.ceil(this.largo() / PASO));
    if (this.n > quiero) this.n = Math.max(quiero, this.n - Math.max(1, Math.round(240 * dt)));
    if (this.goteo >= 1.5 && soltar) {
      const k = this.n - 1, j = this.i(k);
      soltar(this.px[j], this.py[j], this.goteo * 0.8, colorDe(this.piel, Math.floor(k / this.salto())));
      this.goteo = 0;
    }
  }

  // Cada cuántos puntos se dibuja una bolita (se solapan: cuerpo liso).
  salto() { return Math.max(1, Math.round((this.radio() * 0.42) / PASO)); }
  // Cada cuántos puntos se prueba un choque (un poco más espaciado).
  saltoChoque() { return Math.max(1, Math.round((this.radio() * 0.7) / PASO)); }
}
return { PASO, MASA_INICIAL, MASA_TURBO, Vibora };
})();

/* ── mundo ── */
const M_mundo = (() => {
// El mundo: una arena redonda con comida, víboras y bots. Sin dibujo: lo usa
// el juego y lo usan las pruebas en Node (miles de pasos en un momento).
//
// Dos grillas de 128 unidades: la de la comida (fija, se toca al comer o al
// nacer comida) y la de los cuerpos (se rehace cada paso con una muestra
// cada tanto de cada víbora). Con eso, comer, chocar y los "ojos" de los
// bots miran solo las celdas de al lado y no todo el mundo.
const { azar, clamp } = M_util;
const { Vibora, MASA_INICIAL } = M_vibora;
const { PIELES, NOMBRES, colorDe } = M_pieles;
const { pensar } = M_ia;
const CAP_COMIDA = 9000;
const CELDA = 128;
const CAP_MUESTRAS = 12000;

class Mundo {
  constructor({ radio = 3000, semilla = 1, bots = 18, comida = 1500, nivelBots = 1 } = {}) {
    this.r = azar(semilla);
    this.radio = radio;
    this.t = 0;
    this.viboras = [];
    this.eventos = [];
    this.proximoId = 1;
    this.cantidadBots = bots;
    this.nivelBots = nivelBots;           // 0 tranqui · 1 normal · 2 picante
    this.esperando = [];                  // bots muertos que vuelven a nacer
    // la comida, en arreglos planos (miles de bolitas: nada de objetos)
    this.fx = new Float32Array(CAP_COMIDA); this.fy = new Float32Array(CAP_COMIDA);
    this.fv = new Float32Array(CAP_COMIDA); this.fr = new Float32Array(CAP_COMIDA);
    this.fn = new Float32Array(CAP_COMIDA);                 // cuándo nació (para que aparezca creciendo)
    this.fc = new Uint16Array(CAP_COMIDA); this.fvivo = new Uint8Array(CAP_COMIDA);
    // la celda donde quedó anotada: el imán la mueve, y sacarla buscando por
    // la posición nueva dejaba la vieja anotada (se comía dos veces: la masa
    // crecía sin freno en la primera simulación)
    this.fcel = new Int32Array(CAP_COMIDA);
    this.libres = []; for (let i = CAP_COMIDA - 1; i >= 0; i--) this.libres.push(i);
    this.colores = []; this.indiceColor = new Map();
    this.nc = Math.ceil((radio * 2) / CELDA) + 2;
    this.grilla = Array.from({ length: this.nc * this.nc }, () => []);
    this.comidaMeta = comida;
    this.cantidadComida = 0;
    // la grilla de cuerpos
    this.sx = new Float32Array(CAP_MUESTRAS); this.sy = new Float32Array(CAP_MUESTRAS);
    this.sr = new Float32Array(CAP_MUESTRAS); this.sv = new Int32Array(CAP_MUESTRAS);
    this.ns = 0;
    this.celdasCuerpo = Array.from({ length: this.nc * this.nc }, () => []);
    this.usadas = [];
    for (let k = 0; k < comida; k++) this.comidaSuelta();
    for (let k = 0; k < bots; k++) this.nacerBot(true);
  }

  // ── la comida ────────────────────────────────────────────────────────────
  celdaDe(x, y) {
    const cx = clamp(Math.floor((x + this.radio) / CELDA) + 1, 0, this.nc - 1);
    const cy = clamp(Math.floor((y + this.radio) / CELDA) + 1, 0, this.nc - 1);
    return cy * this.nc + cx;
  }
  color(c) {
    let i = this.indiceColor.get(c);
    if (i === undefined) { i = this.colores.length; this.colores.push(c); this.indiceColor.set(c, i); }
    return i;
  }
  ponerComida(x, y, valor, color) {
    const i = this.libres.pop();
    if (i === undefined) return -1;
    this.fx[i] = x; this.fy[i] = y; this.fv[i] = valor;
    this.fr[i] = Math.min(15, 3.5 + Math.sqrt(valor) * 2.6);
    this.fn[i] = this.t; this.fc[i] = this.color(color); this.fvivo[i] = 1;
    const c = this.celdaDe(x, y);
    this.fcel[i] = c;
    this.grilla[c].push(i);
    this.cantidadComida++;
    return i;
  }
  sacarComida(i) {
    if (!this.fvivo[i]) return;
    this.fvivo[i] = 0;
    const c = this.grilla[this.fcel[i]], k = c.indexOf(i);
    if (k >= 0) { c[k] = c[c.length - 1]; c.pop(); }
    this.libres.push(i);
    this.cantidadComida--;
  }
  comidaSuelta() {
    const a = this.r() * Math.PI * 2, d = Math.sqrt(this.r()) * (this.radio - 40);
    const PALETA = ['#ff5e5e', '#ffb13b', '#ffe35e', '#7dff5e', '#5ef3ff', '#5e8bff', '#c45eff', '#ff5ec8'];
    this.ponerComida(Math.cos(a) * d, Math.sin(a) * d, 1 + (this.r() < 0.2 ? 1 : 0), PALETA[(this.r() * PALETA.length) | 0]);
  }

  // ── las víboras ──────────────────────────────────────────────────────────
  // Un lugar para nacer lejos de los cuerpos (probar unos cuantos al azar).
  lugarLibre() {
    let mejor = null, lejos = -1;
    for (let k = 0; k < 14; k++) {
      const a = this.r() * Math.PI * 2, d = Math.sqrt(this.r()) * this.radio * 0.8;
      const x = Math.cos(a) * d, y = Math.sin(a) * d;
      let cerca = Infinity;
      for (const v of this.viboras) if (v.viva) cerca = Math.min(cerca, Math.hypot(v.x - x, v.y - y));
      if (cerca > 500) return [x, y];
      if (cerca > lejos) { lejos = cerca; mejor = [x, y]; }
    }
    return mejor;
  }
  nacer({ nombre, piel, masa = MASA_INICIAL, bot = false }) {
    const [x, y] = this.lugarLibre();
    const v = new Vibora({ id: this.proximoId++, nombre, piel, x, y, ang: this.r() * Math.PI * 2, masa, bot });
    this.viboras.push(v);
    return v;
  }
  nacerBot(alArrancar = false) {
    // la mayoría chicas, algunas grandes: así la tabla tiene de todo
    const q = this.r(), masa = alArrancar && q < 0.25 ? 150 + this.r() * 1400 : q < 0.5 ? 30 + this.r() * 120 : MASA_INICIAL + this.r() * 20;
    const usados = new Set(this.viboras.filter((v) => v.viva).map((v) => v.nombre));
    let nombre = NOMBRES[(this.r() * NOMBRES.length) | 0];
    for (let k = 0; k < 5 && usados.has(nombre); k++) nombre = NOMBRES[(this.r() * NOMBRES.length) | 0];
    const v = this.nacer({ nombre, piel: PIELES[(this.r() * PIELES.length) | 0], masa, bot: true });
    v.ia = { proxima: this.r() * 0.1, codicia: 0.6 + this.r() * 0.8, agresion: [0.1, 0.45, 0.8][this.nivelBots] * (0.5 + this.r()), prudencia: 0.7 + this.r() * 0.6, deambula: this.r() * Math.PI * 2 };
    return v;
  }

  // ── el paso ──────────────────────────────────────────────────────────────
  pasar(dt) {
    this.t += dt;
    const soltar = (x, y, valor, color) => this.ponerComida(x + (this.r() - 0.5) * 6, y + (this.r() - 0.5) * 6, valor, color);
    this.armarCuerpos();
    for (const v of this.viboras) {
      if (!v.viva) continue;
      if (v.bot && (v.ia.proxima -= dt) <= 0) { pensar(v, this); v.ia.proxima = 0.1; }
      v.pasar(dt, soltar);
    }
    this.armarCuerpos();
    for (const v of this.viboras) if (v.viva) this.comer(v, dt);
    for (const v of this.viboras) if (v.viva) this.choques(v);
    // los bots muertos vuelven, y la comida suelta se repone de a poco
    this.esperando = this.esperando.filter((e) => { if (this.t < e.cuando) return true; this.nacerBot(); return false; });
    const vivos = this.viboras.filter((v) => v.viva && v.bot).length + this.esperando.length;
    for (let k = vivos; k < this.cantidadBots; k++) this.esperando.push({ cuando: this.t + 1 + this.r() * 3 });
    // hasta 480 bolitas por segundo (por segundo y no por paso: los pasos varían)
    let reponer = Math.min(Math.max(1, Math.round(480 * dt)), this.comidaMeta - this.cantidadComida);
    while (reponer-- > 0) this.comidaSuelta();
    // las muertas se sacan de la lista (después de avisar)
    if (this.viboras.some((v) => !v.viva)) this.viboras = this.viboras.filter((v) => v.viva);
  }

  // Una muestra cada tanto de cada cuerpo, en su celda.
  armarCuerpos() {
    for (const c of this.usadas) this.celdasCuerpo[c].length = 0;
    this.usadas.length = 0;
    let n = 0;
    for (let vi = 0; vi < this.viboras.length; vi++) {
      const v = this.viboras[vi];
      if (!v.viva) continue;
      const r = v.radio(), salto = v.saltoChoque();
      const poner = (x, y) => {
        if (n >= CAP_MUESTRAS) return;
        this.sx[n] = x; this.sy[n] = y; this.sr[n] = r; this.sv[n] = vi;
        const c = this.celdaDe(x, y), lista = this.celdasCuerpo[c];
        if (!lista.length) this.usadas.push(c);
        lista.push(n++);
      };
      poner(v.x, v.y);
      for (let k = salto; k < v.n; k += salto) { const j = v.i(k); poner(v.px[j], v.py[j]); }
    }
    this.ns = n;
  }

  // Lo que queda cerca de la cabeza viene hacia la boca (el imán) y se come.
  comer(v, dt) {
    const r = v.radio(), alcance = r * 1.6 + 28, boca = r * 0.9;
    const cx = Math.floor((v.x + this.radio) / CELDA) + 1, cy = Math.floor((v.y + this.radio) / CELDA) + 1;
    for (let j = cy - 1; j <= cy + 1; j++) for (let i = cx - 1; i <= cx + 1; i++) {
      if (i < 0 || j < 0 || i >= this.nc || j >= this.nc) continue;
      const c = this.grilla[j * this.nc + i];
      for (let k = c.length - 1; k >= 0; k--) {
        const f = c[k];
        if (!this.fvivo[f]) continue;
        const dx = v.x - this.fx[f], dy = v.y - this.fy[f], d = Math.hypot(dx, dy);
        if (d < boca) {
          v.masa += this.fv[f];
          // los bots comen callados: el aviso es para la del jugador (sonido)
          if (!v.bot) this.eventos.push({ tipo: 'come', v, valor: this.fv[f] });
          this.sacarComida(f);
        } else if (d < alcance) {
          // se arrima (queda en su celda: en un par de cuadros se come igual)
          const paso = Math.min(d - boca * 0.5, (260 + v.velocidad()) * dt);
          this.fx[f] += (dx / d) * paso; this.fy[f] += (dy / d) * paso;
        }
      }
    }
  }

  // ¿La cabeza tocó el cuerpo de otra, o el borde?
  choques(v) {
    const vi = this.viboras.indexOf(v), r = v.radio();
    if (v.x * v.x + v.y * v.y > (this.radio - r * 0.5) ** 2) return this.morir(v, null);
    const cx = Math.floor((v.x + this.radio) / CELDA) + 1, cy = Math.floor((v.y + this.radio) / CELDA) + 1;
    for (let j = cy - 1; j <= cy + 1; j++) for (let i = cx - 1; i <= cx + 1; i++) {
      if (i < 0 || j < 0 || i >= this.nc || j >= this.nc) continue;
      for (const s of this.celdasCuerpo[j * this.nc + i]) {
        if (this.sv[s] === vi) continue;
        const toca = r * 0.62 + this.sr[s] * 0.92;
        if ((this.sx[s] - v.x) ** 2 + (this.sy[s] - v.y) ** 2 < toca * toca) return this.morir(v, this.viboras[this.sv[s]]);
      }
    }
  }

  // Morir: el cuerpo se vuelve comida grande y brillante, de sus colores.
  morir(v, asesino) {
    if (!v.viva) return;
    v.viva = false;
    const r = v.radio(), salto = Math.max(2, Math.round((r * 1.1) / 4));
    const piezas = Math.max(1, Math.floor(v.n / salto)), valor = Math.max(1, (v.masa * 0.8) / piezas);
    for (let k = 0; k < v.n; k += salto) {
      const j = v.i(k), e = r * 0.8;
      this.ponerComida(v.px[j] + (this.r() - 0.5) * e, v.py[j] + (this.r() - 0.5) * e, valor, colorDe(v.piel, Math.floor(k / v.salto())));
    }
    if (asesino && asesino !== v) asesino.bajas++;
    this.eventos.push({ tipo: 'muere', v, asesino });
  }

  // La tabla: todas las vivas, de mayor a menor.
  tabla() { return this.viboras.filter((v) => v.viva).sort((a, b) => b.masa - a.masa); }

  // Lo que pasó desde la última vez (el juego lo usa para sonidos y carteles).
  sacarEventos() { const e = this.eventos; this.eventos = []; return e; }
}
return { Mundo };
})();

/* ── sonido ── */
const M_sonido = (() => {
// El sonido, sintetizado con WebAudio (nada de archivos): efectos suaves y
// redondos para comer, el soplido del turbo, el crujido al morir, la
// campanita al comerte a otra, y dos canciones con progresiones fijas
// (menú tranquilo, partida con ritmo). El AudioContext arranca recién con un
// toque de verdad (main.js › despertar).
const NOTA = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11, Bb: 10, Eb: 3 };
const midi = (n) => { const m = /^([A-G][#b]?)(\d)$/.exec(n); return 12 * (+m[2] + 1) + NOTA[m[1]]; };
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const f = (n) => hz(midi(n));
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];

// acordes: raíz y tipo (m menor, M mayor, m7, M7); bajo y arpegio en 16 pasos
const CANCIONES = {
  menu: {
    bpm: 92, acordes: [['A2', 'm7'], ['F2', 'M7'], ['C3', 'M'], ['G2', 'M']],
    bajo: 'R-------O-----5-', arpegio: '0.2.1.3.2.1.3.2.', bombo: 'x.......x.......', caja: '................', hat: '..x...x...x...x.',
  },
  juego: {
    bpm: 112, acordes: [['D3', 'm'], ['A#2', 'M'], ['F2', 'M'], ['C3', 'M']],
    bajo: 'R.R.O.R.R.R.5.O.', arpegio: '0.1.2.3.2.1.0.2.', bombo: 'x...x...x...x...', caja: '....x.......x...', hat: '..x...x...x...x.',
  },
};
const TIPOS = { m: [0, 3, 7, 12], M: [0, 4, 7, 12], m7: [0, 3, 7, 10], M7: [0, 4, 7, 11] };

function crearSonido(ajustes) {
  let ctx = null, maestro, busSfx, busMus, ruido, turboGan = null, eco;
  const s = { ajustes, errores: [] };
  let tema = null, proximo = 0, pasoN = 0, reloj = null, ultimaComida = 0;

  function iniciar() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    maestro = ctx.createGain(); maestro.gain.value = 0.9;
    // un compresor suave: muchas comidas juntas no saturan
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    maestro.connect(comp); comp.connect(ctx.destination);
    busSfx = ctx.createGain(); busSfx.connect(maestro);
    busMus = ctx.createGain(); busMus.connect(maestro);
    eco = ctx.createDelay(1); eco.delayTime.value = 0.32;
    const vuelta = ctx.createGain(), sal = ctx.createGain();
    vuelta.gain.value = 0.3; sal.gain.value = 0.28;
    busMus.connect(eco); eco.connect(vuelta); vuelta.connect(eco); eco.connect(sal); sal.connect(maestro);
    const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ruido = b;
    s.aplicar();
    return true;
  }

  function tono({ onda = 'sine', f0, f1 = f0, dur = 0.1, vol = 0.1, t = ctx.currentTime, ataque = 0.005, destino = busSfx }) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = onda;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + ataque);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(destino);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function soplo({ dur = 0.1, vol = 0.1, tipo = 'bandpass', f0 = 1000, f1 = f0, q = 1, t = ctx.currentTime, destino = busSfx }) {
    const n = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = ruido; n.loop = true;
    fl.type = tipo; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(fl); fl.connect(g); g.connect(destino);
    n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.02);
  }

  const SFX = {
    // la comida: un "pop" de burbuja, más grave cuanto más grande
    come: ({ valor = 1 } = {}) => {
      const t = ctx.currentTime;
      if (t - ultimaComida < 0.035) return;
      ultimaComida = t;
      const nota = 72 + PENTA[(Math.random() * PENTA.length) | 0] - Math.min(12, Math.log2(valor) * 4);
      tono({ onda: 'sine', f0: hz(nota), f1: hz(nota + 7), dur: 0.07, vol: 0.06 + Math.min(0.08, valor * 0.01) });
    },
    muere: () => {
      soplo({ dur: 0.5, vol: 0.3, tipo: 'lowpass', f0: 2600, f1: 180 });
      tono({ onda: 'triangle', f0: 420, f1: 60, dur: 0.6, vol: 0.18 });
      tono({ onda: 'sine', f0: 110, f1: 40, dur: 0.5, vol: 0.3 });
    },
    baja: () => ['E5', 'G#5', 'B5', 'E6'].forEach((n, k) => tono({ onda: 'triangle', f0: f(n), dur: 0.35, vol: 0.09, t: ctx.currentTime + k * 0.06 })),
    hito: () => ['C5', 'E5', 'G5', 'C6', 'E6'].forEach((n, k) => tono({ onda: 'triangle', f0: f(n), dur: 0.3, vol: 0.08, t: ctx.currentTime + k * 0.07 })),
    nace: () => { soplo({ dur: 0.35, vol: 0.1, f0: 300, f1: 2400, q: 0.8 }); tono({ onda: 'sine', f0: 220, f1: 660, dur: 0.3, vol: 0.08 }); },
    boton: () => { tono({ onda: 'sine', f0: 880, dur: 0.05, vol: 0.07 }); tono({ onda: 'sine', f0: 1320, dur: 0.06, vol: 0.05, t: ctx.currentTime + 0.03 }); },
    cambia: () => { soplo({ dur: 0.12, vol: 0.06, f0: 1500, f1: 4000 }); tono({ onda: 'triangle', f0: 660, f1: 990, dur: 0.1, vol: 0.06 }); },
    error: () => { tono({ onda: 'triangle', f0: 180, dur: 0.1, vol: 0.1 }); tono({ onda: 'triangle', f0: 150, dur: 0.14, vol: 0.1, t: ctx.currentTime + 0.1 }); },
    record: () => ['C5', 'G5', 'C6', 'E6', 'G6', 'C7'].forEach((n, k) => tono({ onda: 'triangle', f0: f(n), dur: 0.4, vol: 0.08, t: ctx.currentTime + k * 0.08 })),
  };

  function programar() {
    if (!tema || !ctx) return;
    const c = CANCIONES[tema], d = 60 / c.bpm / 4;
    if (proximo < ctx.currentTime - 0.3) proximo = ctx.currentTime + 0.05;
    try {
      while (proximo < ctx.currentTime + 0.12) { paso(c, pasoN, proximo, d); proximo += d; pasoN++; }
    } catch (e) { s.errores.push('música ' + tema + ': ' + e.message); tema = null; }
  }
  function paso(c, n, t, d) {
    const p = n % 16, compas = Math.floor(n / 16) % c.acordes.length;
    const [raizN, tipo] = c.acordes[compas], raiz = midi(raizN), ac = TIPOS[tipo];
    const b = c.bajo[p];
    if (b !== '.' && b !== '-') {
      let l = 1; while (c.bajo[p + l] === '-') l++;
      const nota = raiz + (b === 'O' ? 12 : b === '5' ? 7 : 0);
      tono({ onda: 'triangle', f0: hz(nota), dur: d * l * 0.95, vol: 0.2, t, destino: busMus, ataque: 0.01 });
    }
    const a = c.arpegio[p];
    if (a !== '.') tono({ onda: 'sine', f0: hz(raiz + 24 + ac[+a]), dur: d * 1.6, vol: 0.05, t, destino: busMus });
    // un colchón con el acorde al empezar cada compás
    if (p === 0) for (const k of ac.slice(0, 3)) tono({ onda: 'triangle', f0: hz(raiz + 12 + k), dur: d * 15, vol: 0.022, t, ataque: 0.25, destino: busMus });
    if (c.bombo[p] === 'x') tono({ onda: 'sine', f0: 130, f1: 42, dur: 0.16, vol: 0.28, t, destino: busMus });
    if (c.caja[p] === 'x') soplo({ dur: 0.12, vol: 0.06, f0: 2000, q: 0.8, t, destino: busMus });
    if (c.hat[p] === 'x') soplo({ dur: 0.03, vol: 0.02, tipo: 'highpass', f0: 8000, t, destino: busMus });
  }

  s.despertar = () => {
    if (!ctx && !iniciar()) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (!reloj) reloj = setInterval(programar, 25);
  };
  s.tocar = (nombre, op) => {
    if (!ctx || !ajustes.sonido || ctx.state !== 'running') return;
    if (!SFX[nombre]) { s.errores.push('no existe ' + nombre); return; }
    try { SFX[nombre](op); } catch (e) { s.errores.push(nombre + ': ' + e.message); }
  };
  s.musica = (nombre) => {
    if (s.cancion === nombre) return;
    s.cancion = nombre; tema = CANCIONES[nombre] ? nombre : null; pasoN = 0;
    if (ctx) proximo = ctx.currentTime + 0.05;
  };
  s.aplicar = () => {
    if (!ctx) return;
    busSfx.gain.setTargetAtTime(ajustes.sonido ? 0.9 : 0, ctx.currentTime, 0.02);
    busMus.gain.setTargetAtTime(ajustes.musica ? 0.5 : 0, ctx.currentTime, 0.05);
  };
  // El soplido del turbo, que suena mientras dura.
  s.turbo = (encendido) => {
    if (!ctx) return;
    if (!turboGan) {
      const n = ctx.createBufferSource(), fl = ctx.createBiquadFilter();
      n.buffer = ruido; n.loop = true; fl.type = 'bandpass'; fl.frequency.value = 1400; fl.Q.value = 0.7;
      turboGan = ctx.createGain(); turboGan.gain.value = 0;
      n.connect(fl); fl.connect(turboGan); turboGan.connect(busSfx); n.start();
    }
    turboGan.gain.setTargetAtTime(encendido && ajustes.sonido ? 0.07 : 0, ctx.currentTime, 0.05);
  };
  // La música de la intro de JXSTUDIOS (intro.js › T_*): el metal que se
  // escribe (zumbidos que suben), el golpe (bombo + campana de parciales no
  // armónicos), el brillo y un acorde grande que queda.
  s.jingleJXS = () => {
    // con el audio suspendido (sin un toque) se agendaría y sonaría tarde, fuera de fase
    if (!ctx || ctx.state !== 'running' || !(ajustes.sonido || ajustes.musica)) return null;
    const bus = ctx.createGain(); bus.gain.value = 1; bus.connect(maestro);
    const t0 = ctx.currentTime + 0.03, tg = t0 + 1.05;
    soplo({ dur: 0.9, vol: 0.09, f0: 200, f1: 3000, q: 0.9, t: t0 + 0.1, destino: bus });
    [0.15, 0.3, 0.45, 0.6].forEach((dd, k) => tono({ onda: 'triangle', f0: 180 + k * 60, f1: 900 + k * 180, dur: 0.35, vol: 0.05, t: t0 + dd, destino: bus }));
    tono({ onda: 'sine', f0: 100, f1: 28, dur: 1.2, vol: 0.6, t: tg, destino: bus });
    for (const [fr, v, dd] of [[440, 0.07, 1.8], [1046, 0.05, 1.4], [1712, 0.035, 1.0], [2630, 0.025, 0.7], [3880, 0.015, 0.45]]) tono({ onda: 'sine', f0: fr, dur: dd, vol: v, t: tg, destino: bus });
    soplo({ dur: 0.5, vol: 0.25, tipo: 'lowpass', f0: 5000, f1: 220, t: tg, destino: bus });
    ['A5', 'C#6', 'E6', 'A6', 'C#7', 'E7'].forEach((n, k) => tono({ onda: 'triangle', f0: f(n), dur: 0.4, vol: 0.045, t: tg + 0.3 + k * 0.045, destino: bus }));
    for (const n of ['A2', 'E3', 'C#4', 'G#4', 'B4', 'E5']) tono({ onda: 'triangle', f0: f(n), dur: 2.0, vol: 0.05, t: tg + 0.1, ataque: 0.3, destino: bus });
    return { cortar: () => bus.gain.setTargetAtTime(0, ctx.currentTime, 0.06) };
  };
  s.activo = () => !!ctx && ctx.state === 'running';
  return s;
}
return { crearSonido, CANCIONES };
})();

/* ── main ── */
(() => {
// Víbora.io, de JXSTUDIOS: el arranque, las pantallas y el bucle.
//
// El mundo corre siempre (en el menú, los bots juegan atrás y la cámara sigue
// a una); al tocar JUGAR, tu víbora nace en ese mismo mundo. Cada cuadro la
// simulación avanza lo que tardó el cuadro, en pasos de a lo sumo 1/60 s, y
// se dibuja una vez.
//
// Para probar: ?sinintro (directo al menú), ?directo=juego, ?pausa (no avanza
// solo: __V.pasos(n); también saltea la intro, salvo con ?intro), ?limpio (sin
// lo guardado), ?idioma=en.
const { Mundo } = M_mundo;
const { Vibora } = M_vibora;
const { dibujarArena, dibujarVibora } = M_dibujo;
const { pintarFondo, FONDOS } = M_fondos;
const { dibujarHud } = M_hud;
const { dibujarLogo } = M_logo;
const { crearEntrada } = M_entrada;
const { crearSonido } = M_sonido;
const { crearIdioma, IDIOMAS } = M_idioma;
const { cargar, guardar, base } = M_guardado;
const { PIELES, pielPorId, abierta } = M_pieles;
const { Intro } = M_intro;
const { acercar, clamp, trozos } = M_util;
const PASO = 1 / 60;
const BOTS = [10, 18, 26];
const HITOS = [100, 250, 500, 1000, 2000, 3500, 5000, 7500, 10000];
const q = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const lienzo = $('juego'), g = lienzo.getContext('2d');

let datos = q.has('limpio') ? base() : cargar();
if (IDIOMAS.includes(q.get('idioma'))) datos.ajustes.idioma = q.get('idioma');
const tr = crearIdioma(datos.ajustes.idioma);
const sonido = crearSonido(datos.ajustes);
const entrada = crearEntrada(lienzo);
const tactil = window.matchMedia?.('(pointer: coarse)').matches ?? false;
const guardarTodo = () => guardar(datos);
// antes del primer toque el navegador no deja vibrar (y lo avisa en la consola)
const vibrar = (p) => { if (datos.ajustes.vibrar && navigator.vibrate && navigator.userActivation?.hasBeenActive !== false) try { navigator.vibrate(p); } catch { /* no deja */ } };

// ── la pantalla: resolución de verdad, con tope según la calidad ──────────
// en el teléfono, 1,5 de densidad: se ve nítido y pinta la mitad de píxeles que a 2
let W = 0, H = 0, dpr = 1, dprTope = tactil ? 1.5 : 2;
function medir() {
  const tope = datos.ajustes.calidad === 'baja' ? 1 : datos.ajustes.calidad === 'alta' ? 2.5 : dprTope;
  dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, tope));
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (w !== W || h !== H) { W = lienzo.width = w; H = lienzo.height = h; }
  entrada.dpr = dpr;
}
medir();
addEventListener('resize', medir);

// ── el mundo y la cámara ───────────────────────────────────────────────────
let mundo = nuevoMundo();
function nuevoMundo() { return new Mundo({ semilla: ((Date.now() / 1000) | 0) & 0xffffff, bots: BOTS[datos.nivelBots], nivelBots: datos.nivelBots }); }
let mia = null, seguida = null, estado = 'espera', intro = null, preview = null, muerteT = 0, avisos = [], hitoN = 0, t = 0, sonarRecord = false;
const cam = { x: 0, y: 0, zoom: 1 };

function camara(dt) {
  // al nacer se ven unas 600 unidades en el lado corto; al crecer, la cámara se aleja
  const base = Math.min(W, H) / 600;
  let obj = mia && mia.viva && (estado === 'juego' || estado === 'pausa') ? mia : null;
  if (!obj && estado !== 'muerte') {
    if (!seguida || !seguida.viva) seguida = mundo.tabla()[Math.min(3, mundo.viboras.length - 1)] || null;
    obj = seguida;
  }
  if (obj) {
    cam.x = acercar(cam.x, obj.x, 9, dt); cam.y = acercar(cam.y, obj.y, 9, dt);
    const z = base * clamp(1.25 - (obj.radio() - 13) / 55, 0.5, 1.2) * (estado === 'menu' ? 0.8 : 1);
    cam.zoom = acercar(cam.zoom, z, 2, dt);
  }
}

// ── las pantallas de HTML ──────────────────────────────────────────────────
function mostrar(id) { for (const s of document.querySelectorAll('.pantalla')) s.classList.toggle('oculto', s.id !== id); }

function textos() {
  document.documentElement.lang = tr.actual();
  $('apodo').placeholder = tr('apodo');
  $('bJugar').textContent = tr('jugar');
  $('bPiel').textContent = tr('piel'); $('bFondo').textContent = tr('fondo'); $('bAjustes').textContent = tr('ajustes');
  $('tBots').textContent = tr('bots');
  document.querySelectorAll('.opcion[data-nivel]').forEach((b) => { b.textContent = tr('nivel_' + b.dataset.nivel); b.classList.toggle('elegida', +b.dataset.nivel === datos.nivelBots); });
  $('tMejor').textContent = datos.mejor ? tr('mejor', Math.floor(datos.mejor).toLocaleString('es-AR')) : '';
  $('tConsejo').textContent = tactil ? tr('consejo') : tr('consejoPc');
  $('tFirma').textContent = tr('creditos').toUpperCase();
  $('bListo').textContent = tr('listo');
  $('tAjustes').textContent = tr('ajustes'); $('bCerrarAjustes').textContent = tr('listo');
  $('tPausa').textContent = tr('pausa'); $('bSeguir').textContent = tr('seguir'); $('bSalirPausa').textContent = tr('menu');
  $('bOtraVez').textContent = tr('otraVez'); $('bMenu').textContent = tr('menu');
  $('tFinalRotulo').textContent = tr('final');
}

function boton(id, fn) { $(id).addEventListener('click', () => { sonido.tocar('boton'); fn(); }); }

// ── el ir y venir ──────────────────────────────────────────────────────────
function entrar() {
  if (estado !== 'espera') return;
  sonido.despertar();
  estado = 'intro'; mostrar(null);
  // después del logo, la primera vez, elegir el idioma (?idioma= ya lo trae elegido)
  intro = new Intro({ sonido, vibrar, alTerminar: () => (datos.ajustes.idioma ? aMenu() : elegirIdioma()) });
}
function elegirIdioma() {
  estado = 'idiomas'; mostrar('idiomas');
  sonido.musica('menu');
  setTimeout(() => $('bIdioma_' + tr.actual())?.focus(), 50);
}
function aMenu() {
  estado = 'menu'; mia = null; preview = null;
  entrada.activo = false; entrada.soltarTodo();
  sonido.turbo(false); sonido.musica('menu');
  textos(); mostrar('menu');
  $('apodo').value = datos.apodo;
}
function jugar() {
  datos.apodo = $('apodo').value.trim().slice(0, 16);
  if (mundo.nivelBots !== datos.nivelBots) mundo = nuevoMundo();
  mia = mundo.nacer({ nombre: datos.apodo || 'Vos', piel: pielPorId(datos.piel), bot: false });
  datos.partidas++; guardarTodo();
  estado = 'juego'; mostrar(null);
  $('apodo').blur();
  entrada.activo = true; entrada.modo = datos.ajustes.control; entrada.soltarTodo();
  cam.x = mia.x; cam.y = mia.y;
  sonido.musica('juego'); sonido.tocar('nace');
  hitoN = 0; avisos = [];
}
function pausar() { if (estado !== 'juego') return; estado = 'pausa'; entrada.soltarTodo(); sonido.turbo(false); mostrar('pausa'); }
function seguir() { estado = 'juego'; mostrar(null); }
function morir(asesino) {
  estado = 'muerte'; muerteT = 0;
  entrada.activo = false; entrada.soltarTodo();
  sonido.turbo(false); sonido.tocar('muere'); vibrar([60, 40, 90]);
  const final = Math.floor(mia.masa), record = final > datos.mejor;
  if (record) datos.mejor = final;
  datos.bajas += mia.bajas;
  guardarTodo();
  $('tCausa').textContent = asesino ? tr('teComio', asesino.nombre) : tr('borde');
  $('tFinal').textContent = final.toLocaleString('es-AR');
  $('tRecord').textContent = record ? tr('nuevoRecord') : '';
  $('tBajas').textContent = mia.bajas ? tr('bajas', mia.bajas) : '';
  sonarRecord = record;
}

// elegir piel o fondo: una víbora de muestra que culebrea en el centro
function elegir(tipo) {
  const lista = tipo === 'piel' ? PIELES.map((p) => p.id) : FONDOS;
  const actual = tipo === 'piel' ? datos.piel : datos.fondo;
  preview = { tipo, lista, i: Math.max(0, lista.indexOf(actual)), fondo: datos.fondo };
  nuevaMuestra();
  estado = 'elegir'; mostrar('elegir');
  $('tElegir').textContent = tr(tipo);
  actualizarElegir();
}
function nuevaMuestra() {
  const piel = preview.tipo === 'piel' ? pielPorId(preview.lista[preview.i]) : pielPorId(datos.piel);
  preview.v = new Vibora({ id: 0, nombre: '', piel, x: 0, y: 0, ang: 0, masa: 90 });
}
function actualizarElegir() {
  const id = preview.lista[preview.i];
  if (preview.tipo === 'piel') {
    const p = pielPorId(id), libre = abierta(p, datos.mejor);
    $('tNombre').textContent = tr('piel_' + id);
    $('tCandado').textContent = libre ? '' : '🔒 ' + tr('bloqueada', p.mejor.toLocaleString('es-AR'));
    $('bListo').style.opacity = libre ? '1' : '0.5';
  } else {
    preview.fondo = id;
    $('tNombre').textContent = tr('fondo_' + id); $('tCandado').textContent = ''; $('bListo').style.opacity = '1';
  }
}
function moverElegir(d) {
  preview.i = (preview.i + d + preview.lista.length) % preview.lista.length;
  if (preview.tipo === 'piel') nuevaMuestra();
  sonido.tocar('cambia');
  actualizarElegir();
}
function listoElegir() {
  const id = preview.lista[preview.i];
  if (preview.tipo === 'piel') {
    if (!abierta(pielPorId(id), datos.mejor)) { sonido.tocar('error'); return; }
    datos.piel = id;
  } else datos.fondo = id;
  guardarTodo(); aMenu();
}

// los ajustes, armados con botones de opción
function armarAjustes() {
  const a = datos.ajustes, lista = $('listaAjustes');
  lista.textContent = '';
  const fila = (nombre, opciones, actual, poner) => {
    const d = document.createElement('div'); d.className = 'item';
    const s = document.createElement('span'); s.textContent = nombre; d.appendChild(s);
    const ops = document.createElement('div'); ops.className = 'ops';
    for (const [valor, texto] of opciones) {
      const b = document.createElement('button'); b.className = 'opcion' + (valor === actual ? ' elegida' : ''); b.textContent = texto;
      b.addEventListener('click', () => { poner(valor); sonido.aplicar(); guardarTodo(); sonido.tocar('boton'); textos(); armarAjustes(); });
      ops.appendChild(b);
    }
    d.appendChild(ops); lista.appendChild(d);
  };
  const siNo = [[true, tr('si')], [false, tr('no')]];
  fila(tr('musica'), siNo, a.musica, (v) => (a.musica = v));
  fila(tr('sonido'), siNo, a.sonido, (v) => (a.sonido = v));
  fila(tr('vibrar'), siNo, a.vibrar, (v) => { a.vibrar = v; if (v) vibrar(30); });
  fila(tr('nombres'), siNo, a.nombres, (v) => (a.nombres = v));
  fila(tr('control'), [['flecha', tr('flecha')], ['joystick', tr('joystick')]], a.control, (v) => (a.control = v));
  fila(tr('calidad'), [['auto', tr('auto')], ['alta', tr('alta')], ['baja', tr('baja')]], a.calidad, (v) => { a.calidad = v; medir(); });
  fila(tr('idioma'), IDIOMAS.map((l) => [l, l.toUpperCase()]), tr.actual(), (v) => { a.idioma = v; tr.poner(v); });
}

for (const l of IDIOMAS) boton('bIdioma_' + l, () => { datos.ajustes.idioma = l; tr.poner(l); guardarTodo(); aMenu(); });
boton('bJugar', jugar);
$('apodo').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { sonido.tocar('boton'); jugar(); } });
boton('bPiel', () => elegir('piel'));
boton('bFondo', () => elegir('fondo'));
boton('bAjustes', () => { armarAjustes(); estado = 'ajustes'; mostrar('ajustes'); });
boton('bCerrarAjustes', aMenu);
document.querySelectorAll('.opcion[data-nivel]').forEach((b) => b.addEventListener('click', () => { datos.nivelBots = +b.dataset.nivel; guardarTodo(); sonido.tocar('boton'); textos(); }));
boton('bAnterior', () => moverElegir(-1));
boton('bSiguiente', () => moverElegir(1));
boton('bListo', listoElegir);
boton('bSeguir', seguir);
boton('bSalirPausa', aMenu);
boton('bOtraVez', jugar);
boton('bMenu', aMenu);
// el primer toque en cualquier lado despierta el audio (tiene que ser dentro del evento)
addEventListener('pointerdown', () => sonido.despertar(), { capture: true });
addEventListener('keydown', (ev) => {
  sonido.despertar();
  if (estado === 'intro') intro?.saltear();
  else if (estado === 'elegir' && ev.code === 'ArrowLeft') moverElegir(-1);
  else if (estado === 'elegir' && ev.code === 'ArrowRight') moverElegir(1);
  // la pausa se maneja acá y no en entrada.js: si no, la misma tecla que la
  // saca la vuelve a poner en el paso siguiente
  else if ((ev.code === 'Escape' || ev.code === 'KeyP') && !ev.repeat) {
    if (estado === 'juego') pausar();
    else if (estado === 'pausa') seguir();
    else if ((estado === 'elegir' || estado === 'ajustes') && ev.code === 'Escape') aMenu();
  }
}, { capture: true });
lienzo.addEventListener('pointerdown', () => { if (estado === 'intro') intro?.saltear(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pausar(); });

// ── el paso de simulación ──────────────────────────────────────────────────
function paso(dt) {
  t += dt;
  if (estado === 'espera') return;
  if (estado === 'intro') { intro.pasar(dt, W, H); return; }
  if (estado === 'pausa') return;
  if (estado === 'elegir' && preview) {
    const v = preview.v;
    v.angObj = Math.sin(t * 1.6) * 1.1;
    v.pasar(dt, null);
    cam.x = v.x; cam.y = v.y; cam.zoom = Math.min(W, H) / 520;
    return;
  }
  if (estado === 'juego' && mia && mia.viva) {
    const cx = (mia.x - cam.x) * cam.zoom + W / 2, cy = (mia.y - cam.y) * cam.zoom + H / 2;
    const r = entrada.rumbo(mia.angObj, cx, cy, dt);
    if (r !== null) mia.angObj = r;
    mia.turbo = entrada.turbo() && mia.masa > 12;
    sonido.turbo(mia.turbo);
    if (entrada.sacarPausa()) pausar();
  }
  mundo.pasar(dt);
  for (const ev of mundo.sacarEventos()) {
    if (ev.tipo === 'come' && ev.v === mia) sonido.tocar('come', { valor: ev.valor });
    else if (ev.tipo === 'muere') {
      if (ev.v === mia) morir(ev.asesino);
      else if (ev.asesino && ev.asesino === mia) {
        avisos.push({ txt: tr('comiste', ev.v.nombre), t: 0, dura: 2.2, color: '#ffd35c', grande: true });
        sonido.tocar('baja'); vibrar(35);
      }
    }
  }
  if (mia && mia.viva && hitoN < HITOS.length && mia.masa >= HITOS[hitoN]) {
    avisos.push({ txt: tr('hito', HITOS[hitoN].toLocaleString('es-AR')), t: 0, dura: 1.8, color: '#8cff3a' });
    sonido.tocar('hito'); hitoN++;
  }
  for (const a of avisos) a.t += dt;
  avisos = avisos.filter((a) => a.t < a.dura).slice(-3);
  if (estado === 'muerte' && (muerteT += dt) > 0.9 && $('muerte').classList.contains('oculto')) {
    mostrar('muerte');
    if (sonarRecord) { sonido.tocar('record'); sonarRecord = false; }
  }
  camara(dt);
}

// ── el dibujo ──────────────────────────────────────────────────────────────
const calidad = () => (dpr >= 1.5 ? 2 : 1);
function dibujar() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (estado === 'espera') { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); return; }
  if (estado === 'intro') { intro.dibujar(g, W, H); return; }
  if (estado === 'elegir' && preview) {
    pintarFondo(g, preview.fondo, cam, W, H);
    dibujarVibora(g, preview.v, cam, W, H, t, calidad());
    return;
  }
  dibujarArena(g, mundo, cam, W, H, { fondoId: datos.fondo, calidad: calidad(), destacada: mia, nombres: datos.ajustes.nombres, esc: dpr });
  if (estado === 'menu' || estado === 'ajustes' || estado === 'idiomas') {
    g.fillStyle = 'rgba(5,6,12,0.45)'; g.fillRect(0, 0, W, H);
    if (estado !== 'idiomas') dibujarLogoMenu();
    return;
  }
  const botones = estado === 'juego' && tactil;
  const rt = 34 * dpr;
  entrada.botonTurbo = botones ? { x: 16 * dpr + rt, y: H - 78 * dpr - rt, r: rt } : null;
  entrada.botonPausa = estado === 'juego' ? { x: 16 * dpr + 18 * dpr, y: 16 * dpr + 18 * dpr, r: 18 * dpr } : null;
  dibujarHud(g, W, H, {
    mundo, mia: mia && mia.viva ? mia : null, esc: dpr, tr, avisos,
    turboBoton: entrada.botonTurbo && { ...entrada.botonTurbo, activo: mia?.turbo }, pausa: entrada.botonPausa,
    joystick: entrada.joy && { x: entrada.joy.x, y: entrada.joy.y, dx: clamp(entrada.joy.dx, -50 * dpr, 50 * dpr), dy: clamp(entrada.joy.dy, -50 * dpr, 50 * dpr), r: 50 * dpr },
  });
}
const lienzoLogo = $('logo'), gl = lienzoLogo.getContext('2d');
function dibujarLogoMenu() {
  const w = Math.round(lienzoLogo.clientWidth * dpr), h = Math.round(lienzoLogo.clientHeight * dpr);
  if (!w || !h) return;
  if (lienzoLogo.width !== w || lienzoLogo.height !== h) { lienzoLogo.width = w; lienzoLogo.height = h; }
  gl.clearRect(0, 0, w, h);
  const alto = Math.min(h * 0.7, w / 6.6);
  dibujarLogo(gl, w / 2, h * 0.52, alto, t);
}

// ── el bucle, con calidad que se ajusta sola ──────────────────────────────
let ultimo = performance.now(), lento = 0;
const manual = q.has('pausa');
function cuadro(ahora) {
  requestAnimationFrame(cuadro);
  const dtReal = Math.min(0.1, (ahora - ultimo) / 1000);
  ultimo = ahora;
  // si los cuadros tardan mucho seguido, se baja la resolución (medio punto por vez)
  if (datos.ajustes.calidad === 'auto' && (estado === 'juego' || estado === 'menu')) {
    lento = dtReal > 0.026 ? lento + 1 : Math.max(0, lento - 1);
    if (lento > 45 && dprTope > 1) { dprTope = Math.max(1, dprTope - 0.25); lento = 0; medir(); }
  }
  if (!manual) {
    // cada cuadro avanza lo que tardó de verdad, en pasos de a lo sumo 1/60 s
    const [n, d] = trozos(dtReal, PASO);
    for (let k = 0; k < n; k++) paso(d);
  }
  dibujar();
}

textos();
// Sin la intro de JXSTUDIOS (se pidió así el 01/10): arranca directo; ?intro la muestra.
const conIntro = q.has('intro');
// La intro arranca apenas abre, sin tocar nada. El sonido se decide en el
// acto: si el navegador deja sonar sin un toque, el audio nace andando y la
// música va en fase; si no (lo normal), nace suspendido y la intro va muda:
// el primer toque la saltea y prende el sonido.
if (conIntro) { mostrar(null); entrar(); }
else {
  // sin la intro, la primera vez igual se elige el idioma antes del menú
  if (datos.ajustes.idioma || q.has('directo') || q.has('pausa')) aMenu(); else elegirIdioma();
  if (q.get('directo') === 'juego') jugar();
}
requestAnimationFrame(cuadro);

// Las sondas para las pruebas (pruebas/juego.mjs).
window.__V = {
  get estado() { return estado; }, get mundo() { return mundo; }, get mia() { return mia; }, get datos() { return datos; }, get cam() { return cam; },
  get avisos() { return avisos; }, get intro() { return intro; }, get preview() { return preview; },
  pasos(n, dib = false) { for (let k = 0; k < n; k++) paso(PASO); if (dib) dibujar(); },
  dibujar, entrar, jugar, aMenu, pausar, seguir, elegir, moverElegir, listoElegir, elegirIdioma, entrada, sonido, tr,
  matar() { if (mia && mia.viva) mundo.morir(mia, null); },
  get W() { return W; }, get H() { return H; }, get dpr() { return dpr; },
};
window.listo = true;

})();

</script>
</body>
