<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c1019">
<meta name="description" content="Víbora.io, de JXSTUDIOS: comé, crecé y no choques la cabeza.">
<title>Víbora.io</title>
<style>
/* El juego se dibuja en el lienzo; los menús son HTML encima (el apodo
   necesita un campo de verdad para que salga el teclado del teléfono).
   Botones redondos y brillantes, como caramelos; paneles oscuros de vidrio. */
:root {
  --fondo: #0c1019;
  --tinta: #f4f7ff;
  --tenue: rgba(244, 247, 255, 0.68);
  --lima: #8cff3a;
  --lima-osc: #3f9e0d;
  --violeta: #a36bff;
  --violeta-osc: #5a2bb8;
  --panel: rgba(8, 10, 18, 0.72);
  --oro: #ffd35c;
  --rojo: #ff5e7a;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--fondo); overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--tinta); }
#juego { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#ui { position: absolute; inset: 0; pointer-events: none; }
.pantalla {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.8vh, 16px);
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box;
  pointer-events: auto; text-align: center;
}
.pantalla.oculto { display: none; }
.velo { background: rgba(5, 6, 12, 0.55); backdrop-filter: blur(2px); }
h2 { margin: 0; font-size: clamp(22px, 4.2vh, 34px); font-weight: 900; letter-spacing: 0.02em; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45); }

@keyframes late { 50% { opacity: 0.25; } }

#logo { width: min(92vw, 560px); height: auto; aspect-ratio: 5 / 1.35; }
.titulo-idioma { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 8px; }
.titulo-idioma small { font-size: clamp(13px, 2vh, 16px); font-weight: 700; color: var(--tenue); letter-spacing: 0.01em; text-shadow: none; }
#apodo {
  width: min(78vw, 330px); box-sizing: border-box; padding: 12px 18px; border-radius: 999px; border: 2px solid rgba(140, 255, 58, 0.55);
  background: rgba(10, 20, 14, 0.75); color: var(--tinta); font: 700 18px system-ui, sans-serif; text-align: center; outline: none;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
}
#apodo:focus { border-color: var(--lima); box-shadow: 0 0 0 3px rgba(140, 255, 58, 0.25), inset 0 2px 6px rgba(0, 0, 0, 0.5); }
#apodo::placeholder { color: rgba(244, 247, 255, 0.45); }

.boton {
  all: unset; cursor: pointer; box-sizing: border-box; border-radius: 999px; font-weight: 900; letter-spacing: 0.03em; text-align: center;
  color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); transition: transform 0.08s ease, filter 0.15s ease; -webkit-tap-highlight-color: transparent;
}
.boton:active { transform: translateY(3px) scale(0.98); }
.boton:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.boton.principal {
  min-width: min(70vw, 280px); padding: 16px 30px; font-size: clamp(20px, 3.6vh, 28px);
  background: linear-gradient(180deg, #b8ff6e 0%, var(--lima) 45%, var(--lima-osc) 100%);
  box-shadow: 0 6px 0 #2b6e08, 0 10px 22px rgba(0, 0, 0, 0.45), inset 0 3px 0 rgba(255, 255, 255, 0.45);
}
.boton.principal:active { box-shadow: 0 3px 0 #2b6e08, 0 6px 14px rgba(0, 0, 0, 0.45), inset 0 3px 0 rgba(255, 255, 255, 0.45); }
.boton.chico {
  padding: 10px 18px; font-size: clamp(14px, 2.2vh, 17px);
  background: linear-gradient(180deg, #c49bff 0%, var(--violeta) 45%, var(--violeta-osc) 100%);
  box-shadow: 0 4px 0 #3b1b85, 0 8px 16px rgba(0, 0, 0, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.4);
}
.fila { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.nivel { display: flex; align-items: center; gap: 6px; background: var(--panel); padding: 6px 8px; border-radius: 999px; flex-wrap: wrap; justify-content: center; }
.nivel span { font-weight: 800; font-size: 13px; color: var(--tenue); padding: 0 6px; letter-spacing: 0.08em; }
.opcion { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; color: var(--tenue); }
.opcion.elegida { background: rgba(255, 255, 255, 0.16); color: #fff; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.4); }
.dato { margin: 0; font-weight: 800; color: var(--oro); font-size: clamp(14px, 2.2vh, 17px); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
.consejo { margin: 0; max-width: 34ch; font-size: 13px; color: var(--tenue); }
.firma { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); margin: 0; font-size: 12px; letter-spacing: 0.24em; color: rgba(201, 204, 212, 0.7); font-weight: 700; }

#elegir { justify-content: space-between; padding-top: max(28px, env(safe-area-inset-top)); padding-bottom: max(28px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(5, 6, 12, 0.6), rgba(5, 6, 12, 0) 25%, rgba(5, 6, 12, 0) 70%, rgba(5, 6, 12, 0.6)); }
.flechas { display: flex; align-items: center; justify-content: space-between; width: min(96vw, 720px); flex: 1; }
.flechas .hueco { flex: 1; }
.flecha {
  all: unset; cursor: pointer; width: 64px; height: 64px; border-radius: 50%; font-size: 42px; line-height: 60px; text-align: center; font-weight: 900; color: #fff;
  background: radial-gradient(circle at 35% 30%, #b8ff6e, var(--lima) 45%, var(--lima-osc)); box-shadow: 0 5px 0 #2b6e08, 0 8px 18px rgba(0, 0, 0, 0.45);
}
.flecha:active { transform: translateY(3px); }
.nombre { margin: 0; font-size: clamp(20px, 3.4vh, 26px); font-weight: 900; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.5); }
.candado { margin: 0; min-height: 1.2em; font-weight: 800; color: var(--rojo); }

.lista { display: grid; gap: 8px; width: min(92vw, 420px); background: var(--panel); padding: 12px; border-radius: 18px; box-sizing: border-box; }
.lista .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; }
.lista .item span { color: var(--tenue); }
.lista .ops { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

.causa { margin: 0; font-size: clamp(16px, 2.6vh, 20px); font-weight: 800; color: var(--rojo); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
.rotulo { margin: 0; font-size: 14px; letter-spacing: 0.12em; color: var(--tenue); font-weight: 800; text-transform: uppercase; }
.final { margin: 0; font-size: clamp(52px, 11vh, 84px); font-weight: 900; line-height: 1; text-shadow: 0 5px 0 rgba(0, 0, 0, 0.45); font-variant-numeric: tabular-nums; }
.record { margin: 0; min-height: 1.2em; font-weight: 900; color: var(--oro); animation: late 0.8s ease-in-out infinite; }

/* En un teléfono angosto (360) los niveles de bots no entraban en una línea. */
@media (max-width: 380px) {
  .nivel { gap: 2px; }
  .nivel span { padding: 0 4px; }
  .opcion { padding: 6px 9px; }
}

/* Con el teléfono acostado no entra la columna: el menú pasa a dos columnas
   debajo del logo (:not(.oculto) para no pisar el display:none de .oculto). */
@media (orientation: landscape) and (max-height: 540px) {
  #menu:not(.oculto) {
    display: grid; grid-template-columns: repeat(2, max-content); justify-content: center; align-content: center;
    grid-template-areas: "logo logo" "apodo fila" "jugar nivel" "mejor consejo"; gap: 10px 28px; justify-items: center;
  }
  #logo { grid-area: logo; width: min(80vw, 560px, 80vh); }
  #apodo { grid-area: apodo; }
  #bJugar { grid-area: jugar; }
  #menu .fila { grid-area: fila; }
  #menu .nivel { grid-area: nivel; }
  #tMejor { grid-area: mejor; }
  #tConsejo { grid-area: consejo; }
}

@media (prefers-reduced-motion: reduce) { .record { animation: none; } .boton { transition: none; } }

</style>
</head>
<body>
<canvas id="juego" aria-label="Víbora.io"></canvas>
<div id="ui">
  <!-- la primera vez, después del logo: el idioma (el título va en los tres) -->
  <section id="idiomas" class="pantalla oculto velo">
    <h2 class="titulo-idioma">Elegí tu idioma<small lang="en">Choose your language</small><small lang="pt">Escolha seu idioma</small></h2>
    <button id="bIdioma_es" class="boton principal" lang="es">Español</button>
    <button id="bIdioma_en" class="boton principal" lang="en">English</button>
    <button id="bIdioma_pt" class="boton principal" lang="pt">Português</button>
  </section>

  <section id="menu" class="pantalla oculto">
    <canvas id="logo" aria-hidden="true"></canvas>
    <input id="apodo" maxlength="16" autocomplete="off" spellcheck="false" enterkeyhint="go">
    <button id="bJugar" class="boton principal"></button>
    <div class="fila">
      <button id="bPiel" class="boton chico"></button>
      <button id="bFondo" class="boton chico"></button>
      <button id="bAjustes" class="boton chico"></button>
    </div>
    <div class="nivel" role="group">
      <span id="tBots"></span>
      <button class="opcion" data-nivel="0"></button>
      <button class="opcion" data-nivel="1"></button>
      <button class="opcion" data-nivel="2"></button>
    </div>
    <p id="tMejor" class="dato"></p>
    <p id="tConsejo" class="consejo"></p>
    <p id="tFirma" class="firma"></p>
  </section>

  <section id="elegir" class="pantalla oculto">
    <h2 id="tElegir"></h2>
    <div class="flechas">
      <button id="bAnterior" class="flecha" aria-label="anterior">‹</button>
      <div class="hueco"></div>
      <button id="bSiguiente" class="flecha" aria-label="siguiente">›</button>
    </div>
    <p id="tNombre" class="nombre"></p>
    <p id="tCandado" class="candado"></p>
    <button id="bListo" class="boton principal"></button>
  </section>

  <section id="ajustes" class="pantalla oculto">
    <h2 id="tAjustes"></h2>
    <div id="listaAjustes" class="lista"></div>
    <button id="bCerrarAjustes" class="boton principal"></button>
  </section>

  <section id="pausa" class="pantalla oculto velo">
    <h2 id="tPausa"></h2>
    <button id="bSeguir" class="boton principal"></button>
    <button id="bSalirPausa" class="boton chico"></button>
  </section>

  <section id="muerte" class="pantalla oculto velo">
    <p id="tCausa" class="causa"></p>
    <p id="tFinalRotulo" class="rotulo"></p>
    <p id="tFinal" class="final"></p>
    <p id="tRecord" class="record"></p>
    <p id="tBajas" class="dato"></p>
    <button id="bOtraVez" class="boton principal"></button>
    <button id="bMenu" class="boton chico"></button>
  </section>
</div>
<script>
/* ── fondos ── */
const M_fondos = (() => {
// Los fondos de la arena: cada uno es una baldosa que se dibuja una vez y se
// repite como patrón (con la cámara y el zoom puestos en la transformación del
// patrón: un solo fillRect por cuadro, sin importar cuánto se ve).
const FONDOS = ['colmena', 'carbono', 'circuito', 'galaxia', 'magma'];

function lienzo(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}

// Hexágonos de tapa plana. Con lado 26, la altura (√3·26 = 45,03) es casi
// entera y la baldosa de 78 × 45 repite sin costura visible.
function colmena() {
  const s = 26, h = Math.sqrt(3) * s, [c, g] = lienzo(78, 45);
  g.fillStyle = '#0c1019'; g.fillRect(0, 0, 78, 45);
  const hex = (cx, cy) => {
    g.beginPath();
    for (let k = 0; k < 6; k++) { const a = (Math.PI / 3) * k; g.lineTo(cx + Math.cos(a) * (s - 2.2), cy + Math.sin(a) * (s - 2.2)); }
    g.closePath();
    const gr = g.createLinearGradient(cx, cy - s, cx, cy + s);
    gr.addColorStop(0, '#26304a'); gr.addColorStop(0.5, '#1c2437'); gr.addColorStop(1, '#161d2d');
    g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(120,150,210,0.10)'; g.lineWidth = 1.2; g.stroke();
  };
  for (let i = -1; i <= 3; i++) for (let j = -1; j <= 2; j++) hex(i * 1.5 * s, j * h + (i & 1 ? h / 2 : 0));
  return { c, escala: 1.6 };
}

// Fibra de carbono (la de JXSTUDIOS): sarga 2 × 2 con un brillo en diagonal.
function carbono() {
  const [c, g] = lienzo(32, 32);
  for (let y = 0; y < 32; y += 4) for (let x = 0; x < 32; x += 4) {
    const sarga = ((x >> 2) + (y >> 2)) % 4 < 2;
    const gr = g.createLinearGradient(x, y, x + (sarga ? 4 : 0), y + (sarga ? 0 : 4));
    gr.addColorStop(0, sarga ? '#2a2c31' : '#1a1b1f'); gr.addColorStop(1, sarga ? '#1d1e22' : '#26282d');
    g.fillStyle = gr; g.fillRect(x, y, 4, 4);
  }
  return { c, escala: 1.4 };
}

// Un circuito de neón: pistas a 45° con sus pads.
function circuito() {
  const [c, g] = lienzo(256, 256);
  g.fillStyle = '#05100f'; g.fillRect(0, 0, 256, 256);
  let semilla = 11;
  const r = () => ((semilla = (semilla * 16807) % 2147483647) / 2147483647);
  const pistas = [];
  for (let k = 0; k < 22; k++) {
    let x = Math.round(r() * 16) * 16, y = Math.round(r() * 16) * 16;
    const p = [[x, y]];
    for (let s = 0; s < 4; s++) {
      const dir = Math.floor(r() * 8), l = 16 + Math.floor(r() * 4) * 16;
      const ang = (dir * Math.PI) / 4;
      x += Math.round(Math.cos(ang)) * l; y += Math.round(Math.sin(ang)) * l;
      p.push([x, y]);
    }
    pistas.push(p);
  }
  const trazar = (ancho, color) => {
    g.strokeStyle = color; g.lineWidth = ancho; g.lineCap = 'round'; g.lineJoin = 'round';
    for (const p of pistas) for (const ox of [-256, 0, 256]) for (const oy of [-256, 0, 256]) {
      g.beginPath(); p.forEach(([x, y], i) => (i ? g.lineTo(x + ox, y + oy) : g.moveTo(x + ox, y + oy))); g.stroke();
    }
  };
  trazar(7, 'rgba(0,255,200,0.06)');
  trazar(2, 'rgba(0,255,200,0.28)');
  g.fillStyle = 'rgba(120,255,230,0.55)';
  for (const p of pistas) { const [x, y] = p[p.length - 1]; g.beginPath(); g.arc((x + 256) % 256, (y + 256) % 256, 3, 0, Math.PI * 2); g.fill(); }
  return { c, escala: 1.5 };
}

function galaxia() {
  const [c, g] = lienzo(512, 512);
  g.fillStyle = '#07061a'; g.fillRect(0, 0, 512, 512);
  let semilla = 5;
  const r = () => ((semilla = (semilla * 16807) % 2147483647) / 2147483647);
  // nubes de color (repetidas en los bordes para que la baldosa cierre)
  for (let k = 0; k < 7; k++) {
    const x = r() * 512, y = r() * 512, rad = 90 + r() * 140, col = ['rgba(120,40,200,', 'rgba(30,80,200,', 'rgba(200,40,140,'][k % 3];
    for (const ox of [-512, 0, 512]) for (const oy of [-512, 0, 512]) {
      const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, rad);
      gr.addColorStop(0, col + '0.22)'); gr.addColorStop(1, col + '0)');
      g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
    }
  }
  for (let k = 0; k < 420; k++) {
    const x = r() * 512, y = r() * 512, b = r();
    g.fillStyle = `rgba(255,255,255,${0.25 + b * 0.6})`;
    g.fillRect(x, y, b > 0.92 ? 2 : 1, b > 0.92 ? 2 : 1);
    if (b > 0.985) { g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x - 3, y + 0.5, 8, 1); g.fillRect(x + 0.5, y - 3, 1, 8); }
  }
  return { c, escala: 1.8 };
}

function magma() {
  const [c, g] = lienzo(256, 256);
  g.fillStyle = '#140c0a'; g.fillRect(0, 0, 256, 256);
  let semilla = 23;
  const r = () => ((semilla = (semilla * 16807) % 2147483647) / 2147483647);
  // piedras oscuras y las grietas de brasa entre ellas
  for (let k = 0; k < 40; k++) {
    const x = r() * 256, y = r() * 256, rad = 12 + r() * 26;
    g.fillStyle = `rgb(${28 + (r() * 14) | 0},${18 + (r() * 8) | 0},${16})`;
    for (const ox of [-256, 0, 256]) for (const oy of [-256, 0, 256]) { g.beginPath(); g.ellipse(x + ox, y + oy, rad, rad * 0.8, r() * 3, 0, Math.PI * 2); g.fill(); }
  }
  g.lineCap = 'round';
  for (let k = 0; k < 14; k++) {
    let x = r() * 256, y = r() * 256;
    const p = [[x, y]];
    for (let s = 0; s < 6; s++) { x += (r() - 0.5) * 60; y += (r() - 0.5) * 60; p.push([x, y]); }
    for (const [w, col] of [[6, 'rgba(255,80,0,0.10)'], [2, 'rgba(255,120,20,0.55)'], [1, 'rgba(255,220,120,0.6)']]) {
      g.strokeStyle = col; g.lineWidth = w;
      for (const ox of [-256, 0, 256]) for (const oy of [-256, 0, 256]) { g.beginPath(); p.forEach(([a, b], i) => (i ? g.lineTo(a + ox, b + oy) : g.moveTo(a + ox, b + oy))); g.stroke(); }
    }
  }
  return { c, escala: 1.7 };
}

const HACER = { colmena, carbono, circuito, galaxia, magma };
const cache = new Map();

// El patrón listo para pintar con la cámara puesta.
function fondo(id, g) {
  if (!cache.has(id)) {
    const f = (HACER[id] || colmena)();
    f.patron = g.createPattern(f.c, 'repeat');
    cache.set(id, f);
  }
  return cache.get(id);
}

function pintarFondo(g, id, cam, W, H) {
  const f = fondo(id, g), k = f.escala * cam.zoom;
  f.patron.setTransform(new DOMMatrix([k, 0, 0, k, W / 2 - cam.x * cam.zoom, H / 2 - cam.y * cam.zoom]));
  g.fillStyle = f.patron;
  g.fillRect(0, 0, W, H);
}

// Una miniatura para el selector de fondos.
const baldosa = (id) => (HACER[id] || colmena)().c;
return { FONDOS, fondo, pintarFondo, baldosa };
})();

/* ── pieles ── */
const M_pieles = (() => {
// Las pieles: una lista de colores que se repite a lo largo del cuerpo, de a
// `franja` bolitas por color. Las primeras están abiertas; las demás se abren
// con el mejor largo alcanzado (le da un porqué a la partida siguiente).
// Todas son nuestras: colores, franjas y banderas, nada copiado.
const PIELES = [
  { id: 'lima', colores: ['#8cff3a', '#58c91c'], franja: 3 },
  { id: 'coral', colores: ['#ff6b6b', '#ffb0a8'], franja: 3 },
  { id: 'uva', colores: ['#a36bff', '#6e33d6'], franja: 3 },
  { id: 'cielo', colores: ['#4fc3ff', '#1d8fe0'], franja: 3 },
  { id: 'menta', colores: ['#2effb0', '#b6ffe6'], franja: 2 },
  { id: 'rosa', colores: ['#ff5fb3', '#ffc6e6'], franja: 2 },
  { id: 'fuego', colores: ['#ff3d00', '#ff9100', '#ffe600'], franja: 2 },
  { id: 'hielo', colores: ['#eafaff', '#95dcff', '#46b6ff'], franja: 2 },
  { id: 'argentina', colores: ['#74acdf', '#74acdf', '#ffffff', '#f6b40e', '#ffffff', '#74acdf'], franja: 2 },
  { id: 'uruguay', colores: ['#ffffff', '#1f5fbf'], franja: 2 },
  { id: 'brasil', colores: ['#009c3b', '#ffdf00', '#002776', '#ffdf00'], franja: 2 },
  { id: 'mexico', colores: ['#006847', '#ffffff', '#ce1126'], franja: 3 },
  { id: 'jx', colores: ['#17181b', '#26282d', '#c9ccd4', '#26282d'], franja: 2, mejor: 150 },
  { id: 'abeja', colores: ['#ffd000', '#ffd000', '#1b1b1f'], franja: 2, mejor: 250 },
  { id: 'tigre', colores: ['#ff8a00', '#ff8a00', '#ff8a00', '#1b1b1f'], franja: 2, mejor: 350 },
  { id: 'cebra', colores: ['#f5f5f5', '#1b1b1f'], franja: 2, mejor: 450 },
  { id: 'caramelo', colores: ['#ffffff', '#ff2d55'], franja: 2, mejor: 600 },
  { id: 'sandia', colores: ['#ff3b5c', '#ff3b5c', '#ff3b5c', '#ffffff', '#1fb34a'], franja: 2, mejor: 750 },
  { id: 'oceano', colores: ['#00608a', '#00a6ed', '#7fdbff', '#00a6ed'], franja: 2, mejor: 900 },
  { id: 'bosque', colores: ['#1e5631', '#4c9a2a', '#a4de02', '#4c9a2a'], franja: 2, mejor: 1100 },
  { id: 'lava', colores: ['#ff3d00', '#ff7a1a', '#3a0d08'], franja: 2, mejor: 1300 },

/* ── dibujo ── */
const M_dibujo = (() => {
// El dibujo de la arena: fondo, borde, comida y víboras. Todo sale de
// sprites que se hornean una vez por color (una bolita con luz y sombra, un
// halo) y después solo se copian: dibujar degradés por cuadro es lo que hace
// lento un juego así en el teléfono.
const { pintarFondo } = M_fondos;
const { colorDe } = M_pieles;
const bolas = new Map(), halos = new Map(), sombras = new Map();
const TAM = 64;

function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
const mezcla = ([r, g, b], f) => `rgb(${Math.round(r * f)},${Math.round(g * f)},${Math.round(b * f)})`;
const aclarar = ([r, g, b], f) => `rgb(${Math.round(r + (255 - r) * f)},${Math.round(g + (255 - g) * f)},${Math.round(b + (255 - b) * f)})`;

// Una bolita del cuerpo: luz arriba a la izquierda, borde oscuro.
function bola(color) {
  let c = bolas.get(color);
  if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = TAM;
  const g = c.getContext('2d'), k = rgb(color), m = TAM / 2;
  const gr = g.createRadialGradient(m * 0.72, m * 0.62, m * 0.08, m, m, m);
  gr.addColorStop(0, aclarar(k, 0.55)); gr.addColorStop(0.35, color); gr.addColorStop(0.85, mezcla(k, 0.62)); gr.addColorStop(1, mezcla(k, 0.35));
  g.fillStyle = gr; g.beginPath(); g.arc(m, m, m - 0.5, 0, Math.PI * 2); g.fill();
  bolas.set(color, c);
  return c;
}
// El halo de la comida y del turbo (se suma con 'lighter').
function halo(color) {
  let c = halos.get(color);
  if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = TAM;
  const g = c.getContext('2d'), [r, gg, b] = rgb(color), m = TAM / 2;
  const gr = g.createRadialGradient(m, m, 0, m, m, m);
  gr.addColorStop(0, `rgba(255,255,255,0.95)`); gr.addColorStop(0.12, `rgba(${r},${gg},${b},0.95)`);
  gr.addColorStop(0.35, `rgba(${r},${gg},${b},0.35)`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, TAM, TAM);
  halos.set(color, c);
  return c;
}
function sombra() {
  let c = sombras.get('s');
  if (c) return c;
  c = document.createElement('canvas'); c.width = c.height = TAM;
  const g = c.getContext('2d'), m = TAM / 2, gr = g.createRadialGradient(m, m, 0, m, m, m);
  gr.addColorStop(0, 'rgba(0,0,0,0.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, TAM, TAM);
  sombras.set('s', c);
  return c;
}

// De mundo a pantalla.
const aPantalla = (cam, W, H, x, y) => [(x - cam.x) * cam.zoom + W / 2, (y - cam.y) * cam.zoom + H / 2];

function dibujarArena(g, mundo, cam, W, H, { fondoId = 'colmena', calidad = 2, destacada = null, nombres = true, esc = 1 } = {}) {
  pintarFondo(g, fondoId, cam, W, H);
  // afuera de la arena: oscuro, y el borde que brilla rojo. Solo si se ve:
  // desde lejos, el círculo gigante se pinta igual y cuesta en el teléfono.
  const [ox, oy] = aPantalla(cam, W, H, 0, 0), R = mundo.radio * cam.zoom;
  if (Math.hypot(W / 2 - ox, H / 2 - oy) + Math.hypot(W, H) / 2 > R - 10 * cam.zoom) {
    g.save();
    g.beginPath(); g.rect(0, 0, W, H); g.arc(ox, oy, R, 0, Math.PI * 2, true);
    g.fillStyle = 'rgba(0,0,0,0.62)'; g.fill();
    g.beginPath(); g.arc(ox, oy, R, 0, Math.PI * 2);
    g.lineWidth = 14 * cam.zoom; g.strokeStyle = 'rgba(255,40,80,0.18)'; g.stroke();
    g.lineWidth = 4 * cam.zoom; g.strokeStyle = 'rgba(255,60,90,0.9)'; g.stroke();
    g.restore();
  }
  dibujarComida(g, mundo, cam, W, H);
  // las víboras: primero las demás, la del jugador arriba de todo
  for (const v of mundo.viboras) if (v.viva && v !== destacada) dibujarVibora(g, v, cam, W, H, mundo.t, calidad);
  if (destacada && destacada.viva) dibujarVibora(g, destacada, cam, W, H, mundo.t, calidad);
  if (nombres && cam.zoom > 0.32) for (const v of mundo.viboras) if (v.viva) nombre(g, v, cam, W, H, esc, v === destacada);
}

function dibujarComida(g, mundo, cam, W, H) {
  const mx = W / 2 / cam.zoom + 20, my = H / 2 / cam.zoom + 20;
  const x0 = cam.x - mx, x1 = cam.x + mx, y0 = cam.y - my, y1 = cam.y + my;
  const cel = 128, nc = mundo.nc;
  const c0 = Math.max(0, Math.floor((x0 + mundo.radio) / cel) + 1), c1 = Math.min(nc - 1, Math.floor((x1 + mundo.radio) / cel) + 1);
  const f0 = Math.max(0, Math.floor((y0 + mundo.radio) / cel) + 1), f1 = Math.min(nc - 1, Math.floor((y1 + mundo.radio) / cel) + 1);
  g.globalCompositeOperation = 'lighter';
  const t = mundo.t, z = cam.zoom, bx = W / 2 - cam.x * z, by = H / 2 - cam.y * z;
  for (let j = f0; j <= f1; j++) for (let i = c0; i <= c1; i++) for (const f of mundo.grilla[j * nc + i]) {
    if (!mundo.fvivo[f]) continue;
    const nace = Math.min(1, (t - mundo.fn[f]) / 0.35);
    const late = 1 + Math.sin(t * 4 + f * 1.7) * 0.18;
    const s = mundo.fr[f] * 4.2 * late * nace * z;
    if (s < 1) continue;
    g.drawImage(halo(mundo.colores[mundo.fc[f]]), mundo.fx[f] * z + bx - s / 2, mundo.fy[f] * z + by - s / 2, s, s);
  }
  g.globalCompositeOperation = 'source-over';
}

// Las bolitas que se ven, de la cola a la cabeza, en un solo arreglo que se
// reusa (x, y, k): uno nuevo por bolita y por cuadro es basura para el teléfono.
let PTS = new Float32Array(3 * 4096);

function dibujarVibora(g, v, cam, W, H, t, calidad = 2) {
  const r = v.radio(), R = r * cam.zoom, salto = v.salto();
  const margen = R * 2, z = cam.zoom, bx = W / 2 - cam.x * z, by = H / 2 - cam.y * z;
  if (PTS.length < 3 * (v.n / salto + 2)) PTS = new Float32Array(3 * Math.ceil(v.n / salto + 64));
  let n = 0;
  for (let k = Math.floor((v.n - 1) / salto) * salto; k >= 0; k -= salto) {
    const j = v.i(k), sx = v.px[j] * z + bx, sy = v.py[j] * z + by;
    if (sx < -margen || sy < -margen || sx > W + margen || sy > H + margen) continue;
    PTS[n * 3] = sx; PTS[n * 3 + 1] = sy; PTS[n * 3 + 2] = k; n++;
  }
  const hx = v.x * z + bx, hy = v.y * z + by;
  // la sombra (en calidad alta, una cada dos bolitas: igual se ve pareja) y
  // el brillo del turbo, abajo del cuerpo
  if (calidad >= 2) { const sm = sombra(), d = R * 2.2; for (let i = 0; i < n; i += 2) g.drawImage(sm, PTS[i * 3] - R * 0.85, PTS[i * 3 + 1] - R * 0.75, d, d); }
  if (v.turbo) {
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < n; i++) {
      const k = PTS[i * 3 + 2], f = 0.55 + 0.45 * Math.sin(t * 18 - k * 0.12), s = R * 3.4 * f;
      g.drawImage(halo(colorDe(v.piel, Math.floor(k / salto))), PTS[i * 3] - s / 2, PTS[i * 3 + 1] - s / 2, s, s);
    }
    g.globalCompositeOperation = 'source-over';
  }
  for (let i = 0; i < n; i++) g.drawImage(bola(colorDe(v.piel, Math.floor(PTS[i * 3 + 2] / salto))), PTS[i * 3] - R, PTS[i * 3 + 1] - R, R * 2, R * 2);
  // la cabeza y los ojos (miran hacia donde quiere ir)
  g.drawImage(bola(colorDe(v.piel, 0)), hx - R * 1.05, hy - R * 1.05, R * 2.1, R * 2.1);
  const mira = v.angObj;
  for (const lado of [-1, 1]) {
    const a = v.ang + lado * 0.62, ex = hx + Math.cos(a) * R * 0.5, ey = hy + Math.sin(a) * R * 0.5;
    g.fillStyle = '#ffffff'; g.beginPath(); g.arc(ex, ey, R * 0.34, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#101018'; g.beginPath(); g.arc(ex + Math.cos(mira) * R * 0.14, ey + Math.sin(mira) * R * 0.14, R * 0.19, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(ex + Math.cos(mira) * R * 0.14 - R * 0.06, ey + Math.sin(mira) * R * 0.14 - R * 0.07, R * 0.06, 0, Math.PI * 2); g.fill();
  }
}

// Cada nombre se escribe una vez en un lienzo chico y después se copia:
// escribir texto (con su borde) por cuadro es de lo más caro en el teléfono.
const carteles = new Map();
function cartel(txt, esc, esMia) {
  const clave = `${esMia ? 1 : 0}|${esc}|${txt}`;
  let c = carteles.get(clave);
  if (c) return c;
  if (carteles.size > 300) carteles.clear();
  const fuente = `700 ${Math.round(12 * esc)}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  c = document.createElement('canvas');
  let g = c.getContext('2d');
  g.font = fuente;
  const b = Math.ceil(3 * esc);
  c.width = Math.ceil(g.measureText(txt).width + b * 2 + 2); c.height = Math.ceil(16 * esc + b * 2);
  g = c.getContext('2d');
  g.font = fuente; g.textAlign = 'center'; g.textBaseline = 'bottom';
  g.lineWidth = 3 * esc; g.strokeStyle = 'rgba(0,0,0,0.7)'; g.lineJoin = 'round';
  g.strokeText(txt, c.width / 2, c.height - b);
  g.fillStyle = esMia ? '#ffffff' : 'rgba(255,255,255,0.75)'; g.fillText(txt, c.width / 2, c.height - b);
  carteles.set(clave, c);
  return c;
}
function nombre(g, v, cam, W, H, esc, esMia) {
  const [hx, hy] = aPantalla(cam, W, H, v.x, v.y), R = v.radio() * cam.zoom;
  if (hx < -80 || hy < -40 || hx > W + 80 || hy > H + 40) return;
  const c = cartel(v.nombre, esc, esMia);
  g.drawImage(c, Math.round(hx - c.width / 2), Math.round(hy - R - 3 * esc - c.height));
}
return { bola, halo, dibujarArena, dibujarVibora };
})();

/* ── entrada ── */
const M_entrada = (() => {
// Manejar la víbora con el dedo, el mouse o el teclado.
//  - Dedo, modo "flecha" (el de siempre): la víbora va hacia donde está el
//    dedo, mirado desde el centro de la pantalla (ahí está su cabeza).
//  - Dedo, modo "joystick": donde se apoya el dedo queda la base; hacia donde
//    se arrastra, va la víbora.
//  - Turbo: el botón del rayo, o un segundo dedo en cualquier lado.
//  - Mouse: apuntar y mantener apretado para el turbo.
//  - Teclado: ← → (o A D) doblan, espacio o ↑ turbo (Escape y P, la pausa,
//    los atiende main.js).
// Todo en píxeles del lienzo (ya multiplicados por la densidad de pantalla).
function crearEntrada(lienzo) {
  const e = {
    modo: 'flecha', dedos: new Map(), apunta: null, turboDedo: false, turboMouse: false, turboTecla: false,
    teclas: new Set(), pausa: false, joy: null, dpr: 1, botonTurbo: null, botonPausa: null, activo: false,
  };
  const aLienzo = (ev) => { const r = lienzo.getBoundingClientRect(); return [(ev.clientX - r.left) * e.dpr, (ev.clientY - r.top) * e.dpr]; };
  const dentro = (b, x, y) => b && Math.hypot(x - b.x, y - b.y) <= b.r * 1.25;

  lienzo.addEventListener('pointerdown', (ev) => {
    if (!e.activo) return;
    ev.preventDefault();
    lienzo.setPointerCapture?.(ev.pointerId);
    const [x, y] = aLienzo(ev);
    if (dentro(e.botonPausa, x, y)) { e.pausa = true; return; }
    if (ev.pointerType === 'mouse') { e.apunta = [x, y]; if (ev.button === 0) e.turboMouse = true; return; }
    if (dentro(e.botonTurbo, x, y)) { e.dedos.set(ev.pointerId, { turbo: true }); return; }
    // el segundo dedo (que no sea el de apuntar) es turbo
    const apuntando = [...e.dedos.values()].some((d) => !d.turbo);
    if (apuntando) { e.dedos.set(ev.pointerId, { turbo: true }); return; }
    e.dedos.set(ev.pointerId, { turbo: false, ox: x, oy: y });
    if (e.modo === 'joystick') e.joy = { x, y, dx: 0, dy: 0 };
    else e.apunta = [x, y];
  }, { passive: false });

  lienzo.addEventListener('pointermove', (ev) => {
    if (!e.activo) return;
    const [x, y] = aLienzo(ev);
    if (ev.pointerType === 'mouse') { e.apunta = [x, y]; return; }
    const d = e.dedos.get(ev.pointerId);
    if (!d || d.turbo) return;
    if (e.modo === 'joystick' && e.joy) { e.joy.dx = x - e.joy.x; e.joy.dy = y - e.joy.y; }
    else e.apunta = [x, y];
  });

  const soltar = (ev) => {
    if (ev.pointerType === 'mouse') { e.turboMouse = false; return; }
    const d = e.dedos.get(ev.pointerId);
    e.dedos.delete(ev.pointerId);
    if (d && !d.turbo && e.modo === 'joystick') e.joy = null;
  };
  lienzo.addEventListener('pointerup', soltar);
  lienzo.addEventListener('pointercancel', soltar);
  lienzo.addEventListener('contextmenu', (ev) => ev.preventDefault());
  for (const t of ['touchstart', 'touchmove', 'touchend']) lienzo.addEventListener(t, (ev) => { if (e.activo) ev.preventDefault(); }, { passive: false });

  window.addEventListener('keydown', (ev) => {
    if (ev.target && ev.target.tagName === 'INPUT') return;       // escribiendo el apodo
    e.teclas.add(ev.code);
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(ev.code) && e.activo) ev.preventDefault();
  });
  window.addEventListener('keyup', (ev) => e.teclas.delete(ev.code));
  window.addEventListener('blur', () => { e.teclas.clear(); e.turboMouse = false; e.dedos.clear(); e.joy = null; });

  // El rumbo que se pide (o null: seguir derecho) mirando desde la cabeza en (cx, cy).
  e.rumbo = (actual, cx, cy, dt) => {
    const izq = e.teclas.has('ArrowLeft') || e.teclas.has('KeyA'), der = e.teclas.has('ArrowRight') || e.teclas.has('KeyD');
    if (izq || der) { e.apunta = null; return actual + (der ? 1 : -1) * 3.2 * dt * 3; }
    if (e.modo === 'joystick' && e.joy) {
      if (Math.hypot(e.joy.dx, e.joy.dy) < 8 * e.dpr) return null;
      return Math.atan2(e.joy.dy, e.joy.dx);
    }
    if (!e.apunta) return null;
    const dx = e.apunta[0] - cx, dy = e.apunta[1] - cy;
    if (Math.hypot(dx, dy) < 6 * e.dpr) return null;
    return Math.atan2(dy, dx);
  };
  e.turbo = () => e.turboMouse || e.teclas.has('Space') || e.teclas.has('ArrowUp') || e.teclas.has('KeyW') || [...e.dedos.values()].some((d) => d.turbo);
  e.sacarPausa = () => { const p = e.pausa; e.pausa = false; return p; };
  e.soltarTodo = () => { e.dedos.clear(); e.joy = null; e.turboMouse = false; e.apunta = null; };
  return e;
}
return { crearEntrada };
})();

/* ── guardado ── */
const M_guardado = (() => {
// Lo que se guarda en el teléfono (en try: sin localStorage, el juego anda
// igual sin guardar). Lo leído se valida campo por campo.
const { PIELES } = M_pieles;
const { FONDOS } = M_fondos;
const CLAVE = 'vibora-io-1';

function base() {
  return {
    apodo: '', piel: 'lima', fondo: 'colmena', nivelBots: 1,
    mejor: 0, partidas: 0, bajas: 0,
    ajustes: { musica: true, sonido: true, vibrar: true, control: 'flecha', calidad: 'auto', idioma: null, nombres: true },
  };
}

const num = (v, a, b, d) => (Number.isFinite(v) ? Math.max(a, Math.min(b, Math.floor(v))) : d);

function validar(d) {
  const b = base();
  if (!d || typeof d !== 'object') return b;
  if (typeof d.apodo === 'string') b.apodo = d.apodo.slice(0, 16);
  if (PIELES.some((p) => p.id === d.piel)) b.piel = d.piel;
  if (FONDOS.includes(d.fondo)) b.fondo = d.fondo;
  b.nivelBots = num(d.nivelBots, 0, 2, 1);
  b.mejor = num(d.mejor, 0, 1e9, 0);
  b.partidas = num(d.partidas, 0, 1e9, 0);
  b.bajas = num(d.bajas, 0, 1e9, 0);
  const a = d.ajustes || {};
  for (const k of ['musica', 'sonido', 'vibrar', 'nombres']) if (typeof a[k] === 'boolean') b.ajustes[k] = a[k];
  if (['flecha', 'joystick'].includes(a.control)) b.ajustes.control = a.control;
  if (['auto', 'alta', 'baja'].includes(a.calidad)) b.ajustes.calidad = a.calidad;
  if (['es', 'en', 'pt'].includes(a.idioma)) b.ajustes.idioma = a.idioma;
  return b;
}

function cargar() { try { return validar(JSON.parse(localStorage.getItem(CLAVE))); } catch { return base(); } }
function guardar(d) { try { localStorage.setItem(CLAVE, JSON.stringify(d)); return true; } catch { return false; } }
return { base, validar, cargar, guardar };
})();

/* ── hud ── */
const M_hud = (() => {
// Lo que se lee jugando: la tabla de las diez más largas, el minimapa, tu
// largo y tu puesto, y los carteles de lo que pasa (a quién comiste). Todo
// en el lienzo, en píxeles de pantalla (esc = píxeles por punto CSS).
const FUENTE = (px, peso = 700) => `${peso} ${Math.round(px)}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
const miles = (n) => Math.floor(n).toLocaleString('es-AR');

// La tabla son unos treinta textos: se escriben en un lienzo aparte cuatro
// veces por segundo y cada cuadro solo se copia (escribir texto por cuadro es
// de lo más caro en el teléfono). Lo mismo "tu largo", cuando cambia.
const tablaC = { c: null, hasta: 0, clave: '' }, largoC = { c: null, clave: '' };

function dibujarHud(g, W, H, { mundo, mia, esc = 1, tr, avisos = [], tabla = null, turboBoton = null, pausa = null, joystick = null }) {
  const m = 16 * esc;             // el mismo margen de 16 px que los menús
  // ── la tabla ──
  const top = tabla || mundo.tabla();
  const filas = top.slice(0, 10), puesto = mia ? top.indexOf(mia) + 1 : 0;
  const fs = 12.5 * esc, alto = fs * 1.35;
  const anchoT = Math.min(W * 0.46, 190 * esc), x0 = W - anchoT - m, y0 = m;
  const n = filas.length + (mia && puesto > 10 ? 1 : 0);

const M_util = (() => {
// Lo chico: azar con semilla, ángulos y límites.

// mulberry32: el azar del mundo (dónde nace la comida, qué hacen los bots)
// va con semilla, así una prueba se puede repetir igual.
function azar(semilla) {
  let a = semilla >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const mezclar = (a, b, t) => a + (b - a) * t;
const acercar = (x, obj, vel, dt) => x + (obj - x) * (1 - Math.exp(-vel * dt));
// La diferencia más corta entre dos ángulos, en (-π, π].
function difAng(a, b) {
  let d = (b - a) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d <= -Math.PI) d += Math.PI * 2;
  return d;
}

const salidaAtras = (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);

// de cuánto]. Con pasos fijos de 1/60 y una pantalla de 90 o 120 Hz, uno de
// cada dos o tres cuadros quedaba sin moverse y la víbora iba a tirones.
function trozos(dtReal, max) {
  const n = Math.max(1, Math.ceil(dtReal / max - 1e-9));
  return [n, dtReal / n];

/* ── ia ── */
const M_ia = (() => {
// La cabeza de los bots. Piensan diez veces por segundo (entre medio siguen
// doblando hacia lo último que decidieron):
//  1. miran con nueve "rayos" hacia adelante hasta dónde está libre (cuerpos
//     de otras y el borde);
//  2. si adelante hay peligro, doblan hacia el rayo más libre (y con turbo si
//     está muy cerca);
//  3. si no, van a comer: la comida que más rinde por distancia (la de una
//     muerta, grande, tira mucho);
//  4. las agresivas, si tienen una más chica adelante, le cortan el camino
//     apuntando a donde va a estar su cabeza.
const { difAng } = M_util;
const RAYOS = [0, -0.35, 0.35, -0.7, 0.7, -1.1, 1.1, -1.6, 1.6];

// Cuánto se puede avanzar por un rayo hasta tocar algo (o `largo` si nada).
function libre(v, mundo, ang, largo) {
  const r = v.radio(), vi = mundo.viboras.indexOf(v), paso = Math.max(10, r * 0.8);
  const cs = Math.cos(ang), sn = Math.sin(ang);
  for (let d = r; d <= largo; d += paso) {
    const x = v.x + cs * d, y = v.y + sn * d;
    if (x * x + y * y > (mundo.radio - r * 1.5) ** 2) return d;
    const c = mundo.celdaDe(x, y), nc = mundo.nc;
    for (const cc of [c, c - 1, c + 1, c - nc, c + nc]) {
      const lista = mundo.celdasCuerpo[cc];
      if (!lista) continue;
      for (const s of lista) {
        if (mundo.sv[s] === vi) continue;
        const toca = mundo.sr[s] + r * 0.9;
        if ((mundo.sx[s] - x) ** 2 + (mundo.sy[s] - y) ** 2 < toca * toca) return d;
      }
    }
  }
  return largo;
}

// La comida que más rinde cerca (valor / distancia), o null.
function mejorComida(v, mundo, alcance) {
  let mejor = null, puntaje = 0;
  const celdas = Math.ceil(alcance / 128);
  const cx = Math.floor((v.x + mundo.radio) / 128) + 1, cy = Math.floor((v.y + mundo.radio) / 128) + 1;
  for (let j = cy - celdas; j <= cy + celdas; j++) for (let i = cx - celdas; i <= cx + celdas; i++) {
    if (i < 0 || j < 0 || i >= mundo.nc || j >= mundo.nc) continue;
    for (const f of mundo.grilla[j * mundo.nc + i]) {
      const d = Math.hypot(mundo.fx[f] - v.x, mundo.fy[f] - v.y);
      if (d > alcance) continue;
      // lo que queda detrás cuesta dar la vuelta: vale menos
      const atras = Math.abs(difAng(v.ang, Math.atan2(mundo.fy[f] - v.y, mundo.fx[f] - v.x))) / Math.PI;
      const p = mundo.fv[f] / (d + 40) / (1 + atras * 1.5);
      if (p > puntaje) { puntaje = p; mejor = f; }
    }
  }
  return mejor;
}

function pensar(v, mundo) {
  const ia = v.ia, r = v.radio();
  const largo = r * 3.5 + 90 * ia.prudencia;
  // 1. los ojos
  const vistos = RAYOS.map((da) => ({ da, ang: v.ang + da, d: libre(v, mundo, v.ang + da, largo) }));
  const frente = vistos[0].d;
  v.turbo = false;
  // 2. peligro adelante: al más libre (a igualdad, el que menos obliga a doblar)
  if (frente < largo * 0.7) {
    let mejor = vistos[0];
    for (const o of vistos) if (o.d - Math.abs(o.da) * 12 > mejor.d - Math.abs(mejor.da) * 12) mejor = o;
    v.angObj = mejor.ang;
    if (frente < largo * 0.35 && v.masa > 25 && mundo.r() < 0.6) v.turbo = true;
    return;
  }
  // 4. cortarle el paso a una más chica que viene de frente o de costado
  if (ia.agresion > 0.3 && v.masa > 40) {
    for (const o of mundo.viboras) {
      if (o === v || !o.viva || o.masa > v.masa * 0.8) continue;
      const d = Math.hypot(o.x - v.x, o.y - v.y);
      if (d > 380) continue;
      const adelante = d * 0.55, px = o.x + Math.cos(o.ang) * adelante, py = o.y + Math.sin(o.ang) * adelante;
      const ang = Math.atan2(py - v.y, px - v.x);
      if (libre(v, mundo, ang, Math.min(largo, d)) < Math.min(largo, d) * 0.8) continue;
      v.angObj = ang;
      v.turbo = d < 240 && mundo.r() < ia.agresion;
      return;
    }
  }
  // 3. comer
  const f = mejorComida(v, mundo, 260 + 140 * ia.codicia);
  if (f !== null) {
    const ang = Math.atan2(mundo.fy[f] - v.y, mundo.fx[f] - v.x);
    // si para ir a la comida hay que pasar cerca de algo, mejor no
    if (libre(v, mundo, ang, largo * 0.8) >= largo * 0.6) { v.angObj = ang; return; }
  }
  // sin nada: pasear con un rumbo que cambia despacio, y de vuelta al centro si está lejos
  ia.deambula += (mundo.r() - 0.5) * 0.6;
  const lejos = Math.hypot(v.x, v.y) > mundo.radio * 0.75;
  v.angObj = lejos ? Math.atan2(-v.y, -v.x) : v.ang + difAng(v.ang, ia.deambula) * 0.3;
}
return { pensar };
})();

  { id: 'B', capa: 1, d: [['M', 10, 130], ['C', 18, 158, 50, 168, 86, 166], ['C', 108, 165, 122, 158, 134, 142], ['L', 200, 46], ['C', 216, 24, 244, 12, 272, 12], ['C', 310, 12, 340, 30, 340, 62]] },

// Un trazo como Path2D, escalado y corrido.
function camino2d(t, esc = 1, ox = 0, oy = 0) {
  const p = new Path2D();
  for (const [op, ...n] of t.d) {
    const q = n.map((v, i) => (i % 2 ? oy + v * esc : ox + v * esc));
    if (op === 'M') p.moveTo(q[0], q[1]);
    else if (op === 'L') p.lineTo(q[0], q[1]);
    else p.bezierCurveTo(q[0], q[1], q[2], q[3], q[4], q[5]);
  }
  return p;
}

// Puntos a lo largo del trazo, más o menos parejos (para la 3D, para animar
// el dibujo de la línea y para medir el largo).
function muestrear(t, cada = 3) {
  const pts = [];
  let x = 0, y = 0;
  for (const [op, ...n] of t.d) {
    if (op === 'M') { x = n[0]; y = n[1]; pts.push([x, y]); continue; }
    if (op === 'L') {
      const [x1, y1] = n, largo = Math.hypot(x1 - x, y1 - y), k = Math.max(1, Math.ceil(largo / cada));
      for (let i = 1; i <= k; i++) pts.push([x + ((x1 - x) * i) / k, y + ((y1 - y) * i) / k]);
      x = x1; y = y1; continue;
    }
    const [c1x, c1y, c2x, c2y, x1, y1] = n;
    const aprox = Math.hypot(c1x - x, c1y - y) + Math.hypot(c2x - c1x, c2y - c1y) + Math.hypot(x1 - c2x, y1 - c2y);
    const k = Math.max(2, Math.ceil(aprox / cada));
    for (let i = 1; i <= k; i++) {
      const s = i / k, r = 1 - s;
      pts.push([r * r * r * x + 3 * r * r * s * c1x + 3 * r * s * s * c2x + s * s * s * x1, r * r * r * y + 3 * r * r * s * c1y + 3 * r * s * s * c2y + s * s * s * y1]);
    }
    x = x1; y = y1;
  }
  return pts;
}

function largo(t) {
  const p = muestrear(t, 2);
  let l = 0;
  for (let i = 1; i < p.length; i++) l += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
  return l;
}

// El monograma dibujado en 2D con su metal, en un lienzo aparte (así el
// reflejo, que se pinta "arriba de lo dibujado", toca solo el metal):
// sombra, borde oscuro (que en el cruce hace de hueco y deja ver que B pasa
// por encima), el cuerpo con un degradé de cromo y el filo de luz.
// `avance` (0 a 1) dibuja cada trazo hasta ahí: el metal "se escribe".
// `brillo` (0 a 1) pasa una franja de luz de izquierda a derecha.
function monograma(ancho, { avance = 1, brillo = -1, sombra = true, lienzo = null } = {}) {
  const esc = ancho / CAJA.w, gro = GROSOR * esc, alto = Math.ceil(CAJA.h * esc);
  const m = Math.ceil(10 * esc) + 2;
  const c = lienzo || document.createElement('canvas');
  c.width = Math.ceil(ancho) + 2 * m; c.height = alto + 2 * m;
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  const crom = g.createLinearGradient(0, m, 0, m + alto);
  crom.addColorStop(0, '#fbfbfd'); crom.addColorStop(0.35, '#c9ccd4'); crom.addColorStop(0.55, '#8a8f99');
  crom.addColorStop(0.7, '#d9dce3'); crom.addColorStop(1, '#6f747e');
  g.lineCap = 'butt'; g.lineJoin = 'round';
  for (const capa of [0, 1]) for (const t of TRAZOS) {
    if (t.capa !== capa) continue;
    const p = camino2d(t, esc, m, m), l = largo(t) * esc;
    const trazo = (a, estilo, dx = 0, dy = 0) => {
      g.save();
      g.translate(dx, dy);
      if (avance < 1) g.setLineDash([Math.max(0.01, l * avance), l + 10]);
      g.lineWidth = a; g.strokeStyle = estilo; g.stroke(p);
      g.restore();
    };

    // cruce, el bisel gris y la cara de cromo
    if (sombra) trazo(gro + 2 * esc, 'rgba(0,0,0,0.6)', 3 * esc, 5 * esc);
    trazo(gro + 5 * esc, '#050607');
    trazo(gro, '#5b5f68');
    trazo(gro * 0.74, crom);
  }
  if (brillo >= 0 && brillo <= 1) {
    g.globalCompositeOperation = 'source-atop';
    const bx = m + (brillo * 1.6 - 0.3) * ancho;
    const f = g.createLinearGradient(bx - ancho * 0.12, 0, bx + ancho * 0.12, 0);
    f.addColorStop(0, 'rgba(255,255,255,0)'); f.addColorStop(0.5, 'rgba(255,255,255,0.85)'); f.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = f; g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'source-over';
  }

  return c;
}

// La palabra "JXStudios" en metal, con la letra del sistema (sans gruesa):
// se mide y se escala para que ocupe justo `ancho`.
function palabra(ancho, { color = null } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const fuente = (px) => `600 ${px}px "Montserrat", "Poppins", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif`;
  g.font = fuente(100);
  const w100 = g.measureText('JXStudios').width || 400;
  const px = Math.max(8, (ancho / w100) * 100);
  c.width = Math.ceil(ancho + px * 0.2); c.height = Math.ceil(px * 1.35);
  g.font = fuente(px); g.textBaseline = 'alphabetic';
  const base = Math.round(px * 1.02), x = Math.round(px * 0.1);
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillText('JXStudios', x + px * 0.03, base + px * 0.05);
  const crom = g.createLinearGradient(0, base - px * 0.75, 0, base);
  crom.addColorStop(0, '#ffffff'); crom.addColorStop(0.5, '#d2d5dc'); crom.addColorStop(0.62, '#9aa0aa'); crom.addColorStop(1, '#e7e9ee');
  g.fillStyle = color || crom; g.fillText('JXStudios', x, base);

}

// El monograma en píxeles: se traza chico (con el hueco del cruce), se
// separa metal de borde por color y se vuelve a pintar a mano en escalones
// de cromo (claro arriba, oscuro al medio, claro abajo) con bisel.
function monogramaPixel(anchoPx, { avance = 1 } = {}) {
  const esc = anchoPx / CAJA.w, alto = Math.ceil(CAJA.h * esc) + 4, ancho = Math.ceil(anchoPx) + 4;
  const c = document.createElement('canvas');
  c.width = ancho; c.height = alto;
  const g = c.getContext('2d');
  for (const capa of [0, 1]) for (const t of TRAZOS) {
    if (t.capa !== capa) continue;
    const p = camino2d(t, esc, 2, 2), l = largo(t) * esc;
    g.save();
    if (avance < 1) g.setLineDash([Math.max(0.01, l * avance), l + 10]);
    g.lineCap = 'butt';
    g.lineWidth = GROSOR * esc + 2.2; g.strokeStyle = '#ff0000'; g.stroke(p);
    g.lineWidth = GROSOR * esc; g.strokeStyle = '#00ff00'; g.stroke(p);
    g.restore();
  }
  const img = g.getImageData(0, 0, ancho, alto), d = img.data;
  const metal = new Uint8Array(ancho * alto), borde = new Uint8Array(ancho * alto);
  for (let i = 0; i < ancho * alto; i++) {
    if (d[i * 4 + 3] < 90) continue;
    if (d[i * 4 + 1] > 110) metal[i] = 1; else if (d[i * 4] > 110) borde[i] = 1;
  }
  const ESCALON = ['#f4f5f8', '#d9dbe1', '#b7bbc4', '#8d929c', '#a9adb6', '#d3d6dc', '#9ea3ad', '#767b85'];
  for (let y = 0; y < alto; y++) for (let x = 0; x < ancho; x++) {
    const i = y * ancho + x, k = i * 4;
    if (metal[i]) {
      const arriba = y > 0 && metal[i - ancho], abajo = y < alto - 1 && metal[i + ancho];
      const izq = x > 0 && metal[i - 1], der = x < ancho - 1 && metal[i + 1];
      let col = ESCALON[Math.min(ESCALON.length - 1, Math.floor(((y - 2) / (alto - 4)) * ESCALON.length))];
      if (!arriba || !izq) col = '#ffffff';            // el filo que da a la luz
      else if (!abajo || !der) col = '#5b5f68';        // el bisel en sombra
      const n = parseInt(col.slice(1), 16);
      d[k] = n >> 16; d[k + 1] = (n >> 8) & 255; d[k + 2] = n & 255; d[k + 3] = 255;
    } else if (borde[i]) { d[k] = 5; d[k + 1] = 6; d[k + 2] = 8; d[k + 3] = 255; }
    else d[k + 3] = 0;
  }
  g.putImageData(img, 0, 0);
  c.mascara = metal;       // para pasarle el brillo solo por el metal
  c.esc = esc;             // para ubicar puntas de trazo en pantalla

}

// Dónde va la punta de cada trazo cuando está escrito hasta `avance`
// (coordenadas de la caja del logo).
const cacheMuestras = new Map();
function puntas(avance) {
  const out = [];
  for (const t of TRAZOS) {
    if (!cacheMuestras.has(t.id)) {
      const p = muestrear(t, 2), acum = [0];
      for (let i = 1; i < p.length; i++) acum.push(acum[i - 1] + Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]));
      cacheMuestras.set(t.id, { p, acum });
    }
    const { p, acum } = cacheMuestras.get(t.id), meta = acum[acum.length - 1] * avance;
    let i = 1;
    while (i < acum.length - 1 && acum[i] < meta) i++;
    out.push(p[i]);
  }
  return out;
}
return { CAJA, GROSOR, TRAZOS, camino2d, muestrear, largo, monograma, palabra, monogramaPixel, puntas };
})();

/* ── intro ── */
const M_intro = (() => {
// La intro de JXSTUDIOS en 2D, rápida (menos de tres segundos) y con
// movimiento de cámara: una raya de luz abre la fibra de carbono, la reja de
// metal entra desde los costados, el monograma se escribe con luz (cuatro
// puntas que dejan chispas), golpe con destello y onda, brillo que cruza el
// metal, la palabra JXStudios sube, y un empujón hacia adelante que da paso
// al juego. Arranca apenas abre la página (main.js). La música sale de
// sonido.js › jingleJXS, agendada con el mismo reloj; un toque la saltea.
const { monograma, palabra, puntas, CAJA } = M_logojxs;
const { clamp, salida, salidaAtras } = M_util;
const T = { raya: 0.16, abre: 0.5, traza: [0.15, 1.0], golpe: 1.05, brillo: [1.15, 1.7], palabra: 1.2, fin: 2.5, salto: 0.35 };

let carbono = null;
function patronCarbono(g) {
  if (carbono) return carbono;
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const q = c.getContext('2d');
  for (let y = 0; y < 16; y += 2) for (let x = 0; x < 16; x += 2) {
    const s = ((x >> 1) + (y >> 1)) % 4 < 2;
    q.fillStyle = s ? '#27292e' : '#18191c'; q.fillRect(x, y, 2, 2);
    q.fillStyle = s ? '#2f3137' : '#1d1e22'; q.fillRect(x, y, 1, 1);
  }
  carbono = g.createPattern(c, 'repeat');
  return carbono;
}

// El fondo: carbono con un rombo al centro y la reja de metal alrededor.
function fondoJX(g, W, H, t, { entra = 1, zoom = 1 } = {}) {
  g.fillStyle = '#050506'; g.fillRect(0, 0, W, H);
  g.save();
  g.translate(W / 2, H / 2); g.scale(zoom, zoom); g.translate(-W / 2, -H / 2);
  const p = patronCarbono(g), esc = Math.max(1, Math.min(W, H) / 400);
  p.setTransform(new DOMMatrix([esc, 0, 0, esc, 0, 0]));
  g.fillStyle = p; g.fillRect(-W, -H, W * 3, H * 3);
  // la reja: barras de metal cepillado a ±45°, entrando desde los costados
  const paso = Math.min(W, H) * 0.22, grosor = paso * 0.1, rombo = Math.min(W, H) * 0.36;
  g.save();
  g.beginPath(); g.rect(-W, -H, W * 3, H * 3);
  g.moveTo(W / 2, H / 2 - rombo); g.lineTo(W / 2 - rombo, H / 2); g.lineTo(W / 2, H / 2 + rombo); g.lineTo(W / 2 + rombo, H / 2); g.closePath();
  g.clip('evenodd');
  const corre = (1 - salida(entra)) * W * 0.6;
  for (const lado of [-1, 1]) {
    g.save();
    g.translate(W / 2 + lado * corre, H / 2);
    g.rotate((lado * Math.PI) / 4);
    const metal = g.createLinearGradient(0, -grosor, 0, grosor);
    metal.addColorStop(0, '#5f646d'); metal.addColorStop(0.5, '#a3a8b1'); metal.addColorStop(1, '#3f434a');
    for (let k = -12; k <= 12; k++) {
      g.fillStyle = '#050506'; g.fillRect(-W * 2, k * paso - grosor / 2 - 2, W * 4, grosor + 4);
      g.fillStyle = metal; g.save(); g.translate(0, k * paso); g.fillRect(-W * 2, -grosor / 2, W * 4, grosor); g.restore();
    }
    g.restore();
  }
  g.restore();
  // el borde del rombo
  g.strokeStyle = '#8d929c'; g.lineWidth = Math.max(2, grosor * 0.35);
  g.beginPath(); g.moveTo(W / 2, H / 2 - rombo); g.lineTo(W / 2 - rombo, H / 2); g.lineTo(W / 2, H / 2 + rombo); g.lineTo(W / 2 + rombo, H / 2); g.closePath(); g.stroke();
  g.restore();
  // viñeta y un halo de luz arriba del centro
  const v = g.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.1, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(255,255,255,0.06)'); v.addColorStop(0.6, 'rgba(0,0,0,0.2)'); v.addColorStop(1, 'rgba(0,0,0,0.85)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

class Intro {
  constructor({ sonido, vibrar = () => {}, alTerminar }) {
    this.t = 0; this.chispas = []; this.golpeado = false; this.terminado = false;
    this.alTerminar = alTerminar; this.vibrar = vibrar;
    this.musica = sonido.jingleJXS?.() || null;
    this.lienzoLogo = null;
  }
  saltear() {
    if (this.t < T.salto || this.terminado) return;
    this.musica?.cortar();
    this.t = Math.max(this.t, T.fin);
  }
  pasar(dt, W, H) {
    this.t += dt;
    const ancho = this.ancho(W, H);
    if (this.t > T.traza[0] && this.t < T.traza[1] && this.puntasPantalla) {
      for (const [x, y] of this.puntasPantalla) for (let k = 0; k < 3; k++) {
        const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 90;
        this.chispas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, vida: 0.3 + Math.random() * 0.3, col: Math.random() < 0.6 ? '#ffffff' : '#9fdcff' });
      }
    }
    if (!this.golpeado && this.t >= T.golpe) {
      this.golpeado = true;
      this.vibrar([30, 20, 40]);
      for (let k = 0; k < 120; k++) {
        const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 380;
        this.chispas.push({ x: W / 2 + (Math.random() - 0.5) * ancho * 0.8, y: H * 0.44 + (Math.random() - 0.5) * ancho * 0.3, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, vida: 0.5 + Math.random() * 0.7, col: ['#ffffff', '#ffe7a8', '#c9ccd4', '#9fdcff'][k % 4] });
      }
    }
    for (const c of this.chispas) { c.t += dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.95; c.vy = c.vy * 0.95 + 160 * dt; }
    this.chispas = this.chispas.filter((c) => c.t < c.vida);
    if (this.t >= T.fin + 0.35 && !this.terminado) { this.terminado = true; this.alTerminar?.(); }
  }
  ancho(W, H) { return Math.min(W * 0.72, H * 0.95, 760); }

  dibujar(g, W, H) {
    const t = this.t, ancho = this.ancho(W, H), cy = H * 0.44;
    g.save();
    // la sacudida del golpe
    const sac = t > T.golpe && t < T.golpe + 0.4 ? (1 - (t - T.golpe) / 0.4) * 10 * (W / 800) : 0;
    if (sac) g.translate((Math.random() - 0.5) * sac, (Math.random() - 0.5) * sac);
    // el empujón final hacia adelante
    const fin = clamp((t - T.fin) / 0.35, 0, 1), zoom = 1 + fin * fin * 0.6;
    if (t < T.raya) {
      g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
      const w = W * salida(t / T.raya);
      const gr = g.createLinearGradient(W / 2 - w / 2, 0, W / 2 + w / 2, 0);
      gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, '#ffffff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(W / 2 - w / 2, cy - 1, w, 2);
      g.restore();
      return;
    }
    const abre = clamp((t - T.raya) / (T.abre - T.raya), 0, 1);
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    g.save();
    const alto = (Math.max(cy, H - cy) + 10) * salidaAtras(abre);
    g.beginPath(); g.rect(0, cy - alto, W, alto * 2); g.clip();
    fondoJX(g, W, H, t, { entra: clamp((t - 0.2) / 0.6, 0, 1), zoom: (1.12 - 0.12 * salida(abre)) * zoom });
    g.restore();
    // el monograma: se escribe, golpea y brilla
    const avance = clamp((t - T.traza[0]) / (T.traza[1] - T.traza[0]), 0, 1);
    if (avance > 0) {
      const brillo = t > T.brillo[0] && t < T.brillo[1] ? (t - T.brillo[0]) / (T.brillo[1] - T.brillo[0]) : -1;
      const golpe = t >= T.golpe ? salida(clamp((t - T.golpe) / 0.25, 0, 1)) : 0;
      const escala = (avance < 1 ? 1 : 1 + (1 - golpe) * 0.06) * zoom;
      this.lienzoLogo = monograma(ancho * escala, { avance, brillo, lienzo: this.lienzoLogo });
      const m = this.lienzoLogo, x0 = W / 2 - m.width / 2, y0 = cy - m.height / 2;
      // mientras se escribe, las puntas brillan con luz
      if (avance < 1) {
        const esc = (ancho * escala) / CAJA.w;
        this.puntasPantalla = puntas(avance).map(([px, py]) => [x0 + m.margen + px * esc, y0 + m.margen + py * esc]);
        g.globalCompositeOperation = 'lighter';
        for (const [px, py] of this.puntasPantalla) {
          const r = ancho * 0.05, gr = g.createRadialGradient(px, py, 0, px, py, r);
          gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.3, 'rgba(160,220,255,0.5)'); gr.addColorStop(1, 'rgba(160,220,255,0)');
          g.fillStyle = gr; g.beginPath(); g.arc(px, py, r, 0, Math.PI * 2); g.fill();
        }
        g.globalCompositeOperation = 'source-over';
      } else this.puntasPantalla = null;
      g.drawImage(m, x0, y0);
      // el destello y la onda del golpe
      if (t >= T.golpe && t < T.golpe + 0.5) {
        const k = (t - T.golpe) / 0.5;
        g.fillStyle = `rgba(255,255,255,${(1 - k) * (1 - k) * 0.9})`; g.fillRect(0, 0, W, H);
        g.strokeStyle = `rgba(255,255,255,${(1 - k) * 0.7})`; g.lineWidth = 6 * (1 - k) + 1;
        g.beginPath(); g.arc(W / 2, cy, ancho * (0.3 + k * 0.9), 0, Math.PI * 2); g.stroke();
      }
    }
    // la palabra que sube
    if (t > T.palabra) {
      const k = salida(clamp((t - T.palabra) / 0.45, 0, 1));
      const p = this.palabraC || (this.palabraC = palabra(ancho * 0.72));
      g.globalAlpha = k;
      g.drawImage(p, W / 2 - (p.width * zoom) / 2, cy + ancho * 0.26 + (1 - k) * ancho * 0.08, p.width * zoom, p.height * zoom);
      g.globalAlpha = 1;

    for (const c of this.chispas) {
      const a = 1 - c.t / c.vida;

    }
    g.globalAlpha = 1;
    if (fin > 0) { g.fillStyle = `rgba(0,0,0,${fin})`; g.fillRect(0, 0, W, H); }
    g.restore();
  }
}
return { Intro };
})();
