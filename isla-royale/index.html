<title>Isla Royale</title>
<meta name="description" content="Battle royale en 3D en el navegador: saltás del autobús, abrís cofres, juntás materiales, construís y sobrevivís a la tormenta. En español, inglés y portugués.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap">
<style>
  /* Un solo mundo visual (una isla a pleno sol y un vestíbulo violeta): no
     cambia con el tema del visor, así que los colores van fijos. */
  :root {
    color-scheme: light;
    --oro: #ffc62e; --oro-o: #c77d00; --tormenta: #8a3dff;
    --panel: rgba(16, 20, 54, 0.72); --panel-lleno: #141a44; --panel-claro: rgba(255,255,255,0.12);
    --tinta: #ffffff; --tinta-suave: rgba(255, 255, 255, 0.8);
    --vida: #4ee06a; --escudo: #3cb4ff; --peligro: #ff4d6d;
    --titular: "Luckiest Guy", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --cuerpo: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body { margin: 0; background: linear-gradient(180deg, #2a1d6e, #4f6fe0); color: var(--tinta); font: 800 15px/1.3 var(--cuerpo); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #raiz { position: fixed; inset: 0; }
  /* Teléfono parado: GIRO (base.js) le pone ancho, alto y el giro en px; acá solo el eje. */
  html.girado #raiz { right: auto; bottom: auto; transform-origin: 0 0; }
  :root { --vw: 1vw; --vh: 1vh; --sa-top: env(safe-area-inset-top, 0px); --sa-right: env(safe-area-inset-right, 0px); --sa-bottom: env(safe-area-inset-bottom, 0px); --sa-left: env(safe-area-inset-left, 0px); }
  /* Girado, cada borde del juego cae sobre otro borde del teléfono (el de arriba del juego es
     el derecho de la pantalla): las zonas seguras (la muesca, la barra de gestos) rotan con él. */
  html.girado { --sa-top: env(safe-area-inset-right, 0px); --sa-right: env(safe-area-inset-bottom, 0px); --sa-bottom: env(safe-area-inset-left, 0px); --sa-left: env(safe-area-inset-top, 0px); }
  .cargando-html { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  .cargando-html b { display: block; font: 400 44px/1 var(--titular); margin-bottom: 10px; }
  .cargando-html small { display: block; max-width: 34ch; margin: 12px auto 0; color: var(--tinta-suave); font-size: 13px; }
  #error { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 99; padding: 10px 14px; border-radius: 12px; background: rgba(160, 0, 40, 0.92); font-size: 14px; }
  canvas.juego, canvas.capa { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  canvas.capa { pointer-events: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  kbd { display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,0.22); font: 900 12px/1.4 var(--cuerpo); text-align: center; }
  .logo { margin: 0; font: 400 clamp(48px, calc(11 * var(--vw)), 104px)/0.9 var(--titular); letter-spacing: 0.02em; color: #fff; text-shadow: 0 6px 0 #1f6fd1, 0 12px 24px rgba(0,0,0,0.35); transform: rotate(-3deg); }
  .logo span { color: var(--oro); text-shadow: 0 6px 0 var(--oro-o), 0 12px 24px rgba(0,0,0,0.35); }
  .jugar { padding: 14px 44px; border: 0; border-radius: 14px; background: linear-gradient(180deg, #ffe066, var(--oro)); color: #3a2600; font: 400 30px/1 var(--titular); letter-spacing: 0.04em; box-shadow: 0 6px 0 var(--oro-o), 0 12px 24px rgba(0,0,0,0.3); transition: transform 0.1s; }
  .jugar:hover { transform: translateY(-2px); } .jugar:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--oro-o); }
  .jugar.sec { padding: 10px 24px; font-size: 19px; background: linear-gradient(180deg, #ffffff, #d9e6ff); box-shadow: 0 5px 0 #7d93c7, 0 10px 20px rgba(0,0,0,0.25); }
  button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* ── carga ── */
  .carga { position: absolute; inset: 0; z-index: 20; overflow: hidden; background: #2a1d6e; }
  .portada { position: absolute; inset: 0; width: 100%; height: 100%; }
  .carga-titulo { position: absolute; left: 0; right: 0; top: 12%; text-align: center; }
  .carga-titulo p { margin: 18px 0 0; font-size: 16px; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
  .carga-pie { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px calc(6 * var(--vw)) calc(26px + var(--sa-bottom)); background: linear-gradient(transparent, rgba(10, 8, 40, 0.85)); }
  .consejo { margin: 0 0 14px; max-width: 60ch; font-size: 16px; animation: entrar 0.4s ease-out both; }
  .progreso { height: 12px; border-radius: 6px; background: rgba(255,255,255,0.18); overflow: hidden; }
  .progreso i { display: block; height: 100%; background: linear-gradient(90deg, #ffe066, var(--oro)); transition: width 0.25s ease-out; }
  .etapa { display: flex; justify-content: space-between; margin-top: 8px; font-size: 14px; color: var(--tinta-suave); }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } }

  /* ── vestíbulo ── */
  .vestibulo { position: absolute; inset: 0; pointer-events: none; }
  .vestibulo > * { pointer-events: auto; }
  .giro { position: absolute; left: 25%; right: 25%; top: 12%; bottom: 12%; touch-action: none; cursor: grab; }
  .giro-nota { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 13px; color: var(--tinta-suave); pointer-events: none !important; }
  .barra-sup { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 16px; padding: calc(10px + var(--sa-top)) 18px 10px; background: linear-gradient(rgba(10, 8, 40, 0.75), transparent); }
  .marca { font: 400 24px/1 var(--titular); letter-spacing: 0.03em; white-space: nowrap; } .marca span { color: var(--oro); }
  .tabs { display: flex; gap: 2px; margin: 0 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: none; padding: 8px 12px; border: 0; background: transparent; font: 400 20px/1 var(--titular); letter-spacing: 0.04em; color: var(--tinta-suave); border-bottom: 3px solid transparent; }
  .tabs button.activa { color: #fff; border-bottom-color: var(--oro); }
  .perfil { display: flex; align-items: center; gap: 8px; }
  .nivel { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: var(--oro); color: #3a2600; font: 400 18px/1 var(--titular); transform: rotate(-6deg); }
  .xp { width: 110px; height: 6px; margin-top: 3px; border-radius: 3px; background: rgba(255,255,255,0.2); overflow: hidden; } .xp i { display: block; height: 100%; background: var(--oro); }
  .campo { display: grid; gap: 4px; font-size: 13px; color: var(--tinta-suave); }
  .campo input { padding: 8px 10px; border: 0; border-radius: 10px; background: var(--panel); color: #fff; font: 800 16px var(--cuerpo); }
  .casillero h2 { margin: 0; font: 400 26px/1 var(--titular); letter-spacing: 0.03em; }
  .trajes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .traje { position: relative; display: grid; justify-items: center; gap: 4px; padding: 10px 6px; border: 0; border-bottom: 3px solid var(--r); border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1); }
  .traje.cerrado i { filter: grayscale(0.8) brightness(0.6); } .traje .candado { color: var(--tinta-suave); }
  .traje i { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--c1) 50%, var(--c2) 50%); box-shadow: 0 0 0 3px rgba(255,255,255,0.3); }
  .traje.activa { background: linear-gradient(180deg, rgba(180, 92, 255, 0.55), rgba(90, 34, 148, 0.7)); box-shadow: inset 0 0 0 2px var(--oro); }
  .traje small { font-size: 10px; color: var(--oro); }
  .lado-der { position: absolute; right: 18px; bottom: calc(18px + var(--sa-bottom)); display: grid; gap: 10px; justify-items: end; }
  .modo { padding: 10px 14px; border-radius: 12px; background: var(--panel); text-align: right; }
  .modo small { display: block; color: var(--tinta-suave); } .modo b { font: 400 22px/1 var(--titular); letter-spacing: 0.03em; }
  .rivales { margin-top: 6px; font-size: 13px; }
  .chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .chip-op { padding: 4px 10px; border: 0; border-radius: 8px; background: var(--panel-claro); font-size: 13px; } .chip-op.activa { background: var(--oro); color: #3a2600; }
  .lado-der.compacto .jugar { padding: 10px 28px; font-size: 22px; }

  /* Pestañas del vestíbulo: cada una entra deslizándose y sus tarjetas, en cascada. */
  .contenido { position: absolute; left: 18px; right: 18px; top: 70px; bottom: calc(18px + var(--sa-bottom)); pointer-events: none !important; animation: deslizar 0.35s ease-out both; }
  .contenido > * { pointer-events: auto; }
  @keyframes deslizar { from { opacity: 0; transform: translateX(-24px); } }
  .tarjeta-in { animation: aparecer 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) both; animation-delay: calc(var(--i, 0) * 50ms); }
  @keyframes aparecer { from { opacity: 0; transform: translateX(-18px) scale(0.97); } }
  .col-izq { width: min(330px, calc(40 * var(--vw))); max-height: 100%; overflow-y: auto; display: grid; gap: 8px; align-content: start; scrollbar-width: thin; }
  .hoja { width: min(600px, calc(58 * var(--vw))); max-height: 100%; overflow-y: auto; display: grid; gap: 10px; align-content: start; padding: 14px 16px; border-radius: 16px; background: rgba(16, 20, 54, 0.82); box-shadow: 0 16px 40px rgba(0,0,0,0.35); scrollbar-width: thin; }
  .hoja h2 { margin: 0; font: 400 26px/1 var(--titular); letter-spacing: 0.03em; }
  .subtitulo { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin: 4px 0 0; font: 400 18px/1 var(--titular); letter-spacing: 0.04em; color: var(--oro); }
  .subtitulo small { font: 700 12px var(--cuerpo); color: var(--tinta-suave); }
  .modo-tarjeta { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-radius: 14px; background: var(--panel); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08); text-align: left; transition: background 0.15s, box-shadow 0.15s; }
  .modo-tarjeta:hover { background: rgba(40, 48, 110, 0.85); }
  .modo-tarjeta.activa { background: linear-gradient(120deg, rgba(255, 198, 46, 0.32), rgba(90, 34, 148, 0.8)); box-shadow: inset 0 0 0 2px var(--oro), 0 6px 18px rgba(0,0,0,0.3); }
  .modo-icono { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,0.1); font-size: 24px; }
  .modo-tarjeta b { display: block; font: 400 19px/1 var(--titular); letter-spacing: 0.03em; }
  .modo-tarjeta small { display: block; margin-top: 3px; font-size: 12px; font-weight: 700; color: var(--tinta-suave); }
  .novedades { position: absolute; right: 18px; top: 74px; width: min(270px, calc(30 * var(--vw))); padding: 12px 14px; border-radius: 14px; background: linear-gradient(150deg, rgba(58, 127, 255, 0.88), rgba(138, 61, 255, 0.88)); box-shadow: 0 10px 26px rgba(0,0,0,0.3); animation: aparecer 0.5s 0.2s ease-out both; }
  .novedades > small { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #ffe38a; }
  .nov-cuerpo { animation: entrar 0.4s ease-out both; } .nov-cuerpo b { display: block; margin-top: 4px; font: 400 20px/1.05 var(--titular); letter-spacing: 0.03em; }
  .nov-cuerpo p { margin: 4px 0 0; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .puntos { display: flex; gap: 6px; margin-top: 8px; } .puntos button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 4px; background: rgba(255,255,255,0.4); transition: width 0.2s; } .puntos button.activa { width: 20px; background: #fff; }
  .traje-info { display: grid; justify-items: start; gap: 4px; padding: 10px 12px; border-left: 5px solid var(--r); border-radius: 12px; background: var(--panel); }
  .traje-info small { font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--r); } .traje-info b { font: 400 22px/1 var(--titular); letter-spacing: 0.03em; } .traje-info .nota { margin: 0; }
  .carrera-cab { display: flex; align-items: center; gap: 14px; } .carrera-cab > div { flex: 1; display: grid; gap: 4px; } .carrera-cab small { font-size: 12px; color: var(--tinta-suave); }
  .nivel.grande { width: 56px; height: 56px; border-radius: 12px; font-size: 30px; } .xp.ancha { width: 100%; height: 8px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .tile { padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.07); font-size: 12px; color: var(--tinta-suave); } .tile b { display: block; margin-bottom: 3px; font: 400 26px/1 var(--titular); color: #fff; }
  .records { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
  .records div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); font-size: 13px; } .records b { font: 400 18px/1 var(--titular); color: var(--oro); }
  .historial { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .historial li { display: grid; grid-template-columns: 44px 1fr auto auto auto; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); font-size: 13px; }
  .historial li.gano { background: linear-gradient(90deg, rgba(255, 198, 46, 0.35), rgba(255,255,255,0.05)); } .historial b { font: 400 18px/1 var(--titular); } .historial small { color: var(--tinta-suave); }
  .desafios { display: grid; gap: 8px; }
  .desafio { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.07); } .desafio > div { flex: 1; display: grid; gap: 4px; } .desafio small { font-size: 12px; color: var(--tinta-suave); }
  .desafio.listo { box-shadow: inset 0 0 0 2px var(--vida); } .desafio.cobrado { opacity: 0.65; }
  .premio { font-weight: 900; white-space: nowrap; } .premio:disabled { opacity: 0.55; cursor: default; }
  .desafio.listo:not(.cobrado) .premio { background: var(--vida); color: #0b2a12; animation: latir 1s ease-in-out infinite; }
  .sello { font-size: 13px; color: var(--vida); white-space: nowrap; }
  .camino { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .escalon { position: relative; display: grid; justify-items: center; gap: 4px; padding: 12px 8px 10px; border-bottom: 3px solid var(--r); border-radius: 12px; background: rgba(255,255,255,0.06); text-align: center; }
  .escalon .nivel { position: absolute; left: 8px; top: 8px; width: 26px; height: 26px; font-size: 15px; }
  .escalon i { width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg, var(--c1) 50%, var(--c2) 50%); box-shadow: 0 0 0 3px rgba(255,255,255,0.3); }
  .escalon:not(.libre) i { filter: grayscale(0.8) brightness(0.6); } .escalon small { font-size: 11px; color: var(--tinta-suave); } .escalon.libre small { color: var(--vida); }
  .creditos { display: grid; gap: 6px; } .creditos ul { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .creditos li { padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); font-size: 13px; overflow-wrap: anywhere; } .creditos a { color: #9fd3ff; }
  .opciones-hoja .pestanas { padding: 0; } .opciones-hoja .panel-cuerpo { padding: 10px 0 0; overflow: visible; }
  /* El personaje se corre a la derecha en las pestañas con panel ancho: la zona para girarlo lo sigue. */
  .pest-casillero .giro { left: 42%; right: 12%; }
  .pest-carrera .giro, .pest-pase .giro, .pest-opciones .giro { left: 64%; right: 3%; }

  /* ── elegir idioma ── */
  .pantalla-idioma { position: absolute; inset: 0; z-index: 15; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 20px 16px; background: radial-gradient(circle at 50% 40%, rgba(42, 29, 110, 0.55), rgba(10, 8, 40, 0.92)); text-align: center; }
  .idioma-titulo { margin: 0; font-size: 16px; color: var(--tinta-suave); animation: entrar 0.4s ease-out both; } .idioma-titulo i { font-style: normal; opacity: 0.5; }
  .idiomas-grandes { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .idioma-btn { position: relative; display: grid; justify-items: center; gap: 6px; width: min(200px, calc(28 * var(--vw))); padding: 18px 12px 16px; border: 0; border-radius: 18px; background: var(--panel-lleno); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15), 0 10px 24px rgba(0,0,0,0.35); animation: aparecer-arriba 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; animation-delay: calc(var(--i) * 90ms + 150ms); transition: background 0.15s; }
  .idioma-btn:hover { background: #1f2866; }
  .idioma-btn.activa { background: linear-gradient(180deg, #ffe066, var(--oro)); color: #3a2600; box-shadow: 0 6px 0 var(--oro-o), 0 12px 24px rgba(0,0,0,0.3); }
  .idioma-cod { font: 400 40px/1 var(--titular); letter-spacing: 0.04em; } .idioma-btn b { font-size: 18px; } .idioma-btn small { position: absolute; right: 12px; top: 8px; font-size: 18px; }
  @keyframes aparecer-arriba { from { opacity: 0; transform: translateY(24px) scale(0.9); } }

  .buscando { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 10px; padding: 22px 30px; border-radius: 18px; background: var(--panel-lleno); box-shadow: 0 20px 50px rgba(0,0,0,0.4); z-index: 5; text-align: center; }
  .buscando b { font: 400 26px/1 var(--titular); letter-spacing: 0.03em; }
  .giratorio { width: 42px; height: 42px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.2); border-top-color: var(--oro); animation: girar 0.9s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ── paneles ── */
  .modal { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(8, 10, 30, 0.6); }
  .panel { width: min(620px, 100%); max-height: calc(88 * var(--vh)); display: grid; grid-template-rows: auto auto 1fr; border-radius: 18px; background: var(--panel-lleno); box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden; }
  .panel.chico { width: min(340px, 100%); padding: 22px; gap: 12px; grid-template-rows: none; justify-items: stretch; text-align: center; }
  .panel h2 { margin: 0; font: 400 28px/1 var(--titular); letter-spacing: 0.03em; }
  .panel-cab { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 8px; }
  .cerrar { width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--panel-claro); font-size: 16px; }
  .pestanas { display: flex; gap: 4px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.1); overflow-x: auto; }
  .pestanas button { padding: 8px 14px; border: 0; background: transparent; color: var(--tinta-suave); border-bottom: 3px solid transparent; white-space: nowrap; } .pestanas button.activa { color: #fff; border-bottom-color: var(--oro); }
  .panel-cuerpo { padding: 12px 18px 18px; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
  .fila-op { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); flex-wrap: wrap; }
  .interruptor { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 0; border-radius: 16px; background: var(--panel-claro); font-size: 13px; }
  .interruptor i { width: 34px; height: 20px; border-radius: 10px; background: rgba(255,255,255,0.25); position: relative; transition: background 0.15s; }
  .interruptor i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
  .interruptor.si i { background: var(--vida); } .interruptor.si i::after { transform: translateX(14px); }
  .deslizador { display: inline-flex; align-items: center; gap: 8px; } .deslizador input { width: 150px; accent-color: var(--oro); } .deslizador b { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  .teclas { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 14px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.05); font-size: 13px; }
  .teclas kbd { margin-right: 6px; }
  .nota { margin: 4px 0 0; color: var(--tinta-suave); font-size: 13px; }

  /* ── HUD ── */
  .hud { position: absolute; inset: 0; pointer-events: none; }
  .vitales { position: absolute; left: 18px; bottom: calc(20px + var(--sa-bottom)); width: min(300px, calc(40 * var(--vw))); display: grid; gap: 5px; }
  .barra { position: relative; height: 22px; border-radius: 4px; background: rgba(8, 12, 36, 0.6); overflow: hidden; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18); transform: skewX(-12deg); }
