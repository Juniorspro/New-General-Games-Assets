<title>Isla Royale</title>

<style>
  /* Un solo mundo visual (una isla a pleno sol y un vestíbulo violeta): no

  :root {

  .mats { display: flex; gap: 4px; }

  .mat img { width: 30px; height: 15px; } .mat.activa { opacity: 1; box-shadow: inset 0 0 0 2px var(--oro); }
  .fps { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); font-size: 12px; color: #9f9; text-shadow: 0 1px 2px #000; }

  .mira { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }

  .mira .c, .mira .d { top: -1px; width: 9px; height: 2px; } .mira .c { left: -17px; } .mira .d { left: 8px; }

  .mira.punto .a, .mira.punto .b, .mira.punto .c, .mira.punto .d { display: none; }

  .mira.pego .x { display: block; } .mira.pego .x1 { transform: rotate(45deg); } .mira.pego .x2 { transform: rotate(-45deg); } .mira.cabeza .x { background: #ffd84a; }
  .mira-franco { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, transparent 0 min(34vh, 34vw), rgba(0,0,0,0.92) calc(min(34vh, 34vw) + 2px)); }

  .progreso-accion { position: absolute; left: 50%; top: calc(50% + 30px); transform: translateX(-50%); display: grid; justify-items: center; gap: 2px; font-size: 13px; text-shadow: 0 1px 2px #000; }

  .interaccion b { color: var(--r); }

  .caida b { font: 400 24px/1.1 var(--titular); letter-spacing: 0.03em; color: var(--oro); }

  /* ── controles táctiles ── */
