  /* Teléfono acostado: todo más chico para que el centro quede libre. */

    .disparo-der { right: 138px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 74px; height: 74px; }

<script>

// ════════════════════════════════════════════════════════════════════════

const PX = 0.2, MUNDO = 2000 * PX, BORDE = MUNDO / 2 + 10;

const LOOKS = [

  { ropa: "#7ccf3a", pantalon: "#3b3226", pelo: "#1f1b17", piel: "#c98e62", mochila: "#2f4a1f" },
  { ropa: "#2f6fe0", pantalon: "#e8e1cf", pelo: "#a13d2d", piel: "#f5d0b0", mochila: "#1b2d5e" },
  { ropa: "#20c4b4", pantalon: "#24242e", pelo: "#101014", piel: "#8d5a3b", mochila: "#e8e1cf" },
  { ropa: "#f2efe4", pantalon: "#5c3a8a", pelo: "#6b4a2a", piel: "#eab896", mochila: "#b33b3b" },
  { ropa: "#a45cff", pantalon: "#2b2b3a", pelo: "#ffd35c", piel: "#f3c9a4", mochila: "#3a3a4d" },

// ════════════════════════════════════════════════════════════════════════
// Utilidades
// ════════════════════════════════════════════════════════════════════════
function azar(semilla) { let s = semilla >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const angDif = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const dirDe = (yaw, pitch) => ({ x: -Math.sin(yaw) * Math.cos(pitch), y: Math.sin(pitch), z: -Math.cos(yaw) * Math.cos(pitch) });
const radioIsla = (a) => 168 + 13 * Math.sin(a * 3 + 1) + 9 * Math.sin(a * 5 + 2) + 5 * Math.sin(a * 9 + 0.5);
// Metros hasta la orilla (positivo adentro de la isla, negativo en el mar).
const costa = (x, z) => radioIsla(Math.atan2(z, x)) - Math.hypot(x, z);
function crearRuido(r) {
  const v = new Float32Array(65536); for (let i = 0; i < v.length; i++) v[i] = r();
  const en = (i, j) => v[((j & 255) << 8) | (i & 255)];
