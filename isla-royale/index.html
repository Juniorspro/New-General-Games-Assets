<title>Isla Royale</title>

<style>

  .palanca.izq { left: 22px; } .palanca.der { right: 22px; }

  .tarjeta { width: min(560px, 100%); display: grid; gap: 14px; justify-items: center; text-align: center; }
  .logo { margin: 0; font: 400 clamp(52px, 13vw, 104px)/0.9 var(--titular); letter-spacing: 0.02em; color: #fff; text-shadow: 0 6px 0 #1f7fd1, 0 10px 0 rgba(0,0,0,0.18); transform: rotate(-3deg); }
  .logo span { color: var(--oro); text-shadow: 0 6px 0 #c77d00, 0 10px 0 rgba(0,0,0,0.18); }
  .bajada { margin: 0; max-width: 42ch; color: var(--tinta-suave); font-size: 16px; }
  .jugar { padding: 14px 42px; border: 0; border-radius: 16px; background: linear-gradient(180deg, #ffe066, var(--oro)); color: #3a2600; font: 400 30px/1 var(--titular); letter-spacing: 0.04em; box-shadow: 0 6px 0 #c77d00, 0 12px 24px rgba(0,0,0,0.25); cursor: pointer; transition: transform 0.1s; }
  .jugar:hover { transform: translateY(-2px); } .jugar:active { transform: translateY(4px); box-shadow: 0 2px 0 #c77d00; }
  .jugar:focus-visible, .ranura:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .teclas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 14px; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--panel); font-size: 13px; text-align: left; }

  .datos { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .datos div { padding: 8px 14px; border-radius: 12px; background: var(--panel); font-size: 13px; }
  .datos b { display: block; font: 400 26px/1 var(--titular); }
  .pantalla.fin { background: rgba(26, 33, 80, 0.35); }
  @media (max-width: 560px) { .ranura { width: 76px; } .feed { display: none; } .tactil-si .armas { left: 16px; transform: none; } }
  /* Teléfono acostado: los botones van entre las dos palancas y las armas arriba. */
  @media (max-height: 520px) {

    .botones-t button { height: 40px; font-size: 11px; }
    .tactil-si .armas { top: 10px; bottom: auto; left: 50%; transform: translateX(-50%); }
    .tactil-si .ranura { width: 78px; }
    .tactil-si .recarga { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
    .palanca { width: 112px; height: 112px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }

  }

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
"use strict";
const { useState, useEffect, useRef, useCallback } = React;
const h = React.createElement;

// ════════════════════════════════════════════════════════════════════════
// Reglas
// ════════════════════════════════════════════════════════════════════════
const MUNDO = 2000, CELDA = 100, RADIO_J = 18, CANT_BOTS = 6, CANT_COFRES = 18;
const COSTO = 20, ALTO_MURO = 70, VIDA_MURO = 150, DANO_TORMENTA = 8, CICLO_TORMENTA = 45, CIERRE = 10;
const ARMAS = [
  { nombre: "Rifle", dano: 15, cadencia: 0.11, cargador: 30, recarga: 1.5, vel: 1500, disp: 0.045, perdigones: 1, alcance: 950, auto: true },
  // La escopeta: 40 de daño por tiro, repartido en 5 perdigones de 8.
  { nombre: "Escopeta", dano: 8, cadencia: 0.9, cargador: 5, recarga: 2.1, vel: 1250, disp: 0.2, perdigones: 5, alcance: 430, auto: false },
];
const NOMBRES = ["Kiwi", "Mango", "Lima", "Coco", "Uva", "Pomelo"];
const COLORES = [
  { ropa: "#ff7a3d", pelo: "#6b3b1f" }, // vos
  { ropa: "#8bdc3f", pelo: "#2e2a24" }, { ropa: "#ffb627", pelo: "#a13d2d" }, { ropa: "#3fd4c6", pelo: "#1d1d2c" },
  { ropa: "#f2f2e6", pelo: "#6b4a2a" }, { ropa: "#b46cff", pelo: "#ffd35c" }, { ropa: "#ff6fae", pelo: "#3a2616" },
];
const FASES = [720, 470, 290, 160, 70, 0];

// ════════════════════════════════════════════════════════════════════════
// Utilidades
// ════════════════════════════════════════════════════════════════════════
function azar(semilla) { let s = semilla >>> 0; return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b, c, d) => Math.hypot(c - a, d - b);
const angDif = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const radioIsla = (ang) => 880 + 60 * Math.sin(ang * 3 + 1) + 38 * Math.sin(ang * 5 + 2) + 20 * Math.sin(ang * 9);
const enIsla = (x, y, margen = 0) => { const dx = x - MUNDO / 2, dy = y - MUNDO / 2; return Math.hypot(dx, dy) < radioIsla(Math.atan2(dy, dx)) - margen; };

// ════════════════════════════════════════════════════════════════════════
// Sonido: todo sintetizado con Web Audio
// ════════════════════════════════════════════════════════════════════════
const Sonido = (() => {
  let ctx = null, maestro = null, ruido = null, tormentaG = null;
  function iniciar() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    maestro = ctx.createGain(); maestro.gain.value = 0.55;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
    maestro.connect(comp).connect(ctx.destination);
    ruido = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = ruido.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // El zumbido de la tormenta, siempre andando, con volumen según cuán adentro esté uno.
    const s = ctx.createBufferSource(); s.buffer = ruido; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 260;
    tormentaG = ctx.createGain(); tormentaG.gain.value = 0;
    s.connect(f).connect(tormentaG).connect(maestro); s.start();
  }
  const salida = (vol, pan) => {
    const g = ctx.createGain(); g.gain.value = vol;
    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = clamp(pan || 0, -1, 1); g.connect(p).connect(maestro); } else g.connect(maestro);
    return g;
  };
  function pew(vol = 1, pan = 0, grave = false) {
    if (!ctx) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "square"; o.frequency.setValueAtTime(grave ? 620 : 980, t); o.frequency.exponentialRampToValueAtTime(grave ? 180 : 260, t + 0.09);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09 * vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g).connect(salida(1, pan)); o.start(t); o.stop(t + 0.12);
  }
  function bum(vol = 1, pan = 0) {
    if (!ctx) return;
    const t = ctx.currentTime, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = ruido; f.type = "lowpass"; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(300, t + 0.25);
    g.gain.setValueAtTime(0.35 * vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    s.connect(f).connect(g).connect(salida(1, pan)); s.start(t); s.stop(t + 0.32);
    const o = ctx.createOscillator(), g2 = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.2);
    g2.gain.setValueAtTime(0.3 * vol, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.22); o.connect(g2).connect(salida(1, pan)); o.start(t); o.stop(t + 0.25);
  }
  function toc(frec = 190, vol = 1) {
    if (!ctx) return;
    for (let k = 0; k < 2; k++) {
      const t = ctx.currentTime + k * 0.07, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(frec * (k ? 0.8 : 1), t); o.frequency.exponentialRampToValueAtTime(frec * 0.5, t + 0.08);
      g.gain.setValueAtTime(0.22 * vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1); o.connect(g).connect(maestro); o.start(t); o.stop(t + 0.12);
    }
  }
  function notas(lista, tipo = "sine", vol = 0.12, largo = 0.14) {
    if (!ctx) return;
    lista.forEach((f, i) => {
      const t = ctx.currentTime + i * largo * 0.8, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = tipo; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + largo * 1.6);
      o.connect(g).connect(maestro); o.start(t); o.stop(t + largo * 1.7);
    });
  }
  return {
    iniciar, pew, bum, toc,
    golpe: () => notas([180, 120], "sawtooth", 0.1, 0.06),
    acierto: () => notas([1400], "sine", 0.06, 0.04),
    cofre: () => notas([523, 659, 784, 1047, 1319], "triangle", 0.12, 0.09),
    eliminado: () => notas([880, 660, 440], "square", 0.06, 0.08),
    recarga: () => notas([300, 420], "square", 0.05, 0.05),
    victoria: () => notas([523, 523, 659, 784, 659, 784, 1047], "triangle", 0.16, 0.16),
    derrota: () => notas([392, 330, 262, 196], "sawtooth", 0.08, 0.2),
    tormenta: (k) => { if (tormentaG) tormentaG.gain.setTargetAtTime(k * 0.35, ctx.currentTime, 0.2); },
  };
})();

// ════════════════════════════════════════════════════════════════════════
// El mundo
// ════════════════════════════════════════════════════════════════════════
function crearMundo(semilla) {
  const r = azar(semilla);
  const libre = (x, y, lista, dmin) => lista.every((o) => dist(x, y, o.x, o.y) > dmin);
  const lugar = (margen, otros, dmin, intentos = 200) => {
    for (let i = 0; i < intentos; i++) {
      const x = 100 + r() * (MUNDO - 200), y = 100 + r() * (MUNDO - 200);
      if (enIsla(x, y, margen) && otros.every(([l, d]) => libre(x, y, l, d))) return { x, y };
    }
    return null;
  };
  const arboles = [], rocas = [], cofres = [], matas = [];
  for (let i = 0; i < 18; i++) { const c = lugar(120, [[cofres, 250]]); if (c) cofres.push({ ...c, abierto: false, brillo: r() * 6 }); }
  while (cofres.length < CANT_COFRES) { const c = lugar(80, [[cofres, 120]]); if (c) cofres.push({ ...c, abierto: false, brillo: r() * 6 }); else break; }
  for (let i = 0; i < 100; i++) { const a = lugar(60, [[arboles, 70], [cofres, 70]]); if (a) arboles.push({ ...a, r: 26 + r() * 12, rosa: r() < 0.18, fase: r() * 6 }); }
  for (let i = 0; i < 55; i++) { const p = lugar(50, [[arboles, 60], [rocas, 80], [cofres, 70]]); if (p) rocas.push({ ...p, r: 20 + r() * 20, forma: Array.from({ length: 7 }, () => 0.75 + r() * 0.35) }); }
  for (let i = 0; i < 160; i++) { const m = lugar(30, []); if (m) matas.push({ ...m, t: r(), c: r() }); }
  return { arboles, rocas, cofres, matas, estructuras: [] };
}

// El suelo visto desde arriba, dibujado una vez (medio píxel por unidad).
function dibujarSuelo(mundo) {
  const c = document.createElement("canvas"), E = 0.5; c.width = c.height = MUNDO * E;
  const g = c.getContext("2d"), r = azar(99);
  g.scale(E, E);
  const contorno = (margen) => { g.beginPath(); for (let i = 0; i <= 120; i++) { const a = (i / 120) * Math.PI * 2, rr = radioIsla(a) + margen; const x = MUNDO / 2 + Math.cos(a) * rr, y = MUNDO / 2 + Math.sin(a) * rr; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); };
  // Espuma, arena y pasto.
  contorno(26); g.fillStyle = "rgba(255,255,255,0.55)"; g.fill();
  contorno(0); g.fillStyle = "#f5dc8f"; g.fill();
  contorno(-48); const gr = g.createRadialGradient(MUNDO / 2, MUNDO / 2, 100, MUNDO / 2, MUNDO / 2, 950); gr.addColorStop(0, "#6ad85a"); gr.addColorStop(1, "#4cc444"); g.fillStyle = gr; g.fill();
  g.save(); contorno(-48); g.clip();
  // Manchas de pasto más oscuro y más claro, y flores.
  for (let i = 0; i < 260; i++) { g.fillStyle = r() < 0.5 ? "rgba(40,150,40,0.16)" : "rgba(170,240,120,0.16)"; g.beginPath(); g.ellipse(r() * MUNDO, r() * MUNDO, 30 + r() * 90, 20 + r() * 60, r() * 3, 0, Math.PI * 2); g.fill(); }
