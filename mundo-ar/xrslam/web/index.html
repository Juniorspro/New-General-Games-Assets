<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07030f">
<title>Mundo AR · XRSLAM</title>
<!--
  Mundo AR con XRSLAM: SLAM visual-inercial (cámara + giróscopo +
  acelerómetro) en WebAssembly, adentro de la página. No usa WebXR ni ARCore:
  anda igual en un WebView. La escala sale en metros.

  Piezas:
   - dist/xrslam.{mjs,wasm}: XRSLAM (openxrlab/xrslam, Apache-2.0) con los
     parches de ../parches, compilado por ../construir.sh web.
   - trabajador.js: el SLAM corre en un Web Worker, el dibujo no se traba.
   - desfase.js: calibración automática del desfase cámara-IMU y de la focal.

  ?prueba=euroc&datos=<url>  reproduce una secuencia EuRoC exportada (sin
  cámara ni sensores) para probar todo en una compu.
-->
<script>
  // Script clásico (no módulo) a propósito: corre aunque el resto de la
  // página no pueda (un WebView viejo sin módulos, un archivo que no baja).
  // Muestra en pantalla cualquier error y, si en 20 s no cargó, qué le falta
  // al navegador. Así "no carga" siempre viene con un motivo.
  (function () {
    var caja = null, lineas = [];
    function mostrar(msg) {
      lineas.push(String(msg));
      if (!document.body) { document.addEventListener("DOMContentLoaded", function () { mostrar(lineas.pop()); }); return; }
      if (!caja) {
        caja = document.createElement("div"); caja.id = "falla";
        caja.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#3a0b1e;color:#fff;border:1px solid #ff6b8b;" +
          "border-radius:12px;padding:10px 12px;font:13px/1.45 system-ui,sans-serif;white-space:pre-wrap;max-height:45vh;overflow:auto";
        document.body.appendChild(caja);
      }
      caja.textContent = "⚠ " + lineas.join("\n⚠ ");
    }
    window.__falla = mostrar;
    addEventListener("error", function (e) {
      var t = e.target && e.target !== window ? (e.target.src || e.target.href || e.target.tagName) : "";
      mostrar("Error: " + (e.message || (t === "SCRIPT" ? "no bajó un script de la página (el principal o three.js): revisá la conexión" : "no se pudo cargar " + t)));
    }, true);
    addEventListener("unhandledrejection", function (e) { mostrar("Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
    var falta = [];
    if (!window.WebAssembly) falta.push("WebAssembly");
    if (!("noModule" in document.createElement("script"))) falta.push("módulos de JavaScript");
    if (!window.Worker) falta.push("Web Workers");
    if (window.isSecureContext === false) falta.push("https (contexto seguro): sin eso no hay cámara");
    else if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) falta.push("cámara (getUserMedia)");
    var m = navigator.userAgent.match(/Chrome\/(\d+)/);
    var nav = m ? "Chrome " + m[1] + (/; wv\)/.test(navigator.userAgent) ? " (WebView)" : "") : navigator.userAgent;
    window.__navegador = nav;
    if (falta.length) mostrar("Este navegador no tiene: " + falta.join(", ") + ". (" + nav + ")");
    setTimeout(function () {
      if (!window.__cargo) mostrar("No terminó de cargar en 20 s. " + (window.__etapa ? "Se quedó en: " + window.__etapa + ". " : "El script principal ni arrancó (¿navegador viejo?). ") + "(" + nav + ")");
    }, 20000);
  })();
</script>
<style>
  :root { color-scheme: dark; --fondo: #07030f; --texto: #f2eeff; --tenue: #b3a8d6; --dorado: #f2cf6b; --violeta: #8b5cff;
    --panel: rgba(10, 5, 24, 0.66); --borde: rgba(185, 150, 255, 0.4); --fuente: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font-family: var(--fuente); overflow: hidden;
    -webkit-user-select: none; user-select: none; }
  #video, #fondo, #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  #video, #fondo { background: #000; }
  #lienzo { touch-action: none; }

  #capa > * { pointer-events: auto; }

    background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 8px 12px; font-size: 13px; line-height: 1.45;
    pointer-events: none !important; font-variant-numeric: tabular-nums; max-width: 62vw; }
  .hud b { font-size: 22px; color: var(--dorado); }
  .botones { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 8px; }
  button { font: 700 14px var(--fuente); color: #fff; background: rgba(90, 47, 217, 0.82); border: 1px solid #c9b0ff; border-radius: 14px;
    min-height: 44px; padding: 8px 14px; cursor: pointer; }

  .barra { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15); margin-top: 6px; overflow: hidden; }
  .barra i { display: block; height: 100%; width: 0; background: var(--dorado); transition: width 0.2s; }
  #inicio { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at 50% 30%, #2a1060 0%, #07030f 70%); }
  .caja { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: clamp(30px, 8vw, 50px); letter-spacing: 0.06em; text-align: center; text-shadow: 0 0 18px var(--violeta); }
  .bajada { margin: 0; color: var(--tenue); text-align: center; font-size: 14px; line-height: 1.5; }

  .fila input { flex: 1; accent-color: var(--violeta); }
  #empezar { font-size: 18px; min-height: 56px; background: linear-gradient(180deg, #8a55ff, #5a2fd9); box-shadow: 0 0 18px rgba(123, 61, 255, 0.6); }
  [hidden] { display: none !important; }
  @media (max-height: 420px) { .caja { gap: 8px; } h1 { font-size: 28px; } }
</style>

<body>
<video id="video" playsinline muted hidden></video>
<canvas id="fondo" hidden></canvas>
<canvas id="lienzo"></canvas>

<div id="capa" hidden>
  <div class="hud" id="hud"><b>0</b> puntos</div>
  <div class="botones">
    <button id="b-linterna" type="button">Linterna: no</button>
    <button id="b-puntos" type="button">Mapa: no</button>
    <button id="b-recalibrar" type="button">Recalibrar</button>
    <button id="b-reiniciar" type="button">Reiniciar</button>
    <button id="b-saltear" type="button" hidden>Sin calibrar</button>
  </div>
  <div class="aviso" id="aviso">Arrancando…<div class="barra" hidden><i></i></div></div>
</div>

<main id="inicio">
  <div class="caja">
    <h1>MUNDO AR · XRSLAM</h1>
    <p class="bajada" id="detalle">SLAM visual-inercial en la página: cámara + giróscopo + acelerómetro, en metros. Anda en un WebView.</p>
    <button id="empezar" type="button" disabled>Cargando XRSLAM…</button>
    <label class="fila" for="fov">Campo de la cámara (si no calibra) <input id="fov" type="range" min="50" max="85" step="1"> <output id="fov-v"></output></label>
    <p class="bajada" id="pie">Usá el teléfono acostado. La primera vez se calibra solo: 4 segundos girándolo.</p>
  </div>
</main>

<script type="module">
// three desde este mismo repo (el de Tajo, un solo archivo): sin CDN ni import map.
import * as THREE from "../../../tajo/vendor/three.module.min.js";
window.__etapa = "el script principal arrancó";
import { Flujo, calibrarCamaraIMU } from "./desfase.js";

const $ = (s) => document.querySelector(s);
const hud = $("#hud"), aviso = $("#aviso"), barra = $("#aviso .barra"), capa = $("#capa"), inicio = $("#inicio"), video = $("#video"), fondo = $("#fondo");
const P = new URLSearchParams(location.search);
const PRUEBA = P.get("prueba") === "euroc";
const CORTO = Number(P.get("corto") || 300);   // lado corto de la imagen que ve el SLAM
const leer = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* privado */ } };
let fovLargo = leer("xrslam.fov", 66);
$("#fov").value = fovLargo; $("#fov-v").textContent = fovLargo + "°";
$("#fov").addEventListener("input", (e) => { fovLargo = Number(e.target.value); $("#fov-v").textContent = fovLargo + "°"; guardar("xrslam.fov", fovLargo); });

// ───────────────────── el mundo 3D (igual que ../web: luz horneada, gama baja) ─────────────────────
const lienzo = $("#lienzo");
const renderer = new THREE.WebGLRenderer({ canvas: lienzo, antialias: false, alpha: true, powerPreference: "high-performance" });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(50, 4 / 3, 0.02, 200);
escena.add(camara);
const DORADO = new THREE.Color("#d6a93f"), VIOLETA = new THREE.Color("#7b3dff");
function geoCubo() {
  const g = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
  const n = g.attributes.normal, c = new Float32Array(n.count * 3);
  const luz = new THREE.Vector3(0.35, 0.9, 0.25).normalize(), v = new THREE.Vector3();
  for (let i = 0; i < n.count; i++) { v.fromBufferAttribute(n, i); c[i * 3] = c[i * 3 + 1] = c[i * 3 + 2] = 0.42 + 0.58 * Math.max(0, v.dot(luz)); }
  g.setAttribute("color", new THREE.BufferAttribute(c, 3));
  return g;
}
const CUBO = geoCubo();
const mundo = new THREE.Group(); escena.add(mundo);
const blancos = [], girando = [];
let anillo = null, arena = null, puntos = 0, combo = 0, ultimoAcierto = -99, tocados = 0;
const azar = (() => { let s = 7; return () => ((s = Math.imul(s ^ (s >>> 15), 0x2c1b3c6d) + 0x6d2b79f5 | 0) >>> 0) / 4294967296; })();
function cubo(color, tam, brillo = 0) {
  const m = new THREE.Mesh(CUBO, new THREE.MeshBasicMaterial({ vertexColors: true, color: color.clone().multiplyScalar(1 + brillo), transparent: true }));
  m.scale.setScalar(tam); return m;
}
function nuevoBlanco(padre, x, y, z, tam, color, rango) {
  const m = cubo(color, tam); m.position.set(x, y, z);
  m.userData = { tam, base: m.position.clone(), fase: azar() * 6.28, giro: 1.2 + azar(), estalla: -1, aparece: 1, rango };
  padre.add(m); blancos.push(m); return m;
}
function reubicar(m) {
  const r = m.userData.rango, a = azar() * Math.PI * 2, d = (0.3 + 0.7 * azar()) * r.radio;
  m.userData.base.set(r.cx + Math.cos(a) * d, r.yMin + azar() * (r.yMax - r.yMin), r.cz + Math.sin(a) * d);
  m.userData.aparece = 0;
}
// Con XRSLAM la escala es de verdad: el anillo mide 1 m de radio y los cubos 12 cm.
function ponerAnillo(centro, radio = 1.0) {
  anillo = new THREE.Group(); anillo.position.copy(centro);
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2;
    nuevoBlanco(anillo, Math.cos(a) * radio, -0.2 + azar() * 0.4, Math.sin(a) * radio, 0.12, i % 2 ? VIOLETA : DORADO,
      { cx: 0, cz: 0, radio: radio * 1.15, yMin: -0.3, yMax: 0.3 });
  }
  mundo.add(anillo);
}
function ponerArena(pos, esc = 0.6) {
  arena = new THREE.Group(); arena.position.copy(pos); arena.scale.setScalar(esc);
  const piso = cubo(new THREE.Color("#1f1238"), 1); piso.scale.set(1.1, 0.03, 1.1); piso.position.y = 0.015; arena.add(piso);
  for (let i = 0; i < 4; i++) {
    const px = i % 2 ? 0.5 : -0.5, pz = i < 2 ? -0.5 : 0.5;
    const p = cubo(DORADO, 1); p.scale.set(0.06, 0.52, 0.06); p.position.set(px, 0.28, pz); arena.add(p);
    const l = cubo(new THREE.Color("#5ce1ff"), 0.09, 0.3); l.position.set(px, 0.58, pz); l.userData.giro = 1.5; girando.push(l); arena.add(l);
  }
  for (let i = 0; i < 3; i++) { const t = cubo(VIOLETA, 0.14 - i * 0.03, i * 0.12); t.position.y = 0.12 + i * 0.17; t.userData.giro = i % 2 ? -1.3 : 0.9; girando.push(t); arena.add(t); }
  for (let i = 0; i < 5; i++) { const m = nuevoBlanco(arena, 0, 0.3, 0, 0.12, i % 2 ? VIOLETA : DORADO, { cx: 0, cz: 0, radio: 0.4, yMin: 0.18, yMax: 0.6 }); reubicar(m); m.userData.aparece = 1; }
  mundo.add(arena);
}
function ponerBlancoSuelto(pos) {
  if (blancos.length >= 28) return;
  const g = new THREE.Group(); g.position.copy(pos); mundo.add(g);
  nuevoBlanco(g, 0, 0.12, 0, 0.1, azar() < 0.5 ? DORADO : VIOLETA, { cx: 0, cz: 0, radio: 0.15, yMin: 0.08, yMax: 0.25 });
}
function reiniciarMundo() { mundo.clear(); blancos.length = 0; girando.length = 0; anillo = arena = null; puntos = combo = tocados = 0; mundo.add(nube); }
function animar(t, dt) {
  for (const m of blancos) {
    const u = m.userData;
    m.rotation.set(0.6, t * u.giro + u.fase, 0.6);
    m.position.copy(u.base); m.position.y += 0.02 * Math.sin(t * 2.2 + u.fase);
    let s = u.tam;
    if (u.estalla >= 0) {
      u.estalla += dt; s *= 1 + u.estalla * 3.2; m.material.opacity = Math.max(0, 1 - u.estalla / 0.28);
      if (u.estalla > 0.28) { u.estalla = -1; m.material.opacity = 1; reubicar(m); }
    } else if (u.aparece < 1) { u.aparece = Math.min(1, u.aparece + dt * 3.5); const k = u.aparece - 1; s *= 1 + 2.7 * k * k * k + 1.7 * k * k; }
    m.scale.setScalar(Math.max(0.0001, s));
  }
  for (const m of girando) m.rotation.y = t * m.userData.giro;
}
const rayo = new THREE.Raycaster();
let ctxAudio = null;
function pitido() {
  try {
    ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
    const o = ctxAudio.createOscillator(), g = ctxAudio.createGain(), t = ctxAudio.currentTime;
    o.frequency.setValueAtTime(880 + combo * 110, t); o.frequency.exponentialRampToValueAtTime(1760, t + 0.07);
    g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(ctxAudio.destination); o.start(t); o.stop(t + 0.13);
  } catch (e) { /* sin audio */ }
}
function tocarBlancos(t) {
  let mejor = null, dMejor = Infinity;
  const c = new THREE.Vector3(), s = new THREE.Vector3(), esf = new THREE.Sphere();
  for (const m of blancos) {
    if (m.userData.estalla >= 0) continue;
    m.getWorldPosition(c); m.getWorldScale(s); esf.set(c, s.x * 0.9 + 0.03);
    const p = rayo.ray.intersectSphere(esf, new THREE.Vector3());
    if (p) { const d = p.distanceTo(rayo.ray.origin); if (d < dMejor) { dMejor = d; mejor = m; } }
  }
  if (!mejor) return false;
  mejor.userData.estalla = 0;
  combo = t - ultimoAcierto < 1.6 ? Math.min(5, combo + 1) : 1;
  ultimoAcierto = t; puntos += 10 * combo; tocados++;
  pitido(); if (navigator.vibrate) try { navigator.vibrate(18); } catch (e) { /* no */ }
  return true;
}
// Los puntos del mapa de XRSLAM, para ver qué está siguiendo.
const nube = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0x5ce1ff, size: 3, sizeAttenuation: false }));
nube.visible = false; mundo.add(nube);

// ───────────────────── ejes: XRSLAM → three.js ─────────────────────
// XRSLAM: mundo con z arriba (la gravedad va por −z); cámara con x derecha,
// y abajo, z adelante. three: y arriba; cámara con y arriba y mirando por −z.
const Q_MUNDO = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);   // (x, y, z) → (x, z, −y)
const Q_GIRO_CAM = new THREE.Quaternion(1, 0, 0, 0);                        // 180° en x
const aThree = (p) => new THREE.Vector3(p[0], p[2], -p[1]);
const qAThree = (q) => Q_MUNDO.clone().multiply(new THREE.Quaternion(q[0], q[1], q[2], q[3])).multiply(Q_GIRO_CAM);

// La cámara trasera en el cuerpo (el marco de los sensores), según cómo está
// girada la pantalla. Con 90° (arriba a la izquierda) es la q_bc de la
// configuración de iPhone de XRSLAM.
function qCamaraCuerpo(angulo) {
  const r = Math.SQRT1_2;
  switch (((angulo % 360) + 360) % 360) {
    case 90: return [-r, r, 0, 0];
    case 270: return [r, r, 0, 0];
    case 180: return [0, 1, 0, 0];
    default: return [1, 0, 0, 0];
  }
}

// ───────────────────── estado ─────────────────────
let fase = "inicio";   // inicio | calibrando | slam
let calib = null;      // { desfase, focal, ancho, alto, qbc }
let ancho = 0, alto = 0, qbc = [1, 0, 0, 0], anguloPantalla = 0, qSupuesto = null;
const trabajador = new Worker(new URL("./trabajador.js", import.meta.url), { type: "module" });
let libre = true, cuadrosSlam = 0, fpsSlam = 0, tFps = performance.now(), msSlam = 0, estadoSlam = 0;
let pose = null;        // { t, p: Vector3(three), q: Quaternion(three), qxr: [..] }
const giros = [];       // [t, x, y, z] recientes: predicción y calibración
let lote = { giro: [], acel: [] };
let fuenteIMU = "—", hzIMU = 0, cuentaIMU = 0, tHz = performance.now();
let pisoY = null;       // altura del piso (three), de los puntos del mapa
let t0Datos = null, tArranque = 0;

function avisar(s, progreso) {
  aviso.firstChild.textContent = s; aviso.hidden = !s;
  barra.hidden = progreso === undefined;
  if (progreso !== undefined) barra.firstChild.style.width = Math.round(progreso * 100) + "%";
}

// ───────────────────── relojes ─────────────────────
// Todo tiene que estar en el reloj de performance.now(). Si una fuente trae
// horas de otro reloj (algunos navegadores dan captureTime o la hora de los
// sensores desde el arranque del teléfono, o en ms de época), las series de
// la cámara y de la IMU nunca se cruzan y la calibración no puede andar. Se
// detecta (más de 1 s de diferencia con "ahora") y se corre a este reloj,
// quedándose con la menor demora vista.
const relojes = {};
function aReloj(nombre, crudoMs) {
  const ahora = performance.now();
  let r = relojes[nombre];
  if (!r) r = relojes[nombre] = { corr: Math.abs(crudoMs - ahora) < 1000 ? 0 : ahora - crudoMs, raro: Math.abs(crudoMs - ahora) >= 1000 };
  if (r.raro && crudoMs + r.corr > ahora) r.corr = ahora - crudoMs;   // nunca en el futuro
  return (crudoMs + r.corr) / 1000;
}

// ───────────────────── sensores ─────────────────────
// Todas las horas en segundos del reloj de performance.now() (el mismo que
// usan los eventos, los sensores y requestVideoFrameCallback).
function llegaGiro(t, x, y, z) {
  lote.giro.push(t, x, y, z); giros.push([t, x, y, z]);
  // Los últimos 15 s (por tiempo: a 200 Hz o a 60 Hz es lo mismo).
  if (giros.length > 64 && t - giros[0][0] > 15) { let k = 0; while (t - giros[k][0] > 12) k++; giros.splice(0, k); }
  cuentaIMU++;
}
function llegaAcel(t, x, y, z) { lote.acel.push(t, x, y, z); }
function mandarIMU() {
  if (fase !== "slam") { lote.giro.length = 0; lote.acel.length = 0; return; }
  if (lote.giro.length) trabajador.postMessage({ tipo: "giro", d: Float64Array.from(lote.giro) });
  if (lote.acel.length) trabajador.postMessage({ tipo: "acel", d: Float64Array.from(lote.acel) });
  lote.giro.length = 0; lote.acel.length = 0;
}
setInterval(mandarIMU, 20);

const esIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
async function abrirSensores() {
  // 1) Generic Sensor API: cada lectura trae la hora en que se MIDIÓ.
  if ("Gyroscope" in window && "Accelerometer" in window) {
    try {
      const g = new Gyroscope({ frequency: 100, referenceFrame: "device" });
      const a = new Accelerometer({ frequency: 100, referenceFrame: "device" });   // con gravedad
      await new Promise((ok, mal) => {
        let listos = 0;
        const uno = () => { if (++listos === 2) ok(); };
        g.addEventListener("activate", uno, { once: true }); a.addEventListener("activate", uno, { once: true });
        g.addEventListener("error", (e) => mal(e.error), { once: true }); a.addEventListener("error", (e) => mal(e.error), { once: true });
        setTimeout(() => mal(new Error("los sensores no arrancan")), 2500);
        g.start(); a.start();
      });

});

// ───────────────────── prueba: reproducir EuRoC ─────────────────────
// Lo mismo que con la cámara, pero los cuadros y la IMU salen de una
// secuencia EuRoC exportada (../corredor/exportar), a velocidad real.
async function arrancarPrueba() {
  const base = P.get("datos") || "./euroc";
  const imu = new Float64Array(await (await fetch(base + "/imu.bin")).arrayBuffer());
  const cab = new DataView(await (await fetch(base + "/cuadros.bin", { headers: { Range: "bytes=0-15" } })).arrayBuffer());
  const n = cab.getInt32(4, true), w = cab.getInt32(8, true), h = cab.getInt32(12, true), tam = 8 + w * h;
  const escala = CORTO / Math.min(w, h);
  ancho = Math.round(w * escala); alto = Math.round(h * escala);
  // Calibración de EuRoC (cam0), llevada al tamaño achicado.
  qbc = [-7.7071797555374275e-03, 1.0499323370587278e-02, 7.0175280029197162e-01, 7.1230146066895372e-01];
  calib = P.get("calibrar") ? null : { desfase: 0, focal: 458.654 * ancho / w, ancho, alto, calidad: 1, qbc };
  // Para probar la calibración a ciegas: un montaje supuesto equivocado
  // (?montaje=mal) y la cámara en otro reloj (?reloj=segundos).
  qSupuesto = qbc;
  if (P.get("montaje") === "mal") qbc = qSupuesto = [1, 0, 0, 0];
  const corrReloj = Number(P.get("reloj") || 0);
  fuenteIMU = "EuRoC 200 Hz";
  fondo.hidden = false; fondo.width = ancho; fondo.height = alto;
  const ctxF = fondo.getContext("2d"), img = ctxF.createImageData(ancho, alto);
  const chica = new Uint8Array(ancho * alto);
  const achicar = (src) => {
    const fx = w / ancho, fy = h / alto;
    for (let y = 0; y < alto; y++) {
      const y0 = Math.floor(y * fy), y1 = Math.max(y0 + 1, Math.floor((y + 1) * fy));
      for (let x = 0; x < ancho; x++) {
        const x0 = Math.floor(x * fx), x1 = Math.max(x0 + 1, Math.floor((x + 1) * fx));
        let s = 0; for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) s += src[yy * w + xx];
        chica[y * ancho + x] = s / ((y1 - y0) * (x1 - x0));
      }
    }
    return chica;
  };
  if (calib) arrancarSlam(); else empezarCalibracion();
  const t0 = imu[0], w0 = performance.now() / 1000;
  t0Datos = t0;
  let k = 0, i = 0, siguiente = null, pidiendo = false;
  window.__XR.poses = [];
  const ritmo = Number(P.get("ritmo") || 1);
  const leerCuadro = async (j) => {
    const r = await fetch(base + "/cuadros.bin", { headers: { Range: `bytes=${16 + j * tam}-${16 + (j + 1) * tam - 1}` } });
    const b = new Uint8Array(await r.arrayBuffer());
    return { t: new DataView(b.buffer).getFloat64(0, true), px: b.subarray(8) };
  };
  setInterval(async () => {
    const tAhora = t0 + (performance.now() / 1000 - w0) * ritmo;
    while (k < imu.length / 7 && imu[k * 7] <= tAhora) {
      const o = k * 7;
      const ti = corrReloj ? aReloj("imu", imu[o] * 1000) : imu[o];
      llegaGiro(ti, imu[o + 1], imu[o + 2], imu[o + 3]); llegaAcel(ti, imu[o + 4], imu[o + 5], imu[o + 6]); k++;
    }
    if (!siguiente) {
      if (pidiendo || i >= n) return;
      pidiendo = true; siguiente = await leerCuadro(i++); pidiendo = false;
    }
    if (siguiente.t > tAhora) return;
    // Le toca: se muestra; el SLAM lo toma si está libre (si no, se pierde, como con una cámara).
    const g = achicar(siguiente.px);
    for (let j = 0; j < g.length; j++) { img.data[j * 4] = img.data[j * 4 + 1] = img.data[j * 4 + 2] = g[j]; img.data[j * 4 + 3] = 255; }
    ctxF.putImageData(img, 0, 0);
    const quiere = fase === "calibrando" || (fase === "slam" && libre);
    cuentaCuadros++;
    // Con ?reloj la cámara trae horas de otro reloj (corridas N s) y las dos
    // fuentes pasan por aReloj, como en un teléfono con relojes distintos.
    if (quiere) llegaCuadro(corrReloj ? aReloj("camara", (siguiente.t + corrReloj) * 1000) : siguiente.t, g.slice());
    siguiente = null;
  }, 5);
  window.__XR.fin = () => i >= n && !siguiente;
}

// Para las pruebas automáticas.
window.__XR = { estado: () => ({ fase, estadoSlam, fpsSlam, msSlam, fpsDib, ancho, alto, calib, pisoY, puntos, tocados, blancos: blancos.length,
  anillo: !!anillo, arena: !!arena, pos: pose ? pose.p.toArray() : null, t: pose ? pose.t : null, hzIMU, fuenteIMU }), camara, THREE };
trabajador.addEventListener("message", (e) => { if (e.data.tipo === "pose" && e.data.camara && window.__XR.poses) window.__XR.poses.push([e.data.t, ...e.data.camara]); });
</script>
