/* ==== motor2d/fuente.js ==== */
/* ============================================================================
   motor2d/fuente.js — la fuente de píxeles 5x7 de EL TIPO, con tildes, Ñ, Ü,
   ¡¿ y las letras del portugués, más los signos que piden los diálogos. Las minúsculas se dibujan como
   mayúsculas: en un juego alcanza y se lee mejor a este tamaño.
   ========================================================================== */

const FUENTE_PX = {
  A: [".###.", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"], B: ["####.", "#...#", "#...#", "####.", "#...#", "#...#", "####."],
  C: [".###.", "#...#", "#....", "#....", "#....", "#...#", ".###."], D: ["####.", "#...#", "#...#", "#...#", "#...#", "#...#", "####."],
  E: ["#####", "#....", "#....", "####.", "#....", "#....", "#####"], F: ["#####", "#....", "#....", "####.", "#....", "#....", "#...."],
  G: [".###.", "#...#", "#....", "#.###", "#...#", "#...#", ".####"], H: ["#...#", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"],
  I: [".###.", "..#..", "..#..", "..#..", "..#..", "..#..", ".###."], J: ["..###", "...#.", "...#.", "...#.", "#..#.", "#..#.", ".##.."],
  K: ["#...#", "#..#.", "#.#..", "##...", "#.#..", "#..#.", "#...#"], L: ["#....", "#....", "#....", "#....", "#....", "#....", "#####"],
  M: ["#...#", "##.##", "#.#.#", "#.#.#", "#...#", "#...#", "#...#"], N: ["#...#", "#...#", "##..#", "#.#.#", "#..##", "#...#", "#...#"],

  S: [".####", "#....", "#....", ".###.", "....#", "....#", "####."], T: ["#####", "..#..", "..#..", "..#..", "..#..", "..#..", "..#.."],
  U: ["#...#", "#...#", "#...#", "#...#", "#...#", "#...#", ".###."], V: ["#...#", "#...#", "#...#", "#...#", "#...#", ".#.#.", "..#.."],

  ' ': ["...", "...", "...", "...", "...", "...", "..."], '!': ["#", "#", "#", "#", "#", ".", "#"], '¡': ["#", ".", "#", "#", "#", "#", "#"],
  '?': [".###.", "#...#", "....#", "...#.", "..#..", ".....", "..#.."], '¿': ["..#..", ".....", "..#..", ".#...", "#....", "#...#", ".###."],
  '.': [".", ".", ".", ".", ".", ".", "#"], ',': ["..", "..", "..", "..", "..", ".#", "#."], ':': [".", "#", ".", ".", ".", "#", "."],
  ';': ["..", ".#", "..", "..", "..", ".#", "#."], '-': ["....", "....", "....", "####", "....", "....", "...."],
  "'": ["#", "#", ".", ".", ".", ".", "."], '"': ["#.#", "#.#", "...", "...", "...", "...", "..."],
  '/': ["....#", "...#.", "...#.", "..#..", ".#...", ".#...", "#...."], '+': [".....", "..#..", "..#..", "#####", "..#..", "..#..", "....."],
  '×': [".....", "#...#", ".#.#.", "..#..", ".#.#.", "#...#", "....."], '·': [".", ".", ".", "#", ".", ".", "."],
  '%': ["##..#", "##.#.", "...#.", "..#..", ".#...", ".#.##", "#..##"], '>': ["#....", ".#...", "..#..", "...#.", "..#..", ".#...", "#...."],
  '<': ["....#", "...#.", "..#..", ".#...", "..#..", "...#.", "....#"], '=': ["....", "....", "####", "....", "####", "....", "...."],
  '(': ["..#", ".#.", "#..", "#..", "#..", ".#.", "..#"], ')': ["#..", ".#.", "..#", "..#", "..#", ".#.", "#.."],
  '…': [".....", ".....", ".....", ".....", ".....", ".....", "#.#.#"], '*': [".....", "#.#.#", ".###.", "#####", ".###.", "#.#.#", "....."],

};
/* las letras con marca: la base más la marca. Con las del portugués (Â Ã À Ç Ê Ô Õ)
   alcanza para los tres idiomas de los juegos */
const ACENTOS_PX = {
  'Á': ['A', 'a'], 'É': ['E', 'a'], 'Í': ['I', 'a'], 'Ó': ['O', 'a'], 'Ú': ['U', 'a'], 'Ñ': ['N', 't'], 'Ü': ['U', 'd'],
  'Â': ['A', 'c'], 'Ã': ['A', 't'], 'À': ['A', 'g'], 'Ê': ['E', 'c'], 'Ô': ['O', 'c'], 'Õ': ['O', 't'], 'Ç': ['C', 'z'],
};
const MARCAS_PX = {
  a: [[3, -3], [2, -2]], t: [[0, -2], [1, -3], [2, -3], [3, -2], [4, -3]], d: [[1, -2], [3, -2]],
  c: [[1, -2], [2, -3], [3, -2]], g: [[1, -3], [2, -2]], z: [[2, 7], [3, 8], [2, 8]],
};

function glifoPx(ch) {
  const c = ch.toUpperCase();
  if (FUENTE_PX[c]) return { f: FUENTE_PX[c], m: null };
  const a = ACENTOS_PX[c];
  if (a) return { f: FUENTE_PX[a[0]], m: MARCAS_PX[a[1]] };
  return { f: FUENTE_PX['?'], m: null };
}
/* puntos encendidos de un texto: [x, y, fila], con y = 0 en la línea de las mayúsculas */
function puntosTexto(str) {
  const pts = [];
  let x = 0;
  for (const ch of str) {
    const g = glifoPx(ch), w = g.f[0].length;
    for (let r = 0; r < 7; r++) for (let k = 0; k < w; k++) if (g.f[r][k] === '#') pts.push([x + k, r, r]);
    if (g.m) for (const [mx, my] of g.m) pts.push([x + mx, my, my > 6 ? 6 : 0]);
    x += w + 1;
  }
  return { pts, w: Math.max(1, x - 1) };
}
function anchoTexto(str) {
  let x = 0;
  for (const ch of str) x += glifoPx(ch).f[0].length + 1;
  return Math.max(0, x - 1);
}

const GRAD = {

/* texto a un lienzo de 1 px por píxel de fuente: sombra, contorno y degradé
   por fila. Arriba deja 3 filas de aire para las tildes */
const cacheTxt = new Map();
function lienzoTexto(str, o) {
  o = o || {};
  const clave = str + '|' + (o.grad ? o.grad[0] + o.grad[6] : o.col) + '|' + (o.borde || '') + '|' + (o.sinSombra ? 1 : 0);
  let c = cacheTxt.get(clave);
  if (c) return c;
  const { pts, w } = puntosTexto(str);
  const arriba = 3;
  c = document.createElement('canvas');
  c.width = w + 3; c.height = arriba + 7 + 3;
  const g = c.getContext('2d'), ox = 1, oy = arriba + 1, borde = o.borde || '#141018';
  if (!o.sinSombra) {
    g.fillStyle = 'rgba(10,6,16,0.75)';
    for (const [x, y] of pts) g.fillRect(ox + x - 1, oy + y, 3, 3);
  }
  if (o.borde !== 'no') {
    g.fillStyle = borde;
    for (const [x, y] of pts) g.fillRect(ox + x - 1, oy + y - 1, 3, 3);
  }
  for (const [x, y, r] of pts) { g.fillStyle = o.grad ? o.grad[r] : (o.col || '#fff'); g.fillRect(ox + x, oy + y, 1, 1); }
  if (cacheTxt.size > 500) cacheTxt.clear();
  cacheTxt.set(clave, c);
  return c;
}

/* dibuja texto en el lienzo del mundo. y = la línea de arriba de las mayúsculas.
   o.alin: 'izq' | 'centro' | 'der'; o.escala: entero, para títulos */
function textoPx(g, str, x, y, o) {
  o = o || {};
  const c = lienzoTexto(str, o), e = o.escala || 1;
  let dx = x - e;
  if (o.alin === 'centro') dx = x - Math.floor((c.width - 3) * e / 2) - e;
  else if (o.alin === 'der') dx = x - (c.width - 3) * e - e;
  g.drawImage(c, Math.round(dx), Math.round(y - 4 * e), c.width * e, c.height * e);
}
/* letra por letra: para escribir de a poco y para las palabras que tiemblan */
function textoLetras(g, str, x, y, o, cuantas, desplazar) {
  o = o || {};
  let cx = x, i = 0;
  for (const ch of str) {
    if (cuantas != null && i >= cuantas) break;
    const w = glifoPx(ch).f[0].length;
    if (ch !== ' ') {
      const c = lienzoTexto(ch, o), d = desplazar ? desplazar(i) : null;
      g.drawImage(c, Math.round(cx - 1 + (d ? d[0] : 0)), Math.round(y - 4 + (d ? d[1] : 0)));
    }
    cx += w + 1; i++;
  }
}
/* partir un texto en renglones que entren en "ancho" píxeles */
function envolver(str, ancho) {
  const renglones = [];
  for (const parrafo of str.split('\n')) {
    let linea = '';
    for (const pal of parrafo.split(' ')) {
      const prueba = linea ? linea + ' ' + pal : pal;
      if (anchoTexto(prueba) > ancho && linea) { renglones.push(linea); linea = pal; }
      else linea = prueba;
    }
    renglones.push(linea);
  }
  return renglones;
}

/* pone un texto del DOM en pixel art sin perder el texto original */
function pixelar(el, S, o) {
  if (!el) return;
  const txt = el.textContent.trim() !== '' ? el.textContent.trim() : (el.dataset.px || '');
  if (!txt) return;
  const clave = txt + '|' + S + '|' + (o && o.grad ? o.grad[0] : '');
  if (el.dataset.pxk === clave && el.querySelector('canvas.px')) return;
  el.dataset.px = txt; el.dataset.pxk = clave; el.textContent = '';
  const src = lienzoTexto(txt, o), c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  c.className = 'px';
  c.style.width = (c.width * S) + 'px'; c.style.height = (c.height * S) + 'px';
  c.setAttribute('aria-label', txt);
  el.appendChild(c);
}

const ICONOS_PX = {

  mano: [".#.#.#.", ".#.#.#.", ".#####.", "#######", "#######", ".#####.", "..###.."],

  luz: ["...#...", ".#.#.#.", "..###..", "###.###", "..###..", ".#.#.#.", "...#..."],
};
function iconoPx(nombre, col, S) {
  const f = ICONOS_PX[nombre], c = document.createElement('canvas');
  c.width = 10; c.height = 10;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(10,6,16,0.75)';
  for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) if (f[y][x] === '#') g.fillRect(x + 1, y + 2, 3, 3);
  g.fillStyle = '#141018';
  for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) if (f[y][x] === '#') g.fillRect(x, y, 3, 3);
  for (let y = 0; y < 7; y++) for (let x = 0; x < 7; x++) if (f[y][x] === '#') { g.fillStyle = y < 2 ? '#ffffff' : col; g.fillRect(x + 1, y + 1, 1, 1); }
  if (S) { c.className = 'px'; c.style.width = (10 * S) + 'px'; c.style.height = (10 * S) + 'px'; }
  return c;
}

/* ==== motor2d/intro-jxs.js ==== */
/* ============================================================================
   motor2d/intro-jxs.js — LA intro de JXSTUDIOS para todos los juegos ("así las
   quiero a las intro", 07/10, mostrando la de La Cripta). Sacada tal cual de
   cripta/cripta.html (M_logojxs + M_intro + sonido › jingleJXS), sin depender
   de nada de ese juego salvo la fuente de píxeles (motor2d/fuente.js).

   En pixel art y rápida (2,1 s): una raya de luz abre la fibra de carbono, el
   monograma JXS se escribe en metal con chispas en las puntas, golpe (destello,
   sacudida, chispazo), una franja de brillo lo cruza, "JXSTUDIOS" se tipea y
   abajo "presenta". Después, el iris (círculo que se cierra y se abre).

   Uso:
     const intro = crearIntroJXS({ W, H, presenta: 'PRESENTA', vibrar });
     cada cuadro: intro.pasar(dt); intro.dibujar(g);   // g en píxeles del juego
     un toque: intro.saltar();  ¿terminó?: intro.listo
     con el audio andando (después de un toque no se puede antes): jingleJXS(ctx, destino)
     transiciones: irisJXS(g, W, H, cx, cy, r)

   Cada juego la viste a su estilo ("con su intro respectiva a su estilo", 07/10) con `estilo`:
   la misma coreografía, otro material. Todo es opcional (sin estilo = La Cripta):
     metal: [8 colores de arriba a abajo], filo, bisel, borde: '#rrggbb'
     sombra: { dx, dy, col }                  el monograma proyecta una sombra plana (filete)
     fondo(W, H, cx, cy) → lienzo             el fondo (por defecto la fibra de carbono)
     puntas: [colores], golpe: [colores], destello: 'rgba(...)'
     palabra: { col, borde }, presenta: color, negro: color del fondo
     antes(g, t, I) / despues(g, t, I)        dibujar algo más (I.cx, I.cy, I.ancho, I.yPalabra)
     jingle(ctx, bus, t0, tg, h)              otra música; h = { tono, soplo, f, T }
   Para juegos que no son de píxeles (lienzo liso, con escala propia):
     anchoLogo(W, H) → ancho del monograma; logo(g, i) lo dibuja a mano (i = { avance, t, x0, y0, esc,
     ancho, golpe, tGolpe, TRAZOS, camino2d, largo, muestrear }); letras(g, parte, I, t, y) y presentaTxt(g, txt, I, t, y)
     escriben con otra letra; chispa: px de las chispas (por defecto 1)
   ========================================================================== */

const IntroJXS_ = (() => {
  const CAJA = { w: 350, h: 172 };
  const GROSOR = 14.5;
  // el monograma: cuatro trazos de metal (A va abajo en el cruce: se dibuja primero)
  const TRAZOS = [
    { id: 'A', capa: 0, d: [['M', 40, 19], ['L', 114, 19], ['L', 176, 101], ['C', 194, 128, 222, 168, 268, 169], ['C', 310, 170, 342, 152, 342, 122]] },
    { id: 'J', capa: 0, d: [['M', 40, 43], ['L', 98, 43], ['L', 98, 116], ['C', 98, 148, 44, 158, 36, 124]] },
    { id: 'S', capa: 0, d: [['M', 312, 66], ['C', 306, 46, 288, 36, 266, 36], ['C', 242, 36, 226, 48, 226, 63], ['C', 226, 80, 248, 86, 272, 92], ['C', 302, 99, 320, 108, 320, 126], ['C', 320, 142, 300, 148, 272, 148], ['C', 246, 148, 226, 138, 216, 118]] },
    { id: 'B', capa: 1, d: [['M', 10, 130], ['C', 18, 158, 50, 168, 86, 166], ['C', 108, 165, 122, 158, 134, 142], ['L', 200, 46], ['C', 216, 24, 244, 12, 272, 12], ['C', 310, 12, 340, 30, 340, 62]] },
  ];
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const salida = (t) => 1 - Math.pow(1 - t, 3);
  const salidaAtras = (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);

  function camino2d(t, esc, ox, oy) {
    const p = new Path2D();
    for (const [op, ...n] of t.d) {
      const q = n.map((v, i) => (i % 2 ? oy + v * esc : ox + v * esc));
      if (op === 'M') p.moveTo(q[0], q[1]);
      else if (op === 'L') p.lineTo(q[0], q[1]);
      else p.bezierCurveTo(q[0], q[1], q[2], q[3], q[4], q[5]);
    }
    return p;
  }
  function muestrear(t, cada) {
    const pts = [];
    let x = 0, y = 0;
    for (const [op, ...n] of t.d) {
      if (op === 'M') { x = n[0]; y = n[1]; pts.push([x, y]); continue; }
      if (op === 'L') {
        const [x1, y1] = n, largo = Math.hypot(x1 - x, y1 - y), k = Math.max(1, Math.ceil(largo / cada));
        for (let i = 1; i <= k; i++) pts.push([x + ((x1 - x) * i) / k, y + ((y1 - y) * i) / k]);
        x = x1; y = y1; continue;
      }
      const [c1x, c1y, c2x, c2y, x1, y1] = n;
      const aprox = Math.hypot(c1x - x, c1y - y) + Math.hypot(c2x - c1x, c2y - c1y) + Math.hypot(x1 - c2x, y1 - c2y);
      const k = Math.max(2, Math.ceil(aprox / cada));
      for (let i = 1; i <= k; i++) {
        const s = i / k, r = 1 - s;
        pts.push([r * r * r * x + 3 * r * r * s * c1x + 3 * r * s * s * c2x + s * s * s * x1, r * r * r * y + 3 * r * r * s * c1y + 3 * r * s * s * c2y + s * s * s * y1]);
      }
      x = x1; y = y1;
    }
    return pts;
  }
  const largos = new Map();
  function largo(t) {
    if (largos.has(t.id)) return largos.get(t.id);
    const p = muestrear(t, 2);
    let l = 0;
    for (let i = 1; i < p.length; i++) l += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    largos.set(t.id, l);

   DORADO — lo de base. Lienzo liso a la resolución real, unidades lógicas de
   360 de ancho. La mesa mide 360 × 600 y va abajo; lo que sobra arriba es la

  let a = s >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================================
   El dibujo de la mesa en Art Déco: laca negra y verde esmeralda, rieles de oro
   con su filo de luz, el abanico (sunburst) detrás de los flippers, el
   zigurat escalonado arriba y las lámparas de vidrio que se prenden con brillo.
   Lo quieto se pinta una vez (pintarMesa) y lo que se mueve, cada cuadro.
   ========================================================================== */

function rieles(f, pts, ancho) {
  f.lineCap = 'round'; f.lineJoin = 'round';
  const trazar = () => { f.beginPath(); f.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) f.lineTo(p[0], p[1]); f.stroke(); };
  f.strokeStyle = '#120c03'; f.lineWidth = ancho + 3.5; trazar();
  f.strokeStyle = ORO_OSCURO; f.lineWidth = ancho + 1; trazar();
  f.strokeStyle = ORO; f.lineWidth = ancho - 0.6; trazar();
  f.save(); f.translate(-0.6, -0.7); f.strokeStyle = 'rgba(255,241,194,0.85)'; f.lineWidth = Math.max(0.8, ancho * 0.28); trazar(); f.restore();
}
function abanico(f, cx, cy, r0, r1, a0, a1, n, alfa) {
  for (let i = 0; i <= n; i++) {
    const a = lerp(a0, a1, i / n);
    f.strokeStyle = 'rgba(232,184,80,' + (i % 2 ? alfa * 0.5 : alfa) + ')'; f.lineWidth = i % 2 ? 0.6 : 1.1;
    f.beginPath(); f.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); f.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); f.stroke();
  }
}
function escalonado(f, cx, y, ancho, pasos, alto, alfa) {
  f.strokeStyle = 'rgba(232,184,80,' + alfa + ')'; f.lineWidth = 1.2;
  for (let k = 0; k < 3; k++) {
    const w = ancho - k * 18, x0 = cx - w / 2;
    f.beginPath(); f.moveTo(x0, y + k * 5);
    for (let i = 0; i < pasos; i++) { const sx = x0 + (w / 2) * (i / pasos), sy = y + k * 5 - alto * ((i + 1) / pasos); f.lineTo(sx, sy + alto / pasos); f.lineTo(sx, sy); }
    for (let i = pasos - 1; i >= 0; i--) { const sx = cx + w / 2 - (w / 2) * (i / pasos), sy = y + k * 5 - alto * ((i + 1) / pasos); f.lineTo(sx - (w / 2) / pasos, sy); f.lineTo(sx - (w / 2) / pasos, sy + alto / pasos); }
    f.lineTo(cx + w / 2, y + k * 5); f.stroke();
  }
}
function copaDibujo(f, x, y, s, col) {
  f.strokeStyle = col; f.lineWidth = 1.4; f.lineCap = 'round';
  f.beginPath(); f.moveTo(x - s, y - s * 0.55); f.quadraticCurveTo(x, y + s * 0.5, x + s, y - s * 0.55); f.closePath(); f.stroke();
  f.beginPath(); f.moveTo(x, y + s * 0.05); f.lineTo(x, y + s * 0.85); f.moveTo(x - s * 0.5, y + s * 0.9); f.lineTo(x + s * 0.5, y + s * 0.9); f.stroke();
}

function pintarMesa() {
  const [c, f] = lienzoHD(W, MESA_H);
  // la laca: verde casi negro, más claro al centro
  const fondo = f.createRadialGradient(167, 330, 30, 167, 330, 420);
  fondo.addColorStop(0, '#16302a'); fondo.addColorStop(0.55, '#0b1714'); fondo.addColorStop(1, '#040605');
  f.fillStyle = fondo; f.fillRect(0, 0, W, MESA_H);
  // el gran abanico desde abajo, las líneas finas en cruz y el zigurat arriba
  abanico(f, 167, 600, 40, 560, Math.PI * 1.04, Math.PI * 1.96, 46, 0.07);
  for (const r of [70, 96, 122]) { f.strokeStyle = 'rgba(232,184,80,0.22)'; f.lineWidth = r === 96 ? 2 : 1; f.beginPath(); f.arc(167, 600, r, Math.PI * 1.08, Math.PI * 1.92); f.stroke(); }
  escalonado(f, 190, 160, 190, 4, 24, 0.2);
  // chevrones en los costados
  f.strokeStyle = 'rgba(95,224,180,0.1)'; f.lineWidth = 1;
  for (let k = 0; k < 6; k++) { f.beginPath(); f.moveTo(60, 250 + k * 12); f.lineTo(70, 244 + k * 12); f.lineTo(80, 250 + k * 12); f.stroke(); f.beginPath(); f.moveTo(254, 380 + k * 12); f.lineTo(264, 374 + k * 12); f.lineTo(274, 380 + k * 12); f.stroke(); }
  // el nombre grande, como el arte de las mesas de verdad
  f.globalAlpha = 0.16; textoDeco(f, 'DORADO', 167, 372, 40, { oro: true, esp: 0.08 }); f.globalAlpha = 1;
  f.strokeStyle = 'rgba(232,184,80,0.18)'; f.lineWidth = 1;
  f.beginPath(); f.moveTo(80, 352); f.lineTo(254, 352); f.moveTo(80, 392); f.lineTo(254, 392); f.stroke();
  // los delantales (afuera de las gomas) y el carril del resorte: laca con filetes de oro
  for (const pol of [[[0, 380], [14, 384], [34, 396], [80, 486], [97, 528], [97, 600], [0, 600]], [[320, 384], [300, 396], [254, 486], [237, 528], [237, 600], [320, 600]]]) {
    f.beginPath(); f.moveTo(pol[0][0], pol[0][1]); for (const p of pol) f.lineTo(p[0], p[1]); f.closePath();
    const gr = f.createLinearGradient(0, 380, 0, 600); gr.addColorStop(0, '#0d0e10'); gr.addColorStop(1, '#030304'); f.fillStyle = gr; f.fill();
    f.save(); f.clip(); f.strokeStyle = 'rgba(232,184,80,0.16)'; f.lineWidth = 1;
    for (let k = -10; k < 30; k++) { f.beginPath(); f.moveTo(k * 14, 380); f.lineTo(k * 14 + 220, 600); f.stroke(); }
    f.restore();
  }
  f.fillStyle = '#060607'; f.fillRect(320, 156, 26, 448);
  for (let y = 180; y < 560; y += 22) { f.fillStyle = 'rgba(232,184,80,0.14)'; f.fillRect(326, y, 14, 2); }
  f.fillStyle = 'rgba(0,0,0,0.65)'; f.fillRect(97, 580, 140, 20);
  // la copa: aro déco con la copa de champán
  f.strokeStyle = 'rgba(232,184,80,0.55)'; f.lineWidth = 1.2; f.beginPath(); f.arc(COPA.x, COPA.y, 15, 0, Math.PI * 2); f.stroke();
  f.beginPath(); f.arc(COPA.x, COPA.y, 19, Math.PI * 0.15, Math.PI * 0.85); f.stroke();
  f.fillStyle = '#020303'; f.beginPath(); f.arc(COPA.x, COPA.y, 10, 0, Math.PI * 2); f.fill();
  texto(f, 'LA COPA', COPA.x, COPA.y + 30, { tam: 7, col: 'rgba(244,234,210,0.6)' });
  // el canal de la órbita y la reja de los blancos
  texto(f, 'ÓRBITA', 40, 346, { tam: 6.5, col: 'rgba(244,234,210,0.5)' });
  f.fillStyle = 'rgba(232,184,80,0.12)'; f.fillRect(296, 246, 22, 92);
  // las paredes de oro
  rieles(f, arcoPts(48), 3.5);
  rieles(f, [[14, 170], [14, 384], [34, 396]], 3.5);
  rieles(f, [[80, 486], [97, 528]], 3.5); rieles(f, [[254, 486], [237, 528]], 3.5);
  rieles(f, [[320, 156], [320, 600]], 3.5); rieles(f, [[320, 384], [300, 396]], 3.5); rieles(f, [[346, 170], [346, 604]], 3.5);
  rieles(f, [[46, 222], [66, 330]], 5);
  for (const x of POSTES_CARRIL.slice(0, 4)) rieles(f, [[x, 70], [x, 106]], 6);
  // las letras de los carriles (las lámparas van encima, cada cuadro)
  for (const s of MESA.sensores) if (s.id === 'carril') { f.strokeStyle = 'rgba(232,184,80,0.25)'; f.lineWidth = 1; f.beginPath(); f.moveTo(s.x, 84); f.lineTo(s.x, 110); f.stroke(); }
  // las bases de las gomas: triángulos de laca con filete
  for (const [a, b, cc] of [[[34, 396], [80, 486], [44, 470]], [[300, 396], [254, 486], [290, 470]]]) {
    f.beginPath(); f.moveTo(a[0], a[1]); f.lineTo(b[0], b[1]); f.lineTo(cc[0], cc[1]); f.closePath(); f.fillStyle = '#101113'; f.fill();
    f.strokeStyle = 'rgba(232,184,80,0.45)'; f.lineWidth = 1; f.stroke();
  }
  // etiquetas de las lámparas de abajo
  ['2', '3', '4', '5'].forEach((n, i) => texto(f, '×' + n, 137 + i * 20, 452, { tam: 6, col: 'rgba(244,234,210,0.45)', esp: 0 }));
  return c;
}

/* ------------------------------------------------- lo que se mueve */
function brillo(g, x, y, r, col, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col.replace('A', a)); gr.addColorStop(1, col.replace('A', 0));
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
const LUZ = { oro: 'rgba(255,214,120,A)', esm: 'rgba(95,224,180,A)', rubi: 'rgba(240,80,90,A)', marfil: 'rgba(255,248,230,A)' };
/* una lámpara de vidrio: apagada se ve el vidrio oscuro de color; prendida, brilla */
function lampara(g, x, y, forma, tono, prendida, tam) {
  tam = tam || 6;
  const col = { oro: ['#3a2a0c', '#ffe08a'], esm: ['#0d2c22', '#8ff5d0'], rubi: ['#3a0d12', '#ff8a94'], marfil: ['#2a2620', '#fff6dc'] }[tono];
  if (prendida) { g.globalCompositeOperation = 'lighter'; brillo(g, x, y, tam * 3.2, LUZ[tono], 0.45); g.globalCompositeOperation = 'source-over'; }
  g.beginPath();
  if (forma === 'rombo') { g.moveTo(x, y - tam); g.lineTo(x + tam * 0.7, y); g.lineTo(x, y + tam); g.lineTo(x - tam * 0.7, y); }
  else if (forma === 'flecha') { g.moveTo(x, y - tam); g.lineTo(x + tam * 0.8, y + tam * 0.4); g.lineTo(x + tam * 0.3, y + tam * 0.4); g.lineTo(x + tam * 0.3, y + tam); g.lineTo(x - tam * 0.3, y + tam); g.lineTo(x - tam * 0.3, y + tam * 0.4); g.lineTo(x - tam * 0.8, y + tam * 0.4); }
  else g.arc(x, y, tam, 0, Math.PI * 2);
  g.closePath();
  g.fillStyle = prendida ? col[1] : col[0]; g.fill();
  g.strokeStyle = prendida ? '#fff8e6' : 'rgba(232,184,80,0.5)'; g.lineWidth = 0.9; g.stroke();
}
function dibujarHongo(g, c, t) {
  const fl = c.golpe > 0 ? c.golpe / 0.18 : 0;
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); g.ellipse(c.x + 3, c.y + 5, c.r + 2, c.r * 0.9, 0, 0, Math.PI * 2); g.fill();
  // el aro de oro
  const ar = g.createLinearGradient(c.x, c.y - c.r, c.x, c.y + c.r); ar.addColorStop(0, ORO_CLARO); ar.addColorStop(0.5, ORO); ar.addColorStop(1, ORO_OSCURO);
  g.fillStyle = ar; g.beginPath(); g.arc(c.x, c.y, c.r, 0, Math.PI * 2); g.fill();
  // el sombrero esmeralda con el abanico déco
  const cap = g.createRadialGradient(c.x - 5, c.y - 6, 2, c.x, c.y, c.r * 0.8); cap.addColorStop(0, fl ? '#e9fff6' : '#5fe0b4'); cap.addColorStop(1, fl ? '#7ff0c8' : '#0f5c46');
  g.fillStyle = cap; g.beginPath(); g.arc(c.x, c.y, c.r * 0.74, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(255,241,194,0.7)'; g.lineWidth = 0.8;
  for (let i = 0; i < 7; i++) { const a = Math.PI * 1.1 + (i / 6) * Math.PI * 0.8; g.beginPath(); g.moveTo(c.x, c.y + 4); g.lineTo(c.x + Math.cos(a) * c.r * 0.66, c.y + 4 + Math.sin(a) * c.r * 0.66); g.stroke(); }
  g.fillStyle = ORO_CLARO; g.beginPath(); g.arc(c.x, c.y + 4, 2.4, 0, Math.PI * 2); g.fill();
  if (fl) { g.globalCompositeOperation = 'lighter'; brillo(g, c.x, c.y, c.r * 2.6, LUZ.esm, 0.6 * fl); g.strokeStyle = 'rgba(255,241,194,' + fl + ')'; g.lineWidth = 2; g.beginPath(); g.arc(c.x, c.y, c.r + (1 - fl) * 14, 0, Math.PI * 2); g.stroke(); g.globalCompositeOperation = 'source-over'; }
}
function dibujarBlanco(g, s, letra) {
  const y = (s.ay + s.by) / 2;
  if (s.caido) { g.fillStyle = '#2a2418'; g.fillRect(s.ax - 2, y - 11, 4, 22); return; }
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(s.ax - 1, y - 10, 7, 22);
  const gr = g.createLinearGradient(s.ax - 4, 0, s.ax + 4, 0); gr.addColorStop(0, '#fffaf0'); gr.addColorStop(1, '#cdbf98');
  g.fillStyle = s.golpe > 0 ? '#fff' : gr; g.fillRect(s.ax - 4, y - 12, 8, 24);
  g.strokeStyle = ORO; g.lineWidth = 1; g.strokeRect(s.ax - 4, y - 12, 8, 24);
  textoDeco(g, letra, s.ax, y, 9, { col: '#5a3a0a' });
}
function dibujarFlipper(g, f) {
  const [dx, dy] = dirFlipper(f), tx = f.px + dx * f.largo, ty = f.py + dy * f.largo, nx = -dy, ny = dx, a = Math.atan2(dy, dx);
  g.beginPath();
  g.arc(f.px, f.py, f.rp, a + Math.PI / 2, a - Math.PI / 2);
  g.lineTo(tx + nx * -f.rt, ty + ny * -f.rt);
  g.arc(tx, ty, f.rt, a - Math.PI / 2, a + Math.PI / 2);
  g.closePath();
  g.save(); g.translate(2, 3); g.fillStyle = 'rgba(0,0,0,0.5)'; g.fill(); g.restore();
  const gr = g.createLinearGradient(f.px + nx * -8, f.py + ny * -8, f.px + nx * 8, f.py + ny * 8); gr.addColorStop(0, '#fffaf0'); gr.addColorStop(1, '#d8c79a');
  g.fillStyle = gr; g.fill();
  g.strokeStyle = '#2a1d0a'; g.lineWidth = 2.4; g.stroke();
  g.strokeStyle = ORO; g.lineWidth = 1.1; g.stroke();
  g.fillStyle = ORO; g.beginPath(); g.arc(f.px, f.py, 3, 0, Math.PI * 2); g.fill();
  g.fillStyle = ORO_OSCURO; g.fillRect(f.px - 2.2, f.py - 0.5, 4.4, 1);
}
function dibujarBola(g, b) {
  for (let i = 0; i < b.rastro.length - 1; i++) { const [x, y] = b.rastro[i]; g.fillStyle = 'rgba(255,214,120,' + (0.05 + i * 0.03) + ')'; g.beginPath(); g.arc(x, y, R_BOLA * (0.5 + i * 0.08), 0, Math.PI * 2); g.fill(); }
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.arc(b.x + 2.5, b.y + 3.5, R_BOLA, 0, Math.PI * 2); g.fill();
  const gr = g.createRadialGradient(b.x - 3, b.y - 3.5, 0.5, b.x, b.y, R_BOLA * 1.05);
  gr.addColorStop(0, '#fffdf2'); gr.addColorStop(0.25, '#f7dc8e'); gr.addColorStop(0.65, '#b88426'); gr.addColorStop(1, '#3a2408');
  g.fillStyle = gr; g.beginPath(); g.arc(b.x, b.y, R_BOLA, 0, Math.PI * 2); g.fill();
  // el reflejo de la mesa verde abajo y el brillo arriba
  g.fillStyle = 'rgba(40,140,110,0.35)'; g.beginPath(); g.ellipse(b.x + 1, b.y + 4.2, 4.5, 1.6, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(b.x - 2.6, b.y - 3, 1.5, 0, Math.PI * 2); g.fill();
}
function dibujarResorte(g, tirado, hayBola) {
  const yTope = LANZADOR.y + R_BOLA + tirado * 26;
  g.strokeStyle = '#8a8270'; g.lineWidth = 1.4; g.beginPath();
  const n = 7, alto = 600 - yTope;
  for (let i = 0; i <= n; i++) { const y = yTope + (i / n) * alto, x = LANZADOR.x + (i % 2 ? 6 : -6); i ? g.lineTo(x, y) : g.moveTo(LANZADOR.x, y); }
  g.stroke();
  const gr = g.createLinearGradient(0, yTope - 3, 0, yTope + 4); gr.addColorStop(0, ORO_CLARO); gr.addColorStop(1, ORO_OSCURO);
  g.fillStyle = gr; g.fillRect(LANZADOR.x - 9, yTope - 1, 18, 5);
  if (hayBola) { g.globalCompositeOperation = 'lighter'; brillo(g, LANZADOR.x, yTope + 12, 18, LUZ.oro, 0.25 + 0.2 * Math.sin(ahora * 6)); g.globalCompositeOperation = 'source-over'; }
}
function dibujarMolinete(g, ang) {
  const c = Math.cos(ang), w = 20 * Math.abs(c);
  g.fillStyle = c > 0 ? '#f4ead2' : '#c79a3a'; g.fillRect(37 - w, 298, w * 2, 4);
  g.strokeStyle = ORO; g.lineWidth = 1; g.beginPath(); g.moveTo(15, 300); g.lineTo(59, 300); g.stroke();
}

/* ==== dorado/js/sonido.js ==== */
/* ============================================================================
   El sonido, todo sintetizado: un trío de jazz de hotel (contrabajo que
   camina, piano que acompaña "a la Charleston", platillo con swing) en fa
   mayor sobre un "rhythm changes" de 8 compases, y en la multibola entra una
   trompeta con sordina. El swing: la corchea de atrás cae a 2/3 del tiempo.
   Los efectos son los de un pinball de verdad: el clac del flipper, el pop del
   hongo, la campanita del carril, el chasquido de la goma y el "wah-wah" de
   trombón cuando se pierde la bola.
   ========================================================================== */

// los acordes: bajo (midi), notas de paso del bajo y el voicing del piano
const ACORDES = {
  F6: { r: 41, t: [41, 45, 48, 50], v: [57, 60, 62, 65] }, D7: { r: 38, t: [38, 42, 45, 48], v: [54, 57, 60, 62] },
  Gm7: { r: 43, t: [43, 46, 50, 53], v: [53, 58, 62, 65] }, C7: { r: 36, t: [36, 40, 43, 46], v: [52, 58, 60, 64] },
  Am7: { r: 45, t: [45, 48, 52, 55], v: [55, 60, 64, 67] },
};
const PROGRESION = ['F6', 'F6', 'D7', 'D7', 'Gm7', 'Gm7', 'C7', 'C7', 'Am7', 'D7', 'Gm7', 'C7', 'F6', 'D7', 'Gm7', 'C7'];  // de a medio compás
// la trompeta: [corchea dentro de los 4 compases, midi, duración en corcheas]
const RIFF = [[0, 72, 2], [2, 74, 1], [3, 77, 3], [8, 76, 1], [9, 74, 1], [10, 72, 2], [14, 69, 2], [16, 70, 2], [18, 74, 1], [19, 77, 2], [22, 79, 2], [24, 77, 3], [28, 74, 1], [29, 72, 3]];
const TEMAS = {
  menu: { id: 'menu', bpm: 112, piano: 0.05, bajo: 0.16, bateria: 0.6, trompeta: 0 },
  juego: { id: 'juego', bpm: 138, piano: 0.045, bajo: 0.17, bateria: 0.75, trompeta: 0 },
  multi: { id: 'multi', bpm: 176, piano: 0.045, bajo: 0.18, bateria: 0.9, trompeta: 0.05 },
};

const Sonido = {
  ctx: null, total: null, efectos: null, musicaG: null, ruidoBuf: null,
  musicaSi: Guardado.leer('musica', true), efectosSi: Guardado.leer('efectos', true),
  tema: null, tiempo: 0, prox: 0,
  iniciar() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
    this.total = c.createGain(); this.total.gain.value = 0.9;
    this.efectos = c.createGain(); this.efectos.gain.value = this.efectosSi ? 0.75 : 0;
    this.musicaG = c.createGain(); this.musicaG.gain.value = this.musicaSi ? 0.34 : 0;
    // un poco de sala: eco corto y oscuro
    const d = c.createDelay(1), fb = c.createGain(), fl = c.createBiquadFilter(), env = c.createGain();
    d.delayTime.value = 0.13; fb.gain.value = 0.25; fl.type = 'lowpass'; fl.frequency.value = 2600; env.gain.value = 0.35;
    this.musicaG.connect(env); env.connect(d); d.connect(fl); fl.connect(fb); fb.connect(d); fl.connect(comp);
    this.efectos.connect(comp); this.musicaG.connect(comp); comp.connect(this.total); this.total.connect(c.destination);
    const n = c.sampleRate;
    this.ruidoBuf = c.createBuffer(1, n, n);
    const b = this.ruidoBuf.getChannelData(0);
    for (let i = 0; i < n; i++) b[i] = Math.random() * 2 - 1;
  },
  ponerMusica(si) { this.musicaSi = si; Guardado.escribir('musica', si); if (this.musicaG) this.musicaG.gain.setTargetAtTime(si ? 0.34 : 0, this.ctx.currentTime, 0.05); },
  ponerEfectos(si) { this.efectosSi = si; Guardado.escribir('efectos', si); if (this.efectos) this.efectos.gain.setTargetAtTime(si ? 0.75 : 0, this.ctx.currentTime, 0.05); },
  pausar(si) { if (this.ctx) { if (si) this.ctx.suspend(); else this.ctx.resume(); } },
  hz: (m) => 440 * Math.pow(2, (m - 69) / 12),

  env(gn, t, vol, ataque, dur) { gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(vol, t + ataque); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur); },
  osc(tipo, f, t, dur, dst) { const o = this.ctx.createOscillator(); o.type = tipo; o.frequency.setValueAtTime(f, t); o.connect(dst); o.start(t); o.stop(t + dur + 0.05); return o; },
  tono(f, dur, tipo, vol, f2, t, dst, ataque) {
    const c = this.ctx; if (!c) return;
    t = t || c.currentTime;
    const gn = c.createGain(); gn.connect(dst || this.efectos);
    const o = this.osc(tipo || 'sine', f, t, dur, gn);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    this.env(gn, t, vol, ataque || 0.005, dur);
    return o;
  },
  ruido(dur, vol, frec, tipoF, t, dst, f2, q) {
    const c = this.ctx; if (!c) return;
    t = t || c.currentTime;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), gn = c.createGain();
    s.buffer = this.ruidoBuf; f.type = tipoF || 'lowpass'; f.Q.value = q || 0.8; f.frequency.setValueAtTime(frec, t);
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(gn); gn.connect(dst || this.efectos); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  /* ------------------------------------------------- los instrumentos */
  contrabajo(m, t, vol, dst) {
    const c = this.ctx, fl = c.createBiquadFilter(), gn = c.createGain(), f = this.hz(m);
    fl.type = 'lowpass'; fl.frequency.setValueAtTime(900, t); fl.frequency.exponentialRampToValueAtTime(260, t + 0.3); fl.connect(gn); gn.connect(dst);
    this.osc('triangle', f, t, 0.6, fl); this.osc('sine', f * 2, t, 0.3, fl);
    this.env(gn, t, vol, 0.008, 0.55);
    this.ruido(0.03, vol * 0.25, 600, 'lowpass', t, dst);
  },
  piano(notas, t, vol, dur, dst) {
    const c = this.ctx, fl = c.createBiquadFilter(), gn = c.createGain();
    fl.type = 'lowpass'; fl.frequency.value = 2800; fl.connect(gn); gn.connect(dst);
    for (const m of notas) { const f = this.hz(m); this.osc('triangle', f, t, dur, fl); this.osc('sine', f * 2.003, t, dur * 0.5, fl); }
    this.env(gn, t, vol, 0.004, dur);
  },
  platillo(t, vol, dst) { this.ruido(0.32, vol, 7000, 'highpass', t, dst); this.tono(5200, 0.12, 'square', vol * 0.04, null, t, dst); this.tono(7350, 0.1, 'square', vol * 0.03, null, t, dst); },
  charles(t, vol, dst) { this.ruido(0.05, vol, 8200, 'highpass', t, dst); },
  bombo(t, vol, dst) { this.tono(95, 0.2, 'sine', vol, 45, t, dst, 0.003); },
  escobilla(t, vol, dst) { this.ruido(0.12, vol, 2400, 'bandpass', t, dst, 1600, 0.7); },
  trompeta(m, t, dur, vol, dst) {
    const c = this.ctx, f = this.hz(m), bp = c.createBiquadFilter(), lp = c.createBiquadFilter(), gn = c.createGain(), lfo = c.createOscillator(), pr = c.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 1300; bp.Q.value = 1.4; lp.type = 'lowpass'; lp.frequency.value = 3200;
    bp.connect(lp); lp.connect(gn); gn.connect(dst);
    const o = this.osc('sawtooth', f * 0.985, t, dur, bp); o.frequency.linearRampToValueAtTime(f, t + 0.05);
    lfo.frequency.value = 5.5; pr.gain.setValueAtTime(0, t); pr.gain.linearRampToValueAtTime(f * 0.012, t + Math.min(0.3, dur * 0.7));
    lfo.connect(pr); pr.connect(o.frequency); lfo.start(t); lfo.stop(t + dur + 0.05);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(vol, t + 0.04); gn.gain.setValueAtTime(vol, t + Math.max(0.05, dur - 0.08)); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },
  /* el "wah-wah-wah-waaah" del trombón con sordina: tres notas que bajan con el filtro que abre y cierra */
  wah(t) {
    const c = this.ctx;
    [[58, 0, 0.32], [57, 0.36, 0.32], [56, 0.72, 0.32], [55, 1.08, 0.9]].forEach(([m, d, du]) => {
      const bp = c.createBiquadFilter(), gn = c.createGain(), f = this.hz(m - 12), t0 = t + d;
      bp.type = 'bandpass'; bp.Q.value = 3; bp.frequency.setValueAtTime(300, t0); bp.frequency.linearRampToValueAtTime(1100, t0 + du * 0.5); bp.frequency.linearRampToValueAtTime(350, t0 + du);
      bp.connect(gn); gn.connect(this.efectos);
      const o = this.osc('sawtooth', f, t0, du, bp);
      if (du > 0.5) { const l = c.createOscillator(), p = c.createGain(); l.frequency.value = 6; p.gain.value = f * 0.02; l.connect(p); p.connect(o.frequency); l.start(t0); l.stop(t0 + du); }
      this.env(gn, t0, 0.32, 0.03, du);
    });
  },
  /* -------------------------------------------------------- efectos */
  sfx(n, x) {
    if (!this.ctx || !this.efectosSi || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    switch (n) {
      case 'flip': this.ruido(0.05, 0.22, 2600, 'bandpass', t, null, 900, 1.2); this.tono(140, 0.07, 'sine', 0.25, 70, t); break;
      case 'baja': this.ruido(0.04, 0.08, 1400, 'bandpass', t); break;
      case 'hongo': this.tono(620, 0.12, 'sine', 0.22, 300, t); this.ruido(0.05, 0.25, 3000, 'bandpass', t); this.tono(1568 + (x || 0) * 220, 0.35, 'sine', 0.07, null, t + 0.01); break;
      case 'goma': this.ruido(0.06, 0.3, 4200, 'highpass', t); this.tono(220, 0.08, 'square', 0.06, 110, t); break;
      case 'blanco': this.tono(180, 0.1, 'square', 0.12, 90, t); this.ruido(0.08, 0.2, 900, 'lowpass', t); break;
      case 'carril': this.tono(1568, 0.4, 'sine', 0.1, null, t); this.tono(2349, 0.3, 'sine', 0.06, null, t + 0.06); break;
      case 'pared': this.tono(320, 0.04, 'sine', clamp((x || 300) / 2500, 0.02, 0.12), 200, t); break;
      case 'copa': this.tono(2637, 0.6, 'sine', 0.08, null, t); this.tono(3951, 0.5, 'sine', 0.05, null, t + 0.03); this.ruido(0.3, 0.15, 500, 'lowpass', t, null, 200); break;
      case 'expulsa': this.tono(110, 0.15, 'sine', 0.35, 50, t); this.ruido(0.08, 0.2, 1200, 'bandpass', t); break;
      case 'molinete': for (let i = 0; i < Math.min(12, x || 3); i++) this.ruido(0.015, 0.1, 5000, 'highpass', t + i * 0.035); break;
      case 'resorte': this.tono(90 + (x || 0) * 200, 0.08, 'sawtooth', 0.04, null, t); break;
      case 'lanza': this.tono(70, 0.25, 'sine', 0.4, 140, t); this.ruido(0.2, 0.2, 800, 'lowpass', t, null, 3000); this.tono(440, 0.3, 'triangle', 0.05, 220, t + 0.02); break;
      case 'cae': this.wah(t); break;
      case 'salvo': this.tono(800, 0.25, 'sine', 0.1, 1600, t); this.tono(1600, 0.3, 'sine', 0.07, null, t + 0.25); break;
      case 'jackpot': this.piano([65, 69, 72, 74, 77], t, 0.12, 1.2, this.efectos); for (const m of [65, 69, 72, 76]) this.trompeta(m, t, 0.8, 0.07, this.efectos); this.platillo(t, 0.5, this.efectos); this.bombo(t, 0.6, this.efectos); break;
      case 'mision': [72, 76, 79, 84].forEach((m, i) => this.trompeta(m, t + i * 0.1, i === 3 ? 0.7 : 0.14, 0.09, this.efectos)); this.platillo(t + 0.3, 0.4, this.efectos); break;
      case 'extra': for (let i = 0; i < 6; i++) this.tono(2093 * (i % 2 ? 1.26 : 1), 0.3, 'sine', 0.07, null, t + i * 0.08); break;
      case 'mult': for (let i = 0; i < 8; i++) this.piano([60 + i * 3], t + i * 0.03, 0.08, 0.4, this.efectos); break;
      case 'multibola': this.sfx('jackpot'); for (let i = 0; i < 3; i++) this.bombo(t + 0.4 + i * 0.12, 0.5, this.efectos); break;
      case 'boton': this.tono(1200, 0.04, 'sine', 0.1, 900, t); this.ruido(0.02, 0.06, 4000, 'highpass', t); break;
      case 'tic': this.charles(t, 0.3, this.efectos); this.tono(1800, 0.04, 'sine', 0.05, null, t); break;
      case 'record': this.sfx('mision'); this.piano([65, 69, 72, 76, 79], t + 0.5, 0.1, 1.6, this.efectos); break;
    }
  },
  /* ---------------------------------------------------------- música */
  musica(tema) {
    if (this.tema && tema && this.tema.id === tema.id) return;
    const seguir = !!this.tema;
    this.tema = tema;
    if (!seguir) { this.tiempo = 0; if (this.ctx) this.prox = this.ctx.currentTime + 0.1; }
  },
  pasar() {
    const c = this.ctx; if (!c || !this.tema || c.state !== 'running' || !this.musicaSi) return;
    const B = 60 / this.tema.bpm;
    if (this.prox < c.currentTime - 0.2) this.prox = c.currentTime + 0.05;
    while (this.prox < c.currentTime + 0.25) { this.tocarTiempo(this.tiempo, this.prox, B); this.tiempo++; this.prox += B; }
  },
  tocarTiempo(i, t, B) {

    // el contrabajo camina: fundamental, nota del acorde, quinta y una de paso hacia el próximo acorde
    const prox = ACORDES[PROGRESION[(Math.floor((i + 1) / 2)) % PROGRESION.length]];
    const nota = k === 0 ? ac.r : k === 3 ? prox.r + (i % 8 === 3 ? -1 : 1) : ac.t[k === 1 ? 1 + (i % 3 === 0 ? 1 : 0) : 2];
    this.contrabajo(nota, t, T.bajo, M);
    // el platillo: tin, tin-ta-tin; el charles en 2 y 4; un bombo apenas en 1 y 3
    this.platillo(t, 0.05 * T.bateria, M);
    if (k === 1 || k === 3) { this.platillo(t + sw, 0.035 * T.bateria, M); this.charles(t, 0.12 * T.bateria, M); this.escobilla(t, 0.05 * T.bateria, M); }
    if (k === 0 || k === 2) this.bombo(t, 0.12 * T.bateria, M);
    // el piano a la Charleston: en el 1 cortito y en el "y" del 2 más largo
    if (k === 0) this.piano(ac.v, t, T.piano, B * 0.5, M);
    if (k === 1) this.piano(ac.v, t + sw, T.piano * 0.9, B * 1.3, M);

    if (T.trompeta) {
      const c8 = (i % 16) * 2;
      for (const [p, m, d] of RIFF) { if (p === c8) this.trompeta(m, t, d * B * 0.5, T.trompeta, M); if (p === c8 + 1) this.trompeta(m, t + sw, d * B * 0.5, T.trompeta, M); }
    }
  },
};

/* ==== dorado/js/intro.js ==== */
/* ============================================================================
   La intro de JXSTUDIOS en Art Déco: misma coreografía que la de La Cripta,
   otro material. La raya de luz abre una pared de laca negra con un abanico de
   rayos de oro; el monograma se escribe en oro pulido (biselado: sombra, cuerpo
   con degradé de oro y filo de luz), en el golpe se prende un marco escalonado
   y los rayos giran. JXSTUDIOS en la letra déco, espaciada. La música: un
   glissando de piano, el platillo que sube y un acorde de big band en el golpe.
   ========================================================================== */

function fondoDeco(Wl, Hl, cx, cy) {
  const [c, f] = lienzoHD(Wl, Hl);
  const gr = f.createRadialGradient(cx, cy, 10, cx, cy, Hl * 0.8); gr.addColorStop(0, '#14261f'); gr.addColorStop(0.6, '#070b0a'); gr.addColorStop(1, '#020303');
  f.fillStyle = gr; f.fillRect(0, 0, Wl, Hl);
  abanico(f, cx, cy, 30, Hl, 0, Math.PI * 2, 72, 0.1);
  for (const r of [110, 116, 190]) { f.strokeStyle = 'rgba(232,184,80,0.18)'; f.lineWidth = 1; f.beginPath(); f.arc(cx, cy, r, 0, Math.PI * 2); f.stroke(); }
  // el marco con las esquinas escalonadas
  f.strokeStyle = 'rgba(232,184,80,0.45)'; f.lineWidth = 1.2;
  for (const m of [14, 20]) {
    f.beginPath(); f.moveTo(m + 14, m); f.lineTo(Wl - m - 14, m); f.lineTo(Wl - m - 14, m + 7); f.lineTo(Wl - m - 7, m + 7); f.lineTo(Wl - m - 7, m + 14); f.lineTo(Wl - m, m + 14);
    f.lineTo(Wl - m, Hl - m - 14); f.lineTo(Wl - m - 7, Hl - m - 14); f.lineTo(Wl - m - 7, Hl - m - 7); f.lineTo(Wl - m - 14, Hl - m - 7); f.lineTo(Wl - m - 14, Hl - m);
    f.lineTo(m + 14, Hl - m); f.lineTo(m + 14, Hl - m - 7); f.lineTo(m + 7, Hl - m - 7); f.lineTo(m + 7, Hl - m - 14); f.lineTo(m, Hl - m - 14);
    f.lineTo(m, m + 14); f.lineTo(m + 7, m + 14); f.lineTo(m + 7, m + 7); f.lineTo(m + 14, m + 7); f.closePath(); f.stroke();
  }
  return c;
}

const ESTILO_DECO = {
  negro: '#020303',
  chispa: 2,
  anchoLogo: (Wl) => Math.round(Wl * 0.64),
  puntas: [ORO_CLARO, '#ffd66a', '#ffffff'],
  golpe: [ORO_CLARO, ORO, '#ffffff', ESM_CLARO],
  destello: 'rgba(255,230,160,0.5)',
  fondo: (Wl, Hl, cx, cy) => fondoDeco(Wl, Hl, cx, cy),
  antes(g, t, I) {
    // después del golpe, los rayos giran despacio y se prende un halo
    if (t < 0.88) return;
    const k = clamp((t - 0.88) / 0.5, 0, 1);
    g.save(); g.translate(I.cx, I.cy); g.rotate((t - 0.88) * 0.25); g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 24; i++) { const a = (i / 24) * Math.PI * 2; g.fillStyle = 'rgba(255,214,120,' + 0.05 * k + ')'; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a - 0.04) * 400, Math.sin(a - 0.04) * 400); g.lineTo(Math.cos(a + 0.04) * 400, Math.sin(a + 0.04) * 400); g.fill(); }
    g.restore();
  },
  logo(g, i) {
    const G = 14.5 * i.esc;
    for (const capa of [0, 1]) for (const tz of i.TRAZOS) {
      if (tz.capa !== capa) continue;
      const p = i.camino2d(tz, i.esc, i.x0, i.y0), l = i.largo(tz) * i.esc;
      g.save();
      if (i.avance < 1) g.setLineDash([Math.max(0.01, l * i.avance), l + 20]);
      g.lineCap = 'butt'; g.lineJoin = 'miter';
      g.strokeStyle = '#1a1204'; g.lineWidth = G + 4; g.stroke(p);
      const gr = g.createLinearGradient(0, i.y0, 0, i.y0 + 172 * i.esc);
      gr.addColorStop(0, ORO_CLARO); gr.addColorStop(0.45, '#f0c45c'); gr.addColorStop(0.5, '#9a6a18'); gr.addColorStop(0.62, '#e0a83c'); gr.addColorStop(1, '#f8dc94');
      g.strokeStyle = gr; g.lineWidth = G; g.stroke(p);
      g.save(); g.translate(-G * 0.18, -G * 0.2); g.strokeStyle = 'rgba(255,250,230,0.75)'; g.lineWidth = G * 0.14; g.stroke(p); g.restore();
      g.restore();
    }
    if (i.golpe) {
      // el marco escalonado que se prende alrededor del monograma
      const k = clamp(i.tGolpe / 0.25, 0, 1), m = 14 + (1 - salida(k)) * 30, x0 = i.x0 - m, y0 = i.y0 - m, w = i.ancho + m * 2, h = 172 * i.esc + m * 2;
      g.save(); g.globalAlpha = k; g.strokeStyle = ORO; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(x0 + 10, y0); g.lineTo(x0 + w - 10, y0); g.lineTo(x0 + w - 10, y0 + 5); g.lineTo(x0 + w - 5, y0 + 5); g.lineTo(x0 + w - 5, y0 + 10); g.lineTo(x0 + w, y0 + 10);
      g.lineTo(x0 + w, y0 + h - 10); g.lineTo(x0 + w - 5, y0 + h - 10); g.lineTo(x0 + w - 5, y0 + h - 5); g.lineTo(x0 + w - 10, y0 + h - 5); g.lineTo(x0 + w - 10, y0 + h);
      g.lineTo(x0 + 10, y0 + h); g.lineTo(x0 + 10, y0 + h - 5); g.lineTo(x0 + 5, y0 + h - 5); g.lineTo(x0 + 5, y0 + h - 10); g.lineTo(x0, y0 + h - 10);
      g.lineTo(x0, y0 + 10); g.lineTo(x0 + 5, y0 + 10); g.lineTo(x0 + 5, y0 + 5); g.lineTo(x0 + 10, y0 + 5); g.closePath(); g.stroke();
      g.restore();
    }
  },
  letras(g, parte, I, t, y) {
    const tam = 22, esp = 0.12, total = anchoDeco('JXSTUDIOS', tam, esp), x = I.cx - total / 2;
    textoDeco(g, parte, x, y + 22, tam, { alin: 'left', oro: true, esp, sombra: [1.5, 2] });
  },
  presentaTxt(g, txt, I, t, y) { texto(g, txt.toUpperCase(), I.cx, y + 50, { tam: 10, col: ESM_CLARO, esp: 4 }); },
  jingle(ctx, bus, t0, tg, h) {
    const { tono, soplo, f, T } = h;
    // el platillo que sube hasta el golpe
    soplo(tg - t0, 0.08, 'highpass', 4000, 9000, t0);
    // el glissando de piano en fa
    ['F4', 'A4', 'C5', 'E5', 'F5', 'A5', 'C6', 'E6'].forEach((n, k) => tono('triangle', f(n), 0, 0.5, 0.06, t0 + 0.32 + k * 0.065, 0.003));
    // el golpe: bombo, acorde de big band (fa sexta con novena) y el platillo
    tono('sine', 110, 45, 0.5, 0.6, tg, 0.003);
    for (const n of ['F3', 'A3', 'D4', 'G4', 'C5']) tono('sawtooth', f(n), 0, 1.4, 0.035, tg + 0.01, 0.02);
    soplo(1.2, 0.18, 'highpass', 6000, 3000, tg);
    tono('sine', f('F2'), 0, 1.6, 0.18, tg);
    for (let k = 0; k < 9; k++) tono('sine', 2093 + (k % 3) * 140, 0, 0.03, 0.025, t0 + T.T_LETRAS + k * 0.04);
  },
};

/* ==== dorado/js/juego.js ==== */
/* ============================================================================
   DORADO: escenas (intro, idioma, menú con la mesa jugando sola, partida,
   pausa, fin, controles y el editor de botones), las reglas del pinball
   (misiones y rangos del hotel, multibola con jackpots, tiro maestro, bola
   salvada, bonus por bola), los tres modos y el bucle.
   ========================================================================== */

const lienzoP = document.getElementById('lienzo');
const g = lienzoP.getContext('2d');
let escena = 'intro', tEsc = 0, trans = null, mesaFondo = null, puertaImg = null, G = null, ahora = 0, dtCuadro = 1 / 60;

const CTRL_BASE = { modo: 0, tam: 1, transp: 1, resorte: 0, vibrar: true, bIzq: [0.15, 0.9], bDer: [0.85, 0.9], bRes: [0.9, 0.72] };
const CTRL = Object.assign({}, JSON.parse(JSON.stringify(CTRL_BASE)), Guardado.leer('controles', {}));
const guardarCtrl = () => Guardado.escribir('controles', CTRL);
const TAMS = [30, 38, 48], ALFAS = [0.25, 0.45, 0.75];
function vibrar(ms) { if (CTRL.vibrar && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) { /* */ } }

/* --------------------------------------------------------------- pantalla */
function ajustar() {
  const dpr = Math.min(3, window.devicePixelRatio || 1), cw = innerWidth, ch = innerHeight;
  let cssW = cw / ch > 0.6 ? ch * 0.5625 : cw;
  H = clamp(Math.round(W * ch / cssW), 640, 800);
  let cssH = cssW * H / W;
  if (cssH > ch) { cssW *= ch / cssH; cssH = ch; }
  lienzoP.width = Math.round(cssW * dpr); lienzoP.height = Math.round(cssH * dpr);
  S = lienzoP.width / W; Y0 = H - MESA_H;
  Object.assign(lienzoP.style, { width: cssW + 'px', height: cssH + 'px', left: Math.round((cw - cssW) / 2) + 'px', top: Math.round((ch - cssH) / 2) + 'px' });
  mesaFondo = pintarMesa(); puertaImg = pintarPuerta();
}
addEventListener('resize', ajustar);
function pintarPuerta() {
  const w = W / 2 + 2, [c, f] = lienzoHD(w, H);
  const gr = f.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, '#050607'); gr.addColorStop(1, '#14161a');
  f.fillStyle = gr; f.fillRect(0, 0, w, H);
  abanico(f, w, H / 2, 20, H * 0.6, Math.PI * 0.5, Math.PI * 1.5, 30, 0.16);
  for (const r of [60, 66, 120]) { f.strokeStyle = 'rgba(232,184,80,0.35)'; f.lineWidth = 1; f.beginPath(); f.arc(w, H / 2, r, Math.PI * 0.5, Math.PI * 1.5); f.stroke(); }
  for (const x of [10, 14, w - 10]) { f.strokeStyle = 'rgba(232,184,80,0.5)'; f.lineWidth = 1; f.beginPath(); f.moveTo(x, 0); f.lineTo(x, H); f.stroke(); }
  f.fillStyle = ORO; f.fillRect(w - 4, 0, 3, H);
  return c;
}

/* ---------------------------------------------------------------- entrada */
const E = { punteros: new Map(), clic: null, toque: null, teclas: new Set(), recien: new Set() };
function aLogico(ev) { const r = lienzoP.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H }; }
const posBoton = (b) => ({ x: CTRL[b][0] * W, y: CTRL[b][1] * H, r: TAMS[CTRL.tam] * (b === 'bRes' ? 0.85 : 1) });
const dentroBoton = (b, x, y, extra) => { const p = posBoton(b); return Math.hypot(x - p.x, y - p.y) < p.r * (extra || 1.25); };
function rolDe(x, y) {

function escenaFin(t) {

/* ------------------------------------------------- controles y el editor */
function escenaControles(t) {

  const filas = [

    const val = etq === 'musica' ? +Sonido.musicaSi : etq === 'sonido' ? +Sonido.efectosSi : typeof CTRL[clave] === 'boolean' ? +CTRL[clave] : CTRL[clave];
    ops.forEach((op, k) => {
      if (!ficha(x0 + k * (bw + 5), y, bw, 24, tr(op), val === k)) return;

      else { CTRL[clave] = typeof CTRL_BASE[clave] === 'boolean' ? !!k : k; guardarCtrl(); if (clave === 'vibrar' && k) vibrar(40); }
    });

  const bw = W - 64;
  if (placa(32, y + 10, bw, 48, CTRL.modo === 1 ? tr('acomodar') : tr('proba'), { tam: 16 })) { armarMesa(); irA('editor'); }
  if (placa(32, H - 128, bw, 42, tr('restablecer'), { tam: 14, col: '#3a1016' })) { Object.assign(CTRL, JSON.parse(JSON.stringify(CTRL_BASE))); guardarCtrl(); }
  if (placa(32, H - 74, bw, 46, tr('listo')) || apretada('Escape')) irA('menu');

function escenaEditor(t) {
  // los flippers responden al dedo (prueba) y los botones se arrastran

  pasoMesa([], dtCuadro, () => {});

  g.fillStyle = 'rgba(2,3,3,0.35)'; g.fillRect(0, Y0, W, MESA_H);
  if (CTRL.modo === 0) { g.strokeStyle = 'rgba(232,184,80,0.5)'; g.setLineDash([6, 6]); g.beginPath(); g.moveTo(W / 2, Y0); g.lineTo(W / 2, H); g.stroke(); g.setLineDash([]); }
  dibujarBotonesDedo(Math.max(0.6, ALFAS[CTRL.transp]));
  g.fillStyle = '#020303'; g.fillRect(0, 0, W, Y0);
  const msg = CTRL.modo === 1 ? tr('arrastra') : tr('ayuda1');

  const by = Y0 > 90 ? Y0 - 44 : Y0 + 8;
  if (placa(W / 2 + 6, by, 120, 36, tr('listo'), { tam: 14 }) || apretada('Escape')) { guardarCtrl(); irA('controles'); }
  if (CTRL.modo === 1 && placa(W / 2 - 126, by, 120, 36, tr('restablecer'), { tam: 11, col: '#3a1016' })) { for (const b of ['bIzq', 'bDer', 'bRes']) CTRL[b] = CTRL_BASE[b].slice(); guardarCtrl(); }
}

const AL_ENTRAR = { menu: prepararMenu };

/* ------------------------------------------------------------------ bucle */
let ultimo = 0;

  const dt = Math.min(0.033, ultimo ? (ts - ultimo) / 1000 : 1 / 60); ultimo = ts; dtCuadro = dt;

  g.setTransform(S, 0, 0, S, 0, 0);

    switch (escena) {
