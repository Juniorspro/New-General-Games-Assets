'use strict';

const lim = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const CUADRO = 1000 / 60;

/** Un rng chico y rápido (mulberry32): la misma semilla, la misma partida (guía 2D § 0.5). */
function mulberry(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Dos azares: el del MUNDO (con semilla) y el VISUAL (chispas, temblores), así las partículas no
// le corren la secuencia a las oleadas y una prueba con semilla da siempre lo mismo.
let rnd = mulberry(1);
const A = {
  f: () => rnd(),
  ent: (a, b) => a + Math.floor(rnd() * (b - a + 1)),
  uno: (arr) => arr[Math.floor(rnd() * arr.length)],
  si: (p) => rnd() < p,
  mezclar(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
};
const V = { f: Math.random, ent: (a, b) => a + Math.floor(Math.random() * (b - a + 1)), uno: (arr) => arr[Math.floor(Math.random() * arr.length)] };

  op: { musica: 0.8, efectos: 0.9, numeros: 1, destellos: 1, idioma: null, duracion: 30 } });
let G = GUARDADO_BASE();
function cargar() {
  try { const s = JSON.parse(localStorage.getItem(CLAVE_GUARDADO) || "null"); if (s) G = Object.assign(GUARDADO_BASE(), s, { op: Object.assign(GUARDADO_BASE().op, s.op || {}) }); } catch (e) { /* modo privado: se juega igual, sin guardar */ }
}
function guardar() { try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(G)); } catch (e) { /* idem */ } }
cargar();

// ── idioma: todo el texto del juego es {es, en}; L() elige al dibujar (así cambiar de idioma no reinicia nada) ──
// el idioma por defecto es el inglés (pedido): el español queda a un toque en el menú y la pausa
let IDIOMA = G.op.idioma || "en";
const L = (t) => (t == null ? "" : typeof t === "string" ? t : t[IDIOMA] ?? t.es);
function cambiarIdioma() { IDIOMA = IDIOMA === "es" ? "en" : "es"; G.op.idioma = IDIOMA; guardar(); }

/** Tiempo como el original: mm:ss con el minuto en dos cifras. */
const reloj = (seg) => { seg = Math.max(0, Math.floor(seg)); return String(Math.floor(seg / 60)).padStart(2, "0") + ":" + String(seg % 60).padStart(2, "0"); };

// ══════════ 01-pantalla.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LA PANTALLA: el juego se dibuja chico (~240 px de ancho) en un lienzo aparte y se agranda a escala
// ENTERA (guía 2D § 2: con ×2,7 los píxeles salen de distinto tamaño y todo tiembla al moverse).
// Es vertical: en el teléfono parado ocupa todo; en una pantalla acostada queda una columna 9:16.
// ─────────────────────────────────────────────────────────────────────────────

const lienzo = document.getElementById("lienzo");
const cxP = lienzo.getContext("2d", { alpha: false });
const cvM = document.createElement("canvas");
const gM = cvM.getContext("2d");
// Dos pasadas por cuadro: el MUNDO (pixel art) se dibuja chico en gM y se agranda a escala entera;
// después la INTERFAZ (HUD, menús, textos) se dibuja directo en la pantalla con la misma escala
// puesta como transformación: los sprites salen igual de pixelados, pero las letras se dibujan a la
// resolución real, nítidas, como en el original. `g` apunta a la pasada en curso.
let g = gM;
let W = 240, H = 480, PX = 3, DPR = 1, OFX = 0, ANCHO_COL = 0;
const ANCHO_OBJ = 240;                    // lo que se ve de mundo a lo ancho, como el original en vertical

function medir() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = lienzo.clientWidth || innerWidth, ch = lienzo.clientHeight || innerHeight;
  const fw = Math.round(cw * DPR), fh = Math.round(ch * DPR);
  if (lienzo.width !== fw || lienzo.height !== fh) { lienzo.width = fw; lienzo.height = fh; }
  // columna vertical: si la pantalla es más ancha que 10:16, se encierra al centro
  ANCHO_COL = Math.min(fw, Math.round(fh * 0.62));
  PX = Math.max(2, Math.round(ANCHO_COL / ANCHO_OBJ));
  const nw = Math.ceil(ANCHO_COL / PX), nh = Math.ceil(fh / PX);
  OFX = Math.floor((fw - nw * PX) / 2);
  if (nw !== W || nh !== H || cvM.width !== nw) { W = nw; H = nh; cvM.width = W; cvM.height = H; }
  gM.imageSmoothingEnabled = false; cxP.imageSmoothingEnabled = false;
}
// el lienzo medido una sola vez, antes del layout, deja el juego aplastado (guía 2D § 2): observar y revisar
new ResizeObserver(medir).observe(lienzo);
addEventListener("resize", medir);
medir();

let _marco = null;
/** Empieza el cuadro: el marco de los costados (pantalla acostada) y el mundo a la pasada chica. */
function empezarCuadro() {
  cxP.setTransform(1, 0, 0, 1, 0, 0);
  if (OFX > 0) {
    if (!_marco || _marco.w !== lienzo.width || _marco.h !== lienzo.height) {
      const c = document.createElement("canvas"); c.width = lienzo.width; c.height = lienzo.height;
      const q = c.getContext("2d"), gr = q.createRadialGradient(c.width / 2, c.height / 2, c.height * 0.2, c.width / 2, c.height / 2, c.width * 0.7);
      gr.addColorStop(0, "#1a0d18"); gr.addColorStop(1, "#040306"); q.fillStyle = gr; q.fillRect(0, 0, c.width, c.height);
      q.fillStyle = "#6a4a2a"; q.fillRect(OFX - 2, 0, 2, c.height); q.fillRect(OFX + W * PX, 0, 2, c.height);
      _marco = { c, w: c.width, h: c.height };
    }
    cxP.drawImage(_marco.c, 0, 0);
  }
  g = gM;
}
/** Pasa el mundo chico a la pantalla y deja `g` en la pasada de interfaz (escala PX, recortada a la columna). */
function aPantalla(conMundo) {
  cxP.setTransform(1, 0, 0, 1, 0, 0);
  if (conMundo) cxP.drawImage(cvM, 0, 0, W, H, OFX, 0, W * PX, H * PX);
  cxP.save();
  cxP.beginPath(); cxP.rect(OFX, 0, W * PX, H * PX); cxP.clip();
  cxP.setTransform(PX, 0, 0, PX, OFX, 0);
  cxP.imageSmoothingEnabled = false;
  g = cxP;
}
function terminarCuadro() { if (g === cxP) cxP.restore(); g = gM; }
/** De un punto de la pantalla (px CSS) al lienzo chico. */
function aJuego(clientX, clientY) {
  const r = lienzo.getBoundingClientRect();
  return { x: ((clientX - r.left) * DPR - OFX) / PX, y: ((clientY - r.top) * DPR) / PX };
}

// pantalla completa: sólo se puede pedir en un gesto de verdad (en Android, pointerup/touchend/click)
function pedirCompleta() {
  const d = document.documentElement;
  try { if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI: "hide" }).then(() => { try { screen.orientation.lock("portrait").catch(() => {}); } catch (e) {} }).catch(() => {}); } catch (e) {}
}

// ══════════ 02-entrada.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LA ENTRADA: en el juego sólo te movés (las armas tiran solas). En el teléfono, un joystick que
// nace donde apoyás el dedo, en cualquier parte de la pantalla, como el original en celular.
// En la PC, WASD o flechas. Los menús se tocan/clickean o se manejan con flechas + Enter.
// ─────────────────────────────────────────────────────────────────────────────

const IN = { x: 0, y: 0, teclas: new Set(), palo: null, toques: [], raton: null };
// flancos de un cuadro: se consumen AL FINAL del cuadro (guía 2D § 1: si no, nunca dan verdadero)
const EDGE = new Set();
const RADIO_PALO = 22;

const TECLA = { ArrowUp: "arr", KeyW: "arr", ArrowDown: "aba", KeyS: "aba", ArrowLeft: "izq", KeyA: "izq", ArrowRight: "der", KeyD: "der",
  Enter: "ok", Space: "ok", NumpadEnter: "ok", Escape: "atras", KeyP: "pausa", Backspace: "atras" };

addEventListener("keydown", (e) => {
  const k = TECLA[e.code];
  if (k) { if (!e.repeat) EDGE.add(k); IN.teclas.add(k); e.preventDefault(); }
  alGesto();
});
addEventListener("keyup", (e) => { const k = TECLA[e.code]; if (k) IN.teclas.delete(k); });
addEventListener("blur", () => { IN.teclas.clear(); IN.palo = null; });

// ── el dedo: un joystick flotante + toques para los menús ──
lienzo.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const p = aJuego(e.clientX, e.clientY);
  if (!IN.palo) IN.palo = { id: e.pointerId, x0: p.x, y0: p.y, x: p.x, y: p.y, t: performance.now(), mouse: e.pointerType === "mouse" };
  // con mouse, el pointerdown SÍ es gesto para el navegador: el audio puede arrancar ya
  if (e.pointerType === "mouse") alGesto();
  try { lienzo.setPointerCapture(e.pointerId); } catch (er) {}
}, { passive: false });
lienzo.addEventListener("pointermove", (e) => {
  const p = aJuego(e.clientX, e.clientY);
  IN.raton = p; p.movido = e.pointerType === "mouse";
  if (IN.palo && IN.palo.id === e.pointerId) { IN.palo.x = p.x; IN.palo.y = p.y; }
});
function soltar(e) {
  const pl = IN.palo;
  if (pl && pl.id === e.pointerId) {
    const p = aJuego(e.clientX, e.clientY);
    // un toque (poco movimiento y corto) es un "click" para los menús
    if (Math.hypot(p.x - pl.x0, p.y - pl.y0) < 7 && performance.now() - pl.t < 600) IN.toques.push({ x: p.x, y: p.y });
    IN.palo = null;
  }
  alGesto();
}
lienzo.addEventListener("pointerup", soltar);
lienzo.addEventListener("pointercancel", (e) => { if (IN.palo && IN.palo.id === e.pointerId) IN.palo = null; });
// en Android el pointerdown de un dedo NO cuenta como gesto (memoria/juegos.md): touchend y click sí
lienzo.addEventListener("touchend", alGesto, { passive: true });
lienzo.addEventListener("click", alGesto);
lienzo.addEventListener("contextmenu", (e) => e.preventDefault());

let _completaPendiente = false;
function alGesto() {
  audioDespertar();
  if (_completaPendiente) { _completaPendiente = false; pedirCompleta(); }
}

/** El vector de movimiento de este cuadro (-1..1), del teclado o del joystick. */
function leerMovimiento() {
  let x = 0, y = 0;
  if (IN.teclas.has("izq")) x -= 1; if (IN.teclas.has("der")) x += 1;
  if (IN.teclas.has("arr")) y -= 1; if (IN.teclas.has("aba")) y += 1;
  if (x || y) { const n = Math.hypot(x, y); x /= n; y /= n; }
  const pl = IN.palo;
  if (pl) {
    let dx = pl.x - pl.x0, dy = pl.y - pl.y0;
    const d = Math.hypot(dx, dy);
    // el palo "arrastra" su base si el dedo se va lejos: así nunca queda trabado en el borde
    if (d > RADIO_PALO) { pl.x0 = pl.x - dx / d * RADIO_PALO; pl.y0 = pl.y - dy / d * RADIO_PALO; dx = pl.x - pl.x0; dy = pl.y - pl.y0; }
    const m = Math.hypot(dx, dy);
    if (m > 2) { const f = Math.min(1, (m - 2) / (RADIO_PALO * 0.55)); x = dx / m * f; y = dy / m * f; }
  }
  IN.x = x; IN.y = y;
  return IN;
}
/** Un toque/click dentro del rectángulo (lo consume). */
function tocado(x, y, w, h) {
  for (let i = 0; i < IN.toques.length; i++) { const t = IN.toques[i]; if (t.x >= x && t.x < x + w && t.y >= y && t.y < y + h) { IN.toques.splice(i, 1); return true; } }
  return false;
}
const recien = (k) => EDGE.has(k);
function finCuadroEntrada() { EDGE.clear(); IN.toques.length = 0; }

// ══════════ 03-audio.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL SONIDO, HORNEADO. Lección de Shumio (memoria/juegos.md): sintetizar en vivo NO entra en tiempo
// real en el teléfono del usuario (TCL T671E) y Android deja la salida muda. Acá cada efecto y cada
// tema se renderiza UNA vez con OfflineAudioContext (mono, 24 kHz, con la sala incluida) y en vivo
// sólo se tocan buffers: un BufferSource + un Gain por sonido.
// El contexto se crea SÓLO en un gesto de verdad (pointerup/touchend/click/keydown).
// ─────────────────────────────────────────────────────────────────────────────

const SR = 24000;
const AU = { ctx: null, master: null, mus: null, sfx: null, buf: {}, listo: false, horneando: false, tema: null, fuente: null, ultimo: {}, voces: 0 };

function audioDespertar() {
  try {
    if (!AU.ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      try { AU.ctx = new C({ sampleRate: SR, latencyHint: "playback" }); } catch (e) { AU.ctx = new C(); }
      AU.master = AU.ctx.createGain(); AU.master.connect(AU.ctx.destination);
      AU.mus = AU.ctx.createGain(); AU.mus.connect(AU.master);
      AU.sfx = AU.ctx.createGain(); AU.sfx.connect(AU.master);
      volumenes();
      // un buffer vacío tocado en el gesto destraba la salida en los WebView viejos
      const b = AU.ctx.createBuffer(1, 1, AU.ctx.sampleRate), s = AU.ctx.createBufferSource(); s.buffer = b; s.connect(AU.master); s.start();
      hornearTodo();
    }
    if (AU.ctx.state !== "running") AU.ctx.resume().catch(() => {});
  } catch (e) { /* sin audio: se juega igual */ }
}
function volumenes() { if (!AU.ctx) return; AU.mus.gain.value = G.op.musica * 0.55; AU.sfx.gain.value = G.op.efectos * 0.8; }

// ── la caja de herramientas offline: cada receta arma su grafo sobre un OfflineAudioContext ──
function _ruidoBuf(c, seg) { const b = c.createBuffer(1, Math.ceil(seg * c.sampleRate), c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
/** Una envolvente ADSR simple sobre un gain. */
function env(gn, t, a, d, s, r, dur, pico = 1) {
  const p = gn.gain; p.setValueAtTime(0.0001, t); p.linearRampToValueAtTime(pico, t + a);
  p.exponentialRampToValueAtTime(Math.max(0.0002, pico * s), t + a + d);
  p.setValueAtTime(Math.max(0.0002, pico * s), t + Math.max(a + d, dur)); p.exponentialRampToValueAtTime(0.0001, t + Math.max(a + d, dur) + r);
  return t + Math.max(a + d, dur) + r;
}
function osc(c, tipo, f, t, fin, dest, f2, tf) {
  const o = c.createOscillator(); o.type = tipo; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + (tf || (fin - t)));
  o.connect(dest); o.start(t); o.stop(fin + 0.02); return o;
}
function ruido(c, t, fin, dest, tipo = "bandpass", f = 1000, q = 1, f2) {
  const s = c.createBufferSource(); s.buffer = c.__ruido || (c.__ruido = _ruidoBuf(c, 2)); s.loop = true;
  const fl = c.createBiquadFilter(); fl.type = tipo; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, fin);
  s.connect(fl); fl.connect(dest); s.start(t); s.stop(fin + 0.02); return fl;
}
function gan(c, dest, v = 1) { const x = c.createGain(); x.gain.value = v; x.connect(dest); return x; }
/** La sala: una respuesta al impulso de ruido que se apaga (catedral chica). */
function sala(c, dest, seg = 1.6, mezcla = 0.3) {
  const cv = c.createConvolver(), n = Math.ceil(seg * c.sampleRate), b = c.createBuffer(2, n, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2); }
  cv.buffer = b; const seco = gan(c, dest, 1), hum = gan(c, dest, mezcla); cv.connect(hum);
  const ent = c.createGain(); ent.connect(seco); ent.connect(cv); return ent;
}
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);

// ── los efectos: [duración, receta(c, salida)] ──
const RECETAS = {
  gema: [0.12, (c, o) => { const x = gan(c, o); env(x, 0, 0.003, 0.05, 0.3, 0.05, 0.02, 0.5); osc(c, "sine", 1320, 0, 0.12, x, 1980, 0.04); osc(c, "triangle", 2640, 0, 0.08, gan(c, x, 0.2)); }],
  moneda: [0.35, (c, o) => { const x = gan(c, o); env(x, 0, 0.002, 0.08, 0.35, 0.22, 0.02, 0.45); osc(c, "square", 1568, 0, 0.06, gan(c, x, 0.25)); osc(c, "sine", 2093, 0.05, 0.35, x); osc(c, "sine", 3136, 0.05, 0.3, gan(c, x, 0.3)); }],
  golpe: [0.09, (c, o) => { const x = gan(c, o); env(x, 0, 0.001, 0.06, 0.2, 0.02, 0.01, 0.55); ruido(c, 0, 0.09, x, "lowpass", 2200, 1, 400); osc(c, "sine", 220, 0, 0.08, gan(c, x, 0.6), 80); }],
  muere: [0.16, (c, o) => { const x = gan(c, o); env(x, 0, 0.002, 0.1, 0.2, 0.05, 0.02, 0.4); ruido(c, 0, 0.16, x, "bandpass", 900, 1.2, 200); osc(c, "triangle", 300, 0, 0.14, gan(c, x, 0.5), 60); }],
  latigo: [0.22, (c, o) => { const x = gan(c, o); env(x, 0, 0.03, 0.12, 0.3, 0.06, 0.05, 0.5); ruido(c, 0, 0.22, x, "bandpass", 700, 2.5, 4200); }],
  magia: [0.2, (c, o) => { const x = gan(c, sala(c, o, 0.6, 0.25)); env(x, 0, 0.002, 0.12, 0.2, 0.05, 0.02, 0.28); osc(c, "sawtooth", 1800, 0, 0.18, x, 600); osc(c, "sine", 2400, 0, 0.14, gan(c, x, 0.6), 1200); }],
  cuchillo: [0.12, (c, o) => { const x = gan(c, o); env(x, 0, 0.004, 0.07, 0.2, 0.03, 0.02, 0.4); ruido(c, 0, 0.12, x, "highpass", 3000, 1, 6000); }],
  hacha: [0.3, (c, o) => { const x = gan(c, o); env(x, 0, 0.05, 0.15, 0.3, 0.08, 0.06, 0.45); ruido(c, 0, 0.3, x, "bandpass", 400, 2, 1400); }],
  cruz: [0.4, (c, o) => { const x = gan(c, sala(c, o, 1, 0.35)); env(x, 0, 0.005, 0.2, 0.2, 0.15, 0.02, 0.22); for (const f of [1760, 2217, 2637]) osc(c, "sine", f, 0, 0.35, x); }],
  fuego: [0.35, (c, o) => { const x = gan(c, o); env(x, 0, 0.01, 0.2, 0.3, 0.1, 0.05, 0.5); ruido(c, 0, 0.35, x, "lowpass", 1400, 0.7, 300); osc(c, "sawtooth", 110, 0, 0.3, gan(c, x, 0.15), 60); }],
  rayo: [0.6, (c, o) => { const x = gan(c, sala(c, o, 1.2, 0.3)); env(x, 0, 0.001, 0.05, 0.4, 0.45, 0.03, 0.7); ruido(c, 0, 0.6, x, "lowpass", 7000, 0.5, 200); osc(c, "sawtooth", 90, 0, 0.5, gan(c, x, 0.3), 35); }],
  agua: [0.45, (c, o) => { const x = gan(c, o); env(x, 0, 0.002, 0.1, 0.3, 0.3, 0.02, 0.4); ruido(c, 0, 0.45, x, "bandpass", 3000, 3, 500); for (const f of [2800, 3500]) osc(c, "sine", f, 0, 0.08, gan(c, x, 0.3)); }],
  runa: [0.18, (c, o) => { const x = gan(c, o); env(x, 0, 0.002, 0.1, 0.2, 0.05, 0.02, 0.25); osc(c, "square", 880, 0, 0.16, gan(c, x, 0.4), 1760); }],
  dolor: [0.3, (c, o) => { const x = gan(c, o); env(x, 0, 0.004, 0.15, 0.3, 0.1, 0.03, 0.6); osc(c, "sawtooth", 220, 0, 0.28, x, 70); ruido(c, 0, 0.12, gan(c, x, 0.5), "lowpass", 900); }],
  subir: [1.1, (c, o) => { const x = gan(c, sala(c, o, 1.4, 0.35)); [72, 76, 79, 84, 88].forEach((m, i) => { const t = i * 0.07, y = gan(c, x); env(y, t, 0.004, 0.15, 0.4, 0.5, 0.05, 0.28); osc(c, "triangle", mtof(m), t, t + 0.75, y); osc(c, "sine", mtof(m + 12), t, t + 0.5, gan(c, y, 0.3)); }); }],
  elegir: [0.7, (c, o) => { const x = gan(c, sala(c, o, 1.2, 0.35)); [79, 84, 91].forEach((m, i) => { const y = gan(c, x); env(y, i * 0.05, 0.003, 0.1, 0.3, 0.35, 0.03, 0.3); osc(c, "triangle", mtof(m), i * 0.05, 0.65, y); }); }],
  clic: [0.06, (c, o) => { const x = gan(c, o); env(x, 0, 0.001, 0.03, 0.1, 0.02, 0.005, 0.35); osc(c, "square", 1200, 0, 0.05, gan(c, x, 0.35), 800); }],
  mover: [0.05, (c, o) => { const x = gan(c, o); env(x, 0, 0.001, 0.025, 0.1, 0.02, 0.005, 0.2); osc(c, "triangle", 900, 0, 0.04, x); }],
  no: [0.2, (c, o) => { const x = gan(c, o); env(x, 0, 0.002, 0.1, 0.4, 0.05, 0.08, 0.35); osc(c, "square", 160, 0, 0.18, gan(c, x, 0.5)); osc(c, "square", 151, 0, 0.18, gan(c, x, 0.5)); }],
  cofre: [0.5, (c, o) => { const x = gan(c, sala(c, o, 1, 0.3)); env(x, 0, 0.002, 0.15, 0.3, 0.3, 0.02, 0.6); ruido(c, 0, 0.3, x, "lowpass", 800); osc(c, "sine", 140, 0, 0.3, gan(c, x, 0.7), 60); }],

// EL PINTOR: todo el arte sale de acá, dibujado por código a escala 1 (un píxel = un píxel).
// Volúmenes sombreados con rampas cortas de una paleta limitada (luz de arriba a la izquierda,
// borde oscuro, tramado Bayer en los cambios de tono), contorno oscuro de 1 px, y los detalles
// (ojos, bocas, manchas, grietas) puestos a mano con sellos de texto. Nada de antialias.
// Cada sprite se hornea UNA vez en un canvas chico y se cachea.
// ─────────────────────────────────────────────────────────────────────────────

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => v / 16 - 0.47);
const bayer = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
// El original se ve "dibujado", no retro: tonos planos con bordes limpios, sin tramado. El tramado
// queda apagado en los volúmenes (bola, caja); sólo lo usan, a propósito, algunas texturas.
const SIN_TRAMA = 0;
// El contorno de los dibujos: no es negro, es el mismo color del objeto bien oscuro (como el gris
// oscuro de las vasijas del original). Se pide con AUTO; las letras siguen con negro.
const AUTO = "auto";

// La paleta: pocos colores, apagados, que conversan entre sí (lo que da unidad).
const PAL = {
  tinta: "#120a0e",          // el contorno de todo (no negro puro)
  piel: ["#4a302f", "#7d5752", "#b8908a", "#dfbfb2", "#f6e4da"],
  hongo: ["#2c0b10", "#5e161b", "#962824", "#c9442f", "#e9735a"],
  crema: ["#6e6150", "#a89a82", "#d9ccb2", "#f1e8d6"],
  musgo: ["#141c12", "#243320", "#3a5130", "#58734a", "#83a068"],
  espora: ["#133034", "#2e6a6a", "#5ea8a0", "#a8e2d4", "#effff9"],
  piedra: ["#15181a", "#262c2c", "#3a4240", "#566058", "#7b8577", "#a2ab9a"],
  tierra: ["#170f0b", "#2c1d14", "#48301f", "#6b4a31", "#8f6a48", "#b58f67"],
  sangre: ["#2a0508", "#5c0c12", "#98161c", "#cf2b2b", "#f25a4a"],
  baba: ["#1b1d0a", "#3f4414", "#6b7020", "#9ea235", "#d0d06a"],
  oro: ["#3a2408", "#6e4a10", "#b07e1c", "#e0b43a", "#fbe58a"],
  hueso: ["#3b342c", "#6f6456", "#a99a86", "#d8cdb9", "#f5efe3"],
  violeta: ["#1d0f2c", "#3a1f56", "#5e3589", "#8c5cc0", "#c19ae8"],
  hielo: ["#0f2436", "#1f4d6e", "#3f82a8", "#7fbfdc", "#d2f1ff"],
  fuego: ["#3a0c04", "#8a2206", "#d65410", "#f59a26", "#ffe07a"],
  hierro: ["#0e1012", "#23272b", "#3d444a", "#5f686e", "#8d979b"],
  azul: ["#0d1530", "#1c2e62", "#2f4f9c", "#5480d4", "#9cc0f4"],
};

function lienzoNuevo(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }

class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.d = new Array(w * h).fill(null); }
  dentro(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
  p(x, y, c) { x = Math.floor(x); y = Math.floor(y); if (c && this.dentro(x, y)) this.d[y * this.w + x] = c; return this; }
  g(x, y) { x = Math.floor(x); y = Math.floor(y); return this.dentro(x, y) ? this.d[y * this.w + x] : null; }
  borrar(x, y) { if (this.dentro(x, y)) this.d[y * this.w + x] = null; }
  /** Un volumen elíptico sombreado. rampa: de oscuro a claro. filtro(x, y) → false para no pintar ese píxel. */
  bola(cx, cy, rx, ry, rampa, o = {}) {
    const L = o.luz || [-0.52, -0.62, 0.58], n = rampa.length, bajar = o.bajar ?? 0.18, trama = SIN_TRAMA * (o.trama ?? 0.9);
    for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
      const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry, r2 = nx * nx + ny * ny;
      if (r2 > 1 || (o.filtro && !o.filtro(x, y))) continue;
      const nz = Math.sqrt(1 - r2);
      let l = -nx * L[0] - ny * L[1] + nz * L[2];          // lambert
      l = l * 0.5 + 0.5 - bajar * r2 * r2;                  // el borde, más oscuro (como el original)
      // degradé continuo entre los tonos de la rampa (se ve pintado, no escalonado); o.plano: a tonos
      if (o.plano) { const i = Math.floor(l * n + bayer(x, y) * trama); this.p(x, y, rampa[lim(i + (o.corrimiento || 0), 0, n - 1)]); continue; }
      const f = lim(l * n - 0.5 + (o.corrimiento || 0), 0, n - 1), i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1);
      this.p(x, y, i0 === i1 ? rampa[i0] : mezclarCache(rampa[i0], rampa[i1], Math.round((f - i0) * 6) / 6));
    }
    return this;
  }
  /** Un rectángulo sombreado de arriba (claro) a abajo (oscuro). */
  caja(x0, y0, w, h, rampa, o = {}) {
    const n = rampa.length;
    for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
      const t = 1 - (y - y0 + 0.5) / h, u = 1 - (x - x0 + 0.5) / w;
      const l = (o.vertical ?? 0.75) * t + (1 - (o.vertical ?? 0.75)) * u;
      if (o.plano) { this.p(x, y, rampa[lim(Math.floor(l * n), 0, n - 1)]); continue; }
      const f = lim(l * n - 0.5, 0, n - 1), i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1);
      this.p(x, y, i0 === i1 ? rampa[i0] : mezclarCache(rampa[i0], rampa[i1], Math.round((f - i0) * 6) / 6));
    }
    return this;
  }
  rect(x0, y0, w, h, c) { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) this.p(x, y, c); return this; }
  linea(x0, y0, x1, y1, c) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
    for (let i = 0; i <= n; i++) this.p(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), c);
    return this;
  }
  /** Un sello de texto: cada letra es un color de la paleta (espacio o '.' = nada). */
  sello(x0, y0, filas, pal) {
    filas.forEach((f, y) => { for (let x = 0; x < f.length; x++) { const k = f[x]; if (k !== "." && k !== " " && pal[k]) this.p(x0 + x, y0 + y, pal[k]); } });
    return this;
  }
  /** Contorno por fuera de lo pintado (4 vecinos; con esquinas = 8). */
  contorno(c = PAL.tinta, esquinas = false) {
    const lleno = this.d.map((v) => v !== null), w = this.w, orig = this.d.slice();
    for (let y = 0; y < this.h; y++) for (let x = 0; x < w; x++) {
      if (lleno[y * w + x]) continue;
      const v = (dx, dy) => { const X = x + dx, Y = y + dy; return X >= 0 && Y >= 0 && X < w && Y < this.h && lleno[Y * w + X]; };
      const toca = v(1, 0) || v(-1, 0) || v(0, 1) || v(0, -1) || (esquinas && (v(1, 1) || v(-1, 1) || v(1, -1) || v(-1, -1)));
      if (!toca) continue;
      if (c !== AUTO) { this.d[y * w + x] = c; continue; }
      // AUTO: el promedio de los vecinos pintados, llevado casi a negro (con su tinte)
      let r = 0, g = 0, b = 0, n = 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (v(dx, dy)) { const q = rgba(orig[(y + dy) * w + x + dx]); r += q[0]; g += q[1]; b += q[2]; n++; }
      if (!n) { r = 40; g = 30; b = 34; n = 1; }
      this.d[y * w + x] = hex(r / n * 0.3 + 10, g / n * 0.26 + 6, b / n * 0.28 + 8);
    }
    return this;
  }
  /** Oscurece los píxeles del borde de lo pintado (un "contorno interior" de color). */
  bordeInterior(mapa) {
    const lleno = this.d.map((v) => v !== null), w = this.w, cambios = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < w; x++) {
      if (!lleno[y * w + x]) continue;
      const v = (dx, dy) => { const X = x + dx, Y = y + dy; return X >= 0 && Y >= 0 && X < w && Y < this.h && lleno[Y * w + X]; };
      if (!v(1, 0) || !v(-1, 0) || !v(0, 1) || !v(0, -1)) { const c = this.d[y * w + x], n = mapa[c]; if (n) cambios.push([x, y, n]); }
    }
    for (const [x, y, c] of cambios) this.p(x, y, c);
    return this;
  }
  espejo() { const q = new Pix(this.w, this.h); for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) q.d[y * this.w + (this.w - 1 - x)] = this.d[y * this.w + x]; return q; }
  copiar() { const q = new Pix(this.w, this.h); q.d = this.d.slice(); return q; }
  pegar(o, dx, dy) { for (let y = 0; y < o.h; y++) for (let x = 0; x < o.w; x++) { const c = o.d[y * o.w + x]; if (c) this.p(x + dx, y + dy, c); } return this; }
  /** Tiñe todo (para el blanco del golpe, o un campeón). */
  tenido(fn) { const q = this.copiar(); q.d = q.d.map((c) => (c ? fn(c) : c)); return q; }
  canvas() {
    const c = lienzoNuevo(this.w, this.h), g = c.getContext("2d"), im = g.createImageData(this.w, this.h);
    for (let i = 0; i < this.d.length; i++) {
      const col = this.d[i];
      if (!col) continue;
      const [r, gg, b, a] = rgba(col);
      im.data[i * 4] = r; im.data[i * 4 + 1] = gg; im.data[i * 4 + 2] = b; im.data[i * 4 + 3] = a;
    }
    g.putImageData(im, 0, 0);
    return c;
  }
}

const _rgba = new Map();
function rgba(col) {
  let v = _rgba.get(col);
  if (v) return v;
  if (col[0] === "#") {
    const n = parseInt(col.slice(1, 7), 16);
    v = [(n >> 16) & 255, (n >> 8) & 255, n & 255, col.length > 7 ? parseInt(col.slice(7, 9), 16) : 255];
  } else { const m = col.match(/[\d.]+/g).map(Number); v = [m[0], m[1], m[2], Math.round((m[3] ?? 1) * 255)]; }
  _rgba.set(col, v);
  return v;
}
function hex(r, g, b) { return "#" + [r, g, b].map((x) => lim(Math.round(x), 0, 255).toString(16).padStart(2, "0")).join(""); }
const _mezclas = new Map();
function mezclarCache(a, b, t) { const k = a + b + t; let v = _mezclas.get(k); if (!v) { v = mezclar(a, b, t); _mezclas.set(k, v); } return v; }
function mezclar(a, b, t) { const A = rgba(a), B = rgba(b); return hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); }
/** Una rampa nueva desde un color base (para campeones y ítems). */
function rampaDe(base, n = 5) { const out = []; for (let i = 0; i < n; i++) { const t = i / (n - 1); out.push(t < 0.5 ? mezclar("#0b0709", base, 0.25 + t * 1.5) : mezclar(base, "#fff6ea", (t - 0.5) * 0.9)); } return out; }

// ── la caché de sprites ──
const SPR = {};
function hornear(clave, fn) { if (!SPR[clave]) SPR[clave] = fn(); return SPR[clave]; }
/** El mismo sprite todo blanco (el destello de cuando le pegan). */
const _blancos = new WeakMap();
function blanco(c) {
  let b = _blancos.get(c);
  if (b) return b;
  b = lienzoNuevo(c.width, c.height);
  const g = b.getContext("2d"); g.drawImage(c, 0, 0); g.globalCompositeOperation = "source-in"; g.fillStyle = "#fff4f0"; g.fillRect(0, 0, b.width, b.height);
  _blancos.set(c, b);
  return b;
}
const _rojos = new WeakMap();
function rojizo(c) {
  let b = _rojos.get(c);
  if (b) return b;
  b = lienzoNuevo(c.width, c.height);
  const g = b.getContext("2d"); g.drawImage(c, 0, 0); g.globalCompositeOperation = "source-atop"; g.fillStyle = "rgba(220,30,30,0.55)"; g.fillRect(0, 0, b.width, b.height);
  _rojos.set(c, b);
  return b;
}

/** La sombra en el piso: una elipse de píxeles duros, semitransparente. */
function sombra(rx, ry) {
  return hornear(`sombra${rx}x${ry}`, () => {
    const p = new Pix(rx * 2 + 1, ry * 2 + 1);
    for (let y = 0; y < p.h; y++) for (let x = 0; x < p.w; x++) {
      const nx = (x + 0.5 - p.w / 2) / (rx + 0.5), ny = (y + 0.5 - p.h / 2) / (ry + 0.5), r = nx * nx + ny * ny;
      if (r <= 1) p.p(x, y, r < 0.45 ? "rgba(4,2,6,0.46)" : "rgba(4,2,6,0.30)");
    }
    return p.canvas();
  });
}

// ══════════ 05-fuente.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LA LETRA. Medido en capturas del original (wiki, pantalla de subir de nivel): el texto es una
// máquina de escribir con remates (tipo Courier) en negrita, blanca con contorno negro, nítida a la
// resolución de la pantalla. Acá: Courier Prime Bold (OFL), embebida, dibujada en la pasada de
// interfaz y cacheada por texto. La letra de píxeles de abajo queda sólo para el logo:
// una fuente de píxeles propia con mayúsculas (5×7, la de Shumio), minúsculas con
// ascendentes y descendentes, tildes, Ñ y signos. Cada texto se hornea UNA vez (degradé por fila,
// contorno negro) y se cachea: dibujar cientos de números por cuadro sale casi gratis.
// ─────────────────────────────────────────────────────────────────────────────

const GLIFOS = {

  S: ".####|#....|#....|.###.|....#|....#|####.", T: "#####|..#..|..#..|..#..|..#..|..#..|..#..", U: "#...#|#...#|#...#|#...#|#...#|#...#|.###.",
  V: "#...#|#...#|#...#|#...#|.#.#.|.#.#.|..#..", W: "#...#|#...#|#...#|#.#.#|#.#.#|##.##|#...#", X: "#...#|#...#|.#.#.|..#..|.#.#.|#...#|#...#",
  Y: "#...#|#...#|.#.#.|..#..|..#..|..#..|..#..", Z: "#####|....#|...#.|..#..|.#...|#....|#####",

  "¡": "#|.|#|#|#|#|#", "¿": "..#..|.....|..#..|.#...|#....|#...#|.###.", "'": "#|#|.|.|.|.|.", "-": "....|....|....|####|....|....|....", "+": ".....|..#..|..#..|#####|..#..|..#..|.....",
  "/": "....#|....#|...#.|..#..|.#...|#....|#....", "%": "##..#|##..#|...#.|..#..|.#...|#..##|#..##", "(": ".#|#.|#.|#.|#.|#.|.#", ")": "#.|.#|.#|.#|.#|.#|#.", "×": ".....|#...#|.#.#.|..#..|.#.#.|#...#|.....",

  "♥": ".....|##.##|#####|#####|.###.|..#..|.....", "♦": "..#..|.###.|#####|#####|.###.|..#..|.....",

// las minúsculas: 9 filas (0-1 ascendentes, 2-6 el cuerpo, 7-8 descendentes)
const MINUS = {

  t: ".#..|.#..|####|.#..|.#..|.#..|..##|....|....", u: ".....|.....|#...#|#...#|#...#|#...#|.####|.....|.....",
  v: ".....|.....|#...#|#...#|#...#|.#.#.|..#..|.....|.....", w: ".....|.....|#...#|#...#|#.#.#|#.#.#|.#.#.|.....|.....",
  x: ".....|.....|#...#|.#.#.|..#..|.#.#.|#...#|.....|.....", y: ".....|.....|#...#|#...#|#...#|#...#|.####|....#|.###.",
  z: ".....|.....|#####|...#.|..#..|.#...|#####|.....|.....",

// tildes: la letra base con la marca encima. Mayúsculas: en las 2 filas de aire; minúsculas: en su fila 0-1
const MARCAS = { "Á": "A´", "É": "E´", "Í": "I´", "Ó": "O´", "Ú": "U´", "Ñ": "N~", "Ü": "U¨", "á": "a´", "é": "e´", "í": "i´", "ó": "o´", "ú": "u´", "ñ": "n~", "ü": "u¨" };
const ALTO_LETRA = 11;           // 2 de aire para tildes + 9 de letra
const _glifo = {};
function glifo(ch) {
  if (_glifo[ch]) return _glifo[ch];
  let filas;
  if (MINUS[ch]) filas = MINUS[ch].split("|");
  else { const gl = GLIFOS[ch] || GLIFOS[ch.toUpperCase()] || GLIFOS["?"]; filas = gl.split("|"); filas.push("", ""); }
  return (_glifo[ch] = { w: Math.max(...filas.map((f) => f.length)), filas });
}
function anchoLetra(ch) { const m = MARCAS[ch]; return glifo(m ? m[0] : ch).w; }

  if (o.zombi) brazo(13 + ag, Y + 16, R4(mezclar(o.ropa, "#000000", 0.35)), true);
  else brazo(6 + paso, Y + 14, R4(mezclar(o.ropa, "#000000", 0.35)), false);
  // torso, cinto y cuello
  p.caja(7, Y + 13, 9, 8, ropa, { vertical: 0.55 });
  p.rect(7, Y + 13, 9, 1, ropa[3]);
  if (o.cinto !== 0) { p.rect(7, Y + 19, 9, 1, o.cinto || "#2a1a10"); p.p(11, Y + 19, "#e0b040"); }
  if (o.vendas) for (let y = Y + 13; y < Y + 28; y += 2) for (let x = 6; x < 17; x++) if (p.g(x, y) && (x + y) % 5 === 0) p.p(x, y, mezclar(o.ropa, "#3a2a18", 0.45));
  if (o.harapos) for (const x of [8, 11, 14]) { p.borrar(x, Y + 20); p.p(x + 1, Y + 20, ropa[0]); }
  p.rect(10 + ag, Y + 12, 3, 1, piel[1]);
  // cabeza (redonda, 9×10) con la luz arriba a la izquierda
  const hx = 11.5 + ag, hy = Y + 7.5 + ag * 0.5;
  p.bola(hx, hy, 4.6, 4.9, piel);
  // pelo
  if (o.pelo && o.peinado !== "calvo") {
    const pe = R4(o.pelo);
    if (o.peinado === "capucha") {
      const cap = R4(o.capucha || o.pelo);
      p.bola(hx - 0.5, hy - 0.5, 5.8, 6, cap);
      for (let y = Math.floor(hy - 3); y <= hy + 3; y++) for (let x = Math.floor(hx); x <= hx + 5; x++) if ((x - hx - 1.2) ** 2 / 14 + (y - hy - 0.5) ** 2 / 12 < 1) p.p(x, y, piel[x > hx + 3 ? 2 : 1]);
    } else {
      p.bola(hx - 0.7, hy - 2.2, 5, 3.4, pe, { filtro: (x, y) => y <= hy - 1 });
      for (let x = Math.floor(hx) ; x <= hx + 3; x++) p.p(x, Math.floor(hy - 2), pe[1]);
      p.caja(Math.floor(hx - 5), Math.floor(hy - 3), 3, 6, pe);
      if (o.peinado === "largo") p.caja(Math.floor(hx - 5), Math.floor(hy - 1), 3, 10, pe, { vertical: 0.2 });
      if (o.peinado === "cola") p.bola(hx - 6, hy + 2, 1.8, 3.6, pe);
      if (o.peinado === "moño") p.bola(hx - 2, hy - 5.8, 2.4, 2, pe);
      if (o.peinado === "pelado") for (const x of [0, 2, 4]) p.p(Math.floor(hx - 3 + x), Math.floor(hy - 5), pe[1]);
    }
  }
  // cara: ojos, boca, barba
  const ex = Math.floor(hx + 1), ey = Math.floor(hy);
  const ojo = o.ojos || "#1a1016";
  p.p(ex, ey, ojo); p.p(ex, ey + 1, ojo); p.p(ex + 2, ey, ojo); p.p(ex + 2, ey + 1, ojo);
  if (!o.ojos) { p.p(ex, ey - 1, piel[3]); }
  p.p(ex + 2, ey + 3, piel[0]);
  if (o.barba) { const b = R4(o.barba); p.caja(Math.floor(hx - 1), Math.floor(hy + 2), 6, 4, b); p.p(ex + 2, ey + 3, b[0]); }
  // sombreros
  if (o.sombrero === "bruja") { const s = R4(o.somCol || "#2a2a5a"); p.rect(4, Y + 2, 15, 2, s[1]); p.rect(4, Y + 3, 15, 1, s[0]); tri(p, 7, Y + 2, 16, Y + 2, 10, Y - 6, s[2]); tri(p, 10, Y - 6, 7, Y + 2, 9, Y + 2, s[1]); }
  if (o.sombrero === "corona") { const c = ["#8a5a10", "#e0a020", "#ffe070"]; p.rect(8, Y + 2, 8, 2, c[1]); for (const x of [8, 11, 15]) { p.p(x, Y + 1, c[2]); p.p(x, Y, c[2]); } p.p(12, Y + 2, "#ff4050"); }
  if (o.sombrero === "boina") { const s = R4(o.somCol || "#6a1a2a"); p.bola(11, Y + 3, 6, 2.4, s); }
  if (o.sombrero === "tricornio") { const s = R4(o.somCol || "#2a1a14"); p.rect(4, Y + 3, 15, 2, s[1]); p.bola(11.5, Y + 2, 4.6, 2.6, s); p.p(4, Y + 2, s[2]); p.p(18, Y + 2, s[2]); }
  // brazo de adelante (tapa el torso)
  if (o.zombi) brazo(12 + ag, Y + 14, ropa, true);
  else brazo(15 - paso, Y + 14, ropa, false);
  if (o.arma === "baston") { p.linea(18 - paso, Y + 6, 18 - paso, Y + 29, "#6a4a2a"); p.p(18 - paso, Y + 5, "#ffe070"); }
  p.contorno(AUTO, true);
  return p;
}

/** El sprite de un enemigo: cuadro 0/1, mirando a la izquierda o no, con su tinte. */
function enemigoSpr(spr, cuadro, izq, tinte) {
  return hornear(`ene2|${spr}|${cuadro}|${izq}|${tinte || ""}`, () => {
    let px = CUERPOS[spr](cuadro);
    if (tinte) px = px.tenido((c) => mezclar(c, tinte, 0.5));
    if (izq) px = px.espejo();
    const c = px.canvas();
    if (spr === "fantasma") { const q = lienzoNuevo(c.width, c.height), x = q.getContext("2d"); x.globalAlpha = 0.85; x.drawImage(c, 0, 0); return q; }
    return c;
  });
}

function iconoSpr(k) {
  return hornear(`ico|${k}`, () => {
    if (ICONO_EVO[k]) {
      const [base, cambios] = ICONO_EVO[k], px = sello(ICONOS[base], { ...PS, ...cambios });

      for (const [x, y] of [[1, 1], [12, 2], [2, 12], [12, 12]]) px.p(x, y, "#ffffff");
      return px.canvas();
    }
    return sello(ICONOS[k] || ICONOS._salto).canvas();
  });
}
/** El marco de un ícono: el HUD del original pone cada arma en una cajita oscura con borde. */
function marcoIcono(x, y, k, nivel, max) {
  g.fillStyle = "#0c0a18"; g.fillRect(x, y, 14, 14);
  g.fillStyle = max ? "#e0a020" : "#5a5a7a"; g.fillRect(x, y, 14, 1); g.fillRect(x, y + 13, 14, 1); g.fillRect(x, y, 1, 14); g.fillRect(x + 13, y, 1, 14);
  if (k) g.drawImage(iconoSpr(k), x, y);
}

function precioMejora(clave) {
  const m = MEJORAS.find((x) => x[0] === clave), ya = G.mejoras[clave] || 0;
  const total = Object.values(G.mejoras).reduce((s, v) => s + v, 0);
  return Math.floor(m[2] * (1 + ya) + (total > 0 ? Math.floor(20 * Math.pow(1.1, total)) : 0));
}

function xpPara(nivel) {
  let r = 5;
  for (let l = 2; l <= nivel; l++) r += l <= 20 ? 10 : l <= 40 ? 13 : 16;
  return r + (nivel === 20 ? 600 : 0) + (nivel === 40 ? 2400 : 0);
}

// EL MUNDO: un suelo sin fin armado con baldosas de 32 px horneadas (pasto con matas y flores,
// camino de tierra en vertical como el bosque de las capturas) y adornos puestos por un hash de la
// celda: la misma celda, el mismo árbol, siempre, sin guardar nada.
// Los adornos no chocan: en el original el bosque es abierto, lo que importa es la multitud.
// ─────────────────────────────────────────────────────────────────────────────

const BAL = 32;
const hashCelda = (x, y, s = 0) => { let h = (x * 374761393 + y * 668265263 + s * 2246822519) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

const SUELOS = {
  pasto: { base: ["#2c4a1c", "#34581f", "#3e6624", "#4a742a"], matas: ["#223c16", "#5a8634", "#6a9a3c"], flores: ["#e8e0c8", "#ff90c0", "#ffe070", "#a0c0ff"], tierra: ["#4a3420", "#5a4028", "#6a4c30", "#7a5a38"], fondo: "#2c4a1c" },
  tumbas: { base: ["#1c2420", "#222c26", "#28342c", "#2e3a30"], matas: ["#141a16", "#3a4a3a", "#4a5a46"], flores: ["#8a8aa0", "#6a5a7a", "#c8c8d8", "#5a7a6a"], tierra: ["#2a2622", "#322c28", "#3a342e", "#443c34"], fondo: "#1c2420" },
};
/** Una baldosa de pasto: manchas de tono, matitas y (a veces) flores. */
function baldosaSpr(suelo, v) {
  return hornear(`bal|${suelo}|${v}`, () => {
    const S = SUELOS[suelo], p = new Pix(BAL, BAL), r = mulberry(1000 + v * 77);
    for (let y = 0; y < BAL; y++) for (let x = 0; x < BAL; x++) {
      // ruido suave y periódico (sin costuras entre baldosas): suma de senos con períodos que dividen 32
      const n = Math.sin((x + v * 5) * TAU / 32) * Math.cos((y + v * 3) * TAU / 16) * 0.5 + Math.sin((x + y) * TAU / 32 + v) * 0.5;
      p.p(x, y, S.base[lim(Math.floor((n * 0.5 + 0.5) * 3.2 + r() * 0.9), 0, 3)]);
    }
    for (let i = 0; i < 9; i++) { const x = Math.floor(r() * BAL), y = Math.floor(r() * BAL); p.p(x, y, S.matas[1]); p.p(x, y - 1, S.matas[2]); p.p(x - 1, y, S.matas[0]); p.p(x + 1, y + 1, S.matas[0]); }
    if (v % 3 === 0) for (let i = 0; i < 3; i++) { const x = 2 + Math.floor(r() * 28), y = 2 + Math.floor(r() * 28), c = S.flores[Math.floor(r() * 4)]; p.p(x, y, c); p.p(x + 1, y, c); p.p(x, y + 1, c); p.p(x + 1, y + 1, S.matas[0]); }
    return p.canvas();
  });
}
/** El camino de tierra: una franja vertical con bordes mordidos y piedritas. */
function caminoSpr(suelo, v) {
  return hornear(`cam|${suelo}|${v}`, () => {
    const S = SUELOS[suelo], p = new Pix(BAL, BAL), r = mulberry(5000 + v * 31);
    for (let y = 0; y < BAL; y++) for (let x = 0; x < BAL; x++) p.p(x, y, S.tierra[lim(Math.floor(1.2 + Math.sin((y + v * 7) * TAU / 32) * 0.6 + r() * 1.8), 0, 3)]);
    for (let i = 0; i < 6; i++) { const x = Math.floor(r() * BAL), y = Math.floor(r() * BAL); p.p(x, y, S.tierra[3]); p.p(x + 1, y, S.tierra[0]); }
    return p.canvas();
  });
}
function bordeCaminoSpr(suelo, lado) {
  return hornear(`bcam|${suelo}|${lado}`, () => {

// ══════════ 10-jugador.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL JUGADOR Y SUS NÚMEROS: la partida (J), las estadísticas que salen de sumar personaje +
// mejoras de la tienda + pasivos + bonus por nivel (como el original: todo se recalcula de cero,
// así nunca se desincroniza), y los parámetros finales de cada arma.
// ─────────────────────────────────────────────────────────────────────────────

let J = null;       // la partida en curso

function nuevaPartida(pj, esc, semilla = (Math.random() * 1e9) | 0) {

    jug: { x: 0, y: 0, vx: 0, vy: 0, mirX: 1, mirY: 0, izq: false, vida: 1, inv: 0, paso: 0, moviendo: false, golpe: 0, curado: 0, ultCritCura: -9 },
    enemigos: [], proys: [], zonas: [], gemas: [], cosas: [], efectos: [], numeros: [], rayos: [],
    kills: 0, oro: 0, nivel: 1, xp: 0, xpSig: xpPara(1), pendientes: 0,
    armas: [], pasivos: [], desterrados: new Set(), evolucionesHechas: [],

    revividas: 0, congelado: 0, fuegoBoca: 0, cam: { x: -W / 2, y: -H / 2 }, temblor: 0, destello: 0,
    spawnT: 0, minuto: -1, eventos: [], brasT: 0, cofres: 0, modal: null, cartel: null, rojaGrande: null, sanado: 0,

  for (let i = 0; i < 10; i++) aparecer(J.E.oleadas[0].e[0]);
  return J;
}

const ST_BASE = { vidaMax: 100, recup: 0, armadura: 0, velMov: 1, poder: 1, area: 1, vel: 1, dur: 1, cant: 0, cd: 1, suerte: 1, crec: 1, codicia: 1, maldicion: 1, revivir: 0 };
/** Recalcula todo de cero. Lo multiplicativo (vida, imán) se multiplica; lo demás se suma. */
function recalcular() {
  const P = PERSONAJES[J.pj], st = { ...ST_BASE };
  let vidaMult = 1, imanMult = 1;
  const sumar = (o, k = 1) => { for (const [c, v] of Object.entries(o)) { if (c === "vidaMult") vidaMult *= 1 + v * k; else if (c === "imanMult") imanMult *= 1 + v * k; else if (c === "vidaMax") st.vidaMax += v * k; else st[c] = (st[c] || 0) + v * k; } };
  sumar(P.st);
  for (const m of MEJORAS) if (G.mejoras[m[0]] && !["rerolls", "saltos", "destierros"].includes(m[0])) sumar(m[4], G.mejoras[m[0]]);
  for (const p of J.pasivos) if (p.k !== "orbe") sumar(PASIVOS[p.k].st, p.nivel);
  sumar(P.crece(J.nivel));
  // lo temporal del personaje (Perla, Clementina) se apaga en el primer minuto de partida
  if (P.temp) sumar(P.temp, Math.max(0, 1 - J.t / 60));
  st.vidaMax = Math.round(st.vidaMax * vidaMult);
  const orbe = J.pasivos.find((p) => p.k === "orbe");
  st.iman = 30 * imanMult * IMAN_ORBE[orbe ? orbe.nivel : 0];
  st.cd = Math.max(0.1, st.cd);

// ─────────────────────────────────────────────────────────────────────────────
// LAS ARMAS: tiran solas. Cada una tiene su recarga; al cumplirse suelta una ráfaga de "cant"
// disparos separados por "int" segundos (como el original). Proyectiles con perforación, zonas que
// pegan cada tanto (re-golpe), y el daño se anota por arma para la tabla de resultados.
// ─────────────────────────────────────────────────────────────────────────────

const TAM = { latigoL: 64, latigoA: 14, ajo: 26, libro: 36, agua: 16, rayo: 12 };

function pasoArmas(dt) {
  const j = J.jug;
  for (const a of J.armas) {
    const p = paramsArma(a);
    if (a.k === "ajo" || a.k === "devora") { auraAjo(a, p, dt); continue; }
    if ((a.k === "libro" || a.k === "visperas") && a.libros && (a.libros.t > 0 || p.eterna)) { a.libros.t -= dt; if (a.libros.t > 0 || p.eterna) continue; }
    // la ráfaga en curso
    if (a.cola > 0) {
      a.tInt -= dt;
      while (a.cola > 0 && a.tInt <= 0) { disparar(a, p, p.cant - a.cola); a.cola--; a.tInt += p.int || 0; if (!p.int) a.tInt = 0; }
      continue;
    }
    a.t -= dt;
    if (a.t <= 0) {
      a.t = p.cd;
      if (a.k === "libro" || a.k === "visperas") { crearLibros(a, p); continue; }
      a.cola = Math.round(p.cant); a.tInt = 0;
      const s = (ARMAS[a.k] || ARMAS[EVOS[a.k].de]).sfx;
      if (s) sfx(s, 0.45);

  pasoProys(dt);
  pasoZonas(dt);
  pasoRayos(dt);
}

}

}
const enPantalla = (x, y, m = 0) => x > J.cam.x - m && x < J.cam.x + W + m && y > J.cam.y - m && y < J.cam.y + H + m;

    }

/** Un rayo: cae de arriba, pega en área y deja la marca. */
function rayo(x, y, r, dano, a, emp) {

}

function pasoRayos(dt) { for (let i = J.rayos.length - 1; i >= 0; i--) { const r = J.rayos[i]; if ((r.t -= dt) <= 0) { rayo(r.x, r.y, r.r, r.dano, r.a, r.emp); J.rayos.splice(i, 1); } } }

}

function crearLibros(a, p) {
  a.libros = { t: p.dur, n: Math.round(p.cant), golpeados: new Map() };
  sfx("cruz", 0.3);
}
function auraAjo(a, p, dt) {
  const j = J.jug, r = TAM.ajo * p.area;
  a.radio = r;
  a.t -= dt;
  if (a.t > 0) return;
  a.t = 0.1;
  // devoraalmas: +1 de daño por cada 60 de vida curada (hasta +60)
  const extra = a.k === "devora" ? Math.min(60, Math.floor(J.sanado / 60)) : 0;
  const cd = p.cd;
  cercanos(j.x, j.y - 4, r, (e) => {
    const ult = e.ajo || -99;
    if (J.t - ult < cd) return;
    e.ajo = J.t;
    // cada golpe del ajo les baja la resistencia al empuje (+0,3) y al congelamiento
    e.empExtra = Math.min(1, (e.empExtra || 0) + 0.3);
    golpear(e, p.dano + extra, 0.6, a, e.x - j.x, e.y - j.y);
  });
}

function pasoProys(dt) {
  const j = J.jug;
  for (let i = J.proys.length - 1; i >= 0; i--) {
    const q = J.proys[i];
    q.vida -= dt;
    if (q.tipo === "tajo") {
      // el latigazo arranca DESDE el cuerpo (tapándolo): si deja un hueco, lo que se te pega encima nunca muere
      q.x = j.x + q.dx * (q.largo / 2 - 8); q.y = j.y + q.dy;
      if (!q.pego) { q.pego = 1; golpearRect(q, q.x - q.largo / 2, q.y - q.alto / 2, q.largo, q.alto); }
    } else if (q.tipo === "frasco") {
      const t = 1 - q.vida / q.vidaMax;
      q.x = lerp(q.x0, q.tx, t); q.y = lerp(q.y0, q.ty, t) - Math.sin(t * Math.PI) * 30; q.rot += dt * 12;
      if (q.vida <= 0) { crearCharco(q.a, q.p, q.tx, q.ty); J.proys.splice(i, 1); continue; }
      continue;
    } else {
      if (q.g) q.vy += q.g * dt;
      if (q.tipo === "cruz") {
        // la cruz frena, se da vuelta y vuelve pasando de largo (bumerán)
        const vv = q.vx * Math.cos(q.ang) + q.vy * Math.sin(q.ang), nv = vv - 260 * dt * (q.v0 / 170);
        q.vx = Math.cos(q.ang) * nv; q.vy = Math.sin(q.ang) * nv;
        if (vv > 0 && nv <= 0) q.golpeados.clear();
      }
      q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.gira) q.rot += q.gira * dt;
      if (q.tipo === "runa") {
        // rebota en los bordes de la pantalla
        let reb = false;
        if (q.x < J.cam.x + 4 && q.vx < 0 || q.x > J.cam.x + W - 4 && q.vx > 0) { q.vx = -q.vx; reb = true; }
        if (q.y < J.cam.y + 30 && q.vy < 0 || q.y > J.cam.y + H - 4 && q.vy > 0) { q.vy = -q.vy; reb = true; }
        if (reb && q.explota) explosion(q.x, q.y, 22 * (q.esc || 1), q.dano, q.a);
      }
      if (q.estela && J.cuadro % 2 === 0) J.efectos.push({ tipo: "chispa", x: q.x, y: q.y, vx: 0, vy: q.humo ? -10 : 0, t: 0.25, t0: 0.25, col: q.estela });
      golpearCirculo(q);
    }
    if (q.vida <= 0 || q.perf <= 0 || (q.tipo !== "tajo" && q.tipo !== "runa" && !enPantalla(q.x, q.y, 80))) J.proys.splice(i, 1);
  }
  // los libros giran alrededor tuyo
  for (const a of J.armas) {
    if (!a.libros || !(a.k === "libro" || a.k === "visperas")) continue;
    const p = paramsArma(a), L2 = a.libros;
    if (L2.t <= 0 && !p.eterna) { L2.pos = []; continue; }
    const r = TAM.libro * p.area, n = p.eterna ? Math.round(p.cant) : L2.n, w = 3.2 * p.vel;
    L2.pos = [];
    for (let k = 0; k < n; k++) {
      const ang = J.t * w + (k / n) * TAU, x = j.x + Math.cos(ang) * r, y = j.y - 4 + Math.sin(ang) * r;
      L2.pos.push([x, y]);
      cercanos(x, y, 7 * Math.sqrt(p.area), (e) => {
        const ult = L2.golpeados.get(e) || -9;
        if (J.t - ult < 0.5) return;
        L2.golpeados.set(e, J.t);
        golpear(e, p.dano, p.emp, a, e.x - j.x, e.y - j.y);
      });
    }
  }
}
function golpearCirculo(q) {
  cercanos(q.x, q.y, q.r, (e) => {
    if (q.perf <= 0) return;
    const ult = q.golpeados.get(e);
    if (ult != null && (!q.rehit || J.t - ult < q.rehit)) return;
    q.golpeados.set(e, J.t);
    let d = q.dano;
    if (q.crit && A.si(q.crit * J.st.suerte)) d *= q.xcrit;
    golpear(e, d, q.emp, q.a, q.vx || e.x - J.jug.x, q.vy || e.y - J.jug.y, d !== q.dano);
    if (q.tipo === "bala" || q.tipo === "hacha") q.perf--;
  });
}
function golpearRect(q, x, y, w, h) {
  for (const e of J.enemigos) {
    if (e.x + e.r < x || e.x - e.r > x + w || e.y + e.r < y || e.y - e.r - 8 > y + h) continue;
    let d = q.dano, crit = false;
    if (q.crit && A.si(q.crit * J.st.suerte)) { d *= q.xcrit; crit = true; }
    golpear(e, d, q.emp, q.a, q.dx, 0, crit);
    // Látigo Carmesí: el crítico cura 8 (a lo sumo una vez por segundo)
    if (crit && q.cura && J.t - J.jug.ultCritCura >= 1) { J.jug.ultCritCura = J.t; curar(q.cura); }
  }
}

function crearCharco(a, p, x, y) {
  J.zonas.push({ a, x, y, r: TAM.agua * p.area, t: p.dur, t0: p.dur, dano: p.dano, golpeados: new Map(), sigue: p.sigue });
  sfx("agua", 0.35);
}
function pasoZonas(dt) {
  const j = J.jug;
  for (let i = J.zonas.length - 1; i >= 0; i--) {
    const z = J.zonas[i];
    z.t -= dt;
    // La Marea: los charcos se arrastran hacia vos y crecen (con tope)
    if (z.sigue) { const dx = j.x - z.x, dy = j.y - z.y, d = Math.hypot(dx, dy) || 1; z.x += dx / d * 18 * dt; z.y += dy / d * 18 * dt; z.r = Math.min(z.r + dt * 4, 60); }
    if (z.t <= 0) { J.zonas.splice(i, 1); continue; }
    if (J.cuadro % 3) continue;
    cercanos(z.x, z.y, z.r, (e) => {
      const ult = z.golpeados.get(e) || -9;
      if (J.t - ult < 0.5) return;       // el mismo enemigo, cada 0,5 s (wiki)
      z.golpeados.set(e, J.t);
      golpear(e, z.dano, 0, z.a, 0, 0);
    });
  }
}

// ══════════ 12-enemigos.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LOS ENEMIGOS: la multitud. Cada minuto es una oleada (wiki): si hay menos que el mínimo,
// aparecen de a muchos hasta llegar; si no, uno de cada tipo cada "intervalo". Aparecen justo afuera
// de la pantalla, caminan hacia vos, se empujan entre ellos (grilla espacial: 300 enemigos sin
// que el teléfono sufra) y los que quedan muy lejos se reubican del otro lado.
// ─────────────────────────────────────────────────────────────────────────────

const CELDA = 24, GRID = new Map();
const TOPE_NORMAL = 300, TOPE_TOTAL = 400;
function armarGrilla() {
  GRID.clear();
  for (const e of J.enemigos) { const k = (Math.floor(e.x / CELDA) + 5000) * 10000 + (Math.floor(e.y / CELDA) + 5000); let c = GRID.get(k); if (!c) GRID.set(k, (c = [])); c.push(e); }
}
/** Llama fn(e) para cada enemigo a menos de r de (x, y). */
function cercanos(x, y, r, fn) {
  const c0 = Math.floor((x - r - 12) / CELDA), c1 = Math.floor((x + r + 12) / CELDA), f0 = Math.floor((y - r - 12) / CELDA), f1 = Math.floor((y + r + 12) / CELDA);
  for (let cx = c0; cx <= c1; cx++) for (let cy = f0; cy <= f1; cy++) {
    const c = GRID.get((cx + 5000) * 10000 + (cy + 5000)); if (!c) continue;
    for (const e of c) { if (e.muerto) continue; const rr = r + e.r; if ((e.x - x) ** 2 + (e.y - 4 - y) ** 2 <= rr * rr) fn(e); }
  }
}

/** Un punto justo afuera de la pantalla (en un anillo alrededor de lo que se ve). */
function puntoAfuera(margen = 18) {
  const c = J.cam, lado = A.f() * (2 * (W + H));
  if (lado < W) return [c.x + lado, c.y - margen];
  if (lado < 2 * W) return [c.x + lado - W, c.y + H + margen];
  if (lado < 2 * W + H) return [c.x - margen, c.y + lado - 2 * W];
  return [c.x + W + margen, c.y + lado - 2 * W - H];
}
function aparecer(tipo, x, y, extra) {
  const d = ENEMIGOS[tipo]; if (!d) return null;
  if (x == null) [x, y] = puntoAfuera(d.jefe ? 30 : 18);
  const maldicion = J.st ? J.st.maldicion : 1;
  let vida = d.vida * (d.xnivel ? J.nivel : 1) * J.E.vida * (d.jefe ? 1 : maldicion);
  const e = { tipo, d, x, y, vida, max: vida, r: d.r, vel: d.vel * VEL_U * J.E.velEne * (0.92 + A.f() * 0.16) * maldicion,
    kb: 0, kvx: 0, kvy: 0, flash: 0, cuadro: A.f() * 2, izq: false, muerto: false, ...extra };
  J.enemigos.push(e);
  return e;
}

function pasoEnemigos(dt) {
  const j = J.jug, frio = J.congelado > 0;
  armarGrilla();
  for (const e of J.enemigos) {
    if (e.flash > 0) e.flash -= dt;
    let dx = j.x - e.x, dy = j.y - e.y;
    const dist = Math.hypot(dx, dy) || 1;
    // muy lejos: los normales se reubican del otro lado; los jefes vuelven cerca (wiki)
    if (dist > Math.max(W, H) * 1.1) { if (e.recto || e.d.brasero) { e.muerto = true; continue; } const [nx, ny] = puntoAfuera(e.d.jefe ? 30 : 18); e.x = nx; e.y = ny; continue; }
    if (e.d.brasero) { e.cuadro += dt * 8; continue; }
    if (frio && !e.d.parca) { e.cuadro += 0; continue; }
    if (e.kb > 0) { e.kb -= dt; e.x += e.kvx * dt; e.y += e.kvy * dt; continue; }
    let mx, my;
    if (e.recto) { mx = e.dirX; my = e.dirY; }
    else { mx = dx / dist; my = dy / dist; }
    e.x += mx * e.vel * dt; e.y += my * e.vel * dt;
    if (Math.abs(mx) > 0.15) e.izq = mx < 0;
    e.cuadro += dt * (e.d.vuela ? 7 : 4);
    // empujarse entre ellos: la multitud se ve como una marea, no un punto
    if (!e.recto) {
      const cxx = Math.floor(e.x / CELDA), cyy = Math.floor(e.y / CELDA);
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
        const c = GRID.get((cxx + ox + 5000) * 10000 + (cyy + oy + 5000)); if (!c) continue;
        for (const o of c) {
          if (o === e || !o.d.vuela !== !e.d.vuela || o.recto) continue;   // los que vuelan se separan entre ellos, los de a pie entre ellos
          const ddx = e.x - o.x, ddy = e.y - o.y, rr = (e.r + o.r) * 0.8, d2 = ddx * ddx + ddy * ddy;
          if (d2 < rr * rr && d2 > 0.01) { const d = Math.sqrt(d2), f = (rr - d) / d * 0.25; e.x += ddx * f; e.y += ddy * f; }
        }
      }
    }
    // tocarte duele (y te encierran: te empujan un poco)
    const toca = e.r + 5;
    if (dist < toca) {
      herirJugador(e.d.dano);
      const emp = (toca - dist) / dist;
      e.x -= dx * emp * 0.7; e.y -= dy * emp * 0.7;
      if (!e.d.parca) { j.x += dx * emp * 0.25; j.y += dy * emp * 0.25; }
    }
  }
  // los muertos se van
  for (let i = J.enemigos.length - 1; i >= 0; i--) if (J.enemigos[i].muerto) J.enemigos.splice(i, 1);
}

/** Pega a un enemigo: daño, destello blanco, empuje (dirección dx, dy), número. */
function golpear(e, dano, emp, a, dx, dy, crit) {
  if (e.muerto) return;
  if (e.d.parca && dano < 1e6) dano = Math.min(dano, 1);   // la parca no se deja
  e.vida -= dano; e.flash = 0.12;
  if (a) a.dano += Math.min(dano, e.vida + dano);
  const k = emp * ((e.d.emp || 0) + (e.empExtra || 0));
  if (k > 0 && !e.d.jefe && J.congelado <= 0) { const n = Math.hypot(dx, dy) || 1; e.kb = 0.12; e.kvx = dx / n * 110 * Math.min(k, 3); e.kvy = dy / n * 110 * Math.min(k, 3); }
  if (G.op.numeros) numero(e.x, e.y - 10 - V.f() * 4, corto(dano), crit ? "#ffe060" : "#ffffff");
  sfx("golpe", 0.25);
  if (e.vida <= 0) matar(e);
}
function matar(e, sinBotin) {
  if (e.muerto) return;
  e.muerto = true;
  if (e.d.brasero) { sfx("brasero", 0.6); J.efectos.push({ tipo: "onda", x: e.x, y: e.y - 6, t: 0.3, t0: 0.3, r: 10, col: "#ffc040" }); if (!sinBotin) botinBrasero(e.x, e.y); return; }
  J.kills++;
  J.efectos.push({ tipo: "muerte", x: e.x, y: e.y - 6, t: 0.3, t0: 0.3, spr: enemigoSpr(e.d.spr, 0, e.izq, e.d.tinte), esc: Math.max(1, Math.round(e.d.esc || 1)) });
  sfx("muere", 0.3);
  if (sinBotin) return;
  if (e.d.xp) soltarGema(e.x, e.y, e.d.xp);
  if (e.d.jefe && COFRES_JEFE[e.tipo]) J.cosas.push({ tipo: "cofre", x: e.x, y: e.y, jefe: e.tipo, evo: J.t >= 600 * (J.duracion / 1800) || J.minuto <= 1 });
  // Devoraalmas: los caídos sueltan corazoncitos que curan 1
  if (J.armas.some((a) => a.k === "devora") && A.si(0.08)) J.cosas.push({ tipo: "corazoncito", x: e.x + 4, y: e.y });
  if (A.si(0.004)) J.cosas.push({ tipo: "moneda", x: e.x - 3, y: e.y });
}

// ── las oleadas ──
function minutoDe(t) { return Math.floor(t / (60 * J.duracion / 1800)); }
function pasoOleadas(dt) {
  const min = minutoDe(J.t);
  if (J.t >= J.duracion) { llegaLaParca(); return; }
  const ol = J.E.oleadas[Math.min(min, J.E.oleadas.length - 1)];
  if (min !== J.minuto) {
    J.minuto = min;
    for (const b of ol.jefes || []) aparecer(b);
    if ((ol.jefes || []).some((b) => ENEMIGOS[b].jefe)) sfx("jefe", 0.6);
    if (ol.ev && A.si(ol.ev[1])) for (let k = 0; k < ol.ev[2]; k++) J.eventos.push({ tipo: ol.ev[0], t: k * 5 });
  }
  // eventos pendientes (enjambres, anillo de flores)
  for (let i = J.eventos.length - 1; i >= 0; i--) { const ev = J.eventos[i]; if ((ev.t -= dt) <= 0) { evento(ev.tipo); J.eventos.splice(i, 1); } }
  const normales = J.enemigos.length, maldicion = J.st.maldicion;
  if (normales >= TOPE_NORMAL) return;
  const minimo = Math.min(TOPE_NORMAL, Math.round(ol.min * maldicion * 0.8));
  if (normales < minimo) { for (let k = 0; k < 4 && J.enemigos.length < minimo; k++) aparecer(A.uno(ol.e)); return; }
  J.spawnT -= dt * maldicion;
  if (J.spawnT <= 0) { J.spawnT = Math.max(0.12, ol.int); for (const t of ol.e) aparecer(t); }
}
function evento(tipo) {
  const j = J.jug;
  if (tipo === "enjambre" || tipo === "fantasmas") {
    // una bandada que cruza la pantalla en línea recta, apuntada a donde estás
    const lado = A.ent(0, 3), n = 22, t = tipo === "enjambre" ? "enjambre" : "fantasmaEnj";
    for (let k = 0; k < n; k++) {
      const off = (k - n / 2) * 7 + (A.f() - 0.5) * 6;
      let x, y; if (lado === 0) { x = J.cam.x - 20 - A.f() * 20; y = j.y + off; } else if (lado === 1) { x = J.cam.x + W + 20 + A.f() * 20; y = j.y + off; } else if (lado === 2) { x = j.x + off; y = J.cam.y - 20 - A.f() * 20; } else { x = j.x + off; y = J.cam.y + H + 20 + A.f() * 20; }
      const dx = j.x - x, dy = j.y - y;
      if (J.enemigos.length < TOPE_TOTAL) aparecer(t, x, y, { recto: 1, dirX: lado < 2 ? Math.sign(dx) : 0, dirY: lado < 2 ? 0 : Math.sign(dy) });
    }
  } else if (tipo === "flores") {
    // el anillo de flores: te encierran y se van cerrando despacio
    const n = 36, r = Math.max(W, H) * 0.42;
    for (let k = 0; k < n; k++) { const a = (k / n) * TAU; if (J.enemigos.length < TOPE_TOTAL) aparecer("flor", j.x + Math.cos(a) * r, j.y + Math.sin(a) * r); }
  }
}
function llegaLaParca() {
  if (J.parcas === 0) {
    for (const e of J.enemigos) if (!e.d.parca) matar(e, true);
    J.cartel = { txt: TX.parca, t: 3, rojo: true };
    sfx("jefe"); tocarTema("fin");
  }
  const cuantas = 1 + Math.floor((J.t - J.duracion) / 60);
  while (J.parcas < cuantas) { J.parcas++; aparecer("parca"); }
}

// ══════════ 13-recoger.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// LO QUE SE JUNTA: gemas de experiencia (azul ≤2, verde ≤9, roja más), oro, pollo, cofres de los
// jefes y lo que sueltan los braseros (rosario, reloj, aspiradora, trebolito). Con más de 400 gemas
// en el piso no caen nuevas: su experiencia se junta en UNA gema roja (wiki), así no se traba.
// ─────────────────────────────────────────────────────────────────────────────

ENEMIGOS.brasero = { vida: 10, dano: 0, vel: 0, emp: 0, xp: 0, r: 5, spr: "brasero", brasero: 1 };
const TOPE_GEMAS = 400;

function soltarGema(x, y, xp) {
  if (J.gemas.length >= TOPE_GEMAS) {
    if (!J.rojaGrande || J.rojaGrande.juntada) { J.rojaGrande = { x, y, xp: 0, tipo: "roja", vuela: 0, v: 0 }; J.gemas.push(J.rojaGrande); }
    J.rojaGrande.xp += xp; return;
  }
  J.gemas.push({ x: x + (V.f() - 0.5) * 4, y, xp, tipo: xp <= 2 ? "azul" : xp <= 9 ? "verde" : "roja", vuela: 0, v: 0 });
}
function ganarXP(xp) {
  // en los niveles 20 y 40 (los "muros" de la curva) la experiencia vale doble hasta pasar (wiki)
  const extra = J.nivel === 20 || J.nivel === 40 ? 2 : 1;
  J.xp += xp * J.st.crec * extra;
  while (J.xp >= J.xpSig) { J.xp -= J.xpSig; J.nivel++; J.xpSig = xpPara(J.nivel); J.pendientes++; recalcular(); }
}
function ganarOro(n) { const v = Math.round(n * J.st.codicia); J.oro += v; sfx("moneda", 0.5); return v; }

function pasoRecoger(dt) {
  const j = J.jug, iman = J.st.iman * 0.9, im2 = iman * iman;
  for (let i = J.gemas.length - 1; i >= 0; i--) {
    const gm = J.gemas[i], dx = j.x - gm.x, dy = j.y - 4 - gm.y, d2 = dx * dx + dy * dy;
    if (!gm.vuela && d2 < im2) { gm.vuela = 1; gm.v = -60; }      // primero salta un poquito para atrás, después vuela
    if (gm.vuela) {
      gm.v = Math.min(420, gm.v + 700 * dt);
      const d = Math.sqrt(d2) || 1; gm.x += dx / d * gm.v * dt; gm.y += dy / d * gm.v * dt;
      if (d < 7) { ganarXP(gm.xp); sfx("gema", 0.35, gm.tipo === "azul" ? 1 : gm.tipo === "verde" ? 1.12 : 1.25); J.gemas.splice(i, 1); if (gm === J.rojaGrande) gm.juntada = true; }
    }
  }
  for (let i = J.cosas.length - 1; i >= 0; i--) {
    const c = J.cosas[i], dx = j.x - c.x, dy = j.y - 4 - c.y, d = Math.hypot(dx, dy);
    if (c.tipo !== "cofre" && (d < iman || c.vuela)) { c.vuela = 1; c.v = Math.min(360, (c.v || 0) + 600 * dt); c.x += dx / (d || 1) * c.v * dt; c.y += dy / (d || 1) * c.v * dt; }
    if (d < (c.tipo === "cofre" ? 12 : 8)) { J.cosas.splice(i, 1); levantar(c); }
  }
  // braseros: mientras haya pocos, cada segundo puede prenderse uno justo afuera de la pantalla
  J.brasT -= dt;
  if (J.brasT <= 0) {
    J.brasT = 1;
    const n = J.enemigos.reduce((s, e) => s + (e.d.brasero ? 1 : 0), 0);
    if (n < 2 && A.si(0.22 * J.st.suerte)) { const [x, y] = puntoAfuera(8); aparecer("brasero", x, y); }
  }
}
function levantar(c) {
  const j = J.jug;

// ══════════ 17-juego.js ══════════
// ─────────────────────────────────────────────────────────────────────────────
// EL CICLO DE LA PARTIDA: un paso fijo de 1/60 s (mover, armas, enemigos, oleadas, recoger) y el
// dibujo del mundo ordenado por la altura de los pies, así el que está más abajo tapa al de arriba.
// ─────────────────────────────────────────────────────────────────────────────

function pasoJuego(dt) {
  if (J.fin) { J.finT += dt; pasoEfectos(dt); if (J.finT > 3.2) terminarPartida(); return; }
  if (J.modal) { pasoModal(dt); return; }
  if (J.pausa) return;
  const j = J.jug, st = J.st;
  J.t += dt; J.cuadro++;
  if (J.t < 61 && J.cuadro % 30 === 0) recalcular();     // lo temporal del personaje se va apagando
  // moverse: es lo único que manejás
  const m = leerMovimiento(), v = VEL_JUG * st.velMov * J.E.velJug;
  j.moviendo = Math.hypot(m.x, m.y) > 0.1;
  if (j.moviendo) {
    j.x += m.x * v * dt; j.y += m.y * v * dt; j.paso += dt * 7;
    const n = Math.hypot(m.x, m.y); j.mirX = m.x / n; j.mirY = m.y / n;
    if (Math.abs(m.x) > 0.2) j.izq = m.x < 0;
  }
  if (j.inv > 0) j.inv -= dt;
  if (j.golpe > 0) j.golpe -= dt;
  if (st.recup > 0 && j.vida < st.vidaMax) { j.vida = Math.min(st.vidaMax, j.vida + st.recup * dt); J.sanado += st.recup * dt; }
  if (J.congelado > 0) J.congelado -= dt;
  if (J.destello > 0) J.destello -= dt;
  if (J.cartel) J.cartel.t -= dt;
  pasoOleadas(dt);
  pasoEnemigos(dt);
  pasoArmas(dt);
  pasoRecoger(dt);
  pasoEfectos(dt);
  // la cámara: el cazador un poco más abajo del centro (arriba está el HUD)
  J.cam.x = j.x - W / 2; J.cam.y = j.y - H * 0.52;
  if (J.pendientes > 0 && !J.modal && !J.fin) abrirModalNivel();
}

function dibujarJuego() {
  const cx = Math.round(J.cam.x), cy = Math.round(J.cam.y), j = J.jug;
  g.fillStyle = SUELOS[J.E.suelo].fondo; g.fillRect(0, 0, W, H);
  const adornos = dibujarSuelo(J.E.suelo, cx, cy);
  // lo que está en el piso: charcos, aura del ajo, gemas, cosas
  for (const z of J.zonas) {
    const X = Math.round(z.x - cx), Y = Math.round(z.y - cy), k = Math.min(1, z.t / 0.4), rojo = z.a && z.a.k === "marea";
    g.globalAlpha = 0.35 * k; g.fillStyle = rojo ? "#ff4050" : "#60a8ff"; g.beginPath(); g.ellipse(X, Y, z.r, z.r * 0.7, 0, 0, TAU); g.fill();
    g.globalAlpha = 0.9 * k; g.fillStyle = rojo ? "#ffb0b8" : "#d8f0ff";
    for (let i = 0; i < 7; i++) { const a = i / 7 * TAU + J.t * 2, rr = z.r * (0.3 + 0.6 * ((i * 37) % 10) / 10), fx = X + Math.cos(a) * rr, fy = Y + Math.sin(a) * rr * 0.7, fh = 2 + ((J.cuadro >> 2) + i) % 3; g.fillRect(Math.round(fx), Math.round(fy - fh), 2, fh); }
    g.globalAlpha = 1;

    const X = j.x - cx, Y = j.y - 4 - cy, dev = a.k === "devora", pul = 1 + Math.sin(J.t * 6) * 0.03;
    g.globalAlpha = 0.14; g.fillStyle = dev ? "#b070ff" : "#fff4e0"; g.beginPath(); g.arc(X, Y, a.radio * pul, 0, TAU); g.fill();
    g.globalAlpha = 0.35; g.strokeStyle = dev ? "#d0a0ff" : "#ffffff"; g.lineWidth = 1; g.beginPath(); g.arc(X, Y, a.radio * pul, 0, TAU); g.stroke(); g.globalAlpha = 1;
  }

  for (const c of J.cosas) {
    const s = c.tipo === "cofre" ? cofreSpr(false) : recogibleSpr(c.tipo), bob = Math.round(Math.sin(J.t * 4 + c.x) * 1.5);
    if (c.tipo === "cofre") { g.globalAlpha = 0.3 + 0.2 * Math.sin(J.t * 5); g.fillStyle = "#ffe070"; g.beginPath(); g.arc(c.x - cx, c.y - cy - 4, 14, 0, TAU); g.fill(); g.globalAlpha = 1; }
    g.drawImage(s, Math.round(c.x - cx - s.width / 2), Math.round(c.y - cy - s.height / 2 + bob));
  }
  // los que tienen pies: adornos, enemigos y el cazador, ordenados por y
  const cosas = adornos.map((a) => ({ y: a.pie, a }));
  for (const e of J.enemigos) if (enPantalla(e.x, e.y, 40)) cosas.push({ y: e.y, e });
  cosas.push({ y: j.y, jug: 1 });
  cosas.sort((p, q) => p.y - q.y);
  const frio = J.congelado > 0;
  for (const o of cosas) {
    if (o.a) { g.drawImage(o.a.spr, Math.round(o.a.x - cx), Math.round(o.a.y - cy)); continue; }
    if (o.jug) { dibujarCazador(cx, cy); continue; }
    const e = o.e;
    let s = e.d.brasero ? braseroSpr(Math.floor(e.cuadro) % 3) : enemigoSpr(e.d.spr, Math.floor(e.cuadro) % 2, e.izq, e.d.tinte);
    if (e.flash > 0) s = blanco(s); else if (frio && !e.d.parca) s = azulado(s);
    const esc = Math.max(1, Math.round(e.d.esc || 1)), w = s.width * esc, h = s.height * esc;
    const X = Math.round(e.x - cx - w / 2), Y = Math.round(e.y - cy - h + 2 - (e.d.vuela ? 5 : 0));
    if (!e.d.vuela || esc > 1) g.drawImage(sombra(Math.max(3, Math.round(w / 3)), Math.max(1, Math.round(w / 9))), Math.round(e.x - cx - w / 3), Math.round(e.y - cy - 1));
    g.drawImage(s, X, Y, w, h);
  }
  // proyectiles y libros, por encima
  for (const q of J.proys) {
    const X = q.x - cx, Y = q.y - cy;
    if (q.tipo === "tajo") {
      const s = latigoSpr(Math.round(q.largo), Math.round(q.alto), q.rojo), k = q.vida / q.vidaMax;
      g.globalAlpha = Math.min(1, k * 2.2); g.save(); g.translate(Math.round(X), Math.round(Y)); if (q.dx < 0) g.scale(-1, 1);
      g.drawImage(s, -Math.round(q.largo / 2), -Math.round(q.alto / 2)); g.restore(); g.globalAlpha = 1; continue;
    }
    const s = proySpr(q.spr), esc = q.esc && q.esc > 1.4 ? Math.round(q.esc) : 1;
    if (q.rot) { g.save(); g.translate(Math.round(X), Math.round(Y)); g.rotate(q.rot); g.drawImage(s, -s.width * esc / 2, -s.height * esc / 2, s.width * esc, s.height * esc); g.restore(); }
    else g.drawImage(s, Math.round(X - s.width * esc / 2), Math.round(Y - s.height * esc / 2), s.width * esc, s.height * esc);
  }
  for (const a of J.armas) if (a.libros && a.libros.pos) { const s = proySpr(a.k === "visperas" ? "visperas" : "libro"); for (const [x, y] of a.libros.pos) g.drawImage(s, Math.round(x - cx - s.width / 2), Math.round(y - cy - s.height / 2)); }
  dibujarEfectos(cx, cy);
  vineta(J.E.suelo === "tumbas" ? 0.7 : 0.45);
  if (frio) { g.fillStyle = "rgba(80,150,255,0.14)"; g.fillRect(0, 0, W, H); }
  if (J.destello > 0 && G.op.destellos) { g.fillStyle = `rgba(255,255,255,${Math.min(0.6, J.destello)})`; g.fillRect(0, 0, W, H); }
  if (j.golpe > 0) { g.fillStyle = `rgba(200,0,0,${j.golpe * 0.6})`; g.fillRect(0, 0, W, H); }
}
/** La pasada de interfaz (a la resolución de la pantalla): números de daño, HUD, carteles y ventanas. */
function dibujarUIJuego() {

function dibujarCazador(cx, cy) {
  const j = J.jug, s = cazadorSpr(J.pj, j.moviendo ? 1 + Math.floor(j.paso) % 2 : 0, j.izq);
  const X = Math.round(j.x - cx - s.width / 2), Y = Math.round(j.y - cy - s.height + 2);
  g.drawImage(sombra(5, 2), Math.round(j.x - cx - 5), Math.round(j.y - cy - 1));

  if (!(j.inv > 0 && J.cuadro % 6 < 3 && j.golpe > -1)) g.drawImage(j.golpe > 0.1 ? rojizo(s) : s, X, Y);

  while (_acum >= CUADRO && pasos < 4) { _acum -= CUADRO; pasos++; if (PANT === "juego" && J) pasoJuego(1 / 60); }
  if (pasos === 4) _acum = 0;
  cuadro();
}
document.addEventListener("visibilitychange", () => {
  // al salir de la app: pausa (y el audio se suspende para no gastar batería)
  if (document.hidden) { if (PANT === "juego" && J && !J.modal && !J.fin) J.pausa = true; if (AU.ctx) AU.ctx.suspend().catch(() => {}); }
  else if (AU.ctx) AU.ctx.resume().catch(() => {});
});

// ── sondas ──
window.__NC = {
  get J() { return J; }, get PANT() { return PANT; }, G: () => G, AU,
  nueva(pj = "antonia", esc = "bosque", semilla = 7) { nuevaPartida(pj, esc, semilla); PANT = "juego"; UI.pantallaFoco = null; return true; },
  paso(n = 1, mx = 0, my = 0) { for (let i = 0; i < n; i++) { IN.teclas.clear(); if (mx < 0) IN.teclas.add("izq"); if (mx > 0) IN.teclas.add("der"); if (my < 0) IN.teclas.add("arr"); if (my > 0) IN.teclas.add("aba"); pasoJuego(1 / 60); finCuadroEntrada(); } IN.teclas.clear(); },
  dibujar() { cuadro(); },
  ir(p) { irA(p); cuadro(); },
  tocar(x, y) { IN.toques.push({ x, y }); cuadro(); },
  tecla(k) { EDGE.add(k); cuadro(); },
  dar(...ks) { for (const k of ks) { if (ARMAS[k]) darArma(k); else if (EVOS[k]) { if (!J.armas.find((a) => a.k === EVOS[k].de)) darArma(EVOS[k].de); evolucionar(k); } else if (PASIVOS[k]) darPasivo(k); } recalcular(); },
  cofre(evo = true) { J.cosas.push({ tipo: "cofre", x: J.jug.x, y: J.jug.y, jefe: "mantisJefe", evo }); },
  medida() { return { W, H, PX, OFX }; },
  audio() { return { listo: AU.listo, ms: AU.msHorneo, bufs: Object.keys(AU.buf), estado: AU.ctx && AU.ctx.state, error: AU.error }; },
  listo: true,
};
requestAnimationFrame(bucle);
