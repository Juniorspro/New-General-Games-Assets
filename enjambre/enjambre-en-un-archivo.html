<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Enjambre — sobreviví seis minutos</title>
<meta name="description" content="Un pulgar y nada de apuntar. Vos te movés; las armas disparan solas. Lo que decide la partida es qué subís.">
<meta name="theme-color" content="#0c0a16">
<style>
/* ESTILO: laboratorio de noche. Violeta profundo, verde ácido y un rosa de
   aviso. La regla es que el menú prepare el ojo para el juego: si las
   pantallas son claras, la primera partida encandila. */
:root{ --verde:#8ad06a; --cian:#7cf6ff; --rosa:#ff6ea9; --violeta:#c264e0;
       --fondo:#0c0a16; --tinta:#eee9f7; --apagado:#8a83a6; --linea:rgba(255,255,255,.12); }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--fondo);color:var(--tinta);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;
  overscroll-behavior:none}
#lienzo{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;background:#141021}

.pantalla{position:fixed;inset:0;z-index:2;display:none;place-items:center;overflow-y:auto;
  padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
  background:radial-gradient(ellipse at 50% 0%,rgba(194,100,224,.20),transparent 60%),
             linear-gradient(180deg,var(--fondo),#07060e)}
.pantalla.on{display:grid}
.pantalla.sinfondo{background:none;pointer-events:none}
.pantalla.sinfondo #hud,.pantalla.sinfondo #zona{pointer-events:auto}
/* la de mejoras se ve ENCIMA del juego congelado: cortar a negro perdería el
   contexto justo cuando hay que decidir mirando cómo venía la partida */
#pMejora{background:rgba(8,6,16,.86)}

.caja{width:min(430px,100%);display:flex;flex-direction:column;gap:12px;text-align:center;margin:auto}
.caja.ancha{width:min(500px,100%)}
.etiqueta{font:700 11px/1 system-ui;letter-spacing:.18em;text-transform:uppercase;color:var(--apagado)}
.etiqueta b{color:var(--cian)}
.logo{font-size:clamp(34px,10.5vw,54px);font-weight:900;letter-spacing:.10em;line-height:1;margin:4px 0 2px;
  background:linear-gradient(95deg,var(--verde),var(--cian) 55%,var(--violeta));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 20px rgba(138,208,106,.28))}
.logo.chico{font-size:clamp(26px,8vw,38px)}
h2{font-size:clamp(19px,5.4vw,25px);font-weight:800}
.bajada{color:var(--apagado);font-size:clamp(13px,3.6vw,15px);line-height:1.55}
.marca{color:var(--cian);font:700 12px/1.6 system-ui;letter-spacing:.06em}

/* los bichitos del menú: seis puntos que se acercan al título, como el juego */
.bichitos{display:flex;justify-content:center;gap:10px;height:26px}
.bichitos i{width:11px;height:13px;border-radius:50% 50% 45% 45%;background:var(--verde);opacity:.75;
  animation:vaiven 2.4s ease-in-out infinite alternate}
.bichitos i:nth-child(2n){background:var(--rosa);animation-duration:1.9s}
.bichitos i:nth-child(3n){background:var(--violeta);animation-duration:3.1s}
@keyframes vaiven{from{transform:translateY(-7px) scale(.9)}to{transform:translateY(7px) scale(1.1)}}

button{font:700 15px/1 system-ui,sans-serif;color:var(--tinta);cursor:pointer;
  background:rgba(255,255,255,.055);border:1px solid var(--linea);border-radius:13px;padding:15px 16px;
  transition:transform .08s,background .15s}
button:active{transform:translateY(2px);background:rgba(255,255,255,.11)}
button.grande{font-size:17px;padding:18px 16px;
  background:linear-gradient(100deg,rgba(138,208,106,.26),rgba(124,246,255,.26));border-color:rgba(255,255,255,.26)}
button.peligro{color:#ff9a9a;border-color:rgba(255,90,90,.34);background:rgba(255,60,60,.09)}
button.volver{background:none;border:none;color:var(--apagado);font-size:13px;padding:12px}
.botonera{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.fila{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;
  border:1px solid var(--linea);border-radius:13px;background:rgba(255,255,255,.028);font-size:14px;text-align:left}
.fila.col{flex-direction:column;align-items:stretch;gap:9px}
.int{min-width:56px;padding:9px;font-size:17px}.int.no{opacity:.33}
.segmentado{display:flex;gap:6px}
.segmentado button{flex:1;padding:11px 6px;font-size:13px;border-radius:10px}
.segmentado button.el{background:linear-gradient(100deg,rgba(138,208,106,.32),rgba(124,246,255,.32));
  border-color:rgba(255,255,255,.34)}
.ayuda{text-align:left;display:flex;flex-direction:column;gap:11px;font-size:14px;line-height:1.55;color:#cfc7e2}
.ayuda li{list-style:none;padding-left:18px;position:relative}
.ayuda li::before{content:'';position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--verde)}
.record{display:none;font:800 12px/1 system-ui;letter-spacing:.14em;color:var(--cian)}
.record.on{display:block}

#hud{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:8px;
  padding:max(30px,calc(env(safe-area-inset-top) + 22px)) 12px 8px}
.chip{background:rgba(8,6,16,.6);border:1px solid var(--linea);border-radius:10px;
  padding:6px 10px;font:700 12px/1 system-ui;letter-spacing:.04em;color:#d9d2ec}
.chip b{font-size:14px;font-variant-numeric:tabular-nums}
#hudMatados{color:var(--rosa)}
#bSalir{margin-left:auto;padding:8px 12px;font-size:12px;background:rgba(8,6,16,.6)}
#zona{position:fixed;inset:0;z-index:3}

/* ── las etapas ─────────────────────────────────────────────────────────── */
.etapas{display:flex;flex-direction:column;gap:9px;width:100%}
.etapa{display:grid;grid-template-columns:40px minmax(0,1fr);gap:13px;align-items:center;
  text-align:left;padding:14px 15px;border-radius:14px;width:100%;
  border-color:color-mix(in srgb,var(--tono) 40%,transparent);
  background:linear-gradient(100deg,color-mix(in srgb,var(--tono) 12%,transparent),rgba(255,255,255,.02))}
.etapa>div{min-width:0}
.etapa .n{font-weight:900;font-size:24px;color:var(--tono);text-align:center;font-variant-numeric:tabular-nums}
.etapa .t{font-weight:800;font-size:16px}
.etapa .t em{font-style:normal;color:var(--verde)}
.etapa .d{font-size:12.5px;line-height:1.45;color:#b9b1cf;margin-top:3px}
.etapa .s{font-size:11px;color:var(--apagado);margin-top:5px;letter-spacing:.04em}
.etapa.cerrada{opacity:.42;background:rgba(255,255,255,.02)}
.etapa.hecha .n::after{content:'';display:block;height:2px;background:var(--verde);margin-top:3px;border-radius:2px}

/* el botón del envión, donde cae el pulgar derecho */
#bEnvion{position:fixed;right:calc(52px - 34px);bottom:calc(62px - 34px);width:68px;height:68px;
  z-index:5;border-radius:50%;background:none;border:none;padding:0}
#bEnvion:active{transform:none}

/* las tarjetas de mejora: lo único que se elige en todo el juego */
.tarjetas{display:flex;flex-direction:column;gap:10px}
/* EL `min-width:0` NO ES DECORATIVO. Un hijo de grid trae `min-width:auto`, que
   lo obliga a ser al menos tan ancho como su palabra más larga y, dentro de una
   caja flex que puede encogerse, termina midiendo el contenido en vez de la
   columna: la descripción salía partida en una palabra por renglón. */
.tarjeta{display:grid;grid-template-columns:14px minmax(0,1fr);gap:12px;align-items:start;
  text-align:left;padding:15px 15px;border-radius:14px;width:100%}
.tarjeta>div{min-width:0}
.tarjetas{width:100%}
.tarjeta i{width:14px;height:14px;border-radius:4px;margin-top:3px}
.tarjeta .t{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tarjeta .t b{font-weight:700;font-size:11px;color:var(--apagado);letter-spacing:.06em}
.tarjeta .t em{font-style:normal;font-size:10px;font-weight:900;letter-spacing:.12em;
  background:var(--verde);color:#0c0a16;border-radius:5px;padding:3px 6px}
.tarjeta .d{font-size:13px;line-height:1.5;color:#b9b1cf;margin-top:5px}
.tarjeta.nueva{border-color:rgba(138,208,106,.5);background:rgba(138,208,106,.09)}
/* LA EVOLUCION SE OFRECE SOLA Y SE TIENE QUE VER DISTINTA. Es la jugada de la
   partida: mezclada entre dos mejoras comunes se elige sin entender qué era. */
.tarjeta.evolucion{border-color:rgba(255,209,102,.7);
  background:linear-gradient(100deg,rgba(255,209,102,.16),rgba(194,100,224,.14));
  box-shadow:0 0 28px rgba(255,209,102,.18)}
.tarjeta .t em.evo{background:#ffd166;color:#241a04}
@media (prefers-reduced-motion:reduce){.bichitos i{animation:none}}

</style>
</head>
<body>
<canvas id="lienzo"></canvas>

<section id="pIdioma" class="pantalla">
  <div class="caja">
    <h1 class="logo chico">ENJAMBRE</h1>
    <h2 data-t="idioma.titulo">Elegí tu idioma</h2>
    <p class="bajada" data-t="idioma.bajada">Se puede cambiar después en Ajustes.</p>
    <div class="botonera" id="listaIdiomas"></div>
  </div>
</section>

<section id="pMenu" class="pantalla">
  <div class="caja">
    <div class="bichitos" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h1 class="logo">ENJAMBRE</h1>
    <p class="bajada" data-t="menu.bajada">Seis minutos. Sólo te movés: las armas disparan solas.</p>
    <p class="marca" id="menuMejor"></p>
    <div class="botonera">
      <button id="bJugar" class="grande" data-t="menu.jugar">Jugar</button>
      <button id="bComo" data-t="menu.como">Cómo se juega</button>
      <button id="bAjustes" data-t="menu.ajustes">Ajustes</button>
    </div>
  </div>
</section>

<section id="pEtapas" class="pantalla">
  <div class="caja ancha">
    <h2 data-t="etapas.titulo">Etapas</h2>
    <div id="listaEtapas" class="etapas"></div>
    <button class="volver" data-ir="menu" data-t="volver">Volver</button>
  </div>
</section>

<section id="pComo" class="pantalla">
  <div class="caja">
    <h2 data-t="como.titulo">Cómo se juega</h2>
    <ul class="ayuda">
      <li data-t="como.1"></li><li data-t="como.2"></li><li data-t="como.3"></li>
      <li data-t="como.6"></li><li data-t="como.4"></li><li data-t="como.5"></li>
    </ul>
    <button class="volver" data-ir="menu" data-t="volver">Volver</button>
  </div>
</section>

<section id="pAjustes" class="pantalla">
  <div class="caja">
    <h2 data-t="aj.titulo">Ajustes</h2>
    <div class="fila"><span data-t="aj.sonido">Sonido</span><button id="ajSonido" class="int">🔊</button></div>
    <div class="fila col"><span data-t="aj.idioma">Idioma</span><div class="segmentado" id="ajIdioma"></div></div>
    <button id="bBorrar" class="peligro" data-t="aj.borrar">Borrar récords</button>
    <button class="volver" data-ir="menu" data-t="volver">Volver</button>
  </div>
</section>

<section id="pJuego" class="pantalla sinfondo">
  <div id="hud">
    <div class="chip"><b id="hudReloj">6:00</b></div>
    <div class="chip"><span data-t="mej.nivel">Nivel</span> <b id="hudNivel">1</b></div>
    <div class="chip"><b id="hudMatados">0</b> ☠</div>
    <button id="bSalir" data-t="hud.salir">Salir</button>
  </div>
  <!-- LA ZONA DE MOVIMIENTO ES TODA LA PANTALLA. Un joystick en una esquina
       obliga a mirarse el pulgar; acá el mando nace donde apoyás el dedo. -->
  <div id="zona"></div>
  <!-- EL ENVION VA POR ENCIMA DE LA ZONA DE MOVIMIENTO, donde cae el pulgar
       derecho. El anillo que lo rodea lo dibuja el lienzo, así que acá sólo
       está el área que se toca. -->
  <button id="bEnvion" data-t-aria="hud.envion" aria-label="Envión"></button>
</section>

<section id="pMejora" class="pantalla">
  <div class="caja">
    <h2><span data-t="mej.titulo">Nivel</span> <span id="mejNivel">2</span></h2>
    <div id="tarjetas" class="tarjetas"></div>
  </div>
</section>

<section id="pFin" class="pantalla">
  <div class="caja">
    <div class="etiqueta"><span data-t="fin.etapa">Etapa</span> <b id="finEtapa"></b></div>
    <h2 id="finTitulo" data-t="fin.perdio">Te agarraron</h2>
    <div id="finRecord" class="record" data-t="fin.record">Récord nuevo</div>
    <div class="fila"><span data-t="fin.tiempo">Tiempo</span><b id="finTiempo">0:00</b></div>
    <div class="fila"><span data-t="fin.matados">Matados</span><b id="finMatados">0</b></div>
    <div class="fila"><span data-t="fin.nivel">Nivel</span><b id="finNivel">1</b></div>
    <div class="botonera">
      <button id="bOtra" class="grande" data-t="fin.otra">De nuevo</button>
      <button data-ir="etapas" data-t="etapas.titulo">Etapas</button>
      <button data-ir="menu" data-t="fin.menu">Menú</button>
    </div>
  </div>
</section>

<script>
(() => {
/* ── archivos ── */
globalThis.ARCHIVOS = {};

/* ── azar.js ── */
const M_azar = (() => {
  // Azar con semilla. La misma semilla da siempre la misma partida.
  //
  // POR QUE IMPORTA ACA. Una partida de supervivencia dura minutos y muere de
  // una forma injusta cada tanto; si además cada corrida es un mundo distinto,
  // no hay manera de reproducir un bug ni de comparar dos versiones del balance.
  // Con semilla, "la partida 4218" es la misma para siempre y las pruebas pueden
  // jugar mil veces lo mismo.

  function azar(semilla) {
    let a = semilla >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      // Math.imul y no `*`: los productos de 32 bits pasan de 2^53 y el float64
      // redondea justo los bits de abajo, que son los que dan la mezcla.
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const entero = (r, n) => Math.floor(r() * n) % n;
  const uno = (r, l) => l[entero(r, l.length)];
  const entre = (r, a, b) => a + r() * (b - a);
  function barajar(r, l) {
    for (let i = l.length - 1; i > 0; i--) { const j = entero(r, i + 1); [l[i], l[j]] = [l[j], l[i]]; }
    return l;
  }

  return { azar, entero, uno, entre, barajar };
})();

/* ── bichos.js ── */
const M_bichos = (() => {
  // Los bichos. Todos inventados: cumplen roles del género sin parecerse a nadie.
  //
  // CADA UNO SE TIENE QUE LEER DE UN VISTAZO con cuarenta en pantalla, así que se
  // distinguen por SILUETA y por CÓMO SE MUEVEN, no por detalle. El color sólo
  // confirma lo que la forma ya dijo.
  //
  // Y CADA UNO TIENE QUE PEDIR ALGO DISTINTO. Un bestiario donde todos caminan
  // derecho hacia vos es un solo bicho pintado de ocho colores: lo que hace que
  // valga la pena mirar quién viene es que cada especie rompa una costumbre.

  const BICHOS = {
    // la masa: lenta, blanda, y viene de a montones. Enseña el juego.
    mota:      { r: 13, vida: 10,  vel: 92,  daño: 6,  xp: 1, color: "#8ad06a", forma: "gota",  peso: 1.0,
                 patas: 2 },
    // la presión: corre casi tanto como vos, así que no se la deja atrás
    pua:       { r: 11, vida: 7,   vel: 122, daño: 9,  xp: 2, color: "#ff7a5c", forma: "punta", peso: 0.8,
                 estela: true },
    // el muro: obliga a rodear en vez de atravesar
    caparazon: { r: 20, vida: 58,  vel: 62,  daño: 14, xp: 5, color: "#7d9bd6", forma: "placa", peso: 2.6,
                 blindado: 0.45 },
    // el ruido: no va derecho, así que no se le puede apuntar de memoria
    zumbido:   { r: 12, vida: 14,  vel: 95,  daño: 8,  xp: 3, color: "#e8c65a", forma: "rombo", peso: 1.0,
                 errante: true, alas: true },
    /* el que se parte: al morir deja dos crías. Castiga matar de lejos sin mirar
       lo que se acumula atrás. */
    saco:      { r: 22, vida: 46,  vel: 74,  daño: 10, xp: 4, color: "#c88fd6", forma: "gota",  peso: 2.0,
                 parte: ["larva", "larva", "larva"] },
    larva:     { r: 8,  vida: 6,   vel: 118, daño: 5,  xp: 1, color: "#e2b0ec", forma: "punta", peso: 0.5 },
    /* el que guarda distancia y escupe. Es el único al que hay que IR a buscar:
       sin él, alejarse siempre es gratis. */
    escupidor: { r: 15, vida: 30,  vel: 80,  daño: 6,  xp: 4, color: "#6fd8c0", forma: "rombo", peso: 1.4,
                 /* LA BALA VA LENTA A PROPOSITO. A 190 px/s no se esquivaba: salía y pegaba, y
     un daño que no se puede evitar no es dificultad, es un impuesto. A 150 se ve
     venir y se sale del camino, que es lo que este bicho tiene que enseñar. */
  /* EL QUE DISPARA TAMBIEN TIENE TECHO, por la misma razón que el que acecha:
     no se acerca, así que no se gasta. Medido en la salina a los dos minutos:
     66 escupidores vivos, uno cada 2,8 segundos, son veintitrés balas por
     segundo. Eso no se esquiva, se sufre — y la prueba lo mostró clarísimo
     porque el robot mataba lo MISMO que en la pradera (174 contra 190) y llegaba
     al mismo nivel, pero terminaba con 48 de vida contra 134. No moría de
     hambre: se desangraba. Con diez a la vez son tres balas y media por segundo,
     que sí se leen. */
                 distancia: 230, escupe: { cada: 2.8, daño: 6, vel: 150, r: 7 },
                 maxVivos: 10, olvida: 900 },
    /* el que se queda quieto hasta que te acercás y entonces salta. Hace que
       cruzar un claro vacío deje de ser seguro. */
    /* EL QUE ACECHA NO SE MUEVE, Y POR ESO TIENE TECHO Y SE VA.
       Un bicho quieto no se acerca a que lo maten: se acumula. Medido, la etapa
       de la salina no la terminaba nadie —0 de 8, muriendo a los 82 segundos de
       345— porque a los dos minutos el mapa entero era un campo minado de
       acechos que nunca se gastaban. Van dos reglas: no puede haber más de
       `maxVivos` a la vez, y el que quedó lejísimos se levanta y se va, porque
       un acecho a novecientos píxeles no es una amenaza, es memoria ocupada. */
    acecho:    { r: 16, vida: 34,  vel: 0,   daño: 10, xp: 5, color: "#d6708f", forma: "placa", peso: 1.8,
                 acecha: { radio: 170, impulso: 340, descanso: 1.5 }, maxVivos: 14, olvida: 950 },

    // ── jefes ──────────────────────────────────────────────────────────────
    // el primero: enorme y lento, y se deshace en motas. El remate es un momento.
    bulto:     { r: 44, vida: 1500, vel: 88, daño: 24, xp: 120, color: "#c264e0", forma: "placa", peso: 12,
                 jefe: true, parte: ["mota","mota","mota","mota","mota","mota","mota","mota","mota","mota"] },
    // el segundo: rápido y con escolta. Obliga a elegir entre el jefe y el resto.
    madre:     { r: 40, vida: 2100, vel: 62, daño: 22, xp: 160, color: "#ff6ea9", forma: "gota",  peso: 10,
                 jefe: true, cria: { cada: 2.4, tipo: "larva", cuantos: 3 } },
    // el tercero: se planta y escupe en abanico. El único que pega de lejos.
    torre:     { r: 46, vida: 2600, vel: 54, daño: 24, xp: 200, color: "#7cf6ff", forma: "placa", peso: 14,
                 jefe: true, blindado: 0.3, abanico: { cada: 2.8, cuantos: 9, daño: 13, vel: 175, r: 7 } },
  };

  /* ── LAS ETAPAS ──────────────────────────────────────────────────────────────
     Cuatro, y cada una es un juego distinto con las mismas manos: cambian qué
     viene, con qué frecuencia, de qué color es todo y quién está al final.
     ESCRITAS A MANO. Una curva generada sube parejo, y lo que hace que seis
     minutos no se sientan largos no es la dificultad sino tener respiros y
     sorpresas en los lugares correctos. */
  const ETAPAS = [
    {
      id: 1, nombre: "pradera", largo: 300,
      piso: "#141021", reja: "rgba(255,255,255,.035)", borde: "#ff6ea9",
      niebla: "rgba(138,208,106,.05)",
      oleadas: [
        { desde:   0, cada: 1.10, tipos: ["mota"],                          porVez: 2 },
        { desde:  30, cada: 0.95, tipos: ["mota", "mota", "pua"],           porVez: 2 },
        { desde:  70, cada: 0.85, tipos: ["mota", "pua", "zumbido"],        porVez: 3 },
        { desde: 110, cada: 0.80, tipos: ["mota", "pua", "caparazon"],      porVez: 3 },
        { desde: 145, jefe: "bulto" },
        { desde: 160, cada: 1.30, tipos: ["mota"],                          porVez: 2 },   // respiro

      /* LOS ESPECIALES SON EL CONDIMENTO, NO EL GRUESO.

      oleadas: [
        { desde:   0, cada: 1.05, tipos: ["mota", "mota", "acecho"],        porVez: 3 },
        { desde:  40, cada: 0.90, tipos: ["mota", "mota", "escupidor"],     porVez: 3 },
        { desde:  85, cada: 0.80, tipos: ["mota", "pua", "pua", "escupidor", "acecho"], porVez: 4 },
        { desde: 135, cada: 0.72, tipos: ["pua", "mota", "caparazon", "escupidor", "zumbido"], porVez: 4 },
        { desde: 180, jefe: "torre" },
        { desde: 196, cada: 1.20, tipos: ["mota", "acecho"],                porVez: 3 },
        { desde: 235, cada: 0.60, tipos: ["pua", "mota", "escupidor", "acecho", "zumbido"], porVez: 5 },
        { desde: 290, cada: 0.50, tipos: ["pua", "mota", "escupidor", "caparazon", "zumbido"], porVez: 6 },

    {
