      oleadas: [
        { desde:   0, cada: 0.85, tipos: ["mota", "pua", "larva"],          porVez: 3 },
        { desde:  45, cada: 0.75, tipos: ["saco", "escupidor", "pua"],      porVez: 3 },
        { desde:  95, cada: 0.68, tipos: ["acecho", "caparazon", "zumbido"], porVez: 4 },
        { desde: 140, jefe: "bulto" },
        { desde: 155, cada: 0.70, tipos: ["saco", "pua", "escupidor"],      porVez: 4 },
        { desde: 200, jefe: "madre" },
        { desde: 215, cada: 0.62, tipos: ["acecho", "escupidor", "zumbido"], porVez: 4 },
        { desde: 280, jefe: "torre" },
        /* EL TRAMO FINAL AFLOJA LA ENTRADA, no la amenaza. El tercer jefe ya es
           el remate; encimarle además la oleada más densa del juego hacía que
           nadie —ni el robot que elige bien, que llegaba a nivel 21— viera el
           final. Con el jefe en pantalla, lo que falta no son más bichos. */
        { desde: 300, cada: 0.62, tipos: ["saco", "pua", "caparazon", "escupidor", "acecho"], porVez: 4 },
      ],
    },
  ];

  /** Cuánta vida de más tienen los bichos a los `t` segundos, según la etapa. */
  /* LA DUREZA POR ETAPA SUBE MENOS DE LO QUE PARECE NECESARIO. Con 0,28 por
     etapa, la cuarta empezaba con bichos casi al doble de vida Y con tres jefes:
     medido, el robot moría a los 121 segundos de 380 y no llegaba a ver la mitad
     del contenido que la etapa tiene para mostrar. La cuarta ya es más difícil
     por lo que manda —qué viene y cuántos—, no hace falta inflar también los
     números. */
  const dureza = (t, etapa = 1) => (1 + Math.min(2.2, t / 190)) * (1 + (etapa - 1) * 0.15);

  /* EL TECHO DE BICHOS VIVOS, y por qué es balance y no optimización.
     Medido con un robot sobre doce partidas: sin techo se llegaba a 560 bichos a
     la vez y NINGUNA sobrevivía. Es una espiral: si no matás al ritmo al que
     entran, cada segundo entran más, y la partida ya está perdida dos minutos
     antes de que te toquen. Con techo, quedarse atrás se paga caro pero se
     remonta. Y de paso el cuadro deja de costar 15 ms. */
  const MAX_BICHOS = 200;

  /* MAS BICHOS QUIERE DECIR QUE CADA UNO PEGUE MENOS.
     Al hacer que la horda llegue de verdad, el daño de contacto de antes se
     volvió una sentencia: con medio segundo de gracia entre golpe y golpe, estar
     rodeado eran veinte de daño por segundo y la barra entera en cinco segundos.
     Medido: 0 de 8 partidas terminadas en las dos últimas etapas, incluso
     eligiendo bien. El peligro de una horda tiene que ser que no te deja
     respirar, no que cada mota pegue como un jefe. */

  /* LA VELOCIDAD VA POR PESO, y costó una ronda entera entenderlo.
     Subir a todos por igual arregló la densidad en pantalla pero rompió las dos
     últimas etapas: medido, 0 de 8 partidas terminadas incluso eligiendo bien,
     muriendo a los 123 segundos de 345. La culpa era del caparazón, que con 84
     corría casi tanto como el jugador siendo además el que más aguanta: un muro
     que además te persigue no se rodea, sólo se sufre. Lo chico corre, lo grande
     no — y lo grande sigue siendo peligroso porque no se muere. */

  /* EL RECICLADO, y es lo que hace que el juego se VEA como lo que es.
     Medido con la pantalla de un teléfono: a los sesenta segundos había 56 bichos
     vivos y UNO en pantalla. El 2 %. La mediana estaba a 446 píxeles, o sea fuera
     de cámara, porque la masa es más lenta que el jugador y nunca cierra la
     distancia: se juntaba un anillo de bichos lejísimos mientras la pantalla se
     veía vacía. Un juego de hordas donde no se ve la horda.
     Dos cosas lo arreglan. Una es que la masa corra lo suficiente como para
     alcanzarte cuando frenás o girás —no más rápido que vos, pero cerca—. La
     otra es ésta: el que quedó demasiado lejos se levanta y vuelve a aparecer
     del otro lado, en el anillo de siempre. No se lo mata ni se lo regala: se lo
     mueve, y así los doscientos que el techo permite están siempre alrededor
     tuyo en vez de perdidos en un rincón del mapa. */
  const RECICLAR = 760;

  /* LOS ELITES. Un bicho común al que le tocó la lotería: más grande, más duro y
     suelta un cofre. Están para que la pantalla tenga de vez en cuando un blanco
     que valga la pena perseguir en vez de sólo cosas de las que huir. */
  const ELITE = { vida: 7, r: 1.45, xp: 6, vel: 0.82, aura: "#ffd166" };
  const probElite = (t) => Math.min(0.055, 0.008 + t / 14000);

  return { BICHOS, ETAPAS, dureza, MAX_BICHOS, RECICLAR, ELITE, probElite };
})();

/* ── armas.js ── */
const M_armas = (() => {
  // Las armas, las pasivas y las evoluciones. Nada de esto se apunta: se elige.
  //
  // POR QUE EL ATAQUE ES AUTOMATICO. En un teléfono, mover y apuntar con dos
  // pulgares es pelear con el aparato y no con los bichos. El único gesto es
  // moverse; lo que decide la partida es QUE subís y en qué orden. Por eso cada
  // subida de nivel es la jugada de verdad.

  const ARMAS = {
    /* Dispara sola a lo más cercano. Es el arma de arranque porque enseña la
       regla de la casa: si no mirás para dónde, igual pega. */
    chispa: {
      tipo: "tiro", color: "#ffe066",
      niveles: [
        { cada: 0.62, daño: 12, vel: 380, radio: 5.0, cuantos: 1, atraviesa: 0, alcance: 290 },
        { cada: 0.54, daño: 15, vel: 400, radio: 5.5, cuantos: 2, atraviesa: 0, alcance: 300 },
        { cada: 0.46, daño: 19, vel: 420, radio: 6.0, cuantos: 2, atraviesa: 1, alcance: 310 },
        { cada: 0.40, daño: 24, vel: 440, radio: 6.5, cuantos: 3, atraviesa: 1, alcance: 320 },
        { cada: 0.34, daño: 30, vel: 470, radio: 7.0, cuantos: 3, atraviesa: 2, alcance: 330 },
      ],
      evoluciona: { con: "filo", en: "tormenta" },
    },
    /* Trozos que giran. No hay que hacer nada, y por eso es la respuesta a quedar
       rodeado: pega en todas las direcciones a la vez. */
    orbita: {
      tipo: "orbita", color: "#7cf6ff",
      niveles: [
        { cuantos: 2, daño: 7,  radio: 56, giro: 2.2, r: 9 },
        { cuantos: 3, daño: 9,  radio: 60, giro: 2.4, r: 9 },
        { cuantos: 4, daño: 11, radio: 64, giro: 2.6, r: 10 },
        { cuantos: 5, daño: 14, radio: 70, giro: 2.8, r: 10 },
        { cuantos: 6, daño: 18, radio: 76, giro: 3.0, r: 11 },
      ],
      evoluciona: { con: "pulso", en: "anillo" },
    },
    /* Una onda que se abre desde vos. Poco daño pero empuja, y empujar es lo que
       te saca de un abrazo del que no se sale disparando. */
    onda: {
      tipo: "onda", color: "#b48cff",
      niveles: [
        { cada: 3.2, daño: 12, radio: 96,  empuje: 150 },
        { cada: 2.9, daño: 15, radio: 112, empuje: 165 },
        { cada: 2.6, daño: 19, radio: 130, empuje: 180 },
        { cada: 2.3, daño: 24, radio: 150, empuje: 200 },
        { cada: 2.0, daño: 30, radio: 172, empuje: 225 },
      ],
      evoluciona: { con: "coraza", en: "sismo" },
    },
    /* Un latigazo para donde vas. Es la única que premia mirar para dónde corrés,
       así que le da algo que hacer al que quiere jugar fino. */
    hilo: {
      tipo: "hilo", color: "#ff6ea9",
      niveles: [
        { cada: 1.20, daño: 16, largo: 100, ancho: 36 },
        { cada: 1.05, daño: 20, largo: 112, ancho: 40 },
        { cada: 0.92, daño: 25, largo: 124, ancho: 44 },
        { cada: 0.80, daño: 31, largo: 138, ancho: 50 },
        { cada: 0.68, daño: 39, largo: 154, ancho: 56 },
      ],
      evoluciona: { con: "botas", en: "guadaña" },
    },
    /* Semillas que quedan atrás y estallan. Premia correr en círculos, que es lo
       que uno termina haciendo igual. */
    semilla: {
      tipo: "semilla", color: "#8ad06a",
      niveles: [
        { cada: 1.7, daño: 22, radio: 46, dura: 6 },
        { cada: 1.5, daño: 27, radio: 52, dura: 6 },
        { cada: 1.3, daño: 33, radio: 58, dura: 7 },
        { cada: 1.1, daño: 41, radio: 66, dura: 7 },
        { cada: 0.9, daño: 52, radio: 74, dura: 8 },
      ],
      evoluciona: { con: "iman", en: "raiz" },
    },
  };

  /* ── LAS EVOLUCIONES ────────────────────────────────────────────────────────
     Un arma al máximo MAS su pasiva al máximo se funden en otra cosa. Existen
     por una razón concreta: sin ellas, después del nivel quince todas las
     ofertas son "+1 a algo que ya tenés" y la pantalla de mejoras —que es donde
     está el juego— se vuelve un trámite. Con ellas, las pasivas dejan de ser el
     premio consuelo y pasan a ser una apuesta: subir `filo` no es sólo más daño,
     es el camino a otra arma.
     Se ofrecen SOLAS y marcadas, porque una evolución que aparece mezclada entre
     dos mejoras comunes se elige sin entender que era la jugada de la partida. */
  const EVOLUCIONES = {
    tormenta: { tipo: "tiro",   color: "#fff3a0", de: "chispa",
                datos: { cada: 0.20, daño: 34, vel: 520, radio: 8, cuantos: 5, atraviesa: 99, alcance: 380 } },
    anillo:   { tipo: "anillo", color: "#b6fbff", de: "orbita",
                datos: { daño: 26, radio: 92, giro: 3.6, grosor: 15 } },
    sismo:    { tipo: "onda",   color: "#d9c2ff", de: "onda",
                datos: { cada: 1.5, daño: 52, radio: 240, empuje: 330, aturde: 1.1 } },
    guadaña:  { tipo: "guadaña",color: "#ffa8cc", de: "hilo",
                datos: { cada: 0.55, daño: 48, radio: 128, arco: Math.PI * 1.35 } },
    raiz:     { tipo: "raiz",   color: "#b6f09a", de: "semilla",
                datos: { cada: 0.8, daño: 40, radio: 74, dura: 9, hilo: 12 } },
  };

  /** Las pasivas. Suben un número — y son la mitad de cada evolución. */
  const PASIVAS = {
    botas:  { max: 5, aplicar: (p, n) => { p.vel = 140 * (1 + n * 0.09); } },
    /* EL IMAN ARRANCA GRANDE, y eso es balance. Las gemas caen DONDE MUERE EL
       BICHO, y con un arma de alcance eso es lejos de vos. Con un radio chico el
       jugador huía, las gemas quedaban atrás y no subía de nivel nunca: medido,
       25 bichos matados, 21 gemas en el piso y 4 de experiencia. El juego entero
       es subir de nivel, así que juntar no puede depender de volver a pisar. */
    iman:   { max: 5, aplicar: (p, n) => { p.iman = 150 * (1 + n * 0.30); } },
    coraza: { max: 5, aplicar: (p, n) => { p.vidaMax = 100 + n * 26; } },
    filo:   { max: 5, aplicar: (p, n) => { p.daño = 1 + n * 0.12; } },
    pulso:  { max: 5, aplicar: (p, n) => { p.frecuencia = 1 - n * 0.065; } },
  };

  /** Cuánta experiencia hace falta para el nivel `n`.
   *
   *  CRECE PERO NO SE DISPARA. Con una curva exponencial, pasado el nivel diez no
   *  se sube más y las mejoras que faltan no se ven nunca; con una plana, a los
   *  dos minutos está todo al máximo y el resto de la partida es inercia. */
  const xpParaNivel = (n) => Math.round(4 + n * 2.6 + n * n * 0.45);

  /* EL ENVION. Es la única cosa que se aprieta en todo el juego, y existe porque
     sin él la habilidad se reduce a caminar bien: no hay forma de arreglar un
     error. Medio segundo de invulnerabilidad convierte "me encerraron" en "me
     encerraron y salí", que es la diferencia entre una muerte injusta y una
     buena. Con espera larga para que no sea la respuesta a todo. */
  const ENVION = { distancia: 168, espera: 3.4, gracia: 0.42, dura: 0.16 };

  return { ARMAS, EVOLUCIONES, PASIVAS, xpParaNivel, ENVION };
})();

/* ── mundo.js ── */
const M_mundo = (() => {
  // El mundo: bichos, tiros, gemas, cofres y el reloj. Sin dibujo y sin audio.
  //
  // POR QUE LA SIMULACION VIVE SOLA. Un juego de supervivencia se rompe por el
  // balance, no por el dibujo: que el jefe sea imposible, que un arma no sirva
  // nunca, que a los cinco minutos entren tantos bichos que el teléfono se
  // arrastre. Nada de eso se ve mirando una captura. Acá un robot juega partidas
  // enteras en milisegundos y las pruebas miden cuántas sobreviven, con qué arma
  // y cuántos bichos llegó a haber a la vez.

  const { azar, uno, entre } = M_azar;
  const { BICHOS, ETAPAS, dureza, MAX_BICHOS, ELITE, probElite, RECICLAR } = M_bichos;
  const { ARMAS, EVOLUCIONES, PASIVAS, xpParaNivel, ENVION } = M_armas;
  /* LA REJILLA. Sin ella, separar a los bichos entre sí es comparar cada uno con
     cada uno: con doscientos son cuarenta mil comparaciones por cuadro y el
     teléfono se planta. Con celdas del tamaño del bicho más grande, cada uno
     mira sólo sus nueve celdas vecinas. */
  class Rejilla {
    constructor(lado) { this.lado = lado; this.celdas = new Map(); }
    clave(x, y) { return ((x / this.lado) | 0) * 73856093 ^ ((y / this.lado) | 0) * 19349663; }
    limpiar() { this.celdas.clear(); }
    meter(o) {
      const k = this.clave(o.x, o.y);
      let c = this.celdas.get(k);
      if (!c) this.celdas.set(k, c = []);
      c.push(o);
    }
    *cerca(x, y) {
      const L = this.lado;
      for (let dy = -L; dy <= L; dy += L)
        for (let dx = -L; dx <= L; dx += L) {
          const c = this.celdas.get(this.clave(x + dx, y + dy));
          if (c) yield* c;
        }
    }
  }

  class Mundo {
    constructor(semilla = 1, etapa = 1, opciones = {}) {
      this.r = azar(semilla);
      this.semilla = semilla;
      this.etapa = ETAPAS.find((e) => e.id === etapa) || ETAPAS[0];
      this.largo = this.etapa.largo;
      // El mundo es más grande que la pantalla para que huir signifique algo,
      // pero tiene borde: un mapa infinito se juega corriendo en línea recta.
      this.radioMapa = opciones.radioMapa || 900;
      this.jugador = {
        x: 0, y: 0, r: 14,
        vel: 140, vida: 100, vidaMax: 100, iman: 150, daño: 1, frecuencia: 1,
        rumbo: 0, invulnerable: 0,
        envion: 0, envionListo: 0, envionDir: { x: 1, y: 0 },
        armas: { chispa: 1 }, pasivas: {}, evolucionadas: {},
        nivel: 1, xp: 0, xpNecesaria: xpParaNivel(1),
      };
      this.bichos = [];
      this.tiros = [];      // los míos
      this.balas = [];      // los de ellos
      this.gemas = [];
      this.cofres = [];
      this.semillas = [];
      this.ondas = [];
      this.latigos = [];
      this.guadañas = [];
      this.golpes = [];
      this.rejilla = new Rejilla(48);
      this.t = 0;
      this.relojes = {};
      this.anguloOrbita = 0;
      this.muerto = false;
      this.gano = false;
      this.matados = 0;
      this.pendienteMejora = 0;
      this.proximaOleada = 0;
      this.jefesLargados = 0;
      this.jefesVivos = 0;
      this.picoBichos = 0;
    }

    // ── consultas ────────────────────────────────────────────────────────────
    nivelArma(n) { return this.jugador.armas[n] || 0; }
    evolucionada(n) { return !!this.jugador.evolucionadas[n]; }
    datosArma(n) {
      if (this.evolucionada(n)) return EVOLUCIONES[this.jugador.evolucionadas[n]].datos;
      return ARMAS[n].niveles[this.nivelArma(n) - 1];
    }
    terminada() { return this.muerto || this.gano; }
    maxArmas() { return 4; }

    /** ¿Qué armas están listas para evolucionar ahora mismo? */
    evolucionesListas() {
      const fuera = [];
      for (const [n, a] of Object.entries(ARMAS)) {
        if (!a.evoluciona || this.evolucionada(n)) continue;
        if (this.nivelArma(n) < a.niveles.length) continue;
        if ((this.jugador.pasivas[a.evoluciona.con] || 0) < PASIVAS[a.evoluciona.con].max) continue;
        fuera.push({ clase: "evolucion", nombre: n, en: a.evoluciona.en, nivel: 0, nueva: true });
      }
      return fuera;
    }

    /** Qué se ofrece al subir de nivel.
     *
     *  UNA EVOLUCION LISTA SE OFRECE SOLA Y PRIMERO. Mezclada entre dos mejoras
     *  comunes se elige sin entender que era la jugada de la partida, y esa es
     *  justo la decisión que el juego quiere que tomes mirando.
     *  Y NUNCA SE OFRECE ALGO YA AGOTADO: en el nivel veinte, tres casillas
     *  repetidas al máximo convierten la subida de nivel en un trámite. */
    ofertas() {
      const evo = this.evolucionesListas();
      if (evo.length) return [evo[0]];

      const bolsa = [];
      for (const n of Object.keys(ARMAS)) {
        if (this.evolucionada(n)) continue;
        const lv = this.nivelArma(n);
        if (lv >= ARMAS[n].niveles.length) continue;
        if (lv === 0 && Object.keys(this.jugador.armas).length >= this.maxArmas()) continue;
        bolsa.push({ clase: "arma", nombre: n, nivel: lv + 1, nueva: lv === 0 });
      }
      for (const n of Object.keys(PASIVAS)) {
        const lv = this.jugador.pasivas[n] || 0;
        if (lv >= PASIVAS[n].max) continue;
        bolsa.push({ clase: "pasiva", nombre: n, nivel: lv + 1, nueva: lv === 0 });
      }
      const fuera = [];
      while (fuera.length < 3 && bolsa.length) {
        const i = Math.floor(this.r() * bolsa.length) % bolsa.length;
        fuera.push(bolsa.splice(i, 1)[0]);
      }
      // Si ya no queda NADA que subir, se ofrece vida: una mejora vacía sería
      // una pantalla que no se puede cerrar.
      if (!fuera.length) fuera.push({ clase: "curar", nombre: "curar", nivel: 0, nueva: false });
      return fuera;
    }

    elegir(oferta) {
      if (!oferta) return;
      const p = this.jugador;
      if (oferta.clase === "arma") p.armas[oferta.nombre] = oferta.nivel;
      else if (oferta.clase === "evolucion") {
        p.evolucionadas[oferta.nombre] = oferta.en;
        this.golpes.push({ que: "evolucion", x: p.x, y: p.y });
      } else if (oferta.clase === "curar") p.vida = Math.min(p.vidaMax, p.vida + 40);
      else {
        p.pasivas[oferta.nombre] = oferta.nivel;
        PASIVAS[oferta.nombre].aplicar(p, oferta.nivel);
        if (oferta.nombre === "coraza") p.vida = Math.min(p.vidaMax, p.vida + 26);
      }
      this.pendienteMejora = Math.max(0, this.pendienteMejora - 1);
    }

    /** El envión. Devuelve true si salió. */
    lanzarEnvion() {
      const p = this.jugador;
      if (p.envionListo > 0 || p.envion > 0) return false;
      const m = Math.hypot(p.envionDir.x, p.envionDir.y) || 1;
      p.envion = ENVION.dura;
      p.envionListo = ENVION.espera;
      p.invulnerable = Math.max(p.invulnerable, ENVION.gracia);
      p.envionDir = { x: p.envionDir.x / m, y: p.envionDir.y / m };
      this.golpes.push({ que: "envion", x: p.x, y: p.y });
      return true;
    }

    // ── el paso ──────────────────────────────────────────────────────────────
    avanzar(dt, mov) {
      if (this.terminada() || this.pendienteMejora > 0) return;
      this.t += dt;
      this.golpes.length = 0;

      this.moverJugador(dt, mov);
      this.largarBichos();
      this.rearmarRejilla();
      this.moverBichos(dt);
      this.moverBalas(dt);
      this.dispararArmas(dt);
      this.moverTiros(dt);
      this.moverOrbita(dt);
      this.moverOndas(dt);
      this.moverSemillas(dt);
      this.moverLatigos(dt);
      this.moverGuadañas(dt);
      this.recogerCosas(dt);

      if (this.jugador.vida <= 0) { this.jugador.vida = 0; this.muerto = true; }
      /* SE GANA POR AGUANTAR, no por matar al jefe.
         La primera versión pedía además que no quedara ningún jefe vivo, y eso
         hace la etapa imposible de terminar: medido, el robot sobrevivía 318
         segundos de una etapa de 300 y perdía igual, porque nunca llegaba a
         bajar los 1500 puntos de vida del jefe mientras huía. El jefe es una
         amenaza a esquivar, no un peaje. */
      if (this.t >= this.largo && !this.muerto) this.gano = true;
      if (this.bichos.length > this.picoBichos) this.picoBichos = this.bichos.length;
    }

    moverJugador(dt, mov) {
      const p = this.jugador;
      if (p.envionListo > 0) p.envionListo -= dt;
      const m = Math.hypot(mov.x, mov.y);
      if (m > 0.02) {
        p.rumbo = Math.atan2(mov.y, mov.x);
        p.envionDir = { x: mov.x / m, y: mov.y / m };
      }
      if (p.envion > 0) {
        // durante el envión no se dirige: es un compromiso, no un movimiento
        p.envion -= dt;
        const v = ENVION.distancia / ENVION.dura;
        p.x += p.envionDir.x * v * dt;
        p.y += p.envionDir.y * v * dt;
      } else if (m > 0.02) {
        const k = Math.min(1, m);
        p.x += (mov.x / m) * p.vel * k * dt;
        p.y += (mov.y / m) * p.vel * k * dt;
      }
      // el borde frena, no rebota: rebotar con treinta bichos encima se siente
      // como que el juego te empujó a la muerte
      const d = Math.hypot(p.x, p.y);
      if (d > this.radioMapa) { p.x = (p.x / d) * this.radioMapa; p.y = (p.y / d) * this.radioMapa; }
      if (p.invulnerable > 0) p.invulnerable -= dt;
    }

    oleadaActual() {
      let cual = this.etapa.oleadas[0];
      for (const o of this.etapa.oleadas) if (this.t >= o.desde && o.cada) cual = o;
      return cual;
    }

    largarBichos() {
      // los jefes salen una sola vez cada uno, en su momento
      const debidos = this.etapa.oleadas.filter((q) => q.jefe && q.desde <= this.t);
      if (this.jefesLargados < debidos.length) {
        const q = debidos[this.jefesLargados];
        this.jefesLargados++;
        this.nacer(q.jefe, 1);
        this.jefesVivos++;
        this.golpes.push({ que: "jefe", x: this.jugador.x, y: this.jugador.y });
        return;
      }
      const o = this.oleadaActual();
      if (!o || !o.cada || this.t < o.desde) return;
      if (this.t < this.proximaOleada) return;
      this.proximaOleada = this.t + o.cada;
      // el techo frena la entrada, no mata lo que ya está: los que hay se ganan
      if (this.bichos.length >= MAX_BICHOS) return;
      for (let i = 0; i < o.porVez && this.bichos.length < MAX_BICHOS; i++) {
        let tipo = uno(this.r, o.tipos);
        // si esa especie llegó a su techo, entra otra en vez de saltear el turno:
        // saltear haría que la oleada entera se afine cuando sobra de una sola
        if (BICHOS[tipo].maxVivos && this.cuantosDe(tipo) >= BICHOS[tipo].maxVivos)
          tipo = uno(this.r, o.tipos.filter((q) => !BICHOS[q].maxVivos || this.cuantosDe(q) < BICHOS[q].maxVivos) ,
                    ) || tipo;
        this.nacer(tipo, 1);
      }
    }

    /** Nace fuera de la pantalla, en un anillo alrededor del jugador.
     *
     *  NUNCA ENCIMA: uno que aparece pegado saca vida antes de que se lo vea, y
     *  eso se siente como trampa y no como dificultad. */
    nacer(tipo, cuantos) {
      for (let i = 0; i < cuantos; i++) {
        const a = this.r() * 6.283, d = entre(this.r, 430, 540);
        this.nacerEn(tipo, this.jugador.x + Math.cos(a) * d, this.jugador.y + Math.sin(a) * d, 0);
      }
    }

    nacerEn(tipo, x, y, disp, forzarElite) {
      const b = BICHOS[tipo];
      const elite = forzarElite ?? (!b.jefe && this.r() < probElite(this.t));
      const vida = b.vida * dureza(this.t, this.etapa.id) * (elite ? ELITE.vida : 1);
      this.bichos.push({
        tipo, elite,
        x: x + (disp ? entre(this.r, -disp, disp) : 0),
        y: y + (disp ? entre(this.r, -disp, disp) : 0),
        r: b.r * (elite ? ELITE.r : 1),
        vida, vidaMax: vida,
        golpeado: 0, fase: this.r() * 6.283, aturdido: 0,
        reloj: this.r() * 2, salto: 0, saltoDir: { x: 0, y: 0 },
      });
    }

    cuantosDe(tipo) {
      let n = 0;
      for (const b of this.bichos) if (b.tipo === tipo) n++;
      return n;
    }

    rearmarRejilla() {
      this.rejilla.limpiar();
      for (const b of this.bichos) this.rejilla.meter(b);
    }

    moverBichos(dt) {
      const p = this.jugador;
      for (let i = this.bichos.length - 1; i >= 0; i--) {
        const b = this.bichos[i], d = BICHOS[b.tipo];
        if (b.aturdido > 0) { b.aturdido -= dt; continue; }
        const lejos = Math.hypot(b.x - p.x, b.y - p.y);
        // el que acecha o dispara y quedó lejísimos se borra: no amenaza a nadie
        if (d.olvida && lejos > d.olvida) { this.bichos.splice(i, 1); continue; }
        // el resto no se borra, se RECICLA: vuelve a entrar por el otro lado
        if (!d.jefe && lejos > RECICLAR) {
          const a = this.r() * 6.283, dd = entre(this.r, 430, 520);
          b.x = p.x + Math.cos(a) * dd;
          b.y = p.y + Math.sin(a) * dd;
          continue;
        }
        let dx = p.x - b.x, dy = p.y - b.y;
        const dist = Math.hypot(dx, dy) || 1;
        dx /= dist; dy /= dist;
        const vel = d.vel * (b.elite ? ELITE.vel : 1);

        if (d.acecha) {
          /* EL QUE ACECHA se queda quieto hasta que entrás en su radio y ahí se
             impulsa. Hace que cruzar un claro vacío deje de ser gratis. */
          b.reloj -= dt;
          if (b.salto > 0) {
            b.salto -= dt;
            b.x += b.saltoDir.x * d.acecha.impulso * dt;
            b.y += b.saltoDir.y * d.acecha.impulso * dt;
          } else if (dist < d.acecha.radio && b.reloj <= 0) {
            b.salto = 0.32; b.saltoDir = { x: dx, y: dy };
            b.reloj = d.acecha.descanso;
            this.golpes.push({ que: "acecho", x: b.x, y: b.y });
          }
        } else if (d.distancia) {
          /* EL QUE ESCUPE guarda distancia: se acerca si está lejos y se aleja si
             está cerca. Es el único al que hay que IR a buscar, y sin él alejarse
             siempre sería gratis. */
          const signo = dist > d.distancia ? 1 : (dist < d.distancia * 0.72 ? -1 : 0);
          b.x += dx * vel * signo * dt;
          b.y += dy * vel * signo * dt;
          b.reloj -= dt;
          if (b.reloj <= 0 && dist < d.distancia * 1.5) {
            b.reloj = d.escupe.cada;
            this.balas.push({ x: b.x, y: b.y, vx: dx * d.escupe.vel, vy: dy * d.escupe.vel,
                              r: d.escupe.r, daño: d.escupe.daño, vida: 3 });
            this.golpes.push({ que: "escupe", x: b.x, y: b.y });
          }
        } else {
          if (d.errante) {
            const s = Math.sin(this.t * 3.4 + b.fase) * 0.75;
            const nx = -dy, ny = dx;
            dx += nx * s; dy += ny * s;
            const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
          }
          b.x += dx * vel * dt;
          b.y += dy * vel * dt;
        }

        // los jefes que crían y los que abren en abanico
        if (d.cria) {
          b.reloj -= dt;
          if (b.reloj <= 0) {
            b.reloj = d.cria.cada;
            for (let k = 0; k < d.cria.cuantos && this.bichos.length < MAX_BICHOS; k++)
              this.nacerEn(d.cria.tipo, b.x, b.y, 40, false);
          }
        }
        if (d.abanico) {
          b.reloj -= dt;
          if (b.reloj <= 0) {
            b.reloj = d.abanico.cada;
            const base = Math.atan2(p.y - b.y, p.x - b.x);
            for (let k = 0; k < d.abanico.cuantos; k++) {
              const a = base + (k - (d.abanico.cuantos - 1) / 2) * 0.22;
              this.balas.push({ x: b.x, y: b.y, vx: Math.cos(a) * d.abanico.vel, vy: Math.sin(a) * d.abanico.vel,
                                r: d.abanico.r, daño: d.abanico.daño, vida: 4 });
            }
            this.golpes.push({ que: "escupe", x: b.x, y: b.y });
          }
        }

        /* SEPARACION. Sin esto, cincuenta bichos convergen al mismo punto y se
           apilan en uno: se ve un bicho y te pega por cincuenta. Los pesados
           empujan a los livianos y no al revés. */
        let sx = 0, sy = 0;
        for (const o of this.rejilla.cerca(b.x, b.y)) {
          if (o === b) continue;
          const ox = b.x - o.x, oy = b.y - o.y;
          const dd = ox * ox + oy * oy;
          const min = (b.r + o.r) * 0.92;
          if (dd > min * min || dd < 1e-6) continue;
          const l = Math.sqrt(dd);
          const f = (min - l) / min * (BICHOS[o.tipo].peso / d.peso);
          sx += (ox / l) * f; sy += (oy / l) * f;
        }
        b.x += sx * 90 * dt; b.y += sy * 90 * dt;
        if (b.golpeado > 0) b.golpeado -= dt;

        if (dist < b.r + p.r && p.invulnerable <= 0) {
          p.vida -= d.daño;
          /* MEDIO SEGUNDO DE GRACIA. Es lo que separa "me comí un golpe" de "me
             fundieron en un segundo y no vi nada": sin ventana, un abrazo saca la
             barra entera antes de que el dedo reaccione. */
          p.invulnerable = 0.45;
          this.golpes.push({ que: "jugador", x: p.x, y: p.y });
        }
        if (b.vida <= 0) this.matar(i);
      }
    }

    moverBalas(dt) {
      const p = this.jugador;
      for (let i = this.balas.length - 1; i >= 0; i--) {
        const b = this.balas[i];
        b.x += b.vx * dt; b.y += b.vy * dt; b.vida -= dt;
        if (b.vida <= 0) { this.balas.splice(i, 1); continue; }
        if ((b.x - p.x) ** 2 + (b.y - p.y) ** 2 < (b.r + p.r) ** 2) {
          this.balas.splice(i, 1);
          if (p.invulnerable <= 0) {
            p.vida -= b.daño; p.invulnerable = 0.45;
            this.golpes.push({ que: "jugador", x: p.x, y: p.y });
          }
        }
      }
    }

    matar(i) {
      const b = this.bichos[i];
      const d = BICHOS[b.tipo];
      this.bichos.splice(i, 1);
      this.matados++;
      const xp = d.xp * (b.elite ? ELITE.xp : 1);
      this.gemas.push({ x: b.x, y: b.y, xp, r: d.jefe ? 10 : (b.elite ? 7 : 5) });
      this.golpes.push({ que: "muere", x: b.x, y: b.y, jefe: !!d.jefe, elite: b.elite, tipo: b.tipo });
      if (b.elite || d.jefe) this.cofres.push({ x: b.x, y: b.y, r: 13, jefe: !!d.jefe });
      if (d.jefe) this.jefesVivos = Math.max(0, this.jefesVivos - 1);
      // los que se parten: el saco deja crías, el jefe se deshace
      if (d.parte) for (const t of d.parte)
        if (this.bichos.length < MAX_BICHOS) this.nacerEn(t, b.x, b.y, d.jefe ? 70 : 26, false);
    }

    masCercano(x, y, hasta = 1e9) {
      let mejor = null, mejorD = hasta * hasta;
      for (const b of this.bichos) {
        const d = (b.x - x) ** 2 + (b.y - y) ** 2;
        if (d < mejorD) { mejorD = d; mejor = b; }
      }
      return mejor;
    }

    reloj(n, cada, dt) {
      this.relojes[n] = (this.relojes[n] || 0) + dt;
      if (this.relojes[n] < cada * this.jugador.frecuencia) return false;
      this.relojes[n] = 0;
      return true;
    }

    /** El daño que recibe un bicho, ya descontado su blindaje. */
    dañar(b, cuanto) {
      const bl = BICHOS[b.tipo].blindado || 0;
      // EL BLINDAJE ES UNA FRACCION Y NO UN RESTO FIJO. Restando un número, un
      // arma de muchos golpes chiquitos deja de hacer NADA y el jugador no
      // entiende por qué; con fracción siempre pega, sólo que menos.
      const real = cuanto * (1 - bl);
      b.vida -= real;
      b.golpeado = 0.12;
      this.golpes.push({ que: "pega", x: b.x, y: b.y, cuanto: real, blindado: bl > 0 });
    }

    dispararArmas(dt) {
      const p = this.jugador;
      for (const nombre of Object.keys(p.armas)) {
        const evo = p.evolucionadas[nombre];
        const tipo = evo ? EVOLUCIONES[evo].tipo : ARMAS[nombre].tipo;
        const a = this.datosArma(nombre);
        if (tipo === "tiro" && this.reloj(nombre, a.cada, dt)) {
          for (let k = 0; k < a.cuantos; k++) {
            const b = this.masCercano(p.x, p.y, a.alcance);
            if (!b) break;
            const ang = Math.atan2(b.y - p.y, b.x - p.x) + (k - (a.cuantos - 1) / 2) * 0.17;
            this.tiros.push({ x: p.x, y: p.y, vx: Math.cos(ang) * a.vel, vy: Math.sin(ang) * a.vel,
                              r: a.radio, daño: a.daño * p.daño, vida: 1.7,
                              atraviesa: a.atraviesa, tocados: new Set(), color: evo ? EVOLUCIONES[evo].color : ARMAS[nombre].color });
          }
          this.golpes.push({ que: "tiro", x: p.x, y: p.y });
        } else if (tipo === "onda" && this.reloj(nombre, a.cada, dt)) {
          this.ondas.push({ x: p.x, y: p.y, r: 0, rMax: a.radio, daño: a.daño * p.daño,
                            empuje: a.empuje, aturde: a.aturde || 0, tocados: new Set() });
          this.golpes.push({ que: "onda", x: p.x, y: p.y });
        } else if (tipo === "semilla" && this.reloj(nombre, a.cada, dt)) {
          this.semillas.push({ x: p.x, y: p.y, r: a.radio, daño: a.daño * p.daño, dura: a.dura,
                               listo: 0.45, tocados: new Set() });
        } else if (tipo === "raiz" && this.reloj(nombre, a.cada, dt)) {
          this.semillas.push({ x: p.x, y: p.y, r: a.radio, daño: a.daño * p.daño, dura: a.dura,
                               listo: 0.25, tocados: new Set(), raiz: true });
        } else if (tipo === "hilo" && this.reloj(nombre, a.cada, dt)) {
          this.latigos.push({ x: p.x, y: p.y, rumbo: p.rumbo, largo: a.largo, ancho: a.ancho,
                              daño: a.daño * p.daño, vida: 0.18, tocados: new Set() });
          this.golpes.push({ que: "hilo", x: p.x, y: p.y });
        } else if (tipo === "guadaña" && this.reloj(nombre, a.cada, dt)) {
          this.guadañas.push({ rumbo: p.rumbo - a.arco / 2, arco: a.arco, radio: a.radio,
                               daño: a.daño * p.daño, vida: 0.3, tocados: new Set() });
          this.golpes.push({ que: "hilo", x: p.x, y: p.y });
        }
      }
    }

    moverTiros(dt) {
      for (let i = this.tiros.length - 1; i >= 0; i--) {
        const t = this.tiros[i];
        t.x += t.vx * dt; t.y += t.vy * dt; t.vida -= dt;
        if (t.vida <= 0) { this.tiros.splice(i, 1); continue; }
        for (const b of this.rejilla.cerca(t.x, t.y)) {
          if (t.tocados.has(b)) continue;
          if ((b.x - t.x) ** 2 + (b.y - t.y) ** 2 > (b.r + t.r) ** 2) continue;
          this.dañar(b, t.daño);
          t.tocados.add(b);
          if (t.tocados.size > t.atraviesa) { this.tiros.splice(i, 1); break; }
        }
      }
      this.limpiarMuertos();
    }

    moverOrbita(dt) {
      const p = this.jugador;
      const evo = p.evolucionadas.orbita;
      if (!this.nivelArma("orbita")) return;
      const a = this.datosArma("orbita");
      this.anguloOrbita += a.giro * dt;
      if (evo) {
        // el anillo: un aro completo, así que se mira la distancia y no cada trozo
        for (const b of this.bichos) {
          const d = Math.hypot(b.x - p.x, b.y - p.y);
          if (Math.abs(d - a.radio) > a.grosor + b.r) continue;
          b.cdOrbita = (b.cdOrbita || 0) - dt;
          if (b.cdOrbita > 0) continue;
          b.cdOrbita = 0.28;
          this.dañar(b, a.daño * p.daño);
        }
      } else {
        for (let k = 0; k < a.cuantos; k++) {
          const ang = this.anguloOrbita + (k / a.cuantos) * 6.283;
          const x = p.x + Math.cos(ang) * a.radio, y = p.y + Math.sin(ang) * a.radio;
          for (const b of this.rejilla.cerca(x, y)) {
            if ((b.x - x) ** 2 + (b.y - y) ** 2 > (b.r + a.r) ** 2) continue;
            // pega por tiempo y no por toque: si no, un bicho pegado recibe
            // sesenta golpes por segundo y todo lo demás sobra
            b.cdOrbita = (b.cdOrbita || 0) - dt;
            if (b.cdOrbita > 0) continue;
            b.cdOrbita = 0.3;
            this.dañar(b, a.daño * p.daño);
          }
        }
      }
      this.limpiarMuertos();
    }

    moverOndas(dt) {
      for (let i = this.ondas.length - 1; i >= 0; i--) {
        const o = this.ondas[i];
        o.r += (o.rMax / 0.45) * dt;
        if (o.r >= o.rMax) { this.ondas.splice(i, 1); continue; }
        for (const b of this.bichos) {
          if (o.tocados.has(b)) continue;
          const d = Math.hypot(b.x - o.x, b.y - o.y);
          if (d > o.r || d < o.r - 44) continue;
          o.tocados.add(b);
          this.dañar(b, o.daño);
          if (o.aturde) b.aturdido = Math.max(b.aturdido, o.aturde);
          const m = d || 1;
          b.x += ((b.x - o.x) / m) * o.empuje * 0.12;
          b.y += ((b.y - o.y) / m) * o.empuje * 0.12;
        }
      }
      this.limpiarMuertos();
    }

    moverSemillas(dt) {
      for (let i = this.semillas.length - 1; i >= 0; i--) {
        const s = this.semillas[i];
        s.dura -= dt;
        if (s.listo > 0) { s.listo -= dt; continue; }
        if (s.dura <= 0) { this.semillas.splice(i, 1); continue; }
        for (const b of this.rejilla.cerca(s.x, s.y)) {
          if (s.tocados.has(b)) continue;
          if ((b.x - s.x) ** 2 + (b.y - s.y) ** 2 > (b.r + s.r) ** 2) continue;
          s.tocados.add(b);
          this.dañar(b, s.daño);
        }
        // la raíz además une con la semilla anterior y quema la línea
        if (s.raiz && i > 0) {
          const q = this.semillas[i - 1];
          if (q && q.raiz) for (const b of this.bichos) {
            const dx = b.x - s.x, dy = b.y - s.y;
            const lx = q.x - s.x, ly = q.y - s.y;
            const ll = lx * lx + ly * ly || 1;
            const u = Math.max(0, Math.min(1, (dx * lx + dy * ly) / ll));
            const px = s.x + lx * u, py = s.y + ly * u;
            if ((b.x - px) ** 2 + (b.y - py) ** 2 > (b.r + 12) ** 2) continue;
            b.cdRaiz = (b.cdRaiz || 0) - dt;
            if (b.cdRaiz > 0) continue;
            b.cdRaiz = 0.4;
            this.dañar(b, s.daño * 0.35);
          }
        }
      }
      this.limpiarMuertos();
    }

    moverLatigos(dt) {
      for (let i = this.latigos.length - 1; i >= 0; i--) {
        const l = this.latigos[i];
        l.vida -= dt;
        if (l.vida <= 0) { this.latigos.splice(i, 1); continue; }
        for (const b of this.bichos) {
          if (l.tocados.has(b)) continue;
          const dx = b.x - l.x, dy = b.y - l.y;
          const a = dx * Math.cos(l.rumbo) + dy * Math.sin(l.rumbo);
          const o = -dx * Math.sin(l.rumbo) + dy * Math.cos(l.rumbo);
          if (a < -b.r || a > l.largo + b.r || Math.abs(o) > l.ancho / 2 + b.r) continue;
          l.tocados.add(b);
          this.dañar(b, l.daño);
        }
      }
      this.limpiarMuertos();
    }

    moverGuadañas(dt) {
      const p = this.jugador;
      for (let i = this.guadañas.length - 1; i >= 0; i--) {
        const g = this.guadañas[i];
        g.vida -= dt;
        if (g.vida <= 0) { this.guadañas.splice(i, 1); continue; }
        const avance = g.arco * (dt / 0.3);
        g.rumbo += avance;
        for (const b of this.bichos) {
          if (g.tocados.has(b)) continue;
          const d = Math.hypot(b.x - p.x, b.y - p.y);
          if (d > g.radio + b.r) continue;
          const a = Math.atan2(b.y - p.y, b.x - p.x);
          let dif = ((a - g.rumbo + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
          if (Math.abs(dif) > avance * 1.6 + 0.25) continue;
          g.tocados.add(b);
          this.dañar(b, g.daño);
        }
      }
      this.limpiarMuertos();
    }

    limpiarMuertos() {
      for (let i = this.bichos.length - 1; i >= 0; i--) if (this.bichos[i].vida <= 0) this.matar(i);
    }

    recogerCosas(dt) {
      const p = this.jugador;
      for (let i = this.gemas.length - 1; i >= 0; i--) {
        const g = this.gemas[i];
        let d = Math.hypot(g.x - p.x, g.y - p.y);
        /* LA GEMA SIEMPRE VIENE, esté donde esté, y una vez atraída no suelta.
           Con un radio, una gema que cayó afuera queda muerta para siempre y el
           jugador nunca se entera de que perdió experiencia: sólo sube más lento
           de lo que debería. Lejos viene despacio —hay que ir a buscarla, que es
           la decisión— y adentro del imán se acelera. */
        if (d < p.iman) g.atraida = true;
        const v = g.atraida ? p.vel * 1.75 + (p.iman - Math.min(d, p.iman)) * 3 : 34;
        g.x += ((p.x - g.x) / (d || 1)) * v * dt;
        g.y += ((p.y - g.y) / (d || 1)) * v * dt;
        d = Math.hypot(g.x - p.x, g.y - p.y);
        if (d < p.r + g.r + 6) {
          this.gemas.splice(i, 1);
          p.xp += g.xp;
          this.golpes.push({ que: "gema", x: g.x, y: g.y });
          while (p.xp >= p.xpNecesaria) {
            p.xp -= p.xpNecesaria;
            p.nivel++;
            p.xpNecesaria = xpParaNivel(p.nivel);
            this.pendienteMejora++;
          }
        }
      }
      for (let i = this.cofres.length - 1; i >= 0; i--) {
        const c = this.cofres[i];
        if (Math.hypot(c.x - p.x, c.y - p.y) > p.r + c.r + 4) continue;
        this.cofres.splice(i, 1);
        this.abrirCofre(c);
      }
    }

    /** El cofre. Es el único premio del juego que no se elige: cae lo que cae. */
    abrirCofre(c) {
      const p = this.jugador;
      const q = this.r();
      if (c.jefe || q < 0.34) {
        // subida de nivel gratis: el premio grande
        this.pendienteMejora++;
        this.golpes.push({ que: "cofre", x: c.x, y: c.y, premio: "nivel" });
      } else if (q < 0.7) {
        p.vida = Math.min(p.vidaMax, p.vida + 45);
        this.golpes.push({ que: "cofre", x: c.x, y: c.y, premio: "vida" });
      } else {
        // arrasa: todo lo que está cerca recibe un golpe grande
        for (const b of this.bichos) {
          if (Math.hypot(b.x - p.x, b.y - p.y) > 340) continue;
          this.dañar(b, 120 * p.daño);
        }
        this.golpes.push({ que: "cofre", x: c.x, y: c.y, premio: "bomba" });
        this.limpiarMuertos();
      }
    }
  }

  return { Mundo };
})();

/* ── assets.js ── */
const M_assets = (() => {
  // De dónde salen las imágenes, si es que hay alguna.
  //
  // EL JUEGO ANDA COMPLETO SIN UN SOLO ARCHIVO. Todo lo que se ve está dibujado
  // con formas; las imágenes son una MEJORA y no un requisito. Por eso `imagen()`
  // puede devolver null y el dibujo tiene que saber seguir sin ella.
  //
  // Esto no es prolijidad de más: los assets generados todavía no existen —el
  // servicio que los genera está rechazando el cobro— y el juego tenía que
  // poder entregarse igual. Cuando aparezcan, entran por acá y no hay que tocar
  // una línea del dibujo.

  const cache = new Map();

  /** El empaquetador deja las imágenes en `globalThis.ARCHIVOS` como data: URI. */
  function ruta(nombre) {
    const tabla = globalThis.ARCHIVOS || {};
    return tabla[`assets/${nombre}`] || tabla[nombre] || null;
  }

  /**
   * Devuelve la imagen ya cargada, o null si no existe (todavía).
   * NO ESPERA: devolver una promesa obligaría a que el dibujo la espere y a que
   * el primer cuadro de la partida se trabe justo cuando no puede.
   */
  function imagen(nombre) {
    if (cache.has(nombre)) return cache.get(nombre);
    const u = ruta(nombre);
    if (!u) { cache.set(nombre, null); return null; }
    const i = new Image();
    i.src = u;
    cache.set(nombre, i);
    return i;
  }

  /** Lista para que las pruebas digan qué falta sin abrir el juego. */
  const ESPERADAS = [
    "bicho-mota.png", "bicho-pua.png", "bicho-caparazon.png", "bicho-zumbido.png", "bicho-bulto.png",
    "jugador.png", "piso.png", "gema.png",
  ];

  return { ruta, imagen, ESPERADAS };
})();

/* ── dibujo.js ── */
const M_dibujo = (() => {
  // El dibujo. Siluetas simples que se leen con doscientos bichos encima.
  //
  // LA SILUETA ANTES QUE EL DETALLE. Con cuarenta bichos arriba nadie mira una
  // textura: mira si lo que viene es redondo, puntiagudo o cuadrado. Cada especie
  // es una FORMA distinta y el color sólo confirma. Lo que les da carácter no es
  // el detalle sino el MOVIMIENTO: patas que caminan, alas que baten, un cuerpo
  // que se aplasta al golpear. Eso se lee aunque el bicho mida doce píxeles.
  //
  // Y TODO LO CARO SE COCINA UNA VEZ. Cada especie se dibuja con su resplandor en
  // un lienzo aparte al arrancar y después se estampa. Un `shadowBlur` por bicho
  // y por cuadro son doscientos desenfoques: ahí se va el teléfono.

  const { BICHOS, ELITE } = M_bichos;
  const { ARMAS, EVOLUCIONES, ENVION } = M_armas;
  const { imagen } = M_assets;
  class Pantalla {
    constructor(lienzo) {
      this.c = lienzo;
      this.x = lienzo.getContext("2d");
      this.sacudida = 0;
      this.numeros = [];
      this.trozos = [];
      this.marcas = [];      // manchas del piso, para que no sea una grilla vacía
      this.sellos = null;
      this.destello = 0;
      this.medir();
    }

    medir() {
      const TOPE = 2_600_000;
      const anCss = this.c.clientWidth || innerWidth, alCss = this.c.clientHeight || innerHeight;
      this.dpr = Math.min(devicePixelRatio || 1, 2, Math.max(1, Math.sqrt(TOPE / Math.max(1, anCss * alCss))));
      this.AN = anCss; this.AL = alCss;
      this.c.width = Math.round(this.AN * this.dpr);
      this.c.height = Math.round(this.AL * this.dpr);
      this.x.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.sellos = null;
    }

    /** La silueta de una especie, centrada en el origen. */
    silueta(g, forma, r) {
      g.beginPath();
      if (forma === "gota") {
        g.moveTo(0, -r);
        g.bezierCurveTo(r * 1.05, -r * .55, r * .95, r * .78, 0, r);
        g.bezierCurveTo(-r * .95, r * .78, -r * 1.05, -r * .55, 0, -r);
      } else if (forma === "punta") {
        g.moveTo(r, 0); g.lineTo(-r * .7, -r * .82); g.lineTo(-r * .28, 0); g.lineTo(-r * .7, r * .82);
        g.closePath();
      } else if (forma === "rombo") {
        g.moveTo(0, -r); g.lineTo(r * .8, 0); g.lineTo(0, r); g.lineTo(-r * .8, 0); g.closePath();
      } else {
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * 6.283 + 0.52;
          const px = Math.cos(a) * r, py = Math.sin(a) * r * .84;
          i ? g.lineTo(px, py) : g.moveTo(px, py);
        }
        g.closePath();
      }
    }

    /** Cocina el cuerpo de cada especie con su resplandor, sin las partes que se
     *  mueven: esas se dibujan en vivo porque cambian en cada cuadro. */
    cocinar() {
      this.hojas = {};
      for (const [nombre, d] of Object.entries(BICHOS)) {
        const r = d.r, pad = Math.round(r * .8), lado = Math.round((r + pad) * 2);
        const h = document.createElement("canvas");
        h.width = h.height = lado * this.dpr;
        const g = h.getContext("2d");
        g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        g.translate(lado / 2, lado / 2);
        g.shadowColor = d.color; g.shadowBlur = pad * .8;
        g.fillStyle = d.color; this.silueta(g, d.forma, r); g.fill();
        g.shadowBlur = 0;
        // el borde oscuro: lo que hace que no se fundan entre ellos cuando se
        // amontonan, que es todo el tiempo
        g.strokeStyle = "rgba(8,4,16,.55)"; g.lineWidth = Math.max(1.5, r * .12);
        this.silueta(g, d.forma, r); g.stroke();
        // brillo de arriba
        g.fillStyle = "rgba(255,255,255,.16)";
        g.beginPath(); g.ellipse(-r * .2, -r * .44, r * .34, r * .17, -.5, 0, 6.283); g.fill();
        this.hojas[nombre] = { h, lado };
      }
      this.sellos = true;
    }

    sacudir(f) { this.sacudida = Math.min(16, this.sacudida + f); }
    fogonazo(f) { this.destello = Math.min(1, this.destello + f); }

    numero(x, y, texto, color) {
      if (this.numeros.length > 34) return;   // con doscientos bichos, no todos
      this.numeros.push({ x, y, texto, color, vida: 1 });
    }

    estallar(x, y, color, cuantos, fuerza = 1) {
      for (let i = 0; i < cuantos; i++) {
        const a = Math.random() * 6.283, v = (40 + Math.random() * 180) * fuerza;
        this.trozos.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: 1, color,
                           r: (1.6 + Math.random() * 2.6) * fuerza });
      }
    }

    /** Manchas fijas del piso, sembradas una vez por partida. */
    sembrar(w) {
      this.marcas = [];
      const r = w.radioMapa;
      for (let i = 0; i < 150; i++) {
        const a = Math.random() * 6.283, d = Math.sqrt(Math.random()) * r;
        this.marcas.push({ x: Math.cos(a) * d, y: Math.sin(a) * d,
                           r: 6 + Math.random() * 34, g: Math.random() * 6.283 });
      }
    }

    dibujar(w, dt, mando) {
      const X = this.x;
      if (!this.sellos) this.cocinar();
      if (!this.marcas.length) this.sembrar(w);
      const p = w.jugador, E = w.etapa;
      X.clearRect(0, 0, this.AN, this.AL);

      let sx = 0, sy = 0;
      if (this.sacudida > 0.1) {
        sx = (Math.random() - .5) * this.sacudida;
        sy = (Math.random() - .5) * this.sacudida;
        this.sacudida *= 0.86;
      }
      X.save();
      X.translate(this.AN / 2 - p.x + sx, this.AL / 2 - p.y + sy);

      this.piso(X, p, w, E);
      this.cosas(X, w, dt, E);
      X.restore();

      if (this.destello > 0.01) {
        X.fillStyle = `rgba(255,255,255,${this.destello * .35})`;
        X.fillRect(0, 0, this.AN, this.AL);
        this.destello *= 0.82;
      }
      this.hud(X, w, mando, E);
    }

    piso(X, p, w, E) {
      const x0 = p.x - this.AN, y0 = p.y - this.AL, an = this.AN * 2, al = this.AL * 2;
      X.fillStyle = E.piso; X.fillRect(x0, y0, an, al);

      // las manchas: sólo las que se ven, y se ven porque la cámara sigue al jugador
      X.fillStyle = E.niebla;
      for (const m of this.marcas) {
        if (Math.abs(m.x - p.x) > this.AN || Math.abs(m.y - p.y) > this.AL) continue;
        X.save(); X.translate(m.x, m.y); X.rotate(m.g);
        X.beginPath(); X.ellipse(0, 0, m.r, m.r * .62, 0, 0, 6.283); X.fill();
        X.restore();
      }

      const paso = 72;
      X.strokeStyle = E.reja; X.lineWidth = 1;
      X.beginPath();
      for (let x = Math.floor(x0 / paso) * paso; x < x0 + an; x += paso) { X.moveTo(x, y0); X.lineTo(x, y0 + al); }
      for (let y = Math.floor(y0 / paso) * paso; y < y0 + al; y += paso) { X.moveTo(x0, y); X.lineTo(x0 + an, y); }
      X.stroke();

      // el borde del mapa: se ve, así que nadie se sorprende al chocarlo
      X.strokeStyle = E.borde + "66"; X.lineWidth = 5;
      X.beginPath(); X.arc(0, 0, w.radioMapa, 0, 6.283); X.stroke();
      X.strokeStyle = E.borde + "1a"; X.lineWidth = 30;
      X.beginPath(); X.arc(0, 0, w.radioMapa + 15, 0, 6.283); X.stroke();
    }

    /** Un bicho, con lo que se mueve dibujado en vivo. */
    bicho(X, b, t) {
      const d = BICHOS[b.tipo], hoja = this.hojas[b.tipo];
      const esc = b.r / d.r;
      const anda = Math.sin(t * 9 + b.fase);
      // el cuerpo se aplasta al caminar y se estira al saltar: es lo que hace que
      // una mancha parezca un bicho y no un sprite arrastrado
      const ex = 1 + anda * 0.05 + (b.golpeado > 0 ? 0.22 : 0);
      const ey = 1 - anda * 0.05 - (b.golpeado > 0 ? 0.14 : 0);
      const img = imagen(`bicho-${b.tipo}.png`);
      const l = hoja.lado * esc;

      X.save();
      X.translate(b.x, b.y);
      if (b.elite) {
        X.strokeStyle = ELITE.aura; X.lineWidth = 2.5;
        X.globalAlpha = .55 + Math.sin(t * 5 + b.fase) * .2;
        X.beginPath(); X.arc(0, 0, b.r + 7, 0, 6.283); X.stroke();
        X.globalAlpha = 1;
      }
      // patas: dos palitos que alternan
      if (d.patas) {
        X.strokeStyle = "rgba(8,4,16,.5)"; X.lineWidth = Math.max(1.6, b.r * .14);
        for (const s of [-1, 1]) {
          X.beginPath();
          X.moveTo(s * b.r * .45, b.r * .5);
          X.lineTo(s * b.r * .62, b.r * (1.0 + s * anda * .22));
          X.stroke();
        }
      }
      // alas: dos elipses que baten rápido
      if (d.alas) {
        const bat = Math.abs(Math.sin(t * 26 + b.fase));
        X.fillStyle = "rgba(255,255,255,.28)";
        for (const s of [-1, 1]) {
          X.save(); X.translate(s * b.r * .7, -b.r * .2); X.rotate(s * (0.5 + bat * 0.7));
          X.beginPath(); X.ellipse(0, 0, b.r * .75, b.r * .28, 0, 0, 6.283); X.fill();
          X.restore();
        }
      }
      X.scale(ex, ey);
      if (img && img.complete && img.naturalWidth) X.drawImage(img, -l / 2, -l / 2, l, l);
      else X.drawImage(hoja.h, -l / 2, -l / 2, l, l);
      X.restore();

      // EL OJO MIRA AL JUGADOR. Es un detalle de dos círculos y es lo que hace
      // que cuarenta manchas se lean como cuarenta bichos que te vienen a buscar.
      const rr = b.r;
      X.fillStyle = "rgba(10,6,20,.85)";
      X.beginPath(); X.ellipse(b.x + b.mirada * rr * .18, b.y - rr * .1, rr * .3, rr * .34, 0, 0, 6.283); X.fill();
      X.fillStyle = "#fff";
      X.beginPath(); X.arc(b.x + b.mirada * rr * .26, b.y - rr * .18, rr * .13, 0, 6.283); X.fill();

      if (b.golpeado > 0) {
        X.save(); X.translate(b.x, b.y);
        X.globalAlpha = Math.min(1, b.golpeado * 6); X.fillStyle = "#fff";
        this.silueta(X, d.forma, b.r); X.fill();
        X.restore(); X.globalAlpha = 1;
      }
      // barra de vida sólo en los que aguantan: en una mota es ruido
      if ((d.vida >= 46 || b.elite) && b.vida < b.vidaMax && !d.jefe) {
        const an = b.r * 2;
        X.fillStyle = "rgba(0,0,0,.6)"; X.fillRect(b.x - an / 2, b.y - b.r - 10, an, 4);
        X.fillStyle = b.elite ? ELITE.aura : "#ff6ea9";
        X.fillRect(b.x - an / 2, b.y - b.r - 10, an * (b.vida / b.vidaMax), 4);
      }
    }

    cosas(X, w, dt, E) {
      const p = w.jugador, t = w.t;

      for (const s of w.semillas) {
        X.fillStyle = `rgba(138,208,106,${s.listo > 0 ? .10 : .18})`;
        X.beginPath(); X.arc(s.x, s.y, s.r, 0, 6.283); X.fill();
        X.strokeStyle = "rgba(138,208,106,.5)"; X.lineWidth = 2;
        X.beginPath(); X.arc(s.x, s.y, s.r, 0, 6.283); X.stroke();
      }
      // las raíces se unen entre sí
      for (let i = 1; i < w.semillas.length; i++) {
        const a = w.semillas[i], b = w.semillas[i - 1];
        if (!a.raiz || !b.raiz) continue;
        X.strokeStyle = "rgba(182,240,154,.5)"; X.lineWidth = 4;
        X.beginPath(); X.moveTo(a.x, a.y); X.lineTo(b.x, b.y); X.stroke();
      }
      for (const o of w.ondas) {
        const v = 1 - o.r / o.rMax;
        X.strokeStyle = `rgba(180,140,255,${v})`;
        X.lineWidth = 8 * v + 2;
        X.beginPath(); X.arc(o.x, o.y, o.r, 0, 6.283); X.stroke();
      }
      for (const g of w.gemas) {
        X.fillStyle = g.xp >= 6 ? "#ffd166" : "#7cf6ff";
        X.beginPath(); X.moveTo(g.x, g.y - g.r); X.lineTo(g.x + g.r, g.y);
        X.lineTo(g.x, g.y + g.r); X.lineTo(g.x - g.r, g.y); X.closePath(); X.fill();
      }
      for (const c of w.cofres) {
        const lat = 1 + Math.sin(t * 6) * .12;
        X.save(); X.translate(c.x, c.y); X.scale(lat, lat);
        X.fillStyle = "#ffd166"; X.fillRect(-c.r, -c.r * .8, c.r * 2, c.r * 1.6);
        X.fillStyle = "#8a6a1f"; X.fillRect(-c.r, -c.r * .15, c.r * 2, c.r * .3);
        X.restore();
      }

      // los bichos, ordenados por Y para que los de adelante tapen a los de atrás
      const lista = w.bichos;
      for (const b of lista) b.mirada = Math.sign(p.x - b.x) || 1;
      lista.sort((a, b) => a.y - b.y);
      for (const b of lista) this.bicho(X, b, t);

      // los jefes llevan su barra grande arriba de la cabeza
      for (const b of lista) {
        if (!BICHOS[b.tipo].jefe) continue;
        const an = b.r * 3;
        X.fillStyle = "rgba(0,0,0,.65)"; X.fillRect(b.x - an / 2 - 2, b.y - b.r - 20, an + 4, 9);
        X.fillStyle = BICHOS[b.tipo].color;
        X.fillRect(b.x - an / 2, b.y - b.r - 18, an * (b.vida / b.vidaMax), 5);
      }

      for (const b of w.balas) {
        X.fillStyle = "#ff9d6e";
        X.beginPath(); X.arc(b.x, b.y, b.r, 0, 6.283); X.fill();
        X.strokeStyle = "rgba(255,255,255,.6)"; X.lineWidth = 1.5;
        X.beginPath(); X.arc(b.x, b.y, b.r, 0, 6.283); X.stroke();
      }
      for (const l of w.latigos) {
        X.save(); X.translate(l.x, l.y); X.rotate(l.rumbo);
        X.fillStyle = `rgba(255,110,169,${l.vida * 4})`;
        X.fillRect(0, -l.ancho / 2, l.largo, l.ancho);
        X.restore();
      }
      for (const g of w.guadañas) {
        X.strokeStyle = `rgba(255,168,204,${g.vida * 3})`;
        X.lineWidth = 14;
        X.beginPath(); X.arc(p.x, p.y, g.radio, g.rumbo - .5, g.rumbo); X.stroke();
      }
      if (w.nivelArma("orbita")) {
        const a = w.datosArma("orbita");
        const col = w.evolucionada("orbita") ? EVOLUCIONES[w.jugador.evolucionadas.orbita].color : ARMAS.orbita.color;
        if (w.evolucionada("orbita")) {
          X.strokeStyle = col; X.lineWidth = a.grosor;
          X.globalAlpha = .55;
          X.beginPath(); X.arc(p.x, p.y, a.radio, 0, 6.283); X.stroke();
          X.globalAlpha = 1;
        } else {
          for (let k = 0; k < a.cuantos; k++) {
            const ang = w.anguloOrbita + (k / a.cuantos) * 6.283;
            X.fillStyle = col;
            X.beginPath(); X.arc(p.x + Math.cos(ang) * a.radio, p.y + Math.sin(ang) * a.radio, a.r, 0, 6.283); X.fill();
          }
        }
      }
      for (const q of w.tiros) {
        X.fillStyle = q.color || "#ffe066";
        X.beginPath(); X.arc(q.x, q.y, q.r, 0, 6.283); X.fill();
      }

      this.jugador(X, p, t);

      for (let i = this.trozos.length - 1; i >= 0; i--) {
        const s = this.trozos[i];
        s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= .93; s.vy *= .93; s.vida -= dt * 2.1;
        if (s.vida <= 0) { this.trozos.splice(i, 1); continue; }
        X.globalAlpha = s.vida; X.fillStyle = s.color;
        X.beginPath(); X.arc(s.x, s.y, s.r, 0, 6.283); X.fill();
      }
      X.globalAlpha = 1;
      X.textAlign = "center";
      for (let i = this.numeros.length - 1; i >= 0; i--) {
        const n = this.numeros[i];
        n.vida -= dt * 1.5; n.y -= dt * 44;
        if (n.vida <= 0) { this.numeros.splice(i, 1); continue; }
        X.globalAlpha = Math.min(1, n.vida * 1.6);
        X.fillStyle = n.color;
        X.font = `800 ${Math.round(13 + 7 * n.vida)}px system-ui,sans-serif`;
        X.fillText(n.texto, n.x, n.y);
      }
      X.globalAlpha = 1;
    }

    jugador(X, p, t) {
      const img = imagen("jugador.png");
      const parpadea = p.invulnerable > 0 && Math.floor(p.invulnerable * 20) % 2 === 0;
      // la estela del envión: se ve de dónde venís, que es lo que hace que el
      // envión se sienta rápido en vez de sólo teletransportarte
      if (p.envion > 0) {
        X.globalAlpha = .3; X.fillStyle = "#7cf6ff";
        for (let k = 1; k <= 4; k++) {
          X.beginPath();
          X.arc(p.x - p.envionDir.x * k * 15, p.y - p.envionDir.y * k * 15, p.r * (1 - k * .16), 0, 6.283);
          X.fill();
        }
        X.globalAlpha = 1;
      }
      if (parpadea) return;
      X.save(); X.translate(p.x, p.y); X.rotate(p.rumbo);
      if (img && img.complete && img.naturalWidth) {
        X.drawImage(img, -p.r * 1.9, -p.r * 1.9, p.r * 3.8, p.r * 3.8);
      } else {
        X.shadowColor = "#7cf6ff"; X.shadowBlur = 16;
        X.fillStyle = "#e8f4ff";
        X.beginPath();
        X.moveTo(p.r * 1.3, 0); X.lineTo(-p.r * .85, -p.r * .95);
        X.lineTo(-p.r * .3, 0); X.lineTo(-p.r * .85, p.r * .95);
        X.closePath(); X.fill();
        X.shadowBlur = 0;
        X.strokeStyle = "rgba(10,20,40,.5)"; X.lineWidth = 2; X.stroke();
        X.fillStyle = "#1a2740";
        X.beginPath(); X.arc(p.r * .3, 0, p.r * .28, 0, 6.283); X.fill();
      }
      X.restore();
    }

    hud(X, w, mando, E) {
      const p = w.jugador;
      X.fillStyle = "rgba(255,255,255,.10)"; X.fillRect(0, 0, this.AN, 7);
      X.fillStyle = "#7cf6ff";
      X.fillRect(0, 0, this.AN * Math.min(1, p.xp / p.xpNecesaria), 7);

      const an = Math.min(this.AN * .62, 280), x0 = (this.AN - an) / 2, y = 16;
      X.fillStyle = "rgba(0,0,0,.5)"; X.fillRect(x0 - 2, y - 2, an + 4, 12);
      X.fillStyle = "#ff3d5a"; X.fillRect(x0, y, an, 8);
      X.fillStyle = "#3ce06a"; X.fillRect(x0, y, an * Math.max(0, p.vida / p.vidaMax), 8);

      /* EL ENVION SE MUESTRA COMO UN ANILLO ALREDEDOR DEL PULGAR, y no como un
         número en una esquina. Es lo único que se aprieta en el juego: mirarlo
         tiene que costar cero, porque se lo necesita justo cuando no hay tiempo
         de mirar nada. */
      const listo = p.envionListo <= 0;
      const cx = this.AN - 52, cy = this.AL - 52 - 10;
      X.strokeStyle = listo ? "#7cf6ff" : "rgba(255,255,255,.18)";
      X.lineWidth = 4;
      X.beginPath();
      X.arc(cx, cy, 24, -Math.PI / 2, -Math.PI / 2 + 6.283 * (listo ? 1 : 1 - p.envionListo / ENVION.espera));
      X.stroke();
      X.fillStyle = listo ? "rgba(124,246,255,.16)" : "rgba(255,255,255,.05)";
      X.beginPath(); X.arc(cx, cy, 21, 0, 6.283); X.fill();
      X.fillStyle = listo ? "#7cf6ff" : "rgba(255,255,255,.35)";
      X.font = "800 15px system-ui,sans-serif"; X.textAlign = "center"; X.textBaseline = "middle";
      X.fillText("»", cx, cy + 1);
      X.textBaseline = "alphabetic";

      if (mando && mando.activo) {
        X.strokeStyle = "rgba(255,255,255,.22)"; X.lineWidth = 2;
        X.beginPath(); X.arc(mando.ox, mando.oy, mando.radio, 0, 6.283); X.stroke();
        X.fillStyle = "rgba(255,255,255,.30)";
        X.beginPath(); X.arc(mando.x, mando.y, mando.radio * .38, 0, 6.283); X.fill();
      }
    }
  }

  return { Pantalla };
})();

/* ── audio.js ── */
const M_audio = (() => {
  // Sonido sintetizado. Ni un archivo: se fabrica con osciladores.
  //
  // EL LIMITE DE VOCES EXISTE POR UNA RAZON. Con doscientos bichos muriendo, un
  // sonido por muerte son cincuenta voces por segundo: el navegador se traba y lo
  // que se escucha es un zumbido. Acá hay un techo por tipo y por ventana de
  // tiempo — si ya sonó hace poco, el siguiente no suena. Se pierde nada y se
  // gana que se entienda lo que pasa.

  class Ruido {
    constructor() { this.AC = null; this.vol = 1; this.ultimo = {}; }

    despertar() {
      if (this.AC) { if (this.AC.state === "suspended") this.AC.resume(); return true; }
      try { this.AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return false; }
      this.maestro = this.AC.createGain();
      this.maestro.gain.value = 0.55;
      this.maestro.connect(this.AC.destination);
      return true;
    }

    /** ¿Puede sonar `n` otra vez? Separa las repeticiones al menos `sep` segundos. */
    deja(n, sep) {
      if (!this.AC) return false;
      const t = this.AC.currentTime;
      if (this.ultimo[n] && t - this.ultimo[n] < sep) return false;
      this.ultimo[n] = t;
      return true;
    }

    env(cuando, pico, ataque, caida) {
      const g = this.AC.createGain();
      g.gain.setValueAtTime(0.0001, cuando);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, pico * this.vol), cuando + ataque);
      g.gain.exponentialRampToValueAtTime(0.0001, cuando + ataque + caida);
      g.connect(this.maestro);
      return g;
    }

    ruidoBuf(seg) {
      const n = Math.max(1, (this.AC.sampleRate * seg) | 0);
      const b = this.AC.createBuffer(1, n, this.AC.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      const s = this.AC.createBufferSource(); s.buffer = b; return s;
    }

    tono(hz, hz2, pico, largo, tipo = "square") {
      const t = this.AC.currentTime;
      const o = this.AC.createOscillator(); o.type = tipo;
      o.frequency.setValueAtTime(hz, t);
      if (hz2) o.frequency.exponentialRampToValueAtTime(hz2, t + largo);
      o.connect(this.env(t, pico, 0.004, largo));
      o.start(t); o.stop(t + largo + 0.08);
    }

    tiro()   { if (this.deja("tiro", 0.07))  this.tono(680, 380, 0.045, 0.06, "square"); }
    pega()   { if (this.deja("pega", 0.045)) this.tono(300, 170, 0.035, 0.05, "triangle"); }
    muere()  {
      if (!this.deja("muere", 0.055)) return;
      const t = this.AC.currentTime, s = this.ruidoBuf(0.1);
      const f = this.AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1400;
      s.connect(f); f.connect(this.env(t, 0.06, 0.003, 0.08));
      s.start(t); s.stop(t + 0.14);
    }
    gema()   { if (this.deja("gema", 0.05))  this.tono(1250, 1750, 0.03, 0.05, "sine"); }
    golpe()  { if (!this.deja("golpe", 0.2)) return;
               const t = this.AC.currentTime, s = this.ruidoBuf(0.25);
               const f = this.AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 480;
               s.connect(f); f.connect(this.env(t, 0.18, 0.004, 0.22)); s.start(t); s.stop(t + 0.3); }
    onda()   { if (this.deja("onda", 0.2))   this.tono(140, 60, 0.13, 0.28, "sine"); }
    nivel()  { if (!this.AC) return;
               // tres notas que suben: es el único sonido que celebra algo
               [523, 659, 880].forEach((hz, i) => setTimeout(() => this.tono(hz, hz, 0.09, 0.16, "triangle"), i * 85)); }
    jefe()   { if (!this.AC) return; this.tono(90, 42, 0.26, 0.9, "sawtooth"); }
    fin()    { if (!this.AC) return; [440, 330, 262].forEach((hz, i) => setTimeout(() => this.tono(hz, hz, 0.1, 0.3, "triangle"), i * 150)); }
  }

  return { Ruido };
})();

/* ── guardado.js ── */
const M_guardado = (() => {
  // Lo que sobrevive a la partida. localStorage y nada más.
  //
  // LEER PUEDE TIRAR EXCEPCION, no devolver vacío: en modo privado el `getItem`
  // revienta. Un juego que no arranca por no poder leer un récord es peor que uno
  // sin récords, así que cada acceso va envuelto.

  const LLAVE = "enjambre.v1";
  const vacio = () => ({
    // por etapa: {mejorTiempo, mejorMatados, mejorNivel, hecha}
    etapas: {},
    partidas: 0, ganadas: 0,
    ajustes: { sonido: true, idioma: null },
  });
  let cache = null;

  function cargar() {
    if (cache) return cache;
    try {
      const c = localStorage.getItem(LLAVE);
      cache = c ? { ...vacio(), ...JSON.parse(c) } : vacio();
      cache.ajustes = { ...vacio().ajustes, ...(cache.ajustes || {}) };
    } catch (e) { cache = vacio(); }
    return cache;
  }
  function guardar() { try { localStorage.setItem(LLAVE, JSON.stringify(cargar())); } catch (e) {} }
  const ajustes = () => cargar().ajustes;

  function marca(etapa) { return cargar().etapas[etapa] || null; }

  /** Anota el resultado de una etapa. Devuelve qué récords se rompieron. */
  function anotar(etapa, r) {
    const d = cargar();
    const v = d.etapas[etapa] || { mejorTiempo: 0, mejorMatados: 0, mejorNivel: 0, hecha: false };
    const nuevos = { tiempo: r.t > v.mejorTiempo, matados: r.matados > v.mejorMatados,
                     nivel: r.nivel > v.mejorNivel, primera: r.gano && !v.hecha };
    v.mejorTiempo = Math.max(v.mejorTiempo, r.t);
    v.mejorMatados = Math.max(v.mejorMatados, r.matados);
    v.mejorNivel = Math.max(v.mejorNivel, r.nivel);
    v.hecha = v.hecha || r.gano;
    d.etapas[etapa] = v;
    d.partidas++;
    if (r.gano) d.ganadas++;
    guardar();
    return nuevos;
  }

  /** Hasta qué etapa se puede entrar. La siguiente se abre al terminar la anterior. */
  function abiertas() {
    const d = cargar();
    let n = 1;
    while (n < 4 && d.etapas[n]?.hecha) n++;
    return n;
  }
  function borrarTodo() { cache = vacio(); try { localStorage.removeItem(LLAVE); } catch (e) {} }

  return { cargar, guardar, ajustes, marca, anotar, abiertas, borrarTodo };
})();
