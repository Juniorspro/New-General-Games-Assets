/* ==== luz-mala/js/menus.js ==== */
/* ============================================================================
   luz-mala/js/menus.js — los menús de LUZ MALA, dibujados en el lienzo.
   Nada de botones: las opciones son palabras que se prenden, y dos
   luciérnagas vuelan a los costados de la que está elegida. Se usan con el
   dedo (tocando la palabra), con el teclado y con el mando.
   Un menú: { id, titulo, items: [{ id, texto(), valor?(), accion?(), izq?(), der?(), luces?() }],
              sel, estilo: 'lista' | 'faroles', alVolver?(), y0? }
   ========================================================================== */

const Menu = {
  actual: null, pila: [], toque: null, rects: [],
  cur: { x0: 0, x1: 0, y: 0, lista: false },
  abrir(def, o) {
    o = o || {};
    if (this.actual && o.apilar) this.pila.push(this.actual);
    else if (!o.apilar) this.pila.length = 0;
    def.sel = def.sel || 0; def.t = o.sinEntrada ? 1 : 0;
    this.actual = def; this.rects = []; this.cur.lista = false;
  },
  cerrar() { this.actual = null; this.pila.length = 0; },
  volver() {
    const p = this.pila.pop();
    if (p) { this.actual = p; p.t = 1; this.cur.lista = false; Sonido.sfx('elegir'); return true; }
    if (this.actual && this.actual.alVolver) { Sonido.sfx('elegir'); this.actual.alVolver(); return true; }
    return false;
  },
  item() { const m = this.actual; return m && m.items[lim(m.sel, 0, m.items.length - 1)]; },
  mover(d) {
    const m = this.actual, n = m.items.length;
    for (let k = 0; k < n; k++) { m.sel = (m.sel + d + n) % n; if (!m.items[m.sel].apagado) break; }
    Sonido.sfx('mover');
  },
  activar(it, lado) {
    if (!it || it.apagado) { Sonido.sfx('nada'); return; }
    if (lado < 0 && it.izq) { it.izq(); Sonido.sfx('mover'); }
    else if (lado > 0 && it.der) { it.der(); Sonido.sfx('mover'); }
    else if (it.accion) { Sonido.sfx('elegir'); it.accion(); }
    else if (it.der) { it.der(); Sonido.sfx('mover'); }
  },
  pasar() {
    const m = this.actual;
    if (!m) return;
    m.t += DT;
    /* los faroles: cuando la luz del elegido terminó de llenar todo, se sigue */
    if (m.estilo === 'faroles' && m.elegido >= 0) {
      if (m.t - m.tElegido >= 1.1 && !m.hecho) { m.hecho = true; m.alElegir(m.items[m.elegido].id); }
      return;
    }
    const E = Entrada.EDGE, horizontal = m.estilo === 'faroles';
    if (horizontal ? E.izq || E.arr : E.arr) this.mover(-1);
    if (horizontal ? E.der || E.aba : E.aba) this.mover(1);
    const it = this.item();
    if (!horizontal && (E.izq || E.der) && it && (it.izq || it.der)) this.activar(it, E.izq ? -1 : 1);
    if (E.salto || E.aceptar || E.golpe) this.activar(it, 0);
    else if (E.volver || E.dash || (E.pausa && m.pausaVuelve)) this.volver();
    /* el dedo: tocar una palabra la elige; en una opción, los costados la bajan o la suben */
    if (this.toque) {
      const { x, y } = this.toque;
      this.toque = null;
      for (const r of this.rects) {
        if (x < r.x0 || x > r.x1 || y < r.y0 || y > r.y1) continue;
        const i = m.items.indexOf(r.it);
        if (i < 0) continue;
        m.sel = i;
        const k = (x - r.x0) / Math.max(1, r.x1 - r.x0);
        this.activar(r.it, r.it.izq && r.it.der ? (k < 0.3 ? -1 : k > 0.7 ? 1 : 1) : 0);
        break;
      }
    }
  },
  dibujar(g, t) {
    const m = this.actual;
    if (!m) return;
    if (m.estilo === 'faroles') return dibujarFaroles(g, m, t);
    if (m.dibujar) return m.dibujar(g, m, t);
    dibujarLista(g, m, t);
  },
};

/* ---------------- los colores de la noche ---------------- */
const COL_MENU = { apagada: '#8f84a6', prendida: '#fff6d8', halo: '#f6ffa8', titulo: '#efe6d2', gris: '#5c536e', oro: '#ffd98a' };

/* la raya con rulos que va abajo de un título: se dibuja desde el centro */
function adornoLM(g, cx, y, ancho, k) {
  const w = Math.round(ancho / 2 * Math.min(1, k));
  g.fillStyle = 'rgba(239,230,210,0.7)';
  g.fillRect(Math.round(cx - w), y, w * 2, 1);
  g.fillStyle = COL_MENU.oro;
  g.fillRect(Math.round(cx) - 1, y - 1, 3, 3);
  if (k >= 1) for (const s of [-1, 1]) {
    const x = Math.round(cx + s * w);
    g.fillStyle = 'rgba(239,230,210,0.7)';
    g.fillRect(x - (s > 0 ? 2 : 0), y - 2, 3, 1); g.fillRect(x + (s > 0 ? 1 : -1), y - 1, 1, 1);
    g.fillRect(x - (s > 0 ? 3 : -1), y + 1, 2, 1);
  }
}
/* una luciérnaga chiquita con su brillo (el cursor de los menús) */
function luciernaga(g, x, y, t, fuerza) {
  const b = 0.6 + Math.sin(t * 7) * 0.25;
  const r = 7;
  const grd = g.createRadialGradient(x, y, 0, x, y, r);
  grd.addColorStop(0, `rgba(246,255,168,${0.55 * b * (fuerza || 1)})`); grd.addColorStop(1, 'rgba(246,255,168,0)');
  g.fillStyle = grd; g.fillRect(x - r, y - r, r * 2, r * 2);
  g.fillStyle = '#fbffd8'; g.fillRect(Math.round(x), Math.round(y), 1, 1);
  g.fillStyle = 'rgba(246,255,168,0.8)'; g.fillRect(Math.round(x) - 1, Math.round(y), 1, 1); g.fillRect(Math.round(x) + 1, Math.round(y), 1, 1); g.fillRect(Math.round(x), Math.round(y) - 1, 1, 1);
}

/* ---------------- la lista: título, opciones y las dos luciérnagas ---------------- */
function dibujarLista(g, m, t) {
  const W = Pantalla.W, H = VistaLM.usable || Pantalla.H, cx = Math.round(m.x != null ? m.x : W / 2);
  const paso = m.paso || 15, n = m.items.length;
  let y = m.y0 != null ? Math.round(typeof m.y0 === 'function' ? m.y0() : m.y0) : Math.round(H / 2 - (n * paso) / 2 + (m.titulo ? 10 : 0));
  if (m.titulo) {
    const k = Math.min(1, m.t / 0.35);
    textoFino(g, m.titulo, cx, y - 34, { alin: 'centro', escala: 2, esp: 2, col: COL_MENU.titulo, halo: COL_MENU.halo, alfa: k });
    adornoLM(g, cx, y - 14, Math.min(W - 40, 150), Math.min(1, m.t / 0.5));
  }
  Menu.rects = [];
  const anchoOpc = Math.min(W - 36, 190);
  m.items.forEach((it, i) => {
    const ent = lim((m.t - 0.08 - i * 0.06) / 0.25, 0, 1);
    const yy = y + i * paso + Math.round((1 - ent) * 6);
    const sel = i === m.sel, txt = it.texto(), val = it.valor ? it.valor() : null;
    const col = it.apagado ? COL_MENU.gris : sel ? COL_MENU.prendida : COL_MENU.apagada;
    const o = { col, halo: sel && !it.apagado ? COL_MENU.halo : null, alfa: ent };
    let x0, x1;
    if (val == null) {
      textoFino(g, txt, cx, yy, Object.assign({ alin: 'centro' }, o));
      const w = anchoFino(txt); x0 = cx - w / 2; x1 = cx + w / 2;
    } else {
      /* opción: el nombre a la izquierda y el valor a la derecha, con flechitas si está elegida */
      x0 = cx - anchoOpc / 2; x1 = cx + anchoOpc / 2;
      textoFino(g, txt, x0, yy, Object.assign({ alin: 'izq' }, o));
      if (it.luces) {
        const v = it.luces(), n2 = 10;
        for (let k = 0; k < n2; k++) {
          const lx = x1 - (n2 - k) * 5, on = k < Math.round(v * n2);
          g.globalAlpha = ent;
          g.fillStyle = on ? (sel ? '#f6ffa8' : '#b4c878') : '#3a3048'; g.fillRect(lx, yy + 2, 3, 3);
          if (on && sel) { g.fillStyle = 'rgba(246,255,168,0.25)'; g.fillRect(lx - 1, yy + 1, 5, 5); }
          g.globalAlpha = 1;
        }
      } else textoFino(g, val, x1 - (sel ? 7 : 0), yy, Object.assign({ alin: 'der' }, o));
      if (sel && !it.luces) {
        const vw = anchoFino(val), vx = x1 - 7 - vw - 6, b = Math.round(Math.sin(t * 6));
        g.fillStyle = COL_MENU.halo;
        for (let k = 0; k < 3; k++) { g.fillRect(vx - k + b * 0, yy + 3 - k, 1, 1 + k * 2); g.fillRect(x1 - 2 + k, yy + 3 - k, 1, 1 + k * 2); }
      }
    }
    Menu.rects.push({ it, x0: x0 - 10, x1: x1 + 10, y0: yy - 4, y1: yy + paso - 4 });
    if (sel) {
      const pad = 10, cy = yy + 3;
      const c = Menu.cur;
      if (!c.lista) { c.x0 = x0 - pad; c.x1 = x1 + pad; c.y = cy; c.lista = true; }
      c.x0 += (x0 - pad - c.x0) * 0.25; c.x1 += (x1 + pad - c.x1) * 0.25; c.y += (cy - c.y) * 0.25;
    }
  });
  const c = Menu.cur;
  if (c.lista && m.t > 0.2) {
    const b = Math.sin(t * 4) * 1.5;
    luciernaga(g, c.x0 + Math.cos(t * 3) * 1, c.y + b, t);
    luciernaga(g, c.x1 - Math.cos(t * 3) * 1, c.y - b, t + 1.3);
  }
  if (m.pie) {
    const lineas = envolverFino(m.pie, Math.min(W - 30, 200));
    lineas.forEach((l, k) => textoFino(g, l, cx, y + n * paso + 10 + k * 10, { alin: 'centro', col: '#6f6684', alfa: lim(m.t - 0.4, 0, 1) }));
  }
}

/* ---------------- el idioma: tres faroles colgados; el elegido se prende ---------------- */
function menuIdiomas(alElegir) {
  return {
    id: 'idioma', estilo: 'faroles', sel: Math.max(0, IDIOMAS.findIndex(([l]) => l === Idioma.actual)),
    luz: [0, 0, 0], elegido: -1,
    items: IDIOMAS.map(([l, n]) => ({ id: l, texto: () => n, accion() { const m = Menu.actual; if (m.elegido < 0) { m.elegido = m.items.indexOf(this); m.tElegido = m.t; Sonido.sfx('farol'); } } })),
    alElegir,
  };
}
const TX_IDIOMA = { es: 'Elegí tu idioma', en: 'Choose your language', pt: 'Escolha seu idioma' };
function dibujarFaroles(g, m, t) {
  const W = Pantalla.W, H = Pantalla.H, n = m.items.length;

    g.fillStyle = '#3a3028'; g.fillRect(fx - 4, fy + 4, 9, 8);
    g.fillStyle = vidrio; g.fillRect(fx - 3, fy + 5, 7, 6);

   oscurecen cuanto más adentro de la madera: así los pasillos parecen
   tallados en la oscuridad, como en Hollow Knight.

   agujeros donde hay algo que brilla. Chispa es la luz principal.

  const s = spriteChispa(m, A, J);

  dibujarSprite(g, s, ox + p.x + 4, oy + p.y + 12 + dy, p.dir, { sx: A.sx, sy: A.sy, blanco: A.flash > 0 });
  /* la cola brilla sola, y late despacio */
  if (!p.muerta) { g.globalCompositeOperation = 'lighter'; brillo(g, ox + p.x + 4 - p.dir * 4, oy + p.y + 9 + dy, 6, '246,255,168', 0.22 + Math.sin(VistaLM.t * 3) * 0.08); g.globalCompositeOperation = 'source-over'; }
  /* el tajo de la espina */
  if (p.golpe && p.golpe.t < LF.GOLPE_T * 0.55) {
    const G = p.golpe, fr = Math.min(2, Math.floor(G.t / 0.035)), T = SPR.tajo[G.tipo][fr];
    const c = cajaGolpe(p);
    let x = ox + c.x, y = oy + c.y;
    if (G.tipo === 'lado') {
      if (G.dir < 0) { g.save(); g.translate(Math.round(x + c.w), Math.round(y - 1)); g.scale(-1, 1); g.drawImage(T, 0, 0); g.restore(); }
      else g.drawImage(T, Math.round(x - 2), Math.round(y - 1));
    } else g.drawImage(T, Math.round(x - 1), Math.round(G.tipo === 'arr' ? y - 2 : y));
  }
}

/* ---------------- la luz: oscuridad suave con agujeros de luz, y el brillo encima ----------------
   No es la trama de ZONDA: la oscuridad se pinta a media resolución en un
   lienzo aparte, las luces le cortan agujeros con degradés radiales y se
   agranda suavizada. Después, encima, cada luz suma su color. */
let lienzoOscLM = null;
function oscuridadLM(g, luces, fuerza) {
  const W = Pantalla.W, H = Pantalla.H, w = Math.ceil(W / 2), h = Math.ceil(H / 2);
  if (!lienzoOscLM || lienzoOscLM.width !== w || lienzoOscLM.height !== h) lienzoOscLM = lienzoLM(w, h);
  const q = lienzoOscLM.getContext('2d');
  q.globalCompositeOperation = 'source-over';
  q.clearRect(0, 0, w, h);
  q.fillStyle = `rgba(5,3,8,${lim(fuerza * 0.88, 0, 0.94)})`;
  q.fillRect(0, 0, w, h);
  /* la viñeta: los bordes, más oscuros */
  const v = q.createRadialGradient(w / 2, h * 0.42, Math.min(w, h) * 0.35, w / 2, h * 0.42, Math.max(w, h) * 0.72);
  v.addColorStop(0, 'rgba(5,3,8,0)'); v.addColorStop(1, 'rgba(5,3,8,0.45)');
  q.fillStyle = v; q.fillRect(0, 0, w, h);
  q.globalCompositeOperation = 'destination-out';
  for (const l of luces) {
    if (l.solo) continue;
    const x = l.x / 2, y = l.y / 2, r = l.r / 2, k = l.k || 1;
    if (x + r < 0 || x - r > w || y + r < 0 || y - r > h || r <= 0) continue;
    const grd = q.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(0,0,0,${k})`); grd.addColorStop(0.5, `rgba(0,0,0,${k * 0.62})`); grd.addColorStop(1, 'rgba(0,0,0,0)');
    q.fillStyle = grd; q.fillRect(x - r, y - r, r * 2, r * 2);
  }
  q.globalCompositeOperation = 'source-over';
  g.save(); g.imageSmoothingEnabled = true; g.drawImage(lienzoOscLM, 0, 0, w * 2, h * 2); g.restore();
}
/* el farol del pueblo se prende con el primero que vuelva a tener luz */
function farolPrendido(c, J) { return c.zona === 'pueblo' ? Object.keys(J.prog.faroles).length > 0 : !!J.prog.faroles[c.zona]; }
/* cuánta oscuridad tiene la sala ahora: la zona, si su farol está prendido,
   y la Reina que apaga todo a mitad de la pelea */
function oscuroDe(m, J) {
  const zona = m.sala.zona;
  let f = ZONAS[zona].luz;
  if (zona === 'pueblo') f *= 1 - 0.18 * Object.keys(J.prog.faroles).length;
  else if (J.prog.faroles[zona]) f *= 0.55;
  if (m.oscuro) f = Math.max(f, 1);
  return f;
}
/* cada luz: dónde, qué tan grande, cuánto corta la oscuridad y de qué color brilla */
function lucesDe(m, J, ox, oy, t) {
  const p = m.p, luces = [];
  const r0 = 44 + p.luz * 0.2 + (p.curando ? 12 + Math.sin(t * 20) * 3 : 0);
  if (!p.muerta || p.tMuerta < 0.8) luces.push({ x: ox + p.x + 4, y: oy + p.y + 7, r: p.muerta ? r0 * (1 - p.tMuerta / 0.8) : r0, col: '200,255,120', a: 0.2 });
  for (const a of m.adornos) {
    if (a.c === 'h') luces.push({ x: ox + a.x + 4, y: oy + a.y + 5, r: 24, k: 0.8, col: '80,220,200', a: 0.16 });
    else if (a.c === 'y') luces.push({ x: ox + a.x + 4 + ((a.x >> 3) % 2 ? -8 : 8), y: oy + a.y - 1, r: 32, k: 0.85, col: '255,190,110', a: 0.18 });
    else if (a.c === 'f') luces.push({ x: ox + a.x + 4, y: oy + a.y + 8, r: 42 + Math.sin(t * 9 + a.x) * 2, k: 0.9, col: '255,200,120', a: 0.22 });
  }
  for (const c of m.cosas) {
    if (c.tipo === 'banco') luces.push({ x: ox + c.x + 8, y: oy + c.y + 2, r: 36, k: 0.9, col: '90,230,210', a: 0.2 });
    else if (c.tipo === 'farol' && farolPrendido(c, J)) luces.push({ x: ox + c.x + 4, y: oy + c.y + 8, r: 104, col: '255,200,110', a: 0.3 });
    else if (c.tipo === 'chispaExtra') luces.push({ x: ox + c.x + 4, y: oy + c.y + 4, r: 28, col: '246,255,168', a: 0.3 });
    else if (c.tipo === 'npc') luces.push({ x: ox + c.x + 8, y: oy + c.y + 8, r: 28, k: 0.7 });
    else if (c.tipo === 'ambar') luces.push({ x: ox + c.x + 1, y: oy + c.y + 1, r: 9, k: 0.8, col: '255,170,60', a: 0.3 });
  }
  for (const b of m.bichos) {
    const o = !b.muerto && ojosDe(b.tipo);
    if (!o) continue;
    const dir = b.tipo === 'polilla' ? 1 : b.dir, cx = ox + b.x + b.w / 2, by = oy + b.y + b.h + (b.tipo === 'mosquito' ? 1 : 0);
    const dx = Math.round(cx - (dir < 0 ? o.w - (o.w >> 1) : o.w >> 1));
    luces.push({ x: dx + (dir < 0 ? o.w - 1 - o.x : o.x) + 0.5, y: Math.round(by - o.h) + o.y + 0.5, r: 9, col: o.col, a: 0.5 + Math.sin(t * 5 + b.x0) * 0.12, solo: true });
  }
  for (const q of m.pinchos) if (q.liquido) for (let x = q.x + 8; x < q.x + q.w; x += 20) luces.push({ x: ox + x, y: oy + q.y, r: 28, k: 0.85, col: '255,150,60', a: 0.16 });
  for (const b of m.balas) if (b.tipo === 'acido') luces.push({ x: ox + b.x, y: oy + b.y, r: 12, k: 0.8, col: '220,255,60', a: 0.3 });
  const s = J.prog.sombra;
  if (s && s.sala === m.sala.id) luces.push({ x: ox + s.x, y: oy + s.y, r: 24, k: 0.8, col: '150,180,255', a: 0.25 });
  if (m.jefe && m.jefe.tipo === 'reina' && !m.jefe.muerto) luces.push({ x: ox + m.jefe.x + (m.jefe.dir < 0 ? 8 : m.jefe.w - 8), y: oy + m.jefe.y + 10, r: 22, k: 0.7, col: '255,210,60', a: 0.3 });
  if (J.orbeFarol) luces.push({ x: ox + J.orbeFarol.x, y: oy + J.orbeFarol.y, r: 40, col: '255,240,170', a: 0.5 });
  for (const a of J.ambiente) luces.push({ x: ox + a.x, y: oy + a.y, r: 10, k: 0.4 });
  return luces;
}
/* el brillo: cada luz suma su color encima de la oscuridad */
function brilloLuces(g, luces) {
  g.globalCompositeOperation = 'lighter';
  for (const l of luces) if (l.col) brillo(g, l.x, l.y, l.r * 0.62, l.col, l.a || 0.2);
  g.globalCompositeOperation = 'source-over';
}

/* ---------------- lo de adelante: siluetas que pasan más rápido que la sala ---------------- */
const cacheFrente = new Map();
function frenteDe(zona, arriba) {
  const k = zona + arriba;
  if (cacheFrente.has(k)) return cacheFrente.get(k);
  const W = 320, H = arriba ? 26 : 14, c = lienzoLM(W, H), g = c.getContext('2d');
  g.fillStyle = '#030206';
  for (let x = 0; x < W; x++) {
    const n = ruidoLM(x >> 3, arriba ? 1 : 2, 131), n2 = ruidoLM(x, 3, 132);
    if (arriba) {
      /* raíces colgando, telas o gotas, según la zona */
      if (zona === 'tela') { if (n2 > 0.985) { g.fillStyle = 'rgba(200,210,240,0.25)'; g.fillRect(x, 0, 1, 10 + n * 16); g.fillStyle = '#030206'; } }
      else if (n > 0.62) { const largo = 3 + Math.round((n - 0.62) * 50 + Math.sin(x * 0.7) * 2); g.fillRect(x, 0, 1, Math.min(H, largo)); }
      else if (n2 > 0.97) g.fillRect(x, 0, 1, 4 + n * 14);
      g.fillRect(x, 0, 1, 2 + Math.round(n * 3));
    } else {
      const alto = zona === 'pueblo' || zona === 'raices' ? Math.round(n * 6 + (n2 > 0.9 ? 5 : 0)) : Math.round(n * 3);
      g.fillRect(x, H - alto, 1, alto);
    }
  }
  cacheFrente.set(k, c);
  return c;
}
function dibujarFrente(g, zona) {
  const W = Pantalla.W, U = VistaLM.usable || Pantalla.H;
  for (const arriba of [true, false]) {
    const f = frenteDe(zona, arriba), T = f.width;
    const x0 = -Math.round((VistaLM.x * 1.35) % T) - (VistaLM.x < 0 ? T : 0);
    g.globalAlpha = 0.9;
    for (let x = x0 - T; x < W; x += T) g.drawImage(f, x, arriba ? 0 : U - f.height);
    g.globalAlpha = 1;
  }
}

/* ---------------- los efectos del mundo ---------------- */
function dibujarCadaveres(g, J, ox, oy) {
  for (const c of J.cadaveres) {
    const s = SPR.bichos[c.tipo];
    if (!s) continue;
    const a = 1 - c.t / 0.7;
    g.save(); g.globalAlpha = Math.max(0, a);
    g.translate(Math.round(ox + c.x), Math.round(oy + c.y)); g.scale(1, -1);
    dibujarSprite(g, s[0], 0, 0, c.dir, { blanco: c.t < 0.08 });
    g.restore();
  }
}
function dibujarEfectosLuz(g, J, ox, oy, t) {
  g.globalCompositeOperation = 'lighter';
  /* bichitos de luz que titilan en el aire */
  for (const a of J.ambiente) {
    const on = Math.sin(a.f * 3.1) * 0.5 + 0.5;
    if (on < 0.15) continue;
    const col = J.mundo.sala.zona === 'hormiguero' ? '255,170,80' : J.mundo.sala.zona === 'tela' ? '190,210,255' : '200,255,120';
    brillo(g, ox + a.x, oy + a.y, 5, col, 0.4 * on);
    g.fillStyle = `rgba(${col},${on})`; g.fillRect(Math.round(ox + a.x), Math.round(oy + a.y), 1, 1);
  }
  /* las ondas: al golpear, al rugir, al prenderse un farol */
  for (const o of J.ondas) {
    if (o.t < 0) continue;
    const k = o.t / o.dur, e = 1 - Math.pow(1 - k, 3);
    g.strokeStyle = `rgba(${o.col},${(1 - k) * 0.7})`; g.lineWidth = o.r > 40 ? 2 : 1;
    g.beginPath(); g.arc(Math.round(ox + o.x) + 0.5, Math.round(oy + o.y) + 0.5, Math.max(1, o.r * e), 0, Math.PI * 2); g.stroke();
  }
  /* los rayos del jefe vencido */
  if (J.rayos) {
    const r = J.rayos, k = r.t < 0.3 ? r.t / 0.3 : Math.max(0, 1 - (r.t - 1.2) / 1.4);
    g.save(); g.translate(ox + r.x, oy + r.y); g.rotate(r.t * 0.8);
    for (let i = 0; i < 12; i++) {
      g.rotate(Math.PI / 6);
      const largo = 60 + (i % 3) * 30;
      const grd = g.createLinearGradient(0, 0, 0, -largo);
      grd.addColorStop(0, `rgba(255,250,220,${0.4 * k})`); grd.addColorStop(1, 'rgba(255,250,220,0)');
      g.fillStyle = grd; g.beginPath(); g.moveTo(0, 0); g.lineTo(-4 - i % 2 * 3, -largo); g.lineTo(4 + i % 2 * 3, -largo); g.closePath(); g.fill();
    }
    g.restore();
    brillo(g, ox + r.x, oy + r.y, 40, '255,250,220', 0.5 * k);
  }
  /* la luz que viaja al farol */
  if (J.orbeFarol) { const f = J.orbeFarol; brillo(g, ox + f.x, oy + f.y, 16, '255,240,170', 0.8); brillo(g, ox + f.x, oy + f.y, 4, '255,255,255', 1); }
  /* curándose: un anillo de luz que se cierra sobre Chispa */
  const p = J.mundo.p;
  if (p.curando) {
    const dur = p.curaRapida ? LF.CURAR_T * 0.6 : LF.CURAR_T, k = (p.curarT % dur) / dur;
    g.strokeStyle = `rgba(246,255,168,${0.3 + k * 0.5})`; g.lineWidth = 1;
    g.beginPath(); g.arc(Math.round(ox + p.x + 4) + 0.5, Math.round(oy + p.y + 6) + 0.5, 18 * (1 - k) + 3, 0, Math.PI * 2); g.stroke();
    if (Math.random() < 0.5) { const a = Math.random() * Math.PI * 2; FX.emitir(p.x + 4 + Math.cos(a) * 18, p.y + 6 + Math.sin(a) * 18, 1, { col: '#f6ffa8', vx: -Math.cos(a) * 50, vy: -Math.sin(a) * 50, disp: 2, vida: 20, arrastre: 0.95 }); }
  }
  g.globalCompositeOperation = 'source-over';
}

/* ---------------- un cuadro de juego ---------------- */
function dibujarSalaLM(g, J, t) {
  const m = J.mundo;
  const ox = -Math.round(VistaLM.x) + FX.sx, oy = -Math.round(VistaLM.y) + FX.sy;
  dibujarFondoLM(g, m.sala.zona);
  FX.dibujar(g, -ox, -oy, true);
  const D = MARGEN_LM * 8;
  g.drawImage(capaLM(m), ox - D, oy - D);
  /* más allá del margen (pantallas enormes), negro */
  const W = Pantalla.W, H = Pantalla.H, sw = m.w * 8 + D, sh = m.h * 8 + D;
  g.fillStyle = '#060409';
  if (oy - D > 0) g.fillRect(0, 0, W, oy - D);
  if (oy + sh < H) g.fillRect(0, oy + sh, W, H - oy - sh);
  if (ox - D > 0) g.fillRect(0, 0, ox - D, H);
  if (ox + sw < W) g.fillRect(ox + sw, 0, W - ox - sw, H);
  dibujarResina(g, m, ox, oy, t);
  dibujarRompibles(g, m, ox, oy, t);
  for (const a of m.adornos) {
    if (a.c === 'h') dibujarSprite(g, SPR.cosa.hongo, ox + a.x + 4, oy + a.y + 8, 1);
    else if (a.c === 'f') {
      const x = ox + a.x + 2, y = oy + a.y + 6, on = Math.sin(t * 9 + a.x) > -0.8;
      g.fillStyle = '#1a120c'; g.fillRect(x, y, 4, 5);
      g.fillStyle = on ? '#ffcf80' : '#c89050'; g.fillRect(x + 1, y + 1, 2, 3);
      g.fillStyle = '#fff0c8'; if (on) g.fillRect(x + 1, y + 1, 1, 1);
    }
  }
  dibujarCosasLM(g, m, ox, oy, t, J);
  dibujarBichosLM(g, m, ox, oy, t);
  dibujarCadaveres(g, J, ox, oy);
  dibujarJefeLM(g, m, ox, oy, t);
  dibujarChispa(g, m, J.anim, ox, oy, J);
  dibujarBalasLM(g, m, ox, oy, t);
  FX.dibujar(g, -ox, -oy, false);
  const luces = lucesDe(m, J, ox, oy, t);
  oscuridadLM(g, luces, oscuroDe(m, J));
  brilloLuces(g, luces);
  dibujarEfectosLuz(g, J, ox, oy, t);
  dibujarFrente(g, m.sala.zona);
  /* abajo, donde van los pulgares: un degradé oscuro para que los mandos se lean */
  if (VistaLM.mandos) {
    const y0 = VistaLM.usable, grd = g.createLinearGradient(0, y0 - 6, 0, y0 + 30);
    grd.addColorStop(0, 'rgba(5,3,8,0)'); grd.addColorStop(1, 'rgba(5,3,8,0.94)');
    g.fillStyle = grd; g.fillRect(0, y0 - 6, Pantalla.W, Pantalla.H - y0 + 6);
  }
}

/* ---------------- el HUD: la vasija de luz, las chispas de vida y el ámbar ---------------- */
function dibujarHUD(g, J, t) {
  const p = J.mundo.p, x0 = 6, y0 = 6;
  /* la vasija: se llena de abajo para arriba; late cuando alcanza para curarse */
  const R = 8, cx = x0 + R, cy = y0 + R, nivel = p.luz / LF.LUZ_MAX, alcanza = p.luz >= LF.CURAR_COSTO;
  if (J.vasija > 0 || alcanza) { g.globalCompositeOperation = 'lighter'; brillo(g, cx, cy, 14 + J.vasija * 8, '246,255,168', 0.12 + J.vasija * 0.35 + (alcanza ? Math.sin(t * 6) * 0.05 + 0.05 : 0)); g.globalCompositeOperation = 'source-over'; }
  for (let yy = -R; yy <= R; yy++) for (let xx = -R; xx <= R; xx++) {
    const d = Math.hypot(xx + 0.5, yy + 0.5);
    if (d > R + 0.5) continue;
    let col = null;
    if (d > R - 1) col = '#0d0a14';
    else if (d > R - 2) col = J.vasija > 0.3 ? '#f6ffd0' : '#6a6080';
    else {
      const h = (R - 2 - yy) / (2 * (R - 2));
      const ola = Math.sin(t * 3 + xx * 0.6) * 0.03;
      col = h < nivel + ola ? (h > nivel - 0.08 ? '#ffffff' : (alcanza && Math.sin(t * 6) > 0.3 ? '#f6ffa8' : '#c8e870')) : '#1a1426';
    }
    g.fillStyle = col; g.fillRect(cx + xx, cy + yy, 1, 1);
  }
  g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(cx - 4, cy - 5, 2, 1);
  /* las chispas de vida */
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < p.vida; i++) brillo(g, x0 + 2 * R + 9 + i * 9, y0 + 6, 6, '246,255,168', 0.18);
  g.globalCompositeOperation = 'source-over';
  for (let i = 0; i < p.vidaMax; i++) {
    const x = x0 + 2 * R + 6 + i * 9, y = y0 + 3, llena = i < p.vida;
    if (llena) {
      g.fillStyle = '#0d0a14'; g.fillRect(x, y + 1, 7, 5); g.fillRect(x + 1, y, 5, 7);
      g.fillStyle = '#b4e858'; g.fillRect(x + 1, y + 1, 5, 5);
      g.fillStyle = '#f6ffa8'; g.fillRect(x + 2, y + 1, 3, 4);
      g.fillStyle = '#ffffff'; g.fillRect(x + 2, y + 2, 1, 1);
    } else {
      g.fillStyle = '#0d0a14'; g.fillRect(x, y + 1, 7, 5); g.fillRect(x + 1, y, 5, 7);
      g.fillStyle = '#2a2238'; g.fillRect(x + 1, y + 1, 5, 5);
      g.fillStyle = '#141020'; g.fillRect(x + 2, y + 2, 3, 3);
    }
  }
  /* ámbar */
  const ax = x0 + 2 * R + 6, ay = y0 + 13;
  g.fillStyle = '#0d0a14'; g.fillRect(ax, ay, 5, 5);
  g.fillStyle = '#f0a03a'; g.fillRect(ax + 1, ay + 1, 3, 3); g.fillStyle = '#ffe08a'; g.fillRect(ax + 1, ay + 1, 1, 1);
  /* el contador se acerca de a pasos que no son enteros: se muestra redondeado */
  const ambar = String(Math.round(J.ambarVisto));
  textoFino(g, ambar, ax + 8, ay - 1, { col: '#ffd98a' });
  if (J.ambarMas > 0) textoFino(g, '+' + J.ambarMas, ax + 8 + anchoFino(ambar) + 4, ay - 1, { col: '#fff0a0', halo: '#ffb050' });
  /* la barra del jefe */
  const j = J.mundo.jefe;
  if (j && !j.muerto && j.est !== 'presenta') {
    const W = Pantalla.W, bw = Math.min(180, W - 40), bx = Math.round((W - bw) / 2), by = VistaLM.usable - 14;
    textoFino(g, TX().jefes[j.tipo].nombre, W / 2, by - 11, { alin: 'centro', col: '#ffd0c0', halo: '#ff6a5a' });
    g.fillStyle = '#0d0a14'; g.fillRect(bx - 1, by - 1, bw + 2, 6);
    g.fillStyle = '#2a1418'; g.fillRect(bx, by, bw, 4);
    const k = Math.max(0, j.vida / j.vidaMax);
    J.barraJefe = J.barraJefe == null ? k : acercar(J.barraJefe, k, 0.4 * Reloj.d);
    g.fillStyle = '#fff0c8'; g.fillRect(bx, by, Math.round(bw * J.barraJefe), 4);
    g.fillStyle = '#c42a3c'; g.fillRect(bx, by, Math.round(bw * k), 4);
    g.fillStyle = '#ff6a5a'; g.fillRect(bx, by, Math.round(bw * k), 1);
  }
}

/* ==== luz-mala/js/pantallas.js ==== */
/* ============================================================================
   luz-mala/js/pantallas.js — lo que no es la sala: la portada, la intro, los
   globos de diálogo, los carteles, los hallazgos, la pausa, la tienda, el
   mapa, los créditos, el final y las transiciones.
   Las transiciones de LUZ MALA no son tramas: la luz se cierra sobre Chispa
   (suave, con un borde tibio) y se vuelve a abrir en la sala nueva.
   ========================================================================== */

/* ---------------- la transición de luz ---------------- */
/* el reloj del dibujo: cuánto tiempo de juego pasó desde el último cuadro
   dibujado. Lo que se apaga o crece mientras se dibuja usa esto y no DT, así
   anda igual en una pantalla de 60 Hz que en una de 120 */
const Reloj = { d: DT, antes: null };
function marcarDibujo(t) { Reloj.d = Reloj.antes == null ? DT : lim(t - Reloj.antes, 0, 0.25); Reloj.antes = t; }

const TransLM = {
  activa: false, t: 0, dur: 0.3, fase: 0, alMedio: null, alFin: null, cx: 0, cy: 0, col: '5,3,8',
  iniciar(dur, alMedio, alFin, o) {
    o = o || {};
    Object.assign(this, { activa: true, t: 0, dur, fase: 0, alMedio, alFin, cx: o.cx != null ? o.cx : Pantalla.W / 2, cy: o.cy != null ? o.cy : Pantalla.H / 2, col: o.col || '5,3,8' });
  },
  /* solo la mitad que abre: para entrar a una pantalla */
  abrir(dur, cx, cy) { Object.assign(this, { activa: true, t: 0, dur, fase: 1, alMedio: null, alFin: null, cx, cy, col: '5,3,8' }); },
  pasar() {
    if (!this.activa) return;
    this.t += DT;
    if (this.fase === 0 && this.t >= this.dur) { this.fase = 1; this.t = 0; if (this.alMedio) this.alMedio(); }
    else if (this.fase === 1 && this.t >= this.dur) { this.activa = false; if (this.alFin) this.alFin(); }
  },
  dibujar(g) {
    if (!this.activa) return;
    const W = Pantalla.W, H = Pantalla.H;
    const k = lim(this.fase === 0 ? this.t / this.dur : 1 - this.t / this.dur, 0, 1), e = k * k * (3 - 2 * k);
    const diag = Math.hypot(Math.max(this.cx, W - this.cx), Math.max(this.cy, H - this.cy)) + 20;
    const R = (1 - e) * diag;
    if (R < 2) { g.fillStyle = `rgb(${this.col})`; g.fillRect(0, 0, W, H); return; }
    const grd = g.createRadialGradient(this.cx, this.cy, R * 0.62, this.cx, this.cy, R);
    grd.addColorStop(0, `rgba(${this.col},0)`); grd.addColorStop(0.7, `rgba(${this.col},0.85)`); grd.addColorStop(1, `rgba(${this.col},1)`);
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    /* el borde de la luz, tibio */
    if (this.col === '5,3,8') {
      g.globalCompositeOperation = 'lighter';
      const b = g.createRadialGradient(this.cx, this.cy, R * 0.5, this.cx, this.cy, R * 0.66);
      b.addColorStop(0, 'rgba(246,255,168,0)'); b.addColorStop(0.8, `rgba(246,255,168,${0.1 * e})`); b.addColorStop(1, 'rgba(246,255,168,0)');
      g.fillStyle = b; g.fillRect(0, 0, W, H);
      g.globalCompositeOperation = 'source-over';
    }
  },
};
function velo(g, a) {
  const W = Pantalla.W, H = Pantalla.H;
  g.fillStyle = `rgba(5,3,8,${a})`; g.fillRect(0, 0, W, H);
  const grd = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  grd.addColorStop(0, 'rgba(5,3,8,0)'); grd.addColorStop(1, 'rgba(5,3,8,0.6)');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
}
/* un brillo suave (no en trama): la luz de LUZ MALA */
function brillo(g, x, y, r, rgb, a) {
  if (r <= 0 || a <= 0) return;
  const grd = g.createRadialGradient(x, y, 0, x, y, r);
  grd.addColorStop(0, `rgba(${rgb},${a})`); grd.addColorStop(0.45, `rgba(${rgb},${a * 0.35})`); grd.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = grd; g.fillRect(x - r, y - r, r * 2, r * 2);
}

/* ---------------- la portada: el monte de noche y el quebracho ---------------- */
const Portada = { bichos: [], estrellas: null, arbol: null };
function prepararPortada(W, H) {
  if (Portada.estrellas && Portada.estrellas.width === W && Portada.estrellas.height === H) return;
  const c = lienzoLM(W, H), g = c.getContext('2d');
  /* cielo del Chaco: un degradé suave de violeta a casi negro */
  const cielo = g.createLinearGradient(0, 0, 0, H);
  cielo.addColorStop(0, '#0b0a1e'); cielo.addColorStop(0.55, '#171030'); cielo.addColorStop(1, '#1f1228');
  g.fillStyle = cielo; g.fillRect(0, 0, W, H);
  for (let i = 0; i < W * H / 230; i++) {
    const x = Math.floor(ruidoLM(i, 1, 81) * W), y = Math.floor(ruidoLM(i, 2, 82) * H * 0.62);
    g.fillStyle = ruidoLM(i, 3, 83) > 0.86 ? '#ffffff' : ruidoLM(i, 4, 84) > 0.5 ? '#8a88b8' : '#5a5680'; g.fillRect(x, y, 1, 1);
  }
  /* la luna, finita, con su halo */
  const alta = H > W, lx = Math.round(W * (alta ? 0.86 : 0.9)), ly = Math.round(H * (alta ? 0.05 : 0.17));
  brillo(g, lx, ly, 34, '220,210,180', 0.18);
  for (let yy = -7; yy <= 7; yy++) for (let xx = -7; xx <= 7; xx++) {
    const d1 = Math.hypot(xx, yy), d2 = Math.hypot(xx - 3, yy - 2);
    if (d1 <= 7 && d2 > 6.2) { g.fillStyle = d1 > 6 ? '#c8c0a0' : '#fff6d8'; g.fillRect(lx + xx, ly + yy, 1, 1); }
  }
  Portada.estrellas = c;
  /* el quebracho: tronco ancho, copa de ramas quebradas, en silueta */
  const a = lienzoLM(W, H), q = a.getContext('2d');
  const piso = Math.round(H * (H > W ? 0.58 : 0.76)), cx = Math.round(W * 0.5);
  q.fillStyle = '#05040a';
  const tronco = Math.round(Math.min(W, H) * 0.15), alto = Math.round(Math.min(H * 0.3, W * 0.8));
  for (let y = piso - alto; y < piso + 2; y++) {
    const k = (y - (piso - alto)) / alto, ancho = tronco * (0.8 + k * k * 0.9);
    q.fillRect(Math.round(cx - ancho / 2 + Math.sin(y * 0.05) * 2), y, Math.round(ancho), 1);
  }
  const copa = (x, y, r) => { for (let yy = -r; yy <= r; yy++) for (let xx = -r; xx <= r; xx++) if (xx * xx + yy * yy * 1.6 <= r * r && ruidoLM(Math.round(x + xx) >> 1, Math.round(y + yy) >> 1, 96) > 0.12) q.fillRect(Math.round(x + xx), Math.round(y + yy), 1, 1); };
  const rama = (x, y, ang, largo, grosor) => {
    if (largo < 4 || grosor < 1) { copa(x, y, 3 + Math.round(ruidoLM(Math.round(x), Math.round(y), 97) * 4)); return; }
    const x2 = x + Math.cos(ang) * largo, y2 = y + Math.sin(ang) * largo;
    for (let i = 0; i <= largo; i++) { const t2 = i / largo; q.fillRect(Math.round(x + (x2 - x) * t2 - grosor / 2), Math.round(y + (y2 - y) * t2), Math.max(1, Math.round(grosor)), Math.max(1, Math.round(grosor))); }
    rama(x2, y2, ang - 0.45 + ruidoLM(Math.round(x2), Math.round(y2), 84) * 0.3, largo * 0.72, grosor * 0.66);
    rama(x2, y2, ang + 0.4 + ruidoLM(Math.round(y2), Math.round(x2), 85) * 0.3, largo * 0.66, grosor * 0.62);
  };
  const tope = piso - alto, L = Math.min(W, H) * (alta ? 0.17 : 0.19);
  rama(cx, tope + 4, -Math.PI / 2 - 0.62, L, tronco * 0.42);
  rama(cx, tope + 4, -Math.PI / 2 + 0.55, L * 0.95, tronco * 0.4);
  rama(cx, tope + 2, -Math.PI / 2 - 0.1, L * 0.75, tronco * 0.32);
  rama(cx, tope + 12, -Math.PI + 0.35, L * 0.7, tronco * 0.26);
  rama(cx, tope + 12, -0.35, L * 0.7, tronco * 0.26);
  /* la orilla: pasto bajo y el ranchito con su ventana */
  for (let x = 0; x < W; x++) {
    const h = 5 + Math.round(Math.sin(x * 0.07) * 2 + Math.sin(x * 0.19) * 2 + ruidoLM(x >> 2, 0, 86) * 3);
    q.fillRect(x, piso - h, 1, h + 3);
  }
  const rx = Math.round(W * 0.14);
  q.fillStyle = '#0a0812'; q.fillRect(rx, piso - 14, 14, 11); q.fillRect(rx - 2, piso - 16, 18, 3);
  q.fillStyle = '#ffcf80'; q.fillRect(rx + 4, piso - 11, 3, 3);
  Portada.arbol = a; Portada.piso = piso; Portada.tronco = tronco; Portada.alto = alto;
  /* el estero: abajo de la orilla el agua copia todo, un poco más oscuro y azul */
  const agua = Portada.agua = piso + 3, hondo = H - agua;
  const r = lienzoLM(W, Math.max(1, hondo)), rg = r.getContext('2d');
  rg.save(); rg.scale(1, -1);
  rg.drawImage(c, 0, 1 - agua); rg.drawImage(a, 0, 1 - agua);
  rg.restore();
  const osc = rg.createLinearGradient(0, 0, 0, hondo);
  osc.addColorStop(0, 'rgba(8,10,30,0.3)'); osc.addColorStop(1, 'rgba(6,5,16,0.72)');
  rg.fillStyle = osc; rg.fillRect(0, 0, W, hondo);
  Portada.reflejo = r;
  /* la luna en el agua: rayitas que titilan */
  Portada.luna = { x: lx, y: ly };
  Portada.bichos = Array.from({ length: 24 }, (_, i) => ({ x: ruidoLM(i, 7, 88) * W, y: piso - 16 - ruidoLM(i, 8, 89) * H * 0.34, f: ruidoLM(i, 9, 90) * 6 }))
    .concat(Array.from({ length: Math.round(hondo / 14) }, (_, i) => ({ x: ruidoLM(i, 17, 98) * W, y: agua + 8 + ruidoLM(i, 18, 99) * hondo * 0.7, f: ruidoLM(i, 19, 91) * 6, bajo: true })));
  /* juncos del frente, a los costados (se hamacan con el viento) */
  Portada.juncos = Array.from({ length: 22 }, (_, i) => {
    const lado = i % 2 ? 1 : 0, x = lado ? W - 2 - ruidoLM(i, 31, 71) * W * 0.3 : 2 + ruidoLM(i, 31, 71) * W * 0.3;
    return { x, largo: Math.round(hondo * (0.18 + ruidoLM(i, 32, 72) * 0.28) * (1 - Math.abs(x - (lado ? W : 0)) / (W * 0.4))), f: ruidoLM(i, 33, 73) * 6, cabeza: ruidoLM(i, 34, 74) > 0.55 };
  }).filter((j) => j.largo > 6);
  Portada.ondas = [];
}
function dibujarPortadaLM(g, t, conTitulo) {
  const W = Pantalla.W, H = Pantalla.H;
  prepararPortada(W, H);
  const P = Portada, agua = P.agua, hondo = H - agua;
  g.drawImage(P.estrellas, 0, 0, W, agua, 0, 0, W, agua);
  for (let i = 0; i < 8; i++) if (Math.sin(t * 2 + i * 1.7) > 0.8) { g.fillStyle = '#ffffff'; g.fillRect(Math.floor(ruidoLM(i, 11, 92) * W), Math.floor(ruidoLM(i, 12, 93) * H * 0.5), 1, 1); }
  g.drawImage(P.arbol, 0, 0, W, agua, 0, 0, W, agua);
  /* el agua: cada renglón del reflejo se corre un poquito, más cuanto más cerca */
  for (let y = 0; y < hondo; y += 1) {
    const o = Math.round(Math.sin(y * 0.33 - t * 2.4) * (0.4 + y * 0.018) + Math.sin(y * 0.11 + t * 1.3) * 0.6);
    g.drawImage(P.reflejo, 0, y, W, 1, o, agua + y, W, 1);
  }
  /* la luna se rompe en rayitas sobre el agua */
  const lx = P.luna.x;
  for (let i = 0; i < 16; i++) {
    const yy = agua + 3 + i * Math.max(3, hondo / 20), on = Math.sin(t * 3 + i * 2.3);
    if (on < -0.2 || yy > H - 4) continue;
    const w = Math.round(2 + (1 - i / 16) * 6 * (0.6 + on * 0.4));
    g.fillStyle = `rgba(255,246,216,${0.12 + on * 0.1})`;
    g.fillRect(Math.round(lx - w / 2 + Math.sin(t * 1.7 + i) * 2), Math.round(yy), w, 1);
  }
  /* de vez en cuando una onda (un pez, una gota) */
  if (Math.random() < Reloj.d * 0.8) P.ondas.push({ x: ruidoLM(Math.floor(t * 10), 41, 61) * W, y: agua + 6 + ruidoLM(Math.floor(t * 10), 42, 62) * (hondo - 30), t: 0 });
  for (let i = P.ondas.length - 1; i >= 0; i--) {
    const o = P.ondas[i]; o.t += Reloj.d;
    if (o.t > 2.2) { P.ondas.splice(i, 1); continue; }
    const rr = 2 + o.t * 11, a = 0.35 * (1 - o.t / 2.2);
    g.fillStyle = `rgba(200,210,255,${a})`;
    for (let k = 0; k < 28; k++) { const an = k / 28 * Math.PI * 2; g.fillRect(Math.round(o.x + Math.cos(an) * rr), Math.round(o.y + Math.sin(an) * rr * 0.28), 1, 1); }
  }
  /* adentro del tronco, las ventanitas del pueblo titilan (y se copian en el agua) */
  const cx = W / 2, piso = P.piso;
  for (let i = 0; i < 5; i++) {
    const x = Math.round(cx - P.tronco * 0.3 + ruidoLM(i, 5, 87) * P.tronco * 0.6), y = Math.round(piso - P.alto * 0.14 - i * P.alto * 0.15);
    const on = Math.sin(t * 0.7 + i * 2.1) > -0.5;
    g.fillStyle = on ? '#e8a050' : '#5a3a1e'; g.fillRect(x, y, 2, 2);
    if (on) { brillo(g, x + 1, y + 1, 5, '255,190,110', 0.25); const ry = 2 * agua - y; if (ry < H) { g.fillStyle = 'rgba(232,160,80,0.35)'; g.fillRect(x + Math.round(Math.sin(t * 2 + i)), ry, 2, 1); } }
  }
  g.globalCompositeOperation = 'lighter';
  const espejo = (x, y, r, rgb, a) => { const ry = 2 * agua - y; if (ry > agua && ry < H) brillo(g, x + Math.sin(ry * 0.3 - t * 2.4), ry, r, rgb, a * 0.45); };
  for (const b of P.bichos) {
    const x = b.x + Math.sin(t * 0.4 + b.f) * 14, y = b.y + Math.sin(t * 0.7 + b.f * 2) * 6, on = Math.sin(t * 1.6 + b.f * 3);
    if (on < 0.1) continue;
    brillo(g, x, y, 5, '200,255,112', 0.35 * on);
    g.fillStyle = '#f6ffa8'; g.fillRect(Math.round(x), Math.round(y), 1, 1);
    if (!b.bajo) espejo(x, y, 4, '200,255,112', 0.35 * on);
  }
  /* la luz mala: va y viene, en un ocho, con estela (y el agua la repite) */
  const ly = piso - P.alto * 0.55;
  for (let i = 14; i >= 0; i--) {
    const tt = t - i * 0.045, x = cx + Math.sin(tt * 0.9) * W * 0.3, y = ly + Math.sin(tt * 1.8) * P.alto * 0.16;
    if (i === 0) { brillo(g, x, y, 22, '246,255,168', 0.5); brillo(g, x, y, 6, '255,255,255', 0.8); espejo(x, y, 18, '246,255,168', 0.5); }
    else { g.fillStyle = `rgba(246,255,168,${0.5 - i * 0.03})`; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
  }
  g.globalCompositeOperation = 'source-over';
  /* los juncos del frente, en silueta */
  for (const j of P.juncos) {
    const viento = Math.sin(t * 0.9 + j.f) * 0.08 + Math.sin(t * 2.3 + j.f * 2) * 0.02;
    for (let k = 0; k < j.largo; k++) {
      const u = k / j.largo, x = Math.round(j.x + viento * u * u * j.largo), w = u < 0.6 ? 2 : 1;
      g.fillStyle = '#020104'; g.fillRect(x, H - k, w, 1);
      g.fillStyle = '#2a2444'; g.fillRect(x + w, H - k, 1, 1);
    }
    if (j.cabeza) {
      const x = Math.round(j.x + viento * j.largo) - 1, y = H - j.largo - 6;
      g.fillStyle = '#120a0c'; g.fillRect(x, y, 3, 7);
      g.fillStyle = '#3a2a30'; g.fillRect(x + 3, y + 1, 1, 5);
      g.fillStyle = '#020104'; g.fillRect(x + 1, y - 3, 1, 3);
    }
  }
  if (conTitulo) tituloLM(g, W, H, t);
}
/* el título: la letra fina, grande, con una luz que lo recorre y a veces se corta */
function tituloLM(g, W, H, t) {
  const e = W >= 300 ? 4 : 3, y = Math.round(H * (H > W ? 0.12 : 0.1)), tit = 'LUZ MALA';
  const ancho = anchoFino(tit, 2) * e;
  const corte = Math.sin(t * 13) > 0.95 || (t % 7 > 6.7 && Math.sin(t * 40) > 0);
  g.globalCompositeOperation = 'lighter';
  brillo(g, W / 2, y + 10 * e / 3, ancho * 0.55, '160,200,70', corte ? 0.08 : 0.22);
  g.globalCompositeOperation = 'source-over';
  textoFino(g, tit, W / 2, y, { alin: 'centro', escala: e, esp: 2, col: corte ? '#8f84a6' : '#f6ffd0', halo: corte ? null : '#c8f070' });
  /* la luz que pasa por las letras */
  const barrido = ((t * 0.35) % 1.6) - 0.3;
  if (barrido > 0 && barrido < 1 && !corte) {
    const bx = W / 2 - ancho / 2 + barrido * ancho;
    g.globalCompositeOperation = 'lighter';
    const grd = g.createLinearGradient(bx - 12, 0, bx + 12, 0);
    grd.addColorStop(0, 'rgba(255,255,255,0)'); grd.addColorStop(0.5, 'rgba(255,255,230,0.35)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(bx - 12, y - 4, 24, 9 * e);
    g.globalCompositeOperation = 'source-over';
  }
  const ys = y + 9 * e + 6;
  adornoLM(g, W / 2, ys, Math.min(W - 40, ancho), 1);
  textoFino(g, tr('lema1'), W / 2, ys + 8, { alin: 'centro', col: '#e8c890', halo: '#ffb050' });
  textoFino(g, tr('lema2'), W / 2, ys + 19, { alin: 'centro', col: '#e8c890', halo: '#ffb050' });
}

/* ---------------- la intro: la luz escribe y dibuja, sobre negro ----------------
   Cada frase tiene un dibujo hecho de trazos (en una grilla de 20 x 14): la
   luciérnaga lo va trazando mientras se escribe el texto y deja su luz */
const DIBUJOS_INTRO = (() => {
  const ocho = [], onda = [], circ = (cx, cy, r, n, ry) => Array.from({ length: n + 1 }, (_, k) => [cx + Math.cos(k / n * Math.PI * 2) * r, cy + Math.sin(k / n * Math.PI * 2) * (ry || r)]);
  for (let k = 0; k <= 48; k++) { const a = k / 48 * Math.PI * 2; ocho.push([10 + Math.sin(a) * 8, 7 + Math.sin(a * 2) * 3.2]); }
  for (let k = 0; k <= 30; k++) onda.push([1 + k * 0.6, 12.5 + Math.sin(k * 0.7) * 0.6]);
  const farol = (x, y) => [[[x, y - 2.2], [x, y - 1.2]], [[x - 1, y - 1.2], [x + 1, y - 1.2], [x + 1, y + 1.4], [x - 1, y + 1.4], [x - 1, y - 1.2]], [[x, y + 0.8], [x, y - 0.2]]];
  const rayos = [];
  for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2 + 0.2; rayos.push([[10 + Math.cos(a) * 4.8, 6.5 + Math.sin(a) * 4.8], [10 + Math.cos(a) * 6.8, 6.5 + Math.sin(a) * 6.8]]); }
  const tela = [];
  for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; tela.push([[10, 7], [10 + Math.cos(a) * 3.4, 7 + Math.sin(a) * 3.4]]); }
  return [
    /* el quebracho, con su puertita y su ventana */
    { trazos: [[[2, 14], [18, 14]], [[8, 14], [8.5, 8], [7, 5]], [[12, 14], [11.5, 8], [13, 5]], [[7, 5], [4, 3], [1.5, 3.4]], [[7, 5], [6, 2], [7, 0.4]], [[13, 5], [14, 2], [13, 0.4]], [[13, 5], [16, 3], [18.5, 3.4]], [[10, 6.2], [10, 1]],
      [[9.3, 14], [9.3, 11.6], [10.7, 11.6], [10.7, 14]], [[9.6, 9], [10.4, 9], [10.4, 9.8], [9.6, 9.8], [9.6, 9]]], luz: [[10.7, 12.8], [10, 9.4]] },
    /* los tres faroles: raíces, telaraña y corazón */
    { trazos: [onda, ...farol(4, 10.5), ...tela, circ(10, 7, 2.2, 6), ...farol(10, 7), [[16, 5.9], [13.3, 3.3], [13.3, 1.7], [14.5, 0.8], [16, 1.9], [17.5, 0.8], [18.7, 1.7], [18.7, 3.3], [16, 5.9]], ...farol(16, 3.2)], luz: [[4, 10.6], [10, 7.1], [16, 3.3]] },
    /* se apagan y queda una luz sola que va y viene, en un ocho */
    { trazos: [ocho], cabeza: true },
    /* la luz mala: redonda, con rayos */
    { trazos: [circ(10, 6.5, 3.6, 20), ...rayos], luz: [[10, 6.5]] },
    /* esa luz era yo: Chispa */
    { trazos: [circ(6.6, 6.4, 1.2, 10), circ(10.8, 7, 3, 18, 1.7), [[8.6, 5.8], [9.6, 2.6], [12.2, 2], [12, 5.4]], [[10, 5.4], [12.6, 3.4], [15.2, 3.6], [13.2, 5.8]],
      [[6, 5.3], [4.8, 3], [3.8, 2.6]], [[6.6, 5.2], [6.2, 2.8], [5.6, 2.1]], [[9, 8.4], [8.4, 10]], [[10.6, 8.7], [10.4, 10.4]], [[12.2, 8.6], [12.8, 10.2]]], luz: [[13.6, 7.2]], grande: true },

    const a = lim(1 - Math.abs(y - H * 0.5) / (H * 0.45), 0, 1);
    if (l.titulo) { textoFino(g, l.t, W / 2, y, { alin: 'centro', escala: 3, esp: 2, col: '#f6ffd0', halo: '#c8f070', alfa: a }); y += 34; }
    else { if (l.t) textoFino(g, l.t, W / 2, y, { alin: 'centro', col: l.gris ? '#8f84a6' : '#efe6d2', alfa: a }); y += 12; }
  }
}

/* ---------------- el mapa: las salas vistas, dibujadas donde están ---------------- */
function dibujarMapa(g, J, t) {
  const W = Pantalla.W, H = Pantalla.H;
  const fondo = g.createLinearGradient(0, 0, 0, H);
  fondo.addColorStop(0, '#15100a'); fondo.addColorStop(1, '#0a0806');
  g.fillStyle = fondo; g.fillRect(0, 0, W, H);
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const s of SALAS_LM) { x0 = Math.min(x0, s.pos[0]); y0 = Math.min(y0, s.pos[1]); x1 = Math.max(x1, s.pos[0] + s.tam[0]); y1 = Math.max(y1, s.pos[1] + s.tam[1]); }
  const mandos = VistaLM.mandos, alto = H - mandos - 50, k = Math.min((W - 16) / (x1 - x0), alto / (y1 - y0));
  const ox = Math.round((W - (x1 - x0) * k) / 2), oy = 30 + Math.round((alto - (y1 - y0) * k) / 2);
  textoFino(g, tr('elQuebracho'), W / 2, 8, { alin: 'centro', esp: 2, col: '#e8c890', halo: '#ffb050' });
  adornoLM(g, W / 2, 20, 100, 1);
  const vistas = J.prog.vistas;
  for (const s of SALAS_LM) {
    if (!vistas[s.id]) continue;
    const X = ox + (s.pos[0] - x0) * k, Y = oy + (s.pos[1] - y0) * k, Z = ZONA_ARTE[s.zona];
    for (let ty = 0; ty < s.tam[1]; ty++) for (let tx = 0; tx < s.tam[0]; tx++) {
      if (s.mapa[ty][tx] === '#') continue;
      g.fillStyle = s.id === J.mundo.sala.id ? '#e8d8b0' : Z.borde;
      g.fillRect(Math.floor(X + tx * k), Math.floor(Y + ty * k), Math.max(1, Math.ceil(k)), Math.max(1, Math.ceil(k)));
    }
    const cx = X + s.tam[0] * k / 2, cy = Y + s.tam[1] * k / 2;
    if (s.jefe && !J.prog.jefes[s.jefe]) { g.fillStyle = '#c42a3c'; g.fillRect(Math.round(cx) - 1, Math.round(cy) - 1, 3, 3); }
    for (let ty = 0; ty < s.tam[1]; ty++) { const tx = s.mapa[ty].indexOf('H'); if (tx >= 0) { g.fillStyle = '#4ad8c8'; g.fillRect(Math.round(X + tx * k) - 1, Math.round(Y + ty * k) - 1, 3, 2); } }
  }
  const s = J.mundo.sala, p = J.mundo.p;
  const px = ox + (s.pos[0] - x0 + (p.x + 4) / 8) * k, py = oy + (s.pos[1] - y0 + (p.y + 6) / 8) * k;
  g.globalCompositeOperation = 'lighter'; brillo(g, px, py, 7, '246,255,168', 0.5 + Math.sin(t * 5) * 0.2); g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#ffffff'; g.fillRect(Math.round(px), Math.round(py), 1, 1);
  const so = J.prog.sombra;
  if (so && SALA_POR_ID[so.sala]) { const ss = SALA_POR_ID[so.sala]; g.fillStyle = '#9fb8ff'; g.fillRect(Math.round(ox + (ss.pos[0] - x0 + so.x / 8) * k) - 1, Math.round(oy + (ss.pos[1] - y0 + so.y / 8) * k) - 1, 2, 2); }
  const ly = H - mandos - 16;
  textoFino(g, nombreSala(s.id) + ' · ' + TX().zonas[s.zona], W / 2, ly - 12, { alin: 'centro', col: '#efe6d2' });
  textoFino(g, tr('leyendaMapa'), W / 2, ly, { alin: 'centro', col: '#8f84a6' });
}

/* ---------------- el final ---------------- */
function dibujarFinalLM(g, J, t) {
  const W = Pantalla.W, H = Pantalla.H, F = J.final, T = TX();
  dibujarPortadaLM(g, t, false);
  const cx = W / 2, piso = Portada.piso;
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < Math.min(14, F.t * 1.5); i++) {
    const x = cx - 10 + ruidoLM(i, 21, 94) * 20, y = piso - 10 - ruidoLM(i, 22, 95) * H * 0.3;
    brillo(g, x, y, 10, '255,207,128', 0.45); g.fillStyle = '#ffe0a0'; g.fillRect(Math.round(x), Math.round(y), 2, 2);
  }
  g.globalCompositeOperation = 'source-over';
  velo(g, 0.35);
  const dur = 4.5, i = Math.min(T.final.length - 1, Math.floor(F.t / dur));
  const k = (F.t % dur) / dur, a = F.t > T.final.length * dur ? 1 : k < 0.15 ? k / 0.15 : k > 0.85 ? (1 - k) / 0.15 : 1;
  if (F.t < T.final.length * dur) {
    envolverFino(T.final[i], Math.min(W - 28, 230)).forEach((l, n) => textoFino(g, l, W / 2, Math.round(H * 0.24) + n * 12, { alin: 'centro', col: i === T.final.length - 1 ? '#f6ffd0' : '#efe6d2', halo: i === T.final.length - 1 ? '#c8f070' : null, alfa: a }));
  } else {
    tituloLM(g, W, H, t);
    const y = Math.round(H * 0.44);
    textoFino(g, tr('fin'), W / 2, y, { alin: 'centro', escala: 2, esp: 3, col: '#ffd98a', halo: '#ffb050' });
    textoFino(g, tr('tiempoAmbar', reloj(J.prog.tiempo), J.mundo ? J.mundo.p.ambar : 0), W / 2, y + 26, { alin: 'centro', col: '#a89cb8' });
    if (Math.floor(t * 2) % 2) textoFino(g, tr('tocaVolver'), W / 2, y + 42, { alin: 'centro', col: '#efe6d2' });
  }
}

/* ==== luz-mala/js/juego.js ==== */
/* ============================================================================
   luz-mala/js/juego.js — el que ata todo.
   Estados: idioma · portada · creditos · intro · jugando · dialogo ·
            hallazgo · mapa · pausa · tienda · final · cargando
   Antes del menú, siempre, se elige idioma (con el último elegido marcado).
   La partida se guarda sola: al sentarse en un hongo, al vencer a un jefe,
   al comprar, al juntar algo que no vuelve.
   ========================================================================== */

const PARTIDA_LM = 'luzmala:partida', OPCS_LM = 'luzmala:opciones', IDIOMA_LM = 'luzmala:idioma';
function partidaNueva() {
  return {
    empezada: false, sala: 'P1', banco: null, habil: {}, estado: {}, jefes: {}, faroles: {}, vistas: {},
    vidaMax: 5, ambar: 0, compras: {}, sombra: null, tiempo: 0, pistas: {}, fin: false,
  };
}
let Prog = Object.assign(partidaNueva(), Guardado.leer(PARTIDA_LM, {}));
const Opc = Object.assign({ musica: 0.7, efectos: 0.9, temblor: true, velocidad: 1, invencible: false }, Guardado.leer(OPCS_LM, {}));
const guardarOpcLM = () => Guardado.escribir(OPCS_LM, Opc);
const MUSICA_ZONA = { pueblo: 'pueblo', raices: 'raices', tela: 'tela', hormiguero: 'hormiguero' };
const NADA = { x: 0, y: 0, salto: false, saltoE: false, golpeE: false, dashE: false, curar: false };

const J = {
  estado: 'idioma', mundo: null, anim: null, prog: Prog, t: 0,
  dialogo: null, hallazgo: null, hallazgos: [], cartelZona: null, cartelJefe: null, aviso: null, muerte: null, intro: null, final: null,
  sentada: false, ambarVisto: 0, ambarMas: 0, cambiando: false, zonaActual: null, barraJefe: null, repeticion: null, toque: false, sinCharlas: false,
  /* los efectos de cine: franjas, rayos, ondas, orbes de luz, bichos que caen */
  cine: null, rayos: null, ondas: [], orbes: [], cadaveres: [], flash: 0, vasija: 0, lento: 0, ambiente: [], orbeFarol: null,
};

function guardarLM() {
  const p = J.mundo && J.mundo.p;
  if (p) { Prog.ambar = p.ambar; Prog.vidaMax = p.vidaMax; }
  Guardado.escribir(PARTIDA_LM, Prog);
}
/* lo comprado y lo juntado vive en Prog; Chispa lo lleva puesto */
function vestirChispa(p) {
  p.vidaMax = Prog.vidaMax; p.ambar = Prog.ambar;
  p.danio = Prog.compras.espina ? 1.5 : 1;
  p.curaRapida = !!Prog.compras.cura;
  p.iman = !!Prog.compras.iman;
}
const nombreSala = (id) => TX().salas[id] || id;

/* ---------------- cargar una sala ---------------- */
function cargarSalaLM(id, llegada) {
  const sala = SALA_POR_ID[id];
  const vieja = J.mundo && J.mundo.p;
  const m = crearMundoLM(sala, { estado: Prog.estado, habil: Prog.habil, jugadora: vieja || undefined });
  m.asist = { invencible: Opc.invencible };
  /* las compuertas de jefe están abiertas fuera de la pelea */
  m.puertasJefe = m.rompibles.filter((r) => r.compuerta && r.def.jefe);
  m.rompibles = m.rompibles.filter((r) => !(r.compuerta && r.def.jefe));
  m.arena = sala.jefe && !Prog.jefes[sala.jefe] ? sala.jefe : null;
  const p = m.p;
  if (!vieja) { vestirChispa(p); p.vida = p.vidaMax; J.ambarVisto = p.ambar; }
  if (llegada && llegada.banco) { p.x = llegada.x; p.y = llegada.y; p.vx = p.vy = 0; }
  else if (llegada) { p.x = llegada.x; p.y = llegada.y; }
  else { p.x = m.spawn.x; p.y = m.spawn.y; p.vx = p.vy = 0; }
  p.rx = p.ry = 0; p.ultimoSuelo = { x: p.x, y: p.y }; p.golpe = null; p.curando = false;
  J.mundo = m;
  if (!J.anim) J.anim = animLM();
  J.anim.estela.length = 0;
  J.ondas.length = 0; J.orbes.length = 0; J.cadaveres.length = 0; J.rayos = null; J.cine = null; J.orbeFarol = null;
  Prog.sala = id; Prog.vistas[id] = true;
  ubicarLM(m, true);
  FX.limpiar();
  Sonido.musica(sala.jefe && !Prog.jefes[sala.jefe] ? 'silencio' : MUSICA_ZONA[sala.zona]);
  Sonido.ambiente(sala.zona);
  if (J.zonaActual !== sala.zona) { J.zonaActual = sala.zona; J.cartelZona = { zona: sala.zona, sala: id, t: 0 }; }
  /* pistas la primera vez */
  if (!Prog.pistas[id]) {
    Prog.pistas[id] = true;
    if (id === 'P1') J.aviso = { txt: 'pistaP1', t: -2.5 };
    if (id === 'R1') J.aviso = { txt: 'pistaR1', t: -3 };
  }
}
function empezarPartida(nueva) {
  if (nueva) { Prog = J.prog = Object.assign(partidaNueva()); Guardado.escribir(PARTIDA_LM, Prog); }
  Prog.empezada = true;
  J.mundo = null; J.anim = null; J.zonaActual = null; J.sentada = false; J.muerte = null; J.dialogo = null; J.hallazgo = null; J.hallazgos.length = 0;
  TransLM.activa = false;
  Menu.cerrar();
  if (nueva) { J.estado = 'intro'; J.intro = { i: 0, n: 0, t: 0 }; Sonido.musica('titulo'); mostrarMandosLM(false); return; }
  const b = Prog.banco;
  J.estado = 'cargando';
  TransLM.iniciar(0.45, () => { cargarSalaLM(b ? b.sala : Prog.sala, b ? { banco: true, x: b.x, y: b.y } : null); J.estado = 'jugando'; mostrarMandosLM(true); }, null, { cx: Pantalla.W / 2, cy: Pantalla.H / 2 });
}

/* ---------------- un paso de juego ---------------- */
function pasarJuego() {
  const m = J.mundo, E = Entrada.EDGE, p = m.p;
  if (E.pausa && !TransLM.activa && !J.muerte) { pausarLM(); return; }
  if (E.mapa && !J.muerte) { abrirMapa(); return; }
  Prog.tiempo += DT;
  if (J.cambiando) return;
  let inp = J.repeticion ? (J.repeticion.shift() || NADA) : entradaLM(Entrada);
  if (J.muerte) inp = NADA;
  /* mientras el jefe se presenta, la cámara lo mira a él y Chispa espera */
  if (J.cine && J.cine.t < 1.3) inp = NADA;
  if (J.sentada) {
    if (inp.x || inp.saltoE || inp.golpeE || inp.dashE || inp.y > 0) J.sentada = false;
    else inp = NADA;
  }
  pasarChispa(m, inp);
  pasarBichos(m); pasarBalas(m); pasarJefe(m); pasarAmbar(m);
  procesarEventosLM(m);
  if (m.congelar) { Bucle.congelar(m.congelar); m.congelar = 0; }
  /* las compuertas se animan */
  for (const r of m.rompibles) if (r.compuerta && r.abre != null && r.abre < 1 && !r.abriendo) r.abre = Math.min(1, r.abre + DT * 5);
  for (let i = m.rompibles.length - 1; i >= 0; i--) { const r = m.rompibles[i]; if (r.abriendo) { r.abre = (r.abre == null ? 1 : r.abre) - DT * 1.5; if (r.abre <= 0) m.rompibles.splice(i, 1); } }
  /* la pelea empieza cuando Chispa entra de verdad a la arena */
  if (m.arena && !m.jefe && p.x > 6 * 8 && !p.muerta) empezarPelea(m);
  /* la sombra: tocarla devuelve el ámbar */
  const s = Prog.sombra;
  if (s && s.sala === m.sala.id && !p.muerta && Math.hypot(p.x + 4 - s.x, p.y + 6 - s.y) < 12) {
    p.ambar += s.ambar; J.ambarMas += s.ambar;
    FX.emitir(s.x, s.y, 20, { cols: ['#9fb8ff', '#ffffff', '#c8d8ff'], disp: 70, vida: 26 });
    Sonido.sfx('sombra');
    J.aviso = { txt: tr('recuperaste', s.ambar), crudo: true, t: 0, col: '#c8d8ff' };
    Prog.sombra = null; guardarLM();
  }
  /* salir por un borde: la sala de al lado */
  const lado = salidaDe(m);
  if (lado && !J.cambiando && !p.muerta) pasarDeSala(m, lado);
  /* la muerte: apagarse, y volver al último hongo */
  if (J.muerte) { J.muerte.t += DT; if (J.muerte.t > 2.6 && !J.muerte.listo) { J.muerte.listo = true; revivir(); } }
  if (J.cartelZona) { J.cartelZona.t += DT; if (J.cartelZona.t > 4) J.cartelZona = null; }
  if (J.cartelJefe) { J.cartelJefe.t += DT; if (J.cartelJefe.t > 3.4) J.cartelJefe = null; }
  if (J.cine) { J.cine.t += DT; if (J.cine.t > 2.4) J.cine = null; }
  if (J.aviso) { J.aviso.t += DT; if (J.aviso.t > 2.6) J.aviso = null; }
  if (J.ambarVisto !== p.ambar) J.ambarVisto = acercar(J.ambarVisto, p.ambar, Math.max(1, Math.abs(p.ambar - J.ambarVisto) * 0.1));
  else if (J.ambarMas > 0) J.ambarMas = 0;
  pasarEfectos(m);
  /* gotas en las raíces */
  if (m.sala.zona === 'raices' && Math.random() < 0.004) Sonido.sfx('gota');
  if (J.hallazgos.length && !J.hallazgo && J.estado === 'jugando' && !J.orbeFarol) { J.hallazgo = { q: J.hallazgos.shift(), t: 0 }; J.estado = 'hallazgo'; Sonido.sfx('hallazgo'); }
}

/* los efectos que no son física: se mueven solos */
function pasarEfectos(m) {
  if (J.flash > 0) J.flash = Math.max(0, J.flash - DT * 2.2);
  if (J.vasija > 0) J.vasija = Math.max(0, J.vasija - DT * 3);
  if (J.lento > 0) { J.lento -= DT / Math.max(0.1, Bucle.velocidad); if (J.lento <= 0) Bucle.velocidad = Opc.velocidad; }
  for (let i = J.ondas.length - 1; i >= 0; i--) { J.ondas[i].t += DT; if (J.ondas[i].t > J.ondas[i].dur) J.ondas.splice(i, 1); }
  for (let i = J.cadaveres.length - 1; i >= 0; i--) {
    const c = J.cadaveres[i];
    c.t += DT; c.vy += 500 * DT; c.y += c.vy * DT; c.x += c.vx * DT;
    if (c.t > 0.7) J.cadaveres.splice(i, 1);
  }
  if (J.rayos) { J.rayos.t += DT; if (J.rayos.t > 2.6) J.rayos = null; }
  /* los orbes vuelan a la vasija de luz (en coordenadas de pantalla) */
  for (let i = J.orbes.length - 1; i >= 0; i--) {
    const o = J.orbes[i];
    o.t += DT;
    const k = Math.min(1, o.t / o.dur), e = k * k * (3 - 2 * k);
    o.x = mezclar(o.x0, o.x1, e) + Math.sin(k * Math.PI) * o.curva;
    o.y = mezclar(o.y0, o.y1, e) - Math.sin(k * Math.PI) * 18;
    if (k >= 1) { J.orbes.splice(i, 1); J.vasija = 1; }
  }
  /* el orbe que lleva la luz del jefe al farol */
  const f = J.orbeFarol;
  if (f) {
    f.t += DT;
    const k = Math.min(1, f.t / 1.4), e = 1 - Math.pow(1 - k, 3);
    f.x = mezclar(f.x0, f.x1, e); f.y = mezclar(f.y0, f.y1, e) - Math.sin(k * Math.PI) * 40;
    if (Math.random() < 0.6) FX.emitir(f.x, f.y, 1, { cols: ['#fff0a0', '#ffd060'], disp: 12, vida: 20 });
    if (k >= 1) {
      J.orbeFarol = null; J.flash = 0.7;
      Sonido.sfx('farol'); FX.temblar(4);
      J.ondas.push({ x: f.x1, y: f.y1, t: 0, dur: 1.2, r: 140, col: '255,220,140' });
      FX.emitir(f.x1, f.y1, 40, { cols: ['#fff0a0', '#ffd060', '#ffffff'], disp: 120, vida: 40, arrastre: 0.94 });
      f.alLlegar();
    }
  }
}

function pasarDeSala(m, lado) {
  const p = m.p, s = m.sala;
  const wx = s.pos[0] * 8 + p.x, wy = s.pos[1] * 8 + p.y;
  const cx = wx + p.w / 2 + (lado === 'izq' ? -4 : lado === 'der' ? 4 : 0), cy = wy + p.h / 2 + (lado === 'arr' ? -4 : lado === 'aba' ? 4 : 0);
  const v = salaEn(cx, cy);
  if (!v) { p.x = lim(p.x, 0, m.w * 8 - p.w); p.y = lim(p.y, 0, m.h * 8 - p.h); p.vx = p.vy = 0; return; }
  J.cambiando = true;
  /* la velocidad sigue igual del otro lado: el resolvedor comprobó los pasos
     entre salas con esta misma física, sin empujones */
  const llegada = { x: wx - v.pos[0] * 8, y: wy - v.pos[1] * 8 };
  const ox = -Math.round(VistaLM.x), oy = -Math.round(VistaLM.y);
  TransLM.iniciar(0.13, () => { cargarSalaLM(v.id, llegada); TransLM.cx = -Math.round(VistaLM.x) + J.mundo.p.x + 4; TransLM.cy = -Math.round(VistaLM.y) + J.mundo.p.y + 6; }, () => { J.cambiando = false; },
    { cx: ox + p.x + 4, cy: oy + p.y + 6 });
}
function revivir() {
  const m = J.mundo, p = m.p;
  /* lo que llevaba queda en la sombra; la sombra anterior se pierde */
  Prog.sombra = p.ambar > 0 ? { sala: m.sala.id, x: Math.round(lim(p.x + 4, 12, m.w * 8 - 12)), y: Math.round(lim(p.ultimoSuelo.y + 2, 12, m.h * 8 - 12)), ambar: p.ambar } : Prog.sombra;
  Prog.ambar = 0;
  const b = Prog.banco;
  TransLM.iniciar(0.3, () => {
    /* sin mundo, cargarSalaLM arma una Chispa nueva con lo que hay en Prog */
    J.mundo = null;
    cargarSalaLM(b ? b.sala : 'P1', b ? { banco: true, x: b.x, y: b.y } : null);
    J.muerte = null;
    TransLM.cx = -Math.round(VistaLM.x) + J.mundo.p.x + 4; TransLM.cy = -Math.round(VistaLM.y) + J.mundo.p.y + 6;
    /* se vuelve a prender en el hongo */
    FX.emitir(J.mundo.p.x + 4, J.mundo.p.y + 6, 24, { cols: ['#f6ffa8', '#ffffff', '#b4e858'], disp: 70, vida: 30 });
    guardarLM();
  }, null, { cx: Pantalla.W / 2, cy: VistaLM.usable / 2 });
}

function empezarPelea(m) {
  const tipo = m.arena;
  m.jefe = crearJefe(tipo, m);
  for (const r of m.puertasJefe) { r.abre = 0; m.rompibles.push(r); }
  J.cartelJefe = { tipo, t: 0 }; J.barraJefe = 1;
  J.cine = { t: 0, tipo };
  Sonido.sfx('puerta'); FX.temblar(4);
  Sonido.musica(tipo === 'reina' ? 'reina' : 'jefe');
}
function terminarPelea(m, tipo) {
  const zona = m.sala.zona, j = m.jefe;
  Prog.jefes[tipo] = true;
  const da = JEFES[tipo].da;
  if (da) Prog.habil[da] = true;
  Prog.estado[tipo] = true;
  m.arena = null;
  for (const r of m.rompibles) if (r.compuerta && (r.def.jefe === tipo || r.def.abre === tipo)) r.abriendo = true;
  Sonido.sfx('abre');
  /* la luz del jefe viaja hasta el farol, y recién ahí se prende */
  const f = m.cosas.find((c) => c.tipo === 'farol');
  const alLlegar = () => {
    Prog.faroles[zona] = true;
    J.hallazgos.push('farol_' + zona);
    if (da) J.hallazgos.push(da);
    Sonido.musica(MUSICA_ZONA[zona]);
    if (tipo === 'reina') J.finalPendiente = true;
    guardarLM();
  };
  if (f) J.orbeFarol = { t: 0, x0: j.x + j.w / 2, y0: j.y + j.h / 2, x1: f.x + 4, y1: f.y + 10, x: j.x + j.w / 2, y: j.y, alLlegar };
  else alLlegar();
  guardarLM();
}

/* un orbe de luz que va del golpe a la vasija */
function orbeLuz(x, y, n) {
  const ox = -Math.round(VistaLM.x), oy = -Math.round(VistaLM.y);
  for (let i = 0; i < n; i++) J.orbes.push({ x0: ox + x, y0: oy + y, x1: 14, y1: 14, x: ox + x, y: oy + y, t: -i * 0.06, dur: 0.55 + Math.random() * 0.2, curva: (Math.random() - 0.5) * 50 });
}

function procesarEventosLM(m) {
  const p = m.p, A = J.anim, Z = ZONA_ARTE[m.sala.zona];
  for (const e of m.eventos) {
    Sonido.sfx(e.t, e);
    switch (e.t) {
      case 'salto': A.sx = 0.8; A.sy = 1.2; FX.emitir(p.x + 4, p.y + 12, 4, { cols: Z.polvo, vy: -10, disp: 26, vida: 14, arrastre: 0.9 }); break;
      case 'saltoPared': A.sx = 0.8; A.sy = 1.2; FX.emitir(p.x + (e.d > 0 ? 0 : 8), p.y + 8, 7, { cols: ['#ffb040', '#ffe08a', ...Z.polvo], vx: e.d * 40, disp: 26, vida: 16 }); break;
      case 'aterriza': if ((e.fuerza || 0) > 220) { A.sx = 1.3; A.sy = 0.74; } FX.emitir(p.x + 4, p.y + 12, 2 + Math.round((e.fuerza || 0) / 110), { cols: Z.polvo, vy: -8, disp: 34, vida: 14, arrastre: 0.88 }); break;
      case 'dash': FX.temblar(1); FX.emitir(p.x + 4, p.y + 6, 10, { cols: ['#f6ffa8', '#c8e8ff', '#ffffff'], vx: -e.d * 90, disp: 26, vida: 14, forma: 'linea' }); break;
      case 'pega':
        FX.temblar(1.5); Bucle.congelar(2);
        FX.emitir(e.x, e.y, 8, { cols: ['#ffffff', '#fff0c8', '#f6ffa8'], disp: 100, vida: 10, forma: 'linea' });
        J.ondas.push({ x: e.x, y: e.y, t: 0, dur: 0.18, r: 10, col: '255,255,255' });
        if (e.tipo) orbeLuz(e.x, e.y, 2);
        break;
      case 'pegaJefe':
        FX.temblar(2); Bucle.congelar(3);
        FX.emitir(e.x, e.y, 10, { cols: ['#ffffff', '#ffd0a0', '#ff8a5a'], disp: 120, vida: 12, forma: 'linea' });
        J.ondas.push({ x: e.x, y: e.y, t: 0, dur: 0.2, r: 14, col: '255,230,200' });
        orbeLuz(e.x, e.y, 2);
        break;
      case 'bichoMuere': {
        FX.emitir(e.x, e.y, 14, { cols: ['#ffffff', '#f6ffa8', '#8a82b0', '#5a4a6a'], disp: 80, g: 200, vida: 24, tam: 2 });
        const b = m.bichos.find((q) => q.muerto && !q.caido && Math.abs(q.x + q.w / 2 - e.x) < 2);
        if (b) { b.caido = true; J.cadaveres.push({ tipo: b.tipo, x: b.x + b.w / 2, y: b.y + b.h, dir: b.dir, vx: sig(b.x + b.w / 2 - p.x - 4) * 40, vy: -120, t: 0 }); }
        orbeLuz(e.x, e.y, 3);
        break;
      }
      case 'bloqueo': FX.emitir(e.x, e.y, 8, { cols: ['#ffffff', '#d8d8ff'], disp: 100, vida: 8, forma: 'linea' }); J.ondas.push({ x: e.x, y: e.y, t: 0, dur: 0.15, r: 8, col: '200,210,255' }); break;
      case 'terron': FX.emitir(e.x, e.y, e.fin ? 16 : 5, { cols: ['#ffe08a', '#f0a03a', '#c86a1e'], disp: e.fin ? 90 : 50, g: 300, vida: 22 }); J.ambarMas += e.fin ? 6 : 1; break;
      case 'rompe': FX.temblar(3); FX.emitir(e.x, e.y, 18, { cols: [Z.madera, Z.maderaClara, Z.maderaOsc], g: 420, disp: 110, rx: (e.bw || 8) / 2, ry: (e.bh || 8) / 2, vida: 34, tam: 2 }); guardarLM(); break;
      case 'pogo': case 'pogoEspina': FX.emitir(p.x + 4, p.y + 14, 6, { cols: ['#ffffff', '#f6ffa8'], vy: 40, disp: 50, vida: 10 }); J.ondas.push({ x: p.x + 4, y: p.y + 14, t: 0, dur: 0.2, r: 12, col: '246,255,168' }); break;
      case 'dano':
        FX.temblar(4); Bucle.congelar(5); A.flash = 3; J.flash = Math.max(J.flash, 0.35); J.golpeRojo = 0.5;
        FX.emitir(p.x + 4, p.y + 6, 12, { cols: ['#ffffff', '#1a1426', '#f6ffa8'], disp: 120, vida: 16, forma: 'linea' });
        break;
      case 'muere':
        J.muerte = { t: 0 };
        FX.temblar(6);
        for (let i = 0; i < 22; i++) { const a = i / 22 * Math.PI * 2; FX.emitir(p.x + 4, p.y + 6, 1, { col: i % 2 ? '#f6ffa8' : '#ffffff', vx: Math.cos(a) * 90, vy: Math.sin(a) * 90 - 30, disp: 6, vida: 40, tam: 2, arrastre: 0.93 }); }
        break;
      case 'vuelve': FX.emitir(p.x + 4, p.y + 6, 8, { cols: ['#f6ffa8', '#ffffff'], disp: 40, vida: 14 }); break;
      case 'curaEmpieza': J.curaAnillo = 0; break;
      case 'cura': FX.emitir(p.x + 4, p.y + 8, 14, { cols: ['#f6ffa8', '#ffffff', '#b4e858'], vy: -50, disp: 30, vida: 24 }); A.flash = 2; J.ondas.push({ x: p.x + 4, y: p.y + 6, t: 0, dur: 0.5, r: 30, col: '246,255,168' }); break;
      case 'banco': if (!J.sentada && Entrada.EDGE.arr) sentarse(m, e); break;
      case 'habla': if (Entrada.EDGE.arr && J.estado === 'jugando') hablar(e.quien); break;
      case 'chispaExtra':
        Prog.vidaMax = p.vidaMax; guardarLM();
        FX.emitir(e.x, e.y, 24, { cols: ['#f6ffa8', '#ffffff'], disp: 100, vida: 30 });
        J.hallazgos.push('chispaExtra');
        break;
      case 'ambar': J.ambarMas += 1; break;
      case 'rugido':
        FX.temblar(5);
        if (m.jefe) { const jx = m.jefe.x + m.jefe.w / 2, jy = m.jefe.y + m.jefe.h / 2; J.ondas.push({ x: jx, y: jy, t: 0, dur: 0.9, r: 120, col: '255,200,170' }); J.ondas.push({ x: jx, y: jy, t: -0.15, dur: 0.9, r: 90, col: '255,255,255' }); }
        break;
      case 'aviso': FX.emitir(e.x, e.y - 4, 5, { cols: ['#ffffff', '#ff8a5a'], vy: -40, disp: 20, vida: 10 }); break;
      case 'choca': FX.temblar(6); FX.emitir(e.x, e.y, 16, { cols: [Z.madera, Z.maderaClara, '#b09070'], g: 380, disp: 120, vida: 30, tam: 2 }); J.ondas.push({ x: e.x, y: e.y, t: 0, dur: 0.35, r: 30, col: '255,230,200' }); break;
      case 'tierra': FX.temblar(4); FX.emitir(e.x, e.y, 12, { cols: Z.polvo, vy: -30, disp: 90, vida: 20 }); break;
      case 'carga': FX.emitir(m.jefe ? m.jefe.x + m.jefe.w / 2 : p.x, m.jefe ? m.jefe.y + m.jefe.h : p.y, 6, { cols: Z.polvo, disp: 40, vida: 16 }); break;
      case 'rocaCae': FX.emitir(e.x, e.y, 8, { cols: ['#7a5a3a', '#b09070'], g: 300, disp: 60, vida: 18 }); break;
      case 'jefeFase': FX.temblar(6); A.flash = 3; J.flash = 0.4; if (m.jefe) J.ondas.push({ x: m.jefe.x + m.jefe.w / 2, y: m.jefe.y + m.jefe.h / 2, t: 0, dur: 0.7, r: 90, col: '255,120,90' }); break;
      case 'jefeMuere':
        FX.temblar(10); J.flash = 1;
        J.rayos = { x: e.x, y: e.y, t: 0 };
        /* cámara lenta: el golpe final se siente */
        Bucle.velocidad = Opc.velocidad * 0.35; J.lento = 1.2;
        for (let i = 0; i < 34; i++) { const a = i / 34 * Math.PI * 2; FX.emitir(e.x, e.y, 1, { col: i % 3 ? '#ffffff' : '#fff0a0', vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, disp: 20, vida: 44, tam: 2, arrastre: 0.93 }); }
        break;
      case 'jefeFin': terminarPelea(m, e.tipo); break;
    }
  }
  m.eventos.length = 0;
}

/* ---------------- los hongos: descansar y guardar ---------------- */
function sentarse(m, e) {
  const p = m.p;
  J.sentada = true;
  p.vx = 0; p.vida = p.vidaMax; p.x = Math.round(e.x - 4);
  Prog.banco = { sala: m.sala.id, x: p.x, y: p.y };
  FX.emitir(e.x, e.y + 2, 16, { cols: ['#c8fff6', '#4ad8c8', '#ffffff'], vy: -30, disp: 40, vida: 30 });
  J.ondas.push({ x: e.x, y: e.y + 4, t: 0, dur: 0.8, r: 40, col: '120,240,220' });
  J.aviso = { txt: 'descansaste', t: 0, col: '#c8fff6' };
  guardarLM();
}

/* ---------------- charlas y tienda ---------------- */
function avanceHistoria() { return (Prog.jefes.torito ? 1 : 0) + (Prog.jefes.viuda ? 1 : 0); }
function hablar(quien) {
  const textos = TX().charlas[quien];
  if (!textos || J.sinCharlas) return;
  const i = Math.min(avanceHistoria(), textos.length - 1);
  const lineas = textos[i].map((t, k) => ({ q: QUIEN_HABLA[quien][i][k], t }));
  const npc = J.mundo.cosas.find((c) => c.tipo === 'npc' && c.quien === quien);
  iniciarDialogoLM(lineas, npc, quien === 'canasto' ? abrirTienda : null);
  Sonido.sfx('habla');
}
function iniciarDialogoLM(lineas, npc, alTerminar) {
  J.dialogo = { lineas, i: 0, n: 0, t: 0, npc, alTerminar };
  J.estado = 'dialogo';
  J.sentada = false;
}
function pasarDialogoLM() {
  const d = J.dialogo, E = Entrada.EDGE, l = d.lineas[d.i];
  d.t += DT;
  const largo = Array.from(l.t).length;
  if (d.n < largo) {
    const antes = Math.floor(d.n);
    d.n = Math.min(largo, d.n + 0.8);
    if (Math.floor(d.n) !== antes && antes % 2 === 0 && l.t[antes] !== ' ') Sonido.sfx('texto', { f: { chispa: 880, mamboreta: 320, vaquita: 1040, canasto: 420, bolita: 560 }[l.q] || 600 });
  }
  if (E.salto || E.aceptar || E.golpe || J.toque) {
    if (d.n < largo) d.n = largo;
    else {
      d.i++; d.n = 0; d.t = 0;
      if (d.i >= d.lineas.length) { J.dialogo = null; J.estado = 'jugando'; if (d.alTerminar) d.alTerminar(); }
    }
  }
  J.toque = false;
  pasarAnimLM(J.anim, J.mundo); FX.pasar(); ubicarLM(J.mundo);
}

function abrirTienda() {
  J.estado = 'tienda';
  mostrarMandosLM(false);
  Menu.abrir(menuTienda());
}
function comprar(id) {
  const p = J.mundo.p, precio = PRECIOS[id];
  if (Prog.compras[id]) { Sonido.sfx('nada'); return; }
  if (p.ambar < precio) { Sonido.sfx('nada'); Menu.actual.aviso = { txt: tr('noAlcanza'), t: 0 }; return; }
  p.ambar -= precio; Prog.ambar = p.ambar; J.ambarVisto = p.ambar;
  Prog.compras[id] = true;
  if (id === 'corazon') Prog.vidaMax = p.vidaMax + 1;
  vestirChispa(p);
  if (id === 'corazon') p.vida = p.vidaMax;
  Sonido.sfx('compra');
  Menu.actual.compra = { id, t: 0 };
  guardarLM();
}
function menuTienda() {
  const items = ORDEN_TIENDA.map((id) => ({ id, texto: () => TX().tienda[id][0], valor: () => Prog.compras[id] ? tr('yaEsTuyo') : String(PRECIOS[id]), accion: () => comprar(id) }));
  items.push({ id: 'chau', texto: () => tr('chau'), accion: cerrarTienda });
  return { id: 'tienda', items, alVolver: cerrarTienda, dibujar: dibujarTienda, pausaVuelve: true };

      { id: 'temblor', texto: () => tr('temblor'), valor: () => siNo(Opc.temblor), izq: alternar('temblor'), der: alternar('temblor') },
      { id: 'velocidad', texto: () => tr('velocidad'), valor: () => Math.round(Opc.velocidad * 100) + '%',
        izq: () => { Opc.velocidad = vels[Math.max(0, vels.indexOf(Opc.velocidad) - 1)]; aplicarOpcionesLM(); },
        der: () => { Opc.velocidad = vels[(vels.indexOf(Opc.velocidad) + 1) % vels.length]; aplicarOpcionesLM(); } },
      { id: 'invencible', texto: () => tr('invencible'), valor: () => siNo(Opc.invencible), izq: alternar('invencible'), der: alternar('invencible') },
      { id: 'volver', texto: () => tr('volver'), accion: () => Menu.volver() },

function menuPausa() {

function pausarLM() { J.estado = 'pausa'; mostrarMandosLM(false); Menu.abrir(menuPausa()); }
function seguirLM() { Menu.cerrar(); J.estado = 'jugando'; mostrarMandosLM(true); }
function abrirMapa() { J.estado = 'mapa'; J.tMapa = 0; Menu.cerrar(); mostrarMandosLM(false); }
function irPortadaLM(conLuz) {

function mostrarMandosLM(ver) {
