<!doctype html>

<head>

<title>LUZ MALA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23050308'/%3E%3Crect x='6' y='3' width='5' height='2' fill='%23f08a34'/%3E%3Crect x='5' y='5' width='7' height='4' fill='%233d3156'/%3E%3Crect x='6' y='6' width='2' height='2' fill='%23fff8e0'/%3E%3Crect x='9' y='6' width='2' height='2' fill='%23fff8e0'/%3E%3Crect x='2' y='9' width='4' height='4' fill='%23f6ffa8'/%3E%3Crect x='6' y='9' width='5' height='3' fill='%233d3156'/%3E%3C/svg%3E">
<style>
/* luz-mala/luz-mala.css — LUZ MALA no usa las capas de motor2d/ui.css: los
   menús se dibujan en el lienzo. Acá solo va la base y los mandos táctiles,
   redondos y con luz propia (en ZONDA son octógonos de 16 bits) */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050308;color:#efe6d2;touch-action:none;overscroll-behavior:none}
#juego{position:fixed;inset:0;overflow:hidden}
#lienzo{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
canvas.px{display:block;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none}

/* ---------- mandos: burbujas de luz que respiran ---------- */
.mandos{position:absolute;left:0;right:0;bottom:0;height:230px;pointer-events:none;z-index:3;display:none}
.mandos.ver{display:block;animation:asomar .5s ease-out both}
@keyframes asomar{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.mandos .zona{position:absolute;left:0;bottom:0;width:52%;height:250px;pointer-events:auto;touch-action:none}
.mandos .base,.mandos .perilla{position:absolute;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .15s;border-radius:50%}
.mandos .zona.on .base,.mandos .zona.on .perilla{opacity:1}
.mandos .base{width:72px;height:72px;border:2px solid rgba(246,255,168,.28);
  background:radial-gradient(circle,rgba(246,255,168,.10) 0 40%,rgba(246,255,168,0) 72%)}
.mandos .perilla{width:36px;height:36px;
  background:radial-gradient(circle at 40% 38%,#fffbe0 0 18%,rgba(246,255,168,.75) 42%,rgba(246,255,168,0) 72%);
  box-shadow:0 0 18px 4px rgba(246,255,168,.35)}
.mandos .pista{position:absolute;left:18px;bottom:max(22px,env(safe-area-inset-bottom));pointer-events:none;opacity:.55}
.mandos .bt{position:absolute;width:74px;height:74px;border-radius:50%;pointer-events:auto;touch-action:none;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,rgba(61,49,86,.55),rgba(13,10,20,.45) 70%);
  border:2px solid rgba(239,230,210,.22);box-shadow:0 0 0 1px rgba(5,3,8,.5),0 0 14px rgba(246,255,168,.06);
  transition:transform .08s,box-shadow .12s,background .12s;animation:respirar 3.2s ease-in-out infinite}
.mandos .bt:nth-child(3){animation-delay:.8s}.mandos .bt:nth-child(4){animation-delay:1.6s}.mandos .bt:nth-child(5){animation-delay:2.4s}
@keyframes respirar{0%,100%{box-shadow:0 0 0 1px rgba(5,3,8,.5),0 0 10px rgba(246,255,168,.04)}
  50%{box-shadow:0 0 0 1px rgba(5,3,8,.5),0 0 18px rgba(246,255,168,.16)}}
.mandos .bt.on{transform:scale(.9);border-color:rgba(246,255,168,.7);animation:none;
  background:radial-gradient(circle at 50% 45%,rgba(246,255,168,.45),rgba(246,255,168,.08) 70%);
  box-shadow:0 0 26px 6px rgba(246,255,168,.35)}
.mandos .bt.chico{width:58px;height:58px}
.pausa-bt{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));z-index:4;
  width:42px;height:42px;border-radius:50%;display:none;align-items:center;justify-content:center;pointer-events:auto;
  background:rgba(13,10,20,.45);border:2px solid rgba(239,230,210,.2)}
.pausa-bt:active{transform:scale(.9);background:rgba(246,255,168,.25)}
.pausa-bt.ver{display:flex}

</style>
</head>
<body>
<div id="juego">
  <canvas id="lienzo"></canvas>

  <div class="mandos" id="mandos">
    <div class="zona" id="zonaPalanca"><div class="base"></div><div class="perilla"></div></div>
    <div class="bt" id="btSalto" style="right:14px;bottom:max(30px,calc(env(safe-area-inset-bottom) + 14px))"></div>
    <div class="bt" id="btGolpe" style="right:100px;bottom:max(16px,calc(env(safe-area-inset-bottom) + 4px))"></div>
    <div class="bt chico" id="btDash" style="right:26px;bottom:max(122px,calc(env(safe-area-inset-bottom) + 106px))"></div>
    <div class="bt chico" id="btCurar" style="right:112px;bottom:max(108px,calc(env(safe-area-inset-bottom) + 94px))"></div>
  </div>
  <div class="pausa-bt" id="btPausa"></div>

</div>
<script>
(()=>{'use strict';
/* ==== motor2d/base.js ==== */
/* ============================================================================
   motor2d/base.js — lo que usa todo lo demás.
   Los juegos de motor2d se arman concatenando archivos adentro de UNA función
   ('use strict'), así que todo lo de arriba del archivo es visible abajo.
   Este archivo no toca el DOM: lo carga también el resolvedor en Node.
   ========================================================================== */

const lim = (v, a, b) => v < a ? a : v > b ? b : v;
const sig = (v) => v > 0 ? 1 : v < 0 ? -1 : 0;
const mezclar = (a, b, t) => a + (b - a) * t;
/* acercar un valor a otro sin pasarse: el "Approach" de Celeste, que es lo que
   hace que acelerar y frenar se sientan iguales a cualquier velocidad */
const acercar = (v, meta, paso) => v < meta ? Math.min(v + paso, meta) : Math.max(v - paso, meta);
const cruza = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

/* azar con semilla: una semilla da siempre el mismo mundo. El azar VISUAL
   (chispas, polvo) va con Math.random para no correr esta secuencia: si las
   partículas la usaran, la misma semilla dejaría de dar la misma partida */
function mulberry(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function semilla32(txt) {
  let h = 2166136261;
  for (let i = 0; i < txt.length; i++) h = Math.imul(h ^ txt.charCodeAt(i), 16777619);
  return h >>> 0;
}
const azar = (a, b) => a + Math.random() * (b - a);
const elegir = (lista) => lista[(Math.random() * lista.length) | 0];

const CUADRO = 1000 / 60;
const DT = 1 / 60;

/* guardar en el navegador: en una ventana privada o con los datos bloqueados
   localStorage tira al tocarlo, y el juego tiene que andar igual */
const Guardado = {
  leer(clave, porDefecto) {
    try { const v = localStorage.getItem(clave); return v == null ? porDefecto : JSON.parse(v); }
    catch (e) { return porDefecto; }
  },
  escribir(clave, valor) {
    try { localStorage.setItem(clave, JSON.stringify(valor)); return true; } catch (e) { return false; }
  },
};

/* tiempo de juego como texto: 83.4 s → "1:23.4" */
function reloj(seg) {
  const m = Math.floor(seg / 60), s = seg - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
}

/* ==== motor2d/idioma.js ==== */
/* ============================================================================
   motor2d/idioma.js — español, inglés y portugués.
   Cada juego trae sus textos en tablas con las mismas claves por idioma; acá
   se elige cuál vale. La elección se guarda y la próxima vez viene marcada.
   Si nunca se eligió, se propone el idioma del navegador.
   ========================================================================== */

const IDIOMAS = [['es', 'ESPAÑOL'], ['en', 'ENGLISH'], ['pt', 'PORTUGUÊS']];
const Idioma = {
  actual: 'es', clave: null, tablas: { es: {} }, elegido: false,
  iniciar(clave, tablas) {
    this.clave = clave; this.tablas = tablas;
    const g = Guardado.leer(clave, null);
    this.elegido = !!(g && tablas[g]);
    this.actual = this.elegido ? g : this.delNavegador();
  },
  delNavegador() {
    const l = String((navigator.languages && navigator.languages[0]) || navigator.language || 'es').slice(0, 2).toLowerCase();
    return this.tablas[l] ? l : 'es';
  },
  poner(l) { if (!this.tablas[l]) return; this.actual = l; this.elegido = true; Guardado.escribir(this.clave, l); },
  /* una clave de la tabla del idioma; si falta, la del español; si falta, la clave */
  t(k) {
    const T = this.tablas[this.actual];
    if (T && T[k] != null) return T[k];
    const E = this.tablas.es;
    return E && E[k] != null ? E[k] : k;
  },
  /* los textos del DOM marcados con data-t="clave" */
  traducirDOM(raiz) {
    (raiz || document).querySelectorAll('[data-t]').forEach((el) => { el.textContent = this.t(el.dataset.t); delete el.dataset.pxk; });
    document.documentElement.lang = this.actual;
  },
};
/* tr('carta', n, total) → "CARTA 3/19": {0}, {1}… se reemplazan en orden */
function tr(k) {
  let s = String(Idioma.t(k));
  for (let i = 1; i < arguments.length; i++) s = s.split('{' + (i - 1) + '}').join(arguments[i]);
  return s;
}

/* ==== motor2d/pantalla.js ==== */
/* ============================================================================
   motor2d/pantalla.js — el mundo se dibuja chico y se agranda entero.
   Dos lienzos: el del mundo (W x H píxeles de juego, escala 1) y el visible.
   Por cuadro se dibuja todo en el chico y se copia UNA vez agrandado.
   ========================================================================== */

const Pantalla = {
  lienzo: null, cx: null,        // el que se ve
  cv: null, g: null,             // el del mundo: acá dibuja el juego
  PX: 2,                         // píxeles CSS por píxel de juego (entero)
  S: 2,                          // píxeles del lienzo visible por píxel de juego (entero)
  W: 0, H: 0,                    // tamaño del mundo visible, en píxeles de juego
  base: 200,                     // cuántos píxeles de juego tiene el lado corto
  alCambiar: null,
  pedirMedida: true,
  cuenta: 0,

  iniciar(lienzo, base) {
    this.lienzo = lienzo;
    this.base = base || 200;
    this.cx = lienzo.getContext('2d', { alpha: false });
    this.cv = document.createElement('canvas');
    this.g = this.cv.getContext('2d', { alpha: false });
    const pedir = () => { this.pedirMedida = true; };
    if (window.ResizeObserver) new ResizeObserver(pedir).observe(lienzo.parentNode);
    window.addEventListener('resize', pedir);
    window.addEventListener('orientationchange', pedir);
    this.medir();
  },

  /* PX sale del lado corto: en un teléfono parado (412 de ancho) da 2 y el
     mundo mide 206 de ancho; en una compu de 1280x720 da 4 y el mundo mide
     320x180. Con escala no entera (1,94) los píxeles salen de distinto
     tamaño y todo tiembla al moverse */
  medir() {
    const cont = this.lienzo.parentNode;
    const ancho = Math.max(1, cont.clientWidth || innerWidth);
    const alto = Math.max(1, cont.clientHeight || innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const PX = Math.max(1, Math.round(Math.min(ancho, alto) / this.base));
    const W = Math.ceil(ancho / PX), H = Math.ceil(alto / PX);
    const S = Math.min(4, Math.max(1, Math.round(PX * dpr)));
    this.pedirMedida = false;
    if (W === this.W && H === this.H && PX === this.PX && S === this.S) return false;
    this.PX = PX; this.W = W; this.H = H; this.S = S;
    this.cv.width = W; this.cv.height = H;
    this.g.imageSmoothingEnabled = false;
    this.lienzo.width = W * S; this.lienzo.height = H * S;
    this.lienzo.style.width = (W * PX) + 'px';
    this.lienzo.style.height = (H * PX) + 'px';
    this.cx.imageSmoothingEnabled = false;
    if (this.alCambiar) this.alCambiar(W, H);
    return true;
  },

  /* se llama al EMPEZAR el cuadro: cambiar el tamaño de un lienzo lo borra, y
     si pasa después de dibujar el navegador muestra un cuadro negro */
  revisar() {
    this.cuenta++;
    if (this.pedirMedida || this.cuenta % 15 === 0) this.medir();
  },

  presentar() {
    this.cx.drawImage(this.cv, 0, 0, this.W * this.S, this.H * this.S);
  },

  /* de coordenadas de la ventana a píxeles de juego */
  aMundo(clientX, clientY) {
    const r = this.lienzo.getBoundingClientRect();
    return { x: (clientX - r.left) / this.PX, y: (clientY - r.top) / this.PX };
  },
};

/* ==== motor2d/entrada.js ==== */
/* ============================================================================
   motor2d/entrada.js — teclado, toque y mando dan las mismas acciones.
   IN[a]   = apretada ahora          EDGE[a] = se apretó en este paso
   SOLT[a] = se soltó en este paso
   Los flancos se borran al FINAL del paso de juego (Entrada.fin()): si se
   borraran al principio, un "recién apretado" nunca llegaría a leerse.
   ========================================================================== */

const Entrada = {
  IN: Object.create(null),
  EDGE: Object.create(null),
  SOLT: Object.create(null),
  quien: Object.create(null),       // acción → quiénes la tienen apretada
  teclas: Object.create(null),      // código de tecla → acción
  mando: { 0: 'salto', 1: 'volver', 2: 'dash', 3: 'curar', 4: 'agarre', 5: 'agarre', 6: 'agarre', 7: 'agarre', 8: 'mapa', 9: 'pausa', 12: 'arr', 13: 'aba', 14: 'izq', 15: 'der' },
  fuente: 'teclado',
  alUsar: null,                     // avisa cuando cambia teclado / toque / mando

  pulsar(a, id) {
    const q = this.quien[a] || (this.quien[a] = new Set());
    if (q.has(id)) return;
    q.add(id);
    if (q.size === 1) { this.IN[a] = true; this.EDGE[a] = true; }
  },
  soltar(a, id) {
    const q = this.quien[a];
    if (!q || !q.delete(id)) return;
    if (q.size === 0) { this.IN[a] = false; this.SOLT[a] = true; }
  },
  soltarTodo() {
    for (const a in this.quien) {
      if (this.quien[a].size) { this.quien[a].clear(); this.IN[a] = false; this.SOLT[a] = true; }
    }
  },
  fin() {
    for (const a in this.EDGE) this.EDGE[a] = false;
    for (const a in this.SOLT) this.SOLT[a] = false;
  },
  usar(f) {
    if (this.fuente === f) return;
    this.fuente = f;
    if (this.alUsar) this.alUsar(f);
  },

  iniciarTeclado(mapa) {
    Object.assign(this.teclas, mapa);
    addEventListener('keydown', (e) => {
      const a = this.teclas[e.code];
      if (!a) return;
      e.preventDefault();
      if (e.repeat) return;
      this.usar('teclado');
      this.pulsar(a, 'k' + e.code);
    });
    addEventListener('keyup', (e) => {
      const a = this.teclas[e.code];
      if (a) this.soltar(a, 'k' + e.code);
    });
    /* si la ventana pierde el foco con una tecla apretada, el keyup no llega
       nunca y el personaje queda corriendo solo */
    addEventListener('blur', () => this.soltarTodo());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.soltarTodo(); });
  },

  /* un botón de pantalla. Cada dedo se sigue por su pointerId: si no, apretar
     otro botón suelta el primero */
  boton(el, accion) {
    const dedos = new Set();
    const bajar = (e) => {
      e.preventDefault();
      dedos.add(e.pointerId);
      this.usar('toque');
      this.pulsar(accion, 'p' + e.pointerId);
      el.classList.add('on');
      /* capturar puede tirar si el puntero ya se fue: va en un try y DESPUÉS
         de anotar el toque */
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
    };
    const subir = (e) => {
      if (!dedos.delete(e.pointerId)) return;
      this.soltar(accion, 'p' + e.pointerId);
      if (!dedos.size) el.classList.remove('on');
    };
    el.addEventListener('pointerdown', bajar);
    el.addEventListener('pointerup', subir);
    el.addEventListener('pointercancel', subir);
    el.addEventListener('lostpointercapture', subir);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  },

  /* palanca que aparece donde apoya el pulgar. 8 direcciones en sectores de
     45°: para apuntar un dash en diagonal hace falta que la diagonal sea tan
     ancha como las rectas */
  palanca(zona, base, perilla, o) {
    o = Object.assign({ radio: 38, muerto: 11 }, o);
    let id = null, ox = 0, oy = 0, dx = 0, dy = 0;
    const dirs = { izq: false, der: false, arr: false, aba: false };
    const poner = (nx, ny) => {
      const quiere = { izq: nx < 0, der: nx > 0, arr: ny < 0, aba: ny > 0 };
      for (const a in quiere) {
        if (quiere[a] && !dirs[a]) { dirs[a] = true; this.pulsar(a, 'pal'); }
        else if (!quiere[a] && dirs[a]) { dirs[a] = false; this.soltar(a, 'pal'); }
      }
    };
    const dibujar = () => {
      base.style.transform = `translate(${ox - o.radio}px, ${oy - o.radio}px)`;
      const d = Math.hypot(dx, dy), k = d > o.radio ? o.radio / d : 1;
      perilla.style.transform = `translate(${ox + dx * k - 18}px, ${oy + dy * k - 18}px)`;
    };
    const mover = (e) => {
      const r = zona.getBoundingClientRect();
      dx = e.clientX - r.left - ox; dy = e.clientY - r.top - oy;
      const d = Math.hypot(dx, dy);
      /* si el pulgar se va lejos, la base lo sigue: así nunca se queda sin recorrido */
      if (d > o.radio * 1.5) { const k = (d - o.radio * 1.5) / d; ox += dx * k; oy += dy * k; dx -= dx * k; dy -= dy * k; }
      if (Math.hypot(dx, dy) < o.muerto) poner(0, 0);
      else {
        const a = Math.atan2(dy, dx), c = Math.cos(a), s = Math.sin(a);
        poner(Math.abs(c) > 0.38 ? sig(c) : 0, Math.abs(s) > 0.38 ? sig(s) : 0);
      }
      dibujar();
    };
    zona.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (id !== null) return;
      id = e.pointerId;
      this.usar('toque');
      const r = zona.getBoundingClientRect();
      ox = e.clientX - r.left; oy = e.clientY - r.top; dx = dy = 0;
      zona.classList.add('on');
      try { zona.setPointerCapture(id); } catch (_) {}
      dibujar();
    });
    zona.addEventListener('pointermove', (e) => { if (e.pointerId === id) mover(e); });
    const fin = (e) => {
      if (e.pointerId !== id) return;
      id = null; poner(0, 0); zona.classList.remove('on');
    };
    zona.addEventListener('pointerup', fin);
    zona.addEventListener('pointercancel', fin);
    zona.addEventListener('lostpointercapture', fin);
    zona.addEventListener('contextmenu', (e) => e.preventDefault());
    return { soltar: () => { id = null; poner(0, 0); zona.classList.remove('on'); } };
  },

  /* el mando se lee por encuesta: una vez por cuadro, antes de simular */
  leerMando() {
    if (!navigator.getGamepads) return;
    const lista = navigator.getGamepads();
    for (const m of lista) {
      if (!m || !m.connected) continue;
      let algo = false;
      for (const i in this.mando) {
        const b = m.buttons[i];
        const a = this.mando[i], id = 'm' + m.index + ':' + i;
        if (b && b.pressed) { this.pulsar(a, id); algo = true; } else this.soltar(a, id);
      }
      const ax = m.axes[0] || 0, ay = m.axes[1] || 0, id = 'm' + m.index + ':eje';
      const d = Math.hypot(ax, ay);
      const ang = Math.atan2(ay, ax), c = Math.cos(ang), s = Math.sin(ang);
      const nx = d > 0.45 && Math.abs(c) > 0.38 ? sig(c) : 0;
      const ny = d > 0.45 && Math.abs(s) > 0.38 ? sig(s) : 0;
      if (nx < 0) { this.pulsar('izq', id); algo = true; } else this.soltar('izq', id);
      if (nx > 0) { this.pulsar('der', id); algo = true; } else this.soltar('der', id);
      if (ny < 0) { this.pulsar('arr', id); algo = true; } else this.soltar('arr', id);
      if (ny > 0) { this.pulsar('aba', id); algo = true; } else this.soltar('aba', id);
      if (algo) this.usar('mando');
    }
  },
};

/* ==== motor2d/sonido.js ==== */
/* ============================================================================
   motor2d/sonido.js — todo el sonido sale de osciladores y ruido: cero archivos.
   Instrumentos (pulsada por Karplus-Strong, flauta, bajo, parche, campana,
   percusión), un secuenciador que programa con adelanto y un bus de efectos.
   El AudioContext se crea en el primer toque: antes, el navegador no deja sonar.
   ========================================================================== */

const NOTAS = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
function midiDe(nota) {
  const m = /^([A-G](?:#|b)?)(-?\d)$/.exec(nota);
  if (!m) return null;

const ACENTOS_PX = {
  'Á': ['A', 'a'], 'É': ['E', 'a'], 'Í': ['I', 'a'], 'Ó': ['O', 'a'], 'Ú': ['U', 'a'], 'Ñ': ['N', 't'], 'Ü': ['U', 'd'],

};

  a: [[3, -3], [2, -2]], t: [[0, -2], [1, -3], [2, -3], [3, -2], [4, -3]], d: [[1, -2], [3, -2]],

function glifoPx(ch) {
  const c = ch.toUpperCase();
  if (FUENTE_PX[c]) return { f: FUENTE_PX[c], m: null };
  const a = ACENTOS_PX[c];
  if (a) return { f: FUENTE_PX[a[0]], m: MARCAS_PX[a[1]] };
  return { f: FUENTE_PX['?'], m: null };
}
/* puntos encendidos de un texto: [x, y, fila], con y = 0 en la línea de las mayúsculas */
function puntosTexto(str) {
  const pts = [];
  let x = 0;
  for (const ch of str) {
    const g = glifoPx(ch), w = g.f[0].length;
    for (let r = 0; r < 7; r++) for (let k = 0; k < w; k++) if (g.f[r][k] === '#') pts.push([x + k, r, r]);
    if (g.m) for (const [mx, my] of g.m) pts.push([x + mx, my, my > 6 ? 6 : 0]);
    x += w + 1;
  }
  return { pts, w: Math.max(1, x - 1) };
}
function anchoTexto(str) {
  let x = 0;
  for (const ch of str) x += glifoPx(ch).f[0].length + 1;
  return Math.max(0, x - 1);
}

/* texto a un lienzo de 1 px por píxel de fuente: sombra, contorno y degradé
   por fila. Arriba deja 3 filas de aire para las tildes */
const cacheTxt = new Map();
function lienzoTexto(str, o) {
  o = o || {};
  const clave = str + '|' + (o.grad ? o.grad[0] + o.grad[6] : o.col) + '|' + (o.borde || '') + '|' + (o.sinSombra ? 1 : 0);
  let c = cacheTxt.get(clave);
  if (c) return c;
  const { pts, w } = puntosTexto(str);
  const arriba = 3;
  c = document.createElement('canvas');
  c.width = w + 3; c.height = arriba + 7 + 3;
  const g = c.getContext('2d'), ox = 1, oy = arriba + 1, borde = o.borde || '#141018';
  if (!o.sinSombra) {
    g.fillStyle = 'rgba(10,6,16,0.75)';
    for (const [x, y] of pts) g.fillRect(ox + x - 1, oy + y, 3, 3);
  }
  if (o.borde !== 'no') {
    g.fillStyle = borde;
    for (const [x, y] of pts) g.fillRect(ox + x - 1, oy + y - 1, 3, 3);
  }
  for (const [x, y, r] of pts) { g.fillStyle = o.grad ? o.grad[r] : (o.col || '#fff'); g.fillRect(ox + x, oy + y, 1, 1); }
  if (cacheTxt.size > 500) cacheTxt.clear();
  cacheTxt.set(clave, c);
  return c;
}

/* dibuja texto en el lienzo del mundo. y = la línea de arriba de las mayúsculas.
   o.alin: 'izq' | 'centro' | 'der'; o.escala: entero, para títulos */
function textoPx(g, str, x, y, o) {
  o = o || {};
  const c = lienzoTexto(str, o), e = o.escala || 1;
  let dx = x - e;
  if (o.alin === 'centro') dx = x - Math.floor((c.width - 3) * e / 2) - e;
  else if (o.alin === 'der') dx = x - (c.width - 3) * e - e;
  g.drawImage(c, Math.round(dx), Math.round(y - 4 * e), c.width * e, c.height * e);
}
/* letra por letra: para escribir de a poco y para las palabras que tiemblan */
function textoLetras(g, str, x, y, o, cuantas, desplazar) {
  o = o || {};
  let cx = x, i = 0;
  for (const ch of str) {
    if (cuantas != null && i >= cuantas) break;
    const w = glifoPx(ch).f[0].length;
    if (ch !== ' ') {
      const c = lienzoTexto(ch, o), d = desplazar ? desplazar(i) : null;
      g.drawImage(c, Math.round(cx - 1 + (d ? d[0] : 0)), Math.round(y - 4 + (d ? d[1] : 0)));
    }
    cx += w + 1; i++;
  }
}
/* partir un texto en renglones que entren en "ancho" píxeles */
function envolver(str, ancho) {
  const renglones = [];
  for (const parrafo of str.split('\n')) {
    let linea = '';
    for (const pal of parrafo.split(' ')) {
      const prueba = linea ? linea + ' ' + pal : pal;
      if (anchoTexto(prueba) > ancho && linea) { renglones.push(linea); linea = pal; }
      else linea = prueba;
    }
    renglones.push(linea);
  }
  return renglones;
}

/* pone un texto del DOM en pixel art sin perder el texto original */
function pixelar(el, S, o) {
  if (!el) return;
  const txt = el.textContent.trim() !== '' ? el.textContent.trim() : (el.dataset.px || '');
  if (!txt) return;
  const clave = txt + '|' + S + '|' + (o && o.grad ? o.grad[0] : '');
  if (el.dataset.pxk === clave && el.querySelector('canvas.px')) return;
  el.dataset.px = txt; el.dataset.pxk = clave; el.textContent = '';
  const src = lienzoTexto(txt, o), c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  c.getContext('2d').drawImage(src, 0, 0);
  c.className = 'px';
  c.style.width = (c.width * S) + 'px'; c.style.height = (c.height * S) + 'px';
  c.setAttribute('aria-label', txt);
  el.appendChild(c);
}

/* ==== motor2d/sprites.js ==== */
/* ============================================================================
   motor2d/sprites.js — los sprites son grillas de texto, una letra por color.
   Se hornean UNA vez a lienzos chicos (y su espejo) y después solo se copian:
   copiar un lienzo cuesta mucho menos que pintar píxel por píxel cada cuadro.
   ========================================================================== */

/* filas: ["..kk..", ".kook."]; paleta: { k: '#1a1020', o: '#e0a878' }; '.' es aire.
   o.contorno: color para un borde de 1 px alrededor de lo pintado, que así no
   hay que dibujarlo a mano en cada cuadro de animación */
function hornear(filas, paleta, o) {
  o = o || {};
  const h = filas.length, w = Math.max(...filas.map((f) => f.length));
  const m = o.contorno ? 1 : 0;
  const c = document.createElement('canvas');
  c.width = w + m * 2; c.height = h + m * 2;
  const g = c.getContext('2d');
  const lleno = (x, y) => y >= 0 && y < h && x >= 0 && x < filas[y].length && filas[y][x] !== '.' && filas[y][x] !== ' ' && paleta[filas[y][x]] !== undefined;
  if (o.contorno) {
    g.fillStyle = o.contorno;
    for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
      if (lleno(x, y)) continue;
      if (lleno(x - 1, y) || lleno(x + 1, y) || lleno(x, y - 1) || lleno(x, y + 1)) g.fillRect(x + m, y + m, 1, 1);
    }
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < filas[y].length; x++) {
    const col = paleta[filas[y][x]];
    if (col) { g.fillStyle = col; g.fillRect(x + m, y + m, 1, 1); }
  }
  return c;
}
function espejar(c) {
  const e = document.createElement('canvas');
  e.width = c.width; e.height = c.height;
  const g = e.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0);
  return e;
}
/* la silueta de un sprite en un color: el destello blanco al recibir un golpe */
function silueta(c, col) {
  const e = document.createElement('canvas');
  e.width = c.width; e.height = c.height;
  const g = e.getContext('2d');
  g.drawImage(c, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  return e;
}

/* un sprite horneado con sus dos lados y su silueta, más el punto de apoyo
   (ox, oy): dónde van los pies respecto de la esquina del lienzo */
function sprite(filas, paleta, o) {
  o = o || {};
  const der = hornear(filas, paleta, o);
  const s = { der, izq: espejar(der), w: der.width, h: der.height, ox: o.ox != null ? o.ox : der.width >> 1, oy: o.oy != null ? o.oy : der.height };
  s.blanco = silueta(der, '#ffffff'); s.blancoIzq = espejar(s.blanco);
  return s;
}
/* dibuja con el apoyo en (x, y) mirando a dir (1 derecha, -1 izquierda).
   sx/sy: estirar y aplastar, redondeado a píxel entero */
function dibujarSprite(g, s, x, y, dir, o) {
  o = o || {};
  const img = o.blanco ? (dir < 0 ? s.blancoIzq : s.blanco) : (dir < 0 ? s.izq : s.der);
  const sx = o.sx || 1, sy = o.sy || 1;
  const w = Math.max(1, Math.round(s.w * sx)), h = Math.max(1, Math.round(s.h * sy));
  const ox = dir < 0 ? s.w - s.ox : s.ox;
  const dx = Math.round(x - ox * w / s.w), dy = Math.round(y - s.oy * h / s.h);
  if (o.alfa != null) { g.globalAlpha = o.alfa; g.drawImage(img, dx, dy, w, h); g.globalAlpha = 1; }
  else g.drawImage(img, dx, dy, w, h);
}

/* animación: lista de sprites y cuadros por segundo */
function cuadroDe(anim, t) {
  return anim.cuadros[Math.floor(t * anim.fps) % anim.cuadros.length];
}

/* ==== motor2d/fx.js ==== */
/* ============================================================================
   motor2d/fx.js — partículas, temblor, congelado y fundidos de consola.
   Todo el azar de acá es visual: usa Math.random y nunca el azar del mundo.
   ========================================================================== */

const FX = {
  part: [],
  max: 260,
  temblor: 0,
  sx: 0, sy: 0,
  temblorActivo: true,

  /* o: { col | cols, vx, vy, disp (dispersión de velocidad), g (gravedad),
          vida (cuadros), tam, arrastre, forma: 'cuadro' | 'linea', luz } */
  emitir(x, y, n, o) {
    o = o || {};
    for (let i = 0; i < n; i++) {
      if (this.part.length >= this.max) this.part.shift();
      const d = o.disp == null ? 40 : o.disp;
      const vida = o.vida ? o.vida * azar(0.7, 1.3) : azar(18, 34);
      this.part.push({
        x: x + azar(-(o.rx || 0), o.rx || 0), y: y + azar(-(o.ry || 0), o.ry || 0),
        vx: (o.vx || 0) + azar(-d, d), vy: (o.vy || 0) + azar(-d, d),
        g: o.g == null ? 0 : o.g, arr: o.arrastre == null ? 0.96 : o.arrastre,
        vida, max: vida, tam: o.tam || 1, col: o.cols ? elegir(o.cols) : (o.col || '#fff'),
        forma: o.forma || 'cuadro', luz: o.luz || 0, fondo: !!o.fondo,
      });
    }
  },
  pasar() {
    const p = this.part;
    for (let i = p.length - 1; i >= 0; i--) {
      const q = p[i];
      q.vx *= q.arr; q.vy = q.vy * q.arr + q.g * DT;
      q.x += q.vx * DT; q.y += q.vy * DT;
      if (--q.vida <= 0) p.splice(i, 1);
    }
    if (this.temblor > 0) {
      this.temblor *= 0.86;
      if (this.temblor < 0.3) this.temblor = 0;
      const t = this.temblorActivo ? this.temblor : 0;
      this.sx = Math.round(azar(-t, t)); this.sy = Math.round(azar(-t, t));
    } else { this.sx = this.sy = 0; }
  },
  dibujar(g, cx, cy, fondo) {
    for (const q of this.part) {
      if (q.fondo !== !!fondo) continue;
      const x = Math.round(q.x - cx), y = Math.round(q.y - cy);
      const t = q.tam > 1 && q.vida < q.max * 0.5 ? q.tam - 1 : q.tam;
      g.fillStyle = q.col;
      if (q.forma === 'linea') {
        const l = Math.max(1, Math.min(6, Math.round(Math.hypot(q.vx, q.vy) * DT * 1.5)));
        g.fillRect(x, y, l, 1);
      } else g.fillRect(x, y, t, t);
    }
  },
  temblar(f) { if (f > this.temblor) this.temblor = f; },
  limpiar() { this.part.length = 0; this.temblor = 0; },
};

/* trama Bayer 4x4: el fundido de las consolas de 16 bits. Un patrón por nivel
   de 0 a 16, creado en el mismo contexto donde se usa */
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const Trama = {
  pat: [], ctx: null, col: '',
  preparar(g, col) {
    if (this.ctx === g && this.col === col) return;
    this.ctx = g; this.col = col; this.pat = [];
    for (let n = 0; n <= 16; n++) {
      const c = document.createElement('canvas');
      c.width = c.height = 4;
      const q = c.getContext('2d');
      q.fillStyle = col;
      for (let i = 0; i < 16; i++) if (BAYER[i] < n) q.fillRect(i % 4, i >> 2, 1, 1);
      this.pat.push(g.createPattern(c, 'repeat'));
    }
  },
  /* nivel 0 (nada) a 16 (todo tapado) */
  cubrir(g, nivel, col, x, y, w, h) {
    nivel = Math.round(lim(nivel, 0, 16));
    if (nivel <= 0) return;
    this.preparar(g, col || '#07060c');
    g.fillStyle = this.pat[nivel];
    g.fillRect(x || 0, y || 0, w == null ? Pantalla.W : w, h == null ? Pantalla.H : h);
  },
};

/* fundidos entre escenas: 'trama' (Bayer) o 'circulo' (se cierra sobre un punto).
   A la mitad llama a alMedio (cambiar de sala, reaparecer) y al final a alFin */
const Transicion = {
  activa: false, t: 0, dur: 0, tipo: 'trama', cx: 0, cy: 0, col: '#07060c',
  alMedio: null, alFin: null, hecho: false,
  iniciar(tipo, cuadros, alMedio, alFin, o) {
    o = o || {};
    this.activa = true; this.t = 0; this.dur = cuadros; this.tipo = tipo;
    this.alMedio = alMedio; this.alFin = alFin; this.hecho = false;
    this.cx = o.cx != null ? o.cx : Pantalla.W / 2; this.cy = o.cy != null ? o.cy : Pantalla.H / 2;
    this.col = o.col || '#07060c';
  },
  pasar() {
    if (!this.activa) return;
    this.t++;
    if (!this.hecho && this.t >= this.dur / 2) { this.hecho = true; if (this.alMedio) this.alMedio(); }
    if (this.t >= this.dur) { this.activa = false; if (this.alFin) this.alFin(); }
  },
  /* 0 → 1 → 0 a lo largo del fundido */
  cantidad() { return this.activa ? 1 - Math.abs(this.t / this.dur * 2 - 1) : 0; },
  dibujar(g) {
    if (!this.activa) return;
    const k = this.cantidad();
    if (this.tipo === 'trama') Trama.cubrir(g, k * 16.99, this.col);
    else {
      /* el círculo se dibuja por renglones: arc() suaviza el borde y en pixel
         art tiene que quedar duro */
      const W = Pantalla.W, H = Pantalla.H;
      const rmax = Math.hypot(Math.max(this.cx, W - this.cx), Math.max(this.cy, H - this.cy)) + 2;
      const r = rmax * (1 - k);
      g.fillStyle = this.col;
      for (let y = 0; y < H; y++) {
        const dy = y + 0.5 - this.cy;
        if (Math.abs(dy) >= r) { g.fillRect(0, y, W, 1); continue; }
        const a = Math.sqrt(r * r - dy * dy), x0 = Math.round(this.cx - a), x1 = Math.round(this.cx + a);
        if (x0 > 0) g.fillRect(0, y, x0, 1);
        if (x1 < W) g.fillRect(x1, y, W - x1, 1);
      }
    }
  },
};

/* ==== motor2d/bucle.js ==== */
/* ============================================================================
   motor2d/bucle.js — la simulación corre a 60 Hz fijos; el dibujo, a lo que dé
   la pantalla. Así un teléfono de 120 Hz y uno trabado juegan el mismo juego.
   ========================================================================== */

const Bucle = {
  acum: 0, ultimo: 0, velocidad: 1, congelado: 0, corriendo: false,
  pasar: null, dibujar: null, antes: null,
  pasos: 0,                 // pasos de simulación desde que arrancó
  msDibujo: 0,              // cuánto tarda dibujar un cuadro (promedio móvil)
  fijo: false,              // ?fijo en la dirección: sin ajustes automáticos (pruebas)

  iniciar(pasar, dibujar, antes) {
    this.pasar = pasar; this.dibujar = dibujar; this.antes = antes;
    this.corriendo = true;
    document.addEventListener('visibilitychange', () => { this.ultimo = 0; });
    requestAnimationFrame((ts) => this.tick(ts));
  },
  /* congelar la simulación unos cuadros (el golpe que se siente). Mientras
     tanto la entrada NO se consume: el salto apretado en el congelado sale igual */
  congelar(n) { if (n > this.congelado) this.congelado = n; },

  tick(ts) {
    requestAnimationFrame((t) => this.tick(t));
    Pantalla.revisar();
    /* el primer cuadro puede traer una marca ANTERIOR a la última: sin el
       Math.max el dt da negativo y la partida arranca rota */
    const real = this.ultimo ? Math.max(0, Math.min(100, ts - this.ultimo)) : CUADRO;
    this.ultimo = ts;
    if (this.antes) this.antes();
    this.acum += real * this.velocidad;
    let n = 0;
    while (this.acum >= CUADRO && n < 4) {
      this.acum -= CUADRO; n++;
      if (this.congelado > 0) { this.congelado--; continue; }
      this.pasos++;
      this.pasar();
      Entrada.fin();
    }
    if (this.acum > CUADRO * 4) this.acum = 0;
    const t0 = performance.now();
    this.dibujar();
    Pantalla.presentar();
    this.msDibujo = this.msDibujo * 0.95 + (performance.now() - t0) * 0.05;
  },

  /* para las pruebas: avanzar n pasos YA, con todos los relojes */
  adelantar(n) {
    for (let i = 0; i < n; i++) {
      if (this.congelado > 0) { this.congelado--; continue; }
      this.pasos++;
      this.pasar();
      Entrada.fin();
    }
  },
};

/* ==== luz-mala/js/fisica.js ==== */
/* ============================================================================
   luz-mala/js/fisica.js — cómo se mueve y pelea Chispa, la luciérnaga.
   Código puro (sin DOM ni audio): lo usan el juego, el resolvedor de salas y
   la prueba de los jefes en Node. Todo el azar sale de m.rnd (con semilla), así
   una partida con las mismas entradas es siempre la misma.
   Tacto a lo Hollow Knight: acelera y frena casi al instante, el salto se corta
   al soltar, y el golpe para abajo en el aire rebota (pogo).
   ========================================================================== */

const LF = {
  CORRE: 104, ACEL: 1900, FRENO: 2600, AIRE: 0.92,
  GRAV_SUBE: 1150, GRAV_CORTA: 2700, GRAV_CAE: 1500, CAIDA: 340,
  SALTO: -318, COYOTE: 0.09, BUFFER: 0.1,
  DASH: 290, DASH_T: 0.15, DASH_ESPERA: 0.42,
  PARED_DESLIZ: 72, PARED_X: 160, PARED_Y: -300, PARED_FUERZA: 0.13,
  POGO: -290, RETRO: 80, RETRO_T: 0.07,
  GOLPE_T: 0.28, GOLPE_ACTIVO: 0.1,
  EMPUJE_X: 150, EMPUJE_Y: -170, INVULN: 1.25,
  CURAR_T: 0.9, CURAR_COSTO: 33, LUZ_GOLPE: 11, LUZ_MAX: 99,
  ANCHO: 8, ALTO: 12,
};
const LT = { VACIO: 0, SOLIDO: 1, PLAT: 2 };

/* ---------------------------------------------------------------------------
   Leyenda de las salas:
   #  raíz / tierra    =  plataforma que se sube de abajo (sombrero de hongo, tela)
   ^ v < >  espinas de vinal   ~  resina hirviendo (daña y devuelve al último piso)
   B  pared que se rompe a golpes     H  hongo (banco: guarda y cura)
   F  farol (se prende al vencer al jefe de la zona)    $  terrón de ámbar
   K  chispa extra (+1 de vida)       G  compuerta (se abre con una habilidad o un jefe)

function crearMundoLM(sala, o) {

    sala, w, h, t: new Uint8Array(w * h), rompibles: [], pinchos: [], cosas: [], bichos: [], balas: [], adornos: [],
    eventos: [], tiempo: 0, congelar: 0, rnd: mulberry(semilla32(sala.id + ':' + (o.vuelta || 0))),
    jefe: null, estado: o.estado || {}, habil: o.habil || {},

    let x1 = x0; while (ch(x1 + 1, y0) === letra && !visto[y0 * w + x1 + 1]) x1++;
    let y1 = y0;
    for (;;) { let ok = true; for (let x = x0; x <= x1; x++) if (ch(x, y1 + 1) !== letra || visto[(y1 + 1) * w + x]) { ok = false; break; } if (!ok) break; y1++; }

      case '^': m.pinchos.push({ x: px, y: py + 4, w: 8, h: 4 }); break;
      case 'v': m.pinchos.push({ x: px, y: py, w: 8, h: 4 }); break;
      case '<': m.pinchos.push({ x: px + 4, y: py, w: 4, h: 8 }); break;
      case '>': m.pinchos.push({ x: px, y: py, w: 4, h: 8 }); break;

/* las baldosas de las salas vecinas, en un anillo de 3 alrededor: mientras
   Chispa cruza un borde choca con lo que hay del otro lado, igual que el
   resolvedor, que junta las salas en un solo mapa. Donde no hay sala, es roca */
function anilloVecino(sala, w, h) {
  if (!sala.pos || typeof SALAS_LM === 'undefined') return null;
  const M = 3, W2 = w + 2 * M, H2 = h + 2 * M, d = new Uint8Array(W2 * H2);
  for (let y = -M; y < h + M; y++) for (let x = -M; x < w + M; x++) {

function tileAfuera(m, tx, ty) {

}

function nuevaChispa(m) {
  return {
    x: m.spawn.x, y: m.spawn.y, rx: 0, ry: 0, w: LF.ANCHO, h: LF.ALTO, vx: 0, vy: 0, dir: 1,
    enSuelo: false, coyote: 0, buffer: 0, cortado: false, bajaT: 0,
    dashT: 0, dashEspera: 0, dashUsado: false, pared: 0, forzT: 0, forzDir: 0,
    golpeT: 0, golpe: null, retroT: 0, retroDir: 0, invulnT: 0, curarT: 0, curando: false,

/* ---------------- choques ---------------- */
function solidoLM(m, tx, ty) {
  if (tx < 0 || tx >= m.w || ty < 0 || ty >= m.h) return tileAfuera(m, tx, ty) === LT.SOLIDO;   // afuera: lo de la sala vecina

function chocaLM(m, x, y, w, h) {

function moverXLM(m, e, dx, alChocar) {

    if (!c && s > 0 && !sinPlat && sobrePlatLM(m, e.x, e.y, e.w, e.h)) c = true;

/* ---------------- entrada ----------------
   inp = { x, y, salto, saltoE, saltoS, golpeE, dashE, curar } */
function entradaLM(E) {
  return {
    x: (E.IN.der ? 1 : 0) - (E.IN.izq ? 1 : 0), y: (E.IN.aba ? 1 : 0) - (E.IN.arr ? 1 : 0),
    salto: !!E.IN.salto, saltoE: !!E.EDGE.salto, golpeE: !!E.EDGE.golpe, dashE: !!E.EDGE.dash, curar: !!E.IN.curar,

function pasarChispa(m, inp) {
  const p = m.p;
  m.tiempo += DT;
  if (p.muerta) { p.tMuerta += DT; return; }
  if (p.invulnT > 0) p.invulnT -= DT;
  if (p.golpeT > 0) p.golpeT -= DT;
  if (p.dashEspera > 0) p.dashEspera -= DT;
  if (p.forzT > 0) p.forzT -= DT;
  if (p.retroT > 0) p.retroT -= DT;
  if (p.bajaT > 0) p.bajaT -= DT;
  if (inp.saltoE) p.buffer = LF.BUFFER; else p.buffer -= DT;

  const antes = p.enSuelo;
  p.enSuelo = pisaLM(m, p);
  if (p.enSuelo) {
    p.coyote = LF.COYOTE; p.dashUsado = false; p.pared = 0; p.tAire = 0;
    if (!antes) eventoLM(m, 'aterriza', { fuerza: p.vyAntes || 0 });
    /* el último piso firme: las espinas devuelven acá */
    if (!chocaPeligro(m, p.x - 6, p.y, p.w + 12, p.h + 2)) p.ultimoSuelo = { x: p.x, y: p.y };
  } else { p.coyote -= DT; p.tAire += DT; }
  p.vyAntes = p.vy;

  /* curarse: quieta en el piso, apretando, con luz suficiente */
  if (inp.curar && p.enSuelo && p.luz >= LF.CURAR_COSTO && p.vida < p.vidaMax && !p.golpe && p.dashT <= 0) {
    if (!p.curando) { p.curando = true; p.curarT = 0; eventoLM(m, 'curaEmpieza'); }
    p.curarT += DT; p.vx = 0;
    if (p.curarT >= (p.curaRapida ? LF.CURAR_T * 0.6 : LF.CURAR_T)) {
      p.luz -= LF.CURAR_COSTO; p.vida++; p.curarT = 0; eventoLM(m, 'cura');
      if (p.vida >= p.vidaMax || p.luz < LF.CURAR_COSTO) p.curando = false;
    }
    moverYLM(m, p, p.vy * DT);
    return;
  }
  if (p.curando) { p.curando = false; eventoLM(m, 'curaCorta'); }

  /* dash (aleteo) */
  if (p.dashT > 0) {
    p.dashT -= DT; p.vy = 0;
    moverXLM(m, p, p.vx * DT, () => { p.dashT = 0; });
    if (p.dashT <= 0) p.vx = p.dir * LF.CORRE;
    golpearCosas(m, p);
    tocarCosasLM(m, p, inp);
    return;
  }
  if (inp.dashE && m.habil.aleteo && p.dashEspera <= 0 && !p.dashUsado) {
    p.dashT = LF.DASH_T; p.dashEspera = LF.DASH_ESPERA; if (!p.enSuelo) p.dashUsado = true;
    if (inp.x) p.dir = inp.x;
    p.vx = p.dir * LF.DASH; p.vy = 0; p.pared = 0; p.golpe = null;
    eventoLM(m, 'dash', { d: p.dir });
    return;
  }

  /* horizontal: casi instantáneo, salvo el retroceso de un golpe y el
     empujón de un salto de pared */
  let mx = inp.x;
  if (p.forzT > 0) mx = p.forzDir;
  if (p.retroT > 0) p.vx = p.retroDir * LF.RETRO;

  }
  if (inp.x && !p.golpe && p.forzT <= 0) p.dir = inp.x;

  /* resina: pegada a la pared, cayendo, se desliza despacio */
  p.pared = 0;

  if (p.buffer > 0 && inp.y > 0 && p.enSuelo && sobrePlatLM(m, p.x, p.y, p.w, p.h) && !chocaLM(m, p.x, p.y + 1, p.w, p.h)) {

  }

  if (p.buffer > 0) {
    if (p.coyote > 0) { p.buffer = 0; p.coyote = 0; p.vy = LF.SALTO; p.cortado = false; eventoLM(m, 'salto'); }
    else if (p.pared || (m.habil.resina && (paredLM(m, p, 1) || paredLM(m, p, -1)))) {
      const d = p.pared ? -p.pared : (paredLM(m, p, 1) ? -1 : 1);
      p.buffer = 0; p.vy = LF.PARED_Y; p.vx = d * LF.PARED_X; p.forzT = LF.PARED_FUERZA; p.forzDir = d; p.dir = d; p.cortado = false; p.pared = 0; p.dashUsado = false;
      eventoLM(m, 'saltoPared', { d });
    }
  }

  if (inp.golpeE && p.golpeT <= 0) {
    const tipo = inp.y < 0 ? 'arr' : (inp.y > 0 && !p.enSuelo) ? 'aba' : 'lado';
    p.golpe = { tipo, t: 0, pego: new Set(), dir: p.pared ? -p.pared : p.dir };
    p.golpeT = LF.GOLPE_T;
    eventoLM(m, 'golpe', { tipo });
  }
  if (p.golpe) {
    p.golpe.t += DT;
    if (p.golpe.t <= LF.GOLPE_ACTIVO) golpearCosas(m, p);
    if (p.golpe.t > LF.GOLPE_T * 0.7) p.golpe = null;

  moverYLM(m, p, p.vy * DT, (c, s) => { if (s < 0) p.cortado = true; p.vy = 0; }, p.bajaT > 0);
  tocarCosasLM(m, p, inp);
}

/* ---------------- el golpe ---------------- */
function cajaGolpe(p) {
  const g = p.golpe;
  if (g.tipo === 'arr') return { x: p.x - 5, y: p.y - 18, w: p.w + 10, h: 20 };
  if (g.tipo === 'aba') return { x: p.x - 5, y: p.y + p.h - 2, w: p.w + 10, h: 20 };
  return g.dir > 0 ? { x: p.x + p.w - 2, y: p.y - 3, w: 22, h: p.h + 6 } : { x: p.x - 20, y: p.y - 3, w: 22, h: p.h + 6 };
}
function golpearCosas(m, p) {
  if (!p.golpe) return;
  const c = cajaGolpe(p), g = p.golpe;
  let pogo = false, retro = false;
  for (const b of m.bichos) {
    if (b.muerto || g.pego.has(b) || !cruza(c.x, c.y, c.w, c.h, b.x, b.y, b.w, b.h)) continue;
    g.pego.add(b);
    if (b.escudo && g.tipo === 'lado' && sig(b.x + b.w / 2 - (p.x + 4)) === -b.dir) { eventoLM(m, 'bloqueo', { x: b.x + b.w / 2, y: b.y + b.h / 2 }); retro = true; continue; }

    p.luz = Math.min(LF.LUZ_MAX, p.luz + LF.LUZ_GOLPE);
    if (g.tipo === 'aba') pogo = true; else retro = true;
  }
  if (m.jefe && !m.jefe.muerto && !g.pego.has(m.jefe) && cruza(c.x, c.y, c.w, c.h, m.jefe.x, m.jefe.y, m.jefe.w, m.jefe.h)) {
    g.pego.add(m.jefe);
    danarJefe(m, m.jefe, p.danio);
    p.luz = Math.min(LF.LUZ_MAX, p.luz + LF.LUZ_GOLPE);
    if (g.tipo === 'aba') pogo = true; else retro = true;
  }
  for (const r of m.rompibles) {
    if (r.compuerta || g.pego.has(r) || !cruza(c.x, c.y, c.w, c.h, r.x, r.y, r.w, r.h)) continue;
    g.pego.add(r);
    r.vida--; r.t = 0.12;
    eventoLM(m, r.vida <= 0 ? 'rompe' : 'pega', { x: r.x + r.w / 2, y: r.y + r.h / 2, bw: r.w, bh: r.h });
    if (r.vida <= 0) { m.estado[r.id] = true; m.rompibles.splice(m.rompibles.indexOf(r), 1); }
    retro = true;
  }
  for (const q of m.cosas) {
    if (q.tipo !== 'terron' || g.pego.has(q) || !cruza(c.x, c.y, c.w, c.h, q.x, q.y, q.w, q.h)) continue;
    g.pego.add(q);

    if (q.vida <= 0) { m.estado[q.id] = true; p.ambar += q.dar; m.cosas.splice(m.cosas.indexOf(q), 1); }
    retro = true;

    if (b.rompible && cruza(c.x, c.y, c.w, c.h, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2)) { b.vida = 0; eventoLM(m, 'bala', { x: b.x, y: b.y }); }
  }
  /* pogo también en las espinas: es la gracia de golpear para abajo */
  if (g.tipo === 'aba' && !pogo) for (const q of m.pinchos) if (!q.liquido && cruza(c.x, c.y, c.w, c.h, q.x, q.y, q.w, q.h)) { pogo = true; eventoLM(m, 'pogoEspina'); break; }
  if (pogo && !g.pogoHecho) { g.pogoHecho = true; p.vy = LF.POGO; p.cortado = false; p.dashUsado = false; eventoLM(m, 'pogo'); m.congelar = Math.max(m.congelar, 2); }

}

/* ---------------- daño y peligros ---------------- */

  eventoLM(m, 'vuelve');
}

function tocarCosasLM(m, p, inp) {
  if (m.volverAlSuelo != null) { m.volverAlSuelo -= DT; if (m.volverAlSuelo <= 0) { m.volverAlSuelo = null; if (!p.muerta) volverAlSuelo(m); } }
  const q = chocaPeligro(m, p.x, p.y, p.w, p.h);
  if (q && !p.muerta) lastimar(m, p.x + 4 - p.dir, 1, true);
  for (const c of m.cosas) {
    if (!cruza(p.x, p.y, p.w, p.h, c.x, c.y, c.w, c.h)) { if (c.tipo === 'npc') c.cerca = false; continue; }
    if (c.tipo === 'banco') { c.cerca = true; if (inp.y < 0 && p.enSuelo && !c.sentada) eventoLM(m, 'banco', { x: c.x + 8, y: c.y }); }
    else if (c.tipo === 'npc') { c.cerca = true; if (inp.y < 0 && !c.hablo) eventoLM(m, 'habla', { quien: c.quien }); }
    else if (c.tipo === 'chispaExtra') { m.estado[c.id] = true; p.vidaMax++; p.vida = p.vidaMax; m.cosas.splice(m.cosas.indexOf(c), 1); eventoLM(m, 'chispaExtra', { x: c.x + 4, y: c.y + 4 }); break; }
    else if (c.tipo === 'ambar') { p.ambar += c.valor; m.cosas.splice(m.cosas.indexOf(c), 1); eventoLM(m, 'ambar', { x: c.x, y: c.y }); break; }
  }
  /* los bichos lastiman al tocarlos */
  for (const b of m.bichos) if (!b.muerto && b.lastima !== false && cruza(p.x + 1, p.y + 1, p.w - 2, p.h - 2, b.x, b.y, b.w, b.h)) { lastimar(m, b.x + b.w / 2, 1); break; }
  if (m.jefe && !m.jefe.muerto && m.jefe.toca !== false && cruza(p.x + 1, p.y + 1, p.w - 2, p.h - 2, m.jefe.x + 2, m.jefe.y + 2, m.jefe.w - 4, m.jefe.h - 4)) lastimar(m, m.jefe.x + m.jefe.w / 2, 1);
  /* el ámbar suelto vuela hacia Chispa */
  for (const c of m.cosas) if (c.tipo === 'ambar') {
    const dx = p.x + 4 - c.x, dy = p.y + 6 - c.y, d = Math.hypot(dx, dy);
    if (d < (p.iman ? 150 : 70) && c.t > 0.3) { c.vx += dx / d * 900 * DT; c.vy += dy / d * 900 * DT; }
  }
}

/* el ámbar que sueltan los bichos: rebota y después se junta solo */
function soltarAmbar(m, x, y, n) {
  for (let i = 0; i < n; i++) m.cosas.push({ tipo: 'ambar', valor: 1, x, y, w: 3, h: 3, vx: (m.rnd() - 0.5) * 120, vy: -60 - m.rnd() * 90, t: 0 });
}
function pasarAmbar(m) {
  for (const c of m.cosas) if (c.tipo === 'ambar') {
    c.t += DT;
    c.vy = Math.min(260, c.vy + 700 * DT); c.vx *= 0.985;
    const nx = c.x + c.vx * DT, ny = c.y + c.vy * DT;
    if (chocaLM(m, nx, c.y, 3, 3)) c.vx *= -0.5; else c.x = nx;
    if (chocaLM(m, c.x, ny, 3, 3) || sobrePlatLM(m, c.x, c.y, 3, 3) && c.vy > 0) c.vy *= -0.4; else c.y = ny;
  }
}

/* la sala de al lado: salir por un borde lleva a la que esté pegada ahí */
function salidaDe(m) {
  const p = m.p;
  if (p.x + p.w < 0) return 'izq';
  if (p.x > m.w * 8) return 'der';
  if (p.y + p.h < 0) return 'arr';
  if (p.y > m.h * 8) return 'aba';
  return null;
}

/* ==== luz-mala/js/bichos.js ==== */
/* ============================================================================
   luz-mala/js/bichos.js — los bichos del quebracho. Cada uno con UNA idea:
   cascarudo patrulla · mosquito embiste · grillo salta · chinche escupe ·
   hormiga soldado tapa con el escudo · polilla va a la luz · arañita cae.
   Personalidad por reglas simples; el azar, del m.rnd de la sala.
   ========================================================================== */

const BICHOS = {
  c: { tipo: 'cascarudo', w: 12, h: 8, vida: 2, suelta: 2 },
  m: { tipo: 'mosquito', w: 8, h: 6, vida: 1, suelta: 1, vuela: true },
  g: { tipo: 'grillo', w: 10, h: 8, vida: 3, suelta: 3 },
  x: { tipo: 'chinche', w: 12, h: 9, vida: 3, suelta: 3 },
  o: { tipo: 'hormiga', w: 12, h: 10, vida: 4, suelta: 4, escudo: true },
  p: { tipo: 'polilla', w: 10, h: 8, vida: 2, suelta: 2, vuela: true },
  a: { tipo: 'aranita', w: 7, h: 6, vida: 1, suelta: 1 },
  w: { tipo: 'obrera', w: 8, h: 6, vida: 1, suelta: 0 },
};

function crearBicho(c, px, py, m) {
  const d = BICHOS[c];
  const b = Object.assign({}, d, {
    x: px + 4 - (d.w >> 1), y: py + 8 - d.h, rx: 0, ry: 0, vx: 0, vy: 0, dir: -1, t: m ? m.rnd() * 2 : 0,
    est: 'anda', muerto: false, flash: 0, kbT: 0, kbx: 0, kby: 0, x0: px, y0: py, espera: 0,
  });
  if (c === 'a') { b.y = py; b.est = 'cuelga'; b.yTecho = py; }
  if (c === 'm' || c === 'p') { b.y = py; }
  return b;
}

function danarBicho(m, b, d, dx, dy) {
  b.vida -= d; b.flash = 0.12;
  b.kbT = 0.14; b.kbx = dx * 150; b.kby = dy ? dy * 120 : -40;
  eventoLM(m, 'pega', { x: b.x + b.w / 2, y: b.y + b.h / 2, tipo: b.tipo });
  if (b.vida <= 0) {
    b.muerto = true;
    soltarAmbar(m, b.x + b.w / 2, b.y + b.h / 2, b.suelta);
    eventoLM(m, 'bichoMuere', { x: b.x + b.w / 2, y: b.y + b.h / 2, tipo: b.tipo });
  }
}

function pasarBichos(m) {
  const p = m.p;
  for (const b of m.bichos) {
    if (b.muerto) continue;
    b.t += DT;
    if (b.flash > 0) b.flash -= DT;
    const dx = p.x + 4 - (b.x + b.w / 2), dy = p.y + 6 - (b.y + b.h / 2), dist = Math.hypot(dx, dy);
    if (b.kbT > 0) {
      b.kbT -= DT;
      moverXLM(m, b, b.kbx * DT);
      if (b.vuela) moverYLM(m, b, b.kby * DT, null, true);
      else { b.vy = Math.min(300, b.vy + 900 * DT); if (b.kby < 0 && b.kbT > 0.1) b.vy = b.kby; moverYLM(m, b, b.vy * DT, () => { b.vy = 0; }); }
      continue;
    }
    switch (b.tipo) {
      case 'cascarudo': case 'obrera': caminar(m, b, b.tipo === 'obrera' ? 40 : 26); break;
      case 'hormiga':
        if (b.est === 'carga') { b.espera -= DT; caminar(m, b, 105); if (b.espera <= 0) b.est = 'anda'; }
        else {
          caminar(m, b, 20);
          if (Math.abs(dy) < 14 && Math.abs(dx) < 80 && sig(dx) === b.dir && b.espera <= 0) { b.est = 'carga'; b.espera = 0.8; eventoLM(m, 'hormigaCarga', { x: b.x, y: b.y }); }
          b.espera -= DT;
        }
        break;
      case 'grillo': {
        const suelo = pisaLM(m, b);
        if (suelo && b.vy >= 0) {
          b.vx = 0; b.espera -= DT;
          if (dist < 130) b.dir = sig(dx) || b.dir;
          if (b.espera <= 0 && dist < 130) { b.vy = -230; b.vx = lim(dx * 1.1, -90, 90); b.espera = 0.8 + m.rnd() * 0.7; eventoLM(m, 'grilloSalta', { x: b.x, y: b.y }); }
        }
        b.vy = Math.min(300, b.vy + 900 * DT);
        moverXLM(m, b, b.vx * DT, () => { b.vx = -b.vx * 0.3; });
        moverYLM(m, b, b.vy * DT, () => { b.vy = 0; });
        break;
      }
      case 'chinche':
        b.dir = sig(dx) || b.dir;
        b.espera -= DT;
        if (b.espera <= 0 && dist < 150) {
          b.espera = 2.2;
          const t = 0.9, g = 500;
          m.balas.push({ x: b.x + b.w / 2, y: b.y, vx: dx / t, vy: (dy - 0.5 * g * t * t) / t, g, r: 2, vida: 3, tipo: 'baba', rompible: true });
          eventoLM(m, 'escupe', { x: b.x + b.w / 2, y: b.y });
        }
        b.vy = Math.min(300, b.vy + 900 * DT); moverYLM(m, b, b.vy * DT, () => { b.vy = 0; });
        break;
      case 'mosquito':
        if (b.est === 'anda') {
          const hx = b.x0 + Math.sin(b.t * 1.7) * 14, hy = b.y0 + Math.sin(b.t * 2.9) * 6;
          b.vx = (hx - b.x) * 3; b.vy = (hy - b.y) * 3;
          if (dist < 90 && b.espera <= 0) { b.est = 'embiste'; b.espera = 1.1; const k = 80 / (dist || 1); b.vx = dx * k; b.vy = dy * k; eventoLM(m, 'zumbido', { x: b.x, y: b.y }); }
          b.espera -= DT;
        } else { b.espera -= DT; if (b.espera <= 0) { b.est = 'anda'; b.espera = 0.8; } }
        b.dir = sig(b.vx) || b.dir;
        moverXLM(m, b, b.vx * DT, () => { b.vx = -b.vx; });
        moverYLM(m, b, b.vy * DT, () => { b.vy = -b.vy; }, true);
        break;
      case 'polilla': {
        /* la luz la atrae, pero da vueltas antes de tocarla */
        const a = b.t * 3.1, mx = dx + Math.cos(a) * 26, my = dy + Math.sin(a * 1.3) * 18;
        const md = Math.hypot(mx, my) || 1;
        const v = dist < 150 ? 58 : 18;
        b.vx = acercar(b.vx, mx / md * v, 160 * DT); b.vy = acercar(b.vy, my / md * v, 160 * DT);
        b.dir = sig(b.vx) || b.dir;
        moverXLM(m, b, b.vx * DT, () => { b.vx = -b.vx; });
        moverYLM(m, b, b.vy * DT, () => { b.vy = -b.vy; }, true);
        break;
      }
      case 'aranita':
        if (b.est === 'cuelga') {
          b.y = b.yTecho + Math.sin(b.t * 2) * 2;
          if (Math.abs(dx) < 22 && dy > 0) { b.est = 'cae'; b.vy = 40; eventoLM(m, 'aranaCae', { x: b.x, y: b.y }); }
        } else {
          b.vy = Math.min(260, b.vy + 700 * DT);
          if (pisaLM(m, b)) { b.est = 'camina'; caminar(m, b, 36, true); }
          else moverYLM(m, b, b.vy * DT, () => { b.vy = 0; });
        }
        break;
    }
  }
}

/* caminar por el piso: da vuelta contra una pared o al borde de un precipicio */
function caminar(m, b, v, perseguir) {
  if (perseguir) b.dir = sig(m.p.x + 4 - (b.x + b.w / 2)) || b.dir;
  const suelo = pisaLM(m, b);
  if (suelo) {
    const adelante = b.dir > 0 ? b.x + b.w : b.x - 1;
    const hayPiso = chocaLM(m, adelante, b.y + b.h, 1, 2) || sobrePlatLM(m, adelante, b.y, 1, b.h);
    if (!hayPiso || chocaLM(m, adelante, b.y, 1, b.h - 1)) b.dir = -b.dir;
  }
  moverXLM(m, b, b.dir * v * DT, () => { b.dir = -b.dir; });
  b.vy = Math.min(300, b.vy + 900 * DT);
  moverYLM(m, b, b.vy * DT, () => { b.vy = 0; });
}

function pasarBalas(m) {
  const p = m.p;
  for (let i = m.balas.length - 1; i >= 0; i--) {
    const b = m.balas[i];
    b.vida -= DT;
    b.vy += (b.g || 0) * DT;
    b.x += b.vx * DT; b.y += b.vy * DT;
    if (b.tipo === 'onda') { b.y = b.y0; }
    const choca = b.tipo !== 'onda' && b.tipo !== 'roca' && solidoLM(m, Math.floor(b.x / 8), Math.floor(b.y / 8));
    if (b.tipo === 'roca' && solidoLM(m, Math.floor(b.x / 8), Math.floor((b.y + b.r) / 8))) { b.vida = 0; eventoLM(m, 'rocaCae', { x: b.x, y: b.y }); }
    if (choca) { b.vida = 0; eventoLM(m, 'bala', { x: b.x, y: b.y, tipo: b.tipo }); }
    else if (!p.muerta && b.aviso <= 0 !== false && cruza(p.x + 1, p.y + 1, p.w - 2, p.h - 2, b.x - b.r, b.y - (b.alto || b.r), b.r * 2, (b.alto || b.r) * 2)) {
      if (lastimar(m, b.x, b.danio || 1)) b.vida = b.tipo === 'onda' ? b.vida : 0;
    }
    if (b.aviso > 0) b.aviso -= DT;
    if (b.vida <= 0 || b.y > m.h * 8 + 40 || b.x < -40 || b.x > m.w * 8 + 40) m.balas.splice(i, 1);
  }
}

/* ==== luz-mala/js/jefes.js ==== */
/* ============================================================================
   luz-mala/js/jefes.js — los tres que guardan los faroles.
   El Torito (escarabajo torito): carga, salta y cornea; contra la pared queda
   mareado y se le caen piedras. La Viuda: baja del techo, escupe tela, larga
   crías. La Reina de la Marabunta: manda obreras, escupe ácido, golpea el
   piso y, a la mitad, apaga la luz. Cada ataque se anuncia antes (el aviso es
   lo que lo hace justo).
   ========================================================================== */

const JEFES = {
  torito: { nombre: 'EL TORITO', w: 30, h: 20, vida: 30, farol: 'raices', da: 'aleteo' },
  viuda: { nombre: 'LA VIUDA', w: 22, h: 16, vida: 32, farol: 'tela', da: 'resina' },
  reina: { nombre: 'LA REINA DE LA MARABUNTA', w: 40, h: 30, vida: 44, farol: 'madre', da: null },
};

function crearJefe(tipo, m) {
  const d = JEFES[tipo], a = m.jefeEn;
  const j = Object.assign({}, d, {
    tipo, x: a.x - d.w / 2, y: a.y + 8 - d.h, rx: 0, ry: 0, vx: 0, vy: 0, dir: -1, vidaMax: d.vida,
    fase: 1, est: 'presenta', t: 0, muerto: false, flash: 0, historial: [], toca: true, cuenta: 0,
  });
  /* la Viuda cuelga a media altura: desde los tablones (o con un salto) se le llega con el golpe para arriba */
  if (tipo === 'viuda') { j.y = 20; j.est = 'presenta'; j.techo = 60; }
  if (tipo === 'reina') { j.x = m.w * 8 - d.w - 20; j.dir = -1; }
  return j;
}

function danarJefe(m, j, d) {
  if (j.est === 'presenta' || j.muerto) return;
  j.vida -= d; j.flash = 0.1;
  eventoLM(m, 'pegaJefe', { x: j.x + j.w / 2, y: j.y + j.h / 2 });
  const f = j.vida / j.vidaMax;
  const nueva = j.tipo === 'reina' ? (f <= 0.25 ? 3 : f <= 0.6 ? 2 : 1) : (f <= 0.5 ? 2 : 1);
  if (nueva > j.fase) { j.fase = nueva; eventoLM(m, 'jefeFase', { fase: nueva }); m.congelar = 10; }
  if (j.vida <= 0) { j.muerto = true; j.est = 'muere'; j.t = 0; j.toca = false; eventoLM(m, 'jefeMuere', { tipo: j.tipo, x: j.x + j.w / 2, y: j.y + j.h / 2 }); m.congelar = 20; }
}

function elegirAtaque(m, j, opciones) {
  /* pesos, sin repetir el mismo tres veces seguidas */
  let total = 0;
  const ultimos = j.historial.slice(-2);
  const ok = opciones.filter(([a]) => !(ultimos.length === 2 && ultimos[0] === a && ultimos[1] === a));
  for (const [, p] of ok) total += p;
  let r = m.rnd() * total;
  for (const [a, p] of ok) { r -= p; if (r <= 0) { j.historial.push(a); return a; } }
  j.historial.push(ok[0][0]);
  return ok[0][0];
}

function pasarJefe(m) {
  const j = m.jefe;
  if (!j) return;
  j.t += DT;
  if (j.flash > 0) j.flash -= DT;
  if (j.muerto) { if (j.t > 2.2 && !j.cerrado) { j.cerrado = true; eventoLM(m, 'jefeFin', { tipo: j.tipo }); } return; }
  if (j.tipo === 'torito') pasarTorito(m, j);
  else if (j.tipo === 'viuda') pasarViuda(m, j);
  else pasarReina(m, j);
}

function cambiar(j, est) { j.est = est; j.t = 0; }
const rapido = (j) => j.fase >= 2 ? 1.28 : 1;

/* ---------------- El Torito ---------------- */
function pasarTorito(m, j) {
  const p = m.p, dx = p.x + 4 - (j.x + j.w / 2), k = rapido(j);
  const suelo = pisaLM(m, j);
  j.vy = Math.min(420, j.vy + 1100 * DT);
  switch (j.est) {
    case 'presenta': j.dir = sig(dx) || -1; if (j.t > 1.6) { cambiar(j, 'espera'); eventoLM(m, 'rugido', { x: j.x + j.w / 2, y: j.y }); } break;
    case 'espera':
      j.vx = 0; j.dir = sig(dx) || j.dir;
      if (j.t > (j.fase >= 2 ? 0.45 : 0.8)) {
        /* de cerca cornea o salta por encima, para no quedar contra la pared cuerneando siempre */
        const a = Math.abs(dx) < 42 ? elegirAtaque(m, j, [['cornada', 6], ['salto', 3]]) : elegirAtaque(m, j, [['carga', 5], ['salto', 4]]);
        cambiar(j, a + 'Prep');
        eventoLM(m, 'aviso', { ataque: a, x: j.x + j.w / 2, y: j.y });
      }
      break;
    case 'cargaPrep': j.vx = 0; if (j.t > 0.55 / k) { cambiar(j, 'carga'); j.vx = j.dir * 250 * k; eventoLM(m, 'carga', {}); } break;
    case 'carga':
      if (moverXLM(m, j, j.vx * DT)) {
        eventoLM(m, 'choca', { x: j.x + (j.dir > 0 ? j.w : 0), y: j.y + j.h / 2 });
        m.congelar = 6;
        /* se aflojan piedras del techo: se avisan con polvo 0,6 s antes */
        const n = j.fase >= 2 ? 5 : 3;
        for (let i = 0; i < n; i++) m.balas.push({ tipo: 'roca', x: 24 + m.rnd() * (m.w * 8 - 48), y: 10, vx: 0, vy: 0, g: 0, r: 4, vida: 4, aviso: 0.6, cae: 0.6 + i * 0.12, danio: 1 });
        if (j.fase >= 2 && !j.dobleHecho) { j.dobleHecho = true; j.dir = -j.dir; cambiar(j, 'cargaPrep'); }
        else { j.dobleHecho = false; cambiar(j, 'mareado'); }
        j.vx = 0;
      }
      break;
    case 'mareado': if (j.t > 1.0) cambiar(j, 'espera'); break;
    case 'saltoPrep': j.vx = 0; if (j.t > 0.35 / k) { cambiar(j, 'salto'); j.vy = -390; j.vx = lim(dx / 0.75, -200, 200); eventoLM(m, 'saltoJefe', {}); } break;
    case 'salto':
      moverXLM(m, j, j.vx * DT, () => { j.vx = 0; });
      if (suelo && j.vy >= 0 && j.t > 0.2) {
        cambiar(j, 'aterriza'); j.vx = 0;
        eventoLM(m, 'tierra', { x: j.x + j.w / 2, y: j.y + j.h });
        m.congelar = 5;
        for (const d of [-1, 1]) m.balas.push({ tipo: 'onda', x: j.x + j.w / 2 + d * j.w / 2, y: j.y + j.h - 4, y0: j.y + j.h - 4, vx: d * 150 * k, vy: 0, r: 5, alto: 4, vida: 2.2, danio: 1 });
      }
      break;
    case 'aterriza': if (j.t > 0.5) cambiar(j, 'espera'); break;
    case 'cornadaPrep': j.vx = 0; if (j.t > 0.32 / k) { cambiar(j, 'cornada'); eventoLM(m, 'cornada', {}); } break;
    case 'cornada':
      if (j.t < 0.18 && cruza(p.x, p.y, p.w, p.h, j.dir > 0 ? j.x + j.w - 4 : j.x - 20, j.y - 8, 24, j.h)) lastimar(m, j.x + j.w / 2, 1);
      if (j.t > 0.45) cambiar(j, 'espera');
      break;
  }
  if (j.est !== 'carga' && j.est !== 'salto') moverXLM(m, j, j.vx * DT);
  moverYLM(m, j, j.vy * DT, () => { j.vy = 0; });
  /* las rocas avisadas empiezan a caer después del polvo */
  for (const b of m.balas) if (b.tipo === 'roca' && b.cae != null) { b.cae -= DT; if (b.cae <= 0) { b.cae = null; b.g = 700; } }
}

/* ---------------- La Viuda ---------------- */
function pasarViuda(m, j) {
  const p = m.p, dx = p.x + 4 - (j.x + j.w / 2), k = rapido(j);
  switch (j.est) {
    case 'presenta': j.toca = false; if (j.t > 1.8) { cambiar(j, 'arriba'); j.toca = true; eventoLM(m, 'rugido', {}); } break;
    case 'arriba': {
      j.y = acercar(j.y, j.techo, 160 * DT);
      j.vx = acercar(j.vx, sig(dx) * 70 * k, 200 * DT);
      moverXLM(m, j, j.vx * DT, () => { j.vx = 0; });
      if (j.t > (j.fase >= 2 ? 0.9 : 1.4)) {
        const vivas = m.bichos.filter((b) => !b.muerto && b.tipo === 'aranita').length;
        const a = elegirAtaque(m, j, [['baja', 5], ['escupe', 4], ['crias', vivas < 3 ? 2 : 0]]);
        cambiar(j, a + 'Prep'); j.vx = 0;
        eventoLM(m, 'aviso', { ataque: a, x: j.x + j.w / 2, y: j.y + j.h });
      }
      break;
    }
    case 'bajaPrep': if (j.t > 0.45 / k) { cambiar(j, 'baja'); j.vy = 60; } break;
    case 'baja':
      j.vy = Math.min(380, j.vy + 900 * DT);
      /* baja colgada del hilo hasta el piso: los tablones no la frenan */
      if (moverYLM(m, j, j.vy * DT, null, true)) { cambiar(j, 'suelo'); j.vy = 0; eventoLM(m, 'tierra', { x: j.x + j.w / 2, y: j.y + j.h }); m.congelar = 4; }
      break;
    case 'suelo': if (j.t > (j.fase >= 2 ? 0.9 : 1.3)) { if (j.fase >= 2 && !j.dobleHecho) { j.dobleHecho = true; cambiar(j, 'sube'); j.otra = true; } else { j.dobleHecho = false; cambiar(j, 'sube'); } } break;
    case 'sube':
      j.y = acercar(j.y, j.techo, 170 * DT);
      if (j.y <= j.techo + 0.5) { if (j.otra) { j.otra = false; j.x = lim(p.x - j.w / 2, 8, m.w * 8 - j.w - 8); cambiar(j, 'bajaPrep'); } else cambiar(j, 'arriba'); }
      break;
    case 'escupePrep': if (j.t > 0.4 / k) {
      const n = j.fase >= 2 ? 5 : 3, cx = j.x + j.w / 2, cy = j.y + j.h;
      for (let i = 0; i < n; i++) {
        const a = Math.atan2(p.y + 6 - cy, p.x + 4 - cx) + (i - (n - 1) / 2) * 0.28;
        m.balas.push({ tipo: 'tela', x: cx, y: cy, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, g: 60, r: 3, vida: 3, danio: 1, rompible: true });
      }
      eventoLM(m, 'escupe', { x: cx, y: cy });
      cambiar(j, 'arriba');
    } break;
    case 'criasPrep': if (j.t > 0.5) {
      for (let i = 0; i < 2; i++) { const b = crearBicho('a', lim(j.x + (i ? 30 : -24), 8, m.w * 8 - 16), j.techo + 4, m); b.est = 'cae'; b.vy = 30; m.bichos.push(b); }
      eventoLM(m, 'crias', {});
      cambiar(j, 'arriba');
    } break;
  }
}

/* ---------------- La Reina de la Marabunta ---------------- */
function pasarReina(m, j) {
  const p = m.p, k = j.fase >= 3 ? 1.4 : j.fase >= 2 ? 1.2 : 1, cx = j.x + j.w / 2;
  j.vy = Math.min(420, j.vy + 1100 * DT);
  moverYLM(m, j, j.vy * DT, () => { j.vy = 0; });
  m.oscuro = j.fase >= 2;
  switch (j.est) {
    case 'presenta': j.toca = false; if (j.t > 2.2) { cambiar(j, 'espera'); j.toca = true; eventoLM(m, 'rugido', {}); } break;
    case 'espera':
      if (j.t > 1.1 / k) {
        const ops = [['oleada', 3], ['acido', 4], ['golpe', 3]];
        if (j.fase >= 3) ops.push(['embestida', 3]);
        const a = elegirAtaque(m, j, ops);
        cambiar(j, a + 'Prep');
        eventoLM(m, 'aviso', { ataque: a, x: cx, y: j.y });
      }
      break;
    case 'oleadaPrep': if (j.t > 0.6) {
      /* en fila y separadas: de a una se matan, todas juntas no */
      const n = j.fase >= 3 ? 4 : 3;
      for (let i = 0; i < n; i++) { const b = crearBicho('w', j.x - 6 - i * 24, j.y + j.h - 8, m); b.dir = -1; m.bichos.push(b); }
      eventoLM(m, 'oleada', {});
      cambiar(j, j.fase >= 3 ? 'acidoPrep' : 'espera');
    } break;
    case 'acidoPrep': if (j.t > 0.45 / k) {
      const n = j.fase >= 2 ? 4 : 3;
      for (let i = 0; i < n; i++) {
        const t = 0.8 + i * 0.18, g = 520, tx = p.x + 4 + (i - 1) * 22, ty = p.y + 6;
        m.balas.push({ tipo: 'acido', x: j.x + 6, y: j.y + 8, vx: (tx - j.x - 6) / t, vy: (ty - j.y - 8 - 0.5 * g * t * t) / t, g, r: 3, vida: 3, danio: 1 });
      }
      eventoLM(m, 'escupe', { x: j.x + 6, y: j.y + 8 });
      cambiar(j, 'espera');
    } break;
    case 'golpePrep': if (j.t > 0.5 / k) {
      eventoLM(m, 'tierra', { x: j.x, y: j.y + j.h }); m.congelar = 6;
      m.balas.push({ tipo: 'onda', x: j.x, y: j.y + j.h - 4, y0: j.y + j.h - 4, vx: -170 * k, vy: 0, r: 6, alto: 5, vida: 2.4, danio: 1 });
      if (j.fase >= 2) m.balas.push({ tipo: 'onda', x: j.x - 40, y: j.y + j.h - 4, y0: j.y + j.h - 4, vx: -120 * k, vy: 0, r: 6, alto: 5, vida: 2.4, danio: 1 });
      cambiar(j, 'espera');
    } break;
    case 'embestidaPrep': if (j.t > 0.5) { cambiar(j, 'embestida'); j.x0 = j.x; } break;
    case 'embestida':
      if (j.t < 0.35) moverXLM(m, j, -300 * DT);
      else if (j.t < 1.1) j.x = acercar(j.x, j.x0, 120 * DT);
      else cambiar(j, 'espera');
      break;
  }
}

/* ==== luz-mala/js/salas.js ==== */
/* ============================================================================
   luz-mala/js/salas.js — el quebracho por dentro. Cada sala tiene su lugar en
   el mundo (pos, en baldosas): salir por un borde lleva a la que esté pegada
   ahí, y el mapa se dibuja con esas mismas coordenadas. Los huecos de dos
   salas vecinas tienen que coincidir baldosa por baldosa.
   Medidas de Chispa (lo que manda el diseño): salto 5,5 baldosas de alto y
   6,5 de largo · con aleteo +5 de largo · la resina deja subir pozos de 3 de ancho.
   ========================================================================== */

function armarSalaLM(def) {
  const [W, H] = def.tam;
  const g = Array.from({ length: H }, () => Array(W).fill('.'));
  for (const op of def.dibujo) {
    const [c, x0, y0, x1 = x0, y1 = y0] = op;
    for (let y = Math.max(0, y0); y <= Math.min(H - 1, y1); y++)
      for (let x = Math.max(0, x0); x <= Math.min(W - 1, x1); x++) g[y][x] = c;
  }
  const s = Object.assign({}, def, { mapa: g.map((r) => r.join('')) });
  delete s.dibujo;
  return s;
}

/* la sala que contiene el punto del mundo (en píxeles) */
function salaEn(wx, wy) {
  for (const s of SALAS_LM) {
    const x0 = s.pos[0] * 8, y0 = s.pos[1] * 8, x1 = x0 + s.tam[0] * 8, y1 = y0 + s.tam[1] * 8;
    if (wx >= x0 && wx < x1 && wy >= y0 && wy < y1) return s;
  }
  return null;
}

function glifoFino(ch) {

  if (r) return r;
  if (FINA[ch]) r = { f: FINA[ch], m: null };
  else if (LETRAS_CON_MARCA[ch]) {
    const [base, marca] = LETRAS_CON_MARCA[ch], may = base === base.toUpperCase();
    r = { f: FINA[base], m: MARCAS_FINA[marca].map(([x, y]) => [x, y < 7 && may ? y - 2 : y]) };
  } else if (FINA[ch.toUpperCase()]) r = { f: FINA[ch.toUpperCase()], m: null };
  else r = { f: FINA['?'], m: null, falta: true };
  r.w = Math.max(...r.f.map((f) => f.length));
  cacheGlifoFino.set(ch, r);
  return r;
}
function anchoFino(str, esp) {
  esp = esp == null ? 1 : esp;
  let x = 0;
  for (const ch of str) x += glifoFino(ch).w + esp;
  return Math.max(0, x - esp);
}

/* un renglón a un lienzo: halo del color de la luz, sombra abajo y la letra.
   o: { col, halo, sombra, esp (espacio entre letras) } */
const cacheFino = new Map();
function lienzoFino(str, o) {
  const k = str + '|' + (o.col || '') + '|' + (o.halo || '') + '|' + (o.esp == null ? 1 : o.esp) + '|' + (o.sombra === false ? 0 : 1);
  let c = cacheFino.get(k);
  if (c) return c;
  const esp = o.esp == null ? 1 : o.esp, pts = [];
  let x = 0;
  for (const ch of str) {
    const gl = glifoFino(ch);
    gl.f.forEach((fila, y) => { for (let i = 0; i < fila.length; i++) if (fila[i] === '#') pts.push([x + i, y]); });
    if (gl.m) for (const [mx, my] of gl.m) pts.push([x + mx, my]);
    x += gl.w + esp;
  }
  const w = Math.max(1, x - esp), arriba = 3;
  c = document.createElement('canvas');
  c.width = w + 4; c.height = arriba + 9 + 3;
  const g = c.getContext('2d'), ox = 2, oy = arriba;
  if (o.halo) {
    g.fillStyle = o.halo;
    g.globalAlpha = 0.28;
    for (const [px, py] of pts) g.fillRect(ox + px - 1, oy + py - 1, 3, 3);
    g.globalAlpha = 1;
  }
  if (o.sombra !== false) { g.fillStyle = 'rgba(5,3,8,0.85)'; for (const [px, py] of pts) g.fillRect(ox + px, oy + py + 1, 1, 1); }
  g.fillStyle = o.col || '#efe6d2';
  for (const [px, py] of pts) g.fillRect(ox + px, oy + py, 1, 1);
  c.ancho = w;
  if (cacheFino.size > 700) cacheFino.clear();
  cacheFino.set(k, c);
  return c;
}
/* y = la línea de arriba de las mayúsculas. o.alin: 'izq' | 'centro' | 'der';
   o.escala: entero; o.alfa; o.hasta: cuántos píxeles de ancho mostrar (para escribir de a poco) */
function textoFino(g, str, x, y, o) {
  o = o || {};
  const c = lienzoFino(str, o), e = o.escala || 1;
  let dx = x - 2 * e;
  if (o.alin === 'centro') dx = x - Math.floor(c.ancho * e / 2) - 2 * e;
  else if (o.alin === 'der') dx = x - c.ancho * e - 2 * e;
  if (o.alfa != null) g.globalAlpha = o.alfa;
  if (o.hasta != null) {
    const sw = Math.max(0, Math.min(c.width, o.hasta + 3));
    if (sw > 0) g.drawImage(c, 0, 0, sw, c.height, Math.round(dx), Math.round(y - 3 * e), sw * e, c.height * e);
  } else g.drawImage(c, Math.round(dx), Math.round(y - 3 * e), c.width * e, c.height * e);
  if (o.alfa != null) g.globalAlpha = 1;
}
/* partir en renglones que entren en "ancho" */
function envolverFino(str, ancho, esp) {
  const r = [];
  for (const par of String(str).split('\n')) {
    let linea = '';
    for (const pal of par.split(' ')) {
      const prueba = linea ? linea + ' ' + pal : pal;
      if (anchoFino(prueba, esp) > ancho && linea) { r.push(linea); linea = pal; } else linea = prueba;
    }
    r.push(linea);
  }
  return r;
}
/* cuánto mide el comienzo de un texto: para escribirlo letra por letra */
function anchoHasta(str, n, esp) { return anchoFino(Array.from(str).slice(0, n).join(''), esp); }

/* ============================================================================
   luz-mala/js/arte.js — todo lo que se ve, dibujado a mano en grillas de texto.
   Chispa se arma por partes (cabeza, cuerpo, patas, alas) para que cada pose
   sea una combinación y no un dibujo aparte. Lo oscuro nunca es negro puro:
   los bichos son violetas y marrones muy bajos, y lo que se lee de lejos es
   lo que brilla (los ojos, la capucha naranja, la luz de la cola).
   ========================================================================== */

/* superponer capas de filas: lo que no es '.' de arriba tapa lo de abajo */
function componer(ancho, alto, capas) {
  const g = Array.from({ length: alto }, () => Array(ancho).fill('.'));
  for (const c of capas) {
    if (!c) continue;
    const [filas, dx, dy] = c;
    filas.forEach((f, y) => { for (let x = 0; x < f.length; x++) { const yy = y + (dy || 0), xx = x + (dx || 0); if (f[x] !== '.' && yy >= 0 && yy < alto && xx >= 0 && xx < ancho) g[yy][xx] = f[x]; } });
  }
  return g.map((r) => r.join(''));
}

/* el tajo de la espina: una media luna que se abre en tres cuadros, dibujada
   píxel por píxel con la distancia al centro (así el borde sale limpio) */
function prepararTajos() {
  const hacer = (w, h, cx, cy, r0, r1, a0, a1, prog) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
      const t = (a - a0) / (a1 - a0);
      if (t < 0 || t > prog) continue;
      /* más grueso en el medio del arco, fino en las puntas */
      const grosor = (r1 - r0) * Math.sin(Math.PI * Math.min(1, t / Math.max(0.01, prog)));
      if (d < r1 - grosor || d > r1) continue;
      const borde = d > r1 - 1.2 || d < r1 - grosor + 1.2;
      g.fillStyle = borde ? 'rgba(255,236,190,0.85)' : '#ffffff';
      g.fillRect(x, y, 1, 1);
    }
    return c;
  };
  const tres = (f) => [f(0.55), f(1), f(1)];
  return {
    lado: tres((p) => hacer(24, 20, 2, 10, 4, 13, -1.25, 1.25, p)),
    arr: tres((p) => hacer(20, 22, 10, 21, 4, 14, -Math.PI + 0.35, -0.35, p)),
    aba: tres((p) => hacer(20, 22, 10, 1, 4, 14, 0.35, Math.PI - 0.35, p)),
  };
}

/* retratos de 24x24 para los diálogos: la cabeza de cada uno, agrandada */
function prepararRetratos() {
  const r = {};
  const marco = (dibujar, fondo) => {
    const c = document.createElement('canvas');
    c.width = 24; c.height = 24;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.fillStyle = fondo; g.fillRect(0, 0, 24, 24);
    for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) if (BAYER[(y & 3) * 4 + (x & 3)] < (y / 24) * 8) { g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(x, y, 1, 1); }
    dibujar(g);
    g.fillStyle = '#0d0a14';
    g.fillRect(0, 0, 24, 1); g.fillRect(0, 23, 24, 1); g.fillRect(0, 0, 1, 24); g.fillRect(23, 0, 1, 24);
    return c;
  };
  const cabeza = hornear(CAB.normal, PAL_CHISPA);
  r.chispa = marco((g) => { g.drawImage(cabeza, 5, 3, 14, 16); g.fillStyle = PAL_CHISPA.g; g.fillRect(3, 19, 18, 2); }, '#241a34');
  const mamb = hornear(DIB_NPC.mamboreta[0].slice(0, 8), PAL_NPC.mamboreta);
  r.mamboreta = marco((g) => g.drawImage(mamb, 0, 2, 24, 16), '#16261a');
  const vaq = hornear(DIB_NPC.vaquita[0], PAL_NPC.vaquita);
  r.vaquita = marco((g) => g.drawImage(vaq, 1, 4, 22, 16), '#2a1418');
  const can = hornear(DIB_NPC.canasto[0].slice(0, 8), PAL_NPC.canasto);
  r.canasto = marco((g) => g.drawImage(can, 0, 2, 24, 16), '#221a12');
  const bol = hornear(DIB_NPC.bolita[0], PAL_NPC.bolita);
  r.bolita = marco((g) => g.drawImage(bol, 0, 5, 24, 14), '#1a1c24');
  return r;
}
