<!DOCTYPE html>
<html lang="es">
<head>

<title>Esa página no existe · Electro Silver</title>

<!-- Sin esto, cualquier dirección mal escrita devolvía la portada entera con
     código 200: 5,8 MB para decir «acá no hay nada», y buscadores y personas
     creyendo que llegaron bien. -->
<style>
html,body{height:100%}
body{margin:0; display:grid; place-items:center; padding:24px; text-align:center;
  background:#EFF2F6; color:#0C1219;
  font:16px/1.6 "Asap",Helvetica,Arial,sans-serif}
.caja{max-width:440px; padding:36px 30px; border-radius:18px; background:#fff;
  box-shadow:0 24px 60px -30px rgba(12,18,25,.45)}
h1{margin:0 0 10px; font:700 28px/1.15 "Chivo",Helvetica,Arial,sans-serif; letter-spacing:-.02em}
p{margin:0 0 22px; color:#39434F}
a{display:inline-block; padding:13px 26px; border-radius:999px; text-decoration:none;
  font-weight:700; color:#fff; background:#0C1219}
a:hover{background:#39434F}
</style>
</head>
<body>
  <div class="caja">
    <h1>Esa página no existe</h1>
    <p>Puede que el link esté cortado o mal copiado.</p>
    <a href="/">Ir al inicio</a>
  </div>
</body>
</html>
