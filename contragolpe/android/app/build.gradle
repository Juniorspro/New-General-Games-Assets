/* CONTRAGOLPE para Android: el juego en una WebView afinada para jugar (herramientas/apk.mjs pone el
   juego y sus assets, con las texturas en ETC2, en src/main/assets, que no se guarda en el repo).
   Sin librerías nativas: una sola APK para todos los celulares */
plugins { id 'com.android.application' }
android {
  namespace 'ar.contragolpe'
  compileSdk 36
  defaultConfig {
    applicationId 'ar.contragolpe'
    /* (Android 7: los celulares más baratos que siguen dando vueltas; la WebView se actualiza sola) */
    minSdk 24
    targetSdk 36
    versionCode 1
    versionName '1.0'
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  buildTypes { release { minifyEnabled false } }
}
dependencies {
  implementation 'androidx.webkit:webkit:1.14.0'
}
