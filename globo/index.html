<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5fb8ff">
<meta name="description" content="Globo Libre, de JXSTUDIOS: llevá el globo hasta arriba y que no lo toque nada.">
<title>Globo Libre</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<canvas id="juego" aria-label="Globo Libre"></canvas>
<div id="ui">
  <!-- la primera vez, después del logo: el idioma (el título va en los tres) -->
  <section id="idiomas" class="pantalla oculto">
    <h2 class="titulo-idioma">Elegí tu idioma<small lang="en">Choose your language</small><small lang="pt">Escolha seu idioma</small></h2>
    <button id="bIdioma_es" class="boton principal" lang="es">Español</button>
    <button id="bIdioma_en" class="boton principal" lang="en">English</button>
    <button id="bIdioma_pt" class="boton principal" lang="pt">Português</button>
  </section>

  <section id="menu" class="pantalla oculto">
    <div class="bolsa"><span class="moneda" aria-hidden="true"></span><span id="tMonedas">0</span></div>
    <div class="botonera">
      <button id="bJugar" class="boton principal"><span id="tJugar"></span><small id="tNivelJugar"></small></button>
      <div class="fila">
        <button id="bNiveles" class="boton chico azul"></button>
        <button id="bInfinito" class="boton chico violeta"></button>
      </div>
      <div class="fila">
        <button id="bTienda" class="boton chico naranja"></button>
        <button id="bAjustes" class="boton chico gris"></button>
      </div>
      <p id="tRecordMenu" class="dato"></p>
    </div>
    <p id="tFirma" class="firma"></p>
  </section>

  <section id="niveles" class="pantalla oculto">
    <h2 id="tNiveles"></h2>
    <div id="grillaNiveles" class="grilla"></div>
    <button id="bVolverNiveles" class="boton chico gris"></button>
  </section>

  <section id="tienda" class="pantalla oculto">
    <div class="bolsa"><span class="moneda" aria-hidden="true"></span><span id="tMonedasTienda">0</span></div>
    <div class="pestanas" role="tablist">
      <button id="bPestGlobos" class="pestana" role="tab"></button>
      <button id="bPestEscudos" class="pestana" role="tab"></button>
    </div>
    <div class="flechas">
      <button id="bAnterior" class="flecha" aria-label="anterior">‹</button>
      <div class="hueco"></div>
      <button id="bSiguiente" class="flecha" aria-label="siguiente">›</button>
    </div>
    <p id="tNombre" class="nombre"></p>
    <p id="tAviso" class="aviso"></p>
    <button id="bComprar" class="boton principal"></button>
    <button id="bVolverTienda" class="boton chico gris"></button>
  </section>

  <section id="ajustes" class="pantalla oculto velo">
    <h2 id="tAjustes"></h2>
    <div id="listaAjustes" class="lista"></div>
    <button id="bCerrarAjustes" class="boton principal"></button>
  </section>

  <button id="bPausa" class="pausa oculto" aria-label="pausa"><span></span><span></span></button>

  <section id="pausa" class="pantalla oculto velo">
    <h2 id="tPausa"></h2>
    <button id="bSeguir" class="boton principal"></button>
    <button id="bSalirPausa" class="boton chico gris"></button>
  </section>

  <section id="pum" class="pantalla oculto velo">
    <h2 id="tPum" class="grande rojo"></h2>
    <p id="tPumCausa" class="dato"></p>
    <p id="tPumDato" class="dato oro"></p>
    <p id="tPumRecord" class="record"></p>
    <button id="bOtraVez" class="boton principal"></button>
    <button id="bMenuPum" class="boton chico gris"></button>
  </section>

  <section id="gano" class="pantalla oculto velo">
    <h2 id="tGano" class="grande"></h2>
    <p id="tGanoMonedas" class="dato oro"></p>
    <button id="bSiguienteNivel" class="boton principal"></button>
    <button id="bMenuGano" class="boton chico gris"></button>
  </section>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
