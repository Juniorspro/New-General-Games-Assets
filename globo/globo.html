<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5fb8ff">
<meta name="description" content="Globo Libre, de JXSTUDIOS: llevá el globo hasta arriba y que no lo toque nada.">
<title>Globo Libre</title>
<style>
/* El juego se dibuja en el lienzo; los menús son HTML encima. Plano y de
   colores, como el juego: botones gordos con un borde oscuro y la sombra
   dura abajo (un "escalón"), sin brillos de vidrio. */
:root {
  --tinta: #1d2440;
  --blanco: #ffffff;
  --crema: #fff6e2;
  --verde: #2ecc71; --verde-osc: #1f9d55;
  --azul: #3d8bff; --azul-osc: #2a62c4;
  --violeta: #9b5cff; --violeta-osc: #6c3cc4;
  --naranja: #ff9f43; --naranja-osc: #d0772a;
  --gris: #8b93b8; --gris-osc: #5f6789;
  --rojo: #ff4d5e; --oro: #ffc93c;
  color-scheme: light;
}
html, body { margin: 0; height: 100%; background: #5fb8ff; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--tinta); }
#juego { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#ui { position: absolute; inset: 0; pointer-events: none; }
.pantalla {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.6vh, 14px);
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box;
  pointer-events: auto; text-align: center;
}
.pantalla.oculto, .oculto { display: none !important; }
.velo { background: rgba(29, 36, 64, 0.45); }
h2 { margin: 0; font-size: clamp(24px, 4.4vh, 36px); font-weight: 900; color: var(--blanco); letter-spacing: 0.02em; text-shadow: 0 3px 0 var(--tinta); }
h2.grande { font-size: clamp(40px, 8vh, 64px); }
h2.rojo { color: var(--rojo); -webkit-text-stroke: 2px var(--tinta); paint-order: stroke fill; }

.boton {
  all: unset; cursor: pointer; box-sizing: border-box; border-radius: 18px; font-weight: 900; letter-spacing: 0.03em; text-align: center;
  color: #fff; border: 3px solid var(--tinta); text-shadow: 0 2px 0 rgba(29, 36, 64, 0.45);
  transition: transform 0.06s ease; -webkit-tap-highlight-color: transparent; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
}
.boton:active { transform: translateY(4px); }
.boton:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.boton.principal {
  min-width: min(72vw, 290px); padding: 12px 28px; font-size: clamp(22px, 3.8vh, 30px);
  background: var(--verde); box-shadow: 0 6px 0 var(--tinta), inset 0 -6px 0 var(--verde-osc);
}
.boton.principal:active { box-shadow: 0 2px 0 var(--tinta), inset 0 -6px 0 var(--verde-osc); }
.boton.principal small { font-size: 0.5em; font-weight: 800; opacity: 0.95; letter-spacing: 0.06em; }
.boton.chico { min-width: min(34vw, 138px); padding: 10px 14px; font-size: clamp(14px, 2.3vh, 18px); box-shadow: 0 5px 0 var(--tinta), inset 0 -5px 0 var(--gris-osc); background: var(--gris); }
.boton.chico:active { box-shadow: 0 1px 0 var(--tinta), inset 0 -5px 0 var(--gris-osc); }
.boton.azul { background: var(--azul); box-shadow: 0 5px 0 var(--tinta), inset 0 -5px 0 var(--azul-osc); }
.boton.violeta { background: var(--violeta); box-shadow: 0 5px 0 var(--tinta), inset 0 -5px 0 var(--violeta-osc); }
.boton.naranja { background: var(--naranja); box-shadow: 0 5px 0 var(--tinta), inset 0 -5px 0 var(--naranja-osc); }
.boton.apagado { filter: grayscale(0.7) brightness(0.9); }
.fila { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.titulo-idioma { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 8px; }
.titulo-idioma small { font-size: clamp(13px, 2vh, 16px); font-weight: 800; color: var(--blanco); opacity: 0.9; text-shadow: 0 2px 0 var(--tinta); letter-spacing: 0.01em; }

/* el menú y la elección de idioma: el cartel lo dibuja el lienzo arriba; los botones van abajo */
#menu, #idiomas { justify-content: flex-end; padding-bottom: max(42px, env(safe-area-inset-bottom)); }
.botonera { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.5vh, 14px); }
.bolsa {
  position: absolute; top: max(12px, env(safe-area-inset-top)); right: 14px; display: flex; align-items: center; gap: 6px;
  background: var(--crema); border: 3px solid var(--tinta); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 900; font-size: 18px; box-shadow: 0 4px 0 var(--tinta);
}
.moneda { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #ffe98a 0 42%, #ffd23f 44% 100%); box-shadow: inset 0 -3px 0 #e0a800; display: inline-block; }
.dato { margin: 0; font-weight: 900; color: var(--blanco); font-size: clamp(15px, 2.4vh, 19px); text-shadow: 0 2px 0 var(--tinta); }
.dato.oro { color: var(--oro); }
.record { margin: 0; min-height: 1.2em; font-weight: 900; color: var(--oro); text-shadow: 0 2px 0 var(--tinta); animation: late 0.8s ease-in-out infinite; }
@keyframes late { 50% { opacity: 0.35; } }
.firma { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); margin: 0; font-size: 12px; letter-spacing: 0.2em; color: var(--blanco); font-weight: 900; text-shadow: 0 2px 0 rgba(29, 36, 64, 0.5); }

/* los niveles: diez por cielo */
.grilla { display: grid; gap: 10px; width: min(94vw, 460px); max-height: 70vh; overflow-y: auto; padding: 4px; box-sizing: border-box; }
.grilla h3 { grid-column: 1 / -1; margin: 6px 0 0; font-size: 15px; font-weight: 900; color: var(--blanco); text-shadow: 0 2px 0 var(--tinta); letter-spacing: 0.08em; text-transform: uppercase; }
.grilla .cielo { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.nivelB {
  all: unset; cursor: pointer; aspect-ratio: 1; border-radius: 14px; border: 3px solid var(--tinta); font-weight: 900; font-size: clamp(16px, 2.6vh, 20px);
  display: flex; align-items: center; justify-content: center; color: #fff; text-shadow: 0 2px 0 rgba(29, 36, 64, 0.5); box-shadow: 0 4px 0 var(--tinta);
}
.nivelB:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }
.nivelB.cerrado { background: #b9bfd8 !important; color: #6f7699; text-shadow: none; cursor: default; }
.nivelB.hecho::after { content: "★"; position: absolute; transform: translate(18px, -18px); color: var(--oro); font-size: 14px; text-shadow: 0 1px 0 var(--tinta); }
.nivelB:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* la tienda */
#tienda { justify-content: space-between; padding-top: max(64px, env(safe-area-inset-top)); }
.pestanas { display: flex; gap: 6px; background: var(--crema); border: 3px solid var(--tinta); border-radius: 16px; padding: 4px; box-shadow: 0 4px 0 var(--tinta); }
.pestana { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 11px; font-weight: 900; font-size: clamp(14px, 2.2vh, 17px); color: var(--tinta); }
.pestana.elegida { background: var(--azul); color: #fff; text-shadow: 0 2px 0 rgba(29, 36, 64, 0.4); }
.flechas { display: flex; align-items: center; justify-content: space-between; width: min(96vw, 520px); flex: 1; }
.flechas .hueco { flex: 1; }
.flecha {
  all: unset; cursor: pointer; width: 58px; height: 58px; border-radius: 50%; font-size: 40px; line-height: 52px; text-align: center; font-weight: 900; color: #fff;
  background: var(--azul); border: 3px solid var(--tinta); box-shadow: 0 5px 0 var(--tinta); box-sizing: border-box;
}
.flecha:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--tinta); }
.nombre { margin: 0; font-size: clamp(22px, 3.6vh, 28px); font-weight: 900; color: var(--blanco); text-shadow: 0 3px 0 var(--tinta); }
.aviso { margin: 0; min-height: 1.2em; font-weight: 800; color: var(--blanco); text-shadow: 0 2px 0 var(--tinta); }

.lista { display: grid; gap: 8px; width: min(92vw, 440px); background: var(--crema); border: 3px solid var(--tinta); box-shadow: 0 5px 0 var(--tinta); padding: 12px; border-radius: 18px; box-sizing: border-box; }
.lista .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; }
.lista .ops { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
/* en un teléfono angosto (360) "Sensibilidad" dejaba "Alta" sola abajo: los botones nunca se parten */
.lista .ops { flex-wrap: nowrap; flex: none; }
@media (max-width: 380px) { .lista .opcion { padding: 6px 8px; } }
.opcion { all: unset; cursor: pointer; padding: 6px 11px; border-radius: 10px; font-weight: 900; font-size: 13px; color: var(--tinta); border: 2px solid transparent; }
.opcion.elegida { background: var(--azul); color: #fff; border-color: var(--tinta); }
.opcion.peligro { color: var(--rojo); }

/* la pausa, arriba a la izquierda mientras se juega */
.pausa {
  all: unset; position: absolute; top: max(10px, env(safe-area-inset-top)); left: 12px; width: 42px; height: 42px; border-radius: 12px; pointer-events: auto; cursor: pointer;
  background: rgba(255, 255, 255, 0.85); border: 3px solid var(--tinta); box-shadow: 0 4px 0 var(--tinta); display: flex; align-items: center; justify-content: center; gap: 5px; box-sizing: border-box;
}
.pausa span { width: 6px; height: 16px; background: var(--tinta); border-radius: 2px; }
.pausa:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); }

/* con el teléfono acostado: los botones a la derecha, el cartel a la izquierda (lo dibuja el lienzo) */
@media (orientation: landscape) and (max-height: 560px) {
  #menu, #idiomas { align-items: flex-end; justify-content: center; padding-right: max(24px, env(safe-area-inset-right)); padding-bottom: 16px; }
  .botonera, #idiomas > * { width: 48vw; }
  #idiomas .boton.principal { min-width: 0; }
  .boton.principal { min-width: min(40vw, 280px); padding: 8px 20px; }
  .grilla { max-height: 62vh; width: min(70vw, 560px); }
  .grilla .cielo { grid-template-columns: repeat(10, 1fr); }
  .nivelB { aspect-ratio: auto; height: clamp(30px, 9vh, 42px); }
  .grilla h3 { margin: 2px 0 0; font-size: 13px; }
  #tienda { padding-top: max(12px, env(safe-area-inset-top)); gap: 6px; }
  .flechas { width: min(70vw, 520px); }
  .boton.chico { padding: 6px 12px; }
}
@media (max-width: 360px) { .boton.chico { min-width: 42vw; padding: 9px 8px; } }
@media (prefers-reduced-motion: reduce) { .record { animation: none; } .boton { transition: none; } }

</style>
</head>
<body>
<canvas id="juego" aria-label="Globo Libre"></canvas>
<div id="ui">
  <!-- la primera vez, después del logo: el idioma (el título va en los tres) -->
  <section id="idiomas" class="pantalla oculto">
    <h2 class="titulo-idioma">Elegí tu idioma<small lang="en">Choose your language</small><small lang="pt">Escolha seu idioma</small></h2>
    <button id="bIdioma_es" class="boton principal" lang="es">Español</button>
    <button id="bIdioma_en" class="boton principal" lang="en">English</button>
    <button id="bIdioma_pt" class="boton principal" lang="pt">Português</button>
  </section>

  <section id="menu" class="pantalla oculto">
    <div class="bolsa"><span class="moneda" aria-hidden="true"></span><span id="tMonedas">0</span></div>
    <div class="botonera">
      <button id="bJugar" class="boton principal"><span id="tJugar"></span><small id="tNivelJugar"></small></button>
      <div class="fila">
        <button id="bNiveles" class="boton chico azul"></button>
        <button id="bInfinito" class="boton chico violeta"></button>
      </div>
      <div class="fila">
        <button id="bTienda" class="boton chico naranja"></button>
        <button id="bAjustes" class="boton chico gris"></button>
      </div>
      <p id="tRecordMenu" class="dato"></p>
    </div>
    <p id="tFirma" class="firma"></p>
  </section>

  <section id="niveles" class="pantalla oculto">
    <h2 id="tNiveles"></h2>
    <div id="grillaNiveles" class="grilla"></div>
    <button id="bVolverNiveles" class="boton chico gris"></button>
  </section>

  <section id="tienda" class="pantalla oculto">
    <div class="bolsa"><span class="moneda" aria-hidden="true"></span><span id="tMonedasTienda">0</span></div>
    <div class="pestanas" role="tablist">
      <button id="bPestGlobos" class="pestana" role="tab"></button>
      <button id="bPestEscudos" class="pestana" role="tab"></button>
    </div>
    <div class="flechas">
      <button id="bAnterior" class="flecha" aria-label="anterior">‹</button>
      <div class="hueco"></div>
      <button id="bSiguiente" class="flecha" aria-label="siguiente">›</button>
    </div>
    <p id="tNombre" class="nombre"></p>
    <p id="tAviso" class="aviso"></p>
    <button id="bComprar" class="boton principal"></button>
    <button id="bVolverTienda" class="boton chico gris"></button>
  </section>

  <section id="ajustes" class="pantalla oculto velo">
    <h2 id="tAjustes"></h2>
    <div id="listaAjustes" class="lista"></div>
    <button id="bCerrarAjustes" class="boton principal"></button>
  </section>

  <button id="bPausa" class="pausa oculto" aria-label="pausa"><span></span><span></span></button>

  <section id="pausa" class="pantalla oculto velo">
    <h2 id="tPausa"></h2>
    <button id="bSeguir" class="boton principal"></button>
    <button id="bSalirPausa" class="boton chico gris"></button>
  </section>

  <section id="pum" class="pantalla oculto velo">
    <h2 id="tPum" class="grande rojo"></h2>
    <p id="tPumCausa" class="dato"></p>
    <p id="tPumDato" class="dato oro"></p>
    <p id="tPumRecord" class="record"></p>
    <button id="bOtraVez" class="boton principal"></button>
    <button id="bMenuPum" class="boton chico gris"></button>
  </section>

  <section id="gano" class="pantalla oculto velo">
    <h2 id="tGano" class="grande"></h2>
    <p id="tGanoMonedas" class="dato oro"></p>
    <button id="bSiguienteNivel" class="boton principal"></button>
    <button id="bMenuGano" class="boton chico gris"></button>
  </section>
</div>
<script>
/* ── util ── */
const M_util = (() => {
// Lo chico: azar con semilla, límites, curvas y el paso del cuadro.

// mulberry32: el azar de los niveles va con semilla, así el nivel 7 es
// siempre el mismo nivel 7 (y una prueba se puede repetir igual).
function azar(semilla) {
  let a = semilla >>> 0;
  const r = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.entre = (a, b) => a + (b - a) * r();
  r.entero = (a, b) => Math.floor(a + (b - a + 1) * r());
  r.uno = (lista) => lista[Math.floor(r() * lista.length)];
  return r;
}
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const tramo = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const salida = (t) => 1 - (1 - t) ** 3;
const suave = (t) => t * t * (3 - 2 * t);
const salidaAtras = (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2;
// un rebote elástico que se pasa y vuelve (para lo que "salta" a la vista)
const elastico = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 2 ** (-10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1);
const acercar = (x, obj, vel, dt) => x + (obj - x) * (1 - Math.exp(-vel * dt));

// El tiempo real de un cuadro partido en pasos de a lo sumo `max`: [cuántos,
// de cuánto]. Con pasos fijos y una pantalla de 90 o 120 Hz, algunos cuadros
// quedan sin moverse y se ve a tirones (pasó en Víbora).
function trozos(dtReal, max) {
  const n = Math.max(1, Math.ceil(dtReal / max - 1e-9));
  return [n, dtReal / n];
}

// Un color más claro o más oscuro (f entre -1 y 1), para las sombras planas.
function tono(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255];
  const m = c.map((v) => Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f)));
  return '#' + m.map((v) => v.toString(16).padStart(2, '0')).join('');
}
return { azar, clamp, lerp, tramo, salida, suave, salidaAtras, elastico, acercar, trozos, tono };
})();

/* ── niveles ── */
const M_niveles = (() => {
// Los niveles de Globo Libre: 30 (diez por cielo) y el infinito.
//
// Un nivel es una fila de "formaciones" (una pared de cajas, un péndulo, un
// embudo…) separadas por respiros, del suelo a la meta. Todo sale de una
// semilla: el nivel 7 es siempre el mismo nivel 7. Cada formación es una
// función (azar, dificultad 0 a 1) → piezas en coordenadas locales: x de 0 a
// 360 (el ancho del mundo), y = 0 abajo y negativa hacia arriba (como en el
// mundo, donde subir es ir hacia y negativa).
//
// La regla de oro: nada FIJO pasa por la columna del globo (x 142 a 218: el
// globo mide 44 y se hamaca 12 de cada lado, más unos pocos de aire): lo fijo
// que la invadiera sería una muerte segura. Lo que sí cruza la columna se
// puede empujar.
//
// Tipos de pieza:
//   suelta   quieta en el aire hasta que algo la toca (entonces cae)
//   cae      quieta hasta que la formación entra en pantalla: llueve
//   fijo     pared o repisa que no se mueve nunca
//   aspa     barra que gira sola, a un costado
//   molinete barra clavada por el centro que gira si se la empuja
//   pendulo  bola colgada de un clavo que arranca a hamacarse al llegar
const { azar, clamp } = M_util;
const ANCHO = 360;
const COLUMNA = [142, 218];
const NIVELES = 30;

// ── las formaciones ────────────────────────────────────────────────────────
const F = {
  // una caja grande justo en el camino: la primera lección (empujala a un lado)
  caja(r, d) {
    const l = 60 + d * 40, x = 180 + r.entre(-20, 20);
    return { alto: l, piezas: [{ forma: 'caja', x, y: -l / 2, w: l, h: l, densidad: 1.2 }], monedas: arco(180, -l - 50, 3, 40) };
  },

  // una o varias filas de ladrillos de lado a lado (desde el nivel 8, más o
  // menos, al tocar una se viene abajo la fila entera)
  fila(r, d) {
    const filas = 1 + (d > 0.35 ? 1 : 0) + (d > 0.75 ? 1 : 0), w = r.uno([40, 45, 51.4]), h = 22;
    const piezas = [];
    for (let f = 0; f < filas; f++) {
      const corre = f % 2 ? w / 2 : 0;
      for (let x = w / 2 - corre; x < ANCHO + w / 2; x += w) {
        const xx = clamp(x, w / 2 - 6, ANCHO - w / 2 + 6);
        piezas.push({ forma: 'caja', x: xx, y: -h / 2 - f * (h + 1), w: w - 2, h, grupo: d > 0.3 ? 1 : 0 });
      }
    }
    const alto = filas * (h + 1);
    return { alto, piezas, monedas: r() < 0.5 ? arco(180, -alto - 45, 3, 36) : [] };
  },

  // un racimo de bolas apretadas (panal) arriba del camino; en los niveles
  // difíciles se desarma entero al tocarlo
  bolas(r, d, cae = false) {
    // el racimo que cae es más chico: treinta bolas lloviendo de a una no se atajan
    const rb = r.uno([11, 13, 15]), R = cae ? 32 + d * 18 : 48 + d * 42, cx = 180 + r.entre(-30, 30), piezas = [];
    const dx = 2 * rb + 0.6, dy = dx * 0.866;
    for (let j = 0, y = -R; y <= R; j++, y += dy) for (let x = -R + (j % 2 ? dx / 2 : 0); x <= R; x += dx) {
      if (x * x + y * y <= R * R) piezas.push({ forma: 'bola', x: cx + x, y: y - R - rb, r: rb, grupo: d > 0.3 ? 1 : 0 });
    }
    return { alto: 2 * R + 2 * rb, piezas, monedas: [[cx, -R - rb]] };
  },

  // palos largos cruzados
  palos(r, d) {
    const n = 2 + Math.round(d * 2), piezas = [];
    for (let k = 0; k < n; k++) {
      const l = r.entre(130, 190);
      piezas.push({ forma: 'caja', x: 180 + r.entre(-50, 50), y: -30 - k * 55, w: l, h: 12, a: r.entre(-0.6, 0.6) });
    }
    return { alto: 30 + n * 55, piezas, monedas: arco(180 + r.uno([-110, 110]), -n * 30, 3, 34, true) };
  },

  // una escalera de cajas que cruza el camino en diagonal
  escalera(r, d) {
    const n = 5 + Math.round(d * 3), l = 34, lado = r() < 0.5 ? 1 : -1, piezas = [];
    for (let k = 0; k < n; k++) piezas.push({ forma: 'caja', x: 180 + lado * (k - (n - 1) / 2) * 38, y: -l / 2 - k * 26, w: l, h: l, grupo: 1 });

function chocan(A, B) {

// ── el mundo ────────────────────────────────────────────────────────────────
class Mundo {
  // `aire`: el roce con el aire (por segundo); con más, las cosas caen más lentas y se atajan mejor
  constructor({ gravedad = 900, iteraciones = 10, aire = 0.35 } = {}) {
    this.g = gravedad; this.iteraciones = iteraciones; this.aire = aire;
    this.cuerpos = []; this.cuerdas = []; this.contactos = [];
    this.grilla = new Map();
    this.ventana = [-Infinity, Infinity];        // de qué alto a qué alto chocan las cosas
    this.golpes = [];                            // choques fuertes contra `this.oido` (para el sonido)
    this.oido = null;
    this.hayMuertos = false;
    // los contactos del paso anterior: su impulso arranca el de este (así una
    // pila se asienta y se duerme en vez de temblar para siempre)
    this.previos = new Map();
    this.despiertos = [];
  }
  agregar(c) { this.cuerpos.push(c); return c; }
  sacar(c) { if (c.vivo) { c.vivo = false; this.hayMuertos = true; } }

  // al tocar una caja, la torre entera siente el golpe.
  grupo(lista) { const isla = { cuerpos: lista.filter((c) => c.dormido) }; for (const c of isla.cuerpos) c.isla = isla; return isla; }
  // una bola colgada de un punto fijo (o de un cuerpo que se mueve), de largo fijo
  cuerda(b, x, y, largo, desde = null) { const c = { b, x, y, largo, desde }; this.cuerdas.push(c); return c; }

  armarGrilla() {
    const g = this.grilla; g.clear();
    const [arriba, abajo] = this.ventana;
    for (const b of this.cuerpos) {
      if (!b.vivo || b.y + b.r < arriba || b.y - b.r > abajo) continue;
      const i0 = Math.floor((b.x - b.r) / CELDA), i1 = Math.floor((b.x + b.r) / CELDA);
      const j0 = Math.floor((b.y - b.r) / CELDA), j1 = Math.floor((b.y + b.r) / CELDA);
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const k = j * 4096 + i;
        let l = g.get(k); if (!l) { l = []; g.set(k, l); }
        l.push(b);
      }
    }
  }
  // todo lo que toca el círculo (x, y, r); `fn(cuerpo, contacto)`
  cerca(x, y, r, fn) {
    const sonda = { forma: 'bola', x, y, r, hx: r, hy: r, c: 1, s: 0 };
    const i0 = Math.floor((x - r) / CELDA), i1 = Math.floor((x + r) / CELDA), j0 = Math.floor((y - r) / CELDA), j1 = Math.floor((y + r) / CELDA);
    const vistos = new Set();
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) for (const b of this.grilla.get(j * 4096 + i) || []) {
      if (vistos.has(b) || !b.vivo) continue;

      const c = chocan(sonda, b);

  // Despierta a un dormido y a los que se durmieron con él (su "isla"): si se
  // despertara solo la caja de arriba de una pila, la de abajo seguiría
  // dormida sin sentir el peso.
  despertar(b) {
    const lista = b.isla ? b.isla.cuerpos : [b];
    for (const c of lista) if (c.vivo && c.dormido) { c.despertar(); c.isla = null; this.despiertos.push(c); }
  }

  detectar() {
    this.contactos.length = 0;
    this.despiertos = [];
    const previos = this.previos, nuevos = new Map();
    const g = this.grilla, [arriba, abajo] = this.ventana;
    // la marca de "ya probado con A" no vuelve a empezar nunca: si empezara de
    // cero en cada paso, lo marcado en el paso anterior parecería ya probado
    // (una caja sola atravesaba el piso)
    let marca = this.marca || 0;
    const probar = (A, tarde) => {
      marca++;
      const i0 = Math.floor((A.x - A.r) / CELDA), i1 = Math.floor((A.x + A.r) / CELDA);
      const j0 = Math.floor((A.y - A.r) / CELDA), j1 = Math.floor((A.y + A.r) / CELDA);
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const l = g.get(j * 4096 + i);
        if (!l) continue;
        for (const B of l) {
          if (B === A || B.marca === marca || !B.vivo) continue;
          B.marca = marca;
          const Bmueve = B.tipo !== ESTATICO && !B.dormido;
          if (Bmueve && B.id < A.id) continue;                   // ese par ya lo probó B
          if (A.tipo !== DINAMICO && (B.tipo !== DINAMICO)) continue;  // cinemático contra fijo: nada
          // uno que se despertó en este paso puede tener ya el par, probado del otro lado
          if (tarde && nuevos.has(B.id * 1048576 + A.id)) continue;
          const dx = B.x - A.x, dy = B.y - A.y, rr = A.r + B.r;
          if (dx * dx + dy * dy > rr * rr) continue;
          const c = chocan(A, B);
          if (!c) continue;
          if (B.dormido) this.despertar(B);
          c.a = A; c.b = B;
          c.f = Math.sqrt(A.friccion * B.friccion); c.e = Math.max(A.rebote, B.rebote);
          const clave = A.id * 1048576 + B.id, viejo = previos.get(clave);
          if (viejo) for (const p of c.puntos) {
            let mejor = null, d2m = 4;
            for (const q of viejo.puntos) { const d2 = (q.x - p.x) ** 2 + (q.y - p.y) ** 2; if (d2 < d2m) { d2m = d2; mejor = q; } }
            if (mejor) { p.pn = mejor.pn; p.pt = mejor.pt; }
          }

          this.contactos.push(c);
        }

    for (const A of this.cuerpos) if (A.vivo && A.tipo !== ESTATICO && !A.dormido && enVentana(A)) probar(A, false);
    // Los que se despertaron recién ya habían pasado dormidos por la vuelta:
    // se prueban ahora, si no la caja de abajo de la pila se quedaba este paso
    // sin el piso y la de arriba la hundía.
    for (let k = 0; k < this.despiertos.length; k++) { const A = this.despiertos[k]; if (enVentana(A)) probar(A, true); }

  }

  // Se duermen de a islas (los que se tocan): una caja de abajo que se durmiera
  // sola mientras la de arriba todavía se acomoda la despertaría a cada rato,
  // y cada despertar es un golpe (la pila no paraba nunca).

    const act = [];

      b.padre = b; b.menor = b.quieto; act.push(b);

      const A = ct.a, B = ct.b;

        if (A.tipo === CINEMATICO) B.menor = 0; else if (B.tipo === CINEMATICO) A.menor = 0;
        continue;
      }
      const ra = raiz(A), rb = raiz(B);
      if (ra !== rb) { rb.padre = ra; if (rb.menor < ra.menor) ra.menor = rb.menor; }
    }
    const islas = new Map();

      const r = raiz(b);
      if (b.menor < r.menor) r.menor = b.menor;
    }
    for (const b of act) {
      const r = raiz(b);
      if (r.menor <= DORMIR_T) continue;
      let isla = islas.get(r); if (!isla) { isla = { cuerpos: [] }; islas.set(r, isla); }
      isla.cuerpos.push(b);
      b.dormido = true; b.vx = b.vy = b.w = 0; b.isla = isla;
    }
  }

  paso(dt) {
    const inv = 1 / dt, [arriba, abajo] = this.ventana;

    const activo = (b) => b.vivo && !b.dormido && b.y + b.r >= arriba - 200 && b.y - b.r <= abajo + 200;
    for (const b of this.cuerpos) if (b.tipo === DINAMICO && activo(b)) {

    }

    // arranque: si el arranque de un contacto entrara antes de medir el
    // siguiente, el de más arriba "veía" un golpe fuerte que no existía y
    // rebotaba (una pila de 6 cajas no se quedaba quieta nunca)
    for (const ct of this.contactos) preparar(ct, inv);

      for (const ct of this.contactos) resolver(ct);

      this.golpes.push({ vel: ct.impacto, x: ct.puntos[0].x, y: ct.puntos[0].y, cuerpo: ct.a === this.oido ? ct.b : ct.a });

    for (const b of this.cuerpos) {
      if (!b.vivo || b.tipo === ESTATICO || b.dormido) continue;

    }
  }

function preparar(ct, inv) {
  const A = ct.a, B = ct.b, nx = ct.nx, ny = ct.ny, tx = ny, ty = -nx;
  ct.impacto = 0;
  for (const p of ct.puntos) {
    p.r1x = p.x - A.x; p.r1y = p.y - A.y; p.r2x = p.x - B.x; p.r2y = p.y - B.y;
    const rn1 = p.r1x * nx + p.r1y * ny, rn2 = p.r2x * nx + p.r2y * ny;
    const r1 = p.r1x * p.r1x + p.r1y * p.r1y, r2 = p.r2x * p.r2x + p.r2y * p.r2y;
    const kn = A.im + B.im + A.ii * (r1 - rn1 * rn1) + B.ii * (r2 - rn2 * rn2);
    p.mn = kn > 0 ? 1 / kn : 0;
    const rt1 = p.r1x * tx + p.r1y * ty, rt2 = p.r2x * tx + p.r2y * ty;
    const kt = A.im + B.im + A.ii * (r1 - rt1 * rt1) + B.ii * (r2 - rt2 * rt2);
    p.mt = kt > 0 ? 1 / kt : 0;
    p.sesgo = Math.min(CORRECCION_MAX, -BETA * inv * Math.min(0, p.sep + HOLGURA));
    const dvx = B.vx - B.w * p.r2y - (A.vx - A.w * p.r1y), dvy = B.vy + B.w * p.r2x - (A.vy + A.w * p.r1x);
    const vn = dvx * nx + dvy * ny;
    if (vn < -UMBRAL_REBOTE) p.sesgo = Math.max(p.sesgo, -ct.e * vn);
    if (-vn > ct.impacto) ct.impacto = -vn;
    p.pn = p.pn || 0; p.pt = p.pt || 0;
  }
}

// el impulso del paso anterior, de arranque
function arrancar(ct) {
  const A = ct.a, B = ct.b, nx = ct.nx, ny = ct.ny, tx = ny, ty = -nx;
  for (const p of ct.puntos) {
    if (!p.pn && !p.pt) continue;
    const px = p.pn * nx + p.pt * tx, py = p.pn * ny + p.pt * ty;
    A.vx -= A.im * px; A.vy -= A.im * py; A.w -= A.ii * (p.r1x * py - p.r1y * px);
    B.vx += B.im * px; B.vy += B.im * py; B.w += B.ii * (p.r2x * py - p.r2y * px);
  }
}

function resolver(ct) {
  const A = ct.a, B = ct.b, nx = ct.nx, ny = ct.ny, tx = ny, ty = -nx;
  for (const p of ct.puntos) {
    let dvx = B.vx - B.w * p.r2y - (A.vx - A.w * p.r1y), dvy = B.vy + B.w * p.r2x - (A.vy + A.w * p.r1x);
    let d = p.mn * (-(dvx * nx + dvy * ny) + p.sesgo);
    const pn0 = p.pn; p.pn = Math.max(pn0 + d, 0); d = p.pn - pn0;
    let px = d * nx, py = d * ny;
    A.vx -= A.im * px; A.vy -= A.im * py; A.w -= A.ii * (p.r1x * py - p.r1y * px);
    B.vx += B.im * px; B.vy += B.im * py; B.w += B.ii * (p.r2x * py - p.r2y * px);
    dvx = B.vx - B.w * p.r2y - (A.vx - A.w * p.r1y); dvy = B.vy + B.w * p.r2x - (A.vy + A.w * p.r1x);
    d = p.mt * -(dvx * tx + dvy * ty);

    p.pt = Math.max(-tope, Math.min(tope, pt0 + d)); d = p.pt - pt0;

// La cuerda: la bola no se aleja del punto más que su largo (una vara, además,
// no deja que se acerque). Se corrige la velocidad a lo largo de la cuerda,
// con la misma corrección de a poco que los contactos.

  const b = cu.b;

  const ovx = cu.desde ? cu.desde.vx : 0, ovy = cu.desde ? cu.desde.vy : 0;

/* ── partida ── */
const M_partida = (() => {
// Una partida: el globo que sube solo, el escudo que maneja el dedo, las
// formaciones que van apareciendo y la física que las mueve.
//
// El globo sube a velocidad fija por x = 180 y la cámara lo sigue (queda al

// la cámara (si el dedo no se mueve, queda quieto en la pantalla y en el

/* ── dibujo ── */
const M_dibujo = (() => {
// El dibujo de Globo Libre: plano y de colores, como un libro para chicos.
// Cada cosa es un color lleno con su sombra en un tono más oscuro (una franja
// abajo, siempre del mismo lado del cuerpo) y un brillo claro; nada de
// degradés por cuerpo. El cielo, las nubes y las monedas se arman una vez y
// después son un `drawImage`.
//
// La cámara: `cam = { esc, ox, arriba }`. Un punto del mundo (x, y) va a la
// pantalla en (ox + x·esc, (y − arriba)·esc).
const { ANCHO } = M_niveles;
const { R_ESCUDO, R_MONEDA } = M_partida;
const { azar, tono, lerp } = M_util;
// ── lo que se arma una vez ─────────────────────────────────────────────────
const cache = new Map();
function lienzo(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function mezclar(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const c = [16, 8, 0].map((s) => Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, t)));
  return '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
}

// el cielo: un degradé vertical de alto 256 que se estira a la pantalla; se
// rehace solo cuando cambia de verdad (el avance del nivel va en 24 escalones)
function cielo(tema, avance) {
  const k = `cielo:${tema.id}:${Math.round(avance * 24)}`;
  if (cache.has(k)) return cache.get(k);
  const t = Math.round(avance * 24) / 24;
  const abajo = mezclar(tema.cielo[0][1], tema.cielo[1][1], t), arriba = mezclar(tema.cielo[0][0], tema.cielo[1][0], t);

  gr.addColorStop(0, arriba); gr.addColorStop(1, abajo);

  for (const kk of cache.keys()) if (kk.startsWith(`cielo:${tema.id}:`) && cache.size > 60) cache.delete(kk);
  cache.set(k, c);

// una nube plana: círculos que se pisan, con la panza en un tono más oscuro
function nube(tema, variante, px) {

  for (const [x, y, rr] of bolas) { g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); g.fill(); }
  g.fillRect(w * 0.18, h * 0.55, w * 0.64, h * 0.3);
  cache.set(k, c);
  return c;
}

// la moneda de frente (se "gira" estirándola a lo ancho)
function monedaImg(px) {
  const k = 'moneda:' + px;
  if (cache.has(k)) return cache.get(k);

  g.fillStyle = '#e0a800'; g.beginPath(); g.arc(m, m + px * 0.12, px, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(m, m, px, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#ffe98a'; g.beginPath(); g.arc(m, m, px * 0.66, 0, Math.PI * 2); g.fill();

function estrella(g, x, y, r, color, puntas = 5) {

function cajaRedonda(g, x, y, w, h, r) {

  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);

// los tonos de cada color, calculados una vez
const tonos = new Map();
function sombras(color) {

  return t;

// ── el fondo ───────────────────────────────────────────────────────────────

// ── la meta: una franja a cuadros de lado a lado, con dos banderines ──────
function dibujarMeta(g, cam, y, texto, tema, t) {
  const esc = cam.esc, sy = (y - cam.arriba) * esc, x0 = cam.ox, x1 = cam.ox + ANCHO * esc;
  if (sy < -60 * esc || sy > 2000) return;

  for (let x = x0, i = 0; x < x1; x += cuad, i++) {
    g.fillStyle = i % 2 ? '#ffffff' : tema.tinta; g.fillRect(x, sy - alto, cuad + 0.5, alto / 2);
    g.fillStyle = i % 2 ? tema.tinta : '#ffffff'; g.fillRect(x, sy - alto / 2, cuad + 0.5, alto / 2);
  }

    g.fillStyle = tema.tinta; g.fillRect(px - 2 * esc, sy - 70 * esc, 4 * esc, 70 * esc);

// ── los cuerpos ────────────────────────────────────────────────────────────

    } else {
      g.fillStyle = s.osc; cajaRedonda(g, -w / 2, -h / 2, w, h, rr); g.fill();
      g.strokeStyle = s.linea; g.lineWidth = 1.5 * esc; g.stroke();
      g.fillStyle = color; cajaRedonda(g, -w / 2, -h / 2, w, h - Math.min(5 * esc, h * 0.25), rr); g.fill();
      if (w > 14 * esc && h > 14 * esc) { g.fillStyle = s.claro; cajaRedonda(g, -w / 2 + 4 * esc, -h / 2 + 3 * esc, Math.min(w * 0.35, 18 * esc), 3 * esc, 1.5 * esc); g.fill(); }

        g.fillStyle = '#ffffff'; g.beginPath(); g.arc(0, 0, 2.5 * esc, 0, Math.PI * 2); g.fill();

      }
    }

}

// ── el globo y el escudo (también se usan en el menú y en la tienda) ──────
function dibujarGlobo(g, x, y, r, piel, t, { hilo = 70, inclina = 0 } = {}) {

function dibujarEscudo(g, x, y, r, piel, t) {

  if (piel.dibujo) piel.dibujo(g, x, y, r, t);

  const a = t * 2.2;

  g.beginPath(); g.arc(x, y, r * 0.88, a, a + 0.7); g.stroke();

// ── la partida entera ──────────────────────────────────────────────────────
function dibujarPartida(g, W, H, p, cam, { pielGlobo, pielEscudo, tr, t }) {
  const tema = p.tema(), esc = cam.esc;

    }
  }

/* ── entrada ── */
const M_entrada = (() => {
// Mover el escudo: se arrastra en CUALQUIER lado de la pantalla y el escudo
// se mueve lo mismo que el dedo (arrastre relativo, como en los juegos del
// género): así el dedo nunca tapa lo que viene. Manda el primer dedo que se
// apoya; los demás no hacen nada (una palma apoyada no lo mueve).
//  - Mouse: arrastrar con el botón apretado.
//  - Teclado: flechas o WASD (Escape y P, la pausa, los atiende main.js).
// Devuelve el arrastre acumulado en píxeles de CSS; main.js lo pasa al mundo.
function crearEntrada(lienzo) {
  const e = { activo: false, dedo: null, ux: 0, uy: 0, dx: 0, dy: 0, teclas: new Set(), toques: 0 };

  lienzo.addEventListener('pointerdown', (ev) => {
    if (!e.activo) return;
    ev.preventDefault();
    e.toques++;
    if (e.dedo !== null) return;
    lienzo.setPointerCapture?.(ev.pointerId);
    e.dedo = ev.pointerId; e.ux = ev.clientX; e.uy = ev.clientY;
  }, { passive: false });
  lienzo.addEventListener('pointermove', (ev) => {
    if (!e.activo || ev.pointerId !== e.dedo) return;
    // los movimientos juntados por el navegador entre cuadro y cuadro (más parejo en teléfonos rápidos)
    const lista = ev.getCoalescedEvents?.() || [];
    const ult = lista.length ? lista[lista.length - 1] : ev;
    e.dx += ult.clientX - e.ux; e.dy += ult.clientY - e.uy;
    e.ux = ult.clientX; e.uy = ult.clientY;
  });
  const soltar = (ev) => { if (ev.pointerId === e.dedo) e.dedo = null; };
  lienzo.addEventListener('pointerup', soltar);
  lienzo.addEventListener('pointercancel', soltar);
  lienzo.addEventListener('lostpointercapture', soltar);
  lienzo.addEventListener('contextmenu', (ev) => ev.preventDefault());
  for (const t of ['touchstart', 'touchmove', 'touchend']) lienzo.addEventListener(t, (ev) => { if (e.activo) ev.preventDefault(); }, { passive: false });

  window.addEventListener('keydown', (ev) => {
    e.teclas.add(ev.code);
    if (e.activo && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(ev.code)) ev.preventDefault();
  });
  window.addEventListener('keyup', (ev) => e.teclas.delete(ev.code));
  window.addEventListener('blur', () => { e.teclas.clear(); e.dedo = null; });

  // el arrastre desde la última vez (y lo pone en cero)
  e.sacar = () => { const r = [e.dx, e.dy]; e.dx = 0; e.dy = 0; return r; };
  // hacia dónde piden las teclas (-1, 0 o 1 en cada eje)
  e.flechas = () => {
    const t = e.teclas;
    return [(t.has('ArrowRight') || t.has('KeyD') ? 1 : 0) - (t.has('ArrowLeft') || t.has('KeyA') ? 1 : 0), (t.has('ArrowDown') || t.has('KeyS') ? 1 : 0) - (t.has('ArrowUp') || t.has('KeyW') ? 1 : 0)];
  };
  e.soltarTodo = () => { e.dedo = null; e.dx = 0; e.dy = 0; };
  return e;
}

/* ── pieles ── */

const M_guardado = (() => {
// Lo que se guarda en el teléfono (en try: sin localStorage, el juego anda
// igual sin guardar). Lo leído se valida campo por campo.
const { GLOBOS, ESCUDOS } = M_pieles;
const { NIVELES } = M_niveles;
const CLAVE = 'globo-libre-1';

function base() {
  return {
    abierto: 0,                 // el nivel más alto que se puede jugar (0 a 29; 30 = pasó todos)
    monedas: 0, globo: 'rojo', escudo: 'blanco',
    globos: ['rojo'], escudos: ['blanco'],
    mejorAltura: 0, partidas: 0,
    ajustes: { musica: true, sonido: true, vibrar: true, sensibilidad: 'media', calidad: 'auto', idioma: null },
  };
}

const num = (v, a, b, d) => (Number.isFinite(v) ? Math.max(a, Math.min(b, Math.floor(v))) : d);
const lista = (v, validos, siempre) => [...new Set([siempre, ...(Array.isArray(v) ? v.filter((x) => validos.includes(x)) : [])])];

function validar(d) {
  const b = base();
  if (!d || typeof d !== 'object') return b;
  b.abierto = num(d.abierto, 0, NIVELES, 0);
  b.monedas = num(d.monedas, 0, 1e9, 0);
  b.globos = lista(d.globos, GLOBOS.map((p) => p.id), 'rojo');
  b.escudos = lista(d.escudos, ESCUDOS.map((p) => p.id), 'blanco');
  if (b.globos.includes(d.globo)) b.globo = d.globo;
  if (b.escudos.includes(d.escudo)) b.escudo = d.escudo;
  b.mejorAltura = num(d.mejorAltura, 0, 1e9, 0);
  b.partidas = num(d.partidas, 0, 1e9, 0);
  const a = d.ajustes || {};
  for (const k of ['musica', 'sonido', 'vibrar']) if (typeof a[k] === 'boolean') b.ajustes[k] = a[k];
  if (['baja', 'media', 'alta'].includes(a.sensibilidad)) b.ajustes.sensibilidad = a.sensibilidad;
  if (['auto', 'alta', 'baja'].includes(a.calidad)) b.ajustes.calidad = a.calidad;
  if (['es', 'en', 'pt'].includes(a.idioma)) b.ajustes.idioma = a.idioma;
  return b;
}

function cargar() { try { return validar(JSON.parse(localStorage.getItem(CLAVE))); } catch { return base(); } }
function guardar(d) { try { localStorage.setItem(CLAVE, JSON.stringify(d)); return true; } catch { return false; } }
return { base, validar, cargar, guardar };
})();

const M_hud = (() => {
// Lo que se lee jugando, dibujado en el lienzo: arriba la barra del nivel (con
// un globito que avanza) o la altura en el infinito, y las monedas; abajo, al
// empezar el primer nivel, cómo se juega. `u` es un píxel de CSS en píxeles
// del lienzo (la densidad de la pantalla). La pausa es un botón de HTML.
const { dibujarGlobo, cajaRedonda, estrella } = M_dibujo;
function dibujarHud(g, W, H, { p, u, tr, monedas, pielGlobo, consejo, t, record }) {
  const tema = p.tema(), arriba = 14 * u, fuente = (px, peso = 900) => `${peso} ${Math.round(px * u)}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
  g.textBaseline = 'middle';
  if (!p.infinito) {
    const w = Math.min(W - 150 * u, 300 * u), x = (W - w) / 2, y = arriba + 20 * u, h = 12 * u;
    g.font = fuente(13, 800); g.textAlign = 'center';
    sombreado(g, tr('nivel', p.nivel + 1), W / 2, arriba + 4 * u, '#ffffff', tema.tinta);
    g.fillStyle = 'rgba(0,0,0,0.22)'; cajaRedonda(g, x, y + 2 * u, w, h, h / 2); g.fill();
    g.fillStyle = '#ffffff'; cajaRedonda(g, x, y, w, h, h / 2); g.fill();
    const k = p.progreso();
    if (k > 0) { g.fillStyle = tema.meta; cajaRedonda(g, x + 2 * u, y + 2 * u, Math.max(h - 4 * u, (w - 4 * u) * k), h - 4 * u, (h - 4 * u) / 2); g.fill(); }
    // la bandera de la meta en la punta y el globito que avanza
    g.fillStyle = tema.tinta; g.fillRect(x + w + 4 * u, y - 8 * u, 2 * u, h + 10 * u);
    g.fillStyle = tema.meta; g.beginPath(); g.moveTo(x + w + 6 * u, y - 8 * u); g.lineTo(x + w + 16 * u, y - 4 * u); g.lineTo(x + w + 6 * u, y); g.closePath(); g.fill();
    dibujarGlobo(g, x + (w - 4 * u) * k + 2 * u, y - 2 * u, 7 * u, pielGlobo, t, { hilo: 6 * u });
  } else {
    g.font = fuente(30); g.textAlign = 'center';
    sombreado(g, tr('metros', Math.floor(p.altura() / 10)), W / 2, arriba + 18 * u, '#ffffff', tema.tinta);
    if (record > 0) { g.font = fuente(12, 800); sombreado(g, tr('record', record), W / 2, arriba + 42 * u, '#ffffff', tema.tinta); }
  }
  // las monedas, arriba a la derecha
  const mx = W - 16 * u, my = arriba + 16 * u;
  g.font = fuente(18); g.textAlign = 'right';
  sombreado(g, String(monedas), mx - 22 * u, my + 1 * u, '#ffffff', tema.tinta);
  g.fillStyle = '#e0a800'; g.beginPath(); g.arc(mx - 9 * u, my + 1.5 * u, 9 * u, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(mx - 9 * u, my, 9 * u, 0, Math.PI * 2); g.fill();
  estrella(g, mx - 9 * u, my, 4.5 * u, '#f0b400');
  // cómo se juega: una mano que arrastra, abajo, los primeros segundos
  if (consejo) {
    const a = consejo.alfa, y = H - 70 * u;
    g.globalAlpha = a;
    g.font = fuente(15, 800); g.textAlign = 'center';
    // con el teléfono parado la frase no entra en una línea (se cortaba a los
    // costados): se parte por palabras y crece hacia arriba
    const lineas = [];
    for (const p of consejo.texto.split(' ')) {
      const prueba = lineas.length ? lineas[lineas.length - 1] + ' ' + p : p;
      if (lineas.length && g.measureText(prueba).width <= W - 32 * u) lineas[lineas.length - 1] = prueba;
      else lineas.push(p);
    }
    lineas.forEach((l, k) => sombreado(g, l, W / 2, y - (lineas.length - 1 - k) * 20 * u, '#ffffff', tema.tinta));
    const dx = Math.sin(t * 3) * 40 * u;
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(W / 2 + dx, y + 32 * u, 10 * u, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 3 * u; g.lineCap = 'round';
    g.beginPath(); g.moveTo(W / 2 - 40 * u, y + 32 * u); g.lineTo(W / 2 + 40 * u, y + 32 * u); g.stroke();
    g.lineCap = 'butt';
    g.globalAlpha = 1;
  }
}

// un texto con su sombra plana abajo (se lee arriba de cualquier cielo)
function sombreado(g, txt, x, y, color, sombra) {
  g.fillStyle = sombra; g.globalAlpha *= 0.55; g.fillText(txt, x, y + 2);
  g.globalAlpha /= 0.55; g.fillStyle = color; g.fillText(txt, x, y);
}
return { dibujarHud, sombreado };
})();

/* ── logojxs ── */
const M_logojxs = (() => {
// El logo de JXSTUDIOS, calcado de la imagen que mandó quien pide
// (30/09/2026): el monograma JXS son cuatro trazos de metal del mismo
// ancho, en paralelo de a dos (entre línea y línea, el doble del grosor):
//   - la J de adentro (barra, palo y gancho);
//   - la S de adentro;
//   - A: la barra de arriba de la J que baja en diagonal (el "\" de la X) y
//     abraza la S por abajo;
//   - B: el gancho de abajo de la J que sube en diagonal (el "/" de la X,
//     que pasa POR ENCIMA del "\") y abraza la S por arriba.
// Coordenadas en una caja de 350 × 172. El mismo dibujo sirve para la
// versión de píxeles (se rasteriza chico), la 2D suave (se traza) y la 3D
// (se muestrea la línea y se engorda a los costados).
const CAJA = { w: 350, h: 172 };
const GROSOR = 14.5;

const TRAZOS = [
  // A va abajo en el cruce: se dibuja primero
  { id: 'A', capa: 0, d: [['M', 40, 19], ['L', 114, 19], ['L', 176, 101], ['C', 194, 128, 222, 168, 268, 169], ['C', 310, 170, 342, 152, 342, 122]] },
  { id: 'J', capa: 0, d: [['M', 40, 43], ['L', 98, 43], ['L', 98, 116], ['C', 98, 148, 44, 158, 36, 124]] },
  { id: 'S', capa: 0, d: [['M', 312, 66], ['C', 306, 46, 288, 36, 266, 36], ['C', 242, 36, 226, 48, 226, 63], ['C', 226, 80, 248, 86, 272, 92], ['C', 302, 99, 320, 108, 320, 126], ['C', 320, 142, 300, 148, 272, 148], ['C', 246, 148, 226, 138, 216, 118]] },
  { id: 'B', capa: 1, d: [['M', 10, 130], ['C', 18, 158, 50, 168, 86, 166], ['C', 108, 165, 122, 158, 134, 142], ['L', 200, 46], ['C', 216, 24, 244, 12, 272, 12], ['C', 310, 12, 340, 30, 340, 62]] },
];

// Un trazo como Path2D, escalado y corrido.
function camino2d(t, esc = 1, ox = 0, oy = 0) {
  const p = new Path2D();
  for (const [op, ...n] of t.d) {
    const q = n.map((v, i) => (i % 2 ? oy + v * esc : ox + v * esc));
    if (op === 'M') p.moveTo(q[0], q[1]);
    else if (op === 'L') p.lineTo(q[0], q[1]);
    else p.bezierCurveTo(q[0], q[1], q[2], q[3], q[4], q[5]);
  }
  return p;
}

// Puntos a lo largo del trazo, más o menos parejos (para la 3D, para animar
// el dibujo de la línea y para medir el largo).
function muestrear(t, cada = 3) {
  const pts = [];
  let x = 0, y = 0;
  for (const [op, ...n] of t.d) {
    if (op === 'M') { x = n[0]; y = n[1]; pts.push([x, y]); continue; }
    if (op === 'L') {
      const [x1, y1] = n, largo = Math.hypot(x1 - x, y1 - y), k = Math.max(1, Math.ceil(largo / cada));
      for (let i = 1; i <= k; i++) pts.push([x + ((x1 - x) * i) / k, y + ((y1 - y) * i) / k]);
      x = x1; y = y1; continue;
    }
    const [c1x, c1y, c2x, c2y, x1, y1] = n;
    const aprox = Math.hypot(c1x - x, c1y - y) + Math.hypot(c2x - c1x, c2y - c1y) + Math.hypot(x1 - c2x, y1 - c2y);
    const k = Math.max(2, Math.ceil(aprox / cada));
    for (let i = 1; i <= k; i++) {
      const s = i / k, r = 1 - s;
      pts.push([r * r * r * x + 3 * r * r * s * c1x + 3 * r * s * s * c2x + s * s * s * x1, r * r * r * y + 3 * r * r * s * c1y + 3 * r * s * s * c2y + s * s * s * y1]);
    }
    x = x1; y = y1;
  }
  return pts;
}

function largo(t) {
  const p = muestrear(t, 2);
  let l = 0;
  for (let i = 1; i < p.length; i++) l += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
  return l;
}

// El monograma dibujado en 2D con su metal, en un lienzo aparte (así el
// reflejo, que se pinta "arriba de lo dibujado", toca solo el metal):
// sombra, borde oscuro (que en el cruce hace de hueco y deja ver que B pasa
// por encima), el cuerpo con un degradé de cromo y el filo de luz.
// `avance` (0 a 1) dibuja cada trazo hasta ahí: el metal "se escribe".
// `brillo` (0 a 1) pasa una franja de luz de izquierda a derecha.
function monograma(ancho, { avance = 1, brillo = -1, sombra = true, lienzo = null } = {}) {
  const esc = ancho / CAJA.w, gro = GROSOR * esc, alto = Math.ceil(CAJA.h * esc);

  c.width = Math.ceil(ancho) + 2 * m; c.height = alto + 2 * m;
  const g = c.getContext('2d');

}

    g.font = `900 ${Math.round(px)}px system-ui, -apple-system, "Segoe UI", Roboto, "Arial Black", sans-serif`;
    g.textBaseline = 'middle'; g.textAlign = 'left';
    const anchos = [...txt].map((ch) => g.measureText(ch).width), sep = px * 0.04;
    const total = anchos.reduce((a, b) => a + b, 0) + sep * (txt.length - 1);
    let x = m + ancho / 2 - total / 2;
    [...txt].forEach((ch, i) => {
      const col = LETRAS[(i + desde) % LETRAS.length];
      g.lineJoin = 'round'; g.lineWidth = px * 0.16; g.strokeStyle = '#1d2440';
      g.strokeText(ch, x, y + px * 0.09); g.fillStyle = '#1d2440'; g.fillText(ch, x, y + px * 0.09);
      g.strokeText(ch, x, y); g.fillStyle = tono(col, -0.25); g.fillText(ch, x, y);
      g.fillStyle = col; g.fillText(ch, x, y - px * 0.035);
      x += anchos[i] + sep;
    });
  };
  linea('GLOBO', m + alto * 0.33, alto * 0.36, 0);
  linea('LIBRE', m + alto * 0.7, alto * 0.36, 3);
  c.ancho = ancho; c.margen = m; c.alto = alto;
  cartelC = c;
  return c;
}

class FondoMenu {
  constructor() {
    this.t = 0; this.balanceo = 0; this.vel = 0;
    this.mx = 0; this.my = 0; this.dedoX = null; this.dedoY = null;
    const r = azar(3);
    this.lejanos = Array.from({ length: 7 }, (_, i) => ({ x: r(), y: r(), v: 0.02 + r() * 0.03, r: 5 + r() * 6, color: LETRAS[i % LETRAS.length], fase: r() * 6 }));
    this.arriba = 0;
  }
  // el dedo (o el mouse) sobre el fondo: empuja el cartel e inclina las capas
  mover(x, y, dx) { this.dedoX = x; this.dedoY = y; this.vel += dx * 0.004; }
  empujar(fuerza) { this.vel += fuerza; }
  pasar(dt, W, H) {
    this.t += dt;
    // un péndulo con resorte: vuelve al medio y se va frenando
    this.vel += (-this.balanceo * 7 - this.vel * 1.4) * dt;
    this.balanceo = clamp(this.balanceo + this.vel * dt, -0.5, 0.5);
    let ox = Math.sin(this.t * 0.45) * 0.3, oy = Math.cos(this.t * 0.33) * 0.2;
    if (this.dedoX !== null) { ox += clamp((this.dedoX / W) * 2 - 1, -1, 1) * 0.7; oy += clamp((this.dedoY / H) * 2 - 1, -1, 1) * 0.4; }
    this.mx += (ox - this.mx) * Math.min(1, dt * 3); this.my += (oy - this.my) * Math.min(1, dt * 3);
    this.arriba -= dt * 40;               // el cielo sube despacio (las nubes bajan)
    for (const b of this.lejanos) { b.y -= b.v * dt; if (b.y < -0.1) { b.y = 1.1; b.x = Math.random(); } }
  }

  // `zona`: dónde va el cartel {cx, y, ancho}; `jugador`: el globo y el escudo elegidos (o null)
  dibujar(g, W, H, u, { tema = TEMAS[0], zona, jugador = null } = {}) {
    const esc = Math.max(W, H) / 700;
    dibujarFondo(g, W, H, { esc, ox: this.mx * 20 * u, arriba: this.arriba + this.my * 30 }, { tema, avance: 0.3, t: this.t, suelo: false });
    // globos lejos que suben (chiquitos y claros: están lejos)
    g.globalAlpha = 0.5;
    for (const b of this.lejanos) dibujarGlobo(g, b.x * W + this.mx * 12 * u, b.y * H, b.r * u, { color: b.color }, this.t + b.fase, { hilo: b.r * 3 * u });
    g.globalAlpha = 1;
    if (jugador) {
      // el globo del jugador flota y el escudo le da vueltas
      const { x, y, pielGlobo, pielEscudo } = jugador, r = 26 * u;
      const bx = x + Math.sin(this.t * 0.9) * 8 * u + this.mx * 8 * u, by = y + Math.sin(this.t * 1.7) * 5 * u;
      dibujarGlobo(g, bx, by, r, pielGlobo, this.t, { hilo: 60 * u, inclina: Math.cos(this.t * 0.9) * 0.08 });
      const a = this.t * 1.3, ex = bx + Math.cos(a) * 58 * u, ey = by + Math.sin(a) * 22 * u - 6 * u;
      dibujarEscudo(g, ex, ey, 20 * u, pielEscudo, this.t);
    }
    if (zona) this.dibujarCartel(g, zona.cx + this.mx * 6 * u, zona.y, zona.ancho, u);
  }

  dibujarCartel(g, cx, y, ancho, u) {
    const c = cartel(ancho), ang = this.balanceo + Math.sin(this.t * 1.1) * 0.03;
    const cuelga = ancho * 0.42;                 // del cartel a los globos
    const px = cx, py = y - cuelga;              // el punto de donde cuelga todo
    // los tres globos que lo sostienen (se van un poco para el lado contrario al vaivén)
    const puntas = [-0.34, 0, 0.34].map((k, i) => {
      const lx = k * ancho, ly = cuelga;         // donde se ata el hilo, en el cartel (sin girar)
      const ax = px + Math.cos(ang) * lx - Math.sin(ang) * ly, ay = py + Math.sin(ang) * lx + Math.cos(ang) * ly;
      const gx = px + k * ancho * 1.25 - ang * 40 * u + Math.sin(this.t * 1.3 + i * 2) * 5 * u;
      const gy = py - (i === 1 ? 26 : 8) * u + Math.sin(this.t * 1.6 + i) * 4 * u;
      return { ax, ay, gx, gy, color: ['#ff4d5e', '#ffc93c', '#3d8bff'][i] };
    });
    g.strokeStyle = 'rgba(29,36,64,0.7)'; g.lineWidth = Math.max(1.5, 1.6 * u);
    for (const p of puntas) { g.beginPath(); g.moveTo(p.ax, p.ay); g.quadraticCurveTo((p.ax + p.gx) / 2 + 6 * u, (p.ay + p.gy) / 2, p.gx, p.gy + 30 * u); g.stroke(); }
    for (const p of puntas) dibujarGlobo(g, p.gx, p.gy, 24 * u, { color: p.color }, this.t, { hilo: 0, inclina: -ang * 0.6 });
    // el cartel, girado desde el punto de donde cuelga
    g.save();
    g.translate(px, py); g.rotate(ang);
    g.drawImage(c, -c.width / 2, cuelga - c.margen);
    g.restore();
  }
}
return { FondoMenu };
})();

/* ── sonido ── */
const M_sonido = (() => {
// El sonido, sintetizado con WebAudio (nada de archivos): una marimba
// tranquila para el menú y otra con más ritmo para jugar (progresiones fijas:
// una al azar suena a nada), el "toc" de madera del escudo, la moneda que
// sube de nota si se juntan seguidas, el ¡pum! del globo y la fanfarria de
// la meta. El audio se crea al abrir: si el navegador deja sonar, nace
// andando; si no, arranca con el primer toque (main.js › despertar).
const { T: TI } = M_intro;
const NOTA = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11, Bb: 10, Eb: 3 };
const midi = (n) => { const m = /^([A-G][#b]?)(\d)$/.exec(n); return 12 * (+m[2] + 1) + NOTA[m[1]]; };
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const f = (n) => hz(midi(n));

// acordes (raíz y tipo); bajo, marimba, bombo, palmas y shaker en 16 pasos
const CANCIONES = {
  menu: {
    bpm: 92, acordes: [['C3', 'M7'], ['A2', 'm7'], ['F2', 'M7'], ['G2', 'M']],
    bajo: 'R-------5-----R-', marimba: '0..2..1.3..2..1.', bombo: 'x.......x.......', palmas: '................', shaker: '..x...x...x...x.',
  },
  juego: {
    bpm: 106, acordes: [['F2', 'M'], ['D2', 'm'], ['A#2', 'M'], ['C3', 'M']],
    bajo: 'R..R..O.R..5..O.', marimba: '0.1.2.1.3.2.1.2.', bombo: 'x.....x...x.....', palmas: '....x.......x...', shaker: 'x.x.x.x.x.x.x.x.',
  },
};
const TIPOS = { m: [0, 3, 7, 12], M: [0, 4, 7, 12], m7: [0, 3, 7, 10], M7: [0, 4, 7, 11] };

function crearSonido(ajustes) {
  let ctx = null, maestro, busSfx, busMus, ruido;
  const s = { ajustes, errores: [] };
  let tema = null, proximo = 0, pasoN = 0, reloj = null, ultimaMoneda = -9, racha = 0, ultimoGolpe = 0;

  function iniciar() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    maestro = ctx.createGain(); maestro.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    maestro.connect(comp); comp.connect(ctx.destination);
    busSfx = ctx.createGain(); busSfx.connect(maestro);
    busMus = ctx.createGain(); busMus.connect(maestro);
    // un eco corto en la música: le da aire
    const eco = ctx.createDelay(1), vuelta = ctx.createGain(), sal = ctx.createGain();
    eco.delayTime.value = 0.28; vuelta.gain.value = 0.25; sal.gain.value = 0.22;
    busMus.connect(eco); eco.connect(vuelta); vuelta.connect(eco); eco.connect(sal); sal.connect(maestro);
    const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ruido = b;
    s.aplicar();
    return true;
  }

  function tono({ onda = 'sine', f0, f1 = f0, dur = 0.1, vol = 0.1, t = ctx.currentTime, ataque = 0.005, destino = busSfx }) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = onda;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + ataque);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(destino);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function soplo({ dur = 0.1, vol = 0.1, tipo = 'bandpass', f0 = 1000, f1 = f0, q = 1, t = ctx.currentTime, destino = busSfx }) {
    const n = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = ruido; n.loop = true;
    fl.type = tipo; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(fl); fl.connect(g); g.connect(destino);
    n.start(t, Math.random() * 0.5); n.stop(t + dur + 0.02);
  }
  // una tecla de marimba: el golpe (seno que se apaga rápido) y un armónico de madera
  function marimba(fr, t, vol, destino = busMus, dur = 0.5) {
    tono({ onda: 'sine', f0: fr, dur, vol, t, destino });
    tono({ onda: 'sine', f0: fr * 4, dur: 0.06, vol: vol * 0.25, t, destino });
  }

  const SFX = {
    boton: () => { tono({ onda: 'sine', f0: 700, f1: 1100, dur: 0.07, vol: 0.08 }); soplo({ dur: 0.03, vol: 0.03, f0: 4000, tipo: 'highpass' }); },
    // el escudo contra algo: madera, más fuerte cuanto más fuerte el golpe
    golpe: ({ vel = 300 } = {}) => {
      const t = ctx.currentTime;
      if (t - ultimoGolpe < 0.045) return;
      ultimoGolpe = t;
      const k = Math.min(1, vel / 900);
      tono({ onda: 'triangle', f0: 260 - k * 80, f1: 90, dur: 0.09 + k * 0.05, vol: 0.06 + k * 0.14 });
      soplo({ dur: 0.04, vol: 0.03 + k * 0.05, f0: 1800, q: 1.2 });
    },
    // la moneda: si vienen seguidas, cada una un tono más arriba
    moneda: () => {
      const t = ctx.currentTime;
      racha = t - ultimaMoneda < 1.1 ? Math.min(racha + 1, 12) : 0;
      ultimaMoneda = t;
      const base = 76 + [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28][racha];
      tono({ onda: 'sine', f0: hz(base), dur: 0.09, vol: 0.09 });
      tono({ onda: 'sine', f0: hz(base + 7), dur: 0.22, vol: 0.08, t: t + 0.06 });
      tono({ onda: 'triangle', f0: hz(base + 19), dur: 0.12, vol: 0.02, t: t + 0.06 });
    },
    pum: () => {
      soplo({ dur: 0.09, vol: 0.5, tipo: 'highpass', f0: 1200 });
      soplo({ dur: 0.35, vol: 0.18, tipo: 'lowpass', f0: 3000, f1: 300 });
      tono({ onda: 'sine', f0: 150, f1: 45, dur: 0.3, vol: 0.35 });
      tono({ onda: 'triangle', f0: 900, f1: 180, dur: 0.35, vol: 0.06, t: ctx.currentTime + 0.05 });
    },
    meta: () => {
      const t = ctx.currentTime;
      ['C5', 'E5', 'G5', 'C6'].forEach((n, k) => marimba(f(n), t + k * 0.09, 0.12, busSfx, 0.6));
      for (const n of ['C4', 'E4', 'G4', 'B4']) tono({ onda: 'triangle', f0: f(n), dur: 1.3, vol: 0.04, t: t + 0.36, ataque: 0.05 });
      for (let k = 0; k < 6; k++) tono({ onda: 'sine', f0: f('C7') * (1 + k * 0.12), dur: 0.1, vol: 0.025, t: t + 0.4 + k * 0.05 });
    },
    // viene algo cayendo: un soplido que baja y dos pitidos
    lluvia: () => {
      const t = ctx.currentTime;
      soplo({ dur: 0.45, vol: 0.1, f0: 3500, f1: 500, q: 1.5 });
      tono({ onda: 'square', f0: 880, dur: 0.06, vol: 0.025, t }); tono({ onda: 'square', f0: 880, dur: 0.06, vol: 0.025, t: t + 0.12 });
    },
    pendulo: () => soplo({ dur: 0.5, vol: 0.08, f0: 300, f1: 900, q: 2 }),
    compra: () => { const t = ctx.currentTime; tono({ onda: 'sine', f0: f('E6'), dur: 0.1, vol: 0.08, t }); tono({ onda: 'sine', f0: f('A6'), dur: 0.3, vol: 0.08, t: t + 0.08 }); soplo({ dur: 0.2, vol: 0.05, f0: 6000, tipo: 'highpass', t: t + 0.08 }); },
    error: () => { tono({ onda: 'triangle', f0: 190, dur: 0.1, vol: 0.1 }); tono({ onda: 'triangle', f0: 150, dur: 0.14, vol: 0.1, t: ctx.currentTime + 0.1 }); },
    cambia: () => { soplo({ dur: 0.12, vol: 0.05, f0: 1500, f1: 4000 }); tono({ onda: 'sine', f0: 660, f1: 990, dur: 0.1, vol: 0.05 }); },
  };

  function programar() {
    if (!tema || !ctx) return;
    const c = CANCIONES[tema], d = 60 / c.bpm / 4;
    if (proximo < ctx.currentTime - 0.3) proximo = ctx.currentTime + 0.05;
    try {
      while (proximo < ctx.currentTime + 0.12) { paso(c, pasoN, proximo, d); proximo += d; pasoN++; }
    } catch (e) { s.errores.push('música ' + tema + ': ' + e.message); tema = null; }
  }
  function paso(c, n, t, d) {
    const p = n % 16, compas = Math.floor(n / 16) % c.acordes.length;
    const [raizN, tipo] = c.acordes[compas], raiz = midi(raizN), ac = TIPOS[tipo];
    const b = c.bajo[p];
    if (b !== '.' && b !== '-') {
      let l = 1; while (c.bajo[p + l] === '-') l++;
      const nota = raiz + (b === 'O' ? 12 : b === '5' ? 7 : 0);
      tono({ onda: 'triangle', f0: hz(nota), dur: d * l * 0.9, vol: 0.18, t, destino: busMus, ataque: 0.01 });
    }
    const m = c.marimba[p];
    if (m !== '.') marimba(hz(raiz + 24 + ac[+m]), t, 0.06);
    // el colchón del acorde al empezar cada compás
    if (p === 0) for (const k of ac.slice(0, 3)) tono({ onda: 'triangle', f0: hz(raiz + 12 + k), dur: d * 15, vol: 0.018, t, ataque: 0.3, destino: busMus });
    if (c.bombo[p] === 'x') tono({ onda: 'sine', f0: 120, f1: 45, dur: 0.15, vol: 0.22, t, destino: busMus });
    if (c.palmas[p] === 'x') { soplo({ dur: 0.08, vol: 0.05, f0: 1500, q: 0.9, t, destino: busMus }); soplo({ dur: 0.06, vol: 0.04, f0: 1500, q: 0.9, t: t + 0.012, destino: busMus }); }
    if (c.shaker[p] === 'x') soplo({ dur: 0.035, vol: 0.014, tipo: 'highpass', f0: 7000, t, destino: busMus });
  }

  s.despertar = () => {
    if (!ctx && !iniciar()) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (!reloj) reloj = setInterval(programar, 25);
  };
  s.tocar = (nombre, op) => {
    if (!ctx || !ajustes.sonido || ctx.state !== 'running') return;
    if (!SFX[nombre]) { s.errores.push('no existe ' + nombre); return; }
    try { SFX[nombre](op); } catch (e) { s.errores.push(nombre + ': ' + e.message); }
  };
  s.musica = (nombre) => {
    if (s.cancion === nombre) return;
    s.cancion = nombre; tema = CANCIONES[nombre] ? nombre : null; pasoN = 0;
    if (ctx) proximo = ctx.currentTime + 0.05;
  };
  s.aplicar = () => {
    if (!ctx) return;
    busSfx.gain.setTargetAtTime(ajustes.sonido ? 0.9 : 0, ctx.currentTime, 0.02);
    busMus.gain.setTargetAtTime(ajustes.musica ? 0.5 : 0, ctx.currentTime, 0.05);
  };
  s.lava = (v) => { if (ctx) maestro.gain.setTargetAtTime(v, ctx.currentTime, 0.05); };
  // La música de la intro de JXSTUDIOS, con los tiempos de intro.js › T:
  // tres soplidos (los barridos), la marimba que sube mientras el escudo
  // escribe, el silbato del globo que sube, el ¡boing! del choque con un
  // acorde brillante, un pop por letra y un acorde tibio para cerrar.
  s.jingleJXS = () => {
    // con el audio suspendido (sin un toque) se agendaría y sonaría tarde, fuera de fase
    if (!ctx || ctx.state !== 'running' || !(ajustes.sonido || ajustes.musica)) return null;
    const bus = ctx.createGain(); bus.gain.value = 1; bus.connect(maestro);
    const t0 = ctx.currentTime + 0.03;
    [0, 0.09, 0.18].forEach((dd, k) => soplo({ dur: 0.28, vol: 0.09, f0: 600 + k * 400, f1: 4000 + k * 1500, q: 1.1, t: t0 + dd, destino: bus }));
    const escala = ['C5', 'D5', 'E5', 'G5', 'A5', 'C6', 'D6', 'E6', 'G6', 'A6'];
    escala.forEach((n, k) => marimba(f(n), t0 + TI.traza[0] + (k * (TI.traza[1] - TI.traza[0])) / escala.length, 0.08, bus, 0.4));
    tono({ onda: 'sine', f0: 320, f1: 1150, dur: TI.golpe - TI.sube[0], vol: 0.06, t: t0 + TI.sube[0], ataque: 0.03, destino: bus });
    const tg = t0 + TI.golpe;
    tono({ onda: 'sine', f0: 130, f1: 42, dur: 0.3, vol: 0.4, t: tg, destino: bus });
    tono({ onda: 'sine', f0: 560, f1: 240, dur: 0.18, vol: 0.12, t: tg, destino: bus });
    tono({ onda: 'sine', f0: 420, f1: 300, dur: 0.22, vol: 0.08, t: tg + 0.16, destino: bus });
    ['C5', 'E5', 'G5', 'C6', 'E6'].forEach((n, k) => marimba(f(n), tg + 0.03 + k * 0.025, 0.07, bus, 0.7));
    for (let k = 0; k < 9; k++) tono({ onda: 'sine', f0: 880 + k * 70, dur: 0.05, vol: 0.035, t: t0 + TI.letras + k * 0.045 + 0.08, destino: bus });
    soplo({ dur: 0.12, vol: 0.25, tipo: 'highpass', f0: 1500, t: t0 + TI.fin, destino: bus });
    for (const n of ['C4', 'E4', 'G4', 'B4', 'D5']) tono({ onda: 'triangle', f0: f(n), dur: 1.4, vol: 0.04, t: t0 + TI.fin, ataque: 0.06, destino: bus });
    return { cortar: () => bus.gain.setTargetAtTime(0, ctx.currentTime, 0.06) };
  };
  s.activo = () => !!ctx && ctx.state === 'running';
  return s;
}

})();
