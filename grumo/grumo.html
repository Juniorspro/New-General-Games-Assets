<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6b4a30">
<meta name="description" content="Grumo, de JXSTUDIOS: un grumo de plastilina que solo quiere llegar a la puerta. El animador hace trampa.">
<title>Grumo</title>
<style>
/* El juego se dibuja en el lienzo; los menús son HTML encima. De
   plastilina, como el juego: botones que son pedazos amasados (las puntas
   desparejas, el labio de luz arriba, la panza en sombra, las huellas
   digitales encima) y que se aplastan cuando se los toca. Las huellas son
   una imagen que arma main.js al arrancar (--huellas). */
:root {
  --tinta: #3a2616;
  --crema: #f6ecd8;
  --madera: #8a5a36; --madera-osc: #5e3b22;
  --rojo: #e4553f; --naranja: #f28a2e; --amarillo: #f2c230; --verde: #48b06f; --azul: #4f95e8; --rosa: #f394bd; --violeta: #9d78de;
  --letra: ui-rounded, "Arial Rounded MT Bold", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sombra: 0 6px 0 rgba(40, 20, 5, 0.35), 0 10px 18px rgba(20, 10, 0, 0.35);
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: #6b4a30; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; font-family: var(--letra); color: var(--tinta); }
#juego { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
#sonda, #sondaAbajo { position: absolute; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none; }
#sonda { top: env(safe-area-inset-top, 0px); }
#sondaAbajo { bottom: env(safe-area-inset-bottom, 0px); }
#ui { position: absolute; inset: 0; pointer-events: none; }
.pantalla {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 1.6vh, 14px);
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box;
  pointer-events: auto; text-align: center;
}
/* en el menú, lo que no es botón deja pasar el dedo al lienzo (se empujan las letras y se hace saltar a Grumo) */
.pantalla.pasante { pointer-events: none; }
.pantalla.pasante button, .pantalla.pasante .bolsa, .pantalla.pasante .tarjeta { pointer-events: auto; }
.pantalla.oculto, .oculto { display: none !important; }
.velo { background: rgba(30, 16, 6, 0.5); }
h2 { margin: 0; font-size: clamp(24px, 4.4vh, 34px); font-weight: 900; color: #fff; letter-spacing: 0.02em; text-shadow: 0 3px 0 var(--tinta); }
h2.grande { font-size: clamp(30px, 6vh, 44px); }

/* la plastilina en CSS: color, huellas, el labio de luz y la panza en sombra */
.plasti {
  background-color: var(--c, var(--rojo));
  background-image: var(--huellas, none), radial-gradient(130% 95% at 28% 18%, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 55%), linear-gradient(rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.14));
  background-size: 140px 140px, 100% 100%, 100% 100%;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.32), inset 0 -6px 0 rgba(0, 0, 0, 0.16), inset 5px 0 8px rgba(255, 255, 255, 0.1), inset -5px 0 8px rgba(0, 0, 0, 0.1), var(--sombra);
}
h2.tira {
  --c: var(--crema); color: var(--tinta); text-shadow: none; padding: 8px 26px 10px; transform: rotate(-1.5deg);
  border-radius: 20px 16px 22px 14px / 16px 22px 14px 20px;
  background-color: var(--c);
  background-image: var(--huellas, none), radial-gradient(130% 95% at 28% 18%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 55%);
  background-size: 140px 140px, 100% 100%;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.5), inset 0 -5px 0 rgba(0, 0, 0, 0.1), var(--sombra);
}

.boton {
  all: unset; cursor: pointer; box-sizing: border-box; font-weight: 900; letter-spacing: 0.03em; text-align: center; position: relative;
  color: #fff; text-shadow: 0 2px 0 rgba(40, 20, 5, 0.35);
  border-radius: 30px 24px 32px 22px / 24px 32px 22px 30px;
  --c: var(--rojo);
  background-color: var(--c);
  background-image: var(--huellas, none), radial-gradient(130% 95% at 28% 18%, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 55%), linear-gradient(rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.14));
  background-size: 140px 140px, 100% 100%, 100% 100%;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.32), inset 0 -6px 0 rgba(0, 0, 0, 0.16), inset 5px 0 8px rgba(255, 255, 255, 0.1), inset -5px 0 8px rgba(0, 0, 0, 0.1), var(--sombra);
  transform: rotate(-1deg);
  transition: transform 0.07s ease, box-shadow 0.07s ease; -webkit-tap-highlight-color: transparent; display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
}
.boton:nth-child(even) { transform: rotate(1deg); border-radius: 24px 32px 22px 30px / 30px 22px 32px 24px; }
/* se aplasta: es plastilina */
.boton:active { transform: translateY(4px) scale(1.03, 0.93); box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.3), inset 0 -3px 0 rgba(0, 0, 0, 0.16), 0 2px 0 rgba(40, 20, 5, 0.35), 0 4px 8px rgba(20, 10, 0, 0.3); }
.boton:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.boton.principal { min-width: min(72vw, 290px); padding: 14px 28px 15px; font-size: clamp(22px, 3.8vh, 30px); --c: var(--rojo); }
.boton.principal small { font-size: 0.46em; font-weight: 800; opacity: 0.95; letter-spacing: 0.04em; margin-top: 3px; }
.boton.chico { min-width: min(36vw, 146px); padding: 12px 14px; font-size: clamp(14px, 2.3vh, 18px); --c: var(--madera); }
.boton.azul { --c: var(--azul); }
.boton.verde { --c: var(--verde); }
.boton.amarillo { --c: var(--amarillo); color: var(--tinta); text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
.boton.madera { --c: var(--madera); }
.boton.apagado { filter: grayscale(0.7) brightness(0.9); }
.fila { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

.titulo-idioma { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 6px; }
.titulo-idioma small { font-size: clamp(13px, 2vh, 16px); font-weight: 800; color: #fff; opacity: 0.92; text-shadow: 0 2px 0 var(--tinta); letter-spacing: 0.01em; }

/* el menú y el idioma: el set lo dibuja el lienzo arriba; los botones van abajo, sobre la mesa */
#menu, #idiomas { justify-content: flex-end; padding-bottom: max(34px, env(safe-area-inset-bottom)); }
.botonera { display: flex; flex-direction: column; align-items: center; gap: clamp(9px, 1.5vh, 14px); }
.bolsa {
  position: absolute; top: max(12px, env(safe-area-inset-top)); right: 14px; display: flex; align-items: center; gap: 7px;
  --c: var(--crema); background-color: var(--c); border-radius: 18px 14px 20px 12px / 14px 20px 12px 18px; padding: 6px 13px 6px 8px; font-weight: 900; font-size: 18px; transform: rotate(2deg);
  background-image: var(--huellas, none); background-size: 140px 140px;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 0 -4px 0 rgba(0, 0, 0, 0.1), var(--sombra);
}
.bolsa.izq { right: auto; left: 14px; transform: rotate(-2deg); }
.bolita { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff4c8 0 16%, #f2a64a 20% 62%, #c96d1c 100%); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); display: inline-block; }
.claquetita { width: 22px; height: 18px; display: inline-block; background: linear-gradient(#26262b 0 32%, transparent 32%), repeating-linear-gradient(120deg, #26262b 0 4px, #f4f1ea 4px 8px) top / 100% 32% no-repeat, #26262b; border-radius: 3px; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); }
.dato { margin: 0; font-weight: 900; color: var(--tinta); font-size: clamp(15px, 2.4vh, 19px); }
.dato:empty { display: none; }
.dato.oro { color: #b3610c; }
.dato.nuevo { color: #2f7d4c; }
.firma { position: absolute; bottom: max(10px, env(safe-area-inset-bottom)); margin: 0; font-size: 11px; letter-spacing: 0.2em; color: rgba(255, 240, 220, 0.8); font-weight: 900; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.4); }

/* los tres sets */
.lista-sets { display: flex; flex-direction: column; gap: 14px; width: min(88vw, 380px); }
.set {
  all: unset; cursor: pointer; box-sizing: border-box; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; text-align: left; color: #fff; position: relative;
  border-radius: 26px 20px 28px 18px / 20px 28px 18px 26px;
  background-color: var(--c);
  background-image: var(--huellas, none), radial-gradient(130% 95% at 28% 18%, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0) 55%), linear-gradient(rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.16));
  background-size: 140px 140px, 100% 100%, 100% 100%;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.3), inset 0 -6px 0 rgba(0, 0, 0, 0.16), var(--sombra);
}
.set:nth-child(1) { transform: rotate(-1.2deg); } .set:nth-child(2) { transform: rotate(1deg); } .set:nth-child(3) { transform: rotate(-0.6deg); }
.set:active { transform: translateY(3px) scale(1.01, 0.96); }
.set-taller { --c: #45a574; } .set-cocina { --c: #5f8fd6; } .set-noche { --c: #9b5fa8; }
.set.cerrado { filter: grayscale(0.6) brightness(0.8); cursor: default; }
.nombre-set { font-size: clamp(20px, 3.2vh, 26px); font-weight: 900; text-shadow: 0 2px 0 rgba(40, 20, 5, 0.4); }
.dato-set { font-size: 15px; font-weight: 800; opacity: 0.95; }

/* las diez escenas de un set: cuadraditos de plastilina */
.grilla { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; width: min(92vw, 420px); padding: 6px; box-sizing: border-box; }
.nivelB {
  all: unset; cursor: pointer; aspect-ratio: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: var(--tinta);
  border-radius: 18px 14px 20px 12px / 14px 20px 12px 18px; --c: var(--crema);
  background-color: var(--c); background-image: var(--huellas, none), radial-gradient(130% 95% at 28% 18%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 55%);
  background-size: 140px 140px, 100% 100%;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.5), inset 0 -5px 0 rgba(0, 0, 0, 0.1), var(--sombra);
}
.nivelB:nth-child(odd) { transform: rotate(-2deg); } .nivelB:nth-child(even) { transform: rotate(1.5deg); }
.nivelB .num { font-weight: 900; font-size: clamp(18px, 3vh, 24px); }
.nivelB .est { font-size: 11px; font-weight: 800; color: #8a6a48; min-height: 13px; }
.nivelB.hecho { --c: #fff4d0; }
.nivelB.unica .est { color: #c0780e; }
.nivelB.cerrado { --c: #b9a78e; color: #7d6a55; cursor: default; }
.nivelB:active { transform: translateY(2px) scale(1.02, 0.95); }
.nivelB:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* el camarín */
#camarin { justify-content: space-between; padding-top: max(62px, env(safe-area-inset-top)); }
.pestanas { display: flex; gap: 6px; --c: var(--crema); background-color: var(--c); background-image: var(--huellas, none); background-size: 140px 140px; border-radius: 18px; padding: 5px; box-shadow: var(--sombra); transform: rotate(-1deg); }
.pestana { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 14px; font-weight: 900; font-size: clamp(14px, 2.2vh, 17px); color: var(--tinta); }
.pestana.elegida { background: var(--azul); color: #fff; text-shadow: 0 2px 0 rgba(40, 20, 5, 0.3); }
.flechas { display: flex; align-items: center; justify-content: space-between; width: min(96vw, 520px); flex: 1; }
.flechas .hueco { flex: 1; }
.flecha {
  all: unset; cursor: pointer; width: 58px; height: 56px; font-size: 40px; line-height: 50px; text-align: center; font-weight: 900; color: #fff; box-sizing: border-box;
  border-radius: 30px 26px 30px 24px / 26px 30px 24px 30px; --c: var(--azul); background-color: var(--c);
  background-image: var(--huellas, none), radial-gradient(130% 95% at 28% 18%, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0) 55%);
  background-size: 140px 140px, 100% 100%;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.32), inset 0 -6px 0 rgba(0, 0, 0, 0.16), var(--sombra);
}
.flecha:active { transform: translateY(3px) scale(1.04, 0.92); }
.nombre { margin: 0; font-size: clamp(22px, 3.6vh, 28px); font-weight: 900; color: #fff; text-shadow: 0 3px 0 var(--tinta); }
.aviso { margin: 0; min-height: 1.2em; font-weight: 800; color: #fff; text-shadow: 0 2px 0 var(--tinta); }

.lista { display: grid; gap: 8px; width: min(92vw, 440px); --c: var(--crema); background-color: var(--c); background-image: var(--huellas, none); background-size: 140px 140px; box-shadow: var(--sombra); padding: 14px; border-radius: 22px 18px 24px 16px / 18px 24px 16px 22px; box-sizing: border-box; transform: rotate(0.6deg); }
.lista .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 800; }
.lista .ops { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.opcion { all: unset; cursor: pointer; padding: 6px 11px; border-radius: 12px; font-weight: 900; font-size: 13px; color: var(--tinta); }
.opcion.elegida { background: var(--azul); color: #fff; }
.opcion.peligro { color: var(--rojo); }

/* la tarjeta de la pausa y del final: una placa de plastilina crema */
.tarjeta {
  display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.5vh, 13px); padding: 26px 22px 22px; position: relative; width: min(86vw, 360px); box-sizing: border-box;
  --c: var(--crema); background-color: var(--c); border-radius: 30px 24px 34px 22px / 24px 34px 22px 30px;
  background-image: var(--huellas, none), radial-gradient(130% 95% at 28% 18%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 55%), linear-gradient(rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.08));
  background-size: 140px 140px, 100% 100%, 100% 100%;
  box-shadow: inset 0 4px 0 rgba(255, 255, 255, 0.55), inset 0 -8px 0 rgba(0, 0, 0, 0.08), 0 8px 0 rgba(40, 20, 5, 0.3), 0 18px 30px rgba(20, 10, 0, 0.4);
  transform: rotate(-1.2deg);
  animation: cae 0.33s steps(4, end);
}
.tarjeta h2 { color: var(--rojo); text-shadow: 0 3px 0 rgba(40, 20, 5, 0.22); }
/* adentro de la tarjeta (que ya está torcida) los botones van derechos: torcidos dos veces se pisaban */
.tarjeta .boton, .tarjeta .boton:nth-child(even) { transform: none; }
.tarjeta .boton:active { transform: translateY(3px) scale(1.02, 0.94); }
/* entra de a cuadros (stop motion): steps y no una curva suave */
@keyframes cae { 0% { transform: translateY(-60px) rotate(-7deg) scale(1.1, 0.9); opacity: 0; } 50% { transform: translateY(8px) rotate(1deg) scale(1.06, 0.92); opacity: 1; } }
.tarjeta.final { width: min(88vw, 400px); }

/* pausa mientras se juega: un botón redondo de plastilina arriba a la izquierda */
.redondo {
  all: unset; position: absolute; top: max(10px, env(safe-area-inset-top)); width: 46px; height: 46px; pointer-events: auto; cursor: pointer; box-sizing: border-box; color: var(--tinta);
  display: flex; align-items: center; justify-content: center; border-radius: 24px 22px 25px 21px / 22px 25px 21px 24px;
  --c: var(--crema); background-color: var(--c); background-image: var(--huellas, none); background-size: 140px 140px;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), inset 0 -4px 0 rgba(0, 0, 0, 0.1), var(--sombra);
}
.arriba-izq { left: 12px; }
.redondo .barras { display: flex; gap: 5px; }
.redondo .barras span { width: 6px; height: 16px; background: var(--tinta); border-radius: 3px; }
.redondo:active { transform: translateY(2px) scale(1.04, 0.94); }

/* más ancha que alta (el teléfono acostado, la compu): los botones del menú a
   la derecha; a la izquierda, el set (lo dibuja el lienzo). Es la misma
   cuenta que main.js › acostado (W > H × 1,1). */
@media (min-aspect-ratio: 11/10) {
  #menu, #idiomas { align-items: flex-end; justify-content: center; padding-right: max(24px, env(safe-area-inset-right)); padding-bottom: max(26px, env(safe-area-inset-bottom)); }
  .botonera { width: min(40vw, 460px); }
  #idiomas .boton.principal, #menu .boton.principal { min-width: 0; width: 100%; }
  .firma { right: max(24px, env(safe-area-inset-right)); width: min(40vw, 460px); }
}
/* acostado y bajo: todo más apretado */
@media (orientation: landscape) and (max-height: 560px) {
  .boton.principal { padding: 9px 20px; }
  .grilla { grid-template-columns: repeat(10, 1fr); width: min(86vw, 720px); gap: 8px; }
  .lista-sets { flex-direction: row; width: min(94vw, 760px); }
  .set { flex: 1; }
  #camarin { padding-top: max(12px, env(safe-area-inset-top)); gap: 6px; }
  .flechas { width: min(70vw, 520px); }
  .boton.chico { padding: 8px 12px; }
  .tarjeta { padding: 16px 20px; gap: 6px; }
}
@media (max-width: 360px) { .boton.chico { min-width: 40vw; padding: 10px 8px; } }
@media (prefers-reduced-motion: reduce) { .boton, .tarjeta { transition: none; animation: none; } }

</style>
</head>
<body>
<canvas id="juego" aria-label="Grumo"></canvas>
<!-- las sondas miden la muesca y la barra de abajo del teléfono (main.js › medirTodo) -->
<div id="sonda" aria-hidden="true"></div>
<div id="sondaAbajo" aria-hidden="true"></div>
<div id="ui">
  <!-- la primera vez, después del logo: el idioma (el título va en los tres) -->
  <section id="idiomas" class="pantalla pasante oculto">
    <div id="idiomasBotones" class="botonera">
      <h2 class="titulo-idioma">Elegí tu idioma<small lang="en">Choose your language</small><small lang="pt">Escolha seu idioma</small></h2>
      <button id="bIdioma_es" class="boton principal" lang="es">Español</button>
      <button id="bIdioma_en" class="boton principal azul" lang="en">English</button>
      <button id="bIdioma_pt" class="boton principal verde" lang="pt">Português</button>
    </div>
  </section>

  <section id="menu" class="pantalla pasante oculto">
    <div class="bolsa"><span class="bolita" aria-hidden="true"></span><span id="tMonedas">0</span></div>
    <div class="bolsa izq"><span class="claquetita" aria-hidden="true"></span><span id="tTomasMenu">0</span></div>
    <div id="botonera" class="botonera">
      <button id="bJugar" class="boton principal"><span id="tJugar"></span><small id="tNivelJugar"></small></button>
      <div class="fila">
        <button id="bEscenas" class="boton chico azul"></button>
        <button id="bCamarin" class="boton chico amarillo"></button>
      </div>
      <button id="bAjustes" class="boton chico madera"></button>
    </div>
    <p id="tFirma" class="firma"></p>
  </section>

  <section id="escenas" class="pantalla oculto">
    <div class="bolsa"><span class="bolita" aria-hidden="true"></span><span id="tMonedasEscenas">0</span></div>
    <h2 id="tEscenas" class="tira"></h2>
    <div id="listaSets" class="lista-sets"></div>
    <button id="bVolverEscenas" class="boton chico madera"></button>
  </section>

  <section id="niveles" class="pantalla oculto">
    <h2 id="tNiveles" class="tira"></h2>
    <div id="grillaNiveles" class="grilla"></div>
    <button id="bVolverNiveles" class="boton chico madera"></button>
  </section>

  <section id="camarin" class="pantalla oculto">
    <div class="bolsa"><span class="bolita" aria-hidden="true"></span><span id="tMonedasCamarin">0</span></div>
    <div class="pestanas" role="tablist">
      <button id="bPestPieles" class="pestana" role="tab"></button>
      <button id="bPestSombreros" class="pestana" role="tab"></button>
    </div>
    <div class="flechas">
      <button id="bAnterior" class="flecha" aria-label="anterior">‹</button>
      <div class="hueco"></div>
      <button id="bSiguiente" class="flecha" aria-label="siguiente">›</button>
    </div>
    <p id="tNombre" class="nombre"></p>
    <p id="tAviso" class="aviso"></p>
    <button id="bComprar" class="boton principal"></button>
    <button id="bVolverCamarin" class="boton chico madera"></button>
  </section>

  <section id="ajustes" class="pantalla oculto">
    <h2 id="tAjustes" class="tira"></h2>
    <div id="listaAjustes" class="lista"></div>
    <button id="bCerrarAjustes" class="boton principal"></button>
  </section>

  <button id="bPausa" class="redondo arriba-izq oculto" aria-label="pausa"><span class="barras"><span></span><span></span></span></button>

  <section id="pausa" class="pantalla velo oculto">
    <div class="tarjeta">
      <h2 id="tPausa"></h2>
      <button id="bSeguir" class="boton principal"></button>
      <button id="bReiniciarPausa" class="boton chico azul"></button>

<script>
/* ── util ── */
const M_util = (() => {
// Lo chico: azar con semilla, límites, curvas y el paso del cuadro.

// mulberry32: el azar va con semilla, así la plastilina de un nivel es
// siempre la misma (y una prueba se puede repetir igual).
function azar(semilla) {
  let a = semilla >>> 0;
  const r = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.entre = (a, b) => a + (b - a) * r();
  r.entero = (a, b) => Math.floor(a + (b - a + 1) * r());
  r.uno = (lista) => lista[Math.floor(r() * lista.length)];
  return r;
}
// un número al azar fijo para (a, b, c): el "hervor" de la plastilina cambia
// de cuadro en cuadro pero el cuadro 7 es siempre igual
function hash(a, b = 0, c = 0) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1103515245);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

const lerp = (a, b, t) => a + (b - a) * t;
const tramo = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const salida = (t) => 1 - (1 - t) ** 3;
const entrada = (t) => t * t;
const suave = (t) => t * t * (3 - 2 * t);
const salidaAtras = (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2;
// un rebote elástico que se pasa y vuelve (para lo que "salta" a la vista)
const elastico = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 2 ** (-10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1);
const acercar = (x, obj, vel, dt) => x + (obj - x) * (1 - Math.exp(-vel * dt));

const hacia = (x, obj, paso) => (x < obj ? Math.min(obj, x + paso) : Math.max(obj, x - paso));

// El tiempo real de un cuadro partido en pasos de a lo sumo `max`: [cuántos,
// de cuánto]. Con pasos fijos y una pantalla de 90 o 120 Hz, algunos cuadros
// quedan sin moverse y se ve a tirones (pasó en Víbora).

// Un color más claro o más oscuro (f entre -1 y 1).

/* ── efectos ── */
const M_efectos = (() => {
// Las partículas, también de plastilina y también a 12 cuadros: migas que
// saltan cuando Grumo se aplasta o un bloque se desarma, polvo al caer
// fuerte, estrellitas al llegar a la puerta y el "puf" de lo que aparece o
// desaparece. Se mueven solo en los cuadros del mundo (de a saltitos).

  constructor() { this.cosas = []; this.r = azar(4242); this.reloj = 0; }

    const r = this.r;

    }
  }

    const r = this.r;
    for (let k = 0; k < n; k++) this.cosas.push({ tipo: 'polvo', x: x + (r() - 0.5) * ancho, y, vx: (r() - 0.5) * 2.4, vy: -r() * 0.8, t: 0, vida: 0.4 + r() * 0.2, tam: 0.12 + r() * 0.1 });
  }

    const r = this.r;
    for (let k = 0; k < 7; k++) { const a = (k / 7) * Math.PI * 2 + r() * 0.3; this.cosas.push({ tipo: 'polvo', x: x + Math.cos(a) * tam * 0.3, y: y + Math.sin(a) * tam * 0.3, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, t: 0, vida: 0.35, tam: tam * 0.35, color }); }
  }
  chispas(x, y, n = 10) {
    const r = this.r;
    for (let k = 0; k < n; k++) { const a = r() * Math.PI * 2, v = 2 + r() * 3; this.cosas.push({ tipo: 'chispa', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, t: 0, vida: 0.7 + r() * 0.3, tam: 0.12 + r() * 0.08, color: ['#ffd24a', '#ffffff', '#ff9ec4'][k % 3] }); }

})();

/* ── entrada ── */
const M_entrada = (() => {

// flecha arriba para saltar) y, en el teléfono, tres botones de plastilina
// abajo: izquierda y derecha con el pulgar izquierdo, saltar con el
// derecho. Cada dedo va por su id: se puede correr y saltar a la vez, y
// deslizar el pulgar de una flecha a la otra sin levantarlo.

    activo: false, teclas: new Set(), dedos: new Map(), zonas: null, usos: 0, tactil: false,
    empujes: [],                       // arrastres del dedo en el menú (empujan el título)
  };
  addEventListener('keydown', (ev) => {
    if (![...IZQ, ...DER, ...SALTO].includes(ev.code)) return;
    if (e.activo) { ev.preventDefault(); e.usos++; }
    e.teclas.add(ev.code);
  });

  addEventListener('blur', () => { e.teclas.clear(); e.dedos.clear(); });

  // (el pulgar no apunta: cae más o menos ahí)
  function boton(x, y) {
    const z = e.zonas;
    if (!z || y < z.techo) return null;
    if (x >= z.corte) return 'salto';
    return x < z.medio ? 'izq' : 'der';

    ultimo = { x: ev.clientX, y: ev.clientY };

    ev.preventDefault();

    const b = boton(ev.clientX, ev.clientY);

    e.dedos.set(ev.pointerId, b);

  e.leer = () => {

})();

/* ── partida ── */
const M_partida = (() => {
// Un nivel jugándose: Grumo, la plastilina del set y lo que el animador le
// hace (las trampas). Sin DOM: la usan el juego, el resolvedor y las pruebas
// en Node.
//
// Grumo se mueve a 120 pasos por segundo (el control tiene que responder
// al toque); el mundo — bloques que caen o se corren, pinches que salen, la
// mano del animador, la puerta, las bolas — se mueve de a cuadros, 12 por
// segundo, como en el stop motion. Lo que se ve es exactamente lo que choca:
// no hay un bloque "dibujado acá" que en realidad ya está más abajo.
//
// Unidades: baldosas. El escenario es de 10 × 15, con y para abajo; Grumo
// se ubica por los pies (x al medio, y abajo). Los costados y el techo del
// escenario son paredes; abajo, el que se cae se muere.
const { clamp, lerp, suave, salida, entrada } = M_util;
const COLS = 10;
const FILAS = 15;
const PASO = 1 / 120;
// pasos de física por cuadro del mundo: 12 cuadros por segundo
const CUADRO = 10;
// la caja de choque de Grumo: un poco más chica que el dibujo (perdona los roces)
const ANCHO = 0.6;
const ALTO = 0.7;
// correr y saltar, en baldosas y segundos: sube 2,6 baldosas y corriendo
// cruza casi 4 (se mide en pruebas/logica.mjs)
const FIS = {
  vmax: 5.6, acelSuelo: 70, frenoSuelo: 85, acelAire: 45, frenoAire: 22,
  g: 42, gCaida: 47, salto: 14.8, corte: 0.45, caidaMax: 17,
  coyote: 0.09, buffer: 0.12, resorte: 20.5,

const MANO = { aviso: 0.35, entra: 0.33, agarra: 0.12, lleva: 0.5, suelta: 0.12, sale: 0.33 };
const TOL = 0.04;                   // lo que se tolera de encimado antes de contar un aplastado
// al mover en un eje, la caja se achica esto en el otro: pegado a una pared
// (x = 1,9999999 por redondeo) no tiene que chocar con la pared al subir
const EPS = 1e-4;
const CAIDA_BLOQUE = 30, CAIDA_BLOQUE_MAX = 14;

const CURVAS = { suave, lineal: (t) => t, rapida: salida, golpe: entrada };
const DIRS = { '^': 'arriba', v: 'abajo', '<': 'izq', '>': 'der' };

// El mapa: 15 filas de 10 letras.
//   #  bloque fijo          -  tabla (se atraviesa desde abajo)
//   ^ v < >  pinches fijos (para dónde apuntan)
//   R  resorte              P  donde arranca Grumo     D  la puerta
//   a…z  celdas de un grupo (qué es cada grupo lo dice def.grupos)
function leerMapa(def) {
  const filas = def.mapa;

  const fijo = new Uint8Array(COLS * FILAS), pinches = [], resortes = [], celdas = {};
  let inicio = null, puerta = null;
  filas.forEach((fila, f) => {
    if (fila.length !== COLS) throw new Error(`${def.id}: la fila ${f} tiene ${fila.length} letras`);
    [...fila].forEach((ch, c) => {
      if (ch === '#') fijo[f * COLS + c] = 1;
      else if (ch === '-') fijo[f * COLS + c] = 2;
      else if (DIRS[ch]) pinches.push({ c, f, dir: DIRS[ch] });
      else if (ch === 'R') resortes.push({ c, f });
      else if (ch === 'P') inicio = [c + 0.5, f + 1];
      else if (ch === 'D') puerta = [c + 0.5, f + 1];

  if (!puerta) throw new Error(`${def.id}: falta la D`);

// el rectángulo de una celda según lo que es (en `o`, para no crear arreglos)
function rectDe(tipo, dir, c, f, o) {

  else if (tipo === 'resorte') { o[0] = c + 0.12; o[1] = f + 0.58; o[2] = c + 0.88; o[3] = f + 1; }

    else if (dir === 'izq') { o[0] = c + 0.62; o[1] = f + 0.18; o[2] = c + 1; o[3] = f + 0.82; }
    else if (dir === 'der') { o[0] = c; o[1] = f + 0.18; o[2] = c + 0.38; o[3] = f + 0.82; }
    else { o[0] = c + 0.18; o[1] = f + 0.62; o[2] = c + 0.82; o[3] = f + 1; }

    for (const [c, f] of celdas) { c0 = Math.min(c0, c); f0 = Math.min(f0, f); c1 = Math.max(c1, c + 1); f1 = Math.max(f1, f + 1); }
    return {

class Partida {

    this.puerta = { x: px, y: py, mov: null, ocupada: 0, oculta: !!def.puertaOculta, patas: !!def.puertaVaiven, salto: -9, escupe: -9, vaiven: def.puertaVaiven ? { ...def.puertaVaiven, base: [px, py] } : null };

  avanzar(dtReal) {
    this.acumulado += Math.min(dtReal, 0.1);
    while (this.acumulado >= PASO) { this.paso(); this.acumulado -= PASO; }
    return this.acumulado / PASO;
  }
  sacarEventos() { const e = this.eventos; this.eventos = []; return e; }
  evento(tipo, datos = {}) { this.eventos.push({ tipo, t: this.t, ...datos }); }
  get T() { return this.pasos * PASO; }

  // ── el paso ──────────────────────────────────────────────────────────────
  paso() {
    const j = this.j;
    this.t += PASO; this.pasos++;
    j.px = j.x; j.py = j.y;
    this.saltoEste = false;
    if (this.estado === 'juego') {
      const c = this.control, flanco = !!c.salto && !this.saltoAntes;

      this.revisarTrampas();
    } else this.tFin += PASO;

  }

  moverJugador(dir, salto, flanco) {
    const j = this.j, F = FIS, dt = PASO;
    if (flanco) j.buffer = F.buffer;
    j.coyote = j.suelo ? F.coyote : Math.max(0, j.coyote - dt);
    j.buffer = Math.max(0, j.buffer - dt);
    if (dir) j.mira = dir;
    // en el piso frena más de lo que acelera: se para en seco, como en el género
    const acel = j.suelo ? (dir ? (j.vx * dir < 0 ? F.frenoSuelo : F.acelSuelo) : F.frenoSuelo) : (dir ? F.acelAire : F.frenoAire);
    const obj = dir * F.vmax;
    j.vx = j.vx < obj ? Math.min(obj, j.vx + acel * dt) : Math.max(obj, j.vx - acel * dt);

      j.vy = -F.salto; j.buffer = 0; j.coyote = 0; j.saltando = true; j.suelo = false; j.sobre = null;

      this.evento('salto', { x: j.x, y: j.y });
    }
    // salto variable: soltar el botón subiendo corta el salto
    if (j.saltando && !salto && j.vy < 0) { j.vy *= F.corte; j.saltando = false; }
    if (j.vy >= 0) j.saltando = false;
    j.vy = Math.min(F.caidaMax, j.vy + (j.vy > 0 ? F.gCaida : F.g) * dt);
    const enSuelo = j.suelo, vy = j.vy;
    this.moverX(j.vx * dt);
    this.moverY(j.vy * dt);
    if (j.suelo && !enSuelo) this.evento('aterriza', { x: j.x, y: j.y, v: vy });
  }

  // cada rectángulo sólido que toca la caja: fn(x0, y0, x1, y1, tipo, grupo)
  // (tipo: bloque, tabla, resorte o golpe = el bloque escondido que se
  // descubre de un cabezazo)
  choques(x0, y0, x1, y1, fn, excepto = null) {
    const m = this.m;
    const c0 = Math.max(0, Math.floor(x0)), c1 = Math.min(COLS - 1, Math.floor(x1 - 1e-9));
    const f0 = Math.max(0, Math.floor(y0)), f1 = Math.min(FILAS - 1, Math.floor(y1 - 1e-9));
    for (let f = f0; f <= f1; f++) for (let c = c0; c <= c1; c++) {
      const v = m.fijo[f * COLS + c];
      if (v === 1) fn(c, f, c + 1, f + 1, 'bloque', null);
      else if (v === 2 && y0 < f + 0.24) fn(c, f, c + 1, f + 0.24, 'tabla', null);
    }
    for (const r of m.resortes) {
      rectDe('resorte', null, r.c, r.f, R);
      if (R[2] > x0 && R[0] < x1 && R[3] > y0 && R[1] < y1) fn(R[0], R[1], R[2], R[3], 'resorte', null);
    }
    for (const g of this.grupos) {
      if (g === excepto) continue;
      const tipo = g.visible ? (g.falso || g.tipo === 'pinches' ? null : g.tipo) : g.golpe ? 'golpe' : null;
      if (!tipo) continue;
      if (x1 <= g.c0 + g.ox || x0 >= g.c1 + g.ox || y1 <= g.f0 + g.oy || y0 >= g.f1 + g.oy) continue;
      for (const [c, f] of g.celdas) {
        rectDe(g.tipo, g.dir, c + g.ox, f + g.oy, R);
        if (R[2] > x0 && R[0] < x1 && R[3] > y0 && R[1] < y1) fn(R[0], R[1], R[2], R[3], tipo, g);

  }

  moverX(dx) {
    const j = this.j, med = ANCHO / 2, x0j = j.x;

    this.choques(j.x - med, j.y - ALTO + EPS, j.x + med, j.y - EPS, (x0, y0, x1, y1, tipo) => {

      // algo), no lo tira del otro lado del bloque
      if (dx > 0 ? x0 < x0j + med - 1e-6 : x1 > x0j - med + 1e-6) return;

  moverY(dy) {

    if (j.y - ALTO < 0) { j.y = ALTO; if (j.vy < 0) j.vy = 0; }
    let piso = null, techo = null;
    this.choques(j.x - med + EPS, j.y - ALTO, j.x + med - EPS, j.y, (x0, y0, x1, y1, tipo, g) => {

      } else if (tipo !== 'tabla' && pie0 - ALTO >= y1 - 1e-6) {

  // correr a Grumo porque algo lo empuja (o lo lleva): devuelve false si no
  // entra (queda aplastado)
  empujarY(d, excepto) {
    const j = this.j, med = ANCHO / 2, pie0 = j.y;

    this.choques(j.x - med + EPS, j.y - ALTO, j.x + med - EPS, j.y, (x0, y0, x1, y1, tipo) => {

  empujarX(d, excepto, aplasta) {

      if (d > 0 ? x0 < x0j + med - 1e-6 : x1 > x0j - med + 1e-6) return;
      const t = d > 0 ? x0 - med : x1 + med;

  // un grupo se corre (dx, dy) en un cuadro del mundo: lleva a Grumo si está

  moverGrupo(g, dx, dy) {
    if (dx === 0 && dy === 0) return;

    if (!vivo || !g.visible || g.falso || g.tipo === 'pinches') return;
    const med = ANCHO / 2;
    if (encima) {
      if (dy !== 0 && !this.empujarY(dy, g)) return this.morir('aplastado');
      if (dx !== 0) this.empujarX(dx, g, false);
      if (dy > 0 || this.sobreGrupo(g)) { j.suelo = true; j.sobre = g.id; }
      return;
    }
    let px = 0, py = 0;
    for (const [c, f] of g.celdas) {

        if (dy < 0 && j.y <= R[1] - dy + 1e-6 && j.vy >= 0) py = Math.min(py, R[1] - j.y);

      }

    if (px !== 0 && !this.empujarX(px, g, true)) return this.morir('aplastado');
    if (py < 0) { j.suelo = true; j.sobre = g.id; if (j.vy > 0) j.vy = 0; }
  }
  sobreGrupo(g) {

  // ── las trampas ──────────────────────────────────────────────────────────
  cumple(si) {

    if (si.salta && !this.saltoEste) return false;
    if (si.suelo !== undefined && j.suelo !== si.suelo) return false;
    if (si.pisa && !(j.suelo && j.sobre === si.pisa)) return false;

  revisarTrampas() {

      // la que se repite salta cuando se entra, no mientras se está adentro
      if (!tr.una) { const antes = tr.dentro; tr.dentro = si; if (!si || antes) continue; }
      else if (!si) continue;
      tr.hecha = true; tr.t = this.t;
      for (const a of tr.hace) {

        // si algo se va a llevar la puerta, desde ya no se puede entrar
        if (a.que === 'puerta' || (a.que === 'mano' && a.agarra === 'puerta') || (a.que === 'bola' && a.sale === 'puerta')) this.puerta.ocupada++;
      }

    }
  }
  centroDe(que) {
    if (que === 'puerta') return [this.puerta.x, this.puerta.y - 0.7];
    if (que === 'grumo') return [this.j.x, this.j.y - ALTO / 2];
    if (Array.isArray(que)) return que;
    const g = this.g[que];
    return [(g.c0 + g.c1) / 2 + g.ox, (g.f0 + g.f1) / 2 + g.oy];
  }

  // `a.en`: cuántos segundos después de saltar la trampa; `a.pos`: dónde (bolas y notas)
  ejecutar(a, T) {
    const g = a.g ? this.g[a.g] : null;
    if (a.g && !g) throw new Error(`${this.def.id}: no hay grupo ${a.g}`);
    // con aviso, primero tiembla y la acción va después
    if (a.aviso && g && !a._avisado) {
      g.tiembla = T + a.aviso;
      this.agenda.push({ t: T + a.aviso, a: { ...a, _avisado: true } });
      this.evento('tiembla', { g: g.id });

    }
    switch (a.que) {
      case 'mover': {
        const hasta = a.hasta ? [...a.hasta] : [g.ox + (a.a?.[0] || 0), g.oy + (a.a?.[1] || 0)];
        g.mov = { desde: [g.ox, g.oy], hasta, t0: T, dur: a.t ?? 0.3, curva: a.curva || 'suave' };
        g.cae = null; g.vaiven = null;
        this.evento('mueve', { g: g.id, rapido: (a.t ?? 0.3) < 0.2 });

      }
      case 'caer': g.cae = { v: a.v || 0 }; g.mov = null; g.vaiven = null; this.evento('cae', { g: g.id }); break;
      case 'vaiven': g.vaiven = { a: a.a, t: a.t ?? 2, fase: a.fase || 0, t0: T, base: [g.ox, g.oy] }; g.mov = null; this.evento('mueve', { g: g.id }); break;
      case 'parar': g.vaiven = null; g.mov = null; this.evento('mueve', { g: g.id, rapido: true }); break;
      case 'mostrar':

        }

        // quedan bolas por escupir, está cerrada
        const p = this.puerta, deLaPuerta = a.sale === 'puerta';
        const [x, y] = deLaPuerta ? [p.x - 0.5, p.y - 0.38] : a.pos;
        this.bolas.push({ x, y, vx: a.vx ?? 3, vy: 0, r: 0.38, giro: 0, nace: T });
        if (deLaPuerta) { p.escupe = T; p.ocupada = Math.max(0, p.ocupada - 1); }

      }
      case 'luz': this.oscuro = T + (a.t ?? 2); this.evento('luz'); break;
      case 'nota': this.notas.push({ texto: a.texto, desde: T, hasta: T + (a.t ?? 2.5), pos: a.pos || null }); this.evento('nota'); break;
      case 'corte': this.corte = this.tick; this.evento('corte'); break;
      case 'temblor': this.temblor = T + (a.t ?? 0.4); this.evento('temblor'); break;

    }
  }
  // un bloque que aparece donde está Grumo lo sube (o lo aplasta si no entra)
  aparecerSobre(g) {
    const j = this.j, med = ANCHO / 2;
    if (this.estado !== 'juego') return;
    let arriba = null;
    for (const [c, f] of g.celdas) {
      rectDe(g.tipo, g.dir, c + g.ox, f + g.oy, R);
      if (R[2] > j.x - med && R[0] < j.x + med && R[3] > j.y - ALTO && R[1] < j.y) arriba = arriba === null ? R[1] : Math.min(arriba, R[1]);
    }
    if (arriba === null) return;
    if (!this.empujarY(arriba - j.y, g)) this.morir('aplastado');
    else { j.suelo = true; j.sobre = g.id; j.vy = 0; }
  }

  // ── la mano del animador ─────────────────────────────────────────────────
  nuevaMano(a, T) {
    const [x, y] = this.centroDe(a.agarra || a.hacia || 'grumo');
    return { a, fase: 'aviso', t0: T, punto: [x, y], x, y, lado: a.lado || 'arriba', llevado: 0, dx: 0, dy: 0, pose: 'abierta' };
  }
  afuera(m) {
    const [x, y] = m.punto;
    if (m.lado === 'izq') return [-3.5, y - 0.6];
    if (m.lado === 'der') return [COLS + 3.5, y - 0.6];
    return [x + 1.2, -4];
  }
  cuadroMano(m, T) {
    const a = m.a, j = this.j, dur = { ...MANO, aviso: a.aviso ?? MANO.aviso, lleva: a.t ?? MANO.lleva };
    const orden = ['aviso', 'entra', 'agarra', 'lleva', 'suelta', 'sale'];
    let k = T - m.t0;
    // la fase que toca ahora (sin empujón, la mano no "agarra": entra, toca y se va)
    while (k >= dur[m.fase]) {
      // lo que lleva termina de llegar justo adonde tenía que ir
      if (m.fase === 'lleva') this.llevar(m, 1);
      k -= dur[m.fase]; m.t0 += dur[m.fase];
      const antes = m.fase;
      m.fase = orden[orden.indexOf(m.fase) + 1];

    if (m.fase === 'aviso') { m.x = ax; m.y = ay; }
    else if (m.fase === 'entra') {

      if (a.agarra === 'grumo' || (!a.agarra && a.empuja)) m.punto = this.centroDe('grumo');
      const e = salida(u); m.x = lerp(ax, m.punto[0], e); m.y = lerp(ay, m.punto[1], e);
    } else if (m.fase === 'lleva') this.llevar(m, u);
    else if (m.fase === 'sale') {

      m.x = lerp(px, ax + m.dx, e); m.y = lerp(py, ay + m.dy, e);

  // la mano lleva lo que agarró hasta `u` (0 a 1) del camino
  llevar(m, u) {
    const a = m.a, j = this.j;

    const e = suave(u), nx = hasta[0] * e, ny = hasta[1] * e, ddx = nx - m.dx, ddy = ny - m.dy;

    if (a.agarra === 'grumo') { if (j.agarrado) { j.x += ddx; j.y += ddy; j.px = j.x; j.py = j.y; } }
    else if (a.agarra === 'puerta') { this.puerta.x += ddx; this.puerta.y += ddy; }

  cambioMano(m, antes) {
    const a = m.a, j = this.j;

/* ── guardado ── */
const M_guardado = (() => {
// Lo que se guarda en el teléfono (en try: sin localStorage, el juego anda
// igual sin guardar). Lo leído se valida campo por campo.
const { PIELES, SOMBREROS } = M_grumo;
const { NIVELES, SETS } = M_niveles;
const CLAVE = 'grumo-1';

function base() {
  return {
    mejor: NIVELES.map(() => 0),        // las menos tomas en que salió cada escena (0: todavía no)
    unica: [],                          // las escenas que ya dieron el premio de "toma única"
    monedas: 0, piel: 'naranja', sombrero: 'nada',
    pieles: ['naranja'], sombreros: ['nada'],
    tomas: 0,                           // todas las tomas de todas las escenas
    vistos: [],                         // los sets cuyo "set nuevo" ya se anunció
    final: false,
    ajustes: { musica: true, sonido: true, vibrar: true, calidad: 'auto', idioma: null },
  };
}

const num = (v, a, b, d) => (Number.isFinite(v) ? Math.max(a, Math.min(b, Math.floor(v))) : d);
const lista = (v, validos, siempre) => [...new Set([...(siempre ? [siempre] : []), ...(Array.isArray(v) ? v.filter((x) => validos.includes(x)) : [])])];

function validar(d) {
  const b = base();
  if (!d || typeof d !== 'object') return b;
  if (Array.isArray(d.mejor)) b.mejor = NIVELES.map((_, i) => num(d.mejor[i], 0, 9999, 0));
  b.unica = lista(d.unica, NIVELES.map((n) => n.id));
  b.monedas = num(d.monedas, 0, 1e9, 0);
  b.pieles = lista(d.pieles, PIELES.map((p) => p.id), 'naranja');
  b.sombreros = lista(d.sombreros, SOMBREROS.map((p) => p.id), 'nada');
  if (b.pieles.includes(d.piel)) b.piel = d.piel;
  if (b.sombreros.includes(d.sombrero)) b.sombrero = d.sombrero;
  b.tomas = num(d.tomas, 0, 1e9, 0);
  b.vistos = lista(d.vistos, SETS.map((s) => s.id));
  b.final = d.final === true;
  const a = d.ajustes || {};
  for (const k of ['musica', 'sonido', 'vibrar']) if (typeof a[k] === 'boolean') b.ajustes[k] = a[k];
  if (['auto', 'alta', 'baja'].includes(a.calidad)) b.ajustes.calidad = a.calidad;
  if (['es', 'en', 'pt'].includes(a.idioma)) b.ajustes.idioma = a.idioma;
  return b;
}

const hecho = (d, i) => d.mejor[i] > 0;
const hechos = (d) => d.mejor.filter((m) => m > 0).length;
// de a una: cada escena se abre al terminar la anterior (los sets, igual)
const nivelAbierto = (d, i) => i === 0 || hecho(d, i - 1);
const setAbierto = (d, s) => nivelAbierto(d, s * 10);
const setHecho = (d, s) => d.mejor.slice(s * 10, s * 10 + 10).every((m) => m > 0);

// Las bolitas de una escena ganada en `tomas` tomas: la primera vez 20, de
// una sola toma 25 más (una vez), repetirla 5. Terminar un set da 50: con
// todo de una toma alcanza justo para el camarín entero.
const BONO_SET = 50;
function premio(d, i, tomas) {
  let n = d.mejor[i] === 0 ? 20 : 5;
  if (tomas === 1 && !d.unica.includes(NIVELES[i].id)) n += 25;
  return n;
}

function cargar() { try { return validar(JSON.parse(localStorage.getItem(CLAVE))); } catch { return base(); } }
function guardar(d) { try { localStorage.setItem(CLAVE, JSON.stringify(d)); return true; } catch { return false; } }
return { base, validar, hecho, hechos, nivelAbierto, setAbierto, setHecho, BONO_SET, premio, cargar, guardar };
})();

/* ── logojxs ── */
const M_logojxs = (() => {
// El logo de JXSTUDIOS, calcado de la imagen que mandó quien pide
// (30/09/2026): el monograma JXS son cuatro trazos de metal del mismo
// ancho, en paralelo de a dos (entre línea y línea, el doble del grosor):
//   - la J de adentro (barra, palo y gancho);
//   - la S de adentro;
//   - A: la barra de arriba de la J que baja en diagonal (el "\" de la X) y
//     abraza la S por abajo;
//   - B: el gancho de abajo de la J que sube en diagonal (el "/" de la X,
//     que pasa POR ENCIMA del "\") y abraza la S por arriba.
// Coordenadas en una caja de 350 × 172. El mismo dibujo sirve para la
// versión de píxeles (se rasteriza chico), la 2D suave (se traza) y la 3D
// (se muestrea la línea y se engorda a los costados).
const CAJA = { w: 350, h: 172 };
const GROSOR = 14.5;

const TRAZOS = [
  // A va abajo en el cruce: se dibuja primero
  { id: 'A', capa: 0, d: [['M', 40, 19], ['L', 114, 19], ['L', 176, 101], ['C', 194, 128, 222, 168, 268, 169], ['C', 310, 170, 342, 152, 342, 122]] },
  { id: 'J', capa: 0, d: [['M', 40, 43], ['L', 98, 43], ['L', 98, 116], ['C', 98, 148, 44, 158, 36, 124]] },
  { id: 'S', capa: 0, d: [['M', 312, 66], ['C', 306, 46, 288, 36, 266, 36], ['C', 242, 36, 226, 48, 226, 63], ['C', 226, 80, 248, 86, 272, 92], ['C', 302, 99, 320, 108, 320, 126], ['C', 320, 142, 300, 148, 272, 148], ['C', 246, 148, 226, 138, 216, 118]] },
  { id: 'B', capa: 1, d: [['M', 10, 130], ['C', 18, 158, 50, 168, 86, 166], ['C', 108, 165, 122, 158, 134, 142], ['L', 200, 46], ['C', 216, 24, 244, 12, 272, 12], ['C', 310, 12, 340, 30, 340, 62]] },
];

// Un trazo como Path2D, escalado y corrido.
function camino2d(t, esc = 1, ox = 0, oy = 0) {
  const p = new Path2D();
  for (const [op, ...n] of t.d) {
    const q = n.map((v, i) => (i % 2 ? oy + v * esc : ox + v * esc));
    if (op === 'M') p.moveTo(q[0], q[1]);
    else if (op === 'L') p.lineTo(q[0], q[1]);
    else p.bezierCurveTo(q[0], q[1], q[2], q[3], q[4], q[5]);
  }
  return p;
}

// Puntos a lo largo del trazo, más o menos parejos (para la 3D, para animar
// el dibujo de la línea y para medir el largo).
function muestrear(t, cada = 3) {
  const pts = [];
  let x = 0, y = 0;
  for (const [op, ...n] of t.d) {
    if (op === 'M') { x = n[0]; y = n[1]; pts.push([x, y]); continue; }
    if (op === 'L') {
      const [x1, y1] = n, largo = Math.hypot(x1 - x, y1 - y), k = Math.max(1, Math.ceil(largo / cada));
      for (let i = 1; i <= k; i++) pts.push([x + ((x1 - x) * i) / k, y + ((y1 - y) * i) / k]);
      x = x1; y = y1; continue;
    }
    const [c1x, c1y, c2x, c2y, x1, y1] = n;
    const aprox = Math.hypot(c1x - x, c1y - y) + Math.hypot(c2x - c1x, c2y - c1y) + Math.hypot(x1 - c2x, y1 - c2y);
    const k = Math.max(2, Math.ceil(aprox / cada));
    for (let i = 1; i <= k; i++) {
      const s = i / k, r = 1 - s;
      pts.push([r * r * r * x + 3 * r * r * s * c1x + 3 * r * s * s * c2x + s * s * s * x1, r * r * r * y + 3 * r * r * s * c1y + 3 * r * s * s * c2y + s * s * s * y1]);
    }
    x = x1; y = y1;
  }
  return pts;
}

function largo(t) {
  const p = muestrear(t, 2);
  let l = 0;
  for (let i = 1; i < p.length; i++) l += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
  return l;
}

// El monograma dibujado en 2D con su metal, en un lienzo aparte (así el
// reflejo, que se pinta "arriba de lo dibujado", toca solo el metal):
// sombra, borde oscuro (que en el cruce hace de hueco y deja ver que B pasa
// por encima), el cuerpo con un degradé de cromo y el filo de luz.
// `avance` (0 a 1) dibuja cada trazo hasta ahí: el metal "se escribe".
// `brillo` (0 a 1) pasa una franja de luz de izquierda a derecha.
function monograma(ancho, { avance = 1, brillo = -1, sombra = true, lienzo = null } = {}) {
  const esc = ancho / CAJA.w, gro = GROSOR * esc, alto = Math.ceil(CAJA.h * esc);
  const m = Math.ceil(10 * esc) + 2;
  const c = lienzo || document.createElement('canvas');
  c.width = Math.ceil(ancho) + 2 * m; c.height = alto + 2 * m;
  const g = c.getContext('2d');
  g.clearRect(0, 0, c.width, c.height);
  const crom = g.createLinearGradient(0, m, 0, m + alto);
  crom.addColorStop(0, '#fbfbfd'); crom.addColorStop(0.35, '#c9ccd4'); crom.addColorStop(0.55, '#8a8f99');
  crom.addColorStop(0.7, '#d9dce3'); crom.addColorStop(1, '#6f747e');
  g.lineCap = 'butt'; g.lineJoin = 'round';
  for (const capa of [0, 1]) for (const t of TRAZOS) {
    if (t.capa !== capa) continue;
    const p = camino2d(t, esc, m, m), l = largo(t) * esc;
    const trazo = (a, estilo, dx = 0, dy = 0) => {
      g.save();
      g.translate(dx, dy);
      if (avance < 1) g.setLineDash([Math.max(0.01, l * avance), l + 10]);
      g.lineWidth = a; g.strokeStyle = estilo; g.stroke(p);
      g.restore();
    };
    // cara plana con bisel (como el logo): el borde que abre el hueco del
    // cruce, el bisel gris y la cara de cromo
    if (sombra) trazo(gro + 2 * esc, 'rgba(0,0,0,0.6)', 3 * esc, 5 * esc);
    trazo(gro + 5 * esc, '#050607');
    trazo(gro, '#5b5f68');
    trazo(gro * 0.74, crom);
  }
  if (brillo >= 0 && brillo <= 1) {
    g.globalCompositeOperation = 'source-atop';
    const bx = m + (brillo * 1.6 - 0.3) * ancho;
    const f = g.createLinearGradient(bx - ancho * 0.12, 0, bx + ancho * 0.12, 0);
    f.addColorStop(0, 'rgba(255,255,255,0)'); f.addColorStop(0.5, 'rgba(255,255,255,0.85)'); f.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = f; g.fillRect(0, 0, c.width, c.height);
    g.globalCompositeOperation = 'source-over';
  }
  c.margen = m;
  return c;
}

// La palabra "JXStudios" en metal, con la letra del sistema (sans gruesa):
// se mide y se escala para que ocupe justo `ancho`.
function palabra(ancho, { color = null } = {}) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const fuente = (px) => `600 ${px}px "Montserrat", "Poppins", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif`;
  g.font = fuente(100);
  const w100 = g.measureText('JXStudios').width || 400;
  const px = Math.max(8, (ancho / w100) * 100);
  c.width = Math.ceil(ancho + px * 0.2); c.height = Math.ceil(px * 1.35);
  g.font = fuente(px); g.textBaseline = 'alphabetic';
  const base = Math.round(px * 1.02), x = Math.round(px * 0.1);
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillText('JXStudios', x + px * 0.03, base + px * 0.05);
  const crom = g.createLinearGradient(0, base - px * 0.75, 0, base);
  crom.addColorStop(0, '#ffffff'); crom.addColorStop(0.5, '#d2d5dc'); crom.addColorStop(0.62, '#9aa0aa'); crom.addColorStop(1, '#e7e9ee');
  g.fillStyle = color || crom; g.fillText('JXStudios', x, base);
  return c;
}

// El monograma en píxeles: se traza chico (con el hueco del cruce), se
// separa metal de borde por color y se vuelve a pintar a mano en escalones
// de cromo (claro arriba, oscuro al medio, claro abajo) con bisel.
function monogramaPixel(anchoPx, { avance = 1 } = {}) {
  const esc = anchoPx / CAJA.w, alto = Math.ceil(CAJA.h * esc) + 4, ancho = Math.ceil(anchoPx) + 4;
  const c = document.createElement('canvas');
  c.width = ancho; c.height = alto;
  const g = c.getContext('2d');
  for (const capa of [0, 1]) for (const t of TRAZOS) {
    if (t.capa !== capa) continue;
    const p = camino2d(t, esc, 2, 2), l = largo(t) * esc;
    g.save();
    if (avance < 1) g.setLineDash([Math.max(0.01, l * avance), l + 10]);
    g.lineCap = 'butt';
    g.lineWidth = GROSOR * esc + 2.2; g.strokeStyle = '#ff0000'; g.stroke(p);
    g.lineWidth = GROSOR * esc; g.strokeStyle = '#00ff00'; g.stroke(p);
    g.restore();
  }
  const img = g.getImageData(0, 0, ancho, alto), d = img.data;
  const metal = new Uint8Array(ancho * alto), borde = new Uint8Array(ancho * alto);
  for (let i = 0; i < ancho * alto; i++) {
    if (d[i * 4 + 3] < 90) continue;
    if (d[i * 4 + 1] > 110) metal[i] = 1; else if (d[i * 4] > 110) borde[i] = 1;
  }
  const ESCALON = ['#f4f5f8', '#d9dbe1', '#b7bbc4', '#8d929c', '#a9adb6', '#d3d6dc', '#9ea3ad', '#767b85'];
  for (let y = 0; y < alto; y++) for (let x = 0; x < ancho; x++) {
    const i = y * ancho + x, k = i * 4;
    if (metal[i]) {
      const arriba = y > 0 && metal[i - ancho], abajo = y < alto - 1 && metal[i + ancho];
      const izq = x > 0 && metal[i - 1], der = x < ancho - 1 && metal[i + 1];

class FondoMenu {
  constructor({ alEvento = () => {} } = {}) {

      g.restore();

}
// el set del menú: arriba (parado) o a la izquierda (acostado)
function camaraMenu() {
  const u = dpr, arriba = (arribaSeguro + 58) * u, marco = 12 * u;

    const ts = Math.max(8, Math.floor(Math.min(libreW / COLS, libreH / FILAS)));
    return { ts, x: Math.round(W * 0.03 + marco + (libreW - COLS * ts) / 2), y: Math.round(arriba + marco + (libreH - FILAS * ts) / 2) };
  }
  const r = $(estado === 'idiomas' ? 'idiomasBotones' : 'botonera').getBoundingClientRect();

// ganó: bolitas, sets nuevos y la tarjeta del final

// ── el camarín: Grumo grande en el set, flechas, comprar o poner ───────────
const lista = () => (camarin.tipo === 'pieles' ? PIELES : SOMBREROS);

  camarin.i = Math.max(0, lista().findIndex((p) => p.id === actual));

function actualizarCamarin() {
  const p = lista()[camarin.i], tipo = camarin.tipo, mias = tipo === 'pieles' ? datos.pieles : datos.sombreros, tengo = mias.includes(p.id);
  const puesto = (tipo === 'pieles' ? datos.piel : datos.sombrero) === p.id;

function moverCamarin(d) { camarin.i = (camarin.i + d + lista().length) % lista().length; sonido.tocar('cambia'); camarin.muestra.evento({ tipo: 'aterriza', v: 10 }); actualizarCamarin(); }
function comprarOPoner() {
  const p = lista()[camarin.i], mias = camarin.tipo === 'pieles' ? datos.pieles : datos.sombreros;

    if (datos.monedas < p.precio) { sonido.tocar('error'); vibrar(40); return; }
    datos.monedas -= p.precio; mias.push(p.id); sonido.tocar('compra'); vibrar(20);

let borrarArmado = false;
function armarAjustes() {

// ── los eventos de la partida: sonido, migas y la cara de Grumo ───────────
function evento(ev) {
  const p = partida, j = p.j, col = pielDe(datos.piel).color, bloque = MUNDOS[mundoDe(nivelI)].bloque;
  grumo.evento(ev);
  switch (ev.tipo) {
    case 'salto': sonido.tocar('salto'); break;
    case 'aterriza': if (ev.v > 4) { sonido.tocar('aterriza', { v: ev.v }); if (ev.v > 11) { efectos.polvo(j.x, j.y, 4); vibrar(8); } } break;
    case 'resorte': sonido.tocar('resorte'); efectos.polvo(ev.x, ev.y, 3); resortes.set(ev.g ?? `${Math.floor(ev.x)},${Math.floor(ev.y - 0.5)}`, t); break;
    case 'cabeza': sonido.tocar('cabeza'); break;
    case 'muere':
      sonido.tocar('muere', { causa: ev.causa }); vibrar([30, 20, 60]);
      if (ev.causa !== 'caida') efectos.migas(ev.x, ev.y - 0.3, 14, [col, col, '#ffffff'], { vel: 6, arriba: 4 });
      break;
    case 'gana': sonido.tocar('gana'); efectos.chispas(ev.x, ev.y - 0.8, 14); vibrar([15, 30, 15]); break;
    case 'mano': sonido.tocar('mano', { fase: ev.fase }); break;
    case 'empujon': sonido.tocar('empujon'); vibrar(20); break;
    case 'cae': sonido.tocar('cae'); break;
    case 'tiembla': sonido.tocar('tiembla'); break;
    case 'aparece': sonido.tocar('aparece', { golpe: ev.golpe }); break;
    case 'desaparece': { sonido.tocar('desaparece'); const gr = p.g[ev.g]; if (gr) efectos.puf((gr.c0 + gr.c1) / 2 + gr.ox, (gr.f0 + gr.f1) / 2 + gr.oy, { color: '#f4eadc' }); break; }
    case 'mueve': sonido.tocar('mueve', { rapido: ev.rapido }); break;
    case 'cruje': sonido.tocar('cruje'); break;
    case 'desarma': { sonido.tocar('desarma'); const gr = p.g[ev.g]; if (gr) efectos.migas((gr.c0 + gr.c1) / 2 + gr.ox, (gr.f0 + gr.f1) / 2 + gr.oy, 16, [bloque], { vel: 4, arriba: 2 }); break; }
    case 'puerta': sonido.tocar('puerta', ev); break;
    case 'bola': sonido.tocar('bola'); break;
    case 'aplasta': { sonido.tocar('aplasta'); const M = MUNDOS[mundoDe(nivelI)]; efectos.migas(ev.x, ev.y, 10, [M.bola, M.bola, M.bola2], { vel: 3.5, arriba: 2.5 }); vibrar(10); break; }
    case 'luz': sonido.tocar('luz'); break;
    case 'nota': sonido.tocar('nota'); break;
    case 'corte': sonido.tocar('corte'); corteHasta = t + 1 / 12; break;
    case 'temblor': sonido.tocar('temblor'); vibrar(60); break;
    case 'bonk': sonido.tocar('bonk'); efectos.chispas(ev.x, ev.y - 1, 6); vibrar(25); break;
  }
}
function eventoMenu(ev) {
  if (ev.tipo === 'salto') sonido.tocar('salto');
  else if (ev.tipo === 'aterriza' && ev.v > 4) sonido.tocar('aterriza', { v: ev.v });
  else if (ev.tipo === 'mano') sonido.tocar('mano', { fase: ev.fase });
  else if (ev.tipo === 'empujon') sonido.tocar('empujon');
}

// ── el paso ────────────────────────────────────────────────────────────────
function paso(dt) {
  t += dt;
  if (estado === 'espera') return;
  if (estado === 'intro') { intro.pasar(dt, W, H); return; }
  if (['menu', 'idiomas', 'escenas', 'niveles', 'ajustes'].includes(estado)) {
    for (const dx of entrada.sacarEmpujes()) fondoMenu.mover(dx);
    fondoMenu.pasar(dt);
  } else entrada.sacarEmpujes();
  if (estado === 'camarin') camarin.muestra.pasar(dt, null);
  if (!partida || estado === 'pausa' || estado === 'final') return;
  const p = partida;
  const antes = tEscena;
  tEscena += dt; golpeToma += dt;
  // el golpe de la claqueta grande (¡acción!) suena justo cuando se cierra
  if (antes < CLAQUETA.golpe && tEscena >= CLAQUETA.golpe) { sonido.tocar('claqueta'); vibrar(12); }
  // con la claqueta grande todavía arriba no se puede mover (¡acción! es el golpe)
  const c = estado === 'juego' && tEscena >= CLAQUETA.golpe ? entrada.leer() : { dir: 0, salto: false };
  p.control.dir = c.dir; p.control.salto = c.salto;
  alfa = p.avanzar(dt);
  for (const ev of p.sacarEventos()) evento(ev);
  grumo.pasar(dt, p.j);
  efectos.pasar(dt);
  if (ayuda) { ayuda.t += dt; if (entrada.usos > 3 && ayuda.hasta > ayuda.t + 2.5) ayuda.hasta = ayuda.t + 2.5; }
  if (estado === 'juego' && p.estado === 'muerto' && p.tFin > 0.55) { toma++; datos.tomas++; guardarTodo(); empezarToma(false); }
  if (estado === 'juego' && p.estado === 'gano' && p.tFin > 1.05) ganar();
}

// ── el dibujo ──────────────────────────────────────────────────────────────
let camJuego = null, zonasHechas = '';
function dibujar() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  if (estado === 'espera') { g.fillStyle = '#050300'; g.fillRect(0, 0, W, H); return; }
  if (estado === 'intro') { intro.dibujar(g, W, H); return; }
  const cuadroReal = Math.floor(t * 12);
  if (partida && ['juego', 'pausa', 'gano'].includes(estado)) { dibujarJuego(cuadroReal); return; }
  // los menús: la mesa, el set con GRUMO colgado y Grumo en su tarima
  const cam = camaraMenu();
  dibujarSet(g, W, H, cam, dpr);
  if (estado === 'camarin') {
    const p = fondoMenu.p;
    dibujarNivel(g, p, cam, { mundo: 'taller', cuadro: cuadroReal, hervor: Math.floor(cuadroReal / 2) });
    camarin.muestra.dibujar(g, cam.x + (COLS / 2) * cam.ts, cam.y + 10 * cam.ts, cam.ts, cuadroReal, { escala: 2.6 });
  } else {
    const mundo = mundoDe(proxima());
    fondoMenu.dibujar(g, cam, { mundo, piel: datos.piel, sombrero: datos.sombrero, u: dpr });
  }
  sombraMarco(g, cam);
  pintarTitileo(g, W, H, cuadroReal, 0.025);
  pintarGrano(g, W, H, cuadroReal, 0.55);
  g.drawImage(vineta(W, H, 0.45), 0, 0);
  if (['escenas', 'niveles', 'ajustes'].includes(estado)) { g.fillStyle = 'rgba(30,16,6,0.4)'; g.fillRect(0, 0, W, H); }
  if (estado === 'final') { g.fillStyle = 'rgba(30,16,6,0.25)'; g.fillRect(0, 0, W, H); }
}
function dibujarJuego(cuadroReal) {
  const p = partida, cam = camaraJuego(), u = dpr;
  camJuego = cam;
  // los botones táctiles: dónde están (para entrada.js, en píxeles de CSS)
  const lugar = conBotones() ? lugarBotones(W, H, cam, u, abajoSeguro * u) : null;
  if (lugar) {
    const k = `${W}x${H}:${cam.ts}`;
    if (k !== zonasHechas) {
      zonasHechas = k;
      const a = acostado();
      entrada.zonas = a ? { techo: 0, medio: (lugar.izq[0] + lugar.der[0]) / 2 / u, corte: W / 2 / u } : { techo: (lugar.izq[1] - lugar.r * 1.6) / u, medio: (lugar.izq[0] + lugar.der[0]) / 2 / u, corte: (lugar.der[0] + lugar.salto[0]) / 2 / u };
    }
  } else entrada.zonas = null;
  // el temblor: la cámara salta de a cuadros
  const tiembla = p.temblor > p.T ? 1 : 0;
  const cx = cam.x + (tiembla ? (hash(p.tick, 1) - 0.5) * cam.ts * 0.18 : 0), cy = cam.y + (tiembla ? (hash(p.tick, 2) - 0.5) * cam.ts * 0.18 : 0);
  const c2 = { ...cam, x: cx, y: cy };
  dibujarSet(g, W, H, cam, u);
  g.save();
  g.beginPath(); g.rect(cam.x, cam.y, COLS * cam.ts, FILAS * cam.ts); g.clip();
  const mundo = mundoDe(nivelI);
  // el set "hierve" de a dos cuadros (el grumo, en cada uno)
  dibujarNivel(g, p, c2, { mundo, cuadro: p.tick, hervor: Math.floor(p.tick / 2), resortes: apretados() });
  // Grumo: entre paso y paso; al ganar, camina adentro de la puerta
  const j = p.j;
  let gx = lerp(j.px, j.x, alfa), gy = lerp(j.py, j.y, alfa), ga = 1;
  if (p.estado === 'gano') { const k = clamp(p.tFin / 0.5, 0, 1); gx = lerp(j.x, p.puerta.x, k); gy = p.puerta.y; ga = 1 - clamp((p.tFin - 0.45) / 0.3, 0, 1); }
  if (ga > 0) grumo.dibujar(g, c2.x + gx * cam.ts, c2.y + gy * cam.ts, cam.ts, cuadroReal, { alfa: ga });
  efectos.dibujar(g, c2);
  dibujarManos(g, p, c2, p.tick);
  dibujarNotas(g, p, c2, tr, p.tick);
  if (p.oscuro > p.T) dibujarOscuro(g, c2, c2.x + gx * cam.ts, c2.y + (gy - ALTO / 2) * cam.ts, 1);
  sombraMarco(g, cam);
  g.restore();
  pintarTitileo(g, W, H, cuadroReal);
  pintarGrano(g, W, H, cuadroReal, 0.6);
  g.drawImage(vineta(W, H, 0.4), 0, 0);
  // el corte de cámara: un cuadro negro
  if (t < corteHasta) { g.fillStyle = 'rgba(0,0,0,0.92)'; g.fillRect(cam.x, cam.y, COLS * cam.ts, FILAS * cam.ts); }
  if (estado === 'gano') return;
  // arriba, la claqueta con la escena y la toma
  const arriba = (arribaSeguro + 8) * u;
  if (tEscena >= CLAQUETA.sube) dibujarClaqueta(g, W, arriba, u, { escena: NIVELES[nivelI].id, toma: tr('toma', toma), golpe: golpeToma, corten: p.estado === 'muerto' ? tr('corten') : '' });
  if (lugar) dibujarBotones(g, lugar, estado === 'juego' ? entrada.apretados() : new Set());
  if (ayuda && ayuda.t < ayuda.hasta && tEscena > CLAQUETA.sube) dibujarAyuda(g, W, cam, u, ayuda.texto, clamp((ayuda.t - 0.9) / 0.3, 0, 1) * clamp((ayuda.hasta - ayuda.t) / 0.4, 0, 1));
  if (tEscena < CLAQUETA.sube) dibujarClaquetaGrande(g, W, H, u, tEscena, { escena: tr('escena', NIVELES[nivelI].id), toma: tr('toma', toma), nombre: tr(NIVELES[nivelI].nombre) });
}
// los resortes apretados: 1 recién pisado, 0 suelto (en 0,25 s)
function apretados() {
  const m = new Map();
  for (const [k, t0] of resortes) { const v = 1 - (t - t0) / 0.25; if (v > 0) m.set(k, v); else resortes.delete(k); }
  return m;
}

// ── el bucle, con calidad que se ajusta sola ──────────────────────────────
let ultimo = performance.now(), lento = 0;
const manual = q.has('pausa');
function cuadro(ahora) {
  requestAnimationFrame(cuadro);
  const dtReal = Math.min(0.1, (ahora - ultimo) / 1000);
  ultimo = ahora;
  // si los cuadros tardan mucho seguido, se baja la resolución (un cuarto de punto por vez)
  if (datos.ajustes.calidad === 'auto' && estado === 'juego') {
    lento = dtReal > 0.026 ? lento + 1 : Math.max(0, lento - 1);
    if (lento > 45 && dprTope > 1) { dprTope = Math.max(1, dprTope - 0.25); lento = 0; medir(); }
  }
  if (!manual) {
    const [n, d] = trozos(dtReal, PASO);
    for (let k = 0; k < n; k++) paso(d);
  }
  dibujar();
}

textos();
const conIntro = q.has('intro') || !(q.has('directo') || q.has('pausa') || q.has('sinintro'));
// La intro arranca apenas abre, sin tocar nada. Si el navegador deja sonar
// sin un toque, el audio nace andando y la música va en fase; si no (lo
// normal), la intro va muda y el primer toque la saltea y prende el sonido.
if (conIntro) { mostrar(null); entrar(); }
else {
  aMenu();
  const d = q.get('directo') || '';
  if (d.startsWith('nivel:')) { const i = NIVELES.findIndex((n) => n.id === d.slice(6)); jugar(i >= 0 ? i : 0); }
}
requestAnimationFrame(cuadro);

// Las sondas para las pruebas (pruebas/juego.mjs).
window.__G = {
  get estado() { return estado; }, get partida() { return partida; }, get datos() { return datos; }, get intro() { return intro; },
  get camarin() { return camarin; }, get fondo() { return fondoMenu; }, get grumo() { return grumo; }, get camJuego() { return camJuego; },
  get nivelI() { return nivelI; }, get toma() { return toma; }, get ayuda() { return ayuda; }, get tEscena() { return tEscena; },
  pasos(n, dib = false) { for (let k = 0; k < n; k++) paso(PASO); if (dib) dibujar(); },
  dibujar, entrar, jugar, aMenu, pausar, seguir, reiniciar, elegirIdioma, abrirCamarin, moverCamarin, comprarOPoner, armarSets, armarNiveles, verFinal, entrada, sonido, tr,
  get W() { return W; }, get H() { return H; }, get dpr() { return dpr; },
};
window.listo = true;

})();

</script>
