<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080c18">
<title>Espejo</title>
<meta name="description" content="Cuarenta puzzles de espejos y rayos. Ninguno se diseñó a ojo: los cuarenta los resolvió una máquina antes de dejártelos jugar.">
<style>
/* Espejo — hoja única.
   Vertical y nada más: el tablero se dibuja en 360 de ancho y se escala entero,
   así que la interfaz vive dentro de ese rectángulo. Las medidas van en svh y
   no en vh porque en un teléfono vh incluye la barra del navegador y el último
   renglón queda siempre tapado. */

:root {
  --fondo: #080c18;
  --panel: #101628;
  --borde: #232c46;
  --texto: #e9eef7;
  --tenue: #8d99b6;
  --cian: #5ad8ff;
  --cian-claro: #b6f0ff;
  --rosa: #ff7bd5;
  --ambar: #ffc24a;
  --mal: #ff8f8f;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--fondo); color: var(--texto);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none;
}
body {
  min-height: 100svh; display: flex; align-items: center; justify-content: center;
  /* Un fondo que insinúa rayos cruzados. Cuesta una sola pintada y hace que las
     pantallas de texto no se sientan un documento. */
  background-image:
    radial-gradient(120% 60% at 20% 0%, rgba(90,216,255,.07), transparent 60%),
    radial-gradient(100% 60% at 85% 100%, rgba(255,123,213,.06), transparent 60%);
}
button, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* `touch-action: none` es obligatorio: sin eso el navegador se queda el toque
   para desplazar la página y el dedo llega una vez de cada tres. */
#lienzo {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  touch-action: none; display: block; z-index: 0; visibility: hidden;
}

.pantalla {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: var(--an, min(360px, 100vw)); height: var(--al, min(640px, 100svh));
  display: flex; flex-direction: column; z-index: 2;
}
.pantalla[hidden] { display: none; }
.centrado { align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
#p-menu, #p-idioma, #p-fin { background: radial-gradient(130% 70% at 50% 0%, rgba(14,22,40,.5), rgba(4,6,14,.85)); }
#p-mapa, #p-como { background: var(--fondo); }

/* EL MARCO ES UNA IMAGEN CORTADA EN NUEVE (`border-image`), no un borde. Un
   dibujo de varillas con espejos no se puede estirar entero: las esquinas
   quedarían deformes. `border-image` deja las cuatro esquinas del tamaño
   original y estira sólo los lados, así que el mismo dibujo de 320×320 sirve
   para el panel alto del menú y para el bajo del final. El relleno no se dibuja
   (sin `fill`): el centro de la pieza es transparente. */

/* El título es un dibujo, no texto con sombras. El `alt` lleva la palabra, así
   que el lector de pantalla sigue leyendo "Espejo". */
.logo { margin: 0 0 4px; line-height: 0; }
.logo img {
  width: min(80%, 240px); height: auto;
  filter: drop-shadow(0 0 16px rgba(90,216,255,.4));
}

.bajada { color: var(--tenue); margin: 0 0 12px; font-size: 13px; }
.bajada b { color: var(--texto); }
.record { color: var(--tenue); font-size: 13px; margin: 8px 0 2px; }
.record b { color: var(--cian-claro); font-size: 15px; }

button:active { transform: translateY(2px); }
button:disabled { opacity: .45; cursor: default; }
.chico { padding: 5px 10px; font-size: 13px; min-height: 36px; }
/* Los botones del pie se ven chicos pero SE TOCAN GRANDE: por debajo de 44 px
   el dedo falla una de cada tres veces. El tamaño visual lo da el texto; el
   área de toque, el min-height. */
.botones.chicos { gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.botones.chicos .chico { min-height: 44px; }
.peligro { color: var(--mal); }
#m-idioma { font-weight: 800; letter-spacing: 1px; min-width: 46px; }

.opcion { display: flex; align-items: center; justify-content: center; gap: 7px;
          color: var(--tenue); font-size: 12.5px; margin: 0; }
.opcion input { width: 17px; height: 17px; accent-color: var(--cian); }
.chico-op { min-height: 44px; }

/* ── la pantalla de idiomas ── */
.idioma-t { margin: 8px 0 12px; font-size: 19px; color: var(--cian-claro); }
#idiomas { gap: 9px; margin-bottom: 12px; }
.grande-op { min-height: 52px; font-size: 15px; padding: 12px 14px; }
.grande-op b { color: var(--cian-claro); margin-right: 8px; letter-spacing: 1px; }

/* ── el mapa de niveles ──
   Cinco columnas: con cuatro los botones quedan enormes y con seis el número no
   se lee. Cada uno mide más de 44 px de lado por el `min-height`, que es lo que
   hace que el dedo acierte el nivel que quería. */
.mapa {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
  padding: 12px; overflow-y: auto; flex: 1; align-content: start;
}
.celda-niv {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; min-height: 58px; padding: 6px 2px; font-size: 15px; font-weight: 700;
}
.celda-niv .luces { font-size: 9px; letter-spacing: 1px; color: var(--cian); line-height: 1; }
.celda-niv.hecho { color: var(--cian-claro); }
.celda-niv.cerrado { color: var(--tenue); }
.celda-niv.cerrado .luces { color: var(--tenue); font-size: 11px; }

/* --- texto largo --- */
.barra { display: flex; align-items: center; gap: 12px; padding: 10px 12px;
         background: rgba(6,10,22,.95); border-bottom: 2px solid var(--borde); }
.barra h2 { margin: 0; font-size: 17px; }
.texto { padding: 14px 14px 40px; overflow-y: auto; background: var(--fondo); flex: 1; }
.texto h3 { margin: 22px 0 6px; font-size: 15px; color: var(--cian); }
.texto p { margin: 0 0 10px; font-size: 14px; color: var(--tenue); }
.texto p b { color: var(--texto); }
.destacado { background: rgba(16,24,44,.9); border-left: 3px solid var(--cian);
             padding: 11px 12px; border-radius: 0 8px 8px 0; }
.texto dl { margin: 0; }
.texto dt { font-weight: 700; margin-top: 10px; font-size: 14px; }
.texto dd { margin: 2px 0 0; color: var(--tenue); font-size: 13.5px; }
.texto dd b { color: var(--texto); }

/* --- HUD --- */
.juego { pointer-events: none; background: none; }
.juego button { pointer-events: auto; }
.hud { display: flex; align-items: center; gap: 6px; padding: 8px 8px 0; }
.hud-btn { width: 44px; height: 44px; min-height: 44px; padding: 0; font-size: 17px; line-height: 1; }
.hud-centro { flex: 1; text-align: center; line-height: 1.25; }
.hud-centro b { display: block; font-size: 15px; color: #eaf9ff; }
.toques { font-size: 12.5px; color: var(--tenue); font-variant-numeric: tabular-nums; }
/* Pasado el par, el contador se pone ámbar: no es un castigo, es la única señal
   de que las tres luces ya no están en juego — y llega en el momento en que
   todavía se puede reiniciar y probar de nuevo. */
.toques.pasado { color: var(--ambar); }
.par { font-size: 12.5px; color: var(--cian); margin-left: 6px; }

/* --- ganaste --- */
.fin h2 { margin: 0 0 4px; font-size: 30px; font-weight: 900; color: var(--cian-claro);
          text-shadow: 0 0 24px rgba(90,216,255,.5); }
.luces-grandes { margin: 0 0 6px; font-size: 26px; letter-spacing: 6px; color: var(--cian);
                 animation: pum .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pum { from { transform: scale(.4); opacity: 0; } }
.perfecto { margin: 0 0 8px; color: var(--ambar); font-weight: 700; font-size: 13px;
            letter-spacing: 2px; text-transform: uppercase; }
.ultimo { color: var(--cian-claro); font-size: 13.5px; margin: 8px 0; }
.lista { list-style: none; padding: 0; margin: 0 0 10px; text-align: left; }
.lista li { display: flex; justify-content: space-between; gap: 10px;
            padding: 6px 2px; border-bottom: 1px solid rgba(90,216,255,.18); font-size: 14px; }
.lista span { color: var(--tenue); }
.lista b { font-variant-numeric: tabular-nums; }

/* PANTALLA MEDIANA Y TELEFONO ACOSTADO. Con las medidas del 19,5:9 la tapa mide
   más que la pantalla, se vuelve desplazable y la última fila de botones queda
   abajo del corte — que es la forma silenciosa de esconderla. */
@media (max-height: 700px) and (min-height: 471px) {
  .logo img { width: min(68%, 200px); }
  .bajada { font-size: 12.5px; margin-bottom: 8px; }
  .prisma { min-height: 54px; font-size: 17px; }
}
@media (max-height: 470px) {
  .tapa { border-width: 20px; border-image-width: 20px; padding: 4px 8px 6px; }
  .logo { margin: 0; }
  .logo img { width: min(42%, 120px); }
  .idioma-t { font-size: 15px; margin: 4px 0 8px; }
  .grande-op { min-height: 44px; font-size: 13.5px; padding: 8px 12px; }
  #idiomas { gap: 6px; margin-bottom: 6px; }
  .bajada { display: none; }
  .prisma { min-height: 44px; font-size: 14px; margin: 0 auto; border-width: 10px;
            border-image-width: 10px; max-width: 200px; }
  .logo img { width: min(34%, 96px); }
  .idioma-t { font-size: 14px; margin: 2px 0 6px; }
  .grande-op { min-height: 44px; font-size: 12.5px; padding: 6px 10px; }
  .record { margin: 2px 0 0; font-size: 11px; }
  .botones.chicos { margin-top: 4px; gap: 4px; }
  .botones.chicos .chico { font-size: 11.5px; padding: 3px 8px; }
  .fin h2 { font-size: 22px; }
  /* Acostado el panel mide 250 px de ancho —la escala sale del alto, no del
     ancho—, así que los cinco botones del pie NO entran en una fila: van en
     dos, y lo que se achica es todo lo demás hasta que la tapa entra sin
     desplazar. Probé la fila única y los botones se salían del panel: quedaban
     dibujados y no se podían tocar, que es peor que no verlos. */
  .botones.chicos .chico { padding: 2px 7px; font-size: 10.5px; }
  .opcion { font-size: 10.5px; gap: 4px; }
  .tapa { padding: 2px 6px 4px; }
  .logo img { width: min(28%, 80px); }
  .luces-grandes { font-size: 20px; margin-bottom: 2px; }
  .lista li { padding: 3px 2px; font-size: 12px; }
  .perfecto, .ultimo { font-size: 11.5px; margin: 2px 0; }
}

/* ── assets.js ── */
const M_assets = (() => {
  // De donde sale cada archivo: del disco cuando el juego esta suelto, y de un
  // mapa de data: URIs cuando esta empaquetado en un solo HTML. Un solo lugar que
  // lo decida evita que la mitad del codigo ande desde file:// y la otra no.
  const ruta = (p) => (globalThis.ARCHIVOS && globalThis.ARCHIVOS[p]) || p;

  return { ruta };
})();

/* ── haz.js ── */
const M_haz = (() => {
  // El rayo: por dónde pasa, dado un tablero.
  //
  // ES UNA FUNCION PURA Y VIVE SOLA. La usan tres cosas que no se conocen entre
  // sí: el juego para dibujar, el generador para armar niveles y el solucionador
  // para probar que se pueden ganar. Si el generador y el juego trazaran el rayo
  // con código distinto, el generador podría jurar que un nivel se resuelve y el
  // jugador ver que no — que es el peor error posible en un juego de puzzles,
  // porque no se ve como un error: se ve como que sos tonto.

  const DIRS = { der: [1, 0], izq: [-1, 0], arr: [0, -1], aba: [0, 1] };

  // Los dos espejos, como tablas. Escritos como `if` encadenados esto se lee
  // tres veces y se entiende ninguna.
  //                       der    izq    arr    aba
  const REBOTE = {
    0: { der: "arr", izq: "aba", arr: "der", aba: "izq" },   // "/"
    1: { der: "aba", izq: "arr", arr: "izq", aba: "der" },   // "\"
  };

  const VACIO = 0, MURO = 1, ESPEJO = 2, FIJO = 3, EMISOR = 4, OBJETIVO = 5;

  /** Una celda del tablero, por índice. Afuera del tablero devuelve null. */
  const celdaEn = (n, c, f) =>
    (c < 0 || f < 0 || c >= n.ancho || f >= n.alto) ? null : n.celdas[f * n.ancho + c];

  /**
   * Traza todos los rayos y devuelve por dónde pasaron y qué objetivos prendieron.
   *
   * `estado` es el vuelco de cada espejo movible, en el orden en que aparecen en
   * `nivel.espejos`. Se pasa aparte del tablero para que el solucionador pueda
   * probar miles de combinaciones sin copiar el tablero cada vez.
   */
  function trazar(nivel, estado) {
    const tramos = [];                     // [c, f, dirEntra, dirSale, color]
    const prendidos = new Set();
    for (const em of nivel.emisores) {
      let [c, f] = [em.c, em.f];
      let dir = em.dir;
      const color = em.color;

const M_juego = (() => {
  // La partida: un nivel, los toques y cuándo está ganado.
  //
  // No hay bucle de física ni cuadros: un puzzle es una MAQUINA DE ESTADOS y
  // tratarlo como un juego de acción es lo que hace que los puzzles se sientan
  // resbalosos. Acá pasa algo sólo cuando alguien toca algo.

  const { ESPEJO, trazar, ganado } = M_haz;
  class Partida {
    constructor(nivel, numero) {
      this.nivel = nivel;
      this.numero = numero;
      // Copia: el nivel viene de un JSON que se comparte entre partidas, y
      // escribirle el estado adentro haría que volver a jugarlo arranque desde
      // donde lo dejaste la vez pasada — un puzzle que ya viene medio resuelto.
      this.estado = nivel.inicial.slice();
      this.toques = 0;
      this.ganado = false;
      this.recalcular();
    }

    get par() { return this.nivel.par; }
    /** Tres luces si lo hiciste en el par, dos si le erraste por poco, una si no. */
    get luces() {
      if (!this.ganado) return 0;
      if (this.toques <= this.par) return 3;
      if (this.toques <= this.par + 2) return 2;
      return 1;
    }

    celda(c, f) {
      const n = this.nivel;
      if (c < 0 || f < 0 || c >= n.ancho || f >= n.alto) return null;
      return n.celdas[f * n.ancho + c];
    }

    /**
     * Dar vuelta el espejo de una celda. Devuelve si hizo algo.
     *
     * GANADO SE CONGELA. Sin esto, después de ganar se puede seguir tocando y el
     * contador sigue subiendo: la pantalla de victoria aparece con un número
     * distinto del que se ganó, y encima la victoria se puede "desganar".
     */
    tocar(c, f) {
      if (this.ganado) return false;
      const cel = this.celda(c, f);
      if (!cel || cel.t !== ESPEJO) return false;
      this.estado[cel.i] ^= 1;
      this.toques++;
      this.recalcular();
      return true;
    }

    reiniciar() {
      this.estado = this.nivel.inicial.slice();
      this.toques = 0;
      this.ganado = false;
      this.recalcular();
    }

    recalcular() {
      const r = trazar(this.nivel, this.estado);
      this.tramos = r.tramos;
      this.prendidos = r.prendidos;
      if (!this.ganado && r.prendidos.size === this.nivel.objetivos.length) this.ganado = true;
    }

    /** Para las pruebas y la pista: ¿se gana desde acá, y en cuántos toques? */
    static resolver(nivel, estado) {
      const n = nivel.espejos.length;
      const inicio = estado.reduce((a, v, i) => a + (v << i), 0);
      const dist = new Int16Array(1 << n).fill(-1);
      dist[inicio] = 0;
      const cola = [inicio];
      for (let i = 0; i < cola.length; i++) {
        const k = cola[i];
        const est = Array.from({ length: n }, (_, b) => (k >> b) & 1);
        if (ganado(nivel, est)) return dist[k];
        for (let b = 0; b < n; b++) {
          const v = k ^ (1 << b);
          if (dist[v] === -1) { dist[v] = dist[k] + 1; cola.push(v); }
        }
      }
      return -1;
    }

    /**
     * La pista: cuál espejo tocar para acercarse.
     *
     * ES LA SOLUCION DE VERDAD, no una sugerencia. Busca la distancia a ganar
     * desde el estado de ahora y devuelve el espejo que la baja en uno. Una pista
     * que a veces te aleja es peor que no tener pista: te enseña a desconfiar de
     * la única ayuda que hay.
     */
    pista() {
      const falta = Partida.resolver(this.nivel, this.estado);
      if (falta <= 0) return null;
      for (let b = 0; b < this.estado.length; b++) {
        const prueba = this.estado.slice();
        prueba[b] ^= 1;
        if (Partida.resolver(this.nivel, prueba) === falta - 1) return this.nivel.espejos[b];
      }
      return null;
    }
  }

  return { Partida };
})();

const M_dibujo = (() => {
  // El dibujo del tablero. Todo vectorial: son rectángulos, líneas y círculos, y
  // el código los hace más nítidos que cualquier imagen escalada.

  const { VACIO, MURO, ESPEJO, FIJO, EMISOR, OBJETIVO, DIRS } = M_haz;
  const { ruta } = M_assets;
  const COLOR = {
    cian: { vivo: "#5ad8ff", apagado: "#1d4a5e", brillo: "rgba(90,216,255,.30)" },
    rosa: { vivo: "#ff7bd5", apagado: "#5e2450", brillo: "rgba(255,123,213,.30)" },
    ambar: { vivo: "#ffc24a", apagado: "#5e4418", brillo: "rgba(255,194,74,.30)" },
  };

  const VISTA = { ancho: 360, alto: 640 };

  const arte = {};
  function registrarArte(nombre, imagen) { if (imagen) arte[nombre] = imagen; }
  const rutaArte = (n) => ruta(`assets/arte/${n}.webp`);

  /** Dónde cae el tablero adentro del lienzo, y cuánto mide una celda. */
  function medidas(nivel) {
    const margen = 14;
    const lado = Math.floor(Math.min((VISTA.ancho - margen * 2) / nivel.ancho,
                                     (VISTA.alto - 150) / nivel.alto));
    const an = lado * nivel.ancho, al = lado * nivel.alto;
    return { lado, x0: Math.round((VISTA.ancho - an) / 2), y0: Math.round((VISTA.alto - al) / 2 + 14) };
  }

  /** De un toque en el lienzo a una celda. Devuelve null si cayó afuera. */
  function celdaDe(nivel, px, py) {
    const { lado, x0, y0 } = medidas(nivel);
    const c = Math.floor((px - x0) / lado), f = Math.floor((py - y0) / lado);
    if (c < 0 || f < 0 || c >= nivel.ancho || f >= nivel.alto) return null;
    return { c, f };
  }

  function dibujar(ctx, p, t, anim) {
    const n = p.nivel;
    const { lado, x0, y0 } = medidas(n);
    ctx.clearRect(0, 0, VISTA.ancho, VISTA.alto);

    // El tablero: una cuadrícula tenue. Sin ella no se ve dónde se puede tocar y
    // el jugador prueba a ciegas — que en un puzzle es lo mismo que no jugar.
    ctx.fillStyle = "#101628";
    ctx.fillRect(x0 - 5, y0 - 5, lado * n.ancho + 10, lado * n.alto + 10);
    // La mesa: una textura CASI NEGRA por debajo de todo. Arriba van rayos de
    // colores saturados, y una textura con carácter propio les pelea el contraste
    // justo donde hay que leer por dónde pasa el rayo. Se recorta al tablero para
    // que el borde del tablero siga siendo un borde.
    if (arte.fondo_mesa) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x0 - 5, y0 - 5, lado * n.ancho + 10, lado * n.alto + 10);
      ctx.clip();
      ctx.globalAlpha = 0.55;
      ctx.drawImage(arte.fondo_mesa, x0 - 5, y0 - 5, lado * n.ancho + 10, lado * n.alto + 10);
      ctx.restore();
    }
    ctx.strokeStyle = "rgba(255,255,255,.055)"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 0; c <= n.ancho; c++) { ctx.moveTo(x0 + c * lado, y0); ctx.lineTo(x0 + c * lado, y0 + n.alto * lado); }
    for (let f = 0; f <= n.alto; f++) { ctx.moveTo(x0, y0 + f * lado); ctx.lineTo(x0 + n.ancho * lado, y0 + f * lado); }
    ctx.stroke();

    dibujarRayos(ctx, p, lado, x0, y0, t);

    for (let f = 0; f < n.alto; f++)

  //
  // SON POCAS Y DURAN POCO A PROPOSITO. Un puzzle no se mira como un juego de
  // acción: la vista está quieta sobre el tablero, y cualquier cosa que se mueva
  // mucho tiempo pasa de ser una celebración a ser una distracción justo cuando
  // alguien está contando rebotes.
  const CHISPAS = [];

    for (let i = 0; i < n; i++) {

      const v = 0.9 + Math.random() * 1.6;
      CHISPAS.push({ c, f, dx: Math.cos(a) * v, dy: Math.sin(a) * v, color,
                     nacida: performance.now(), vida: 320 + Math.random() * 260 });
    }
  }

  function dibujarChispas(ctx, lado, x0, y0, ahora) {
    for (let i = CHISPAS.length - 1; i >= 0; i--) {
      const ch = CHISPAS[i];
      const edad = (ahora - ch.nacida) / ch.vida;
      if (edad >= 1) { CHISPAS.splice(i, 1); continue; }
      const [x, y] = cen(ch.c, ch.f, lado, x0, y0);

        ctx.beginPath();
        ctx.moveTo(x - ec * lado / 2, y - ef * lado / 2);
        ctx.lineTo(x, y);
        if (sale) {
          const [sc, sf] = DIRS[sale];
          ctx.lineTo(x + sc * lado / 2, y + sf * lado / 2);
        }
        ctx.stroke();
      }
    }
  }

  function dibujarCelda(ctx, p, c, f, lado, x0, y0, t, anim) {
    const cel = p.celda(c, f);
    if (!cel || cel.t === VACIO) return;
    const [x, y] = cen(c, f, lado, x0, y0);
    const r = lado * 0.38;

    if (cel.t === MURO) {
      ctx.fillStyle = "#2c3350";
      ctx.beginPath(); ctx.roundRect(x - lado * 0.42, y - lado * 0.42, lado * 0.84, lado * 0.84, 5); ctx.fill();
      ctx.strokeStyle = "#454f78"; ctx.lineWidth = 2; ctx.stroke();
      return;
    }

    if (cel.t === EMISOR) {
      const col = COLOR[cel.color];
      ctx.fillStyle = "#1b2440";
      ctx.beginPath(); ctx.roundRect(x - lado * 0.42, y - lado * 0.42, lado * 0.84, lado * 0.84, 7); ctx.fill();
      ctx.strokeStyle = col.vivo; ctx.lineWidth = 2.5; ctx.stroke();
      // La boca mira para donde sale el rayo: es lo único que dice hacia dónde
      // dispara, y sin eso hay que trazar el rayo con el dedo para enterarse.
      const [dc, df] = DIRS[cel.dir];
      ctx.fillStyle = col.vivo;
      ctx.beginPath();
      ctx.arc(x + dc * lado * 0.26, y + df * lado * 0.26, lado * 0.13, 0, 7);
      ctx.fill();
      return;
    }

    if (cel.t === OBJETIVO) {
      const col = COLOR[cel.color];
      const on = p.prendidos.has(`${c},${f}`);
      ctx.strokeStyle = on ? col.vivo : col.apagado;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, 7);
      ctx.fillStyle = on ? col.vivo : "transparent"; ctx.fill();
      if (on) {
        // Un anillo que late: el objetivo prendido tiene que verse desde el otro
        // lado de la pantalla, porque es la única forma de saber que vas bien.
        ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t * 0.005);
        ctx.strokeStyle = col.vivo; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(x, y, r + 5, 0, 7); ctx.stroke();
        ctx.globalAlpha = 1;
      }
      return;
    }

    // Los espejos. El movible se dibuja con un marco redondeado —"esto se toca"—
    // y el fijo sin nada: la diferencia tiene que leerse de un vistazo, porque
    // tocar veinte veces uno fijo es la forma más rápida de creer que el juego
    // está roto.
    const movible = cel.t === ESPEJO;
    const vuelco = movible ? p.estado[cel.i] : cel.vuelco;
    // EL ESPEJO GIRA, no salta. Los dos estados están exactamente a noventa
    // grados, así que la animación es la rotación de verdad y no un truco: en
    // ciento cuarenta milisegundos se ve DE DONDE a DONDE fue, que es justo lo que
    // hay que entender para saber si el toque sirvió. Saltando, en un tablero con
    // once espejos, ni se nota cuál se movió.
    let giro = 0;
    if (movible && anim && anim.c === c && anim.f === f && !anim.pista) {
      const k = Math.min(1, (performance.now() - anim.t) / 140);
      // Arranca rápido y frena: `1-(1-k)^3`. Lineal se ve como una pieza empujada
      // por una máquina; con freno se ve como algo que se soltó.
      const suave = 1 - Math.pow(1 - k, 3);
      giro = (1 - suave) * (Math.PI / 2) * (vuelco === 0 ? 1 : -1);
    }
    if (movible) {
      ctx.fillStyle = "rgba(90,216,255,.07)";
      ctx.strokeStyle = "rgba(90,216,255,.30)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(x - lado * 0.44, y - lado * 0.44, lado * 0.88, lado * 0.88, 8);
      ctx.fill(); ctx.stroke();
    }
    const d = lado * 0.34;
    ctx.save();
    ctx.translate(x, y);
    if (giro) ctx.rotate(giro);
    const [ax, ay, bx, by] = vuelco === 0 ? [-d, d, d, -d] : [-d, -d, d, d];
    ctx.strokeStyle = movible ? "#e8f3ff" : "#8b97b8";
    ctx.lineWidth = movible ? 5 : 4;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    // El canto oscuro del espejo, del lado de atrás: le da grosor y hace que se
    // lea como un objeto y no como una raya.
    ctx.strokeStyle = movible ? "#5b7fa8" : "#3f4763";
    ctx.lineWidth = 2;
    const off = lado * 0.07;
    ctx.beginPath();
    ctx.moveTo(ax + off, ay + off); ctx.lineTo(bx + off, by + off);
    ctx.stroke();
    ctx.restore();
    if (!movible) {
      ctx.fillStyle = "#3f4763";
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 7); ctx.fill();
    }
  }

  /** El barrido de la victoria: una banda de luz que cruza el tablero una vez. */
  function barrido(ctx, nivel, edad) {
    const { lado, x0, y0 } = medidas(nivel);
    const an = lado * nivel.ancho, al = lado * nivel.alto;
    const y = y0 - 40 + edad * (al + 80);
    const g = ctx.createLinearGradient(0, y - 60, 0, y + 60);
    g.addColorStop(0, "rgba(182,240,255,0)");
    g.addColorStop(0.5, `rgba(182,240,255,${0.5 * (1 - edad)})`);
    g.addColorStop(1, "rgba(182,240,255,0)");
    ctx.save();
    ctx.beginPath(); ctx.rect(x0 - 5, y0 - 5, an + 10, al + 10); ctx.clip();
    ctx.fillStyle = g;
    ctx.fillRect(x0 - 5, y - 60, an + 10, 120);
    ctx.restore();
  }

  /** El destello del espejo recién tocado: dura poco y no guarda estado. */
  function marcarToque(ctx, nivel, c, f, edad) {
    const { lado, x0, y0 } = medidas(nivel);
    const [x, y] = cen(c, f, lado, x0, y0);
    ctx.globalAlpha = Math.max(0, 1 - edad);
    ctx.strokeStyle = "#e8f3ff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, lado * (0.4 + edad * 0.5), 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  return { COLOR, VISTA, registrarArte, rutaArte, medidas, celdaDe, dibujar, chispear, barrido, marcarToque };
})();

/* ── audio.js ── */
const M_audio = (() => {
  // El sonido, sintetizado. No hay un solo archivo de audio.
  //
  // Un puzzle no tiene velocidad que informar, asi que no hay sonido de fondo:
  // hay respuestas a los toques y nada mas. Un juego sin tiempo con musica
  // insistente apura a alguien que justamente no tiene que apurarse.
  //
  // El contexto NO se crea al arrancar: los navegadores no dejan sonar nada hasta
  // que hubo un gesto, y uno creado antes queda "suspended" para siempre.

  let ac = null, maestro = null, prendido = true;

  function despertar() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    maestro = ac.createGain();
    maestro.gain.value = 0.5;
    maestro.connect(ac.destination);
    return ac;
  }

  const sonando = (v) => { prendido = v; if (maestro) maestro.gain.value = v ? 0.5 : 0; };

  // El contexto y el maestro se comparten con la musica: dos AudioContext en la
  // misma pagina es el error que hace que en un telefono uno de los dos no suene
  // nunca —el navegador limita cuantos deja abiertos— y ademas el silencio se
  // pediria dos veces, una por cada arbol.
  const contexto = () => ac;
  const salida = () => maestro;

  function env(nodo, a, d, pico) {
    const g = ac.createGain(), t = ac.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(pico, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    nodo.connect(g); g.connect(maestro);
    return t + a + d;
  }

  function tono(tipo, f0, f1, a, d, pico) {
    if (!ac || !prendido) return;
    const o = ac.createOscillator();
    o.type = tipo;
    o.frequency.setValueAtTime(f0, ac.currentTime);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, ac.currentTime + a + d);
    const fin = env(o, a, d, pico);
    o.start(); o.stop(fin + 0.02);
  }

  const efe = {
    // LOS DOS SONIDOS QUE IMPORTAN SON DISTINTOS ENTRE SI: dar vuelta un espejo
    // y prender un objetivo. En un puzzle sin tiempo, el sonido es la única
    // respuesta inmediata que hay a un toque, y si los dos suenan parecido se
    // pierde la única señal de "esto estuvo bien" que el juego da antes de ganar.
    // El espejo suena DISTINTO segun para donde quede: subiendo para "/" y
    // bajando para "\\". Es un detalle de dos lineas y hace que, tocando sin
    // mirar, se sepa en que estado quedo.
    espejo(vuelco) { vuelco ? tono("triangle", 980, 720, 0.003, 0.05, 0.09)
                            : tono("triangle", 720, 980, 0.003, 0.05, 0.09); },
    prende() { tono("sine", 880, 1320, 0.004, 0.16, 0.12); },
    apaga() { tono("sine", 620, 440, 0.004, 0.10, 0.07); },
    gana() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tono("triangle", f, f, 0.01, 0.26, 0.13), i * 85)); },
    pista() { tono("square", 1200, 900, 0.004, 0.14, 0.07); },
    // El ultimo objetivo suena una quinta mas alto que los otros: es el aviso de
    // que ya esta, y llega antes que la pantalla de victoria.
    ultimo() { tono("sine", 1320, 1980, 0.004, 0.24, 0.13); },
    nivel() { [784, 1047].forEach((f, i) => setTimeout(() => tono("triangle", f, f, 0.01, 0.18, 0.1), i * 80)); },
    menu() { tono("square", 520, 700, 0.004, 0.07, 0.1); },
  };

  return { despertar, sonando, contexto, salida, efe };
})();

/* ── guardado.js ── */
const M_guardado = (() => {
  // Lo que se guarda: hasta qué nivel llegaste, cuántas luces sacaste en cada
  // uno, el idioma y si el sonido está prendido. Nada más.
  //
  // localStorage TIRA EXCEPCION en modo privado o con el almacenamiento
  // bloqueado — no devuelve vacío. Un juego que no arranca porque no pudo leer su
  // progreso es peor que uno sin progreso.

  const LLAVE = "espejo.v1";
  // `idioma: null` quiere decir "nunca eligió", que NO es lo mismo que "eligió
  // inglés": es lo único que distingue al que abre el juego por primera vez del
  // que ya eligió inglés y no quiere que le pregunten más.
  const vacio = () => ({ luces: {}, ajustes: { sonido: true, musica: true, idioma: null } });
  let cache = null;

  function cargar() {
    if (cache) return cache;
    try {
      const c = localStorage.getItem(LLAVE);
      cache = c ? { ...vacio(), ...JSON.parse(c) } : vacio();
      cache.ajustes = { ...vacio().ajustes, ...(cache.ajustes || {}) };
      cache.luces = cache.luces || {};
    } catch (e) { cache = vacio(); }
    return cache;
  }
  function guardar() {
    try { localStorage.setItem(LLAVE, JSON.stringify(cargar())); } catch (e) {}
  }
  function borrar() {
    try { localStorage.removeItem(LLAVE); } catch (e) {}
    cache = null;
  }

  /** Cuántas luces sacaste en un nivel (0 si no lo ganaste). */
  const lucesDe = (i) => cargar().luces[i] || 0;

  /** Guardar un resultado, pero NUNCA para atrás: tres luces no se pierden por
   *  volver a jugar el nivel y hacerlo peor. Un juego que castiga por practicar
   *  enseña a no practicar. */
  function anotar(i, luces) {
    const d = cargar();
    if (luces > (d.luces[i] || 0)) { d.luces[i] = luces; guardar(); return true; }
    return false;
  }

  /** Hasta dónde se puede jugar: el primero sin ganar, y ni uno más. */
  function abiertos(total) {
    const d = cargar();
    let i = 0;
    while (i < total && d.luces[i]) i++;
    return Math.min(total, i + 1);
  }

  const totalLuces = () => Object.values(cargar().luces).reduce((a, b) => a + b, 0);

  return { cargar, guardar, borrar, lucesDe, anotar, abiertos, totalLuces };
})();

    "como.par": "É a <b>menor quantidade</b> de toques com que dá para vencer aquela fase, e não é estimativa: uma máquina calculou percorrendo todas as combinações possíveis de espelhos. Vencer no par dá três luzes; até dois toques a mais, duas luzes.",
    "como.h-hecho": "Do que é feito",
    "como.hecho1": "Nenhuma fase foi desenhada à mão. Tabuleiros são jogados ao acaso e só entram os que uma busca em largura prova que <b>dá para vencer</b>, que <b>não vêm já vencidos</b> e cujo par cai na faixa daquele número de fase. De quarenta e quatro mil tabuleiros jogados sobraram quarenta.",
    "como.hecho2": "Esse trabalho é do gerador e um teste o refaz, com o mesmo traçador de raios que o jogo usa para desenhar. Se o gerador e o jogo traçassem o raio com código diferente, o gerador poderia jurar que uma fase tem solução e você ver que não — e isso não parece um erro, parece que o burro é você.",

    "hud.salir": "Voltar às fases",
    "hud.nivel": "Fase {n}",
    "hud.toques": "toques",
    "hud.toques1": "toque",
    "hud.par": "par {n}",
    "hud.reiniciar": "Reiniciar a fase",
    "hud.pista": "Dica",

    "fin.titulo": "Resolvido!",
    "fin.toques": "Toques",
    "fin.par": "Par",
    "fin.perfecto": "No par exato",
    "fin.siguiente": "SEGUE",
    "fin.siguiente-aria": "Próxima fase",
    "fin.repetir": "Repetir",
    "fin.niveles": "Às fases",
    "fin.ultimo": "Você terminou as quarenta. Não sobrou nenhuma sem resolver.",
  };

  const TABLA = { es: ES, en: EN, pt: PT };
  let actual = "en";

  const idioma = () => actual;

  function ponerIdioma(cod) {
    actual = TABLA[cod] ? cod : "en";
    document.documentElement.lang = { es: "es-AR", en: "en", pt: "pt-BR" }[actual];
    return actual;
  }

  /** Lo que falte cae al inglés; lo que falte también ahí devuelve la clave, que
   *  en pantalla se ve mal a propósito y así se encuentra sin leer tres tablas. */
  function t(clave, vars) {
    let s = TABLA[actual][clave] ?? EN[clave] ?? clave;
    if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }

  function aplicar(raiz = document) {
    for (const e of raiz.querySelectorAll("[data-t]")) e.textContent = t(e.dataset.t);
    for (const e of raiz.querySelectorAll("[data-t-html]")) e.innerHTML = t(e.dataset.tHtml);
    for (const e of raiz.querySelectorAll("[data-t-attr]"))
      for (const par of e.dataset.tAttr.split(",")) {
        const [at, clave] = par.split(":").map((x) => x.trim());
        if (at && clave) e.setAttribute(at, t(clave));
      }
    const tit = document.querySelector("title");
    if (tit) tit.textContent = t("doc.titulo");
    const desc = document.querySelector('meta[name="description"]');
    if (desc) desc.setAttribute("content", t("doc.desc"));
  }

  return { IDIOMAS, idioma, ponerIdioma, t, aplicar };
})();

/* ── musica.js ── */
const M_musica = (() => {
  // La música. Dos cosas distintas, y a propósito.
  //
  // EN EL MENU SUENA UN TEMA GRABADO. Es un bucle corto —el modelo que lo generó
  // da nueve segundos y de ahí sale un bucle de cinco— y eso en un menú no
  // molesta: nadie se queda diez minutos mirando un menú. Da atmósfera, que es
  // justo lo que un puñado de osciladores no da.
  //
  // EN EL JUEGO LA MUSICA SE TOCA SOLA, con osciladores, y no se repite nunca.
  // Un bucle de seis segundos abajo de alguien que está pensando hace treinta y
  // cinco vueltas en tres minutos y vuelve loco a cualquiera. Acá hay una
  // progresión de acordes, un bajo y campanas sueltas, y la densidad sube con los
  // objetivos que ya prendiste: la música dice cuánto te falta.
  //
  // Y ACA NO HAY PERCUSION NUNCA. Un bombo marca un tempo, un tempo es un apuro y
  // este juego no tiene reloj: apurar a alguien que está resolviendo un puzzle es
  // la forma más rápida de que lo deje.
  //
  // Y NO PESA NADA. Cero archivos, cero kilobytes, y nunca se desactualiza.

  const { ruta } = M_assets;
  // La escala y los acordes. Mayor lidio —una cuarta aumentada— que es el sonido
  // de "esto se puede resolver": acá no hay peligro ni apuro, hay un problema
  // arriba de una mesa, y la música tiene que dejar pensar en vez de empujar.
  const ESCALA = [0, 2, 4, 6, 7, 9, 11];         // semitonos desde la tónica
  const ACORDES = [                               // grados, en semitonos
    [0, 4, 7], [2, 7, 11], [-3, 4, 9], [-5, 2, 7],
  ];
  const TONICA = 65.4;                            // Do2, en hercios
  const COMPAS = 8;                               // corcheas por acorde
  const PULSO = 0.34;                             // segundos por corchea (≈ 44 BPM)

  const nota = (semi) => TONICA * Math.pow(2, semi / 12);

  let ac = null, maestro = null, bus = null;
  let prendida = true, corriendo = false;
  let paso = 0, proximo = 0, reloj = null;
  let intensidad = 0, objetivo = 0;
  let tema = null, temaGan = null;

  /** Se engancha al mismo contexto y al mismo maestro que los efectos. */
  function conectar(contexto, salidaMaestra) {
    if (!contexto || ac) return;
    ac = contexto;
    maestro = salidaMaestra;
    bus = ac.createGain();
    // La música va MAS BAJA que los efectos, y bastante. Un efecto que no se
    // escucha por encima de la música es un efecto que no existe: el sonido del
    // paraguas cerrándose es información, y la música es decoración.
    bus.gain.value = 0.3;
    bus.connect(maestro);
  }

  function sonando(v) {
    prendida = v;
    if (bus) bus.gain.setTargetAtTime(v ? 0.3 : 0, ac.currentTime, 0.12);
    if (tema) tema.volume = v ? 0.5 : 0;
    if (!v) parar();
  }

  /** ¿Está corriendo el secuenciador? Lo usa la prueba de sonido.
   *
   * NO ALCANZA CON CONTAR OSCILADORES para comprobar que la música se apagó: el
   * juego sigue pasando mientras se mide —el bicho se cae, algo choca— y cada
   * efecto es un oscilador más. Contando nomás, la prueba fallaba por sonidos que
   * tenían que sonar. Esto distingue "no hay música" de "no hay ningún sonido".
   */
  const andando = () => corriendo;

  /** `v` de 0 a 1: qué tan intenso viene el juego. Se suaviza solo. */
  const empujar = (v) => { objetivo = Math.max(0, Math.min(1, v)); };

  // --- el tema del menú ----------------------------------------------------
  //
  // Va como <audio> y no por el grafo de WebAudio porque no necesita nada del
  // grafo —ni filtros, ni mezcla, ni sincronía con nada— y un <audio> se repite
  // solo, empieza sin contexto y no se rompe si el navegador todavía no dejó
  // sonar nada.
  function arrancarTema() {
    if (!prendida) return;
    if (!tema) {
      tema = new Audio(ruta("assets/arte/tema.mp3"));
      tema.loop = true;
      tema.volume = 0;
    }
    tema.play().then(() => {
      // La entrada es a mano y no con un `afade` en el archivo: el archivo es un
      // bucle y un fundido adentro del bucle se escucharía en cada vuelta.
      let v = 0;
      clearInterval(temaGan);
      temaGan = setInterval(() => {
        v = Math.min(0.5, v + 0.03);
        tema.volume = prendida ? v : 0;
        if (v >= 0.5) clearInterval(temaGan);
      }, 60);
    }).catch(() => {});
  }

  function pararTema() {
    if (!tema) return;
    clearInterval(temaGan);
    let v = tema.volume;
    temaGan = setInterval(() => {
      v = Math.max(0, v - 0.05);
      tema.volume = v;
      if (v <= 0) { clearInterval(temaGan); tema.pause(); }
    }, 40);
  }

  // --- la música del juego -------------------------------------------------
  function arrancar() {
    if (!ac || corriendo || !prendida) return;
    corriendo = true;
    paso = 0;
    intensidad = 0;
    proximo = ac.currentTime + 0.08;
    // EL PLANIFICADOR VA ADELANTADO. Programar una nota en el momento exacto en
    // que suena la deja a merced del temporizador del navegador, que se atrasa
    // veinte o treinta milisegundos cuando el juego dibuja: el ritmo tiembla y se
    // escucha. Se programan las notas de los próximos 120 ms contra el reloj del
    // audio, que no se atrasa nunca, y el temporizador sólo decide cuándo volver
    // a mirar.
    reloj = setInterval(planificar, 25);
  }

  function parar() {
    corriendo = false;
    clearInterval(reloj);
    reloj = null;
  }

  function planificar() {
    if (!corriendo || !ac) return;
    intensidad += (objetivo - intensidad) * 0.06;
    while (proximo < ac.currentTime + 0.12) {
      tocar(paso, proximo);
      proximo += PULSO;
      paso++;
    }
  }

  function env(nodo, t, a, d, pico) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, pico), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    nodo.connect(g); g.connect(bus);
    return g;
  }

  function voz(tipo, f, t, a, d, pico, corte) {
    const o = ac.createOscillator();
    o.type = tipo;
    o.frequency.setValueAtTime(f, t);
    let n = o;
    if (corte) {
      const fl = ac.createBiquadFilter();
      fl.type = "lowpass";
      fl.frequency.setValueAtTime(corte, t);
      o.connect(fl); n = fl;
    }
    env(n, t, a, d, pico);
    o.start(t); o.stop(t + a + d + 0.05);
  }

  function tocar(i, t) {
    const acorde = ACORDES[Math.floor(i / COMPAS) % ACORDES.length];
    const en = i % COMPAS;
    const int = intensidad;

    // El bajo: la fundamental, en la primera y en la quinta corchea. Es lo único
    // que suena siempre, con el juego quieto o a toda velocidad, y es lo que hace
    // que se sienta que hay un tema y no ruidos sueltos.
    if (en === 0 || en === 4)
      voz("sawtooth", nota(acorde[0]), t, 0.01, 0.34, 0.09, 420 + int * 900);

    // El pad: el acorde entero, largo, una vez por compás. Se abre de filtro con
    // la intensidad, así que a toda velocidad el mismo acorde suena agresivo.
    if (en === 0)
      for (const g of acorde)
        voz("sawtooth", nota(g + 24), t, 0.09, 1.0, 0.022 + int * 0.012, 600 + int * 2400);

    // Las campanas: una nota suelta cada tanto, de la escala del acorde. Es lo
    // único que cambia con la intensidad —o sea, con cuántos objetivos prendiste—
    // y cambia poniéndose MAS FRECUENTE, no más fuerte: subir el volumen para
    // decir "vas bien" es la manera de arruinar una música tranquila.
    const densidad = int > 0.66 ? 2 : int > 0.33 ? 4 : 8;
    if (en % densidad === 0) {
      const grado = ESCALA[(i * 5) % ESCALA.length];
      voz("triangle", nota(acorde[0] + grado + 36), t, 0.006, 0.9, 0.03, 2600);
      voz("sine", nota(acorde[0] + grado + 48), t, 0.004, 0.5, 0.014, 5000);
    }

  }

  return { conectar, sonando, andando, empujar, arrancarTema, pararTema, arrancar, parar };
})();

/* ── main.js ── */
// Arranque, entrada y pantallas.
//
// NO HAY BUCLE DE JUEGO, hay un bucle de DIBUJO. Un puzzle no simula nada: el
// estado cambia sólo cuando alguien toca un espejo. Lo único que se anima es el
// latido de los objetivos prendidos y el destello del último toque, así que el
// dibujo corre pero el juego no "avanza" — y por eso dejar el teléfono abierto
// una hora no cambia nada.

const { Partida } = M_juego;
const { dibujar, celdaDe, marcarToque, chispear, barrido, registrarArte, rutaArte, COLOR, VISTA } = M_dibujo;
const { NIVELES } = M_niveles;
const { despertar, efe, sonando, contexto, salida } = M_audio;
const musica = M_musica;
const { cargar, guardar, borrar, lucesDe, anotar, abiertos, totalLuces } = M_guardado;
const { t, aplicar, ponerIdioma, idioma, IDIOMAS } = M_idioma;
const $ = (s) => document.querySelector(s);

// Despertar el audio ES el momento de conectar la música: antes no hay contexto
// —el navegador no deja crearlo sin un gesto— y después habría que acordarse.
function despertarTodo() {
  despertar();
  musica.conectar(contexto(), salida());
}
const lienzo = $("#lienzo");
const ctx = lienzo.getContext("2d");
let partida = null;
let destello = null;
let gano = 0;                    // cuándo se ganó, para el barrido de luz

// --- tamaño --------------------------------------------------------------
// El tablero se dibuja siempre en 360 de ancho y se escala entero: así una
// celda mide lo mismo en proporción en todos los aparatos y el dedo cae donde
// tiene que caer sin cuentas distintas por pantalla.
let esc = 1;
function redimensionar() {
  esc = Math.min(innerWidth / VISTA.ancho, innerHeight / 560, 3);
  VISTA.alto = Math.round(Math.min(innerHeight / esc, 1000));
  const anCSS = VISTA.ancho * esc, alCSS = VISTA.alto * esc;
  const dpr = Math.min(devicePixelRatio || 1, 2.5);
  lienzo.width = Math.round(anCSS * dpr);
  lienzo.height = Math.round(alCSS * dpr);
  lienzo.style.width = `${anCSS}px`;
  lienzo.style.height = `${alCSS}px`;
  ctx.setTransform(esc * dpr, 0, 0, esc * dpr, 0, 0);
  document.documentElement.style.setProperty("--an", `${anCSS}px`);
  document.documentElement.style.setProperty("--al", `${alCSS}px`);
}
addEventListener("resize", redimensionar);
addEventListener("orientationchange", () => setTimeout(redimensionar, 180));
redimensionar();

// --- entrada -------------------------------------------------------------
// UN TOQUE, NADA MAS. Se usa `pointerup` y no `pointerdown` a propósito: con
// `down`, apoyar el dedo para desplazar la pantalla ya da vuelta un espejo, y
// en un juego donde cada toque cuenta para el puntaje eso es robarle un toque
// a alguien que ni siquiera quería jugar todavía.
lienzo.addEventListener("pointerup", (ev) => {
  if (!partida || partida.ganado) return;
  despertarTodo();
  const r = lienzo.getBoundingClientRect();
  const px = (ev.clientX - r.left) / esc, py = (ev.clientY - r.top) / esc;
  const cel = celdaDe(partida.nivel, px, py);
  if (!cel) return;
  const antes = new Set(partida.prendidos);
  if (!partida.tocar(cel.c, cel.f)) return;
  destello = { ...cel, t: performance.now() };
  efe.espejo(partida.estado[partida.celda(cel.c, cel.f).i]);
  // LAS CHISPAS SALEN DEL OBJETIVO QUE CAMBIO, no del espejo que tocaste. El
  // espejo dice QUE hiciste algo —para eso está el destello— y el objetivo dice
  // SI SIRVIO, que es la única pregunta que importa. Y salen del que se apagó
  // también: perder un objetivo que ya tenías es información igual de valiosa.
  for (const clave of partida.prendidos)
    if (!antes.has(clave)) {
      const [c, f] = clave.split(",").map(Number);
      chispear(c, f, (COLOR[partida.celda(c, f).color] || COLOR.cian).vivo, 14);
    }
  for (const clave of antes)
    if (!partida.prendidos.has(clave)) {
      const [c, f] = clave.split(",").map(Number);
      chispear(c, f, "#5a6478", 7);
    }
  if (partida.ganado) efe.ultimo();
  else if (partida.prendidos.size > antes.size) efe.prende();
  else if (partida.prendidos.size < antes.size) efe.apaga();
  pintarHud();
  if (partida.ganado) gano = performance.now();
  // LA MUSICA DICE CUANTO FALTA: la densidad de las campanas sube con los
  // objetivos ya prendidos. Es la única señal de "vas bien" que no ocupa
  // pantalla, y en un tablero chico la pantalla es lo que más escasea.
  musica.empujar(partida.prendidos.size / Math.max(1, partida.nivel.objetivos.length));
  if (partida.ganado) setTimeout(ganar, 420);
});
lienzo.addEventListener("pointerdown", (ev) => ev.preventDefault());

// --- pantallas -----------------------------------------------------------
function mostrar(id) {
  for (const p of document.querySelectorAll(".pantalla")) p.hidden = true;
  $("#" + id).hidden = false;
  lienzo.style.visibility = id === "p-juego" ? "visible" : "hidden";
}

function alMenu() {
  partida = null;
  musica.parar();
  musica.arrancarTema();
  const abre = abiertos(NIVELES.length);
  $("#m-seguir").textContent = t("menu.seguir", { n: Math.min(abre, NIVELES.length) });
  $("#m-luces").textContent = t("menu.luces", { n: totalLuces(), t: NIVELES.length * 3 });
  mostrar("p-menu");
}

/** La grilla de niveles, con las luces de cada uno y los cerrados apagados. */
function alMapa() {
  const abre = abiertos(NIVELES.length);
  const cont = $("#mapa");
  cont.innerHTML = "";
  for (let i = 0; i < NIVELES.length; i++) {
    const b = document.createElement("button");
    const l = lucesDe(i);
    const cerrado = i + 1 > abre;
    b.className = "celda-niv" + (cerrado ? " cerrado" : "") + (l ? " hecho" : "");
    b.disabled = cerrado;
    // Las luces van como texto y no como imágenes: cuarenta botones con tres
    // iconos cada uno son ciento veinte nodos que se vuelven a armar cada vez
    // que se abre el mapa.
    b.innerHTML = `<b></b><span class="luces"></span>`;
    b.firstChild.textContent = String(i + 1);
    b.lastChild.textContent = cerrado ? "🔒" : "●".repeat(l) + "○".repeat(3 - l);
    if (cerrado) b.setAttribute("aria-label", `${i + 1} — ${t("niv.cerrado")}`);
    else b.addEventListener("click", () => { efe.menu(); jugar(i); });
    cont.append(b);
  }
  mostrar("p-mapa");
}

function jugar(i) {
  despertarTodo();
  efe.nivel();
  musica.pararTema();
  musica.arrancar();
  partida = new Partida(NIVELES[i], i);
  destello = null;
  gano = 0;
  pintarHud();
  mostrar("p-juego");
}

function ganar() {
  efe.gana();
  const p = partida;
  anotar(p.numero, p.luces);
  $("#f-toques").textContent = String(p.toques);
  $("#f-par").textContent = String(p.par);
  $("#f-perfecto").hidden = p.toques > p.par;
  $("#f-luces").textContent = "●".repeat(p.luces) + "○".repeat(3 - p.luces);
  const ultimo = p.numero + 1 >= NIVELES.length;
  $("#f-siguiente").hidden = ultimo;
  $("#f-ultimo").hidden = !ultimo;
  mostrar("p-fin");
}

$("#m-seguir").addEventListener("click", () => {
  efe.menu(); jugar(Math.min(abiertos(NIVELES.length), NIVELES.length) - 1);
});
$("#m-niveles").addEventListener("click", () => { efe.menu(); alMapa(); });
$("#m-como").addEventListener("click", () => { efe.menu(); mostrar("p-como"); });
$("#j-salir").addEventListener("click", () => { efe.menu(); alMapa(); });
$("#j-reiniciar").addEventListener("click", () => {
  if (!partida) return;
  efe.menu(); partida.reiniciar(); destello = null; gano = 0; pintarHud();
});
// LA PISTA CUESTA UN TOQUE, y por eso es una decisión y no un botón de ganar.
// Gratis, la forma óptima de jugar sería apretarla hasta el final; cobrándola,
// usarla te baja de tres luces a dos y el que quiere el par la deja quieta.
$("#j-pista").addEventListener("click", () => {
  if (!partida || partida.ganado) return;
  const e = partida.pista();
  if (!e) return;
  efe.pista();
  destello = { c: e.c, f: e.f, t: performance.now(), pista: true };
  partida.toques++;
  pintarHud();
});
$("#f-siguiente").addEventListener("click", () => { efe.menu(); jugar(partida.numero + 1); });
$("#f-repetir").addEventListener("click", () => { efe.menu(); jugar(partida.numero); });
$("#f-niveles").addEventListener("click", () => { efe.menu(); alMapa(); });
for (const b of document.querySelectorAll("[data-volver]"))
  b.addEventListener("click", () => { efe.menu(); alMenu(); });
for (const b of document.querySelectorAll("[data-mapa]"))
  b.addEventListener("click", () => { efe.menu(); alMapa(); });
$("#aj-sonido").addEventListener("change", (e) => {
  const d = cargar(); d.ajustes.sonido = e.target.checked; guardar(); sonando(e.target.checked);
});
// LA MUSICA SE APAGA APARTE DE LOS EFECTOS: son dos molestias distintas, y en un
// juego de pensar la primera que estorba es la música.
$("#aj-musica").addEventListener("change", (e) => {
  const d = cargar(); d.ajustes.musica = e.target.checked; guardar();
  musica.sonando(e.target.checked);
  if (e.target.checked && !partida) musica.arrancarTema();
});
$("#m-borrar").addEventListener("click", () => {
  if (!confirm(t("menu.borrar-confirmar"))) return;
  // Borrar el progreso NO borra el idioma: está en el mismo bulto guardado,
  // pero volver al inglés porque alguien reseteó sus niveles es un castigo que
  // nadie pidió.
  const cod = cargar().ajustes.idioma;
  borrar();
  const nuevo = cargar(); nuevo.ajustes.idioma = cod; guardar();
  alMenu();
});

// --- idiomas -------------------------------------------------------------
// Cambiar de idioma reescribe los `data-t` y ADEMAS vuelve a pintar lo que se
// escribe desde JavaScript: el botón de seguir, el contador de luces y el mapa
// no tienen marca en el HTML y quedarían en el idioma anterior.
function elegir(cod, guardarlo = true) {
  ponerIdioma(cod);
  aplicar();
  $("#m-idioma").textContent = cod.toUpperCase();
  if (guardarlo) { const d = cargar(); d.ajustes.idioma = cod; guardar(); }
}
for (const b of document.querySelectorAll("[data-idioma]"))
  b.addEventListener("click", () => { efe.menu(); elegir(b.dataset.idioma); alMenu(); });
$("#m-idioma").addEventListener("click", () => {
  const cods = Object.keys(IDIOMAS);
  efe.menu();
  elegir(cods[(cods.indexOf(idioma()) + 1) % cods.length]);
  alMenu();
});

// --- HUD -----------------------------------------------------------------
function pintarHud() {
  if (!partida) return;
  $("#h-nivel").textContent = t("hud.nivel", { n: partida.numero + 1 });
  // "1 toques" es el detalle que hace que un juego se sienta hecho a las
  // apuradas, y aparece justo en el primer toque de cada nivel.
  $("#h-toques").textContent =
    `${partida.toques} ${t(partida.toques === 1 ? "hud.toques1" : "hud.toques")}`;
  $("#h-par").textContent = t("hud.par", { n: partida.par });
  $("#h-toques").classList.toggle("pasado", partida.toques > partida.par);
}

// --- dibujo --------------------------------------------------------------
function bucle(ahora) {
  requestAnimationFrame(bucle);
  if (!partida || $("#p-juego").hidden) return;
  try {
    dibujar(ctx, partida, ahora, destello);
    if (destello) {
      const edad = (ahora - destello.t) / (destello.pista ? 900 : 380);
      if (edad >= 1) destello = null;
      else marcarToque(ctx, partida.nivel, destello.c, destello.f, edad);
    }
    // El barrido de la victoria cruza el tablero una vez, en el segundo que pasa
    // entre ganar y que aparezca la pantalla del final: sin él, ganar es que la
    // pantalla cambie de golpe y no se llega a ver el tablero resuelto.
    if (gano) {
      const edad = (ahora - gano) / 900;
      if (edad >= 1) gano = 0;
      else barrido(ctx, partida.nivel, edad);
    }
  } catch (e) {
    // Un error adentro del dibujo se repite sesenta veces por segundo y deja la
    // pantalla quieta, sin forma de salir.
    console.error("Espejo se rompió:", e);
    partida = null; alMenu();
  }
}

// --- arranque ------------------------------------------------------------
const d = cargar();
$("#aj-sonido").checked = d.ajustes.sonido;
sonando(d.ajustes.sonido);
$("#aj-musica").checked = d.ajustes.musica;
musica.sonando(d.ajustes.musica);
elegir(d.ajustes.idioma || "en", false);
if (d.ajustes.idioma) alMenu();
else mostrar("p-idioma");
requestAnimationFrame(bucle);

// LA MESA SE CARGA DESPUES Y NO BLOQUEA NADA: hasta que llega, el tablero se
// dibuja sobre el color liso de siempre. Una conexión lenta no puede dejar a
// nadie mirando una pantalla de carga por una textura decorativa.
(async () => {
  const im = new Image();
  im.onload = () => registrarArte("fondo_mesa", im);
  im.src = rutaArte("fondo_mesa");
})();

// Para las pruebas: poder mirar y manejar la partida desde afuera.
globalThis.ESPEJO = {
  get partida() { return partida; },
  NIVELES, Partida, jugar, alMenu, alMapa,
};
// La conversión de píxel a celda, expuesta aparte para que la prueba del
// teléfono pueda recorrer las cuarenta celdas del tablero preguntando "¿este
// punto es esta celda?". Es la cuenta donde se esconden los errores de escala y
// de centrado, y comprobarla a ojo es imposible: un error de medio píxel no se
// ve en el medio del tablero y sí en los bordes.
globalThis.__celdaDe = celdaDe;

// Un gancho para la prueba de sonido: dispara UN efecto. Los efectos no dejan
// rastro en el DOM ni en el estado, así que la única forma de comprobar que
// siguen sonando con la música apagada es pedir uno y contar los osciladores.
globalThis.__efe = () => efe.menu();
globalThis.__musicaAndando = () => musica.andando();


})();
</script>
