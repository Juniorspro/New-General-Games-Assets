<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Garfio</title>
<meta name="description" content="Una torre sin techo y un gancho. Apoyás el dedo y te colgás; arrastrás y te hamacás; soltás y salís disparado.">
<style>
/* Garfio — hoja única.
   Vertical y nada más: el juego se dibuja en 360 de ancho y se escala entero,
   así que la interfaz vive dentro de ese rectángulo. Las medidas van en svh y
   no en vh porque en un teléfono vh incluye la barra del navegador y el último
   renglón queda siempre tapado. */

:root {
  --fondo: #0b1020;
  --borde: #26335c;
  --texto: #e9eef7;
  --tenue: #93a0bb;
  --cian: #5ad8ff;
  --cian-claro: #b6f0ff;
  --cian-hondo: #1d6c8c;
  --oxido: #e08b2c;
  --mal: #ff6b6b;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--fondo); color: var(--texto);
  font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none;
}
body { min-height: 100svh; display: flex; align-items: center; justify-content: center; }
button, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

/* `touch-action: none` es obligatorio: sin eso el navegador se queda el
   arrastre para hacer scroll y el dedo —que acá es el juego entero— llega una
   vez de cada tres. */
#lienzo {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  touch-action: none; display: block; z-index: 0;
  box-shadow: 0 0 0 100vmax var(--fondo);
  transition: filter .25s ease;
}
/* EL FONDO DE LOS MENUS ES EL JUEGO, DESENFOCADO. El filtro lo aplica el
   compositor sobre el lienzo entero, así que cuesta lo mismo que una capa de
   más y no toca el bucle. Y nunca se desactualiza. */
body.borroso #lienzo { filter: blur(6px) saturate(1.35) brightness(1.1); }

.pantalla {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: var(--an, min(360px, 100vw)); height: var(--al, min(640px, 100svh));
  display: flex; flex-direction: column; z-index: 2;
}
.pantalla[hidden] { display: none; }
.centrado { align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }

/* El menú y el final son un VELO, no una pared: atrás se tiene que seguir
   viendo que alguien está trepando. La de "cómo se juega" sí queda opaca,
   porque ahí lo que hay que leer es el texto. */
#p-idioma, #p-menu, #p-fin { background: radial-gradient(130% 70% at 50% 0%, rgba(12,22,40,.22), rgba(5,8,16,.62)); }
#p-como { background: radial-gradient(130% 60% at 50% 0%, #101a30 0%, var(--fondo) 72%); }

/* EL MARCO ES UNA IMAGEN CORTADA EN NUEVE (`border-image`), no un borde.
   Un dibujo de vigas remachadas no se puede estirar entero: las esquinas
   quedarían deformes y los remaches ovalados. `border-image` deja las cuatro
   esquinas del tamaño original y estira sólo los lados, así que el mismo dibujo
   de 320×320 sirve para el panel alto del menú y para el bajo del final. El
   relleno NO se dibuja (sin `fill`): el centro es transparente y lo que se ve
   ahí es el degradé de abajo, y a través suyo la torre desenfocada. */

/* El título es un dibujo, no texto con sombras. El `alt` lleva la palabra, así
   que el lector de pantalla sigue leyendo "Garfio". */
.logo { margin: 0 0 2px; line-height: 0; }
.logo img {
  width: min(82%, 246px); height: auto;
  filter: drop-shadow(0 0 16px rgba(90,216,255,.45));
  animation: colgar 4.5s ease-in-out infinite;
}
@keyframes colgar { 50% { transform: rotate(-1.4deg) translateY(2px); } }

.bajada { color: var(--tenue); margin: 0 0 8px; font-size: 13px; }
.bajada b { color: var(--texto); }
.record { color: var(--tenue); font-size: 13px; margin: 0 0 6px; letter-spacing: .3px; }
.record b { color: var(--cian-claro); font-size: 15px; }
.tenue { color: var(--tenue); opacity: .7; }

/* ── el botón: una argolla ──
   Es el único objeto grande de la pantalla y lo mismo que se toca todo el
   juego: quien lo aprieta ya está practicando. El aro gira despacio; la garra
   queda quieta encima, porque una garra girando se lee como un ventilador. */
.aro {
  position: relative; display: grid; place-items: center;
  width: 164px; height: 164px; margin: 6px auto 16px;
  padding: 0; border: none; background: none; box-shadow: none;
  border-radius: 50%; cursor: pointer;
  filter: drop-shadow(0 0 18px rgba(90,216,255,.5));
}
.aro .anillo, .aro .garra {
  position: absolute; left: 50%; top: 50%; width: 100%; height: 100%;
  background: center / contain no-repeat;
  transform-origin: 50% 50%; pointer-events: none;
}
/* Van como FONDO y no como <img> por el empaquetado: el botón aparece dos veces

@keyframes girar-aro {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to   { transform: translate(-50%, -50%) rotate(360deg); }
}
@keyframes colgar-garra {
  0%, 100% { transform: translate(-50%, -132%) rotate(-6deg); }
  50%      { transform: translate(-50%, -132%) rotate(6deg); }
}
/* La palabra va clara y con contorno negro: oscura desaparecía sobre el metal
   claro del aro, y el aro gira, así que el fondo de la letra cambia siempre. */
.aro .aro-txt {
  position: relative; z-index: 1;
  font-size: 26px; font-weight: 900; letter-spacing: 2px; color: #f2fbff;
  text-shadow: 2px 2px 0 #05121c, -2px 2px 0 #05121c, 2px -2px 0 #05121c,
               -2px -2px 0 #05121c, 0 0 14px rgba(2,10,20,.9);
}
.aro:active { transform: scale(.95); }
.aro.chico-aro { width: 116px; height: 116px; margin: 4px auto 12px; }
.aro.chico-aro .aro-txt { font-size: 18px; }

/* ── los botones: una chapa de taller ──
   La misma imagen de 192×192 para todos, cortada en nueve. Acá el centro SI se
   dibuja (`fill`) porque ahí está la chapa; en el marco no, porque hay agujero. */
.botones { display: flex; flex-direction: column; gap: 9px; }
.botones.fila { flex-direction: row; justify-content: center; }

button:active { transform: translateY(2px); }
.chico { padding: 5px 10px; font-size: 13px; min-height: 36px; }
/* Los botones del pie se ven chicos pero SE TOCAN GRANDE: por debajo de 44 px
   el dedo falla una de cada tres veces, y no hay nada más frustrante que un
   botón que a veces no anda. El tamaño visual lo da el texto; el área de toque,
   el min-height. */
.botones.chicos { gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.botones.chicos .chico { min-height: 44px; }
/* El de borrar lleva la MISMA chapa y sólo cambia el color de la letra: teñir
   la imagen con un filtro teñía también el texto. */
.peligro { color: #ff8f8f; }
#m-idioma { font-weight: 800; letter-spacing: 1px; min-width: 46px; }

.opcion { display: flex; align-items: center; justify-content: center; gap: 7px;
          color: var(--tenue); font-size: 12.5px; margin: 0; }
.opcion input { width: 17px; height: 17px; accent-color: var(--cian); }
.chico-op { min-height: 44px; }

/* ── la pantalla de idiomas ── */
.idioma-t { margin: 8px 0 12px; font-size: 19px; color: var(--cian-claro); }
#idiomas { gap: 9px; margin-bottom: 12px; }
/* Los tres van GRANDES aunque hereden `.chico`: son lo único que se toca en esa
   pantalla y el que los toca todavía no entiende nada de lo que dice alrededor. */
.grande-op { min-height: 52px; font-size: 15px; padding: 12px 14px; }
.grande-op b { color: var(--cian-claro); margin-right: 8px; letter-spacing: 1px; }

/* --- texto largo --- */
.barra { display: flex; align-items: center; gap: 12px; padding: 10px 12px;
         background: rgba(8,12,24,.95); border-bottom: 2px solid var(--borde); }
.barra h2 { margin: 0; font-size: 17px; }
.texto { padding: 14px 14px 40px; overflow-y: auto; background: var(--fondo); flex: 1; }
.texto h3 { margin: 22px 0 6px; font-size: 15px; color: var(--cian); }
.texto p { margin: 0 0 10px; font-size: 14px; color: var(--tenue); }
.texto p b { color: var(--texto); }
.destacado { background: rgba(18,32,54,.8); border-left: 3px solid var(--cian);
             padding: 11px 12px; border-radius: 0 8px 8px 0; }
.texto dl { margin: 0; }
.texto dt { font-weight: 700; margin-top: 10px; font-size: 14px; }
.texto dd { margin: 2px 0 0; color: var(--tenue); font-size: 13.5px; }
.texto dd b { color: var(--texto); }

/* --- HUD --- */
.juego { pointer-events: none; }
.juego button { pointer-events: auto; }
.hud { display: flex; align-items: center; gap: 8px; padding: 10px 10px 0; }
.hud-btn { width: 40px; height: 40px; min-height: 40px; padding: 0; font-size: 15px; line-height: 1; }
.metros {
  flex: 1; text-align: left; font-size: 21px; font-weight: 800;
  font-variant-numeric: tabular-nums; color: #dff1ff;
  text-shadow: 0 2px 6px rgba(0,0,0,.8);
}
/* Cuando el piso empieza a subir, los metros laten. Es el segundo aviso: el
   primero es el borde rojo abajo, y dos avisos distintos para lo mismo es lo
   que hace que no se pase por alto. */
.metros.apuro { color: #ff9b9b; animation: latir .7s infinite; }
@keyframes latir { 50% { opacity: .45; } }
.hud-dato { background: rgba(8,12,24,.7); border-radius: 8px; padding: 4px 8px;
            font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
.hud-dato span { color: #ffd84a; margin-right: 3px; }
.piso { margin: 6px 10px 0; align-self: flex-start;
        background: rgba(8,12,24,.6); border: 1px solid rgba(90,216,255,.22);
        border-radius: 7px; padding: 3px 9px; font-size: 12px; color: #b9d8e8; }

/* --- final --- */
.fin h2 { margin: 0 0 10px; font-size: 42px; font-weight: 900;
          font-variant-numeric: tabular-nums;
          color: var(--cian-claro); text-shadow: 0 0 24px rgba(90,216,255,.5); }
.fin-rotulo { margin: 0; color: var(--tenue); font-size: 13px; letter-spacing: 3px;
              text-transform: uppercase; }
.record-nuevo { margin: 0 0 4px; color: var(--cian); font-weight: 800; letter-spacing: 3px;
                animation: pum .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pum { from { transform: scale(.4); opacity: 0; } }
.lista { list-style: none; padding: 0; margin: 0 0 12px; text-align: left; }
.lista li { display: flex; justify-content: space-between; gap: 10px;
            padding: 6px 2px; border-bottom: 1px solid rgba(90,216,255,.18); font-size: 14px; }
.lista span { color: var(--tenue); }
.lista b { font-variant-numeric: tabular-nums; }

/* PANTALLA MEDIANA (un 16:9 de 640 de alto). Con las medidas del 19,5:9 la tapa
   mide más que la pantalla, se vuelve desplazable y la última fila de botones
   queda abajo del corte — que es la forma silenciosa de esconderla. */
@media (max-height: 700px) and (min-height: 471px) {
  .logo img { width: min(70%, 204px); }
  .bajada { font-size: 12.5px; }
  .aro { width: 142px; height: 142px; margin: 4px auto 12px; }
  .aro .aro-txt { font-size: 23px; }
  .botones.chicos { margin-top: 6px; }
}

/* EL TELEFONO ACOSTADO. El juego es vertical y ahí no se juega, pero se entra
   igual —basta girar el aparato sin querer— y el menú tiene que seguir siendo
   un menú, entero y sin desplazar. */
@media (max-height: 470px) {
  .tapa { border-width: 20px; border-image-width: 20px; padding: 4px 8px 6px; }
  .logo { margin: 0; }
  .logo img { width: min(44%, 126px); }
  .idioma-t { font-size: 15px; margin: 4px 0 8px; }
  .grande-op { min-height: 44px; font-size: 13.5px; padding: 8px 12px; }
  #idiomas { gap: 6px; margin-bottom: 6px; }
  .bajada { display: none; }
  .aro { width: 78px; height: 78px; margin: 2px auto 8px; }
  .aro .aro-txt { font-size: 15px; }
  .aro.chico-aro { width: 70px; height: 70px; margin: 2px auto 8px; }
  .aro.chico-aro .aro-txt { font-size: 13px; }
  .record { font-size: 11.5px; margin: 0; }
  .record b { font-size: 13px; }
  .botones.chicos { margin-top: 4px; gap: 5px; }
  .botones.chicos .chico { font-size: 11.5px; padding: 3px 8px; }
  .fin h2 { font-size: 28px; margin-bottom: 4px; }
  .lista li { padding: 3px 2px; font-size: 12px; }
}

/* ── assets.js ── */
const M_assets = (() => {
  // De donde sale cada archivo: del disco cuando el juego esta suelto, y de un
  // mapa de data: URIs cuando esta empaquetado en un solo HTML. Un solo lugar que
  // lo decida evita que la mitad del codigo ande desde file:// y la otra no.
  const ruta = (p) => (globalThis.ARCHIVOS && globalThis.ARCHIVOS[p]) || p;

  return { ruta };
})();

/* ── mundo.js ── */
const M_mundo = (() => {
  // Las constantes del juego, todas juntas, porque SON el juego: cambiar LARGO de
  // 120 a 160 no es un ajuste, es otra torre.

  const VISTA = { ancho: 360, alto: 640 };   // el alto se ajusta a la pantalla
  const ANCHO = 360;

  // LA MECANICA ENTERA: un peso, una soga y la gravedad.
  //
  // Apoyás el dedo y sale un gancho hacia la argolla que tengas más cerca del
  // dedo. Mientras la soga esté enganchada sos un péndulo: la gravedad te tira y
  // la soga te obliga a girar alrededor de la argolla, así que bajás acelerando y
  // subís frenando. Soltás y salís disparado por la tangente.
  //
  // Todo el juego es CUANDO soltar. Soltás abajo del todo y salís rápido pero
  // para el costado; soltás arriba y salís lento pero para arriba. No hay un
  // momento correcto: hay uno para cada argolla que quieras alcanzar, y eso es lo
  // que hace que valga la pena jugarlo dos veces.
  const F = {
    GRAVEDAD: 0.42,
    ROCE_AIRE: 0.9965,          // el aire casi no frena: el envión se hereda
    ROCE_SOGA: 0.9992,           // la soga sí, un poquito, si no el péndulo es eterno

    ALCANCE: 168,               // hasta dónde llega el gancho
    // EL LARGO MINIMO DE LA SOGA ES GRANDE A PROPOSITO. La soga sale del largo
    // que había al enganchar, y enganchando muy cerca de la argolla quedaba un
    // péndulo de treinta píxeles: con un arco así no se junta el envión para
    // llegar a la próxima, y el robot se quedaba hamacándose para siempre sin
    // subir un metro. Con un piso de 76 la soga queda floja en vez de corta —y
    // floja no molesta, porque la soga tira pero no empuja.
    LARGO_MIN: 76,
    // LA SOGA NO SE ACORTA SOLA, y probé que sí. Recogiendo medio píxel por
    // cuadro la soga llegaba al mínimo en tres segundos, y con soga corta el
    // péndulo es chiquito: la velocidad que se junta en un arco de 34 px alcanza
    // para subir 34 px, y las argollas están a 96. O sea que "quedarse colgado
    // para ganar altura" terminaba siendo la forma de no llegar nunca a ninguna
    // parte. El largo queda el que había al enganchar, y la altura se gana
    // hamacándose, que además es una decisión y no una espera.

    // EL EMPUJE: colgado, arrastrar el dedo hamaca. Sin esto el juego no existe —
    // enganchado justo abajo de la argolla y sin velocidad de costado, un péndulo
    // no arranca solo: se queda subiendo y bajando en línea recta para siempre.
    // Es literalmente lo que hace un chico en una hamaca, y es lo que convierte
    // "esperar" en "trabajar para ganar altura".
    EMPUJE: 0.62,

    BICHO: 11,                  // radio del cuerpo
    ARGOLLA: 9,                 // radio de la argolla dibujada

    VEL_MAX: 17,                // tope de velocidad: 344 px de vuelo hacia arriba

    // La torre.
    SEP_MIN: 96, SEP_MAX: 148,  // cuánto sube de una argolla a la otra
    // Y CUANTO SE CORRE DE COSTADO, con un MINIMO que no es capricho: dos
    // argollas en la misma vertical no se pueden encadenar hamacándose —el
    // péndulo que sale de una no apunta a la otra— y el generador las ponía todo
    // el tiempo, porque el corrimiento salía de un rango grande y se recortaba
    // contra la pared, dejando una escalera pegada al borde.
    DX_MIN: 46, DX_MAX: 128,
    BORDE: 26,                  // margen contra las paredes
    OXIDADAS_DESDE: 700,        // a partir de qué altura aparecen las que se rompen
    VIDA_OXIDADA: 48,           // cuadros que aguanta una argolla oxidada

    // EL PISO SUBE, y es el único peligro además de caerse. Probé púas en las
    // paredes y era una pelea contra la geometría del juego: un péndulo BARRE de
    // pared a pared —es lo que hace— así que poner el castigo en las paredes es
    // castigar la mecánica. El piso que sube no pelea con nada: apura. Arranca
    // tarde, para que los primeros metros se puedan mirar.
    SUBE_DESDE: 4000,
    SUBE_TIEMPO: 3600,          // y si no llegaste, al minuto empieza igual
    SUBE_VEL: 0.3,              // px por cuadro cuando arranca
    SUBE_MAX: 1.4,              // y hasta dónde acelera
  };

  const M = (px) => Math.max(0, Math.floor(px / 100));      // píxeles a metros

  const mezcla = (a, b, t) => a + (b - a) * Math.max(0, Math.min(1, t));
  const limitar = (v, a, b) => Math.max(a, Math.min(b, v));

  /**
   * Cuánto se escala el juego para entrar en la pantalla.
   *
   * El ANCHO es fijo en 360 para todos los aparatos: si se estirara, en una
   * pantalla angosta habría menos lugar entre argolla y argolla y el mismo swing
   * pasaría de sobrar a no llegar. El alto se estira hasta donde haya, porque ver
   * más o menos torre no cambia ninguna cuenta.
   */
  function ajustarVista(anPantalla, alPantalla) {
    // Y SE GARANTIZA UN MINIMO DE TORRE A LA VISTA. Escalando sólo por el ancho,
    // el teléfono acostado daba una escala de 2,3 y dejaba ver ciento sesenta y
    // seis píxeles de alto: menos que la distancia entre dos argollas. El juego
    // no era difícil, era imposible — no se veía adónde saltar. Con el mínimo, en
    // horizontal queda una tira angosta en el medio de la pantalla, que es lo que
    // corresponde a un juego vertical.
    const esc = Math.min(anPantalla / VISTA.ancho, alPantalla / MIN_ALTO, 3);
    VISTA.alto = Math.round(Math.min(alPantalla / esc, 1100));
    return esc;
  }

  const MIN_ALTO = 520;

  /** Un azar con semilla: la misma semilla, la misma torre, en cualquier aparato. */
  function azar(semilla) {
    let s = (semilla >>> 0) || 1;
    return () => {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  }

  return { VISTA, ANCHO, F, M, mezcla, limitar, ajustarVista, azar };
})();

/* ── torre.js ── */
const M_torre = (() => {
  // La torre: argollas para siempre, hacia arriba.
  //
  // UN GENERADOR INFINITO FALLA DE UNA FORMA QUE NO SE VE MIRANDO. Pone dos
  // argollas tan separadas que, con el envión que se puede juntar en la anterior,
  // no se llega a la siguiente — y eso en pantalla no se ve como un error, se ve
  // como que no sos bueno. Por eso acá la distancia entre una argolla y la que
  // sigue no sale de "lo que queda lindo": sale de SALTO_MAX, que está MEDIDO
  // jugando (pruebas/salto.mjs lo vuelve a medir con la física de verdad y falla
  // si alguien toca la gravedad y se olvida de esto).

  const { F, ANCHO, azar, limitar } = M_mundo;
  // Lo que se puede saltar de una argolla a la otra, en línea recta, incluyendo
  // el alcance del gancho. Medido, no estimado: ver pruebas/salto.mjs.
  const SALTO_MAX = 232;

  class Torre {
    constructor(semilla) {
      this.rnd = azar(semilla ?? ((Math.random() * 1e9) | 0));
      this.argollas = [];
      this.tuercas = [];
      // La primera va fija en el medio y abajo: los primeros segundos tienen que
      // ser iguales siempre, porque son los que se usan para entender el juego.
      this.argollas.push({ x: ANCHO / 2, y: -140, oxidada: false, i: 0 });
      this.ultima = this.argollas[0];
      this.techo = -140;
    }

    /** Genera hasta que haya argollas por encima de `y` (arriba es menos y). */
    generarHasta(y) {
      while (this.techo > y) this.siguienteArgolla();
    }

    siguienteArgolla() {
      const a = this.ultima;
      const alto = Math.abs(a.y);
      const i = this.argollas.length;

      // La separación vertical sube con la altura, pero nunca pasa de lo que se
      // puede saltar: la dificultad crece pidiendo MAS PRECISION, no pidiendo
      // cosas imposibles.
      const dureza = Math.min(1, alto / 6000);
      const sep = F.SEP_MIN + this.rnd() * (F.SEP_MAX - F.SEP_MIN) * (0.55 + 0.45 * dureza);

      // EL CORRIMIENTO DE COSTADO TIENE TECHO Y PISO, y los dos importan.
      //
      // El techo sale de PITAGORAS y no de un número suelto: lo que queda del
      // salto después de gastar `sep` subiendo. Sumar un dx fijo es justo el
      // error que deja inalcanzables las argollas altas, donde `sep` ya se comió
      // casi todo el presupuesto.
      //
      // El piso es lo que aprendí mirando al robot quedarse colgado para siempre:
      // dos argollas en la misma vertical NO SE ENCADENAN. El péndulo sale por la
      // tangente, o sea de costado, y para subir derecho hay que soltar en el
      // punto más lento del arco. Un `dx` chico no es "una versión fácil" del
      // salto: es otro problema, y uno que el juego no enseña a resolver.
      const techo = Math.min(F.DX_MAX,
                             Math.sqrt(Math.max(0, SALTO_MAX * SALTO_MAX - sep * sep)) * 0.82);
      const paso = F.DX_MIN + this.rnd() * Math.max(0, techo - F.DX_MIN);
      // Y el lado se elige MIRANDO LA PARED: pegado al borde siempre se va para
      // adentro. Sorteándolo, la mitad de las veces el corrimiento se recortaba
      // contra la pared y volvía a quedar una escalera vertical.
      let lado = a.x < ANCHO * 0.34 ? 1 : a.x > ANCHO * 0.66 ? -1 : (this.rnd() < 0.5 ? -1 : 1);
      let x = limitar(a.x + paso * lado, F.BORDE, ANCHO - F.BORDE);
      if (Math.abs(x - a.x) < F.DX_MIN) x = limitar(a.x - paso * lado, F.BORDE, ANCHO - F.BORDE);

      const oxidada = alto > F.OXIDADAS_DESDE && this.rnd() < Math.min(0.34, dureza * 0.5);
      const arg = { x, y: a.y - sep, oxidada, i };
      this.argollas.push(arg);
      this.ultima = arg;
      this.techo = arg.y;

      // LAS TUERCAS VAN FUERA DE LA LINEA BUENA, a propósito. Puestas en el
      // camino no serían una decisión: serían una recompensa por jugar. Puestas
      // al costado, agarrarlas cuesta soltar más tarde de lo conveniente.
      if (this.rnd() < 0.45) {
        const t = this.rnd();
        this.tuercas.push({
          x: limitar(a.x + (arg.x - a.x) * t + (this.rnd() < 0.5 ? -54 : 54), 16, ANCHO - 16),
          y: a.y - sep * t, tomada: false,
        });
      }

    }

    /** La argolla más cerca de (x, y) que esté dentro del alcance del gancho. */
    masCerca(x, y, alcance = F.ALCANCE) {
      let mejor = null, mejorD = alcance * alcance;
      for (const a of this.argollas) {
        const d = (a.x - x) ** 2 + (a.y - y) ** 2;
        if (d <= mejorD && !a.rota) { mejorD = d; mejor = a; }
      }
      return mejor;
    }

    /** La primera argolla por encima de `y`, que es adonde hay que ir. */
    siguienteDe(y) {
      for (const a of this.argollas) if (a.y < y - 8 && !a.rota) return a;
      return null;
    }

    /** Tirar lo que quedó muy abajo: una partida larga junta miles de objetos. */
    limpiar(y) {
      const corte = y + 1400;
      if (this.argollas.length > 60) this.argollas = this.argollas.filter((a) => a.y < corte);
      if (this.tuercas.length > 60) this.tuercas = this.tuercas.filter((t) => t.y < corte);
    }
  }

  return { SALTO_MAX, Torre };
})();

/* ── juego.js ── */
const M_juego = (() => {
  // La partida: el péndulo, el gancho y la caída.
  //
  // NO HAY MOTOR DE FISICA. Hay un punto con velocidad y, cuando el gancho está
  // clavado, una restricción de distancia. Es a propósito: el juego entero es
  // predecir por dónde vas a salir cuando sueltes, y eso sólo funciona si la
  // física es exactamente la misma cada vez. Un motor genérico con resolución
  // iterativa devuelve trayectorias que dependen del orden en que resolvió los
  // contactos — parecido no alcanza.

  const { F, ANCHO, VISTA, M, limitar } = M_mundo;
  const { Torre } = M_torre;
  const PARED = 12;             // dónde empieza la pared dibujada
  const INVUL = 30;

  class Partida {
    constructor(semilla) {
      this.torre = new Torre(semilla);
      this.x = ANCHO / 2;
      this.y = 0;
      this.vx = 0;
      this.vy = -3.2;                  // un empujoncito inicial hacia arriba
      this.ancla = null;               // la argolla enganchada
      this.largo = 0;
      this.tuercas = 0;
      this.estado = "trepando";        // trepando | muerto
      this.alto = 0;                   // el punto más alto alcanzado, en píxeles
      this.t = 0;
      this.cuenta = 0;
      this.invul = INVUL;
      this.cam = 0;
      this.sube = 0;
      this.sacude = 0;
      this.chispas = [];
      // Los últimos dieciocho cuadros de recorrido: tres décimas de segundo, que
      // es lo que dura un arco de péndulo corto. Más larga, la estela tapa las
      // argollas que están abajo.
      this.estela = [];
      this.ev = {};
      this.torre.generarHasta(-VISTA.alto * 3);
    }

    get metros() { return M(this.alto); }
    get puntaje() { return this.metros + this.tuercas * 8; }
    get enganchado() { return !!this.ancla; }

    /**
     * Un cuadro.
     *
     * `ent.dedo` es null si no hay dedo, o {x, y} en coordenadas del mundo. El
     * gancho se clava mientras haya dedo y se suelta cuando no lo hay: es un
     * resorte, no un interruptor, y por eso el gesto que cuesta (mantener) es el
     * que da altura.
     */
    paso(ent) {
      this.t++;
      this.ev = { engancha: false, suelta: false, tuerca: 0, pared: false,
                  rompe: false, muerto: false };
      if (this.sacude > 0) this.sacude *= 0.86;
      if (this.invul > 0) this.invul--;
      for (const c of this.chispas) { c.x += c.vx; c.y += c.vy; c.vy += 0.22; c.vida--; }
      this.chispas = this.chispas.filter((c) => c.vida > 0);

      if (this.estado === "muerto") { this.cuenta++; this.caerMuerto(); return; }

      this.gancho(ent);
      this.mover();
      this.estela.push({ x: this.x, y: this.y });
      if (this.estela.length > 18) this.estela.shift();
      this.paredes();
      this.juntar();

      this.torre.generarHasta(this.y - VISTA.alto * 3);
      this.torre.limpiar(this.y);

      if (-this.y > this.alto) this.alto = -this.y;

      // LA CAMARA NO BAJA NUNCA, y eso no es un detalle de presentación: es la
      // regla que termina la partida. Mientras subís te sigue; cuando caés se
      // queda, y el borde de abajo de la pantalla es la muerte. Sin eso el juego
      // no tendría final y una caída larga sería gratis.
      // EL BICHO VA AL 42% DE LA PANTALLA, no abajo de todo. Poniéndolo abajo se
      // ve más torre por delante, que es lo que uno querría en un juego de trepar
      // — pero entonces el margen para caerse son doscientos ochenta píxeles, y
      // un péndulo de soga larga baja ciento setenta en un solo arco: se moría de
      // fallas que no eran fallas. Arriba del 42% se ven dos argollas por
      // delante, que es todo lo que hace falta, y abajo queda pantalla de sobra
      // para equivocarse una vez. La línea de muerte es el BORDE DE ABAJO: lo que
      // te mata se ve.
      const quiere = this.y - VISTA.alto * 0.42;
      if (quiere < this.cam) this.cam += (quiere - this.cam) * 0.12;
      // Y a partir de cierta altura sube SOLA, cada vez más rápido. Es lo que
      // convierte "no caerse" en "no demorarse": sin eso, colgarse de una argolla
      // buena y hamacarse tranquilo es una estrategia ganadora y aburrida.
      // Y ARRANCA POR ALTURA O POR TIEMPO, lo que pase primero. Sólo por altura,
      // el que se queda hamacándose abajo del corte no se muere nunca: el
      // validador encontró una torre donde el robot se trababa a diez metros y
      // seguía vivo a los cinco minutos. Un juego sin fin tiene que terminar.
      if (this.alto > F.SUBE_DESDE || this.t > F.SUBE_TIEMPO) {
        const v = Math.min(F.SUBE_MAX,
                           F.SUBE_VEL * (1 + Math.max(this.alto - F.SUBE_DESDE, 0) / 9000));
        this.cam -= v;
        this.sube = v;
      }
      if (this.y > this.cam + VISTA.alto + 40) this.morir();
    }

    // --- el gancho ---------------------------------------------------------
    gancho(ent) {
      const d = ent && ent.dedo;
      if (!d) {
        if (this.ancla) {
          // Chispas al soltar, en el CUERPO y no en la argolla: marcan el punto y
          // la dirección por donde saliste, que es lo único que decidiste vos.
          this.chispear(this.x, this.y, "#ffd1a0", 5);
          this.ancla = null; this.ev.suelta = true;
        }
        return;
      }
      if (!this.ancla) {
        // SE APUNTA CON EL DEDO, no con el personaje. Enganchar siempre a la más
        // cercana al cuerpo convertiría el juego en un solo botón; con dos
        // argollas al alcance, cuál agarrás es la decisión.
        const a = this.torre.masCerca(d.x, d.y, 999) || null;
        if (!a) return;
        const dist = Math.hypot(a.x - this.x, a.y - this.y);
        if (dist > F.ALCANCE) return;
        this.ancla = a;
        // El largo es la distancia QUE YA HABIA. Fijar un largo nominal daría un
        // tirón en el momento de enganchar, y un tirón que el jugador no pidió es
        // exactamente lo que rompe la confianza en un juego de precisión.
        this.largo = Math.max(F.LARGO_MIN, dist);
        a.tocada = this.t;
        this.ev.engancha = true;
        this.chispear(a.x, a.y, "#b6f0ff", 6);
      }
      const a = this.ancla;
      if (a.oxidada && this.t - a.tocada > F.VIDA_OXIDADA) {
        a.rota = true; this.ancla = null;
        this.ev.rompe = true; this.sacude = 6;
        this.chispear(a.x, a.y, "#c9762f", 10);
        return;
      }
      // HAMACARSE. El dedo, mientras estés colgado, ya no apunta: empuja. Cuanto
      // más lejos del cuerpo lo pongas, más fuerte, hasta un tope. La soga se
      // queda con la parte del empuje que va en su dirección (la proyección de
      // más abajo), así que lo único que sobrevive es lo tangencial: exactamente
      // lo que pasa cuando estirás las piernas en una hamaca.
      this.vx += limitar((d.x - this.x) / 50, -1, 1) * F.EMPUJE;

    }

    mover() {
      this.vy += F.GRAVEDAD;
      this.x += this.vx;
      this.y += this.vy;

      if (this.ancla) {
        const a = this.ancla;
        let dx = this.x - a.x, dy = this.y - a.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d > this.largo) {
          // La soga TIRA PERO NO EMPUJA: sólo corrige cuando está estirada. Si
          // corrigiera siempre, sería una barra rígida y el bicho podría quedar
          // parado arriba de la argolla, que es ridículo y además gratis.
          const k = this.largo / d;
          this.x = a.x + dx * k;
          this.y = a.y + dy * k;
          // Y la velocidad se proyecta sobre la TANGENTE: lo que iba en la
          // dirección de la soga se pierde en el tirón. Sin esto el péndulo gana
          // energía sola en cada corrección y termina dando vueltas enteras.
          const nx = dx / d, ny = dy / d;
          const radial = this.vx * nx + this.vy * ny;
          if (radial > 0) { this.vx -= radial * nx; this.vy -= radial * ny; }
        }
        this.vx *= F.ROCE_SOGA; this.vy *= F.ROCE_SOGA;
      } else {
        this.vx *= F.ROCE_AIRE; this.vy *= F.ROCE_AIRE;
      }

      const v = Math.hypot(this.vx, this.vy);
      if (v > F.VEL_MAX) { this.vx = this.vx / v * F.VEL_MAX; this.vy = this.vy / v * F.VEL_MAX; }
    }

    paredes() {
      const r = F.BICHO;
      if (this.x - r < PARED) {
        this.x = PARED + r; this.vx = Math.abs(this.vx) * 0.45;
        this.ev.pared = true; this.sacude = 3;
        this.chispear(PARED, this.y, "#8b97b8", 4);
      } else if (this.x + r > ANCHO - PARED) {
        this.x = ANCHO - PARED - r; this.vx = -Math.abs(this.vx) * 0.45;
        this.ev.pared = true; this.sacude = 3;
        this.chispear(ANCHO - PARED, this.y, "#8b97b8", 4);
      }
    }

    juntar() {
      for (const t of this.torre.tuercas) {
        if (t.tomada) continue;
        if ((t.x - this.x) ** 2 + (t.y - this.y) ** 2 < 22 * 22) {
          t.tomada = true; this.tuercas++; this.ev.tuerca++;
          this.chispear(t.x, t.y, "#ffd84a", 7);
        }
      }
    }

    morir() {
      if (this.estado === "muerto") return;
      this.estela.length = 0;
      this.estado = "muerto";
      this.ancla = null;
      this.ev.muerto = true;
      this.sacude = 12;
      this.chispear(this.x, this.y, "#ff6b6b", 16);
    }

    caerMuerto() {
      this.vy += F.GRAVEDAD;
      this.x += this.vx; this.y += this.vy;
      this.vx *= 0.99;
    }

    chispear(x, y, color, n) {
      for (let i = 0; i < n; i++)
        this.chispas.push({ x, y, vx: (Math.random() - 0.5) * 5,
                            vy: (Math.random() - 0.5) * 5 - 1,
                            color, vida: 22 + Math.random() * 16 });
    }
  }


  return { PARED, Partida, limitar };
})();

/* ── piloto.js ── */
const M_piloto = (() => {
  // Un piloto automático. Lo usan dos cosas, y por eso vive acá y no en pruebas:
  // el fondo de los menús —donde se ve una trepada de verdad, borroneada— y el
  // validador de la torre. Una sola definición evita que el robot pruebe una
  // política y el jugador vea otra.
  //
  // Sabe una sola cosa, y es la misma que aprende una persona a los dos minutos:
  // SOLTAR CUANDO LA TRAYECTORIA YA PASA CERCA DE LA PROXIMA ARGOLLA. No calcula
  // el punto óptimo ni resuelve nada; simula hacia adelante su propio vuelo con
  // la física del juego y suelta en el primer cuadro en que ese vuelo pasaría a
  // tiro del gancho. Justo por ser tan tonto sirve de prueba: si él sube mil
  // metros, una persona sube más.

  const { F, ANCHO } = M_mundo;
  const { PARED } = M_juego;
  const PASOS = 150;

  /**
   * ¿Pasando por (x,y) con velocidad (vx,vy) y sin soga, llego a tiro de `a`?
   *
   * Es la misma integración que `Partida.mover()` sin enganche. Que sea la misma
   * importa más que que sea rápida: si el robot predice con una física distinta
   * de la que juega, valida una torre que no existe.
   */
  function llega(x, y, vx, vy, a, margen = 0.9) {
    const tope = (F.ALCANCE * margen) ** 2;
    for (let i = 0; i < PASOS; i++) {
      vy += F.GRAVEDAD;
      x += vx; y += vy;
      vx *= F.ROCE_AIRE; vy *= F.ROCE_AIRE;
      // LAS PAREDES VAN EN LA PREDICCION, y olvidarlas costaba la partida. Un
      // vuelo que rebota contra la pared pierde más de la mitad de la velocidad
      // de costado; prediciéndolo en línea recta, el robot soltaba convencido de
      // que llegaba, rebotaba, y caía al vacío con la argolla cuatrocientos
      // píxeles arriba. Predecir con una física distinta de la que se juega no es
      // "una aproximación": es validar otro juego.
      if (x - F.BICHO < PARED) { x = PARED + F.BICHO; vx = Math.abs(vx) * 0.45; }
      else if (x + F.BICHO > ANCHO - PARED) { x = ANCHO - PARED - F.BICHO; vx = -Math.abs(vx) * 0.45; }
      const v = Math.hypot(vx, vy);
      if (v > F.VEL_MAX) { vx = vx / v * F.VEL_MAX; vy = vy / v * F.VEL_MAX; }
      if ((a.x - x) ** 2 + (a.y - y) ** 2 <= tope) return true;
      // Ya cayó por debajo de la argolla y sigue bajando: no va a volver.
      if (y > a.y + 260 && vy > 0) return false;
    }
    return false;
  }

  function piloto(p) {
    // SE LLEVA CUENTA DE LA ULTIMA ARGOLLA USADA, y sin eso el robot entraba en
    // un tartamudeo que costó una tarde encontrar: soltaba la argolla porque ya
    // alcanzaba la siguiente, y al cuadro siguiente —volando, todavía por debajo
    // de la que había soltado— "la próxima argolla que tengo encima" volvía a ser
    // esa misma, se reenganchaba, y vuelta a empezar. Ochenta cuadros por
    // segundo enganchando y soltando la misma argolla, subiendo cero.
    if (p.ancla) p._ultima = p.ancla.i;
    const desdeI = p._ultima === undefined ? -1 : p._ultima;
    const meta = p.torre.argollas.find((a) => a.i > desdeI && !a.rota);
    if (!meta) return { dedo: null };

    if (!p.ancla) {
      // Volando: engancharse apenas la próxima esté a tiro. Esperar "el mejor
      // momento" para enganchar no existe — el que espera, cae.
      const d = Math.hypot(meta.x - p.x, meta.y - p.y);
      if (d <= F.ALCANCE * 0.97) return { dedo: { x: meta.x, y: meta.y } };
      // Y si la de arriba está lejos, agarrarse de lo que haya. Normalmente sólo
      // valen las de MAS ADELANTE —agarrarse hacia atrás es de donde venía el
      // tartamudeo—, pero cuando ya se cayó bien por debajo de la que soltó,
      // cualquiera sirve: ahí volver atrás no es tartamudear, es salvarse, y es
      // exactamente lo que hace una persona.
      const ult = p.torre.argollas.find((a) => a.i === desdeI);
      const cayendo = ult && p.y > ult.y + 150;
      let otra = null, mejor = (F.ALCANCE * 0.97) ** 2;
      for (const a of p.torre.argollas) {
        if (a.rota || (a.i <= desdeI && !cayendo)) continue;
        const dd = (a.x - p.x) ** 2 + (a.y - p.y) ** 2;
        if (dd < mejor) { mejor = dd; otra = a; }
      }
      if (otra && otra.i <= desdeI) p._ultima = otra.i - 1;
      return { dedo: otra ? { x: otra.x, y: otra.y } : null };
    }

    const a = p.ancla;
    // Una argolla oxidada avisa: si está por romperse, soltar es mejor que que te
    // suelte ella, porque soltando por lo menos elegís la dirección.
    const porRomperse = a.oxidada && p.t - a.tocada > F.VIDA_OXIDADA - 6;
    if (llega(p.x, p.y, p.vx, p.vy, meta) || porRomperse) return { dedo: null };

    // HAMACARSE: empujar hacia donde ya se va, medido sobre la TANGENTE y no
    // sobre la velocidad horizontal. Una hamaca se agranda acompañando el
    // movimiento, no peleándolo; pero cerca de los extremos del arco la velocidad
    // horizontal casi no dice para qué lado va el péndulo —cambia de signo antes
    // que el movimiento— y empujando por ahí el robot se peleaba con su propio
    // envión y se quedaba en una amplitud fija para siempre. La tangente sí lo
    // dice, en cualquier punto del arco.
    const nx = (p.x - a.x) / (Math.hypot(p.x - a.x, p.y - a.y) || 1);
    const ny = (p.y - a.y) / (Math.hypot(p.x - a.x, p.y - a.y) || 1);
    const vt = -p.vx * ny + p.vy * nx;            // velocidad sobre la tangente
    const tx = -ny;                               // componente horizontal de la tangente
    let rumbo = Math.sign(vt * tx);
    if (!rumbo || Math.abs(vt) < 0.4) rumbo = a.x < ANCHO / 2 ? 1 : -1;
    return { dedo: { x: p.x + rumbo * 90, y: p.y } };
  }

  /** Trepar con el piloto hasta morir o hasta el tope. Devuelve qué pasó. */
  function trepar(Partida, semilla, tope = 20000) {
    const p = new Partida(semilla);
    for (let i = 0; i < tope; i++) {
      p.paso(piloto(p));
      if (p.estado === "muerto") break;
    }
    return { metros: p.metros, vivo: p.estado !== "muerto", tuercas: p.tuercas,
             cuadros: Math.min(tope, p.t) };
  }

  return { piloto, trepar };
})();

/* ── dibujo.js ── */
const M_dibujo = (() => {
  // El dibujo. Todo vectorial menos el bicho y el vestido de los menús.
  //
  // LOS PISOS DE LA TORRE. Cada doscientos metros cambia el color, y no es
  // decoración: en un juego sin final, lo único que le dice al jugador que avanzó
  // es que el lugar cambió. Un número subiendo no alcanza — se mira una vez y se
  // deja de mirar.

  const { F, ANCHO, VISTA, mezcla } = M_mundo;
  const { PARED } = M_juego;
  const { ruta } = M_assets;
  const PISOS = [
    { clave: "piso.sotano",  cielo: ["#0b1020", "#161f3c"], pared: "#26335c", luz: "#5ad8ff" },
    { clave: "piso.oficinas", cielo: ["#141026", "#2a1f47"], pared: "#443066", luz: "#c77bff" },
    { clave: "piso.taller",  cielo: ["#1a1208", "#3a2610"], pared: "#5c4020", luz: "#ffb54a" },
    { clave: "piso.antenas", cielo: ["#04161c", "#0c3340"], pared: "#145364", luz: "#4ffbdf" },
    { clave: "piso.nubes",   cielo: ["#191a2e", "#333category"], pared: "#4a4d78", luz: "#ffd1f0" },
  ];
  // Un color mal escrito no tira error: el navegador lo ignora y deja el anterior.
  PISOS[4].cielo[1] = "#3a3d63";
  const ALTO_PISO = 20000;                     // 200 metros

  // El módulo TIENE que ser positivo: la altura arranca en cero y baja a números
  // negativos apenas se sube, y en JavaScript `-1 % 5` es -1, no 4.
  const pisoDe = (alto) =>
    PISOS[((Math.floor(alto / ALTO_PISO) % PISOS.length) + PISOS.length) % PISOS.length];

  const mezclarColor = (a, b, t) => {
    const p = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
    return `rgb(${Math.round(mezcla(r1, r2, t))},${Math.round(mezcla(g1, g2, t))},${Math.round(mezcla(b1, b2, t))})`;
  };

  // El polvo del fondo: cuatrocientos números que no cambian nunca. Generarlos en
  // cada cuadro costaría lo mismo que dibujarlos y además parpadearían.
  const frac = (x) => x - Math.floor(x);
  const POLVO = [];
  for (let i = 0; i < 400; i++)
    POLVO.push({ x: frac(Math.sin(i * 12.9898) * 43758.5453) * ANCHO,
                 y: frac(Math.sin(i * 78.233) * 43758.5453) * 4000,
                 r: 0.5 + frac(Math.sin(i * 3.123) * 17231.1) * 1.6 });

  const arte = {};
  function registrarArte(nombre, imagen) { if (imagen) arte[nombre] = imagen; }

  /**
   * El fondo de la torre, a media velocidad y teñido con el color del piso.
   *
   * SE REPITE ESPEJADO, dando vuelta una copia sí y una no. Pedirle a un generador
   * una textura que empalme consigo misma no funciona —siempre se ve la costura— y
   * arreglarla a mano cuesta una tarde. Espejada, la costura es la imagen contra sí
   * misma: coincide por construcción, y en una maraña de vigas nadie nota la
   * simetría.
   *
   * Y SE TIÑE en vez de tener una textura por piso: cinco imágenes son cinco veces
   * el peso, y además se desincronizan con los colores del código apenas alguien
   * toca un piso.
   */
  function dibujarFondo(ctx, piso, sig, t, cam, al) {
    const im = arte.fondo_torre;
    if (!im) return;
    const alto = im.height;
    const desp = cam * 0.45;
    const primera = Math.floor(desp / alto);
    ctx.save();
    ctx.globalAlpha = 0.42;
    for (let k = -1; k <= Math.ceil(al / alto); k++) {
      const i = primera + k;
      const y = i * alto - desp;
      if (y > al || y + alto < 0) continue;
      ctx.save();
      // El módulo tiene que ser POSITIVO: la torre sube, así que la cámara es
      // negativa, y en JavaScript `-1 % 2` es -1, no 1.
      if (((i % 2) + 2) % 2 === 1) { ctx.translate(0, y + alto); ctx.scale(1, -1); }
      else ctx.translate(0, y);
      ctx.drawImage(im, 0, 0, ANCHO, alto);
      ctx.restore();
    }
    ctx.globalCompositeOperation = "color";
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = mezclarColor(piso.pared, sig.pared, t);
    ctx.fillRect(0, 0, ANCHO, al);
    ctx.restore();
  }
  const rutaArte = (n) => ruta(`assets/arte/${n}.webp`);

  function dibujar(ctx, p) {
    const al = VISTA.alto;
    const cam = p.cam;
    const piso = pisoDe(p.alto);
    const sig = PISOS[(PISOS.indexOf(piso) + 1) % PISOS.length];
    // El cambio de piso se MEZCLA en los últimos veinte metros en vez de cortar
    // seco: un corte de color a mitad de un swing se lee como un error de dibujo.
    const dentro = (p.alto % ALTO_PISO) / ALTO_PISO;
    const t = dentro > 0.9 ? (dentro - 0.9) / 0.1 : 0;

    ctx.save();
    const sac = p.sacude;
    if (sac > 0.4) ctx.translate((Math.random() - 0.5) * sac, (Math.random() - 0.5) * sac);

    const g = ctx.createLinearGradient(0, 0, 0, al);
    g.addColorStop(0, mezclarColor(piso.cielo[0], sig.cielo[0], t));
    g.addColorStop(1, mezclarColor(piso.cielo[1], sig.cielo[1], t));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, ANCHO, al);

    // Polvo, con parallax: se mueve a la mitad para que la torre se sienta honda.
    ctx.fillStyle = "rgba(255,255,255,.10)";
    for (const d of POLVO) {
      const y = ((d.y - cam * 0.5) % 4000 + 4000) % 4000;
      if (y > al) continue;
      ctx.beginPath(); ctx.arc(d.x, y, d.r, 0, 7); ctx.fill();
    }

    dibujarFondo(ctx, piso, sig, t, cam, al);
    dibujarParedes(ctx, p, piso, sig, t, cam, al);
    dibujarTuercas(ctx, p, cam);
    dibujarArgollas(ctx, p, piso, cam, al);
    dibujarSoga(ctx, p, cam);
    dibujarEstela(ctx, p, cam);
    dibujarBicho(ctx, p, cam);
    dibujarChispas(ctx, p, cam);
    dibujarVelocidad(ctx, p, al);
    dibujarMarea(ctx, p, al);
    ctx.restore();
  }

  function dibujarParedes(ctx, p, piso, sig, t, cam, al) {
    const color = mezclarColor(piso.pared, sig.pared, t);
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, PARED, al);
    ctx.fillRect(ANCHO - PARED, 0, PARED, al);
    // Las juntas de los ladrillos dan la referencia de velocidad: sin ellas, con
    // el fondo liso, no se nota si estás subiendo rápido o despacio.
    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 2;
    const paso = 46;
    const y0 = -(((cam % paso) + paso) % paso);
    ctx.beginPath();
    for (let y = y0; y < al; y += paso) {
      ctx.moveTo(0, y); ctx.lineTo(PARED, y);
      ctx.moveTo(ANCHO - PARED, y); ctx.lineTo(ANCHO, y);
    }
    ctx.stroke();
    const luz = ctx.createLinearGradient(0, 0, PARED + 26, 0);
    luz.addColorStop(0, piso.luz + "33"); luz.addColorStop(1, "transparent");
    ctx.fillStyle = luz; ctx.fillRect(0, 0, PARED + 26, al);
  }

  function dibujarArgollas(ctx, p, piso, cam, al) {
    for (const a of p.torre.argollas) {
      const y = a.y - cam;
      if (y < -40 || y > al + 40 || a.rota) continue;
      const viva = p.ancla === a;
      // UNA ARGOLLA OXIDADA SE VE OXIDADA DESDE LEJOS, y además muestra cuánto le
      // queda mientras estás colgado. Un peligro que sólo se entiende cuando ya
      // te pasó no es un peligro: es una trampa.
      const col = a.oxidada ? "#e08b2c" : piso.luz;
      if (viva) {
        ctx.save();
        ctx.shadowColor = col; ctx.shadowBlur = 16;
      }
      ctx.strokeStyle = col;
      ctx.lineWidth = a.oxidada ? 3.5 : 3;
      ctx.beginPath(); ctx.arc(a.x, y, F.ARGOLLA, 0, 7); ctx.stroke();
      if (a.oxidada) {
        ctx.strokeStyle = "#3a2a14"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(a.x, y, F.ARGOLLA, 0.6, 2.2); ctx.stroke();
        if (viva) {
          const queda = 1 - (p.t - a.tocada) / F.VIDA_OXIDADA;
          ctx.strokeStyle = "#ff6b6b"; ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(a.x, y, F.ARGOLLA + 5, -Math.PI / 2, -Math.PI / 2 + Math.max(0, queda) * 6.283);
          ctx.stroke();
        }
      }
      if (viva) ctx.restore();
      // El gancho clavado: un tornillo en el centro, para que se vea DONDE está
      // enganchado y no sólo que lo está.
      if (viva) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(a.x, y, 3.2, 0, 7); ctx.fill(); }
    }
  }

  function dibujarTuercas(ctx, p, cam) {
    ctx.lineWidth = 2;
    for (const t of p.torre.tuercas) {
      if (t.tomada) continue;
      const y = t.y - cam;
      if (y < -20 || y > VISTA.alto + 20) continue;
      ctx.save();
      ctx.translate(t.x, y);
      ctx.rotate(p.t * 0.05);
      ctx.fillStyle = "#ffd84a"; ctx.strokeStyle = "#7a5a10";
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const an = (i / 6) * 6.283;
        ctx[i ? "lineTo" : "moveTo"](Math.cos(an) * 8, Math.sin(an) * 8);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#2a2010";
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill();
      ctx.restore();
    }
  }

  function dibujarSoga(ctx, p, cam) {
    if (!p.ancla) return;
    const a = p.ancla;
    // LA SOGA SE DIBUJA COLGANDO cuando está floja y tirante cuando está
    // estirada, porque esa es información: floja quiere decir que la soga no está
    // haciendo nada y que estás en caída libre alrededor de la argolla.
    const d = Math.hypot(p.x - a.x, p.y - a.y);
    const floja = Math.max(0, p.largo - d);
    ctx.strokeStyle = "#d9d2c4"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - cam);
    if (floja > 2) {
      const mx = (a.x + p.x) / 2, my = (a.y + p.y) / 2 - cam + floja * 0.55;
      ctx.quadraticCurveTo(mx, my, p.x, p.y - cam);
    } else ctx.lineTo(p.x, p.y - cam);
    ctx.stroke();
  }

  function dibujarBicho(ctx, p, cam) {
    const y = p.y - cam;
    const im = arte.bicho;
    ctx.save();
    ctx.translate(p.x, y);
    // Se inclina con la velocidad: sin eso es una pelota y con eso es alguien
    // volando. Cuesta una rotación por cuadro.
    ctx.rotate(Math.atan2(p.vx, Math.max(1, -p.vy + 6)) * 0.55);
    if (im) {
      const h = F.BICHO * 3.4, w = h * (im.width / im.height);
      ctx.drawImage(im, -w / 2, -h * 0.46, w, h);
    } else {
      ctx.fillStyle = "#ffe9c9"; ctx.strokeStyle = "#1a1408"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, F.BICHO, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#1a1408";
      ctx.beginPath(); ctx.arc(-3.5, -2, 1.8, 0, 7); ctx.arc(3.5, -2, 1.8, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  /**
   * La estela: por dónde venís.
   *
   * ES LA AYUDA MAS GRANDE QUE DA LA PANTALLA en un juego de soltar en el momento
   * justo. Un péndulo se ve como una bolita quieta en el aire; con la cola de los
   * últimos cuadros se ve el ARCO, y viendo el arco se puede predecir por dónde
   * vas a salir — que es exactamente la decisión del juego. Sin ella hay que
   * soltar de memoria.
   */
  function dibujarEstela(ctx, p, cam) {
    const e = p.estela;
    if (!e || e.length < 2) return;
    ctx.lineCap = "round";
    for (let i = 1; i < e.length; i++) {
      const k = i / e.length;
      ctx.globalAlpha = k * 0.5;
      ctx.strokeStyle = p.ancla ? "#b6f0ff" : "#ffd1a0";
      ctx.lineWidth = 1 + k * 4;
      ctx.beginPath();
      ctx.moveTo(e[i - 1].x, e[i - 1].y - cam);
      ctx.lineTo(e[i].x, e[i].y - cam);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /** Rayas de aire cuando venís rápido. El mismo truco que en Paraguas: a esta
   *  velocidad el fondo ya no se percibe como movimiento. */
  function dibujarVelocidad(ctx, p, al) {
    const v = Math.hypot(p.vx, p.vy) / F.VEL_MAX;
    if (v < 0.45) return;
    const int = (v - 0.45) / 0.55;
    ctx.strokeStyle = `rgba(255,255,255,${0.04 + int * 0.13})`;
    ctx.lineWidth = 1.4;
    const an = Math.atan2(p.vy, p.vx);
    for (let i = 0; i < 10; i++) {
      const rx = frac(Math.sin((i + Math.floor(p.t / 3) * 0.37) * 91.7) * 7331) * ANCHO;
      const ry = frac(Math.sin((i * 3.7 + Math.floor(p.t / 3) * 0.91)) * 4331) * al;
      const largo = 16 + int * 54;
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - Math.cos(an) * largo, ry - Math.sin(an) * largo);
      ctx.stroke();
    }
  }

  function dibujarChispas(ctx, p, cam) {
    for (const c of p.chispas) {
      ctx.globalAlpha = Math.min(1, c.vida / 22);
      ctx.fillStyle = c.color;
      ctx.fillRect(c.x - 2, c.y - cam - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  function dibujarMarea(ctx, p, al) {
    if (!p.sube) return;
    // El borde de abajo se pinta cuando empieza a subir solo. Es lo único que
    // avisa que ahora hay apuro, y tiene que verse sin leer nada.
    const g = ctx.createLinearGradient(0, al - 70, 0, al);
    g.addColorStop(0, "rgba(255,60,60,0)");
    g.addColorStop(1, `rgba(255,60,60,${0.18 + 0.16 * Math.sin(p.t * 0.12)})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, al - 70, ANCHO, 70);
  }

  return { pisoDe, registrarArte, rutaArte, dibujar };
})();

/* ── audio.js ── */
const M_audio = (() => {
  // El sonido, sintetizado. No hay un solo archivo de audio.
  //
  // EL VIENTO ES EL INSTRUMENTO PRINCIPAL. El sonido no acompaña: informa. El
  // ruido sube de volumen y se abre de filtro con la velocidad, asi que se
  // escucha a que velocidad vas sin mirar ningun numero — y se escucha ANTES de
  // verlo, porque el oido no tiene que apartarse de la proxima argolla para
  // enterarse.
  //
  // El contexto NO se crea al arrancar: los navegadores no dejan sonar nada hasta
  // que hubo un gesto, y uno creado antes queda "suspended" para siempre.

  let ac = null, maestro = null, prendido = true, viento = null;

  function despertar() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    maestro = ac.createGain();
    maestro.gain.value = 0.5;
    maestro.connect(ac.destination);
    return ac;
  }

  const sonando = (v) => { prendido = v; if (maestro) maestro.gain.value = v ? 0.5 : 0; };

  // El contexto y el maestro se comparten con la musica: dos AudioContext en la
  // misma pagina es el error que hace que en un telefono uno de los dos no suene
  // nunca —el navegador limita cuantos deja abiertos— y ademas el silencio se
  // pediria dos veces, una por cada arbol.
  const contexto = () => ac;
  const salida = () => maestro;

  function ruidoBuffer(dur) {
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  function env(nodo, a, d, pico) {
    const g = ac.createGain(), t = ac.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(pico, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    nodo.connect(g); g.connect(maestro);
    return t + a + d;
  }

  function tono(tipo, f0, f1, a, d, pico) {
    if (!ac || !prendido) return;
    const o = ac.createOscillator();
    o.type = tipo;
    o.frequency.setValueAtTime(f0, ac.currentTime);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, ac.currentTime + a + d);
    const fin = env(o, a, d, pico);
    o.start(); o.stop(fin + 0.02);
  }

  function golpeRuido(dur, corte, pico) {
    if (!ac || !prendido) return;
    const s = ac.createBufferSource();
    s.buffer = ruidoBuffer(dur);
    const f = ac.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = corte;
    s.connect(f);
    const fin = env(f, 0.004, dur, pico);
    s.start(); s.stop(fin + 0.02);
  }

  const efe = {
    // EL ENGANCHE Y LA SOLTADA SUENAN DISTINTO Y CORTO. Son las dos únicas cosas
    // que hace el jugador, pasan cincuenta veces por partida y muchas veces
    // seguidas: un sonido largo se pisa consigo mismo y se vuelve barro.
    engancha() { golpeRuido(0.05, 2200, 0.3); tono("square", 640, 1080, 0.003, 0.05, 0.1); },
    suelta() { tono("triangle", 900, 420, 0.003, 0.07, 0.08); },
    tuerca() { tono("square", 880, 1380, 0.004, 0.09, 0.12); },
    pared() { golpeRuido(0.1, 500, 0.3); },
    // La argolla que se rompe suena a metal cediendo: dos tonos que bajan juntos
    // desafinados. Tiene que asustar sin ser el sonido de perder.
    rompe() { tono("sawtooth", 420, 90, 0.004, 0.3, 0.2); tono("square", 390, 80, 0.004, 0.3, 0.12); },
    muerto() { tono("sawtooth", 300, 42, 0.01, 0.9, 0.28); },
    // El roce de la soga mientras te hamacas: sube de tono con la velocidad, asi
    // que se escucha cuanto envion estas juntando SIN mirar el arco. Es corto y
    // bajo a proposito: suena hasta cinco veces por segundo.
    soga(v) { tono("triangle", 180 + v * 420, 160 + v * 380, 0.004, 0.05, 0.02 + v * 0.03); },
    // Soltar en el punto justo —arriba del arco y para arriba— paga un sonido
    // propio. Es la unica forma de aprender el timing sin que nadie lo explique.
    buena() { tono("sine", 700, 1400, 0.004, 0.16, 0.1); },
    hito() { [523, 659, 784].forEach((f, i) => setTimeout(() => tono("triangle", f, f, 0.01, 0.22, 0.14), i * 70)); },
    menu() { tono("square", 520, 700, 0.004, 0.07, 0.1); },
  };

  /**
   * El viento, que suena siempre y cambia con la velocidad.
   *
   * Es un ruido blanco pasado por un pasabanda: subiendo la frecuencia del
   * filtro, el mismo ruido pasa de "aire" a "silbido". Una fuente que arranca una
   * vez y no para nunca cuesta nada; crear un buffer por cuadro, en cambio,
   * derrite un telefono.
   */
  function arrancarViento() {
    if (!ac || viento) return;
    const s = ac.createBufferSource();
    s.buffer = ruidoBuffer(2.5);
    s.loop = true;
    const f = ac.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = 400; f.Q.value = 0.7;
    const g = ac.createGain(); g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(maestro);
    s.start();
    viento = { s, f, g };
  }

  /** `v` de 0 a 1: a que parte de la velocidad maxima vas. */
  function soplar(v) {
    if (!viento || !ac) return;
    const t = ac.currentTime;
    viento.g.gain.setTargetAtTime(prendido ? 0.03 + v * 0.22 : 0, t, 0.08);
    viento.f.frequency.setTargetAtTime(380 + v * 1500, t, 0.1);
  }

  function callarViento() { if (viento) viento.g.gain.setTargetAtTime(0, ac.currentTime, 0.1); }

  return { despertar, sonando, contexto, salida, efe, arrancarViento, soplar, callarViento };
})();

/* ── guardado.js ── */
const M_guardado = (() => {
  // Lo que se guarda: el record, el idioma y si el sonido esta prendido. Nada mas.
  //
  // localStorage TIRA EXCEPCION en modo privado o con el almacenamiento
  // bloqueado — no devuelve vacio. Un juego que no arranca porque no pudo leer un
  // record es peor que uno sin record.

  const LLAVE = "garfio.v1";
  // `idioma: null` quiere decir "nunca eligió", que NO es lo mismo que "eligió
  // inglés": es lo único que distingue al que abre el juego por primera vez —y
  // hay que preguntarle— del que ya eligió inglés y no quiere que le pregunten
  // más.
  const vacio = () => ({ mejor: 0, partidas: 0,
                         ajustes: { sonido: true, musica: true, idioma: null } });
  let cache = null;

  function cargar() {
    if (cache) return cache;
    try {
      const c = localStorage.getItem(LLAVE);
      cache = c ? { ...vacio(), ...JSON.parse(c) } : vacio();
      cache.ajustes = { ...vacio().ajustes, ...(cache.ajustes || {}) };
    } catch (e) { cache = vacio(); }
    return cache;
  }
  function guardar() {
    try { localStorage.setItem(LLAVE, JSON.stringify(cargar())); } catch (e) {}
  }
  function borrar() {
    try { localStorage.removeItem(LLAVE); } catch (e) {}
    cache = null;
  }

  return { cargar, guardar, borrar };
})();

/* ── idioma.js ── */

  // HTML lleva UN texto por lugar marcado con `data-t` y la tabla decide cuál se
  // escribe. Traducir copiando el index.html tres veces se desincroniza a la
  // primera corrección.
  //
  // EL IDIOMA POR DEFECTO ES INGLES, no el del navegador, y se pregunta antes del
  // menú: buscar dónde se cambia el idioma en un idioma que no sabés leer es
  // exactamente el problema que el selector viene a resolver.

  const IDIOMAS = { en: "English", es: "Español", pt: "Português" };

  const ES = {
    "doc.titulo": "Garfio — una torre sin techo",
    "doc.desc": "Una torre sin techo y un gancho. Apoyás el dedo y te colgás; arrastrás y te hamacás; soltás y salís disparado.",
    "doc.lienzo": "La torre",

    "idioma.titulo": "Elegí tu idioma",
    "idioma.bajada": "Se puede cambiar después desde el menú.",

    "menu.bajada": "<b>Apoyá</b> en una argolla y el gancho se clava. <b>Arrastrá</b> para hamacarte. <b>Soltá</b> y salís por la tangente.",
    "menu.jugar": "SUBIR",
    "menu.jugar-aria": "Subir",
    "menu.mejor": "Mejor altura",
    "menu.partidas": "{n} intentos",
    "menu.partidas1": "1 intento",
    "menu.como": "? Cómo se juega",
    "menu.sonido": "Sonido",
    "menu.musica": "Música",
    "menu.borrar": "Borrar",
    "menu.borrar-confirmar": "¿Borrar el récord?",
    "menu.idioma": "Idioma",

    "como.titulo": "Cómo se juega",
    "como.atras": "← Atrás",

/* ── musica.js ── */
const M_musica = (() => {
  // La música. Dos cosas distintas, y a propósito.
  //
  // EN EL MENU SUENA UN TEMA GRABADO. Es un bucle corto —el modelo que lo generó
  // da nueve segundos y de ahí sale un bucle de cinco— y eso en un menú no
  // molesta: nadie se queda diez minutos mirando un menú. Da atmósfera, que es
  // justo lo que un puñado de osciladores no da.
  //
  // EN EL JUEGO LA MUSICA SE TOCA SOLA, con osciladores, y no se repite nunca.
  // Un bucle de seis segundos abajo de una partida de tres minutos es una tortura:
  // se escucha la costura treinta veces. Acá hay una progresión de acordes, un
  // bajo, un arpegio y una percusión de ruido, y lo que toca cada uno DEPENDE DE
  // COMO VENIS: cuanto más alto estás y más rápido vas, más denso el arpegio, más
  // abierto el filtro y más fuerte el bombo. La música no acompaña al juego — lo
  // informa, igual que el viento.
  //
  // Y NO PESA NADA. Cero archivos, cero kilobytes, y nunca se desactualiza.

  const { ruta } = M_assets;
  // La escala y los acordes. Menor dórico —una tercera menor con sexta mayor— que
  // es lo que suena a "de noche pero no a tragedia": acá no se cae a un pozo, se
  // sube una torre, y el juego no tiene que meter miedo sino paciencia.
  const ESCALA = [0, 2, 3, 5, 7, 9, 10];         // semitonos desde la tónica
  const ACORDES = [                               // grados, en semitonos
    [0, 3, 7], [5, 9, 12], [3, 7, 10], [7, 10, 14],
  ];
  const TONICA = 49;                              // Sol1, en hercios
  const COMPAS = 8;                               // corcheas por acorde
  const PULSO = 0.16;                             // segundos por corchea (≈ 94 BPM)

  const nota = (semi) => TONICA * Math.pow(2, semi / 12);

  let ac = null, maestro = null, bus = null;
  let prendida = true, corriendo = false;
  let paso = 0, proximo = 0, reloj = null;
  let intensidad = 0, objetivo = 0;
  let tema = null, temaGan = null;

  /** Se engancha al mismo contexto y al mismo maestro que los efectos. */
  function conectar(contexto, salidaMaestra) {
    if (!contexto || ac) return;
    ac = contexto;
    maestro = salidaMaestra;
    bus = ac.createGain();
    // La música va MAS BAJA que los efectos, y bastante. Un efecto que no se
    // escucha por encima de la música es un efecto que no existe: el sonido del
    // paraguas cerrándose es información, y la música es decoración.
    bus.gain.value = 0.34;
    bus.connect(maestro);
  }

  function sonando(v) {
    prendida = v;
    if (bus) bus.gain.setTargetAtTime(v ? 0.34 : 0, ac.currentTime, 0.12);
    if (tema) tema.volume = v ? 0.5 : 0;
    if (!v) parar();
  }

  /** ¿Está corriendo el secuenciador? Lo usa la prueba de sonido.
   *
   * NO ALCANZA CON CONTAR OSCILADORES para comprobar que la música se apagó: el
   * juego sigue pasando mientras se mide —el bicho se cae, algo choca— y cada
   * efecto es un oscilador más. Contando nomás, la prueba fallaba por sonidos que
   * tenían que sonar. Esto distingue "no hay música" de "no hay ningún sonido".
   */
  const andando = () => corriendo;

  /** `v` de 0 a 1: qué tan intenso viene el juego. Se suaviza solo. */
  const empujar = (v) => { objetivo = Math.max(0, Math.min(1, v)); };

  // --- el tema del menú ----------------------------------------------------
  //
  // Va como <audio> y no por el grafo de WebAudio porque no necesita nada del
  // grafo —ni filtros, ni mezcla, ni sincronía con nada— y un <audio> se repite
  // solo, empieza sin contexto y no se rompe si el navegador todavía no dejó
  // sonar nada.
  function arrancarTema() {
    if (!prendida) return;
    if (!tema) {
      tema = new Audio(ruta("assets/arte/tema.mp3"));
      tema.loop = true;
      tema.volume = 0;
    }
    tema.play().then(() => {
      // La entrada es a mano y no con un `afade` en el archivo: el archivo es un
      // bucle y un fundido adentro del bucle se escucharía en cada vuelta.
      let v = 0;
      clearInterval(temaGan);
      temaGan = setInterval(() => {
        v = Math.min(0.5, v + 0.03);
        tema.volume = prendida ? v : 0;
        if (v >= 0.5) clearInterval(temaGan);
      }, 60);
    }).catch(() => {});
  }

  function pararTema() {
    if (!tema) return;
    clearInterval(temaGan);
    let v = tema.volume;
    temaGan = setInterval(() => {
      v = Math.max(0, v - 0.05);
      tema.volume = v;
      if (v <= 0) { clearInterval(temaGan); tema.pause(); }
    }, 40);
  }

  // --- la música del juego -------------------------------------------------
  function arrancar() {
    if (!ac || corriendo || !prendida) return;
    corriendo = true;
    paso = 0;
    intensidad = 0;
    proximo = ac.currentTime + 0.08;
    // EL PLANIFICADOR VA ADELANTADO. Programar una nota en el momento exacto en
    // que suena la deja a merced del temporizador del navegador, que se atrasa
    // veinte o treinta milisegundos cuando el juego dibuja: el ritmo tiembla y se
    // escucha. Se programan las notas de los próximos 120 ms contra el reloj del
    // audio, que no se atrasa nunca, y el temporizador sólo decide cuándo volver
    // a mirar.
    reloj = setInterval(planificar, 25);
  }

  function parar() {
    corriendo = false;
    clearInterval(reloj);
    reloj = null;
  }

  function planificar() {
    if (!corriendo || !ac) return;
    intensidad += (objetivo - intensidad) * 0.06;
    while (proximo < ac.currentTime + 0.12) {
      tocar(paso, proximo);
      proximo += PULSO;
      paso++;
    }
  }

  function env(nodo, t, a, d, pico) {
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, pico), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    nodo.connect(g); g.connect(bus);
    return g;
  }

  function voz(tipo, f, t, a, d, pico, corte) {
    const o = ac.createOscillator();
    o.type = tipo;
    o.frequency.setValueAtTime(f, t);
    let n = o;
    if (corte) {
      const fl = ac.createBiquadFilter();
      fl.type = "lowpass";
      fl.frequency.setValueAtTime(corte, t);
      o.connect(fl); n = fl;
    }
    env(n, t, a, d, pico);
    o.start(t); o.stop(t + a + d + 0.05);
  }

  function tocar(i, t) {
    const acorde = ACORDES[Math.floor(i / COMPAS) % ACORDES.length];
    const en = i % COMPAS;
    const int = intensidad;

    // El bajo: la fundamental, en la primera y en la quinta corchea. Es lo único
    // que suena siempre, con el juego quieto o a toda velocidad, y es lo que hace
    // que se sienta que hay un tema y no ruidos sueltos.
    if (en === 0 || en === 4)
      voz("sawtooth", nota(acorde[0]), t, 0.01, 0.34, 0.09, 420 + int * 900);

    // El pad: el acorde entero, largo, una vez por compás. Se abre de filtro con
    // la intensidad, así que a toda velocidad el mismo acorde suena agresivo.
    if (en === 0)
      for (const g of acorde)
        voz("sawtooth", nota(g + 24), t, 0.09, 1.0, 0.022 + int * 0.012, 600 + int * 2400);

    // El arpegio: es la voz que cuenta la velocidad. Quieto toca una de cada
    // cuatro corcheas; a fondo toca todas, una octava más arriba.
    const densidad = int > 0.66 ? 1 : int > 0.33 ? 2 : 4;
    if (en % densidad === 0) {
      const grado = ESCALA[(i * 3) % ESCALA.length];
      const oct = int > 0.66 ? 48 : 36;
      voz("square", nota(acorde[0] + grado + oct), t, 0.004, 0.11, 0.028 + int * 0.02,
          1400 + int * 4000);
    }

    // La percusión aparece recién a media intensidad: en un juego que arranca
    // suave, entrar con bombo desde el primer compás le saca el arranque suave.
    if (int > 0.28 && en % 4 === 0) {
      const o = ac.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      env(o, t, 0.004, 0.13, 0.10 * int);
      o.start(t); o.stop(t + 0.2);
    }
    if (int > 0.5 && en % 2 === 1) {
      const n = ac.createBufferSource();
      const largo = Math.floor(ac.sampleRate * 0.04);
      const buf = ac.createBuffer(1, largo, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let k = 0; k < largo; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / largo);
      n.buffer = buf;
      const fl = ac.createBiquadFilter();
      fl.type = "highpass"; fl.frequency.value = 6000;
      n.connect(fl);
      env(fl, t, 0.002, 0.04, 0.05 * int);
      n.start(t);
    }
  }

  return { conectar, sonando, andando, empujar, arrancarTema, pararTema, arrancar, parar };
})();
