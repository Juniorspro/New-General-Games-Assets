  '?': [".###.", "#...#", "....#", "...#.", "..#..", ".....", "..#.."], '¿': ["..#..", ".....", "..#..", ".#...", "#....", "#...#", ".###."],

  "'": ["#", "#", ".", ".", ".", ".", "."], '"': ["#.#", "#.#", "...", "...", "...", "...", "..."],
  '/': ["....#", "...#.", "...#.", "..#..", ".#...", ".#...", "#...."], '+': [".....", "..#..", "..#..", "#####", "..#..", "..#..", "....."],

/* las letras con marca: la base más la marca. Con las del portugués (Â Ã À Ç Ê Ô Õ)

const ACENTOS_PX = {
  'Á': ['A', 'a'], 'É': ['E', 'a'], 'Í': ['I', 'a'], 'Ó': ['O', 'a'], 'Ú': ['U', 'a'], 'Ñ': ['N', 't'], 'Ü': ['U', 'd'],

  'Ö': ['O', 'd'], 'Ş': ['S', 'z'], 'Ğ': ['G', 'b'], 'İ': ['I', 'p'],          // las del turco
};
const MARCAS_PX = {
  a: [[3, -3], [2, -2]], t: [[0, -2], [1, -3], [2, -3], [3, -2], [4, -3]], d: [[1, -2], [3, -2]],

function glifoPx(ch) {
  const c = ch.toUpperCase();
  if (FUENTE_PX[c]) return { f: FUENTE_PX[c], m: null };
  const a = ACENTOS_PX[c];
  if (a) return { f: FUENTE_PX[a[0]], m: MARCAS_PX[a[1]] };
  return { f: FUENTE_PX['?'], m: null };
}
/* puntos encendidos de un texto: [x, y, fila], con y = 0 en la línea de las mayúsculas */
function puntosTexto(str) {
  const pts = [];
  let x = 0;
  for (const ch of str) {
    const g = glifoPx(ch), w = g.f[0].length;
    for (let r = 0; r < 7; r++) for (let k = 0; k < w; k++) if (g.f[r][k] === '#') pts.push([x + k, r, r]);
    if (g.m) for (const [mx, my] of g.m) pts.push([x + mx, my, my > 6 ? 6 : 0]);
    x += w + 1;
  }
  return { pts, w: Math.max(1, x - 1) };
}
/* lo que la fuente de píxeles no tiene (árabe, japonés, tailandés, birmano…) se
   escribe con la letra del sistema, a la resolución real (ESCALA_TEXTO = píxeles

   degradé, así se lee nítido sin cambiar el lugar que ocupa */

function esPx(str) { for (const ch of String(str)) if (!cubrePx(ch)) return false; return true; }

function fuenteSis(str) {
  const esc = typeof escrituraDe === 'function' ? escrituraDe(str) : 'latn';
  const fam = (typeof fuenteEscritura === 'function' && fuenteEscritura(esc, 'sans')) || '"Trebuchet MS",Arial,sans-serif';
  return { esc, tam: 9 * (typeof escalaEscritura === 'function' ? escalaEscritura(esc) : 1), fam };
}
function anchoSis(str) {
  const f = fuenteSis(str);
  medidorTxt.font = '700 ' + f.tam + 'px ' + f.fam; medidorTxt.direction = f.esc === 'arab' ? 'rtl' : 'ltr';
  return Math.ceil(medidorTxt.measureText(str).width);
}

  g.direction = f.esc === 'arab' ? 'rtl' : 'ltr'; g.lineJoin = 'round';

function anchoTexto(str) {
  if (!esPx(str)) return anchoSis(str);
  let x = 0;

/* texto a un lienzo de 1 px por píxel de fuente: sombra, contorno y degradé
   por fila. Arriba deja 3 filas de aire para las tildes */
const cacheTxt = new Map();
function lienzoTexto(str, o, e) {
  o = o || {};

  if (sis) { c = lienzoSis(str, o, e); c.txt = str; if (cacheTxt.size > 500) cacheTxt.clear(); cacheTxt.set(clave, c); return c; }

  const arriba = 3;

  const g = c.getContext('2d'), ox = 1, oy = arriba + 1, borde = o.borde || '#141018';

/* dibuja texto en el lienzo del mundo. y = la línea de arriba de las mayúsculas.
   o.alin: 'izq' | 'centro' | 'der'; o.escala: entero, para títulos */
function textoPx(g, str, x, y, o) {
  o = o || {};
  const e = o.escala || 1, c = lienzoTexto(str, o, e);
  if (c.sis) {
    // el centro del texto va con el centro de las mayúsculas de píxeles (de y a y + 7·e)
    const w = (c.lw - 4) * e;
    const dx = o.alin === 'centro' ? x - w / 2 : o.alin === 'der' ? x - w : x;
    g.drawImage(c, dx - 2 * e, y + 3.5 * e - c.cy * e, c.lw * e, c.lh * e);
    return;
  }
  let dx = x - e;
  if (o.alin === 'centro') dx = x - Math.floor((c.width - 3) * e / 2) - e;
  else if (o.alin === 'der') dx = x - (c.width - 3) * e - e;
  g.drawImage(c, Math.round(dx), Math.round(y - 4 * e), c.width * e, c.height * e);

/* letra por letra: para escribir de a poco y para las palabras que tiemblan */
function textoLetras(g, str, x, y, o, cuantas, desplazar) {
  o = o || {};
  if (!esPx(str)) {
    // letra por letra rompería el árabe y el tailandés: se destapa el renglón entero (de derecha a izquierda si es árabe)
    const total = Array.from(str).length, k = cuantas == null ? 1 : Math.min(1, cuantas / Math.max(1, total)), w = anchoTexto(str);

    g.clip(); textoPx(g, str, x, y, o); g.restore();
    return;
  }
  let cx = x, i = 0;
  for (const ch of str) {
    if (cuantas != null && i >= cuantas) break;
    const w = glifoPx(ch).f[0].length;
    if (ch !== ' ') {
      const c = lienzoTexto(ch, o), d = desplazar ? desplazar(i) : null;
      g.drawImage(c, Math.round(cx - 1 + (d ? d[0] : 0)), Math.round(y - 4 + (d ? d[1] : 0)));
    }
    cx += w + 1; i++;

}
/* partir un texto en renglones que entren en "ancho" píxeles */
function envolver(str, ancho) {
  if (typeof partirMedido === 'function') return partirMedido(str, ancho, anchoTexto);
  const renglones = [];
  for (const parrafo of str.split('\n')) {
    let linea = '';

      const prueba = linea ? linea + ' ' + pal : pal;
      if (anchoTexto(prueba) > ancho && linea) { renglones.push(linea); linea = pal; }

function pixelar(el, S, o) {
  if (!el) return;
  const txt = el.textContent.trim() !== '' ? el.textContent.trim() : (el.dataset.px || '');
  if (!txt) return;
  const clave = txt + '|' + S + '|' + (o && o.grad ? o.grad[0] : '');

/* ============================================================================
   motor2d/idiomas.js — los 13 idiomas de los juegos (pedido del 08/10 para

   Filipinas, Pakistán, Arabia Saudita, Tailandia y Turquía, más los tres que

function partirMedido(str, ancho, medir) {
  const out = [];

/* ==== filete/js/arte.js ==== */
/* ============================================================================
   El arte del filete porteño, todo pintado por código y en píxeles: volutas
   (espirales con su resalte blanco), hojas de acanto, flores, perlitas,
   cintas con letras, letras doradas con sombra corrida y las fichas pintadas.
   Se arma una vez en lienzos chicos y después solo se estampan.
   ========================================================================== */

const K = '#0d0b10';
const F = {
  laca: '#141018', laca2: '#1d1724', oro: '#ffcf3a', oroOsc: '#c8861a', oroClaro: '#fff2a8',
  rojo: '#d8283a', rojoOsc: '#7a1222', verde: '#2fae4e', verdeOsc: '#14602a', verdeClaro: '#9af07a',
  azul: '#2a62d8', azulOsc: '#163a8a', celeste: '#5ac8f0', crema: '#f4e8cc', blanco: '#fff8ec',
};
/* las ocho pinturas de las fichas: base, claro, oscuro */
const PINTURAS = [
  ['#e8323e', '#ff8a8a', '#8a1424'], ['#2fb04e', '#9af07a', '#14602a'], ['#2f6ae0', '#8ab8ff', '#163a8a'], ['#ffc83a', '#fff2a0', '#b07410'],
  ['#ff7a2a', '#ffc08a', '#a83a10'], ['#38c0e8', '#b0f0ff', '#14708e'], ['#9a4ad8', '#d8a8ff', '#52207e'], ['#ff5aa0', '#ffc0dc', '#a0204e'],
];

function lienzo(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
/* disco de píxeles (sin suavizado: bordes de píxel) */
function disco(g, x, y, r, col) {
  g.fillStyle = col;
  if (r < 0.75) { g.fillRect(Math.round(x), Math.round(y), 1, 1); return; }
  const R = Math.ceil(r);
  for (let dy = -R; dy <= R; dy++) {
    const m = Math.sqrt(Math.max(0, r * r - dy * dy));
    const a = Math.round(x - m), b = Math.round(x + m);
    if (b >= a && m > 0.3) g.fillRect(a, Math.round(y + dy), b - a + 1, 1);
  }
}
function punto(g, x, y, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), 1, 1); }

/* la voluta: espiral que se angosta hacia adentro, con lado claro y resalte blanco.
   x, y = el ojo; r = radio de afuera; giros; sentido ±1; ang0 = dónde empieza afuera */
function voluta(g, x, y, r, giros, sentido, cols, grosor, ang0) {
  const tot = giros * Math.PI * 2, paso = 0.04;
  grosor = grosor || Math.max(1.5, r * 0.22);
  ang0 = ang0 || 0;
  const pts = [];
  for (let th = 0; th <= tot; th += paso / Math.max(0.3, (1 - th / tot))) {
    const k = th / tot, rr = r * (1 - k * 0.92), a = ang0 + sentido * th;
    pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr, grosor * (1 - k * 0.65)]);
  }
  for (const [px, py, w] of pts) disco(g, px + 0.6, py + 0.8, w, cols[2]);           // sombra
  for (const [px, py, w] of pts) disco(g, px, py, w, cols[0]);
  for (const [px, py, w] of pts) disco(g, px - w * 0.3, py - w * 0.3, w * 0.45, cols[1]);
  for (let i = 0; i < pts.length; i += 2) { const [px, py, w] = pts[i]; if (w > 1.4) punto(g, px - w * 0.45, py - w * 0.45, F.blanco); }
  disco(g, x, y, Math.max(1, grosor * 0.5), cols[0]);
}
/* la hoja de acanto: un huso curvo de p0 a p1 (con c de control), mitad clara y mitad oscura */
function hoja(g, x0, y0, cx, cy, x1, y1, ancho, cols) {
  const n = 40;
  for (let pas = 0; pas < 3; pas++) for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    const x = u * u * x0 + 2 * u * t * cx + t * t * x1, y = u * u * y0 + 2 * u * t * cy + t * t * y1;
    const w = Math.sin(Math.PI * Math.pow(t, 0.8)) * ancho;
    if (pas === 0) disco(g, x + 0.7, y + 0.9, w, cols[2]);
    else if (pas === 1) disco(g, x, y, w, cols[0]);
    else { disco(g, x - w * 0.35, y - w * 0.35, w * 0.45, cols[1]); if (i % 3 === 0 && w > 1.2) punto(g, x, y, F.blanco); }
  }
}
/* la flor de cinco pétalos */
function flor(g, x, y, r, cols) {
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5, px = x + Math.cos(a) * r * 0.62, py = y + Math.sin(a) * r * 0.62;
    disco(g, px + 0.6, py + 0.8, r * 0.48, cols[2]);
    disco(g, px, py, r * 0.46, cols[0]);
    disco(g, px - r * 0.12, py - r * 0.12, r * 0.2, cols[1]);
  }
  disco(g, x, y, Math.max(1, r * 0.3), F.oro);
  punto(g, x - 1, y - 1, F.blanco);
}
/* el adorno de una esquina (de 46 × 46), para el marco y el menú */
function adornoEsquina(tam) {
  const c = lienzo(tam, tam), g = c.getContext('2d'), s = tam / 46;
  hoja(g, 4 * s, 40 * s, 10 * s, 14 * s, 38 * s, 6 * s, 3.4 * s, [F.verde, F.verdeClaro, F.verdeOsc]);
  voluta(g, 14 * s, 15 * s, 10 * s, 1.15, 1, [F.oro, F.oroClaro, F.oroOsc], 2.4 * s, Math.PI * 0.9);
  hoja(g, 18 * s, 24 * s, 30 * s, 28 * s, 42 * s, 20 * s, 2.6 * s, [F.verde, F.verdeClaro, F.verdeOsc]);
  hoja(g, 22 * s, 18 * s, 26 * s, 30 * s, 20 * s, 42 * s, 2.6 * s, [F.verde, F.verdeClaro, F.verdeOsc]);
  flor(g, 30 * s, 30 * s, 6 * s, [F.rojo, '#ff9a9a', F.rojoOsc]);
  disco(g, 40 * s, 38 * s, 1.6 * s, F.celeste); disco(g, 8 * s, 6 * s, 1.4 * s, F.rojo);
  return c;
}
function espejar(c, h, v) {
  const s = lienzo(c.width, c.height), g = s.getContext('2d');
  g.translate(h ? c.width : 0, v ? c.height : 0); g.scale(h ? -1 : 1, v ? -1 : 1); g.drawImage(c, 0, 0);
  return s;
}
/* marco dorado de filete con perlitas y adornos en las cuatro esquinas */
function marcoFilete(g, x, y, w, h, esquinas, tam) {
  g.fillStyle = K; g.fillRect(x - 3, y - 3, w + 6, h + 6);
  g.fillStyle = F.oroOsc; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.fillStyle = F.oro; g.fillRect(x - 2, y - 2, w + 4, 1); g.fillRect(x - 2, y - 2, 1, h + 4);
  g.fillStyle = F.rojo; g.fillRect(x - 1, y - 1, w + 2, h + 2);
  g.fillStyle = F.laca; g.fillRect(x, y, w, h);
  for (let i = x + 6; i < x + w - 4; i += 6) { punto(g, i, y - 4, F.oroClaro); punto(g, i, y + h + 3, F.oroClaro); }
  for (let i = y + 6; i < y + h - 4; i += 6) { punto(g, x - 4, i, F.oroClaro); punto(g, x + w + 3, i, F.oroClaro); }
  if (esquinas) {
    const t = tam || 34, o = Math.round(t * 0.32);
    g.drawImage(esquinas[0], x - o, y - o, t, t); g.drawImage(esquinas[1], x + w + o - t, y - o, t, t);
    g.drawImage(esquinas[2], x - o, y + h + o - t, t, t); g.drawImage(esquinas[3], x + w + o - t, y + h + o - t, t, t);
  }
}

/* ------------------------------------------------------------ las fichas */
const FICHAS = new Map();
function ficha(col, s) {
  const k = col + '|' + s;
  if (FICHAS.has(k)) return FICHAS.get(k);
  const [b, l, d] = PINTURAS[col], c = lienzo(s, s), g = c.getContext('2d');
  g.fillStyle = K; g.fillRect(1, 0, s - 2, s); g.fillRect(0, 1, s, s - 2);
  g.fillStyle = d; g.fillRect(1, 1, s - 2, s - 2);
  g.fillStyle = b; g.fillRect(1, 1, s - 3, s - 3);
  g.fillStyle = l; g.fillRect(2, 1, s - 4, 1); g.fillRect(1, 2, 1, s - 4);
  if (s >= 14) {
    g.fillStyle = l; g.fillRect(2, 2, s - 6, 1); g.fillRect(2, 2, 1, s - 6);
    // la mini voluta blanca del centro
    const cx = s / 2 - 0.5, cy = s / 2 - 0.5, R = s * 0.26;
    for (let th = 0; th < Math.PI * 1.7; th += 0.12) {
      const rr = R * (1 - th / (Math.PI * 2) * 0.75), a = Math.PI + th;
      punto(g, cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 'rgba(255,248,236,0.85)');
      if (s >= 20 && th < 2.6) punto(g, cx + Math.cos(a) * (rr + 1), cy + Math.sin(a) * (rr + 1), 'rgba(255,248,236,0.5)');
    }
    punto(g, cx + R * 0.15, cy, F.blanco);
    punto(g, s - 5, 3, 'rgba(255,255,255,0.7)');
  } else { punto(g, 3, 3, 'rgba(255,255,255,0.8)'); }
  FICHAS.set(k, c);
  return c;
}
/* una flor sobre una ficha (lo que se junta en los barrios) */
const FLORES = new Map();
function florFicha(s) {
  if (FLORES.has(s)) return FLORES.get(s);
  const c = lienzo(s, s), g = c.getContext('2d');
  flor(g, s / 2 - 0.5, s / 2 - 0.5, s * 0.36, [F.blanco, '#ffffff', '#c8b898']);
  disco(g, s / 2 - 0.5, s / 2 - 0.5, s * 0.12, F.rojo);

}
/* la casilla vacía del tablero */
let casillaVacia = null;
function vacia() {
  if (casillaVacia) return casillaVacia;
  const c = lienzo(CEL, CEL), g = c.getContext('2d');
  g.fillStyle = '#10141f'; g.fillRect(0, 0, CEL, CEL);
  g.fillStyle = '#171d2c'; g.fillRect(1, 1, CEL - 2, CEL - 2);
  g.fillStyle = '#1d2436'; g.fillRect(1, 1, CEL - 2, 1);
  punto(g, CEL / 2 - 1, CEL / 2 - 1, '#252d44');
  return (casillaVacia = c);
}

/* ------------------------------------------------- las letras de filete */
const GRAD_ORO = ['#fff6c0', '#ffe27a', '#ffcf3a', '#ffb52a', '#f0961e', '#d87a18', '#b05e14'];
const GRAD_CREMA = ['#ffffff', '#fffaf0', '#f8eedc', '#f0e2c8', '#e6d4b4', '#d8c4a0', '#c8b088'];
const GRAD_CELESTE = ['#eafaff', '#c0f0ff', '#90e0fa', '#5ac8f0', '#3aa8d8', '#2a88c0', '#1e6aa0'];
const GRAD_ROJO = ['#ffd0d0', '#ff9a9a', '#ff6a6a', '#e8323e', '#c82432', '#a01a2a', '#7a1222'];
const GRAD_VERDE = ['#e0ffd0', '#b0f090', '#7ad860', '#4cc04a', '#2fae4e', '#1f8a3a', '#14602a'];
const cacheLetras = new Map();
/* texto con letras de cartel: sombra corrida de color, contorno, degradé por fila y filo blanco */
function letrasFilete(str, esc, grad, sombra) {
  const k = str + esc + grad[0] + (sombra || '');
  if (cacheLetras.has(k)) return cacheLetras.get(k);
  const { pts, w } = puntosTexto(str);
  const on = new Set(pts.map(([x, y]) => x + ',' + y));
  const sd = Math.max(1, Math.round(esc * 0.6));
  const c = lienzo((w + 2) * esc + sd + 2, 13 * esc + sd + 2), g = c.getContext('2d');
  const ox = esc + 1, oy = 4 * esc + 1;
  g.fillStyle = sombra || F.rojoOsc;
  for (const [x, y] of pts) g.fillRect(ox + x * esc + sd, oy + y * esc + sd, esc, esc);
  g.fillStyle = K;
  for (const [x, y] of pts) g.fillRect(ox + x * esc - 1, oy + y * esc - 1, esc + 2, esc + 2);
  for (const [x, y, r] of pts) {
    g.fillStyle = grad[clamp(r, 0, 6)]; g.fillRect(ox + x * esc, oy + y * esc, esc, esc);
    if (esc >= 2) {
      g.fillStyle = 'rgba(255,255,255,0.9)';
      if (!on.has(x + ',' + (y - 1))) g.fillRect(ox + x * esc, oy + y * esc, esc, 1);
      if (!on.has((x - 1) + ',' + y)) g.fillRect(ox + x * esc, oy + y * esc, 1, esc);
    }
  }
  if (cacheLetras.size > 300) cacheLetras.clear();
  cacheLetras.set(k, c);
  return c;
}
/* y = la línea de arriba de las mayúsculas */
function escribir(g, str, x, y, o) {
  o = o || {};
  const esc = o.esc || 1;
  if (esc === 1 && !o.filete) { textoPx(g, str, x, y, { alin: o.alin, grad: o.grad, col: o.col, borde: o.borde, sinSombra: o.sinSombra }); return; }
  // árabe, japonés, tailandés, birmano…: sin letras de cartel, con la letra del sistema al tamaño del cartel
  if (!esPx(str)) { textoPx(g, str, x, y, { alin: o.alin, grad: o.grad || GRAD_ORO, borde: K, escala: esc }); return; }
  const c = letrasFilete(str, esc, o.grad || GRAD_ORO, o.sombra);
  let dx = x - esc - 1;
  if (o.alin === 'centro') dx = Math.round(x - c.width / 2 + 1);
  else if (o.alin === 'der') dx = x - c.width + 2;
  g.drawImage(c, Math.round(dx), Math.round(y - 4 * esc - 1));
}

/* la cinta (cartel de filete) con las puntas dobladas y cortadas en V; se arma en su propio
   lienzo (los cortes son transparentes) y se estampa */
const CINTAS = new Map();
function cinta(g, x, y, w, h, col, colOsc) {
  w = Math.round(w); h = Math.round(h);
  const k = w + '|' + h + col;
  let c = CINTAS.get(k);
  const p = Math.round(h * 0.6) + 2;
  if (!c) {
    c = lienzo(w + 2 * p + 2, h + 6);
    const s = c.getContext('2d'), ox = p + 1, oy = 1;
    s.fillStyle = K; s.fillRect(0, oy + 3, p + 4, h + 2); s.fillRect(ox + w - 3, oy + 3, p + 4, h + 2);
    s.fillStyle = colOsc; s.fillRect(1, oy + 4, p + 2, h); s.fillRect(ox + w - 2, oy + 4, p + 2, h);
    const v = Math.ceil(h / 2) + 1;
    for (let i = 0; i <= v; i++) {
      const a = v - i;
      s.clearRect(0, oy + 3 + i, a, 1); s.clearRect(0, oy + 5 + h - i, a, 1);
      s.clearRect(c.width - a, oy + 3 + i, a, 1); s.clearRect(c.width - a, oy + 5 + h - i, a, 1);
    }
    s.fillStyle = K; s.fillRect(ox - 1, oy - 1, w + 2, h + 2);
    s.fillStyle = col; s.fillRect(ox, oy, w, h);
    s.fillStyle = 'rgba(255,255,255,0.35)'; s.fillRect(ox, oy + 1, w, 1);
    s.fillStyle = 'rgba(0,0,0,0.25)'; s.fillRect(ox, oy + h - 2, w, 2);
    s.fillStyle = F.oro; s.fillRect(ox, oy, w, 1); s.fillRect(ox, oy + h - 1, w, 1);
    CINTAS.set(k, c);
  }
  g.drawImage(c, Math.round(x - p - 1), Math.round(y - 1));
}

/* el fondo de laca negra con el brillo de una lámpara arriba */
function fondoLaca(Wf, Hf) {
  const c = lienzo(Wf, Hf), g = c.getContext('2d'), r = rngSemilla(5);
  for (let y = 0; y < Hf; y++) {
    const p = y / Hf;
    g.fillStyle = 'rgb(' + Math.round(22 - p * 8) + ',' + Math.round(17 - p * 6) + ',' + Math.round(26 - p * 8) + ')';
    g.fillRect(0, y, Wf, 1);
  }
  for (let i = 0; i < Wf * Hf / 40; i++) punto(g, r() * Wf, r() * Hf, 'rgba(255,255,255,0.025)');
  return c;
}

/* ==== filete/js/tablero.js ==== */
/* ============================================================================
   El tablero y las piezas: formas con sus giros, dónde entra cada una, qué
   líneas se completan, el puntaje y la tanda de tres piezas. La tanda se
   elige para que siempre se pueda jugar al menos una, y si se puede, las tres
   (se prueba con una búsqueda corta); con el tablero lleno vienen más chicas.
   ========================================================================== */

function girar(c) { const r = c.map(([x, y]) => [-y, x]); const mx = Math.min(...r.map((p) => p[0])), my = Math.min(...r.map((p) => p[1])); return r.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]); }
const claveForma = (c) => c.map((p) => p.join(',')).join(';');
const BASES = [
  { c: [[0, 0]], p: 3 },
  { c: [[0, 0], [1, 0]], p: 6, giros: 2 },
  { c: [[0, 0], [1, 0], [2, 0]], p: 6, giros: 2 },
  { c: [[0, 0], [1, 0], [2, 0], [3, 0]], p: 4, giros: 2 },
  { c: [[0, 0], [1, 0], [2, 0], [3, 0], [4, 0]], p: 2.5, giros: 2 },
  { c: [[0, 0], [1, 0], [0, 1], [1, 1]], p: 6 },
  { c: [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [0, 2], [1, 2], [2, 2]], p: 1.6 },
  { c: [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1]], p: 2.2, giros: 2 },
  { c: [[0, 0], [1, 0], [0, 1]], p: 2.5, giros: 4 },
  { c: [[0, 0], [0, 1], [0, 2], [1, 2]], p: 1.4, giros: 4 },
  { c: [[1, 0], [1, 1], [1, 2], [0, 2]], p: 1.4, giros: 4 },
  { c: [[0, 0], [1, 0], [2, 0], [1, 1]], p: 1.5, giros: 4 },
  { c: [[1, 0], [2, 0], [0, 1], [1, 1]], p: 1.1, giros: 2 },
  { c: [[0, 0], [1, 0], [1, 1], [2, 1]], p: 1.1, giros: 2 },
  { c: [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2]], p: 1.3, giros: 4 },
];
const FORMAS = [];
for (const b of BASES) {
  let c = b.c.slice().sort((p, q) => p[1] - q[1] || p[0] - q[0]);
  const vistas = new Set();
  for (let i = 0; i < (b.giros || 1); i++) {
    const k = claveForma(c);
    if (!vistas.has(k)) {
      vistas.add(k);
      FORMAS.push({ c, w: Math.max(...c.map((p) => p[0])) + 1, h: Math.max(...c.map((p) => p[1])) + 1, p: b.p / (b.giros || 1), n: c.length });
    }
    c = girar(c);
  }
}

/* el tablero: col[i] = 0 vacía o 1..8 la pintura; flor[i] = 1 si tiene flor */
function tableroNuevo() { return { col: new Int8Array(N * N), flor: new Uint8Array(N * N) }; }
function copiarTablero(t) { return { col: t.col.slice(), flor: t.flor.slice() }; }
function cabe(t, f, x, y) {
  if (x < 0 || y < 0 || x + f.w > N || y + f.h > N) return false;
  for (const [a, b] of f.c) if (t.col[(y + b) * N + x + a]) return false;
  return true;
}
function hayLugar(t, f) { for (let y = 0; y <= N - f.h; y++) for (let x = 0; x <= N - f.w; x++) if (cabe(t, f, x, y)) return true; return false; }
/* qué filas y columnas quedarían llenas si se pone ahí (sin tocar el tablero) */
function lineasCon(t, f, x, y) {
  const lleno = t.col.slice();
  for (const [a, b] of f.c) lleno[(y + b) * N + x + a] = 1;
  const filas = [], cols = [];
  for (let r = 0; r < N; r++) { let ok = true; for (let c = 0; c < N; c++) if (!lleno[r * N + c]) { ok = false; break; } if (ok) filas.push(r); }
  for (let c = 0; c < N; c++) { let ok = true; for (let r = 0; r < N; r++) if (!lleno[r * N + c]) { ok = false; break; } if (ok) cols.push(c); }
  return { filas, cols };
}
/* pone la pieza y borra lo completo; devuelve qué pasó */
function poner(t, f, x, y, pintura) {
  for (const [a, b] of f.c) t.col[(y + b) * N + x + a] = pintura;
  const { filas, cols } = lineasCon(t, f, x, y);
  const borradas = new Set();
  for (const r of filas) for (let c = 0; c < N; c++) borradas.add(r * N + c);
  for (const c of cols) for (let r = 0; r < N; r++) borradas.add(r * N + c);
  const celdas = [];
  let flores = 0;
  for (const i of borradas) { celdas.push({ i, col: t.col[i], flor: t.flor[i] }); if (t.flor[i]) flores++; t.col[i] = 0; t.flor[i] = 0; }
  return { filas, cols, lineas: filas.length + cols.length, celdas, flores, vacio: t.col.every((v) => !v) };
}
function ocupadas(t) { let n = 0; for (const v of t.col) if (v) n++; return n; }

/* ------------------------------------------------------------ la tanda */
function elegirForma(rnd, lleno, puntos) {
  // con el tablero lleno, más chicas; con muchos puntos, un poco más grandes
  let total = 0;
  const pesos = FORMAS.map((f) => {
    let p = f.p;
    if (lleno > 0.45) p *= f.n <= 3 ? 1.8 : f.n >= 6 ? 0.4 : 1;
    if (puntos > 3000 && f.n >= 4) p *= 1.25;
    total += p; return p;
  });
  let x = rnd() * total;
  for (let i = 0; i < FORMAS.length; i++) { x -= pesos[i]; if (x <= 0) return FORMAS[i]; }
  return FORMAS[0];
}
/* ¿se pueden poner las tres en algún orden? (búsqueda corta: pocas posiciones por pieza) */
function sePuedenTodas(t, formas) {
  const ordenes = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]];
  const prueba = (tab, resto) => {
    if (!resto.length) return true;
    const f = resto[0], pos = [];
    for (let y = 0; y <= N - f.h; y++) for (let x = 0; x <= N - f.w; x++) if (cabe(tab, f, x, y)) pos.push([x, y]);
    if (!pos.length) return false;
    // primero las que borran líneas, después unas pocas más
    pos.sort((a, b) => lineasCon(tab, f, b[0], b[1]).filas.length + lineasCon(tab, f, b[0], b[1]).cols.length - (lineasCon(tab, f, a[0], a[1]).filas.length + lineasCon(tab, f, a[0], a[1]).cols.length));
    for (const [x, y] of pos.slice(0, 10)) { const c = copiarTablero(tab); poner(c, f, x, y, 1); if (prueba(c, resto.slice(1))) return true; }
    return false;
  };
  return ordenes.some((o) => prueba(t, o.map((i) => formas[i])));
}
function nuevaTanda(t, rnd, puntos) {
  const lleno = ocupadas(t) / (N * N);
  let mejor = null;
  for (let intento = 0; intento < 14; intento++) {
    const formas = [elegirForma(rnd, lleno, puntos), elegirForma(rnd, lleno, puntos), elegirForma(rnd, lleno, puntos)];
    if (!formas.some((f) => hayLugar(t, f))) continue;
    if (!mejor) mejor = formas;
    if (sePuedenTodas(t, formas)) { mejor = formas; break; }
  }
  if (!mejor) mejor = [FORMAS[0], FORMAS[0], FORMAS[1]];
  return mejor.map((f) => ({ f, pintura: 1 + Math.floor(rnd() * PINTURAS.length) }));
}

/* ------------------------------------------------------------ el puntaje */
function puntaje(celdasPuestas, lineas, combo, vacio) {
  let p = celdasPuestas;
  if (lineas) p += lineas * lineas * 10 * Math.max(1, combo);
  if (vacio) p += 300;
  return p;
}

/* -------------------------------------------- los niveles de los barrios */
function armarNivel(n) {
  const r = rngSemilla(n * 7919 + 13), t = tableroNuevo();
  const densidad = 0.2 + Math.min(0.24, n * 0.009), flores = 3 + Math.floor(n / 3);
  const simetrico = n % 3 === 0;
  for (let y = 0; y < N; y++) for (let x = 0; x < (simetrico ? N / 2 : N); x++) {
    if (r() < densidad + (y > 3 ? 0.08 : 0)) {
      const p = 1 + Math.floor(r() * PINTURAS.length);
      t.col[y * N + x] = p;
      if (simetrico) t.col[y * N + N - 1 - x] = p;
    }
  }
  // ninguna línea completa de entrada
  for (let y = 0; y < N; y++) if (t.col.slice(y * N, y * N + N).every((v) => v)) t.col[y * N + Math.floor(r() * N)] = 0;
  for (let x = 0; x < N; x++) { let ok = true; for (let y = 0; y < N; y++) if (!t.col[y * N + x]) ok = false; if (ok) t.col[Math.floor(r() * N) * N + x] = 0; }
  const llenas = [];
  for (let i = 0; i < N * N; i++) if (t.col[i]) llenas.push(i);
  for (let k = 0; k < flores && llenas.length; k++) t.flor[llenas.splice(Math.floor(r() * llenas.length), 1)[0]] = 1;
  return { t, flores: t.flor.reduce((a, b) => a + b, 0), meta3: Math.round(flores * 1.4 + 5), meta2: Math.round(flores * 2.1 + 8) };
}

/* ==== filete/js/sonido.js ==== */
/* ============================================================================
   El sonido, sintetizado: un tango en re menor con bandoneón (dos lengüetas
   desafinadas apenas y un filtro), marcato de piano en cuatro, contrabajo de
   pizzicato con arrastre, y una síncopa (3-3-2) cada tantos compases. Los
   efectos son de madera (poner), campanitas que suben con el combo y el
   "chan-chan" del final.
   ========================================================================== */

const Sonido = {
  ctx: null, total: null, efectos: null, musicaG: null,
  musicaSi: Guardado.leer('musica', true), efectosSi: Guardado.leer('efectos', true),
  tema: null, prox: 0, paso: 0, ruidoBuf: null,
  iniciar() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    const comp = this.ctx.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4;
    this.total = this.ctx.createGain(); this.total.gain.value = 0.9;
    this.efectos = this.ctx.createGain(); this.efectos.gain.value = this.efectosSi ? 0.6 : 0;
    this.musicaG = this.ctx.createGain(); this.musicaG.gain.value = this.musicaSi ? 0.3 : 0;
    this.efectos.connect(comp); this.musicaG.connect(comp); comp.connect(this.total); this.total.connect(this.ctx.destination);
    const n = this.ctx.sampleRate;
    this.ruidoBuf = this.ctx.createBuffer(1, n, n);
    const d = this.ruidoBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    setInterval(() => this.programar(), 30);
  },
  ponerMusica(si) { this.musicaSi = si; Guardado.escribir('musica', si); if (this.musicaG) this.musicaG.gain.value = si ? 0.3 : 0; },
  ponerEfectos(si) { this.efectosSi = si; Guardado.escribir('efectos', si); if (this.efectos) this.efectos.gain.value = si ? 0.6 : 0; },
  pausar(si) { if (this.ctx) { if (si) this.ctx.suspend(); else this.ctx.resume(); } },
  hz: (m) => 440 * Math.pow(2, (m - 69) / 12),

  tono(f, dur, tipo, vol, f2, t, destino, ataque) {
    const c = this.ctx; if (!c) return;
    t = t || c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = tipo || 'square'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + (ataque || 0.005)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(destino || this.efectos); o.start(t); o.stop(t + dur + 0.03);
  },
  ruido(dur, vol, frec, tipoF, t, destino, q) {
    const c = this.ctx; if (!c) return;
    t = t || c.currentTime;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.ruidoBuf; f.type = tipoF || 'bandpass'; f.frequency.value = frec || 1500; if (q) f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(destino || this.efectos); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  },
  /* el bandoneón: dos serruchos casi iguales, uno cuadrado una octava abajo, filtro y fuelle */
  bando(midi, dur, vol, t, destino, brillo) {
    const c = this.ctx; if (!c) return;
    const f = this.hz(midi), g = c.createGain(), fl = c.createBiquadFilter();
    fl.type = 'lowpass'; fl.frequency.value = brillo || 1900; fl.Q.value = 2;
    for (const [tipo, mult, det, v] of [['sawtooth', 1, -6, 0.5], ['sawtooth', 1, 7, 0.5], ['square', 0.5, 0, 0.25]]) {
      const o = c.createOscillator(), og = c.createGain();
      o.type = tipo; o.frequency.value = f * mult; o.detune.value = det; og.gain.value = v;
      o.connect(og); og.connect(fl); o.start(t); o.stop(t + dur + 0.12);
    }
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.025); g.gain.setValueAtTime(vol * 0.85, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.1);
    fl.connect(g); g.connect(destino || this.efectos);
  },
  sfx(n, x) {
    if (!this.ctx || !this.efectosSi) return;
    const t = this.ctx.currentTime;
    switch (n) {
      case 'tomar': this.ruido(0.03, 0.08, 5000, 'highpass'); this.tono(900, 0.04, 'triangle', 0.05); break;
      case 'poner': this.ruido(0.05, 0.25, 1800, 'bandpass', t, null, 2); this.tono(320, 0.07, 'triangle', 0.18, 140); this.tono(110, 0.1, 'sine', 0.25, 60); break;
      case 'mal': this.tono(150, 0.14, 'square', 0.05, 120); break;

  g.fillStyle = K; g.fillRect(cx - 1, cy - 1 + (aprC ? 1 : 0), 38, 15);
  g.fillStyle = P.atascado ? (Math.floor(t * 4) % 2 ? F.verde : F.verdeOsc) : F.verdeOsc; g.fillRect(cx, cy + (aprC ? 1 : 0), 36, 13);
  g.fillStyle = F.oro; g.fillRect(cx, cy + (aprC ? 1 : 0), 36, 1);
  escribir(g, tr('cambio'), cx + 15, cy + 3 + (aprC ? 1 : 0), { alin: 'centro', grad: GRAD_CREMA, borde: K });
  disco(g, cx + 33, cy + 1, 5, F.rojo); escribir(g, String(P.cambios), cx + 33, cy - 2, { alin: 'centro', grad: GRAD_CREMA, borde: 'no', sinSombra: true });
  g.globalAlpha = 1;
  if (hay && clicEn(cx - 2, cy - 2, 40, 18)) usarCambio();
}
function dibujarBanner(b) {
  const k = b.t < 0.25 ? rebote(b.t / 0.25) : b.t > 1.25 ? 1 - salida((b.t - 1.25) / 0.25) : 1;
  const e = anchoTexto(b.txt) * 2 + 32 <= W ? 2 : 1;
  const w = Math.max(60, anchoTexto(b.txt) * e + 24), x = W / 2 - w / 2 + (1 - k) * -W, y = TY + TAB / 2 - 14;
  cinta(g, x, y, w, 26, b.col, K);
  escribir(g, b.txt, x + w / 2, y + (e === 2 ? 7 : 10), { alin: 'centro', esc: e, grad: GRAD_CREMA, sombra: K });
}

/* -------------------------------------------------------- otras escenas */
function panel(y, h) {
  g.fillStyle = 'rgba(13,11,16,0.82)'; g.fillRect(0, 0, W, H);
  marcoFilete(g, 18, y, W - 36, h, ESQS, 30);
}
function escenaPausa(t) {
  dibujarPartida(t);
  const y = Math.round(H / 2 - 90);
  panel(y, 180);
  escribir(g, tr('pausa'), W / 2, y + 12, { alin: 'centro', esc: tituloEsc(tr('pausa'), W - 60), grad: GRAD_ORO });
  let yy = y + 44;
  if (boton(40, yy, W - 80, 22, tr('seguir'), { col: F.verde }) || apretada('Escape', 'KeyP')) { escena = 'juego'; return; }
  yy += 28;
  if (boton(40, yy, W - 80, 20, tr('reiniciar'), { col: F.rojo })) { if (G.modo === 'clasico') Guardado.borrar('partida'); empezar(G.modo, G.nivel); return; }
  yy += 26;
  if (boton(40, yy, (W - 86) / 2, 20, tr('musica') + (Sonido.musicaSi ? '' : ' X'), { col: '#5a3a6a' })) Sonido.ponerMusica(!Sonido.musicaSi);
  if (boton(46 + (W - 86) / 2, yy, (W - 86) / 2, 20, tr('sonido') + (Sonido.efectosSi ? '' : ' X'), { col: '#5a3a6a' })) Sonido.ponerEfectos(!Sonido.efectosSi);
  yy += 26;
  if (boton(40, yy, W - 80, 20, tr('menu'), { col: F.azul })) { guardarPartida(); irA(G.modo === 'barrio' ? 'barrios' : 'menu'); }
}
function escenaFin(t) {
  dibujarPartida(t);
  const P = G, y = Math.round(H / 2 - 100);
  panel(y, 200);
  const w = 150; cinta(g, W / 2 - w / 2, y + 10, w, 18, F.rojo, F.rojoOsc);
  escribir(g, P.modo === 'barrio' ? tr('sinLugar') : tr('fin'), W / 2, y + 15, { alin: 'centro', grad: GRAD_CREMA, borde: K });
  if (P.modo === 'barrio') {
    escribir(g, tr('nivel', P.nivel), W / 2, y + 50, { alin: 'centro', esc: 2, grad: GRAD_ORO });
    escribir(g, tr('flores') + ' ' + (P.flores - Math.max(0, P.quedan)) + '/' + P.flores, W / 2, y + 80, { alin: 'centro', grad: GRAD_CREMA, borde: K });
  } else {
    const k = Math.min(1, tEsc / 0.8);
    escribir(g, String(Math.floor(P.puntos * salida(k))), W / 2, y + 44, { alin: 'centro', esc: 4, grad: GRAD_ORO, sombra: F.rojo });
    escribir(g, tr('record') + ' ' + DATOS.record, W / 2, y + 86, { alin: 'centro', grad: GRAD_CREMA, borde: K });
    if (P.nuevo && Math.floor(t * 3) % 2) escribir(g, tr('nuevoRecord'), W / 2, y + 100, { alin: 'centro', grad: GRAD_VERDE, borde: K });
  }
  if (boton(36, y + 122, W - 72, 24, P.modo === 'barrio' ? tr('reintentar') : tr('otra'), { col: F.verde }) || apretada('Enter', 'Space')) { empezar(P.modo, P.nivel); return; }
  if (boton(36, y + 154, W - 72, 20, tr('menu'), { col: F.azul })) irA(P.modo === 'barrio' ? 'barrios' : 'menu');
}
function escenaGano(t) {
  dibujarPartida(t);
  const P = G, y = Math.round(H / 2 - 100);
  panel(y, 200);
  escribir(g, tr('ganaste'), W / 2, y + 12, { alin: 'centro', esc: tituloEsc(tr('ganaste'), W - 60), grad: GRAD_ORO });
  escribir(g, tr('nivelHecho'), W / 2, y + 40, { alin: 'centro', grad: GRAD_CREMA, borde: K });
  for (let s = 0; s < 3; s++) {
    const k = clamp((tEsc - 0.3 - s * 0.3) / 0.3, 0, 1), on = s < P.estrellas && k > 0;
    if (on && !P['e' + s]) { P['e' + s] = true; Sonido.sfx('estrella', 1 + s * 0.12); vibrar(15); }
    const r = 11 * (on ? Math.max(0.05, rebote(k)) : 1);
    estrella(g, W / 2 - 36 + s * 36, y + 80 - (s === 1 ? 6 : 0), on, r);
  }
  if (P.nivel < NIVELES && boton(36, y + 122, W - 72, 24, tr('siguiente'), { col: F.verde })) { empezar('barrio', P.nivel + 1); return; }

/* ------------------------------------------------------------- controles */
let prueba = null;
function escenaControles(t) {
  fondoMenu(t);
  escribir(g, tr('controles'), W / 2, 12, { alin: 'centro', esc: tituloEsc(tr('controles')), grad: GRAD_ORO });
  let y = 42;
  const regla = (txt, k, min, max, paso) => {
    escribir(g, txt, 10, y + 5, { grad: GRAD_CREMA, borde: K });
    if (boton(W - 80, y, 18, 17, '-', { col: '#5a3a6a' })) { CTRL[k] = Math.round(clamp(CTRL[k] - paso, min, max) * 100) / 100; guardarCtrl(); }
    escribir(g, Math.round(CTRL[k] * 100) + '%', W - 43, y + 5, { alin: 'centro', grad: GRAD_ORO, borde: K });
    if (boton(W - 26, y, 18, 17, '+', { col: '#5a3a6a' })) { CTRL[k] = Math.round(clamp(CTRL[k] + paso, min, max) * 100) / 100; guardarCtrl(); }
    y += 22;
  };
  const llave = (txt, k) => {
    escribir(g, txt, 10, y + 5, { grad: GRAD_CREMA, borde: K });
    if (boton(W - 62, y, 54, 17, CTRL[k] ? tr('si') : tr('no'), { col: CTRL[k] ? F.verde : '#5a3a6a' })) { CTRL[k] = !CTRL[k]; guardarCtrl(); if (k === 'vibrar' && CTRL[k]) vibrar(40); }
    y += 22;
  };
  regla(tr('altura'), 'altura', 0, 1.5, 0.25);
  regla(tr('velocidad'), 'velocidad', 1, 2, 0.1);
  regla(tr('bandeja'), 'bandeja', 0.8, 1.3, 0.1);
  llave(tr('guia'), 'guia');
  llave(tr('zurdo'), 'zurdo');
  llave(tr('vibrar'), 'vibrar');
  // la zona de prueba: una pieza para arrastrar y ver cómo queda
  const zy = y + 6, zh = H - zy - 34;
  g.fillStyle = 'rgba(255,207,58,0.06)'; g.fillRect(8, zy, W - 16, zh);
  escribir(g, tr('proba'), W / 2, zy + 4, { alin: 'centro', grad: GRAD.gris, borde: 'no', sinSombra: true });
  const pieza = { f: FORMAS.find((f) => f.n === 4 && f.w === 2), pintura: 3 }, cb = celBandeja(), sx = W / 2, sy = zy + zh - 26;
  if (E.toque && Math.abs(E.toque.x - sx) < 30 && Math.abs(E.toque.y - sy) < 30 && !prueba) { const pt = E.punteros.get(E.toque.id); if (pt) pt.arrastre = true; prueba = { id: E.toque.id, x0: E.toque.x, y0: E.toque.y }; Sonido.sfx('tomar'); }
  if (prueba) {
    const pt = E.punteros.get(prueba.id);
    if (!pt) prueba = null;
    else {
      const fx = prueba.x0 + (pt.x - prueba.x0) * CTRL.velocidad, fy = prueba.y0 + (pt.y - prueba.y0) * CTRL.velocidad;
      const px = fx - pieza.f.w * CEL / 2 + (CTRL.zurdo ? 10 : -10), py = fy - pieza.f.h * CEL - 8 - CTRL.altura * 56;
      dibujarFormaEn(pieza, px, py, CEL);
      disco(g, pt.x, pt.y, 5, 'rgba(255,248,236,0.4)'); disco(g, pt.x, pt.y, 2, F.rojo);
    }
  }
  if (!prueba) dibujarFormaEn(pieza, sx - pieza.f.w * cb / 2, sy - pieza.f.h * cb / 2, cb);
  if (boton(10, H - 26, 90, 20, tr('restablecer'), { col: F.rojo })) { Object.assign(CTRL, CTRL_BASE); guardarCtrl(); }
  if (boton(W - 100, H - 26, 90, 20, tr('listo'), { col: F.verde }) || apretada('Escape')) irA('menu');
}

/* ------------------------------------------------------------------ bucle */
let ultimo = 0;
function cuadro(ts) {
  requestAnimationFrame(cuadro);
  const dt = Math.min(0.05, ultimo ? (ts - ultimo) / 1000 : 1 / 60); ultimo = ts;
  const t = ts / 1000;
  tEsc += dt;
  if (trans) { trans.t += dt; if (!trans.hecho && trans.t >= trans.dur) { trans.hecho = true; trans.alMedio(); } if (trans.t >= trans.dur * 2) trans = null; }
  g.setTransform(RES, 0, 0, RES, 0, 0); g.imageSmoothingEnabled = false;
  try {
    switch (escena) {
      case 'idioma': escenaIdioma(t); break;
      case 'menu': escenaMenu(t); break;
      case 'barrios': Sonido.musica(TEMAS.menu); escenaBarrios(t); break;
      case 'juego': Sonido.musica(G.modo === 'barrio' ? TEMAS.barrio : TEMAS.juego); if (!trans) actualizarPartida(dt); dibujarPartida(t); break;
      case 'pausa': escenaPausa(t); break;
      case 'fin': escenaFin(t); break;
      case 'gano': escenaGano(t); break;
      case 'controles': escenaControles(t); break;
    }
  } catch (e) { console.error(e); }
  if (trans) dibujarTrans(trans.t < trans.dur ? trans.t / trans.dur : 2 - trans.t / trans.dur);
  E.clic = null; E.toque = null; E.suelta = null; E.recien.clear();
}
function arrancar() {
  ajustar();
  Sonido.iniciar();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (escena === 'juego' && G && !G.fin) { escena = 'pausa'; tEsc = 0; } Sonido.pausar(true); } else Sonido.pausar(false); });
  requestAnimationFrame(cuadro);
  window.__filete = { get G() { return G; }, get escena() { return escena; }, empezar, colocar, terminar, irA, tr, DATOS, CTRL, FORMAS };
}
arrancar();

})();
